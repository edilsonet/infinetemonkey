title: 67.47(a)
text: '(a) Os MC, as CLC, os MCad e as entidades conveniadas estão sujeitos a fiscalizações
  da ANAC, por

  meio de seus servidores designados, a fim de verificar o cumprimento de todos os requisitos
  aplicáveis

  deste Regulamento.'
