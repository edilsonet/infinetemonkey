text: '(b) Os MC, as CLC, os MCad e as entidades conveniadas devem facilitar aos servidores
  designados pela

  ANAC o acesso às instalações e/ou documentos por estes solicitados para a fiscalização.

  (Redação dada pela Resolução nº 547, de 19.03.2020)'
