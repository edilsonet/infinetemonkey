subsection_id: a
cite: 67.49(a)
title: 67.49(a)
text: '(a) A suspensão do credenciamento ou do cadastramento de um MC, CLC ou MCad dar-se-á
  a qualquer

  momento, por determinação da ANAC, caso seja evidenciado, em atividades de fiscalização:

  (1) o não cumprimento de qualquer requisito deste Regulamento;

  (2) que o MC, CLC ou MCad deixou de implementar ações corretivas a não-conformidades

  previamente encontradas pela ANAC, em atividades de fiscalização anteriores, e que não tenham
  dado

  origem a uma suspensão, dentro do prazo por ela determinado;

  (3) que o MC, CLC ou MCad deixou de implementar mudanças exigidas pela ANAC, conforme o

  parágrafo 67.45(h) deste Regulamento, dentro do prazo por ela estabelecido; ou

  (4) a falta dos registros requeridos pela seção 67.53.'
