subsection_id: b
cite: 67.49(b)
title: 67.49(b)
text: '(b) A cassação do credenciamento ou do cadastramento de um MC, CLC ou MCad dar-se-á
  a qualquer

  momento, por determinação da ANAC, caso esta evidencie, em atividades de fiscalização:

  (1) não-conformidades ao atendimento dos requisitos deste Regulamento que o MC, CLC ou MCad

  demonstre desinteresse ou incapacidade para sanarem;


  Data da emissão: 29 de setembro de 2021


  (2) fraude nas concessões de CMA ou fraude com o objetivo de fazer parecer haver atendimento
  dos

  requisitos deste Regulamento, sem prejuízo das medidas administrativas e/ou comunicação
  dos fatos ao

  Ministério Público para a tomada das medidas penais cabíveis; ou

  (3) que o MC, CLC ou MCad não sanou as causas que deram origem a uma suspensão de seu

  credenciamento ou cadastramento por período superior a 6 (seis) meses contados a partir
  da data da

  suspensão.'
