title: 67.49(d)
text: '(d) O MC, CLC ou MCad terão seus credenciamentos ou cadastramentos suspensos, a critério
  da ANAC,

  caso permaneçam mais de 6 (seis) meses e menos de 1 (um) ano sem realizar exames de saúde
  periciais.

  (1) Para reativar o credenciamento ou cadastramento, o MC, CLC ou MCad devem atender aos

  requisitos de revalidação previstos na seção 67.43 deste Regulamento.'
