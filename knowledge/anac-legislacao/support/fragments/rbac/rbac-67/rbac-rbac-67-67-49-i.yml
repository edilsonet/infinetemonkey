title: 67.49(i)
text: '(i) O MC ou MCad que tiver o seu credenciamento ou cadastramento cassado por conta
  de evidência de

  fraude só poderá se candidatar novamente a um novo credenciamento ou cadastramento após
  5 (cinco) anos

  contados a partir da data da cassação.'
