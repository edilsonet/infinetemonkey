cite: 67.49(j)
title: 67.49(j)
text: '(j) A CLC que tiver o seu credenciamento cassado por conta de evidência de fraude só
  poderá se

  candidatar novamente a um novo credenciamento caso todas as pessoas envolvidas com a fraude
  sejam

  afastadas das funções administrativas ou dos exames de saúde periciais, ou caso tenham se
  passado mais

  de 5 (cinco) anos contados a partir da data da cassação.'
