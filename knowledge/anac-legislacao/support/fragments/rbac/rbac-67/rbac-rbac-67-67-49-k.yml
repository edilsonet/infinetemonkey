title: 67.49(k)
text: '(k) Caso o credenciamento ou o cadastramento seja revogado por solicitação do MC, CLC
  ou MCad, ou

  cassado pela ANAC, o certificado de credenciamento ou cadastramento deve ser restituído
  à ANAC.

  (Redação dada pela Resolução nº 547, de 19.03.2020)'
