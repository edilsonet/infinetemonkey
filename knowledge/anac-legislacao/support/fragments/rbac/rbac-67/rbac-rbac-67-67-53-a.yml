cite: 67.53(a)
title: 67.53(a)
text: '(a) A CLC deve arquivar registros, dos últimos 5 (cinco) anos, que demonstrem que durante
  todo o

  período de vigência de seu credenciamento a CLC manteve cumprimento contínuo dos requisitos
  dos

  parágrafos 67.39(a)(1)(i), (ii) e (iii); e 67.45 (e), (f) e (g) deste Regulamento; ou que
  a ANAC tenha sido

  notificada e as medidas tomadas aprovadas, em caso de descumprimento temporário. (Redação
  dada pela

  Resolução nº 547, de 19.03.2020)


  Data da emissão: 29 de setembro de 2021'
