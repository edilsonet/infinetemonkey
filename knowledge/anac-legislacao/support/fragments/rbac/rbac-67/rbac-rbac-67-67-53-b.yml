cite: 67.53(b)
title: 67.53(b)
text: '(b) O MC e o MCad devem arquivar seus registros pessoais dos últimos 5 (cinco) anos
  que demonstrem

  que durante todo o período de vigência de seu credenciamento ou cadastramento o MC ou o
  MCad manteve

  cumprimento contínuo dos requisitos dos parágrafos 67.45(e) e (f) deste Regulamento, ou
  que a ANAC

  tenha sido notificada e as medidas tomadas aprovadas, em caso de descumprimento temporário.
  (Redação

  dada pela Resolução nº 547, de 19.03.2020)'
