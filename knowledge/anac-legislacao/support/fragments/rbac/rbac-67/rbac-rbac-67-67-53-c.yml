section_title: Requisitos de registros
subsection_id: c
cite: 67.53(c)
title: 67.53(c)
text: '(c) Para efeito de cumprimento deste Regulamento, o examinador e a ANAC devem manter
  os registros

  dos exames de saúde periciais, tanto os que sejam por eles realizados quanto a parte realizada
  por outros

  profissionais de saúde e que subsidiem o julgamento, de cada candidato, por pelo menos 5
  anos, sem

  prejuízo de cumprimento de outras legislações aplicáveis que possam requerer tempo maior
  de manutenção

  dos registros.'
