title: 67.53(d)
text: '(d) Para efeito de cumprimento do parágrafo (c) desta seção, não são suficientes registros
  provenientes

  de profissionais de saúde com simples pareceres favoráveis ou desfavoráveis ao candidato
  e sem evidências

  que demonstrem que o exame tenha sido realizado e que cada requisito psicofísico aplicável
  deste

  Regulamento tenha sido investigado e exigido do candidato.'
