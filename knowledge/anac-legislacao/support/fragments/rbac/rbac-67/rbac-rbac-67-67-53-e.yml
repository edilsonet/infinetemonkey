text: '(e) Ao candidato deve ser garantido o direito de obter, dentro do prazo estabelecido
  pelo parágrafo (c)

  desta seção, às suas expensas, caso queira, cópias simples ou autenticadas dos registros
  de seus exames de

  saúde periciais.'
