section_title: Isenções para a CLC
subsection_id: a
cite: 67.55(a)
title: 67.55(a)
text: '(a) Caso deixe de ter um dos profissionais de saúde aceitos pela ANAC, o DTM poderá
  basear o seu

  julgamento em pareceres de outro profissional de saúde não vinculado à CLC. As seguintes
  disposições se

  aplicam:

  (1) o DTM deve considerar somente pareceres de médicos especialistas com RQE junto ao CRM;

  (2) o período máximo para a aplicação do disposto no parágrafo (a) desta seção é de 30 (trinta)
  dias;

  (3) a isenção concedida por esta seção só poderá ser aplicada à falta de um profissional
  de saúde

  vinculado por vez. Se faltarem 2 (dois) ou mais profissionais de saúde vinculados ao mesmo
  tempo, a CLC

  deverá suspender os exames de saúde periciais de 1ª classe até que haja no máximo 1 (um)
  profissional de

  saúde a que se possa aplicar as disposições do parágrafo (a) desta seção; e

  (4) se o médico vinculado que faltar for o DTM, a CLC deve suspender os exames de saúde
  periciais

  até que outro DTM seja indicado e seu nome aprovado pela ANAC.

  (Redação dada pela Resolução nº 547, de 19.03.2020)'
