title: 67.57(a)
text: '(a) A ANAC poderá firmar convênios com entidades públicas que, de acordo com este Regulamento
  e

  nos termos do convênio assinado entre as partes, poderão:

  (1) exercer atribuições da ANAC;

  (2) exercer atribuições semelhantes às CLC; e


  Data da emissão: 29 de setembro de 2021


  (3) emitir pareceres ou julgamentos para fins de exame de saúde pericial inicial ou de revalidação
  de

  qualquer classe.'
