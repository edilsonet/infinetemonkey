title: 67.57(b)
text: '(b) As entidades conveniadas, quando realizarem exames de saúde periciais, devem cumprir
  os requisitos

  deste Regulamento aplicáveis aos MC ou CLC, assim como devem cumprir os termos do convênio
  que for

  assinado.'
