title: 67.57(c)
text: '(c) As entidades conveniadas devem se submeter a atividades de fiscalização a serem
  realizadas pela

  ANAC, de acordo com a seção 67.47 deste Regulamento, sob pena de denúncia do convênio por
  parte da

  ANAC. (Redação dada pela Resolução nº 547, de 19.03.2020)'
