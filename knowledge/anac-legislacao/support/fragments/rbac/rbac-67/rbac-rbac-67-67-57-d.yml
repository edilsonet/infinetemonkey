title: 67.57(d)
text: '(d) Caso a ANAC identifique, em atividades de fiscalização, não conformidades em relação
  ao

  cumprimento dos requisitos deste Regulamento e/ou em relação ao cumprimento dos termos do
  convênio,

  a ANAC poderá suspender ou denunciar unilateralmente o convênio. (Redação dada pela Resolução
  nº 547,

  de 19.03.2020)'
