cite: 67.71(d)
title: 67.71(d)
text: '(d) O candidato deve dar ciência ao examinador ou à ANAC sobre qualquer problema com
  sua aptidão

  psicofísica que seja de seu conhecimento, uso de medicamentos, ou se já teve ocorrência
  de negação,

  suspensão ou cassação de CMA em outros exames de saúde periciais prévios, seja no Brasil,
  seja no

  estrangeiro.'
