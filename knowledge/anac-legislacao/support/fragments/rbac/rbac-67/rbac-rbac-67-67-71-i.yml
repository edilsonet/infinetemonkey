cite: 67.71(i)
title: 67.71(i)
text: '(i) Devem ser solicitados, minimamente, os seguintes exames:

  (1) glicemia em jejum e, nos casos limítrofes, hemoglobina glicada;

  (2) colesterol total e frações;

  (3) triglicerídeos;

  (4) creatinina; (Redação dada pela Resolução nº 547, de 19.03.2020)

  (5) hemograma completo;

  (6) urina tipo I (EAS);

  (7) dosagem de Beta-HCG para candidatas do sexo feminino;

  (8) tipagem sanguínea e fator RH, nos exames de saúde periciais iniciais;


  Data da emissão: 29 de setembro de 2021


  (9) ácido úrico. (Incluído pela Resolução nº 547, de 19.03.2020)'
