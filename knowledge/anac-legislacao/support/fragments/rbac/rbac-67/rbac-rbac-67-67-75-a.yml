title: 67.75(a)
text: '(a) O candidato não pode sofrer de nenhum transtorno que possa levar ao aumento da
  probabilidade de

  não aptidão repentina, seja para operar uma aeronave com segurança ou para executar com
  segurança

  tarefas a ele designadas.'
