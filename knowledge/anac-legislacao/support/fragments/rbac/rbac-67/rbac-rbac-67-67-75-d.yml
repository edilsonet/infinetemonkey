title: 67.75(d)
text: '(d) Os transtornos mentais e comportamentais apresentados no parágrafo (b) desta seção
  devem ser

  definidos conforme as descrições clínicas e orientações nosológicas da Organização Mundial
  de Saúde, tal

  como consta na Classificação Estatística Internacional de Doenças e Problemas Relacionados
  à Saúde,

  Décima Revisão - OMS de 1992, ou mais recente.'
