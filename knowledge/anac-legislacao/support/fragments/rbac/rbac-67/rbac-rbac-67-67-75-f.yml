text: '(f) Os testes psicológicos podem ser aplicados individual ou coletivamente, a critério
  do psicólogo, e o

  laudo deve, no mínimo, conter parecer sobre a personalidade, a atenção, a memória e o raciocínio
  do

  candidato.'
