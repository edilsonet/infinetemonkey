cite: 67.77(a)
title: 67.77(a)
text: '(a) O candidato não pode ter antecedentes ou diagnóstico clínico de:

  (1) hemiplegia ou hemiparesia;

  (2) doença vascular de natureza autoimune, com envolvimento do sistema nervoso central;

  (3) enfermidade progressiva ou não progressiva do sistema nervoso, cujos efeitos, a critério
  do

  examinador ou da ANAC, provavelmente interfiram no exercício seguro das funções a bordo
  de aeronaves;

  (4) epilepsia;

  (5) eletroencefalograma (EEG):'
