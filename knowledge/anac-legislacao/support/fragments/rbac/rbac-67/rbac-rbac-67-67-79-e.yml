title: 67.79(e)
text: '(e) O objetivo de utilizar periodicamente os exames do parágrafo (d)(3) desta seção
  é descobrir

  anomalias e não pode representar, por si só, evidência suficiente para um julgamento de
  não aptidão em um

  exame de saúde pericial, sem que tenha havido outras investigações cardiovasculares. (Redação
  dada pela

  Resolução nº 547, de 19.03.2020)'
