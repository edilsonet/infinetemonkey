cite: 67.81(a)
title: 67.81(a)
text: '(a) O candidato não pode ter diagnóstico clínico de:


  Data da emissão: 29 de setembro de 2021


  (1) afecção bronco pulmonar aguda, nenhuma enfermidade ativa na estrutura dos pulmões, do

  mediastino ou da pleura que, a critério do examinador ou da ANAC, provavelmente afete a
  segurança de

  voo;

  (2) doença pulmonar crônica, a menos que a doença tenha sido objeto de investigação e avaliação
  em

  conformidade com as melhores práticas médicas e que o examinador ou a ANAC considerem, a
  seu critério,

  que não seja provável que a doença afete a segurança de voo;

  (3) asma;

  (4) tuberculose ou outra infecção pulmonar ativa. Caso o candidato possua lesões inativas
  ou

  cicatrizadas, ele pode ser considerado apto;

  (5) evidências de hipertensão pulmonar;

  (6) pneumotórax não resolvido, enfermidades bolhosas e outras que, a critério do examinador
  ou da

  ANAC, afetem a distensibilidade pulmonar e a função respiratória; e(Redação dada pela Resolução
  nº 547,

  de 19.03.2020)

  (7) neoplasia de tórax.'
