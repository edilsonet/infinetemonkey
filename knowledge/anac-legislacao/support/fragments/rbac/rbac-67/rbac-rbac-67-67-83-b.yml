cite: 67.83(b)
title: 67.83(b)
text: '(b) Todo candidato que tenha sofrido uma cirurgia importante nos condutos biliares
  ou no conduto

  digestivo ou seus anexos, com remoção total ou desvio de fluxo em qualquer desses órgãos,
  deve ser julgado

  não apto, a menos que, a critério do examinador ou da ANAC, não seja provável que suas consequências

  causem incapacitação em voo.'
