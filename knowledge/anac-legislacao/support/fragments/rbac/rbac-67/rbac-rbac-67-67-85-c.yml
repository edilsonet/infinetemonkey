section_title: Requisitos metabólicos, nutricionais e endocrinológicos
subsection_id: c
cite: 67.85(c)
title: 67.85(c)
text: '(c) O candidato que sofra de diabetes melito não tratada com insulina pode ser considerado
  apto, a

  critério do examinador ou da ANAC, desde que comprove que seu estado metabólico possa controlar-se
  de

  maneira satisfatória somente com dieta, ou dieta combinada com ingestão por via oral de
  medicamentos

  antidiabéticos, cujo uso seja compatível com o exercício seguro das atribuições do tripulante
  em voo.'
