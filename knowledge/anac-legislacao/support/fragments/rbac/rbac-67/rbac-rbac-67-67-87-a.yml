cite: 67.87(a)
title: 67.87(a)
text: '(a) O candidato não pode sofrer de enfermidades sanguíneas ou do sistema linfático
  detectadas por

  exames laboratoriais específicos, a menos que a condição do solicitante tenha sido objeto
  de investigação

  adequada e que, a critério da ANAC, não seja provável que a enfermidade afete a segurança
  de voo. Entre

  essas enfermidades, mas não se limitando a elas, deve-se considerar: (Redação dada pela
  Resolução nº 547,

  de 19.03.2020)

  (1) anemias de qualquer natureza;

  (2) doença mieloproliferativa, mielofibrótica e tumores linfáticos;

  (3) esplenomegalia; e

  (4) alterações do sistema de coagulação.'
