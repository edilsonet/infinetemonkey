cite: 67.89(a)
title: 67.89(a)
text: '(a) O candidato que sofra de enfermidade renal ou genitourinária deve ser julgado não
  apto, a menos

  que uma investigação adequada que inclua um exame de urina revele que não exista insuficiência
  renal ou

  que, a critério da ANAC, não seja provável que seu estado de saúde afete a segurança de
  voo.'
