cite: 67.93(b)
title: 67.93(b)
text: '(b) A candidata ou tripulante deve informar ao examinador ou à ANAC da ocorrência de
  sua gravidez,

  como requer o parágrafo 67.15(c) deste Regulamento, a fim de que estes possam providenciar
  a suspensão

  de seu CMA, caso este esteja ainda válido e, enquanto isso não for feito, ela deve deixar
  imediatamente de

  cumprir as atribuições de sua licença aeronáutica que requeiram um CMA válido.'
