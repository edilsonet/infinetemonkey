cite: 67.97(b)
title: 67.97(b)
text: '(b) O candidato não pode ser portador de patologia das membranas timpânicas que, a
  critério do

  examinador ou da ANAC, possam afetar a segurança de voo. Uma perfuração simples e seca da
  membrana

  timpânica não implica julgamento de não aptidão, desde que o candidato cumpra com os requisitos

  auditivos da seção 67.101 deste Regulamento.'
