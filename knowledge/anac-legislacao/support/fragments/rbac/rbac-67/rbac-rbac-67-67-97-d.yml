title: 67.97(d)
text: '(d) O candidato não pode ser portador de transtornos permanentes dos aparelhos vestibulares.
  O

  candidato ou tripulante que possuir um transtorno passageiro deve ser considerado não apto
  até a condição

  ser restabelecida.'
