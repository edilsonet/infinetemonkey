cite: 67.97(e)
title: 67.97(e)
text: '(e) O candidato deve possuir ambos os condutos nasais de modo a permitir a livre passagem
  do ar. Não

  pode existir nenhuma deformidade grave, nem afecção aguda ou crônica da cavidade bucal,
  nem das vias

  aéreas superiores. Não pode existir patologia aguda ou crônica grave das cavidades paranasais
  (seios da

  face). O candidato que possuir disfunção maxilofacial, disartria, tartamudez, ou quaisquer
  outros defeitos

  de articulação da palavra que sejam suficientemente graves para dificultar a comunicação
  oral, deve ser

  julgado não apto. (Redação dada pela Resolução nº 547, de 19.03.2020)'
