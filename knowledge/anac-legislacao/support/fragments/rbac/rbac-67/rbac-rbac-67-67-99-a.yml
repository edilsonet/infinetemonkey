title: 67.99(a)
text: '(a) O funcionamento dos olhos e de seus anexos deve ser normal. Não pode existir condição
  patológica,

  aguda ou crônica, em nenhum dos dois olhos ou anexos, que possa impedir sua função correta
  a um grau

  tal que, a critério do examinador ou da ANAC, afete a segurança de voo.'
