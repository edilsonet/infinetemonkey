title: 67.99(d)
text: '(d) O candidato portador de correção óptica deve apresentá-la (e sua reserva) ao examinador
  ou à ANAC

  por ocasião do exame de saúde pericial, ou quando desempenhando as atribuições de sua licença
  e

  habilitação aeronáutica, ao servidor designado pela ANAC, caso seja solicitado. (Redação
  dada pela

  Resolução nº 547, de 19.03.2020)'
