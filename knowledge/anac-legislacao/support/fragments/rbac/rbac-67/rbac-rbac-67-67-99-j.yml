title: 67.99(j)
text: '(j) O candidato cuja acuidade visual para longe sem correção em qualquer dos dois olhos
  for menor que

  20/200 (ainda que se atinja a acuidade binocular de 20/20 com correção), deve providenciar
  um relatório


  Data da emissão: 29 de setembro de 2021


  oftalmológico completo e apresentá-lo no exame de saúde pericial inicial e, posteriormente,
  a cada 5 anos,

  nos futuros exames de saúde periciais de revalidação.'
