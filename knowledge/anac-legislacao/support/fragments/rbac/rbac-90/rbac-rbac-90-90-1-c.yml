title: 90.1(c)
text: (c) A condução de serviços aéreos públicos, inclusos os serviços aéreos especializados
  ou de táxi-aéreo, mesmo quando imprescindíveis ao exercício das atribuições dos órgãos e
  entes públicos, é realizada por provedores de serviço de aviação civil autorizados pela
  ANAC e deve observar normas próprias, sendo vedadas operações nos moldes deste Regulamento.
