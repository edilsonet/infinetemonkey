title: 90.101(a)
text: '(a) O sistema de manuais da UAP deverá ser composto pelas seguintes publicações:

  (1) MOP, segundo a subparte I deste Regulamento;

  (2) programa de treinamento;

  (3) SOP, segundo a subparte J deste Regulamento;

  (4) MGSO, segundo a subparte K deste Regulamento;

  (5) MEL, se aplicável, nos termos da seção 90.87 deste Regulamento; e

  (6) outros manuais e publicações a critério da UAP.'
