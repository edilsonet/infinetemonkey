cite: 90.101(b)
title: 90.101(b)
text: '(b) Cada publicação do sistema de manuais estabelecido no parágrafo (a) desta seção
  deverá:

  (1) ser aprovada pelo gestor da UAP;

  (2) ser aprovada pela ANAC, somente para as publicações de programa de treinamento e MEL;

  (3) estabelecer os procedimentos para revisão, distribuição e controle;

  (4) estar atualizada com o AFM ou AOM;

  (5) estar à disposição de todo o pessoal de solo e de voo envolvido da UAP;

  (6) ser clara, objetiva e coesa;

  (7) compor o programa de treinamento da UAP;

  (8) ser implantada de tal forma que os profissionais envolvidos na operação compreendam
  as razões de cada publicação e para cada procedimento definido pela UAP;

  (9) conter instruções para cumprimento das atribuições da UAP e de seu pessoal; e

  (10) incentivar o processo de revisões por parte do pessoal da UAP.'
