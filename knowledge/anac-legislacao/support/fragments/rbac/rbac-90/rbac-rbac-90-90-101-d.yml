text: (d) Os programas de treinamento e a MEL serão aprovados pela ANAC, respectivamente segundo
  a seção 90.155 e a seção 90.87 deste Regulamento. As demais publicações deverão ser aprovadas
  apenas pelo gestor da UAP.
