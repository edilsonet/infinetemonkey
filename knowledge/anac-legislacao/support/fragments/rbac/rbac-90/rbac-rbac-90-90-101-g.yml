text: (g) As revisões dos manuais previstos no parágrafo (a) desta seção e que requerem aprovação
  da ANAC, em conformidade com este Regulamento, deverão ser encaminhadas à ANAC com pelo
  menos 30 (trinta) dias de antecedência, contados a partir da data de intenção da implantação
  do referido manual.
