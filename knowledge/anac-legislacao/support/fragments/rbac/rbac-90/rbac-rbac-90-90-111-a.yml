cite: 90.111(a)
title: 90.111(a)
text: '(a) O MOP deverá:

  (1) ser um mecanismo de padronização para o alcance do desempenho da segurança operacional
  da UAP;

  (2) ser aprovado pelo gestor da UAP;

  (3) prover instruções detalhadas das atividades da UAP, com orientações relativas à segurança
  operacional;

  (4) ser aplicado com consistência e uniformidade dentro da UAP;

  (5) incentivar o reporte de discrepâncias, melhorias, atualizações, melhores práticas para
  a implantação e revisão desta publicação;

  (6) ser integrado ao SGSO do órgão ou ente público; e

  (7) ser utilizado durante os treinamentos.'
