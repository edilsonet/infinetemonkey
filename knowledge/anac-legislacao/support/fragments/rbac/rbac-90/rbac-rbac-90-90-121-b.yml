text: (b) Conforme atribuição do órgão ou ente público, previsão legal específica, frota,
  modelo de aeronaves, efetivo e área geográfica de atuação, a UAP poderá estabelecer SOP
  complementares para outros profissionais da UAP para manutenção da segurança operacional.
