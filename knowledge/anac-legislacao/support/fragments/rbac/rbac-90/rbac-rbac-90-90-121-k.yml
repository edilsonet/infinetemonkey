title: 90.121(k)
text: '(k) Os

  briefings

  estabelecidos nos SOP deverão estabelecer uma consciência situacional conjunta e unificada
  para os tripulantes e pessoas com função a bordo, criando expectativas e definindo critérios
  e regras para a boa condução do voo. Para tanto, os tripulantes e pessoas com função a bordo
  deverão saber não só como conduzir um

  briefing

  , mas o melhor momento para fazê-lo.'
