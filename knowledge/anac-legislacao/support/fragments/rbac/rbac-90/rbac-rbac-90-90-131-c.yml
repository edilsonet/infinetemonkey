cite: 90.131(c)
title: 90.131(c)
text: '(c) O SGSO do órgão ou ente público deverá:

  (1) ser estabelecido de acordo com a estrutura prevista neste Regulamento;

  (2) ser compatível com o tamanho e a complexidade das operações da UAP;

  (3) ser voltado ao alcance do NADSO;

  (4) desenvolver, implantar e executar o monitoramento com mensuração do desempenho de segurança
  operacional; e

  (5) ser eficiente na identificação e resolução de suas deficiências sistêmicas afetas à
  segurança operacional requerida para a execução das atividades aéreas.'
