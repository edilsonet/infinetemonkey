title: 90.131(g)
text: '(g) Sempre que a ANAC considerar que, para manter a adequabilidade de um SGSO de um
  órgão ou ente público, são necessárias revisões, a UAP deverá, após ser notificado pela
  ANAC, fazer todas as modificações consideradas necessárias dentro do prazo de 30 (trinta)
  dias contados a partir da data de notificação por parte da ANAC. Este prazo poderá ser prorrogável
  por mais 30 (trinta) dias desde que devidamente motivado.

  (1) Caso a ANAC considere que exista algum fator que exija uma ação imediata no interesse
  da segurança operacional, a ANAC poderá, de forma motivada, determinar uma revisão imediata
  do SGSO do órgão ou ente público.'
