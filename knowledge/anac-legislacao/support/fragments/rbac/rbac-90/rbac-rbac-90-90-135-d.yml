title: 90.135(d)
text: '(d) Elemento 1.4 - Coordenação do PRE.

  (1) A UAP deve estabelecer e manter um plano de resposta a acidentes, incidentes e outras
  situações de emergência relacionadas às operações aéreas da UAP.

  (2) A UAP deverá assegurar que seu PRE seja adequadamente coordenado com os planos de resposta
  à emergência das organizações com quem interage durante a execução de suas operações.'
