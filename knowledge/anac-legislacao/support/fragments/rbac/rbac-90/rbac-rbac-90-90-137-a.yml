cite: 90.137(a)
title: 90.137(a)
text: '(a) Elemento 2.1 - Processo de identificação de perigos.

  (1) O órgão ou ente público deverá desenvolver e manter processo de identificação de perigos
  associados às operações aéreas.

  (2) O processo de identificação de perigos deverá ser baseado em uma combinação de métodos
  reativos e proativos a partir de coleta de dados de segurança operacional.'
