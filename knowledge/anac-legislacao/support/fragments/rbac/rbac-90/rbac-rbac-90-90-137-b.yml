title: 90.137(b)
text: '(b) Elemento 2.2 - Processo de avaliação e controle de riscos.

  (1) O órgão ou ente público deverá desenvolver e manter um processo que assegure a análise,
  a avaliação e o controle dos riscos à segurança operacional associados aos perigos identificados.'
