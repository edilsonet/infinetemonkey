cite: 90.139(b)
title: 90.139(b)
text: '(b) Elemento 3.2 - Processo de gerenciamento de mudanças.

  (1) A UAP deve desenvolver e manter um processo para identificar alterações que podem afetar
  o nível de risco à segurança operacional de seus produtos ou serviços e para identificar
  e gerenciar os riscos à segurança operacional que podem surgir a partir dessas mudanças.'
