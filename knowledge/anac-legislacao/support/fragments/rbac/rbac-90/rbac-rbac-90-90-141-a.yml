cite: 90.141(a)
title: 90.141(a)
text: '(a) Elemento 4.1 - Treinamento e qualificação.

  (1) A UAP deve desenvolver e manter um programa de treinamento de segurança operacional
  que assegure que seus funcionários sejam treinados e competentes para exercer as suas funções
  dentro do SGSO.

  (2) O escopo do programa de treinamento de segurança operacional deve ser apropriado à participação
  de cada indivíduo dentro do SGSO.'
