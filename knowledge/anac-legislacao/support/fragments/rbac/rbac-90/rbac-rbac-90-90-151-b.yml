cite: 90.151(b)
title: 90.151(b)
text: '(b) Cada órgão ou ente público, por meio da referida UAP, deverá:

  (1) elaborar e implantar um programa de treinamento, segundo este Regulamento, para o desempenho
  de funções na UAP e outras disposições afins;

  (2) obter aprovação inicial e final dos treinamentos que requerem a referida aprovação,
  nos termos definidos por este Regulamento;

  (3) prover os recursos humanos, materiais e financeiros adequados para a realização dos
  treinamentos previstos neste Regulamento; e

  (4) dispor do número de instrutores adequado, segundo o programa de treinamento da UAP.'
