cite: 90.151(c)
title: 90.151(c)
text: '(c) O instrutor designado para ministrar os treinamentos estabelecidos neste Regulamento
  é o responsável por registrar, em formulário próprio, que o aluno alcançou a proficiência
  mínima requerida no programa de treinamento.

  (1) O formulário devidamente assinado pelo instrutor deverá ser arquivado na pasta de registro
  individual do aluno na UAP.

  (2) Caso a UAP opte por arquivamento digital, este procedimento deverá certificar que o
  instrutor seja o responsável pelas informações lançadas.'
