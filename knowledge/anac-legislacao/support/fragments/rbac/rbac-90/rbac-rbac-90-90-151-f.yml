title: 90.151(f)
text: (f) A UAP deve adotar metodologias de ensino e de avaliação que estimulem a iniciativa
  dos alunos, bem como organizar os conteúdos, as metodologias e as formas de avaliação de
  tal modo que ao final do treinamento o aluno demonstre os conhecimentos e as habilidades
  psicomotoras complexas requeridas ao exercício da função.
