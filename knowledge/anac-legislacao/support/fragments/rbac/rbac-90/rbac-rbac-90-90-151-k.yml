title: 90.151(k)
text: '(k) Os treinamentos requeridos com vistas à concessão das licenças de PPA/H, PCA/H
  e PLA/H devem cumprir com os requisitos estabelecidos em regulamentos próprios e poderão
  compor o programa de treinamento da UAP.

  (1) Os treinamentos previstos neste parágrafo poderão ser realizados por aeronaves civis
  públicas e registradas segundo a seção 90.81 deste Regulamento.'
