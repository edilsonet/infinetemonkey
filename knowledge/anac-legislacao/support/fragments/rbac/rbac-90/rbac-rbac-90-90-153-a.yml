cite: 90.153(a)
title: 90.153(a)
text: '(a) Além das UAP, as seguintes entidades estão aptas a realizar os treinamentos, exames
  teóricos e práticos previstos neste Regulamento:

  (1) CTAC certificados conforme o RBAC nº 142;

  (2) CIAC certificados conforme o RBAC nº 141;

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (3) o fabricante da aeronave;

  (4) a UAP internacional; ou

  (5) as Forças Armadas ou autoridade de investigação SIPAER.'
