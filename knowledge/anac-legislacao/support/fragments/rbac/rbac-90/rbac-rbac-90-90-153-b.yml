cite: 90.153(b)
title: 90.153(b)
text: '(b) A UAP poderá utilizar como instrutores de solo e de voo militares das Forças Armadas
  ou pilotos em comando com comprovada experiência e qualificados nos termos do RBAC nº 61
  caso tenha adquirido um novo modelo de aeronave ou inclua uma nova operação.

  (1) O prazo de que trata o parágrafo (b) desta seção não poderá exceder 6 (seis) meses para
  instrutores estrangeiros, contados a partir da data de início do referido treinamento.'
