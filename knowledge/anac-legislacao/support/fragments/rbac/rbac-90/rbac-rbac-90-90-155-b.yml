section_title: Aprovação inicial, final e revisões
subsection_id: b
cite: 90.155(b)
title: 90.155(b)
text: (b) Se o programa de treinamento ou a revisão proposta atender a esta subparte, a ANAC
  concederá, por escrito, uma aprovação inicial autorizando a UAP a conduzir o treinamento
  segundo o programa aprovado. Após uma avaliação da eficiência do programa, a ANAC informará
  à UAP das deficiências, se houver, que devem ser corrigidas.
