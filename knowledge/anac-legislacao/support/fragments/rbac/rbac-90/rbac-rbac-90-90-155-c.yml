cite: 90.155(c)
title: 90.155(c)
text: (c) A ANAC concederá a aprovação final do programa ou revisão proposta se a UAP demonstrar
  que o treinamento, conduzido conforme o programa aprovado pelo parágrafo (b) desta seção,
  garante que cada pessoa que o completar satisfatoriamente está adequadamente treinada para
  desempenhar suas atribuições.
