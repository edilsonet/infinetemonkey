section_title: Aprovação inicial, final e revisões
subsection_id: d
cite: 90.155(d)
title: 90.155(d)
text: (d) Sempre que a ANAC considerar que, para manter a adequabilidade de um programa de
  treinamento já com aprovação final são necessárias revisões no programa, a UAP deve, após
  ser notificada pela ANAC, fazer todas as modificações consideradas necessárias. Dentro do
  prazo de 30 dias após receber a notificação da ANAC, a UAP pode submeter pedido de reconsideração
  e, nesse caso, a entrada em vigor das modificações ficará pendente de decisão final da ANAC.
  Entretanto, se a ANAC considerar que existe uma emergência requerendo ação urgente no interesse
  da segurança, ela pode determinar uma revisão com efetividade imediata.
