cite: 90.157(c)
title: 90.157(c)
text: '(c) Cada currículo deverá conter:

  (1) as instruções de solo, de voo e exercícios práticos, conforme aplicável;

  (2) FSTD e/ou similares, em especial, FFS, PCATD, ATD, GFS, VIPT, SIT, “

  mockups

  ”, treinadores de sistemas e procedimentos, aeronaves e/ou outros auxílios, conforme aplicável;

  (3) a descrição das manobras e dos procedimentos normais, anormais e de emergência, que
  serão executados em cada fase da instrução de voo; e

  (4) os critérios de avaliação de aprendizagem.'
