section_title: Currículo de solo na modalidade de EAD
subsection_id: d
cite: 90.159(d)
title: 90.159(d)
text: (d) O currículo de solo EAD não deverá ser uma mera transposição do curso presencial,
  pois o EAD possui características, linguagem e formato próprios, exigindo administração,
  estrutura, lógica, acompanhamento, avaliação, recursos técnicos, tecnológicos e pedagógicos
  condizentes com este formato.
