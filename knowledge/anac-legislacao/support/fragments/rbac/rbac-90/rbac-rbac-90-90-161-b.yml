section_title: Programas de treinamento em FSTD
subsection_id: b
cite: 90.161(b)
title: 90.161(b)
text: '(b) Os FSTD, previstos no parágrafo (a) desta seção e incluídos nos programas de treinamento
  da UAP, deverão estar qualificados pela ANAC.

  (1) A ANAC poderá autorizar a utilização de FSTD pertencente ao fabricante de aeronave,
  centros de treinamento ou empresa aérea estrangeira, desde que o treinamento da aeronave
  esteja aprovado pela autoridade de aviação civil do país certificador do FSTD.

  (2) Os demais dispositivos de treinamento poderão ser utilizados apenas para complementar
  o referido treinamento, a critério da UAP.'
