cite: 90.161(d)
title: 90.161(d)
text: '(d) O uso do FSTD previsto no parágrafo (a) desta seção deverá ser compatível com o
  relatório de avaliação operacional ou com os OSD do modelo de aeronave publicados pela ANAC.

  (1) Na ausência do relatório de avaliação operacional ou de OSD da ANAC, considera-se aquele
  publicado por outra autoridade de aviação civil.

  (2) Na ausência do relatório de avaliação operacional ou de OSD publicado por autoridade
  de aviação civil, deve-se cumprir com o programa de treinamento do fabricante da aeronave
  ou centro de treinamento certificado por autoridade de aviação civil nacional ou internacional.'
