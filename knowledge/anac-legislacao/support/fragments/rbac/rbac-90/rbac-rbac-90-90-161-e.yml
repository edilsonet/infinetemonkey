cite: 90.161(e)
title: 90.161(e)
text: '(e) A utilização de FSTD estabelecida no parágrafo (a) desta seção será compulsória
  se:

  (1) o relatório de avaliação operacional, os OSD, o fabricante ou o centro de treinamento
  certificado por autoridade de aviação civil, segundo o parágrafo (d) desta seção, estabelecer
  o uso do FSTD como única ferramenta de treinamento para o referido modelo da aeronave; ou

  (2) no decorrer de uma das fases de aprovação final do programa de treinamento da UAP for
  constatado risco inaceitável à execução de alguma manobra e esteja devidamente justificado
  em processo administrativo.'
