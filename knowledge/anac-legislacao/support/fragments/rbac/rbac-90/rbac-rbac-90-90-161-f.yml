cite: 90.161(f)
title: 90.161(f)
text: (f) O treinamento realizado em FSTD publicado como única ferramenta de simulação, segundo
  o parágrafo (e)(1) desta seção, deverá ser realizado, no mínimo, a cada 12 (doze) meses,
  observados os demais prazos de tolerância estabelecidos na seção 90.179 deste Regulamento.
