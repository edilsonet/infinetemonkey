cite: 90.161(g)
title: 90.161(g)
text: '(g) Caso constatado risco inaceitável à execução de alguma manobra durante a fase de
  aprovação final do programa de treinamento, nos termos do parágrafo (e)(2) desta seção,
  a utilização de FSTD deverá atender aos seguintes critérios:

  (1) o primeiro treinamento no modelo da aeronave deverá ser realizado em FSTD ou de forma
  concomitante com o treinamento na própria aeronave;

  (2) o treinamento periódico deverá ser realizado, no mínimo, a cada 12 (doze) meses em FSTD
  ou, a critério da UAP, com alternância entre o treinamento realizado em FSTD e o treinamento
  realizado na própria aeronave, observados os demais prazos de tolerância estabelecidos na
  seção 90.179 deste Regulamento; e

  (3) a UAP deverá estabelecer, no programa de treinamento, quais serão as manobras que deverão
  ser realizadas em aeronave e quais deverão ser realizadas nos FSTD. As manobras descritas
  no parágrafo (e)(2) deverão ser conduzidas, compulsoriamente, somente em FSTD.'
