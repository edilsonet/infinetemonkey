section_title: 'Treinamento inicial: requisitos gerais'
subsection_id: a
cite: 90.171(a)
title: 90.171(a)
text: '(a) O treinamento inicial será composto pelas seguintes etapas:

  (1) currículo de solo, segundo a seção 90.173 deste Regulamento;

  (2) currículo de voo, segundo a seção 90.175 deste Regulamento;

  (3) currículo de exercício prático de emergências gerais, segundo a seção 90.177 deste Regulamento;
  e

  (4) exame de proficiência técnica da ANAC, segundo a seção 90.203 deste Regulamento.'
