section_title: 'Treinamento inicial: currículo de solo'
subsection_id: a
cite: 90.173(a)
title: 90.173(a)
text: '(a) O currículo de solo do treinamento inicial deve ser constituído pelos seguintes
  componentes curriculares:

  (1) doutrinamento básico da UAP, segundo o parágrafo (b) desta seção;

  (2) conhecimento teórico da aeronave (

  ground school

  ), segundo o parágrafo (c) desta seção;

  (3) conhecimentos gerais, segundo o parágrafo (d) desta seção;

  (4) CRM ou SRM, conforme aplicável e segundo o parágrafo (e) desta seção;

  (5) os SOP da UAP, segundo o parágrafo (f) desta seção; e

  (6) conhecimento para operações aéreas acima do FL250 ou com velocidades superiores ao número
  de Mach 0.75, se aplicável, segundo o parágrafo (g) desta seção.'
