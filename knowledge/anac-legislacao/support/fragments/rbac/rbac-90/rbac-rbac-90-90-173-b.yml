cite: 90.173(b)
title: 90.173(b)
text: '(b) O componente curricular doutrinamento básico da UAP deverá conter:

  (1) as atribuições e responsabilidades do piloto;

  (2) o previsto no MOP da UAP;

  (3) o uso da MEL, se aplicável;

  (4) os procedimentos da UAP para liberação e localização de voos;

  (5) os procedimentos para transporte aéreo de artigos perigosos;

  (6) os procedimentos para identificação de perigos e gerenciamento de risco;

  (7) o uso de EPI; e

  (8) os procedimentos para exercício das atribuições específicas do órgão ou ente público.'
