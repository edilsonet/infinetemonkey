title: 90.173(c)
text: '(c) O componente curricular de conhecimento teórico da aeronave (

  ground school

  ) deverá conter, no mínimo:

  (1) o conteúdo e carga horária estabelecidas no relatório de avaliação operacional, nos
  OSD, pelo fabricante ou equivalentes, nos termos do parágrafo 90.151(d) e subparte L deste
  Regulamento.'
