cite: 90.173(d)
title: 90.173(d)
text: '(d) O componente curricular de conhecimentos gerais deverá conter:

  (1) os procedimentos para se evitar e para realizar recuperação de IIMC;

  (2) o estudo das ocorrências aeronáuticas pertinentes às operações da UAP;

  (3) as notas de segurança, revisões temporárias dos manuais ou correspondente, expedidos
  pelo fabricante da aeronave, autoridade de aviação civil ou órgão de investigação de ocorrências
  aeronáuticas;

  (4) os procedimentos para recuperação de atitudes anormais e para evitar a perda de controle
  em voo;

  (5) as condições climáticas e características geográficas da área de atuação da UAP;

  (6) os conceitos teóricos de emergências gerais para realização do exercício prático requerido
  na seção 90.177 deste Regulamento;

  (7) os procedimentos para operação em tempestades, ar turbulento, gelo, granizo, nevoeiro,
  poeira, fumaça, vento forte, maresia,

  windshear

  e outras condições meteorológicas de risco, conforme aplicável;

  (8) os critérios para sobrevoos em presídios e penitenciárias, conforme aplicável;

  (9) os critérios para sobrevoo em aéreas de preservação ambiental, unidades de conservação
  ou similares, bem como os procedimentos para atenuação de ruídos;

  (10) os critérios especiais estabelecidos pelo órgão de controle de tráfego aéreo e fraseologia;

  (11) os regulamentos de aviação civil, normas do Departamento de Controle do Espaço Aéreo
  (DECEA) e acordos operacionais, conforme aplicável;

  (12) a navegação e o uso de facilidades para auxílio à navegação, incluindo procedimentos
  de aproximação por instrumentos, conforme aplicável;

  (13) as instruções de solo para operações RVSM ou PBN, conforme aplicável;

  (14) os princípios básicos da automação (conceito, uso, confiabilidade, nível de automação,
  gerenciamento da automação, fatores operacionais e humanos que afetam o uso correto da automação,
  etc.), conforme aplicável;

  (15) o conceito e/ou os procedimentos de prevenção para, conforme aplicável:'
