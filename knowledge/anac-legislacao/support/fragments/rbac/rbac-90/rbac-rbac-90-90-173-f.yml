text: (f) O componente curricular de SOP da UAP deverá conter a rotina operacional padronizada
  de solo e de voo da UAP, para condições normais, anormais e de emergências, com os deveres
  e atribuições para cada função desempenhada a bordo para cada modelo de aeronave.
