title: 90.175(a)
text: (a) O currículo de voo do treinamento inicial será composto por instruções de voo, no
  modelo de aeronave, na função de piloto em comando ou piloto segundo em comando, segundo
  a subparte L deste Regulamento e em observância aos SOP da UAP.
