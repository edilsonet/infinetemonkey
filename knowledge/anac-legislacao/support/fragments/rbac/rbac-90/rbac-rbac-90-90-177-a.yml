section_title: 'Treinamento inicial: currículo de exercício prático em emergências gerais'
subsection_id: a
cite: 90.177(a)
title: 90.177(a)
text: '(a) O currículo de exercício prático em emergências gerais será constituído pelas instruções
  simuladas de, conforme aplicável:

  (1) procedimentos para recuperação de IIMC;

  (2) evacuação de emergência;

  (3) extinção de fogo e controle de fumaça;

  (4) operação e uso das saídas de emergência;

  (5) abertura e uso das escorregadeiras de evacuação;

  (6) pouso e evacuação de emergência na água em UTEPAS;

  (7) sobrevivência na selva, mar, etc.;

  (8) uso dos botes salva-vidas da aeronave e de cordas de salvamento;

  (9) uso dos coletes salva-vidas e outros equipamentos de flutuação;

  (10) uso do oxigênio para tripulantes, outras pessoas com função a bordo e passageiros;

  (11) situações apresentadas na seção de emergências do AFM ou AOM; e

  (12) outras condições, a critério da UAP.

  TREINAMENTO PERIÓDICO - PILOTOS'
