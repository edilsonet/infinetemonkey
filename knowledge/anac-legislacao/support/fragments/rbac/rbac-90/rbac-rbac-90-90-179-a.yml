title: 90.179(a)
text: '(a) O treinamento periódico será composto pelas seguintes etapas:

  (1) currículo de solo, segundo a seção 90.181 deste Regulamento; e

  (2) currículo de voo, segundo a seção 90.183 deste Regulamento.'
