section_title: 'Treinamento periódico: requisitos gerais'
subsection_id: b
cite: 90.179(b)
title: 90.179(b)
text: '(b) O currículo de solo do treinamento periódico, previsto na seção 90.181 deste Regulamento,
  deverá ser realizado a cada:

  (1) 24 (vinte e quatro) meses, para os componentes curriculares conhecimento teórico da
  aeronave (

  ground school

  ) e SOP, previstos nos parágrafos 90.181(a)(1) e (a)(4) deste Regulamento, respectivamente;
  e

  (2) 36 (trinta e seis) meses para os demais componentes curriculares previstos na seção
  90.181 deste Regulamento.'
