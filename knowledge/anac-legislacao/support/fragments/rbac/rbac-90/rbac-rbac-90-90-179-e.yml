text: (e) A ANAC poderá prorrogar os prazos dos parágrafos (b) e (c) desta seção por até 8
  (oito) meses, desde que devidamente justificado. Vencido esse prazo, o piloto deverá realizar
  todo o treinamento inicial, previsto na seção 90.171 deste Regulamento.
