section_title: 'Treinamento periódico: currículo de solo'
subsection_id: a
cite: 90.181(a)
title: 90.181(a)
text: '(a) O currículo de solo do treinamento periódico será constituído pelos seguintes componentes
  curriculares:

  (1) conhecimento teórico da aeronave (

  ground school

  );

  (2) conhecimentos gerais, segundo a seção 90.157 e o parágrafo 90.173(d) deste Regulamento;

  (3) CRM ou SRM, segundo a seção 90.157 e o parágrafo 90.173(e) deste Regulamento;

  (4) os SOP da UAP, segundo a seção 90.157 e o parágrafo 90.173(f) deste Regulamento; e

  (5) o componente curricular conhecimento para operações aéreas acima do FL250 ou com velocidades
  superiores ao número mach 0.75, segundo a seção 90.157 e o parágrafo 90.173(g) deste Regulamento,
  se aplicável.'
