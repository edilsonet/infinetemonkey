title: 90.185(a)
text: '(a) O treinamento de elevação de nível, na função de piloto em comando será composto
  pelas seguintes etapas:

  (1) currículo de solo, segundo a seção 90.187 deste Regulamento; e

  (2) currículo de voo, segundo a seção 90.189 deste Regulamento.'
