cite: 90.187(a)
title: 90.187(a)
text: '(a) O currículo de solo do treinamento de elevação de nível será constituído dos componentes
  curriculares:

  (1) conhecimento teórico da aeronave (

  ground school

  );

  (2) CRM ou SRM, segundo a seção 90.157 e o parágrafo 90.173(e) deste Regulamento; e

  (3) os SOP da UAP, segundo a seção 90.157 e o parágrafo 90.173(f) deste Regulamento.'
