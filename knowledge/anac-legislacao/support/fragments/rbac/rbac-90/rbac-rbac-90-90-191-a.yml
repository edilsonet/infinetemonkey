text: '(a) O treinamento de transição, na mesma função a bordo, será composto pelas seguintes
  etapas:

  (1) currículo de solo, segundo a seção 90.193 deste Regulamento; e

  (2) currículo de voo, segundo a seção 90.195 deste Regulamento.'
