text: '(a) O currículo de solo do treinamento de transição será constituído pelos componentes
  curriculares:

  (1) conhecimento teórico da aeronave (

  ground school

  ); e

  (2) os SOP da UAP, segundo a seção 90.157 e o parágrafo 90.173(f) deste Regulamento.'
