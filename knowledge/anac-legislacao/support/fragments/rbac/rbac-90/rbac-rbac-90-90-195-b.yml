section_title: 'Treinamento de transição entre modelos: currículo de voo'
subsection_id: b
cite: 90.195(b)
title: 90.195(b)
text: '(b) O currículo de voo do treinamento de transição deverá conter, no mínimo, o conteúdo
  e a carga horária estabelecidos no relatório de avaliação operacional, nos OSD, pelo fabricante
  ou equivalentes, nos termos do parágrafo 90.151(d) deste Regulamento.

  (1) Na ausência do previsto neste parágrafo (b), a UAP deverá definir a ementa curricular
  e a carga horária mínima para cada lição/missão da instrução, observado o ambiente operacional
  da UAP e o nível de tolerabilidade do risco à segurança operacional.'
