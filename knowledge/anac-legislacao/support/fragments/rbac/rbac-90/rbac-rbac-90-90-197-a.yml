cite: 90.197(a)
title: 90.197(a)
text: (a) O currículo de solo e/ou de voo do treinamento de diferenças deverá conter, no mínimo,
  o conteúdo e a carga horária estabelecidos pelo relatório de avaliação operacional, pelos
  OSD, pelo fabricante ou equivalentes, nos termos do parágrafo 90.151(d) deste Regulamento.
