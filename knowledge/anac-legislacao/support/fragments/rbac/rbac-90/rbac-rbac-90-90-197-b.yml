text: '(b) As instruções estabelecidas para o treinamento de diferenças poderão ser realizadas
  concomitantemente com os currículos dos treinamentos inicial, periódico, elevação de nível
  e/ou de transição, previstos nas seções 90.171, 90.179, 90.185 e 90.191 deste Regulamento,
  respectivamente.

  TREINAMENTO DE AMBIENTAÇÃO ENTRE UNIDADES AÉREAS PÚBLICAS - UAP (PILOTOS)'
