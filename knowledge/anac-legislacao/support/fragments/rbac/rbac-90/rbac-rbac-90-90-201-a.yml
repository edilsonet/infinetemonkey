section_title: Experiência operacional sob supervisão para piloto em comando
subsection_id: a
cite: 90.201(a)
title: 90.201(a)
text: (a) A experiência operacional consiste em voos, no cumprimento das missões do órgão
  ou ente público, nos quais o piloto estará sob supervisão de um instrutor de voo da UAP,
  com vistas à consolidação das habilidades e conhecimentos para o exercício da função de
  piloto em comando na UAP.
