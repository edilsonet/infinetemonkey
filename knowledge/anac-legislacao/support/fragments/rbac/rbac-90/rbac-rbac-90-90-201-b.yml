cite: 90.201(b)
title: 90.201(b)
text: (b) A UAP deverá definir os componentes curriculares e a carga horária mínima de experiência
  operacional para cada modelo de aeronave e ambiente operacional específico do órgão ou ente
  público, observado o nível de tolerabilidade do risco à segurança operacional.
