title: 90.201(c)
text: (c) Após a conclusão da experiência operacional, o piloto sob supervisão deverá ser
  submetido à avaliação da UAP, que irá deliberar sobre a proficiência requerida para o exercício
  da função de piloto em comando nas operações aéreas da UAP.
