section_title: Experiência operacional sob supervisão para piloto em comando
subsection_id: d
cite: 90.201(d)
title: 90.201(d)
text: '(d) A experiência operacional deverá ser realizada após a realização do:

  (1) treinamento inicial para piloto em comando, segundo a seção 90.171 deste Regulamento;

  (2) treinamento de elevação de nível, segundo a seção 90.185 deste Regulamento; ou

  (3) treinamento de transição de piloto em comando, segundo a seção 90.191 deste Regulamento.'
