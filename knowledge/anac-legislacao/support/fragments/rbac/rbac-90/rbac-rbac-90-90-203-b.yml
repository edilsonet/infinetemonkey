cite: 90.203(b)
title: 90.203(b)
text: (b) O exame de proficiência da ANAC deverá ser conduzido por função a bordo e em cada
  modelo de aeronave, por servidor designado ou examinador credenciado pela ANAC, em conformidade
  com a regulamentação específica da ANAC.
