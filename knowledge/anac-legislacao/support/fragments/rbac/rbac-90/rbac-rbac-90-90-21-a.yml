cite: 90.21(a)
title: 90.21(a)
text: '(a) Para os efeitos deste Regulamento:

  (1)

  tripulação mínima:

  tripulação definida no certificado de aeronavegabilidade da aeronave; e

  (2)

  tripulação operacional:

  tripulação mínima acrescida do pessoal requerido para a realização das operações especiais
  de aviação pública.

  Nota

  : operadores aerotáticos e de suporte médico, embora componham a tripulação operacional,
  não são membros da tripulação (tripulantes), conforme definido na seção 90.3.'
