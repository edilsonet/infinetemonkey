cite: 90.21(b)
title: 90.21(b)
text: '(b) Exceto como previsto nos parágrafos (c), (d), (e), (h) e (i) desta seção, a tripulação
  operacional para helicópteros deverá ser composta por, no mínimo:

  (1) um piloto em comando, segundo a seção 90.23 deste Regulamento;

  (2) um piloto segundo em comando, segundo a seção 90.25 deste Regulamento; e

  (3) um operador aerotático ou operador de suporte médico, segundo a seção 90.31 e 90.43
  deste Regulamento, respectivamente.'
