cite: 90.21(d)
title: 90.21(d)
text: (d) A tripulação operacional de helicópteros nas operações aéreas de carga externa,
  onde as limitações de desempenho da aeronave puderem comprometer o nível de segurança operacional,
  deverá ser composta por, no mínimo, um piloto em comando, segundo a seção 90.23 deste Regulamento.
