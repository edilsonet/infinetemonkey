section_title: Requisitos gerais para tripulação
subsection_id: e
cite: 90.21(e)
title: 90.21(e)
text: (e) Exceto como previsto nos parágrafos (c), (d), (h) e (i) desta seção, a tripulação
  operacional para helicópteros monomotores a pistão onde as limitações de desempenho do helicóptero
  puderem comprometer o nível de tolerabilidade de risco, deverá ser composta por, no mínimo
  um piloto em comando, segundo a seção 90.23 deste Regulamento.
