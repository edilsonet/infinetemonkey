cite: 90.21(f)
title: 90.21(f)
text: '(f) Exceto como previsto nos parágrafos (g), (h) e (i) desta seção, a tripulação operacional
  para aviões deverá ser composta por, no mínimo:

  (1) um piloto em comando, segundo a seção 90.23 deste Regulamento;

  (2) um piloto segundo em comando, segundo a seção 90.25 deste Regulamento;

  (3) um operador aerotático ou operador de suporte médico, segundo as seções 90.31 e 90.43
  deste Regulamento, se aplicável; e

  (4) o número de comissários de voo, segundo o RBAC nº 91, conforme aplicável.

  (Redação dada pela Resolução nº 695, de 09.11.2022)'
