section_title: Requisitos gerais para tripulação
subsection_id: g
cite: 90.21(g)
title: 90.21(g)
text: (g) Não obstante o previsto na legislação complementar do Ministério da Saúde, a tripulação
  operacional para aviões com configurações aeromédica ou de combate a incêndios certificadas
  pela ANAC e com restrição na cabine de pilotagem para atuação do piloto segundo em comando,
  deverá ser composta por, no mínimo, um piloto em comando, segundo a seção 90.23 deste Regulamento.
