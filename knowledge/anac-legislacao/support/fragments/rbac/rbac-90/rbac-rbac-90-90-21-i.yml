section_title: Requisitos gerais para tripulação
subsection_id: i
cite: 90.21(i)
title: 90.21(i)
text: '(i) As seguintes operações são regidas sob o RBAC nº 91, de forma que os requisitos
  de tripulação devem observar o previsto naquele Regulamento:

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (1) voos de treinamento;

  (2) voos de manutenção;

  (3) exames de proficiência ou voos de observação realizados pela ANAC;

  (4) transporte de dignitários de acordo com o parágrafo 90.5(c) deste Regulamento. No caso
  de transporte de dignitários de acordo com o RBAC nº 90, também podem ser utilizados os
  requisitos de tripulação do RBAC nº 91, desde que os procedimentos de segurança para embarque
  e desembarque estejam previstos no MOP da UAP; ou

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (5) outras operações enquadradas no parágrafo 90.1(b) deste Regulamento.'
