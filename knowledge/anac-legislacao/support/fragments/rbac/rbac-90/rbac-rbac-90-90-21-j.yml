cite: 90.21(j)
title: 90.21(j)
text: (j) O piloto em comando poderá autorizar o desembarque do operador aerotático ou do
  operador de suporte médico para atuar no cenário da missão pública, desde que os riscos
  atrelados a este procedimento sejam mitigados e o procedimento esteja previsto no MOP e
  no SOP da UAP.
