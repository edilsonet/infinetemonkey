cite: 90.21(k)
title: 90.21(k)
text: '(k) Em situações excepcionais, piloto em comando poderá autorizar o desembarque do
  piloto segundo em comando para atuar no cenário da missão pública, desde que:

  (1) conste no C.A. da aeronave a previsão de tripulação mínima de apenas um piloto (

  single pilot

  );

  (2) os riscos sejam mitigados; e

  (3) o procedimento esteja previsto no MOP e SOP da UAP.'
