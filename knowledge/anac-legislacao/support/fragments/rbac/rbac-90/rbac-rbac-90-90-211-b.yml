title: 90.211(b)
text: '(b) Para exercer a mesma função em outra UAP, o operador aerotático deverá realizar
  o treinamento de ambientação, a critério da nova UAP.

  (1) O treinamento de ambientação para operador aerotático terá por base o comparativo entre
  os componentes curriculares dos programas de treinamento das UAP envolvidas.'
