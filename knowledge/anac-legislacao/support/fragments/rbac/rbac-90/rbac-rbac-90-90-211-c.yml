title: 90.211(c)
text: '(c) O treinamento inicial para operadores aerotáticos será composto pelas seguintes
  etapas:

  (1) currículo de solo, segundo o parágrafo (d) desta seção;

  (2) currículo de exercício prático, segundo o parágrafo (e) desta seção; e

  (3) avaliação teórica e/ou prática da UAP, segundo esta subparte.'
