cite: 90.211(d)
title: 90.211(d)
text: '(d) O currículo de solo do treinamento inicial será constituído de, no mínimo, os seguintes
  componentes curriculares:

  (1) fisiologia de voo;

  (2) atribuições e responsabilidades do operador aerotático;

  (3) legislação e/ou regulamentação aplicável à função, incluído este Regulamento;

  (4) o MOP da UAP;

  (5) SGSO, incluindo gerenciamento do risco e identificação dos perigos;

  (6) os SOP da UAP;

  (7) procedimentos para cabine estéril (

  sterile cockpit procedures

  );

  (8) uso apropriado do

  checklist

  ;

  (9) cenários onde a vigilância deve ser intensificada;

  (10) CRM;

  (11) procedimentos para transporte aéreo de artigos perigosos;

  (12) procedimento para transporte, porte e uso de armas e munições embarcadas, se aplicável;

  (13) uso de EPI;

  (14) cuidados especiais para embarque e desembarque de passageiros, enfermos, objetos, animais,
  presos, etc., conforme aplicável;

  (15) procedimentos para uso dos cintos de segurança e outros acessórios de amarração;

  (16) estudo das ocorrências aeronáuticas pertinentes às operações da UAP;

  (17) características e particularidades de cada modelo de aeronave utilizado pela UAP;

  (18) conceitos básicos de desempenho da aeronave, incluindo peso e balanceamento;

  (19) critérios de segurança dentro e ao redor da aeronave;

  (20) procedimentos de pré-voo das aeronaves;

  (21) procedimentos para reabastecimento da aeronave;

  (22) procedimentos para uso de EPU;

  (23) procedimentos para guarda e segurança da aeronave;

  (24) procedimentos para segurança da aeronave durante o procedimento de acionamento do motor;

  (25) procedimentos e cuidados especiais para pouso em área não cadastrada ou em aeródromo
  com restrição a pouso ou decolagem;

  (26) procedimento para transporte, porte e uso de armas e munições embarcadas, se aplicável;

  (27) uso de equipamentos operacionais embarcados, tais como equipamentos táticos e de resgate,
  conforme aplicável;

  (28) riscos associados a objetos soltos na cabine;

  (29) procedimentos para evitar colisão com fio;

  (30) procedimentos de emergência, incluindo fogo;

  (31) procedimentos para comunicação em condições de emergência;

  (32) evacuação de emergência;

  (33) localização e uso dos equipamentos de emergência/sobrevivência das aeronaves;

  (34) procedimentos para corte dos motores da aeronave, caso ocorra incapacitação do piloto
  em comando e do piloto segundo em comando;

  (35) procedimentos para uso do ELT, caso ocorra incapacitação do piloto em comando e do
  piloto segundo em comando;

  (36) procedimentos para evitar o FOD;

  (37) características geográficas e meteorologia;

  (38) noções básicas de navegação aérea;

  (39) sobrevivência na selva e/ou mar, conforme aplicável;

  (40) uso de colete salva-vidas e outros equipamentos, conforme aplicável;

  (41) o treinamento em NVIS previsto na seção 90.265 deste Regulamento, se aplicável;

  (42) táticas específicas da operação, tais como: rapel, guincho, tiro embarcado,

  McGuire

  , puçá,

  fast rope

  , resgate, etc., conforme aplicável;

  (43)

  briefing

  ao passageiro; e

  (44) outras condições, a critério da UAP.'
