cite: 90.211(g)
title: 90.211(g)
text: '(g) A avaliação teórica e/ou prática para operador aerotático da UAP deverá:

  (1) ser realizada no modelo de aeronave em que serão desempenhadas as operações aéreas da
  UAP;

  (2) ser realizada no formato definido pela UAP; e

  (3) ser registrada em formulário próprio e arquivado na pasta individual do operador aerotático.'
