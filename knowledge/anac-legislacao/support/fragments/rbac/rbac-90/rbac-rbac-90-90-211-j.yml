text: '(j) O treinamento periódico de operador aerotático deverá ser realizado com frequência
  definida pela UAP, não podendo ultrapassar o intervalo de 36 (trinta e seis) meses.

  SUBPARTE O

  TREINAMENTO PARA OPERADOR DE SUPORTE MÉDICO'
