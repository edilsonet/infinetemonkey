title: 90.221(b)
text: '(b) Para exercício da função de operador de suporte médico em outra UAP, o agente deverá
  realizar o treinamento de ambientação, a critério da nova UAP.

  (1) O treinamento de ambientação para operador de suporte médico terá por base o comparativo
  entre os componentes curriculares dos programas de treinamento das UAP envolvidas.'
