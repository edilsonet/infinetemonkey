title: 90.221(d)
text: '(d) O currículo de solo do treinamento inicial será constituído de, no mínimo, os seguintes
  componentes curriculares:

  (1) fisiologia de voo;

  (2) atribuições e responsabilidades do operador de suporte médico;

  (3) legislação e/ou regulamentação aplicável à função, incluído este Regulamento;

  (4) o previsto no MOP da UAP;

  (5) SGSO, incluindo gerenciamento do risco e identificação dos perigos;

  (6) os SOP da UAP;

  (7) procedimentos para cabine estéril (

  sterile cockpit procedures

  );

  (8) uso apropriado do

  checklist

  ;

  (9) cenários onde a vigilância deverá ser intensificada;

  (10) CRM;

  (11) procedimentos para transporte aéreo de artigos perigosos;

  (12) uso de EPI;

  (13) cuidados especiais para embarque e desembarque de pacientes, objetos, animais, conforme
  aplicável;

  (14) procedimentos para uso dos cintos de segurança e outros acessórios de amarração;

  (15) estudo das ocorrências aeronáuticas pertinentes às operações da UAP;

  (16) características e particularidades de cada modelo de aeronave utilizado pela UAP;

  (17) conceitos básicos de desempenho da aeronave, incluindo peso e balanceamento;

  (18) critérios de segurança dentro e ao redor da aeronave;

  (19) procedimentos de pré-voo das aeronaves;

  (20) procedimentos para reabastecimento da aeronave;

  (21) procedimentos para guarda e segurança da aeronave;

  (22) procedimentos para segurança da aeronave durante o acionamento do motor;

  (23) procedimentos e cuidados especiais para pouso em área não cadastrada ou em aeródromo
  com restrição a pouso ou decolagem;

  (24) uso dos equipamentos médicos embarcados;

  (25) procedimentos para higienização da aeronave;

  (26) riscos associados a objetos soltos na cabine;

  (27) patógenos transmitidos pelo sangue, controle de risco biológico e infecção, incluindo
  prevenção e controle de doenças infecciosas;

  (28) procedimentos para evitar colisão com fio;

  (29) procedimentos de emergência, incluindo fogo;

  (30) procedimentos para comunicação em condições de emergência;

  (31) evacuação de emergência;

  (32) localização e uso dos equipamentos de emergência/sobrevivência das aeronaves;

  (33) procedimentos para corte dos motores da aeronave, caso ocorra incapacitação do piloto
  em comando e do piloto segundo em comando;

  (34) procedimentos para uso do ELT, caso ocorra incapacitação do piloto em comando e do
  piloto segundo em comando;

  (35) procedimentos para evitar o FOD;

  (36) características geográficas e meteorologia;

  (37) noções básicas de navegação aérea;

  (38) sobrevivência na selva e/ou mar, conforme aplicável;

  (39) uso de colete salva-vidas e outros equipamentos, conforme aplicável;

  (40) cumprir com o treinamento previsto na subparte R deste Regulamento, se aplicável;

  (41) táticas específicas da operação, tais como rapel, guincho,

  McGuire

  , etc., conforme aplicável;

  (42)

  briefing

  ao passageiro; e

  (43) outras condições, a critério da UAP.'
