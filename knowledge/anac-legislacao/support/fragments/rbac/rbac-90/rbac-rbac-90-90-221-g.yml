cite: 90.221(g)
title: 90.221(g)
text: '(g) A avaliação teórica e/ou prática para operador de suporte médico da UAP deverá:

  (1) ser realizada no modelo de aeronave na qual serão desempenhadas as operações aéreas
  da UAP;

  (2) ser realizada no formato definido pela UAP; e

  (3) ser registrada em formulário próprio e arquivado na pasta individual do operador de
  suporte médico.'
