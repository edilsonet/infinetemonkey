text: '(j) O treinamento periódico de operador de suporte médico deverá ser realizado com
  frequência definida pela UAP, não podendo ultrapassar o intervalo de 36 (trinta e seis)
  meses.

  SUBPARTE P

  TREINAMENTO PARA COMISSÁRIO DE VOO'
