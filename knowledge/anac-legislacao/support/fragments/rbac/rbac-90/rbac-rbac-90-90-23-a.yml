section_title: Requisitos para exercício da função de piloto em comando
subsection_id: a
cite: 90.23(a)
title: 90.23(a)
text: '(a) São requisitos mínimos para exercício da função de piloto em comando na UAP:

  (1) ser agente público segundo a UAP;

  (2) ser detentor da licença de PCA/H;

  (3) ter concluído, na função de piloto em comando, o treinamento inicial, periódico, elevação
  de nível ou de transição, previstos neste Regulamento;

  (4) ser detentor da habilitação de categoria, tipo e/ou classe válida, segundo o RBAC nº
  61;

  (5) estar com o CMA de 1ª Classe válido, segundo o RBAC nº 67;

  (6) possuir 500 (quinhentas) horas de voo totais na categoria da aeronave em que irá exercer
  a respectiva função ou 300 (trezentas) horas de voo totais no caso de avião monomotor a
  pistão sob VFR;

  (7) possuir a experiência mínima (número de horas de voo) em operações especiais de aviação
  pública, conforme estabelecido pela UAP no MOP;

  (8) ter concluído a experiência operacional sob supervisão para piloto em comando, segundo
  a seção 90.201 deste Regulamento;

  (9) para aeronave multimotora, possuir a experiência mínima (número de horas de voo) em
  cada modelo de aeronave multimotora, conforme estabelecido pela UAP no MOP; e

  (10) cumprir com os requisitos para exercício da função de piloto em comando estabelecidos
  pelo fabricante da aeronave, pelo relatório de avaliação operacional ou pelos OSD publicados
  pela ANAC ou por autoridade de aviação civil, se assim definido.'
