section_title: Requisitos para exercício da função de piloto em comando
subsection_id: c
cite: 90.23(c)
title: 90.23(c)
text: '(c) Para operações aéreas IFR, o piloto em comando deverá:

  (1) cumprir com os requisitos previstos nos parágrafos (a) e (b) desta seção;

  (2) ser detentor da habilitação relativa à operação IFR na categoria da aeronave que irá
  tripular, segundo o RBAC nº 61;

  (3) possuir a experiência em voo por instrumentos (número de horas de voo IFR) na categoria
  da aeronave que irá tripular ou em FSTD qualificado pela ANAC, conforme estabelecido pela
  UAP no MOP.'
