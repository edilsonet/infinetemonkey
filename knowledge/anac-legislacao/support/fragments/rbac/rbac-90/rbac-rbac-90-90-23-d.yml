cite: 90.23(d)
title: 90.23(d)
text: '(d) Para operações aéreas com NVIS, o piloto em comando deverá:

  (1) cumprir com os requisitos previstos nos parágrafos (a) e (b) desta seção;

  (2) ter concluído, na função de piloto em comando, o treinamento de NVIS estabelecido pela
  seção 90.265 deste Regulamento;

  (3) possuir 20 (vinte) horas de voo noturnas, na função de piloto em comando;

  (4) possuir 50 (cinquenta) horas de voo no modelo da aeronave em que irá realizar operação
  NVIS;

  (5) possuir 10 (dez) horas de voo em operação NVIS; e

  (6) comprovar experiência recente mínima, nos últimos 3 (três) meses que antecedem a operação
  NVIS, incluindo:'
