section_title: Requisitos para exercício da função de piloto em comando
subsection_id: e
cite: 90.23(e)
title: 90.23(e)
text: '(e) Para as operações aéreas de combate a incêndios, o piloto em comando deverá:

  (1) cumprir com os requisitos previstos no parágrafo (a) desta seção; e

  (2) ter concluído o treinamento de combate a incêndios na categoria da aeronave que irá
  tripular segundo o programa de treinamento estabelecido pela UAP, ou ser detentor da habilitação
  PAGA/H em consonância com o RBAC nº 61.'
