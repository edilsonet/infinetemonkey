cite: 90.23(f)
title: 90.23(f)
text: '(f) Para as operações aéreas de helicóptero com carga externa, o piloto em comando
  deverá:

  (1) cumprir com os requisitos previstos no parágrafo (a) desta seção;

  (2) ter concluído o treinamento de carga externa, segundo a seção 90.387 deste Regulamento;

  (3) ter realizado, de forma proficiente e dentro de um período mínimo definido pela UAP,
  operações de rapel,

  fast rope

  , guincho, puçá e/ou

  McGuire

  para manutenção do nível de desempenho de segurança operacional; e

  (4) cumprir com outros procedimentos e treinamentos a critério da UAP.'
