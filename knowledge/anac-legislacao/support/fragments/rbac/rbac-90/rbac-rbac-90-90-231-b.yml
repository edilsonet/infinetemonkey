title: 90.231(b)
text: '(b) Para exercer a função de comissário de voo em outra UAP, o agente público deverá
  realizar o treinamento de ambientação, a critério da nova UAP.

  (1) O treinamento de ambientação para comissário de voo terá por base o comparativo entre
  os componentes curriculares dos programas de treinamento das UAP envolvidas.'
