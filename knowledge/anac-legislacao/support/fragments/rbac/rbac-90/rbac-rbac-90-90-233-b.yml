cite: 90.233(b)
title: 90.233(b)
text: '(b) O currículo de solo do treinamento inicial será constituído dos componentes curriculares:

  (1) fisiologia de voo;

  (2) atribuições e responsabilidades do comissário de voo;

  (3) atribuições e responsabilidades do piloto em comando;

  (4) legislação e/ou regulamentação aplicável à função, incluído este Regulamento;

  (5) conhecimento teórico da aeronave (

  ground school

  );

  (6) o previsto no MOP da UAP;

  (7) SGSO, incluindo gerenciamento do risco e identificação dos perigos;

  (8) os SOP da UAP;

  (9)

  briefing

  ao passageiro;

  (10) procedimentos para segurança dos passageiros que requerem cuidados especiais, tais
  como enfermos, incapazes, etc.;

  (11) procedimentos especiais e de segurança para transporte de presos;

  (12) procedimentos para cabine estéril (

  sterile cockpit procedures

  );

  (13) uso apropriado do

  checklist

  ;

  (14) cenários onde a vigilância deve ser intensificada;

  (15) CRM;

  (16) procedimentos para transporte aéreo de artigos perigosos;

  (17) uso de EPI;

  (18) orientação e controle dos passageiros;

  (19) cuidados especiais para embarque e desembarque de passageiros, enfermos, objetos e
  animais, conforme aplicável;

  (20) procedimentos para uso dos cintos de segurança e outros acessórios de amarração;

  (21) estudo das ocorrências aeronáuticas pertinentes às operações da UAP;

  (22) características e particularidades de cada modelo de aeronave empregado pela UAP;

  (23) conceitos básicos de desempenho da aeronave, incluindo peso e balanceamento;

  (24) critérios de segurança dentro e ao redor da aeronave;

  (25) procedimentos de pré-voo das aeronaves;

  (26) procedimentos para reabastecimento da aeronave;

  (27) procedimentos para uso de EPU;

  (28) procedimentos para guarda e segurança da aeronave;

  (29) procedimentos para segurança da aeronave durante o procedimento de acionamento do motor;

  (30) utilização apropriada dos equipamentos elétricos, das

  galleys

  , controles de condicionamento e de ventilação da cabine dos passageiros;

  (31) procedimento para transporte, porte e uso de armas e munições embarcadas, se aplicável;

  (32) uso de equipamentos operacionais embarcados, tais como equipamentos táticos e de resgate,
  conforme aplicável;

  (33) riscos associados a objetos soltos na cabine;

  (34) procedimentos de emergência, incluindo fogo;

  (35) procedimentos para comunicação em condições de emergência;

  (36) pouso e evacuação de emergência;

  (37) localização e uso dos equipamentos de emergência/sobrevivências das aeronaves;

  (38) procedimentos para evitar o FOD;

  (39) noções básicas de navegação aérea;

  (40) sobrevivência na selva e/ou mar, conforme aplicável;

  (41) uso de colete salva-vidas e outros equipamentos, conforme aplicável;

  (42) outros procedimentos requeridos pelo fabricante da aeronave e/ou pela autoridade primária
  de certificação; e

  (43) outras condições, a critério da UAP.'
