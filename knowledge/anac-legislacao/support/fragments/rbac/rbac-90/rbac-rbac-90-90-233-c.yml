cite: 90.233(c)
title: 90.233(c)
text: '(c) O currículo de exercício prático será constituído de instruções simuladas de:

  (1) evacuação de emergência;

  (2) operação e uso das saídas de emergência;

  (3) abertura e uso das escorregadeiras de evacuação, conforme aplicável;

  (4) primeiros socorros;

  (5) extinção de fogo e controle de fumaça;

  (6) procedimentos para pouso em área não cadastrada ou em aeródromo com restrição a pouso
  ou decolagem, conforme aplicável;

  (7) pouso e evacuação de emergência na água em UTEPAS, conforme aplicável;

  (8) sobrevivência na selva, mar, etc., conforme aplicável;

  (9) uso dos botes salva-vidas da aeronave e de cordas de salvamento, conforme aplicável;

  (10) uso dos coletes salva-vidas e outros equipamentos de flutuação, conforme aplicável;

  (11) uso do oxigênio para tripulantes, outras pessoas com função a bordo e passageiros,
  conforme aplicável;

  (12) outros procedimentos requeridos pelo fabricante da aeronave e/ou pela autoridade primária
  de certificação; e

  (13) outros procedimentos, a critério da UAP.'
