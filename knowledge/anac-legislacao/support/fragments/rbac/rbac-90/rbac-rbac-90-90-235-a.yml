title: 90.235(a)
text: '(a) O treinamento periódico será composto das seguintes etapas:

  (1) currículo de solo, segundo o parágrafo (b) desta seção;

  (2) currículo de exercício prático, segundo o parágrafo (c) desta seção; e

  (3) exame de proficiência técnica da ANAC, segundo a seção 90.203 deste Regulamento.'
