cite: 90.235(b)
title: 90.235(b)
text: '(b) O currículo de solo do treinamento periódico será constituído dos componentes curriculares:

  (1) conhecimento teórico da aeronave (

  ground school

  );

  (2) o previsto no MOP da UAP;

  (3) SGSO, incluindo gerenciamento do risco e identificação dos perigos;

  (4) os SOP da UAP;

  (5) procedimentos para segurança dos passageiros que requerem cuidados especiais;

  (6) procedimentos especiais e de segurança para transporte de presos;

  (7) procedimentos para cabine estéril (

  sterile cockpit procedures

  );

  (8) uso apropriado do

  checklist

  ;

  (9) CRM;

  (10) procedimentos para transporte aéreo de artigos perigosos;

  (11) cuidados especiais para embarque e desembarque de passageiros, enfermos, objetos, animais,
  conforme aplicável;

  (12) procedimentos para uso dos cintos de segurança e outros acessórios de amarração;

  (13) estudo das ocorrências aeronáuticas pertinentes às operações da UAP;

  (14) características e particularidades de cada modelo de aeronave empregado pela UAP;

  (15) procedimento para transporte, porte e uso de armas e munições embarcadas, se aplicável;

  (16) procedimentos de emergência, incluindo fogo;

  (17) procedimentos para comunicação em condições de emergência;

  (18) pouso e evacuação de emergência;

  (19) uso dos equipamentos de emergência/sobrevivências das aeronaves;

  (20) uso de colete salva-vidas e outros equipamentos, conforme aplicável;

  (21) outros procedimentos requeridos pelo fabricante da aeronave e/ou pela autoridade primária
  de certificação; e

  (22) outros procedimentos, a critério da UAP.'
