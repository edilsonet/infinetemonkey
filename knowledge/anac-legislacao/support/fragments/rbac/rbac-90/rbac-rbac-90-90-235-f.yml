cite: 90.235(f)
title: 90.235(f)
text: '(f) O treinamento periódico para comissário de voo deverá ser realizado a cada:

  (1) 24 (vinte e quatro) meses para o currículo de exercício prático, segundo o parágrafo
  (c) desta seção; e

  (2) 36 (trinta e seis) meses para o currículo de solo, segundo o parágrafo (b) desta seção.'
