title: 90.235(g)
text: '(g) O currículo de solo e de exercícios práticos do treinamento periódico para comissários
  de voo deverá conter, no mínimo, a carga horária estabelecida pelo fabricante da aeronave.

  (1) Na ausência do previsto neste parágrafo (g), a UAP deverá definir a ementa curricular
  e a carga horária mínima da instrução, observado o ambiente operacional da UAP e o nível
  de tolerabilidade do risco à segurança operacional.

  SUBPARTE Q

  TREINAMENTO PARA INSTRUTOR'
