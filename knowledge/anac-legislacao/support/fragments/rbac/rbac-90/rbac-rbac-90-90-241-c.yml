section_title: 'Treinamento de instrutor: requisitos gerais'
subsection_id: c
cite: 90.241(c)
title: 90.241(c)
text: '(c) Não obstante o previsto na seção 90.253 deste Regulamento, no tocante ao exame
  de observação de instrutor a cada 24 (vinte e quatro) meses, é facultada à UAP a realização
  do treinamento periódico para instrutores.

  (1) A carga horária, os componentes curriculares e os exercícios práticos do treinamento
  periódico de instrutor deverão ser definidos pela UAP, observado o nível de tolerabilidade
  do risco para exercício da função de instrutor.'
