text: '(f) A ANAC poderá expedir a habilitação relativa à operação de INVA/H, segundo o RBAC
  nº 61, desde que o programa de treinamento da UAP esteja aprovado pela ANAC e contenha os
  componentes curriculares, manobras e carga horária estabelecidos em regramento específico
  da ANAC.

  TREINAMENTO INICIAL DE INSTRUTOR'
