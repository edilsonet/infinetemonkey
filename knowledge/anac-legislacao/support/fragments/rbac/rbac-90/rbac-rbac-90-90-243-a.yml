section_title: 'Treinamento inicial para instrutor: requisitos gerais'
subsection_id: a
cite: 90.243(a)
title: 90.243(a)
text: '(a) O treinamento inicial para instrutor será composto pelas seguintes etapas:

  (1) currículo de solo, segundo a seção 90.245 deste Regulamento;

  (2) currículo de voo, segundo a seção 90.247 deste Regulamento; e

  (3) exame de observação para exercício da função de instrutor, segundo a seção 90.253 deste
  Regulamento.'
