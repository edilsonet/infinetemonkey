section_title: 'Treinamento inicial para instrutor: currículo de solo'
subsection_id: b
cite: 90.245(b)
title: 90.245(b)
text: '(b) O currículo de solo do treinamento inicial para instrutor deverá ser constituído
  dos seguintes componentes curriculares:

  (1) as atribuições e responsabilidades do instrutor;

  (2) os princípios fundamentais do processo ensino-aprendizagem;

  (3) o processo de ensino-aprendizagem dos indivíduos;

  (4) os métodos e processo de ensino;

  (5) a filosofia de treinamento;

  (6) as técnicas aplicadas à instrução;

  (7) a avaliação do aluno;

  (8) o desenvolvimento do programa de treinamento;

  (9) o desempenho e limitações humanas relacionadas à instrução em voo;

  (10) os perigos associados a falhas e/ou mau funcionamento dos sistemas durante as instruções
  de voo realizadas em aeronave;

  (11) o registro e controle documental dos treinamentos;

  (12) as metas e objetivos;

  (13) o plano de aula;

  (14) o programa de treinamento da UAP;

  (15) o planejamento do programa de treinamento da UAP;

  (16) a comunicação interpessoal;

  (17) as técnicas de questionamento;

  (18) o auxílio/material instrucional;

  (19) o

  briefing

  e

  debriefing

  ;

  (20) as particularidades instrucionais na cabine de pilotagem;

  (21) as características individuais do aluno;

  (22) as características individuais do instrutor;

  (23) a relação entre instrutor e aluno;

  (24) a avaliação de aprendizagem;

  (25) a gestão de ameaças, riscos e erros durante a instrução;

  (26) os SOP;

  (27) o SGSO aplicado à função de instrutor; e

  (28) os métodos aprovados, rotinas e limitações para a realização dos procedimentos normais,
  anormais e de emergência no modelo de aeronave na qual irá ministrar instrução, conforme
  aplicável.'
