section_title: 'Treinamento inicial para instrutor de voo em aeronave ou em FSTD: currículo
  de voo'
subsection_id: a
cite: 90.247(a)
title: 90.247(a)
text: '(a) O currículo de voo do treinamento inicial será composto por, no mínimo, 10 (dez)
  horas de voo e deve incluir, no mínimo, as seguintes instruções práticas:

  (1) as medidas de segurança para situações de emergência que possam ocorrer durante a instrução;

  (2) os riscos associados a medidas de segurança impróprias ou intempestivas durante a instrução;

  (3) os procedimentos e manobras normais, anormais e de emergências a partir do assento do
  instrutor de voo na cabine de pilotagem, com vistas a assegurar a competência para conduzir
  a referida instrução;

  (4) as habilidades e atitudes específicas para a função de instrutor de voo, especialmente
  na área sobre a qual irá ministrar instrução;

  (5) o CRM e gerenciamento de ameaças e erros;

  (6) a aderência ao programa de treinamento e à padronização de execução das manobras;

  (7) a aderência aos SOP da UAP;

  (8) a instrução de voo noturno, se aplicável;

  (9) a instrução de voo IFR, se aplicável;

  (10) as manobras de voo, táticas e técnicas operacionais empregadas pela UAP em sua missão
  institucional; e

  (11) a instrução de voo NVIS, se aplicável.'
