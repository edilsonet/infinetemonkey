title: 90.247(e)
text: (e) Ao final do treinamento inicial, o instrutor deverá ter alcançado o nível de atuação,
  atribuído para cada manobra, na referida função e no modelo de aeronave no qual irá ministrar
  instrução, antes da realização do exame de observação requerido pela ANAC.
