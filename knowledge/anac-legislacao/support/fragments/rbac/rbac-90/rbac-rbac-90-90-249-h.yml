section_title: Treinamento de transição para instrutor de voo
subsection_id: h
cite: 90.249(h)
title: 90.249(h)
text: (h) Ao final do referido treinamento de transição, o instrutor deverá ter alcançado
  o nível de atuação, atribuído para cada manobra e na referida função de instrutor de voo
  no modelo de aeronave no qual irá ministrar instrução, antes da realização do exame de observação
  requerido pela ANAC.
