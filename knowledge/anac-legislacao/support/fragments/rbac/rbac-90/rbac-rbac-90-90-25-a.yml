section_title: Requisitos para exercício da função de piloto segundo em comando
subsection_id: a
cite: 90.25(a)
title: 90.25(a)
text: '(a) São requisitos mínimos para exercício da função de piloto segundo em comando em
  aeronaves certificadas com tripulação mínima de 1 (um) piloto (

  single pilot

  ):

  (1) ser agente público, segundo a UAP;

  (2) não obstante o previsto na seção 61.85 do RBAC nº 61, ser detentor da licença de PPA/H
  com, no mínimo, 10 (dez) horas de voo registradas no modelo da aeronave em que irá exercer
  a respectiva função;

  (3) ter concluído, na função de piloto segundo em comando, o treinamento inicial, periódico
  ou de transição, previstos neste Regulamento;

  (4) ser detentor da habilitação de categoria, tipo e/ou classe válida, para aeronave em
  que irá exercer a função;

  (5) estar com o CMA de 1ª Classe válido, segundo o RBAC nº 67; e

  (6) cumprir com os requisitos para exercício da função de piloto segundo em comando estabelecidos
  pelo fabricante da aeronave, pelo relatório de avaliação operacional ou OSD publicados pela
  ANAC ou por autoridade de aviação civil, se aplicável.'
