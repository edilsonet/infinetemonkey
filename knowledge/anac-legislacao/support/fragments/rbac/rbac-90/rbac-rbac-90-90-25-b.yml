section_title: Requisitos para exercício da função de piloto segundo em comando
subsection_id: b
cite: 90.25(b)
title: 90.25(b)
text: '(b) Para operações aéreas noturnas, sob VFR noturno, o piloto segundo em comando deverá:

  (1) cumprir com os requisitos previstos no parágrafo (a) desta seção;

  (2) possuir experiência em voo noturno (número de horas noturnas), na função de piloto segundo
  em comando, no modelo da aeronave em que irá tripular, conforme estabelecido pela UAP no
  MOP;

  (3) possuir a experiência em voo por instrumentos (número de horas de voo IFR) na categoria
  da aeronave que irá tripular ou em FSTD qualificado pela ANAC, conforme estabelecido pela
  UAP no MOP; e

  (4) ser detentor da habilitação IFRA/H, emitida segundo o RBAC nº 61, para operações realizadas
  fora dos limites da ATZ, CTR ou TMA, incluindo as projeções dos seus limites laterais, ou
  ainda, na inexistência desses espaços aéreos, para operações realizadas fora de um raio
  de 50 km (27 NM) do aeródromo de decolagem.'
