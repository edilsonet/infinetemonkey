section_title: Requisitos para exercício da função de piloto segundo em comando
subsection_id: c
cite: 90.25(c)
title: 90.25(c)
text: '(c) Para operações aéreas IFR, o piloto segundo em comando deverá:

  (1) cumprir com os requisitos previstos nos parágrafos (a) e (b) desta seção;

  (2) ser detentor da habilitação relativa à operação de IFR na categoria da aeronave que
  irá tripular, segundo o RBAC nº 61; e

  (3) possuir a experiência mínima de voos por instrumentos (horas de voo IFR), no modelo
  da aeronave em que irá voar, conforme estabelecido pela UAP no MOP.'
