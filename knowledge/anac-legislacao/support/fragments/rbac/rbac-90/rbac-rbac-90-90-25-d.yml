section_title: Requisitos para exercício da função de piloto segundo em comando
subsection_id: d
cite: 90.25(d)
title: 90.25(d)
text: '(d) Para as aeronaves certificadas com tripulação mínima de 2 (dois) pilotos (

  dual pilot

  ), o piloto segundo em comando deverá:

  (1) ser agente público, segundo a UAP;

  (2) ser detentor da licença de PCA/H;

  (3) ter concluído, na função de piloto segundo em comando, o treinamento inicial, periódico
  ou de transição, previstos neste Regulamento;

  (4) ser detentor da habilitação de categoria, tipo e/ou classe válida, na função de piloto
  segundo em comando ou piloto em comando, segundo o RBAC nº 61;

  (5) estar com o CMA de 1ª Classe válido, segundo o RBAC nº 67; e

  (6) cumprir com o previsto nos parágrafos (b), (c) e (e) desta seção, conforme aplicável.'
