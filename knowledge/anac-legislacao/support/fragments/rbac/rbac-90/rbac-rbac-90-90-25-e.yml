cite: 90.25(e)
title: 90.25(e)
text: '(e) Para operações aéreas com NVIS, o piloto segundo em comando deverá:

  (1) ter concluído o treinamento NVIS, segundo a seção 90.265 deste Regulamento;

  (2) possuir 20 (vinte) horas de voo noturno, na função de piloto segundo em comando em VMC;

  (3) possuir 50 (cinquenta) horas de voo no modelo da aeronave que irá realizar operação
  NVIS;

  (4) possuir 10 (dez) horas de voo em operação NVIS; e

  (5) comprovar experiência recente mínima, nos últimos 3 (três) meses que antecedem a operação
  NVIS, incluindo:'
