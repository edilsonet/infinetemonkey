section_title: Requisitos para exercício da função de piloto segundo em comando
subsection_id: f
cite: 90.25(f)
title: 90.25(f)
text: (f) Para as operações aéreas especiais de combate a incêndios, o piloto segundo em comando
  deverá ter concluído o treinamento de combate a incêndios, em consonância com o programa
  de treinamento estabelecido pela UAP, ou ser detentor da habilitação PAGA/H em consonância
  com o RBAC nº 61.
