section_title: Requisitos para exercício da função de piloto segundo em comando
subsection_id: g
cite: 90.25(g)
title: 90.25(g)
text: '(g) Para as operações aéreas de helicóptero com carga externa, o piloto segundo em
  comando deverá:

  (1) ter concluído o treinamento de carga externa, segundo a seção 90.387 deste Regulamento;

  (2) ter realizado, de forma proficiente e dentro de um período mínimo definido pela UAP,
  operações de rapel,

  fast rope

  , guincho, puçá e/ou

  McGuire

  para manutenção do nível de desempenho de segurança operacional; e

  (3) cumprir com outros procedimentos e treinamentos a critério da UAP.'
