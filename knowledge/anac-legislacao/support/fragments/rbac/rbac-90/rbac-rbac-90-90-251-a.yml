cite: 90.251(a)
title: 90.251(a)
text: '(a) Para exercer uma mesma função em outra UAP, o instrutor deverá realizar o treinamento
  de ambientação de instrutor, a critério da nova UAP.

  (1) O treinamento de ambientação para instrutor terá por base o comparativo entre os componentes
  curriculares dos programas de treinamento das UAP envolvidas.'
