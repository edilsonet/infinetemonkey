text: '(b) A UAP deverá definir os componentes curriculares, as manobras e a carga horária
  mínima para o treinamento de ambientação para instrutores de voo, observado o nível de tolerabilidade
  do risco à segurança operacional.

  EXAME DE OBSERVAÇÃO PARA INSTRUTOR DE VOO DA UAP'
