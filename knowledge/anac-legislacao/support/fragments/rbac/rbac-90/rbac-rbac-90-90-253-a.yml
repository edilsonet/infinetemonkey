title: 90.253(a)
text: (a) O exame de observação de instrutor de voo em aeronave ou em FSTD é a avaliação teórica
  e prática para verificação dos conhecimentos teóricos e das habilidades psicomotoras complexas
  inerentes à função de instrutor.
