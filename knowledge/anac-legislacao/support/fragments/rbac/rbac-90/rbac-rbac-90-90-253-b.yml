section_title: Exame de observação para exercício da função de instrutor de voo
subsection_id: b
cite: 90.253(b)
title: 90.253(b)
text: (b) O exame de observação de instrutor de voo deverá ser conduzido a cada 24 (vinte
  e quatro) meses, na função de instrutor de voo em aeronave ou em FSTD, no assento da cabine
  de pilotagem designado para o instrutor de voo, por servidor designado pela ANAC ou examinador
  credenciado pela ANAC, em conformidade com a regulamentação específica da ANAC.
