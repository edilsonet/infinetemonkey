title: 90.253(c)
text: (c) Os examinadores credenciados pela ANAC para uma determinada UAP, segundo o parágrafo
  (b) desta seção, poderão realizar os exames de observação de instrutores vinculados a outras
  UAP, nos termos do seu credenciamento.
