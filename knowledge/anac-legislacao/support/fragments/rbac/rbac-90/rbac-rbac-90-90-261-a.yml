cite: 90.261(a)
title: 90.261(a)
text: '(a) O NVIS é composto por:

  (1) NVG e respectivos acessórios;

  (2) iluminação interna e externa da aeronave compatível para operação NVIS;

  (3) aeronaves, componentes e disposição dos instrumentos adaptados e adequados para a operação
  NVIS;

  (4) RADALT ou HTAWS;

  (5) treinamento e avaliação; e

  (6) manutenção do NVG, aeronave e equipamentos para garantia da aeronavegabilidade continuada.'
