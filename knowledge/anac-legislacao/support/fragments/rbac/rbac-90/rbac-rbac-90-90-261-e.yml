cite: 90.261(e)
title: 90.261(e)
text: '(e) Para operação aérea NVIS, a aeronave deverá estar equipada com, no mínimo, os seguintes
  equipamentos em funcionamento:

  (1) bússola;

  (2) luzes anticolisão;

  (3) relógio;

  (4) transponder;

  (5) farol de pouso;

  (6) luzes de posição;

  (7) conjunto de luzes internas e externas adequado à utilização de NVG;

  (8) VHF para radiocomunicação bilateral;

  (9) instrumentos de navegação apropriados;

  (10) sistema elétrico da aeronave compatível com os instrumentos e equipamentos NVIS;

  (11) RADALT ou HTAWS; e

  (12) outros instrumentos e equipamentos requeridos para o voo VFR noturno previsto no RBAC
  nº 91.

  (Redação dada pela Resolução nº 695, de 09.11.2022)'
