cite: 90.263(a)
title: 90.263(a)
text: '(a) As operações aéreas NVIS devem ser realizadas no período compreendido entre 60
  minutos após o pôr do sol e 60 minutos antes do nascer do sol.

  (1) Para os fins deste Regulamento entende-se como horário do pôr e nascer do sol, aquele
  estabelecido na Publicação de Informação Aeronáutica - AIP BRASIL expedida pelo DECEA.

  (2) Caso as localidades de pouso e decolagem não disponham dos horários previstos na AIP
  BRASIL, o piloto deverá utilizar os horários de pôr e nascer do sol do aeródromo mais próximo
  que disponha de tal informação.'
