text: '(c) O MOP da UAP e os SOP deverão dispor sobre:

  (1) os procedimentos e as atribuições dos tripulantes e das outras pessoas com função a
  bordo; e

  (2) CRM para as condições normais, anormais e de emergências previstas nesta subparte.'
