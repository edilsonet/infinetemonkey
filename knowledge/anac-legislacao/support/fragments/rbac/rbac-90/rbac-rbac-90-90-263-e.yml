cite: 90.263(e)
title: 90.263(e)
text: '(e) Em situações de inviabilidade de cumprimento dos requisitos mínimos de visibilidade
  e altura para o voo VFR noturno, o piloto em comando deverá:

  (1) alterar a trajetória de voo para evitar as áreas de visibilidade reduzida;

  (2) retornar para as condições de voo visual noturno não assistido por NVG ou IFR; e

  (3) pousar assim que possível.'
