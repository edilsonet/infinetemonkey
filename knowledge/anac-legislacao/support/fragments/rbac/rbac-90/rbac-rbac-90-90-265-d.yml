cite: 90.265(d)
title: 90.265(d)
text: '(d) O treinamento inicial NVIS será composto pelas seguintes etapas:

  (1) currículo de solo, segundo o parágrafo (e) desta seção;

  (2) currículo de exercício prático de ambientação na aeronave, segundo o parágrafo (f) desta
  seção;

  (3) currículo de voo, segundo o parágrafo (g) desta seção; e

  (4) avaliação teórica e prática da UAP, segundo esta seção.'
