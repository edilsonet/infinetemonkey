section_title: Treinamento NVIS
subsection_id: e
cite: 90.265(e)
title: 90.265(e)
text: '(e) O currículo de solo do treinamento inicial NVIS será constituído dos componentes
  curriculares:

  (1) fatores aeromédicos relacionados ao uso do NVG;

  (2) gerenciamento da fadiga;

  (3) meteorologia e procedimentos para operação condições atmosféricas desfavoráveis;

  (4) fatores ambientais de influência em operações aéreas NVIS, tais como: fumaça, sombra,
  neblina, poeira, umidade, fases da Lua, etc.;

  (5) preparação, manutenção, inspeções, cuidados e procedimentos para o NVIS;

  (6) preparação, inspeções e procedimentos da aeronave;

  (7) operações normais, anormais e de emergência do NVIS;

  (8) desempenho dos NVG e interpretação de cenário;

  (9) manutenção preventiva do NVG;

  (10) princípios de funcionamento do NVG;

  (11) CRM em operações aéreas NVIS;

  (12) análise, mitigação e gerenciamento de riscos nas operações aéreas NVIS;

  (13) planejamento de voo para operações NVIS, incluindo interpretação noturna de terreno;

  (14) os SOP e o MOP aplicados às operações NVIS;

  (15) limitações da aeronave em operações NVIS; e

  (16) outros procedimentos, a critério da UAP.'
