cite: 90.265(g)
title: 90.265(g)
text: '(g) O currículo de voo do treinamento inicial NVIS deverá ser composto por instruções
  práticas de:

  (1) planejamento tático da missão;

  (2) inspeção pré-voo e uso dos sistemas internos e externos de iluminação;

  (3) preparação e operação do NVG dos demais equipamentos NVIS;

  (4) técnicas de pilotagem com a utilização de NVG nas fases de voo, incluindo decolagem,
  subida, descida e pouso;

  (5) operações normais, anormais e de emergência com NVG;

  (6) procedimentos em falha de um ou mais tubos de intensificação de imagem e mau funcionamento
  do NVG (ex.:

  chicken wire

  , etc.);

  (7) gerenciamento de riscos em operação NVIS;

  (8) rotina de verificações prévias;

  (9) vigilância do espaço aéreo;

  (10) técnicas de prevenção de colisão com fios;

  (11) voo pairado dentro e fora do efeito solo;

  (12) prática da navegação por contato;

  (13) procedimentos de gestão de combustível;

  (14) reabastecimento da aeronave;

  (15) decolagem, manobras e aproximação VMC;

  (16) pouso e decolagem em terreno inclinado e área não cadastrada ou em aeródromo com restrição
  a pouso ou decolagem;

  (17) resposta a emergências;

  (18) procedimentos para recuperação de IIMC e de visibilidade deteriorada, incluindo, no
  mínimo:'
