cite: 90.265(h)
title: 90.265(h)
text: '(h) Ao final das instruções do currículo de solo e de voo previstos nesta seção, o
  tripulante e outras pessoas com função a bordo deverão realizar avaliação teórica e prática,
  conforme definido pela UAP, incluindo:

  (1) procedimentos normais, anormais e de emergência em operações NVIS;

  (2) voo pairado, táxi e procedimentos de transição;

  (3) decolagem e navegação NVIS;

  (4) operações em áreas não cadastradas ou em aeródromos com restrição a pouso ou decolagem,
  quando possuírem iluminação inadequada;

  (5) procedimentos de emergência e de falhas do NVG;

  (6) procedimento de voo em condições de visibilidade deterioradas e com perda de referências
  visuais, durante a decolagem e o pouso;

  (7) procedimentos para retorno ao voo em VMC, caso ocorra a IIMC;

  (8) procedimentos para evitar colisão com fios e obstáculos;

  (9) aspectos meteorológicos;

  (10) planejamento de voo NVIS;

  (11) procedimentos previstos no MOP, nos SOP e na legislação e/ou regulamentação em vigor;

  (12) manobras de voo NVIS;

  (13) procedimentos de transição de/para operações com NVG;

  (14) CRM para operações NVIS; e

  (15) outros assuntos a critério da UAP.'
