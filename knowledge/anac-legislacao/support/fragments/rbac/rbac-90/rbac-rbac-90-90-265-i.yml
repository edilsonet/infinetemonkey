title: 90.265(i)
text: '(i) procedimentos de manobra de retorno (

  turn back

  ), para pousos de precaução ou transição para um voo não assistido por NVG;

  (ii) procedimentos de decolagem ou pouso com perda inadvertida de visibilidade; e

  (iii) procedimentos para retorno ao voo VMC, caso ocorra a IIMC;

  (19) navegação;

  (20) preparação da aeronave para operações NVIS;

  (21) procedimentos normais e de emergência, incluindo falhas no NVIS e na aeronave;

  (22) procedimentos de transição das operações NVIS; e

  (23) voo a baixa altura, se aplicável.'
