title: 90.265(j)
text: (j) As avaliações teórica e prática para operações NVIS deverão ser realizadas em até
  2 (dois) meses, contados da conclusão do referido currículo e registradas e arquivadas na
  pasta individual do tripulante na UAP, assim como nas de outras pessoas com função a bordo.
