cite: 90.265(n)
title: 90.265(n)
text: '(n) O treinamento periódico NVIS deverá ser realizado a cada 12 (doze) meses.

  (1) A ANAC poderá prorrogar o prazo por até 8 (oito) meses, desde que devidamente justificado.
  Vencido esse prazo, o piloto deverá realizar todo o treinamento inicial, previsto no parágrafo
  (d) desta seção.'
