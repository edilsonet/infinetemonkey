title: 90.265(p)
text: '(p) O piloto em comando e o piloto segundo em comando deverão cumprir com os requisitos
  de experiência previstos na seção 90.23 ou 90.25, conforme aplicável.

  (1) Vencido o prazo de experiência recente o piloto deverá realizar o treinamento periódico
  NVIS.'
