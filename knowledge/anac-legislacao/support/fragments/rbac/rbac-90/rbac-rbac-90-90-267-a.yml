title: 90.267(a)
text: '(a) As aeronaves devem cumprir com os requisitos de aeronavegabilidade para operação
  aérea NVIS, segundo o RBAC nº 91 e os demais regulamentos aplicáveis.

  (Redação dada pela Resolução nº 695, de 09.11.2022)'
