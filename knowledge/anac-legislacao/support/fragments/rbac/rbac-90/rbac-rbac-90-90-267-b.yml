cite: 90.267(b)
title: 90.267(b)
text: '(b) Os procedimentos para aeronavegabilidade continuada devem conter manutenções, inspeções
  e registros nos elementos do equipamento NVIS, em especial:

  (1) nos NVG;

  (2) na iluminação NVIS;

  (3) no capacete e fixações do NVG, conforme aplicável;

  (4) no

  hardware

  , conforme aplicável; e

  (5) nos equipamentos adicionais.'
