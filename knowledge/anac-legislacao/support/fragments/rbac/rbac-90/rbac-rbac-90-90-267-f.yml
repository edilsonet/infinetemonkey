section_title: Aeronavegabilidade continuada NVIS
subsection_id: f
cite: 90.267(f)
title: 90.267(f)
text: (f) A manutenção dos sistemas de iluminação da aeronave deverá ser realizada a cada
  24 (vinte e quatro) meses, salvo na ocorrência de degradação dos sistemas de iluminação
  da aeronave, que deverão ser identificados e corrigidos imediatamente.
