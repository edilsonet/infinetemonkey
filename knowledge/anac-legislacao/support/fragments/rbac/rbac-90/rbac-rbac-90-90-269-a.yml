section_title: Registro de horas de voo NVIS
subsection_id: a
cite: 90.269(a)
title: 90.269(a)
text: '(a) As horas de voo realizadas em operações NVIS devem ser registradas:

  (1) na função de piloto em comando ou de piloto segundo em comando; e

  (2) como operações aéreas NVIS, podendo ser contabilizadas como horas de voo sob VFR noturno
  e registradas sob a sigla “NVIS/VFR noturno”.'
