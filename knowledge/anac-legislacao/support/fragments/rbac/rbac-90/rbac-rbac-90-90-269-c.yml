title: 90.269(c)
text: '(c) As horas de voo NVIS devem ser registradas no diário de bordo como voo VFR noturno
  e constar em campo específico como operação aérea NVIS (NVIS/VFR noturno).

  SUBPARTE S

  ARTIGOS PERIGOSOS E PRODUTOS CONTROLADOS EMBARCADOS'
