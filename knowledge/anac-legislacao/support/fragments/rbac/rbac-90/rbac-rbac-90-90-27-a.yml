section_title: Instrutor eventual da UAP
subsection_id: a
cite: 90.27(a)
title: 90.27(a)
text: (a) Em virtude da necessidade temporária de excepcional interesse público, a UAP poderá
  dispor de instrutor eventual desde que o profissional tenha notória especialização, seja
  por um período limitado, atenda aos requisitos do parágrafo 90.29(a)(6) deste Regulamento
  e esteja previsto no Programa de Treinamento da UAP.
