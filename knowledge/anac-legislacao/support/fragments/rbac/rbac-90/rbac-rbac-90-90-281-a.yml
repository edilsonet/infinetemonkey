section_title: Requisitos gerais para transporte de artigos perigosos ou produtos controlados
subsection_id: a
cite: 90.281(a)
title: 90.281(a)
text: (a) O transporte de artigos perigosos ou produtos controlados realizados nas operações
  especiais de aviação pública somente poderá ser conduzido sob condições excepcionais, conforme
  estabelecido na seção 90.283 deste Regulamento, ou submetendo-se ao estabelecido no RBAC
  nº 175.
