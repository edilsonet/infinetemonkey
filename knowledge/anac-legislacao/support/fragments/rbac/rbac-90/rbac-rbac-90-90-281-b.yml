title: 90.281(b)
text: (b) Para a realização do transporte de artigos perigosos em aeronaves pressurizadas,
  a UAP deverá adotar medidas mitigadoras adicionais ao previsto nesta subparte ou submeter-se
  ao estabelecido no RBAC nº 175 para manutenção do nível de desempenho de segurança operacional.
