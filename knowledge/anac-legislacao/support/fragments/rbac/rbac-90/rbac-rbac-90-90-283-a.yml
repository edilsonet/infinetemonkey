section_title: Condições excepcionais para transporte de artigos perigosos específicos pela
  UAP
subsection_id: a
cite: 90.283(a)
title: 90.283(a)
text: '(a) Em condições excepcionais e desde que atendidas as disposições desta seção, a UAP
  poderá realizar o transporte dos seguintes artigos perigosos e produtos controlados:

  (1) latas de

  spray

  incapacitante, gás lacrimogêneos e similares;

  (2) QAV ou AVGAS;

  (3) alguns medicamentos imprescindíveis às operações aeromédicas;

  (4) material biológico e/ou infectante;

  (5) sinalizadores;

  (6) armas e munições segundo a subparte T deste Regulamento;

  (7) materiais explosivos, detonadores, cordão de detonação, fusível de segurança e de ignição
  utilizados com o propósito de salvar vidas ou operações especiais;

  (8) artifício de sinalização pirotécnica;

  (9) cilindros de gás;

  (10) baterias de íon lítio (UN 3480) e lítio metálico (UN 3090) desde que sob aprovação
  da ANAC, conforme norma específica; e

  (11) outros artigos perigosos ou produtos controlados desde que autorizados pela ANAC.'
