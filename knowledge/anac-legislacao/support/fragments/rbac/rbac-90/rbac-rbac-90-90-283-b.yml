subsection_id: b
cite: 90.283(b)
title: 90.283(b)
text: '(b) Os artigos perigosos elencados abaixo não estão sujeitos aos requisitos desta subparte,
  desde que protegidos contra curto-circuito e contra ativação não intencional:

  (1) baterias elétricas não listadas de forma específica na lista de artigos perigosos do
  RBAC nº 175, tais como bateria alcalina-manganês, de zinco-carbono e de níquel-cádmio;

  (2) baterias de níquel-hidreto metálico;

  (3) Baterias de íon lítio, contidas em equipamento e Baterias de íon lítio, embaladas em
  equipamento (UN 3481); e

  (4) Baterias de lítio metálico, contidas em equipamento e Baterias de lítio metálico, embaladas
  em equipamento (UN 3091).'
