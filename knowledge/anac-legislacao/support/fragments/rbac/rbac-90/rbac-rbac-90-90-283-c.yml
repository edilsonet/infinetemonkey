subsection_id: c
cite: 90.283(c)
title: 90.283(c)
text: (c) O requisito inicial para realização do transporte de artigos perigosos e produtos
  controlados é que o controle do risco inerente à operação, incluso a proteção das aeronaves,
  tripulação, outras pessoas com função a bordo, passageiros e terceiros, esteja dentro do
  NADSO.
