section_title: Condições excepcionais para transporte de artigos perigosos específicos pela
  UAP
subsection_id: d
cite: 90.283(d)
title: 90.283(d)
text: '(d) O transporte dos artigos perigosos descritos no parágrafo (a) desta seção poderá
  ser realizado desde que:

  (1) o transporte seja estritamente necessário ao cumprimento da operação especial pública
  e sem prejuízo à referida missão;

  (2) a UAP tenha realizado uma avaliação do risco operacional antes do voo, para o dimensionamento
  da tolerabilidade, mitigação e/ou cancelamento da referida operação;

  (3) a tripulação e outras pessoas com função a bordo estejam treinadas para este tipo de
  operação segundo a seção 90.285 deste Regulamento;

  (4) somente os envolvidos na operação estejam a bordo;

  (5) seja realizada em território nacional;

  (6) a tripulação e outras pessoas com função a bordo tenham recebido todas as informações
  necessárias sobre as características e manuseio dos produtos transportados;

  (7) antes da decolagem, o piloto em comando, ou tripulantes (ou pessoas com função a bordo)
  por ele designado, tenham inspecionado as condições de armazenamento dos artigos perigosos
  a fim de garantir a segurança;

  (8) sempre que houver troca de tripulação ou de pessoas com função a bordo e enquanto os
  artigos perigosos estiverem a bordo, a nova tripulação e as novas pessoas com função a bordo
  devem ser informada dos artigos que estão sendo transportados;

  (9) a tripulação e os envolvidos na operação utilizem os EPIs necessários à preservação
  da segurança do profissional;

  (10) a operação seja realizada em conformidade com os SOP e o MOP da UAP;

  (11) a UAP disponha de um PRE para ocorrências com artigos perigosos;

  (12) a operação seja previamente coordenada e autorizada pelo piloto em comando;

  (13) a tripulação e as demais pessoas com função a bordo tenham ciência do que será transportado
  e acompanhem o seu acondicionamento na aeronave;

  (14) o manuseio dos cilindros de gás seja conduzido por pessoa qualificada;

  (15) não obstante o previsto na subparte W deste Regulamento, as bombas de efeito moral
  e congêneres, tais como bombas de fumaça e

  sprays

  incapacitantes sejam transportados dentro de caixas fortes e resistentes ao fogo e contenham:'
