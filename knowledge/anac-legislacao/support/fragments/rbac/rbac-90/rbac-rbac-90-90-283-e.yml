cite: 90.283(e)
title: 90.283(e)
text: (e) É responsabilidade do piloto em comando ou tripulante (ou pessoa com função a bordo)
  por ele designado, a inspeção do quantitativo de artigos perigosos ou produtos controlados
  embarcados e a compatibilidade desse numerário com os limites permitidos no regramento vigente.
