subsection_id: g
cite: 90.283(g)
title: 90.283(g)
text: (g) Um volume ou sobrembalagem contendo artigo perigoso não poderá ser carregado em
  uma aeronave a menos que este tenha sido inspecionado imediatamente antes de ser carregado
  e esteja livre de evidências de vazamentos ou danos.
