section_title: Condições excepcionais para transporte de artigos perigosos específicos pela
  UAP
subsection_id: i
cite: 90.283(i)
title: 90.283(i)
text: '(i) transportadas em embalagens rígidas, resistentes, a prova de vazamento e impermeáveis
  ao fluido da bateria;

  (ii) protegidas contra queda e/ou tombamento;

  (iii) cercadas por material absorvente capaz de reter os líquidos contidos na bateria; e

  (iv) identificadas como material corrosivo e com o indicativo do lado que deverá ficar voltado
  para cima;

  (22) a quantidade máxima de armas e munições a serem transportadas na aeronave se submeta
  à legislação federal e/ou regulamentação de operação do órgão ou ente responsável;

  (23) as bombas de efeito moral e congêneres sejam transportadas somente se garantido que
  estes dispositivos estejam protegidos contra ativação acidental;

  (24) observados os critérios de segregação entre os artigos perigosos;

  (25) os agentes públicos que lidam com os artigos perigosos sejam capacitados para este
  tipo de atividade segundo a seção 90.285 deste Regulamento;

  (26) a UAP garanta que as embalagens são compatíveis com a substância a ser transportada,
  em especial quanto a sua corrosividade, permeabilidade, envelhecimento prematuro e fragilidade;

  (27) os artigos biológicos e infectantes observem o disposto em norma específica, conforme
  aplicável;

  (28) atendidos os requisitos da legislação e/ou regulamentação complementar, caso aplicável;
  e

  (29) cumpridos outros procedimentos de segurança a critério da UAP.'
