cite: 90.285(c)
title: 90.285(c)
text: (c) O programa de treinamento de artigos perigosos estará sujeito à aprovação da ANAC;
  no entanto, o programa não precisa ser enviado para análise da ANAC e será considerado aprovado
  desde que obedeça ao disposto nesta subparte e em norma específica da ANAC.
