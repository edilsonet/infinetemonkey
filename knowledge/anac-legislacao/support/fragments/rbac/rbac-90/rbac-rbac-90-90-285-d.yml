cite: 90.285(d)
title: 90.285(d)
text: '(d) O currículo de solo do treinamento de artigos perigosos deverá conter, no mínimo,
  os componentes curriculares:

  (1) conceitos gerais para o transporte seguro de artigos perigosos e produtos controlados;

  (2) regramentos aplicáveis ao transporte de artigos perigosos;

  (3) gerenciamento de risco relativo à operação com cargas classificadas como artigo perigoso;

  (4) os procedimentos previstos no MOP e nos SOP da UAP;

  (5) limitações e critérios de segurança;

  (6) classificação dos artigos perigosos;

  (7) embalagem, uso, etiquetagem, marcação e documentação, conforme aplicável;

  (8) procedimentos de aceitação para transporte de artigos perigosos pela UAP, conforme aplicável;

  (9) reconhecimento de artigos perigosos não declarados;

  (10) procedimentos de armazenagem, carregamento, acondicionamento e uso;

  (11) atribuições de cada tripulante e profissional envolvido;

  (12) procedimentos de emergência e PRE; e

  (13) outros assuntos a critério da UAP.'
