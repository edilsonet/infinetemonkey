cite: 90.285(f)
title: 90.285(f)
text: '(f) A avaliação teórica do treinamento em artigos perigosos da UAP deverá:

  (1) ser realizada em até 2 (dois) meses, contados da conclusão do referido treinamento;

  (2) ser realizada no formato definido pela UAP; e

  (3) ser registrada em formulário próprio e arquivada na pasta individual do aluno.'
