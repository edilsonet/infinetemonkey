title: 90.285(g)
text: (g) A UAP deverá definir a carga horária mínima para cada componente curricular, observado
  o ambiente operacional da UAP, o nível de tolerabilidade do risco à segurança operacional
  e a(s) classe(s) dos artigos perigosos transportados.
