section_title: Ocorrências aeronáuticas e emergências envolvendo o transporte de artigos perigosos
subsection_id: a
cite: 90.287(a)
title: 90.287(a)
text: '(a) Em situações anormais e de emergência envolvendo o transporte de artigos perigosos,
  tais como fogo e vazamento, a tripulação e as demais pessoas com função a bordo deverão:

  (1) executar os procedimentos previstos no AFM ou AOM, SOP e/ou MOP; e

  (2) considerar a possibilidade de pousar assim que praticável, uma vez que eventos desta
  natureza poderão ser controlados mais facilmente em solo.'
