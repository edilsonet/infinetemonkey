section_title: Ocorrências aeronáuticas e emergências envolvendo o transporte de artigos perigosos
subsection_id: b
cite: 90.287(b)
title: 90.287(b)
text: (b) Em situação extrema onde o pouso não seja possível, o piloto em comando poderá considerar
  a possibilidade de alijamento de emergência dos artigos perigosos estabelecidos na seção
  90.283 deste Regulamento, desde que o risco à segurança de propriedade e de terceiros seja
  mitigado pela tripulação e demais pessoas com função a bordo.
