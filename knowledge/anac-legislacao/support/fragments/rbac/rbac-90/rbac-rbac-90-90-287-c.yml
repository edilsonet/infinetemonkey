cite: 90.287(c)
title: 90.287(c)
text: (c) Caso ocorra vazamento do combustível transportado, a tripulação e as demais pessoas
  com função a bordo deverão adotar os procedimentos para tentar conter o referido vazamento
  utilizando-se dos materiais absorventes disponíveis, tais como papel e algodão.
