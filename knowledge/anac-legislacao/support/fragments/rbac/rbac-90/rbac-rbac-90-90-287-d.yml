section_title: Ocorrências aeronáuticas e emergências envolvendo o transporte de artigos perigosos
subsection_id: d
cite: 90.287(d)
title: 90.287(d)
text: (d) Caso ocorra vazamento de fluidos de baterias ou de materiais corrosivos, a tripulação
  e as demais pessoas com função a bordo deverão evitar contato com o referido fluido e requisitar
  ajuda de profissionais qualificados para descontaminar a área afetada após o pouso.
