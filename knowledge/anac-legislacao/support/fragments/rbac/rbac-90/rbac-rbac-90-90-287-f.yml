cite: 90.287(f)
title: 90.287(f)
text: (f) O piloto em comando deverá reportar no diário de bordo qualquer ocorrência envolvendo
  artigos perigosos e, se aplicável, adotar os procedimentos de inspeção e manutenção nas
  aeronaves e/ou componentes.
