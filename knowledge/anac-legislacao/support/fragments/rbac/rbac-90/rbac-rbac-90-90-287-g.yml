section_title: Ocorrências aeronáuticas e emergências envolvendo o transporte de artigos perigosos
subsection_id: g
cite: 90.287(g)
title: 90.287(g)
text: '(g) Nos casos de ocorrências com artigos perigosos, compete à UAP:

  (1) informar o operador aeroportuário do aeródromo sobre a presença de artigos perigosos
  e suas classes ou divisões de risco, para que serviços de emergência em solo estejam preparados
  quanto aos riscos associados ao artigo perigoso transportado em uma eventual ocorrência
  aeronáutica (incidente, acidente, etc.);

  (2) comunicar as demais autoridades competentes;

  (3) comunicar a autoridade policial atuante no aeródromo, nos casos de transporte de armas
  e munições, se aplicável;

  (4) acionar o PRE;

  (5) notificar a ANAC sobre a ocorrência com artigos perigosos; e

  (6) executar outros procedimentos julgados pertinentes pela UAP.'
