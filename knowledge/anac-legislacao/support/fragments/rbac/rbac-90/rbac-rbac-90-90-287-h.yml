section_title: Ocorrências aeronáuticas e emergências envolvendo o transporte de artigos perigosos
subsection_id: h
cite: 90.287(h)
title: 90.287(h)
text: '(h) Nos casos de emergência em voo com aeronaves que transportam artigos perigosos,
  compete ao piloto em comando:

  (1) adotar os procedimentos de segurança pertinentes;

  (2) cumprir com os SOP definidos pela UAP;

  (3) declarar emergência ao serviço de controle de tráfego aéreo do DECEA, assim que possível;

  (4) informar o serviço de controle de tráfego aéreo do DECEA, assim que possível, sobre
  o carregamento do artigo perigoso e sua classe ou divisão de risco;

  (5) sempre que possível, informar o operador aeroportuário, no caso de aeródromo cadastrado
  pela ANAC, sobre a presença de artigos perigosos e suas classes ou divisões de risco, para
  que serviços de emergência em solo estejam preparados quanto aos riscos associados ao artigo
  perigoso transportado numa eventual ocorrência aeronáutica; e

  (6) sempre que possível, adotar os procedimentos necessários para que os armamentos estejam
  devidamente protegidos e que as armas de porte individual estejam guarnecidas.

  SUBPARTE T

  ARMAS E MUNIÇÕES EMBARCADAS'
