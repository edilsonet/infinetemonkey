section_title: Requisitos do corpo docente da UAP
subsection_id: a
cite: 90.29(a)
title: 90.29(a)
text: '(a) Para os efeitos deste Regulamento são instrutores da UAP:

  (1) instrutor de solo, segundo o parágrafo (c) desta seção;

  (2) instrutor de voo em aeronave, segundo o parágrafo (d) desta seção;

  (3) instrutor de voo em FSTD, segundo os parágrafos (e) e (f) desta seção;

  (4) instrutor NVIS, segundo o parágrafo (g) desta seção;

  (5) instrutor de comissários de voo, segundo o parágrafo (h) desta seção; e

  (6) instrutor eventual, segundo o parágrafo (i) desta seção.'
