cite: 90.29(b)
title: 90.29(b)
text: (b) Para os efeitos deste Regulamento, os profissionais que ministram as instruções
  nos currículos de treinamentos especiais ou nos treinamentos para gestores, operadores aerotáticos
  e operadores de suporte médico devem cumprir com os critérios de qualificação e competência
  estabelecidos pela própria UAP.
