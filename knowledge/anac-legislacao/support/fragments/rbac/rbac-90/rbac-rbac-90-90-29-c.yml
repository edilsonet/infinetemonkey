section_title: Requisitos do corpo docente da UAP
subsection_id: c
cite: 90.29(c)
title: 90.29(c)
text: '(c) São requisitos mínimos para exercício da função de instrutor de solo da UAP:

  (1) ser profissional de notória especialização no componente curricular em que irá ministrar
  instrução, segundo este Regulamento;

  (2) estar designado pelo órgão ou ente público para ministrar instrução;

  (3) ser tripulante (piloto em comando ou piloto segundo em comando), na aeronave em que
  irá ministrar instrução, segundo as seções 90.23 e 90.25 deste Regulamento, ou ainda um
  MMA habilitado segundo o RBAC nº 65; e

  (4) ter concluído o currículo de solo do treinamento de instrutor da UAP, segundo a seção
  90.245 deste Regulamento.'
