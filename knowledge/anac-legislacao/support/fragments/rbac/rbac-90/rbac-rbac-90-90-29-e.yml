cite: 90.29(e)
title: 90.29(e)
text: '(e) São requisitos mínimos para exercício da função de instrutor de voo em FSTD:

  (1) ser profissional de notória especialização no componente curricular em que irá ministrar
  instrução, segundo este Regulamento;

  (2) ter concluído o treinamento completo de instrutor da UAP em FSTD, segundo a seção 90.243
  deste Regulamento;

  (3) ter concluído, na função de instrutor, o treinamento para manipulação e operação do
  FSTD, se aplicável;

  (4) ser detentor da habilitação de tipo ou classe na função piloto em comando, na aeronave
  em que irá ministrar instrução; e

  (5) ser detentor da habilitação IFRA/H, no caso da referida instrução.'
