cite: 90.29(g)
title: 90.29(g)
text: '(g) São requisitos mínimos para exercício da função de instrutor NVIS:

  (1) ser profissional de notória especialização no componente curricular em que irá ministrar
  instrução, segundo este Regulamento;

  (2) estar designado pelo órgão ou ente público para ministrar instrução;

  (3) estar com habilitação de tipo ou classe válida, na aeronave em que irá ministrar instrução;
  e

  (4) possuir experiência mínima em operações NVIS (horas de voo noturno assistido por NVG)
  conforme estabelecido pela UAP no MOP.'
