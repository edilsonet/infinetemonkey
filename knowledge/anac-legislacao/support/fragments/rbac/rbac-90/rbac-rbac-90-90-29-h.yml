title: 90.29(h)
text: '(h) São requisitos mínimos para exercício da função de instrutor de comissários de
  voo:

  (1) ser profissional de notória especialização no componente curricular em que irá ministrar
  instrução, segundo este Regulamento;

  (2) estar designado pelo órgão ou ente público para ministrar instrução; e

  (3) cumprir com os requisitos estabelecidos no RBHA 63, ou RBAC que venha a substituí-lo,
  e demais regramentos correlatos.'
