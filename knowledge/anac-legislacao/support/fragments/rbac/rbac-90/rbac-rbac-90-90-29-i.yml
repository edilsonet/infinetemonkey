cite: 90.29(i)
title: 90.29(i)
text: '(i) São requisitos mínimos para exercício da função de instrutor eventual:

  (1) ser profissional de notória especialização no componente curricular em que irá ministrar
  instrução, segundo este Regulamento;

  (2) estar designado pelo órgão ou ente público para ministrar instrução; e

  (3) estar em consonância com as disposições estabelecidas nas seções 90.27 e 90.153 deste
  Regulamento.'
