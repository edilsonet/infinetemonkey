cite: 90.291(a)
title: 90.291(a)
text: '(a) Para efeitos deste Regulamento, são armas:

  (1) revólveres;

  (2) pistolas;

  (3) espingardas;

  (4) carabinas;

  (5) fuzis;

  (6) armas de dardos;

  (7) armas de choque;

  (8) armas de lançamento de eletrodo energizado (ALEE), também denominadas armas de eletrochoque,
  ou armas de incapacitação neuromuscular;

  (9)

  sprays

  incapacitantes; e

  (10) outras definidas em regramentos próprios.'
