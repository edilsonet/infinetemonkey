section_title: Armas e munições
subsection_id: b
cite: 90.291(b)
title: 90.291(b)
text: '(b) Estão incluídos como munição:

  (1) cartuchos e projéteis de armas;

  (2) bombas de gás, fumaça, atordoantes e similares;

  (3) cartuchos de espingarda;

  (4) munição de rifles e armas de mão;

  (5) dardos;

  (6) munição de borracha;

  (7) bombas de efeito moral; e

  (8) outras definidas em regramentos próprios.'
