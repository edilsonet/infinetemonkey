section_title: Requisitos gerais para transporte e porte de armas e munições embarcadas em
  aeronaves públicas
subsection_id: a
cite: 90.293(a)
title: 90.293(a)
text: (a) No transporte ou porte de armas e munições embarcadas, o órgão ou ente público deverá
  realizar o gerenciamento do risco de tal modo que os riscos à aeronave, aos tripulantes,
  às outras pessoas com função a bordo, aos passageiros, às pessoas e às propriedades em solo
  encontrem-se dentro do NADSO.
