subsection_id: d
cite: 90.293(d)
title: 90.293(d)
text: (d) Antes da decolagem, o piloto em comando, pessoalmente ou por intermédio de tripulante
  (ou outra pessoa com função a bordo) por ele designado, deverá inspecionar as condições
  de armazenamento das armas e munições a fim de garantir a segurança.
