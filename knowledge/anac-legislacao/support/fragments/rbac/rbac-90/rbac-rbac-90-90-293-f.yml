cite: 90.293(f)
title: 90.293(f)
text: (f) Os passageiros que pretendam transportar ou portar armamentos e munições, tais como
  agentes públicos e que não sejam qualificados como operadores aerotáticos, piloto em comando
  ou piloto segundo em comando, deverão cumprir integralmente os procedimentos previstos no
  parágrafo (h) desta seção.
