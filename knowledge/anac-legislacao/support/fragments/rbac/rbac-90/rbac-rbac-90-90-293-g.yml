section_title: Requisitos gerais para transporte e porte de armas e munições embarcadas em
  aeronaves públicas
subsection_id: g
cite: 90.293(g)
title: 90.293(g)
text: '(g) É de responsabilidade do piloto em comando da aeronave, pessoalmente ou por intermédio
  de tripulante por ele designado, e do operador aerotático, a verificação de segurança, orientação
  e fiscalização quanto ao acondicionamento das armas e munições embarcadas por todos os ocupantes
  da aeronave, conforme a respectiva tabela:

  Armas ou munições

  Condição de acondicionamento

  Pistolas semiautomáticas

  Em coldre próprio para cada modelo.

  Rifles semiautomáticos, carabinas, espingardas automáticas, espingardas de ação deslizante,
  rifle de ferrolho e rifle automático e similares.

  Em recipiente próprio, no compartimento de carga da aeronave, ou na bandoleira, no porte
  por agente público. Para todas as armas citadas, as partes funcionais do armamento deverão
  estar para frente e com o gatilho solto, a trava de segurança ativada, quando possível o
  carregador municiado e alojado na arma, não sendo permitida munição na câmara.

  Revólver

  Cilindro carregado com munição, arma em um coldre seguro que previna disparos acidentais
  e trava de segurança ativada, quando possível. Se transportadas no compartimento de carga
  da aeronave, deverão estar acondicionadas em recipientes próprios.

  Armas de Lançamento de Eletrodo Energizado (ALEE)

  Recipiente próprio contra ativação acidental no compartimento de carga da aeronave ou no
  coldre no porte por agente público, vedada a retirada da arma do coldre durante as fases
  de voo.

  Sprays

  incapacitantes

  Recipiente resistente e próprio contra ativação acidental.

  Bombas de efeito moral e congêneres

  Recipiente resistente e próprio contra ativação acidental.'
