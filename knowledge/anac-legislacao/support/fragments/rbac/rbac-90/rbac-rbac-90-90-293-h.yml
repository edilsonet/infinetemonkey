subsection_id: h
cite: 90.293(h)
title: 90.293(h)
text: '(h) O transporte ou porte de armas e munições embarcadas e realizados por órgãos ou
  entes da administração pública que não se enquadrem na seção 90.295 deste Regulamento deverão
  observar os seguintes procedimentos:

  (1) as armas deverão ser transportadas desmuniciadas ou em conformidade com os procedimentos
  previstos no MOP da UAP;

  (2) as armas e munições deverão ser transportadas em compartimentos de carga ou outra área
  apropriada e segura; e

  (3) bombas de efeito moral e congêneres, tais como bombas de fumaça e sprays incapacitantes
  deverão ser transportadas dentro de caixas fortes e resistentes ao fogo ou de outra forma
  definido pela UAP para manutenção da segurança desta operação.'
