section_title: Requisitos gerais para transporte e porte de armas e munições embarcadas em
  aeronaves públicas
subsection_id: i
cite: 90.293(i)
title: 90.293(i)
text: '(i) Os membros da tripulação e outras pessoas com função a bordo que estiverem armados
  terão acesso autorizado à ARS dos aeroportos, desde que:

  (1) devidamente identificados;

  (2) estiverem a serviço do órgão ou ente público;

  (3) o embarque seja compulsoriamente realizado em aeronaves civis públicas dos órgãos ou
  entes públicos segundo este Regulamento;

  (4) o embarque seja autorizado pelo piloto em comando da aeronave civil pública; e

  (5) atenda as demais disposições e procedimentos estabelecidos em legislação e/ou regulamentação
  específica.'
