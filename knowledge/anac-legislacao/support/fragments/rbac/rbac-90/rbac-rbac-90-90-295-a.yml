section_title: Uso de armas e munições embarcadas (tiro embarcado)
subsection_id: a
cite: 90.295(a)
title: 90.295(a)
text: (a) Para uso de armas e munições embarcadas (tiro embarcado) o órgão ou ente público
  deverá realizar o gerenciamento do risco de tal modo que os riscos à aeronave, aos tripulantes,
  às outras pessoas com função a bordo, aos passageiros, às pessoas e propriedades em solo
  encontrem-se dentro do NADSO, estabelecido na matriz de risco para a segurança operacional.
