section_title: Uso de armas e munições embarcadas (tiro embarcado)
subsection_id: i
cite: 90.295(i)
title: 90.295(i)
text: '(i) previamente coordenado com o piloto em comando da aeronave;

  (ii) em conformidade com os SOP e o MOP da UAP; e

  (iii) a tripulação e as outras pessoas com função a bordo estiverem devidamente treinadas
  para esta operação nos termos delineados pela UAP;

  (2) o atirador deverá utilizar os EPIs necessários à sua segurança; e

  (3) as armas longas utilizadas para disparos de dentro da aeronave deverão dispor de coletores
  ou defletores para as cápsulas de munição.'
