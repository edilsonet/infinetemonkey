id: rbac-rbac-90-90-3-a
kind: rbac
document: rbac-90
family: '90'
section_id: '90.3'
section_title: Definições e siglas
subsection_id: a
cite: 90.3(a)
title: 90.3(a)
text: '(a) São aplicáveis, a este Regulamento, as seguintes definições:

  (1)

  análise (

  analysis

  )

  : exame técnico de situação, procedimento, processo, com o propósito de avaliação e emissão
  de parecer;

  (2)

  análise de risco

  : exame para avaliação e ponderação de indicadores de risco com o propósito de mensurar
  situações de perigo em função de sua probabilidade e severidade, de forma qualitativa e/ou
  quantitativa;

  (3)

  área não cadastrada

  : local de pouso ou decolagem distinto de aeródromo cadastrado pela ANAC;

  (4)

  artigos perigosos

  : objetos ou substâncias capazes de representar risco à saúde, à segurança operacional,
  aos bens ou ao meio ambiente e que estejam presentes na lista de artigos perigosos estabelecida
  no RBAC nº 175 ou que sejam classificados de acordo com o RBAC nº 175;

  (5)

  avaliação (

  assessment

  )

  : parecer sobre os resultados de uma análise, com base em requisitos técnicos;

  (6)

  avaliação de risco

  : processo voltado à obtenção de resultados vinculados à análise de risco, com base em requisitos
  técnicos e empíricos;

  (7)

  categoria de aeronave

  : classificação de aeronaves para fins de habilitação, segundo o RBAC nº 61, que inclui:
  avião, helicóptero, dirigível, planador, balão livre ou aeronave de sustentação por potência;

  (8)

  centro de treinamento de aviação civil (CTAC)

  : pessoa jurídica certificada pela ANAC segundo o RBAC nº 142 para realização de treinamentos;

  (9)

  componente

  : parte da configuração ou constituição do SGSO;

  (10)

  componente curricular

  : elemento constituinte de um currículo de treinamento;

  (11)

  consequência

  : impacto real ou potencial de perigo, que poderá ser expresso qualitativamente ou quantitativamente;

  (12)

  controle de risco

  : atividades executadas com a finalidade de assegurar a política, o processo e os respectivos
  procedimentos de segurança operacional, para mitigação ou eliminação dos riscos de ocorrências
  aeronáuticas ou eventos de segurança operacional;

  (13)

  controlled flight into terrain

  (CFIT)

  : colisão ou quase colisão da aeronave, em voo controlado, contra o terreno, água ou obstáculo
  sem a indicação de perda de controle em voo, em condições IMC ou VMC;

  (14)

  corpo docente

  : grupo de instrutores responsável por ministrar instruções teóricas ou práticas segundo
  este Regulamento;

  (15)

  cultura de segurança operacional

  : conjunto de valores, normas e práticas de segurança operacional com caráter contínuo com
  fins à mitigação ou eliminação dos riscos de ocorrências aeronáuticas ou eventos de segurança
  operacional;

  (16)

  currículo de solo

  : conjunto de componentes curriculares necessários para realização da instrução teórica
  desenvolvida em sala de aula ou outro ambiente instrucional;

  (17)

  currículo de treinamento

  : conjunto de componentes curriculares de um treinamento específico, com as respectivas
  cargas horárias;

  (18)

  currículo de voo

  : conjunto de componentes necessários para realização da instrução prática conduzida a bordo
  de aeronave ou em FSTD;

  (19)

  desempenho (

  performance

  )

  : indicador que mensura o esforço empreendido na direção dos resultados a serem alcançados,
  e expresso em termos de efetividade, eficácia e eficiência;

  (20)

  desempenho de segurança operacional

  : resultado mensurável relativo à segurança operacional alcançado pela alocação de recursos
  no âmbito das atividades da UAP;

  (21)

  electronic flight bag

  (EFB)

  : sistema desenvolvido para uso em solo ou em voo que possibilita aos pilotos o armazenamento,
  a atualização e a visualização de documentos em formato digital, assim como a utilização
  de aplicativos direcionados à operação da aeronave e/ou planejamento do voo;

  (22)

  educação a distância (EAD)

  : modalidade educacional na qual a mediação didático-pedagógica nos processos de ensino
  e aprendizagem ocorre com a utilização de meios e tecnologias de informação e comunicação,
  com alunos e instrutores desenvolvendo atividades educativas em lugares e/ou tempos diversos;

  (23)

  elemento

  : cada uma das partes importantes e fundamentais de um componente do SGSO;

  (24)

  equipamento de proteção individual (EPI)

  : dispositivo ou produto de uso individual utilizado pelo trabalhador, destinado à proteção
  contra riscos à segurança e à saúde no trabalho;

  (25)

  evento de segurança operacional (ESO)

  : são acidentes, incidentes graves, incidentes, ocorrências de solo, ocorrências anormais
  ou qualquer situação de risco que tenha o potencial de causar dano ou lesão ou ameace a
  viabilidade da operação do órgão ou ente público;

  (26)

  garantia da segurança operacional

  : processo que tem por objetivo prover controle de riscos relativos à segurança operacional
  nas atividades da UAP. Este processo poderá revelar novos perigos, apontar a necessidade
  de novos controles de riscos, bem como eliminar ou modificar os controles de riscos existentes;

  (27)

  gerenciamento da segurança operacional

  : função organizacional de identificação e análise de perigos, bem como avaliação e controle
  de riscos inerentes às atividades da UAP;

  (28)

  gerenciamento de mudança

  : processo de avaliação dos resultados e dos impactos referentes a mudanças internas ou
  externas da UAP, com fins à manutenção do NADSO;

  (29)

  gerenciamento de risco à segurança operacional

  : processo que tem por objetivo a identificação e a implementação dos controles de riscos
  inerente à segurança operacional na UAP;

  (30)

  gestor da UAP

  : agente público designado pelo órgão ou ente público como responsável pela gestão da UAP;

  (31)

  gestor de segurança operacional (GSO)

  : agente público designado pelo órgão ou ente público como responsável pela gestão do SGSO;

  (32)

  gestor responsável do órgão ou ente público

  : pessoa responsável pela direção e controle do órgão ou ente público;

  (33)

  helibalde (

  helicopter bucket

  ou

  water bucket

  )

  : cesto acoplado ao helicóptero para dispersão de água e/ou retardante de fogo nas operações
  aéreas de combate a incêndios;

  (34)

  helocasting

  ou operação

  helocast

  : técnica de operação aérea que consiste no lançamento do operador aerotático, mergulhador
  ou profissional qualificado na água, com vistas à realização de operações aéreas especiais,
  incluindo salvamento aquático ou treinamento;

  (35)

  identificação de perigos

  : processo de reconhecimento e registro dos perigos inerentes às atividades de UAP que poderiam
  gerar uma ocorrência aeronáutica ou um evento de segurança operacional;

  (36)

  indicador de desempenho de segurança operacional

  : parâmetro de monitoramento e avaliação do desempenho da segurança operacional da UAP;

  (37)

  instrutor de comissários de voo

  : profissional responsável pela instrução teórica e/ou prática para os comissários de voo
  da UAP, segundo este Regulamento e os regramentos específicos;

  (38)

  instrutor de solo da UAP

  : profissional responsável pela instrução teórica, segundo este Regulamento;

  (39)

  instrutor de voo em aeronave

  : piloto qualificado, segundo este Regulamento, e responsável pelas instruções práticas
  realizadas em aeronave, conforme definido neste normativo. Pode ou não possuir a habilitação
  de instrutor de voo (INVA/H) emitida segundo o RBAC nº 61;

  (40)

  instrutor de voo em FSTD

  : piloto qualificado, segundo este Regulamento, e responsável pelas instruções práticas
  realizadas em FSTD, conforme definido neste normativo;

  (41)

  instrutor eventual

  : profissional apto a ministrar instrução teórica ou prática em virtude de necessidade temporária
  de excepcional interesse público, segundo este Regulamento;

  (42)

  instrutor NVIS

  : profissional apto a ministrar instruções NVIS, segundo este Regulamento;

  (43)

  jornada de trabalho

  : é a duração do trabalho do tripulante, nos termos da legislação e/ou regulamentação específica;

  (44)

  manual de operações (MOP)

  : é o instrumento administrativo que dispõe sobre a política, procedimentos, instruções,
  orientação e doutrina para o desenvolvimento das operações aéreas da UAP dentro do NADSO;

  (45)

  McGuire

  : técnica de operação aérea de carga externa que consiste na extração e transporte de carga
  viva (pessoas ou animais) em locais de difícil acesso por meio de corda suspensa e presa
  ao helicóptero;

  (46)

  membros da tripulação

  : piloto em comando, piloto segundo em comando, comissário de voo, instrutor de voo e examinador
  credenciado;

  (47)

  mestre de cargas

  : profissional qualificado com atribuição de acoplar ou desacoplar a carga, sinalização
  e/ou comunicação em solo, durante a operação de carga externa;

  (48)

  meta de desempenho de segurança operacional

  : parâmetro de segurança operacional a ser alcançado pela UAP em um intervalo temporal;

  (49)

  mitigação

  : intervenção com o objetivo de atenuar ou reduzir um determinado risco;

  (50)

  modelo de aeronave

  : família de aeronaves certificadas segundo um mesmo certificado de tipo, observado as diferenças
  estabelecidas no relatório de avaliação operacional ou nos OSD emitidos por uma autoridade
  de aviação civil. O modelo de aeronave não se refere às habilitações e certificados definidos
  no RBAC nº 61;

  (51)

  nível aceitável de desempenho da segurança operacional (NADSO)

  : referência mensurável do desempenho de segurança operacional do órgão ou ente público,
  proposto em seu SGSO como parte de seus objetivos de segurança operacional;

  (52)

  nível de voo (

  flight level

  ) - FL

  : superfície de pressão atmosférica constante, relacionada à uma determinada referência
  de pressão (1013,2 hPa / 29,92 inHg), e que está separada de outras superfícies análogas
  por determinados intervalos de pressão;

  (53)

  ocorrência com artigo perigoso

  : qualquer tipo de discrepância, incidente ou acidente com artigo perigoso, incluindo a
  descoberta de artigo perigoso não declarado;

  (54)

  óculos de visão noturna (NVG)

  : equipamento controlado e de uso restrito, segundo o Decreto nº 3.665/2000, de amplificação
  de luz, acoplado ao capacete de voo, que amplia o campo de visão no período noturno;

  (55)

  operação aérea NVIS

  : operação aérea de helicóptero realizada no período noturno e com auxílio do NVG;

  (56)

  operação

  fast rope

  : técnica de operação aérea de carga externa com descida de profissional do helicóptero
  ao solo por corda presa à aeronave e com a utilização do próprio corpo para o deslocamento
  vertical;

  (57)

  operações especiais de aviação pública

  : aquelas realizadas por órgãos e entes da administração pública, no exercício de suas atribuições
  estabelecidas em lei e segundo a seção 90.5, com aeronaves registradas na categoria civil
  pública e desempenhadas em consonância com este Regulamento;

  (58)

  operador aerotático

  : agente público que exerça as atividades de segurança e táticas específicas da UAP;

  (59)

  operador aerotático de segurança

  : operador aerotático, que permanece a bordo da aeronave, responsável pelos procedimentos
  de segurança da carga externa viva, tais como: operação de rapel, guincho, puçá,

  fast rope

  ou

  McGuire

  ;

  (60)

  operador de suporte médico

  : profissional da saúde capacitado com atribuições específicas a bordo e apto para a realização
  de operações aeromédicas, resgates, salvamentos e similares;

  (61)

  perigo

  : condição, objeto ou atividade propícia à ocorrência aeronáutica, evento de segurança operacional
  ou danos a pessoas e bens;

  (62)

  pessoal de transporte, apoio e suprimento aéreo (pessoal de TASA)

  : pessoal de solo da UAP que possui atribuições de suporte às atividades aéreas do órgão
  ou ente público;

  (63)

  piloto monitorando (

  pilot monitoring

  )

  : piloto em comando ou piloto segundo em comando no efetivo monitoramento das fases do voo,
  que exerce funções auxiliares ao piloto voando, segundo os SOP da UAP;

  (64)

  piloto voando (

  pilot flying

  )

  : piloto em comando ou piloto segundo em comando no efetivo controle da aeronave, por meio
  manual ou por meio do uso de automação, segundo os SOP da UAP;

  (65)

  plano de resposta a emergência (PRE)

  : plano organizacional para tratamento de situações de emergência ou risco com o propósito
  de assegurar a transição ordenada e eficiente de uma situação de operação normal para uma
  situação de operação em emergência e vice-versa;

  (66)

  política de segurança operacional

  : metas, diretrizes e objetivos referentes à segurança operacional definidos pela gestão
  do SGSO e aprovadas pelo gestor responsável do órgão ou ente público;

  (67)

  proativo

  : qualquer método que busca identificar preventivamente riscos à segurança operacional por
  meio da análise das atividades de uma organização, antes da ocorrência de um acidente, incidente
  ou outro evento adverso à segurança operacional;

  (68)

  probabilidade

  : possibilidade da ocorrência de um evento;

  (69)

  procedimentos operacionais padronizados (

  standard operating procedures

  ) - SOP

  : são publicações do sistema de manuais com instruções escritas para alcançar a uniformidade
  do desempenho da segurança operacional de uma função específica na UAP;

  (70)

  produtos biológicos

  : produtos derivados de organismos vivos que são fabricados e distribuídos para o tratamento,
  prevenção ou diagnóstico de doenças em seres humanos ou em animais, ou para o desenvolvimento,
  para experiências ou para fins de investigação relacionadas a essas doenças. Incluem-se
  (mas não se restringem a) produtos tais como: vacinas, soros e hemoderivados, sejam eles
  produtos acabados ou inacabados;

  (71)

  profissional de saúde embarcado (PSE)

  : profissional de saúde, distinto do operador de suporte médico, que em situações excepcionais
  é imprescindível à realização de operações aeromédicas para manutenção e/ou restauração
  da saúde do paciente;

  (72)

  promoção da segurança operacional

  : disseminação de cultura de segurança operacional; com a realização de treinamentos e adoção
  de incentivos à implementação e operação do SGSO;

  (73)

  puçá ou cesto de salvamento

  : cesto ou rede montada em estrutura cônica ou cilíndrica, acoplado ao helicóptero para
  remoção de pessoas ou animais na água ou locais de difícil acesso;

  (74)

  rapel

  : técnica de operação aérea de carga externa que consiste na descida de profissional qualificado
  por meio de corda presa ao helicóptero;

  (75)

  reativo

  : método de avaliação de riscos iniciado em resposta a uma ocorrência;

  (76)

  responsabilidade primária (

  accountability

  )

  : atribuições de um gestor da UAP pelas ações executadas diretamente por ele, por outras
  pessoas a ele subordinadas, ou por aqueles a quem ele tenha delegado responsabilidades quanto
  à execução de quaisquer atividades, para os propósitos específicos da segurança operacional;

  (77)

  retardante de fogo

  : agente químico que utilizado, sozinho ou misturado com água, reduz ou elimina a combustão
  de um determinado combustível;

  (78)

  risco

  : avaliação das consequências ou impactos de um perigo, expressos em termos de probabilidade
  e severidade estimadas;

  (79)

  segurança operacional

  : estado no qual os riscos inerentes às atividades da aviação civil são avaliados, controlados
  e mantidos em um NADSO;

  (80)

  severidade

  : extensão ou gravidade da perda ou dano associado às consequências de um perigo;

  (81)

  sistema de gerenciamento da segurança operacional (SGSO)

  : abordagem sistemática para a gestão da segurança operacional, incluindo as políticas,
  responsabilidades, estruturas organizacionais, processos e procedimentos da UAP;

  (82)

  sistema de imagem de visão noturna (

  night vision imaging systems

  ) - NVIS

  : conjunto de elementos requeridos e integrados para operação utilizando-se NVG;

  (83)

  sistema de manuais

  : é o conjunto de elementos doutrinários, estratégicos, metodológicos, técnicos, políticos,
  procedimentais e padronizados, definidos em publicações da UAP e fundamentais para preservação
  do desempenho da segurança operacional;

  (84)

  situações excepcionais

  : situações de caso fortuito ou força maior;

  (85)

  SOP do fabricante

  : publicação elaborada pelo fabricante de determinada aeronave contendo SOP recomendados;

  (86)

  substâncias infectantes

  : substâncias que contêm, ou que se espera que contenham agentes patogênicos;

  (87)

  tolerabilidade

  : índice que relaciona níveis de riscos avaliados e tomada de decisão quanto às condições
  para a manutenção do NADSO ou para a interrupção das atividades;

  (88)

  UN:

  número composto por quatro dígitos designado pelo Comitê de Especialistas em Transporte
  de Artigos Perigosos da Organização das Nações Unidas para identificar uma substância ou
  um grupo particular de substâncias;

  (89)

  Unidade Aérea Pública (UAP)

  : grupamento, batalhão, divisão, centro, coordenação, coordenadoria, núcleo ou unidade responsável
  pelas operações aéreas do órgão ou ente da administração pública;

  (90)

  virtual interactive procedural trainer

  (VIPT)

  : dispositivo de treinamento com estrutura

  stand-alone

  provida de monitores, assentos para pilotos, controles de voo simplificados e estação de
  operação do instrutor para treinamentos de procedimentos e de familiarização;

  (91)

  voo noturno assistido por NVG

  : voo com o NVG em posição de uso;

  (92)

  voo noturno não assistido por NVG

  : voo sem o auxílio do NVG; e

  (93)

  voo tático à baixa altura

  : operação aérea abaixo das alturas mínimas para voo sob VFR estabelecidas pelo DECEA.'
