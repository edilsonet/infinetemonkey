id: rbac-rbac-90-90-3-b
kind: rbac
document: rbac-90
family: '90'
section_id: '90.3'
section_title: Definições e siglas
subsection_id: b
cite: 90.3(b)
title: 90.3(b)
text: '(b) São aplicáveis, a este Regulamento, as seguintes abreviaturas e siglas:

  (1) AATD:

  advanced ATD

  (treinador de voo por instrumentos avançado)

  (2) AOM:

  aircraft operating manual

  (manual de operações da aeronave)

  (3) ARS: área restrita de segurança

  (4) ATD:

  aviation training device

  (treinador de voo por instrumentos)

  (5) ATZ:

  aerodrome traffic zone

  (6) AVGAS: gasolina de aviação

  (7) BATD:

  basic ATD

  (treinador de voo por instrumentos básico)

  (8) CA: certificado de aeronavegabilidade

  (9) CAT:

  clear air turbulence

  (10) CENIPA: Centro de Investigação e Prevenção de Acidentes Aeronáuticos

  (11) CFIT:

  controlled flight into terrain

  (12) CG: centro de gravidade

  (13) CIAC: centro de instrução de aviação civil

  (14) CIV: caderneta individual de voo

  (15) CMA: certificado médico aeronáutico

  (16) CNEN: comissão de energia nuclear

  (17) CRM:

  corporate resources management

  (gerenciamento de recursos de equipe)

  (18) CSO: comissão de segurança operacional

  (19) CTAC: centro de treinamento de aviação civil

  (20) CTR:

  control zone

  (21) CVA: certificado de verificação de aeronavegabilidade

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (22) DAA: dispositivo de abertura automática de paraquedas

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (23) DECEA: Departamento de Controle do Espaço Aéreo

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (24) EAD: educação a distância

  (25) EEDS:

  electra explosive devices

  (26) EFB:

  electronic flight bag

  (27) EPI: equipamento de proteção individual

  (28) EPU:

  external power unit

  (unidade de energia externa)

  (29) FFS:

  full flight simulator

  (simulador de voo)

  (30) FOD:

  foreign object damage

  (31) FOQA:

  flight operations quality assurance

  (32) FSTD:

  flight simulation training device

  (dispositivo de treinamento para simulação de voo)

  (33) FTD:

  flight training device

  (dispositivo de treinamento de voo)

  (34) GFS:

  graphical flight-deck simulator

  (35) GSO: gestor de segurança operacional

  (36) HTAWS:

  helicopter terrain awareness and warning system

  (37) HUD:

  heads-up displays

  (38) HUET:

  helicopter underwater egress training

  (39) ICA:

  instructions for continued airworthiness

  (instruções para aeronavegabilidade continuada)

  (40) IGE:

  in ground effect

  (com efeito solo)

  (41) IIMC:

  inadvertent entry into instrument meteorological conditions

  (entrada inadvertida, não planejada e não intencional em condições meteorológicas de voo
  por instrumentos);

  (42) IMC:

  instrument meteorological conditions

  (condições meteorológicas de voo por instrumentos);

  (43) INVA: instrutor de voo - avião

  (44) INVH: instrutor de voo - helicóptero

  (45) LOC:

  loss of control

  (46) LOFT:

  line-oriented flight training

  (47) LPQA/H: piloto lançador de paraquedista - avião/helicóptero

  (48) LTE:

  loss of tail rotor effectiveness

  (perda de eficiência do rotor de cauda de um helicóptero)

  (49) MGSO: manual de gerenciamento da segurança operacional

  (50) MMA: mecânico de manutenção aeronáutica

  (51) MOP: manual de operações

  (52) NADSO: nível aceitável de desempenho da segurança operacional

  (53) NVG:

  night vision goggles

  (óculos de visão noturna)

  (54) NVIS:

  night vision imaging system

  (sistema de imagem de visão noturna)

  (55) OGE:

  out of ground effect

  (fora do efeito solo)

  (56) OSD:

  operational suitability data

  (dados relevantes à operação)

  (Redação dada pela Resolução nº 740, de 16.04.2024)

  (57) PAGA/H: piloto agrícola - avião/helicóptero

  (58) PBN:

  performance-based navigation

  (navegação baseada em desempenho)

  (59) PCA/H: piloto comercial - avião/helicóptero

  (60) PCATD:

  personal computer based aviation training device

  (treinador de voo por instrumentos baseado em computador pessoal)

  (61) PED:

  portable electronic devices

  (dispositivos eletrônicos portáteis);

  (62) PLA/H: piloto de linha aérea - avião/helicóptero

  (63) PMD: peso máximo de decolagem (em kg ou lb)

  (64) PP: piloto privado

  (65) PRE: plano de resposta a emergência

  (66) PSE: profissional de saúde embarcado

  (67) QAV: querosene de aviação

  (68) QRH:

  quick reference handbook

  (69) RADALT:

  radar altimeter

  (radar altímetro)

  (70) RADHAZ:

  radiation hazard

  (71) RPA:

  remotely-piloted aircraft

  (aeronave remotamente pilotada)

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (72) RVSM:

  reduced vertical separation minimum

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (73) SGSO: sistema de gerenciamento da segurança operacional

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (74) SIPAER: Sistema de Investigação e Prevenção de Acidentes Aeronáuticos

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (75) SIT:

  systems integration training

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (76) SOP:

  standard operating procedures

  (procedimentos operacionais padronizados)

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (77)

  SPOT:

  special purpose operational training

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (78) SRM:

  single resources management

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (79) TASA: transporte, apoio e suprimento aéreo

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (80) TAWS:

  terrain awareness and warning system

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (81) TMA:

  terminal control area

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (82) UAP: Unidade Aérea Pública

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (83) UTEPAS: unidade de treinamento de escape para aeronaves submersas, ou unidade de HUET

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (84) VIPT:

  virtual interactive procedural trainer

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (85) VMC: v

  isual meteorological conditions

  (condições meteorológicas de voo visual)

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  (86) ZL: zona de lançamento de paraquedistas

  (Redação dada pela Resolução nº 695, de 09.11.2022)'
