section_title: Requisitos gerais para pouso ou decolagem em local não cadastrado pela ANAC
subsection_id: a
cite: 90.301(a)
title: 90.301(a)
text: '(a) Para os fins deste Regulamento, considera-se local não cadastrado pela ANAC:

  (1) o local que não possui cadastro da ANAC;

  (2) qualquer local em território ou mar territorial brasileiro utilizado para pouso e/ou
  decolagem para atendimento da missão aérea pública; e

  (3) qualquer local em território ou mar territorial brasileiro, dedicado à exposição estática
  da aeronave visando atender eventos programados.'
