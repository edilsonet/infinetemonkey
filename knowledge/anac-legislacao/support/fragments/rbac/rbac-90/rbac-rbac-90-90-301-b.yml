section_title: Requisitos gerais para pouso ou decolagem em local não cadastrado pela ANAC
subsection_id: b
cite: 90.301(b)
title: 90.301(b)
text: (b) As operações especiais de aviação pública com aviões deverão ser realizadas em aeródromos
  cadastrados pela ANAC, salvo se o pouso ou decolagem em local não cadastrado for estritamente
  necessário ao cumprimento da referida operação especial de aviação pública.
