section_title: Requisitos gerais para pouso ou decolagem em local não cadastrado pela ANAC
subsection_id: c
cite: 90.301(c)
title: 90.301(c)
text: (c) O requisito inicial para realização do pouso ou decolagem em local não cadastrado
  pela ANAC é que o controle do risco inerente à operação, incluindo a proteção das aeronaves,
  tripulação, outras pessoas com função a bordo, passageiros e terceiros, esteja dentro no
  NADSO.
