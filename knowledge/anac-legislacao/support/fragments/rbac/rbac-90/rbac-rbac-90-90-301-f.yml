section_title: Requisitos gerais para pouso ou decolagem em local não cadastrado pela ANAC
subsection_id: f
cite: 90.301(f)
title: 90.301(f)
text: '(f) São requisitos para decolagem ou pouso em locais não cadastrados pela ANAC:

  (1) que esteja sob VMC;

  (2) que o local possua as dimensões adequadas para o pouso e a decolagem seguros conforme
  envelope operacional da aeronave e o devido gerenciamento risco;

  (3) que haja uma avaliação quanto à inclinação e à natureza do terreno;

  (4) que as rotas de aproximação e de subida escolhidas minimizem a exposição da aeronave
  a fenômenos meteorológicos adversos;

  (5) que a capacidade de carga (estática e dinâmica) da superfície em que será realizado
  o pouso, possua resistência suficiente para permitir o pouso, estacionamento e/ou taxiamento
  no solo sem danos à aeronave, aos ocupantes e a terceiros;

  (6) que haja uma avaliação quanto ao risco de colisão dos rotores, hélices ou qualquer componente
  da aeronave com obstáculos, pessoas ou animais;

  (7) que a tripulação e outras pessoas com função a bordo estejam devidamente treinadas para
  este tipo de operação, incluídos os componentes curriculares para se evitar colisão com
  fios e obstáculos próximos ao solo;

  (8) que somente os envolvidos na operação estejam a bordo;

  (9) que a margem de potência disponível do motor esteja dentro dos limites do AFM, inclusive
  sob altas temperaturas, grandes altitudes e/ou com atmosfera turbulenta;

  (10) que os parâmetros de desempenho previstos no AFM ou AOM sejam mantidos dentro dos limites
  aprovados;

  (11) que haja uma avaliação quanto ao risco de colisão da aeronave com objetos soltos no
  terreno;

  (12) que seja realizado um

  briefing

  com os passageiros sobre os procedimentos normais e de emergência, bem como a orientação
  sobre a forma adequada de embarque e desembarque na aeronave, caso seja possível; e

  (13) que outros procedimentos definidos pela UAP sejam observados.'
