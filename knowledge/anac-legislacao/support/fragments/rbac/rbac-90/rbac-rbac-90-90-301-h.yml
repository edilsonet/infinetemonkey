cite: 90.301(h)
title: 90.301(h)
text: (h) A tripulação de voo deverá estabelecer, sempre que possível, rampas de aproximação
  e decolagem com áreas de pouso de emergência ou trajetórias livres para arremetida, para
  mitigação dos riscos na eventualidade de pouso forçado.
