title: 90.303(b)
text: '(b) É vedado o pouso ou a decolagem em locais não cadastrados pela ANAC no período
  noturno sem que as luzes de navegação e os faróis de pouso estejam em funcionamento.

  SUBPARTE V

  VOO TÁTICO À BAIXA ALTURA'
