section_title: Requisitos para exercício da função de operador aerotático
subsection_id: a
cite: 90.31(a)
title: 90.31(a)
text: '(a) São requisitos mínimos para exercício da função de operador aerotático:

  (1) ser agente público, segundo a UAP;

  (2) ter concluído o treinamento de operador aerotático, segundo a subparte N deste Regulamento;
  e

  (3) ser detentor de autorização médica que certifique sua aptidão psicofísica para exercício
  da referida função.'
