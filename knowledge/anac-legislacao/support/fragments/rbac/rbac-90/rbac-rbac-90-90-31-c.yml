section_title: Requisitos para exercício da função de operador aerotático
subsection_id: c
cite: 90.31(c)
title: 90.31(c)
text: '(c) Para operações aéreas com NVIS, o operador aerotático deverá:

  (1) cumprir com os requisitos previstos no parágrafo (a) desta seção;

  (2) ter concluído o treinamento NVIS, segundo a seção 90.265 deste Regulamento; e

  (3) possuir experiência em operações NVIS (horas de voo noturno assistido por NVG), conforme
  estabelecido pela UAP no MOP.'
