title: 90.311(b)
text: '(b) As operações aéreas previstas neste Regulamento deverão ser realizadas, prioritariamente,
  dentro dos limites mínimos de altura estabelecidos pelo RBAC nº 91 e pelo DECEA, salvo em
  procedimentos de pouso, decolagem, aproximação perdida ou para o atendimento da referida
  operação especial de aviação pública.

  (Redação dada pela Resolução nº 695, de 09.11.2022)'
