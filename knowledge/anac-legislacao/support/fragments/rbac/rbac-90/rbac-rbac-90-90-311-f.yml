text: '(f) São requisitos para a operação tática à baixa altura:

  (1) que esteja sob VMC;

  (2) que seja essencial ao cumprimento da missão pública;

  (3) que a tripulação e outras pessoas com função a bordo estejam devidamente treinadas para
  este tipo de operação, incluídos os componentes curriculares para se evitar colisão com
  fios e obstáculos próximos ao solo;

  (4) que haja uma avaliação do local da operação, a observar que:'
