text: '(h) A tripulação de voo deverá estabelecer, sempre que possível, áreas de pouso de
  emergência ou trajetórias livres para arremetida para mitigação dos riscos na eventualidade
  de pouso em emergência.

  SUBPARTE W

  LANÇAMENTO DE OBJETOS E OPERAÇÃO

  HELOCAST'
