cite: 90.311(i)
title: 90.311(i)
text: '(i) os terceiros no solo estão a uma altura e distância mínima de segurança; e

  (ii) os objetos soltos ou que possam se soltar no terreno da operação estejam a uma distância
  segura;

  (5) que o nível de tolerabilidade do risco da operação aérea esteja dentro do NADSO definido
  pela UAP;

  (6) que somente os envolvidos na operação estejam a bordo;

  (7) que esteja em conformidade com os SOP e o MOP da UAP;

  (8) que os parâmetros de desempenho da aeronave, incluído peso e balanceamento, sejam mantidos
  dentro dos limites durante todo o voo; e

  (9) que outros procedimentos definidos pela UAP sejam observados.'
