section_title: 'Lançamento de objetos: requisitos gerais'
subsection_id: c
cite: 90.321(c)
title: 90.321(c)
text: '(c) São requisitos para lançamento de objetos de aeronaves:

  (1) que esteja sob VMC;

  (2) que seja previamente coordenado com o piloto em comando;

  (3) que a tripulação e outras pessoas com função a bordo estejam aptas para este tipo de
  operação;

  (4) que somente os envolvidos na operação estejam a bordo;

  (5) que o risco de impacto com o rotor de cauda seja mitigado;

  (6) que haja uma avaliação quanto à natureza do terreno onde o objeto será lançado;

  (7) que a área em que o objeto será lançado possua as dimensões adequadas para mitigar erros
  de mira em decorrência da movimentação da aeronave;

  (8) que a área em que o objeto será lançado possua uma distância segura de terceiros, levando-se
  em consideração qualquer elemento, tais como árvores, estruturas ou vegetação alta, que
  possa de alguma forma ocultar a presença de terceiros;

  (9) que o objeto que será lançado possua o peso necessário para operação com segurança,
  e caso contrário, deverá ser acoplado um lastro ao objeto, para minimizar a possibilidade
  de movimentação e colisão com a fuselagem, motores, rotores e/ou qualquer estrutura da aeronave;

  (10) que sejam observadas as limitações da aeronave, segundo o AFM ou AOM;

  (11) que o CG da aeronave seja mantido dentro dos limites durante toda a operação;

  (12) que a porta de acesso à cabine do helicóptero tenha sido removida ou que o helicóptero
  disponha de porta deslizante conforme previsto no AFM. É vedado o lançamento de objetos
  com helicópteros que disponham de portas de acesso com dobradiças ou similares;

  (13) que o risco de impacto do rotor principal, rotor de cauda ou outra superfície da aeronave
  seja mitigado;

  (14) que os procedimentos operacionais, para este tipo de operação, estejam estabelecidos
  nos SOP e no MOP da UAP;

  (15) que o operador aerotático, responsável pelo lançamento, mantenha comunicação rádio
  direta com o piloto em comando;

  (16) que, ao final da missão, a referida operação seja registrada no diário de bordo da
  aeronave; e

  (17) que outros procedimentos definidos pela UAP sejam observados.'
