section_id: '90.323'
section_title: 'Lançamento de objetos: condições especiais para lançamento de geradores de
  fumaça e similares'
subsection_id: b
cite: 90.323(b)
title: 90.323(b)
text: (b) Caso ocorra falha na ignição, o gerador de fumaça não deverá ser trazido de volta
  à aeronave, mas lançado imediatamente. O piloto em comando deverá reportar a localização
  do objeto gerador de fumaça à autoridade competente o mais rápido possível, para permitir
  que o gerador seja recuperado e/ou destruído.
