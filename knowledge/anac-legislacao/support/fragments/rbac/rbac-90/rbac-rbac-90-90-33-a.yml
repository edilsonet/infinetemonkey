section_title: Requisitos para exercício da função de comissário de voo da UAP
subsection_id: a
cite: 90.33(a)
title: 90.33(a)
text: '(a) São requisitos mínimos para exercício da função de comissário de voo:

  (1) ser agente público, segundo a UAP;

  (2) ser detentor da licença de comissário de voo;

  (3) ser detentor da habilitação de categoria e tipo válida, segundo o RBHA 63 ou RBAC que
  venha a substituí-lo;

  (4) possuir CMA de 2ª Classe válido, segundo o RBAC nº 67; e

  (5) ter concluído o treinamento compatível com o estabelecido pelo fabricante da aeronave
  para a referida função, em conformidade com a subparte P deste Regulamento.'
