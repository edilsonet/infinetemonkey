title: 90.331(a)
text: '(a) Não obstante os requisitos previstos no parágrafo 91.102(e) do RBAC nº 91, é permitido
  o embarque e desembarque em voo pairado em aeronaves da UAP.

  (Redação dada pela Resolução nº 695, de 09.11.2022)'
