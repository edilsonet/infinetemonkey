section_title: Requisitos gerais para embarque ou desembarque no voo pairado
subsection_id: b
cite: 90.331(b)
title: 90.331(b)
text: (b) O requisito inicial para realização de embarque e desembarque no pairado é que o
  controle do risco inerente à operação, incluindo a proteção das aeronaves, tripulação, pessoas
  com função a bordo, passageiros e terceiros, esteja dentro do NADSO.
