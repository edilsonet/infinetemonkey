cite: 90.331(i)
title: 90.331(i)
text: '(i) possibilidade de realização do

  briefing

  de segurança com os envolvidos na operação aérea, sobre os procedimentos normais e de emergência
  da operação aérea, bem como a orientação sobre a forma adequada de ingresso e desembarque
  na aeronave, salvo os enfermos, inconscientes ou incapazes;

  (ii) definição da sequência de embarque ou desembarque;

  (iii) limitações quanto à abertura e fechamento das portas, bem como do voo com portas abertas
  ou removidas;

  (iv) procedimentos de segurança para livrar o local de embarque ou desembarque; e'
