section_title: Condições suplementares para realização do embarque ou desembarque no voo pairado
  noturno
subsection_id: a
cite: 90.333(a)
title: 90.333(a)
text: '(a) Caso seja necessária a realização de embarque ou desembarque no voo pairado no
  período noturno, os seguintes procedimentos deverão ser seguidos:

  (1) cumprir com todos os requisitos para embarque e desembarque estabelecidos para operação
  diurna e previstos na seção 90.331 deste Regulamento;

  (2) as operações aéreas realizadas fora dos limites da ATZ, CTR ou TMA, incluindo as projeções
  dos seus limites laterais, ou ainda, na inexistência desses espaços aéreos, as operações
  realizadas fora de um raio de 50 km (27 NM) do aeródromo de decolagem, somente serão permitidas
  se realizadas por helicópteros certificados para operação sob regras de voo por instrumentos
  - IFR;

  (3) utilizar as luzes externas do helicóptero para estabelecer e manter as alturas requeridas
  para o voo pairado, à exceção das operações com NVIS; e

  (4) utilizar as luzes de pouso ou de outro dispositivo visível com fins à sinalização para
  aproximação de passageiros para o início do embarque, à exceção das operações com NVIS.

  SUBPARTE Y

  PARAQUEDISMO'
