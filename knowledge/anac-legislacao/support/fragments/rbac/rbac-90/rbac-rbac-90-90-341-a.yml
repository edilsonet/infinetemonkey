title: 90.341(a)
text: (a) O requisito inicial para realização das operações de paraquedismo é que o controle
  do risco inerente à operação, incluindo a proteção das aeronaves, tripulação, pessoas com
  função a bordo, passageiros e terceiros, esteja dentro do NADSO.
