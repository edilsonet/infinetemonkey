cite: 90.341(f)
title: 90.341(f)
text: '(f) Cada membro da tripulação e cada pessoa com função a bordo deverá realizar a inspeção
  dos equipamentos necessários às operações de paraquedismos e sob sua responsabilidade, antes
  de cada utilização, a fim de verificar se características mínimas de segurança e proteção
  estão preservadas.

  (1) Caso exista alguma dúvida sobre a integridade dos referidos equipamentos, o item não
  deverá ser utilizado até ser inspecionado e, se necessário, substituído por um novo equipamento.'
