title: 90.341(h)
text: (h) A UAP poderá realizar operação de paraquedismo sobre eventos comemorativos e/ou
  programados desde que o controle do risco inerente à operação, incluso a proteção da aeronave,
  tripulação, pessoas com função a bordo e terceiros, esteja dentro do NADSO e observados
  os demais dispositivos legais cabíveis.
