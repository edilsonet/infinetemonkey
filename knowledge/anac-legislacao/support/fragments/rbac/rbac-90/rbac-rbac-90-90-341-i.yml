title: 90.341(i)
text: '(i) Nas atividades de paraquedismo realizadas em locais de eventos comemorativos e/ou
  programados é compulsória a presença de:

  (1) uma equipe em terra para apoio e primeiros socorros;

  (2) um indicador de vento (biruta); e

  (3) embarcação na água, caso seja realizado próximo a uma superfície líquida (lago, mar,
  rio, etc.).

  SUBPARTE Z

  OPERAÇÕES AÉREAS SOBRE EXTENSÕES DE ÁGUA'
