section_title: Requisitos para exercício da função de gestor da UAP
subsection_id: a
cite: 90.35(a)
title: 90.35(a)
text: '(a) São requisitos mínimos para exercício da função de gestor da UAP:

  (1) ser agente público, segundo a UAP;

  (2) possuir experiência nas operações especiais de aviação pública;

  (3) possuir competências relacionadas ao gerenciamento de risco e gestão da segurança para
  o exercício da referida função; e

  (4) outros requisitos a critério da UAP.'
