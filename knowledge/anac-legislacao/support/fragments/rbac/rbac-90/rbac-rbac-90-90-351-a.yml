cite: 90.351(a)
title: 90.351(a)
text: '(a) Para os efeitos deste Regulamento considera-se operação aérea sobre extensões de
  água aquela realizada a uma distância e altura onde:

  (1) em voo planado ou em regime autorrotacional, não será possível a realização de um pouso
  forçado em local adequado da costa ou margem mais próxima; ou

  (2) caso ocorra uma emergência durante as fases de decolagem ou pouso, será inevitável pouso
  de emergência na água (

  ditching

  ).'
