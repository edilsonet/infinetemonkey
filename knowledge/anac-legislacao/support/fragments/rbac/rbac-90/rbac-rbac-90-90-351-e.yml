text: '(e) São requisitos gerais para operações aéreas sobre extensões de água:

  (1) que a aeronave disponha de colete salva-vidas ou dispositivo de flutuação individual,
  equipados com um apito e uma luz de localização, para todos os membros da tripulação, pessoas
  com função a bordo e passageiros a bordo. As seguintes disposições se aplicam:'
