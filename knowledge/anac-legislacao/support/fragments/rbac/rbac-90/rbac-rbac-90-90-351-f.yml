text: '(f) São requisitos complementares para operações aéreas realizadas sobre extensões
  de água a uma distância superior a 100 NM ou 30 minutos da costa/margem mais próxima, tendo
  como referência a velocidade normal de cruzeiro da aeronave:

  (1) cumprir os requisitos previstos no parágrafo (e) desta seção;

  (2) que a aeronave disponha do número de botes salva-vidas adequado para acomodar todos
  os ocupantes. Os referidos botes salva-vidas deverão conter, no mínimo, os seguintes equipamentos:'
