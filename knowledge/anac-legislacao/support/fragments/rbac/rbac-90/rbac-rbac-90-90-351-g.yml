title: 90.351(g)
text: '(g) Os ocupantes da aeronave, salvo os inconscientes ou incapazes, deverão receber

  briefing

  de segurança do piloto em comando ou de membro da tripulação (ou pessoa com função a bordo)
  por ele designado, no mínimo nos seguintes assuntos:

  (1) os procedimentos para pouso e evacuação de emergência na água;

  (2) o local de armazenagem e a forma correta de vestir e inflar o colete salva-vidas;

  (3) o local de armazenagem e uso do conjunto de sobrevivência e do

  kit

  de primeiros socorros;

  (4) os procedimentos para evitar danos ao equipamento de flutuação; e

  (5) o local de armazenagem e os procedimentos para remover e inflar os botes salva-vidas,
  se aplicável.'
