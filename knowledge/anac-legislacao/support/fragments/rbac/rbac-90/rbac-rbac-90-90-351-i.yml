cite: 90.351(i)
title: 90.351(i)
text: '(i) para operações com helicópteros, os membros da tripulação e pessoas com função
  a bordo deverão trajar o colete salva-vidas ou dispositivo de flutuação individual durante
  todo o voo; e

  (ii) para operações com aviões, o colete salva-vidas ou dispositivo de flutuação individual
  deve estar acondicionado em local de fácil acesso, a partir do assento do ocupante na aeronave,
  inclusive quando o cinto de segurança estiver afivelado;

  (2) que os membros da tripulação e outras pessoas com função a bordo tenham concluído o
  currículo de treinamento específico para pouso e evacuação de emergência na água;

  (3) que tripulação e outras pessoas com função a bordo sejam qualificadas para sobrevivência
  no mar/água;

  (4) que o piloto em comando e o piloto segundo em comando tenham concluído o currículo de
  treinamento para evitar e para realizar a recuperação de IIMC;

  (5) que todos os ocupantes tenham recebido

  briefing

  de segurança de um dos membros da tripulação ou de pessoa com função a bordo;

  (6) que estejam sob VMC; e

  (7) outros procedimentos, a critério da UAP.'
