text: '(v) conjunto de dessalinização de água do mar ou 125 ml de água por tripulante ou pessoa
  com função a bordo;

  (vi)

  kit

  de primeiros socorros;

  (vii) conjunto de sobrevivência, preso a cada bote;

  (viii) meio de anexar um bote ao outro, se aplicável; e

  (ix) ELT no bote salva-vidas, conforme aplicável;

  (3) utilizar aeronave multimotora;

  (4) utilizar helicóptero equipado com flutuadores ou fuselagem tipo “casco” aprovado pela
  ANAC;

  (5) que a aeronave esteja equipada com RADALT com alerta sonoro de altura, TAWS ou HTAWS;
  e

  (6) outros procedimentos, a critério da UAP.'
