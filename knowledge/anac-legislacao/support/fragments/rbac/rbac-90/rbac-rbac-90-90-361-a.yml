title: 90.361(a)
text: '(a) Para os efeitos deste Regulamento considera-se que as aeronaves civis públicas
  se encontram com separação reduzida se a distância entre elas for inferior a:

  (1) 250 metros horizontalmente; ou

  (2) 500 pés verticalmente.'
