title: 90.361(b)
text: (b) Esta subparte não se aplica às aeronaves durante as fases de aproximação, decolagem,
  pouso ou taxiamento. Neste caso, a tripulação, as pessoas com função a bordo e a UAP deverão
  adotar os procedimentos necessários para manutenção de uma separação segura entre as aeronaves.
