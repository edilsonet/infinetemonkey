section_title: Requisitos para exercício da função do GSO
subsection_id: a
cite: 90.37(a)
title: 90.37(a)
text: '(a) São requisitos para o exercício da função de GSO:

  (1) ser agente público, estar designado e lotado na UAP;

  (2) possuir conhecimento dos princípios e práticas de gestão de segurança;

  (3) possuir conhecimento, experiência e domínio em técnicas de gerenciamento de risco e
  fatores humanos e organizacionais;

  (4) possuir experiência nas operações especiais de aviação pública, segundo este Regulamento;

  (5) possuir conhecimento operacional abrangente;

  (6) possuir habilidade interpessoal, analítica e de resolução de problemas;

  (7) dispor de habilidades para comunicação oral e escrita;

  (8) assegurar tempo específico para o cumprimento das atribuições inerentes à função de
  GSO; e

  (9) outros requisitos a critério da UAP.'
