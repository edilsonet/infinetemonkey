section_title: Categorias e classes aplicáveis às operações de helicóptero com carga externa
subsection_id: a
cite: 90.371(a)
title: 90.371(a)
text: '(a) Para os efeitos desta subparte considera-se operação aérea de helicóptero com carga
  externa:

  (1) o transporte de carga por meio de cordas, cabos ou equipamento externamente fixo ao
  helicóptero;

  (2) o transporte e/ou içamento de carga com guincho fixo ao helicóptero;

  (3) o transporte de água e/ou retardante de fogo em helibalde;

  (4) transporte/operação com carga externa viva, incluindo

  fast rope

  ,

  McGuire

  , guincho, rapel, puçá; ou

  (5) outras operações aéreas a critério da ANAC.'
