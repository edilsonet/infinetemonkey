section_title: Categorias e classes aplicáveis às operações de helicóptero com carga externa
subsection_id: c
cite: 90.371(c)
title: 90.371(c)
text: '(c) As operações aéreas de carga externa são categorizadas, em relação ao comprimento
  da corda/cabo, como:

  (1)

  short-line

  (corda curta): operação com utilização de corda ou cabo de comprimento inferior a 50 pés
  e que não seja capaz de atingir o rotor de cauda do helicóptero; e

  (2)

  long-line

  (corda longa): operação com utilização de corda ou cabo com comprimento igual ou superior
  a 50 pés ou, ainda, qualquer comprimento que seja maior que a distância compreendida entre
  o ponto de amarração da corda/cabo ao helicóptero e a extremidade da pá do rotor de cauda.'
