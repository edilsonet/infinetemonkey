title: 90.373(a)
text: (a) O requisito inicial para a realização de operação aérea de helicóptero com carga
  externa é que o controle do risco inerente à operação, incluindo a proteção das aeronaves,
  tripulação, pessoas com função a bordo, passageiros e terceiros, esteja dentro do NADSO.
