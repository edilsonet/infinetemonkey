text: '(b) São requisitos para operação aérea de helicóptero com carga externa:

  (1) estar sob VMC;

  (2) que a tripulação e outras pessoas com função a bordo sejam treinadas para este tipo
  de operação;

  (3) que somente os envolvidos na operação estejam a bordo;

