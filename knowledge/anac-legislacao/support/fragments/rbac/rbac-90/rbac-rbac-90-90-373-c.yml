cite: 90.373(c)
title: 90.373(c)
text: '(c) Os procedimentos operacionais para transporte de carga externa deverão ser estabelecidos
  nos SOP e no MOP da UAP e devem conter:

  (1) procedimentos normais, anormais e de emergências;

  (2) as limitações de peso, balanceamento e características físicas e aerodinâmicas da carga
  externa transportada;

  (3) uso adequado do EPI;

  (4) procedimentos para comunicação entre a tripulação (e outras pessoas com função a bordo)
  e os envolvidos no solo (rádio ou sinais manuais);

  (5) definição dos sinais manuais padronizados para manobras no solo e/ou em voo, conforme
  definido pela UAP;

  (6) cuidados especiais para transporte de artigos perigosos, se aplicável; e

  (7) outros definidos pela UAP.'
