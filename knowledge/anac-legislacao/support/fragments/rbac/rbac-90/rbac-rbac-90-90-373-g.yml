cite: 90.373(g)
title: 90.373(g)
text: (g) A UAP e o piloto em comando deverão estabelecer procedimentos de segurança e de
  velocidade máxima para operação com carga externa de baixa densidade e com massa inferior
  a 227 kg ou ainda com cargas de baixa densidade e grande volume no intuito de evitar grandes
  amplitudes dos movimentos oscilatórios da carga externa transportada e impacto com o rotor
  principal e/ou de cauda.
