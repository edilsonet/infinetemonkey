section_title: Condições suplementares para operações de carga externa no período noturno
subsection_id: a
cite: 90.377(a)
title: 90.377(a)
text: '(a) São requisitos para operação de helicóptero com carga externa no período noturno:

  (1) que se cumpra com os requisitos para a referida operação no período diurno, nos termos
  desta subparte;

  (2) que se mantenha referência visual com a carga externa transportada por meio de iluminação
  da própria aeronave, farol de busca, luzes externas no solo, etc.;

  (3) que se realize o gerenciamento do risco para livrar obstáculos no solo; e

  (4) que outros procedimentos definidos pela UAP sejam observados.'
