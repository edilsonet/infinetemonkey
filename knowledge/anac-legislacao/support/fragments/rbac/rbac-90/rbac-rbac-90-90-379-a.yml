cite: 90.379(a)
title: 90.379(a)
text: (a) Para os efeitos desta subparte considera-se operação de helicóptero com carga externa
  viva aquela onde pessoas e/ou animais estarão presas externamente à aeronave por cordas
  ou cabos fixados ao helicóptero.
