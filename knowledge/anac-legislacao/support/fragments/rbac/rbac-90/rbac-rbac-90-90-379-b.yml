section_title: Condições suplementares para operações de carga externa viva -
subsection_id: b
cite: 90.379(b)
title: 90.379(b)
text: '(b) São requisitos para operação aérea de helicóptero com carga externa viva:

  (1) cumprir com os requisitos para a referida operação no período diurno, nos termos desta
  subparte;

  (2) que a tripulação, outras pessoas com função a bordo e o profissional envolvido estejam
  treinados para este tipo de operação;

  (3) que a operação seja previamente coordenada e autorizada pelo piloto em comando;

  (4) caso realizado no período noturno, cumprir com os requisitos previstos na seção 90.377
  deste Regulamento;

  (5) utilizar de operadores aerotático, suporte médico ou aerotático de segurança aptos,
  segundo a seção 90.387 deste Regulamento;

  (6) utilizar corda ou cabo alijável pela tripulação ou outras pessoas com função a bordo;

  (7) que o risco de alijamento inadvertido da carga viva seja mitigado dentro da matriz de
  risco da segurança operacional;

  (8) que o operador aerotático de segurança permaneça a bordo durante toda a operação;

  (9) que o operador aerotático de segurança mantenha comunicação rádio com o piloto em comando;

  (10) operar em área de manobra segura;

  (11) que a corda utilizada no rapel tenha comprimento adicional no solo durante a operação
  ou que se disponha de procedimentos de segurança para evitar a queda do rapelista;

  (12) que a pessoa que será içada esteja adequadamente fixada ao sistema de segurança ou
  cinto de segurança antes de ser liberada ao cabo/corda;

  (13) realizar

  briefing

  com o passageiro sempre que possível, salvo os enfermos, inconscientes ou incapazes;

  (14) mitigar riscos relacionados ao impacto com linhas de pipa, se aplicável;

  (15) manter comunicação rádio entre o piloto em comando e o operador aerotático, conforme
  aplicável; e

  (16) outros procedimentos a critério da UAP.'
