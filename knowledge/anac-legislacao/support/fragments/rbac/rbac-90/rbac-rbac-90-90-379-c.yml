cite: 90.379(c)
title: 90.379(c)
text: '(c) Para operações de rapel,

  McGuire

  , guincho e puçá a tripulação operacional deverá dispor de pelo menos um operador aerotático
  de segurança a bordo do helicóptero que deverá:

  (1) encaminhar o profissional qualificado de maneira segura para início do rapel, conforme
  estabelecido nos SOP da UAP;

  (2) cumprir com os SOP definidos pela UAP;

  (3) observar o uso correto dos EPI e equipamentos de segurança antes do início da descida;

  (4) fornecer instruções de segurança aos operadores aerotáticos, operadores de suporte médico
  ou aos candidatos a essas funções, quando em treinamento;

  (5) manter comunicação rádio com o piloto em comando;

  (6) estabelecer a ordem de desembarque da aeronave no rapel, de forma a mitigar variações
  elevadas do CG da aeronave; e

  (7) observar outros procedimentos a critério da UAP.'
