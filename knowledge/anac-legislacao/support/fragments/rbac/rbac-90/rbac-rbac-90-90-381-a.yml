title: 90.381(a)
text: '(a) O requisito inicial para a realização de operação aérea

  fast rope

  é que o controle do risco inerente à operação, incluindo a proteção das aeronaves, tripulação,
  pessoas com função a bordo, passageiros e terceiros, esteja dentro do NADSO.'
