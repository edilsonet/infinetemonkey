title: 90.381(b)
text: '(b) São requisitos para operação

  fast rope

  :

  (1) estar em VMC;

  (2) que a tripulação, outras pessoas com função a bordo e o profissional envolvido estejam
  treinados para este tipo de operação;

  (3) que a operação seja previamente coordenada e autorizada pelo piloto em comando;

  (4) que o profissional envolvido na operação tenha realizado quantidade de descidas

  fast rope

  estabelecida pela UAP;

  (5) que os profissionais envolvidos na operação

  fast rope

  tenham a qualificação, capacidade física e treinamentos adequados à referida operação;

  (6) que somente os envolvidos na operação estejam a bordo;

  (7) que a altura máxima para início da descida

  fast rope

  não exceda 55 pés;

  (8) que a corda tenha comprimento adicional no solo, durante toda a operação;

  (9) que a UAP estabeleça o peso máximo do equipamento individual;

  (10) que a UAP estabeleça o peso máximo do profissional com o equipamento individual;

  (11) que o suporte de ancoragem da corda seja certificado pela ANAC e disponha de mecanismo
  de alijamento de emergência;

  (12) que a operação seja realizada em conformidade com os SOP e o MOP definido pela UAP;

  (13) que se observem as limitações do helicóptero, conforme AFM, a incluir:'
