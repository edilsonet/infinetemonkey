title: 90.381(e)
text: '(e) O operador aerotático de segurança deverá:

  (1) interromper a operação

  fast rope

  sempre que a segurança estiver comprometida; e

  (2) observar indícios de fadiga dos profissionais envolvidos e impedir que aqueles que os
  apresentem realizem a referida operação.'
