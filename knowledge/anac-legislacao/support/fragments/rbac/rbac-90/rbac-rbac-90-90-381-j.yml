cite: 90.381(j)
title: 90.381(j)
text: '(j) As operações

  fast rope

  no período noturno poderão ser realizadas nas seguintes condições:

  (1) que todos os requisitos estabelecidos nesta seção para operação

  fast rope

  no período diurno sejam cumpridos;

  (2) que o profissional tenha completado o treinamento progressivo segundo a seção 90.387
  deste Regulamento, no entanto, realizado no período noturno;

  (3) que o profissional, a tripulação e as outras pessoas com função a bordo tenham realizado
  treinamento específico para operação aérea NVIS;

  (4) que um bastão de luz química ou outro dispositivo luminescente esteja fixado à corda
  a uma distância que proporcione contato visual para o profissional que irá realizar a descida

  fast rope

  do local onde a corda está em contato com a superfície; e

  (5) que outros procedimentos definidos pela UAP sejam observados.'
