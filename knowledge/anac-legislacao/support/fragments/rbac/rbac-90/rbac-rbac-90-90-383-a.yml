section_title: Condições suplementares para transporte de artigos perigosos como carga externa
subsection_id: a
cite: 90.383(a)
title: 90.383(a)
text: (a) No transporte de artigos perigosos como carga externa, a UAP deverá realizar o gerenciamento
  do risco de tal modo que os riscos à aeronave, aos tripulantes, às pessoas com função a
  bordo, aos passageiros, às pessoas e propriedades em solo se encontrem dentro do NADSO.
