section_title: Condições suplementares para transporte de artigos perigosos como carga externa
subsection_id: c
cite: 90.383(c)
title: 90.383(c)
text: (c) É de responsabilidade do piloto em comando, pessoalmente ou por intermédio de tripulante
  (ou outra pessoa com função a bordo) por ele designado, a verificação de segurança, orientação
  e fiscalização quanto ao acondicionamento dos artigos perigosos transportados como carga
  externa.
