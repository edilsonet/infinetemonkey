section_title: Condições suplementares para transporte de artigos perigosos como carga externa
subsection_id: d
cite: 90.383(d)
title: 90.383(d)
text: (d) A UAP, a tripulação e outras pessoas com função a bordo deverão gerenciar e mitigar
  os riscos associados à eletricidade estática durante o processo de carregamento (engate
  ou desengate) da carga externa perigosa de natureza inflamável, explosiva ou ainda aqueles
  associados à radiação (RADHAZ), uma vez que as transmissões de rádio de alta frequência
  (HF) da aeronave podem afetar o acionamento elétrico de alguns explosivos (EEDS) ou ainda
  dos mecanismos de alguns armamentos.
