section_title: Condições suplementares para transporte de artigos perigosos como carga externa
subsection_id: e
cite: 90.383(e)
title: 90.383(e)
text: '(e) O transporte de artigos perigosos explosivos da classe 1 poderá ser realizado,
  como carga externa, desde que:

  (1) sejam obedecidos os requisitos para operação com carga externa segundo as seções 90.373,
  90.375 e/ou 90.377 deste Regulamento;

  (2) seja autorizado pelo piloto em comando da aeronave;

  (3) a tripulação e outras pessoas com função a bordo sejam qualificadas e treinadas pela
  UAP para o transporte de artigos perigosos;

  (4) o artigo perigoso esteja adequadamente embalado e acondicionado de forma segura;

  (5) sejam transportadas dentro de caixas fortes e resistentes ao fogo, contendo indicação
  de explosivo;

  (6) cumpram com os procedimentos de segurança e de emergência estabelecido no MOP e nos
  SOP;

  (7) possua um PRE para esta modalidade de operação;

  (8) os artigos perigosos estejam em condições adequadas para o transporte aéreo;

  (9) sejam armazenados e embalados de forma a evitar vazamentos e danos durante o transporte;

  (10) sejam protegidos contra ativação acidental;

  (11) sejam mantidos segregados dos demais artigos susceptíveis a reação que possa causar
  dano a aeronave, ocupantes e terceiros;

  (12) sejam observados os possíveis danos que possam decorrer de condições meteorológicas
  adversas, fluxo de ar do rotor principal do helicóptero e do vento relativo;

  (13) o piloto em comando tenha conhecimento de todos os aspectos do artigo perigoso transportado;

  (14) sejam mitigados os riscos associados à eletricidade estática durante o processo de
  carregamento (engate ou desengate) da referida carga externa;

  (15) sejam cumpridos os demais requisitos estabelecidos em legislação e/ou regulamentação
  específica, conforme aplicável; e

  (16) outros procedimentos definidos pela UAP sejam observados.'
