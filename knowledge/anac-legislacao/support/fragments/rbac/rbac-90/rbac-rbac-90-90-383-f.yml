section_title: Condições suplementares para transporte de artigos perigosos como carga externa
subsection_id: f
cite: 90.383(f)
title: 90.383(f)
text: '(f) O transporte dos artigos perigosos do tipo gases - classe 2, líquidos inflamáveis
  - classe 3, sólidos inflamáveis - classe 4, substâncias oxidantes e peróxidos orgânicos
  - classe 5, substâncias tóxicas e infectantes - classe 6, material radioativo - classe 7,
  substâncias corrosivas - classe 8 e substâncias ou artigos perigosos diversos - classe 9,
  como carga externa, poderá ser realizado desde que:

  (1) sejam obedecidos os requisitos para operação com carga externa segundo as Seções 90.373,
  90.375 e/ou 90.377 deste Regulamento;

  (2) seja autorizado pelo piloto em comando da aeronave;

  (3) o piloto em comando seja informado da natureza do artigo perigoso;

  (4) a tripulação e outras pessoas com função a bordo sejam qualificadas e treinadas pela
  UAP para o transporte de artigos perigosos;

  (5) os artigos estejam adequadamente embalados;

  (6) os artigos perigosos estejam em condições adequadas para o transporte aéreo;

  (7) haja um PRE para esta modalidade de operação;

  (8) cumpram com os procedimentos de segurança e de emergência para o transporte no MOP e
  nos SOP;

  (9) sejam mantidos segregados dos demais artigos susceptíveis de reação que possa causar
  dano a aeronave, ocupantes e terceiros;

  (10) sejam armazenados e embalados de forma a evitar vazamentos e danos durante o transporte;

  (11) o piloto em comando tenha conhecimento de todos os aspectos do artigo perigoso transportado;

  (12) sejam observados os possíveis danos que possam decorrer de condições meteorológicas
  adversas, fluxo de ar do rotor principal do helicóptero e do vento relativo;

  (13) sejam mitigados os riscos associados à eletricidade estática durante o processo de
  carregamento (engate ou desengate) da referida carga externa;

  (14) sejam mitigados os riscos associados ao referido transporte;

  (15) para o transporte de material radioativo, a UAP possua autorização expressa da CNEN;

  (16) sejam cumpridos os demais requisitos estabelecidos em legislação e/ou regulamentação
  específica, conforme aplicável; e

  (17) outros requisitos e procedimentos a critério da ANAC e/ou da UAP sejam observados.'
