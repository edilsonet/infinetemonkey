cite: 90.387(i)
title: 90.387(i)
text: '(i) O operador aerotático de segurança ou profissional responsável pelo treinamento

  McGuire

  ,

  fast rope

  , puçá, guincho e rapel deverá observar sinais de fadiga dos alunos que possam comprometer
  a proficiência para executar a referida operação. Em caso dúvidas, o referido aluno deverá
  ser impedido de realizar a referida operação.'
