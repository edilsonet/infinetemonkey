section_title: Treinamento especial para operação aérea de helicóptero com carga externa
subsection_id: j
cite: 90.387(j)
title: 90.387(j)
text: (j) A UAP deverá definir a carga horária para o treinamento especial de carga externa
  e a periodicidade do referido treinamento, observado o ambiente operacional da UAP, as competências
  necessárias ao profissional e o nível de tolerabilidade do risco à segurança operacional.
