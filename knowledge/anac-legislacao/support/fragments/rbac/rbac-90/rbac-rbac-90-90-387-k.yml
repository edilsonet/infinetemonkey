cite: 90.387(k)
title: 90.387(k)
text: '(k) O treinamento especial de carga externa para o piloto em comando e para o piloto
  segundo em comando será composto das seguintes etapas:

  (1) currículo de solo, segundo o parágrafo (l) desta seção;

  (2) currículo de voo, segundo o parágrafo (m) desta seção; e

  (3) avaliação teórica e prática da UAP, segundo o parágrafo (n) desta seção.'
