section_title: Treinamento especial para operação aérea de helicóptero com carga externa
subsection_id: l
cite: 90.387(l)
title: 90.387(l)
text: '(l) O currículo de solo do treinamento especial de carga externa será constituído,
  no mínimo, dos seguintes componentes curriculares:

  (1) verificações prévias às operações, incluindo a avaliação da área de voo;

  (2) método adequado de engate e desengate da carga externa;

  (3) desempenho da aeronave, sob as condições e limitações aprovadas;

  (4) procedimentos de peso e balanceamento;

  (5) AFM na combinação aeronave-carga;

  (6) disposições dos SOP e MOP;

  (7) equipamentos especiais para engate da carga;

  (8) amarração da carga;

  (9) inspeção, vistoria e certificação de todo o equipamento utilizado;

  (10) característica da carga e cuidados especiais;

  (11) características do ambiente da operação e o efeito da altitude densidade;

  (12) atribuições e responsabilidades da tripulação e de cada pessoa envolvida no cenário
  de operação;

  (13) procedimentos de comunicação normal, anormal, de emergência e em caso de falha na comunicação
  rádio;

  (14) gerenciamento de risco e manutenção do referido nível de tolerabilidade;

  (15) cuidados especiais, procedimentos normais, anormais e de emergência para operação com
  carga externa viva - rapel,

  McGuire

  , guincho,

  fast rope

  ou puçá, conforme aplicável;

  (16) sinais manuais padronizados para manobras no solo e/ou voo pairado, conforme definido
  pela UAP;

  (17) técnicas de pilotagem, incluindo a avaliação de controlabilidade da carga

  versus

  velocidade;

  (18) limitações de velocidade, de ângulo de inclinação em curva (

  banking turn

  ), etc., conforme aplicável;

  (19) técnicas para evitar e/ou neutralizar grandes amplitudes dos movimentos oscilatórios
  da carga externa transportada;

  (20) cuidados especiais para transporte de macas e artigos perigosos, conforme aplicável;
  e

  (21) outros assuntos a critério da UAP.'
