section_title: Treinamento especial para operação aérea de helicóptero com carga externa
subsection_id: m
cite: 90.387(m)
title: 90.387(m)
text: '(m) O currículo de voo do treinamento para operações com carga externa para piloto
  em comando e para piloto segundo em comando deverá ser composto pelas instruções práticas
  de:

  (1) decolagem, aproximação e pouso com carga externa;

  (2) controle direcional no voo pairado, inclusive em situações de ausência da referência
  visual vertical;

  (3) aceleração a partir de um voo pairado;

  (4) execução de manobras com carga externa, desde o engate à posição de soltura;

  (5) CRM;

  (6) procedimentos de engate e desengate da carga;

  (7) procedimentos normais e de emergência nas operações com carga externa;

  (8) procedimentos para evitar e/ou anular grandes amplitudes dos movimentos oscilatórios
  da carga externa transportada;

  (9) descida em rapel, guincho,

  McGuire

  ,

  fast rope

  e/ou puçá, conforme aplicável;

  (10) operação com guincho e suas limitações, se aplicável; e

  (11) outros procedimentos a critério da UAP.'
