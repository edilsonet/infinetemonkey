section_title: Treinamento especial para operação aérea de helicóptero com carga externa
subsection_id: n
cite: 90.387(n)
title: 90.387(n)
text: '(n) As avaliações teórica e prática do piloto em comando e piloto segundo em comando
  para operações de carga externa deverão ser realizadas conforme definidas pela UAP e deverão
  incluir, no mínimo:

  (1) limitações da aeronave;

  (2) cálculo de desempenho IGE e OGE;

  (3) decolagem e pouso com a carga externa acoplada;

  (4) controle direcional no voo pairado com carga externa acoplada, inclusive com ausência
  de referência visual vertical;

  (5) aceleração a partir do voo pairado com carga externa;

  (6) utilização adequada do dispositivo de elevação da carga, se aplicável;

  (7) manobrabilidade com carga externa (

  short-line

  e/ou

  long-line

  , conforme aplicável);

  (8) desengate e soltura da carga externa;

  (9) procedimentos de emergência com carga externa;

  (10) CRM;

  (11) procedimentos normais e de emergência para operação de rapel, guincho,

  McGuire

  ,

  fast rope

  e/ou puçá, conforme aplicável;

  (12) procedimentos de içamento da carga, conforme aplicável; e

  (13) outros assuntos ou procedimentos a critério da UAP.'
