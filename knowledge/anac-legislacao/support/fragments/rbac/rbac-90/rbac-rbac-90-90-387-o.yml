cite: 90.387(o)
title: 90.387(o)
text: '(o) O treinamento especial de rapel,

  McGuire

  , guincho,

  fast rope

  e puçá aos operadores aerotáticos, de suporte médico e demais envolvidos deverá ser realizado
  de forma progressiva, observadas as seguintes considerações:

  (1) abordar os conhecimentos teóricos descritos no parágrafo (l) desta seção;

  (2) os riscos associados ao referido treinamento devem estar dentro do NADSO da UAP;

  (3) todos os envolvidos deverão utilizar os EPI adequados;

  (4) os treinamentos deverão ser iniciados em solo, avançando para a realização de descidas
  mais baixas, para reduzir o risco de lesões, e em seguida para exercícios em altura maiores;

  (5) realizar treinamento de descida

  fast rope

  e rapel em plataforma fixa até que o profissional atinja a proficiência requerida para o
  treinamento em voo;

  (6) os equipamentos e armamentos deverão ser adicionados ao aluno de forma gradual durante
  o treinamento, observado o limite máximo, bem como deve-se observar se o aluno possui a
  proficiência técnica requerida para manter uma razão de descida em

  fast rope

  segura;

  (7) o local de desembarque do

  fast rope

  deverá ser incrementado de forma gradual e a critério e segurança da UAP; e

  (8) outros exercícios práticos a critério da UAP devem ser realizados para manutenção da
  segurança operacional.'
