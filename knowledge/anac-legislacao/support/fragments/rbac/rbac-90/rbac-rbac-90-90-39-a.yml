section_title: Requisitos para exercício da função de chefe de operações
subsection_id: a
cite: 90.39(a)
title: 90.39(a)
text: '(a) São requisitos para o exercício da função de chefe de operações:

  (1) ser agente público, estar designado e lotado na UAP;

  (2) possuir competências relacionadas ao gerenciamento de risco e gestão da segurança para
  exercício da função;

  (3) possuir experiência em operações especiais de aviação pública; e

  (4) outros requisitos a critério da UAP.'
