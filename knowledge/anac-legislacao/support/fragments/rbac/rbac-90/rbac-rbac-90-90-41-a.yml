subsection_id: a
cite: 90.41(a)
title: 90.41(a)
text: '(a) São requisitos mínimos para exercício da função de responsável pelo controle de
  manutenção das aeronaves, das UAP que não são detentoras do certificado de organização de
  manutenção de produto aeronáutico, segundo o RBAC nº 145:

  (1) ser agente público, segundo a UAP; e

  (2) outros requisitos a critério da UAP.'
