subsection_id: b
cite: 90.41(b)
title: 90.41(b)
text: (b) O responsável pelo controle técnico da manutenção das aeronaves das UAP detentoras
  do certificado de organização de manutenção de produto aeronáutico, segundo o RBAC nº 145,
  deve cumprir com o parágrafo (a) desta seção e atender aos demais requisitos previstos nos
  RBAC nº 145, RBAC nº 65 e regramentos correlatos.
