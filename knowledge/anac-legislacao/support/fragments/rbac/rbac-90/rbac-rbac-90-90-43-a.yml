section_title: Requisitos para exercício da função de operador de suporte médico
subsection_id: a
cite: 90.43(a)
title: 90.43(a)
text: '(a) São requisitos mínimos para exercício da função de operador de suporte médico:

  (1) ser profissional da saúde, segundo a legislação e/ou regulamentação específica;

  (2) ter concluído o treinamento para operador de suporte médico, segundo a subparte O deste
  Regulamento;

  (3) ser detentor de autorização médica que certifique sua condição psicofísica para exercício
  da referida função; e

  (4) cumprir com a legislação e/ou regulamentação específica.'
