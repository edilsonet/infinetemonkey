section_title: Requisitos para exercício da função de operador de suporte médico
subsection_id: b
cite: 90.43(b)
title: 90.43(b)
text: '(b) Para operações aéreas de carga externa viva (rapel, guincho, puçá,

  fast rope

  ou

  McGuire

  ) ou NVIS, o operador de suporte médico deverá:

  (1) cumprir com os requisitos previstos no parágrafo (a) desta seção; e

  (2) cumprir com o programa de treinamento referente ao tipo de operação que irá realizar
  a critério da UAP.'
