title: 90.45(i)
text: '(i) familiarização com o modelo de aeronave e das saídas de emergências;

  (ii) instruções sobre o uso do cinto de segurança ou outro dispositivo de amarração da tripulação,
  das pessoas com função a bordo e do paciente;

  (iii) procedimentos normais, anormais e de emergências;

  (iv) procedimentos para evacuação de emergência;'
