title: 90.45(x)
text: '(x) orientações sobre os equipamentos médicos embarcados, conforme aplicável;

  (xi) pouso na água e uso do equipamento de flutuação, conforme aplicável;

  (xii) aspectos fisiológicos relacionados ao voo, conforme aplicável;

  (xiii) procedimentos normais e de emergência para uso do oxigênio para voos realizados acima
  de 12.000 pés AGL, conforme aplicável; e

  (xiv) outras condições especiais julgadas pertinentes pela UAP.'
