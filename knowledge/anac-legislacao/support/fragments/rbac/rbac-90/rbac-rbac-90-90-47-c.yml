title: 90.47(c)
text: '(c) São requisitos específicos para exercício da função de examinador credenciado para
  concessão da licença de PLA/H:

  (1) cumprir com os requisitos previstos no parágrafo (b) desta seção; e

  (2) ser detentor de licença de PLA/H.'
