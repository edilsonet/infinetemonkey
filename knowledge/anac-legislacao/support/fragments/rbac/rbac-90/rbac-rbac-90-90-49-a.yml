cite: 90.49(a)
title: 90.49(a)
text: (a) A ANAC poderá credenciar pilotos remotos para realização dos exames de proficiência
  nas licenças e na respectiva habilitação para RPA, conforme modelo das aeronaves que compõem
  a frota da UAP, quando licença e habilitação forem requeridas pela ANAC.
