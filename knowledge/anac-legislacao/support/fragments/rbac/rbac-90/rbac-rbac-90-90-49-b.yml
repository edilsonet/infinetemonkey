section_title: Requisitos para exercício da função de examinador credenciado em RPA da UAP
subsection_id: b
cite: 90.49(b)
title: 90.49(b)
text: '(b) São requisitos mínimos para exercício da função de piloto examinador credenciado
  em RPA da UAP:

  (1) ser agente público, segundo a UAP;

  (2) ser detentor da licença de RPA com respectiva habilitação válida;

  (3) ter concluído o curso teórico de examinador credenciado ou equivalente aplicado a agentes
  públicos a serviço da ANAC, ministrado pela ANAC, nos últimos 48 (quarenta e oito) meses;

  (4) ter sido aprovado em exame de observação realizado pela ANAC, na função de examinador
  credenciado, nos últimos 48 (quarenta e oito) meses;

  (5) ser piloto remoto em comando no modelo de aeronave;

  (6) ter concluído, na função de piloto remoto em comando, o treinamento inicial ou periódico,
  previstos em regramento próprio da ANAC, conforme aplicável; e

  (7) ser detentor do CMA válido, segundo o RBAC nº 67 e RBAC-E nº 94.

  SUBPARTE D

  CONTROLE E REGISTRO DA DOCUMENTAÇÃO DOS TRIPULANTES DA UAP E DEMAIS FUNÇÕES A BORDO'
