section_title: Atribuições das unidades aéreas dos órgãos e entes públicos
subsection_id: b
cite: 90.5(b)
title: 90.5(b)
text: '(b) As atribuições dos órgãos e entes públicos alcançadas por este Regulamento são:

  (1) operações aéreas de segurança pública: destinadas à preservação da ordem pública, da
  incolumidade das pessoas e do patrimônio, proteção do meio ambiente e ações de defesa civil
  conforme estabelecido no art. 144 da Constituição da República Federativa do Brasil;

  (2) operações aéreas de segurança pública nacional: destinadas à preservação da ordem pública
  e da incolumidade das pessoas e do patrimônio, nas hipóteses previstas no Decreto nº 5.289/2004
  e na Lei nº 11.473/07, bem como no ato formal de adesão dos Estados e do Distrito Federal;

  (3) operações aéreas fazendárias e alfandegárias: destinadas a resguardar os interesses
  da fazenda nacional, bem como o controle e a fiscalização do comércio exterior, por meio
  de atividades de fiscalização federal, tributária e aduaneira estabelecidas em legislação
  e/ou regulamentação específica;

  (4) operações aéreas de urgência e emergência médica: destinadas ao atendimento à saúde,
  compreendendo resgate, salvamento e atendimento pré-hospitalar móvel, de caráter emergencial
  e urgente em consonância com legislação e/ou regulamentação específica;

  (5) operações aéreas de segurança viária: destinadas à preservação da ordem pública e da
  incolumidade das pessoas e do seu patrimônio no sistema viário público;

  (6) operações aéreas de proteção ao meio ambiente: destinadas a exercer o poder de polícia
  ambiental e a executar ações da política nacional de meio ambiente em consonância com a
  legislação ambiental vigente;

  (7) operações aéreas para preservação do patrimônio indígena: destinadas a exercer o poder
  de polícia nas áreas reservadas e nas matérias atinentes à proteção do índio, promover a
  prestação da assistência médico-sanitária aos índios, gerir o patrimônio indígena, estabelecer
  as diretrizes e garantir o cumprimento da política indigenista em consonância com a legislação
  e/ou regulamentação específica;

  (8) operações aéreas de fiscalização e regulação dos serviços públicos: destinadas a exercer
  as atividades de regulação e fiscalização relacionadas à prestação de serviços públicos
  em consonância com legislação e/ou regulamentação específica;

  (9) operações aéreas de promoção e proteção à saúde: destinada às atividades de saneamento,
  prevenção e controle de doenças e ações inerentes ao Subsistema Nacional de Vigilância em
  Saúde Ambiental em consonância com legislação e/ou regulamentação específica; e

  (10) operações aéreas para transporte e proteção de dignitários: destinada à execução do
  transporte aéreo e proteção de autoridades e seus acompanhantes, servidores públicos ou
  representantes oficiais.'
