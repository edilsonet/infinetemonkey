title: 90.5(c)
text: '(c) As UAP que realizam exclusivamente as operações aéreas para proteção de dignitários,
  nos termos do parágrafo (b)(10) desta seção, poderão conduzir a respectiva atividade em
  consonância com o RBAC nº 91, desde que autorizado pela UAP.

  (Redação dada pela Resolução nº 695, de 09.11.2022)'
