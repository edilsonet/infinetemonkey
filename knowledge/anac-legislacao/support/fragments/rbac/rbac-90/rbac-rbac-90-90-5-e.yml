cite: 90.5(e)
title: 90.5(e)
text: '(e) Nos casos de decretação de estado de alerta, emergência, sítio, calamidade pública,
  de defesa e intervenção federal, a UAP poderá requisitar ou contratar aeronaves, tripulantes
  e/ou outras pessosa com função a bordo para exercício de suas atribuições, de forma excepcional
  e por período determinado, devendo informar à ANAC o rol de aeronaves tripulantes e outras
  pessoas com função a bordo envolvidos nestas operações no prazo máximo de 10 (dez) dias,
  contados do término das operações.

  SUBPARTE B

  PESSOAL DE ADMINISTRAÇÃO REQUERIDO'
