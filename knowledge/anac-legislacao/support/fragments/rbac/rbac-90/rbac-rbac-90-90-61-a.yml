section_title: Controle de horas de voo dos pilotos da UAP
subsection_id: a
cite: 90.61(a)
title: 90.61(a)
text: (a) A UAP deverá realizar o controle, por meio de registro e declaração individual,
  das horas de voo dos pilotos nas operações especiais de aviação pública. O referido controle
  deverá ser definido no MOP.
