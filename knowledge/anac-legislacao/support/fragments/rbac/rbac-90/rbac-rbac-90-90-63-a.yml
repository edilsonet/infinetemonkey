cite: 90.63(a)
title: 90.63(a)
text: (a) A UAP deverá realizar o controle da validade das habilitações, certificados e treinamentos
  dos tripulantes envolvidos nas operações especiais de aviação pública, assim como das pessoas
  que executam as demais funções a bordo.
