section_title: Controle das licenças, habilitações e certificados dos tripulantes da UAP e
  demais funções a bordo
subsection_id: b
cite: 90.63(b)
title: 90.63(b)
text: (b) A UAP deverá adotar todas as providências para concessão e/ou revalidação de licenças,
  habilitações, autorizações e CMA dos tripulantes e das pessoas que executam as demais funções
  a bordo, nos termos da legislação e/ou regulamentação vigente.
