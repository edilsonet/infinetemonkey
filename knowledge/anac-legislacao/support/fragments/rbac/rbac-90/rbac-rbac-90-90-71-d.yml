cite: 90.71(d)
title: 90.71(d)
text: '(d) Cada membro da tripulação e cada pessoa com função a bordo deverá realizar a inspeção
  dos EPI antes de cada utilização, a fim de verificar se características mínimas de segurança
  e proteção estão preservadas.

  (1) O órgão deverá prover novos EPI, caso constatado que as condições mínimas de proteção
  e de segurança dos referidos equipamentos encontram-se comprometidas.

  (2) Caso exista alguma dúvida sobre a integridade dos EPI, o item não deverá ser utilizado
  até ser inspecionado e, se necessário, substituído por um novo equipamento.'
