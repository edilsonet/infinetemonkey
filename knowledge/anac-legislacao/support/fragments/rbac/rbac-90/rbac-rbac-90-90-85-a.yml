title: 90.85(a)
text: (a) As grandes alterações executadas em aeronaves que desempenham operações especiais
  de aviação pública deverão ser aprovadas pela ANAC em conformidade com os RBAC nº 21, RBAC
  nº 43 e demais normativos correlatos.
