title: 90.87(a)
text: '(a) As operações especiais de aviação pública deverão ser conduzidas por aeronaves
  com todos os equipamentos e instrumentos operantes, exceto se atendidos os requisitos para
  uso da MEL estabelecidos no RBAC nº 91.

  (Redação dada pela Resolução nº 695, de 09.11.2022)

  SUBPARTE G

  DOCUMENTOS OBRIGATÓRIOS A BORDO DAS AERONAVES CIVIS PÚBLICAS'
