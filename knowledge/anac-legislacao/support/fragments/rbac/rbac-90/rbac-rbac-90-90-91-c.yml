text: (c) O previsto no parágrafo (b) desta seção não isenta a responsabilidade do piloto
  em comando da aeronave quanto à verificação da documentação mínima e de sua validade e da
  verificação de que o peso e a distribuição do CG da aeronave carregada se encontram dentro
  dos limites permitidos.
