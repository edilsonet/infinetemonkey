cite: 91.1(a)
title: 91.1(a)
text: '(a) Este Regulamento se aplica e estabelece requisitos para:

  (1) a operação de qualquer aeronave civil dentro do Brasil, incluindo águas territoriais,
  bem

  como de aeronaves civis brasileiras no exterior (exceto balões cativos, aeronaves enquadradas
  no

  (2) cada pessoa, física ou jurídica, envolvida com operações aéreas conduzidas segundo este

  Regulamento, incluindo manutenção, manutenção preventiva e alterações de aeronaves.'
