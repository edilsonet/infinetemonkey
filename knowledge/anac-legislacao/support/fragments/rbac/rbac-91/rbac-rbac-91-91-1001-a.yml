cite: 91.1001(a)
title: 91.1001(a)
text: '(a) Em adição aos requisitos estabelecidos em outras subpartes deste Regulamento, esta
  Subparte

  estabelece requisitos aplicáveis a cotistas, sociedades ou associações de cotistas, e administradores

  dos programas de propriedade compartilhada regendo:

  (1) a provisão de serviços a terceiros de administração do programa em um programa de

  propriedade compartilhada;

  (2) a operação de uma aeronave de um programa de propriedade compartilhada em um

  programa de propriedade compartilhada; e

  (3) a operação de uma aeronave do programa incluída em um programa de propriedade

  compartilhada gerida por um coligado de um administrador de programa do qual o cotista faça
  parte.'
