title: 91.1001(b)
text: '(b) Para os efeitos desta Subparte:

  (1) coligado de um administrador de programa significa um administrador que, direta ou

  indiretamente, por meio de um ou mais intermediários, controla, é controlado por ou está
  sob controle

  comum de um outro administrador de programa. O detentor de pelo menos 40% da participação
  e

  40% do poder de voto de uma entidade possui o controle presumido para os fins de determinação
  de

  uma associação segundo esta Subparte;

  (2) troca de aeronave significa um acordo, documentado por um contrato escrito do programa,

  segundo o qual uma aeronave do programa torna-se disponível, conforme as necessidades, para
  cada

  cotista;

  (3) cotista ou proprietário significa um indivíduo ou entidade que possui pelo menos uma
  cota

  mínima em uma aeronave do programa, diretamente ou por intermédio de sociedades ou associações,

  e que tenha celebrado os contratos de programa aplicáveis. No caso das operações de voo
  descritas

  no parágrafo (b)(6)(ii) desta seção, e somente para os propósitos dos requisitos pertinentes
  àquelas

  operações, o cotista beneficiário da operação da aeronave é considerado um cotista no programa

  gerido pelo coligado;

  (4) cota significa a propriedade, o direito de propriedade, o direito de uso/posse, e/ou
  o direito

  de uso/posse conversível em direito de propriedade, de uma aeronave de um programa;

  (5) programa de propriedade compartilhada ou programa significa qualquer sistema de

  propriedade e troca de aeronave que contenha todos os seguintes elementos:'
