title: 91.1001(c)
text: '(c) Os requisitos desta Subparte referentes a um cotista ou a um administrador de um
  programa se

  aplicam, também, a qualquer pessoa que se engajar em uma operação regida por esta Subparte
  sem

  possuir as especificações administrativas requeridas por ela.'
