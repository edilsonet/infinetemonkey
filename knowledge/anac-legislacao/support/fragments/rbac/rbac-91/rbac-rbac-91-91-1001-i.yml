cite: 91.1001(i)
title: 91.1001(i)
text: '(i) uma aeronave na qual um cotista possua, diretamente ou por intermédio de sociedades
  ou

  associações de cotistas, direito a uma cota mínima e que tenha sido incluída em um acordo
  de troca

  de aeronave em conformidade com o contrato de administração do programa;

  (ii) no caso de um cotista de um programa operando uma aeronave em um programa

  diferente gerido por um coligado do administrador de programa desse cotista, uma aeronave:

  (A) incluída no programa gerido pelo coligado do administrador de programa do cotista

  operador; e

  (B) incluída no contrato de troca em conformidade com o contrato de administração de

  programa do programa do cotista operador; ou

  (iii) uma aeronave de cota total ou parcial do administrador de programa que tenha sido

  incluída no contrato de troca de aeronave e é utilizada para suplementar as operações do
  programa;

  (7) voo do programa de propriedade compartilhada ou voo do programa significa um voo

  segundo esta Subparte quando um ou mais passageiros ou bens designados por um cotista estiverem

  a bordo da aeronave;

  (8) serviços de administração do programa de propriedade compartilhada ou serviços de

  administração de programa significa os serviços administrativos e de suporte à aviação fornecidos

  em concordância com os requisitos aplicáveis desta Subparte ou providos pelo administrador
  de

  programa em nome dos cotistas, diretamente ou por intermédio de sociedades ou associações
  de

  cotistas, incluindo mas não se limitando:'
