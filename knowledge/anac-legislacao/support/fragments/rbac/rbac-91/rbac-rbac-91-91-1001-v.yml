title: 91.1001(v)
text: '(v) à manutenção das aeronaves do programa;

  (vi) ao atendimento aos requisitos de conservação de registros;

  (vii) ao desenvolvimento e utilização de um manual de procedimentos e operações do

  programa; e

  (viii) à solicitação e manutenção das especificações administrativas e de outras autorizações

  e aprovações;

  (9) administrador de um programa de propriedade compartilhada ou administrador de programa

  significa a entidade que oferece aos cotistas, diretamente ou por intermédio de sociedades
  ou

  associações de cotistas, serviços de administração para um programa de propriedade compartilhada
  e

  é designado em contratos de programa referenciados no parágrafo (b)(5)(vi) desta seção para
  atender

  a todos os requisitos dos RBAC aplicáveis ao administrador de programa ao qual pertence
  a aeronave


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  a ser operada. Quando um administrador de programa, em favor de um cotista, estiver operando
  uma

  aeronave em um programa gerido por um coligado do administrador de programa, as referências
  nesta

  Subparte às responsabilidades relacionadas ao voo do administrador de programa se aplicam,
  com

  respeito ao voo particular, ao coligado do administrador de programa do cotista ao invés
  do

  administrador de programa do cotista; e

  (10) cota mínima da propriedade compartilhada ou cota mínima significa:'
