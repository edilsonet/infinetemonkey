cite: 91.1003(b)
title: 91.1003(b)
text: '(b) proporcione ao cotista o direito de inspecionar e auditar, pessoalmente ou por
  meio de um

  representante legal, os registros do administrador de programa relativos à segurança operacional
  do

  programa e aqueles registros requeridos para demonstrar conformidade com as especificações

  administrativas e outras regras aplicáveis. Tais registros incluem, mas não são limitados
  às

  especificações, aprovações, manuais, log books e registros de manutenção mantidos pelo

  administrador de programa;'
