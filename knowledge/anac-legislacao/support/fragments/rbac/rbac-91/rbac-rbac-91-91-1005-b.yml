title: 91.1005(b)
text: '(b) Durante a validade dos contratos de administração dos programas dentro dos quais
  um cotista

  obteve uma cota mínima da propriedade compartilhada em uma aeronave do programa, as horas
  de

  voo utilizadas durante esse período pelo cotista em aeronave do programa não podem exceder
  o total

  de horas associadas com o número de cotas de sua propriedade.'
