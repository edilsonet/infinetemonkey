cite: 91.1005(c)
title: 91.1005(c)
text: '(c) Somente é permitido vender ou arrendar uma cota de propriedade de aeronave em um
  programa

  que seja menor do que aquela estabelecida no parágrafo 91.1001(b)(10) deste Regulamento
  se os voos


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  associados a essa cota forem operados segundo o RBAC nº 121 ou 135 e forem conduzidos por
  uma

  empresa aérea certificada segundo o RBAC nº 119.'
