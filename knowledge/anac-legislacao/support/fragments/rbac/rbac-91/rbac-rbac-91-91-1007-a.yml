section_title: Voos conduzidos segundo o RBAC nº 121 ou RBAC nº 135
subsection_id: a
cite: 91.1007(a)
title: 91.1007(a)
text: '(a) Exceto como previsto no parágrafo 91.501(b) deste Regulamento, o administrador
  de programa

  somente pode oferecer a um cotista um voo com uma aeronave que não seja uma aeronave do

  programa se esse voo for operado por um detentor de certificado emitido segundo o RBAC nº
  119 e

  em conformidade com o RBAC nº 121 ou 135, como aplicável.'
