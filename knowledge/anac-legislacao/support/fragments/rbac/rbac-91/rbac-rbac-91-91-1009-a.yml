title: 91.1009(a)
text: '(a) O controle operacional é sempre exercido pelo administrador de programa, que deverá
  constar

  como operador das aeronaves constantes do programa junto ao RAB, mesmo quando o voo estiver

  sendo realizado em benefício de um cotista.'
