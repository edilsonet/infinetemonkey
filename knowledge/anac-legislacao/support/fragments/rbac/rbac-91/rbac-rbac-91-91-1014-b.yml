section_title: Emissão ou indeferimento de especificações administrativas
subsection_id: b
cite: 91.1014(b)
title: 91.1014(b)
text: '(b) As especificações administrativas serão emitidas para o administrador de programa
  como

  representante dos cotistas se a ANAC considerar que o requerente:

  (1) atende aos requisitos aplicáveis desta Subparte; e

  (2) está própria e adequadamente equipado conforme os requisitos dos RBAC aplicáveis e é

  capaz de conduzir operações seguras segundo as apropriadas provisões deste Regulamento e
  as

  especificações administrativas emitidas segundo esta Subparte.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.'
