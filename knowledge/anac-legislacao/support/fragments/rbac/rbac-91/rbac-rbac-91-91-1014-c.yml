title: 91.1014(c)
text: '(c) Uma solicitação de especificações administrativas será indeferida se a ANAC verificar
  que o

  requerente não está própria e adequadamente equipado ou que não é capaz de conduzir operações

  seguras segundo este Regulamento.'
