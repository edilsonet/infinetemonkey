cite: 91.1015(a)
title: 91.1015(a)
text: '(a) Cada pessoa conduzindo operações segundo esta Subparte ou fornecendo serviços de

  administração de programa de propriedade compartilhada a cotistas deve fazê-lo de acordo
  com

  especificações administrativas emitidas pela ANAC segundo esta Subparte para o administrador
  de

  programa. As especificações administrativas incluirão:

  (1) uma lista atualizada de todos os cotistas e dos tipos de aeronaves operados;

  (2) as autorizações, limitações e outros procedimentos segundo os quais as operações devem

  ser conduzidas;

  (3) outros procedimentos segundo os quais cada classe e tamanho de aeronave deve ser operada;

  (4) [reservado];

  (5) [reservado];

  (6) a localização específica da base principal de operações do administrador de programa
  e, se

  diferente, o endereço que serve como ponto primário de contato para correspondência entre
  a ANAC

  e o administrador de programa e o nome e endereço postal do representante do administrador
  de

  programa;

  (7) a localização específica da base principal de manutenção do administrador de programa
  e

  as oficinas certificadas contratadas para fazer a manutenção das aeronaves do programa;

  (8) outros nomes comerciais que o administrador de programa pode usar;

  (9) [reservado];

  (10) as autorizações específicas ou decisões de isenção de cumprimento de requisito

  eventualmente concedidas; e

  (11) qualquer outra informação que a ANAC considere ser necessária.'
