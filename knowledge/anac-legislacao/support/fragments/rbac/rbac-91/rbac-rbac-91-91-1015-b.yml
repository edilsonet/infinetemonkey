cite: 91.1015(b)
title: 91.1015(b)
text: '(b) O administrador de programa pode manter uma lista atualizada de todos os cotistas
  requeridos

  pelo parágrafo (a)(1) desta seção em sua base principal de operações ou outro local aceito
  pela ANAC

  e referenciado em suas especificações administrativas. Cada administrador de programa deve
  manter

  sua lista de cotistas disponível para inspeções da ANAC.'
