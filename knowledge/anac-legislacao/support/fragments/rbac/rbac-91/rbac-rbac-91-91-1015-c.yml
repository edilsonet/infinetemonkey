title: 91.1015(c)
text: '(c) As especificações administrativas emitidas segundo esta Subparte são efetivas,
  salvo se:

  (1) elas forem emendadas conforme previsto na seção 91.1017 deste Regulamento; ou

  (2) elas forem suspensas ou revogadas pela ANAC.'
