cite: 91.1015(e)
title: 91.1015(e)
text: '(e) O administrador de programa deve manter em separado um conjunto completo de suas

  especificações administrativas em sua base principal de operações ou em outro local aprovado
  pela

  ANAC, e deve manter tais especificações à disposição dos servidores da ANAC e dos cotistas
  a quem

  o administrador de programa presta seus serviços para que sejam revistas e auditadas.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.'
