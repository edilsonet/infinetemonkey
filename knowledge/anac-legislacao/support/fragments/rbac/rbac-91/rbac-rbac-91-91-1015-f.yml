cite: 91.1015(f)
title: 91.1015(f)
text: '(f) Cada administrador de programa deve inserir no manual do programa extratos pertinentes
  de

  suas especificações administrativas ou referências às mesmas e deve:

  (1) identificar claramente cada extrato como parte das especificações administrativas; e

  (2) explicitar que a conformidade com cada requisito das especificações administrativas
  é

  mandatória.'
