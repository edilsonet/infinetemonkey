title: 91.1015(g)
text: '(g) Cada administrador de programa deve manter cada uma das pessoas a ele vinculadas
  e outras

  pessoas que executam tarefas de suporte para as suas operações informados das provisões
  de suas

  especificações administrativas aplicáveis aos deveres e responsabilidades dessas pessoas.'
