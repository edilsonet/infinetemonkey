section_title: Emendas às especificações administrativas do administrador de programa
subsection_id: a
cite: 91.1017(a)
title: 91.1017(a)
text: '(a) A ANAC pode emendar qualquer especificação administrativa emitida segundo esta
  Subparte

  se:

  (1) verificar que a emenda é necessária a fim de manter o nível aceitável de segurança

  operacional; ou

  (2) o administrador de programa requerer a emenda e a ANAC verificar que a emenda não afeta

  o nível aceitável de segurança operacional.'
