section_title: Emendas às especificações administrativas do administrador de programa
subsection_id: b
cite: 91.1017(b)
title: 91.1017(b)
text: '(b) Quando o administrador de programa requerer uma emenda às suas especificações

  administrativas, as seguintes disposições se aplicam:

  (1) o administrador de programa deve protocolar o requerimento de emenda às suas

  especificações administrativas com uma antecedência de, pelo menos, 45 dias antes da data
  para a

  emenda proposta tornar-se efetiva, exceto se a ANAC aceitar um prazo menor; e

  (2) o requerimento deve ser preenchido no formato e da maneira prevista pela ANAC.'
