section_title: Emendas às especificações administrativas do administrador de programa
subsection_id: c
cite: 91.1017(c)
title: 91.1017(c)
text: '(c) Quando um administrador de programa solicitar reconsideração da decisão da ANAC
  no que

  diz respeito a uma emenda às suas especificações administrativas, as seguintes disposições
  se

  aplicam:

  (1) o administrador de programa deve solicitar reconsideração da decisão até 30 (trinta)
  dias

  após receber a notificação da ANAC com relação ao indeferimento; e

  (2) o administrador de programa deve protocolar seu pedido de reconsideração na ANAC.'
