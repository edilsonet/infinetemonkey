section_title: Emendas às especificações administrativas do administrador de programa
subsection_id: d
cite: 91.1017(d)
title: 91.1017(d)
text: '(d) Se a ANAC emitir uma emenda às especificações administrativas, ela entrará em vigor
  em não

  menos de 30 (trinta) dias após o administrador de programa ser notificado sobre ela, exceto
  se a

  ANAC considerar que existe uma emergência que cause risco inaceitável à segurança operacional,

  que requer uma ação imediata. Neste caso a ANAC:

  (1) poderá tornar efetiva a emenda às especificações administrativas no dia em que o

  administrador de programa receber a notificação da ANAC; e

  (2) informará ao administrador de programa, na notificação, a condição de emergência ou
  de

  risco inaceitável à segurança operacional que levou a ANAC a determinar a adoção imediata
  da

  emenda às especificações administrativas.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.'
