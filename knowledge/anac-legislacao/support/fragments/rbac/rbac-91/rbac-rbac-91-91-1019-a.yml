title: 91.1019(a)
text: '(a) A qualquer tempo ou lugar a ANAC poderá realizar atividades de fiscalização para
  verificar a

  conformidade de um administrador de programa segundo esta Subparte às leis e regulamentos

  aplicáveis e às suas especificações administrativas.'
