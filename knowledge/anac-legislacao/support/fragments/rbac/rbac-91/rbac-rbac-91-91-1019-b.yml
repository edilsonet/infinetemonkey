section_title: Fiscalizações da ANAC
subsection_id: b
cite: 91.1019(b)
title: 91.1019(b)
text: '(b) O administrador de programa deve:

  (1) disponibilizar para a ANAC, na base principal de operações do administrador ou em outro

  local aprovado pela ANAC, suas especificações administrativas; e

  (2) permitir que a ANAC realize qualquer atividade de fiscalização para verificar a

  conformidade às leis e regulamentos aplicáveis e às suas especificações administrativas.'
