text: '(b) Os detentores de certificado possuidores de concessão ou autorização para prestação
  de

  serviços de transporte aéreo público devem cumprir, além dos requisitos estabelecidos neste

  Regulamento, os requisitos constantes dos regulamentos específicos, conforme aplicável.'
