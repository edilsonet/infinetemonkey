title: 91.102(c)
text: '(c) Somente pode dar partida nos motores ou taxiar uma aeronave:

  (1) um piloto habilitado na aeronave; ou

  (2) no caso de aviões, uma pessoa vinculada e autorizada por um operador certificado segundo

  o RBAC nº 119 ou organização de manutenção certificada segundo o RBAC nº 145 que atenda,

  adicionalmente, aos seguintes requisitos:'
