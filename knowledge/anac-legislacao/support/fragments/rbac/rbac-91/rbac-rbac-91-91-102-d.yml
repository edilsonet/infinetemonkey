title: 91.102(d)
text: '(d) Somente é permitido utilizar um aeródromo brasileiro se o aeródromo for cadastrado
  e o

  operador determinar que esse aeródromo é adequado para o tipo de aeronave envolvida e para
  a

  operação proposta.'
