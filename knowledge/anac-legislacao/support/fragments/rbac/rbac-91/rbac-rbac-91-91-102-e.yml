cite: 91.102(e)
title: 91.102(e)
text: '(e) O piloto em comando de uma aeronave somente pode permitir que passageiros embarquem
  ou

  desembarquem de sua aeronave com o(s) motor(es) em funcionamento se:

  (1) um piloto habilitado estiver no posto de pilotagem enquanto os rotores ou hélices estiverem

  girando;

  (2) no caso de um avião, sua geometria permitir que os passageiros possam utilizar uma porta

  convencional de embarque e desembarque sem se aproximarem perigosamente de hélices girando
  ou

  de correntes de exaustão de gases de combustão decorrentes de motor(es) em funcionamento;

  (3) no caso de um helicóptero, parar o(s) rotor(es) ou, se isso não for possível, o afastamento

  dos rotores for suficiente para permitir a passagem dos passageiros com margem de segurança;
  e

  (4) for feito um briefing com os passageiros abordando aspectos de segurança relativos às

  operações de embarque e desembarque enquanto as hélices ou rotores da aeronave estiverem
  em

  movimento; e


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (5) assumir a responsabilidade da operação e tomar as providências cabíveis para garantir
  a

  segurança.'
