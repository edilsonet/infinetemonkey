title: 91.102(g)
text: '(g) Somente é permitido autorizar o abastecimento de uma aeronave enquanto passageiros

  estiverem a bordo, embarcando ou desembarcando, se:

  (1) houver um procedimento aprovado e um tripulante de voo na cabine de pilotagem da

  aeronave supervisionando esse procedimento;

  (2) houver no mínimo 50% do número de comissários requeridos e/ou pessoas adequadamente

  treinadas para dirigir uma evacuação de emergência, bem como os meios de evacuação de emergência

  estiverem disponíveis;

  (3) os motores da aeronave estiverem desligados (desconsiderando APU), assim como os

  sistemas não necessários à operação; e

  (4) for possível a comunicação entre o pessoal de solo e o tripulante na cabine dos pilotos.'
