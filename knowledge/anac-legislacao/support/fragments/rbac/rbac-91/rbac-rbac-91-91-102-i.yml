cite: 91.102(i)
title: 91.102(i)
text: '(i) seja competente para dar partida nos motores ou taxiar o avião;

  (ii) seja qualificada no uso do equipamento de rádio-comunicação, se tal equipamento é

  requerido; e

  (iii) tenha recebido instrução de pessoa competente com relação ao leiaute do aeródromo
  e,

  quando apropriado, informações sobre pistas de taxi, sinalização, marcações, luzes, sinais
  e instruções

  do órgão de serviço de tráfego aéreo (órgão ATS), fraseologia e procedimentos, e seja capaz
  de

  cumprir as normas operacionais necessárias ao movimento seguro do avião no aeródromo.'
