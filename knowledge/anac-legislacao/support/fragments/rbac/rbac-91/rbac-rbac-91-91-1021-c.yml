section_title: Sistema de gerenciamento de segurança operacional (SGSO)
subsection_id: c
cite: 91.1021(c)
title: 91.1021(c)
text: '(c) O gestor responsável do administrador de programa deve implantar um SGSO compatível
  com

  o tamanho, natureza e complexidade das operações a serem conduzidas no programa, considerando

  suas especificações administrativas e os perigos e riscos relacionados com suas atividades.'
