cite: 91.1021(e)
title: 91.1021(e)
text: '(e) O gestor responsável deve garantir que todo o seu pessoal tenha fácil acesso à
  cópia mais

  atualizada das partes do MGSO relativas às suas funções, e que cada pessoa seja informada
  e

  orientada sobre quaisquer alterações ao MGSO aplicáveis às suas atividades.'
