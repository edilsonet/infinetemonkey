section_title: Sistema de gerenciamento de segurança operacional (SGSO)
subsection_id: g
cite: 91.1021(g)
title: 91.1021(g)
text: '(g) Registros do SGSO:

  (1) o administrador de programa deve registrar dados relevantes à segurança das operações
  do

  programa, e mantê-los armazenados por, no mínimo, cinco anos; e

  (2) o administrador de programa deve enviar à ANAC relatórios periódicos a respeito de suas

  operações e de seu SGSO, nos prazos e modelos definidos pela ANAC.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.'
