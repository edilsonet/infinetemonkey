section_title: Sistema de gerenciamento de segurança operacional (SGSO)
subsection_id: i
cite: 91.1021(i)
title: 91.1021(i)
text: '(i) responsabilidade e comprometimento da alta direção:

  (A) O administrador de programa deve definir uma política de segurança operacional que:

  ( 1 ) reflita o compromisso da alta direção com relação à segurança operacional,

  incluindo a promoção de uma cultura de segurança operacional positiva;

  ( 2 ) inclua uma declaração clara sobre o fornecimento e alocação dos recursos

  necessários para a implementação da política de segurança operacional;

  ( 3 ) inclua uma política para relatos de segurança operacional;

  ( 4 ) indique claramente quais são os tipos de comportamento considerados inaceitáveis

  pela organização, bem como as circunstâncias nas quais ações disciplinares não serão aplicadas;

  ( 5 ) seja devidamente aprovada e assinada pelo gestor responsável;

  ( 6 ) seja comunicada, com visível endosso da alta direção, por toda a organização; e

  ( 7 ) seja periodicamente revisada para garantir que permanece relevante e apropriada

  para a organização; e

  (B) O administrador de programa deve definir objetivos de segurança operacional

  considerando o estabelecido em sua política de segurança operacional. Os objetivos de segurança

  operacional devem:

  ( 1 ) estabelecer a referência para o monitoramento e medição do desempenho de

  segurança operacional previsto no parágrafo (b)(3) desta seção;

  ( 2 ) refletir o compromisso da alta direção em melhorar continuamente o desempenho

  global do SGSO da organização;

  ( 3 ) ser comunicados por toda a organização; e

  ( 4 ) ser periodicamente revisados para garantir que permanecem relevantes e

  apropriados para a organização;

  (ii) responsabilidade primária acerca da segurança operacional:

  (A) O administrador de programa deve:

  ( 1 ) identificar claramente o gestor responsável que, independentemente de outras

  funções, tenha a responsabilidade final e a obrigação de prestar contas, em nome da organização,
  pela

  implementação e manutenção de um SGSO efetivo;

  ( 2 ) definir claramente prerrogativas e responsabilidades sobre segurança operacional

  em toda a organização, incluindo prerrogativas e responsabilidades sobre segurança operacional
  da

  alta direção;

  ( 3 ) identificar as responsabilidades de todos os gestores, independentemente de outras

  funções, bem como de funcionários, em relação ao desempenho de segurança operacional;

  ( 4 ) documentar e comunicar as informações relativas às prerrogativas,

  responsabilidades e autoridades sobre segurança operacional de toda a organização; e

  ( 5 ) definir os níveis gerenciais com autoridade para tomar decisões em relação à

  tolerabilidade de riscos à segurança operacional;

  (iii) designação do pessoal-chave de segurança operacional:


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (A) O administrador de programa deve nomear um gerente de segurança operacional, que

  será o responsável pela implementação e manutenção do SGSO;

  (iv) coordenação do Plano de Resposta a Emergências (PRE):

  (A) O administrador de programa deve estabelecer e manter um plano de resposta a

  acidentes, incidentes e outras situações de emergência relacionadas às suas operações aéreas;
  e

  (B) O administrador de programa deve assegurar que seu plano de resposta à emergência

  seja adequadamente coordenado com os planos de resposta à emergência das organizações com
  quem

  interage durante a execução de suas operações; e'
