section_title: Requisitos do manual de operações do programa
subsection_id: a
cite: 91.1023(a)
title: 91.1023(a)
text: '(a) O administrador de programa deve preparar e e submeter à aceitação prévia da ANAC
  um

  manual de operações do programa estabelecendo políticas e procedimentos. Este manual deve
  ser

  utilizado pelo pessoal de voo, de solo e de manutenção do administrador de programa, na
  condução

  de suas operações. No entanto, a ANAC pode autorizar desvios deste parágrafo se for considerado

  que, em função do tamanho limitado das operações, o manual, ou parte dele, não é necessário
  para a

  orientação do pessoal de voo, de solo e de manutenção.

  (1) Cada revisão do manual de operações do programa deve ser submetida à aceitação prévia

  da ANAC, salvo aquelas dispensadas deste ato pelo manual já aceito.'
