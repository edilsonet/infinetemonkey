cite: 91.1023(c)
title: 91.1023(c)
text: '(c) O manual não pode contrariar nenhuma legislação ou regulamentação federal aplicável,

  nenhuma regulamentação estrangeira aplicável às operações em outros países, nem as especificações

  administrativas do administrador de programa.'
