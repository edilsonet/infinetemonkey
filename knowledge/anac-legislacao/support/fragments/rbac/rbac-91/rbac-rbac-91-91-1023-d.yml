section_title: Requisitos do manual de operações do programa
subsection_id: d
cite: 91.1023(d)
title: 91.1023(d)
text: '(d) Uma cópia do manual, ou partes apropriadas dele (com emendas e adições, se existentes),
  deve

  ser posta à disposição do pessoal de solo, de manutenção e de operações pelo administrador
  de

  programa, o qual deve fornecê-la, também, para:

  (1) seus tripulantes de voo; e

  (2) os servidores designados pela ANAC encarregados da fiscalização do administrador de

  programa.'
