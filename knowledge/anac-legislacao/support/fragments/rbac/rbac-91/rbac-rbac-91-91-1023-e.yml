cite: 91.1023(e)
title: 91.1023(e)
text: '(e) Cada pessoa vinculada ao administrador de programa a quem o manual ou partes dele
  foi

  distribuído nos termos do parágrafo (d)(1) desta seção deve mantê-lo atualizado com as emendas
  e

  adições fornecidas a ele. Adicionalmente:

  (1) cada pessoa vinculada ao administrador de programa trabalhando no solo deve manter sua

  cópia do manual em seu local de trabalho; e


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (2) o administrador de programa deve manter a bordo de suas aeronaves uma quantidade de

  manuais (ou de partes apropriadas dos mesmos) adequada ao número e funções de tripulantes
  a bordo.

  A atualização desses manuais é responsabilidade do administrador de programa.'
