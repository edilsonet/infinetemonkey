cite: 91.1023(f)
title: 91.1023(f)
text: '(f) Para os propósitos de conformidade com o parágrafo (d) desta seção, um administrador
  de

  programa pode fornecer às pessoas ali citadas parte do manual na forma impressa ou em outra
  forma,

  aceitável pela ANAC, que seja recuperável em língua portuguesa. Se o administrador de programa

  fornecer a parte de manutenção do manual em uma forma que não a impressa, ele deve se assegurar

  de que existe um dispositivo compatível de leitura, disponível para aquelas pessoas, que
  forneça

  imagens legíveis das instruções e informações de manutenção, ou um sistema que seja capaz
  de

  recuperar as instruções e informações de manutenção em língua portuguesa.

  (1) Para uso em voo de dispositivo eletrônico contendo parte do manual requerido a bordo,
  é

  requerida autorização específica da ANAC.'
