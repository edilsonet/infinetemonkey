title: 91.1023(g)
text: '(g) Se um administrador de programa conduzir inspeções ou manutenção de aeronaves em
  bases

  específicas onde ele mantém partes do manual com o programa de inspeções aprovado, ele não
  precisa

  transportar essas partes do manual a bordo de aeronaves em rota para essas bases.'
