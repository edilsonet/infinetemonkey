cite: 91.1023(j)
title: 91.1023(j)
text: '(j) Administradores dos programas que são também certificados para operar segundo os
  RBAC nº

  121 ou 135 podem ser autorizados a utilizar o manual de operações requerido por aqueles
  RBAC para

  atender aos requisitos de manual desta Subparte desde que:

  (1) as políticas e procedimentos sejam consistentes para ambas operações; ou

  (2) quando as políticas e procedimentos forem diferentes, políticas e procedimentos aplicáveis

  devem ser identificados e utilizados.'
