title: 91.1025(a)
text: '(a) nome de cada pessoa de administração requerida pela seção 91.1051 que seja autorizada
  a agir

  em nome do administrador de programa, os deveres, autoridade e área de responsabilidade
  designada

  para essa pessoa; o nome e o título de cada pessoa autorizada a exercer controle operacional
  conforme

  dispõe a seção 91.1009;'
