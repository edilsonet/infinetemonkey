title: Declaração de conformidade
text: '91.1026 Declaração de conformidade

  O administrador de programa deve elaborar e manter atualizada uma declaração de conformidade.

  Essa declaração de conformidade deve ser uma listagem completa de todas as seções e requisitos

  deste Regulamento, com o correspondente método de conformidade a ser adotado por ele ou
  uma

  indicação de que o requisito não lhe seja aplicável.'
