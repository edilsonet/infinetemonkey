section_title: Requisitos de conservação de registros
subsection_id: a
cite: 91.1027(a)
title: 91.1027(a)
text: '(a) O administrador de programa deve conservar em seu escritório principal de administração
  ou

  em outros locais aprovados pela ANAC, e colocar à disposição dos servidores designados da
  ANAC,

  o seguinte:

  (1) as especificações administrativas emitidas em seu nome;

  (2) uma listagem atualizada das aeronaves utilizadas ou disponíveis para uso em operações

  segundo esta Subparte, e as operações para as quais cada uma é equipada (por exemplo: NAT-HLA,

  RNP5/10, RVSM);

  (3) um registro individual de cada piloto utilizado em operações segundo esta Subparte,

  incluindo as seguintes informações:'
