cite: 91.1027(c)
title: 91.1027(c)
text: '(c) O administrador de programa é responsável pela preparação e precisão de um manifesto
  de

  carga em duas vias (ou por meios digitais) que contenha informações concernentes ao carregamento

  da aeronave. O manifesto deve ser preparado antes de cada decolagem, deve ser assinado pelo
  piloto

  em comando e deve incluir:

  (1) o número de passageiros;

  (2) o peso total da aeronave carregada;

  (3) o peso máximo de decolagem permitido para o voo;

  (4) os limites do centro de gravidade;

  (5) o centro de gravidade da aeronave carregada, exceto que o centro de gravidade real não

  precisa ser calculado se a aeronave for carregada de acordo com um planejamento de carregamento

  ou outro método aprovado que garanta que o centro de gravidade da aeronave carregada está
  dentro

  dos limites aprovados. Nesses casos deve ser feita uma anotação no manifesto indicando que
  o centro

  de gravidade está dentro dos limites conforme um planejamento de carregamento ou outro método

  aprovado;

  (6) a matrícula de registro da aeronave ou o número do voo;

  (7) a origem e o destino;

  (8) a identificação dos tripulantes e as suas designações; e

  (9) a data do voo.'
