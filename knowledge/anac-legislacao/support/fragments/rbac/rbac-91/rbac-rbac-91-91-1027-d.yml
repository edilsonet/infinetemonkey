section_title: Requisitos de conservação de registros
subsection_id: d
cite: 91.1027(d)
title: 91.1027(d)
text: '(d) O piloto em comando de uma aeronave deve ter consigo, até o destino do voo, uma
  via desse

  manifesto. Outra via do manifesto deve ser mantida em solo pelo menos até o final do voo,
  salvo se

  de outra forma aprovada pela ANAC. O administrador de programa deve conservar o original
  ou uma

  via do manifesto de carga, em sua base principal de operações ou em outro local aprovado
  pela

  ANAC, por, pelo menos, 90 (noventa) dias após a realização do voo.'
