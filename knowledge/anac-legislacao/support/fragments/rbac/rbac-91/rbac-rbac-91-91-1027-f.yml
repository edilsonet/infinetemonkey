cite: 91.1027(f)
title: 91.1027(f)
text: '(f) Caso o administrador de programa possua aprovação em suas especificações administrativas

  para elaboração de manifesto de carga por meio de EFB, a assinatura requerida no parágrafo
  (c) desta

  seção pode ser substituída por uma autenticação digital atribuída ao piloto em comando ou
  por sua

  assinatura no próprio dispositivo. Adicionalmente, a via requerida pelo parágrafo (d) desta
  seção pode

  ser enviada somente por meio eletrônico para a base do administrador de programa, devendo
  o piloto

  em comando se certificar de seu recebimento.'
