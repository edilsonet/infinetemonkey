section_title: Requisitos de conservação de registros
subsection_id: g
cite: 91.1027(g)
title: 91.1027(g)
text: '(g) Administradores dos programas que também são certificados para operar segundo o
  RBAC nº

  121 ou 135 podem atender aos requisitos desta seção e da seção 91.1113 deste Regulamento
  quanto

  a conservação de registros, com registros mantidos para atender plenamente os requisitos
  equivalentes

  do RBAC nº 121 ou 135.'
