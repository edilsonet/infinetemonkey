section_title: Requisitos de conservação de registros
subsection_id: v
cite: 91.1027(v)
title: 91.1027(v)
text: '(v) a data de emissão e a classe do CMA;

  (vi) a data e o resultado, incluindo as fichas de avaliação, de cada exame requerido por
  esta

  Subparte e, quando aplicável, o tipo de aeronave voada durante os exames;

  (vii) os registros de jornada de trabalho, o número de horas de voo do piloto e as extensões

  de jornada com detalhes suficientes para determinar conformidade com a Lei n° 13.475, de
  28 de

  agosto de 2017 (Lei do Aeronauta), as limitações de voo deste Regulamento e os limites operacionais

  do RBAC nº 117;

  (viii) o credenciamento como piloto examinador, se houver;

  (ix) qualquer ação tomada referente a dispensa da vinculação do piloto por desqualificação

  física ou profissional;'
