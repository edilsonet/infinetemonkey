section_title: Requisitos de conservação de registros
subsection_id: x
cite: 91.1027(x)
title: 91.1027(x)
text: '(x) a data de término da fase inicial e de cada fase periódica de treinamento requerida
  por

  esta Subparte; e

  (xi) certificados de conclusão em conformidade com o parágrafo 91.1073(c), além de fichas

  de instrução dos currículos de voo de cada tipo de treinamento aprovado (em aeronave, FSTD
  e/ou

  outro dispositivo de treinamento aprovado pela ANAC), com detalhamento suficiente para

  demonstrar o correto cumprimento do treinamento previsto e o seu resultado;

  (4) um registro individual para cada comissário de voo requerido por este Regulamento,

  incluindo registros de jornada de trabalho, número de horas de voo e extensões de jornada,
  conservado

  com detalhes suficientes para determinar conformidade com os requisitos aplicáveis deste

  Regulamento, da Lei n° 13.475, de 28 de agosto de 2017 (Lei do Aeronauta) e do RBAC nº 117;
  e

  (5) uma lista atualizada de todos os cotistas e aeronaves associadas. A lista, ou uma referência

  à sua localização, deve ser incluída nas especificações administrativas e deve conter detalhes

  suficientes para determinar a cota mínima de cada aeronave.'
