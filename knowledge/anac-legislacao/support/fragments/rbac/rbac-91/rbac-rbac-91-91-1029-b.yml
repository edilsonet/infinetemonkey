section_title: Requisitos de escala e de localização de voos
subsection_id: b
cite: 91.1029(b)
title: 91.1029(b)
text: '(b) Exceto como previsto no parágrafo (d) desta seção, o administrador de programa
  deve ter

  procedimentos estabelecidos para localizar cada um de seus voos de modo que:


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (1) forneça ao administrador de programa pelo menos as informações requeridas para um Plano

  de Voo (PLN) Visual;

  (2) permita fornecer, em tempo útil, notificação para uma estação de busca e salvamento
  se a

  aeronave estiver atrasada ou desaparecida; e

  (3) forneça para o administrador de programa a localidade, data e tempo estimado para

  restabelecer comunicações, se o voo estiver sendo operado em área onde as comunicações não
  podem

  ser mantidas.'
