title: 91.1029(d)
text: '(d) Os requisitos de localização de voo do parágrafo (b) desta seção não se aplicam
  a voos para os

  quais foi preenchido plano de voo se esse plano de voo for cancelado dentro de 25 milhas
  marítimas

  do aeródromo de destino.'
