title: 91.103(b)
text: '(b) as dimensões das pistas e a regularidade dos aeródromos a serem utilizados e as
  seguintes

  informações sobre distâncias de pouso e de decolagem:

  (1) para uma aeronave civil para a qual é requerido que o manual de voo aprovado contenha

  dados de distância de decolagem e de pouso, os dados de distâncias de decolagem e de pouso
  nele

  contidos; e

  (2) para uma aeronave civil não enquadrada no parágrafo (b)(1) desta seção, outras informações

  confiáveis, apropriadas à aeronave, relacionadas com seu desempenho conforme os valores

  conhecidos de altitude dos aeródromos, gradiente das pistas, peso bruto da aeronave, vento
  e

  temperatura; e'
