section_title: 'Piloto em comando ou segundo em comando: designação requerida'
subsection_id: a
cite: 91.1031(a)
title: 91.1031(a)
text: '(a) Cada administrador de programa deve designar:

  (1) um piloto em comando para cada voo do programa; e

  (2) um piloto segundo em comando para cada voo do programa que requeira dois pilotos.'
