cite: 91.1033(a)
title: 91.1033(a)
text: '(a) O administrador de programa deve, para todas as operações do programa, prover os
  seguintes

  documentos, em forma atualizada e apropriada, acessível ao piloto em seu posto de trabalho
  e de uso

  compulsório em voo:

  (1) uma lista de verificações da cabine dos pilotos;

  (2) para aeronaves multimotoras ou para aeronaves com trem de pouso retrátil, uma lista
  de

  verificações de emergência da cabine dos pilotos contendo os procedimentos requeridos pelo

  parágrafo (c) desta seção, como apropriado;

  (3) cartas aeronáuticas pertinentes; e

  (4) para operações IFR, carta de navegação em aerovias, cartas de áreas terminais, cartas
  de

  aproximação e de saída IFR e outros documentos pertinentes à operação.'
