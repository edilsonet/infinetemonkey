cite: 91.1035(a)
title: 91.1035(a)
text: '(a) Antes de cada decolagem o piloto em comando de uma aeronave transportando passageiros
  em

  um voo do programa deve assegurar-se que todos os passageiros receberam instruções verbais
  sobre:

  (1) fumo: cada passageiro deve ser instruído sobre quando, onde e sob quais condições é

  permitido fumar. Tal instrução deve esclarecer que os regulamentos da ANAC exigem que os

  passageiros atendam aos avisos luminosos e aos placares de não fumar, que os passageiros
  atendam

  às instruções pertinentes dos tripulantes e que é proibido fumar nos lavatórios;

  (2) uso de cintos de segurança, cintos de ombro e sistemas de retenção de crianças: cada

  passageiro deve ser instruído sobre quando, onde e sob que condições é necessário colocar
  e ajustar

  cintos de segurança e, se instalados, cintos de ombro e, se estiverem sendo transportadas
  crianças, o

  uso apropriado de sistemas de retenção de crianças, se disponíveis. Tal instrução deve esclarecer
  que

  os regulamentos da ANAC exigem que os passageiros atendam aos avisos luminosos e/ou às

  instruções dos tripulantes sobre tais itens;

  (3) colocação do encosto dos assentos na posição vertical antes da decolagem e do pouso;

  (4) localização e meios de abertura da porta de entrada de passageiros e das saídas de

  emergência;

  (5) localização dos equipamentos de sobrevivência;

  (6) procedimento para pouso na água e uso do equipamento de flutuação requerido pela seção'
