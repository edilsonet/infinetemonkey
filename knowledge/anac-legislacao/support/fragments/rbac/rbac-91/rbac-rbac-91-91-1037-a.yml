section_title: 'Grandes aviões categoria transporte com motores a turbina: limitações; aeródromos'
subsection_id: a
cite: 91.1037(a)
title: 91.1037(a)
text: '(a) No caso de um grande avião categoria transporte com motores a turbina, é vedado
  decolar com

  esse avião com um peso que (considerando o consumo normal de combustível e óleo durante
  o voo

  para o aeródromo de destino ou aeródromo de alternativa) leve o peso do avião, na chegada,
  a exceder

  o peso de pouso previsto no manual de voo do avião para a altitude do aeródromo de destino
  ou de

  alternativa na temperatura ambiente esperada no horário do pouso.'
