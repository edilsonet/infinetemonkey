section_title: 'Grandes aviões categoria transporte com motores a turbina: limitações; aeródromos'
subsection_id: b
cite: 91.1037(b)
title: 91.1037(b)
text: '(b) Exceto como previsto no parágrafo (c) desta seção, no caso de um grande avião categoria

  transporte com motores a turbina, somente é permitido decolar com esse avião se seu peso
  no destino,

  considerando consumo normal de combustível e óleo em rota e de acordo com os gráficos de
  distância

  de pouso do manual de voo do avião para a altitude e o vento esperado no aeródromo de destino,
  no

  horário estimado de pouso, permitir executar um pouso completo no aeródromo de destino dentro
  de

  60% do comprimento efetivo de cada uma das pistas descritas abaixo, considerando que o avião
  passa

  na altura de 15 m (50 pés) sobre a vertical do ponto de interseção do plano de liberação
  de obstáculos

  com a linha central da pista. Para o propósito de determinar o peso de pouso autorizado
  no aeródromo

  de destino, considera-se que o avião deve pousar:

  (1) na pista e no sentido mais favoráveis, considerando ar calmo; ou

  (2) na pista mais adequada, considerada a direção e a intensidade do vento previsto no horário

  estimado de pouso, as características de manobrabilidade no solo do tipo de avião e outras
  condições

  como auxílios de pouso e características do terreno.'
