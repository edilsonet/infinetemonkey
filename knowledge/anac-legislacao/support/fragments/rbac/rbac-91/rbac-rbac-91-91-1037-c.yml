section_title: 'Grandes aviões categoria transporte com motores a turbina: limitações; aeródromos'
subsection_id: c
cite: 91.1037(c)
title: 91.1037(c)
text: '(c) Um avião turboélice, que estaria proibido de decolar por não poder cumprir o parágrafo
  (b)(2)

  desta seção, poderá decolar se indicar um aeródromo de alternativa que atenda a todos os
  requisitos

  desta seção, exceto que o avião possa executar um pouso completo dentro de 70% do comprimento

  efetivo da pista.'
