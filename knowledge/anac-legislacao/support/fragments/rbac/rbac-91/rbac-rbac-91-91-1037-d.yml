section_title: 'Grandes aviões categoria transporte com motores a turbina: limitações; aeródromos'
subsection_id: d
cite: 91.1037(d)
title: 91.1037(d)
text: '(d) Somente é permitido indicar um aeródromo como aeródromo de alternativa para um
  grande

  avião categoria transporte com motores a turbina se (baseado no que é assumido no parágrafo
  (b)

  desta seção) esse avião, no peso esperado ao tempo da chegada, puder executar um pouso completo

  em 80% do comprimento efetivo da pista do aeródromo, sempre considerando que o avião passa
  a 15

  m (50 pés) acima do ponto em que o plano de liberação de obstáculos intercepta a linha central
  da

  pista.'
