cite: 91.1037(e)
title: 91.1037(e)
text: '(e) Somente é permitido decolar com um avião com motor a reação quando as informações
  e

  previsões meteorológicas indicarem que a pista do aeródromo de destino poderá estar molhada
  ou


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  escorregadia no horário estimado de pouso se o comprimento efetivo dessa pista no aeródromo
  de

  destino for pelo menos 115% do comprimento de pista requerido pelos parágrafos (b) ou (c)
  desta

  seção. No entanto, se for demonstrado, em condições reais, para um específico tipo e modelo
  de avião,

  que técnicas de pouso em pistas molhadas requerem distâncias menores (porém nunca inferiores

  àquelas requeridas pelo parágrafos (b) ou (c) desta seção) e se essas técnicas e distâncias
  forem

  aprovadas e incluídas no manual de voo do avião, a ANAC poderá autorizar operações de acordo

  com elas.'
