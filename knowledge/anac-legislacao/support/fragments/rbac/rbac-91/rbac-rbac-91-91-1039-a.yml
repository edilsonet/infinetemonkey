section_title: Decolagem IFR; mínimos de aproximação e de pouso
subsection_id: a
cite: 91.1039(a)
title: 91.1039(a)
text: '(a) Um piloto somente pode iniciar um procedimento de aproximação por instrumentos
  para um

  aeródromo se:

  (1) nesse aeródromo existir difusão das condições meteorológicas; e

  (2) a última informação meteorológica emitida segundo o parágrafo (a)(1) desta seção indicar

  que as condições atmosféricas estão nos mínimos ou acima dos mínimos para aproximação IFR

  aprovados para o aeródromo.'
