section_title: Decolagem IFR; mínimos de aproximação e de pouso
subsection_id: b
cite: 91.1039(b)
title: 91.1039(b)
text: '(b) Um piloto somente pode iniciar o segmento final de uma aproximação por instrumentos
  para

  um aeródromo se a última informação meteorológica emitida pelo órgão citado em (a)(1) desta
  seção

  indicar que as condições atmosféricas do aeródromo estão nos mínimos ou acima dos mínimos
  para

  aproximação IFR aprovados para ele.'
