text: '(c) Se o piloto já tiver iniciado o segmento final de uma aproximação por instrumentos,
  cumprindo

  o previsto pelo parágrafo (b) desta seção, e for informado de que as condições atmosféricas
  caíram

  abaixo dos mínimos, então o piloto pode continuar a aproximação e o pouso pode ser feito
  se as duas

  condições abaixo forem atendidas:

  (1) a informação meteorológica mais recente tiver sido recebida pelo piloto quando a aeronave

  estiver em uma das seguintes fases da aproximação:'
