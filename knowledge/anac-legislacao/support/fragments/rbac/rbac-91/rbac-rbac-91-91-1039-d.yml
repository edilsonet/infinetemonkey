title: 91.1039(d)
text: '(d) Para cada piloto em comando de um avião com motores a turbina que não tenha acumulado

  pelo menos 100 horas de tempo de voo como piloto em comando desse tipo de avião, as MDA
  ou


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  DA/DH e os mínimos de visibilidade estabelecidos nos procedimentos de aproximação por

  instrumentos devem ser acrescidos de 100 pés e 900m (½ milha), respectivamente, mas sem
  exceder

  os tetos e mínimos para o aeródromo quando utilizado como aeródromo de alternativa.'
