title: 91.1039(f)
text: '(f) Exceto se operando sob créditos concedidos segundo a seção 91.1717 deste Regulamento,
  se

  forem especificados mínimos para decolagem de um determinado aeródromo, um piloto não pode

  decolar IFR desse aeródromo quando as condições meteorológicas reportadas segundo o parágrafo'
