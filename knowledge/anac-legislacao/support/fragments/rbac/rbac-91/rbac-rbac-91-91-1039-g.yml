section_title: Decolagem IFR; mínimos de aproximação e de pouso
subsection_id: g
cite: 91.1039(g)
title: 91.1039(g)
text: '(g) Se não forem especificados mínimos para decolagem de um determinado aeródromo,
  o piloto

  não pode decolar IFR desse aeródromo quando as condições meteorológicas reportadas segundo
  o

  parágrafo (a)(1) desta seção estiverem abaixo dos mínimos gerais para IFR estabelecidos
  pelo

  DECEA.'
