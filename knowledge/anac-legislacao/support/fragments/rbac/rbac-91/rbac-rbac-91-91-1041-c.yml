section_title: Voos de avaliação operacional e testes de validação
subsection_id: c
cite: 91.1041(c)
title: 91.1041(c)
text: '(c) O administrador de programa não pode transportar passageiros em uma aeronave durante
  os

  voos de avaliação operacional, exceto aqueles necessários à avaliação e aqueles designados
  pela

  ANAC para observar a avaliação. No entanto, é autorizado o treinamento de pilotos nesses
  voos.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.'
