title: 91.1041(f)
text: '(f) Testes de validação devem ser realizados por métodos aceitáveis pela ANAC. Voos
  reais podem

  não ser exigidos quando o requerente puder demonstrar competência e conformidade com a

  regulamentação adequada, sem realização do voo.'
