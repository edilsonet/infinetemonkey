cite: 91.1045(a)
title: 91.1045(a)
text: '(a) aviões tendo uma configuração aprovada para passageiros com mais de 30 assentos,
  excluindo

  qualquer assento para tripulantes, ou uma capacidade de carga paga superior a 3400 kg (7500
  libras):

  (1) um gravador de voz na cabine como requerido pela seção 121.359 do RBAC nº 121, como

  aplicável para aviões especificados naquela seção;

  (2) um gravador de dados de voo como requerido pela seção 121.343 ou 121.344 do RBAC nº

  121, como aplicável aos aviões especificados naquela seção;

  (3) um sistema de percepção e alarme de proximidade do solo como requerido pela seção

  121.354 do RBAC nº 121, como aplicável aos aviões especificados naquela seção;

  (4) [reservado]; e

  (5) um radar meteorológico de bordo como requerido pela seção 121.357 do RBAC nº 121,

  como aplicável aos aviões especificados naquela seção;


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.'
