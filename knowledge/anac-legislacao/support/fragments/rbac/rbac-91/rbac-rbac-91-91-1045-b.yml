cite: 91.1045(b)
title: 91.1045(b)
text: '(b) aviões tendo uma configuração aprovada para passageiros de 30 assentos ou menos,
  excluindo

  qualquer assento para tripulantes, e capacidade de carga paga de 3400 kg (7500 libras) ou
  menos, e

  qualquer helicóptero (como aplicável):

  (1) um gravador de voz na cabine como requerido pela seção 135.151 do RBAC nº 135, como

  aplicável às aeronaves especificadas naquela seção;

  (2) um gravador de dados de voo como requerido pela seção 135.152 e 135.152a do RBAC nº

  135, como aplicável às aeronaves especificadas naquela seção;

  (3) um sistema de percepção e alarme de proximidade do solo como requerido pela seção

  135.154 do RBAC nº 135, como aplicável às aeronaves especificadas naquela seção;

  (4) [reservado]; e

  (5) como aplicável às aeronaves especificadas nas respectivas seções:'
