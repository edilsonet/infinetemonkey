cite: 91.1047(a)
title: 91.1047(a)
text: '(a) Cada administrador de programa deve prover a cada uma das pessoas a ele vinculada

  desempenhando atividades de risco à segurança operacional (ARSO), em qualquer das funções

  listadas no parágrafo 120.1(b) do RBAC nº 120, informações sobre o uso indevido de substâncias

  psicoativas.'
