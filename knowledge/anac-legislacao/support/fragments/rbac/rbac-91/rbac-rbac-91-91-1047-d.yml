title: 91.1047(d)
text: '(d) Se uma aeronave do programa for operada em um voo do programa em um aeródromo no
  qual

  não esteja disponível pessoal de manutenção sujeito aos requisitos dos parágrafos (a) e
  (b) desta seção

  e uma manutenção de emergência for necessária, o administrador de programa pode utilizar
  pessoas

  que não atendam aos requisitos dos parágrafos (a) e (b) desta seção para prover essa manutenção
  sob

  as seguintes condições:

  (1) o administrador de programa deve notificar a ANAC em até 10 (dez) dias após a ocorrência;

  e

  (2) a aeronave deve ser reinspecionada pelo pessoal de manutenção que atenda aos requisitos

  dos parágrafos (a) e (b) desta seção no próximo aeródromo onde tal pessoal de manutenção
  estiver

  disponível.'
