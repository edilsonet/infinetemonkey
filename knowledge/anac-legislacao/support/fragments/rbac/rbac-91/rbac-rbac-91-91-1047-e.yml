cite: 91.1047(e)
title: 91.1047(e)
text: '(e) Para os propósitos desta seção, manutenção de emergência significa aquela manutenção
  que:

  (1) não esteja programada; e

  (2) se faz necessária por uma condição da aeronave não conhecida antes da decolagem para

  aquela localização.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.'
