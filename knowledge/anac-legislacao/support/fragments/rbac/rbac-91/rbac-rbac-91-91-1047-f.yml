title: 91.1047(f)
text: '(f) Ressalvado o parágrafo (a) desta seção, um programa de educação para a prevenção
  do risco

  associado ao uso indevido de substâncias psicoativas conduzido de acordo com o RBAC nº 120
  pode

  ser utilizado para satisfazer os requisitos expostos nos parágrafos (a) e (b) desta seção.'
