title: 91.1049(a)
text: '(a) O administrador de programa deve utilizar nas operações do programa e nas aeronaves
  do

  programa tripulantes que atendam o disposto na seção 91.1053 deste Regulamento. O administrador

  de programa deve manter supervisão sobre esses tripulantes.'
