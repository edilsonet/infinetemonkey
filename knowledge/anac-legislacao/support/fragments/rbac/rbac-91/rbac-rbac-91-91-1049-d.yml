cite: 91.1049(d)
title: 91.1049(d)
text: '(d) Em uma operação do programa, a tripulação deve consistir de pelo menos dois pilotos

  habilitados vinculados ao administrador de programa nas seguintes situações:

  (1) se a operação requerer dois pilotos segundo as seções 91.5 ou 91.531 deste regulamento;

  (2) se a aeronave tiver uma configuração aprovada para passageiros de 10 ou mais assentos,

  excluindo os assentos para pilotos;

  (3) em voos IFR com passageiros a bordo, exceto como previsto nos parágrafos (f) e (g) desta

  seção; ou

  (4) em operações categoria II.'
