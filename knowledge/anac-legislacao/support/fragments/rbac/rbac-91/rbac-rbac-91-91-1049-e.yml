title: 91.1049(e)
text: '(e) O administrador de programa deve assegurar-se de que haja pessoal treinado e qualificado
  em

  serviço, disponível, para programar ou liberar voos durante as horas em que a aeronave do
  programa

  estiver disponível para operações do programa.'
