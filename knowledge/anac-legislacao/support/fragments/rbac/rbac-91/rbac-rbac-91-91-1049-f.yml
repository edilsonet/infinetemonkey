cite: 91.1049(f)
title: 91.1049(f)
text: '(f) Ressalvado o disposto nos parágrafos (d)(2) e (d)(4) desta seção, e exceto se forem
  necessários

  dois pilotos requeridos por este regulamento para operações VFR, uma pessoa pode operar
  uma

  aeronave segundo esta Subparte que esteja equipada com um sistema de piloto automático aprovado

  em funcionamento, sem um segundo em comando, desde que sua utilização esteja autorizada.'
