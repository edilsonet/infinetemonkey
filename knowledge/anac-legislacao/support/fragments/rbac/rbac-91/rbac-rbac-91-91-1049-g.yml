cite: 91.1049(g)
title: 91.1049(g)
text: '(g) A ANAC pode emitir especificações administrativas autorizando o uso de um sistema
  de piloto

  automático em lugar de um piloto segundo em comando, se:

  (1) o piloto automático for capaz de operar os controles da aeronave para mantê-la em voo
  e

  manobrá-la nos três eixos de voo (longitudinal, transversal e vertical); e

  (2) o administrador de programa demonstrar, de forma satisfatória à ANAC, que a operação

  utilizando o sistema de piloto automático pode ser conduzida com segurança e em conformidade
  com

  este regulamento.'
