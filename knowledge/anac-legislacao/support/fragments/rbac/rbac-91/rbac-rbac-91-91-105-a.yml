section_title: Posto de trabalho de tripulantes de voo
subsection_id: a
cite: 91.105(a)
title: 91.105(a)
text: '(a) Durante decolagens, pousos e em rota, cada tripulante de voo requerido deve:

  (1) estar em seu posto de trabalho, salvo se, enquanto em rota, sua ausência for necessária
  para

  o desempenho de atribuições ligadas à operação da aeronave ou em função de suas necessidades

  fisiológicas; e

  (2) manter o cinto de segurança ajustado enquanto em seu posto de trabalho.'
