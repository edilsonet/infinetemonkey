section_title: Posto de trabalho de tripulantes de voo
subsection_id: b
cite: 91.105(b)
title: 91.105(b)
text: '(b) Cada tripulante de voo de uma aeronave civil brasileira deve, durante decolagens
  e pousos,

  manter os cintos de ombro colocados e ajustados enquanto em seu posto de trabalho. Este
  parágrafo

  não se aplica:

  (1) a aeronaves cujos assentos dos tripulantes de voo não requerem cintos de ombro; ou

  (2) a aeronaves cujos cintos de ombro dos assentos dos tripulantes de voo não permitem que

  seus ocupantes realizem suas tarefas com o cinto de ombro ajustado.'
