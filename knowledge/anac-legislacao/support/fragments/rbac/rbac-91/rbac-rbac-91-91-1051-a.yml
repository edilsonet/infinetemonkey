cite: 91.1051(a)
title: 91.1051(a)
text: '(a) O administrador de programa deve contar com uma estrutura de administração que
  lhe permita

  o controle de todos os níveis da organização por meio de pessoas que possuam a formação,
  a

  experiência e as qualificações necessárias para garantir a segurança das operações.'
