cite: 91.1051(b)
title: 91.1051(b)
text: '(b) O administrador de programa deve contar, pelo menos, com o seguinte pessoal de

  administração:


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (1) um gestor responsável;

  (2) um diretor ou gerente de operações;

  (3) um gerente de segurança operacional; e

  (4) um diretor ou gerente de manutenção.'
