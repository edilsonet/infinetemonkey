section_title: Pessoal de administração requerido
subsection_id: j
cite: 91.1051(j)
title: 91.1051(j)
text: '(j) O administrador de programa deve, mediante determinação da ANAC, no prazo de 30
  (trinta)

  dias, extensível pela ANAC por igual período, substituir qualquer pessoa que ocupe uma função

  prevista no parágrafo (b) desta seção e que possua comprovado histórico de conduta e/ou
  desempenho

  inadequados, conforme os critérios do parágrafo (h) desta seção.'
