title: 91.1051(k)
text: '(k) Caso ocorra a vacância de algum dos cargos previstos no parágrafo (b) desta seção,
  o

  administrador de programa deve comunicar o fato à ANAC em até 5 (cinco) dias corridos,

  providenciar a substituição em até 60 (sessenta) dias corridos, bem como realizar o gerenciamento
  de

  risco relacionado à gestão da mudança.'
