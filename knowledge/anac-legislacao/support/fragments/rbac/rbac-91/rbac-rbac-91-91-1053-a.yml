section_title: Qualificações para piloto
subsection_id: a
cite: 91.1053(a)
title: 91.1053(a)
text: '(a) O administrador de programa somente pode utilizar uma pessoa e uma pessoa somente
  pode

  trabalhar como piloto em comando em operações do programa transportando passageiros nas
  quais

  seja utilizado um avião a reação ou um avião possuindo uma configuração aprovada para passageiros,

  excluído qualquer assento para tripulante, igual ou superior a 10 assentos, se essa pessoa
  possuir uma

  licença de piloto de linha aérea na categoria avião, habilitação IFR e habilitação classe
  ou tipo,

  conforme aplicável, todas válidas.'
