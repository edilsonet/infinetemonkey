cite: 91.1053(d)
title: 91.1053(d)
text: '(d) O parágrafo (b)(3) desta seção não se aplica se:

  (1) o avião utilizado for monomotor, com motor convencional;

  (2) [reservado];

  (3) a área de operações, como especificada na especificação administrativa do administrador
  de

  programa, for uma área na qual o meio primário de navegação é a navegação por contato, com

  auxílios-rádio à navegação distantes entre si, inexistentes ou impróprios para uso de aeronaves

  voando em baixas altitudes, e onde o meio primário de transporte é pelo ar;

  (4) cada voo for conduzido em condições VMC, durante o período diurno;

  (5) a distância de cada voo, desde a base do administrador de programa até qualquer destino,

  não ultrapassar 300 NM, exceto se for possível manter contato-rádio com órgãos ATS ou ATC
  a cada

  hora de voo, para fins de acompanhamento da operação; e

  (6) o tipo de operação estabelecido por este parágrafo for autorizado na especificação

  administrativa do administrador de programa.'
