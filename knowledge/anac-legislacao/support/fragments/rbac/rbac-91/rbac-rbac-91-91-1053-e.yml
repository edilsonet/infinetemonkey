section_title: Qualificações para piloto
subsection_id: e
cite: 91.1053(e)
title: 91.1053(e)
text: '(e) Ressalvado o estabelecido no parágrafo (b)(2) desta seção, para aeronaves certificadas
  para

  operação com um só piloto, se as especificações administrativas do administrador de programa

  autorizarem somente operações em condições VMC durante o período diurno, o piloto em comando

  deve ter pelo menos 300 horas de tempo total de voo como piloto, incluindo 50 horas de tempo
  de

  voo em viagem e 10 horas de tempo de voo noturno.'
