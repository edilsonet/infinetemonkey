cite: 91.1053(f)
title: 91.1053(f)
text: '(f) Para operação com helicópteros certificados para operação com um só piloto, se
  as

  especificações administrativas do administrador de programa autorizarem exclusivamente operações

  VFR para esses helicópteros, o piloto em comando não precisa ter habilitação IFRH quando
  o voo

  for realizado no período diurno, ou, caso realizado no período noturno, quando ocorra inteiramente

  em ATZ, CTR ou TMA, incluindo as projeções dos seus limites laterais, ou ainda, na inexistência

  desses espaços aéreos, dentro de um raio de 50 km (27 NM) do aeródromo ou heliponto de partida.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.'
