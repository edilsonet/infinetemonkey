section_title: Qualificações para piloto
subsection_id: g
cite: 91.1053(g)
title: 91.1053(g)
text: '(g) Exceto como previsto no parágrafo (h) desta seção, o administrador de programa
  somente pode

  utilizar uma pessoa e uma pessoa somente pode trabalhar como piloto segundo em comando de
  uma

  aeronave, se essa pessoa possuir pelo menos uma licença de piloto comercial ou piloto de
  tripulação

  múltipla, na categoria apropriada, for qualificada para voo IFR e para a aeronave, e tiver
  completado

  o apropriado programa de treinamento para a aeronave e para a função a bordo aprovado para
  o

  administrador de programa.'
