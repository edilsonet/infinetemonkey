title: 91.1053(i)
text: '(i) para um avião, possuir habilitação IFR para avião ou uma licença de piloto de linha
  aérea

  com habilitação categoria avião; ou

  (ii) para helicóptero, possuir habilitação IFR para helicópteros ou uma licença de piloto
  de

  linha aérea com habilitação categoria helicóptero.'
