section_title: 'Exames e treinamentos: aplicabilidade e termos utilizados'
subsection_id: a
cite: 91.1063(a)
title: 91.1063(a)
text: '(a) As seções 91.1065 até 91.1107:

  (1) estabelecem os exames requeridos para pilotos e comissários de voo e para aprovação
  de

  examinadores credenciados em operações segundo esta Subparte;

  (2) estabelecem os requisitos para estabelecer e manter um programa de treinamento aprovado

  para as tripulações, examinadores, instrutores e pessoal de operações utilizado pelo administrador
  de

  programa em operações do programa;

  (3) estabelecem os requisitos para a qualificação, aprovação e uso de FSTD e outros

  dispositivos de treinamento na condução de um programa de treinamento aprovado; e

  (4) permitem que o pessoal autorizado de um centro de treinamento de aviação civil (CTAC)

  certificado ou validado segundo o RBAC nº 142, ou de um fabricante de aeronaves classe (segundo

  critérios do RBAC nº 61), de sua própria fabricação, que atenda aos requisitos da seção
  91.1075 deste

  Regulamento, desempenhe as funções de treinamento e exames.'
