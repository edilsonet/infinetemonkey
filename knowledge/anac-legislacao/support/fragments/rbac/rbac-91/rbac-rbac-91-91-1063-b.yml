cite: 91.1063(b)
title: 91.1063(b)
text: '(b) Se autorizado pela ANAC, o administrador de programa pode cumprir os requisitos
  das seções

  aplicáveis de treinamento e exames das subpartes N, O e Z do RBAC nº 121 em lugar do previsto
  nas

  seções 91.1065 até 91.1107 deste Regulamento, exceto quanto aos requisitos experiência de
  operação

  da seção 121.434 do RBAC nº 121.'
