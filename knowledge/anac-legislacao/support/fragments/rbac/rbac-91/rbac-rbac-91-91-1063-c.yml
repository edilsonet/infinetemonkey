cite: 91.1063(c)
title: 91.1063(c)
text: '(c) Se autorizado pela ANAC, o administrador de programa pode cumprir os requisitos
  das seções

  aplicáveis de treinamento e exames das subpartes G, H e K do RBAC nº 135 em lugar do previsto

  nas seções 91.1065 até 91.1107 deste Regulamento, exceto quanto aos requisitos experiência

  operacional da seção 135.244 do RBAC nº 135.'
