section_title: 'Exames e treinamentos: aplicabilidade e termos utilizados'
subsection_id: d
cite: 91.1063(d)
title: 91.1063(d)
text: '(d) Para os propósitos desta Subparte, aplicam-se os seguintes termos e definições:

  (1) treinamento inicial. É o treinamento para uma função requerido para um tripulante que
  não

  haja sido qualificado e não tenha trabalhado nessa função em uma aeronave;

  (2) treinamento de transição. É o treinamento para uma função requerido para um tripulante

  que foi qualificado e trabalhou na mesma função em outra aeronave;


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (3) treinamento de elevação de nível. É o treinamento requerido para um tripulante que foi

  qualificado e trabalhou como piloto segundo em comando em um particular tipo de aeronave,
  antes

  de começar a trabalhar como piloto em comando nesse tipo de aeronave;

  (4) treinamento de diferenças. É o treinamento requerido para um tripulante que foi

  qualificado e trabalhou em um particular tipo de aeronave antes de começar a trabalhar na
  mesma

  função em uma particular variante do mesmo tipo de aeronave, se assim for considerado necessário

  pela ANAC;

  (5) treinamento periódico. É o treinamento requerido para um tripulante para permanecer

  adequadamente treinado e permanentemente proficiente em cada aeronave, função a bordo e
  tipo de

  operação em que o tripulante trabalha;

  (6) em voo. As manobras, procedimentos ou funções que devem ser conduzidas em aeronave;

  (7) CTAC. Uma organização funcionando de acordo com os requisitos aplicáveis do RBAC nº

  142, que provê treinamento e exames sob contrato ou outra forma de acordo para administradores
  de

  programa sujeitos a esta Subparte;

  (8) treinamento para requalificação. É o treinamento requerido para tripulantes previamente

  treinados e qualificados, mas que tenham perdido a qualificação por não terem cumprido dentro
  do

  período requerido:'
