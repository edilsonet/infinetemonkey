cite: 91.1063(i)
title: 91.1063(i)
text: '(i) para pilotos: exame prático realizado em dispositivo de treinamento para simulação
  de

  voo (FSTD) aprovado ou em voo não conduzido segundo esta Subparte; e

  (ii) para comissários de voo: exame prático realizado em um dispositivo de treinamento

  para simulação de voo (FSTD) ou em aeronave estática; e

  (10) qualificado. Significa que o piloto deve estar com as habilitações de categoria e classe,

  tipo e operação apropriadas válidas, ter realizado com aproveitamento o programa de treinamento

  aprovado para as operações aprovadas para o administrador de programa e ter os requisitos
  de

  experiência recente atendidos, em uma específica aeronave e função a bordo.'
