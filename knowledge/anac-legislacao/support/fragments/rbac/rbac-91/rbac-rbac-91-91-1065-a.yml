section_title: Requisitos de exame inicial e periódico para pilotos
subsection_id: a
cite: 91.1065(a)
title: 91.1065(a)
text: '(a) O administrador de programa somente pode utilizar uma pessoa como piloto e uma
  pessoa

  somente pode trabalhar como piloto em um voo se, dentro dos 12 meses calendáricos precedendo

  esse voo, esse piloto tiver sido aprovado em um exame, oral ou escrito, aplicado por um
  servidor

  designado pela ANAC ou por um piloto examinador credenciado, sobre os conhecimentos do piloto

  nas seguintes áreas:

  (1) as apropriadas provisões deste Regulamento e do RBAC nº 61, assim como as

  especificações administrativas e o manual de operações do administrador de programa;

  (2) para cada tipo de aeronave a ser voada pelo piloto, o grupo motopropulsor, os principais

  componentes e sistemas, os principais equipamentos, desempenho e limitações operacionais,

  procedimentos operacionais normais e de emergência e o conteúdo do manual de voo da aeronave
  ou

  equivalente, como aplicável;


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (3) para cada tipo de aeronave a ser voada pelo piloto, o método de determinar conformidade

  com as limitações de peso e balanceamento para operações de decolagem, de pouso e em rota;

  (4) navegação e utilização de auxílios à navegação apropriados à operação ou às qualificações

  do piloto, incluindo, quando aplicável, instalações e procedimentos de aproximação por instrumentos;

  (5) procedimentos de controle de tráfego aéreo, incluindo procedimentos IFR quando aplicável;

  (6) meteorologia em geral, incluindo princípios de sistemas frontais, gelo, nevoeiro, trovoadas

  e tesouras de vento e, se apropriado para as operações do administrador de programa, meteorologia

  de grandes altitudes;

  (7) procedimentos de emergência e procedimentos para:'
