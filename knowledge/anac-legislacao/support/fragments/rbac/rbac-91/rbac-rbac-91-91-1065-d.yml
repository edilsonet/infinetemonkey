section_title: Requisitos de exame inicial e periódico para pilotos
subsection_id: d
cite: 91.1065(d)
title: 91.1065(d)
text: '(d) Para os propósitos desta Subparte, a execução proficiente de um procedimento ou
  manobra

  pela pessoa a ser utilizada como piloto requer que a pessoa obviamente domine a aeronave,
  sem restar

  dúvidas quanto à execução bem sucedida de qualquer fase do voo.'
