section_title: Requisitos de exame inicial e periódico para pilotos
subsection_id: i
cite: 91.1065(i)
title: 91.1065(i)
text: '(i) reconhecer e evitar situações atmosféricas severas;

  (ii) sair de situações atmosféricas severas em caso de entrada inadvertida, incluindo tesouras

  de vento em baixa altura (excetuam-se os pilotos de helicóptero que não precisam ser testados
  em

  saída de tesouras de vento em baixa altura); e

  (iii) operar dentro ou próximo a trovoadas (incluindo melhores altitudes de penetração),
  ar

  turbulento (incluindo turbulência de céu claro), gelo, granizo e outras condições atmosféricas

  potencialmente perigosas; e

  (8) novos equipamentos, procedimentos ou técnicas, como apropriado.'
