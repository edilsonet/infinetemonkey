title: 91.107(i)
text: '(i) como colocar, ajustar e remover o seu cinto de segurança e, se instalados, seus
  cintos de

  ombro; e

  (ii) como evacuar a aeronave em caso de emergência;

  (2) somente é permitido ao piloto movimentar na superfície, decolar ou pousar uma aeronave

  civil brasileira (exceto um balão livre que incorpore uma cesta ou gôndola ou um dirigível
  de tipo

  certificado antes de 2 de novembro de 1987) se o piloto em comando da aeronave se assegurar
  que

  cada pessoa a bordo tenha sido orientada para colocar e ajustar seu cinto de segurança e,
  se instalados,

  seus cintos de ombro; e

  (3) durante movimentações na superfície e durante a decolagem e o pouso de uma aeronave

  civil brasileira (exceto um balão livre que incorpore uma cesta ou gôndola ou um dirigível
  de tipo

  certificado antes de 2 de novembro de 1987), cada pessoa a bordo deve ocupar um assento
  ou beliche

  com um cinto de segurança e cintos de ombro (se instalados) apropriadamente ajustados em
  torno da

  pessoa. Para hidroaviões e aeronaves dotadas de flutuadores em movimentações sobre a água,
  as

  pessoas encarregadas de atracar e desatracar a aeronave não precisam atender aos requisitos
  deste

  parágrafo referentes à ocupação de assento e uso de cintos de segurança. Ressalvados tais
  requisitos,

  uma pessoa pode:'
