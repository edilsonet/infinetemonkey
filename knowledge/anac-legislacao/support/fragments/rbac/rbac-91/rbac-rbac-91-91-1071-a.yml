section_title: 'Tripulantes: padrões para aceitação de exames'
subsection_id: a
cite: 91.1071(a)
title: 91.1071(a)
text: '(a) Se um tripulante precisar realizar um exame requerido por este Regulamento em um

  determinado mês calendárico e realizar esse exame no mês calendárico anterior ou posterior
  ao mês

  previsto, esse tripulante é considerado como tendo realizado o exame no mês calendárico
  em que era

  devido.'
