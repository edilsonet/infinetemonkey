cite: 91.1071(b)
title: 91.1071(b)
text: '(b) Se um piloto sendo examinado segundo esta Subparte falhar na execução de qualquer
  uma das

  manobras requeridas, a pessoa aplicando o exame pode dar treinamento adicional ao piloto
  no

  transcorrer do exame. Além de exigir a repetição da manobra mal sucedida, a pessoa aplicando
  o

  exame pode exigir que o piloto sendo examinado repita quaisquer outras manobras que ela
  considere

  necessárias para determinar a proficiência do piloto. Se o piloto sendo examinado não puder


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  demonstrar desempenho satisfatório para a pessoa aplicando o exame, o administrador de programa

  não pode utilizar esse piloto, nem o piloto pode servir como membro de uma tripulação de
  voo sob

  esta Subparte, até que consiga completar satisfatoriamente um novo exame, o qual ocorrerá
  após

  comprovação de haver recebido nova instrução teórica e/ou prática.'
