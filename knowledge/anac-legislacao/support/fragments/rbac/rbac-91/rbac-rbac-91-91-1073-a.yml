cite: 91.1073(a)
title: 91.1073(a)
text: '(a) O administrador de programa ao qual é requerido possuir um programa de treinamento
  segundo

  a seção 91.1097 deste Regulamento deve:

  (1) elaborar, obter as apropriadas aprovação inicial e aprovação final, e executar um programa

  de treinamento de acordo com esta Subparte que assegure que cada tripulante, instrutor de
  voo,

  examinador de voo e que cada pessoa que execute ou supervisione diretamente alguma função

  definida no RBAC nº 175 seja adequadamente treinada para o desempenho de suas atribuições;

  (2) obter da ANAC, a aprovação inicial e aprovação final do programa de treinamento, antes

  de sua implementação;

  (3) proporcionar instalações e recursos adequados de treinamento no solo e em voo e instrutores

  de solo apropriadamente qualificados para os treinamentos requeridos por esta Subparte;

  (4) para cada tipo de aeronave utilizada e, se aplicável, para cada particular variante
  de cada

  tipo, prover e manter atualizado apropriados materiais de treinamento, provas, formulários,
  instruções

  e procedimentos para uso na condução do treinamento e dos exames requeridos por esta Subparte;
  e

  (5) dispor de número suficiente de instrutores de voo, examinadores de voo e instrutores
  de

  FSTD para conduzir os referidos treinamentos, exames em voo e cursos de FSTD permitidos
  por esta

  Subparte.'
