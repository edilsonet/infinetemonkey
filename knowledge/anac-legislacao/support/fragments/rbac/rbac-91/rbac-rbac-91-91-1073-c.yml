cite: 91.1073(c)
title: 91.1073(c)
text: '(c) Cada instrutor ou examinador, que seja responsável por um particular assunto de
  treinamento

  de solo, segmento de treinamento em voo, em FSTD e/ou outro dispositivo de treinamento aprovado

  pela ANAC, ou exame segundo esta Subparte, deve certificar a proficiência e o conhecimento
  de cada

  tripulante, instrutor de voo ou examinador de voo ao término do treinamento ou do exame.
  Esta

  certificação deve ser incluída nos registros da pessoa examinada e aprovada. Quando a certificação

  requerida por este parágrafo for feita por meio de registro em computador, a pessoa certificando
  a

  aprovação deve ser identificada no referido registro. Neste caso, não há necessidade de
  assinatura da

  referida pessoa.'
