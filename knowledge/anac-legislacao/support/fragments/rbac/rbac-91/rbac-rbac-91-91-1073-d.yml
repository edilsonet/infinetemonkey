title: 91.1073(d)
text: '(d) Assuntos aplicáveis a mais de uma aeronave ou mais de uma função a bordo que tenham
  sido

  satisfatoriamente completados durante treinamentos previamente feitos pelo administrador
  de

  programa para outra aeronave ou outra função a bordo não precisam ser repetidos durante

  treinamentos subsequentes que não sejam treinamentos periódicos.'
