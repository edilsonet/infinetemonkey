title: 91.1073(f)
text: '(f) O administrador de programa é responsável pelo estabelecimento de práticas de gerenciamento

  de tripulações seguras e eficientes para todas as fases de voo das operações do programa,
  incluindo

  treinamento de CRM para todos os tripulantes utilizados nessas operações.'
