cite: 91.1073(h)
title: 91.1073(h)
text: '(h) Todos os treinamentos e exames a serem realizados pelo administrador de programa
  em

  cumprimento ao programa de treinamento aprovado deverão ser previamente notificados à ANAC,

  na forma determinada pela ANAC. Treinamentos e exames que forem realizados sem serem

  previamente notificados à ANAC não serão considerados para o cumprimento do programa de

  treinamento do administrador de programa.'
