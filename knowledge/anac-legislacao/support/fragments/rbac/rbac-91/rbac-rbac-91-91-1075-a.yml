section_title: 'Programa de treinamento: regras especiais'
subsection_id: a
cite: 91.1075(a)
title: 91.1075(a)
text: '(a) Além do administrador de programa, somente outro administrador de programa, segundo
  este

  Regulamento, um CTAC certificado ou validado segundo o RBAC nº 142, um fabricante de

  aeronaves classe (segundo critérios do RBAC nº 61), de sua própria fabricação, ou um detentor
  de

  certificado emitido segundo o RBAC nº 119 e operando segundo o RBAC nº 121 ou 135, é elegível

  segundo esta Subparte para prover treinamento e exames, sob contrato ou outra forma de acordo,
  para

  as pessoas sujeitas aos requisitos desta Subparte.'
