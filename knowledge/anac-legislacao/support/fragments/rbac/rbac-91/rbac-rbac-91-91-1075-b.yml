section_title: 'Programa de treinamento: regras especiais'
subsection_id: b
cite: 91.1075(b)
title: 91.1075(b)
text: '(b) Um administrador de programa somente pode contratar ou utilizar qualquer outra
  forma de

  acordo para obter o serviço de um CTAC certificado ou validado segundo o RBAC nº 142, para

  prover treinamento e exames requeridos por esta Subparte se esse CTAC:

  (1) possuir especificações de treinamento aplicáveis emitidas segundo o RBAC nº 142;

  (2) tiver instalações, equipamento de treinamento e material didático para o curso atendendo

  aos requisitos aplicáveis do RBAC nº 142;

  (3) tiver currículos, segmentos de currículo e porções de segmentos de currículo aprovados
  e

  aplicáveis ao uso em cursos de treinamento requeridos por esta Subparte; e

  (4) tiver instrutores suficientes e examinadores qualificados segundo os requisitos aplicáveis

  das seções 91.1089 a 91.1095 deste Regulamento para prover treinamento e exames para as
  pessoas

  sujeitas aos requisitos desta Subparte.'
