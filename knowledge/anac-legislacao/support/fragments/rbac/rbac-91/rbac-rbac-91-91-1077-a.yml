section_title: 'Programa de treinamento e revisões: aprovação inicial e final'
subsection_id: a
cite: 91.1077(a)
title: 91.1077(a)
text: '(a) Para obter aprovação inicial e aprovação final de um programa de treinamento ou
  de uma

  revisão de um programa aprovado, o administrador de programa deve submeter à ANAC:

  (1) um resumo do currículo proposto ou revisado, provendo suficiente informação para uma

  avaliação preliminar do programa ou da revisão proposta; e

  (2) informações adicionais que a ANAC considere relevantes.'
