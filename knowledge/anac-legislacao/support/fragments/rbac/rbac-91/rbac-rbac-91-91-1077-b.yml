section_title: 'Programa de treinamento e revisões: aprovação inicial e final'
subsection_id: b
cite: 91.1077(b)
title: 91.1077(b)
text: '(b) Se o programa de treinamento ou a revisão proposta atender a esta Subparte, a ANAC

  concederá, por escrito, uma aprovação inicial. Exceto se estabelecido de outra forma pela
  ANAC, o

  administrador de programa somente poderá iniciar a condução do treinamento após a obtenção
  da

  aprovação inicial. Após uma avaliação da eficiência do programa, a ANAC informará ao

  administrador de programa das deficiências, se houver, que devem ser corrigidas.'
