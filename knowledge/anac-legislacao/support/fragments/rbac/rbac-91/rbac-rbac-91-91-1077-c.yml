text: '(c) A ANAC concederá a aprovação final do programa ou revisão proposta se o administrador
  de

  programa demonstrar que o treinamento, conduzido conforme o programa aprovado segundo o


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  parágrafo (b) desta seção, garante que cada pessoa que o completar satisfatoriamente está

  adequadamente treinada para desempenhar suas atribuições.'
