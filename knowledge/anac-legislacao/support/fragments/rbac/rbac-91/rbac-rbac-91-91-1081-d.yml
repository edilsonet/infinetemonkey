section_title: Requisitos para treinamento de tripulantes
subsection_id: d
cite: 91.1081(d)
title: 91.1081(d)
text: '(d) Pode ser incluído no programa de treinamento o treinamento de elevação de nível
  previsto nas

  seções 91.1101 e 91.1103 deste Regulamento, para um particular tipo de aeronave, visando
  promover

  tripulantes que foram qualificados e trabalham como pilotos segundo em comando no referido
  tipo

  de aeronave.'
