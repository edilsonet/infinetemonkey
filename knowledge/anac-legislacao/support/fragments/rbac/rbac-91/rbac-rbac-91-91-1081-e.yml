section_title: Requisitos para treinamento de tripulantes
subsection_id: e
cite: 91.1081(e)
title: 91.1081(e)
text: '(e) Em adição ao treinamento inicial, de transição, de elevação de nível e periódico,
  cada programa

  de treinamento deve prover treinamento de solo e de voo, instrução e prática necessários
  para

  assegurar que cada tripulante:

  (1) permaneça adequadamente treinado e permanentemente proficiente para cada função a

  bordo, tipo de aeronave e espécie de operação em que o tripulante trabalha; e

  (2) qualifique-se em novos equipamentos, instalações, procedimentos e técnicas, incluindo

  alterações nas aeronaves.'
