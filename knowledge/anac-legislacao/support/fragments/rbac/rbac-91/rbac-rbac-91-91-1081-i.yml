cite: 91.1081(i)
title: 91.1081(i)
text: '(i) atribuições e responsabilidades do tripulante, conforme aplicável;

  (ii) as apropriadas provisões deste Regulamento;

  (iii) conteúdo das especificações administrativas do administrador de programa (não

  aplicável a comissários de voo);

  (iv) apropriadas partes do manual de operações do administrador de programa;'
