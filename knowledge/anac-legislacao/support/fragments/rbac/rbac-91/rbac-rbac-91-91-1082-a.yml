section_title: Treinamento em gerenciamento de recursos de equipes (CRM)
subsection_id: a
cite: 91.1082(a)
title: 91.1082(a)
text: '(a) O administrador de programa deve estabelecer e manter aprovado um programa de treinamento

  em gerenciamento de recursos de equipes (CRM) que inclua treinamento inicial e periódico.
  O

  programa de treinamento deve incluir instrução em, pelo menos:

  (1) liderança e habilidades gerenciais do piloto em comando;

  (2) processos de comunicação, decisão e coordenação, incluindo comunicação com os órgãos

  de controle de tráfego aéreo, com pessoal que desempenha atividades de localização de voo
  e outras

  atividades operacionais e com passageiros;

  (3) formação e manutenção de equipes;

  (4) gerenciamento do tempo e da carga de trabalho;

  (5) estratégias de gerenciamento dos erros e das ameaças;

  (6) monitoramento e automação;

  (7) manutenção da consciência situacional;

  (8) efeitos da fadiga no desempenho, estratégias de prevenção e mitigação;

  (9) efeitos do estresse e estratégias de redução do estresse;

  (10) efeitos do uso de álcool e outras drogas no desempenho; e

  (11) treinamento em julgamento e tomada de decisões adaptado ao ambiente da aviação e às

  operações do administrador de programa.'
