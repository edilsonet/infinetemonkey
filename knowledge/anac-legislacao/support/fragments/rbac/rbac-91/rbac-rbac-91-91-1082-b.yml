cite: 91.1082(b)
title: 91.1082(b)
text: '(b) O administrador de programa somente pode utilizar uma pessoa como membro da tripulação

  de voo se essa pessoa tiver completado o treinamento em gerenciamento de recursos de equipes,


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  inicial e, a cada 24 meses, periódico, conforme o programa de treinamento aprovado do administrador

  de programa.'
