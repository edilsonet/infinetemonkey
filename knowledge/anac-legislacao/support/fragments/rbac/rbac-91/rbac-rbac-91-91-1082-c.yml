section_title: Treinamento em gerenciamento de recursos de equipes (CRM)
subsection_id: c
cite: 91.1082(c)
title: 91.1082(c)
text: '(c) Treinamentos em gerenciamento de recursos de equipes realizados antes da aprovação
  do

  programa de treinamento estabelecido conforme o parágrafo (a) desta seção podem ser utilizados
  para

  cumprimento total ou parcial do treinamento requerido pelo parágrafo (b) desta seção, na
  medida em

  que se demonstre equivalência entre o currículo ministrado (ou parte dele) e o currículo
  mínimo

  requerido pelo parágrafo (a) desta seção.'
