title: 91.1082(d)
text: '(d) Para conceder os créditos, conforme estabelecido no parágrafo (c) desta seção,
  a ANAC

  considera os auxílios de instrução, dispositivos de treinamento, métodos e procedimentos
  para

  abordar os conteúdos de CRM, que tenham sido previamente utilizados pelo administrador de

  programa e incluídos em seu programa de treinamento requerido pelas seções 91.1097, 91.1101,'
