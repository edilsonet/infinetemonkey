section_title: Treinamento de emergências para tripulantes
subsection_id: a
cite: 91.1083(a)
title: 91.1083(a)
text: '(a) Cada programa de treinamento deve prover treinamento de emergências de acordo com
  esta

  seção, para cada tipo, modelo e configuração de aeronave, cada tripulante e cada espécie
  de operação

  conduzida, conforme adequado para cada tripulante e para o administrador de programa.'
