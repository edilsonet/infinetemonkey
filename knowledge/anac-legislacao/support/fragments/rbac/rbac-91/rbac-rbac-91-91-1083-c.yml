section_title: Treinamento de emergências para tripulantes
subsection_id: c
cite: 91.1083(c)
title: 91.1083(c)
text: '(c) Cada tripulante deve executar pelo menos os seguintes exercícios de emergência,
  utilizando os

  adequados procedimentos e equipamentos de emergência, exceto se a ANAC considerar que, para

  um particular exercício, o tripulante possa ser adequadamente treinado por uma demonstração
  do

  exercício:

  (1) pouso na água, se aplicável;

  (2) evacuação em emergência;

  (3) extinção de fogo e controle de fumaça;

  (4) operação e uso das saídas de emergência, incluindo abertura e uso das escorregadeiras
  de

  evacuação, se aplicável;

  (5) uso do oxigênio para tripulantes e passageiros;

  (6) remoção e enchimento dos botes salva-vidas da aeronave, uso de cordas de salvamento
  e

  embarque de passageiros e tripulantes nos botes, se aplicável; e

  (7) colocação e inflagem dos coletes salva-vidas e uso de outros equipamentos de flutuação,
  se

  aplicável.'
