section_title: Treinamento de emergências para tripulantes
subsection_id: d
cite: 91.1083(d)
title: 91.1083(d)
text: '(d) Tripulantes que voam em operações acima de 25.000 pés de altitude devem receber
  instruções

  sobre:

  (1) problemas respiratórios;

  (2) hipóxia;

  (3) duração da consciência, em altitude, sem oxigênio suplementar;

  (4) expansão dos gases;

  (5) formação de bolhas gasosas no sangue; e

  (6) fenômeno físico e incidentes da descompressão.'
