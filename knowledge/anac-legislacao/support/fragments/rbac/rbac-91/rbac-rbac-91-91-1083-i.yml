title: 91.1083(i)
text: '(i) descompressão rápida;

  (ii) fogo a bordo em voo e no solo e procedimentos de controle de fumaça, com ênfase no

  equipamento elétrico e correspondentes disjuntores localizados no interior da aeronave;


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (iii) pouso na água e evacuação;

  (iv) enfermidades, contusões ou outras situações anormais envolvendo passageiros ou

  tripulantes; e'
