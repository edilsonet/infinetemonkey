section_title: Treinamento em artigos perigosos
subsection_id: a
cite: 91.1085(a)
title: 91.1085(a)
text: '(a) O administrador de programa somente pode utilizar uma pessoa e uma pessoa somente
  pode

  desempenhar tarefas e responsabilidades sobre o manuseio e o transporte de artigos perigosos
  se essa

  pessoa tiver recebido treinamento para reconhecer, manusear ou recusar o transporte de artigos

  perigosos.'
