title: 91.1087(a)
text: '(a) Cursos de treinamento utilizando FSTD e outros dispositivos de treinamento podem
  ser

  incluídos no programa de treinamento do administrador de programa, desde que aprovados pela

  ANAC.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.'
