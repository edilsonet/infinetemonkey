section_title: Aprovação de FSTD e outros dispositivos de treinamento
subsection_id: d
cite: 91.1087(d)
title: 91.1087(d)
text: '(d) Na concessão de aprovação inicial e aprovação final de um programa de treinamento
  (ou de

  suas revisões) a ANAC leva em consideração o FSTD e/ou outro dispositivo de treinamento
  aprovado

  pela ANAC, e os procedimentos e métodos listados no currículo administrador de programa
  requerido

  pela seção 91.1079 deste Regulamento.'
