section_title: Aprovação de FSTD e outros dispositivos de treinamento
subsection_id: e
cite: 91.1087(e)
title: 91.1087(e)
text: '(e) Para que um FSTD possa ser utilizado em lugar de uma aeronave para satisfazer aos
  requisitos

  de treinamento em voo desta Subparte, ele deve:

  (1) ser qualificado ou validado, e aprovado de acordo com esta seção e atender aos requisitos

  estabelecidos pelo Apêndice H do RBAC nº 121 ou disposições que venham a substituí-lo; e

  (2) ser utilizado como parte de um programa aprovado que atenda aos requisitos de treinamento

  da seção 91.1103 deste Regulamento e do Apêndice H do RBAC nº 121.'
