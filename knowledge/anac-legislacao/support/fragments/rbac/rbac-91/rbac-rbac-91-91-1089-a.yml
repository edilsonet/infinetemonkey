section_title: 'Qualificações: examinador credenciado em aeronave e em FSTD e/ou outro dispositivo'
subsection_id: a
cite: 91.1089(a)
title: 91.1089(a)
text: '(a) Para os propósitos desta seção e da seção 91.1093 deste Regulamento:

  (1) examinador em aeronave é uma pessoa qualificada para conduzir exames em voo em

  aeronave, em FSTD e/ou em outro dispositivo de treinamento aprovado pela ANAC para um

  particular tipo de aeronave;

  (2) examinador em FSTD e/ou outro dispositivo de treinamento aprovado pela ANAC é

  uma pessoa qualificada para conduzir exames em voo, mas somente em um FSTD e/ou em um outro

  dispositivo de treinamento aprovado pela ANAC para um particular tipo de aeronave; e


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (3) examinador em aeronave e examinador em FSTD e/ou outro dispositivo de

  treinamento aprovado pela ANAC são examinadores que desempenham as funções descritas nos

  parágrafos 91.1073(a)(4) e (c) deste Regulamento.'
