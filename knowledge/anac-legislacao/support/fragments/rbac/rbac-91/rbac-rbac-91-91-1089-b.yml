section_title: 'Qualificações: examinador credenciado em aeronave e em FSTD e/ou outro dispositivo'
subsection_id: b
cite: 91.1089(b)
title: 91.1089(b)
text: '(b) O administrador de programa somente pode utilizar uma pessoa e uma pessoa somente
  pode

  trabalhar como examinador em aeronave em um programa de treinamento estabelecido segundo
  esta

  Subparte se, para um particular tipo de aeronave envolvido, essa pessoa:

  (1) possuir uma licença de piloto e as habilitações requeridas para um piloto em comando
  em

  operações segundo esta Subparte;

  (2) tiver completado satisfatoriamente as fases do treinamento para a aeronave que são

  requeridas para atuar como piloto em comando em operações segundo esta Subparte;

  (3) tiver completado satisfatoriamente os adequados exames de proficiência requeridos para

  trabalhar como piloto em comando em operações segundo esta Subparte;

  (4) tiver completado satisfatoriamente os aplicáveis requisitos de treinamento requeridos
  pela

  seção 91.1093 deste Regulamento;

  (5) possuir um CMA válido e adequado para trabalhar como piloto em comando em operações

  segundo esta Subparte; e

  (6) tiver sido aprovado pela ANAC como examinador em aeronave.'
