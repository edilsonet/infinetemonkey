section_title: 'Qualificações: examinador credenciado em aeronave e em FSTD e/ou outro dispositivo'
subsection_id: c
cite: 91.1089(c)
title: 91.1089(c)
text: '(c) O administrador de programa somente pode utilizar uma pessoa e uma pessoa somente
  pode

  trabalhar como examinador em FSTD e/ou outro dispositivo de treinamento aprovado pela ANAC

  em um programa de treinamento estabelecido segundo esta Subparte, se essa pessoa, em relação
  ao

  tipo de aeronave envolvida, atender às provisões de parágrafo (b) desta seção, ou se essa
  pessoa:

  (1) possuir a licença e as habilitações requeridas para atuar como piloto em comando em

  operações segundo esta Subparte, exceto quanto ao CMA;

  (2) tiver completado satisfatoriamente as fases de treinamento para a aeronave que são

  requeridas para servir como piloto em comando em operações segundo esta Subparte;

  (3) tiver completado com aproveitamento os exames de proficiência, que são requeridos para

  servir como piloto em comando em operações segundo esta Subparte;

  (4) tiver completado com aproveitamento os requisitos de treinamento aplicáveis da seção'
