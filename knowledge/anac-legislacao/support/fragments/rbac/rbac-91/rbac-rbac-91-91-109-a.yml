section_title: Instrução de voo, voo por instrumentos simulado e certos exames em voo
subsection_id: a
cite: 91.109(a)
title: 91.109(a)
text: '(a) Somente é permitido ministrar instrução de voo em uma aeronave civil brasileira
  (exceto um

  balão livre tripulado) se a aeronave possuir duplo comando em total funcionamento. No entanto,

  instrução de voo por instrumentos pode ser ministrada em um avião equipado com um único
  volante

  de controle transferível de posto por rotação (throwover control) em vez de dois controles
  fixos de

  profundor e de aileron quando:

  (1) o instrutor tiver verificado que o voo pode ser conduzido com segurança; e

  (2) a pessoa manipulando os comandos tiver, pelo menos, licença de piloto privado (PP) e

  habilitação apropriada para o avião.'
