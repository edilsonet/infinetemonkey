cite: 91.109(d)
title: 91.109(d)
text: '(d) Somente é permitido operar uma aeronave civil brasileira que esteja sendo utilizada
  em exame

  de proficiência segundo o RBAC nº 121, se o piloto que estiver ocupando uma das posições
  de

  controle, que não o piloto sendo examinado, for qualificado para atuar como piloto em comando
  da

  aeronave.'
