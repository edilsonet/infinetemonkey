subsection_id: b
cite: 91.1091(b)
title: 91.1091(b)
text: '(b) O administrador de programa somente pode utilizar uma pessoa e uma pessoa somente
  pode

  servir como instrutor de voo em aeronave em um programa de treinamento estabelecido segundo
  esta

  Subparte se, em relação ao tipo, classe ou categoria da aeronave envolvido, esta pessoa:

  (1) possuir a licença habilitações requeridas para servir como piloto em comando em operações

  segundo esta Subparte ou segundo os RBAC nº 121 ou 135;

  (2) tiver completado satisfatoriamente as fases do treinamento para a aeronave que são

  requeridas para atuar como piloto em comando em operações segundo esta Subparte;

  (3) tiver completado satisfatoriamente os exames de proficiência que são requeridos para
  atuar

  como piloto em comando em operações segundo esta Subparte;

  (4) tiver completado satisfatoriamente os requisitos de treinamento aplicáveis da seção
  91.1095

  deste Regulamento; e

  (5) possuir um CMA válido e adequado para trabalhar como piloto em comando em operações

  segundo esta Subparte.'
