section_id: '91.1091'
section_title: 'Qualificações: instrutor de voo em aeronave e instrutor de voo em FSTD e/ou
  outro'
subsection_id: c
cite: 91.1091(c)
title: 91.1091(c)
text: '(c) O administrador de programa somente pode utilizar uma pessoa e uma pessoa somente
  pode

  atuar como instrutor de voo em FSTD e/ou outro dispositivo de treinamento aprovado pela
  ANAC

  em um programa de treinamento estabelecido segundo esta Subparte, se essa pessoa atender
  às

  provisões do parágrafo (b) desta seção em relação ao tipo, classe ou categoria da aeronave
  envolvida,

  ou se essa pessoa:

  (1) possuir a licença e as habilitações, exceto CMA, requeridos para atuar como piloto em

  comando sob esta Subparte ou sob os RBAC nº 121 ou 135;

  (2) tiver completado satisfatoriamente as fases de treinamento para a aeronave que são

  requeridas para atuar como piloto em comando em operações segundo esta Subparte;


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (3) tiver completado satisfatoriamente os exames de proficiência que são requeridos para
  atuar

  como piloto em comando em operações segundo esta Subparte; e

  (4) tiver completado satisfatoriamente os requisitos de treinamento aplicáveis da seção
  91.1095

  deste Regulamento.'
