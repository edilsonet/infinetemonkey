section_title: 'Treinamento inicial, de transição e exames: examinador em aeronave e examinador'
subsection_id: a
cite: 91.1093(a)
title: 91.1093(a)
text: '(a) Um administrador de programa somente pode utilizar uma pessoa e uma pessoa somente
  pode

  servir como examinador credenciado se:

  (1) essa pessoa tiver completado satisfatoriamente o treinamento inicial ou de transição
  para

  examinador; e

  (2) dentro dos 24 meses calendáricos precedentes, esta pessoa tiver conduzido satisfatoriamente

  um exame de proficiência sob observação de um servidor designado pela ANAC ou de um

  examinador credenciado vinculado ao administrador de programa. O exame sob observação pode
  ser

  realizado em parte ou no todo ou em parte em aeronave ou em FSTD e/ou outro dispositivo
  de

  treinamento aprovado pela ANAC.'
