subsection_id: d
cite: 91.1093(d)
title: 91.1093(d)
text: '(d) O treinamento de solo de transição para um piloto examinador deve incluir métodos,

  procedimentos e limitações aprovados para executar os procedimentos requeridos normais,
  anormais

  e de emergência aplicáveis à aeronave para a qual o piloto examinador está em transição.'
