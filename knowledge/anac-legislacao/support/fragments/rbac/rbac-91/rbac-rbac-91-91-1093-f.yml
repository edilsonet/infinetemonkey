cite: 91.1093(f)
title: 91.1093(f)
text: '(f) Um examinador credenciado em FSTD e/ou outro dispositivo de treinamento aprovado
  pela

  ANAC deve realizar o seguinte:

  (1) voar ao menos 2 segmentos de voo como tripulante requerido para o tipo, classe ou categoria

  de aeronave envolvida dentro dos 12 meses precedendo a execução de qualquer serviço de

  examinador em um FSTD e/ou outro dispositivo de treinamento aprovado pela ANAC; ou


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (2) completar satisfatoriamente um programa aprovado de observação em rota dentro do

  período estabelecido pelo programa e que deve preceder o desempenho de qualquer serviço
  de

  examinador em um FSTD e/ou outro dispositivo de treinamento aprovado pela ANAC.'
