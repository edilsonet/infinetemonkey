section_title: 'Treinamento inicial, de transição e exames: examinador em aeronave e examinador'
subsection_id: g
cite: 91.1093(g)
title: 91.1093(g)
text: '(g) O treinamento de voo inicial e de transição para examinador em FSTD e/ou outro
  dispositivo

  de treinamento aprovado pela ANAC deve incluir o seguinte:

  (1) treinamento e prática na condução de exames em voo, realizando os procedimentos normais,

  anormais e de emergência requeridos, visando assegurar competência na condução de exames
  em voo

  requeridos por esta Subparte. Este treinamento e prática deve ser realizado no FSTD e/ou
  outro

  dispositivo de treinamento aprovado pela ANAC; e

  (2) treinamento na operação do FSTD e/ou outro dispositivo de treinamento aprovado pela

  ANAC, para assegurar competência na condução dos exames em voo requeridos por esta Subparte.'
