cite: 91.1095(a)
title: 91.1095(a)
text: '(a) Um administrador de programa somente pode utilizar uma pessoa e uma pessoa somente
  pode

  atuar como instrutor de voo se:

  (1) essa pessoa tiver completado satisfatoriamente o treinamento inicial ou de transição
  para

  instrutor de voo; e

  (2) dentro dos 24 meses de calendário precedentes, esta pessoa tiver conduzido

  satisfatoriamente instrução sob a observação de um servidor designado pela ANAC ou de um

  examinador credenciado vinculado ao administrador de programa. A instrução sob observação
  pode


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  ser realizada em parte ou no todo em aeronave ou em FSTD e/ou outro dispositivo de treinamento

  aprovado pela ANAC.'
