cite: 91.1095(d)
title: 91.1095(d)
text: '(d) O treinamento de solo de transição para instrutores de voo deve incluir métodos,
  procedimentos

  e limitações aprovados para desempenhar os procedimentos normais, anormais e de emergência

  requeridos aplicáveis para o tipo, classe ou categoria da aeronave para a qual o instrutor
  de voo está

  em transição.'
