cite: 91.1095(g)
title: 91.1095(g)
text: '(g) O treinamento de voo inicial e de transição para um instrutor de voo em FSTD e/ou
  outro

  dispositivo de treinamento aprovado pela ANAC deve incluir o seguinte:


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (1) treinamento e prática nos procedimentos normais, anormais e de emergência requeridos
  para

  garantir competência na condução da instrução de voo requerida por esta Subparte. Estas
  manobras e

  procedimentos devem ser realizados em parte ou no todo em FSTD e/ou outro dispositivo de

  treinamento aprovado pela ANAC; e

  (2) treinamento na operação do FSTD e/ou outro dispositivo de treinamento aprovado pela

  ANAC, para garantir competência na condução da instrução de voo requerida por esta Subparte.'
