section_title: 'Programa de treinamento: pilotos e comissários de voo'
subsection_id: a
cite: 91.1097(a)
title: 91.1097(a)
text: '(a) O administrador de programa deve estabelecer e manter um programa aprovado de treinamento

  de piloto e o administrador de programa que utilize comissários deve estabelecer e manter
  um

  programa de treinamento aprovado de comissário, que sejam apropriados para as operações
  em que

  cada piloto e cada comissário forem envolvidos. Os programas devem garantir que os pilotos
  e

  comissários sejam adequadamente treinados para atender aos aplicáveis requisitos de conhecimento

  e de prática requeridos pelas seções 91.1065 até 91.1071 deste Regulamento.'
