section_title: 'Programa de treinamento: pilotos e comissários de voo'
subsection_id: b
cite: 91.1097(b)
title: 91.1097(b)
text: '(b) O administrador de programa, para o qual é requerido um programa de treinamento
  pelo

  parágrafo (a) desta seção, deve incluir nesse programa currículos de treinamento de solo
  e em voo

  para:

  (1) treinamento inicial;

  (2) treinamento de transição;

  (3) treinamento de elevação de nível;

  (4) treinamento de diferenças;

  (5) treinamentos periódicos;'
