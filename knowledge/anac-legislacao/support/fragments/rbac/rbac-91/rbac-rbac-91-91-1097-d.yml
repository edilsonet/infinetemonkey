section_title: 'Programa de treinamento: pilotos e comissários de voo'
subsection_id: d
cite: 91.1097(d)
title: 91.1097(d)
text: '(d) O administrador de programa deve fornecer cópias dos programas de treinamento de
  pilotos e

  de comissários, assim como de suas modificações e acréscimos, à ANAC. Se o administrador
  de

  programa usar instalações de treinamento de outras pessoas, uma cópia dos programas de

  treinamento, ou partes apropriadas dos mesmos, utilizadas nestas instalações, deve também
  ser

  fornecida. Publicações da ANAC utilizadas nos currículos podem ser apenas referenciadas
  na cópia

  do programa de treinamento a ser fornecida à ANAC, não havendo necessidade de anexar cópias

  dessas publicações.'
