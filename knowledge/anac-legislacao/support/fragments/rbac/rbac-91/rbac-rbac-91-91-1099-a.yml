section_title: Requisitos de treinamento inicial e periódico para tripulantes
subsection_id: a
cite: 91.1099(a)
title: 91.1099(a)
text: '(a) O administrador de programa somente pode utilizar uma pessoa e uma pessoa somente
  pode

  trabalhar como tripulante em operação segundo esta subparte se esse tripulante tiver completado,

  dentro dos 12 meses calendáricos que precedem essa operação, as apropriadas fases do programa
  de

  treinamento inicial ou periódico estabelecido para o tipo de função que a pessoa vai executar.'
