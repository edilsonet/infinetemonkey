title: 91.1101(i)
text: '(i) procedimentos do administrador de programa para liberação e localização de voos;

  (ii) princípios e métodos para determinar peso e balanceamento e limitações de pista para

  decolagem e pouso;

  (iii) conhecimentos de meteorologia de modo a assegurar conhecimento prático dos

  fenômenos atmosféricos, incluindo princípios de sistemas frontais, gelo, nevoeiro, trovoadas,

  tesouras de vento e, se apropriado, meteorologia de grande altitude;

  (iv) sistemas de controle de tráfego aéreo, procedimentos e fraseologia;'
