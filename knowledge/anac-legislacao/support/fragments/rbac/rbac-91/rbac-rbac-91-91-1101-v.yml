section_title: 'Piloto: treinamento de solo inicial, de transição e de elevação de nível'
subsection_id: v
cite: 91.1101(v)
title: 91.1101(v)
text: '(v) sistemas principais da aeronave (controles de voo, elétrico, hidráulico, etc.),
  outros

  sistemas se aplicável, princípios de operação normal, anormal e de emergência e procedimentos
  e

  limitações apropriadas;

  (vi) conhecimentos e procedimentos para:

  (A) reconhecer e evitar condições atmosféricas severas;

  (B) livrar-se de condições atmosféricas severas, no caso de elas serem encontradas

  inadvertidamente, incluindo, para aviões, tesouras de vento em baixa altitude;

  (C) operar dentro ou perto de tempestades (incluindo melhor altitude de penetração), ar

  turbulento (inclusive turbulência de céu claro), gelo, granizo e outras condições meteorológicas

  potencialmente perigosas; e

  (D) operar aviões durante condições de gelo no solo (ou seja, a qualquer tempo em que

  as condições sejam tais que geada, gelo ou neve podem razoavelmente ser esperadas aderirem
  ao

  avião), se o administrador de programa pretende autorizar decolagens em condições de gelo
  no solo,

  incluindo:

  ( 1 ) o uso de tempo de atuação quando usando fluido descongelante / anticongelante;


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  ( 2 ) procedimentos de degelo/antigelo para o avião, incluindo responsabilidades e

  procedimentos para inspeções e verificações;

  ( 3 ) comunicações;

  ( 4 ) contaminação da superfície da aeronave (i.e., aderência de geada, gelo ou neve) e

  identificação de área crítica, conhecimento de como a contaminação afeta adversamente o

  desempenho da aeronave e as características de voo;

  ( 5 ) tipo e características de fluidos descongelantes/anticongelantes, se utilizados pelo

  administrador de programa;

  ( 6 ) procedimentos de inspeções pré-voo para condições de baixas temperaturas; e

  ( 7 ) técnicas para reconhecimento de contaminação no avião;

  (vii) limitações operacionais;

  (viii) controle de cruzeiro e de consumo de combustível;

  (ix) planejamento de voo;'
