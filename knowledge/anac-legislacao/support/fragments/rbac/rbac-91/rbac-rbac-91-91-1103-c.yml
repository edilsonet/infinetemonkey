subsection_id: c
cite: 91.1103(c)
title: 91.1103(c)
text: '(c) Se o programa de treinamento aprovado do administrador de programa incluir um curso
  de

  treinamento utilizando um FSTD e/ou outro dispositivo de treinamento aprovado pela ANAC,
  cada

  piloto deve completar satisfatoriamente:

  (1) treinamento e prática no FSTD e/ou outro dispositivo de treinamento aprovado pela ANAC

  pelo menos das manobras e procedimentos que esta Subparte permite serem executadas em FSTD

  e/ou outro dispositivo de treinamento aprovado pela ANAC; e

  (2) um exame na aeronave, FSTD e/ou outro dispositivo de treinamento aprovado pela ANAC

  para o nível de proficiência de piloto em comando ou piloto segundo em comando, como aplicável,

  pelo menos nas manobras e procedimentos que podem ser realizadas em FSTD e/ou outro dispositivo

  de treinamento aprovado pela ANAC.'
