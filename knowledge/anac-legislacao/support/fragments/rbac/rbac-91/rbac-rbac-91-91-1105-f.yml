cite: 91.1105(f)
title: 91.1105(f)
text: '(f) Para os propósitos desta seção, um facilitador de CRM é um instrutor que é qualificado
  para

  ministrar cursos de CRM.

  (1) O administrador de programa somente pode utilizar uma pessoa e uma pessoa somente pode

  servir como facilitador de CRM em um programa de treinamento estabelecido segundo esta Subparte

  se, dentro dos últimos 24 meses precedentes, essa pessoa tenha passado por um programa de

  capacitação em CRM.'
