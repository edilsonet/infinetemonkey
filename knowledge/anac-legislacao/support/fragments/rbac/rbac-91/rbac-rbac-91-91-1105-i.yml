section_title: 'Treinamento de solo inicial e de transição: comissários'
subsection_id: i
cite: 91.1105(i)
title: 91.1105(i)
text: '(i) descrição geral da aeronave, enfatizando as características físicas que podem servir
  como

  orientação em pousos na água, evacuações e outras emergências em voo, incluindo os deveres

  associados;

  (ii) o uso do sistema de avisos aos passageiros e de intercomunicação dos tripulantes,

  incluindo os procedimentos de emergência no caso de tentativa de sequestro e outras situações
  não

  usuais;

  (iii) conhecimento, localização e operação dos equipamentos e sistemas de segurança de voo

  e de emergência; e

  (iv) uso adequado dos equipamentos de “galley” e dos controles dos sistemas de

  condicionamento e de ventilação da cabine.'
