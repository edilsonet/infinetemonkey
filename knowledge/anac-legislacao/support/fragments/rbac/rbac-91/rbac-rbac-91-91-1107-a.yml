cite: 91.1107(a)
title: 91.1107(a)
text: '(a) Cada administrador de programa deve assegurar-se de que cada tripulante receba
  treinamento

  periódico, esteja adequadamente treinado e mantenha sua proficiência com respeito ao tipo
  de

  aeronave. O treinamento periódico deve ser anual.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.'
