cite: 91.1107(b)
title: 91.1107(b)
text: '(b) O treinamento de solo periódico para tripulantes deve incluir, pelo menos, o seguinte:

  (1) uma avaliação oral, ou escrita, para determinar o conhecimento do tripulante sobre a

  aeronave e sobre a função a bordo envolvida; e

  (2) as instruções necessárias sobre os assuntos requeridos para treinamento inicial de solo
  inicial

  por esta Subparte, como apropriado, incluindo treinamento de tesouras de vento de baixa
  altitude e

  treinamento em operações no solo durante condições de gelo, como estabelecido nas seções
  91.1097

  e 91.1101, respectivamente, assim como treinamento de emergências.'
