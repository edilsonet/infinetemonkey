cite: 91.1107(c)
title: 91.1107(c)
text: '(c) O treinamento periódico de voo para pilotos deve incluir pelo menos o treinamento
  em

  aeronave, em FSTD e/ou em outro dispositivo de treinamento aprovado pela ANAC das manobras
  e

  procedimentos previstos nesta Subparte, sendo encerrado pela realização satisfatória do
  exame

  requerido pela seção 91.1065 deste Regulamento.'
