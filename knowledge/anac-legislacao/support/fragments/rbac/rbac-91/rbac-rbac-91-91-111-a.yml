cite: 91.111(a)
title: 91.111(a)
text: '(a) É vedado operar uma aeronave tão perto de outra que possa criar risco de colisão.
  As regras e

  os critérios de separação entre aeronaves e os procedimentos de comunicação e de navegação
  aérea

  são aqueles estabelecidos nas regras do DECEA.'
