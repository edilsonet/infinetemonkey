cite: 91.111(b)
title: 91.111(b)
text: '(b) Somente é permitido operar uma aeronave civil em voo de formação com outra(s) aeronave(s)

  se o voo for realizado em conformidade com as regras de tráfego aéreo estabelecidas pelo
  DECEA.'
