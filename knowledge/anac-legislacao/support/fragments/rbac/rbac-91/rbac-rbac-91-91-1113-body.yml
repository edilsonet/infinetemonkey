title: 'deste Regulamento, de modo aceitável pela ANAC, e que contenha:'
text: '91.1113 deste Regulamento, de modo aceitável pela ANAC, e que contenha:

  (1) uma descrição (ou referência a dados aceitáveis pela ANAC) dos trabalhos realizados;

  (2) o nome da pessoa que realizou os trabalhos, se tais trabalhos foram realizados por uma

  pessoa de fora da organização do administrador de programa; e

  (3) o nome ou outra identificação positiva do indivíduo que aprovou o trabalho;'
