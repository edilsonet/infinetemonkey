section_title: 'deste Regulamento, de modo aceitável pela ANAC, e que contenha:'
subsection_id: z
cite: 91.1113(z)
title: 91.1113(z)
text: '(z) um procedimento para aquisição e avaliação das diretrizes de aeronavegabilidade
  e para a

  implementação das ações requeridas;

  (aa) para administradores de programa que utilizarem aeronaves com certificação de tipo
  para mais

  de 9 assentos, a descrição do estabelecimento e manutenção de um sistema de análise para
  monitorar

  continuamente o desempenho e a eficiência do programa de manutenção adotado e corrigir qualquer

  deficiência do referido programa;

  (bb) uma descrição dos modelos de aeronaves aos quais o manual se aplica;

  (cc) uma descrição da metodologia para assegurar que defeitos diagnosticados são registrados
  e

  corrigidos;

  (dd) procedimentos para informar à ANAC ocorrências significativas em serviço;

  (ee) procedimentos para determinação dos mínimos de utilização de aeródromo e demais

  procedimentos especiais de tráfego aéreo, em conformidade com norma do Comando da Aeronáutica;

  (ff) procedimentos operacionais padronizados (SOP) que proporcionem ao pessoal de operações

  de voo orientações para as operações, em todas as fases de voo, de maneira segura, eficiente,
  lógica

  e previsível;

  (gg) descrição das políticas e procedimentos relativos ao relato rotineiro de condições

  meteorológicas e observações em rota, em subida e em outras fases do voo (AIREP);

  (hh) obrigação de informação, por AIREP ESPECIAL das tripulações, quando do encontro de

  fenômenos relacionados a atividades vulcânicas; e

  (ii) outras instruções e procedimentos relativos às operações do administrador de programa,
  a

  critério do administrador de programa.'
