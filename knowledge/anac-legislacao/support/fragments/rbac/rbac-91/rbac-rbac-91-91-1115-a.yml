title: 91.1115(a)
text: '(a) Somente é permitido decolar com uma aeronave com instrumentos e equipamentos inoperantes

  instalados se as seguintes condições forem atendidas:

  (1) deve existir uma MEL aprovada para a aeronave;

  (2) deve haver uma carta da ANAC autorizando operações de acordo com a MEL aprovada. A

  tripulação de voo deve ter acesso direto antes de cada voo a todas as informações contidas
  na MEL

  aprovada por meio de documentação impressa ou outros meios aprovados nas especificações

  administrativas do administrador de programa e colocados à sua disposição. Uma MEL aprovada

  como autorizada pelas especificações administrativas constitui uma alteração aprovada ao
  projeto de

  tipo de aeronave sem requerer nova certificação;

