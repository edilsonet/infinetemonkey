text: '(c) Ressalvado os parágrafos (b)(1) e (b)(3) desta seção, uma aeronave com instrumentos
  e

  equipamentos inoperantes pode ser operada segundo uma autorização especial de voo emitida
  de

  acordo com as seções 21.197 e 21.199 do RBAC nº 21.'
