title: 91.1115(d)
text: '(d) Uma pessoa autorizada a utilizar uma MEL aprovada emitida para uma específica aeronave

  operando segundo os regulamentos operacionais de operador certificado segundo o RBAC nº
  119

  deve utilizar essa MEL para cumprir esta seção.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  SUBPARTE L

  AERONAVEGABILIDADE CONTINUADA'
