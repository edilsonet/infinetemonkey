title: 91.1115(i)
text: '(i) ser preparada de acordo com as limitações especificadas no parágrafo (b) desta
  seção; e

  (ii) prover procedimentos para a operação da aeronave com certos instrumentos e

  equipamentos em condição inoperante;

  (4) registros identificando os equipamentos e instrumentos inoperantes e as informações

  requeridas pelo parágrafo (a)(3)(ii) desta seção devem estar disponíveis para conhecimento
  do piloto;

  e


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (5) a aeronave deve ser operada de acordo com todas as condições e limitações contidas na

  MEL e nas especificações administrativas autorizando o seu uso.'
