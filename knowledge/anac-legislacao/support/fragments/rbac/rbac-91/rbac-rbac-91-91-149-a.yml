section_title: Informação sobre condições potencialmente perigosas
subsection_id: a
cite: 91.149(a)
title: 91.149(a)
text: '(a) Sempre que um piloto encontrar em voo uma condição meteorológica potencialmente
  perigosa

  ou outra anormalidade cuja divulgação esse piloto considerar essencial à segurança de outros
  voos,

  ele deve notificar o órgão ATS e/ou o órgão de meteorologia tão logo seja possível.'
