title: 91.149(b)
text: '(b) Os operadores certificados segundo o RBAC nº 119 ou operando sob o RBAC nº 129
  ou sob a

  subparte K deste Regulamento devem estabelecer políticas e procedimentos para que a tripulação
  de

  voo registre e notifique as informações dispostas no parágrafo (a), inclusive atividades

  vulcânicas. (Incluído pela Resolução nº 606, de 11.02.2021)'
