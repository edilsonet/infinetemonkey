cite: 91.15(a)
title: 91.15(a)
text: '(a) Ressalvada a situação prevista no parágrafo (b) desta seção, o piloto em comando
  de uma

  aeronave civil somente pode permitir que qualquer objeto seja lançado de uma aeronave em
  voo se

  tal operação estiver previamente autorizada pela ANAC.'
