cite: 91.1501(a)
title: 91.1501(a)
text: '(a) Esta Subparte requer que um operador mantenha a aeronavegabilidade continuada de
  cada

  avião. Estes requisitos podem incluir, mas não se limitam a, uma revisão do programa de
  inspeção,

  incorporação de alterações ao projeto e incorporação de revisões às instruções para

  aeronavegabilidade continuada.'
