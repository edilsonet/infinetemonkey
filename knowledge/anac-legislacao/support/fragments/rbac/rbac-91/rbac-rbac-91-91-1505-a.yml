cite: 91.1505(a)
title: 91.1505(a)
text: '(a) Somente é permitido operar um Airbus modelo A-300 (excluindo as séries -600), British

  Aerospace modelo BAC 1-11, Boeing modelo 707, 720, 727, 737, ou 747, McDonnel Douglas

  modelo DC-8, DC-9/MD-80 ou DC-10, Fokker modelo F28, ou Lockheed modelo L-1011 além do

  número aplicável de ciclos de voo para a implementação especificada abaixo, ou até o dia
  25 de maio

  de 2004, o que ocorrer mais tarde, se já tiverem sido desenvolvidas linhas de ação para
  avaliação de

  reparos aplicáveis na superfície do vaso de pressão da fuselagem (revestimento da fuselagem,

  revestimento das portas e almas das cavernas fechadas) e tais linhas de ação tiverem sido
  incorporadas

  ao programa de inspeção aprovado pela ANAC:

  (1) Airbus modelo A300 (excluindo a série -600), o tempo de implementação é:'
