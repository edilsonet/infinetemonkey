section_title: Avaliação de reparos de fuselagens pressurizadas
subsection_id: i
cite: 91.1505(i)
title: 91.1505(i)
text: '(i) modelo B2: 36.000 voos;

  (ii) modelo B4-100 (inclusive o modelo B4-2C): 30.000 voos acima da linha de janelas e

  36.000 voos abaixo da linha de janelas; e

  (iii) modelo B4-200: 25.500 voos acima da linha de janelas e 34.000 voos abaixo da linha

  de janelas;

  (2) para todos os modelos da British Aerospace BAC 1-11, o tempo de implementação é de

  60.000 voos;

  (3) para todos os modelos do Boeing 707, o tempo de implementação é de 15.000 voos;

  (4) para todos os modelos do Boeing 720, o tempo de implementação é de 23.000 voos;

  (5) para todos os modelos do Boeing 727, o tempo de implementação é de 45.000 voos;

  (6) para todos os modelos do Boeing 737, o tempo de implementação é de 60.000 voos;

  (7) para todos os modelos do Boeing 747, o tempo de implementação é de 15.000 voos;

  (8) para todos os modelos de McDonnell Douglas DC-8, o tempo de implementação é de 30.000

  voos;

  (9) para todos os modelos de McDonnell Douglas DC-9/MD-80, o tempo de implementação é

  de 60.000 voos;

  (10) para todos os modelos de McDonnell Douglas DC-10, o tempo de implementação é de

  30.000 voos;


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (11) para todos os modelos de Lockheed L-1011, o tempo de implementação é de 27.000 voos;

  e

  (12) para os modelos Fokker F-28 Mark 1000, 2000, 3000, e 4000, o tempo de implementação

  é de 60.000 voos.'
