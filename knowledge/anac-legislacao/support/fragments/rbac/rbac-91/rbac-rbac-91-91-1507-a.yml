cite: 91.1507(a)
title: 91.1507(a)
text: '(a) Esta seção aplica-se a aviões categoria transporte, com motores a turbina e com
  certificado de

  tipo emitido após 1º de janeiro de 1958, que, como resultado de um certificado de tipo original
  ou

  posterior aumento da capacidade, tenha:

  (1) capacidade máxima de assentos para passageiros certificada para o tipo de 30 ou mais

  assentos; ou

  (2) capacidade máxima de carga paga igual ou maior que 3400 kg (7500 lb).'
