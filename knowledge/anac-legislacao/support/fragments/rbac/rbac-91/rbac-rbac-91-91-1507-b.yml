section_title: Programa de inspeção dos tanques de combustível
subsection_id: b
cite: 91.1507(b)
title: 91.1507(b)
text: '(b) Somente é permitido operar um avião identificado no parágrafo (a) desta seção se
  o programa

  de inspeção para aquele avião incluir Instruções para Aeronavegabilidade Continuada (ICA)
  para

  sistemas de tanques de combustível desenvolvidas de acordo com as provisões do RBHA-E 88

  vigente até 30 de junho de 2021, ou requisito considerado equivalente pela ANAC (incluindo
  aquelas

  desenvolvidas para tanques auxiliares de combustível, se houver algum, instalados de acordo
  com um

  certificado suplementar de tipo ou outras aprovações de projeto). (Redação dada pela Resolução
  nº

  624, de 07.06.2021)


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  SUBPARTE M

  [RESERVADO]


  SUBPARTE N

  AUTORIZAÇÃO PARA OPERAÇÕES ESPECÍFICAS'
