section_title: Requisitos de combustível e óleo para voos visuais (VFR)
subsection_id: a
cite: 91.151(a)
title: 91.151(a)
text: '(a) Somente é permitido começar um voo VFR em um avião se, considerando vento e condições

  meteorológicas conhecidas, houver combustível e óleo suficiente para voar até o local previsto
  para

  primeiro pouso e, assumindo velocidade normal de cruzeiro:

  (1) durante o dia, voar mais, pelo menos, 30 minutos, exceto para voos acrobáticos afastados

  no máximo 50 km (27 NM) de um aeródromo; ou

  (2) durante a noite, voar mais, pelo menos, 45 minutos.'
