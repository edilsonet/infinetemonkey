section_title: Requisitos de combustível e óleo para voos visuais (VFR)
subsection_id: b
cite: 91.151(b)
title: 91.151(b)
text: '(b) Somente é permitido começar um voo VFR em um helicóptero se, considerando vento
  e

  condições meteorológicas conhecidas, houver combustível e óleo suficiente para voar até
  o local

  previsto para primeiro pouso e, assumindo consumo normal de cruzeiro, voar mais, pelo menos,
  20

  minutos.'
