section_title: Uso de substâncias psicoativas
subsection_id: a
cite: 91.17(a)
title: 91.17(a)
text: '(a) É vedado a qualquer pessoa atuar ou tentar atuar em atividades reguladas pela ANAC
  enquanto:

  (1) [reservado];

  (2) sob efeito de álcool ou fazendo uso de bebida alcoólica;

  (3) sob efeito ou fazendo uso de substância psicoativa (conforme definido no RBAC nº 120)

  que afete, de qualquer maneira contrária à segurança operacional, as faculdades desta pessoa;
  ou

  (4) possuir qualquer concentração de álcool no organismo. A tolerância estará condicionada
  à

  margem de erro nominal do aparelho utilizado para medir a concentração, observada a legislação

  metrológica.'
