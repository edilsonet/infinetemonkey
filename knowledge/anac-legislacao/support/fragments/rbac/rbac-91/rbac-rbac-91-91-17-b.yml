section_title: Uso de substâncias psicoativas
subsection_id: b
cite: 91.17(b)
title: 91.17(b)
text: '(b) Exceto em emergências, um piloto em comando não deve permitir que seja transportada

  naquela aeronave uma pessoa que aparente estar intoxicada ou sob influência de substância

  psicoativa, incluindo álcool, de forma que possa comprometer a segurança de voo.'
