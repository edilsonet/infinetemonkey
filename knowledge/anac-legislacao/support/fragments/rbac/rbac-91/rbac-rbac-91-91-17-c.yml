cite: 91.17(c)
title: 91.17(c)
text: '(c) A ANAC poderá solicitar a uma pessoa que tenha atuado ou tentado atuar em atividades

  reguladas pela ANAC, após a atuação ou tentativa de atuação, que se submeta a exame toxicológico

  realizado por meio de etilômetro mantido e utilizado conforme o parágrafo 120.331(e) do
  RBAC nº

  120, de forma a verificar a concentração de álcool no organismo.'
