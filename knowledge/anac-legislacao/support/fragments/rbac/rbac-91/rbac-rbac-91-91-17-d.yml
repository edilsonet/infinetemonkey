section_title: Uso de substâncias psicoativas
subsection_id: d
cite: 91.17(d)
title: 91.17(d)
text: '(d) Sempre que houver base razoável para acreditar que uma pessoa violou os requisitos
  do

  parágrafo (a)(2), (a)(3) ou (a)(4) desta seção, a ANAC poderá solicitar que essa pessoa
  se submeta a

  um exame toxicológico, de forma a verificar a presença e a concentração de:

  (1) álcool, por meio de exame toxicológico realizado com etilômetro mantido e utilizado

  conforme o parágrafo 120.331(e) do RBAC nº 120, até 2 (duas) horas após a pessoa ter atuado
  ou

  pretendido atuar em suas atividades; ou

  (2) outras substâncias psicoativas, por meio de exame toxicológico laboratorial realizado
  até 32

  horas após a pessoa ter atuado ou pretendido atuar em suas atividades.'
