cite: 91.17(e)
title: 91.17(e)
text: '(e) Os resultados dos exames toxicológicos obtidos pela ANAC de acordo com os parágrafos
  (c)

  e (d) desta seção serão utilizados para avaliar as condições psicofísicas da pessoa, a fim
  de comprovar

  a conformidade ou violações aos requisitos desta seção e poderão ser utilizados como evidência
  em

  qualquer processo administrativo ou judicial.'
