title: 91.17(f)
text: '(f) A matriz corporal, as substâncias psicoativas avaliadas e os valores de corte a
  serem utilizados

  no âmbito de um exame toxicológico laboratorial realizado em conformidade com os requisitos
  do

  parágrafo (d)(2) desta seção para avaliar o cumprimento do previsto no parágrafo (a)(3)
  desta seção

  constam no RBAC nº 120 e em instrução suplementar específica.'
