cite: 91.17(g)
title: 91.17(g)
text: '(g) O exame toxicológico laboratorial requerido pelo parágrafo (d)(2) desta seção será
  realizado

  em conformidade com o parágrafo 120.331(f) do RBAC nº 120. Será garantido ao regulado o
  direito

  à atuação de um médico revisor, aceitável perante a ANAC, para determinar se o resultado
  positivo


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  de um exame toxicológico é devido a um tratamento legítimo ou outra fonte inócua, assim
  como

  avaliar se um indivíduo não pôde realizar um exame toxicológico por não poder produzir a
  amostra

  corporal necessária em razão de uma condição médica específica, assim como o direito à contraprova

  para um resultado de exame toxicológico laboratorial positivo. Esta análise de contraprova
  será

  realizada segundo os padrões utilizados na obtenção do resultado positivo.'
