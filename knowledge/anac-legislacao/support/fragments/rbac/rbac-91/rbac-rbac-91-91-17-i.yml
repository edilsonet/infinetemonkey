section_title: Uso de substâncias psicoativas
subsection_id: i
cite: 91.17(i)
title: 91.17(i)
text: '(i) A recusa de submeter-se à realização de um exame toxicológico em conformidade com
  os

  parágrafos (c) e (d) desta seção ou a confirmação de um resultado positivo obtido a partir
  do referido

  exame acarretará ao detentor de licença, certificado ou autorização a suspensão cautelar
  automática

  de sua licença, certificado ou autorização e demais providências administrativas cabíveis
  em

  conformidade com a Resolução nº 472, de 6 de junho de 2018.'
