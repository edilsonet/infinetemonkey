cite: 91.1703(b)
title: 91.1703(b)
text: '(b) Para a obtenção de autorização de operação específica, o interessado deve comprovar,
  de forma

  aceitável pela ANAC:

  (1) a capacidade das aeronaves para conduzir operações específicas cuja aprovação é solicitada;

  (2) a qualificação do pessoal envolvido na operação, manutenção e supervisão dos sistemas

  requeridos pelas operações específicas nas aeronaves;

  (3) a capacidade do operador realizar as operações específicas, que deve estar refletida
  nos

  manuais, para o caso de detentores de certificado emitido segundo o RBAC nº 119 ou de

  especificações administrativas emitidas segundo a Subparte K deste Regulamento; e (Redação
  dada

  pela Resolução nº 606, de 11.02.2021)

  (4) as habilitações dos tripulantes técnicos no modelo da aeronave que realizará as operações

  específicas.'
