cite: 91.1703(d)
title: 91.1703(d)
text: '(d) Os detentores de certificado emitido segundo o RBAC nº 119 ou de especificações

  administrativas emitidas segundo a Subparte K deste Regulamento devem inserir no seu programa
  de

  treinamento inicial e periódico o treinamento referente às qualificações requeridas no parágrafo
  (b)(2)

  desta seção e devem prover treinamento a todos os tripulantes de voo, o pessoal de manutenção
  e os

  despachantes operacionais de voo (DOV), conforme aplicável, envolvidos nas operações específicas

  cuja aprovação é solicitada. (Redação dada pela Resolução nº 606, de 11.02.2021)'
