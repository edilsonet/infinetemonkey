cite: 91.1703(e)
title: 91.1703(e)
text: '(e) Os operadores não abrangidos pelo parágrafo (e) desta seção devem prover um treinamento

  referente às qualificações requeridas no parágrafo (b)(2) desta seção a todos os tripulantes
  de voo, o

  pessoal de manutenção e os DOV, conforme aplicável, envolvidos nas operações específicas
  cuja

  aprovação é solicitada, inicialmente e a cada dois anos.'
