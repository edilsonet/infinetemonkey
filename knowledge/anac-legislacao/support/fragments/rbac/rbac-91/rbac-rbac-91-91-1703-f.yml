title: 91.1703(f)
text: '(f) Cada operador aéreo autorizado pela ANAC a realizar operações específicas só pode
  realizá-

  las se mantiver a conformidade dos procedimentos previstos na sua autorização, das aeronaves,
  de

  cada equipamento de solo requerido e do treinamento do pessoal envolvido em qualquer etapa
  ou

  procedimento relacionado na autorização correspondente, conforme aplicáveis.'
