title: 91.1703(g)
text: '(g) Para os propósitos desta Subparte, operação específica significa qualquer operação,
  que deve

  ser autorizada pela ANAC de acordo com esta Subparte, cuja execução possua pré-requisitos
  técnicos

  estabelecidos em regulamentação da ANAC. Não se limitam necessariamente às operações listadas


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  nesta Subparte e outras não listadas podem ser autorizadas desde que atendam os requisitos
  desta

  seção.'
