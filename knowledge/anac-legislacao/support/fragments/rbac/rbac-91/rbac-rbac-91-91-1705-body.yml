title: Operações definidas por Navegação Baseada em Desempenho (PBN)
text: '91.1705 Operações definidas por Navegação Baseada em Desempenho (PBN)

  Para obter e manter autorização operacional para realizar qualquer operação PBN, um operador
  aéreo

  deve atender ao disposto na seção 91.1703 deste Regulamento.'
