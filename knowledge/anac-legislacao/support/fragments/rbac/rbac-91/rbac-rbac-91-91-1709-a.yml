title: 91.1709(a)
text: '(a) Para obter e manter autorização operacional para realizar qualquer operação em
  espaço aéreo

  RVSM, um operador aéreo deve atender ao disposto nesta seção e na seção 91.1703 deste

  Regulamento, exceto nos casos previstos no parágrafo (c) desta seção.'
