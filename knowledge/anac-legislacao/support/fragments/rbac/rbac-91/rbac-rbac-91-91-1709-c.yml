title: 91.1709(c)
text: '(c) É proibido operar em um voo específico em espaço aéreo RVSM sem uma autorização
  de

  operação em espaço aéreo RVSM emitida pela ANAC, exceto se o operador informar tal condição

  ao DECEA antes do voo específico e o DECEA autorizar a operação.'
