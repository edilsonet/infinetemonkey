section_title: Verificação do equipamento de VOR para voo IFR
subsection_id: a
cite: 91.171(a)
title: 91.171(a)
text: '(a) Somente é permitido operar uma aeronave civil em voo IFR usando um sistema de rádio-

  navegação VOR (VHF omnidirectional range) se o equipamento VOR da aeronave:

  (1) for mantido, verificado e inspecionado conforme um procedimento aprovado; ou


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (2) tiver sido verificado operacionalmente dentro dos últimos 30 dias e tiver sido comprovado

  encontrar-se dentro dos limites permissíveis de erro de indicação de marcação magnética

  estabelecidos nos parágrafos (b) ou (c) desta seção.'
