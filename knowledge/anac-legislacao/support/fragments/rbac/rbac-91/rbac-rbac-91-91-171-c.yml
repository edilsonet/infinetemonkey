title: 91.171(c)
text: '(c) desta seção, deve registrar a data, local, erro de marcação e sua assinatura no
  livro de manutenção

  de bordo ou documento similar. Adicionalmente, se o sinal para o teste foi emitido por uma

  organização de manutenção certificada como previsto no parágrafo (b)(1) desta seção, essa

  organização deve certificar, no livro de manutenção (ou documento similar), que o sinal
  foi por ela

  transmitido e registrar a data da transmissão.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  SUBPARTE C

  REQUISITOS DE EQUIPAMENTOS, INSTRUMENTOS E CERTIFICADOS'
