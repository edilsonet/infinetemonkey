cite: 91.1711(b)
title: 91.1711(b)
text: '(b) Para solicitar autorização para realizar qualquer aproximação de precisão ILS categorias
  II ou

  III, além do requerido pela seção 91.1703:


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (1) as aeronaves que realizarão as aproximações devem possuir os instrumentos e equipamentos

  especificados no parágrafo 91.205(d) deste Regulamento;

  (2) o operador aéreo deve encaminhar à ANAC as informações pertinentes referentes a cada

  aeródromo onde pretenda realizar as aproximações; e

  (3) o operador aéreo deve encaminhar uma proposta dos mínimos de utilização do aeródromo

  para cada aeródromo onde pretenda realizar as aproximações.'
