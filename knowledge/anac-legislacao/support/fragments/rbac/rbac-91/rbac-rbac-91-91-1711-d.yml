section_title: Aproximações de precisão ILS categorias II e III
subsection_id: d
cite: 91.1711(d)
title: 91.1711(d)
text: '(d) Para a aprovação de aproximações de precisão ILS categoria III, o operador deve
  comprovar

  que a tripulação cumpriu o treinamento em simulador de voo nível C ou D no respectivo modelo
  de

  aeronave pretendida (e caso não seja viável, da forma alternativa estabelecida pela ANAC),
  e que a

  aeronave foi operada por um período de pelo menos 6 meses e 100 aproximações com os mínimos
  da

  categoria II, utilizando os procedimentos de operação e manutenção esperados quando a DH
  é

  atingida.'
