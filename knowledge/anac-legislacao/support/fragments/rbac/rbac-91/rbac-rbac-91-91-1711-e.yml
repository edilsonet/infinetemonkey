title: 91.1711(e)
text: '(e) Se o número de aproximações não bem sucedidas exceder 5% do total de aproximações

  requeridas pelos parágrafos (c) e (d) desta seção, o número de aproximações requeridas deve
  ser

  aumentada em pelo menos 10 até que se obtenha um índice de insucesso máximo de 5%.'
