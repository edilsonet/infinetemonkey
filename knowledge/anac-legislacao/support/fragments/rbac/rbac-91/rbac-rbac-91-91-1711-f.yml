section_title: Aproximações de precisão ILS categorias II e III
subsection_id: f
cite: 91.1711(f)
title: 91.1711(f)
text: '(f) Somente é permitido operar uma aeronave civil em aproximações de precisão ILS categorias
  II

  ou III se a tripulação consistir de um piloto em comando e um segundo em comando, ambos

  possuidores das apropriadas licenças, habilitações e autorizações emitidas ou reconhecidas
  pela

  ANAC.'
