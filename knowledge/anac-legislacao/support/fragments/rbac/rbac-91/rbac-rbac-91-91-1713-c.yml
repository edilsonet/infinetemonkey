cite: 91.1713(c)
title: 91.1713(c)
text: '(c) Para as situações previstas no parágrafo (d) desta seção, uma autorização para
  exceder Mach 1

  sobre o continente pode ser concedida pela ANAC se:

  (1) o operador demonstrar que não é viável que os voos sejam realizados sobre áreas oceânicas;

  (2) o operador enviar uma descrição da área de ensaios proposta, incluindo uma análise que

  demonstre que os possíveis efeitos dos estrondos sônicos não resultarão em danos ambientais
  na

  superfície desta;

  (3) a área impactada pelo estrondo sônico for desabitada; e

  (4) o operador demonstrar que o estrondo sônico não atingirá significativamente a superfície

  fora da área autorizada.'
