section_title: Autorização para exceder Mach 1
subsection_id: d
cite: 91.1713(d)
title: 91.1713(d)
text: '(d) A ANAC somente emitirá autorização para exceder Mach 1 de acordo com as condições

  impostas pelo parágrafo (c) desta seção em voos para:


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (1) demonstração de conformidade com requisitos de aeronavegabilidade;

  (2) determinação das características do estrondo sônico do avião; ou

  (3) avaliação de meios para reduzir ou eliminar os efeitos do estrondo sônico.'
