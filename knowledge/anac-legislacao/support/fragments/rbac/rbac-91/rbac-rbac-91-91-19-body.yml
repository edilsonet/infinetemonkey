text: '91.19 Transporte de substâncias ou medicamentos sujeitos a controle especial

  Somente é permitido transportar, em uma aeronave civil dentro do Brasil, substâncias e medicamentos

  sujeitos a controle especial se devidamente autorizado pelas autoridades judiciais, policiais
  ou

  sanitárias competentes.'
