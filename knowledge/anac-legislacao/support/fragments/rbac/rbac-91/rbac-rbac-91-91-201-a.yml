title: 91.201(a)
text: '(a) Para os efeitos deste Regulamento, costa significa uma área de terra adjacente
  à superfície

  líquida e que esteja acima da marca mais alta de nível de água, excluindo áreas de terra
  que estejam

  intermitentemente sob a água.'
