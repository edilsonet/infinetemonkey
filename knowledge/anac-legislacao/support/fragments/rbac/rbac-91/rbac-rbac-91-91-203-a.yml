cite: 91.203(a)
title: 91.203(a)
text: '(a) Exceto se de outra forma autorizado por regulamento de operação específico, somente
  é

  permitido operar uma aeronave civil brasileira se ela tiver a bordo os seguintes documentos:

  (1) certificado de matrícula e certificado de aeronavegabilidade, válidos, emitidos pela
  ANAC

  em nome do operador, exceto para os casos previstos nos parágrafos (b), (c) e (e) desta
  seção;

  (2) os requeridos segundo o parágrafo 91.9(b) deste regulamento e a lista condensada de

  verificações (checklist) da aeronave;

  (3) publicações aeronáuticas apropriadas impressas ou de outra forma expressamente

  autorizada pela ANAC, válidas e atualizadas, contendo informações adequadas concernentes
  a

  auxílios de navegação, procedimentos de aproximação e saída, e demais informações aeronáuticas

  referentes à rota a ser voada e aos aeródromos a serem utilizados;

  (4) diário de bordo devidamente preenchido. No caso de aeronaves engajadas em atividades
  de

  recreio ou desporto, o diário de bordo não precisa estar a bordo quando for inviável o seu
  transporte

  devido às características construtivas da aeronave. No entanto, ele deve ser atualizado
  tão logo quanto

  praticável;

  (5) apólice de seguro ou certificado de seguro válido;

  (6) licença de estação da aeronave válida ou outro documento aceitável que a

  substitua; (Redação dada pela Resolução nº 606, de 11.02.2021)

  (7) certificado de verificação de aeronavegabilidade (CVA) ou laudo de vistoria de aeronave,

  conforme previsto nos parágrafos 91.327(b)(2) e 91.403(f) deste Regulamento;

  (8) documentos e manuais requeridos conforme o tipo de operação aplicável;

  (9) as autorizações de operações especiais ou específicas, se aplicável;

  (10) lista de passageiros, se aplicável, exceto para aeronave experimental, leve esportiva
  ou

  planador, que deve ser mantida pelo operador por no mínimo 1 ano após o voo;

  (11) manifesto de carga, com informações sobre o peso e o balanceamento da aeronave,

  devidamente preenchido, sempre que houver transporte de passageiro(s) e/ou carga; e

  (12) ficha de peso e balanceamento, com a respectiva planta-baixa da configuração aprovada

  para voo, referente à última pesagem requerida para a aeronave pela seção 91.423 deste regulamento

  ou por regulamento específico.'
