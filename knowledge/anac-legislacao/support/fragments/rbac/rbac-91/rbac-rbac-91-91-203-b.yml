cite: 91.203(b)
title: 91.203(b)
text: '(b) Somente é permitido operar uma aeronave experimental se ela possuir a bordo um
  CAVE e,

  quando aplicável, o respectivo certificado de marca experimental (CME).


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.'
