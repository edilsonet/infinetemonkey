cite: 91.203(c)
title: 91.203(c)
text: '(c) Somente é permitido operar uma aeronave que possua um certificado de tipo provisório
  se ela

  possuir a bordo um certificado de aeronavegabilidade provisório conforme o RBAC nº 21 e
  Resolução

  nº 293, de 19 de novembro de 2013.'
