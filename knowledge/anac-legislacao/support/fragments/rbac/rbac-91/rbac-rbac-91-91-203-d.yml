cite: 91.203(d)
title: 91.203(d)
text: '(d) Somente é permitido operar uma aeronave civil, brasileira ou estrangeira, dentro
  do território

  brasileiro, se tiverem sido cumpridos os requisitos de drenagem de combustível e de emissões
  de

  motores de aeronaves, estabelecidos pelo RBAC nº 34.'
