section_title: Aeronave civil - documentos requeridos
subsection_id: e
cite: 91.203(e)
title: 91.203(e)
text: '(e) Somente é permitido operar uma aeronave nova, fabricada no Brasil e ainda não entregue
  ao

  seu proprietário ou operador, se a operação for conduzida pelo seu fabricante e a aeronave
  possuir a

  bordo um certificado de aeronavegabilidade especial, conforme os propósitos definidos no
  RBAC nº

  21.'
