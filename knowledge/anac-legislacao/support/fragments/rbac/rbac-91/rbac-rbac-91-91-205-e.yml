title: 91.205(e)
text: '(e) Se for requerido equipamento de navegação VOR pelo parágrafo (d)(2) desta seção,
  somente

  é permitido operar uma aeronave civil registrada no Brasil em altitude igual ou acima do
  FL240 se a

  aeronave estiver equipada com um equipamento interrogador de medida de distância (Distance

  Measuring Equipment - DME) aprovado ou sistema RNAV adequado. Se o equipamento DME ou


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  sistema RNAV requerido por este parágrafo falhar quando voando em altitude igual ou acima
  do

  FL240, o piloto em comando deve informar imediatamente ao órgão ATS, mas pode continuar
  o voo

  até o próximo aeródromo onde seja possível reparar ou substituir o equipamento.'
