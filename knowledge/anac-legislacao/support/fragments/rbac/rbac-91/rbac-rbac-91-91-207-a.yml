id: rbac-rbac-91-91-207-a
kind: rbac
document: rbac-91
family: '91'
section_id: '91.207'
section_title: Transmissores localizadores de emergência (ELT) e Personal Locator Beacon (PLB)
subsection_id: a
cite: 91.207(a)
title: 91.207(a)
text: '(a) Exceto como previsto nos parágrafos (e) e (f) desta seção, somente é permitido
  operar uma

  aeronave civil registrada no Brasil se existir:

  (1) no caso de avião com capacidade máxima acima de 19 passageiros, um ELT do tipo

  automático e outro ELT de qualquer tipo (podendo este último ser o requerido pelo parágrafo
  (a)(3)

  desta seção, se aplicável), que estejam em condições operacionais, para as operações regidas
  pelos

  de 2008 podem possuir apenas um ELT do tipo automático;

  (2) no caso de operações em avião que não aquelas especificadas no parágrafo (a)(1) desta

  seção, um ELT de tipo automático (não podendo este ser o requerido pelo parágrafo (a)(3)
  desta

  seção) em condições operacionais;

  (3) no caso de qualquer avião de tipo certificado na categoria transporte voando a mais
  de 185

  km (100 NM), ou avião de tipo não certificado na categoria transporte voando a mais de 93
  km (50

  NM), da costa mais próxima, exceto em operações segundo o RBAC nº 121, um ELT portátil ou
  de

  sobrevivência, flutuante e à prova d’água, em um bote inflável ou em um colete salva-vidas,
  que

  esteja em condições operacionais;

  (4) [reservado]; e

  (5) no caso de planador, aeronave leve esportiva, rebocador de planador, aeronave de acrobacia,

  aeronave lançadora de paraquedista ou aeronave voltada para o aerodesporto em geral, um
  ELT de

  qualquer tipo, um PLB ou outro dispositivo similar autorizado pela ANAC.'
