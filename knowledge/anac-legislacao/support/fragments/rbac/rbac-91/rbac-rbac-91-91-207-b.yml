section_title: Transmissores localizadores de emergência (ELT) e Personal Locator Beacon (PLB)
subsection_id: b
cite: 91.207(b)
title: 91.207(b)
text: '(b) Cada ELT requerido pelo parágrafo (a) desta seção deve ser colocado na aeronave
  de modo a

  minimizar a probabilidade de danos ao ELT na eventualidade de acidente. Os ELT automáticos
  fixos

  ou automáticos ejetáveis devem ser fixados à aeronave tão para trás quanto praticável.'
