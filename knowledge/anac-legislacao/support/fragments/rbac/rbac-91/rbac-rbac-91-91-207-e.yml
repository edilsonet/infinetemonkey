section_title: Transmissores localizadores de emergência (ELT) e Personal Locator Beacon (PLB)
subsection_id: e
cite: 91.207(e)
title: 91.207(e)
text: '(e) Ressalvado o parágrafo (a) desta seção, uma pessoa pode trasladar um avião desde
  que não

  esteja a bordo nenhuma pessoa além de tripulantes com função a bordo e que o traslado seja:

  (1) de um avião recentemente adquirido do local onde este foi comprado, para o local onde
  o

  ELT será instalado; e

  (2) de um avião de um local onde o ELT não possa ser reparado ou substituído, para um local

  onde esse serviço possa ser feito.'
