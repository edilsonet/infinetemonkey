cite: 91.207(f)
title: 91.207(f)
text: '(f) O parágrafo (a) desta seção não se aplica a:

  (1) aviões enquanto engajados em operações de treinamento de voo local conduzidas

  inteiramente dentro de uma área com raio igual a 93 km (50 NM) e centro no aeródromo de
  origem

  do voo;

  (2) aviões enquanto engajados em vôos relacionados com projetos e ensaios;

  (3) aviões novos enquanto engajados em vôos relacionados com produção, recebimento,

  preparação e entrega;

  (4) aviões enquanto engajados em serviços aéreos de aplicação de agentes químicos e outras

  substâncias usadas em operações agrícolas;

  (5) aviões aprovados pelas autoridades aeronáuticas para operações de pesquisas e

  desenvolvimento;

  (6) aviões enquanto utilizados para demonstrar conformidade com requisitos, para treinamento

  de tripulantes e para exibições, competições ou pesquisas de mercado;

  (7) aviões com capacidade para transportar a bordo somente uma pessoa e aviões categoria

  primária;

  (8) aviões enquanto encontrem-se em situação na qual o ELT tenha sido temporariamente

  removido para inspeção, reparo, alteração ou substituição, sujeito às seguintes condições:'
