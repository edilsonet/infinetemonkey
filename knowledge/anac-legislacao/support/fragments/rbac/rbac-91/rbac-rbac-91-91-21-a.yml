title: 91.21(a)
text: '(a) Exceto como previsto no parágrafo (b) desta seção, é vedado utilizar e é vedado
  ao operador

  de uma aeronave autorizar a utilização de qualquer dispositivo eletrônico portátil em qualquer

  aeronave civil registrada no Brasil enquanto operada sob IFR.'
