section_title: Dispositivos eletrônicos portáteis
subsection_id: b
cite: 91.21(b)
title: 91.21(b)
text: '(b) O parágrafo (a) desta seção não se aplica a:

  (1) gravador de som portátil;

  (2) prótese auditiva;

  (3) marca-passo cardíaco;

  (4) barbeador elétrico; ou

  (5) qualquer outro dispositivo eletrônico portátil que o operador da aeronave tenha determinado,

  de forma aceitável pela ANAC, não causar interferência com os sistemas de comunicações ou
  de

  navegação da aeronave na qual ele está sendo utilizado.'
