section_title: Oxigênio suplementar
subsection_id: a
cite: 91.211(a)
title: 91.211(a)
text: '(a) Uma aeronave civil registrada no Brasil somente pode ser operada:

  (1) em altitudes-pressão de cabine acima de 12.500 pés MSL (Mean Sea Level) até 14.000 pés

  MSL, inclusive, se a tripulação de voo mínima requerida for provida de e usar oxigênio suplementar

  durante as partes do voo a essas altitudes que tenham mais de 30 minutos de duração; e

  (2) em altitudes-pressão de cabine acima de 14.000 pés MSL se cada ocupante da aeronave
  for

  provido de, e cada tripulante usar, oxigênio suplementar durante todo o tempo de voo nessas
  altitudes.'
