section_title: Oxigênio suplementar
subsection_id: i
cite: 91.211(i)
title: 91.211(i)
text: '(i) acima do FL250 se pelo menos 10 minutos de suprimento de oxigênio suplementar,
  em

  adição a qualquer oxigênio requerido para satisfazer ao parágrafo (a) desta seção, estiver
  disponível

  para uso de cada ocupante da aeronave na eventualidade de ser necessária uma descida por
  perda de

  pressurização da cabine;

  (ii) acima do FL350 se um dos pilotos nos controles da aeronave estiver utilizando uma

  máscara de oxigênio colocada e ajustada em sua face e que forneça oxigênio continuamente,
  ou passe

  a fornecer automaticamente caso a altitude de pressão de cabine exceda 14.000 pés MSL. No
  entanto,

  o piloto não precisa colocar e usar a máscara enquanto voando abaixo do FL410, desde que
  existam

  dois pilotos nos controles da aeronave e cada um deles disponha de uma máscara de colocação
  rápida,


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  que possa ser colocada em 5 segundos usando apenas uma das mãos, e que se ajuste e passe
  a fornecer

  oxigênio automaticamente tão logo seja colocada sobre a face; e

  (iii) acima do FL125 se quantidade suficiente de suprimento de oxigênio suplementar estiver

  disponível para uso de cada ocupante da aeronave durante todo o período que a altitude de
  pressão de

  cabine exceda 12.500 pés MSL, na eventualidade de ser necessária uma descida por perda de

  pressurização da cabine; e

  (2) ressalvado o previsto no parágrafo (b)(1)(ii) desta seção, se por alguma razão e a qualquer

  tempo for necessário que um piloto deixe seu posto nos controles da aeronave quando operando
  acima

  do FL350, o piloto remanescente nos controles deve colocar e usar sua máscara até o retorno
  do outro

  piloto a seu posto.'
