title: 91.213(a)
text: '(a) Exceto como previsto no parágrafo (d) desta seção, somente é permitido decolar
  com uma

  aeronave civil com equipamentos ou instrumentos instalados inoperantes se as seguintes condições

  forem atendidas:

  (1) exista a bordo da aeronave uma Lista de Equipamentos Mínimos (MEL) desenvolvida pelo

  operador da aeronave;

  (2) a MEL tenha sido aprovada pela ANAC. Essa aprovação pode ser requerida pelo detentor

  do certificado de aeronavegabilidade da aeronave. Para efeitos legais, uma MEL desenvolvida
  pelo

  operador e aprovada pela ANAC constitui um certificado suplementar de tipo da aeronave;

