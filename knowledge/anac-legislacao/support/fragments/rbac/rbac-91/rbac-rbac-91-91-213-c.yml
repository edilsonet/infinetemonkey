cite: 91.213(c)
title: 91.213(c)
text: '(c) Uma pessoa autorizada a utilizar uma MEL emitida segundo a Subparte K deste Regulamento

  ou por operador certificado segundo o RBAC nº 119, para uma aeronave específica, deve utilizar
  essa

  MEL para atender aos requisitos desta seção. (Redação dada pela Resolução nº 606, de 11.02.2021)


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.'
