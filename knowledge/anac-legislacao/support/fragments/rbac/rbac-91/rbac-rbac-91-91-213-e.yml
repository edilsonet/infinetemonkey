text: '(e) Ressalvada qualquer provisão desta seção, uma aeronave com instrumentos ou equipamentos

  inoperantes pode ser operada de acordo com uma autorização especial de voo emitida de acordo
  com

  as seções 21.197 e 21.199 do RBAC nº 21.'
