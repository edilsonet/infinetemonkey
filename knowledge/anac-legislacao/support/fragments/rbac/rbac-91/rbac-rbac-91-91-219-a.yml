title: 91.219(a)
text: '(a) Exceto como previsto no parágrafo (d) desta seção, somente é permitido operar um
  avião civil

  a reação registrado no Brasil se esse avião for equipado com um dispositivo ou sistema de
  alarme de

  altitude aprovado e esse dispositivo ou sistema estiver operativo e cumprir os requisitos
  do parágrafo'
