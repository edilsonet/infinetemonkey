section_title: Dispositivo ou sistema de alerta de altitude. Aviões civis a reação
subsection_id: c
cite: 91.219(c)
title: 91.219(c)
text: '(c) Cada operador a quem esta seção se aplica deve estabelecer e designar procedimentos
  para o

  uso do dispositivo ou sistema de alerta de altitude e cada tripulante de voo deve cumprir
  com os

  procedimentos a ele designados.'
