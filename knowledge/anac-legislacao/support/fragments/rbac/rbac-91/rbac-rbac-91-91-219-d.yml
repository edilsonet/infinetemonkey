section_title: Dispositivo ou sistema de alerta de altitude. Aviões civis a reação
subsection_id: d
cite: 91.219(d)
title: 91.219(d)
text: '(d) O parágrafo (a) desta seção não se aplica à operação de um avião que tenha um CAVE
  ou a

  operações de um avião com os seguintes propósitos:

  (1) trasladar um avião recentemente adquirido do local onde ele foi comprado para o local
  onde

  o dispositivo ou sistema será instalado;

  (2) continuar um voo como originalmente planejado, se o dispositivo ou sistema se tornar

  inoperante após o avião ter decolado;

  (3) trasladar o avião de um local onde não se possa reparar ou substituir o dispositivo
  ou sistema

  de alarme de altitude inoperante para um local onde isso possa ser feito;

  (4) conduzir voo de ensaio ou de experiência em um avião;

  (5) trasladar um avião para fora do Brasil com o propósito de exportá-lo;

  (6) conduzir demonstração para venda do avião; e

  (7) treinar tripulantes estrangeiros na operação do avião antes de exportá-lo para outro
  país.'
