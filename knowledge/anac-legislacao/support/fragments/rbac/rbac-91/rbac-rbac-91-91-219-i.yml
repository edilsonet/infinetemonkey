id: rbac-rbac-91-91-219-i
kind: rbac
document: rbac-91
family: '91'
section_id: '91.219'
section_title: Dispositivo ou sistema de alerta de altitude. Aviões civis a reação
subsection_id: i
cite: 91.219(i)
title: 91.219(i)
text: '(i) ao aproximar-se de uma altitude pré-selecionada, na subida ou na descida, por uma

  sequência de sinais sonoros e visuais, em tempo suficiente para estabelecer voo nivelado
  na altitude

  pré-selecionada; ou

  (ii) ao aproximar-se de uma altitude pré-selecionada, na subida ou na descida, por uma

  sequência de sinais visuais, com tempo suficiente para estabelecer voo nivelado na altitude
  pré-

  selecionada e, ao desviar-se para cima ou para baixo da altitude pré-selecionada, por sinais
  sonoros;

  (2) prover os sinais requeridos desde o nível do mar até a maior altitude de operação aprovada

  para o avião em que está instalado;

  (3) permitir pré-seleção de altitudes em incrementos que sejam compatíveis com as altitudes

  em que o avião seja operado;

  (4) ser testado, sem equipamento especial, para determinação do funcionamento apropriado
  dos

  sinais de alerta; e

  (5) aceitar ajustes de pressão barométrica, se o sistema ou dispositivo operar em função
  dessa

  pressão. No entanto, para operações abaixo de 3.000 pés acima do nível do solo (AGL), o
  sistema ou

  dispositivo pode fornecer apenas um sinal, visual ou sonoro, para cumprir este parágrafo.
  Pode ser

  utilizado um rádio altímetro para prover esse sinal na determinação da altitude/altura de
  decisão

  (DA/DH) ou da altitude mínima de descida (MDA), se o operador tiver um procedimento aprovado

  para sua utilização.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.'
