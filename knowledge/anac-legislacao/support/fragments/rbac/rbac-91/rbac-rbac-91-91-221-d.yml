cite: 91.221(d)
title: 91.221(d)
text: '(d) Aeronaves categoria transporte com configuração instalada para passageiros com
  mais de 30

  assentos, que tenham recebido seu primeiro certificado de aeronavegabilidade (independentemente

  do país emissor) a partir de 1º de janeiro de 2008, devem ser equipadas com um sistema ACAS
  II e

  este deve atender à OTP (TSO) C-119b (versão 7.0) ou posterior.'
