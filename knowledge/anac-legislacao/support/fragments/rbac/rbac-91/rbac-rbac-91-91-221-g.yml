title: 91.221(g)
text: '(g) Aviões com motores a turbina que tenham peso máximo de decolagem acima de 15.000kg

  devem ser equipados com um sistema ACAS II e este deve atender à OTP (TSO) C-119b (versão
  7.0)

  ou posterior.'
