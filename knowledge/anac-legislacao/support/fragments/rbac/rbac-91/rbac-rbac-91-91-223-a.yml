section_title: Sistema de percepção e alarme de proximidade do solo (TAWS)
subsection_id: a
cite: 91.223(a)
title: 91.223(a)
text: '(a) Exceto como previsto no parágrafo (d) desta seção, somente é permitido operar um
  avião com

  motores a turbina registrado no Brasil com uma configuração aprovada de seis ou mais assentos
  para

  passageiros, excluindo qualquer assento para piloto, se o avião for equipado com um TAWS
  que

  atenda aos requisitos para equipamento Classe B da OTP (TSO) C151 (equipamento dotado da
  função

  de detecção de terreno à frente do avião).'
