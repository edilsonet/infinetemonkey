cite: 91.223(c)
title: 91.223(c)
text: '(c) O manual de voo aprovado ou AOM deve conter procedimentos apropriados para:

  (1) utilização do TAWS; e

  (2) reação apropriada da tripulação de voo em resposta aos alertas visuais e sonoros do
  TAWS.'
