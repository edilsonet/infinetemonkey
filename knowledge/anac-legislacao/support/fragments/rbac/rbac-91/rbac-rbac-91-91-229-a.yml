section_title: Requisitos dos equipamentos eletrônicos de bordo
subsection_id: a
cite: 91.229(a)
title: 91.229(a)
text: '(a) Todos os equipamentos eletrônicos de bordo requeridos por este Regulamento e pelos

  regulamentos operacionais de operadores certificados segundo o RBAC nº 119 que recebem e/ou

  transmitem sinais rádio de/para órgãos ATS, de meteorologia e de busca e salvamento devem
  atender

  às regras e especificações estabelecidas pelo DECEA.'
