section_title: Transporte de restos mortais
subsection_id: a
cite: 91.23(a)
title: 91.23(a)
text: '(a) Os restos mortais são equiparados à carga comum e poderão ser transportados em
  aeronaves

  de carga e de passageiros, tanto nacionais quanto internacionais, desde que preparados e
  embalados

  em conformidade com a legislação e regulamentação sanitária vigente.

  (1) No transporte aéreo regular, a carga deverá estar segregada dos passageiros.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (2) O parágrafo (a)(1) não se aplica ao transporte de cinzas resultantes de processos crematórios,

  de objetos compostos por restos mortais de animais (tais como couro, peles, alimentos) devidamente

  manufaturados, assim como tecidos, órgãos e outros materiais orgânicos destinados a transplantes,

  implantes e outros tratamentos médicos, que podem ser transportados como bagagem de mão,

  observadas as restrições impostas por outras legislações pertinentes. (Incluído pela Resolução
  nº 606,

  de 11.02.2021)'
