title: 91.23(c)
text: '(c) O operador aéreo pode recusar o transporte de restos mortais, caso julgar, de maneira

  devidamente justificada, que a preparação ou embalagem não estão adequados e que há riscos

  inaceitáveis à segurança do voo.'
