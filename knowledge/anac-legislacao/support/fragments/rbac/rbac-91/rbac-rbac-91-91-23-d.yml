text: '(d) Caso os restos mortais estejam contaminados ou forem transportados junto com material

  classificado como artigo perigoso, o operador aéreo deverá cumprir também as regras aplicáveis
  do

  (Incluído pela Resolução nº 554, de 12.05.2020)


