section_title: Equipamento de sobrevivência para operações sobre água
subsection_id: a
cite: 91.231(a)
title: 91.231(a)
text: '(a) Somente é permitido decolar com uma aeronave para um voo sobre água além da distância
  de

  voo planado (ou voo em regime autorrotacional, no caso de helicópteros) da costa mais próxima
  se a

  aeronave estiver equipada com um colete salva-vidas (ou outro meio de flutuação aprovado)
  para

  cada ocupante da aeronave e pelo menos um dispositivo sinalizador pirotécnico. (Redação
  dada pela

  Resolução nº 606, de 11.02.2021)'
