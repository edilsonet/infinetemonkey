section_title: Equipamento de sobrevivência para operações sobre água
subsection_id: b
cite: 91.231(b)
title: 91.231(b)
text: '(b) Somente é permitido decolar com um avião de tipo certificado na categoria transporte
  para um

  voo sobre água afastado mais de 185 km (100 NM) da costa mais próxima, ou com um avião de
  tipo

  não certificado na categoria transporte ou helicóptero para um voo sobre água afastado mais
  de 93

  km (50 NM), ou com uma aeronave para um voo sobre a água afastado mais de 30 minutos de
  voo

  da costa mais próxima, o que for menor, se a aeronave estiver equipada com os seguintes

  equipamentos de sobrevivência:

  (1) um colete salva-vidas, com uma luz localizadora aprovada, para cada ocupante da aeronave;

  (2) botes infláveis (cada um com uma luz localizadora aprovada) com capacidade aprovada

  para acomodar todos os ocupantes da aeronave, exceto que, para helicópteros, sujeito à autorização

  da ANAC, o bote pode ser dispensado se for comprovado que o tipo de helicóptero impede o

  transporte de um bote inflável;


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (3) pelo menos um dispositivo pirotécnico de sinalização em cada bote (quando houver);

  (4) [reservado]; e

  (5) para grandes aviões e aviões multimotores a turbina e operações de propriedade

  compartilhada regidas pela Subparte K deste regulamento, um cabo de segurança instalado
  de acordo

  com o parágrafo 25.1411(g) do RBAC nº 25. (Redação dada pela Resolução nº 606, de 11.02.2021)'
