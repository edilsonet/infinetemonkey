title: 91.231(f)
text: '(f) As instruções verbais requeridas pelo parágrafo (a) desta seção devem ser suplementadas
  por

  cartões impressos que devem ser transportados na aeronave em locais convenientes para uso
  de cada

  passageiro. Os cartões devem:

  (1) ser apropriados à aeronave na qual serão utilizados;

  (2) conter um diagrama e o método de operar as saídas de emergência; e

  (3) conter outras instruções necessárias para o uso do equipamento de emergência a bordo
  da

  aeronave.'
