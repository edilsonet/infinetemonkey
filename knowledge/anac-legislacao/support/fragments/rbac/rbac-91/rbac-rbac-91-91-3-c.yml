cite: 91.3(c)
title: 91.3(c)
text: '(c) Cada piloto em comando que se desviar de um requisito conforme o parágrafo (b)
  desta seção

  deve registrar a ocorrência no diário de bordo e enviar um relatório por escrito à ANAC
  descrevendo

  e justificando o desvio.'
