cite: 91.303(b)
title: 91.303(b)
text: '(b) O voo acrobático realizado por empresa SAE na modalidade experimentação aerodesportiva

  somente pode ser realizado em:

  (1) aeronave certificada segundo o RBAC nº 21 na categoria acrobática; ou

  (2) aeronave projetada e construída para uso militar e aceita por uma das forças armadas

  brasileiras como acrobática, desde que tenha obtido um certificado de tipo brasileiro nos
  termos da

  seção 21.27 do RBAC nº 21.'
