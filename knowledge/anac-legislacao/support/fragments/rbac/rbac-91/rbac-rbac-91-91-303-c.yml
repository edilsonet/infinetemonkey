cite: 91.303(c)
title: 91.303(c)
text: '(c) Em caso de voo acrobático, de demonstração aérea, de competição aérea ou para atendimento

  a eventos aéreos em geral, havendo público em solo, a organização responsável pela promoção
  do

  evento deve:

  (1) obter autorização prévia da ANAC;

  (2) garantir que não sejam realizadas atividades aéreas caso as condições meteorológicas

  estejam abaixo dos mínimos requeridos para voo VFR;

  (3) garantir que, se remunerado, o voo de demonstração acrobática seja realizado por empresa

  SAE na modalidade aerodemonstração;

  (4) garantir adequada separação e proteção do público das aeronaves envolvidas; e

  (5) apresentar um plano de gerenciamento da segurança operacional.'
