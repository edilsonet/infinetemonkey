cite: 91.303(d)
title: 91.303(d)
text: '(d) É vedado a uma pessoa estar a bordo de uma aeronave durante voo acrobático, de
  demonstração

  aérea, de competição aérea ou para atendimento a eventos aéreos em geral, com exceção das
  pessoas

  devidamente cientificadas dos riscos da operação e que tenham dado a sua anuência expressa

  aceitando esse risco.

  Nota: Considerando o princípio da autonomia e que o cidadão tem o direito de assumir e administrar

  o próprio risco quando somente ele ou seus tutelados legais (no caso de menores de idade)
  estarão

  expostos, a ANAC permite a participação de pessoas cientificadas em voos acrobáticos, de

  demonstração aérea, de competição aérea ou em eventos em geral, desde que essas pessoas
  tenham

  dado expressamente a sua anuência, manifestando dessa forma a sua vontade. Contudo, a ANAC

  esclarece àqueles que livremente optarem por dar essa anuência que não é possível garantir
  um nível

  de risco aceitável de segurança operacional e que o controle da exposição a esse risco é
  de sua inteira

  responsabilidade.'
