cite: 91.303(f)
title: 91.303(f)
text: '(f) Os voos de demonstração realizados por fabricantes de aeronaves certificados para
  potenciais

  clientes ou em campanhas de certificação podem ser realizados sem atender os requisitos
  desta seção.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (1) Fabricantes de aeronaves agrícolas podem utilizar área de pouso para uso aeroagrícola,
  sem

  cumprir com o disposto no parágrafo 91.102(d) deste Regulamento, para demonstração para

  potenciais clientes ou em campanhas de certificação, desde que autorizado pela ANAC.'
