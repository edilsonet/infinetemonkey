section_title: Paraquedas e paraquedismo
subsection_id: a
cite: 91.307(a)
title: 91.307(a)
text: '(a) O piloto de uma aeronave civil somente pode permitir que um paraquedas disponível
  para uso

  em emergência seja colocado a bordo dessa aeronave se o paraquedas for de tipo aprovado
  e tiver

  sido dobrado por uma pessoa qualificada:

  (1) dentro dos 180 (cento e oitenta) dias precedentes, se o velame, tirantes e arreios forem

  exclusivamente de nylon, rayon ou outras fibras sintéticas similares, ou de materiais substancialmente

  resistentes a danos por mofo, fungos diversos ou outros agentes putrefatórios que se desenvolvem
  em

  ambientes úmidos; ou

  (2) dentro dos 60 (sessenta) dias precedentes, se qualquer parte do paraquedas for composta
  por

  seda, ou mistura de lã e seda, ou outras fibras naturais ou materiais não especificados
  no parágrafo'
