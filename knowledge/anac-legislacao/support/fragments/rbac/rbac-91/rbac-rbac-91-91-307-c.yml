cite: 91.307(c)
title: 91.307(c)
text: '(c) Somente se cada ocupante da aeronave estiver usando um paraquedas aprovado, é permitido

  ao piloto de aeronave civil transportando qualquer pessoa (exceto tripulantes) executar
  alguma

  manobra intencional que exceda:

  (1) 60º de inclinação relativa ao horizonte; ou

  (2) 30º de arfagem, positiva ou negativa, relativa ao horizonte.'
