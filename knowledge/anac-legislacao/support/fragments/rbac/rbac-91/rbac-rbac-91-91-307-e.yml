cite: 91.307(e)
title: 91.307(e)
text: '(e) Para os propósitos desta seção, paraquedas aprovado significa:

  (1) um paraquedas manufaturado segundo um certificado de tipo ou com uma aprovação OTP

  (TSO) C23; ou

  (2) um paraquedas individual, de uso militar, identificado por número de parte e número
  de

  série ou por qualquer outra designação ou número de especificação militar.'
