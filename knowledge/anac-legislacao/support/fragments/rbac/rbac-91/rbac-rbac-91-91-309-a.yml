title: 91.309(a)
text: '(a) Somente é permitido operar uma aeronave civil rebocando planadores se:

  (1) [reservado];

  (2) a aeronave rebocadora for equipada com um gancho de reboque de tipo e instalação

  aprovados;

  (3) o cabo de reboque tiver uma resistência a quebra não menor que 80% do peso máximo

  aprovado de operação do planador e não maior que duas vezes esse peso de operação. No entanto,
  o

  cabo de reboque pode ter resistência a quebra maior que o limite aqui especificado, se:'
