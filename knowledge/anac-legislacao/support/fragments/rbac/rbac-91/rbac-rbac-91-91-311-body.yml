title: Reboques outros que os referidos na seção 91.309
text: '91.311 Reboques outros que os referidos na seção 91.309

  Somente é permitido ao piloto de uma aeronave civil realizar quaisquer tipos de reboque
  com uma

  aeronave (outros que não os referidos na seção 91.309 deste Regulamento) se a operação tiver
  sido

  expressamente aprovada pela ANAC.'
