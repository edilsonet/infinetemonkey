cite: 91.313(a)
title: 91.313(a)
text: '(a) Somente é permitido operar uma aeronave civil categoria restrita:

  (1) para os propósitos para os quais ela foi certificada; ou


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (2) em operações necessárias para atender as atividades de trabalho diretamente relacionadas

  com os propósitos especiais para os quais ela foi certificada.'
