cite: 91.313(b)
title: 91.313(b)
text: '(b) Para os objetivos do parágrafo (a) desta seção, a operação de uma aeronave civil
  categoria

  restrita visando a prover treinamento de tripulação de voo na operação com propósitos especiais
  para

  os quais a aeronave foi certificada é considerada como sendo uma operação para esse propósito

  especial.'
