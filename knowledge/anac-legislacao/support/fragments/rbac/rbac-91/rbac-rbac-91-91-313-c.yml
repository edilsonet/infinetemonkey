cite: 91.313(c)
title: 91.313(c)
text: '(c) É vedado operar uma aeronave civil categoria restrita transportando passageiros
  ou cargas com

  fins lucrativos. Para os objetivos deste parágrafo uma operação com propósitos especiais,
  envolvendo

  o transporte de pessoas e materiais necessários ao cumprimento dessa operação (tais como

  pulverização, semeaduras e reboque de faixas e incluindo o transporte de pessoas e materiais
  para o

  local de operação) e uma operação visando a proporcionar treinamento de tripulantes de voo
  na

  operação com propósitos especiais, não são consideradas como sendo operações de transporte
  de

  passageiros e cargas com fins lucrativos.'
