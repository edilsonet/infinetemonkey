cite: 91.313(d)
title: 91.313(d)
text: '(d) Somente é permitido o transporte de qualquer pessoa em uma aeronave civil, categoria
  restrita,

  se:

  (1) essa pessoa for um tripulante de voo;

  (2) essa pessoa for um tripulante de voo em treinamento;

  (3) essa pessoa executar a bordo uma função essencial correlacionada com a operação com

  propósitos especiais para a qual a aeronave foi certificada; ou

  (4) o transporte for necessário para o cumprimento de atividade de trabalho diretamente

  relacionada com os propósitos especiais da operação.'
