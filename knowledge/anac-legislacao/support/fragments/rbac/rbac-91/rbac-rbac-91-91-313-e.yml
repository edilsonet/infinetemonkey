cite: 91.313(e)
title: 91.313(e)
text: '(e) Exceto se de outra forma autorizado pela ANAC, é vedado operar uma aeronave civil
  de

  categoria restrita:

  (1) sobre áreas densamente povoadas;

  (2) em aerovias congestionadas; ou

  (3) nas proximidades de aeródromos congestionados com grande frequência de operações de

  transporte aéreo público.'
