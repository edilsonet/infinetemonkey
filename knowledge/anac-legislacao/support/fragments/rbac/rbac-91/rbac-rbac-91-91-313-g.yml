cite: 91.313(g)
title: 91.313(g)
text: '(g) Somente é permitido operar um pequeno avião civil, categoria restrita, fabricado
  após 18 de

  julho de 1978, se cintos de ombro ou sistemas de retenção aprovados forem instalados em
  cada

  assento dianteiro. A instalação dos cintos de ombro ou sistemas de retenção em cada assento
  de

  tripulante de voo deve permitir que o tripulante, sentado em seu posto e com os cintos colocados
  e

  ajustados ou com o sistema de retenção engajado, possa exercer todas as funções necessárias
  à

  operação do voo. Para os propósitos deste parágrafo:

  (1) data de fabricação de uma aeronave é a data na qual os registros de inspeção de sua

  fabricação mostram que a aeronave foi considerada terminada e, se aplicável, conforme com
  o projeto

  de tipo aprovado; e

  (2) assento dianteiro é um assento localizado em um posto de pilotagem ou qualquer outro

  assento posicionado ao lado dele.'
