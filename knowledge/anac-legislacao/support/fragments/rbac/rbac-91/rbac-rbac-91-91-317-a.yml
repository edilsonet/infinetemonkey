section_title: 'Aeronave com certificado de aeronavegabilidade provisório: limitações operacionais'
subsection_id: a
cite: 91.317(a)
title: 91.317(a)
text: '(a) Somente é permitido operar uma aeronave com certificado de tipo provisório se a
  aeronave for

  elegível a obter um certificado de aeronavegabilidade provisório, conforme estabelecido
  na seção

  21.213 do RBAC nº 21.'
