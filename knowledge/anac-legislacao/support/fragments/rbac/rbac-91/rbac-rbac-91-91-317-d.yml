section_title: 'Aeronave com certificado de aeronavegabilidade provisório: limitações operacionais'
subsection_id: d
cite: 91.317(d)
title: 91.317(d)
text: '(d) Salvo se de outra forma autorizado pela ANAC, somente é permitido operar uma aeronave
  com

  certificado de tipo provisório:

  (1) em operação diretamente relacionada com o processo de certificação de tipo ou de

  certificação suplementar de tipo da aeronave;

  (2) para treinamento de tripulações, inclusive em operações simuladas de transporte aéreo;

  (3) em voos de demonstração efetuados pelo fabricante, visando venda do produto;

  (4) em voos para pesquisa de mercado, efetuados pelo fabricante;

  (5) em voos para verificação dos instrumentos, acessórios e equipamentos que não afetem
  as

  condições básicas de aeronavegabilidade da aeronave; ou

  (6) em testes operacionais da aeronave.'
