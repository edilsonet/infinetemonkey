section_title: 'Aeronave com certificado de aeronavegabilidade provisório: limitações operacionais'
subsection_id: e
cite: 91.317(e)
title: 91.317(e)
text: '(e) Cada pessoa que opere uma aeronave com certificado de tipo provisório deve fazê-lo
  dentro

  das limitações estabelecidas pelos placares e marcações da aeronave, ou estabelecidas pelo
  manual

  de voo provisório da aeronave ou em qualquer outro documento. No entanto, quando em operações

  diretamente relacionadas com o processo de certificação de tipo ou de certificação suplementar
  de

  tipo, deve fazê-lo de acordo com as limitações estabelecidas para aeronaves experimentais
  na seção

  21.191 do RBAC nº 21 e, quando em ensaios em voo, deve operar segundo os regulamentos de
  tráfego

  aéreo aplicáveis.'
