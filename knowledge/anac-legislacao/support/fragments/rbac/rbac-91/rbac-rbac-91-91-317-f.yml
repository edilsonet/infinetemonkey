section_title: 'Aeronave com certificado de aeronavegabilidade provisório: limitações operacionais'
subsection_id: f
cite: 91.317(f)
title: 91.317(f)
text: '(f) Cada pessoa operando uma aeronave com certificado de tipo provisório deve estabelecer

  procedimentos aprovados para:

  (1) uso e orientação do pessoal de terra e de voo em operações segundo esta seção; e

  (2) operar em aeródromos onde o pouso e a decolagem se darão sobre áreas povoadas.'
