section_title: 'Aeronave com certificado de aeronavegabilidade provisório: limitações operacionais'
subsection_id: g
cite: 91.317(g)
title: 91.317(g)
text: '(g) Cada pessoa que opere uma aeronave com certificado de tipo provisório deve assegurar-se
  que

  cada membro da tripulação de voo esteja adequadamente habilitado, familiarizado e possua

  conhecimento adequado da aeronave e dos procedimentos a serem utilizados pela tripulação.'
