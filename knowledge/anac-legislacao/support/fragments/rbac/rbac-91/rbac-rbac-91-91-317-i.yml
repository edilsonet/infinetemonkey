section_title: 'Aeronave com certificado de aeronavegabilidade provisório: limitações operacionais'
subsection_id: i
cite: 91.317(i)
title: 91.317(i)
text: '(i) Sempre que o fabricante, ou a ANAC, determinar que seja necessária uma alteração
  de projeto,

  de construção ou de procedimento para garantir operação segura, somente é permitido operar
  uma

  aeronave com certificado de tipo provisório se a alteração for feita e aprovada. As disposições
  da

  seção 21.99 do RBAC nº 21 são aplicáveis a operações segundo esta seção.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.'
