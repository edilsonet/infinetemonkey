section_title: Aeronave civil com certificado de autorização de voo experimental (CAVE)
subsection_id: a
cite: 91.319(a)
title: 91.319(a)
text: '(a) Somente é permitido operar uma aeronave civil com CAVE:

  (1) para os propósitos para os quais o certificado foi emitido;

  (2) sem transportar pessoas ou bens com fins lucrativos; e

  (3) se observadas as limitações operacionais contidas nos adendos do CAVE.'
