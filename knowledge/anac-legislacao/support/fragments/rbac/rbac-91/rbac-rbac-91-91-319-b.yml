section_title: Aeronave civil com certificado de autorização de voo experimental (CAVE)
subsection_id: b
cite: 91.319(b)
title: 91.319(b)
text: '(b) Somente é permitido operar uma aeronave com CAVE fora da área designada em NOTAM,

  acordo operacional com autoridade aeronáutica ou AIP, se for demonstrado que:

  (1) a aeronave é controlável ao longo de toda a faixa normal de velocidades e em todas as

  manobras a serem executadas; e

  (2) a aeronave não possui características de projeto ou de operação perigosas.'
