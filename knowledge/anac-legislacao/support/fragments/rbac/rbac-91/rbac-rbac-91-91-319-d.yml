section_title: Aeronave civil com certificado de autorização de voo experimental (CAVE)
subsection_id: d
cite: 91.319(d)
title: 91.319(d)
text: '(d) Cada pessoa operando uma aeronave com CAVE deve:

  (1) cientificar cada pessoa transportada a bordo da natureza experimental da aeronave; e

  (2) operar em voo VFR diurno, salvo se de outro modo for especificamente autorizado pela

  ANAC.'
