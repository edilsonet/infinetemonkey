section_title: 'Aeronave categoria primária: limitações de operação'
subsection_id: b
cite: 91.325(b)
title: 91.325(b)
text: '(b) Somente podem operar uma aeronave de categoria primária que seja mantida pelo piloto-

  proprietário sob um programa de inspeção e de manutenção especiais aprovados:

  (1) o próprio piloto-proprietário; ou

  (2) um piloto designado pelo piloto-proprietário, desde que o piloto-proprietário não receba

  remuneração ou compensação pelo uso da aeronave.'
