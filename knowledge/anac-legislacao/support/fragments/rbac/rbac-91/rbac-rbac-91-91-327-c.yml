section_title: Aeronaves com certificado de aeronavegabilidade especial na categoria leve
  esportiva
subsection_id: c
cite: 91.327(c)
title: 91.327(c)
text: '(c) Somente é permitido operar comercialmente uma aeronave que possua um certificado
  especial

  de aeronavegabilidade na categoria leve esportiva se, dentro das 100 horas de voo precedentes
  à

  operação, a aeronave tenha sido:

  (1) inspecionada por pessoa ou entidade habilitada, de acordo com os procedimentos de

  inspeção desenvolvidos pelo fabricante da aeronave ou de outra forma aceita pela ANAC e
  aprovada

  para retornar ao serviço conforme o RBAC nº 43; ou

  (2) submetida a uma inspeção para a emissão de um certificado de aeronavegabilidade, de

  acordo com o RBAC nº 21.'
