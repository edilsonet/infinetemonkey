subsection_id: d
cite: 91.327(d)
title: 91.327(d)
text: '(d) Cada pessoa que opera uma aeronave com certificado especial de aeronavegabilidade
  na

  categoria leve esportiva deve operar a aeronave de acordo com as instruções de operação
  da aeronave,

  incluindo quaisquer provisões para a operação dos equipamentos necessários especificados
  na lista

  de equipamentos da aeronave.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.'
