subsection_id: e
cite: 91.327(e)
title: 91.327(e)
text: '(e) Cada pessoa que opera uma aeronave com certificado especial de aeronavegabilidade
  na

  categoria leve esportiva deve notificar cada pessoa transportada da natureza especial da
  aeronave e

  que esta não cumpre com os requisitos de aeronavegabilidade correspondentes a uma aeronave
  para

  a qual tenha sido emitido um certificado de aeronavegabilidade padrão.'
