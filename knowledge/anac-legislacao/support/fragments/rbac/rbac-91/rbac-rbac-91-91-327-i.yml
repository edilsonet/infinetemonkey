section_title: Aeronaves com certificado de aeronavegabilidade especial na categoria leve
  esportiva
subsection_id: i
cite: 91.327(i)
title: 91.327(i)
text: '(i) corrigir a condição insegura de maneira diferente da especificada na diretriz de
  segurança,

  desde que a pessoa que emite a diretriz de segurança concorde com a ação; ou

  (ii) obter uma autorização específica da ANAC para proceder de forma diferente ao

  estabelecido na diretriz de segurança, baseado na conclusão de que esta foi emitida sem
  aderência à

  norma consensual aplicável;

  (5) cada alteração realizada após a data de fabricação da aeronave atende à norma consensual

  aplicável vigente na data da aplicação da alteração e foi autorizada pelo fabricante ou
  de outra forma

  aceita pela ANAC;

  (6) cada grande alteração em um produto aeronáutico produzido sob uma norma consensual for

  autorizada, executada e inspecionada de acordo com os procedimentos de manutenção e inspeção

  desenvolvidos pelo fabricante ou por uma pessoa autorizada pela ANAC; e

  (7) o proprietário ou o operador cumprir com os requisitos de registro de grandes reparos
  e

  grandes alterações realizadas em produtos certificados, de acordo com o parágrafo 43.9(d)
  do RBAC

  nº 43 e com os requisitos de registro descritos na seção 91.417 deste Regulamento.'
