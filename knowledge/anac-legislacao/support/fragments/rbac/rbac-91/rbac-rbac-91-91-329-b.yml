title: 91.329(b)
text: '(b) Nos casos de catástrofes naturais ou emergências, pousos e decolagens de helicópteros
  em

  áreas não cadastradas podem ser realizados sem atender aos critérios dos parágrafos (a)(1)
  a (a)(5)

  desta seção, sob total responsabilidade do operador.'
