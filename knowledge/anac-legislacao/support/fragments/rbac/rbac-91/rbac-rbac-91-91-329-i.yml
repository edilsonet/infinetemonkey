section_title: Pousos e decolagens de helicópteros em áreas não cadastradas
subsection_id: i
cite: 91.329(i)
title: 91.329(i)
text: '(i) em áreas:

  (A) cuja propriedade seja de pessoa física;

  (B) cujo acesso do público esteja restringido; ou

  (C) desabitadas, em que não haja demarcações ou construções no solo que indiquem

  poder haver a presença de pessoas em um raio de 30 metros do ponto de toque (exceto aquelas
  pessoas

  envolvidas com a operação);

  (ii) onde a área de aproximação final e de decolagem e a área de toque estejam livres de

  obstáculos ou animais que possam comprometer a segurança da operação; e

  (iii) em áreas em que qualquer ponto do helicóptero esteja distante pelo menos 30 metros
  de

  qualquer via de acesso público;

  (2) não haja operação de abastecimento de aeronaves no local;

  (3) não haja proibição de operação no local escolhido;

  (4) a operação seja realizada sob regras de voo VFR diurno e em condições VMC;

  (5) o responsável pelo local tenha autorizado a operação ou, no caso de áreas desabitadas,
  não

  a tenha proibido; e

  (6) o operador realize um gerenciamento de risco de forma a garantir um nível aceitável
  de risco

  à segurança da operação, da aeronave, de seus ocupantes e de terceiros.'
