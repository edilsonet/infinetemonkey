title: 91.331(b)
text: '(b) A ANAC poderá aprovar pousos na água que não cumpram ao disposto no parágrafo (a)(2)

  desta seção para atender eventos aéreos em geral, desde que sejam atendidas as disposições
  aplicáveis

  da seção 91.303 deste Regulamento.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  SUBPARTE E

  MANUTENÇÃO, MANUTENÇÃO PREVENTIVA E ALTERAÇÕES'
