title: 91.403(e)
text: '(e) Somente é permitido operar uma aeronave em operação regida pelos RBAC nº 121 ou
  135

  registrada na categoria TPR se o operador tiver apresentado à ANAC um CVA na forma estabelecida

  pela regulamentação vigente para a referida aeronave nos últimos 3 anos.'
