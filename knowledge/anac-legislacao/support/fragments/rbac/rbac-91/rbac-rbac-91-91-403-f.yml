cite: 91.403(f)
title: 91.403(f)
text: '(f) Somente é permitido operar uma aeronave segundo este Regulamento se o operador
  tiver

  apresentado à ANAC um CVA na forma estabelecida pela regulamentação vigente para a referida

  aeronave nos últimos 12 meses. Este parágrafo não se aplica a aeronaves em operações regidas
  pelos

  (VTE) substitui a apresentação do CVA requerida por este parágrafo.'
