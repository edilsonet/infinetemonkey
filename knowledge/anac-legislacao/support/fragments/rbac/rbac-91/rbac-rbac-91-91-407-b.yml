section_title: Operação após manutenção, manutenção preventiva, reconstrução ou alterações
subsection_id: b
cite: 91.407(b)
title: 91.407(b)
text: '(b) Somente é permitido transportar qualquer pessoa (exceto tripulantes) em uma aeronave
  que

  tenha sofrido manutenção, manutenção preventiva, reconstrução ou alterações que possam ter

  alterado ou afetado apreciavelmente suas características de voo ou afetado substancialmente
  sua

  operação em voo, se um piloto habilitado na aeronave tiver voado na aeronave e feito uma
  verificação

  operacional do trabalho executado e anotado o voo e seu resultado nos registros da aeronave.'
