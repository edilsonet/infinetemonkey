cite: 91.407(c)
title: 91.407(c)
text: '(c) Se inspeções e testes em solo concluírem que a manutenção, manutenção preventiva,

  reconstrução ou alterações não alteraram substancialmente as características de voo, nem
  afetaram

  apreciavelmente a operação da aeronave, o parágrafo (b) desta seção não precisa ser atendido.'
