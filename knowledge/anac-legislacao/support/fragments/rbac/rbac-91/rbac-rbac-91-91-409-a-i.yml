cite: 91.409(a-I)
title: 91.409(a-I)
text: '(a)-I Uma inspeção realizada segundo o parágrafo (b) desta seção não pode substituir
  qualquer

  inspeção ou vistoria requerida pelo parágrafo (a) desta seção, salvo se a inspeção for realizada
  por

  uma pessoa autorizada para realizar inspeção anual e tiver sido registrada como uma “inspeção
  anual”

  nos documentos da aeronave.'
