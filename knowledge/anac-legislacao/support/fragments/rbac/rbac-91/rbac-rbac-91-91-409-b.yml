cite: 91.409(b)
title: 91.409(b)
text: '(b) Exceto como previsto no parágrafo (c) desta seção, somente é permitido operar uma
  aeronave

  transportando qualquer pessoa (exceto tripulantes) com fins lucrativos ou dar instrução
  de voo paga

  em uma aeronave sob seu controle se, dentro das 100 horas de voo precedentes à operação,
  a aeronave

  tiver sofrido uma inspeção anual ou uma inspeção de 100 horas e tiver sido aprovada para
  retorno ao


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  serviço de acordo com o RBAC nº 43 ou tiver passado por uma vistoria para emissão de certificado

  de aeronavegabilidade de acordo com o RBAC nº 21. A limitação de 100 horas de tempo de serviço

  pode ser excedida por não mais de 10 horas enquanto em rota, caso seja necessário deslocar
  a

  aeronave para um local onde a inspeção possa ser realizada. No entanto, o tempo em excesso
  será

  incluído na contagem das próximas 100 horas de tempo de serviço.'
