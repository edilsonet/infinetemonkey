cite: 91.409(d-I)
title: 91.409(d-I)
text: '(d)-I A frequência e detalhes da inspeção progressiva devem prover a inspeção completa
  da

  aeronave dentro de cada período de 12 meses e devem ser consistentes com as recomendações
  do

  fabricante, com a experiência em serviço e com a espécie de operação em que a aeronave estiver

  engajada. O programa de inspeções deve assegurar que a aeronave, continuamente, estará

  aeronavegável e conforme com todas as suas especificações aplicáveis, especificações técnicas
  do


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  certificado de tipo, diretrizes de aeronavegabilidade e demais requisitos. Se uma inspeção
  progressiva

  for descontinuada o proprietário ou operador deve informar imediatamente à ANAC.'
