cite: 91.409(e)
title: 91.409(e)
text: '(e) Somente é permitido operar um grande avião ou um avião multimotor com motores a
  turbina,

  ou uma aeronave de asas rotativas com motores a turbina, se o tempo de substituição de todas
  as

  peças com tempo de vida limitado discriminado nas especificações da aeronave, especificações

  técnicas do certificado de tipo e em outros documentos aprovados tiver sido cumprido e a
  aeronave,

  incluindo célula, motores, hélices, rotores, equipamentos, equipamentos de sobrevivência
  e de

  emergência tiverem sido inspecionados de acordo com um programa de inspeção selecionado

  conforme o parágrafo (f) desta seção. No entanto, o proprietário ou operador de uma aeronave
  de asa

  rotativa com motor a turbina pode optar pelo uso das provisões de inspeção dos parágrafos
  (d) e (d)-

  I desta seção em lugar da opção de inspeção contida no parágrafo (f) desta seção.'
