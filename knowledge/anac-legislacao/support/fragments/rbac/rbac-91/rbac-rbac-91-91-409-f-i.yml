cite: 91.409(f-I)
title: 91.409(f-I)
text: '(f)-I Cada operador deve incluir no programa selecionado segundo o parágrafo (f) desta
  seção, o

  nome e o endereço da empresa responsável pela programação de inspeções requeridas pelo programa

  e fazer com que uma cópia desse programa seja apresentada à empresa que estiver executando
  as

  inspeções e à ANAC, quando requerido.'
