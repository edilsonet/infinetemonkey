title: 91.409(f-II)
text: '(f)-II Nos casos descritos nos parágrafos (f)(1) e (f)(2) desta seção, o programa de
  inspeção da

  empresa só poderá ser utilizado se for executado pela própria empresa aérea ou por outra
  empresa por

  ela subcontratada segundo sua especificação operativa.'
