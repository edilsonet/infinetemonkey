cite: 91.409(f)
title: 91.409(f)
text: '(f) O proprietário ou operador de cada aeronave descrita no parágrafo (e) desta seção
  deve

  selecionar, identificar nos registros de manutenção da aeronave e usar um dos seguintes
  programas

  para a inspeção dessa aeronave:

  (1) um programa de inspeção para aeronavegabilidade continuada fazendo parte de um CAMP

  em uso por um detentor de certificado emitido segundo o RBAC nº 119 e operando o mesmo tipo
  e

  modelo de aeronave, conforme especificações técnicas emitidas segundo o RBAC nº 121 ou operando

  o mesmo tipo e modelo de aeronave segundo o RBAC nº 135 e mantendo-o segundo o parágrafo

  135.411(a)(2) do RBAC nº 135;

  (2) um programa de inspeções, aprovado segundo o parágrafo 135.419 do RBAC nº 135 e

  correntemente em uso por uma empresa certificada segundo o referido RBAC nº 135;

  (3) um programa atualizado de inspeções recomendado pelo fabricante; ou

  (4) qualquer outro programa de inspeção, estabelecido pelo proprietário ou operador da

  aeronave e aprovado pela ANAC, conforme parágrafo (g) desta seção. No entanto, a ANAC pode

  requerer revisões nesse programa de acordo com as provisões da seção 91.415 deste Regulamento.'
