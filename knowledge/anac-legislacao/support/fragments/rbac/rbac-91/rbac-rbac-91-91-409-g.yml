cite: 91.409(g)
title: 91.409(g)
text: '(g) Cada operador de uma aeronave com motor a turbina que deseje estabelecer ou modificar
  um

  programa de inspeções aprovado conforme o parágrafo (f)(4) desta seção deve requerer a aprovação

  da ANAC. O requerimento deve ser feito por escrito e deve conter, pelo menos, as seguintes

  informações:

  (1) instruções e procedimentos para a condução das inspeções no tipo e modelo específico
  de

  aeronave, incluindo os testes e verificações necessários. As instruções e procedimentos
  devem indicar

  em detalhes as partes e áreas da célula, motores, hélices, rotores e equipamentos, inclusive
  os de

  emergência e de sobrevivência, que devem ser inspecionados; e

  (2) um programa de execução das inspeções que devem ser realizadas, expresso em termos de

  tempo de voo, tempo corrido, ciclos de operação de sistemas ou qualquer combinação desses
  critérios.'
