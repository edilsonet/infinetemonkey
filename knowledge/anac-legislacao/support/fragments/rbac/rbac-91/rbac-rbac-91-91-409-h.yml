text: '(h) Quando um operador mudar de um programa de inspeções aprovado segundo o parágrafo
  (f)

  desta seção para um outro programa, os tempos em serviço, tempo corrido e ciclos de operações


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  acumulados segundo o programa prévio devem ser utilizados para determinar os tempos das

  inspeções devidas segundo o novo programa.'
