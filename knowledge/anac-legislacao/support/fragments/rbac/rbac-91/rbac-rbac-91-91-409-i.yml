cite: 91.409(i)
title: 91.409(i)
text: '(i) uma explicação da inspeção progressiva, incluindo a responsabilidade sobre a

  continuidade das inspeções, a maneira de preencher os relatórios, a guarda e conservação
  desses

  relatórios e a documentação técnica de referência;

  (ii) um programa de inspeções especificando o intervalo em horas ou dias em que inspeções

  de rotina ou detalhadas devem ser executadas, incluindo instruções para exceder intervalos
  de

  inspeções por não mais de 10 horas de voo quando em rota e para mudanças nos intervalos
  por

  experiência obtida no serviço;

  (iii) amostras dos formulários para executar e registrar inspeções de rotina e detalhadas,
  com

  instruções sobre seu uso; e

  (iv) amostras de relatórios, registros e instruções para seu uso;

  (3) uma listagem das instalações, equipamentos e ferramentas necessárias para desmontagem
  e

  apropriadas para as inspeções da aeronave; e

  (4) informações técnicas atualizadas e apropriadas à aeronave.'
