title: 91.411(d)
text: '(d) É vedado operar um avião ou helicóptero em espaço aéreo controlado, em voo IFR,
  acima da

  máxima altitude na qual todos os altímetros e o equipamento automático de informação de
  altitude

  da aeronave (se requerido na área de operação) tenham sido testados.'
