section_title: Mudanças em programas de inspeção de aeronaves
subsection_id: a
cite: 91.415(a)
title: 91.415(a)
text: '(a) Sempre que a ANAC julgar que sejam necessárias alterações em um programa de inspeções

  aprovado conforme o parágrafo 91.409(f)(4) deste Regulamento para manter a adequabilidade
  desse

  programa, o proprietário ou operador da aeronave deve, após receber a notificação da ANAC,
  realizar

  as mudanças requeridas.'
