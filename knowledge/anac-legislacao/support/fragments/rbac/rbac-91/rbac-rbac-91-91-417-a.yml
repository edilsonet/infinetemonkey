text: '(a) Exceto para trabalho executado segundo as seções 91.411 e 91.413 deste Regulamento,
  cada

  proprietário ou operador deve conservar, pelos períodos estabelecidos no parágrafo (b) desta
  seção,

  os seguintes registros:

  (1) registro de manutenção, manutenção preventiva e alteração e registros de inspeções de
  100

  horas, anual, progressiva e outras inspeções obrigatórias ou aprovadas, como apropriado,
  para cada

  aeronave (incluindo célula, motor, hélice, rotor e equipamentos). Os registros devem conter:'
