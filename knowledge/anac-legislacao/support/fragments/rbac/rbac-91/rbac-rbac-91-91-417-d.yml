cite: 91.417(d)
title: 91.417(d)
text: '(d) Quando um tanque de combustível adicional for colocado dentro de um compartimento
  de

  passageiros ou de bagagem de acordo com o RBAC nº 43, o registro dessa alteração deve ser

  conservado a bordo da aeronave modificada e o operador ou proprietário deve apresentá-lo
  à ANAC

  sempre que requerido, conforme o parágrafo (c) desta seção.'
