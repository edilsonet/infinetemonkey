cite: 91.417(i)
title: 91.417(i)
text: '(i) o tempo total de voo de cada célula, motor, hélice e rotor;


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (ii) a presente situação de partes com tempo de vida limitado de cada célula, motor, hélice,

  rotor e equipamento;

  (iii) o tempo desde a última revisão geral de itens instalados na aeronave que requerem

  revisão geral com base em tempos específicos;

  (iv) a identificação da presente situação da aeronave em relação a inspeções, incluindo
  os

  tempos desde a última inspeção obrigatória requerida pelo programa de inspeções segundo
  o qual a

  aeronave e seus componentes são mantidos;'
