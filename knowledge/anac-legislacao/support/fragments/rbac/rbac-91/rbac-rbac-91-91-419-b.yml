cite: 91.419(b)
title: 91.419(b)
text: '(b) os registros especificados no parágrafo 91.417(a)(1) deste Regulamento que não
  estiverem

  incluídos nos registros requeridos pelo parágrafo (a) desta seção, exceto quando o comprador

  autorizar o vendedor a manter a custódia física de tais registros. No entanto, a custódia
  física não

  exime o comprador da responsabilidade estabelecida pelo parágrafo 91.417(c) deste Regulamento.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.'
