text: '91.419 Transferência de registros de manutenção

  Qualquer proprietário ou operador que venda uma aeronave deve transferir para o comprador,
  no

  momento da venda, os seguintes registros da aeronave, em linguagem clara ou em forma codificada,

  a critério do comprador, desde que a forma codificada permita a recuperação das informações
  de

  maneira aceitável pela ANAC:'
