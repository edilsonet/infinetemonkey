section_title: Registro de manutenção após reconstrução de motor
subsection_id: b
cite: 91.421(b)
title: 91.421(b)
text: '(b) Cada pessoa que conceda tempo zero, para um motor reconstruído por ele, deve anotar
  no novo

  registro:

  (1) uma declaração assinada com a data de reconstrução do motor;

  (2) cada alteração feita de acordo com diretrizes de aeronavegabilidade; e

  (3) cada alteração feita em cumprimento a boletins de serviço do fabricante, desde que tal

  registro seja requerido pelo boletim.'
