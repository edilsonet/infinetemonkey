section_title: Registro de manutenção após reconstrução de motor
subsection_id: c
cite: 91.421(c)
title: 91.421(c)
text: '(c) Para os propósitos desta seção, motor reconstruído significa um motor usado, que
  tenha sido

  completamente desmontado, inspecionado, reparado como necessário, remontado, testado e aprovado

  da mesma maneira e com as mesmas tolerâncias e limitações de um motor novo, utilizando partes

  novas ou usadas. Entretanto, todas as partes usadas em um motor reconstruído devem estar
  conforme

  as tolerâncias e limites de partes novas ou com dimensões submedidas ou sobremedidas, como

  aplicável, aprovadas para um motor novo.'
