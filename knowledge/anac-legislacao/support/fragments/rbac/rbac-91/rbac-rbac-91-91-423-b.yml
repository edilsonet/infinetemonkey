title: 91.423(b)
text: '(b) Aviões categoria transporte regional e categoria transporte, aviões multimotores
  com motores

  a reação de qualquer categoria e aeronaves de asas rotativas categoria transporte, quando
  não

  possuírem intervalos de pesagem definidos em seus manuais aprovados, devem ser pesados a
  cada 5

  anos.'
