section_title: Pesagem e balanceamento de aeronaves
subsection_id: c
cite: 91.423(c)
title: 91.423(c)
text: '(c) Ressalvado o estabelecido nos parágrafos (a) e (b) desta seção, qualquer aeronave
  deve ser

  pesada:

  (1) sempre que houver dúvidas quanto à exatidão de seu peso e balanceamento; e

  (2) após ter sido submetida a serviços de manutenção e alterações que possam ter alterado
  seu

  peso, tais como pintura geral, grandes reparos, grandes alterações, mudanças de configuração,
  etc.'
