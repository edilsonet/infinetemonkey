title: 91.423(d)
text: '(d) A ficha de peso e balanceamento de uma aeronave deve ser recalculada sempre que
  a aeronave

  sofrer alteração por remoção, instalação ou mudança de posição de equipamentos, acessórios,

  decoração interna, etc.'
