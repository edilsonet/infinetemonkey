section_title: Requisitos para tripulações
subsection_id: a
cite: 91.5(a)
title: 91.5(a)
text: '(a) É permitida a operação de uma aeronave civil registrada no Brasil somente se:

  (1) a tripulação do voo estiver em conformidade com a tripulação mínima da aeronave,

  conforme estabelecida no seu certificado de aeronavegabilidade;

  (2) o operador designar um piloto para atuar como piloto em comando; e

  (3) a operação for conduzida por tripulantes adequadamente licenciados/certificados e

  habilitados para a aeronave segundo o RBAC nº 61 ou RBHA 63, ou RBAC que vier a substituí-lo,


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  para a função que exercem a bordo, com experiência recente, e detentores de certificados
  médicos

  aeronáuticos (CMA) válidos, emitidos em conformidade com o RBAC nº 67.'
