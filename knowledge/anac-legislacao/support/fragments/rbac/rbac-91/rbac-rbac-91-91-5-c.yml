cite: 91.5(c)
title: 91.5(c)
text: '(c) Para aeronaves engajadas em serviços aéreos especializados públicos (SAE):

  (1) a tripulação de voo, além de satisfazer os requisitos aplicáveis do parágrafo (a) desta
  seção,

  deve satisfazer, adicionalmente, os requisitos específicos requeridos para o tipo de operação
  que

  estiver sendo conduzida; e

  (2) os demais tripulantes necessários ao SAE devem ser treinados quanto a seus deveres e

  responsabilidades em conformidade com as normas vigentes da ANAC.'
