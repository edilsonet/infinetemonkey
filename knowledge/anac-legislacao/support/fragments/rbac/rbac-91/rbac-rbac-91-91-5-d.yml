section_title: Requisitos para tripulações
subsection_id: d
cite: 91.5(d)
title: 91.5(d)
text: '(d) Os tripulantes devem possuir as licenças e/ou certificados, assim como as habilitações

  associadas, que forem requeridos para o voo, dentro do prazo de validade (quando aplicável),
  e devem

  demonstrar isso de forma suficiente em uma fiscalização, caso solicitado, sob pena de serem

  impedidos de atuar como tripulantes no voo enquanto não o fizerem.'
