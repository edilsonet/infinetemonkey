cite: 91.5(e)
title: 91.5(e)
text: '(e) Se um piloto que demonstrou desempenho insatisfatório segundo as disposições do
  parágrafo

  91.1071(b) deste Regulamento atuar também como piloto de um detentor de certificado emitido

  segundo o RBAC nº 119, ele deve notificar a esse detentor de certificado sobre seu desempenho

  insatisfatório e deixar imediatamente de compor tripulação até que consiga completar

  satisfatoriamente um novo exame, o qual ocorrerá após comprovação de haver recebido nova

  instrução teórica e/ou prática. De igual modo, se um piloto que demonstrou desempenho insatisfatório

  segundo as disposições do parágrafo 135.301(b) do RBAC nº 135 ou do parágrafo 121.441(e)
  do

  Regulamento, ele deve notificar a esse administrador de programa sobre seu desempenho

  insatisfatório e deixar imediatamente de compor tripulação até que consiga completar

  satisfatoriamente um novo exame, o qual ocorrerá após comprovação de haver recebido nova

  instrução teórica e/ou prática. (Incluído pela Resolução nº 606, de 11.02.2021)'
