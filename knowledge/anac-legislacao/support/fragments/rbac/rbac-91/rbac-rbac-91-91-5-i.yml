section_title: Requisitos para tripulações
subsection_id: i
cite: 91.5(i)
title: 91.5(i)
text: '(i) com piloto automático em funcionamento, a tripulação deve ser composta por um piloto

  habilitado em IFR; e

  (ii) sem piloto automático, a tripulação deve ser composta por dois pilotos habilitados
  em

  IFR; e

  (3) para aeronaves com configuração aprovada para passageiros de 10 ou mais assentos, a

  tripulação deve ser composta por dois pilotos habilitados em IFR.'
