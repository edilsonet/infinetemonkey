title: 91.501(a)
text: '(a) Esta Subparte estabelece requisitos operacionais, adicionais aos requisitos das
  outras subpartes

  deste Regulamento, para a operação de grandes aviões civis e de aviões civis multimotores,
  com

  motores a turbina, registrados no Brasil, e para as operações de propriedade compartilhada
  regidas

  pela Subparte K deste Regulamento, não envolvendo transporte comercial de pessoas e carga.
  Os

  requisitos operacionais desta Subparte não se aplicam a aviões que sejam requeridos operar
  segundo

  o RBAC nº 129, 137 e segundo os regulamentos operacionais de operadores certificados segundo
  o'
