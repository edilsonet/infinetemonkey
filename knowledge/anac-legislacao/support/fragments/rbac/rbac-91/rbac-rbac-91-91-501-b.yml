cite: 91.501(b)
title: 91.501(b)
text: '(b) As operações que não envolverem transporte comercial de pessoas e carga podem ser

  conduzidas conforme os requisitos desta Subparte em lugar dos requisitos dos RBAC nº 121,
  129,

  135 e 137. Entre essas operações se incluem:

  (1) voos de translado e de treinamento;

  (2) operações aéreas especiais como de fotografia, sensoriamento remoto e vistoria de dutos,

  mas não incluindo combate a incêndios;

  (3) voos de demonstração de uma aeronave para compradores potenciais, desde que nada seja

  deles cobrado, exceto o previsto no parágrafo (d) desta seção;

  (4) voos conduzidos pelo operador de uma aeronave para seu transporte pessoal ou transporte

  de seus convidados, desde que nada seja cobrado dos ocupantes da aeronave;

  (5) o transporte aéreo de executivos, convidados, empregados e bens de uma empresa em uma

  aeronave operada pela mesma empresa, ou por empresa líder ou subsidiária da mesma, desde
  que o

  voo tenha por objetivo atender aos interesses da empresa e que nada seja cobrado pelo transporte

  além dos custos da posse, operação e manutenção da aeronave; no entanto nada pode ser cobrado

  pelo transporte de um convidado da empresa, se o transporte não estiver ligado aos negócios
  dessa

  empresa;

  (6) o transporte aéreo de executivos, convidados e empregados de uma empresa em uma

  aeronave operada segundo contratos de cessão temporária, de permuta de aeronaves ou de

  propriedade comum como definido no parágrafo (c) desta seção;

  (7) o transporte aéreo de bens (exceto malotes postais) e pessoas em uma aeronave operada
  por

  uma empresa visando fomentar seus negócios, desde que esse transporte esteja dentro dos
  objetivos

  desses negócios e nada seja cobrado, a não ser como especificado no parágrafo (d) desta
  seção;

  (8) o transporte aéreo de um grupo de atletas, time esportivo, grupo coral ou outros grupos,

  tendo objetivos e propósitos comunitários, quando nada for cobrado pelo transporte;

  (9) o transporte de pessoas em uma aeronave operada por uma pessoa na promoção de um ramo

  de negócio outro que o de transporte aéreo com o propósito de vender a eles lotes (terrenos),
  bens ou

  propriedades, incluindo representações ou distribuição, quando o transporte estiver dentro
  do campo

  de interesse e for inerente ao negócio e nenhuma remuneração, tributação ou taxa for cobrada
  por este

  transporte;


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (10) qualquer operação identificada nos parágrafos (b)(1) a (b)(9) desta seção, quando

  conduzidos:'
