cite: 91.501(i)
title: 91.501(i)
text: '(i) por um administrador de programa de propriedade compartilhada sob a Subparte K
  deste

  Regulamento; ou

  (ii) por um administrador de programa em favor de um cotista em um programa de

  propriedade compartilhada sob a Subparte K deste Regulamento, exceto quando um voo sob um

  contrato de propriedade comum for realizado sob o parágrafo (b)(6) desta seção. Para um
  voo sob um

  contrato de permuta sob o parágrafo (b)(6) desta seção, a troca por igual tempo para a operação
  deve

  ser apropriadamente contabilizada como parte das horas totais associadas com a cota do cotista
  do

  programa de propriedade compartilhada.

  (Incluído pela Resolução nº 606, de 11.02.2021)'
