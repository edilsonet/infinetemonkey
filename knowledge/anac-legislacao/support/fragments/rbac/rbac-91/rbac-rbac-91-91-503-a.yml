cite: 91.503(a)
title: 91.503(a)
text: '(a) O piloto em comando de um avião regido por esta Subparte deve assegurar que, além
  dos

  documentos requeridos pelo parágrafo 91.203(a), a seguinte documentação e equipamentos de
  voo

  estejam disponíveis a bordo em cada voo:


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (1) uma lanterna elétrica portátil em boas condições de operação;

  (2) uma lista de verificações da cabine dos pilotos contendo os procedimentos listados no

  parágrafo (b) desta seção;

  (3) [reservado];

  (4) [reservado]; e

  (5) em caso de aviões multimotores, os dados de desempenho para subidas com um motor

  inoperante.'
