cite: 91.503(b)
title: 91.503(b)
text: '(b) Cada lista de verificação de cabine deve conter os seguintes procedimentos e deve
  ser utilizada

  pela tripulação de voo quando operando o avião:

  (1) antes da partida dos motores;

  (2) antes da decolagem;

  (3) em cruzeiro;

  (4) antes do pouso;

  (5) após o pouso;

  (6) no corte dos motores; e

  (7) em emergências.'
