cite: 91.503(c)
title: 91.503(c)
text: '(c) Cada lista de verificação da cabine em emergência requerida pelo parágrafo (b)(7)
  desta seção

  deve conter os seguintes procedimentos, como apropriado:

  (1) operação em emergência dos sistemas de combustível, hidráulico, elétrico e mecânicos;

  (2) operação em emergência dos instrumentos e controles de voo;

  (3) procedimentos com motor inoperante; e

  (4) qualquer outro procedimento necessário à segurança.'
