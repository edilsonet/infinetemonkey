section_title: Familiaridade com as limitações operacionais e com os equipamentos de emergência
subsection_id: a
cite: 91.505(a)
title: 91.505(a)
text: '(a) O piloto em comando de um avião regido por esta Subparte deve, antes de iniciar
  um voo,

  familiarizar-se com o manual de voo aprovado ou AOM desse avião e com os placares, listas

  condensadas de verificações e marcas de instrumentos contendo limitações operacionais

  estabelecidas para o avião, inclusive aquelas especificadas no parágrafo 91.9(b) deste Regulamento.'
