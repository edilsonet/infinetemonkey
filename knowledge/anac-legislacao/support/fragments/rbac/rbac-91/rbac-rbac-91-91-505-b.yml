section_title: Familiaridade com as limitações operacionais e com os equipamentos de emergência
subsection_id: b
cite: 91.505(b)
title: 91.505(b)
text: '(b) Cada membro da tripulação requerida deve, antes de iniciar um voo, familiarizar-se
  com o

  equipamento de emergência instalado no avião para o qual ele foi escalado e com os procedimentos

  a serem seguidos para o uso desse equipamento em situações de emergência.'
