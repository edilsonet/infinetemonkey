text: '(a) Exceto como estabelecido nos parágrafos (c) e (d) desta seção, somente é permitido
  decolar

  com um avião regido por esta Subparte para um voo sobre água, com mais de 30 minutos de
  tempo

  de voo ou mais de 185 km (100 NM) de distância da costa (conforme definido no parágrafo
  91.201(a)


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


