title: 91.511(b)
text: '(b) Para os propósitos dos parágrafos (a)(1)(iv) e (a)(2) desta seção, um receptor
  ou uma unidade

  eletrônica de navegação é independente se o funcionamento de qualquer de suas partes não
  depender

  do funcionamento de qualquer parte de outro receptor ou de outra unidade eletrônica de navegação.'
