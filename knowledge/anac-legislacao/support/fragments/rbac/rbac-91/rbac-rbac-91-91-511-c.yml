title: 91.511(c)
text: '(c) Ressalvado o estabelecido no parágrafo (a) desta seção, e salvo se o avião possuir
  uma MEL

  aprovada permitindo voo nesta situação, uma pessoa pode operar um avião regido por esta
  Subparte,

  no qual não estejam sendo transportados passageiros, desde um local onde reparos ou substituições

  não possam ser feitos até outro local onde estes possam ser feitos, desde que não mais do
  que um de

  cada item duplicado de equipamento de comunicações e de navegação especificado no parágrafo
  (a)

  desta seção torne-se inoperante ou apresente mau funcionamento.'
