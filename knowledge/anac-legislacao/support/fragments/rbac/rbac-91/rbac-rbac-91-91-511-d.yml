cite: 91.511(d)
title: 91.511(d)
text: '(d) Ressalvado o estabelecido no parágrafo (a) desta seção, quando são requeridos equipamentos

  de comunicações em VHF e em HF para a rota, e o avião possuir dois transmissores e dois
  receptores

  de VHF, apenas um receptor e um transmissor de HF são requeridos para as comunicações.'
