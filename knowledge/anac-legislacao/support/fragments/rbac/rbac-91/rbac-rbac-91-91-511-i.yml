section_title: Equipamento rádio para operações sobre água
subsection_id: i
cite: 91.511(i)
title: 91.511(i)
text: '(i) dois transmissores;

  (ii) dois microfones;

  (iii) dois fones, ou um fone e um alto-falante; e

  (iv) dois receptores independentes; e

  (2) equipamentos eletrônicos de navegação apropriados, constituídos por, pelo menos, duas

  unidades eletrônicas independentes de navegação, capazes de prover o piloto com as informações

  necessárias para navegar com o avião dentro do espaço aéreo designado pelo órgão ATS. No
  entanto,

  pode ser utilizado um único receptor que receba tanto os sinais requeridos para navegação
  como para

  comunicações em vez de um receptor para navegação e outro receptor para comunicações.'
