cite: 91.513(b)
title: 91.513(b)
text: '(b) Cada item de equipamento:

  (1) deve ser inspecionado conforme a seção 91.409 deste Regulamento para assegurar sua

  contínua usabilidade e imediata disponibilidade para os fins pretendidos;

  (2) deve ser prontamente acessível aos tripulantes;

  (3) deve possuir claramente indicado seu método de operação; e

  (4) quando transportado em um compartimento ou embalagem, esse compartimento ou

  embalagem deve ser claramente identificado quanto ao seu conteúdo e com a data da última
  inspeção.'
