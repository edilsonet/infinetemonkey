cite: 91.513(c)
title: 91.513(c)
text: '(c) Extintores de incêndio portáteis devem estar disponíveis para uso nos compartimentos
  de

  pilotos, passageiros e carga, de acordo com o seguinte:

  (1) o tipo e a quantidade do agente extintor devem ser adequados para os tipos de fogo que

  possam ocorrer no compartimento onde se pretende usar o extintor;


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (2) pelo menos um extintor deve ser colocado no compartimento dos pilotos em local

  prontamente acessível aos tripulantes de voo;

  (3) pelo menos um extintor adequadamente colocado no compartimento de passageiros de cada

  avião acomodando mais de 6 e menos de 31 passageiros e pelo menos 2 extintores adequadamente

  colocados no compartimento de passageiros de cada avião acomodando mais de 30 passageiros;
  e

  (4) os extintores de incêndio devem ser instalados e presos de maneira a não interferir
  com a

  operação segura do avião e não afetar a segurança de tripulantes e passageiros. Eles devem
  ser

  rapidamente acessíveis e, salvo se sua localização for clara, seus locais de guarda devem
  ser

  apropriadamente identificados.'
