cite: 91.517(a)
title: 91.517(a)
text: '(a) Somente é permitido operar um avião regido por esta Subparte transportando passageiros
  se

  ele for equipado com avisos luminosos informando quando é necessário ajustar cintos de segurança

  e com avisos informando que é proibido fumar, visíveis para todos os passageiros e comissários,
  com

  exceção do previsto no parágrafo (b) desta seção. Os avisos luminosos devem ser instalados
  de modo

  a permitir que os tripulantes os liguem e os desliguem. Eles devem ser ligados durante as

  movimentações do avião na superfície, para cada decolagem e cada pouso, e sempre que o piloto
  em

  comando considerar necessário.'
