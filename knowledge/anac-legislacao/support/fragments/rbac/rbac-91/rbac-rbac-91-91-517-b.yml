title: 91.517(b)
text: '(b) Em um avião que não requeira ser equipado como previsto no parágrafo (a) desta
  seção pelos

  requisitos de aeronavegabilidade a ele aplicáveis, o piloto em comando deve assegurar-se
  de que os

  passageiros sejam avisados verbalmente quando é proibido fumar e a cada vez que se torne
  necessário

  colocar e ajustar os cintos de segurança.'
