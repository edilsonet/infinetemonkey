title: 91.517(d)
text: '(d) Qualquer pessoa que o parágrafo 91.107(a)(3) requeira ocupar um assento ou um beliche
  deve

  colocar seu cinto de segurança e mantê-lo ajustado em torno de seu corpo enquanto qualquer
  sinal

  para ajustar cintos estiver aceso.'
