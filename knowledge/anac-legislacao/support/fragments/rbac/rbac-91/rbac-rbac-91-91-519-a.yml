section_title: Instruções verbais aos passageiros
subsection_id: a
cite: 91.519(a)
title: 91.519(a)
text: '(a) Antes de cada decolagem o piloto em comando de um avião regido por esta Subparte,

  transportando passageiros, deve assegurar-se que todos os passageiros receberam instruções
  verbais

  sobre:

  (1) fumo: cada passageiro deve ser instruído sobre quando, onde e sob quais condições é

  permitido fumar. Tal instrução deve esclarecer que os regulamentos da ANAC exigem que os

  passageiros atendam aos avisos luminosos e aos placares de não fumar, que os passageiros
  atendam

  às instruções pertinentes dos tripulantes e que é proibido fumar nos lavatórios;

  (2) uso do cinto de segurança e cintos de ombro: cada passageiro deve ser instruído sobre

  quando, onde e sob quais condições é necessário colocar o cinto de segurança e os cintos
  de ombro

  (se instalados) e mantê-lo(s) ajustado(s) em torno de seu corpo. Tal instrução deve esclarecer
  que os

  regulamentos da ANAC exigem que os passageiros atendam aos avisos luminosos e às instruções
  dos

  tripulantes sobre utilização dos cintos;

  (3) localização e meios de abertura da porta de entrada de passageiros e das saídas de

  emergência;

  (4) localização dos equipamentos de sobrevivência;

  (5) para voos sobre água, procedimentos para pouso na água e uso do equipamento de flutuação

  requerido pela seção 91.231 deste Regulamento; e

  (6) o uso normal e em emergência do equipamento de oxigênio instalado no avião.'
