title: 91.519(c)
text: '(c) Cada cartão utilizado conforme o parágrafo (b) desta seção deve ser colocado

  convenientemente dentro do avião para ser consultado de cada assento de passageiro e deve
  conter

  informações pertinentes apenas ao tipo e modelo do avião em que é utilizado.'
