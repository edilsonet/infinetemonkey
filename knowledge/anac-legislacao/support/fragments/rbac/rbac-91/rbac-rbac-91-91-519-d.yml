text: '(d) Para as operações conduzidas segundo a Subparte K deste Regulamento, aplicam-se
  as

  instruções aos passageiros requeridas pela seção 91.1035 deste Regulamento, em vez dos requisitos

  dos parágrafos (a) a (c) desta seção. (Incluído pela Resolução nº 606, de 11.02.2021)'
