cite: 91.521(a)
title: 91.521(a)
text: '(a) Somente é permitido operar um avião, regido por esta Subparte, categoria transporte
  de tipo

  certificado em seu país de origem após 1º de janeiro de 1958, se este for equipado com uma


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  combinação de cinto de segurança e cintos de ombro em cada assento da cabine dos pilotos.
  A

  combinação deve atender os requisitos da seção 25.785 do RBAC nº 25, exceto que:

  (1) cintos de ombro e cintos de segurança combinados com cintos de ombro que foram

  aprovados e instalados antes de 6 de março de 1980, podem continuar a ser utilizados; e

  (2) podem ser utilizados sistemas de travamento automático dos cintos de segurança e dos
  cintos

  de ombro, desde que projetados para atender aos fatores de cargas de inércia estabelecidos
  conforme

  as bases de certificação do avião.'
