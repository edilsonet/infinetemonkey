cite: 91.521(b)
title: 91.521(b)
text: '(b) Somente é permitido operar um avião, regido por esta Subparte, categoria transporte,
  se ele for

  equipado com uma combinação de cinto de segurança e cinto de ombro em cada assento de

  comissário, devendo essa combinação atender aos requisitos da seção 25.785 do RBAC nº 25,
  exceto

  que:

  (1) cintos de ombro e cintos de segurança combinados com cintos de ombro que foram

  aprovados e instalados antes de 6 de março de 1980, podem continuar a ser utilizado; e

  (2) podem ser utilizados sistemas de travamento automático dos cintos de segurança e dos
  cintos

  de ombro, desde que projetados para atender aos fatores de cargas de inércia estabelecidos
  conforme

  as bases de certificação do avião.'
