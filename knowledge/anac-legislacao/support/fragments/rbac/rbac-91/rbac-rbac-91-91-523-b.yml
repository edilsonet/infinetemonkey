cite: 91.523(b)
title: 91.523(b)
text: '(b) sob um assento de passageiro que possua dispositivo para impedir que a bagagem
  escorregue

  para a frente sob o impulso das cargas finais de inércia que possam ocorrer em um pouso
  forçado,

  como especificado no parágrafo 25.561(b)(3) do RBAC nº 25. Tal dispositivo deve impedir
  também

  deslizamentos laterais da bagagem sob as mesmas cargas e segundo o referido parágrafo 25.561(b)(3)

  do RBAC nº 25.'
