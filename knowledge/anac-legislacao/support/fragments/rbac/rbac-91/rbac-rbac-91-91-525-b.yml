cite: 91.525(b)
title: 91.525(b)
text: '(b) Quando a carga for transportada em compartimento de carga que requeira a entrada
  física de

  um tripulante para extinguir qualquer incêndio que possa ocorrer em voo, a carga deve ser
  distribuída

  dentro desse compartimento de modo a permitir que o tripulante efetivamente alcance todas
  as partes

  do compartimento com o conteúdo de um extintor de incêndio portátil.'
