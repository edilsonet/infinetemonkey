cite: 91.525(i)
title: 91.525(i)
text: '(i) estiver adequadamente presa por um cinto de segurança ou outros meios de amarração

  que tenha suficiente resistência para eliminar o risco de deslizamento sob qualquer condição
  esperada

  em voo e no solo;

  (ii) estiver adequadamente embalada ou coberta para evitar possíveis ferimentos aos

  passageiros;


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (iii) não impor qualquer carga nos assentos ou na estrutura do assoalho que exceda os limites

  de carga desses componentes;

  (iv) não for colocada em posição que restrinja o acesso ou a utilização de qualquer saída

  normal ou de emergência ou o uso dos corredores do compartimento dos passageiros, inclusive
  o

  corredor de acesso ao compartimento dos pilotos; e'
