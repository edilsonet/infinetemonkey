cite: 91.527(a)
title: 91.527(a)
text: '(a) É vedado ao piloto decolar com um avião regido por esta Subparte que apresente
  gelo, geada

  ou neve aderidos a qualquer hélice, para-brisa, estabilizadores ou superfícies de controle,
  instalação

  de motor, a partes de um sistema de velocímetro, altímetro, velocidade vertical e instrumentos
  de

  atitude de voo ou asa.'
