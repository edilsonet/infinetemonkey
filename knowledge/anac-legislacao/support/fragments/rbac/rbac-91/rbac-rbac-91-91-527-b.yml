section_id: '91.527'
section_title: Operação em condições de gelo
subsection_id: b
cite: 91.527(b)
title: 91.527(b)
text: '(b) Somente é permitido voar IFR em condições conhecidas ou previstas de formação leve
  ou

  moderada de gelo, ou VFR em condições conhecidas de formação leve ou moderada de gelo, se
  o

  avião:

  (1) possuir, em funcionamento, equipamento antigelo ou de degelo protegendo cada hélice,

  para-brisa, asa, estabilizador ou superfície de controle e cada sistema de velocímetro,
  altímetro,

  velocidade vertical e instrumentos de atitude de voo;

  (2) possuir as provisões de proteção contra gelo estabelecidas pelo Special Federal Aviation

  Regulation No. 23 (SFAR 23), seção 34, emitido pela FAA/EUA; ou

  (3) atenda as provisões da certificação de tipo de avião de categoria transporte, incluindo
  os

  requisitos de certificação para voo sob condições de formação de gelo.'
