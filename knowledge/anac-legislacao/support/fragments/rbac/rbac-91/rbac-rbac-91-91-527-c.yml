section_title: Operação em condições de gelo
subsection_id: c
cite: 91.527(c)
title: 91.527(c)
text: '(c) Somente é permitido voar um avião regido por esta Subparte em condições conhecidas
  ou

  previstas de formação severa de gelo se o avião atender às provisões de proteção contra
  gelo

  requeridas pelo SFAR 23, seção 34, emitido pela FAA/EUA, ou às provisões de proteção contra
  gelo

  requeridas para certificação de aviões categoria transporte.'
