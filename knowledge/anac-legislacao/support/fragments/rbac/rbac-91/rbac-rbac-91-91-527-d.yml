section_title: Operação em condições de gelo
subsection_id: d
cite: 91.527(d)
title: 91.527(d)
text: '(d) Se informações meteorológicas atualizadas e outras informações confiáveis pelo
  piloto em

  comando indicarem que a previsão de condições de formação de gelo que proibiria o voo não
  mais

  serão encontradas durante o voo em virtude da mudança das condições meteorológicas após
  a

  previsão, as restrições no parágrafo (b) e (c) desta seção baseadas nas condições previstas
  não se

  aplicam.'
