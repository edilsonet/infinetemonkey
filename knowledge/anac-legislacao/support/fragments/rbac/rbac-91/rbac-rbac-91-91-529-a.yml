section_title: Requisitos de mecânico de voo
subsection_id: a
cite: 91.529(a)
title: 91.529(a)
text: '(a) Somente é permitido operar, segundo esta Subparte, os seguintes aviões, se um mecânico
  de

  voo, devidamente habilitado, fizer parte da tripulação técnica:

  (1) um avião com um peso máximo de decolagem aprovado superior a 36.300 kg (80.000 lb),

  de tipo certificado em seu país de origem antes de 2 de janeiro de 1964; ou


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (2) um avião de tipo certificado em seu país de origem após 2 de janeiro de 1964, para o
  qual é

  requerido um mecânico de voo, como tripulante, pelo certificado de tipo.'
