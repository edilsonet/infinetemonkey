section_title: Requisitos de mecânico de voo
subsection_id: b
cite: 91.529(b)
title: 91.529(b)
text: '(b) Somente é permitido trabalhar em um avião regido por esta Subparte como mecânico
  de voo

  requerido se, dentro dos 6 meses precedentes, ele tiver voado pelo menos 50 horas como mecânico

  de voo nesse tipo de avião ou tiver sido submetido e aprovado em uma verificação nesse tipo
  de avião

  conduzida pela ANAC.'
