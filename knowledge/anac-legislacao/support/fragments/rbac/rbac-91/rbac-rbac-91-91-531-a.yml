section_title: Requisitos de piloto segundo em comando
subsection_id: a
cite: 91.531(a)
title: 91.531(a)
text: '(a) Exceto na condição prevista no parágrafo (b) desta seção, é vedado operar os seguintes
  aviões

  sem um piloto habilitado e designado como segundo em comando:

  (1) qualquer avião certificado para operação com mais de 1 (um) piloto;

  (2) qualquer grande avião ou um avião da categoria normal nível de certificação 4; e

  (3) qualquer avião categoria transporte regional ou um avião categoria normal nível de

  certificação 3.'
