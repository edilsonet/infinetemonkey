title: 91.531(b)
text: '(b) É permitido operar os seguintes aviões sem um piloto designado como segundo em
  comando:

  (1) qualquer avião certificado para operação com apenas 1 (um) piloto; e

  (2) um grande avião, um avião da categoria normal nível de certificação 4 ou um avião

  multimotor com motor a turbina que possua um certificado de aeronavegabilidade especial,
  se:'
