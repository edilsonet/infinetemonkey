section_title: Requisitos de piloto segundo em comando
subsection_id: i
cite: 91.531(i)
title: 91.531(i)
text: '(i) o avião foi originalmente projetado com apenas um posto de pilotagem; ou

  (ii) o avião foi originalmente projetado com mais de um posto de pilotagem, mas operações

  com apenas 1 (um) piloto são permitidas pelo manual de voo do avião, pelas forças armadas

  brasileiras ou pelas forças armadas de um Estado contratante da Convenção de Aviação Civil

  Internacional.'
