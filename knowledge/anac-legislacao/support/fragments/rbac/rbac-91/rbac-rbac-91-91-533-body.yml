title: Requisitos para comissários
text: '91.533 Requisitos para comissários

  Somente é permitido operar um avião regido por esta Subparte, que tenha a bordo mais de
  19

  passageiros, se o avião possuir um comissário de voo para cada grupo de passageiros composto
  por

  no máximo 50 pessoas.'
