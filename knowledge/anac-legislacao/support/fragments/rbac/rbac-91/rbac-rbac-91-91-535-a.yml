title: 91.535(a)
text: '(a) É vedado a um operador movimentar um avião regido por esta Subparte na superfície,
  decolar

  ou pousar, se qualquer alimento, bebida ou utensílio correlato fornecido pelo operador estiver

  localizado em um assento de passageiro.'
