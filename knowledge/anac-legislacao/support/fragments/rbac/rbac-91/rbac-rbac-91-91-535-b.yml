title: 91.535(b)
text: '(b) Somente é permitido a um operador movimentar um avião regido por esta Subparte
  na

  superfície, decolar ou pousar, se cada bandeja de alimentação ou bebida e cada mesa de assento
  estiver

  segura em sua posição guardada.'
