title: Dispositivo de alarme sonoro de velocidade
text: '91.603 Dispositivo de alarme sonoro de velocidade

  Somente é permitido operar comercialmente um avião categoria transporte se esse avião estiver

  equipado com um dispositivo de alarme sonoro de velocidade que atenda ao parágrafo 25.1303
  (c)(1)

  do RBAC nº 25.'
