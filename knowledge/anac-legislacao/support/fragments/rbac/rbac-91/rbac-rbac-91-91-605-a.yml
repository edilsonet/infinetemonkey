section_title: Limitações de peso de aviões civis categoria transporte
subsection_id: a
cite: 91.605(a)
title: 91.605(a)
text: '(a) Somente é permitido decolar com qualquer avião categoria transporte (outro que
  não um avião

  com motores a turbina de tipo certificado em seu país de origem após 30 de setembro de 1958)
  se:

  (1) o peso de decolagem não exceder o peso máximo de decolagem autorizado para a altitude

  do aeródromo de partida;

  (2) a altitude do aeródromo de partida estiver dentro da gama de altitudes na qual os pesos

  máximos de decolagem foram determinados;

  (3) o consumo normal de óleo e combustível no voo para o aeródromo de primeiro pouso

  planejado permitir que o peso na chegada não exceda o peso máximo de pouso autorizado para
  a

  altitude desse aeródromo; e

  (4) a altitude do aeródromo de primeiro pouso, e dos correspondentes aeródromos de

  alternativa, estiver dentro da gama de altitudes na qual os pesos máximos de pouso foram

  determinados.'
