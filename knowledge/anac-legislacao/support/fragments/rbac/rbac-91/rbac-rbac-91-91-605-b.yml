cite: 91.605(b)
title: 91.605(b)
text: '(b) Somente é permitido operar um avião categoria transporte com motores a turbina,
  certificado

  em seu país de origem após 30 de setembro de 1958, se forem cumpridas as disposições do
  manual

  de voo aprovado ou do AOM. Além disso, somente é permitido decolar com esse avião se:

  (1) o peso de decolagem não exceder o peso de decolagem previsto no manual de voo aprovado

  ou AOM para a altitude do aeródromo de partida e para a temperatura ambiente existente no
  momento

  de decolagem;

  (2) o consumo normal de combustível e óleo no voo até o aeródromo de primeiro pouso

  planejado e até os aeródromos de alternativa correspondentes permitir que o peso na chegada
  não

  ultrapasse o peso de pouso previsto no manual de voo aprovado ou no AOM para a altitude
  de cada

  um dos aeródromos envolvidos, considerando a temperatura ambiente esperada nesses aeródromos

  no momento do pouso em cada um deles;

  (3) o peso de decolagem não exceder o peso especificado no manual de voo aprovado ou no

  AOM, correspondente ao peso para as distâncias mínimas requeridas para decolagem, considerando

  a altitude do aeródromo, a pista a ser utilizada, o gradiente dessa pista, a temperatura
  ambiente e o

  vento existentes na hora de decolagem e, se o manual de voo aprovado ou o AOM contiver

  informações de desempenho com pista molhada, as condições da superfície da pista (se seca
  ou


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  molhada). Distâncias em pista molhada associadas a pistas ranhuradas ou dotadas de camada
  porosa

  de atrito, se disponíveis no manual de voo aprovado ou AOM, podem ser usadas somente em
  pistas

  que sejam realmente ranhuradas ou dotadas de camada porosa de atrito e que o operador da
  aeronave

  tenha comprovado serem projetadas, construídas e mantidas de maneira aceitável pela ANAC;
  e

  (4) onde a distância de decolagem incluir uma clearway, a distância da clearway não for
  maior

