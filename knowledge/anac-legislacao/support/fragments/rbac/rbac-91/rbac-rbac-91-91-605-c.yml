section_title: Limitações de peso de aviões civis categoria transporte
subsection_id: c
cite: 91.605(c)
title: 91.605(c)
text: '(c) Somente é permitido decolar com um avião categoria transporte com motores a turbina,
  de tipo

  certificado em seu país de origem após 29 de agosto de 1959, se, em adição ao requerido
  pelo

  parágrafo (b) desta seção:

  (1) a distância de aceleração e parada não for maior que o comprimento da pista acrescido
  do

  comprimento da stopway (se houver);

  (2) a distância de decolagem não for maior que o comprimento da pista acrescido do

  comprimento da clearway (se houver); e

  (3) a corrida de decolagem não for maior que o comprimento da pista.'
