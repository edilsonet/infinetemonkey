title: 91.607(a-I)
text: '(a)-I Ressalvado o disposto no parágrafo (a) desta seção, os tipos de avião listados
  na tabela

  seguinte podem ser operados com até o número listado de ocupantes (incluindo tripulantes)
  e o

  correspondente número de saídas (incluindo portas e saídas de emergência) aprovado para
  saída de

  emergência de passageiros ou com uma configuração ocupantes/saídas aprovada segundo os

  parágrafos (b) ou (c) desta seção.

