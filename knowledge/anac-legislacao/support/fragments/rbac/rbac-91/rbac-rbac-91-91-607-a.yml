section_title: Saídas de emergência para aviões em operações de transporte de passageiros
  com fins
subsection_id: a
cite: 91.607(a)
title: 91.607(a)
text: '(a) Ressalvada qualquer outra provisão dos RBAC, é vedado operar um grande avião (de
  tipo

  certificado segundo o Civil Air Regulation dos EUA vigente antes de 9 de abril de 1957)
  em

  operações de transporte de passageiros com fins lucrativos com número maior de ocupantes
  do que:

  (1) o permitido pelo Civil Air Regulation, parágrafos 4b.362(a), (b) e (c) vigente em 20
  de

  dezembro de 1951; ou

  (2) o aprovado segundo os Special Civil Air Regulations, dos EUA, SR- 387, SR-389, SR-389A

  ou SR-389B ou segundo esta seção como em vigor.'
