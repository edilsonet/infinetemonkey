section_title: Saídas de emergência para aviões em operações de transporte de passageiros
  com fins
subsection_id: b
cite: 91.607(b)
title: 91.607(b)
text: '(b) O número de ocupantes adicionais aos autorizados pelos parágrafos (a) e (a)-I desta
  seção que

  podem ser transportados é:

  (1) para cada saída adicional ao nível do assoalho com pelo menos 24 pol. (61 cm) de largura

  por 48 pol. (122 cm) de altura, com uma passagem de acesso desobstruída com 20 pol. (51
  cm) de

  largura entre a saída e o corredor de passageiros, doze ocupantes adicionais;

  (2) para cada janela adicional de saída sobre as asas que atenda aos requisitos dos padrões
  de

  aeronavegabilidade segundo os quais o tipo de avião foi certificado e que seja suficientemente
  grande

  para inscrever uma elipse de 19x26 pol. (48 x 66 cm), oito ocupantes adicionais;

  (3) para cada janela de saída adicional que não esteja localizada sobre as asas, mas que
  de

  alguma maneira atenda ao parágrafo (b)(2) desta seção, cinco ocupantes adicionais; e

  (4) para um avião com razão entre o número máximo de ocupantes e o número de saídas,

  computada com os valores extraídos da tabela do parágrafo (a)-I desta seção, maior que 14:1,
  e para

  cada avião que não tenha pelo menos uma saída tipo porta tamanho grande na lateral da fuselagem

  na parte traseira da cabine, a primeira saída adicional deve ser uma saída ao nível do assoalho
  que

  atenda ao parágrafo (b)(1) desta seção e deve ser localizada na parte traseira da cabine
  no lado da

  fuselagem oposto à porta de entrada principal. No entanto, somente é permitido operar uma
  aeronave

  segundo esta seção transportando mais do que 115 ocupantes se existir uma saída em cada
  lado da

  fuselagem na parte traseira da cabine.'
