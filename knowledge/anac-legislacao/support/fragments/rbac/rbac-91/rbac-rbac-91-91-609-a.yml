section_title: Gravadores de dados de voo e de voz na cabine
subsection_id: a
cite: 91.609(a)
title: 91.609(a)
text: '(a) Somente é permitido ao detentor de certificado de operador emitido segundo o RBAC
  nº 119

  conduzir qualquer operação segundo este Regulamento com uma aeronave listada em suas

  especificações operativas se esta aeronave cumprir os requisitos aplicáveis, no que diz
  respeito a

  gravador de dados de voo e gravador de voz na cabine, do regulamento segundo o qual o certificado

  de operador aéreo (COA) foi emitido. No entanto, este operador pode:

  (1) transladar a aeronave com um gravador de dados de voo ou um gravador de voz na cabine

  inoperante de um aeródromo onde o reparo ou substituição do equipamento não possa ser feito,
  para

  um local onde isso seja possível;

  (2) continuar um voo como originalmente planejado se o gravador de voo ou o gravador de
  voz

  da cabine tornar-se inoperante após a aeronave ter decolado;

  (3) conduzir um voo de experiência durante o qual o gravador requerido é desligado para
  teste

  de um equipamento elétrico ou de comunicações instalado na aeronave; ou

  (4) transladar uma aeronave nova do local onde foi adquirida para o local onde o gravador

  requerido será instalado.'
