cite: 91.609(b)
title: 91.609(b)
text: '(b) Ressalvados os parágrafos (c) e (e) desta seção, um operador que não seja detentor
  de um COA

  pode: (Redação dada pela Resolução nº 606, de 11.02.2021)

  (1) transladar a aeronave com um gravador de dados de voo ou um gravador de voz na cabine

  inoperante de um aeródromo onde o reparo ou substituição do equipamento não possa ser feito,
  para

  um local onde isso seja possível;

  (2) continuar um voo como originalmente planejado se o gravador de voo ou o gravador de
  voz

  da cabine tornar-se inoperante após a aeronave ter decolado;

  (3) conduzir um voo de experiência durante o qual o gravador requerido é desligado para
  teste

  de um equipamento elétrico ou de comunicações instalado na aeronave;

  (4) transladar uma aeronave nova do local onde foi adquirida para o local onde o gravador

  requerido será instalado; ou

  (5) operar uma aeronave:'
