section_title: Gravadores de dados de voo e de voz na cabine
subsection_id: d
cite: 91.609(d)
title: 91.609(d)
text: '(d) Sempre que um gravador de dados de voo requerido por esta seção estiver instalado,
  ele deve

  ser operado continuamente, desde o instante em que o avião inicie a corrida de decolagem,
  ou em que

  a aeronave de asas rotativas inicie a saída do solo, até o momento em que o avião termine
  a corrida

  do pouso, ou a aeronave de asas rotativas pouse em seu destino.'
