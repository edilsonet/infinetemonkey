cite: 91.609(e)
title: 91.609(e)
text: '(e) Salvo se autorizado pela ANAC, somente é permitido operar uma aeronave civil registrada
  no

  Brasil, multimotora, com motores a turbina, possuindo uma configuração aprovada para passageiros

  com 6 ou mais assentos e para a qual são requeridos 2 pilotos pelos requisitos de certificação
  ou por

  uma regra operacional, se ela for equipada com um gravador de voz aprovado na cabine dos
  pilotos

  que:

  (1) seja instalado de acordo com os parágrafos 23.1457(a)(1) e (2), (b), (c), (d)(1)(i),
  (2) e (3),'
