section_title: Gravadores de dados de voo e de voz na cabine
subsection_id: f
cite: 91.609(f)
title: 91.609(f)
text: '(f) Para o cumprimento dos requisitos desta seção, pode ser usado um gravador de voz
  na cabine

  dos pilotos que possua um dispositivo de apagamento de gravação, desde que, a qualquer momento

  durante a operação do gravador, sejam conservadas as gravações feitas pelo menos durante
  os últimos

  15 minutos.'
