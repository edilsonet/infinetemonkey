cite: 91.609(g)
title: 91.609(g)
text: '(g) No evento de um acidente ou ocorrência que determine o encerramento de um voo,
  qualquer

  operador que tenha instalado gravador de voz ou de dados de voo aprovado deve comunicar
  a

  ocorrência à ANAC e conservar as informações gravadas por pelo menos 60 dias ou por prazo

  superior se assim determinado pelo CENIPA.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.'
