title: 91.609(h)
text: '(h) Todos os aviões que, segundo esta seção, devam possuir um gravador de voz na cabine
  de

  comando e um gravador de dados de voo e que tenham sido manufaturados antes de 7 de abril
  de

  2012, devem possuir um gravador de voz da cabine de comando que atenda também ao seguinte:

  (1) os requisitos dos parágrafos 23.1457(d)(6) do RBAC nº 23 ou 25.1457(d)(6) do RBAC nº

  25, como aplicável; e

  (2) se certificado na categoria transporte, os requisitos dos parágrafos 25.1457(a)(3),
  (a)(4) e'
