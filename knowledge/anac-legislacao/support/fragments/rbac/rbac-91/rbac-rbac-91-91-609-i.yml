section_title: Gravadores de dados de voo e de voz na cabine
subsection_id: i
cite: 91.609(i)
title: 91.609(i)
text: '(i) Todas as aeronaves que, segundo esta seção, devam possuir gravador de voz na cabine
  de

  comando e um gravador de dados de voo e que tenham sido manufaturados após 7 de abril de
  2012,

  devem possuir um gravador de voz instalado que:

  (1) atenda também aos requisitos da seção 23.1457 do RBAC nº 23 (exceto os parágrafos (a)(6)

  e (d)(5)); aos requisitos da seção 25.1457 do RBAC nº 25 (exceto os parágrafos (a)(6) e
  (d)(5)); aos

  requisitos da seção 27.1457 do RBAC nº 27 (exceto os parágrafos (a)(6) e (d)(5)); ou aos
  requisitos

  da seção 29.1457 do RBAC nº 29 (exceto os parágrafos (a)(6) e (d)(5)), como aplicável;

  (2) mantenha, pelo menos, as 2 últimas horas de gravações utilizando um gravador que atenda

  aos padrões do OTP (TSO) C123a ou revisão posterior; e

  (3) no caso de aeronaves fabricadas a partir de 6 de abril de 2014, devem também atender
  aos

  requisitos dos parágrafos 23.1457(a)(6) e (d)(5) do RBAC nº 23; 25.1457(a)(6) e (d)(5) do
  RBAC nº

  25; 27.1457(a)(6) e (d)(5) do RBAC nº 27; ou 29.1457(a)(6) e (d)(5) do RBAC nº 29, como
  aplicável.'
