section_title: Autorização para voo de traslado com um motor inoperante
subsection_id: a
cite: 91.611(a)
title: 91.611(a)
text: '(a) O detentor de um certificado emitido segundo o RBAC nº 119 pode conduzir o traslado
  de um

  avião com quatro motores ou com três motores a turbina com um motor inoperante para uma
  base

  onde esse motor será reparado ou substituído, desde que:

  (1) o modelo do avião tenha sido submetido a ensaios em voo e considerado satisfatório para

  operação segura conforme o parágrafo (b) ou (c) desta seção. No entanto, cada operador que
  antes de

  19 de novembro de 1966 tenha demonstrado que um modelo de avião com um motor inoperante
  é

  satisfatório para voo seguro por meio de um ensaio em voo conduzido em conformidade com
  dados

  de desempenho contidos no manual de voo aprovado ou AOM aplicável atendendo às provisões
  do

  parágrafo (a)(2) desta seção, não precisa repetir o ensaio em voo para este modelo;

  (2) o manual de voo aprovado ou AOM contenha os seguintes dados de desempenho com um

  motor inoperante e o voo seja conduzido de acordo com esses dados:'
