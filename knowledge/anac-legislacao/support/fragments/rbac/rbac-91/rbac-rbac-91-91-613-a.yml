section_title: Materiais para compartimentos interiores
subsection_id: a
cite: 91.613(a)
title: 91.613(a)
text: '(a) Somente é permitido operar um avião que atenda a uma emenda de um certificado de
  tipo ou a

  um certificado de tipo suplementar emitido segundo o SFAR 41, publicado pela FAA/EUA para

  operação com peso máximo de decolagem acima de 5.670 kg (12.500 lb), se, dentro de 1 ano
  após a

  emissão do seu primeiro certificado de aeronavegabilidade segundo esse SFAR, o avião cumprir
  os

  requisitos de materiais de interiores exigidos pelos parágrafos 25.853(a), (b), (b-1), (b-2)
  e (b-3), do

  14 CFR Part 25, emitido pela FAA/EUA, vigente em 26 de setembro de 1978.'
