text: '(b) Para aviões de categoria transporte de certificado de tipo emitido após 1º de janeiro
  de 1958:

  (1) no caso de aviões fabricados antes de 2 de setembro de 2005 quando, a partir do 20 de
  março

  de 2020, um isolamento termo-acústico for instalado na fuselagem em substituição ao existente,
  este

  isolamento deve atender aos requisitos de propagação de chamas da seção 25.856 do 14 CFR
  Part

  25, emitido pela FAA/EUA, vigente em 2 de setembro de 2003, caso esse isolamento:'
