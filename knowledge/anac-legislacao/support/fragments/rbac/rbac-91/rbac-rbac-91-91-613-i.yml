text: '(i) seja manta de isolamento; ou

  (ii) esteja instalado ao redor de dutos de ar; e

  (2) no caso de aviões fabricados a partir de 2 de setembro de 2005, materiais de isolamento

  termo-acústico instalados na fuselagem devem atender aos requisitos de propagação de chamas
  da

  seção 25.856 do 14 CFR Part 25, emitido pela FAA/EUA, vigente em 2 de setembro de 2003.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  SUBPART H

  FOREIGN AIRCRAFT OPERATIONS,

  OPERATIONS OF BRAZILIAN

  REGISTERED CIVIL AIRCRAFT

  OUTSIDE OF BRAZIL AND RULES

  GOVERNING PERSONS ON BOARD

  SUCH AIRCRAFT*


  * The English version of this subpart is for

  reference only.

  SUBPARTE H

  OPERAÇÕES DE AERONAVES CIVIS

  BRASILEIRAS NO EXTERIOR, DE

  AERONAVES CIVIS ESTRANGEIRAS NO

  BRASIL E REQUISITOS PARA PESSOAS

  A BORDO DESSAS AERONAVES


  § 91.701 Applicability'
