section_title: Aeronavegabilidade de aeronave civil
subsection_id: b
cite: 91.7(b)
title: 91.7(b)
text: '(b) O piloto em comando de uma aeronave civil é responsável pela verificação das condições
  da

  aeronave quanto à segurança do voo. Ele deve descontinuar o voo, assim que possível, quando

  ocorrerem problemas mecânicos, elétricos ou estruturais que degradem a aeronavegabilidade
  da

  aeronave.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.'
