cite: 91.703(a)
title: 91.703(a)
text: '(a) Cada pessoa operando uma aeronave civil

  brasileira fora do Brasil deve:

  (1) when over the high seas, comply

  with Annex 2 (Rules of the Air) to the

  Convention on International Civil Aviation

  and, if applicable, with Brazilian airspace

  control regulations;

  (1) quando voando em alto mar, cumprir

  as regras do Anexo 2 à Convenção de Aviação

  Civil Internacional e as regras estabelecidas pelo

  DECEA, como e se aplicáveis;

  (2) when within another State, comply

  with the operational regulations there in

  force and with interception orders from that

  State;

  (2) quando em outro país, cumprir os

  regulamentos operacionais desse país e as

  ordens de interceptação de outros Estados;

  (3) except for paragraph 91.307(b) and

  sections'
