cite: 91.711(b)
title: 91.711(b)
text: '(b) No person may conduct VFR

  operations which require two-way radio

  communications under this part unless at

  least one pilot of the aircraft is able to

  conduct two-way radio communications in

  either the Portuguese or English languages.'
