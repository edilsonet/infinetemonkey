text: '91.711 deste Regulamento, desde que eles não

  contradigam os regulamentos aplicáveis do país

  onde a aeronave se encontra ou o Anexo 2 à

  Convenção de Aviação Civil Internacional;

  (4) when operating within airspace

  designated as North Atlantic High Level

  Airspace (NAT-HLA) airspace, comply with

  section 91.1707 of this Regulation. When

  operating within airspace which requires a

  special approval (RVSM, PBN, etc.), comply

  with subpart N of this Regulation; and

  (4) quando voando em espaço aéreo NAT-

  HLA (North Atlantic High Level Airspace),

  cumprir o previsto na seção 91.1707 deste

  Regulamento. Quando operando em espaço

  aéreo que requeira aprovação especial (RVSM,

  PBN, etc.), cumprir com o previsto na Subparte

  N deste Regulamento; e


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (5) for airplane, helicopter, airship or

  powered lift aircraft pilots, be able to

  communicate with the air traffic service

  (ATS) using the English language, and hold a

  valid ICAO level 4, 5 or 6 rating granted by

  ANAC, according to the stablished by the

  section 61.10 of RBAC 61.

  (5) ser capaz de estabelecer os contatos

  com os órgãos ATS na língua inglesa e ter

  averbado em sua(s) licença(s) o nível de

  proficiência na língua inglesa 4, 5 ou 6, de

  acordo com a seção 61.10 do RBAC nº 61,

  dentro do prazo de validade, no caso de pilotos

  de avião, helicóptero, aeronave de sustentação

  por potência ou dirigível.


  §§ 91.705 to 91.709 [Reserved]'
