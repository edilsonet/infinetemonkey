cite: 91.711(d)
title: 91.711(d)
text: '(d) Cada pessoa operando uma aeronave civil

  estrangeira sobre alto mar ao longo da costa

  brasileira deve preencher um plano de voo de

  acordo com os Procedimentos Suplementares

  para a região OACI envolvida.'
