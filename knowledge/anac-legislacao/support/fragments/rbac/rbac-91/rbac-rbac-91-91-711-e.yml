title: 91.711(e)
text: '(e) Se equipamento de navegação VOR for

  requerido pelo parágrafo (c)(1)(ii) desta seção,

  somente é permitido operar uma aeronave civil

  estrangeira no Brasil no FL 240 ou acima se a

  aeronave for equipada com um equipamento de

  medição de distâncias (DME) ou sistema RNAV

  adequado capaz de receber e apresentar

  informação de distância de estações VOR a

  serem utilizadas. Quando o DME ou sistema

  RNAV requerido por este parágrafo falhar em ou

  acima do FL 240, o piloto em comando da

  aeronave deve notificar imediatamente ao órgão

  ATS, podendo prosseguir o voo em tais níveis

  para o próximo aeródromo de pouso planejado

  no qual o equipamento possa ser reparado ou

  substituído. No entanto, este parágrafo não se

  aplica a aeronaves civis estrangeiras não

  equipadas com DME ou sistema RNAV

  adequado,

  desde

  que

  operadas

  com

  os

  propósitos abaixo e que o órgão ATS seja

  notificado do fato antes de cada decolagem:

  (1) ferry flights to a place where repairs

  or alterations are to be made;

  (1) voos de translado para locais onde o

  DME será reparado ou substituído;

  (2) ferry flights to a new country of

  registry;

  (2) voos de translado para um novo país de

  registro;

  (3) flight of a new aircraft of Brazilian

  manufacture for the purpose of:

  (3) voo de uma nova aeronave fabricada

  no Brasil com o propósito de:'
