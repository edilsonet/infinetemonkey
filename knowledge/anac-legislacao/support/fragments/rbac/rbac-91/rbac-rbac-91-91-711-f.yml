text: '(f) Somente é permitido operar uma aeronave

  civil estrangeira em espaço aéreo brasileiro que


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  a special approval (RVSM, PBN, etc.) unless

  such aircraft and the crew are authorized to

  perform such operation under the rules

  issued by the civil aviation authority of the

  State of registry of the aircraft.

  requeira aprovação especial (RVSM, PBN, etc.)

  se a aeronave e a tripulação forem autorizadas a

  realizar tal operação sob as regras expedidas pela

  autoridade de aviação civil do país de matrícula

  da aeronave.


  § 91.713 [Reserved]'
