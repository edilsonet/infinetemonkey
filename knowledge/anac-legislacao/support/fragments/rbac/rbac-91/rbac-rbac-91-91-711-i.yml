section_title: Requisitos para aeronaves civis
subsection_id: i
cite: 91.711(i)
title: 91.711(i)
text: '(i) ensaiar em voo a aeronave;

  (ii) training foreign flight crews in

  the operation of the aircraft; or

  (ii) treinar tripulantes estrangeiros na

  operação da aeronave; ou

  (iii) ferrying the aircraft for export

  delivery outside Brazil; or

  (iii)

  transladar

  a

  aeronave

  em

  exportação para outro país; ou

  (4) ferry, demonstration, and test flight

  of an aircraft brought to Brazil for the

  purpose of demonstration or testing the whole

  or any part thereof.

  (4) translado, demonstração ou ensaio em

  voo de uma aeronave trazida ao Brasil com o

  propósito de realizar ensaio ou demonstração

  desta ou de partes desta.'
