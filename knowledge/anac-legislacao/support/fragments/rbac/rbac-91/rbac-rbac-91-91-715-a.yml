cite: 91.715(a)
title: 91.715(a)
text: '(a) As aeronaves civis estrangeiras podem ser

  operadas no Brasil sem estar a bordo o

  Certificado de Aeronavegabilidade requerido

  pela seção 91.203, se for emitida uma

  autorização de voo da ANAC (AVANAC) nos

  termos da Resolução nº 178, de 21 de dezembro

  de 2010. A autorização ou um extrato dela deve

  estar a bordo da aeronave enquanto ela estiver

  no país.'
