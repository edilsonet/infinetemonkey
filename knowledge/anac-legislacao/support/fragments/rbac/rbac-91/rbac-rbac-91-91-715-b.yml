title: 91.715(b)
text: '(b) A autorização de voo emitida pela ANAC

  para uma aeronave civil estrangeira pode conter

  as condições e limitações de operação que a

  ANAC considerar necessárias para a operação

  segura no Brasil.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  SUBPARTE I

  REQUISITOS OPERACIONAIS DE RUÍDO'
