title: 91.801(b)
text: '(b) Para fins de enquadramento nos requisitos desta Subparte, as seguintes classificações
  de ruído

  são aceitas como equivalentes, conforme disposto respectivamente no Anexo 16 à Convenção
  de

  Aviação Civil Internacional e no RBAC nº 36:

  (1) Capítulo 3 e Estágio 3; e

  (2) Capítulo 4 e Estágio 4.'
