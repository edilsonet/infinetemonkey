title: Limitações de operação
text: '91.805 Limitações de operação

  Não pode operar no Brasil qualquer avião sujeito ao 91.801(a)(1) desta Subparte, a menos
  que se

  demonstre que este avião cumpre com os níveis de ruído do “Estágio 3” ou padrão de certificação
  de

  ruído posterior, conforme definido pelo RBAC nº 36.'
