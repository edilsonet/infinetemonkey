section_title: 'Aviões agrícolas e de combate a incêndio: limitações operacionais de ruído'
subsection_id: b
cite: 91.815(b)
title: 91.815(b)
text: '(b) No caso de aeronave agrícola ou de combate a incêndio, se o manual de voo aprovado
  ou AOM,

  ou quaisquer outras informações, marcações ou placares aprovados indicarem que ela não atende
  aos

  requisitos de ruído estabelecidos pelo RBAC nº 36, somente é permitido operar essa aeronave:

  (1) na extensão necessária para cumprir as atividades de trabalho diretamente associadas
  com

  os propósitos para as quais foi projetada;

  (2) para prover treinamento a tripulantes na operação para a qual a aeronave foi projetada
  ou

  aprovada; ou

  (3) para conduzir operações sob o RBAC nº 137.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.'
