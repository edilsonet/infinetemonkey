section_title: Limitações gerais de operação
subsection_id: c
cite: 91.817(c)
title: 91.817(c)
text: '(c) É proibido a qualquer aeronave civil produzir quaisquer outros tipos de ruídos
  ou sons em áreas

  habitadas, incluindo os produzidos por aparelhos de som, que não sejam os provenientes do

  funcionamento normal da aeronave, salvo se autorizado por autoridade competente do local
  a ser

  afetado pelo ruído ou som.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  SUBPARTE J

  [RESERVADO]


  SUBPARTE K

  OPERAÇÕES DE AERONAVES DE PROPRIEDADE COMPARTILHADA

  (Subparte incluída pela Resolução nº 606, de 11.02.2021)'
