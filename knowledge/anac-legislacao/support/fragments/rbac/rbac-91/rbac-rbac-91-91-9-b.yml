title: 91.9(b)
text: '(b) Somente é permitido operar uma aeronave civil registrada no Brasil:

  (1) para a qual é requerido um manual de voo aprovado pela seção 21.5 do RBAC nº 21, se

  existir a bordo um manual de voo aprovado (ou um AOM) atualizado. aeronaves acrobáticas,
  quando

  realizando voos acrobáticos, devem providenciar para que os documentos estejam disponíveis
  no

  local de operação, não sendo necessário portá-los a bordo da aeronave; e

  (2) para a qual não é requerido um manual de voo aprovado pela seção 21.5 do RBAC nº 21,
  se

  existir a bordo:'
