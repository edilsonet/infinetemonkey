section_title: Requisitos para manual de voo aprovado ou manual de operação da aeronave (AOM),
subsection_id: d
cite: 91.9(d)
title: 91.9(d)
text: '(d) Qualquer pessoa decolando ou pousando em um heliponto construído sobre a água com
  um

  helicóptero de tipo certificado segundo o RBAC nº 29 pode realizar momentaneamente um voo

  através da faixa proibida do envelope limitante de altura-velocidade estabelecido para o
  helicóptero,

  conforme necessário para decolar ou pousar, se esse voo dentro da faixa proibida ocorrer
  sobre a

  água, na qual um pouso forçado possa ser realizado, e se o helicóptero for anfíbio ou for
  equipado

  com flutuadores ou outro dispositivo de flutuação de emergência adequado para completar
  um pouso

  de emergência em águas abertas.'
