  (1) Quando a fonte de dados for um instrumento do avião (exceto altímetros) de qualidade
  aceitável para operá-lo,

  o sistema de gravação, excluindo esses sensores (mas incluindo todas as outras características
  do sistema), deve

  contribuir com não mais que metade dos valores desta coluna.

  (2) Se forem usados dados fornecidos por um altímetro "encoder" (resolução de 100 pés cada),
  apenas é requerido

  que um desses parâmetros seja gravado. No entanto, se a altitude for gravada com uma resolução
  de 25 pés, esses

  parâmetros podem ser omitidos.

  (3) Porcentagem da faixa total.

  (4) Esta coluna se aplica a aviões fabricados após 11 de outubro de 1991.

  (5) Somente para Posição do Controle de Arfagem, para todas as aeronaves manufaturadas a
  partir de 7 de abril de

  2012, o intervalo de amostragem (por segundo) é 8. Cada amostragem deve ser gravada nesta
  taxa. Intervalos de

  amostragem alternativos (interleaving) com o intento de atender a este intervalo de amostragem
  são proibidos.


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.'
