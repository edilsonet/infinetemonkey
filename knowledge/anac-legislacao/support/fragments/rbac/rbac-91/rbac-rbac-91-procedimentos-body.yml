text: 'procedimentos:

  (1) antes da partida dos motores;

  (2) antes da decolagem;

  (3) cruzeiro;

  (4) antes do pouso;

  (5) após o pouso; e


  Data da emissão: 14 de junho de 2021.

  Data da vigência: 1º de julho de 2021.


  (6) parada dos motores.'
