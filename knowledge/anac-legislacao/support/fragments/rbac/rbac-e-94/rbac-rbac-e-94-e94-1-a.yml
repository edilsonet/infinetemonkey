cite: E94.1(a)
title: E94.1(a)
text: '(a) Este Regulamento Especial se aplica a aeronaves não tripuladas de uso civil (doravante
  denominadas apenas de aeronaves não tripuladas) capazes de sustentar-se e/ou circular no
  espaço aéreo mediante reações aerodinâmicas, nas seguintes condições:

  (1) se possuírem certidão de cadastro, certificado de matrícula brasileiro ou certificado
  de marca experimental, emitidos pela ANAC; ou

  (2) se operarem em território brasileiro.'
