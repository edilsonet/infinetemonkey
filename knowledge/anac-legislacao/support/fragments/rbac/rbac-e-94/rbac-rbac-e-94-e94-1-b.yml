title: E94.1(b)
text: (b) As regras estabelecidas no RBHA 91, ou RBAC que vier a substituí-lo, e nos RBAC
  nº 21, 43, 45, 61 e na Resolução nº 293/2013, não se aplicam às aeronaves não tripuladas,
  salvo disposição contrária expressa neste Regulamento Especial.
