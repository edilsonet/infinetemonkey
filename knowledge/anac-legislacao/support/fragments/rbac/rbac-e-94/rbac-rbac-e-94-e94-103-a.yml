text: '(a) É proibido o transporte de pessoas, animais, artigos perigosos referidos no RBAC
  nº 175 ou carga proibida por autoridade competente, em aeronaves não tripuladas.

  (1) Essa proibição não se aplica aos artigos perigosos transportados por uma aeronave não
  tripulada, quando tais artigos:'
