section_title: Regras gerais para a operação de aeronaves não tripuladas
subsection_id: d
cite: E94.103(d)
title: E94.103(d)
text: (d) Todas as operações de aeronaves não tripuladas de uso não recreativo acima de 250
  gramas de peso máximo de decolagem devem possuir seguro com cobertura de danos a terceiros,
  exceto as operações de aeronaves pertencentes a entidades controladas pelo Estado.
