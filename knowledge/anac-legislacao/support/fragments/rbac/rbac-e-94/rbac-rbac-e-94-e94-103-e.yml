section_title: Regras gerais para a operação de aeronaves não tripuladas
subsection_id: e
cite: E94.103(e)
title: E94.103(e)
text: (e) A operação de aeromodelos de peso máximo de decolagem acima de 250 gramas somente
  é permitida pela ANAC em áreas distantes de terceiros, sob total responsabilidade do seu
  operador, conforme permitido o uso do espaço aéreo pelo DECEA.
