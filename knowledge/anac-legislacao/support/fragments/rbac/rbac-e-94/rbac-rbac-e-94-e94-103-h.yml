section_title: Regras gerais para a operação de aeronaves não tripuladas
subsection_id: h
cite: E94.103(h)
title: E94.103(h)
text: '(h) Outros órgãos ou entidades controlados pelo Estado não mencionados no parágrafo
  (g) desta seção somente podem operar sob as condições do referido parágrafo (g) mediante
  autorização expressa da ANAC, sendo exigido que se demonstre:

  (1) o interesse público da operação; e

  (2) que haveria um risco maior à vida se a operação fosse realizada por meios alternativos.'
