cite: E94.109(a)
title: E94.109(a)
text: (a) Somente é permitido iniciar uma operação de aeronave não tripulada se, considerando
  vento e demais condições meteorológicas conhecidas, houver autonomia suficiente para realizar
  o voo e pousar em segurança no local previsto.
