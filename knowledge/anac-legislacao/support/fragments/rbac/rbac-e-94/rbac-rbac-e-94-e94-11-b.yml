section_title: Aeronavegabilidade civil
subsection_id: b
cite: E94.11(b)
title: E94.11(b)
text: (b) O piloto remoto em comando de uma aeronave não tripulada é responsável pela verificação
  de suas condições quanto à segurança do voo. Ele deve descontinuar o voo, assim que possível,
  quando ocorrerem problemas mecânicos, elétricos ou estruturais que comprometam a segurança
  da operação.
