title: E94.111(c)
text: (c) Caso haja alguma situação especial, não prevista por este Regulamento Especial,
  que cause perturbação à ordem pública, a ANAC poderá proibir as operações em determinada
  área, mesmo que essa área atenda aos outros critérios do parágrafo (b) desta Seção.
