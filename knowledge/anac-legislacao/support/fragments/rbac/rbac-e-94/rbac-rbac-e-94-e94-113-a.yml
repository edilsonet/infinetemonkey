section_title: Limitações operacionais para RPA com CAVE
subsection_id: a
cite: E94.113(a)
title: E94.113(a)
text: '(a) Somente é permitido operar uma RPA civil com CAVE, conforme permitido o uso do
  espaço aéreo pelo DECEA:

  (1) para os propósitos para os quais o certificado foi emitido;

  (2) sem fins lucrativos; e

  (3) sobre áreas distantes de terceiros.'
