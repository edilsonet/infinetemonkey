title: Operações internacionais
text: 'E94.115 Operações internacionais

  Uma aeronave não tripulada somente poderá, em voo, cruzar as fronteiras nacionais para acessar
  o território brasileiro após a emissão de autorização expressa da ANAC, observada a regulamentação
  específica sobre o controle do espaço aéreo e de demais órgãos competentes.

  Subparte C

  [reservada]

  Subparte D

  Registro e marcas'
