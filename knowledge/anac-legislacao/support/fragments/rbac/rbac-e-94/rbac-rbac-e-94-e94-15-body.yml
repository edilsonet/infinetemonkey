title: Uso de substâncias psicoativas
text: 'E94.15 Uso de substâncias psicoativas

  O piloto remoto em comando e os observadores (se aplicável) de uma aeronave não tripulada
  devem obedecer aos requisitos aplicáveis da Seção 91.17 do RBHA 91, ou disposições correspondentes
  que venham a substituí-las.'
