title: E94.17(b)
text: (b) Por medida cautelar, a ANAC poderá suspender temporariamente as operações quando
  houver suspeita ou evidência de descumprimento de requisitos deste Regulamento Especial
  que afetem significativamente o nível de risco da operação.
