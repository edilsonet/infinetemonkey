title: E94.19(f)
text: '(f) licença, habilitação e extrato do CMA, válidos e conforme aplicáveis segundo este
  Regulamento Especial.

  Nota

  : os documentos acima listados abrangem somente os que são requeridos possuir por parte
  da ANAC. Outros documentos podem ser necessários por parte do DECEA, da ANATEL, ou de outros
  órgãos competentes.

  Subparte B

  REGRAS DE VOO'
