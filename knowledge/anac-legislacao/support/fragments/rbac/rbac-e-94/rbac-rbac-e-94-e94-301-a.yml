title: E94.301(a)
text: (a) As RPA Classe 1 devem ser registradas atendendo ao disposto na Resolução n° 293,
  de 9 de novembro de 2013, que dispõe sobre o Registro Aeronáutico Brasileiro. Essas aeronaves
  fazem jus a um Certificado de Marca Experimental ou a um Certificado de Matrícula, conforme
  aplicável. (Redação dada pela Resolução nº 649, de 30.11.2021)
