title: E94.301(b)
text: '(b) Exceto como previsto nos parágrafos (a) e (d) desta seção, toda aeronave não tripulada
  deve ser cadastrada junto à ANAC e vinculado a uma pessoa (física ou jurídica, com CPF ou
  CNPJ no Brasil), que será a responsável legal pela aeronave.

  (Redação dada pela Resolução nº 649, de 30.11.2021)'
