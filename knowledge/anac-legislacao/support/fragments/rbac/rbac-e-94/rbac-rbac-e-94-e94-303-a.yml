title: E94.303(a)
text: '(a) Somente é permitido operar uma RPA Classe 1 ou 2 se: (Redação dada pela Resolução
  nº 649, de 30.11.2021)

  (1) a RPA atender ao disposto nos parágrafos e seções 45.11(a)(1) e (a)(2); 45.12-I(b),
  (d) e (e); 45.13; 45.15 (se aplicável); 45.16 (se aplicável) do RBAC 45, conforme aplicável;
  (Redação dada pela Resolução nº 649, de 30.11.2021)

  (2) a placa de identificação da RPA requerida pelo parágrafo 45.11(a) do RBAC 45 estiver
  fixada:'
