title: E94.303(b)
text: '(b) Exceto como previsto no parágrafo (d)(1) desta seção, ninguém pode remover, trocar
  ou colocar as informações requeridas pelo parágrafo 45.13(a) do RBAC 45 em qualquer RPA
  sem a aprovação da ANAC.

  (Redação dada pela Resolução nº 649, de 30.11.2021)'
