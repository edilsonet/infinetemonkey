title: E94.303(c)
text: (c) Exceto como previsto no parágrafo (d)(2) desta seção, ninguém pode remover ou instalar
  uma placa de identificação requerida pela seção 45.11 do RBAC 45 ou pelo parágrafo (a)(3)
  desta seção sem a aprovação da ANAC.
