cite: E94.303(d)
title: E94.303(d)
text: '(d) Pessoas executando trabalhos de manutenção, desde que de acordo com métodos, técnicas
  e práticas aceitáveis pela ANAC, podem:

  (1) remover, trocar ou colocar os dados de identificação requeridos pelo parágrafo 45.13(a)
  do RBAC 45 em qualquer RPA; ou

  (Redação dada pela Resolução nº 649, de 30.11.2021)

  (2) remover uma placa de identificação requerida pela seção 45.11 do RBAC 45 ou pelo parágrafo
  (a)(3) desta seção, se necessário para operações de manutenção.'
