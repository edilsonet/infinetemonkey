title: E94.303(g)
text: (g) Se for impossível colocar as informações requeridas em concordância com o previsto
  em função da configuração ou dimensões de uma aeronave, as informações deverão ser colocadas
  no maior tamanho possível e na maior das superfícies autorizadas.
