text: '(i) no lado externo da fuselagem da RPA, de forma legível; ou

  (ii) em um compartimento interno da RPA que possa ser facilmente inspecionado; e

  (3) [Reservado]

  (Redação dada pela Resolução nº 649, de 30.11.2021)

  (4) No caso de RPA Classe 1, adicionalmente ao requerido no parágrafo (a)(1) desta seção,
  atender ao disposto nos parágrafos e seções 45.21; 45.22; 45.23-I; 45.25; 45.27(a)-I e (b)-I;
  45.29-I (sempre que praticável); 45.30-I; 45.31; e 45.33 do RBAC 45, conforme aplicável.

  (Incluído pela Resolução nº 649, de 30.11.2021)'
