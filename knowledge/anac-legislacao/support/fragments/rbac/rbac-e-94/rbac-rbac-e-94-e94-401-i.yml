title: E94.401(i)
text: '(i) for determinado de outra forma pela ANAC; ou

  (ii) a conformidade com emendas que estarão vigentes em data futura seja optada pelo requerente
  ou exigida pela ANAC;

  (2) demonstrar, de maneira aceitável pela ANAC, que o RPAS satisfaz qualquer requisito adicional
  estabelecido pela ANAC a fim de garantir um nível de risco aceitável; e

  (3) fornecer uma declaração certificando que o requerente cumpriu com os requisitos aplicáveis.'
