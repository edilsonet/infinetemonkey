title: E94.403(d)
text: (d) Os RPAS Classe 3 que se destinam a operações VLOS acima de 400 pés AGL devem demonstrar
  cumprimento com os requisitos da seção E94.405 e dos parágrafos (a), (c) e (d) da seção
  E94.407 deste Regulamento Especial.
