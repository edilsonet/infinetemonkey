cite: E94.405(a)
title: E94.405(a)
text: '(a) O requerente deve apresentar de maneira aceitável pela ANAC os seguintes documentos:

  (1) manual de voo do RPAS que estabeleça as condições, as limitações e os procedimentos
  para a operação segura do RPAS;

  (2) manual de manutenção do RPAS que contenha as informações necessárias para a aeronavegabilidade
  continuada do RPAS; e

  (3) relatório de análise de segurança que demonstre que o RPAS é seguro quando operado da
  maneira especificada no manual de voo.'
