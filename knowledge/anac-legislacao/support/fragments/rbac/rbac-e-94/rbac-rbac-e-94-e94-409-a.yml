cite: E94.409(a)
title: E94.409(a)
text: '(a) considerando o seu envelope de voo operacional, a RPA deve:

  (1) ser segura em controle e manobra durante todas as fases do voo; e

  (2) ter desempenho adequado, levando em conta o máximo peso de operação, todas as condições
  de carregamento e altitudes de operação;'
