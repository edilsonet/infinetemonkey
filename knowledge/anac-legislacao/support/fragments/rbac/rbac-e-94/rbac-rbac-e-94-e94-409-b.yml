cite: E94.409(b)
title: E94.409(b)
text: '(b) os sistemas de geração, armazenamento e distribuição de energia para qualquer sistema
  do RPAS devem ser capazes de:

  (1) fornecer a energia requerida para a operação adequada de cargas conectadas durante todas
  as condições pretendidas de operação; e

  (2) alimentar as cargas essenciais requeridas para voo e pouso seguros mesmo na ocorrência
  de qualquer falha simples ou mau funcionamento;'
