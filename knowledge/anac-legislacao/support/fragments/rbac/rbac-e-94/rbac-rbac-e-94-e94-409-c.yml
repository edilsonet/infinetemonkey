cite: E94.409(c)
title: E94.409(c)
text: '(c) cada sistema de alimentação do sistema de propulsão da RPA deve ser projetado,
  arranjado e construído para:

  (1) garantir o funcionamento adequado do sistema de propulsão em todas as condições de operação
  e manobras pretendidas; e

  (2) fornecer a quantidade mínima necessária de combustível/energia para garantir o funcionamento
  do grupo motopropulsor em sua máxima tração/potência, além da operação de todos os sistemas
  que se utilizam dessa fonte de alimentação;'
