title: E94.409(e)
text: (e) o sistema de propulsão da RPA deve ser construído, arranjado e instalado de forma
  a garantir um pouso seguro. A operação adequada do sistema de propulsão deve ser garantida
  quando for necessária ao funcionamento adequado do sistema de recuperação de emergência;
