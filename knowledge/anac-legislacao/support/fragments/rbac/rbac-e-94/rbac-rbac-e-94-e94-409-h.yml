title: E94.409(h)
text: (h) o projeto dos comandos e sistemas de comando deve minimizar a possibilidade de travamento
  e operação inadvertida, incluindo prevenção à montagem incorreta e engajamento não intencional
  de dispositivos de travamento de superfícies de controle;
