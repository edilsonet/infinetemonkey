title: E94.409(k)
text: (k) informações referentes às condições inseguras de operação dos sistemas devem ser
  fornecidas em tempo hábil ao piloto remoto de modo a lhe permitir tomar as ações corretivas
  adequadas. A apresentação destas informações deve minimizar possíveis erros do piloto remoto
  que possam gerar perigos adicionais;
