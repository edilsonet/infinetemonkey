cite: E94.411
title: Projeto de RPAS Classe 1
text: 'E94.411 Projeto de RPAS Classe 1

  Os RPAS Classe 1 devem obter um Certificado de Tipo conforme o RBAC 21. O Certificado de
  Tipo será emitido para a RPA, porém deverá englobar todo o RPAS, incluindo as interdependências
  entre os seus componentes.'
