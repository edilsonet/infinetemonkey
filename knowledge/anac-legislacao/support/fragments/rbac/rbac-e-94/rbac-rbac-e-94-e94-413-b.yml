title: E94.413(b)
text: '(b) Qualquer modificação em um RPAS de Classe 2 ou 3 que tenha seu projeto autorizado
  em conformidade com esta Subparte apenas pode ser realizada após o detentor da autorização
  garantir que o projeto modificado cumpre com todos os requisitos aplicáveis.

  Subparte F

  CERTIFICADOS DE AERONAVEGABILIDADE PARA RPA'
