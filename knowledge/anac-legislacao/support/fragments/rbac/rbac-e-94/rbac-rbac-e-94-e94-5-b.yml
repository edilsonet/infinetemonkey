cite: E94.5(b)
title: E94.5(b)
text: '(b) Os RPAS durante a aplicação de agrotóxicos e afins, adjuvantes, fertilizantes,
  inoculantes, corretivos e sementes sobre áreas desabitadas são classificados para fins deste
  regulamento como Classe 3, independentemente do peso máximo de decolagem da RPA, desde que
  operando VLOS ou EVLOS e até 400 pés AGL.

  (1) Adicionalmente, os operadores e os fabricantes devem informar à ANAC qualquer caso de
  possível saída da área de voo autorizado.

  (2) Para tais operações aplica-se o RBAC-E 94.701(a)(2) independentemente do peso da RPA.

  (3) Para tais operações não se aplica o RBAC-E 94.103(d) e o RBAC-E 94.701(a)(2)(ii).

  (Incluído pela Resolução nº 710, de 31.03.2023)

  Nota

  : a unidade de medida considerada para o rótulo "peso máximo de decolagem" é a de massa
  (kg), em razão do uso já consagrado pela comunidade aeronáutica, que rotula de "peso" o
  que tecnicamente se refere a "massa".'
