section_title: Emissão de CAVE e AEV para RPA
subsection_id: b
cite: E94.503(b)
title: E94.503(b)
text: '(b) O requerente de um CAVE com propósito de treinamento de piloto remoto e/ou pesquisa
  de mercado faz jus ao certificado se, além das exigências da seção 21.193 do RBAC 21:

  (1) ele estabelecer um programa de inspeções e de manutenção de forma a assegurar a aeronavegabilidade
  continuada da aeronave; e

  (2) ele demonstrar que a RPA voou um mínimo de 50 (cinquenta) horas.'
