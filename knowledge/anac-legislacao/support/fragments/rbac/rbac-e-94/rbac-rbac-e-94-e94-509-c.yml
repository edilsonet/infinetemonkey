text: '(c) O proprietário, operador ou depositário de uma aeronave cujo certificado de aeronavegabilidade
  tenha perdido sua validade, por qualquer motivo, deve devolvê-lo à ANAC, caso assim requerido.

  Subparte G

  AERONAVEGABILIDADE CONTINUADA DE RPAS'
