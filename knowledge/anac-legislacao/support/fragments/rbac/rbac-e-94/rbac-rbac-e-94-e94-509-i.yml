cite: E94.509(i)
title: E94.509(i)
text: '(i) a aeronave estiver em conformidade com seu projeto autorizado, exceto por aquelas
  alterações realizadas de acordo com o estabelecido no parágrafo E94.413(b);

  (ii) a aeronave não apresentar condição insegura; e

  (iii) a aeronave estiver registrada no Brasil; e

  (4) um certificado de autorização de voo experimental para os propósitos de pesquisa e desenvolvimento,
  demonstração de cumprimento com requisitos, treinamento de tripulação ou pesquisa de mercado
  é válido por 1 (um) ano após a data de emissão ou renovação, exceto se um período menor
  for estabelecido pela ANAC.'
