cite: E94.601(b)
title: E94.601(b)
text: (b) Exceto para RPAS Classe 2 ou Classe 3, somente é permitido operar um RPAS segundo
  este Regulamento Especial se tiver sido executada uma Inspeção Anual de Manutenção (IAM)
  neste RPAS nos últimos 12 meses. O proprietário ou operador deve apresentar à ANAC uma Declaração
  de Inspeção Anual de Manutenção (DIAM) para o referido RPAS, atestando sua condição de aeronavegabilidade.
