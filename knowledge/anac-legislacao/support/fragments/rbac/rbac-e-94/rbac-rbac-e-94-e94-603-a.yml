title: E94.603(a)
text: (a) Somente é permitido executar manutenção, manutenção preventiva, reparos ou alterações
  em RPAS Classe 1 se a execução se der como estabelecido nos requisitos aplicáveis desta
  Subparte e em outras regulamentações aplicáveis, incluindo o RBAC 43.
