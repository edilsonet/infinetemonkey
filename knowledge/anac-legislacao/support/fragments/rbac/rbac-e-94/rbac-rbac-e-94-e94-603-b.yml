section_title: Aeronavegabilidade continuada de RPAS Classe 1
subsection_id: b
cite: E94.603(b)
title: E94.603(b)
text: (b) Somente é permitido operar um RPAS Classe 1 que possua um manual de manutenção do
  fabricante ou instruções para aeronavegabilidade continuada contendo uma seção de limitações
  de aeronavegabilidade se os tempos para substituição de componentes, os intervalos de inspeção
  e os procedimentos específicos contidos naquela seção forem cumpridos.
