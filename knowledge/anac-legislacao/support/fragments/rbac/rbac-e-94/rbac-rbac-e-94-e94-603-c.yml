cite: E94.603(c)
title: E94.603(c)
text: (c) Somente é permitido modificar um RPAS Classe 1 com base em um certificado suplementar
  de tipo se quem modificar for o detentor deste certificado ou possuir autorização por escrito
  do detentor.
