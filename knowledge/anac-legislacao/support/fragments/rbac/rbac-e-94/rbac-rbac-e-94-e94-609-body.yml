title: Inspeções de RPAS Classe 1
text: 'E94.609 Inspeções de RPAS Classe 1

  Somente é permitido operar um RPAS Classe 1 se os tempos para revisão geral, os intervalos
  de inspeção e os procedimentos específicos contidos no programa de manutenção recomendado
  pelo fabricante forem cumpridos.'
