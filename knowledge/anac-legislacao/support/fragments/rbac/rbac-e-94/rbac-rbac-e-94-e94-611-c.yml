cite: E94.611(c)
title: E94.611(c)
text: '(c) Os altímetros e equipamentos automáticos de informação de altitude aprovados conforme
  uma Ordem Técnica Padrão (OTP) -

  Technical Standard Order

  (TSO) - são considerados testados e inspecionados quando da data de sua fabricação.'
