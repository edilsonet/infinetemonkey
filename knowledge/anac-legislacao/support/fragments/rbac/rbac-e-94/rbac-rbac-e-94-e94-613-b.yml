section_title: Testes e inspeções do transponder de RPAS Classe 1
subsection_id: b
cite: E94.613(b)
title: E94.613(b)
text: (b) Após qualquer instalação ou manutenção do transponder, quando erros na correspondência
  de dados podem ser introduzidos, o sistema como um todo tiver sido testado, inspecionado
  e considerado conforme com o parágrafo (c) do Apêndice E do RBAC 43.
