title: E94.615(a)
text: '(a) Exceto para trabalho executado segundo as seções E94.611 e E94.613 deste Regulamento
  Especial, cada proprietário ou operador deve conservar, pelos períodos estabelecidos no
  parágrafo (b) desta Seção, os seguintes registros:

  (1) registro de manutenção, manutenção preventiva e alteração e registros de inspeção anual
  e outras inspeções obrigatórias, como apropriado, para cada RPAS (incluindo célula, motor,
  hélice, rotor, estações de terra e equipamentos). Os registros devem conter:'
