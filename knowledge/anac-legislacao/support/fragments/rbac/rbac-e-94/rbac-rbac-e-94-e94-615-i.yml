cite: E94.615(i)
title: E94.615(i)
text: '(i) o tempo total de voo de cada célula, motor e hélice;

  (ii) a presente situação de partes com tempo de vida limitado de cada célula, motor, hélice,
  rotor e equipamento;

  (iii) o tempo desde a última revisão geral de itens instalados no RPAS que requerem revisão
  geral com base em tempos específicos;

  (iv) a identificação da presente situação do RPAS em relação a inspeções, incluindo os tempos
  desde a última inspeção obrigatória requerida pelo programa de inspeções segundo o qual
  o RPAS e seus componentes são mantidos;'
