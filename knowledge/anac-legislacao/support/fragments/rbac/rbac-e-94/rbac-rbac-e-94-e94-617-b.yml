cite: E94.617(b)
title: E94.617(b)
text: (b) os registros especificados no parágrafo E94.615(a)(1) deste Regulamento Especial
  que não estiverem incluídos nos registros requeridos pelo parágrafo (a) desta Seção, exceto
  quando o comprador autorizar o vendedor a manter a custódia física de tais registros. No
  entanto, a custódia física não exime o comprador da responsabilidade estabelecida pelo parágrafo
  E94.615(c) deste Regulamento Especial.
