title: Transferência de registros de manutenção de RPAS Classe 1
text: 'E94.617 Transferência de registros de manutenção de RPAS Classe 1

  Qualquer proprietário ou operador que venda um RPAS ou algum de seus componentes principais
  (RPA, RPS, etc.) deve transferir para o comprador, no momento da venda, os seguintes registros
  correspondentes, em linguagem clara ou em forma codificada, a critério do comprador, desde
  que a forma codificada permita a recuperação das informações de maneira aceitável pela ANAC:'
