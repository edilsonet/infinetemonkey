section_title: Aeronavegabilidade continuada de RPAS Classe 3 BVLOS
subsection_id: a
cite: E94.623(a)
title: E94.623(a)
text: '(a) Somente é permitido operar um RPAS Classe 3 destinada a operações BVLOS se:

  (1) os procedimentos específicos recomendados pelo fabricante no manual de manutenção forem
  cumpridos;

  (2) a pessoa que executa manutenção for devidamente treinada e qualificada; e

  (3) todas as ações de manutenção forem registradas em cadernetas apropriadas.

  Subparte H'
