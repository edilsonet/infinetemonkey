title: Responsabilidade e autoridade do piloto remoto em comando
text: 'E94.7 Responsabilidade e autoridade do piloto remoto em comando

  O piloto remoto em comando de uma aeronave não tripulada é diretamente responsável pela
  condução segura da aeronave, pelas consequências advindas, e tem a autoridade final por
  sua operação.'
