cite: E94.701(b)
title: E94.701(b)
text: '(b) Todos os operadores de aeromodelos e de RPA até 250 gramas de peso máximo de decolagem
  são considerados como devidamente licenciados, para os efeitos de aplicação do art. 33 do
  Decreto-Lei nº 3.688, de 3 de outubro de 1941, por força deste Regulamento Especial, sem
  necessidade de possuir documento emitido pela ANAC.

  Nota

  : os documentos acima listados abrangem somente os que são requeridos possuir por parte
  da ANAC. Outros documentos podem ser necessários por parte do DECEA, da ANATEL, ou de outros
  órgãos competentes.'
