cite: E94.701(i)
title: E94.701(i)
text: '(i) o seguro com cobertura de danos a terceiros, exceto das aeronaves pertencentes
  a entidades controladas pelo Estado;

  (ii) licença e habilitação emitida pela ANAC;

  (iii) o CMA de 1ª, 2ª ou 5ª Classe emitido segundo o RBAC nº 67, ou o CMA de 3ª Classe válido
  emitido pelo Comando da Aeronáutica segundo a ICA 63-15;

  (iv) certificado de marca experimental, certificado de matrícula ou comprovação de cadastro
  emitido junto à ANAC, conforme aplicável e sua identificação na aeronave;

  (Redação dada pela Resolução nº 649, de 30.11.2021)'
