section_title: Requisitos para piloto remoto e observador
subsection_id: b
cite: E94.9(b)
title: E94.9(b)
text: (b) Todos os pilotos remotos de RPA Classe 1 ou 2 devem possuir um Certificado Médico
  Aeronáutico (CMA) de 1ª, 2ª ou 5ª Classe válido, conforme o parágrafo 67.13(g) do RBAC nº
  67, ou um CMA de 3ª Classe válido emitido pelo Comando da Aeronáutica segundo a ICA 63-15.
