title: PREÂMBULO
text: 'PREÂMBULO

  Este Regulamento Brasileiro da Aviação Civil Especial - RBAC-E aborda os requisitos gerais
  de competência da ANAC para aeronaves não tripuladas. Por natureza, um RBAC-E possui a finalidade
  de regular matéria exclusivamente técnica que possa afetar a segurança da aviação civil,
  com vigência limitada no tempo e restrita a um número razoável de requisitos e pessoas,
  até que os requisitos contidos nos mesmos sejam incorporados em RBAC apropriado ou definitivamente
  revogados. Este Regulamento Especial estabelece as condições para a operação de aeronaves
  não tripuladas no Brasil considerando o atual estágio do desenvolvimento desta tecnologia.
  Objetiva-se promover um desenvolvimento sustentável e seguro para o setor e, assim, algumas
  restrições operacionais - notadamente sobre as áreas não distantes de terceiros - foram
  julgadas como necessárias neste momento. É esperado que a experiência obtida na prática
  nos próximos anos resulte em um maior conhecimento e superação dos desafios para uma ampla
  integração desta classe de aeronaves no sistema de aviação civil. Adicionalmente, devem
  ser observadas as regulamentações de outros entes da administração pública direta e indireta,
  tais como a Agência Nacional de Telecomunicações - ANATEL, o Departamento de Controle do
  Espaço Aéreo - DECEA e o Ministério da Defesa, assim como as legislações referentes às responsabilizações
  nas esferas civil, administrativa e penal que podem incidir sobre o uso de aeronave não
  tripulada, com destaque àquelas disposições referentes à inviolabilidade da intimidade,
  da vida privada, da honra e da imagem das pessoas.

  Subparte A

  Geral'
