text: '5.2.2

  Extintores de dióxido de carbono - CO2: esse gás atua no combate ao fogo suprimindo o

  oxigênio, sendo considerado um gás asfixiante. Os extintores portáteis de CO2, se usados
  em

  ambientes confinados como a cabine, colocam em risco a vida dos ocupantes da aeronave. Um

  outro efeito indesejável é o efeito congelante do gás, que pode comprometer os componentes

  eletrônicos da aeronave.'
