text: '5.2.3

  Extintores de pó químico: o extintor de pó químico não é indicado para uso na cabine de

  aeronaves. Esse tipo de agente extintor, quando descarregado no cockpit ou em ambientes

  confinados, pode causar séria obstrução de visibilidade e dificuldades temporárias de

  respiração, durante e imediatamente após a descarga, comprometendo a segurança de voo.

  Além disso, o pó exerce ação corrosiva sobre componentes eletrônicos e deixam resíduos de

  difícil remoção. Há 2 (dois) tipos de extintor de pó químico, seco (classes A, B e C) e
  especial

  (classe D),'
