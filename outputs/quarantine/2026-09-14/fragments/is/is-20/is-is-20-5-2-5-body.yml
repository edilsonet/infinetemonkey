text: '5.2.5

  Extintores de carga de espuma: tanto quanto extintores com água pressurizada e pó quí-

  mico, também não é indicado para ser utilizado dentro de cabine de aeronaves.

  5.3

  Seleção do extintor adequado em aeronave

  A tabela a seguir informa a classe de fogo em que cada agente extintor age eficazmente:


  AGENTE EXTINTOR

  CLASSE DE FOGO

  INDICADA

  CAPACIDADE

  EXTINTORA (MÍNIMA)

  Agentes Halogenados

  A, B e C

  (ver Nota)

  Dióxido de carbono - CO2

  B e C

  -

  Pó químico seco

  A, B e C

  -

  Pó químico especial

  D

  -

  Água pressurizada

  A

  -


  Data de emissão: 8 de outubro de 2021

  IS Nº 20-003

  Revisão B


  Carga de Espuma

  A, B

  -


  Nota 01 - Capacidade extintora mínima 2B:C para volume de cabines até 200ft³ , e ca-

  pacidade extintora mínima 5B:C para volumes de cabine acima de 200ft³.


  Nota 02 - Para ver a recomendação de usos de extintor de incêndio veja subseção 5.7

  desta IS³.

  5.4

  Instalação do Extintor


  O extintor deve ser instalado de forma que seja preso a um suporte convenientemente fixado

  à estrutura da aeronave. O extintor deve ser instalado de forma que seja facilmente acessado

  e liberado do suporte pelo piloto da aeronave. Em hipótese alguma o extintor deve ser dei-

  xado solto sobre os bancos, porta-objetos, etc. em uma aeronave em voo. A instalação de

  extintor, para efeitos desta IS, é considerada pequena alteração.

  5.5

  Padronização de extintores de incêndio

  Os extintores nacionais devem ser equipados com o selo do INMETRO. Os importados de-

  vem possuir selo A.N.S.I./U.L. Standard.

  5.6

  Utilização do extintor'
