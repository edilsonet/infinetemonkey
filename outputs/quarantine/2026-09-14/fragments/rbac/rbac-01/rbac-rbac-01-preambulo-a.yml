text: '(a) O brasileiro nato ou naturalizado detentor de uma licença e/ou habilitação técnica
  emitida por país

  contratante da OACI pode solicitar a validação destes documentos pelo DAC, desde que os
  requisitos

  exigidos para concessão no país emitente sejam iguais ou superiores aos estabelecidos por
  este regula-

  mento.'
