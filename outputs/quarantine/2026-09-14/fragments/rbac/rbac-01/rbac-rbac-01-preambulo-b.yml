title: preambulo(b)
text: '(b) A comprovação da equivalência dos requisitos deve ser expedida, sob a forma de
  declaração, pela

  autoridade aeronáutica concedente da licença e/ou habilitação, através de requerimento do
  interessa-

  do, e encaminhada ao DAC pelo próprio órgão expedidor através dos serviços oficiais de correspon-

  dência, contendo expressamente as seguintes informações:

  (1) número, data de expedição e prazo de validade da licença;

  (2) habilitações técnicas correspondentes e respectivas validades;

  (3) experiência requerida para a concessão;

  (4) instrução de vôo e/ou curso realizado;

  (5) outras informações, quando pertinente.'
