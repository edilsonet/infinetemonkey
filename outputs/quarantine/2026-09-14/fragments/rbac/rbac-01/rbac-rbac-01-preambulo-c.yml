text: '(c) O solicitante deve requerer a validação através de formulário- requerimento padronizado,
  instruí-

  do com os documentos a serem validados e o documento com que requereu a declaração de equivalên-

  cia de requisitos, sendo-lhe devolvidos os originais, por ocasião da apresentação, se acompanhados
  de

  fotocópias.'
