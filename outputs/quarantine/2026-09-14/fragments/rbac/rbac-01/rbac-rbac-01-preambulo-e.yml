title: preambulo(e)
text: '(e) Para fins de atendimento aos requisitos de conhecimentos e experiência exigidos
  para a emissão de

  licenças e habilitações segundo este regulamento podem ser validados cursos e horas de vôo
  realizados

  no exterior, em um país contratante da OACI, desde que tais cursos e horas de vôo sejam
  comprova-

  dos de acordo com os preceitos estabelecidos nesta seção.

  (Port. 129/DGAC, 13/02/06; DOU 33, 15/02/06)'
