text: '(g) Renovação. O detentor da licença pode ter sua licença renovada se atender aos requisitos
  do parágrafo (b)

  desta seção quando for requerer renovação.


  SUBPARTE B - MECÂNICOS DE VÔO

  63.31 - APLICABILIDADE E REQUISITOS GERAIS PARA ELEGIBILIDADE

  [(a) Esta subparte estabelece os requisitos a serem atendidos para a concessão da licença
  de mecânico

  de vôo e as prerrogativas e condições para o exercício das funções pertinentes.]

  [(b)] Para fazer jus a uma licença de mecânico de vôo uma pessoa deve:


  (1) possuir 21 anos de idade;


  (2) possuir o certificado de conclusão do ensino médio (antigo segundo grau);


  (3) ser capaz de ler, falar e entender a língua portuguesa;


  (4) possuir o CCF de primeira classe específico de mecânico de vôo, emitido segundo o RBHA
  67;


  (5) [ter concluído, com aproveitamento, um curso homologado pelo DAC;]


  [(6) ser aprovada no exame de conhecimentos de que trata a seção 63.35 deste regulamento,
  rece-

  bendo a respectiva certificação;


  (7) após ter cumprido um programa de treinamento aprovado pelo DAC e completado as horas
  de

  experiência requeridas pela seção 63.37 deste regulamento, ser aprovada em exame de proficiência;
  e]


  (8) atender aos requisitos desta subparte aplicáveis ao certificado de habilitação técnica
  por ele desejado.

  (Port. 301/DGAC, 01/04/04; DOU 102, 28/05/04) (Port. 129/DGAC, 13/02/06; DOU 33, 15/02/06)

  63.33 - HABILITAÇÕES TÉCNICAS'
