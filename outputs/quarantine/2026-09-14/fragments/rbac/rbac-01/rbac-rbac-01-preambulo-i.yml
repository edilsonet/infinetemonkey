cite: preambulo(i)
title: preambulo(i)
text: '(i) ser aprovado em exame teórico do equipamento a ser convalidado;


  (ii) apresentar certificado de capacidade física brasileiro específico para comissário,
  válido; e


  (iii) Ser aprovado em um exame de competência por um INSPAC, no tipo de aeronave para o

  qual a validação da licença e/ou certificado de habilitação técnica está sendo solicitada,
  conforme a

  seção 63.71 deste regulamento.'
