title: 31.5(e)
text: '(e) Cada balão de ar quente deve ter um meio que

  indique as temperaturas máximas do revest

  i mento do

  envelope que ocorem durante a operação. O indicador

  deve ser facilmente v

  i sível ao piloto e ter marcas para

  indicar os limites se

  guros de temperatura do material

  do envelope. Se as marcas estão sobre o vidro que

  cobre o indicador, deve haver provisões para manter

  um coreto alinhamento do vidro com o indicador

  .'
