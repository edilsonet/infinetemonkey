text: '(e)

  Aeronave em operação autorizada a

  realizar operação de instrução,

  registrada nas categorias PRI ou PIN,

  deve possuir pintada, horizontal ou

  verticalmente, próximo à porta

  principal de entrada de passageiros,

  externamente, sobre a fuselagem, a

  palavra “INSTRUÇÃO” em letras de

  forma maiúsculas, com altura entre 5

  e 15 cm, de maneira que a abertura da

  porta não impeça sua leitura.

  Permitir a operação de aeronave não

  autorizada para operação de

  instrução conforme RBAC 141

  possui pintada sobre a fuselagem, a

  palavra “INSTRUÇÃO”.

  Piloto de aeroclube, clube ou escola

  de aviação civil

  Sancionatória

  NA

  45016

  Identificaç

  ão de

  aeronaves

  - TPX,

  SAE, PRI,

  PIN

  45.12-I(e)

  Aeronave que não esteja registrada

  nas categorias TPX, SAE e PRI ou

  PIN não possua qualquer pintura que

  se assemelhe ou se confunda com

  aquelas previstas nos parágrafos'
