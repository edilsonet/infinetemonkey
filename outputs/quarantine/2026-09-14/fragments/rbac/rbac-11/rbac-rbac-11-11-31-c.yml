title: 11.31(c)
text: '(c) A solicitação deve conter as seguintes informações:


  (1) identificação do solicitante;


  (2) identificação completa dos requisitos em relação aos quais a isenção é solicitada;


  (3) a natureza e a extensão da isenção pretendida e a identificação completa de cada aeronave

  ou pessoa a ser favorecida pela isenção; e


  (4) as razões que comprovem que a isenção, conforme aplicável:'
