title: 11.41(a)
text: '(a) Esta Subparte apresenta os procedimentos a serem adotados por interessados em propor
  à

  ANAC o reconhecimento de nível equivalente de segurança quanto ao cumprimento de requisito

  estabelecido pela ANAC em resolução, RBAC ou condição especial.


  (1) O reconhecimento de níveis equivalentes de segurança pode ocorrer em processos de

  certificação, análise de pedidos de autorização ou quaisquer outros procedimentos, quando
  previsto

  em resolução ou RBAC, não se aplicando às fases de fiscalização ou aplicação de providências

  administrativas.


  (2) As solicitações de reconhecimento de nível equivalente de segurança sujeitam-se

  igualmente às regras estabelecidas na resolução ou no RBAC de que trata o parágrafo 11.41(a)(1).'
