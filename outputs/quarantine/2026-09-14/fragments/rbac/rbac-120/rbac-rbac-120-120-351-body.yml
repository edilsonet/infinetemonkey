text: '120.351 (a) (5)

  O método de cumprimento do Programa de Resposta a

  Evento Impeditivo da empresa responsável deve estar

  descrito no seu PPSP

  - Empresas transporte aéreo (RBAC

  121 e 135);

  - Empresas serviços aéreos

  especializados públicos (SAE);

  - Oficinas certificadas (RBAC 145)

  localizadas no território nacional

  que aprovem para o retorno ao

  serviço aeronaves envolvidas em

  operações regidas pelo RBAC 121

  ou RBAC 135;

  Preventiva

  2

  anos


  _______________________________________________________________________________

  Publicado no Boletim de Pessoal e Serviço - BPS v.16, nº 10, de 12 de março de 2021.

  - Aeroportos classe III ou IV

  segundo o RBAC 153;

  120096Requisitos do ESP'
