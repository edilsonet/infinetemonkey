text: '120.7 (p)

  O RD é empregado da empresa, possuidor de autoridade e

  responsabilidade para responder pelo Programa, pelo

  cumprimento dos requisitos deste regulamento e pela

  prestação de contas, sem prejuízo da responsabilidade

  final da empresa responsável.

  - Empresas transporte aéreo (RBAC

  121 e 135);

  - Empresas serviços aéreos

  especializados públicos (SAE);

  - Oficinas certificadas (RBAC 145)

  localizadas no território nacional

  que aprovem para o retorno ao

  serviço aeronaves envolvidas em

  operações regidas pelo RBAC 121

  ou RBAC 135;

  - Aeroportos classe III ou IV

  segundo o RBAC 153;

  Preventiva

  2

  anos

  120014Treinamento realizado 120.321(a)(1)

  A empresa responsável deve ter desenvolvido, elaborado e

  executado, internamente ou por contrato, um subprograma

  de educação fornecendo a todos os empregados ARSO,

  informações sobre o uso indevido de substâncias

  psicoativas.

  - Empresas transporte aéreo (RBAC

  121 e 135);

  - Empresas serviços aéreos

  especializados públicos (SAE);

  - Oficinas certificadas (RBAC 145)

  localizadas no território nacional

  que aprovem para o retorno ao

  serviço aeronaves envolvidas em

  operações regidas pelo RBAC 121

  ou RBAC 135;

  - Aeroportos classe III ou IV

  segundo o RBAC 153;

  Sancionatória N/A

