title: 141.77(d)
text: '(d)

  Os registros de

  instrução devem ser

  mantidos em local

  seguro e acessíveis

  somente por pessoal

  autorizado pelo CIAC.

  O CIAC não mantém os

  registros de instrução

  em local seguro e

  acessível somente por

  pessoal autorizado.

  Instituições

  regidas pelo

  RBAC 141

  Preventiva

  24 meses

  141155 Registros

  RBAC 141.79 (e)

  O CIAC deve fornecer

  ao aluno, sempre que

  por este solicitado, uma

  cópia dos registros

  especificados no

  parágrafo (a) desta

  seção.

  Quando solicitado, o

  CIAC não forneceu ao

  aluno uma cópia dos

  registros especificados

  na seção 141.79(a).

  Instituições

  regidas pelo

  RBAC 141

  Preventiva

  24 meses

  141156 Registros

  RBAC 141.79 (f)

  O CIAC deverá realizar

  o controle da validade

  das habilitações,

  certificados e

  treinamentos dos alunos

  e instrutores do seu

  corpo técnico,

  impedindo operações

  irregulares.

  O CIAC não realizou o

  controle da validade das

  habilitações, certificados

  e treinamentos dos

  alunos e instrutores do

  seu corpo técnico.

  Instituições

  regidas pelo

  RBAC 141

  Sancionatória

  N/A

  141157 Registros

  RBAC 141.79'
