text: '(k) Mudanças no sistema de qualidade. O detentor de uma aprovação de produção de embalagens

  deve comunicar a ANAC, por escrito, sobre qualquer modificação que possa afetar a inspeção,
  a

  conformidade ou o produto. Essa modificação pode estar sujeita à aprovação da ANAC.


  Data da emissão: 12 de fevereiro de 2021.


