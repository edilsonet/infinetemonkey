text: '(b) Os procedimentos de operadores postais designados (DPO) para controlar a introdução
  de

  artigos perigosos em mala postal no transporte aéreo estão sujeitos à análise e aprovação
  da autoridade

  de aviação civil do país onde a mala postal é aceita.


  175.

  1 5 Artigos perigosos em quantidades excetuadas'
