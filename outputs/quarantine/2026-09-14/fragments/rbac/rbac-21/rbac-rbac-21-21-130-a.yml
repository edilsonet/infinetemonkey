title: 21.130(a)
text: '(a) Cada requerente ou detentor de um certificado

  de organização de produção deve fornecer à

  ANAC um documento descrevendo:


  (1) como sua organização garantirá a

  conformidade com os requisitos desta subparte.


  (2) No mínimo, o documento deve descrever as

  responsabilidades atribuídas e a autoridade

  delegada, e a relação funcional entre os

  responsáveis pelo gerenciamento da

  qualidade e

  outros componentes organizacionais, e


  (3) Identificar o gestor responsável.


  Detentores de um

  Certificado de

  Organização de

  Produção (COP)

  segundo a subparte G

  do RBAC 21.


  Não fornecer à ANAC um documento

  descrevendo como sua organização garant

  irá

  a conformidade com os requisitos da subparte

  G'
