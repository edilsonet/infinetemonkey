title: 21.245(a)
text: '(a) todos os departamentos técnicos dispõem

  de pesoal em número,

  experiência e

  qualificação suficientes, que tenha recebido

  autoridade devida para exercer as

  responsabilidades alocadas e que,

  juntamente com a infraestrutura, instalações

  e equipamentos, são adequados a fim de

  permitir a este pesoal que alcance os

  objeti

  vos relacionados com objetivos de

  aeronavegabilidade, de drenagem de

  combustível, de emisões de escapamento de

  aviões e de ruído para o produto;'
