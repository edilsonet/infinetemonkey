cite: 21.245(b)
title: 21.245(b)
text: '(b) existe uma cordenação plena e eficiente,

  tanto a nível interdepartamental como nos

  departamentos, em rela

  ção a asuntos

  ligados a aeronavegabilidade, drenagem de

  combustível, emisões de escapamento de

  aviões e ruído.


  Não ter uma cordenação plena e

  eficiente,

  tanto a nível

  interdepartamental como nos

  departamentos, em relação à

  aeronavegabilidade e proteção

  ambiental.


  Qualquer outra não conformidade.


  21049

  .4

  Mudanças no

  sistema de

  garantia do

  projeto


  Após a emisão de um certificado de

  organização de projeto, quaisquer mudanças

  efetuadas no sistema de garantia do projeto,

  que sejam significativas para o cumprimento

  com os requisitos ou para a

  aeronavegabilidade, para a drenagem de

  combustível, emisões de escapamento de

  aviões e ruído, inerentes ao produto, devem

  ser aprovadas pela ANAC. Um requerimento

  para aprovar a mudança deve ser

  apresentado por escrito à ANAC e

  a

  organização de projeto deve demonstrar que,

  com base nas mudanças propostas ao manual

  e antes da sua implementação, continuará a

  satisfazer os requisitos desta subparte, após a

  implementação desas mudanças.


  Detentores de um

  Certificado de

  Organização d

  e

  Pr

  ojeto (COPJ)

  aplicável

  .

  Realizar mudanças

  no sistema de

  garantia do projeto

  significativas para a

  demonstração de cumprimento com os

  requisitos ou para a aeronavegabilidade

  ou proteção ambiental do produto

  sem a

  aprovação devida da ANAC.'
