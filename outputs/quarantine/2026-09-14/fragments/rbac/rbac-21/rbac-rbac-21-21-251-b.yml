title: 21.251(b)
text: '(b) Quando o projeto de quaisquer artigos,

  ou modificações aos pr

  odutos são da

  responsabilidade de fornecedores, o manual

  deve incluir uma declaração que explique o

  modo como a organização certificada

  asegura para todos os artigos a elaboração

  das declarações de cumprimento com os

  requisitos exigidos pela seção 21.239

  - I,

  parágrafo (b), bem como, descrições e

  informações sobre as atividades do projeto e

  sobre a organização dos fornecedores,

  quando necesário, com vista à elaboração

  da referida declaração.'
