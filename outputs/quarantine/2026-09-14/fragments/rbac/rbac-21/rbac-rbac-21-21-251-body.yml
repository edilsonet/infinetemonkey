text: '21.251

  .

  O sistema de garantia do projeto não


  monitorar independentemente a

  conformidade com os procedimentos

  documentados do sistema e sua

  adequação.


  O sistema de garantia do projeto

  não

  incluir uma função de verificação

  independente das demonstrações de

  cumprimento com os requisitos, que

  servirá de base para a organização

  apresentar à ANAC declarações de

  cumprimento com os requisitos e a

  documentação asociada.


  A organização de projeto

  não

  especificar

  o modo como o sistema de garantia do

  projeto asegura a aceitação

  dos artigos


  projetados, ou das tarefas realizadas

  pelos

  fornecedores

  , em conformidade

  com os métodos descritos nos

  procedimentos documentados.


  Data de emisão:

  4 de dezembro

  de

  2020


  CEF RBAC n

  º 21


  Página

  37

  de

  64'
