title: 21.251(d)
text: '(d) A organização de projeto deve fornecer

  uma declaração sobre as qualificações e a

  experiência do quadro gerencial, bem como

  do pesoal responsável na org

  anização pela

  tomada de decisões em matéria de

  aeronavegabilidade, de drenagem de

  combustível, de emisões de escapamento de

  aviões e de ruído.


  Detentores de um

  Certificado de

  Organização de

  Pr

  ojeto (COPJ)

  aplicável

  .

  Não atualizar o manual, quando

  necesário, de modo a manter atualizada

  a descrição da organização.'
