title: 21.253(b)
text: '(b) A organização de projeto deve estabelecer

  procedimentos que viabilizem à ANAC analisar

  quaisquer relatórios e realizar quaisquer inspeções,


  asim como, realizar ou testemunhar quaisquer

  ensaios em vo e no solo considerados

  necesários, a fim de verificar a validade das

  declarações de cumprimento com os requisitos

  apresentadas pelo requerente, conforme a seção'
