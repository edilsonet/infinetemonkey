text: '21.257

  - I

  Sancionatória /

  Acautelatória


  A organização de projeto não estabelecer

  meios que

  viabilizem tal permisão

  .

  A organização de projeto

  não

  autorizar

  previamente

  ou não

  permitir a Agência a

  analisar quaisquer relatórios e a realizar

  quaisquer inspeções, asim como realizar

  ou testemunhar quaisquer ensaios em

  vo e no solo considerados necesários a

  fim de verificar a validade das

  declarações de cumprimento com os

  requisi

  tos apresentadas pelo requerente

  conforme a seção 21.239, parágrafo (b).


  Qualquer outra não conformidade.


  21049

  .7

  Constatações


  Detentores de um

  Certificado de

  Organização de

  Pr

  ojeto (COPJ)

  aplicável

  .

  O detentor de uma certificação de

  organização de projeto não

  realizar a

  clasificação, ou a coreção da não

  conformidade nos projetos

  aprovados ou

  a tomada de ações coretivas sistêmicas,

  para evitar a recorência da não

  conformidade.'
