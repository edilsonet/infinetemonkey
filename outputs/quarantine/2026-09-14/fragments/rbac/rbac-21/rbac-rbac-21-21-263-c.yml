text: '(c) asegurar que o projeto dos produtos ou as

  modificações ao mesmo ou o projeto de reparos,

  conforme aplicável, satisfazem os requisitos

  aplicáveis e não evidenciam quaisquer

  características que posam comprometer a

  condição de operação segura;'
