text: '21.317


  Preventiva


  Qualquer outra não conformidade


  210

  80


  Modificações de

  projeto


  As pequenas modificações no projeto básico de

  um certificado de produto aeronáutico aprovado

  podem ser aprovadas utilizando um método

  aceitável pela ANAC.


  Detentores de um

  Certificado de

  Organização de

  Produção (COP)

  segundo a subparte K

  do RBAC 21.


  Não aprovar pequenas modificações no

  projeto básico de um certificado de produto

  aeronáutico aprovado'
