text: '(i) modificações por tempo limitado do

  motor e/ou da nacele, quando a modificação

  no projeto de tipo especificar que o avião

  não pode ser operado por um p

  eríodo

  superior a 90 (noventa) dias a menos que

  seja demonstrado o cumprimento com os

  requisitos de modificações acústicas

  Detentores de um

  Certificado de

  Organização de

  Projeto (COPJ)

  aplicável e/ou

  detentor de uma

  aprovação de projeto

  .

  Clasificar indevidamente a modificação

  ao projeto de tipo.'
