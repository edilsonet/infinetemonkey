text: '(b) suporte adequado à aeronavegabilidade

  continuada de um produto

  e artigo

  .

  Detentores de um

  Certificado de

  Organização de

  Projeto (COPJ)

  aplicável e/ou

  detentor de uma

  aprovação de projeto

  .

  Não colaborar com organizações de

  produção, conforme necesário, a fim de

  garantir os requisitos estabelecidos no

  regulamento.'
