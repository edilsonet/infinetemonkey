text: '21.605


  Preventiva


  O gestos responsável

  identificado tem

  autoridade sobre todas as atividades de

  produção realizadas sob o RBAC 21.


  O gestos responsável identificado deixou de

  confirmar

  que os procedimentos descritos no

  manual de qualidade exigido pela seção

  21.

  60

  8 estão em vigor e que

  o detentor do

  certificado de organização de produção

  satisfaz os requisitos das regulamentações

  aplicáveis ligadas a projeto,

  aeronavegabilidade continuada e identificação

  e registro de aeronaves


  O gestos responsável identificado não serve

  como

  contato primário com a ANAC


  210

  85


  Sistema da

  qualidade


  Cada detentor de um certificado de organização de

  produção deve estabelecer e descrever, por escrito,

  um sistema da qualidade que garanta que cada

  produto e artigo esteja em conformidade com o

  seu

  projeto aprovado e em condição de operação

  segura.


  Solicitantes ou

  detentores de um

  Certificado de

  Organização de

  Produção (COP)

  segundo a subparte O

  do RBAC 21.


  Não estabelecer um sistema da qualidade que

  garanta que cada produto e artigo esteja em

  confor

  midade com o seu projeto aprovado e

  em condição de operação segura'
