cite: 21.617(a)
title: 21.617(a)
text: '(a) O fabricante que requerer a aprovação de um

  desvio a qualquer padrão de desempenho de uma

  OTP deve demonstrar que o requisito para o qual


  está solicitando desvio será compensado por

  fatores ou características de projeto que

  proporcionam um nível de segurança equivalente.'
