title: 21.617(b)
text: '(b) O requerimento para esta aprovação de desvios

  deve ser submetido à ANAC junto com todos


  os dados pertinentes. Se o ar

  tigo é fabricado em

  outro país, o requerimento para aprovação do

  desvio, juntamente com todos os dados pertinentes

  devem ser submetidos à ANAC, através da

  autoridade de aviação civil daquele país


  Detentores de um

  Certificado de

  Organização de

  Produção (COP

  )

  segundo a subparte O

  do RBAC 21.


  Não demonstrar que o requisito para o qual

  está solicitando desvio será compensado por

  fatores ou características de projeto que

  proporcionam um nível de segurança

  equivalente'
