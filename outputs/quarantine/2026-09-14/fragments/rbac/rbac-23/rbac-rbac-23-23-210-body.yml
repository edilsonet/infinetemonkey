title: Cargas estruturais de projeto.
text: '23.210 Cargas estruturais de projeto.


  ( a) O requerente deve:


  (1) Determinar as cargas

  estruturais

  de projeto


  aplicáveis resultantes d

  a aplicação de

  presões,

  forças ou momentos prováveis, externos ou

  internos, que

  podem

  ocorer em operações de

  vo, solo e água,

  controle

  em solo e em água

  , e

  en

  quanto o avião está estacionado ou atracado.


  (2) Determinar as cargas requeridas pelo pará-

  grafo (a)(1) desta seção em todas combinações

  críticas de parâmetros, sobre e dentro dos limi-

  tes do envelope de projeto

  estrutural

  .'
