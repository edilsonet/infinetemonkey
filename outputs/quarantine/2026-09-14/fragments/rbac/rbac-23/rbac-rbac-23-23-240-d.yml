title: 23.240(d)
text: '(d) O requerente deve fornecer um meio para

  evitar que quantidades perigosas de flu

  i dos

  inflamáveis

  fluam

  para

  dentro

  ou por dentro

  ou

  através de cada

  zona definida como de fogo

  .

  Este meio deve:


  (1) Não restringir o fluxo

  ou limitar o funcio-

  namento de

  qua

  lquer

  sistema de propulsão ou

  unidades de potência auxiliar remanescentes,

  ou equipa

  mento necesário para segurança;


  (2) Impedir operação inadvertida; e


  (3) Estar localizado fora da zona de fogo, a

  menos que um grau de segu

  rança igual seja

  fornecido dentro da zona de fogo.'
