text: '(a)

  O s equipamento

  s ou sistemas requeridos

  para um avião operar de forma segura, nos mo-

  dos de

  operação para os quais certificação é

  requerida (VFR diurno, VFR noturno, IFR)

  devem ser projetados e instalados para:


  (1)

  Satisfazer

  o nível de segurança aplicável

  para

  o nível de

  certificação e de desempenho

  do avião; e


  (2)

  Desempenhar sua função preten

  dida dentro

  dos limites operacionais e ambientais para os

  quais o avião é certificado.'
