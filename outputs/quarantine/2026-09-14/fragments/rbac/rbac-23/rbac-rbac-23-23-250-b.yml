title: 23.250(b)
text: '(b)

  Os sistemas e equipamentos não cobertos

  pelo parágrafo (a), considerados separadamente

  e em relação a outros sistemas, devem ser pro-

  jetados e instalados de forma que

  sua operação

  não tenha efeitos adversos sobre o avião ou

  seus ocupantes.


  Data da emisão:

  7 de agosto de 2019


