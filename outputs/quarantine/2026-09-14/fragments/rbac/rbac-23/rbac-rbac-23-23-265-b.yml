title: 23.265(b)
text: '(b) O requerente deve determinar um fator es-

  pecial de segurança usando controles de quali-

  dade e especificações que leve em conta cada:


  (1) Tipo d

  e aplicação;


  (2) Método de inspeção;


  (3) Requisitos de teste estrutural;


  (4) Porcentagem de amostra; e


  (5) Controle de proceso e material.'
