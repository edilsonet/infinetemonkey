text: '(c) O requerente deve multiplicar o maior fator

  especial de segurança pertinente no projeto em

  cada parte da estrutu

  ra por cada carga limite e

  final, ou somente carga final se não houver

  carga limite corespondente, como ocore com

  as cargas de condições de emergência.


