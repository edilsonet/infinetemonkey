title: 23.270(a)
text: '(a) O avião, mesmo quando danificado em um

  pouso de emergência, deve proteger cada ocu-

  pante contra lesões que impediriam a evacua-

  ção quando:


  (1) Usar coretamente o equipamento de segu-

  rança e os recur

  sos previstos no projeto;


  (2) O ocupante experimentar as cargas estáticas

  finais de in

  é rcia prováveis de ocorerem em um

  pouso de emergência; e


  (3) Itens de masa, incluindo motores ou uni-

  dades de potência auxiliar (APUs), dentro ou

  atrás da cabine, que po

  sam ferir um ocupante,

  quando experimentando as cargas finais de

  in é rcia prováveis de ocorerem em um pouso

  de emergência.


  Data da emisão:

  7 de agosto de 2019


