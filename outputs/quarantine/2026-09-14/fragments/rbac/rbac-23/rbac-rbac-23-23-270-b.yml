text: '(b) As condições de pouso de emergência espe-

  cificadas no parágrafo (a)(1) e (a)(2) desta se-

  ção, devem:


  (1) Incluir condições dinâmic

  as que são prová-

  veis de ocorer em um pouso de emergência; e


  (2) Não gerar cargas experimentadas pelos

  ocupantes, que excedam aos critérios de feri-

  mentos que um ser humano suport

  a , devido

  à s

  contenções ou contato com objetos no avião.'
