title: 27.471(a)
text: '(a)

  Parts of the manual containing operating procedures must have information concerning any
  normal and

  emergency procedures and other information necessary for safe operation, including takeoff
  and landing

  procedures and associated airspeeds. The manual must contain any pertinent information including
  -

  (1)

  The kind of takeoff surface used in the tests and each appropriate climbout speed; and

  (2)

  The kind of landing surface used in the tests and appropriate approach and glide airspeeds.'
