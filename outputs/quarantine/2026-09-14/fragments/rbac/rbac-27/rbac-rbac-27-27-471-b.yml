title: 27.471(b)
text: '(b)

  For multiengine rotorcraft, information identifying each operating condition in which the
  fuel system

  independence prescribed in § 27.953 is necessary for safety must be furnished, together
  with instructions

  for placing the fuel system in a configuration used to show compliance with that section.'
