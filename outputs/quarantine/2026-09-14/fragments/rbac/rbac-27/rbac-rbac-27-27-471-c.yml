title: 27.471(c)
text: '(c)

  For helicopters for which a VNE (power-off) is established under § 27.1505(c), information
  must be

  furnished to explain the VNE (power-off) and the procedures for reducing airspeed to not
  more than the

  VNE (power-off) following failure of all engines.'
