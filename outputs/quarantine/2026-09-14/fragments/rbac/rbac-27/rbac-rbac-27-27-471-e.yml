cite: 27.471(e)
title: 27.471(e)
text: '(e)

  If the unusable fuel supply in any tank exceeds five percent of the tank capacity, or one
  gallon, whichever

  is greater, information must be furnished which indicates that when the fuel quantity indicator
  reads

  “zero” in level flight, any fuel remaining in the fuel tank cannot be used safely in flight.'
