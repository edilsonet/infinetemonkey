title: 27.471(i)
text: '(i)

  The word “fuel”;

  (ii)

  For reciprocating engine powered rotorcraft, the minimum fuel grade;

  (iii)

  For turbine engine powered rotorcraft, the permissible fuel designations; and

  (iv)

  For pressure fueling systems, the maximum permissible fueling supply pressure and the

  maximum permissible defueling pressure.

  (2)

  Oil filler openings must be marked at or near the filler cover with the word “oil”.'
