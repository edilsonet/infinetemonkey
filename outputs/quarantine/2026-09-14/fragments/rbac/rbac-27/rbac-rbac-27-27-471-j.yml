text: '(j)

  Rated 30-second OEI power operation. Rated 30-second OEI power is permitted only on multiengine,

  turbine-powered rotorcraft, also certificated for the use of rated 2-minute OEI power, and
  can only be used

  for continued operation of the remaining engine(s) after a failure or precautionary shutdown
  of an engine.

  It must be shown that following application of 30-second OEI power, any damage will be readily

  detectable by the applicable inspections and other related procedures furnished in accordance
  with

  Section A27.4 of appendix A of this part and Section A33.4 of appendix A of part 33. The
  use of

  30-second OEI power must be limited to not more than 30 seconds for any period in which
  that power is

  used, and by -

