  § 27.1525 Kinds of operations.

  The kinds of operations (such as VFR, IFR, day, night, or icing) for which the rotorcraft
  is approved are established by

  demonstrated compliance with the applicable certification requirements and by the installed
  equipment.

  § 27.1527 Maximum operating altitude.

  The maximum altitude up to which operation is allowed, as limited by flight, structural,
  powerplant, functional, or

  equipment characteristics, must be established.

