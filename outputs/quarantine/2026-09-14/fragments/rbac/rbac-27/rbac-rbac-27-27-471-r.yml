text: '(r)

  For each turbine engine, a warning means for the oil strainer or filter required by § 27.1019,
  if it has no

  bypass, to warn the pilot of the occurrence of contamination of the strainer or filter before
  it reaches the

  capacity established in accordance with § 27.1019(a)(2).

  14 CFR Part 27 (up to date as of 5/03/2022)

  Airworthiness Standards: Normal Category Rotorcraft

  14 CFR 27.1305(b)(2)

  14 CFR 27.1305(r) (enhanced display)

  page 87 of 126


  § 27.1307 Miscellaneous equipment.

  The following is the required miscellaneous equipment:

  § 27.1309 Equipment, systems, and installations.

  § 27.1316 Electrical and electronic system lightning protection.'
