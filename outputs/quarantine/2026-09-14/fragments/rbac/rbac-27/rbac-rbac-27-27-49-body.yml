text: '27.49 through 27.87 and 27.143(c) and (d):

  14 CFR Part 27 (up to date as of 5/03/2022)

  Airworthiness Standards: Normal Category Rotorcraft

  14 CFR 27.1583(c)

  14 CFR 27.1587(a) (enhanced display)

  page 114 of 126


  (Secs. 313(a), 601, 603, 604, and 605 of the Federal Aviation Act of 1958 (49 U.S.C. 1354(a),
  1421, 1423, 1424, and

  1425); and sec. 6(c) of the Dept. of Transportation Act (49 U.S.C. 1655(c)))

  § 27.1589 Loading information.

  There must be loading instructions for each possible loading condition between the maximum
  and minimum

  weights determined under § 27.25 that can result in a center of gravity beyond any extreme
  prescribed in § 27.27,

  assuming any probable occupant weights.

  Appendix A to Part 27 - Instructions for Continued Airworthiness'
