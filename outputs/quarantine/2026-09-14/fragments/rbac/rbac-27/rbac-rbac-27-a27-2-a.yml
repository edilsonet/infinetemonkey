title: A27.2(a)
text: '(a)

  Rotorcraft maintenance manual or section.

  (1)

  Introduction information that includes an explanation of the rotorcraft''s features and
  data to the

  extent necessary for maintenance or preventive maintenance.

  (2)

  A description of the rotorcraft and its systems and installations including its engines,
  rotors, and

  appliances.

  (3)

  Basic control and operation information describing how the rotorcraft components and systems

  are controlled and how they operate, including any special procedures and limitations that
  apply.

  (4)

  Servicing information that covers details regarding servicing points, capacities of tanks,
  reservoirs,

  types of fluids to be used, pressures applicable to the various systems, location of access
  panels for

  inspection and servicing, locations of lubrication points, the lubricants to be used, equipment

  required for servicing, tow instructions and limitations, mooring, jacking, and leveling
  information.'
