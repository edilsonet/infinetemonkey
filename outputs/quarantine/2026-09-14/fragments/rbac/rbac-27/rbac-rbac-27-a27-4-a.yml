title: A27.4(a)
text: '(a)

  Flight and Navigation Instruments.

  (1)

  A magnetic gyro-stablized direction indicator instead of a gyroscopic direction indicator

  required by § 29.1303(h); and

  (2)

  A standby attitude indicator which meets the requirements of §§ 29.1303(g)(1) through (7)

  instead of a rate-of-turn indicator required by § 29.1303(g). For two-pilot configurations,
  one

  pilot''s primary indicator may be designated for this purpose. If standby batteries are
  provided,

  they may be charged from the aircraft electrical system if adequate isolation is incorporated.'
