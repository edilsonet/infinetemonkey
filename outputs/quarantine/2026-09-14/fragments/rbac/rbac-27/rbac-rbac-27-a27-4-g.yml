text: '(g)

  A list of special tools needed.

  I.

  General. A normal category helicopter may not be type certificated for operation under the
  instrument

  flight rules (IFR) of this chapter unless it meets the design and installation requirements
  contained in this

  appendix.

  II.

  Definitions.'
