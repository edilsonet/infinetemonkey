cite: A27.4(i)
title: A27.4(i)
text: '(i)

  Only the required flight instruments for the first pilot may be connected to that operating

  system;

  (ii)

  Additional instruments, systems, or equipment may not be connected to an operating

  system for a second pilot unless provisions are made to ensure the continued normal

  functioning of the required instruments in the event of any malfunction of the additional

  instruments, systems, or equipment which is not shown to be extremely improbable;

  14 CFR Part 27 (up to date as of 5/03/2022)

  Airworthiness Standards: Normal Category Rotorcraft

  14 CFR Appendix-B-to-Part-27 VII.(a)(2)(ii)

  14 CFR Appendix-B-to-Part-27 VIII.(b)(5)(ii) (enhanced display)

  page 120 of 126


  Appendix C to Part 27 - Criteria for Category A'
