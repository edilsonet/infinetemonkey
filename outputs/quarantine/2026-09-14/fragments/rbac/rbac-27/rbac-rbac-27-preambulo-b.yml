title: preambulo(b)
text: '(b)

  Level landing attitude with only the forward wheels contacting the ground. In this attitude
  -

  (1)

  The vertical loads must be applied under §§ 27.471 through 27.475;

  (2)

  The vertical load at each axle must be combined with a drag load at that axle of not less
  than 25

  percent of that vertical load; and

  (3)

  Unbalanced pitching moments are assumed to be resisted by angular inertia forces.'
