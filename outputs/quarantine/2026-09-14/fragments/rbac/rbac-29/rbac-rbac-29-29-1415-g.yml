title: 29.1415(g)
text: '(g)

  Each crewmember must be seated in the normally assigned seat for takeoff and must remain
  in that

  seat until receiving the signal for commencement of the demonstration. For compliance with
  this section,

  each crewmember must be -

  (1)

  A member of a regularly scheduled line crew; or

  (2)

  A person having knowledge of the operation of exits and emergency equipment.'
