title: 29.1415(h)
text: '(h)

  A representative passenger load of persons in normal health must be used as follows:

  (1)

  At least 25 percent must be over 50 years of age, with at least 40 percent of these being
  females.

  (2)

  The remaining, 75 percent or less, must be 50 years of age or younger, with at least 30
  percent of

  these being females.

  (3)

  Three life-size dolls, not included as part of the total passenger load, must be carried
  by

  passengers to simulate live infants 2 years old or younger, except for a total passenger
  load of fewer

  than 44 but more than 19, one doll must be carried. A doll is not required for a 19 or fewer
  passenger

  load.

  (4)

  Crewmembers, mechanics, and training personnel who maintain or operate the rotorcraft in
  the

  normal course of their duties may not be used as passengers.'
