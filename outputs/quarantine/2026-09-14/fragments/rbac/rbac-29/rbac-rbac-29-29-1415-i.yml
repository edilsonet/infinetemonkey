title: 29.1415(i)
text: '(i)

  No passenger may be assigned a specific seat except as the Administrator may require. Except
  as

  required by paragraph (1) of this appendix, no employee of the applicant may be seated next
  to an

  emergency exit, except as allowed by the Administrator.'
