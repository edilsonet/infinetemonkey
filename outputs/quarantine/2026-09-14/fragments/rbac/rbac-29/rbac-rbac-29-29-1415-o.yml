cite: 29.1415(o)
title: 29.1415(o)
text: '(o)

  If safety equipment, as allowed by paragraph (c) of this appendix, is provided, either all
  passenger and

  cockpit windows must be blacked out or all emergency exits must have safety equipment to
  prevent

  disclosure of the available emergency exits.'
