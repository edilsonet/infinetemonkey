section_id: '29.1415'
section_title: must be near an exit available during an unplanned ditching.
subsection_id: p
cite: 29.1415(p)
title: 29.1415(p)
text: '(p)

  Not more than 50 percent of the emergency exits in the sides of the fuselage of a rotorcraft
  that meet all

  of the requirements applicable to the required emergency exits for that rotorcraft may be
  used for

  demonstration. Exits that are not to be used for the demonstration must have the exit handle
  deactivated

  or must be indicated by red lights, red tape, or other acceptable means placed outside the
  exits to indicate

  fire or other reasons why they are unusable. The exits to be used must be representative
  of all the

  emergency exits on the rotorcraft and must be designated by the applicant, subject to approval
  by the

  Administrator. If installed, at least one floor level exit (Type I; § 29.807(a)(1)) must
  be used as required by

  § 29.807(c).'
