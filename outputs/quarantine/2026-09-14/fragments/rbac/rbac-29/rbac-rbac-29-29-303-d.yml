title: 29.303(d)
text: '(d)

  Maximum nose-up attitude with only the rear wheel contacting the ground. The attitude for
  this condition

  must be the maximum nose-up attitude expected in normal operation, including autorotative
  landings. In

  this attitude -

  (1)

  The appropriate ground loads specified in paragraph (b)(1) and (2) of this section must
  be

  determined and applied, using a rational method to account for the moment arm between the
  rear

  wheel ground reaction and the rotorcraft center of gravity; or

  (2)

  The probability of landing with initial contact on the rear wheel must be shown to be extremely

  remote.'
