title: 29.341(b)
text: '(b)

  Stowage provisions. Stowage provisions for required emergency equipment must be furnished
  and must

  -

  (1)

  Be arranged so that the equipment is directly accessible and its location is obvious; and

  (2)

  Protect the safety equipment from inadvertent damage.'
