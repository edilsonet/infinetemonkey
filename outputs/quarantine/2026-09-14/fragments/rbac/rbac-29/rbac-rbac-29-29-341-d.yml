title: 29.341(d)
text: '(d)

  Liferafts. Liferafts must be stowed near exits through which the rafts can be launched during
  an

  unplanned ditching. Rafts automatically or remotely released outside the rotorcraft must
  be attached to

  the rotorcraft by the static line prescribed in § 29.1415.'
