text: '(f)

  Minimum effective intensities for anticollision light. Each anticollision light effective
  intensity must equal

  or exceed the applicable values in the following table:

  14 CFR Part 29 (up to date as of 5/03/2022)

  Airworthiness Standards: Transport Category Rotorcraft

  14 CFR 29.1401(b)

  14 CFR 29.1401(f) (enhanced display)

  page 133 of 167


  § 29.1411 General.

  § 29.1413 Safety belts: passenger warning device.

  (Secs. 313, 314, and 601 through 610 of the Federal Aviation Act of 1958 (49 U.S.C. 1354,
  1355, and 1421 through

  1430) and sec. 6(c), Dept. of Transportation Act (49 U.S.C. 1655(c)))

  § 29.1415 Ditching equipment.

  § 29.1419 Ice protection.'
