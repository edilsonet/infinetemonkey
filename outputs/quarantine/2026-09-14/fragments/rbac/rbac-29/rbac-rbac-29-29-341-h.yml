title: 29.341(h)
text: '(h)

  For unpressurized rotorcraft, paragraph (g)(1) of this section does not apply if it can
  be demonstrated

  that the static pressure system calibration, when either static pressure source is selected,
  is not changed

  by the other static pressure source being open or blocked.'
