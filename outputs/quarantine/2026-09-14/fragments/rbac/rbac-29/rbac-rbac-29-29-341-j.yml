title: 29.341(j)
text: '(j)

  For Category A rotorcraft, a speed warning device when VNE is less than the speed at which

  unmistakable overspeed warning is provided by other pilot cues. The speed warning device
  must give

  effective aural warning (differing distinctively from aural warnings used for other purposes)
  to the pilots

  whenever the indicated speed exceeds VNE plus 3 knots and must operate satisfactorily throughout
  the

  approved range of altitudes and temperatures.'
