text: '(k)

  Endurance tests; OEI power run -

  (1)

  30-minute OEI power run. For rotorcraft for which the use of 30-minute OEI power is requested,
  a

  run at 30-minute OEI torque and the maximum speed for use with 30-minute OEI torque must
  be

  conducted as follows: For each engine, in sequence, that engine must be inoperative and
  the

  remaining engines must be run for a 30-minute period.

  (2)

  Continuous OEI power run. For rotorcraft for which the use of continuous OEI power is requested,
  a

  run at continuous OEI torque and the maximum speed for use with continuous OEI torque must
  be

  conducted as follows: For each engine, in sequence, that engine must be inoperative and
  the

  remaining engines must be run for 1 hour.

  14 CFR Part 29 (up to date as of 5/03/2022)

  Airworthiness Standards: Transport Category Rotorcraft

  14 CFR 29.923(g)

  14 CFR 29.923(k)(2) (enhanced display)

  page 83 of 167


  (Secs. 313(a), 601, 603, 604, Federal Aviation Act of 1958 (49 U.S.C. 1354(a), 1421, 1423,
  1424), sec. 6(c), Dept. of

  Transportation Act (49 U.S.C. 1655(c)))

  § 29.927 Additional tests.

  (3)

  The number of periods prescribed in paragraph (k)(1) or (k)(2) of this section may not be
  less than

  the number of engines, nor may it be less than two.'
