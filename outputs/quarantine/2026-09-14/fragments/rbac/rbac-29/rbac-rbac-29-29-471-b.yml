title: 29.471(b)
text: '(b)

  Each rotor assembly must be designed as prescribed in this section and must function safely
  for the

  critical flight load and operating conditions. A design assessment must be performed, including
  a detailed

  failure analysis to identify all failures that will prevent continued safe flight or safe
  landing, and must

  identify the means to minimize the likelihood of their occurrence.'
