text: '(e)

  One-skid landing loads in the level attitude. In the level attitude, and with the rotorcraft
  contacting the

  ground along the bottom of one skid only, the following apply:

  (1)

  The vertical load on the ground contact side must be the same as that obtained on that side
  in the

  condition specified in paragraph (b) of this section.

  (2)

  The unbalanced moments are assumed to be resisted by angular inertia.

  14 CFR Part 29 (up to date as of 5/03/2022)

  Airworthiness Standards: Transport Category Rotorcraft

  14 CFR 29.501(a)(3)

  14 CFR 29.501(e)(2) (enhanced display)

  page 36 of 167


  § 29.505 Ski landing conditions.

  If certification for ski operation is requested, the rotorcraft, with skis, must be designed
  to withstand the following

  loading conditions (where P is the maximum static weight on each ski with the rotorcraft
  at design maximum

  weight, and n is the limit load factor determined under § 29.473(b)):

  § 29.511 Ground load: unsymmetrical loads on multiple-wheel units.

  WATER LOADS'
