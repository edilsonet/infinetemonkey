title: 29.60(a)
text: '(a)

  For specified landing conditions, a design maximum weight must be used that is not less
  than the

  maximum weight. A rotor lift may be assumed to act through the center of gravity throughout
  the landing

  impact. This lift may not exceed two-thirds of the design maximum weight.'
