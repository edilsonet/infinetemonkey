text: '(d)

  At the rotor speed or speeds selected by the applicant.

  14 CFR Part 29 (up to date as of 5/03/2022)

  Airworthiness Standards: Transport Category Rotorcraft

  14 CFR 29.67(a)(1)

  14 CFR 29.71(d) (enhanced display)

  page 19 of 167


  § 29.75 Landing: General.

  § 29.77 Landing Decision Point (LDP): Category A.

  § 29.79 Landing: Category A.

  § 29.81 Landing distance: Category A.

  The horizontal distance required to land and come to a complete stop (or to a speed of approximately
  3 knots for

  water landings) from a point 50 ft above the landing surface must be determined from the
  approach and landing

  paths established in accordance with § 29.79.'
