title: preambulo(f)
text: '(f)

  For turbine-engine-power rotorcraft, a means must be provided to permit the pilot to determine
  prior to

  takeoff that each engine is capable of developing the power necessary to achieve the applicable
  rotorcraft

  performance prescribed in this subpart.'
