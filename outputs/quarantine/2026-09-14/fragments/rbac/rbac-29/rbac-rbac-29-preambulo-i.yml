cite: preambulo(i)
title: preambulo(i)
text: '(i)

  The critical engine inoperative and the remaining engines at maximum continuous power

  including continuous OEI power, if approved, and at 30-minute OEI power for rotorcraft for

  which certification for the use of 30-minute OEI power is requested;

  (ii)

  The landing gear retracted; and

  (iii)

  The speed selected by the applicant.'
