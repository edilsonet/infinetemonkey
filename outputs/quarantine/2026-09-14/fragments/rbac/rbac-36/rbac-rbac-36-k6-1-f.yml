title: K6.1(f)
text: '(f) For tests conducted in accordance with sections K6.2, K6.3, and K6.4 of this appendix,
  use the

  maximum normal operating RPM corresponding to the airworthiness limit imposed by the

  manufacturer. For configurations for which the rotor speed automatically links with the
  flight

  condition, use the maximum normal operating rotor speed corresponding with the reference
  flight

  condition. For configurations for which the rotor speed can change by pilot action, use
  the highest

  normal rotor speed specified in the flight manual limitation section for the reference conditions.'
