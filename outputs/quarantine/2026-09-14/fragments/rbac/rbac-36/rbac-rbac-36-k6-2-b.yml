cite: K6.2(b)
title: K6.2(b)
text: '(b) The tiltrotor power must be stabilized at the maximum takeoff power corresponding
  to the

  minimum installed engine(s) specification power available for the reference ambient conditions
  or

  gearbox torque limit, whichever is lower. The tiltrotor power must also be stabilized along
  a path

  starting from a point located 1,640 feet (500 m) before the flight path reference point,
  at 65 ft (20

  m) above ground level;'
