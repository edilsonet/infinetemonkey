title: K6.2(c)
text: '(c) The nacelle angle and the corresponding best rate of climb speed, or the lowest
  approved speed

  for the climb after takeoff, whichever is the greater, must be maintained throughout the
  takeoff

  reference procedure;


  Data da emissão: 14 de abril de 2021.'
