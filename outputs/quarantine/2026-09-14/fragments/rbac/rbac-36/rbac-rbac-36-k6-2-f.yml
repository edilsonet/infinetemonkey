title: K6.2(f)
text: '(f) The reference takeoff flight profile is a straight line segment inclined from the
  starting point

  1,640 feet (500 m) before to the center noise measurement point and 65 ft (20 m) above ground

  level at an angle defined by best rate of climb and the speed corresponding to the selected
  nacelle

  angle and for minimum specification engine performance.'
