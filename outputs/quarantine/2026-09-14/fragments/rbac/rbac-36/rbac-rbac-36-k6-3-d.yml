cite: K6.3(d)
title: K6.3(d)
text: '(d) In the VTOL/Conversion mode:

  (1) The nacelle angle must be at the authorized fixed operation point that is closest to
  the shallow

  nacelle angle certificated for zero airspeed;

  (2) The airspeed must be 0.9VCON; and

  (3) The rotor speed must be stabilized at the maximum normal operating RPM certificated
  for level

  flight.'
