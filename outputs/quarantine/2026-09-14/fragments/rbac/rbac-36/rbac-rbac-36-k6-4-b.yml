section_title: Approach Reference Procedure.
subsection_id: b
cite: K6.4(b)
title: K6.4(b)
text: '(b) An approved airworthiness configuration in which maximum noise occurs must be maintained;

  (1) An airspeed equal to the best rate of climb speed corresponding to the nacelle angle,
  or the

  lowest approved airspeed for the approach, whichever is greater, must be stabilized and
  maintained;

  and

  (2) The tiltrotor power during the approach must be stabilized over the flight path reference
  point,

  and continue as if landing;'
