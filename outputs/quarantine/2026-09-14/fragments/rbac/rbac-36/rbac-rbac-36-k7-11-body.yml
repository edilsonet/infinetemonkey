text: 'K7.11 During all test procedures, the tiltrotor weight (mass) must not be less than
  90 percent and

  not more than 105 percent of the maximum certificated weight (mass). For each of the test

  procedures, complete at least one test at or above this maximum certificated weight (mass).


  Data da emissão: 14 de abril de 2021.'
