title: preambulo(f)
text: '(f) For the purpose of showing compliance with this part for transport category large
  airplanes and

  jet airplanes regardless of category, the following terms have the following meanings:

  (1) Stage 1 noise level means a flyover, lateral or approach noise level greater than the
  Stage 2 noise

  limits prescribed in section B36.5(b) of appendix B of this part.

  (2) Stage 1 airplane means an airplane that has not been shown under this part to comply
  with the

  flyover, lateral, and approach noise levels required for Stage 2 or Stage 3 airplanes.

  (3) Stage 2 noise level means a noise level at or below the Stage 2 noise limits prescribed
  in section

  B36.5(b) of appendix B of this part but higher than the Stage 3 noise limits prescribed
  in section

  B36.5(c) of appendix B of this part.

  (4) Stage 2 airplane means an airplane that has been shown under this part to comply with
  Stage 2

  noise levels prescribed in section B36.5(b) of appendix B of this part (including use of
  the

  applicable tradeoff provisions specified in section B36.6) and that does not comply with
  the

  requirements for a Stage 3 airplane.

  (5) Stage 3 noise level means a noise level at or below the Stage 3 noise limits prescribed
  in section

  B36.5(c) of appendix B of this part.

  (6) Stage 3 airplane means an airplane that has been shown under this part to comply with
  Stage 3

  noise levels prescribed in section B36.5(c) of appendix B of this part (including use of
  the

  applicable tradeoff provisions specified in section B36.6).

  (7) Subsonic airplane means an airplane for which the maximum operating limit speed, Mmo,
  does

  not exceed a Mach number of 1.

  (8) Supersonic airplane means an airplane for which the maximum operating limit speed, Mmo,

  exceeds a Mach number of 1.

  (9) Stage 4 noise level means a noise level at or below the Stage 4 noise limit prescribed
  in section

  B36.5(d) of appendix B of this part.

  (10) Stage 4 airplane means an airplane that has been shown under this part not to exceed
  the Stage

  4 noise limit prescribed in section B36.5(d) of appendix B of this part.

  (11) Chapter 4 noise level means a noise level at or below the maximum noise level prescribed
  in

  Chapter 4, Paragraph 4.4, Maximum Noise Levels, of the International Civil Aviation Organization

  (ICAO) Annex 16, Volume I, Amendment 7, effective March 21, 2002. [Incorporated by reference,

  see §36.6].

  (12) Stage 5 noise level means a noise level at or below the Stage 5 noise limit prescribed
  in section

  B36.5(e) of appendix B to this RBAC.


  Data da emissão: 14 de abril de 2021.


  (13) Stage 5 airplane means an airplane that has been shown under this RBAC not to exceed
  the

  Stage 5 noise limit prescribed in section B36.5(e) of appendix B to this RBAC.

  (14) Chapter 14 noise level means a noise level at or below the Chapter 14 maximum noise
  level

  prescribed in Chapter 14 of the ICAO Annex 16, Volume 1, Seventh Edition, Amendment 11-B

  (Incorporated by reference, see §36.6).'
