title: preambulo(i)
text: '(i) December 1, 1973, for airplanes with maximum weights greater than 75,000 pounds,
  except for

  airplanes that are powered by Pratt & Whitney Turbo Wasp JT3D series engines;

  (ii) December 31, 1974, for airplanes with maximum weights greater than 75,000 pounds and
  that

  are powered by Pratt & Whitney Turbo Wasp JT3D series engines; and

  (iii) December 31, 1974, for airplanes with maximum weights of 75,000 pounds and less.

  (2) The provisions of this part in effect on October 13, 1977, including the stage 2 noise
  limits, for

  Concorde airplanes that have not had flight time before January 1, 1980.'
