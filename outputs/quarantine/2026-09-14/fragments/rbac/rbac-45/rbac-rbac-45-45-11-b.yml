text: '(b) No caso de balões livres não tripulados, de utilização profissional, deverá ser
  afixada no lado

  externo da carga-paga do mesmo uma placa com características idênticas às estabelecidas
  no

  parágrafo (a) desta seção, contendo as seguintes informações: data, hora e lugar do lançamento,
  tipo

  do balão e nome de seu operador.'
