text: '45.11 deste RBAC. Essa placa deve ser construída em material à prova de fogo, marcada
  por meio

  de estampa, gravação mecânica ou química, ou outro processo aprovado, podendo ser fixada

  vizinha à placa de identificação prevista na seção 45.11 deste RBAC, cumprindo as mesmas

  especificações de fixação ali estabelecidas, ou em um local acessível e próximo à entrada
  principal

  da aeronave. (Redação dada pela Resolução nº 364, de 20.10.2015)'
