cite: 45.11(c)
title: 45.11(c)
text: '(c) Hélices, pás de hélices e cubos de hélices. Cada fabricante de hélice, pá de hélice
  ou cubo de

  hélice com base em um certificado de tipo ou certificado de organização de produção deve
  marcar

  cada produto ou peça. Essa marcação deverá: (Redação dada pela Resolução nº 493, de 04.10.2018)

  (1) ser colocada em uma superfície não-crítica;

  (2) conter a informação especificada na seção 45.13 deste Regulamento;

  (3) não ser propensa a ser danificada ou removida em serviços normais;

  (4) não ser propensa a ser perdida ou destruída em caso de acidente; e

  (5)-I exceto em hélices de madeira de passo fixo, ser executada usando um método à prova
  de

  fogo. (Redação dada pela Resolução nº 493, de 04.10.2018)'
