title: 45.11(d)
text: '(d) Balões livres tripulados. Os fabricantes de balões livres tripulados devem marcar
  cada balão

  fixando a placa de identificação descrita no parágrafo (a) desta seção. A placa deve ser
  fixada no

  revestimento do balão e deve estar localizada, se praticável, onde seja legível pelo operador
  com o

  balão inflado. Adicionalmente, a gôndola e o conjunto de aquecimento devem ser marcados
  de

  modo legível e permanente com o nome do fabricante, número de parte (ou equivalente) e número

  de série (ou equivalente).'
