cite: 45.11(i)
title: 45.11(i)
text: '(i) no lado externo da fuselagem, legível por uma pessoa no solo, e colocada adjacente
  e

  posteriormente à porta mais traseira da aeronave ou na superfície da fuselagem próxima à
  cauda; ou

  (ii) em um local interno, acessível e próximo a uma entrada da aeronave, desde que a de-

  signação do modelo e o número de série do fabricante estejam também expostos no lado externo
  da

  fuselagem. (Redação dada pela Resolução nº 364, de 20.10.2015)

  (4)-I A designação do modelo e o número de série do fabricante que trata o parágrafo anterior

  não necessitam ser dispostos nas aeronaves operadas de acordo com os RBAC 121 e RBAC 135
  ou

  sendo exportadas. (Redação dada pela Resolução nº 364, de 20.10.2015)'
