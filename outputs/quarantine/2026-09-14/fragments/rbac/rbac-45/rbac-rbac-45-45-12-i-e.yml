cite: 45.12-I(e)
title: 45.12-I(e)
text: '(e) A inscrição de que trata esta seção deve:

  (1) contrastar, em cor, com o fundo sobre o qual for colocada, ficando claramente legível;

  (2) estar próxima à porta principal de entrada de passageiros da aeronave, externamente
  sobre

  a fuselagem, horizontal ou verticalmente, de maneira que a abertura da porta não impeça
  sua

  leitura;

  (3) ser escrita em letras de forma, maiúsculas, com altura entre 5 e 15 cm;

  (4) ser pintada na aeronave ou aposta por qualquer outro meio que assegure um grau similar

  de aderência.'
