text: '(e) Ninguém pode instalar uma placa de identificação removida segundo o parágrafo (d)(2)
  desta

  seção em qualquer aeronave, motor, hélice, pá de hélice ou cubo de hélice, que não seja
  naquele do

  qual a placa foi removida.'
