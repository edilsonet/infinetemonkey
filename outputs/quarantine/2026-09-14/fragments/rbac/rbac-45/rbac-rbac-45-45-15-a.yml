cite: 45.15(a)
title: 45.15(a)
text: '(a) Peças PAA (Produto Aeronáutico Aprovado). Exceto como previsto no parágrafo (d)
  desta

  seção, cada fabricante de peças de reposição ou modificação segundo um certificado de produto

  aeronáutico aprovado e/ou certificado de organização de produção, segundo a subparte K do
  RBAC

  21, deve marcar essa peça de modo permanente e legível com as seguintes informações:

  (1) as letras ANAC-PAA;

  (2) o nome, marca patenteada, símbolo do detentor do certificado de produto aeronáutico

  aprovado ou outra identificação aprovada pela ANAC; e

  (3) número da peça (part number).'
