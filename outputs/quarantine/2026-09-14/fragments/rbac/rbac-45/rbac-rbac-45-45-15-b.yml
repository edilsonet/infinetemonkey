cite: 45.15(b)
title: 45.15(b)
text: '(b) Peças OTP. Exceto como previsto no parágrafo (d) desta seção, cada fabricante de
  um

  produto OTP deve marcar esse produto de modo permanente e legível com as seguintes

  informações:

  (1) o nome, marca patenteada, símbolo do detentor da OTP, ou outra identificação aprovada

  pela ANAC;

  (2) número da peça (part number);

  (3) exceto se de outra forma especificado na OTP, o número e letra de designação da OTP,

  todas as marcações especificamente requeridas pela OTP aplicável; e

  (4) o número de série (serial number) ou a data de fabricação da peça ou ambos.'
