title: 45.21(c)
text: '(c) As marcas de nacionalidade e de matrícula:

  (1) exceto como previsto no parágrafo (d) desta seção, devem ser pintadas na aeronave ou

  apostas por qualquer outro meio que assegure um grau similar de aderência;

  (2) não devem possuir ornamentação;

  (3) devem contrastar em cor com o fundo sobre o qual se encontram; e

  (4) devem ser legíveis.'
