section_title: 'Aeronaves antigas, de exibição e outras aeronaves: requisitos especiais'
subsection_id: b
cite: 45.22(b)
title: 45.22(b)
text: '(b) Pequena aeronave registrada no Brasil e construída há, no mínimo, 30 anos, ou uma
  aeronave

  registrada no Brasil para a qual tenha sido emitido um certificado de autorização de voo

  experimental segundo os parágrafos 21.191(d) ou 21.191(g) do RBAC 21, para operar como

  aeronave de exibição ou, ainda, uma aeronave construída por amador que seja réplica de aeronave

  construída há mais de 30 anos, pode operar sem exibir as marcas previstas nas seções 45.21
  e'
