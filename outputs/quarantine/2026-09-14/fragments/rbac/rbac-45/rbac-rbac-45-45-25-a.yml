section_title: Localização das marcas em aeronaves de asa fixa
subsection_id: a
cite: 45.25(a)
title: 45.25(a)
text: '(a) Exceto como previsto no parágrfo 45.29-I(f) deste Regulamento, operador de uma
  aeronave

  de asa fixa deve expor as marcas de nacionalidade e de matrícula requeridas nas asas e nas
  laterais

  da fuselagem ou da empenagem vertical.'
