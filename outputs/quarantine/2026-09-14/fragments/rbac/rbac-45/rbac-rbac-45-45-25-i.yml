section_title: Localização das marcas em aeronaves de asa fixa
subsection_id: i
cite: 45.25(i)
title: 45.25(i)
text: '(i) aeronaves monoplanas: as marcas de nacionalidade e de matrícula devem ser expostas

  nas asas, na superfície inferior. Tanto quanto possível, elas devem ficar equidistantes
  dos bordos de

  ataque e de fuga, com o topo das letras voltado para o bordo de ataque. As marcas de nacionalidade

  devem ser colocadas na superfície inferior da asa direita. As marcas de matrícula devem
  ser coloca-

  das na superfície inferior da asa esquerda; e

  (ii) aeronaves com dois ou mais planos: deve ser obedecido o estabelecido no parágrafo (b)(3)-

  I(i) desta seção, considerando-se a superfície inferior da asa mais baixa. (Redação dada
  pela

  Resolução nº 493, de 04.10.2018)'
