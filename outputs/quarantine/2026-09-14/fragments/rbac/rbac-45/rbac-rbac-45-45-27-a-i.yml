section_title: Localização das marcas em aeronaves de asas rotativas e outras aeronaves
subsection_id: a-i
cite: 45.27(a-I)
title: 45.27(a-I)
text: '(a)-I Aeronaves de asas rotativas. Cada operador de uma aeronave de asa rotativa deve
  colocar

  as marcas de nacionalidade e de matrícula, requeridas pela seção 45.23-I deste Regulamento,
  como

  se segue:

  (1) na superfície ventral da fuselagem ou cabine, com o topo das letras voltado para o lado

  esquerdo da fuselagem ou para a frente da aeronave, o que for mais adequado; e

  (2) nas duas superfícies laterais da cabine, da capota do motor ou do cone de cauda, onde
  for

  mais adequado.'
