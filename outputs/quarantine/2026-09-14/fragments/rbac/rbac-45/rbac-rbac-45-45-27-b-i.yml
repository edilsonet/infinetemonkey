section_title: Localização das marcas em aeronaves de asas rotativas e outras aeronaves
subsection_id: b-i
cite: 45.27(b-I)
title: 45.27(b-I)
text: '(b)-I Dirigíveis. Cada operador de um dirigível deve colocar as marcas de nacionalidade
  e de

  matrícula, requeridas pela seção 45.23-I deste Regulamento, no bojo ou nas superfícies estabiliza-

  doras, como se segue:

  (1) nos estabilizadores horizontais as marcas devem ser localizadas na metade direita da
  su-

  perfície superior e na metade esquerda da superfície inferior, com o topo das letras voltado
  para o

  bordo de ataque da superfície;

  (2) nos estabilizadores verticais as marcas devem ser colocadas horizontalmente em cada
  la-

  do da metade inferior do estabilizador; e

  (3) no bojo do dirigível, as marcas devem ser colocadas horizontalmente em cada lado do

  mesmo, e na superfície superior, ao longo da linha de simetria, com o topo das letras voltado
  para o

  lado esquerdo do dirigível.'
