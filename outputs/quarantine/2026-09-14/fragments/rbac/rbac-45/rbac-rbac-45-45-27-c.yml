cite: 45.27(c)
title: 45.27(c)
text: '(c) Balões esféricos. Cada operador de um balão livre tripulado e esférico deve colocar
  as marcas

  requeridas pela seção 45.23-I deste Regulamento em dois locais, diametralmente opostos,
  ao nível

  do círculo máximo do invólucro do balão.'
