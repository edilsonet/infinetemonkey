section_title: Localização das marcas em aeronaves de asas rotativas e outras aeronaves
subsection_id: d
cite: 45.27(d)
title: 45.27(d)
text: '(d) Balões não esféricos. Cada operador de um balão livre tripulado e não esférico
  deve colocar

  as marcas requeridas pela seção 45.23-I deste Regulamento em ambas as laterais, próximas
  da seção

  horizontal máxima, e, também imediatamente acima da estrutura da boca do balão ou dos pontos
  de

  fixação dos cabos de suspensão da gôndola ou cabine no mesmo.'
