title: Marcas de aeronave exportada
text: '45.31 Marcas de aeronave exportada


  Um fabricante que produza uma aeronave no Brasil para ser imediatamente exportada, pode

  colocar na aeronave as marcas de nacionalidade e de matrícula do país do importador. Entretanto,

  essa aeronave só poderá voar no Brasil para os voos de recebimento de seu comprador e durante
  o

  trânsito para o país do comprador.'
