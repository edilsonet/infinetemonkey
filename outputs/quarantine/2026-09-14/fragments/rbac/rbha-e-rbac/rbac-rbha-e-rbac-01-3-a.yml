title: 01.3(a)
text: '(a) No texto dos RBAC, a menos que de outro modo explicitado:

  (1) as palavras no singular incluem seu plural;

  (2) as palavras no plural incluem seu singular; e

  (3) as palavras no gênero masculino incluem seu feminino.'
