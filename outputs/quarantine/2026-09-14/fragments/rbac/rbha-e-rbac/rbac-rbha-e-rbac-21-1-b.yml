title: 21.1(b)
text: '(b) Para os propósitos deste regulamento:

  (1) aprovação de aeronavegabilidade significa um documento emitido pela ANAC para uma aeronave,
  motor de aeronave, hélice, ou artigo, o qual certifica que aquela aeronave, motor de aeronave,
  hélice, ou artigo está em conformidade com o respectivo projeto aprovado e está em condição
  de operação segura, salvo especificação em contrário;

  (Redação dada pela Resolução nº 495, de 14.11.2018)

  (2) artigo significa um material, parte, componente, processo ou aparelho;

  (3) parte comercial significa um artigo que está na lista de peças comerciais aprovada pela
  ANAC, incluída nas instruções de aeronavegabilidade continuada de um detentor de aprovação
  de projeto, conforme requerido pela seção 21.50;

  (4) aprovação de projeto significa um certificado de tipo (incluindo emendas e certificados
  suplementares de tipo) ou projeto aprovado segundo um certificado de produto aeronáutico
  aprovado, projeto aprovado segundo um certificado de produto aeronáutico aprovado sob uma
  ordem técnica padrão, carta de aprovação de projeto sob uma ordem técnica padrão, ou outro
  projeto aprovado;

  (5) componente de interface significa um artigo que serve como uma interface funcional entre
  uma aeronave e um motor de aeronave, um motor de aeronave e uma hélice, ou uma aeronave
  e uma hélice. Um componente de interface é designado pelo detentor de projeto de tipo ou
  projeto suplementar de tipo que controla os dados de projeto aprovado para tal artigo;

  (Redação dada pela Resolução nº 495, de 14.11.2018)

  (6) produto significa uma aeronave, motor de aeronave ou hélice;

  (Redação dada pela Resolução nº 495, de 14.11.2018)

  (7) aprovação de produção significa um certificado de organização de produção emitido pela
  ANAC para uma pessoa, que autoriza a produção de um produto ou artigo de acordo com seu
  projeto aprovado e sistema da qualidade aprovado;

  (Redação dada pela Resolução nº 495, de 14.11.2018)

  (8) estado de projeto significa o país ou união de países que tem autoridade regulatória
  sobre a organização responsável pelo projeto e aeronavegabilidade continuada de um produto
  ou artigo utilizado na aviação civil;

  (Redação dada pela Resolução nº 495, de 14.11.2018)

  (9) estado de fabricação significa o país ou união de países que tem autoridade regulatória
  sobre a organização responsável pela produção e aeronavegabilidade de um produto ou artigo
  utilizado na aviação civil;

  (Redação dada pela Resolução nº 495, de 14.11.2018)

  (10) fornecedor significa uma pessoa em qualquer camada na cadeia de suprimentos que fornece
  um produto, artigo ou serviço, que é usado ou consumido na fase de projeto ou de fabricação
  de um produto ou artigo, ou instalado em um produto ou artigo.

  (Redação dada pela Resolução nº 495, de 14.11.2018)

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
