text: '21.10 Coordenação entre projeto e produção

  O detentor de um certificado de tipo (incluindo emendas ou um certificado suplementar de
  tipo), de um produto aeronáutico aprovado (incluindo os emitidos sob uma ordem técnica padrão),
  ou ainda, o licenciado de um certificado de tipo (incluindo outras aprovações de projeto),
  ou de uma aprovação de projeto de grande reparo deve colaborar com organizações de produção,
  conforme necessário, a fim de garantir:'
