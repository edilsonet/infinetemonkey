cite: 21.101(b)
title: 21.101(b)
text: '(b) Exceto como previsto no parágrafo (g) desta seção e se os parágrafos (b)(1), (2)
  ou (3) desta seção são aplicáveis, o requerente pode demonstrar que a modificação e as áreas
  afetadas pela modificação cumprem com uma emenda, anterior ao requerimento, de um regulamento
  exigido pelo parágrafo (a) desta seção e de qualquer outro regulamento que a ANAC julgue
  diretamente relacionado. No entanto, a emenda do regulamento, anterior ao requerimento,
  não pode preceder nem o regulamento referenciado no certificado de tipo nem qualquer regulamento
  definido nas seções 25.2 do RBAC nº 25, 27.2 do RBAC nº 27 ou 29.2 do RBAC nº 29 que esteja
  relacionado à modificação. O requerente pode demonstrar cumprimento com uma emenda de um
  regulamento, anterior ao requerimento, para os seguintes casos: (

  Redação dada pela Resolução nº 524, de 02.08.2019

  )

  (1) uma modificação que a ANAC não considera significativa. Para determinar o quanto uma
  modificação é significativa, a ANAC considera a modificação no contexto de todas as modificações
  relevantes já introduzidas no projeto e de todas as revisões dos regulamentos aplicáveis
  incorporados ao certificado de tipo do produto. As modificações que se enquadram em um dos
  seguintes casos são consideradas automaticamente significativas:'
