cite: 21.101(f)
title: 21.101(f)
text: (f) Para aeronaves certificadas conforme o parágrafo 21.17(b) e seções21.24, 21.25 e
  21.27, os requisitos de aeronavegabilidade aplicáveis à categoria do produto vigentes na
  data do requerimento para a modificação incluem os requisitos de aeronavegabilidade que
  a ANAC julgar apropriados para as aeronaves certificadas de acordo com os RBAC referidos
  acima.
