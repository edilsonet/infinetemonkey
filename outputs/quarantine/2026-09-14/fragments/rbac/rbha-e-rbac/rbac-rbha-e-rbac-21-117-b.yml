cite: 21.117(b)
title: 21.117(b)
text: '(b) Um certificado suplementar de tipo consiste:

  (1) na aprovação pela ANAC para a modificação ao projeto de tipo do produto; e

  (2) no certificado de tipo previamente emitido ou reconhecido para o produto.'
