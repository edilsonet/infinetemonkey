text: '21.120 Apresentação do acordo de licenciamento

  Um detentor de um certificado suplementar de tipo que permite que uma pessoa o utilize para
  alterar uma aeronave, um motor ou uma hélice deve prover a tal pessoa um acordo de licenciamento
  que seja aceitável pela ANAC.

  SUBPARTE F

  PRODUÇÃO SOB CERTIFICADO DE TIPO

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
