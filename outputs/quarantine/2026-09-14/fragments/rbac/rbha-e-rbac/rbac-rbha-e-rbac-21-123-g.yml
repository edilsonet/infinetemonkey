title: 21.123(g)
text: '(g) a menos que de outra forma autorizado pela ANAC, obter um certificado de organização
  de produção para o produto de acordo com a subparte G dentro de 6 (seis) meses da emissão
  do certificado de tipo.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
