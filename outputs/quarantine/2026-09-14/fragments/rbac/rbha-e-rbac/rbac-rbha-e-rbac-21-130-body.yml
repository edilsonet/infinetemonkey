title: Declaração de conformidade
text: '21.130 Declaração de conformidade

  Cada detentor ou licenciado de um certificado de tipo que fabrica um produto sob esta subparte
  deve fornecer, de forma e maneira aceitável pela ANAC, uma declaração de que o produto está
  conforme o certificado de tipo, está em condições de operação segura e cumpre com os requisitos
  de proteção ambiental aplicáveis.

  (

  Redação dada pela Resolução nº 501, de 12.12.2018

  )

  SUBPARTE G

  CERTIFICADO DE ORGANIZAÇÃO DE PRODUÇÃO'
