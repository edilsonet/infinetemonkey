title: 21.137(e)
text: '(e) inspeção e testes. Procedimentos para inspeções e testes utilizados para garantir
  que cada produto e artigo está em conformidade com seu projeto aprovado. Estes procedimentos
  devem incluir o seguinte, conforme aplicável:

  (1) um ensaio em voo para cada aeronave produzida a menos que ela seja exportada como uma
  aeronave desmontada.

  (2) um teste funcional de cada motor de aeronave e cada hélice produzidos.'
