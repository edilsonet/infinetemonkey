title: 21.137(h)
text: '(h) controle de produtos e artigos não conformes.

  (1) Procedimentos para assegurar que apenas os produtos ou artigos que estejam em conformidade
  com seu projeto aprovado sejam instalados em um produto com certificado de tipo. Estes procedimentos
  devem estabelecer a identificação, documentação, avaliação, segregação e disposição de produtos
  e artigos não conformes. Somente pessoas autorizadas podem fazer as determinações de disposições.

  (2) Procedimentos para assegurar que os artigos descartados foram inutilizados.'
