cite: 21.137(k)
title: 21.137(k)
text: (k) registros do controle da qualidade. Procedimentos para a identificação, armazenamento,
  proteção, recuperação e retenção de registros da qualidade. O detentor do certificado de
  organização de produção deve manter esses registros por pelo menos 5 anos para os produtos
  e artigos fabricados sob a certificação e pelo menos 10 anos para componentes críticos identificados
  no parágrafo 45.15 (c) do RBAC 45.
