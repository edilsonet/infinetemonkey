cite: 21.137(m)
title: 21.137(m)
text: '(m) reporte de dificuldade em serviço. Procedimentos para recebimento e processamento
  das reclamações de falhas, mau funcionamento e defeitos em serviço. Estes procedimentos
  devem incluir um processo para auxiliar o detentor da aprovação de projeto a:

  (1) resolver qualquer problema em serviço envolvendo alterações de projeto; e

  (2) determinar se quaisquer alterações nas instruções de aeronavegabilidade continuada são
  necessárias.'
