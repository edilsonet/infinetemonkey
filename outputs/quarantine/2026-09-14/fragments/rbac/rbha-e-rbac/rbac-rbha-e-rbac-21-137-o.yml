cite: 21.137(o)
title: 21.137(o)
text: '(o) emissão de documentos de liberação autorizada. Procedimentos para emissão de documentos
  de liberação autorizada para motores de aeronaves, hélices e artigos se o detentor de um
  certificado de organização de produção pretender emitir tais documentos. Estes procedimentos
  devem prever a seleção, nomeação, treinamento, gerenciamento e remoção de pessoas autorizadas
  pelo detentor do certificado de organização de produção a emitir documentos de liberação
  autorizada. Documentos de liberação autorizada podem ser emitidos para motores de aeronaves,
  hélices e artigos novos fabricados pelo detentor de certificado de organização de produção;
  e para motores de aeronaves, hélices e artigos usados, quando reconstruídos, reparados ou
  alterados, de acordo com o parágrafo 43.3(j) do RBAC nº 43. Quando um detentor de certificado
  de organização de produção emite um documento de liberação autorizada para o propósito de
  exportação, o detentor de certificado de organização de produção deve cumprir com os procedimentos
  aplicáveis de exportação de motores de aeronaves, hélices e artigos, novos e usados, especificados
  na seção 21.331 e com as responsabilidades de exportadores especificadas na seção 21.335.

  (Redação dada pela Resolução nº 495, de 14.11.2018)

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
