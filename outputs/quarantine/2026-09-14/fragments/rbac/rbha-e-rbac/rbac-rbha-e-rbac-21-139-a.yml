section_title: Localização ou mudança das instalações de fabricação
subsection_id: a
cite: 21.139(a)
title: 21.139(a)
text: (a) Um requerente pode obter um certificado de organização de produção para instalações
  de fabricação localizadas fora do Brasil, desde que a ANAC considere ser de interesse público
  e que tal localização não implique em ônus indevidos à ANAC.
