text: '21.143 Validade

  Um certificado de organização de produção é válido até que seja devolvido, suspenso, revogado,
  cassado ou que tenha uma data de validade estabelecida pela ANAC.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
