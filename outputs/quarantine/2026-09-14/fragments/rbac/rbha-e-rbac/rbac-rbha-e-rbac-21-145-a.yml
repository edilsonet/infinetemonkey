cite: 21.145(a)
title: 21.145(a)
text: '(a) O detentor de um certificado de organização de produção pode:

  (1) obter um certificado de aeronavegabilidade da aeronave sem comprovações adicionais mediante
  a apresentação de uma declaração de conformidade na forma e maneira aceitável pela ANAC.
  Entretanto, a ANAC pode inspecionar a aeronave quanto à conformidade com o projeto de tipo,
  antes da emissão do referido certificado;

  (2) no caso de outros produtos, obter aprovação da ANAC para instalação em aeronaves certificadas.'
