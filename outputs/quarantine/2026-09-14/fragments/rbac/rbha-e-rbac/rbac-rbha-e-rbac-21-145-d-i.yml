title: 21.145(d-I)
text: '(d)-I O detentor de um certificado de organização de produção pode manter uma aeronave
  que tenha produzido e emitir aprovação para o retorno ao serviço no que diz respeito àquela
  manutenção.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
