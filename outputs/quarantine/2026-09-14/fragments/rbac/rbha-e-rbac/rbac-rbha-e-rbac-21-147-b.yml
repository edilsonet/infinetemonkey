title: 21.147(b)
text: (b) O requerente de uma emenda ao certificado de organização de produção, para adicionar
  um certificado de tipo ou modelo, ou ambos, deve atender aos requisitos aplicáveis das seções
  21.137, 21.138 e 21.150.
