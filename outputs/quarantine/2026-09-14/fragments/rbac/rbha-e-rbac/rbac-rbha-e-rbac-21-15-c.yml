cite: 21.15(c)
title: 21.15(c)
text: (c) O requerimento para obtenção de um certificado de tipo de motor de aeronave deve
  ser acompanhado de uma descrição das características de projeto, características de operação
  e limitações operacionais propostas para o motor.
