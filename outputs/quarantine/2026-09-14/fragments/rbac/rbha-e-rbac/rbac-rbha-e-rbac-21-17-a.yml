title: 21.17(a)
text: '(a) Exceto como previsto nas seções 25.2 do RBAC 25, 27.2 do RBAC 27, 29.2 do RBAC
  29, e nos RBAC 26, 34, 36 e 38, um requerente de certificado de tipo deve demonstrar que
  a aeronave, motor de aeronave ou hélice satisfaz: (

  Redação dada pela Resolução nº 524, de 02.08.2019

  )

  (1) aos requisitos aplicáveis dos RBAC vigentes na data em que o requerimento foi apresentado,
  a menos que:'
