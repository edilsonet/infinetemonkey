cite: 21.17(c)
title: 21.17(c)
text: (c) O requerimento para a certificação de tipo de uma aeronave categoria transporte
  é válido por 5 (cinco) anos e o requerimento para qualquer outra certificação de tipo tem
  validade de 3 (três) anos, a menos que a ANAC aprove um período maior se o requerente demonstrar,
  no momento da apresentação do requerimento, que seu produto requer um período maior para
  o projeto, desenvolvimento e ensaios.
