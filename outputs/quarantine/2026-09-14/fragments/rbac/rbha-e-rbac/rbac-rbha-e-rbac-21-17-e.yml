title: 21.17(e)
text: (e) Se o requerente optar pelo cumprimento de uma emenda aos requisitos vigente após
  a submissão do requerimento de certificado de tipo, ele deve cumprir, também, qualquer outra
  emenda que a ANAC julgar diretamente relacionada.
