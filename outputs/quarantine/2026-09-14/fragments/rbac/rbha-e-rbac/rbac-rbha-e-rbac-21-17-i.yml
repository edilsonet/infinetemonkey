text: '(i) determinado de outra forma pela ANAC; ou

  (ii) o cumprimento com emendas que estarão vigentes em data futura seja optado ou exigido
  de acordo com esta seção; e

  (Redação dada pela Resolução nº 495, de 14.11.2018)

  (2) qualquer condição especial estabelecida de acordo com a seção 21.16.'
