title: Elegibilidade
text: '21.173 Elegibilidade

  Qualquer proprietário de uma aeronave registrada no Registro Aeronáutico Brasileiro pode
  requerer um certificado de aeronavegabilidade para essa aeronave. O requerimento de um certificado
  de aeronavegabilidade deve ser feito conforme estabelecido pela ANAC.'
