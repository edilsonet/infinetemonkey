cite: 21.175(a)
title: 21.175(a)
text: (a) Certificados de aeronavegabilidade padrão são certificados de aeronavegabilidade
  emitidos para aeronaves de tipo certificado nas categorias normal, utilidade, acrobática,
  transporte regional ou transporte ou, ainda, para balões livres tripulados e para aeronaves
  de classe especial.
