section_title: Classificação dos certificados de aeronavegabilidade
subsection_id: b
cite: 21.175(b)
title: 21.175(b)
text: (b) Certificados de aeronavegabilidade especiais são os certificados de aeronavegabilidade
  emitidos para aeronaves categorias primária, restrita, leve esportiva e os certificados
  de aeronavegabilidade provisórios. Compreendem, ainda, os certificados de aeronavegabilidade
  para aeronaves recém-fabricadas, as autorizações especiais de voo e os certificados de autorização
  de voo experimental.
