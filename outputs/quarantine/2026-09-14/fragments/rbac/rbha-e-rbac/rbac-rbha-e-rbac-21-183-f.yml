section_title: Emissão de certificado de aeronavegabilidade padrão para aeronaves categorias
  normal, utilidade, acrobática, transporte regional ou transporte e para balões livres tripulados
  e aeronaves de classe especial
subsection_id: f
cite: 21.183(f)
title: 21.183(f)
text: (f) Requisitos para saídas de emergência para passageiros. Não obstante todos os outros
  requisitos desta seção, cada requerente de um certificado de aeronavegabilidade padrão para
  aviões categoria transporte, fabricados após 16 de outubro de 1987, deve demonstrar que
  o avião atende aos requisitos do Regulamento Brasileiro de Homologação Aeronáutica - RBHA
  25.807(c)(7) vigente em 24 de julho de 1989. Para efeito deste parágrafo, a data de fabricação
  de um avião é a data que os registros de inspeção de aceitação refletem que a aeronave está
  completa e de acordo com o projeto de tipo aprovado.
