section_title: Emissão de certificado de aeronavegabilidade padrão para aeronaves categorias
  normal, utilidade, acrobática, transporte regional ou transporte e para balões livres tripulados
  e aeronaves de classe especial
subsection_id: g
cite: 21.183(g)
title: 21.183(g)
text: '(g) Drenagem de combustível e emissões de motores de aeronaves. Não obstante todos
  os outros requisitos desta seção, e independentemente da data do requerimento, não é emitido
  certificado de aeronavegabilidade nas datas ou depois das datas especificadas no RBAC 34,
  para aviões especificados em tal regulamento, a menos que o avião cumpra com os requisitos
  aplicáveis do RBAC 34; (

  Redação dada pela Resolução nº 501, de 12.12.2018

  )'
