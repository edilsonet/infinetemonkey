section_title: Emissão de certificado de aeronavegabilidade especial para aeronaves categoria
  primária
subsection_id: a
cite: 21.184(a)
title: 21.184(a)
text: (a) Aeronave categoria primária, nova, produzida sob um certificado de organização de
  produção. O requerente de um certificado de aeronavegabilidade especial para uma aeronave
  nova categoria primária, que atenda aos requisitos do parágrafo 21.24(a)(1) e que seja produzida
  sob um certificado de organização de produção (incluindo uma aeronave montada por outra
  pessoa a partir de conjuntos fornecidos pelo detentor de certificado de organização de produção
  e montada sob a supervisão e controle da qualidade deste detentor) faz jus a esse certificado
  sem comprovações adicionais. Entretanto, a ANAC reserva-se o direito de vistoriar a aeronave
  para verificar se está conforme o projeto de tipo e se apresenta condições de operação segura.
