cite: 21.184(d)
title: 21.184(d)
text: '(d) Outras aeronaves. O requerente de um certificado de aeronavegabilidade especial
  para uma aeronave categoria primária que atende ao parágrafo 21.24(a)(1) e à qual não se
  aplicam os parágrafos (a), (b) ou (c) desta seção faz jus a esse certificado se:

  (1) apresentar evidências de que a aeronave está conforme um projeto de tipo aprovado na
  categoria primária, normal, utilidade ou acrobática e cumpre com as diretrizes de aeronavegabilidade
  aplicáveis;

  (2) a aeronave tiver sido inspecionada e considerada aeronavegável nos últimos 12 (doze)
  meses calendáricos de acordo com o parágrafo 91.409(a)(1) do RBHA 91, ou dispositivo correspondente
  do RBAC que venha a substituí-lo; e

  (3) a ANAC considerar que a aeronave está conforme seu projeto de tipo aprovado e está em
  condições de operação segura.'
