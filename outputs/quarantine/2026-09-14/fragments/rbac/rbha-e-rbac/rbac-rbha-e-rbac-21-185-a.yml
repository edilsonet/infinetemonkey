section_title: Emissão de certificado de aeronavegabilidade categoria restrita
subsection_id: a
cite: 21.185(a)
title: 21.185(a)
text: (a) Aeronave fabricada sob um certificado de organização de produção ou somente com
  um certificado de tipo. O requerente de um certificado de aeronavegabilidade categoria restrita
  para uma aeronave certificada na categoria restrita e que não tenha sido certificada anteriormente
  em qualquer outra categoria deve demonstrar o cumprimento com os requisitos aplicáveis da
  seção 21.183.
