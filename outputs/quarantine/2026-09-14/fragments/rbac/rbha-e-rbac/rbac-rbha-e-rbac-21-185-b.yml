section_title: Emissão de certificado de aeronavegabilidade categoria restrita
subsection_id: b
cite: 21.185(b)
title: 21.185(b)
text: (b) Outras aeronaves. O requerente de um certificado de aeronavegabilidade categoria
  restrita para uma aeronave com certificado de tipo na categoria restrita, que tenha sido
  anteriormente uma aeronave de uso militar de uma das Forças Armadas do Brasil ou que tenha
  sido previamente certificada em outra categoria, faz jus ao certificado de aeronavegabilidade
  se a ANAC, após vistoriar a aeronave, considerar a mesma em bom estado de conservação e
  em condições de operação segura.
