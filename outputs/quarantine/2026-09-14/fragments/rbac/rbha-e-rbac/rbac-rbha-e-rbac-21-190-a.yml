title: 21.190(a)
text: '(a) Propósito. A ANAC emite um certificado de aeronavegabilidade especial na categoria
  leve esportiva para operação de uma aeronave leve esportiva, exceto para girocóptero. (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
