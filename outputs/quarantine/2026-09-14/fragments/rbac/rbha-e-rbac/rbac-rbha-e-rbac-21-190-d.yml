cite: 21.190(d)
title: 21.190(d)
text: '(d) Aeronave leve esportiva fabricada fora do Brasil. Para uma aeronave fabricada fora
  do Brasil ser elegível a um certificado de aeronavegabilidade especial na categoria leve
  esportiva, o requerente deve cumprir os requisitos do parágrafo (b) desta seção e fornecer
  à ANAC evidências de que:

  (1) [reservado]; e

  (2) a aeronave é elegível a um certificado de aeronavegabilidade, uma autorização de voo
  ou certificação similar no seu país de fabricação.'
