cite: 21.191(d)
title: 21.191(d)
text: (d) exibição. Exibição das qualidades de voo, de desempenho ou de características peculiares
  da aeronave em demonstrações, produções cinematográficas, programas de televisão e outras
  produções similares, bem como manutenção da proficiência das tripulações na condução de
  tais exibições, incluindo (para tais tripulantes) a execução dos voos de e para os locais
  de tais demonstrações e produções.
