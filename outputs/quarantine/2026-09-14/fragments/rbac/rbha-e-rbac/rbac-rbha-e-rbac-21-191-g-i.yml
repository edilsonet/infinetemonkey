title: 21.191(g-I)
text: '(g)-I

  operação de aeronave de construção amadora. Operação de aeronave cuja porção maior foi construída
  por pessoas que realizaram a construção unicamente para sua própria educação ou recreação.
  O certificado em questão não será emitido para aeronave construída de forma seriada ou importada
  pronta. (

  Redação dada pela Resolução nº 544, de 04.03.2020

  )'
