text: '(i) Para aeronave importada, esta deve ser nova, tendo sido de propriedade apenas do
  seu fabricante, distribuidor ou revendedor ou ter tido, previamente, um certificado de aeronavegabilidade
  especial, categoria leve esportiva, de acordo com a seção 21.190. (

  Incluído pela Resolução nº 544, de 04.03.2020

  )

  (

  Redação dada pela Resolução nº 210, de 29.11.2011

  )'
