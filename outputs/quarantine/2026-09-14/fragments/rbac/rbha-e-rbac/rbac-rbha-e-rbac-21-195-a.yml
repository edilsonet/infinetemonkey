cite: 21.195(a)
title: 21.195(a)
text: (a) O fabricante de uma aeronave produzida no Brasil pode requerer um certificado de
  autorização de voo experimental para uma aeronave que será usada para pesquisa de mercado,
  demonstrações para venda e treinamento de tripulações de um comprador.
