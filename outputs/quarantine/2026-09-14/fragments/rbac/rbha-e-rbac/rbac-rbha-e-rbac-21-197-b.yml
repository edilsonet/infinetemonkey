section_title: Autorização especial de voo
subsection_id: b
cite: 21.197(b)
title: 21.197(b)
text: (b) Uma autorização especial de voo pode ser emitida para permitir a operação de uma
  aeronave com peso superior ao seu peso máximo de decolagem aprovado em voo sobre água ou
  sobre áreas terrestres sem aeródromos com condições adequadas de pouso ou abastecimento
  e que exijam um alcance maior que o alcance normal da aeronave. O excesso de peso que pode
  ser autorizado por este parágrafo é limitado a combustível adicional, equipamentos para
  transporte desse combustível e equipamentos especiais de navegação eventualmente necessários
  ao voo.
