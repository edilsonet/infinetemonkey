section_title: Emissão de autorizações especiais de voo
subsection_id: a
cite: 21.199(a)
title: 21.199(a)
text: '(a) Exceto como previsto no parágrafo 21.197(c), o requerente de uma autorização especial
  de voo deve apresentar uma declaração, na maneira estabelecida pela ANAC, informando:

  (1) o propósito do voo;

  (2) a rota proposta;

  (3) a tripulação necessária para operar a aeronave e seus equipamentos, como, por exemplo,
  piloto, copiloto e navegador;

  (4) os motivos pelos quais a aeronave não está conforme os requisitos de aeronavegabilidade
  aplicáveis, se houver;

  (5) qualquer restrição ou limitação que o requerente considere necessária para a operação
  segura da aeronave; e

  (6) qualquer outra informação requerida pela ANAC, com o propósito de avaliar a necessidade
  do estabelecimento de limitações operacionais adicionais.'
