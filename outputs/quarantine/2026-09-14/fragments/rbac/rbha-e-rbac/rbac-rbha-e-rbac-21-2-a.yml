section_title: Falsificação de requerimentos, relatórios ou registros
subsection_id: a
cite: 21.2(a)
title: 21.2(a)
text: '(a) Nenhuma pessoa pode fazer ou dar causa a que seja feita:

  (1) qualquer declaração fraudulenta, intencionalmente falsa, que omite ou induz ao erro
  em qualquer requerimento referente à emissão de um certificado ou aprovação segundo este
  regulamento;

  (2) qualquer informação fraudulenta, intencionalmente falsa, que omite ou induz ao erro
  em registro ou relatório que deva ser mantido, elaborado ou usado para demonstrar conformidade
  com qualquer requisito deste regulamento;

  (3) qualquer reprodução, com propósitos fraudulentos, de qualquer certificado ou aprovação
  emitidos segundo este regulamento; ou

  (4) qualquer alteração em qualquer certificado ou aprovação emitidos segundo este regulamento.'
