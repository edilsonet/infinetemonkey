subsection_id: b
cite: 21.21(b)
title: 21.21(b)
text: '(b) submeter o projeto de tipo, os relatórios de ensaios e os cálculos necessários
  para demonstrar que o produto a ser certificado atende aos requisitos aplicáveis dos RBAC
  de aeronavegabilidade e de proteção ambiental e a qualquer condição especial, estabelecida
  segundo a seção 21.16, e a ANAC considerar: (

  Redação dada pela Resolução nº 501, de 12.12.2018

  )

  (1) mediante exame do projeto de tipo e após completados todos os ensaios e inspeções, que
  o projeto de tipo e o produto satisfazem aos requisitos aplicáveis dos RBAC de aeronavegabilidade
  e de proteção ambiental e que quaisquer disposições de aeronavegabilidade não cumpridas
  foram compensadas por fatores que fornecem um nível de segurança equivalente; e (

  Redação dada pela Resolução nº 501, de 12.12.2018

  )

  (2) no caso de uma aeronave, que nenhum aspecto ou característica torna a aeronave insegura
  para a categoria na qual a certificação foi requerida; ou'
