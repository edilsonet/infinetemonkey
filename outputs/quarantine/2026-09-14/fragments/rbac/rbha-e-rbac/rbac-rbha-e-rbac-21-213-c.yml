title: 21.213(c)
text: (c) Um fabricante de motores que fabrique seus motores no Brasil e que tenha alterado
  uma aeronave de tipo certificado através da instalação de motores certificados diferentes
  dos motores originalmente instalados na aeronave pode requerer um certificado de aeronavegabilidade
  provisório Classe I, desde que a aeronave, antes da modificação, tenha sido de tipo certificado
  na categoria, normal, utilidade, acrobática, transporte regional ou transporte.
