title: Validade
text: '21.217 Validade

  A menos que seja devolvido por seu detentor, substituído, cassado, suspenso ou de outra
  forma terminado, o certificado de aeronavegabilidade provisório tem a validade igual à validade
  do correspondente certificado de tipo provisório, emenda provisória ao certificado de tipo
  ou emenda ao certificado de tipo provisório.'
