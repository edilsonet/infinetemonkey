section_title: Certificado de aeronavegabilidade provisório Classe I
subsection_id: c
cite: 21.221(c)
title: 21.221(c)
text: (c) O fabricante da aeronave deve fornecer uma declaração assegurando que a mesma está
  conforme o projeto de tipo correspondente ao certificado de tipo provisório e foi considerada
  por ele como estando em condições de operar com segurança, dentro das limitações aplicáveis.
