cite: 21.223(c)
title: 21.223(c)
text: '(c) O requerente deve fornecer uma declaração do fabricante assegurando que a aeronave
  foi fabricada sob um sistema da qualidade adequado para assegurar que a aeronave está em
  conformidade com o projeto de tipo correspondente ao certificado de tipo provisório. (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
