title: Requerimento
text: '21.234-I Requerimento

  O requerimento para a emissão de certificado de organização de projeto deve ser efetuado
  conforme estabelecido pela ANAC e incluir informações exigidas pela seção 21.243-I, bem
  como os termos da certificação requeridos de acordo com a seção 21.251-I.'
