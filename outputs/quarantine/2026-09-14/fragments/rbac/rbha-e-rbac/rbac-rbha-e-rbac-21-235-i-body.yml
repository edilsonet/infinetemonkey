title: Emissão do certificado de organização de projeto
text: '21.235-I Emissão do certificado de organização de projeto

  Uma organização apenas pode ser detentora de um certificado de organização de projeto emitido
  pela ANAC após demonstrar o cumprimento com os requisitos aplicáveis estabelecidos nesta
  subparte.'
