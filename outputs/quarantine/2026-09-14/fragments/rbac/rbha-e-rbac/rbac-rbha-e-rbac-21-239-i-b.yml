title: 21.239-I(b)
text: (b) O sistema de garantia do projeto deve incluir uma função de verificação independente
  das demonstrações de cumprimento com os requisitos, que servirá de base para a organização
  apresentar à ANAC declarações de cumprimento com os requisitos e a documentação associada.
