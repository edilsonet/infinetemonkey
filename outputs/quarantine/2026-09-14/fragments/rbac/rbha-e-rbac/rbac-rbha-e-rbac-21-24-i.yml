section_title: 'Emissão de certificado de tipo: aeronave categoria primária'
subsection_id: i
cite: 21.24(i)
title: 21.24(i)
text: '(i) a aeronave atende aos requisitos de aeronavegabilidade aplicáveis e aprovados segundo
  o parágrafo 21.17(f); e

  (ii) a aeronave não apresenta nenhuma particularidade ou característica que a torne insegura
  para a utilização pretendida.'
