cite: 21.245-I(a)
title: 21.245-I(a)
text: '(a) todos os departamentos técnicos dispõem de pessoal em número, experiência e qualificação
  suficientes, que tenha recebido autoridade devida para exercer as responsabilidades alocadas
  e que, juntamente com a infraestrutura, instalações e equipamentos, são adequados a fim
  de permitir a este pessoal que alcance os objetivos relacionados com objetivos de aeronavegabilidade
  e de proteção ambiental para o produto; (

  Redação dada pela Resolução nº 501, de 12.12.2018

  )'
