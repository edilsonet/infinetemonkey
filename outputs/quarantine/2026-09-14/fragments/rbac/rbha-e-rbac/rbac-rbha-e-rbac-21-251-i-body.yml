title: Termos da certificação
text: '21.251-I Termos da certificação

  Os termos da certificação devem identificar os tipos de atividades de projeto e as categorias
  de produtos e artigos relativamente aos quais foi emitido o certificado de organização de
  projeto, bem como as funções e as tarefas para as quais a organização foi certificada no
  que se refere aos requisitos de aeronavegabilidade e ao nível de proteção ambiental dos
  produtos. Os termos da certificação são parte integrante do certificado de organização de
  projeto. (

  Redação dada pela Resolução nº 501, de 12.12.2018

  )'
