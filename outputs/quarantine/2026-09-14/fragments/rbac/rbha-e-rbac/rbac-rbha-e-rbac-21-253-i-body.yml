title: Emendas aos termos da certificação
text: '21.253-I Emendas aos termos da certificação

  As emendas aos termos da certificação devem ser aprovadas pela ANAC. Os pedidos de emenda
  devem ser efetuados segundo a forma e o procedimento estabelecidos pela Agência. A organização
  de projeto deve cumprir com os requisitos aplicáveis desta subparte.'
