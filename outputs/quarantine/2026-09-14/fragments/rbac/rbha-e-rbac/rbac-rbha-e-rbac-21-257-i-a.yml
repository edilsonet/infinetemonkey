cite: 21.257-I(a)
title: 21.257-I(a)
text: (a) A organização de projeto deve permitir que a ANAC realize quaisquer averiguações
  necessárias, incluindo averiguações dos fornecedores, a fim de verificar o cumprimento e
  a manutenção do cumprimento com os requisitos aplicáveis desta subparte. A organização de
  projeto deve estabelecer meios que viabilizem as averiguações. Os processos da empresa,
  sujeitos à aprovação, serão verificados pela ANAC em ciclos regulares.
