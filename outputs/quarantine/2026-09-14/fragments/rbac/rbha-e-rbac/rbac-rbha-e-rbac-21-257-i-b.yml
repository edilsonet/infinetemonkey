cite: 21.257-I(b)
title: 21.257-I(b)
text: (b) A organização de projeto deve estabelecer procedimentos que viabilizem à ANAC analisar
  quaisquer relatórios e realizar quaisquer inspeções, assim como, realizar ou testemunhar
  quaisquer ensaios em voo e no solo considerados necessários, a fim de verificar a validade
  das declarações de cumprimento com os requisitos apresentadas pelo requerente, conforme
  a seção 21.239-I, parágrafo (b).
