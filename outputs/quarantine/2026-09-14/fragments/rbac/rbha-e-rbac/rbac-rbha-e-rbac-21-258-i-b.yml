title: 21.258-I(b)
text: (b) No caso de constatação que configure uma não conformidade aos requisitos aplicáveis,
  cujos efeitos possam afetar adversamente a segurança da aeronave, a organização de projeto
  deve comprovar que tais efeitos estão controlados e/ou contidos, caso contrário, o certificado
  de organização de projeto pode ser suspenso ou revogado, por meio dos procedimentos administrativos
  aplicáveis estabelecidos pela ANAC. O detentor do certificado de organização de projeto
  deve confirmar, tempestivamente, o recebimento do aviso de suspensão ou revogação do certificado.
