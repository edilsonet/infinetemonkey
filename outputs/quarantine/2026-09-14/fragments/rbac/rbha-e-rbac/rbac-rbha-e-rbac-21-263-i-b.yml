title: 21.263-I(b)
text: '(b) Sujeito ao disposto na seção 21.257-I, parágrafo (b), o detentor de um certificado
  de organização de projeto pode submeter documentos de cumprimento com os requisitos, os
  quais a ANAC aceitará sem verificações adicionais. Os documentos visam à obtenção de:

  (1) [Reservado];

  (2) um certificado de tipo segundo a Subparte B deste regulamento ou da emenda ao certificado
  de tipo segundo a Subparte D deste regulamento;

  (3) um certificado suplementar de tipo segundo a Subparte E deste regulamento;

  (4) [Reservado];

  (5) uma aprovação de projeto de grande reparo conforme os RBACs nºs 26 ou 43.'
