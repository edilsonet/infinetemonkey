section_title: 'Emissão de certificado de tipo: conversão de aeronaves militares para emprego
  civil'
subsection_id: a
cite: 21.27(a)
title: 21.27(a)
text: (a) Exceto como previsto no parágrafo (b) desta seção, o requerente faz jus a um certificado
  de tipo nas categorias normal, utilidade, acrobática, transporte regional ou transporte
  para uma aeronave que tenha sido projetada e construída para uso militar, aceita para emprego
  operacional e declarada excedente por uma das Forças Armadas do Brasil se demonstrar que
  a aeronave a ser certificada satisfaz aos requisitos de aeronavegabilidade aplicáveis que
  estavam em vigor na data em que a primeira aeronave do modelo particular foi aceita para
  uso operacional em uma das Forças Armadas do Brasil.
