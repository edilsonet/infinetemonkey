subsection_id: d
cite: 21.27(d)
title: 21.27(d)
text: (d) A ANAC pode dispensar a estrita observância de um requisito específico se julgar
  que o método para demonstrar cumprimento proposto pelo requerente proporciona substancialmente
  o mesmo nível de aeronavegabilidade e que a estrita observância do referido requisito irá
  impor um severo ônus ao requerente. Para essa decisão, a experiência das Forças Armadas
  do Brasil que conduziram a qualificação original da aeronave pode ser utilizada.
