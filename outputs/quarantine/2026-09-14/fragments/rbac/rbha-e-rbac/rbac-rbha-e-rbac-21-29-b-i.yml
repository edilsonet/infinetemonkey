section_title: 'Emissão de certificado de tipo: produtos importados'
subsection_id: b-i
cite: 21.29(b-I)
title: 21.29(b-I)
text: (b)-I No caso de não existir um acordo para aceitação de importação e exportação com
  o país fabricante de determinado produto que se queira importar para o Brasil, o certificado
  de tipo para importação pode ser emitido com base no reconhecimento do certificado de tipo
  emitido pelo país de origem do produto, desde que a autoridade de aviação civil do país
  exportador certifique que o requerente cumpriu com o estabelecido no parágrafo (a)(1) desta
  seção, bem como com qualquer requisito adicional que venha a ser estabelecido pela ANAC.
