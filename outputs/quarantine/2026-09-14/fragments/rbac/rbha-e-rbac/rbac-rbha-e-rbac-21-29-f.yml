section_title: 'Emissão de certificado de tipo: produtos importados'
subsection_id: f
cite: 21.29(f)
title: 21.29(f)
text: '(f)- I Cada requerente de certificado de tipo para produto importado de avião categoria
  transporte movido a turbina cujo certificado no país de origem tenha sido emitido depois
  de 1º de janeiro de 1958 e que tenha ou uma capacidade máxima certificada de passageiros
  de 30 ou mais ou uma carga paga máxima certificada de 3402 kg (7500 lb) ou mais deve:

  (1) assegurar que o projeto cumpre os requisitos da seção 25.901 e dos parágrafos 25.981(a)
  e (b), do RBHA/RBAC 25 emenda 102, ou requisitos equivalentes de emendas posteriores; e

  (2) desenvolver todas as instruções de manutenção e inspeção necessárias para manter as
  características de projeto requeridas para eliminar a existência ou desenvolvimento de uma
  fonte de ignição dentro do sistema de tanque de combustível do avião.

  (Incluído pela Resolução 624, de 07.06.2021)'
