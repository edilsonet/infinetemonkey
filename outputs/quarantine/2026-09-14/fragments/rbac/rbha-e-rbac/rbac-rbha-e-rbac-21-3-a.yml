cite: 21.3(a)
title: 21.3(a)
text: '(a) O detentor de um certificado de tipo (incluindo emendas ou um certificado suplementar
  de tipo), de um certificado de produto aeronáutico aprovado (incluindo os emitidos sob uma
  ordem técnica padrão) ou, ainda, o licenciado de um certificado de tipo (incluindo outras
  aprovações de projeto) deve comunicar à ANAC qualquer falha, mau funcionamento ou defeito
  em qualquer produto ou artigo fabricado por ele que tenha resultado em qualquer uma das
  ocorrências listadas no parágrafo (c) desta seção. (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
