title: 21.3(d)
text: '(d) Os requisitos do parágrafo (a) desta seção não se aplicam para:

  (1) falhas, mau funcionamento ou defeitos que o detentor de um certificado de tipo (incluindo
  emendas ou um certificado suplementar de tipo), de um certificado de produto aeronáutico
  aprovado (incluindo os emitidos sob uma ordem técnica padrão) ou, ainda, o licenciado de
  um certificado de tipo (incluindo outras aprovações de projeto):'
