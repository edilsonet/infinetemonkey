title: 21.3(e)
text: '(e) Cada comunicação requerida por esta seção:

  (1) deve ser enviada à ANAC no prazo máximo de um dia útil após ser determinado que ocorreu
  uma falha, mau funcionamento ou defeito que requeira ser comunicado;

  (2) deve ser transmitida da forma e maneira aceitável pela ANAC e pelo meio mais rápido
  disponível; e (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )

  (3) deve incluir, tanto quanto possível, as seguintes informações, desde que elas estejam
  disponíveis ou sejam aplicáveis:'
