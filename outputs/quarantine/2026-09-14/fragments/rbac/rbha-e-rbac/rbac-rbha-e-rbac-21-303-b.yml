title: 21.303(b)
text: '(b) O requerente de um certificado de produto aeronáutico aprovado e/ou do certificado
  de organização de produção deve executar todos os ensaios e as inspeções necessários para
  determinar:

  (1) o cumprimento com os requisitos de aeronavegabilidade aplicáveis;

  (2) que os materiais utilizados estão em conformidade com as especificações de projeto;

  (3) que a peça está em conformidade com seu projeto aprovado; e

  (4) que os processos de fabricação, construção e montagem estão em conformidade com aqueles
  especificados no projeto.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
