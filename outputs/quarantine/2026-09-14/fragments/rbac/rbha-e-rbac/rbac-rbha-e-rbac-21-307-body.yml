text: '21.307 Sistema da qualidade

  Cada requerente ou detentor de um certificado de organização de produção deve estabelecer
  um sistema da qualidade que atenda aos requisitos da seção 21.137.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
