text: '21.308 Manual da qualidade

  Cada requerente ou detentor de uma aprovação de produção deve fornecer um manual descrevendo
  seu sistema da qualidade para a ANAC para aprovação. O manual deve estar no idioma português
  ou inglês e em formato aceitável pela a ANAC.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
