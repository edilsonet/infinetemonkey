cite: 21.309(c)
title: 21.309(c)
text: '(c) O detentor de um certificado de organização de produção deve notificar imediatamente
  a ANAC, por escrito, de qualquer alteração nas instalações de fabricação que possa afetar
  a inspeção, conformidade ou aeronavegabilidade do seu produto ou artigo.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
