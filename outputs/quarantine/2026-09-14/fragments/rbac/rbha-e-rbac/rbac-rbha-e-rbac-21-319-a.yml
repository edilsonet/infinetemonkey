cite: 21.319(a)
title: 21.319(a)
text: '(a) Classificação das modificações de projeto.

  (1) Uma pequena modificação de projeto de um artigo aprovado segundo um certificado de produto
  aeronáutico aprovado é aquela que não tem efeito apreciável na base de certificação; e

  (2) Uma grande modificação de projeto de um artigo aprovado segundo um certificado de produto
  aeronáutico aprovado é qualquer mudança que não seja classificada como pequena.'
