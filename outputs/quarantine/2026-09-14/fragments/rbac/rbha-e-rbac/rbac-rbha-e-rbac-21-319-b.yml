cite: 21.319(b)
title: 21.319(b)
text: '(b) Aprovação de modificações de projeto.

  (1) As pequenas modificações no projeto básico de um certificado de produto aeronáutico
  aprovado podem ser aprovadas utilizando um método aceitável pela ANAC; e

  (2) O detentor de um certificado de produto aeronáutico aprovado deve obter a aprovação
  da ANAC para qualquer grande modificação antes de incluí-la no projeto do artigo produzido
  sob um certificado de organização de produção.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
