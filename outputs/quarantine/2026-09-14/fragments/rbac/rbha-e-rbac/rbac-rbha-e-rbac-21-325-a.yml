section_title: Aprovação de aeronavegabilidade para exportação
subsection_id: a
cite: 21.325(a)
title: 21.325(a)
text: (a) Uma aprovação de aeronavegabilidade para exportação para aeronaves é emitida na
  forma de um Certificado de Aeronavegabilidade para Exportação. Tal certificado não autoriza
  a operação da aeronave.
