text: '(a) Um requerente faz jus a um certificado de aeronavegabilidade para exportação para
  uma aeronave se:

  (1) aeronaves novas ou usadas, fabricadas segundo as subpartes F ou G deste regulamento,
  devem cumprir as exigências necessárias à obtenção de um certificado de aeronavegabilidade
  segundo a subparte H deste regulamento para:'
