section_title: Emissão de certificado de aeronavegabilidade para exportação
subsection_id: b
cite: 21.329(b)
title: 21.329(b)
text: '(b) Um produto pode não atender aos requisitos estabelecidos no parágrafo (a) desta
  seção, como aplicável, se:

  (1) o país importador considerar aceitável um desvio daquele requisito, apresentado de forma
  e maneira aceitável pela ANAC; e

  (2) o certificado de aeronavegabilidade para exportação listar como exceção qualquer diferença
  entre a aeronave a ser exportada e o seu certificado de tipo.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
