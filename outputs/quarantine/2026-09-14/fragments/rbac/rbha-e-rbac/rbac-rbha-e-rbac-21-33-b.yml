cite: 21.33(b)
title: 21.33(b)
text: '(b) O requerente deve executar todos os ensaios e as inspeções necessários para determinar:

  (1) o cumprimento com os requisitos de aeronavegabilidade e de proteção ambiental; (

  Redação dada pela Resolução nº 501, de 12.12.2018

  )

  (2) que os materiais e produtos estão conforme as especificações do projeto de tipo;

  (3) que as peças do produto estão conforme os desenhos do projeto de tipo; e

  (4) que os processos de fabricação, construção e montagem estão conforme aqueles especificados
  no projeto de tipo.'
