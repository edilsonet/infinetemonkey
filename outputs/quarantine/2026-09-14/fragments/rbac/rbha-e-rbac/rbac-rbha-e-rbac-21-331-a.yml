subsection_id: a
cite: 21.331(a)
title: 21.331(a)
text: (a) Uma pessoa pode obter da ANAC uma aprovação de aeronavegabilidade para exportar
  um motor de aeronave, uma hélice ou um artigo novos que foi fabricado de acordo com este
  regulamento se o produto estiver conforme os dados de projeto aprovado e em condição de
  operação segura.
