section_title: Emissão de aprovação de aeronavegabilidade para exportação para motores de
  aeronaves, hélices e artigos
subsection_id: b
cite: 21.331(b)
title: 21.331(b)
text: '(b) Um motor de aeronave, uma hélice ou um artigo novos pode não atender aos requisitos
  especificados no parágrafo (a) desta seção se:

  (1) o país importador considerar aceitável um desvio deste requisito, apresentado de forma
  e maneira aceitável pela ANAC; e

  (2) a aprovação de aeronavegabilidade para exportação listar como uma exceção qualquer diferença
  entre o motor de aeronave, a hélice ou o artigo a ser exportado e a aprovação de projeto.'
