subsection_id: c
cite: 21.331(c)
title: 21.331(c)
text: (c) Uma pessoa pode obter da ANAC uma aprovação de aeronavegabilidade para exportação
  para exportar um motor de aeronave, uma hélice ou um artigo usados se estes estiverem em
  conformidade com seu projeto aprovado e em condições de operação segura.
