subsection_id: d
cite: 21.331(d)
title: 21.331(d)
text: '(d) Um motor de aeronave ou uma hélice usados podem não atender aos requisitos do parágrafo
  (c) desta seção se:

  (1) o país importador considerar aceitável um desvio deste requisito, apresentado de forma
  e maneira aceitável pela ANAC; e

  (2) a aprovação de aeronavegabilidade para exportação listar como uma exceção qualquer diferença
  entre o motor de aeronave ou a hélice usados a ser exportado e seu projeto aprovado.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
