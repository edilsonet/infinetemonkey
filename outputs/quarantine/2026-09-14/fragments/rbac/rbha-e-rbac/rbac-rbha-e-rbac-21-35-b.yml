cite: 21.35(b)
title: 21.35(b)
text: '(b) Após demonstrar cumprimento com o parágrafo (a) desta seção, o requerente deve
  realizar todos os ensaios em voo que a ANAC julgar necessários para:

  (1) determinar cumprimento com os requisitos aplicáveis dos RBAC; e

  (2) determinar se existe razoável segurança de que a aeronave, seus componentes e seus equipamentos
  são confiáveis e funcionam adequadamente. Entretanto, planadores e motoplanadores e aviões
  de baixa velocidade de níveis de certificação 1 ou 2 como definido no RBAC 23 não necessitam
  executar ensaios de funcionamento e de confiabilidade. (

  Redação dada pela Resolução nº 524, de 02.08.2019

  )'
