title: 21.35(c)
text: '(c) O requerente, se praticável, deve fazer os ensaios previstos no parágrafo (b)(2)
  desta seção na mesma aeronave usada para demonstrar concordância com:

  (1) o parágrafo (b)(1) desta seção; e

  (2) para aeronaves com asas rotativas, os ensaios de durabilidade do sistema de acionamento
  dos rotores estabelecidos nas seções 27.923 do RBAC 27 ou 29.923 do RBAC 29.'
