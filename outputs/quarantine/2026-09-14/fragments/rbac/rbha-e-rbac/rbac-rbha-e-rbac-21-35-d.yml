title: 21.35(d)
text: (d) O requerente deve demonstrar, para cada ensaio em voo (exceto para planadores e
  balões livres tripulados), que precauções adequadas foram tomadas a fim de garantir que
  a tripulação possa abandonar a aeronave em caso de emergência, com o uso de paraquedas.
