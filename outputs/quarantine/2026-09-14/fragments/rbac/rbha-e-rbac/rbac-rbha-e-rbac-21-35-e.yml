title: 21.35(e)
text: '(e) Exceto para planadores e balões livres tripulados, o requerente deve interromper
  os ensaios em voo estabelecidos por esta seção, até demonstrar que ações corretivas foram
  tomadas, sempre que:

  (1) o piloto de ensaios do requerente não for capaz de executar ou não concordar com a execução
  de qualquer dos ensaios em voo requeridos; ou

  (2) for verificado o não cumprimento de itens dos requisitos que possam invalidar os resultados
  de ensaios em voo adicionais ou tornar desnecessariamente perigosos os ensaios posteriores.'
