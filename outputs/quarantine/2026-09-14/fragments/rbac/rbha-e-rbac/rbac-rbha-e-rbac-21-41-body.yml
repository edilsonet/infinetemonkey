title: Certificado de tipo
text: '21.41 Certificado de tipo

  Considera-se que cada certificado de tipo inclui o projeto de tipo, as limitações operacionais,
  a especificação de tipo do produto, os RBAC aplicáveis com os quais foi demonstrado cumprimento
  e quaisquer outras condições ou limitações estabelecidas para o produto de acordo com este
  regulamento.'
