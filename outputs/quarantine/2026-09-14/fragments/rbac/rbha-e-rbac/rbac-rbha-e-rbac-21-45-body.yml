text: '21.45 Prerrogativas

  O detentor de um certificado de tipo, de um licenciamento de certificado de tipo ou de um
  certificado de tipo estrangeiro que tenha sido reconhecido no Brasil de acordo com o estabelecido
  nos parágrafos 21.29(d)-I e 21.29(e)-I pode:'
