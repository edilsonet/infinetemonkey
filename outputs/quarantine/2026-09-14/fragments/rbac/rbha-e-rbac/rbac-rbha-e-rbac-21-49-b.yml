title: 21.49(b)
text: '(b) I Relatórios apresentados em cumprimento ao RBHA-E 88 vigente até 30 de junho de
  2021, ou SFAR 88, devem ser mantidos e colocados à disposição da ANAC sempre que requerido,
  a fim de assegurar o nível aceitável de segurança operacional. (

  Redação dada pela Resolução nº 624, de 07.06.2021

  )'
