cite: 21.50(i)
title: 21.50(i)
text: '(i) a falha da parte comercial, como instalada no produto, não irá degradar o nível
  de segurança do produto; e

  (ii) a parte é produzida somente sob as especificações do fabricante da parte comercial
  e marcada somente com as marcações do fabricante da parte comercial; e

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )

  (3) qualquer outro dado necessário para a ANAC aprovar a lista.'
