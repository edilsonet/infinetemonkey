text: '21.51 Validade

  A menos que a ANAC tenha estabelecido um prazo de validade, um certificado de tipo ou uma
  isenção ao mesmo tem validade até ser suspenso ou cassado pela ANAC, ou devolvido por seu
  detentor.'
