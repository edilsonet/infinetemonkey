title: 21.53(a)
text: '(a) O requerente deve submeter à ANAC, da forma e maneira aceitável pela ANAC, uma
  declaração de conformidade para cada motor e hélice apresentados para certificação de tipo.
  Esta declaração de conformidade deve incluir a declaração de que o motor ou a hélice está
  conforme seu respectivo projeto de tipo. (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
