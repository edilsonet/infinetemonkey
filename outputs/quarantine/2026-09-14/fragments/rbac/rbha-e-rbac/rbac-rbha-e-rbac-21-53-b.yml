cite: 21.53(b)
title: 21.53(b)
text: (b) O requerente deve submeter uma declaração de conformidade à ANAC para cada aeronave
  ou peça da mesma apresentada à ANAC para ensaios. A declaração de conformidade deve incluir
  a declaração de que o requerente cumpriu o previsto no parágrafo 21.33(a), a menos que de
  outra forma autorizado segundo o mesmo parágrafo.
