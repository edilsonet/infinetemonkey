title: Apresentação do acordo de licenciamento
text: '21.55 Apresentação do acordo de licenciamento

  Um detentor de um certificado de tipo que permite que uma pessoa o utilize para fabricar
  uma aeronave nova, um motor novo ou uma hélice nova deve prover a tal pessoa um acordo de
  licenciamento que seja aceitável pela ANAC.

  SUBPARTE C

  CERTIFICADO DE TIPO PROVISÓRIO'
