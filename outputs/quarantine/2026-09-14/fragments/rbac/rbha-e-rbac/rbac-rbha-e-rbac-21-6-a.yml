section_title: Fabricação de aeronaves, motores de aeronave ou hélices novos
subsection_id: a
cite: 21.6(a)
title: 21.6(a)
text: '(a) Uma pessoa somente pode fabricar uma aeronave nova, um motor de aeronave novo ou
  uma hélice nova conforme um certificado de tipo se:

  (1) ela for detentora de um certificado de tipo ou tiver um acordo de licenciamento com
  o detentor do certificado de tipo autorizando a fabricação do produto; e

  (2) cumprir os requisitos das subpartes F ou G deste regulamento.'
