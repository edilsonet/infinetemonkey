title: 21.603(b)
text: '(b) Quando for prevista uma série de pequenas modificações, conforme estabelecido na
  seção 21.619, o requerente pode especificar, em seu requerimento, o número do modelo básico
  do artigo, seguido do número da peça (

  part number

  ) dos componentes com parêntesis em aberto, indicando que serão acrescentadas, periodicamente,
  letras ou algarismos (ou combinação deles) indicativos de modificações.'
