title: Manual da qualidade
text: '21.608 Manual da qualidade

  Cada requerente ou detentor de um certificado de organização de produção conforme esta subparte
  deve fornecer um manual descrevendo seu sistema da qualidade para a ANAC para aprovação.
  O manual deve estar no idioma português ou inglês e em formato aceitável pela a ANAC.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
