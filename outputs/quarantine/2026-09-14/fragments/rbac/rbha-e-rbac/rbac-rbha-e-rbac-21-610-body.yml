title: Inspeções e ensaios
text: '21.610 Inspeções e ensaios

  Cada requerente ou detentor de um certificado de produto aeronáutico aprovado segundo uma
  OTP e/ou certificado de organização de produção deve permitir que a ANAC inspecione o seu
  sistema da qualidade, instalações, dados técnicos, e quaisquer artigos manufaturados e testemunhar
  quaisquer ensaios, incluindo as inspeções ou ensaios em uma instalação de fornecedor, necessários
  para determinar o cumprimento com os RBAC aplicáveis.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
