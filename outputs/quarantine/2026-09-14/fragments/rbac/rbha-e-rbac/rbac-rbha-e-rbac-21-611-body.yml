title: Emissão
text: '21.611 Emissão

  Se a ANAC considerar que o requerente cumpriu com os requisitos dos RBAC aplicáveis, a ANAC
  emitirá um certificado de produto aeronáutico aprovado segundo uma OTP (incluindo quaisquer
  desvios a OTP concedidos ao requerente) e/ou o certificado de organização de produção.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
