cite: 21.613(a)
title: 21.613(a)
text: (a) Um certificado de produto aeronáutico aprovado segundo uma OTP e/ou um certificado
  de organização de produção é(são) válido(s) até que seja(m) devolvido(s), suspenso(s), revogado(s),
  cassado(s) ou que tenha(m) uma data de validade estabelecida pela ANAC.
