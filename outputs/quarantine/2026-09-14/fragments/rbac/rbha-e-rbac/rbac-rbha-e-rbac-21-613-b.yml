title: 21.613(b)
text: '(b) Se uma norma OTP for revisada ou cancelada, o detentor de uma carta de aceitação
  da ANAC para uma declaração de conformidade, um detentor de um certificado de produto aeronáutico
  segundo uma OTP ou uma carta de aprovação de projeto segundo uma OTP poderá continuar a
  produzir o artigo atendendo a versão da norma OTP válida no momento da aprovação do artigo
  afeto, sem que tenham que obter uma nova aceitação, autorização ou aprovação, mas deverá
  cumprir com os requisitos dos RBAC aplicáveis.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
