cite: 21.619(a)
title: 21.619(a)
text: (a) Pequenas modificações. O fabricante de um artigo, de acordo com um certificado de
  produto aeronáutico aprovado segundo uma OTP, pode fazer pequenas modificações no projeto
  aprovado sem precisar solicitar aprovação da ANAC. Nesse caso, o artigo modificado deve
  conservar o número do modelo original (números de peça podem ser usados para identificar
  a pequena modificação) e o fabricante deve enviar à ANAC todos os dados revisados que se
  fizerem necessários para atender ao parágrafo 21.603(b).
