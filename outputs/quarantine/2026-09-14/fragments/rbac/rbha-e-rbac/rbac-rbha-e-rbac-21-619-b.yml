cite: 21.619(b)
title: 21.619(b)
text: (b) Grandes modificações. Qualquer modificação, feita pelo fabricante, no projeto de
  um artigo aprovado de acordo com um certificado de produto aeronáutico aprovado segundo
  uma OTP, e que seja suficientemente extensa para exigir substancial e completa investigação
  para verificar a conformidade do artigo com a OTP aplicável, é considerada uma grande modificação.
  Antes de introduzir tal modificação, o fabricante deve designar um novo tipo ou modelo para
  o artigo e deve requerer um novo certificado de produto aeronáutico aprovado segundo uma
  OTP, como estabelecido na seção 21.603.
