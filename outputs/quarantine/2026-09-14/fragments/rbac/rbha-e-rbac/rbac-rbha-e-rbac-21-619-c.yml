cite: 21.619(c)
title: 21.619(c)
text: '(c) Modificações introduzidas por uma pessoa que não o fabricante do artigo. Nenhuma
  modificação de projeto feita por uma pessoa (que não seja o fabricante que possa emitir
  a declaração de conformidade para o artigo) pode receber aprovação segundo este regulamento,
  a menos que a pessoa interessada seja um fabricante e requeira uma nova aprovação conforme
  estabelecido no parágrafo 21.603(a). Entretanto, pessoas que não sejam fabricantes podem
  requerer aprovação de modificações de projeto segundo o RBAC 43 ou de acordo com os regulamentos
  de aeronavegabilidade aplicáveis.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
