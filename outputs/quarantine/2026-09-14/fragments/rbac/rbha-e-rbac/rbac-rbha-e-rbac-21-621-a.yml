cite: 21.621(a)
title: 21.621(a)
text: '(a) A ANAC pode emitir uma carta de aprovação de projeto segundo uma OTP para um artigo:

  (1) projetado e fabricado em outro país e que tenha firmado um acordo com o Brasil para
  a aceitação desses artigos para importação, ou, caso não haja tal acordo, se a ANAC considerar
  que os requisitos utilizados nesse país equivalem a ou superam os requisitos de desempenho
  estabelecidos na OTP aplicável, e, ainda, que o artigo é produzido segundo um sistema da
  qualidade similar ao estabelecido na seção 21.137; e

  (2) importado para Brasil se:'
