section_title: 'Emissão de carta de aprovação de projeto segundo uma OTP: artigos importados'
subsection_id: i
cite: 21.621(i)
title: 21.621(i)
text: '(i) o estado de projeto certificar que o artigo foi inspecionado, ensaiado e cumpre
  com os requisitos da OTP aplicável ou com os requisitos de desempenho aplicáveis do estado
  de projeto e com quaisquer outros requisitos de desempenho que a ANAC tenha prescrito para
  estabelecer um nível de segurança equivalente àquele previsto pela OTP; e

  (ii) o fabricante fornecer à ANAC uma cópia dos dados técnicos requeridos na norma de desempenho
  aplicável do estado de projeto.'
