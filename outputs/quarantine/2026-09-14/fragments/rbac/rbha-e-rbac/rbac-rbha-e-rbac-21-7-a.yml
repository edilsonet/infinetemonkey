title: 21.7(a)
text: (a) Desde 22/03/2010, o detentor de um projeto aprovado e um requerente para aprovação
  de um projeto deve cumprir com os requisitos aplicáveis de aeronavegabilidade continuada
  e de melhorias de segurança do RBAC 26.
