subsection_id: b
cite: 21.7(b)
title: 21.7(b)
text: (b) No caso de aviões novos categoria transporte, fabricados sob a autoridade da ANAC,
  o detentor do certificado de tipo, ou o licenciado, deve cumprir com os requisitos aplicáveis
  de aeronavegabilidade continuada e de melhoria da segurança do RBAC 26 para tais aviões.
  Estes requisitos se aplicam somente se a ANAC tiver jurisdição sobre a organização responsável
  pela montagem final do avião.
