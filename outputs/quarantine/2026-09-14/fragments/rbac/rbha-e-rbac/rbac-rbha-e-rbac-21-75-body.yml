title: Requerimento
text: '21.75 Requerimento

  Os requerimentos para obtenção de certificados de tipo provisórios, de emendas a tais certificados
  e de emendas provisórias a um certificado de tipo devem conter todas as informações requeridas
  por este regulamento e devem ser submetidos à ANAC.'
