title: 21.77(a)
text: (a) A menos que seja cassado, devolvido por seu detentor, substituído antes do término
  do prazo de validade ou de outra forma encerrado, um certificado de tipo provisório ou uma
  emenda a tal certificado é válido pelos períodos especificados nesta seção.
