cite: 21.81(c)
title: 21.81(c)
text: '(c) O requerente deve declarar que:

  (1) a aeronave foi projetada e construída de acordo com os requisitos de aeronavegabilidade
  aplicáveis à emissão do certificado de tipo ou certificado suplementar de tipo requerido
  para ela;

  (2) a aeronave satisfaz substancialmente aos requisitos de características de voo aplicáveis
  à emissão do certificado de tipo ou certificado suplementar de tipo requerido para ela;
  e

  (3) a aeronave pode ser operada com segurança de acordo com as limitações operacionais apropriadas
  estabelecidas segundo o parágrafo (a) desta seção.'
