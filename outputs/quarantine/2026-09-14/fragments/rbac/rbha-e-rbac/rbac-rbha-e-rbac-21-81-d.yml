cite: 21.81(d)
title: 21.81(d)
text: (d) O requerente deve apresentar um relatório comprovando que a aeronave foi operada
  em todas as manobras necessárias para demonstrar cumprimento com os requisitos de voo exigidos
  para ela e para estabelecer que a aeronave pode ser operada com segurança de acordo com
  as limitações estabelecidas nos RBAC aplicáveis.
