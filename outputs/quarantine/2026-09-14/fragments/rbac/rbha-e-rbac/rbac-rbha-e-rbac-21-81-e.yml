cite: 21.81(e)
title: 21.81(e)
text: (e) O requerente deve estabelecer todas as limitações requeridas para a emissão do certificado
  de tipo ou certificado suplementar de tipo requerido, incluindo limitações de peso, de velocidade,
  de manobras, de carregamentos e de operação dos controles e equipamentos, a menos que, para
  cada limitação não claramente estabelecida, restrições operacionais apropriadas à aeronave
  tenham sido estabelecidas.
