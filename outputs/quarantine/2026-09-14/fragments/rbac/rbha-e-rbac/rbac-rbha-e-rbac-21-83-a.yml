subsection_id: a
cite: 21.83(a)
title: 21.83(a)
text: (a) Um requerente que fabrica aeronaves no Brasil faz jus à emissão de um certificado
  de tipo provisório Classe II ou de emendas a tal certificado se demonstrar o cumprimento
  com os requisitos desta seção e se a ANAC julgar que não existe aspecto, característica
  ou condição que possa tornar a aeronave insegura quando operada de acordo com as limitações
  impostas pelo parágrafo (h) desta seção e com as seções 91.317 do RBHA 91, ou dispositivo
  correspondente do RBAC que venha a substituí-lo, e 121.207 do RBAC 121.
