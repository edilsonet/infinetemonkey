title: 21.83(e)
text: (e) O programa oficial de ensaios em voo da ANAC, ou o programa de ensaios em voo conduzido
  pela autoridade de aviação civil do país no qual a aeronave foi fabricada, visando à emissão
  do certificado de tipo, deve estar concluído ou em andamento.
