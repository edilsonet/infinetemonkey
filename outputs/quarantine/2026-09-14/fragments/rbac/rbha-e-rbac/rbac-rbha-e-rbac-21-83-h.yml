subsection_id: h
cite: 21.83(h)
title: 21.83(h)
text: (h) O requerente deve preparar um manual de voo provisório para a aeronave, contendo
  todas as limitações requeridas para a emissão do certificado de tipo requerido, incluindo
  as limitações de peso, de velocidade, de manobras, de carregamentos e de operação dos controles
  e dos equipamentos, a menos que, para cada limitação não claramente estabelecida, restrições
  operacionais apropriadas à aeronave tenham sido estabelecidas.
