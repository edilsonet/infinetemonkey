cite: 21.83(j)
title: 21.83(j)
text: (j) O requerente deve demonstrar que um protótipo de aeronave voou pelo menos 100 (cem)
  horas. No caso de uma emenda a um certificado de tipo provisório, a ANAC pode reduzir o
  número exigido de horas de voo.
