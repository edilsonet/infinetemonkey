section_title: Emendas provisórias a um certificado de tipo
subsection_id: a
cite: 21.85(a)
title: 21.85(a)
text: (a) Um requerente que fabrica aeronaves no Brasil faz jus à emissão de uma emenda provisória
  a um certificado de tipo se demonstrar o cumprimento dos requisitos desta seção e se a ANAC
  julgar que não existe aspecto, característica ou condição que possa tornar a aeronave insegura
  quando operada de acordo com as limitações apropriadas estabelecidas nos RBAC aplicáveis.
