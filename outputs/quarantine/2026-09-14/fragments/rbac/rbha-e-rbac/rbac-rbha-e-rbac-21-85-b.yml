section_title: Emendas provisórias a um certificado de tipo
subsection_id: b
cite: 21.85(b)
title: 21.85(b)
text: (b) Um requerente que fabrica aeronave no exterior faz jus à emissão de uma emenda provisória
  ao certificado de tipo se o país no qual a aeronave foi fabricada declarar que o requerente
  demonstrou cumprimento com esta seção, que a aeronave atende aos requisitos do parágrafo
  (e) desta seção e que não existe aspecto, característica ou condição que possa tornar a
  aeronave insegura quando operada de acordo com as limitações apropriadas estabelecidas nos
  RBAC aplicáveis. Esta declaração pode ser dispensada, a critério da ANAC, se a aeronave
  já tiver recebido a emenda ao certificado de tipo no país responsável pela aprovação original
  do projeto de tipo.
