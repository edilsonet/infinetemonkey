section_title: Emendas provisórias a um certificado de tipo
subsection_id: d
cite: 21.85(d)
title: 21.85(d)
text: (d) O programa oficial de ensaios em voo da ANAC, ou o programa de ensaios em voo conduzido
  pela autoridade de aviação civil do país no qual a aeronave foi fabricada, visando à emissão
  da emenda ao certificado de tipo, deve estar concluído ou em andamento.
