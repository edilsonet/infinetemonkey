text: '(i) O requerente deve operar um protótipo da aeronave modificado de acordo com a emenda
  requerida ao certificado de tipo, por um número de horas de voo considerado necessário pela
  ANAC.

  SUBPARTE D

  MODIFICAÇÕES AOS CERTIFICADOS DE TIPO'
