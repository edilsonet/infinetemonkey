cite: 21.93(b)
title: 21.93(b)
text: '(b) Para os propósitos de cumprimento com o RBAC 36, e exceto como previsto nos parágrafos
  (b)(2), (b)(3) e (b)(4) desta seção, qualquer modificação voluntária no projeto de tipo
  das seguintes aeronaves que possa aumentar os seus níveis de ruído é considerada uma “modificação
  acústica” (adicionalmente a ser uma pequena ou grande modificação, conforme classificada
  segundo o parágrafo (a) desta seção):

  (1) grandes aviões categoria transporte;

  (2) aviões a reação (independentemente da categoria). Para os aviões aos quais se aplica
  este parágrafo, modificações acústicas não incluem modificações no projeto de tipo que sejam
  limitadas a uma das seguintes:'
