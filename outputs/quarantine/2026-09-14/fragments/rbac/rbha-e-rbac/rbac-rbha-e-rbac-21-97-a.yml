section_title: Aprovação de grande modificação no projeto de tipo
subsection_id: a
cite: 21.97(a)
title: 21.97(a)
text: '(a) Um requerente para aprovação de grandes modificações no projeto de tipo deve:

  (1) prover os dados que substanciem e os dados descritivos necessários, para sua incorporação
  ao projeto de tipo;

  (2) demonstrar que a modificação e as áreas afetadas pela modificação cumprem com os RBAC
  aplicáveis e prover à ANAC os meios pelos quais tal cumprimento tenha sido demonstrado;
  e

  (Redação dada pela Resolução nº 495, de 14.11.2018)

  (3) fornecer uma declaração certificando que o requerente cumpriu com os requisitos aplicáveis.

  (4) quando o requerente for uma organização de projeto certificada, a declaração definida
  no parágrafo (a)(3) desta seção deve atender às provisões da subparte J.

  (Incluído pela Resolução nº 495, de 14.11.2018)

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
