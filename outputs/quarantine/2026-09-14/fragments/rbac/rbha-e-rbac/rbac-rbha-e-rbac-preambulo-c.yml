text: '(c) os dados do projeto de tipo a serem submetidos para a análise da ANAC cumprirem
  com os requisitos da subparte J, caso o requerimento tenha sido realizado por uma organização
  de projeto certificada.

  (Incluído pela Resolução nº 495, de 14.11.2018)

  �em> referindo-se a helicópteros, significa a parte do voo a partir de 300 m (1.000 ft)
  acima da área de aproximação final e de decolagem (FATO), se o voo foi planejado para exceder
  essa altura, ou a partir do início da descida nos outros casos, até o ponto de pouso ou
  de arremetida.

  Fase de cruzeiro

  (

  En-route phase

  ) significa a parte do voo desde o fim da fase de decolagem e subida inicial até o início
  da fase de aproximação e pouso.

  (Redação dada pela Resolução nº 685, de 13.07.2022)

  Fase de decolagem e subida inicial,

  referindo-se a helicópteros, significa a parte do voo desde o início da decolagem até 300
  m (1.000 ft) acima da elevação da FATO, se o voo foi planejado para exceder essa altura,
  ou até o fim da subida em outros casos.

  Fator de carga

  significa a relação entre uma carga específica e o peso total de aeronave. A carga específica
  é expressa em termos de forças aerodinâmicas, forças de inércia ou reações do solo ou da
  água.

  Fatores humanos

  (Princípios de) significa princípios aplicáveis ao projeto, certificação, treinamento, operação
  e manutenção aeronáuticos e que objetivam prover uma interface segura entre o componente
  humano e os outros componentes de um sistema através da apropriada consideração do desempenho
  humano.

  Fixo de aproximação final

  - FAF significa um ponto que define o início do segmento de aproximação final e onde o segmento
  de descida final pode ser iniciado.

  Fixo de posição

  significa uma localização geográfica em relação à qual a posição de uma aeronave deve ser
  informada.

  Foguete

  significa uma aeronave propelida pelo jato provocado pela expansão de gases gerados dentro
  do motor a partir de propelentes nele contidos, sem a introdução de substâncias externas
  para processar a combustão. Inclui quaisquer partes que se separam normalmente durante a
  operação da aeronave.

  Forças Armadas

  significa a Marinha, o Exército e a Aeronáutica, incluindo seu pessoal da ativa e da reserva.

  Gestor responsável

  é a pessoa única e identificável que, na estrutura organizacional da Empresa ou Organização,
  tem o poder legal ou hierárquico de autorizar ou recusar quaisquer gastos relacionados à
  condução das operações pretendidas, em conformidade com os requisitos regulamentares de
  segurança operacional. A indicação do Gestor Responsável deve estar em conformidade com
  os atos constitutivos da empresa ou organização arquivados na ANAC.

  (Incluído pela Resolução nº 526, de 06.08.2019)

  Girodino

  significa uma aeronave de asa rotativa cujos rotores são normalmente movidos a motor durante
  a decolagem, voo pairado e pouso e usam parte da velocidade rotacional do rotor para deslocamentos
  horizontais. Seu meio de propulsão, consistindo normalmente de hélice convencional, é independente
  do sistema do rotor.

  Giroplanador

  ou Girocóptero

  significa uma aeronave de asas rotativas cujos rotores não são acionados por motor (exceto,
  eventualmente, para partida), mas giram pela ação do ar quando a aeronave está em movimento
  e cujo meio de propulsão, consistindo geralmente de hélices convencionais, é independente
  do sistema do rotor.

  Grande aeronave

  significa uma aeronave com peso máximo de decolagem aprovado superior a 5.670 kg (12.500
  lb).

  Grande alteração

  significa uma alteração não listada na especificação técnica aprovada da aeronave, motor
  ou hélice e que:

  (Incluído pela Resolução nº 546, de 18.03.2020)

  (1) pode afetar substancialmente o peso, balanceamento, resistência estrutural, características
  de voo e de manobrabilidade ou qualquer outra característica ligada à aeronavegabilidade;
  ou

  (Incluído pela Resolução nº 546, de 18.03.2020)

  (2) não é executada de acordo com práticas aceitáveis ou que não pode ser executada usando
  operações elementares.

  (Incluído pela Resolução nº 546, de 18.03.2020)

  Grande reparo

  significa um reparo:

  (1) que, se feito inadequadamente, pode afetar substancialmente peso, balanceamento, resistência
  estrutural, desempenho, operação do grupo moto-propulsor, características de voo ou qualquer
  outra característica ligada à aeronavegabilidade; ou

  (2) que não é feito usando práticas aceitáveis ou que não pode ser executado usando operações
  elementares.

  Guiagem

  lateral e vertical

  significa guiagem provida por auxílio à navegação de solo ou por dados de navegação gerados
  por computador.

  Hélice

  significa um dispositivo para propelir aeronaves que possui pás fixadas a um eixo movido
  por um motor e que, quando girando, produz, por sua ação sobre o ar, uma tração aproximadamente
  perpendicular ao seu plano de rotação. Inclui componentes de controle normalmente fornecidos
  pelo seu fabricante, mas não inclui rotores principais e auxiliares de aeronaves de asas
  rotativas, assim como aerofólios rotativos (palhetas) de motores.

  Helicóptero

  significa uma aeronave de asa rotativa que depende principalmente de seus rotores, movidos
  a motor, para deslocamentos horizontais.

  Helideck

  significa um heliponto situado em uma estrutura sobre água, fixa ou flutuante. É também
  chamado de heliponto

  off-shore

  .

  Heliponto

  significa uma área delimitada em terra, na água ou em uma estrutura destinada para uso,
  no todo ou em parte, para pouso, decolagem e movimentação em superfície de helicópteros.
  Os helipontos podem ser públicos ou privados (ver definições de aeródromos públicos e privados).

  Heliponto (ou heliporto) elevado

  significa um heliponto (ou heliporto) localizado em uma estrutura ou terreno elevado.

  Heliporto

  significa um heliponto público dotado de instalações e facilidades para apoio às operações
  de helicópteros e de processamento de passageiros e/ou cargas.

  Inflamável

  , referindo-se a fluidos, significa susceptível a inflamar-se subitamente ou explodir.

  Informação meteorológica

  significa um informe, análise ou previsão meteorológica ou qualquer outra informação relacionada
  a condições meteorológicas existentes ou esperadas.

  (Redação dada pela Resolução nº 685, de 13.07.2022)

  Instrumento

  significa um dispositivo com mecanismo interno destinado a indicar, por meios sonoros ou
  visuais, a altitude, a velocidade ou o funcionamento da aeronave ou de partes da mesma.
  Inclui dispositivos eletrônicos destinados a controlar automaticamente uma aeronave em voo.

  Isenção

  significa a dispensa, temporária ou permanente, do cumprimento de regra estabelecida pela
  ANAC em Resolução, RBAC ou Condição Especial, quando comprovado que o descumprimento não
  afeta a segurança das operações ou que há ações por parte do interessado para garantir o
  atendimento ao interesse público em um nível de segurança aceitável pela ANAC, após análise
  conforme a seção 11.31 do RBAC nº 11.

  (Incluído pela Resolução nº 548, de 20.03.2020)

  Lista de Desvios de Configuração

  (

  Configuration Deviation List -

  CDL) significa uma listagem elaborada pelo detentor do Certificado de Tipo e aprovada pela
  ANAC que identifica qualquer parte externa de um tipo de aeronave que pode estar faltando
  no início de um voo e que contém, quando necessário, qualquer informação, limitação operacional
  ou correção de desempenho associada.

  Lista de Equipamentos Mínimos

  (

  Minimum Equipment List

  - MEL) significa um documento aprovado para uso de um operador de aeronave, em conformidade
  com ou mais restritivo que a MMEL estabelecida para o tipo ou modelo específico da aeronave,
  que lista itens que podem estar temporariamente inoperantes, observadas as limitações, procedimentos
  e condições especiais de operação ali descritas, conforme aplicável.

  (Redação dada pela Resolução nº 740, de 16.04.2024)

  Lista Mestra de Equipamentos Mínimos

  (

  Master Minimum Equipment List

  - MMEL) significa um documento aprovado para um tipo ou modelo específico de aeronave que
  lista itens que podem estar temporariamente inoperantes, observadas as limitações, procedimentos
  e condições especiais de operação ali descritas, conforme aplicável.

  (Redação dada pela Resolução nº 740, de 16.04.2024)

  Manual de Operação da Aeronave

  (

  Aircraft Operating Manual

  - AOM) significa o manual elaborado pelo operador da aeronave, aprovado pela ANAC, contendo
  procedimentos normais, anormais e de emergência, listas de verificações, limitações, informações
  de desempenho, detalhes dos sistemas da aeronave e outros materiais relevantes para a operação
  da aeronave. Normalmente deverá ser baseado no próprio Manual de Voo Aprovado (AFM), não
  podendo contrariá-lo e contemplando alguma condição operacional específica do operador não
  prevista no AFM.

  (Incluído pela Resolução nº 546, de 18.03.2020)

  Manual de procedimentos de organizações de manutenção

  significa um documento aprovado pelo chefe da organização de manutenção o qual detalha a
  estrutura da organização de manutenção e as responsabilidades da administração, a finalidade
  do trabalho, a descrição das instalações, os procedimentos de manutenção e o sistema de
  inspeção ou de garantia de qualidade.

  Manual de voo aprovado

  (

  Aircraft Flight Manual -

  AFM) significa um manual, aprovado pelo órgão certificador, contendo procedimentos normais,
  anormais e de emergência, listas de verificações, limitações, informações de desempenho,
  detalhes dos sistemas da aeronave e outros assuntos relevantes para a operação da aeronave.

  Manutenção

  significa qualquer atividade de inspeção, revisão, reparo, limpeza, conservação ou substituição
  de partes de uma aeronave e seus componentes, mas exclui a manutenção preventiva.

  Manutenção preventiva

  significa uma operação de preservação simples ou de pequena monta, assim como a substituição
  de pequenas partes padronizadas que não envolva operações complexas de montagem e desmontagem.

  Margem de segurança

  (MS) significa o excesso de resistência de determinada parte de uma estrutura em relação
  à carga final.

  Meios de fixação de carga externa

  significa componentes estruturais usados para fixar uma carga externa à fuselagem de uma
  aeronave, incluindo recipientes para cargas, estrutura de apoio dos pontos de fixação e
  qualquer dispositivo para soltar ou alijar cargas externas.

  Membro de tripulação de voo

  significa um piloto, um mecânico de voo ou um navegador designado para serviço em uma aeronave
  durante o tempo de voo.

  Mínimos operacionais de aeródromo

  significa os limites de utilização de um aeródromo para:

  (Incluído pela Resolução nº 685, de 13.07.2022)

  (1) decolagem, expressos em termos de alcance visual de pista e/ou visibilidade e, se necessário,
  condições de nuvens;

  (Incluído pela Resolução nº 685, de 13.07.2022)

  (2) pouso em operações de aproximação por instrumentos 2D, expressos em termos de visibilidade
  e/ou alcance visual de pista, altitude/altura mínima de descida e, se necessário, condições
  de nuvens; e

  (Incluído pela Resolução nº 685, de 13.07.2022)

  (3) pouso em operações de aproximação por instrumentos 3D, expressos em termos de visibilidade
  e/ou alcance visual de pista e altitude/altura de decisão como apropriado para o tipo e/ou
  categoria da operação.

  (Incluído pela Resolução nº 685, de 13.07.2022)

  Motoplanador

  significa uma aeronave equipada com um ou mais motores e que, com o(s) motor(es) parado(s)
  em voo, possui as mesmas características de um planador.

  Motor aeronáutico

  significa um motor que é usado ou que se pretende usar para propelir uma aeronave. Inclui
  turboalimentadores, dispositivos e controles necessários ao seu funcionamento, mas exclui
  hélices e rotores. A menos que explicitado diferentemente no texto, o motor aeronáutico
  é referido nos RBAC apenas como "motor". Existem dois tipos básicos de motor aeronáutico:
  convencional e à turbina:

  (1) motor convencional significa um motor aeronáutico no qual pistões, que se movem dentro
  de cilindros, acionam um eixo de manivelas que, diretamente ou através de uma caixa de redução,
  aciona uma hélice (aviões) ou um rotor (aeronave de asas rotativas);

  (2) motor à turbina significa um motor aeronáutico cujo funcionamento se dá através de uma
  turbina a gases. Os motores à turbina dividem-se, basicamente, em três diferentes tipos:'
