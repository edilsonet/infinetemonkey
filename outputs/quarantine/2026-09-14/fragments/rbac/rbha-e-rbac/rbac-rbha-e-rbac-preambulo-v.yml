title: preambulo(v)
text: '(v) capacidade degradada de partida de motores em voo;

  (vi) perda inadvertida ou indisponibilidade de combustível, assim como desbalanceamento
  de combustível incorrigível em voo;

  (vii) retornos ou desvios para alternativa devidos a falhas, mau funcionamentos ou defeitos
  associados aos sistemas significativos do grupo 1 para ETOPS;

  (viii) perda de qualquer fonte de potência de sistema significativo do grupo 1 para ETOPS,
  inclusive fonte de potência projetada para prover potência emergencial para este sistema;

  (ix) qualquer ocorrência que possa prejudicar o prosseguimento de um voo e pouso seguros
  do avião em um voo ETOPS; e'
