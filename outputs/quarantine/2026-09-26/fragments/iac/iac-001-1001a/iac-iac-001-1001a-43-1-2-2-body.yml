text: '43.1.2.2 A confecção do RBHA obedecerá às prescrições contidas no RBHA 001 - Objetivo,
  Conteúdo e Forma dos RBHA. 3.1.3 INSTRUÇÃO DE AVIAÇÃO CIVIL - IAC


  3.1.3.1 É a publicação que tem por objetivo estabelecer procedimentos ou esclarecer regras
  ou requisitos contidos nos RBHA relacionados à aviação civil. 3.1.3.2 A IAC obedecerá às
  prescrições contidas nesta Norma.


  3.1.4 NORMA DE SERVIÇO AÉREO INTERNACIONAL - NOSAI 3.1.4.1 É a publicação que contém informações
  ou instruções, permanentes ou transitórias, relativas aos procedimentos que regulam os Serviços
  Aéreos Internacionais com origem no País. 3.1.4.2 É emitida exclusivamente pelo Subdepartamento
  de Serviços Aéreos - SSA, de acordo com as definições e prescrições contidas na IAC 1204.
  3.1.5 INFORMATIVO DE AVIAÇÃO CIVIL - INFAC 3.1.5.1 É a publicação, de caráter meramente
  informativo, que divulga, para o público em geral, assuntos de ordem técnica ou organizacional,
  já previstos em norma específica, relativos ao Sistema de Aviação Civil. 3.1.5.2 O INFAC
  obedecerá às prescrições contidas nesta Norma. 3.1.6 HORÁRIO DE TRANSPORTE AÉREO - HOTRAN


  3.1.6.1 É o documento informativo, expedido exclusivamente pelo Subdepartamento de Serviços
  Aéreos, que se destina a: a) formalizar as autorizações para a exploração de linhas regulares
  pelas Empresas de Transporte Aéreo; e b) difundir, para conhecimento e controle dos interessados,
  os itinerários, horários e números de vôos, bem como os tipos de aeronaves e a oferta, em
  Assentos/km, referentes a cada HOTRAN.


  3.1.6.2 O HOTRAN será elaborado de acordo com as prescrições da IAC 1223 Normas para Confecção
  e Expedição de Horário de Transporte - HOTRAN. 3.1.7 ANUÁRIO DO TRANSPORTE AÉREO 3.1.7.1
  É a publicação anual que divulga dados econômicos e estatísticos do setor de transporte
  aéreo comercial. 3.1.7.2 O Anuário será elaborado pelo Subdepartamento de Serviços Aéreos.
  3.1.8 MANUAL 2005 IAC 001-1001A


  53.1.8.1 É a publicação de caráter informativo ou didático, destinada a divulgar e orientar
  assuntos relacionados às atividades da aviação civil. 3.1.8.2 O manual obedecerá às especificações
  previstas na ICA 5-1 - Confecção, Controle e Numeração de Publicações, ou quando a autoridade
  competente julgar necessário, aformatação poderá ser de acordo com padrões internacionais
  reconhecidos. 3.1.9 PLANO DA AVIAÇÃO CIVIL 3.1.9.1 É a publicação que tem por objetivo promover
  o desenvolvimento do Sistema de Aviação Civil em compatibilidade com a evolução tecnológica
  da aviação civil e as tendências sócio-econômicas do País. 3.1.9.2 O plano seguirá as prescrições
  estabelecidas pelo Instituto de Aviação Civil. 3.2 INTERNAS As publicações internas são
  constituídas de documentos técnicos e administrativos, cujas definições e prescrições serão
  estabelecidas em Normas Padrão de Ação - NPA específicas.


  4 ELABORAÇÃO 2005 IAC 001-1001A


  64.1 As publicações serão elaboradas por ordem de uma das autoridades abaixo: a) Diretor-Geral;
  b) Chefes de Subdepartamentos do DAC c) Chefe do Gabinete do Diretor-Geral; d) Chefes de
  Assessorias do DAC; e) Diretor do Instituto de Aviação Civil (IAC); f) Diretor do Instituto
  de Fomento e Coordenação Industrial (CTA/IFI); 4.2 A elaboração das publicações é atribuição
  dos Setores do DAC, do IAC e do IFI, até o nível de Divisão, conforme as respectivas áreas
  de interesse, aos quais cabe preparar o seu original, que será submetido à apreciação da
  autoridade competente para sua aprovação, de acordo com as respectivas prescrições de elaboração
  previstas para os diferentes tipos de publicações apresentados no item 3.


  5 APROVAÇÃO


  5.1 IAC Para a aprovação de cada IAC , deverão ser adotados os seguintes procedimentos:
  2005 IAC 001-1001A


  7a) o setor responsável pela elaboração ou alteração de qualquer IAC deverá preparar Portaria,
  a qual será emitida pela respectiva autoridade competente, fazendo referência expressa à
  autorização do Diretor-Geral do Departamento de Aviação Civil ou ao ato de delegação de
  competência, bem como ao título, ao número, aos anexos, para publicação no Diário Oficial
  da União, de acordo com as normas de formatação da Imprensa Nacional; b) o encaminhamento
  da Portaria de aprovação para assinatura deverá ser feito junto com o original da IAC, com
  as respectivas páginas rubricadas pelo chefe do setor elaborador ou pela autoridade competente,
  conforme a conveniência administrativa. c) o original assinado da respectiva Portaria (Anexo
  1 e 2), duas cópias em papel e disquete, contendo a Portaria em tamanho original e no padrão
  reduzido para DOU (Anexo 3) deverão ser entregues à Seção de Publicações para publicação
  no Diário Oficial da União, na Internet e no Boletim do DAC; d) a Portaria de aprovação
  deverá mencionar, se for o caso, o cancelamento da edição anterior e respectiva Portaria,
  número e data do Diário Oficial da União.


  e) a transcrição da Portaria de aprovação será parte integrante da publicação normativa,
  sendo posicionada, entre a capa e a primeira página, e deverá fazer menção à data de publicação
  no Diário Oficial da União, conforme o tipo de documento, e não apresentará assinatura;
  e


  f) o ato de aprovação da IAC será publicado no Diário Oficial da União e em Boletim do DAC.


  5.2 INFAC O chefe do setor responsável pela elaboração ou alteração do INFAC deverá preparar
  e emitir o original, que terá a assinatura do referido chefe e da respectiva autoridade
  competente pela aprovação, no final do texto, o qual deverá ser encaminhado para publicação
  em Boletim do DAC.


  6 EFETIVAÇÃO


  6.1 IAC 2005 IAC 001-1001A


  8A data de efetivação, ou seja, a entrada em vigor da IAC, corresponderá à data de publicação
  da Portaria no Diário Oficial da União ou outra data previamente definida e explicitada
  na Portaria de aprovação pela autoridade competente. 6.2 INFAC A data de vigência do INFAC
  será a data de publicação em Boletim do DAC ou alguma outra data previamente definida na
  publicação.


  7 PROCEDIMENTOS ADMINISTRATIVOS


  Os setores deverão providenciar a confecção dos originais dos RBHA e IAC, sua aprovação
  e remessa imediata à Seção de Publicações, logo após a publicação da portaria de aprovação.
  O INFAC deverá ser encaminhado à Seção de Publicações logo após a assinatura da autoridade
  competente. 2005 IAC 001-1001A


  97.1 ENCAMINHAMENTO A remessa deverá ser feita mediante Parte que inclua, como anexos, o
  seguinte: a) um original, com as respectivas páginas rubricadas pelo chefe do setor elaborador
  ou pela autoridade competente, conforme a conveniência administrativa, e cópia em papel
  deste original, sem assinatura, devidamente padronizados de acordo com o previsto nesta
  Norma; e b) cópia em disquete da publicação em arquivo único. 7.2 DIVULGAÇÃO 7.2.1 ELETRÔNICA
  As publicações citadas no item 7 deverão ser impreterível e primeiramente encaminhadas à
  Seção de Publicações para divulgação na Internet, observando-se os padrões de formatação
  vigentes para o Portal do DAC, inclusive a prescrição do item 10.2. 7.2.1.1 Nos casos em
  que a autoridade competente julgar que o teor da publicação, que embora ostensiva, não deva
  ser divulgada na Internet, deverá suprimir a indicação “INTERNET” do item Disponibilização
  do Capítulo 1 - Disposições Preliminares. 7.2.2 SUPERVISÃO A supervisão do conteúdo das
  publicações disponibilizadas na Internet é atribuição do setor elaborador, que deverá comunicar
  à Seção de Publicações toda e qualquer discrepância observada, e providenciar a respectiva
  correção. 7.2.3 CATÁLOGO DE PUBLICAÇÕES As publicações externas, disponibilizadas para venda
  ou assinatura, deverão ser referenciadas no Catálogo de Publicações do DAC. 7.3 HISTÓRICO
  DAS PUBLICAÇÕES Todos os originais das publicações emitidas serão mantidos arquivados na
  Seção de Publicações, a fim de se constituir um acervo histórico de normas e regulamentos.
  7.4 IMPRESSÃO GRÁFICA A Seção de Publicações providenciará e acompanhará o processo de reprodução
  gráfica, de acordo com o previsto nesta Norma.


  8 DISPONIBILIZAÇÃO


  8.1 Compete à Seção de Publicações a divulgação, a edição, o fornecimento e a venda dos
  RBHA, IAC e INFAC.


  8.2 As demais publicações citadas nesta IAC serão disponibilizadas pelos respectivos setores.
  2005 IAC 001-1001A


  10 8.3 A disponibilização dar-se-á de acordo com o critério estabelecido pelo órgão elaborador,
  através da indicação dos seguintes grupos de acesso para venda ou fornecimento, e também,
  a indicação de divulgação eletrônica na Internet.


  8.3.1 GRUPO DE ÓRGÃOS PÚBLICOS A - Administração estadual/municipal de aeroportos conveniados
  com o DAC. C - Comandos Aéreos Regionais (COMAR). CM- Centro de Medicina Aeroespacial. D
  - Órgãos internos do DAC. GV- Governos dos Estados, Territórios e Distrito Federal. IA -
  Instituto de Aviação Civil. IF - Instituto de Fomento e Coordenação Industrial (CTA/IFI).
  IN - Empresa Brasileira de Infra-Estrutura Aeroportuária (INFRAERO). PM- Prefeituras Municipais.
  SA- Seções de Aviação Civil (SAC). SR- Serviços Regionais de Aviação Civil (SERAC) TP -
  Todos os Órgão Publicos.


  8.3.2 GRUPO DE EMPRESAS PRIVADAS, INSTITUIÇÕES DIVERSAS E PESSOAS FÍSICAS AE- Aeroclubes
  e Escolas EA- Empresas de Serviços Auxiliares de Transporte Aéreo. EE- Empresas Aéreas Estrangeiras.
  EN- Empresas Aéreas Nacionais. HM- Oficinas Homologadas de Manutenção. SE- Empresas de Serviços
  Aéreos Especializados. TA- Empresas de Táxi Aéreo. X - Avulsos. TD - Todos do grupo de empresas
  privadas, instituições diversas e pessoas físicas'
