text: '(g)Também cabe esclarecer que um profissional credenciado segundo o RBAC 183, caso
  realize um testemunho de ensaio, também não depende da emissão da AIT, pois tal profissional
  não é servidor da ANAC.


  E.3**Ofício de Autorização de Voo - OAV**'
