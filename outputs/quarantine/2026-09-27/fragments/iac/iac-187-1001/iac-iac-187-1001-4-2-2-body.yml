title: SERAC
text: '4.2.2 SERAC

  a) receber e registrar o pedido de solicitação de serviço, em conformidade com as normas
  vigentes do

  setor;

  b) certificar-se da efetivação do Depósito Bancário Identificado, no SISCOD, referente ao
  valor devi-

  do pelo serviço solicitado, executando os procedimentos previstos de anotação do código
  de con-

  firmação no comprovante de depósito bancário (boleta) e juntar o mesmo ao processo; e

  c) prestar o serviço solicitado ou encaminhar a solicitação do serviço, após o cumprimento
  do proce-

  dimento acima, ao setor do DAC de competência.'
