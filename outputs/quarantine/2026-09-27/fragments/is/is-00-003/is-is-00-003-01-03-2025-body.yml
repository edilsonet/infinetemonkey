  OBJETIVO

  Estabelecer, referente aos exames teóricos previstos nos RBAC nº 61, 63 e 65:

  o conteúdo de tais exames;

  b) os procedimentos para inscrição, realização e recursos.


  Revogação

  Não aplicável


  Fundamentos

  A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  O meio ou procedimento alternativo mencionado na alínea 3.2 (b) desta IS deve garantir nível
  de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar o
  objetivo do procedimento normalizado em IS.

  A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.

  Esta IS é fundamentada e objetiva oferecer método de cumprimento dos seguintes parágrafos:

  61.45(k)(2), 61.77(a), 61.97(a)(2), 61.137(a), 61.157(a), 61.177(a), 61.213(a)(1)(i), 61.218(a)(1)(i),
  61.233(a)(4) e 61.61.287(a) do RBAC nº 61,

  63.45(a)(2), 63.37(b)(3)(i) e 63.35(f)(2) do RBAC nº 63; e

  65.4(e)(2), 65.55(a) e 65.75(a) do RBAC nº 65.


  Definições

  Para os efeitos desta IS, são válidas as definições listadas nas:

  seção 01.1 do RBAC nº 01;

  seção 61.2 do RBAC nº 61;

  seção 63.3 do RBAC nº 63; e

  seção 65.2 do RBAC nº 63.

  Além disso, são válidas as seguintes definições:

  Cadastro Brasileiro do Pessoal da Aviação Civil: registro oficial do pessoal da aviação
  civil do Brasil, mantido pela ANAC, para inscrição dos aeronavegantes, suas licenças, averbação
  de habilitações de categoria, de classe, de tipo ou relativas à operação e certificado de
  piloto de aeronave aerodesportiva ou certificado médico aeronáutico. A manutenção dos dados
  é em meio eletrônico, através do Sistema Integrado de Informações da Aviação Civil - SINTAC,
  ou outro que o suceder. O registro de inscrição é denominado número Código ANAC, ou simplesmente
  CANAC.

  Exame: conjunto de provas cujo resultado serve de demonstração de atingimento de grau de
  conhecimento mínimo.

  Executante: terceiro, pessoa jurídica, contratado para execução indireta de serviço da ANAC
  para inscrição, agendamento e aplicação do exame de conhecimento teórico, conforme o Decreto
  nº 9.507, de 21 de setembro de 2018.

  Fiscal de prova: pessoa física contratada pelo executante do exame de conhecimento teórico
  responsável pelos procedimentos e ordem a serem observados na sala de provas, que gozará
  das prerrogativas e terá as responsabilidades próprias de agente público, na qualidade de
  particular em colaboração com o Estado.

  Objetivo de aprendizagem: resultado ou meta relacionado ao domínio do conhecimento que se
  pretende alcançar ao final de uma instrução.

  Matéria: conjunto de conhecimentos historicamente construídos vinculados a uma determinada
  área que compõe a matriz curricular de um curso; objeto de estudo a ser aferido no exame
  teórico da ANAC.

  Prova: instrumento que avalia o conhecimento do candidato de determinada matéria.


  DESENVOLVIMENTO DO ASSUNTO

  Finalidade, Conteúdo e Duração dos Exames

  Um exame de conhecimento teórico da ANAC será composto de provas para avaliação do domínio
  mínimo dos objetivos de aprendizagem estipulados para as matérias que o compõem.

  As provas terão como objeto principal a matéria a que se referem, porém não estando a ela
  limitadas, podendo envolver subsidiária e complementarmente objetivos de aprendizagem estipulados
  para outras matérias previstas no mesmo exame.

  Na hipótese de ser exigida licença, habilitação ou certificado anterior válidos para a inscrição
  e realização em determinado exame, os objetivos de aprendizagem avaliados para a obtenção
  daqueles serão passíveis de nova avaliação, avaliando-se o conhecimento de forma cumulativa.

  Será parte integrante dos objetivos de aprendizagem avaliados aqueles estipulados para o
  nível de ensino formal oficial mínimo requerido para a obtenção de licença, habilitação
  ou certificado de que o exame seja parte do processo de obtenção.

  São exigíveis nos exames as alterações de caráter normativo (Lei, Regulamento, Portaria
  etc.) em vigor até 90 (noventa) dias antes da data de sua realização.

  O resultado em exame de conhecimento teórico da ANAC relacionado à determinada licença,
  habilitação ou certificado não é válido como comprovante de conhecimentos referentes a outra
  licença, habilitação ou certificado, a menos que disposto de forma contrária em RBAC.

  O apêndice C apresenta os exames teóricos requeridos para cada licença, habilitação ou certificado,
  assim como seus pré-requisitos, as provas associadas a cada um deles, número de questões
  e sua duração.

  Todos os exames listados no Apêndice C são realizados em sistema de provas informatizado
  do executante.

  Além dos exames apresentados no Apêndice C, o exame para habilitação de piloto agrícola
  previsto no RBAC 61.243(a)(3) é realizado como parte do curso.

  A cada agendamento, um candidato realiza apenas um exame, mas de forma completa com todas
  as suas provas, exceto aquelas que eventualmente seja dispensado.

  O mesmo Apêndice C apresenta as provas que o interessado será dispensado por ser detentor
  de outras licenças, habilitações ou certificados ou ter feito outros exames.

  O sistema do executante informará as dispensas e as matérias a serem objeto de avaliação.

  Nos casos de dispensa referente a todo o exame, será desnecessária qualquer solicitação
  junto ao executante, e o requerimento deverá ser parte do processo de concessão, revalidação
  ou requalificação de licença ou habilitação do interessado.

  Os exames serão aplicados unicamente em língua portuguesa, porém podem conter termos técnicos
  em idioma estrangeiro, quando de uso consagrado na aviação.

  Ao iniciar um exame, o candidato terá disponibilizadas todas as provas das matérias que
  o compõem em um mesmo momento.

  A duração total do exame será igual à soma das durações das provas que o compõem.

  A duração total do exame será compartilhada por todas as provas, podendo o tempo excedente
  em uma prova ser utilizado nas demais.

  O tempo excedente em um exame não poderá ser acumulado para uso em exame(s) posterior(es).

  Exceto nos casos previstos nesta IS, não haverá extensão da duração do exame.

  Salvo nos casos expressamente previstos em regulamento, a aprovação em exame teórico da
  ANAC não possui prazo de validade, e pode ser utilizada a qualquer tempo pelo candidato
  aprovado para obter uma licença, habilitação ou certificado.


  Objetivos de Aprendizagem de cada Matéria

  Os objetivos de aprendizagem avaliados nas provas de cada matéria são aqueles constantes
  no Apêndice D desta IS.

  Ainda que os nomes das matérias listados no Apêndice C e seus objetivos de aprendizagem
  no Apêndice D sejam iguais entre dois exames, as provas podem ser diferentes. Por exemplo
  a prova de Conhecimentos Técnicos no exame de piloto privado tem questões mais simples que
  a do exame de piloto comercial.


  Requisitos Mínimos para Inscrição

  Serão condições mínimas para a inscrição em qualquer exame de conhecimento teórico previsto
  nesta IS:

  ter concluído ou estar cursando o ensino médio ou equivalente em instituição reconhecida
  oficialmente;

  possuir registro de inscrição no Cadastro Brasileiro do Pessoal da Aviação Civil, número
  CANAC, conforme instruções presentes em: https://www.gov.br/anac/pt-br/assuntos/regulados/profissionais-da-aviacao-civil/habilitacao/criacao-de-canac-aeronauta;

  estar com seu registro na ANAC atualizado conforme instruções presentes em: https://www.gov.br/anac/pt-br/assuntos/regulados/profissionais-da-aviacao-civil/habilitacao/atualizacao-de-cadastro-canac,
  incluindo:

  I - foto no padrão da Organização da Aviação Civil Internacional (OACI);

  II - comprovante de residência, em nome do interessado, cônjuge/companheiro(a), pai ou mãe;

  III - cópia legível do documento de identidade válido, com foto, onde conste o número de
  inscrição no CPF; e

  IV - assinatura do titular na ficha cadastral.

  atender pré-requisitos específicos aplicáveis ao exame de interesse listados no Apêndice
  C; e

  conhecer, atender e estar de acordo com as exigências contidas nesta IS.

  Para os exames de conhecimento teórico visando obtenção de licença de piloto privado de
  planador, requerer-se-á que o interessado tenha concluído ou, pelo menos, curse o ensino
  fundamental.

  No caso de o exame requerer a execução ou matrícula prévia em um curso teórico, o sistema
  do executante já verificará tal exigência com base nos sistemas da ANAC.

  Para os alunos de Centros de Instrução de Aviação Civil (CIAC) certificados conforme o RBAC
  141, a ANAC envia um e-mail conformando a conclusão de seu curso.

  Para os alunos formados em Aeroclubes e Escolas antes de sua certificação pelo RBAC nº 141,
  o aluno poderá consultar sua aprovação no sistema da ANAC através do seguinte endereço:
  http://www2.anac.gov.br/EDUCATOR/EXAMES.ASPX.

  Eventual ausência de registro na relação publicada pela ANAC deverá ser esclarecida junto
  ao CIAC, aeroclube ou escola que promoveu o curso, ou mediante requerimento do interessado
  à Gerência de Formação e Qualificação de Pessoal - GFOP, por meio do protocolo eletrônico
  no sistemas SEI, devendo ser utilizado o tipo de processo “Pessoal da Aviação Civil: Cadastro
  de Aprovação de Candidato em Exame Teórico”.


  Atendimento Especial

  O interessado com necessidade especial, temporária ou permanente, que precisar de condição
  diferenciada para realização da prova, deverá informá-la no campo próprio do formulário
  de inscrição.

  O atendimento às condições diferenciadas solicitadas ficará sujeito à análise da legalidade,
  viabilidade e razoabilidade do pedido.

  Os interessados com necessidades especiais participarão do exame de conhecimento teórico
  em igualdade de condições com os demais interessados no que se refere ao conteúdo das provas,
  à avaliação e aos critérios de habilitação, ao horário e ao local de aplicação do exame
  e à nota mínima exigida para todos os demais interessados.

  A interessada lactante que necessitar amamentar durante a realização da prova poderá fazê-lo,
  informando tal necessidade no campo próprio do formulário de inscrição, para adoção das
  providências necessárias.

  Não haverá compensação do tempo de amamentação em favor da interessada.

  A criança deverá ser acompanhada de adulto responsável por sua guarda (familiar ou terceiro
  indicado pela interessada).

  A ANAC, o executante e o fiscal de prova não verificarão a identidade ou vínculo do acompanhante
  com a lactante.

  O executante do exame de conhecimento teórico disponibilizará intérprete de libras.

  O intérprete de libras poderá ser o próprio fiscal de prova.

  O executante indicará os locais em que disponibilizará intérprete de libras, no mínimo em
  duas localidades do território nacional.

  O interessado deverá informar sua condição diferenciada para realização da prova no campo
  próprio do formulário de inscrição.

  O executante do exame de conhecimento teórico da ANAC indicará as salas de prova com acesso
  aos cadeirantes.

  O interessado portador de equipamento médico por expressa determinação médica, por escrito,
  durante o período de realização do exame deverá informar tal necessidade no campo próprio
  do formulário de inscrição.


  Inscrição e Cadastramento

  O executante oferecerá a inscrição em exame de conhecimento teórico da ANAC via Internet,
  utilizando sistema próprio e de forma contínua, conforme disponibilidade de vagas nas salas
  de prova distribuídas no território nacional.

  O executante e o respectivo endereço na rede mundial de computadores a partir do qual se
  dará a inscrição constam no portal dedicado da Agência: https://www.gov.br/anac/pt-br/assuntos/regulados/profissionais-da-aviacao-civil/processo-de-licencas-e-habilitacoes/exame-teorico.

  O interessado deverá ler e concordar com esta IS antes de iniciar o preenchimento do formulário
  de inscrição.

  O executante poderá requerer concordância explícita do interessado com os termos de uso
  do sistema informatizado para inscrição e de provas e da política de privacidade que adotar
  para dar adequado cumprimento a esta IS, incluindo e não se limitando ao consentimento para
  tratamento de dados pessoais, ordinários e sensíveis.

  A inscrição ocorre em três fases:

  cadastramento;

  pagamento; e

  agendamento.


  Cadastramento e Senha

  Durante o cadastramento, o sistema do executante consultará os sistemas da ANAC e impossibilitará
  a continuidade do processo de inscrição nos seguintes casos com aviso ao interessado:

  Candidato não atende ao pré-requisito idade - código: 10;

  Candidato não atende ao pré-requisito escolaridade - código: 20;

  Candidato não atende ao pré-requisito de curso homologado - código: 30;

  Candidato não possui licenças e habilitações necessárias - código: 40;

  Usuário não cadastrado - código: 50;

  Certificado de conhecimento teórico inválido - código: 60;

  Certificado de conhecimento teórico pretendido fora do prazo de validade - código: 70;

  Usuário não possui endereço (postal) cadastrado - código: 80; e

  Fotografia faltante ou fora do padrão OACI - código: 90.

  Durante seu primeiro cadastramento no sistema do executante, o interessado criará uma senha
  de acesso no sistema do executante, o qual é responsável pela manutenção do sigilo.

  A senha criada é diferente da senha utilizada nos sistemas da ANAC e é fundamental para
  a execução da prova.

  O executante não manterá qualquer registro que permita a recuperação da senha.

  No momento em que o agendamento estiver no status "agendamento confirmado", não será possível
  alterar a senha no sistema do executante.

  A senha não será passível de recuperação no momento da prova, inviabilizando a realização
  do exame na data agendada.

  Após concluir o cadastramento sem pendências, o interessado receberá mensagem por correio
  eletrônico (e-mail) contendo sua identificação perante o sistema (login).


  Taxas e Pagamento

  A inscrição em exame de conhecimento teórico da ANAC corresponderá à utilização potencial
  de serviço público específico e divisível, impondo a cobrança e correspondente pagamento
  do montante apurado sobre as Taxas de Fiscalização de Aviação Civil - TFAC previstas na
  Lei nº 11.182, de 27 de setembro de 2005.

  A TFAC associada ao exame será calculada automaticamente e opções de pagamento serão oferecidas
  diretamente no sistema do executante após a conclusão do cadastramento.

  Será responsabilidade do interessado realizar o pagamento por uma das formas oferecidas
  até a sua respectiva data de vencimento.

  Não será aceita outra forma de pagamento obtida fora do sistema do executante, gerada por
  meio de qualquer outro sistema da Administração Pública, inclusive da ANAC.

  O pagamento da inscrição vinculará o procedimento de agendamento, vedada a alteração do
  candidato ou do exame.

  Uma vez confirmado o pagamento pelo sistema do executante será liberado o agendamento do
  exame.

  Não será admitia complementação de valores recolhidos em montante inferior ao devido. Neste
  caso o interessado poderá solicitar restituição conforme descrito no parágrafo [ 5.7.6]
  a seguir.

  A confirmação do pagamento poderá demorar até 5 (cinco) dias úteis.

  A TFAC associada ao exame teórico é a de código 2 presente no anexo à Resolução nº 653,
  de 20 de dezembro de 2021.

  A GRU paga terá validade de 5 (cinco) anos para fins de devolução do valor. Serão restituídos
  sem juros ou correção monetária os valores recolhidos:

  se não utilizados para o primeiro agendamento de exame desde que não tenha sido excedido
  o prazo citado no subparágrafo [ 5.8.3.1] ;

  em duplicidade; ou

  com valor acima ou abaixo do devido;

  mediante requerimento do titular do serviço, independentemente de quem tenha feito o pagamento,
  conforme instruções disponíveis em: https://www.gov.br/pt-br/servicos/obter-restituicao-de-taxa-de-fiscalizacao-da-aviacao-civil.


  Agendamento do Exame

  Uma vez confirmado o pagamento da devida taxa, o executante notificará, a partir de seu
  sistema de inscrição e agendamento, o interessado por correio eletrônico (e-mail) da situação
  de “agendamento pendente”.

  O interessado deve acessar o mesmo sistema do executante e optar por um local, data e horário
  de exame dentre as opções disponíveis pelo executante.

  O agendamento será confirmado por correio eletrônico (e-mail) enviado pelo executante.

  Uma vez realizado o agendamento de um exame pela primeira vez não será mais possível a restituição
  do valor da TFAC, a não ser nos casos descritos na seção 5.7.6. Não serão restituídos valores
  por desistência de realizar o exame.

  O interessado pode solicitar o cancelamento de seu agendamento:

  por no máximo 2 (duas vezes); e

  até 5 (cinco) dias antes da data do exame.

  A falta de agendamento, após comunicação da situação de “agendamento pendente” ou após seu
  cancelamento, no prazo de 60 (sessenta) dias corridos contados do fato dará causa ao cancelamento
  da inscrição, sem direito a ressarcimento da TFAC recolhida.

  Faltando 5 (cinco) dias corridos para a realização do exame, o executante notificará o interessado
  por correio eletrônico (e-mail) que a situação é de "agendamento confirmado".

  A situação de "agendamento confirmado", impede o cancelamento ou alterações relativas ao
  agendamento por parte do interessado. Tal situação também impede a alteração da senha no
  sistema do executante.

  O interessado que se esquecer da senha no dia da prova terá 5 (cinco) dias corridos para
  solicitar remarcação para o executante por meio do canal Fale Conosco. Caso contrário será
  considerado "faltante não justificado" conforme parágrafo [ 5.13.4] .

  O agendamento, independentemente de sua condição de "solicitado" ou "confirmado", poderá
  ser alterado e/ou cancelado pelo executante a qualquer tempo, em razão de dificuldades técnicas,
  de caso fortuito, de força maior ou de quaisquer razões que o executante julgar que atendam
  ao princípio da razoabilidade, e que impossibilitem a aplicação do exame de conhecimento
  teórico na sala de provas escolhida pelo interessado.

  O executante notificará o candidato por correio eletrônico (e-mail) do cancelamento do agendamento.

  O cancelamento do agendamento por iniciativa do executante não afeta o limite de 2 (dois)
  cancelamentos permitidos ao interessado.

  O novo agendamento, após cancelamento por iniciativa do executante, é de iniciativa do interessado
  e observa o disposto nesta subseção [ 5.8] , em especial quanto ao prazo de 60 (sessenta)
  dias.


  Horário e Local do Exame

  O exame de conhecimento teórico da ANAC será prestado em sala de provas administrada pelo
  executante, em sistema eletrônico próprio, na data e horário previamente agendados constantes
  na confirmação do agendamento.

  O horário constante na confirmação do agendamento será aquele de liberação do exame para
  o candidato.

  Recomenda-se que o candidato se apresente na recepção da sala de provas para marcação de
  presença com 30 (trinta) minutos de antecedência do horário agendado para início do exame
  e não será permitido o seu acesso à sala de provas após o horário agendado, sendo considerado
  faltoso.


  Materiais, Objetos e Vestuário para o Exame

  Será de responsabilidade do candidato trazer consigo os materiais e equipamentos que julgar
  necessários para a realização do exame além de se recordar de sua senha.

  O exame é realizado em computador do executante.

  O executante fará o empréstimo de caneta para assinatura da lista de presença e de lápis
  e papel para rascunho, e, quando for o caso, cartas de navegação, que deverão ser devolvidos
  ao final do exame ou de eventual recurso.

  A retirada de qualquer material da sala de provas implicará na eliminação do candidato.

  Serão permitidos os seguintes materiais e equipamentos para realização do exame, que deverão
  ser apresentados ao fiscal de prova no momento da marcação de presença para verificação
  de sua admissibilidade:

  calculadora eletrônica que execute as 4 (quatro) operações matemáticas básicas (soma, subtração,
  multiplicação e divisão), percentagem, raiz quadrada e memória (de soma e de subtração);
  o fiscal deverá limpar a memória da calculadora antes do início do exame;

  computadores manuais ou réguas de navegação tipo CR-3 (circular) ou tipo E6-B (retangular),
  sem anotações ou instruções manuscritas ou tipográficas sobre as técnicas de cálculo; e

  quaisquer outros que, por expressa determinação médica, por escrito, sejam de porte indispensável
  durante o período de realização do exame.

  Serão proibidos os seguintes materiais ou equipamentos para a realização do exame:

  publicações ou anotações, em qualquer formato, tais como resumos de conteúdo, instruções,
  gravuras etc.;

  quaisquer equipamentos eletrônicos, salvo comprovada determinação médica, nos termos no
  parágrafo [ 5.4.5] desta IS, tais como calculadoras, relógios, agendas eletrônicas etc.;

  quaisquer aparelhos de comunicação, tais como aparelhos de telefone, gravadores ou receptores
  de dados, voz, imagens, vídeos ou mensagens;

  fones ou abafadores de ouvido, óculos escuros, salvo comprovada determinação médica, nos
  termos no parágrafo [ 5.4.5] desta IS, ou itens de chapelaria, tais como boné, chapéu, viseira,
  gorro e similares;

  armas de qualquer espécie com exceção das previstas no parágrafo [ 5.10.4] desta IS ; e

  qualquer material diverso dos materiais permitidos, cujo porte na sala de provas não tenha
  sido expressamente autorizado pelo fiscal de prova.

  O interessado amparado pela Lei nº 10.826, de 22 de dezembro de 2003, para porte de armas,
  deverá informar sua condição diferenciada para realização da prova quando da marcação de
  presença. O certificado de Registro de Arma de Fogo e a Autorização de Porte, conforme definidos
  na referida lei, deverão ser apresentados ao fiscal de prova da ANAC, sob pena de, mesmo
  após iniciada a aplicação do exame, serem retirados do recinto da sala de provas e consequente
  eliminação.

  Todos os materiais que o candidato leve consigo para o interior da sala de provas poderão
  ser inspecionados pelo fiscal de prova previamente ao exame ou durante sua realização, incluindo
  óculos, próteses e órteses.

  Na eventualidade do candidato adentrar o recinto da sala de provas portando materiais ou
  equipamentos que saiba serem proibidos e não previamente autorizados, deverá, antes de sentar-se
  e independentemente de orientação do fiscal de prova, guardá-los dentro da bolsa ou mochila.

  Aparelhos celulares e relógios, independentemente do modelo, devem ser acondicionados no
  envelope plástico de segurança fornecido pelo fiscal e os aparelhos de telefonia ou comunicação
  devem ser desligados e, se emitirem qualquer ruído, ou verificado estarem de algum modo
  ativos, implicarão na eliminação do candidato.

  A identificação de porte de material proibido e não autorizado depois que o candidato se
  sentar implicará a anulação do exame, com atribuição de notas zero a todas as provas, e
  retirada do candidato do recinto.

  A ANAC, o executante, o fiscal de prova ou o administrador das dependências onde se localiza
  a sala de provas não se responsabilizará por materiais ou equipamentos deixados no recinto
  da sala de provas após a saída do candidato.

  Será vedado aos servidores da ANAC, aos executantes e fiscais de prova manterem sob sua
  guarda e responsabilidade materiais ou equipamentos de qualquer natureza portados por candidato.

  Os condomínios ou administradores dos edifícios onde estão instaladas as salas de provas
  podem fixar, em regulamento interno, regras próprias de vestimenta para admissão e permanência
  em suas dependências que vedem o uso de mini blusas, minissaia, shorts, bermuda, camiseta
  regata e chinelos, por exemplo.

  O executante informará, sempre que possível, no momento do agendamento, quaisquer restrições
  específicas.


  Identificação do Candidato

  A identificação do candidato será feita pelo fiscal de prova, ou terceiro designado, que
  confronta o documento de identificação original com a fotografia do candidato na ficha cadastral
  junto ao Cadastro Brasileiro do Pessoal da Aviação Civil, reproduzida na lista de presença.

  Os documentos contendo foto atual e número do CPF considerados válidos para identificação
  do candidato são listados no endereço: https://www.gov.br/anac/pt-br/assuntos/regulados/profissionais-da-aviacao-civil/processo-de-licencas-e-habilitacoes/documento-de-identificacao-aceitos-para-fazer-os-exames.

  Na hipótese de não constar o número de inscrição no CPF no documento de identidade, serão
  aceitos comprovantes de inscrição descritos no mesmo endereço listado no subparágrafo acima.

  Recomenda-se ao candidato que:

  porte mais de um documento de identificação, para que, nos casos em que não se consiga realizar
  a identificação pelo primeiro, seja possível fazê-lo pelos demais; e

  traga consigo documentos recentes, preferencialmente com 5 (cinco) anos ou menos de expedição.

  O candidato deverá assinar a lista de presença.


  Execução do Exame

  Cada questão das provas apresentará 4 (quatro) alternativas (A; B; C; D) e uma única resposta
  correta.

  O candidato deverá obrigatória e necessariamente indicar uma alternativa em cada questão
  de prova.

  A interpretação da questão e alternativas será parte das provas e será vedado ao fiscal
  de prova fornecer qualquer orientação após iniciado o exame.

  O candidato poderá marcar para eventual interposição de recurso às questões em que não localize
  alternativa cabível para atender o comando, que entenda haver mais de uma alternativa cabível,
  ou sobre a qual tenha dúvida ou discordância em sua formulação.

  Quando do encerramento do exame, o candidato visualizará:

  as questões que foram marcadas para interposição de recurso;

  o gabarito para as questões marcadas;

  a alternativa assinalada; e

  número de acertos.

  O acesso do candidato ao exame será restrito ao momento do encerramento, não podendo sair
  da sala de provas levando nada que permita a terceiro conhecer o conteúdo de qualquer questão.

  Em caso de interrupção do exame por problemas de infraestrutura, tais como falta de energia
  elétrica ou mau funcionamento dos recursos de informática, o candidato deverá aguardar na
  sala de provas o restabelecimento do sistema.

  A contagem de tempo do exame será suspensa a partir do momento da interrupção. Após o restabelecimento
  das condições normais, o candidato deverá prosseguir com a realização do exame, retomando-se
  a contagem de tempo.

  As questões que já houverem sido respondidas pelo candidato até o momento da interrupção
  serão salvas automaticamente pelo sistema de provas informatizado, e poderão ser retomadas
  normalmente após o reinício do exame.

  Após 30 (trinta) minutos de interrupção, será facultado ao candidato reagendar a totalidade
  do exame, sem pagamento de nova TFAC, para a mesma ou outra sala de provas, sendo vedado
  o processamento parcial do exame interrompido.

  Após uma hora de interrupção, será obrigatório o novo agendamento do exame, nas mesmas condições
  estabelecidas no parágrafo anterior.


  Resultados do Exame

  O candidato será notificado pelo executante em até 5 (cinco) dias úteis após o término do
  exame, por correio eletrônico, da disponibilização do resultado oficial em seu sistema informatizado,
  para acesso via Internet.

  Será publicado pela ANAC na página https://www.gov.br/anac/pt-br/assuntos/regulados/profissionais-da-aviacao-civil/processo-de-licencas-e-habilitacoes/exame-teorico:

  em até 7 (sete) dias uteis após o exame, o resultado do exame;

  em até 30 (trinta) dias após eventual interposição, os resultados alterados em razão de
  recurso; e

  o resultado tornado definitivo com o trânsito em julgado de decisão em processo administrativo
  sancionatório que tenha determinado a eliminação do candidato.

  Os resultados dos exames poderão ser acessados por meio da página do executante.

  Caso o candidato deseje uma declaração formal de seu resultado, deverá requerê-la, por meio
  de protocolo eletrônico no Sistema SEI, devendo ser utilizado tipo de processo “Pessoal
  da Aviação Civil: Emissão de Declarações de Exames Teóricos”, e tal declaração não será
  necessária para nenhum processo da ANAC, que consulta sua própria base de dados.

  Em nenhuma hipótese será fornecido o gabarito das provas.

  Serão resultados possíveis de um exame de conhecimento teórico da ANAC tratado nesta IS:

  aprovado (APR): quando o candidato atingir, no mínimo, 70% (setenta por cento) de acertos
  em cada uma das provas que compõem o exame;

  reprovado (REP): quando o candidato obtiver aproveitamento inferior ao estabelecido para
  aprovação e não se enquadrar em uma das hipóteses de segunda época;

  segunda época (2EP): quando o candidato não obtiver aproveitamento superior ao estabelecido
  para aprovação em no máximo um número inteiro de provas inferior ou igual a (N-1)/2, onde
  N é o número total de provas que compõe o exame. Em cada uma destas provas em que o candidato
  não foi aprovado, ele deverá ter atingido no mínimo, 30% (setenta por cento) de acertos;

  faltoso (FAL): quando o candidato não comparecer à sala de provas no horário para a qual
  está agendado o exame, portando os documentos requeridos; ou

  eliminado (ELI): quanto o candidato, independentemente do número de acertos, praticar quaisquer
  das infrações previstas nesta IS ou recusar-se a realizar os procedimentos de identificação
  da ANAC.

  No caso de segunda época, o candidato poderá repetir apenas uma vez o exame composto apenas
  das matérias em que foi reprovado.

  O prazo para inscrição em exame de segunda época é de no máximo 90 (noventa) dias a contar
  da data da realização do primeiro exame.

  O candidato reprovado, faltoso não justificado, eliminado, ou que não realizar ou for aprovado
  no exame de segunda época no prazo estabelecido deverá se inscrever para novo exame de conhecimento
  teórico completo.

  O resultado da eliminação prevalece sobre todos os demais. Adicionalmente, o candidato eliminado
  fica sujeito a eventuais sanções administrativas e penais cabíveis.


  Falta Justificada

  A falta a um exame possui os mesmos efeitos da reprovação, a não ser que o candidato apresente
  recurso e que este seja deferido pela ANAC.

  O candidato faltoso poderá apresentar recurso de sua falta no sítio eletrônico do executante,
  através do menu Justificativa, no prazo de até 5 (cinco) dias corridos, a partir da data
  em que seria realizado o seu exame.

  No recurso, o candidato deverá apresentar justificativa para o não comparecimento e anexar
  documentação comprobatória. São consideradas justificativas aceitáveis para o deferimento
  do recurso:

  óbito de pais ou responsáveis legais, irmãos, filhos ou pessoas de quem o candidato detenha
  a guarda, cônjuges ou companheiros, quando o óbito ocorrer a menos de 10 (dez) dias da data
  do exame;

  atestado médico que comprove a impossibilidade de comparecimento do candidato na data do
  exame;

  estados de defesa, calamidade pública ou sítio, em vigência na data e no município em que
  seria realizado o exame; e

  demais casos em que o candidato não tenha dado causa a sua falta, sujeito nesses casos à
  avaliação de razoabilidade pelo executante ou pela ANAC.

  Não será aceito atestado para consulta ou exame médico de rotina, ou atestado de acompanhamento
  de outra pessoa que não o candidato.

  Em caso de deferimento do recurso por não comparecimento ao local do exame, o candidato
  deverá agendar outra data para a realização do exame sem pagamento de nova TFAC.


  Infrações

  Constituirão infrações administrativas graves, que eventualmente poderão ensejar notícia
  crime:

  apresentar informações ou documentos falsos para a realização do exame;

  ler em voz alta, gesticular ou sussurrar durante a leitura das questões do exame;

  ajudar ou receber ajuda de qualquer pessoa na resolução das questões do exame durante o
  período em que o exame estiver sendo aplicado;

  usar, introduzir ou tentar introduzir no ambiente de realização dos exames qualquer anotação
  ou material proibido;

  deixar a sala de provas sem ser autorizado por um fiscal ou sem haver terminado seu exame;

  praticar ato de indisciplina, desrespeito ou desobediência à fiscalização durante qualquer
  fase das atividades referentes aos exames;

  copiar, fornecer ou receber cópia do conteúdo de qualquer exame, sem que tenha sido autorizado
  pela ANAC; e

  tomar parte em exame em nome de outra pessoa, ou permitir que outra pessoa o faça em seu
  lugar.

  O resultado obtido pelo candidato poderá ser suspenso pela ANAC caso, após a conclusão do
  exame, surjam fundadas suspeitas de que o candidato tenha apresentado condutas proibidas,
  utilizado materiais proibidos ou se utilizado de quaisquer meios ilícitos para se inscrever
  ou realizar o exame, e a suspensão será mantida até a conclusão do processo administrativo
  de apuração da irregularidade e eventual processo administrativo sancionatório.


  Recursos

  O candidato somente poderá interpor recurso em primeira instância no momento imediatamente
  após o encerramento do exame, por meio do mesmo sistema de provas informatizado do executante
  e conforme orientação do fiscal da sala de provas, que disponibilizará 30 (trinta) minutos
  para a redação do recurso, após o preenchimento da resposta à última questão.

  Caso o candidato tenha marcado uma questão como passível de recurso e não redija os argumentos
  no campo apropriado, o recurso relativo a essa questão será desconsiderado.

  O exercício do direito de recurso à segunda instância somente poderá ser requerido em caso
  de indeferimento do recurso em primeira instância, devendo a interposição ser realizada
  por meio do protocolo eletrônico no Sistema SEI, cujo tipo de processo será "Pessoal da
  Aviação Civil: Análise de Recursos de Exames Teóricos".

  Não serão aceitos recursos interpostos por correio eletrônico (e-mail), correio físico ou
  outro meio que não seja o especificado nesta IS.

  Não será analisado o recurso:

  que não apresente justificativa;

  sem fundamentação, inconsistente ou incoerente; ou

  cuja argumentação atinja a dignidade do fiscal de prova, o executante, de servidores da
  ANAC ou a própria ANAC.

  O recurso será decidido em segunda e última instância pelo Coordenador de Exames da ANAC.

  Os resultados de exames que sejam alterados após recurso serão retificados no sistema informatizado
  do executante e no portal da ANAC na Internet.

  Em hipótese alguma será deferido pedido de vista de prova(s).


  Proteção de Dados Pessoais

  As operações de tratamento de dados pessoais, realizadas no âmbito dos processos informatizados
  de exames de conhecimento teórico de que trata esta Portaria, pelo executante ou pela ANAC,
  ocorrerão de acordo com a legislação brasileira sobre proteção de dados pessoais vigente
  e aplicável, em especial a Lei nº 13.709, de 14 de agosto de 2018, que dispõe a Lei Geral
  de Proteção de Dados Pessoais - LGPD, e com o disposto nesta subseção.

  O executante e a ANAC são agentes de tratamento segundo a responsabilidade que assumiram
  em função do contrato que mantém para execução indireta de serviço da ANAC para inscrição,
  agendamento e aplicação do exame de conhecimento teórico, conforme o Decreto nº 9.507, de
  21 de setembro de 2018.

  Será vedado aos agentes de tratamento compartilhar os dados pessoais a que tiverem acesso
  em razão desta Portaria, sem anonimização, graciosa ou onerosamente, com terceiros sem relação
  com a execução dos processos informatizados de exames de conhecimento teórico ou com entes
  subsidiários, controladores, controlados ou afiliados.

  O interessado, ao realizar sua inscrição em um exame, concordará com o tratamento de seus
  dados pessoais para fins de realização dos objetivos desta IS.

  Prévia e necessariamente, a alteração de qualquer finalidade para a qual o tratamento de
  dados pessoais foi autorizado deverá ser informada ao interessado, na qualidade de titular
  de dados pessoais.

  Para os fins desta Portaria, os agentes de tratamento não irão solicitar, registrar, armazenar,
  compartilhar entre si e utilizar dados pessoais sensíveis, com exceção dos biométricos e
  de necessidades especiais indicadas na subseção 5.4 desta IS.

  Após o período de 180 (cento e oitenta dias) contados a partir da realização do exame, os
  dados pessoais sensíveis coletados no momento da inscrição ou recebidos para a marcação
  da presença serão eliminados pelo executante.

  A coleta de imagens de vídeo, que pode ocorrer durante a realização das provas, será feita
  pela empresa administradora do local de exame escolhido pelo interessado, sendo que poderá
  haver o compartilhamento desses dados com os agentes de tratamento, no caso de ser necessária
  a verificação de eventuais irregularidades ocorridas durante a realização do exame.

  Os agentes de tratamento, na qualidade de controladores, terão como encarregado pelo tratamento
  de dados pessoais a pessoa competente indicada segundo seus atos constitutivos e regras
  internas para atender o disposto no art. 41 da LGPD.

  Os dados pessoais coletados e tratados serão armazenados pelo tempo necessário para o cumprimento
  das finalidades dos tratamentos, incluindo obrigações legais e regulatórias, contratuais,
  de prestação de contas ou no caso de requisições por autoridades competentes.


