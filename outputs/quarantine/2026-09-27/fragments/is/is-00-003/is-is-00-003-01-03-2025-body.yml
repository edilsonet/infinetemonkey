  AVI 1 - AVIÔNICOS - EXAME: AVI


  INGLÊS TÉCNICO - AVIÔNICOS


  Conhecer o vocabulário básico de ferramentas, componentes e equipamentos, sistemas de aeronaves
  em língua inglesa relacionados a habilitação Aviônicos.


  Interpretar informações, textos técnicos e manuais em língua inglesa relacionados a habilitação
  Aviônicos.


  INSTRUMENTOS DE AERONAVES


  Identificar os tipos de instrumentos de uma aeronave, os componentes básicos de cada um
  deles e o princípio de funcionamento.


  Conhecer os procedimentos e precauções no manuseio e instalação dos instrumentos, a fonte
  de alimentação de cada um e sua finalidade na aeronave.


  Compreender a classificação, as características de construção e os procedimentos de instalação
  dos instrumentos das aeronaves.


  Efetuar adequadamente os procedimentos de remoção e de instalação dos instrumentos das aeronaves.


  Desmontar, inspecionar, montar e calibrar instrumentos de aeronaves.


  Realizar testes, calibragem e manutenção dos diversos instrumentos de aeronaves e seus componentes.


  Efetuar inspeção, testes e compensação de bússolas.


  Detectar defeitos e reconhecer o desempenho dos diversos instrumentos de aeronaves e seus
  componentes.


  Reconhecer as condições de balanceamento do rotor de instrumentos giroscópicos.


  Efetuar as marcações de limites de acordo com os manuais do fabricante da aeronave.


  SISTEMAS ELÉTRICOS DE AERONAVES


  Conhecer as caraterísticas dos sistemas elétricos de acordo com o porte das aeronaves.


  Identificar os fatores que influenciam na escolha do material e da bitola de fios para uma
  instalação elétrica de aeronaves.


  Identificar os símbolos gráficos básicos empregados em diagramas elétricos e eletrônicos.


  Compreender os processos de identificação de fios e cabos condutores.


  Efetuar os procedimentos adequados para inspeção, substituição, instalação e manutenção
  de equipamentos elétricos, de metalização, de cablagens e encaminhamento de fiações.


  Realizar instalação, remoção, testes e manutenção em sistemas de iluminação de aeronaves.


  Aplicar os procedimentos adequados na decapagem, estanhagem e soldagem de condutores.


  Compreender os princípios de funcionamento dos dispositivos de proteção de circuitos.


  Realizar instalação, remoção, inspeção, testes e manutenção nas baterias empregadas nas
  aeronaves.


  Adotar as normas de segurança necessárias e técnicas padronizadas durante a instalação elétrica,
  a amarração de condutores e os procedimentos de manutenção de aeronaves.


  Inspecionar, reparar e substituir componentes dos sistemas elétricos das aeronaves.


  Reconhecer os limites de carga elétrica dos circuitos.


  Efetuar os procedimentos adequados para a substituição de pinos de módulos de aterramento.


  SISTEMAS DE COMUNICAÇÃO E DE NAVEGAÇÃO


  Identificar a função dos componentes dos sistemas de comunicação e de navegação e a sua
  localização na aeronave


  Descrever as condições de instalação dos equipamentos e os procedimentos de manutenção previstos
  pelo fabricante da aeronave


  Instalar, remover, inspecionar, substituir e executar serviços de baixa complexidade em
  sistemas de comunicação e de navegação, inclusive sistemas de piloto automático, servomecanismos,
  sistemas de acoplamento de aproximação, sistemas de intercomunicação, sistemas VOR, ILS,
  LORAN, Radar beacon, FMS e GPWS.


  AVI 2 - AVIÔNICOS - EXAME: AVI


  SISTEMAS ELÉTRICOS DE PARTIDA E DE IGNIÇÃO DE MOTORES


  Reconhecer as características e componentes dos sistemas elétricos de partida e de ignição
  dos motores convencionais e dos motores à reação.


  Compreender os princípios de funcionamento dos sistemas elétricos de partida e de ignição
  dos motores convencionais e dos motores à reação.


  Executar os procedimentos de inspeção e de manutenção dos sistemas de partida e de ignição
  dos motores convencionais e dos motores à reação.


  SISTEMAS ELÉTRICOS DE PROTEÇÃO CONTRA OS EFEITOS DO GELO E DA CHUVA E CONTRA FOGO


  Descrever o desempenho de cada componente dos sistemas de detecção e eliminação do gelo
  em aeronaves e hélices.


  Conhecer os sistemas de controle de gelo, geada e neblina no para-brisa.


  Conhecer e distinguir os componentes dos sistemas de detecção e de extinção de fogo, bem
  como os tipos de agentes extintores.


  Instalar, remover, inspecionar, substituir e executar outros serviços de baixa complexidade
  em componentes de sistemas elétricos de proteção contra os efeitos do gelo e da chuva e
  contra fogo em estruturas.


  Instalar, remover, inspecionar, substituir e executar serviços de baixa complexidade em
  componentes elétricos dos sistemas de detecção e de extinção de fogo no motor.


  Instalar, remover, inspecionar, substituir e executar serviços de baixa complexidade em
  componentes elétricos dos sistemas de controle de gelo e chuva no motor.


  ELETRÔNICA BÁSICA


  Entender o funcionamento e realizar medições utilizando o osciloscópio.


  Entender o funcionamento e uso dos diversos tipos de dispositivos semicondutores.


  Analisar esquemas e circuitos que utilizam dispositivos semicondutores.


  Entender os fatores que afetam a estabilidade dos circuitos transistorizados, bem como os
  meios de estabilização.


  Entender a alimentação de um circuito eletrônico, bem como a proteção contra sobrecarga.


  Realizar testes em circuitos eletrônicos.


  ELETRÔNICA DIGITAL


  Entender o funcionamento de portas lógicas e circuitos combinacionais


  Distinguir as características dos diversos circuitos de um microprocessador.


  Compreender os sistemas de base usados em computadores.


  Efetuar conversão de bases dos sistemas de numeração.


  Efetuar operações de aritmética binária.


  Reconhecer as características dos circuitos de comutação.


  Distinguir as características dos diferentes tipos de encapsulamento dos circuitos integrados.


  Compreender a função dos circuitos multiplexadores e demultiplexadores.


  Identificar os diversos tipos de Flip-flop.


  Reconhecer as diversas classificações da memória.


  Analisar o funcionamento de conversores digital-analógico e analógico-digital.


  Descrever o princípio de funcionamento da CPU.


  Reconhecer os símbolos usados nas representações gráficas de um fluxograma.


  Reconhecer a influência de fenômenos sobre a manutenção de sistemas eletrônicos


  Compreender o funcionamento e realizar testes e manutenção em sistemas


  eletrônicos/digitai típicos


  Compreender as vantagens e desvantagens da transmissão de dados através de fibra ótica.


  Compreender os princípios de funcionamento e os tipos de visores utilizados nas aeronaves


  Efetuar o manuseio adequado de componentes sensíveis a descargas eletrostáticas


  Compreender as restrições, os requisitos de aeronavegabilidade e os possíveis efeitos catastróficos
  decorrentes de alterações não aprovadas em programas utilizados em aeronaves.


  INSPEÇÃO DE AVIÔNICOS


  Compreender os princípios de funcionamento dos componentes elétricos e eletrônicos empregados
  nas aeronaves.


  Reconhecer as condições operacionais dos componentes de aviônicos das aeronaves e os procedimentos
  para a correção dos defeitos, utilizando as informações do manual do fabricante dos equipamentos.


  Reconhecer as condições operacionais dos componentes elétricos e eletrônicos na fuselagem
  e os procedimentos para a correção dos defeitos, utilizando as informações do manual do
  fabricante dos equipamentos.


  Identificar defeitos nos componentes elétricos e eletrônicos das cabines, do setor das asas,
  da seção central, do setor do trem de pouso, das antenas, das luzes da empenagem, do setor
  do motor, da hélice, do setor de comunicação e de navegação, do sistema de piloto automático.


  Reconhecer os componentes internos de um RCCB (disjuntor diferencial).


  Reconhecer as finalidades das inspeções especiais.


  Manusear adequadamente os materiais, ferramentas básicas, equipamentos, instrumentos e componentes
  empregados em oficinas de manutenção dos sistemas aviônicos, de acordo com as normas de
  segurança.


  Executar manutenção elétrica de acordo com as normas de conservação e guarda de material.


  Consultar adequadamente as normas, os manuais e diagramas elétricos para identificação de
  condutores e circuitos elétricos.


  Analisar esquemas dos diversos circuitos dos equipamentos.


  Identificar os princípios básicos de conduta no laboratório e as regras de segurança e de
  conservação dos equipamentos.


  Executar os procedimentos práticos de manutenção nos componentes dos sistemas eletrônicos
  de aeronaves.


  Efetuar testes nos equipamentos eletrônicos de aeronaves.


  Operar componentes de indicação de funções eletrônicas.


  Realizar inspeção e manutenção nas antenas.


  Efetuar testes de bancada.


  Efetuar adequadamente os procedimentos de remoção e instalação de componentes elétricos
  e eletrônicos dos sistemas de aviônicos das aeronaves.


  BAS - MÓDULO BÁSICO - EXAMES: BAS, AVI, CEL E GMP


  COMUNICAÇÃO ORAL E ESCRITA


  Conhecer os conceitos da comunicação oral e escrita e identificar os diferentes tipos de
  comunicação.


  Organizar dados e informações necessárias ao processo de comunicação e aplicar técnicas
  de redação apropriadas em matéria de estrutura, linguagem e apresentação de documentos.


  Redigir documentos técnicos para demonstrar domínio na comunicação escrita, quanto à coesão
  e coerência textual, à correção e à clareza da linguagem, do ponto de vista da norma gramatical.


  MATEMÁTICA


  Efetuar as operações fundamentais nos conjuntos de números inteiros


  Resolver problemas pelo uso de percentagem, razão e proporção.


  Executar operações algébricas.


  Interpretar dados representados em gráficos e tabelas.


  Calcular área e volume de figuras geométricas.


  Efetuar medições utilizando o sistema métrico e o sistema inglês (imperial).


  CIÊNCIAS NATURAIS


  Entender e aplicar os princípios das máquinas (alavanca, plano inclinado simples etc.).


  Reconhecer os princípios da Física aplicáveis às aeronaves e seus sistemas.


  Identificar as leis da Física aplicáveis à aviação.


  Entender os conceitos básicos da matéria e átomo.


  Reconhecer os materiais e substâncias presentes nas diversas atividades realizadas na manutenção
  de aeronaves.


  DESENHO TÉCNICO


  Interpretar os diferentes tipos de desenhos, diagramas e esquemas utilizados na manutenção.


  Executar os diferentes tipos de desenhos técnicos aplicáveis à manutenção.


  Elaborar diagramas e desenhos técnicos específicos da manutenção segundo as normas da ABNT.


  INGLÊS BÁSICO E TÉCNICO


  Conhecer a gramática e o vocabulário básico da língua inglesa.


