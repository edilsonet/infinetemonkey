title: APÊNDICE O - MODELO DE AVALIAÇÃO DE ESTÁGIO DE MATURIDADE DO CRM
text: 'APÊNDICE O - MODELO DE AVALIAÇÃO DE ESTÁGIO DE MATURIDADE DO CRM

  Este modelo de avaliação de maturidade do CRM adota quatro estágios para diferenciar os
  vários níveis de

  implementação do CRM nos operadores aéreos. A fig.1 mostra em linhas gerais a diferença
  entre baixa e alta

  maturidade e os quatro estágios de maturidade.

  MATURIDADE DO PROGRAMA DE CRM

  BAIXA MATURIDADE ALTA MATURIDADE

  - Treinamentos de CRM

  isolados não coordenados

  - Objetivos do CRM

  desvinculados de pesquisas

  internas de segurança

  operacional

  - Pessoa chave

  - Poucos recursos

  - Reatividade

  - Estático

  - Treinamento de CRM coordenado

  com a política de Fatores Humanos e

  com os níveis estratégico, tático e

  operacional

  - CRM vinculado ao SGSO, Safety,

  treinamentos em simulador, exames

  - Amplo envolvimento organizacional

  - Recursos eficientes

  - Proatividade

  - Voltado para o crescimento

  Figura 1 - Comparação entre baixa e alta maturidade e os quatro estágios de maturidade do
  CRM dos

  operadores aéreos.

  Estágio 1: Sub Protocolar - O operador aéreo no estágio 1 de maturidade está em situação
  de não

  conformidade com os requisitos e orientações normativas (RBAC e IS). Pode ter iniciativas
  relacionadas ao

  PCRM mas estas estão descoordenadas e desestruturadas. Tipicamente, tal operador demonstrará
  uma

  combinação dessas características:

  - Falta de processos documentados

  - Falta de coordenação dos processos de segurança com os de treinamento

  - Esforços individuais

  - Escopo limitado

  - Envolvimento mínimo de pessoas da organização

  Estágio 2: Protocolar - O operador aéreo com estágio 2 de maturidade está conforme com os
  requisitos e

  orientações normativas, mas necessita progredir na capacitação dos facilitadores e aumentar
  o número

  de pessoas que avaliem e validem o treinamento de CRM com adequado grau de expertise. Tipicamente,

  tal operador demonstrará uma combinação dessas características:

  - Processos documentados

  - Início de um gerenciamento coordenado entre o PCRM e outros métodos de gerenciamento

  de segurança operacional (SGSO, LOSA, RELPREV, auditorias, entre outros)

  - Treinamento abrangente e formal

  - Esforço de maior número de pessoas e setores

  - Facilitadores de CRM selecionados e treinados de acordo com a IS'
