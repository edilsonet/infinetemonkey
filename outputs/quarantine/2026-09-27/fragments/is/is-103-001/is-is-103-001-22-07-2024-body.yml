text: '22.07.2024

  OBJETIVO

  1.1. Estabelecer e esclarecer a forma de cumprimento dos requisitos dispostos no RBAC nº
  103 e a metodologia utilizada pela ANAC, em coordenação com Departamento de Controle do
  Espaço Aéreo (DECEA), para a administração das atividades aerodesportivas em veículos ultraleves.

  REVOGAÇÃO

  2.1. Esta IS revoga a IS nº 103-001 Revisão D.

  FUNDAMENTOS

  3.1. A Resolução nº 30, de 21 de maio de 2008, institui, em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2. O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de
  requisito previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3. O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4. A IS não pode criar requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.

  DEFINIÇÕES

  4.1. Para os efeitos desta IS, são válidas as definições listadas nos RBAC nº 01, 61e 103,
  e as seguintes definições:

  4.1.1. espaço de voo - designação genérica de uma área tridimensional limitada horizontal
  e verticalmente;

  4.1.2. espaço de voo especificamente autorizado - espaço de voo aprovado pelo DECEA, destinado
  à prática de atividades específicas, como, por exemplo, as atividades regidas pelo RBAC
  nº 103; e

  4.1.3. área de operação - área que envolve o espaço de voo especificamente autorizado pela
  autoridade de controle do espaço aéreo e a área de superfície localizada imediatamente sob
  esse espaço, na qual ocorrerão pousos e decolagens, desde que o local suporte a operação
  do equipamento utilizado.

  Nota: para fins desta IS e de toda a regulamentação afeta ao RBAC nº 103, o uso do termo
  genérico “espaço de voo” refere-se aos espaços de voo especificamente autorizados para operações
  segundo o RBAC nº 103.

  4.2. Lista de siglas

  ANAC - Agência Nacional de Aviação Civil

  CA - Certificado de Aeronavegabilidade

  CAV - Certificado de Autorização de Voo

  CAVE - Certificado de Autorização de Voo Experimental

  CPF - Cadastro de Pessoa Física

  CNPJ - Cadastro Nacional de Pessoa Jurídica

  DECEA - Departamento de Controle do Espaço Aéreo

  IS - Instrução Suplementar

  RAB - Registro Aeronáutico Brasileiro

  RBAC - Regulamento Brasileiro da Aviação Civil

  SPO - Superintendência de Padrões Operacionais

  UF - Unidade da Federação

  PROCEDIMENTOS

  5.1. Aplicabilidade

  5.1.1. O RBAC nº 103 aplica-se a balões livres tripulados que não sejam detentores de um
  certificado de aeronavegabilidade (CA padrão ou CAVE) e a veículos ultraleves, como por
  exemplo:

  a) asas voadoras não motorizadas (asas delta e parapentes);

  b) asas voadoras motorizadas (trikes, paramotores ou paratrikes);

  c) autogiros ou girocópteros; e

  d) aviões ultraleves.

  5.1.2. Caso sejam ultrapassados os limites estabelecidos na seção 103.1 do RBAC nº 103,
  o dispositivo deve possuir certificado de aeronavegabilidade conforme instruções do RBAC
  nº 21 e o operador fica sujeito à operação segundo o RBAC nº 91 e à necessidade de habilitação
  do piloto conforme o RBAC nº 61.

  5.2. Responsabilidade

  5.2.1. É de responsabilidade do praticante conhecer os locais adequados para a prática e
  respeitar as regras de operação, conhecer seus limites, vigência e condições especiais aplicáveis,
  sob pena de enquadramento no seção 103.701 do RBAC nº 103. É proibido decolar sem possuir
  esse conhecimento.

  5.3. Cadastro de aerodesportistas e de aeronaves

  5.3.1. A operação de veículo ultraleve ou balão livre tripulado segundo RBAC nº 103 não
  requer habilitação de piloto ou certificado de aeronavegabilidade emitidos pela ANAC. Contudo,
  o piloto deve possuir certidão de cadastro de aerodesportista e a certidão de cadastro da
  aeronave na forma estabelecida por esta IS.

  5.3.2. O gerenciamento dos dados de aerodesportistas e aeronaves ultraleves motorizadas
  é de responsabilidade das associações credenciadas, sob supervisão da ANAC.

  5.3.3. O cadastro da aeronave só é possível associado a um aerodesportista cadastrado (operador)
  e a uma associação responsável pelo cadastro.

  5.3.4. Procedimento para cadastro de aerodesportistas

  5.3.4.1 O procedimento tem início com o cadastro prévio a ser realizado pelo próprio aerodesportista
  por meio do sistema AERODESPORTO-103, disponível no sítio https://sistemas.anac.gov.br/aerodesporto103,
  criando login e senha, preenchendo os dados solicitados pelo sistema e efetuando o upload
  dos documentos necessários.

  5.3.4.2 O aerodesportista deve procurar uma das associações credenciadas para a efetivação
  do cadastro junto à ANAC, devendo comprovar que detém os conhecimentos mínimos necessários
  para o cumprimento das regras operacionais e de uso do espaço aéreo, conforme requisito
  estabelecido no parágrafo 103.7(a)(1) do RBAC nº 103.

  5.3.4.3 O procedimento de cadastro de aerodesportista deve ser realizado pelas associações
  credenciadas e requer documentos de identidade, CPF, comprovante de residência e o atestado
  de capacidade técnica ou documento equivalente.

  5.3.4.4 É de responsabilidade das associações aerodesportivas emitir atestado de capacidade
  técnica, mediante aplicação de teste de conhecimentos, ou por meio da apresentação de qualquer
  habilitação ou certificado de piloto emitido pela ANAC ou, ainda, habilitação emitida pela
  própria entidade credenciada, desde que a entidade demonstre que os requisitos de habilitação
  alcançam os objetivos estabelecidos no parágrafo 103.7(a)(1) do RBAC nº 103 (deter os conhecimentos
  mínimos necessários para o cumprimento das regras operacionais e de uso do espaço aéreo).

  5.3.4.5 Concluído o cadastro pela entidade, o aerodesportista poderá, por meio de seu login
  e senha, gerenciar e alterar seus dados cadastrais, bem como emitir a certidão de cadastro
  de aerodesportista.

  5.3.4.6 A certidão de cadastro de aerodesportista é documento de porte obrigatório, em meio
  físico ou digital, conforme estabelecido no parágrafo 103.7(d) do RBAC nº 103, para fins
  de fiscalização.

  5.3.5. Procedimento para cadastro de aeronaves sob o RBAC nº 103

  5.3.5.1 O procedimento tem início com o cadastro prévio da aeronave a ser realizado pelo
  aerodesportista proprietário ou responsável pelo equipamento, por meio do sistema AERODESPORTO-103,
  disponível no sítio https://sistemas.anac.gov.br/aerodesporto103, com uso de seu login e
  senha, preenchendo os dados iniciais solicitados pelo sistema e efetuando o upload dos documentos
  necessários.

  5.3.5.2 É facultado ao aerodesportista a escolha dos dígitos alfanuméricos que comporão
  o código de cadastro da sua aeronave; entretanto, caso o código escolhido já esteja cadastrado,
  o pretendente deve escolher outra combinação.

  5.3.5.3 Após o preenchimento do pré-cadastro e a definição do código alfanumérico, é responsabilidade
  do aerodesportista providenciar sua marcação na aeronave, de modo que essas marcas sejam
  claramente visíveis com a aeronave a pelo menos 50 metros de altura em relação ao observador
  no solo, para atendimento ao requerido pelo parágrafo 103.7(b) do RBAC nº 103. Essa marcação
  não constitui registro da aeronave junto ao Registro Aeronáutico Brasileiro, servindo tão
  somente para a identificação do responsável pela aeronave sob o RBAC nº 103.

  Nota: a marcação visível de que trata o item 5.3.5.3 desta IS é o código de registro criado
  durante o cadastramento da aeronave no sistema, sendo composta pelas letras “BR” seguidos
  de quatro dígitos alfanuméricos.

  5.3.5.4 O aerodesportista deve então procurar uma das associações credenciadas para a efetivação
  do cadastro da aeronave junto à ANAC. É de responsabilidade da associação a vistoria técnica
  do equipamento, bem como a inclusão das fotos requeridas pelo sistema AERODESPORTO-103.

  Nota: O cadastro pendente da aeronave, sem a devida efetivação pelas associações credenciadas
  junto à ANAC, não é válido, e a aeronave nessa condição encontra-se em situação irregular.

  5.3.5.5 Finalizado o cadastro, a associação enviará ao aerodesportista uma cópia da certidão
  de cadastro da aeronave, que pode ser consultada diretamente no sistema da ANAC a qualquer
  momento.

  5.3.5.6 A certidão de cadastro de aeronave é documento de porte obrigatório, em meio físico
  ou digital, conforme estabelecido no parágrafo 103.7(d) do RBAC nº 103, para fins de fiscalização.

  5.4. Solicitação de aprovação de espaço de voo

  5.4.1. A solicitação de aprovação de espaços de voo para a prática de atividades aerodesportivas,
  em caráter temporário ou permanente, deve ser realizada diretamente junto ao DECEA, seguindo
  os requisitos e diretrizes das normas daquele órgão. O solicitante deve assegurar-se de
  que os espaços de voo pleiteados não implicarão em sobrevoo das áreas proibidas indicadas
  no parágrafo 103.15(a) do RBAC nº 103.

  5.5. Regras de operação

  5.5.1. A seção 103.11 do RBAC nº 103 estabelece o conjunto de regras que devem ser observadas
  pelo praticante durante o voo. É responsabilidade exclusiva do praticante o conhecimento
  e o respeito às regras de operação, estando os infratores sujeitos às penalidades administrativas
  e penais, conforme especificado na seção 103.701 do mesmo Regulamento.

  5.5.2. Caso a atividade seja praticada em veículo ultraleve ou balão livre tripulado que
  comporte mais de um desportista, todos os envolvidos devem ser conscientizados da natureza
  desportiva da atividade e de que a ANAC não garante a segurança da operação, sendo o piloto
  e a aeronave desprovidos de qualquer certificado de capacidade técnica reconhecido pela
  ANAC, cabendo aos praticantes a responsabilidade pelo gerenciamento do próprio risco.

  5.5.3. Da instrução: os operadores de veículos ultraleves ou balões livres tripulados que
  se dediquem à formação ou adestramento de forma remunerada de outros desportistas devem
  possuir o seguro contra danos ao pessoal técnico a bordo.

  5.5.3.1 Embora o parágrafo 103.7(c) mencione, adicionalmente, a necessidade de seguro contra
  danos às pessoas ou bens na superfície, observa-se que essa cobertura somente é requerida
  no caso de existir risco específico a pessoas ou bens na superfície, o que pode ocorrer
  nos seguintes casos:

  a) autorização especial na forma da seção 103.5 do RBAC nº 103, se a ANAC incluir essa exigência
  como condicionante para emissão da autorização; ou

  b) autorização especial citada no parágrafo 103.15(a)(1) do RBAC nº 103, em razão de a operação
  ocorrer sobre áreas densamente povoadas, aglomerados rurais, aglomeração de pessoas, áreas
  proibidas ou restritas

  Nota: embora o parágrafo 103.7(c) faça referência ao art. 178, § 1º da lei nº 7.565, de
  19 de dezembro de 1986 (Código Brasileiro de Aeronáutica - CBA), e este dispositivo tenha
  sido revogado pela Lei nº 14.368, de 14 de junho de 2022, a exigência de seguro continua
  aplicável em razão da previsão constante no art. 281, III do CBA.

  5.5.4. Da comercialização: é proibida a comercialização de voos de aerodesporto que operem
  segundo o RBAC nº 103, exceto voos de instrução.

  5.5.5. O parágrafo 103.15(a) do RBAC nº 103 proíbe a operação sobre áreas urbanas, aglomerados
  rurais, aglomeração de pessoas, áreas proibidas ou restritas, exceto se mediante autorização
  especial (conforme parágrafo 5.7 desta IS), aprovada pela ANAC, condicionada à autorização
  prévia emitida pela autoridade local.

  5.6. Migração

  5.6.1. Migração de aeronaves para operação segundo o RBAC nº 103

  5.6.1.1 Os operadores de aeronaves aerodesportivas, elegíveis à operação segundo o RBAC
  nº 103, que atualmente dispõe de CAVE ou CAV, caso decidam operar sob as regras do RBAC
  n° 103, devem, antes da realização do cadastro previsto na seção 103.7 do citado regulamento,
  solicitar e aguardar o cancelamento da matrícula junto ao Registro Aeronáutico Brasileiro
  - RAB.

  5.6.2. Migração de aeronaves para operação fora do RBAC nº 103

  5.6.2.1 Os operadores de aeronaves aerodesportivas, elegíveis à operação segundo o RBAC
  nº 103, caso decidam operar sob as regras da aviação geral, deverão obter certificado de
  aeronavegabilidade compatível com o dispositivo e certificado de piloto aerodesportivo junto
  à ANAC. A obtenção do certificado de aeronavegabilidade implica o cancelamento do cadastro
  previsto no parágrafo 103.7(b) do RBAC n° 103, se previamente realizado.

  5.7. Autorizações especiais

  5.7.1. Caso uma operação não atenda algum dos limites estabelecidos no RBAC nº 103, o interessado
  pode solicitar autorização especial de voo, conforme previsto na seção 103.5 do RBAC nº
  103. A ANAC poderá autorizar a operação caso haja evidências de que tal desvio não afeta
  adversamente a segurança de voo, especialmente de terceiros.

  5.7.1.1 A solicitação de autorização especial deve ser protocolada na ANAC e deve conter
  a natureza da solicitação, descrição sucinta, justificativa do pedido e anexo contendo plano
  de gerenciamento de risco e ações mitigatórias.

  5.7.1.2 A solicitação de autorização especial deve ser realizada por agremiações, associações,
  fabricantes de equipamentos aerodesportivos ou proprietários de área, diretamente à ANAC.'
