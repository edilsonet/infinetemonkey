  APÊNDICE H


  PROGRAMA DE INSTRUÇÃO AVSEC (PIAVSEC)


  H.1 POLÍTICA E OBJETIVO


  H.1.1 Política

  H.1.1.1 Promover o treinamento e gestão dos recursos humanos de forma a propiciar sua plena
  condição na operação da segurança da aviação civil contra atos de interferência ilícita.


  H.1.2 Objetivos

  H.1.2.1 Garantir a qualificação dos profissionais que desempenham atividades relacionadas
  à segurança da aviação civil para assegurar a correta aplicação do Programa Nacional de
  Segurança da Aviação Civil contra Atos de Interferência Ilícita (PNAVSEC).

  H.1.2.2 Manter meios de avaliação da atuação dos profissionais que desempenham atividade
  AVSEC de forma a garantir que os procedimentos de segurança sejam executados conforme o
  previsto.

  H.1.3 Este Programa contempla todos os profissionais que realizam atividade AVSEC em benefício
  do operador do aeródromo, sejam contratados de forma direta ou indireta.


  H.2 CONTEÚDO PROGRAMÁTICO E GRADE CURRICULAR


  H.2.1 O operador de aeródromo controla a certificação de seus profissionais, garantindo
  que os mesmos façam treinamento em centros de instrução que possuem conteúdo programático
  de acordo com o Programa Nacional de Instrução em Segurança da Aviação Civil Contra Atos
  de Interferência Ilícita (PNIAVSEC) e com os critérios deste operador.

  H.2.2 Ressalta-se que este operador pode solicitar alteração do conteúdo programático para
  melhor alinhamento com os objetivos da gestão de segurança desse aeródromo no momento de
  direcionar o treinamento dos profissionais.


  H.3 REFERÊNCIAS BIBLIOGRÁFICAS E DOCUMENTOS NORMATIVOS OU REGULAMENTARES


  H.3.1 Leis

  H.3.1.1 Lei nº 7.565, de 12 de dezembro de 1986, que dispõe sobre o Código Brasileiro de
  Aeronáutica.

  H.3.1.2 Lei nº 11.182, de 27 de setembro de 2005, que cria a Agência Nacional de Aviação
  Civil.


  H.3.2 Decretos

  H.3.2.1 Decreto nº 11.195, de 8 de setembro de 2022, que dispõe sobre o Programa Nacional
  de Segurança da Aviação Civil contra Atos de Interferência Ilícita.


  H.3.3 DAVSEC

  H.3.3.1 Diretriz de Segurança da Aviação Civil contra Atos de Interferência Ilícita (DAVSEC)
  nº 01-2015, que traz a relação de aeródromos que possuem procedimentos equivalentes de inspeção
  de segurança de passageiros e bagagens de mão e de verificação de segurança de aeronaves.

  H.3.3.2 Diretriz de Segurança da Aviação Civil contra Atos de Interferência Ilícita (DAVSEC)
  nº 02-2016, que traz os parâmetros quantitativos para realização dos procedimentos de inspeção
  de segurança aleatória nos aeródromos civis públicos brasileiros.

  H.3.3.3 Diretriz de Segurança da Aviação Civil contra Atos de Interferência Ilícita (DAVSEC)
  nº 03-2019, que traz os parâmetros quantitativos e procedimentais para realização da inspeção
  de segurança randômica em agentes públicos nos aeródromos civis públicos brasileiros.

  H.3.3.4 Diretriz de Segurança da Aviação Civil contra Atos de Interferência Ilícita (DAVSEC)
  nº 04-2021, que estabelece a relação de aeródromos em que há a obrigatoriedade de realizar
  a inspeção de segurança das bagagens despachadas para seguir em voos domésticos e os prazos
  para aplicação da medida de segurança.


  H.3.4 Resoluções

  H.3.4.1 Resolução ANAC nº 30, de 21 de maio de 2008, alterada pela Resolução nº 162, de
  20 de julho de 2010, que institui o Regulamento Brasileiro da Aviação Civil (RBAC) e a Instrução
  Suplementar (IS), estabelece critérios para elaboração e dá outras providências.

  H.3.4.2 Resolução ANAC nº 167, de 17 de agosto de 2010, que estabelece diretrizes para o
  gerenciamento de risco à Segurança da Aviação Civil contra Atos de Interferência Ilícita
  (AVSEC) pela ANAC.

  H.3.4.3 Resolução ANAC nº 254, de 6 de novembro de 2012, que aprova o Regulamento Brasileiro
  de Aviação Civil nº 108, intitulado Segurança da Aviação Civil contra Atos de Interferência
  Ilícita - Operador de aeródromo.

  H.3.4.4 Resolução ANAC nº 255, de 13 de novembro de 2012, que estabelece regras sobre a
  disponibilização de Informações Antecipadas sobre Passageiros (Advance Passenger Information
  - API) e do Registro de Identificação de Passageiros (Passenger Name Record - PNR).

  H.3.4.5 Resolução ANAC nº 361, de 16 de julho de 2015, que aprova o Regulamento Brasileiro
  de Aviação Civil nº 110, intitulado Programa Nacional de Instrução em Segurança da Aviação
  Civil contra Atos de Interferência Ilícita - PNIAVSEC.

  H.3.4.6 Resolução ANAC nº 362, de 16 de julho de 2015, que aprova o Regulamento Brasileiro
  de Aviação Civil nº 107, intitulado Segurança da Aviação Civil contra Atos de Interferência
  Ilícita - Operador de Aeródromo.

  H.3.4.7 Resolução ANAC nº 461, de 25 de janeiro de 2018, que dispõe sobre os procedimentos
  de embarque e desembarque de passageiros armados, despacho de armas de fogo e de munição
  e transporte de passageiros sob custódia a bordo de aeronaves civis.

  H.3.4.8 Resolução ANAC nº 499, de 12 de dezembro de 2018, que aprova o Programa de Segurança
  contra Atos de Interferência Ilícita da Agência Nacional de Aviação Civil (PAVSEC-ANAC).

  H.3.4.9 Resolução ANAC nº 515, de 8 de maio de 2019, que dispõe sobre os procedimentos de
  inspeção de segurança da aviação civil contra atos de interferência ilícita nos aeroportos
  e dá outras providências.


  H.4 RESPONSABILIDADES E PROCEDIMENTOS DE SELEÇÃO DOS PROFISSIONAIS PARA DESEMPENHO DE ATIVIDADES
  AVSEC


  H.4.1 Para a escolha dos profissionais que irão desempenhar as atividades AVSEC o operador
  de aeródromo garante a realização de processo de seleção que contempla:

  a) Verificação de perfil e capacidade para o desempenho das atividades AVSEC, de acordo
  com as atividades elencadas do Apêndice A do PNIAVSEC que é realizado conforme descrito
  no Formulário de Dados AVSEC do Aeródromo.

  b) Verificação da maioridade penal, por meio da apresentação de documento de identificação
  válido, com fotografia, data de nascimento e que possua fé pública.

  c) Avaliação de antecedentes, que inclui a verificação da identidade, da experiência prévia
  e dos antecedentes criminais, com o objetivo de avaliar a idoneidade de um indivíduo para
  implementação de controle de segurança e para acesso desacompanhado às áreas restritas de
  segurança do aeródromo.

  d) Avaliação de saúde física e mental para o desempenho pleno das atividades AVSEC, comprovada
  por meio de exame médico.

  H.4.2 Os exames médicos são atualizados a cada 24 (vinte e quatro) meses.

  H.4.3 O operador do aeródromo arquiva a documentação dos profissionais orgânicos e terceirizados.
  Os arquivos dos profissionais terceirizados podem ser mantidos nas instalações da empresa
  terceirizada. O arquivo é mantido de forma física ou digital.


  H.5 RESPONSABILIDADES E PROCEDIMENTOS DE RECICLAGEM


  H.5.1 O operador de aeródromo garante a reciclagem de todos os profissionais que desempenham
  atividade em seu benefício e que não demonstram proficiência durante atividade de fiscalização
  ou de controle de qualidade realizada pelo próprio operador de aeródromo ou pela Agência
  Nacional de Aviação Civil (ANAC) e nos casos previstos em regulamentação específica sobre
  Treinamento em Serviço.

  H.5.2 As ações de reciclagem são formalizadas por meio do Relatório de Reciclagem, conforme
  consta no Anexo 1 deste PIAVSEC, que apresenta um resumo das atividades realizadas e a lista
  de presença dos participantes.

  H.5.3 Após a realização da atividade de reciclagem, o operador realiza novas avaliações
  no profissional, sem avisar e de forma discreta, em quantidade suficiente para garantir
  que as fragilidades identificadas foram sanadas.


  H.6 RESPONSABILIDADES E PROCEDIMENTOS DE REALIZAÇÃO DO TREINAMENTO EM SERVIÇO


  H.6.1 O operador de aeródromo garante um Treinamento em Serviço, necessário para obtenção
  da certificação em Inspeção de Segurança da Aviação Civil, a todos os profissionais que
  desempenham atividade AVSEC em suas instalações, além de demais casos previstos em regulamentação
  específica sobre Treinamento em Serviço.

  H.6.2 O operador de aeródromo designa profissionais responsáveis para supervisão do treinamento
  em serviço (Supervisor de Treinamento) conforme regulamentação específica sobre Treinamento
  em Serviço.

  H.6.3 O profissional responsável pode fazer avaliações prévias do desempenho do profissional
  em treinamento, apresentando feedback do trabalho desenvolvido para que o profissional em
  treinamento tenha a oportunidade de melhorar o seu desempenho.

  H.6.4 Para os profissionais em Formação em Inspeção de Segurança da Aviação Civil, o Treinamento
  em Serviço somente pode se iniciar após o aluno comprovar, por meio de declaração expedida
  pelo centro de instrução, que atendeu aos critérios de aprovação 1 e 2 do Curso de Formação
  em Inspeção de Segurança em Aviação Civil (critério 1: frequência mínima igual ou superior
  a 80% da carga horária do curso; critério 2: nota na avaliação teórica igual ou superior
  a 70%).

  H.6.4.1 Após atender os critérios 1 e 2 do Curso de Formação, o profissional possui o prazo
  máximo de 12 (doze) meses para concluir o Treinamento em Serviço.

  H.6.4.2 A partir da contratação, o Treinamento em Serviço é iniciado e concluído durante
  os 30 (trinta) primeiros dias de trabalho do profissional (período de um mês).

  H.6.5 Durante o treinamento em serviço de profissionais em Formação em Inspeção de Segurança
  da Aviação Civil, cada profissional designado para atuar como Supervisor de Treinamento
  só poderá acompanhar um profissional em treinamento por vez, resguardadas especificidades
  previstas em regulamentação específica sobre Treinamento em Serviço.

  H.6.5.1 O profissional em Formação em Inspeção de Segurança da Aviação Civil, durante todo
  o período do treinamento em serviço, não pode tomar decisão relacionada à resolução de alarmes
  sem a devida supervisão direta do profissional que o está acompanhando ou avaliando.

  H.6.5.2 O profissional em Formação em Inspeção de Segurança da Aviação Civil poderá ser
  computado no cálculo do número de profissionais que deve estar disponível no módulo de inspeção
  nos casos previstos em regulamentação específica sobre Treinamento em Serviço.

  H.6.5.3 O profissional designado para atuar como Supervisor de Treinamento não poderá ser
  computado no cálculo do número de profissionais que deve estar disponível no módulo de inspeção
  nos casos previstos em regulamentação específica sobre Treinamento em Serviço.

  H.6.6 O Treinamento em Serviço para Atualização em Inspeção de Segurança da Aviação Civil
  ocorre durante a efetiva prestação de serviço de inspeção e dentro do período de validade
  da certificação vigente.

  H.6.6.1 O Treinamento em Serviço tem duração entre 6 (seis) e 24 (vinte e quatro) meses.

  H.6.6.2 Somente após a conclusão do treinamento em serviço é possível realizar matrícula
  no centro de instrução para o curso de Atualização em Inspeção de Segurança da Aviação Civil.

  H.6.7 O Treinamento em Serviço é composto pelas fases previstas em regulamentação específica
  sobre Treinamento em Serviço.

  H.6.8 No Treinamento em Serviço, o operador do aeródromo faz uso da Ficha de Avaliação contida
  em regulamentação específica sobre Treinamento em Serviço.

  H.6.9 A Ficha é composta de duas partes:

  a) Parte 1, denominada Guia de Verificação, destinada a auxiliar e registrar os resultados
  parciais da avaliação do profissional em serviço;

  b) Parte 2, denominada Guia de Encaminhamento, destinada ao registro do resultado final
  de avaliação, pelo operador, e envio ao centro de instrução, pelo profissional.

  H.6.10 O Treinamento em Serviço é finalizado com o preenchimento da ficha de avaliação,
  assinada pelo responsável designado para o acompanhamento e avaliação do Treinamento em
  Serviço.

  H.6.11 A Ficha formaliza, ao final do período, se o novo profissional está “apto” ou “não-apto”
  para desempenho de suas funções, com base nos critérios de avaliação previstos em regulamentação
  específica sobre Treinamento em Serviço.

  H.6.12 O operador de aeródromo entrega a parte 2 da ficha de avaliação ao profissional no
  prazo máximo de 10 (dez) dias após o término do Treinamento em Serviço para prosseguimento
  da sua certificação no centro de instrução.


  H.7 RESPONSABILIDADES E PROCEDIMENTOS DO CONTROLE DE CAPACITAÇÃO


  H.7.1 O operador de aeródromo garante que todos os profissionais que desempenham atividade
  AVSEC em seu benefício possuem a proficiência na execução das atividades AVSEC previstas
  no Apêndice A do PNIAVSEC.

  H.7.2 O operador de aeródromo implementa controle para garantir a certificação dos profissionais
  que desempenhem atividade em seu benefício, conforme seção F.5.3 deste PSA.


  H.8 RESPONSABILIDADES E PROCEDIMENTOS RELATIVOS AO NÍVEL DE SIGILO, ARQUIVO E GUARDA DOS
  REGISTROS


  H.8.1 O operador de aeródromo mantém registro em arquivo, por no mínimo 5 (cinco) anos,
  dos seguintes documentos:

  a) Registros de frequência e descrição das atividades de reciclagem;

  b) Declarações emitidas por centro de instrução que contenham os alunos aprovados em curso
  de Formação em Inspeção de Segurança da Aviação Civil, habilitando-os para o início do Treinamento
  em Serviço; e

  c) Fichas de avaliação dos Treinamentos em Serviço realizados.

  H.8.2 O operador de aeródromo garante que haja registros que comprovem o atendimento dos
  requisitos para desempenho de atividade AVSEC para cada profissional que realizar atividade
  AVSEC em seu benefício, enquanto o profissional mantiver relação de trabalho e até um ano
  após o seu desligamento.

  H.8.3. Os registros referentes aos procedimentos de seleção e conferência dos requisitos
  para desempenho de atividades AVSEC, bem como os documentos relativos aos procedimentos
  de reciclagem e Treinamento em Serviço de todos os profissionais são mantidos em formato
  físico ou digital.


  H.9 DETALHAMENTO DOS REQUISITOS DE INSTRUÇÃO A SEREM CUMPRIDOS PELOS PRESTADORES DE SERVIÇO


  H.9.1 Os profissionais dos prestadores de serviço terceirizados seguem os procedimentos
  definidos nos tópicos anteriores.


