  Objetivo

  Esta Instrução Suplementar estabelece o Programa de Segurança Aeroportuária (PSA) em conformidade
  com os requisitos contidos nas seções 107.211 a 107.217 e 107.221 do Regulamento Brasileiro
  de Aviação Civil - RBAC nº 107 e descreve a combinação de recursos organizacionais, materiais,
  humanos e procedimentais aceitos pela ANAC para fins de demonstração do cumprimento dos
  demais requisitos do RBAC nº 107 por parte dos operadores de aeródromo.

  Os recursos de prevenção e de resposta descritos nesta Instrução Suplementar podem ser utilizados
  como referência pelos operadores de aeródromo que não sejam obrigados a cumprir os requisitos
  constantes nas seções 107.211 a 107.221 do RBAC nº 107.


  Revogação

  Esta Instrução Suplementar revoga a Instrução Suplementar nº 107-001 Revisão K.


  Fundamentos

  Leis

  Lei nº 7.565, de 12 de dezembro de 1986, que dispõe sobre o Código Brasileiro de Aeronáutica.

  Lei nº 11.182, de 27 de setembro de 2005, que cria a Agência Nacional de Aviação Civil.


  Decretos

  Decreto nº 11.195, de 8 de setembro de 2022, que dispõe sobre o Programa Nacional de Segurança
  da Aviação Civil contra Atos de Interferência Ilícita.


  DAVSEC

  Diretriz de Segurança da Aviação Civil contra Atos de Interferência Ilícita (DAVSEC) nº
  01-2015, que traz a relação de aeródromos que possuem procedimentos equivalentes de inspeção
  de segurança de passageiros e bagagens de mão e de verificação de segurança de aeronaves.

  Diretriz de Segurança da Aviação Civil contra Atos de Interferência Ilícita (DAVSEC) nº
  02-2016, que traz os parâmetros quantitativos para realização dos procedimentos de inspeção
  de segurança aleatória nos aeródromos civis públicos brasileiros.

  Diretriz de Segurança da Aviação Civil contra Atos de Interferência Ilícita (DAVSEC) nº
  03-2019, que traz os parâmetros quantitativos e procedimentais para realização da inspeção
  de segurança randômica em agentes públicos nos aeródromos civis públicos brasileiros.

  Diretriz de Segurança da Aviação Civil contra Atos de Interferência Ilícita (DAVSEC) nº
  04-2021, que estabelece a relação de aeródromos em que há a obrigatoriedade de realizar
  a inspeção de segurança das bagagens despachadas para seguir em voos domésticos e os prazos
  para aplicação da medida de segurança.


  Resoluções

  Resolução ANAC nº 30, de 21 de maio de 2008, alterada pela Resolução nº 162, de 20 de julho
  de 2010, que institui o Regulamento Brasileiro da Aviação Civil (RBAC) e a Instrução Suplementar
  (IS), estabelece critérios para elaboração e dá outras providências.

  Resolução ANAC nº 167, de 17 de agosto de 2010, que estabelece diretrizes para o gerenciamento
  de risco à Segurança da Aviação Civil contra Atos de Interferência Ilícita (AVSEC) pela
  ANAC.

  Resolução ANAC nº 254, de 6 de novembro de 2012, que aprova o Regulamento Brasileiro de
  Aviação Civil nº 108, intitulado Segurança da Aviação Civil contra Atos de Interferência
  Ilícita - Operador Aéreo.

  Resolução ANAC nº 361, de 16 de julho de 2015, que aprova o Regulamento Brasileiro de Aviação
  Civil nº 110, intitulado Programa Nacional de Instrução em Segurança da Aviação Civil contra
  Atos de Interferência Ilícita - PNIAVSEC.

  Resolução ANAC nº 362, de 16 de julho de 2015, que aprova o Regulamento Brasileiro de Aviação
  Civil nº 107, intitulado Segurança da Aviação Civil contra Atos de Interferência Ilícita
  - Operador de Aeródromo.

  Resolução ANAC nº 461, de 25 de janeiro de 2018, que dispõe sobre os procedimentos de embarque
  e desembarque de passageiros armados, despacho de armas de fogo e de munição e transporte
  de passageiros sob custódia a bordo de aeronaves civis.

  Resolução ANAC nº 499, de 12 de dezembro de 2018, que aprova o Programa de Segurança contra
  Atos de Interferência Ilícita da Agência Nacional de Aviação Civil (PAVSEC-ANAC).

  Resolução ANAC nº 515, de 8 de maio de 2019, que dispõe sobre os procedimentos de inspeção
  de segurança da aviação civil contra atos de interferência ilícita nos aeroportos e dá outras
  providências.


  Instruções Normativas

  Instrução Normativa ANAC nº 15, de 20 de novembro de 2008, alterada pela Resolução nº 162,
  de 20 de julho de 2010, que estabelece normas e critérios para a elaboração e alteração
  de Regulamento Brasileiro da Aviação Civil e de Instrução Suplementar.


  Definições

  Ameaça: intenções declaradas de causar consequências indesejáveis (danos ou prejuízos) ou
  outra ação hostil contra instalações ou operações da aviação civil. As possíveis ameaças
  não se restringem apenas a um evento isolado, podendo ser compreendida como uma circunstância
  ou tendência potencial de ocorrência de evento adverso provocado intencionalmente pelo perpetrador.
  Essa categoria inclui, dentre outras situações, a ameaça de bomba.

  Área operacional: área do aeródromo delimitada pelo perímetro operacional (lado ar), abrangendo
  o conjunto formado pela área de movimento do aeródromo (pátio de aeronaves e áreas utilizadas
  para o pouso, decolagem e taxiamento), além de terrenos e edificações adjacentes, ou parte
  delas, cujo acesso é controlado.

  Auditoria AVSEC: avaliação detalhada de todos os aspectos previstos no PNAVSEC e na regulamentação
  da ANAC dentro das organizações envolvidas na segurança da aviação civil, para determinar
  o grau de conformidade frente à regulamentação vigente.

  Avaliação de risco: significa o processo aplicado na gestão da Segurança da Aviação Civil
  contra Atos de Interferência Ilícita de uma organização, abrangendo ao menos as etapas de
  identificação de ameaças, de vulnerabilidades e do nível de exposição das operações ao risco
  de atos de interferência ilícita.

  Cartão de embarque válido: cartão pertencente ou expedido por um operador aéreo para embarque
  no aeródromo, contendo dados, tais como data e horário, compatíveis com o momento e local
  de sua apresentação.

  Comportamento suspeito: comportamento que suscita sentimentos de alerta ou desconfiança,
  porque é fora do comum para determinado tempo, lugar ou circunstância. A determinação de
  comportamento suspeito deve basear-se no comportamento e atitude da pessoa e não adotar
  critérios de raça, idade, sexo, religião, etnia ou origem nacional.

  Equipamento de raios-x baseado em algoritmos: também conhecido como equipamento de raios-x
  com EDS (explosive detection system), é utilizado para inspeção não invasiva de objetos.
  É capaz de determinar o coeficiente de absorção de massa de um material através da interação
  da energia dos raios-x com o material, identificando substâncias com alta possibilidade
  de serem explosivas.

  Equipamento de raios-x convencional: equipamento utilizado para inspeção não invasiva de
  objetos, através da emissão de raios-x. Pode ser do tipo single view, capaz de gerar uma
  imagem de cada objeto contido num volume de bagagem, carga ou correio, ou multi-view, capaz
  de gerar duas ou mais imagens de cada objeto.

  Equipamento detector de traços explosivos: equipamento utilizado para a inspeção de pessoas
  ou objetos com tecnologia capaz de detectar a presença de pequenas quantidades de materiais
  explosivos.

  Equipamento detector manual de metais: também conhecido como “raquete”, é um equipamento
  portátil utilizado para inspeção não invasiva de pessoas, capaz de detectar a presença de
  objetos metálicos escondidos junto ao corpo dos inspecionados.

  Equipamento do tipo CT (computed tomography): equipamento utilizado para inspeção não invasiva
  de objetos que possui tecnologia CT (Computed Tomography) capaz de gerar imagens 3D dos
  volumes inspecionados e identificar com precisão os locais onde estão os possíveis materiais
  explosivos.

  Equipamento pórtico detector de metais: equipamento utilizado para inspeção não invasiva
  de pessoas, capaz de detectar a presença de objetos metálicos escondidos junto ao corpo
  dos inspecionados.

  Escâner corporal: também conhecido como Body Scanner, é um equipamento utilizado para inspeção
  não invasiva de pessoas, capaz de detectar a presença de objetos metálicos e não metálicos
  escondidos junto ao corpo dos inspecionados.

  Exercício AVSEC: representa formas de treinamento para verificar a eficácia de procedimentos
  de segurança, principalmente no que tange aos Planos de Contingência.

  Funcionário: quando não especificado, entende-se como qualquer pessoa contratada pelo operador
  de aeródromo, de forma direta ou indireta, ou preposto que esteja, sob autorização formal
  do operador de aeródromo, prestando serviço para este.

  Inspeção AVSEC: corresponde à avaliação de um ou mais aspectos das medidas e procedimentos
  de segurança das organizações envolvidas nas atividades AVSEC, com o objetivo de avaliar
  o grau de conformidade frente à regulamentação vigente.

  Inspeção de segurança aleatória: inspeção de segurança conduzida aleatoriamente em pessoa
  (busca pessoal ou através de escâner corporal) ou pertence de mão (inspeção manual). Objetiva
  trazer um caráter de imprevisibilidade à inspeção de segurança da aviação civil.

  Inspeção de segurança primária: primeira atividade realizada para a inspeção de segurança
  de pessoas e objetos.

  Inspeção de segurança secundária: inspeção de segurança complementar realizada com o objetivo
  de esclarecer alarme e suspeita gerados na inspeção de segurança primária.

  Item ilícito: item cujo porte ou posse seja proibido por lei.

  Módulo de inspeção de contingência: módulo de inspeção de segurança de pessoas que pode
  ser utilizado temporariamente em caso de pane, avaria ou suspeita de mau funcionamento dos
  equipamentos de inspeção. Pode ser dotado de menos recursos humanos e materiais que o exigido
  em situação normal.

  Módulo de inspeção de segurança de pessoas: conjunto mínimo de recursos humanos e materiais
  habilitado a realizar os procedimentos de inspeção de pessoas e pertences de mão em um ponto
  de controle de acesso de pessoas à área restrita de segurança.

  Objeto(s) suspeito(s): qualquer substância, objeto ou volume, incluindo bagagem de mão,
  bagagem despachada, carga ou mala postal, suspeito de conter artefatos explosivos, artefatos
  químicos, biológicos, radiológicos e nucleares (QBRN); ou outro artigo perigoso com potencial
  de causar dano iminente.

  Reciclagem: significa uma atividade prática conduzida por organização com responsabilidade
  AVSEC para o profissional que desempenha atividade em seu benefício que busca enfatizar
  conhecimentos e técnicas identificados como frágeis em atividade de fiscalização ou de controle
  de qualidade realizada pela ANAC ou pela organização com responsabilidade AVSEC.

  Responsável pela AVSEC: é o profissional, devidamente capacitado, designado pelo operador
  de aeródromo, responsável pela gestão e coordenação do setor de segurança aeroportuária
  e dos recursos necessários à aplicação dos controles preventivos de segurança e de contingência
  previstos no RBAC nº 107.

  Responsável pelo PCQ/AVSEC: é o profissional designado pelo operador de aeródromo, responsável
  pela gestão dos processos relacionados ao controle de qualidade AVSEC previstos no RBAC
  nº 107.

  Sistema Confidencial de Relatos: canal de comunicação mantido pelo operador de aeródromo
  para recebimento de relatos e informações AVSEC fornecidas por fontes diversas, tais como
  tripulantes, equipe de apoio de solo e agentes de proteção com o objetivo de identificar
  ameaças e vulnerabilidades.

  Sistema de Controle de Qualidade AVSEC: conjunto formado pela estrutura, responsabilidades,
  processos e procedimentos do operador do aeródromo que promovem uma cultura de aperfeiçoamento
  contínuo, com o objetivo de elevar os padrões e a efetividade das medidas de segurança da
  aviação civil do aeródromo.

  Sistemas de detecção de intrusos: dispositivos eletrônicos capazes de detectar a entrada
  ou tentativa de entrada de um intruso através do perímetro externo ou da área protegida,
  identificar a localização e emitir um alarme. Em geral, é utilizado juntamente com um sistema
  de circuito fechado de televisão (CFTV) para verificação dos alarmes.

  Sistema de inserção de imagens de falsas ameaças: também conhecido pela sigla TIP (threat
  image projection) é um sistema inserido nos equipamentos de raios-x, utilizado para treinamento
  e avaliação de desempenho dos APAC. A ferramenta possibilita a inserção de imagens de falsas
  ameaças nas imagens projetadas para análise pelos APAC, possibilitando a mensuração da qualidade
  da atividade exercida por determinado profissional ou equipe.

  Tecnologia automatizada de controle de acesso: tecnologia que permite que os pontos de controle
  de acesso do aeródromo utilizem métodos automáticos de leitura e reconhecimento de credenciais
  ou autorizações, como forma de identificar se uma pessoa ou veículo possui permissão de
  acesso a uma área restrita de segurança (ARS) ou a uma área controlada (AC). Esse tipo de
  sistema é, de forma geral, gerenciado pelo setor de segurança do aeródromo, interligado
  com as informações do setor de credenciamento que, por meio do seu banco de dados, conectado
  aos pontos de controle acesso, permite a identificação precisa das pessoas e veículos e
  suas respectivas permissões de acesso, por meio de identificação biométrica, leitura de
  credencial ou ambos.

  Teste AVSEC: simulação de ato de interferência ilícita que objetiva verificar o desempenho
  das medidas de segurança existentes e procedimentos aplicados em determinado local.

  Treinamento em serviço: significa uma etapa da certificação em Inspeção de Segurança da
  Aviação Civil, com propósito de orientar e avaliar o profissional em relação às suas habilidades
  e conhecimentos no desempenho de atividade AVSEC em ambiente operacional.

  Vulnerabilidade: situações que caracterizam falhas ou pontos potencialmente inseguros no
  âmbito do sistema aeroportuário, e que podem ser explorados por uma fonte de ameaça (um
  perpetrador ou terrorista). O não cumprimento de medidas preventivas de segurança obrigatórias
  configura-se em vulnerabilidade no sistema. Outras vulnerabilidades não relacionadas a medidas
  obrigatórias podem ser identificadas. Em geral, estão relacionadas às deficiências ou não
  conformidades acerca de requisitos de AVSEC.


  DESENVOLVIMENTO DO ASSUNTO

  Estrutura e Conteúdo do PSA

  Conforme previsto na seção 107.211 do RBAC nº 107, no PSA deve constar as medidas e os procedimentos
  de segurança a serem empregados pelo operador de aeródromo.

  Os recursos preventivos de segurança (Apêndice F), bem como os Planos e Programas (Apêndices
  G, H e I) previstos nesta Instrução Suplementar, juntamente com o Formulário de Dados AVSEC
  do Aeródromo (Apêndice E) e a Listagem de Inclusão de Medidas de Segurança e Procedimentos
  Alternativos, caso exista, compõem o PSA do operador de aeródromo.

  Os recursos preventivos de segurança (Apêndice F), bem como os Planos e Programas (Apêndices
  G, H e I) previstos nesta Instrução Suplementar não necessitam ser apresentados à ANAC para
  avaliação e aprovação.

  O operador de aeródromo deve apresentar o Formulário de Dados AVSEC do Aeródromo (Apêndice
  E), em formato digital, conforme orientações disponibilizadas na página eletrônica da ANAC
  na rede mundial de computadores.

  Os prazos para apresentação de alterações ao PSA à ANAC, assim como a definição dos casos
  que exigem análise e aprovação pela Agência, serão definidas por meio de regramento específico.

  Tópicos desta IS relacionados a requisito que não seja aplicável a determinado operador
  de aeródromo, nos termos do Apêndice A do RBAC nº 107, devem ser desconsiderados, não sendo
  necessária a apresentação de qualquer documentação à ANAC.

  Nos casos em que o operador de aeródromo pretenda implementar meio ou procedimento previsto
  na IS nº 107, mas que esteja relacionado a requisito que não lhe é aplicável, nos termos
  do Apêndice A do RBAC nº 107, deverá seguir o trâmite previsto para implementação de inclusão
  de medida de segurança, conforme item 5.2.

  A ANAC poderá disponibilizar, através de seu sítio eletrônico, modelos para orientar a elaboração
  de determinados documentos por parte do operador de aeródromo (formulários de testes de
  equipamentos, termos de credenciamento, PSESCA, PSTAV, entre outros).


  Inclusão de medidas de segurança ou de procedimentos alternativos ao disposto nesta Instrução
  Suplementar (Listagem de Inclusão de Medidas de Segurança e Procedimentos Alternativos)

  Caso o operador de aeródromo pretenda incluir medida de segurança ou procedimento alternativo
  de segurança em relação ao disposto nesta IS, deverá obter aprovação prévia da ANAC.

  A proposta de inclusão de medida de segurança ou procedimento alternativo de segurança deverá
  ser encaminhada à ANAC com a apresentação do Formulário de Apresentação de Inclusão de Medida
  de Segurança ou Procedimento Alternativo, que contém a descrição da proposta do operador
  de aeródromo e respectivas justificativas.

  O Formulário deverá ser encaminhados à ANAC por meio do protocolo eletrônico, conforme instruções
  constantes na página eletrônica da Agência na rede mundial de computadores.

  Após aprovação da ANAC, as medidas adicionais de segurança ou procedimentos alternativos
  de segurança indicados pelo operador de aeródromo serão determinados pela Listagem de Inclusão
  de Medidas de Segurança e Procedimentos Alternativos, que passará a ser parte integrante
  do PSA do operador.

  A Listagem de Inclusão de Medidas de Segurança e Procedimentos Alternativos será enviada
  pela ANAC ao operador de aeródromo, acrescentando à proposta de conteúdo contida no Formulário
  de Apresentação de Inclusão de Medida de Segurança e Procedimento Alternativo, a versão
  da listagem, o número da portaria de aprovação e a data da publicação.


  Análise e aprovação de pedido de inclusão de medida de segurança ou procedimento alternativo

  A análise de pedido de inclusão de medida de segurança ou procedimento alternativo de segurança
  ao disposto nessa IS é uma atividade realizada pela ANAC, com o objetivo de avaliar se o
  conteúdo que efetivamente seja adicional ou alternativo ao disposto nesta IS está de acordo
  com o previsto no RBAC 107 ou com o objetivo do procedimento descrito nesta IS.

  Somente serão analisadas as propostas que estiverem devidamente justificadas no Formulário
  de Apresentação de Inclusão de Medida de Segurança ou Procedimento Alternativo.

  A justificativa da proposta do operador de aeródromo deve conter elementos suficientes para
  demonstrar que:

  O pedido de inclusão de medida de segurança ou procedimento alternativo é exequível por
  parte do operador; e

  O pedido de inclusão de medida de segurança ou procedimento alternativo de segurança assegura
  um nível de segurança equivalente ou maior ao estabelecido no RBAC nº 107 ou no procedimento
  descrito nesta IS.

  A aprovação de inclusão de medida de segurança ou procedimento alternativo de segurança
  ao disposto nesta IS ocorrerá por meio de Portaria da Superintendência de Infraestrutura
  Aeroportuária.

  Somente após a publicação da Portaria de aprovação, a inclusão de medida de segurança ou
  procedimento alternativo passa a ser considerada como parte integrante do PSA do operador
  do aeródromo, em complementação ao disposto nessa IS e do Formulário de Dados AVSEC do Aeródromo
  (Apêndice E).


  Alterações de inclusão de medida de segurança ou procedimento alternativo já aprovado pela
  ANAC

  A alteração de inclusão de medida de segurança ou procedimento alternativo já aprovado pela
  ANAC segue o disposto nos itens e 5.3.


