  DISPOSIÇÕES FINAIS

  O operador de aeródromo é responsável pela avaliação do conteúdo padronizado apresentado
  nesta IS, com o intuito de verificar se os recursos previstos são suficientes para garantia
  da segurança da aviação civil contra atos de interferência ilícita, levando em consideração
  sua própria avaliação de risco e níveis de complexidade e criticidade de suas operações
  aeroportuárias.

  Considerando que o acesso irrestrito aos Apêndices E, F, G, H e I desta instrução suplementar
  compromete a efetividade dos recursos de segurança preventivos, de resposta e de comunicação
  e, por conseguinte, pode pôr em risco a vida e a segurança da população, a informação contida
  nesses apêndices deve ser tratada como sigilosa.

  A guarda e distribuição do PSA produzido nos termos desta Instrução Suplementar devem observar
  procedimentos de controle, definidos pelo operador de aeródromo, necessários para garantir
  o acesso ao documento restrito às pessoas com necessidade de conhecê-lo, conforme o grau
  de sigilo atribuído.

  Conforme previsto na seção 107.211(a)(2) do RBAC 107, o operador de aeródromo deve disponibilizar
  as partes pertinentes do PSA às entidades públicas e privadas da comunidade aeroportuária
  que necessitem conhecer as informações do programa, para fins de aplicação coordenada e
  eficaz dos procedimentos preventivos de segurança e dos procedimentos de resposta à emergência.

  Os meios e procedimentos contidos nos Apêndices F, G, H e I desta Instrução Suplementar
  são de cumprimento obrigatório.

  Meios e procedimentos alternativos podem ser adotados em substituição aos meios e procedimentos
  de que trata o item 7.5, desde que aprovados pela ANAC nos termos do art. 14 da Resolução
  nº 30, de 21 de maio de 200Os casos omissos serão dirimidos pela ANAC.

  O PSA, suas partes integrantes, anexos e listagens adicionais devem refletir a realidade
  operacional AVSEC do aeroporto e a documentação remetida para a ANAC deve ser mantida permanentemente
  atualizada.

  Esta IS entra em vigor em 10 de fevereiro de 2025.


  APÊNDICE A - LISTA DE REDUÇÕES


  A.1 SIGLAS

  a) AAR - Assessoria de Avaliação de Risco

  b) AC - Área Controlada

  c) ANAC - Agência Nacional de Aviação Civil

  d) ANVISA - Agência Nacional de Vigilância Sanitária

  e) API - Advance Passenger Information (Informações Antecipadas sobre Passageiros)

  f) ARS - Área Restrita de Segurança

  g) ATC - Air Traffic Control (Serviço de Controle de Tráfego Aéreo)

  h) AVSEC - Aviation Security (Segurança da Aviação Civil contra Atos de Interferência Ilícita)

  i) AWB - Air waybill (Conhecimento Aéreo)

  j) CFTV - Circuito Fechado de Televisão

  k) CINDACTA - Centro Integrado de Defesa Aérea e Controle de Tráfego Aéreo

  l) COA - Centro de Operações Aeroportuárias

  m) COE - Centro de Operações de Emergência

  n) COMAER - Comando da Aeronáutica

  o) COMDABRA - Comando de Defesa Aeroespacial Brasileiro

  p) COMGAR - Comando-Geral de Operações Aéreas

  q) CONSAC - Comissão Nacional de Segurança da Aviação Civil

  r) CSA - Comissão de Segurança Aeroportuária

  s) DAVSEC - Diretriz de Segurança da Aviação Civil contra Atos de Interferência Ilícita

  t) DSAC - Documento de Segurança da Aviação Civil

  u) EDS - Explosive Detection System (Sistema de Detecção de Explosivos)

  v) ETD - Explosive Trace Detection (Detecção de Traços Explosivos)

  w) ETSP - Exame Toxicológico de Substâncias Psicoativas

  x) GABAER - Gabinete do Comandante da Aeronáutica

  y) IATA - International Air Transport Association (Associação Internacional do Transporte
  Aéreo)

