  Objetivo

  Esta Instrução Suplementar estabelece o Programa de Segurança de Operador Aéreo (PSOA) em
  conformidade com os requisitos contidos nas seções 108.255 a 108.259 do Regulamento Brasileiro
  de Aviação Civil - RBAC nº 108 e descreve, em seus Apêndices, a combinação de recursos organizacionais,
  materiais, humanos e procedimentais aceitos pela ANAC para fins de cumprimento dos requisitos
  do RBAC nº 108 por parte dos operadores aéreos.

  Os recursos de prevenção e de resposta descritos nesta Instrução Suplementar podem ser utilizados
  como referência pelos operadores aéreos que não sejam obrigados a cumprir os requisitos
  constantes nas seções 108.255 e 108.259 do RBAC nº 108.

  Revogação

  Esta Instrução Suplementar revoga a Instrução Suplementar nº 108-001 Revisão H.


  Fundamentos

  Leis

  Lei nº 7.565, de 12 de dezembro de 1986, que dispõe sobre o Código Brasileiro de Aeronáutica.

  Lei nº 11.182, de 27 de setembro de 2005, que cria a Agência Nacional de Aviação Civil.


  Decretos

  Decreto nº 11.195, de 8 de setembro de 2022, que dispõe sobre o Programa Nacional de Segurança
  da Aviação Civil contra Atos de Interferência Ilícita.


  DAVSEC

  Diretriz de Segurança da Aviação Civil contra Atos de Interferência Ilícita (DAVSEC) nº
  01-2015, que traz a relação de aeródromos que possuem procedimentos equivalentes de inspeção
  de segurança de passageiros e bagagens de mão e de verificação de segurança de aeronaves.

  Diretriz de Segurança da Aviação Civil contra Atos de Interferência Ilícita (DAVSEC) nº
  02-2016, que traz os parâmetros quantitativos para realização dos procedimentos de

  inspeção de segurança aleatória nos aeródromos civis públicos brasileiros.

  Diretriz de Segurança da Aviação Civil contra Atos de Interferência Ilícita (DAVSEC) nº
  04-2021, que estabelece a relação de aeródromos em que há a obrigatoriedade de realizar
  a inspeção de segurança das bagagens despachadas para seguir em voos domésticos e os prazos
  para aplicação da medida de segurança.


  Resoluções

  Resolução ANAC nº 30, de 21 de maio de 2008, alterada pela Resolução nº 162, de 20 de julho
  de 2010, que institui o Regulamento Brasileiro da Aviação Civil (RBAC) e a Instrução Suplementar
  (IS), estabelece critérios para elaboração e dá outras providências.

  Resolução ANAC nº 167, de 17 de agosto de 2010, que estabelece diretrizes para o gerenciamento
  de risco à Segurança da Aviação Civil contra Atos de Interferência Ilícita (AVSEC) pela
  ANAC.

  Resolução ANAC nº 254, de 6 de novembro de 2012, que aprova o Regulamento Brasileiro de
  Aviação Civil nº 108, intitulado Segurança da Aviação Civil contra Atos de Interferência
  Ilícita - Operador Aéreo.

  Resolução ANAC nº 255, de 13 de novembro de 2012, que estabelece regras sobre a disponibilização
  de Informações Antecipadas sobre Passageiros (Advance Passenger Information - API) e do
  Registro de Identificação de Passageiros (Passenger Name Record - PNR).

  Resolução ANAC nº 361, de 16 de julho de 2015, que aprova o Regulamento Brasileiro de Aviação
  Civil nº 110, intitulado Programa Nacional de Instrução em Segurança da Aviação Civil contra
  Atos de Interferência Ilícita - PNIAVSEC.

  Resolução ANAC nº 362, de 16 de julho de 2015, que aprova o Regulamento Brasileiro de Aviação
  Civil nº 107, intitulado Segurança da Aviação Civil contra Atos de Interferência Ilícita
  - Operador de Aeródromo.

  Resolução ANAC nº 400, de 13 de dezembro de 2016, que dispõe sobre as Condições Gerais de
  Transporte Aéreo.

  Resolução ANAC nº 461, de 25 de janeiro de 2018, que dispõe sobre os procedimentos de embarque
  e desembarque de passageiros armados, despacho de armas de fogo e de munição e transporte
  de passageiros sob custódia a bordo de aeronaves civis.

  Resolução ANAC nº 499, de 12 de dezembro de 2018, que aprova o Programa de Segurança contra
  Atos de Interferência Ilícita da Agência Nacional de Aviação Civil (PAVSEC-ANAC).


  Instruções Normativas

  Instrução Normativa ANAC nº 15, de 20 de novembro de 2008, alterada pela Resolução nº 162,
  de 20 de julho de 2010, que estabelece normas e critérios para a elaboração e alteração
  de Regulamento Brasileiro da Aviação Civil e de Instrução Suplementar.


  Definições


  Aeronave em manutenção: significa a aeronave estacionada, enquanto estiver sendo submetida
  a procedimentos de manutenção com a presença de funcionários do operador aéreo.

  Aeronave em operação no solo: significa a aeronave estacionada, enquanto estiver ocorrendo
  o embarque e o desembarque de passageiros, bem como as atividades preparatórias para início
  do voo, tais como: limpeza, abastecimento de combustível, carregamento do porão e recebimento
  de provisões de serviço de bordo.

  Aeronave fora operação: significa a aeronave estacionada que não está em operação no solo
  e nem em manutenção.

  Auditoria AVSEC: avaliação detalhada de todos os aspectos previstos no PNAVSEC e na regulamentação
  da ANAC dentro das organizações envolvidas na segurança da aviação civil, para determinar
  o grau de conformidade frente à regulamentação vigente.

  Carga consolidada: compreende a consolidação de múltiplas remessas de carga ou volumes de
  carga, de um ou mais expedidor ou agente de carga em um ou mais pallets ou dispositivos
  similares.

  Carga em trânsito: carga que permanece a bordo da aeronave ou que desembarca em aeródromo
  intermediário para reembarcar na mesma aeronave.

  Exercício AVSEC: representa formas de treinamento para verificar a eficácia de procedimentos
  de segurança, principalmente no que tange aos Planos de Contingência.

  Funcionário: quando não especificado, entende-se como qualquer pessoa contratada pelo operador
  aéreo, de forma direta ou indireta, ou preposto que esteja, sob autorização formal do operador
  aéreo, prestando serviço para este.

  Inspeção AVSEC: corresponde à avaliação de um ou mais aspectos das medidas e procedimentos
  de segurança das organizações envolvidas nas atividades AVSEC, com o objetivo de avaliar
  o grau de conformidade frente à regulamentação vigente.

  Item proibido em bagagem despachada ou em carga e mala postal: item que compromete a segurança
  da aviação civil, incluindo armas de fogo e artigos perigosos não declarados, bem como substância
  explosiva, incendiária ou destrutiva.

  Objeto(s) suspeito(s): qualquer substância, objeto ou volume, incluindo bagagem de mão,
  bagagem despachada, carga e correio, suspeito de conter artefatos explosivos, artefatos
  QBRN ou outro artigo perigoso com potencial de causar dano iminente.

  Reciclagem: significa uma atividade prática conduzida por organização com responsabilidade
  AVSEC para o profissional que desempenha atividade em seu benefício que busca enfatizar
  conhecimentos e técnicas identificados como frágeis em atividade de fiscalização ou de controle
  de qualidade realizada pela ANAC ou pela organização com responsabilidade AVSEC.

  Remessa de carga ou mala postal: Conjunto de volumes de carga ou mala postal encaminhados
  ao operador aéreo por um expedidor ou agente de carga. Cada remessa possui um único destino.

  Teste AVSEC: simulação de ato de interferência ilícita que objetiva verificar o desempenho
  das medidas de segurança existentes e procedimentos aplicados em determinado local.

  Treinamento em serviço: significa uma etapa da certificação em Inspeção de Segurança da
  Aviação Civil, com propósito de orientar e avaliar o profissional em relação às suas habilidades
  e conhecimentos no desempenho de atividade AVSEC em ambiente operacional.

  Volume de carga ou mala postal: Caixa, envelope ou qualquer item individual similar dentro
  de uma remessa de carga. O número de volumes dentro da remessa é determinado pelo número
  de itens descritos no AWB ou documento que o substitua. Uma remessa ou parte de uma remessa
  contida em um pallet (ou similar), quando é evidente que é composta por vários itens não
  é considerada um único volume, mesmo que assim esteja descrito na documentação da carga.


  DESENVOLVIMENTO DO ASSUNTO


  Estrutura e conteúdo do PSOA

  Conforme previsto na seção 108.257 do RBAC nº 108, no PSOA devem constar as medidas e os
  procedimentos de segurança a serem empregados pelo operador aéreo.

  Os meios e procedimentos de segurança (Apêndice B), bem como os Planos e Programas (Apêndices
  C, D e E) previstos nesta Instrução Suplementar são considerados o PSOA do operador aéreo
  e não necessitam ser apresentados à ANAC para avaliação e aprovação.

  Tópicos desta IS relacionados a requisito que não seja aplicável a determinado operador
  aéreo, nos termos do Apêndice A do RBAC nº 108, devem ser desconsiderados, não sendo necessária
  a apresentação de qualquer documentação a ANAC.

  Nos casos em que o operador aéreo pretenda implementar meio ou procedimento previsto na
  IS nº 108, mas que esteja relacionado a requisito que não lhe é aplicável, nos termos do
  Apêndice A do RBAC nº 108, deverá seguir o trâmite previsto para implementação de inclusão
  de medida de segurança, conforme item 5.2.

  Os modelos apresentados nesta IS (formulários, listas, entre outros) possuem os objetivos
  de esclarecer a compreensão e auxiliar na aplicação dos procedimentos descritos, podendo
  o operador alterar suas formatações, complementar com informações de acordo com sua operação
  e utilizar meios digitais de preenchimento.


  Inclusão de medidas de segurança ou de procedimentos alternativos ao disposto nesta Instrução
  Suplementar

  Caso o operador aéreo pretenda incluir medida de segurança ou procedimento alternativo em
  relação ao disposto nesta IS, deverá obter aprovação prévia da ANAC.

  A proposta de inclusão de medida de segurança ou procedimento alternativo deverá ser encaminhada
  à ANAC com a apresentação dos seguintes documentos:


  Formulário de Apresentação de Inclusão de Medida de Segurança ou Procedimento Alternativo,
  que contém a descrição da proposta do operador aéreo e respectivas justificativas; e


  No caso de proposta de inclusão de medida de segurança decorrente de exigências de Estado
  estrangeiro, o operador aéreo também deverá encaminhar documentação do respectivo Estado
  contendo a descrição da medida de segurança e sua justificativa.

  Os documentos deverão ser encaminhados à ANAC por meio do protocolo eletrônico, conforme
  instruções constantes na página eletrônica da Agência na rede mundial de computadores.

  Após aprovação da ANAC, as medidas adicionais de segurança ou procedimentos alternativos
  implementados pelo operador aéreo serão determinados pela Listagem de Inclusão de Medidas
  de Segurança e Procedimentos Alternativos, que passará a ser parte integrante do PSOA do
  operador aéreo.

  A Listagem de Inclusão de Medidas de Segurança e Procedimentos Alternativos será enviada
  pela ANAC ao operador aéreo, acrescentando à proposta de conteúdo contida no Formulário
  de Apresentação de Inclusão de Medida de Segurança e Procedimento Alternativo, a versão
  da listagem, o número da portaria de aprovação e a data da publicação.


  Análise e aprovação de pedido de inclusão de medida de segurança ou procedimento alternativo

  A análise de pedido de inclusão de medida de segurança ou procedimento alternativo ao disposto
  nessa IS é uma atividade realizada pela ANAC, com o objetivo de avaliar se o conteúdo que
  efetivamente seja adicional ou alternativo ao disposto nesta IS está de acordo com o previsto
  no RBAC 108 ou com o objetivo do procedimento descrito nesta IS.

  Somente serão analisadas as propostas que estiverem devidamente justificadas no Formulário
  de Apresentação de Inclusão de Medida de Segurança ou Procedimento Alternativo.

  A justificativa da proposta do operador aéreo deve conter elementos suficientes para demonstrar
  que:


  O pedido de inclusão de medida de segurança ou procedimento alternativo é exequível por
  parte do operador aéreo; e


  O pedido de inclusão de medida de segurança ou procedimento alternativo assegura um nível
  de segurança equivalente ou maior ao estabelecido no RBAC nº 108 ou no procedimento descrito
  nesta IS.

  A aprovação de inclusão de medida de segurança ou procedimento alternativo ao disposto nesta
  IS ocorrerá por meio de Portaria da Superintendência de Infraestrutura Aeroportuária.

  Somente após a publicação da Portaria de aprovação, a inclusão de medida de segurança ou
  procedimento alternativo passa a ser considerado como parte integrante do PSOA do operador
  aéreo, em complementação ao disposto nessa IS.


  Alterações de inclusão de medida de segurança ou procedimento alternativo já aprovado pela
  ANAC

  A Alteração de inclusão de medida de segurança ou procedimento alternativo já aprovado pela
  ANAC segue o disposto nos itens 5.2 e 5.3.


  Processo de Ratificação da Certificação de Expedidor Reconhecido

  A ratificação pela ANAC da certificação de expedidor reconhecido ocorre através de solicitação
  do operador aéreo contendo os seguintes documentos:


  Formulário de Solicitação de Ratificação de Certificação de Expedidor Reconhecido, contendo
  os dados do operador aéreo e do expedidor.


  Declaração de Conformidade do Expedidor Reconhecido, assinada pelo Responsável Nacional
  pela AVSEC do operador aéreo, afirmando que as medidas de segurança do expedidor aplicadas
  às áreas e instalações foram presencialmente avaliadas em auditoria pelo operador aéreo
  e consideradas suficientes para impedir o acesso de objetos que possam comprometer a segurança
  da aviação civil nos envios de carga e mala postal direcionados ao transporte aéreo.

  Os documentos deverão ser encaminhados à ANAC por meio do protocolo eletrônico, conforme
  instruções constantes na página eletrônica da Agência na rede mundial de computadores.

  O registro do expedidor reconhecido pelo operador aéreo ocorre após a ratificação da ANAC,
  através da inserção do expedidor na lista de expedidores reconhecidos do operador aéreo.


  Informações cadastrais de envio obrigatório à ANAC

  O operador aéreo que esteja obrigado a implementar um PSOA, nos termos do parágrafo 108.255
  (a) do RBAC nº 108, deverá encaminhar as informações contidas na Ficha de Cadastro AVSEC
  do Operador Aéreo à ANAC, por meio do protocolo eletrônico ou outro meio disponibilizado
  pela ANAC.

  A Ficha de Cadastro AVSEC do Operador Aéreo e as orientações para envio dos dados podem
  ser encontradas na página eletrônica da ANAC na rede mundial de computadores.

  As informações da Ficha de Cadastro AVSEC do Operador Aéreo deverão ser mantidas atualizadas
  pelo operador aéreo, através de comunicação à ANAC em prazo não superior a 30 (trinta) dias
  a contar da data em que ocorreu a alteração do dado.


