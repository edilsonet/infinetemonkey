  Ilícita - Operador Aéreo.

  D.3.4.3 Resolução ANAC nº 361, de 16 de julho de 2015, que aprova o Regulamento Brasileiro
  de Aviação Civil nº 110, intitulado Programa Nacional de Instrução em Segurança da Aviação
  Civil contra Atos de Interferência Ilícita - PNIAVSEC.

  D.3.4.4 Resolução ANAC nº 362, de 16 de julho de 2015, que aprova o Regulamento Brasileiro
  de Aviação Civil nº 107, intitulado Segurança da Aviação Civil contra Atos de Interferência
  Ilícita - Operador de Aeródromo.

  D.3.4.5 Resolução ANAC nº 499, de 12 de dezembro de 2018, que aprova o Programa de Segurança
  contra Atos de Interferência Ilícita da Agência Nacional de Aviação Civil (PAVSEC-ANAC).


  D.4 RESPONSABILIDADES E PROCEDIMENTOS DE SELEÇÃO DOS PROFISSIONAIS PARA DESEMPENHO DE ATIVIDADES
  AVSEC


  D.4.1 Para a escolha dos profissionais que irão desempenhar as atividades AVSEC o operador
  aéreo garante a realização de processo de seleção que contempla:

  a) Verificação de perfil e capacidade para o desempenho das atividades AVSEC, de acordo
  com as atividades elencadas do Apêndice A do PNIAVSEC.

  b) Verificação da maioridade penal, por meio da apresentação de documento de identificação
  válido, com fotografia, data de nascimento e que possua fé pública.

  c) Avaliação de antecedentes, que inclui a verificação da identidade, da experiência prévia
  e dos antecedentes criminais, com o objetivo de avaliar a idoneidade de um indivíduo para
  implementação de controle de segurança e para acesso desacompanhado às ARS do aeródromo.

  d) Avaliação de saúde física e mental para o desempenho pleno das atividades AVSEC, comprovada
  por meio de exame médico.

  D.4.2 Os exames médicos são atualizados a cada 24 (vinte e quatro) meses.

  D.4.3 O operador aéreo arquiva a documentação dos profissionais orgânicos e terceirizados.
  Os arquivos dos profissionais terceirizados podem ser mantidos nas instalações da empresa
  terceirizada. O arquivo é mantido de forma física ou digital.


  D.5 RESPONSABILIDADES E PROCEDIMENTOS DE RECICLAGEM


  D.5.1 O operador aéreo garante a reciclagem de todos os profissionais que desempenham atividade
  em seu benefício e que não demonstram proficiência durante atividade de fiscalização ou
  de controle de qualidade realizada pelo próprio operador aéreo ou pela Agência Nacional
  de Aviação Civil (ANAC) e nos casos previstos em regulamentação específica sobre Treinamento
  em Serviço.

  D.5.2 As ações de reciclagem são formalizadas por meio do Relatório de Reciclagem, conforme
  consta no Anexo 1 deste PIAVSEC, que apresenta um resumo das atividades realizadas e a lista
  de presença dos participantes.

  D.5.3 Após a realização da atividade de reciclagem, o operador realiza novas avaliações
  no profissional, sem avisar e de forma discreta, em quantidade suficiente para garantir
  que as fragilidades identificadas foram sanadas.


  D.6 RESPONSABILIDADES E PROCEDIMENTOS DE REALIZAÇÃO DO TREINAMENTO EM SERVIÇO


  D.6.1 O operador aéreo garante um Treinamento em Serviço, necessário para obtenção da certificação
  em Inspeção de Segurança da Aviação Civil, a todos os profissionais que desempenham atividade
  AVSEC em seu benefício, além de demais casos previstos em regulamentação específica sobre
  Treinamento em Serviço.

  D.6.2 O operador aéreo designa profissionais responsáveis para supervisão do treinamento
  em serviço (Supervisor de Treinamento) conforme regulamentação específica sobre Treinamento
  em Serviço.

  D.6.3 O profissional responsável pode fazer avaliações prévias do desempenho do profissional
  em treinamento, apresentando feedback do trabalho desenvolvido para que o profissional em
  treinamento tenha a oportunidade de melhorar o seu desempenho.

  D.6.4 Para os profissionais em Formação em Inspeção de Segurança da Aviação Civil, o Treinamento
  em Serviço somente pode se iniciar após o aluno comprovar, por meio de declaração expedida
  pelo centro de instrução, que atendeu aos critérios de aprovação 1 e 2 do Curso de Formação
  em Inspeção de Segurança em Aviação Civil (critério 1: frequência mínima igual ou superior
  a 80% da carga horária do curso; critério 2: nota na avaliação teórica igual ou superior
  a 70%).

  D.6.4.1 Após atender os critérios 1 e 2 do Curso de Formação, o profissional possui o prazo
  máximo de 12 (doze) meses para concluir o Treinamento em Serviço.

  D.6.4.2 A partir da contratação, o Treinamento em Serviço é iniciado e concluído durante
  os 30 (trinta) primeiros dias de trabalho do profissional (período de um mês).

  D.6.5 Durante o treinamento em serviço de profissionais em Formação em Inspeção de Segurança
  da Aviação Civil, cada profissional designado para atuar como Supervisor de Treinamento
  só poderá acompanhar um profissional em treinamento por vez, resguardadas especificidades
  previstas em regulamentação específica sobre Treinamento em Serviço.

  D.6.5.1 O profissional em Formação em Inspeção de Segurança da Aviação Civil, durante todo
  o período do treinamento em serviço, não pode tomar decisão relacionada à resolução de alarmes
  sem a devida supervisão direta do profissional que o está acompanhando ou avaliando.

  D.6.6 O Treinamento em Serviço para Atualização em Inspeção de Segurança da Aviação Civil
  ocorre durante a efetiva prestação de serviço de inspeção e dentro do período de validade
  da certificação vigente.

  D.6.6.1 O Treinamento em Serviço tem duração entre 6 (seis) e 24 (vinte e quatro) meses.

  D.6.6.2 Somente após a conclusão do treinamento em serviço é possível realizar matrícula
  no centro de instrução para o curso de Atualização em Inspeção de Segurança da Aviação Civil.

  D.6.7 O Treinamento em Serviço é composto pelas fases previstas em regulamentação específica
  sobre Treinamento em Serviço.

  D.6.8 No Treinamento em Serviço, o operador aéreo faz uso da Ficha de Avaliação contida
  em regulamentação específica sobre Treinamento em Serviço.

  D.6.9 A Ficha é composta de duas partes:

  a) Parte 1, denominada Guia de Verificação, destinada a auxiliar e registrar os resultados
  parciais da avaliação do profissional em serviço;

  b) Parte 2, denominada Guia de Encaminhamento, destinada ao registro do resultado final
  de avaliação, pelo operador, e envio ao centro de instrução, pelo profissional.

  D.6.10 O Treinamento em Serviço é finalizado com o preenchimento da ficha de avaliação,
  assinada pelo responsável designado para o acompanhamento e avaliação do Treinamento em
  Serviço.

  D.6.11 A Ficha formaliza, ao final do período, se o novo profissional está “apto” ou “não-apto”
  para desempenho de suas funções, com base nos critérios de avaliação previstos em regulamentação
  específica sobre Treinamento em Serviço.

  D.6.12 O operador aéreo entrega a parte 2 da ficha de avaliação ao profissional no prazo
  máximo de 10 (dez) dias após o término do Treinamento em Serviço para prosseguimento da
  sua certificação no centro de instrução.


  D.7 RESPONSABILIDADES E PROCEDIMENTOS DO CONTROLE DE CAPACITAÇÃO


  D.7.1 O operador aéreo garante que todos os profissionais que desempenham atividade AVSEC
  em seu benefício possuem a proficiência na execução das atividades AVSEC previstas no Apêndice
  A do PNIAVSEC.

  D.7.2 O operador aéreo implementa controle para garantir a certificação dos profissionais
  que desempenhem atividade em seu benefício, conforme seção B.1.31 a B.1.60 do Apêndice B
  PSOA.


  D.8 RESPONSABILIDADES E PROCEDIMENTOS RELATIVOS AO NÍVEL DE SIGILO, ARQUIVO E GUARDA DOS
  REGISTROS


  D.8.1 O operador aéreo mantém registro em arquivo, por no mínimo 5 (cinco) anos, dos seguintes
  documentos:

  a) Registros de frequência e descrição das atividades de reciclagem;

  b) Declarações emitidas por centro de instrução que contenham os alunos aprovados em curso
  de Formação em Inspeção de Segurança da Aviação Civil, habilitando-os para o início do Treinamento
  em Serviço; e

  c) Fichas de avaliação dos Treinamentos em Serviço realizados.

  D.8.2 O operador aéreo garante que haja registros que comprovem o atendimento dos requisitos
  para desempenho de atividade AVSEC para cada profissional que realizar atividade AVSEC em
  seu benefício, enquanto o profissional mantiver relação de trabalho e até um ano após o
  seu desligamento.

  D.8.3. Os registros referentes aos procedimentos de seleção e conferência dos requisitos
  para desempenho de atividades AVSEC, bem como os documentos relativos aos procedimentos
  de reciclagem e Treinamento em Serviço de todos os profissionais são mantidos em formato
  físico ou digital.


  D.9 DETALHAMENTO DOS REQUISITOS DE INSTRUÇÃO A SEREM CUMPRIDOS PELOS PRESTADORES DE SERVIÇO


  D.9.1 Os profissionais dos prestadores de serviço terceirizados seguem os procedimentos
  definidos nos tópicos anteriores.


  ANEXO 1

  Relatório de Reciclagem


