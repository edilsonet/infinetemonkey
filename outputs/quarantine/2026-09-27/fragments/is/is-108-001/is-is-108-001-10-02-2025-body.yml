  APÊNDICE D - PROGRAMA DE INSTRUÇÃO AVSEC (PIAVSEC)


  D.1 POLÍTICA E OBJETIVO


  D.1.1 Política

  D.1.1.1 Promover o treinamento e gestão dos recursos humanos de forma a propiciar sua plena
  condição na operação da segurança da aviação civil.


  D.1.2 Objetivos

  D.1.2.1 Garantir a qualificação dos profissionais que desempenham atividades relacionadas
  à segurança da aviação civil para assegurar a correta aplicação do Programa Nacional de
  Segurança da Aviação Civil contra Atos de Interferência Ilícita (PNAVSEC).

  D.1.2.2 Manter meios de avaliação da atuação dos profissionais que desempenham atividade
  AVSEC de forma a garantir que os procedimentos de segurança sejam executados conforme o
  previsto.

  D.1.2.3 Este Programa contempla todos os profissionais que realizam atividade AVSEC em benefício
  do operador aéreo, sejam contratados de forma direta ou indireta.


  D.2 CONTEÚDO PROGRAMÁTICO E GRADE CURRICULAR


  D.2.1 O operador aéreo controla a certificação de seus profissionais, garantindo que os
  mesmos façam treinamento em centros de instrução que possuem conteúdo programático de acordo
  com o Programa Nacional de Instrução em Segurança da Aviação Civil contra Atos de Interferência
  Ilícita (PNIAVSEC) e com os critérios deste operador.

  D.2.2 Ressalta-se que este operador pode solicitar alteração do conteúdo programático para
  melhor alinhamento com os objetivos da gestão de segurança do operador aéreo no momento
  de direcionar o treinamento dos profissionais.


