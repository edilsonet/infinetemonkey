title: Apêndice O e informa que esses modelos precisam ser devolvidos. O responsável pela
  aplicação
text: 'Apêndice O e informa que esses modelos precisam ser devolvidos. O responsável pela
  aplicação

  controla os alunos que receberam modelos de prova e verifica sua devolução cobrando esses
  alunos na

  saída da sala. O candidato possui 2 (duas) horas para o preenchimento do formulário próprio
  de

  interposição de recursos, que é recolhido pelo responsável pela aplicação de avaliação,
  após seu

  preenchimento.

  C.4.3 Os recursos são encaminhados ao responsável técnico do centro de instrução. O responsável

  técnico ou um instrutor faz a análise dos recursos dentro do prazo de 10 (dez) dias. A análise
  é feita

  com base no conhecimento técnico de quem avalia e em pesquisa nas normas. Por meio de formulário,

  conforme Apêndice O, o centro de instrução apresenta o resultado do recurso, deferindo ou
  indeferindo

  os recursos apresentados.


  29/10/2015

  IS nº 110-001

  Revisão A


  C.4.4 Caso o recurso seja indeferido, a resposta é concedida diretamente ao aluno e não
  há alteração

  das notas do recorrente ou dos demais alunos. Em caso de deferimento da questão, é encaminhado
  à

  ANAC o formulário do recurso, conforme Apêndice O, contendo a questão envolvida e a justificativa

  preliminar do responsável técnico ou instrutor para fins de obter um posicionamento definitivo
  da

  Agência.

  C.4.5 Caso a ANAC julgue o recurso improcedente, a questão não é anulada e não há alteração
  das

  notas dos alunos. Caso a ANAC julgue o recurso procedente, a questão é anulada e a pontuação
  da

  questão é atribuída a todos os alunos da turma envolvida.


  C.5 MELHORIA DA QUALIDADE DA INSTRUÇÃO MINISTRADA'
