text: '30.12.2022

  Data de Vigência 30.12.2022

  1. Objetivo

  1.1 Esta Instrução Suplementar - IS visa estabelecer meios e procedimentos para a realização
  do treinamento em serviço de profissionais AVSEC.

  1.2 Esta IS descreve procedimentos aceitos pela ANAC que garantem o cumprimento dos requisitos
  contidos nos parágrafos 110.31(f)(1)(2)(3), 110.63(b)(7)(8), 110.69(c)(1)(2)(3) e nas seções
  110.15, 110.17, 110.51 e 110.71 do Regulamento Brasileiro da Aviação Civil nº 110 por parte
  dos profissionais AVSEC, dos centros de instrução e das organizações com responsabilidade
  AVSEC.

  1.3 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto no RBAC nº 110 poderá:

  a) adotar os meios e procedimentos previamente especificados nesta IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  1.4 Os meios ou procedimentos alternativos mencionados no item 1.3 devem garantir nível
  de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar o
  objetivo do procedimento normalizado nesta IS.

  2. Revogação

  Esta IS revoga a IS nº 110-002, Revisão A.

  3. Fundamentos

  3.1 Lei nº 7.565, de 12 de dezembro de 1986, que dispõe sobre o Código Brasileiro de Aeronáutica

  3.2 Lei nº 11.182, de 27 de setembro de 2005, que cria a Agência Nacional de Aviação Civil.

  3.3 Decreto nº 11.195, de 8 de setembro de 2022, que dispõe sobre o Programa Nacional de
  Segurança da Aviação Civil contra Atos de Interferência Ilícita.

  3.4 Resolução nº 30, de 21 de maio de 2008, alterada pela Resolução nº 162, de 20 de julho
  de 2010, que institui o Regulamento Brasileiro da Aviação Civil (RBAC) e a Instrução Suplementar
  (IS), estabelece critérios para elaboração e dá outras providências.

  3.5 Resolução nº 638, de 07 de outubro de 2021, que aprova o Regulamento Brasileiro de Aviação
  Civil (RBAC) nº 110 Emenda 01, que trata do Programa Nacional de Instrução em Segurança
  da Aviação Civil contra atos de interferência ilícita - PNIAVSEC.

  3.6 Instrução Normativa nº 15, de 20 de novembro de 2008, alterada pela Resolução nº 162,
  de 20 de julho de 2010, que estabelece normas e critérios para a elaboração e alteração
  de Regulamento Brasileiro da Aviação Civil e de Instrução Suplementar.

  3.7 Portaria nº 5.148, de 7 de junho de 2021, que dispõe sobre os critérios para fins de
  obtenção de habilitações e do certificado de Instrutor AVSEC pela Agência Nacional de Aviação
  Civil - ANAC.

  4. Definições

  4.1 Para os efeitos desta Instrução Suplementar, aplicam-se as definições, abreviações e
  siglas estabelecidas nos seguintes atos: Lei nº 7.565, de 19 de dezembro de 1986, que dispõe
  sobre o Código Brasileiro da Aeronáutica; Decreto nº 11.195, de 8 de setembro de 2022, que
  dispõe sobre o Programa Nacional de Segurança da Aviação Civil contra Atos de Interferência
  Ilícita; Regulamento Brasileiro da Aviação Civil nº 01 − RBAC 01; Regulamento Brasileiro
  da Aviação Civil nº 107 − RBAC 107; Regulamento Brasileiro da Aviação Civil nº 108 − RBAC
  108; Regulamento Brasileiro da Aviação Civil nº 110 − RBAC 110; Portaria nº 5.148, de 7
  de junho de 2021 e as seguintes:

  Afastamento: período em que o profissional não desempenha suas funções nos limites de sua
  certificação.

  Instrutor permanente: Instrutor AVSEC pertencente ao quadro funcional do Centro de Instrução,
  constante do Manual de Procedimentos do Centro de Instrução - MPCI.

  Supervisor de Treinamento: profissional designado pela organização com responsabilidade
  AVSEC ou pelo centro de instrução responsável pelo acompanhamento e avaliação do Treinamento
  em Serviço dos profissionais AVSEC. Esse profissional não se confunde com o Supervisor que
  exerce a Função VI no canal de inspeção.

  Treinamento em serviço: conjunto de ações com propósito de desenvolver e avaliar conhecimentos
  práticos e habilidades específicas do profissional no desempenho de atividade AVSEC em ambiente
  operacional.

  5. DESENVOLVIMENTO DO ASSUNTO

