  A perda do sono tem impactos negativos nas emoções. Existe associação entre o sono inadequado
  e a desregulação das emoções, como a diminuição da expressividade emocional, o prejuízo
  no reconhecimento das emoções e o aumento da reatividade emocional. A privação do sono leva
  ao aumento da irritabilidade, raiva e hostilidade; aumenta a reatividade frente a problemas
  e diminui a amistosidade, felicidade e empatia (Caldwell et al., 2019).


  Sinais e sintomas da fadiga.

  O principal sintoma da fadiga associada à sonolência é o desejo de dormir. No entanto, a
  pessoa pode ou não perceber outros sintomas em si mesma, como os citados na tabela 2.

  Os principais sinais da sonolência manifestados fisicamente são: bocejar, fixar o olhar,
  esfregar os olhos, vermelhidão dos olhos, piscar mais longa e/ou frequentemente do que o
  normal, ter dificuldade de manter os olhos abertos, ter dificuldade de manter a postura
  (especialmente a da cabeça - o “pescar”) e ter inquietação de se manter sentado no assento
  (mexer-se frequentemente sem motivação aparente).

  Os sinais e sintomas são, contudo, moderados por características pessoais, podendo se apresentar
  de maneiras diversas. Por isso, o autoconhecimento é fundamental para o gerenciamento pessoal.

  Para a autoavaliação da fadiga, alguns sinais de que o sono obtido pode estar sendo insuficiente
  são: dependência de um despertador para acordar, postergação do acordar (uso de “soneca”),
  alta frequência de bocejos durante o dia, desejo de cochilar durante o dia, dificuldade
  de se manter acordado em atividades paradas ou passivas (como assistir a palestras, aulas),
  adormecer rapidamente (baixa latência do sono, abaixo de 10 minutos), aguardar ansiosamente
  a folga para compensar o sono, dormir mais do que o esperado nos dias de folga (duas horas
  ou mais) e sentir-se mal-humorado e irritadiço sem causa aparente.


  Contramedidas individuais para combate à fadiga.

  Contramedidas são ações tomadas antes, durante e após um voo (ou turno de trabalho) para
  evitar ou diminuir os efeitos indesejáveis da fadiga durante o trabalho. Esta IS não abordará
  uso de medicações para favorecer o sono ou o alerta, como muitas vezes orientado na aviação
  militar, e todo e qualquer uso de farmacológicos (incluindo a melatonina) deve ser feito
  sob orientação médica e ser de conhecimento médico do operador aéreo.

  Como o sono desempenha um papel fundamental no gerenciamento da fadiga, protegê-lo e otimizá-lo
  são as principais estratégias de combate à fadiga. A higiene do sono se mostra de suma importância
  no gerenciamento individual.

  Algumas orientações para proteger e otimizar o sono são:

  verifique na sua escala de trabalho em qual horário a oportunidade de sono pode ser usufruída.
  Dependendo do horário do início do trabalho, o sono deverá ocorrer fora do horário noturno
  ou horário preferido pelo tripulante, e alguma preparação poderá ser necessária;

  busque aprender qual a sua necessidade individual de sono. Para a maioria das pessoas, a
  média é de oito horas diárias. O período de férias que permite horários livres para dormir
  e acordar pode ajudar nesta descoberta. Excluindo os dias iniciais (em que é esperada uma
  compensação do sono que foi restrito ao longo do período laboral antecedente), anote a que
  horas dormiu e acordou e obtenha a média da última semana em que o despertar foi espontâneo
  (sem despertador);

  embora possa ser impossível manter os horários de dormir consistentes, sempre que possível,
  evite variações da hora de dormir;

  use o quarto para dormir e não para trabalhar;

  mantenha comportamentos que não sejam consistentes com o sono fora do quarto (como resolver
  pendências, pagar contas, usar o telefone, usar eletrônicos etc.);

  estabeleça uma rotina consistente de “preparar-se para dormir” e cumpra-a todas as noites.
  Mesmo quando o sono não for noturno, mantenha seu ritual;

  em hotéis, simular o ambiente de casa pode favorecer a criação de um ambiente familiar e
  favorecer o sono. Isso pode incluir carregar itens preferidos (como travesseiros, mantas)
  ou simplesmente manter a rotina de casa;

  sempre que possível, pratique exercícios aeróbicos durante o dia para ajudar no sono noturno.
  No entanto, evite exagerar em horários próximos ao dormir (normalmente 3 horas antes);

  certifique-se de que o ambiente do quarto esteja confortável, fresco, silencioso e escuro;

  evite preocupações com questões de segurança física (por exemplo, garantindo que a porta
  do quarto possa ser devidamente trancada);

  evite ficar conferindo as horas. Se existe preocupação em perder o horário de despertar,
  acione mais de um despertador e tire os relógios de vista;

  evite usar substâncias estimulantes (como nicotina e cafeína) antes do horário programado
  de sono (a cafeína pode levar até 6 horas para ser eliminada);

  não tome bebidas alcóolicas antes de dormir. Embora possa gerar sonolência, o álcool afeta
  a qualidade do sono;

  se não conseguir dormir em 30 minutos, saia da cama e do quarto e tente uma atividade quieta
  (não estimulante) e relaxante para favorecer o sono;

  o primeiro passo para maximizar o estado de alerta no trabalho é a otimização do sono pré-voo.
  Assim, se o voo for noturno, um cochilo anterior é recomendado para diminuir o tempo acordado
  ao final da jornada. Neste caso, avalie antecipadamente qual o melhor período do dia para
  tirar este cochilo;

  a exposição a luz natural e artificial favorece o alerta. Por isso, evite a luz (especialmente
  de espectro azul, como emitida por telas) pouco antes de dormir e próxima aos olhos;

  não leve assuntos que geram ansiedade e preocupação para a cama. Uma forma de lidar com
  isso é agendar horários para resolver pendências e fazer listas do que precisa ser feito;

  devido aos horários irregulares de sono, conversar com familiares e pessoas próximas (especialmente
  que compartilham a residência) sobre a importância de respeitar os horários do sono pode
  ajudar para que a situação seja compreendida. Usar placas tipo “não perturbe” em hotéis
  e mesmo em casa auxiliam a informar que está dormindo ou descansando naquele momento;

  tomar um banho morno ajuda relaxar antes de dormir. Dormir com os pés aquecidos favorece
  dormir mais rápido;

  administre a questão alimentar. Comer em demasia ou o tipo errado de alimento antes de dormir
  pode interferir o sono, assim como a sensação de fome; e

  a aplicação de técnicas comportamentais pode ser benéfica (como terapias cognitivas e meditação/mindfulness).


  O uso de hipnóticos e de medicamentos para tratar distúrbios do sono deve ser feito sob
  orientação médica e informado ao operador aéreo (se disponível, ao médico da empresa).

  A melatonina é um hormônio produzido pelo organismo. Assim, o uso da melatonina exógena
  (ingerida) deve ser realizado sob supervisão médica.

  Outras substâncias facilmente adquiridas em farmácias devem ser avaliadas criteriosamente.


  Contramedidas individuais para situações que envolvam restrições do sono.

  Situações que envolvam restrições do sono impactam o nível de alerta. Assim, algumas orientações
  sobre como favorecer o alerta são:

  quando possível, implemente pausas de descanso breves e frequentes para reforçar o estado
  de alerta;

  consumir bebidas e alimentos com cafeína podem ajudar a manutenção do alerta;

  estando em solo, tente praticar exercício leves (como caminhar), mas não extenuantes;

  estado em solo, trabalhe em pé, em vez de sentado, quando possível;

  alterne tarefas, converse, altere a temperatura, altere a iluminação, mova-se no assento
  e faça qualquer outra coisa que julgue necessária para minimizar os efeitos da sonolência;

  mantenha a alimentação e hidratação adequadas. Lembre-se que a sensação de fome e sede potencializam
  a fadiga; e

  mantenha-se em boas condições físicas, mas não conte apenas com isso para se tornar resistente
  à fadiga.


  Trabalho em turnos.

  O trabalho em turnos pode ser definido como um padrão de trabalho que exige que a pessoa
  esteja acordada no momento do relógio biológico em que normalmente estaria dormindo.

  Como o relógio biológico não é capaz de se adaptar imediatamente às mudanças nos horários
  de trabalho, a dessincronização pode gerar sintomas que afetam a segurança e qualidade do
  trabalho.

  Para minimizar os efeitos da dessincronização, algumas medidas são utilizadas. Uma delas
  é a rotação do trabalho, ou seja, o estabelecimento de alterações no horário da jornada.
  A rotação pode ser classificada de acordo com a velocidade (rápida ou lenta) e o sentido
  (horário ou anti-horário).

  Quando os horários da jornada mudam rapidamente (de um dia para outro), o relógio biológico
  não consegue se adaptar a nenhum padrão de trabalho e sono, então a pessoa se mantém adaptada
  ao ciclo dia/noite normal e os sintomas nos dias de folga são minimizados. O problema é
  que, quando a jornada é noturna, a pessoa é mais afetada pela sonolência.

  Quando a transição é lenta (por exemplo, o tripulante ultrapassa um fuso por dia, todos
  na mesma direção), alguma adaptação circadiana ocorre, mas depois de algum tempo a pessoa
  fica fora do ciclo dia/noite e necessita alguma readaptação.

  A rotação pode ser no sentido horário, quando um turno ou um bloco de turnos (como o semanal)
  ocorre mais tarde que o anterior, por exemplo: manhã - tarde - noite. Quando ocorre o contrário
  (noite - tarde - manhã), a rotação é anti-horária.

  O desafio na aviação comercial é justamente que os horários não são regulares, e por isso
  os horários de início da jornada dificilmente seguem um tipo de rotação. Entretanto, um
  esforço de estabelecer critérios de forma a não inverter a rotação pode ser benéfico, pois
  a mistura das rotações, ou seja, a completa irregularidade dos inícios dos turnos, pode
  ser um fator de risco.

  Algumas orientações para a confecção de escalas de trabalho são (Caldwell, 2019):

  maximizar a estabilidade circadiana (consistência da escala);

  manter os turnos curtos;

  minimizar os turnos noturnos consecutivos;

  garantir a plena recuperação após um turno noturno (especialmente aqueles que cobrem a madrugada);

  maximizar a quantidade de finais de semana (sábados e domingos) de folgas;

  garantir a equidade das escalas para todos os tripulantes;

  otimizar a previsibilidade da escala; e

  proporcionar tempo livre de qualidade.


  O uso de modelos biomatemáticos disponíveis no mercado pode auxiliar na confecção de escalas
  levando em conta aspectos do sono e circadianos. Entretanto, devem ser reconhecidas as limitações
  da ferramenta, que é apenas parte do processo de gerenciamento da fadiga do operador aéreo.


  IMPLICAÇÕES OPERACIONAIS 8

  ESCALAÇÃO DE TRIPULANTES


  · A escala de trabalho perfeita para o corpo humano corresponde ao trabalho diurno com sono
  irrestrito à noite. Qualquer outra coisa é um compromisso. Existem, no entanto, princípios
  gerais de programação de trabalho baseados na ciência da fadiga que devem ser levados em
  consideração ao projetar uma escala de tripulantes:

  ü o relógio biológico circadiano não se adapta totalmente a horários alterados, como turnos
  rotativos ou trabalho noturno. Alguma adaptação pode ocorrer em horários de rotação lenta.

  ü sempre que um período de serviço se sobrepõe ao tempo normal de sono de um indivíduo,
  pode-se esperar que ele restrinja o sono. Os exemplos incluem horários de trabalho iniciados
  cedo (early-starts), horários de término tardios e trabalho noturno;

  ü quanto mais uma jornada se sobrepuser ao tempo normal de sono de um indivíduo, menos sono
  o indivíduo provavelmente obterá. Trabalhar durante o período normal de sono noturno é o
  pior cenário;

  ü quando os indivíduos trabalham à noite e devem permanecer acordados durante a noite, eles
  trabalham durante o período do relógio biológico quando a autoavaliação da fadiga e o humor
  são piores, e um esforço adicional é necessário para manter o estado de alerta e o desempenho.
  Cochilar antes e durante um período de serviço noturno é uma estratégia útil (discutida
  em Implicações Operacionais 5: Cochilar como mitigação da fadiga);

  ü quando os indivíduos estão acordados durante o serviço noturno, seu período de sono subsequente
  é mais tarde do que o normal em seu relógio biológico. Isso significa que eles têm um tempo
  limitado para dormir antes que o sinal de alerta circadiano os acorde. Isso pode causar
  sono restrito após um turno da noite. Para proporcionar a maior oportunidade de sono possível,
  os turnos noturnos devem ser programados para terminar o mais cedo possível e os indivíduos
  precisam dormir o mais rápido possível depois de sair do serviço;

  ü early-starts foram identificados como uma causa de restrição de sono na aviação. Uma razão
  para isso é a zona de manutenção da vigília noturna que ocorre poucas horas antes da hora
  de dormir habitual. Isso torna muito difícil adormecer mais cedo do que o normal, antes
  do horário de início do trabalho;

  ü ao longo de períodos de serviço consecutivos que resultam em sono restrito, os indivíduos
  acumularão um débito de sono e o comprometimento relacionado à fadiga aumentará; e

  ü para se recuperar do débito de sono, os indivíduos precisam de um mínimo de duas noites
  inteiras de sono seguidas. A frequência dos períodos de descanso deve estar relacionada
  com a taxa de acumulação do débito de sono.

  Quadro 8. Implicações Operacionais 8: Escalação de tripulantes

  Oferecer treinamento, realizar campanhas e favorecer o reporte são ações importantes, porém
  insuficientes para o gerenciamento da fadiga. O mais importante é o operador ser cuidadoso
  ao estipular as regras de confecção de escalas, levando em consideração os aspectos fisiológicos
  humanos ora apresentados, e estar aberto a receber e tratar os reportes e sugestões recebidas
  dos próprios tripulantes.


  Fadiga e acidentes.

  A fadiga é um aspecto humano que pode contribuir para um acidente aeronáutico. Entretanto,
  conforme modelos de análise de acidentes, é a conjunção de fatores que propicia uma ocorrência
  aeronáutica, sendo necessariamente multifatorial. Assim, a hipótese ou confirmação da existência
  de fadiga em uma pessoa não pode ser utilizada isoladamente para justificar um evento de
  segurança, muito menos para responsabilizá-la. Isso porque o gerenciamento da fadiga é compartilhado
  entre o operador aéreo e o tripulante, dentro de um contexto sistêmico e regulatório ainda
  maior. Assim, o operador deve oferecer condições para que o trabalho possa ser realizado
  da melhor maneira possível, e o tripulante deve administrar sua rotina e seus hábitos de
  forma a evitar a fadiga ou gerenciá-la.

  A figura 10 apresenta um modelo de trajetória do risco associado à fadiga (Dawson e McCulloch,
  2005). Segundo este modelo, há diversas barreiras que antecedem um incidente para o qual
  a fadiga seja considerada um fator contribuinte; e para cada uma delas existem perigos que
  podem ser identificados e seus respectivos controles. O incidente (ou acidente) é apenas
  o final de um encadeamento de erros na mesma trajetória. Cada risco de ocorrência de um
  erro é associado com um estado do indivíduo em que a fadiga se expressa por sintomas ou
  comportamentos. Esse estado individual, por sua vez, é precedido por sono insuficiente ou
  pelo excessivo tempo acordado. Ambos podem ser consequências do tempo de repouso insuficiente
  devido a condições pessoais (fora ou controle do indivíduo ou mesmo uma exposição proposital
  a alguma condição que restringiu o sono) ou de escala de trabalho. Os níveis 1 e 2 têm o
  objetivo de determinar se a escala promove condições de que o repouso garanta tempo de sono
  e se o indivíduo de fato obteve o sono de forma suficiente.


