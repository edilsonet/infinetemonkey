  OBJETIVO

  Orientar os operadores aéreos e tripulantes sobre os conceitos básicos da fadiga humana
  aplicáveis ao RBAC nº 117 e suas Instruções Suplementares.

  Revogação

  Não aplicável.

  Fundamentos

  A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  adotar os meios e procedimentos previamente especificados em IS; ou

  apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir nível
  de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar o
  objetivo do procedimento normalizado em IS.

  A IS não pode criar requisitos ou contrariar requisitos estabelecidos em RBAC ou outro ato
  normativo.

  Definições e Acrônimos

  Acrônimos

  Para os efeitos desta IS, são válidos os seguintes acrônimos:

  ANAC: Agência Nacional de Aviação Civil

  IS: Instrução Suplementar (publicação da ANAC)

  NREM: sono de movimento não-rápido dos olhos (sono não REM)

  OACI: Organização de Aviação Civil Internacional

  PVT: Teste de Vigilância Psicomotora (Psychomotor Vigilance Task)

  RBAC: Regulamento Brasileiro de Aviação Civil (publicação da ANAC)

  REM: sono de movimento rápido dos olhos (Rapid Eye Movement)

  Definições

  Para os efeitos desta IS, são válidas as definições contidas no RBAC nº 01 e no RBAC nº
  117, além das abaixo listadas:

  Alerta significa a habilidade de direcionar e sustentar a atenção, sendo influenciada pelo
  sono anterior e pela perda de sono, ritmicidade circadiana, tempo na tarefa (duração do
  trabalho contínuo) e outros fatores. O alerta manifesta-se como a habilidade de manter a
  atenção necessária para desempenhar uma tarefa de um nível específico. A sonolência é associada
  à redução do alerta.

  Ciclo NREM/REM significa a alternância regular de sono NREM e sono REM durante um período
  de sono, em um ciclo de aproximadamente 80 a 90 minutos.

  Desempenho cognitivo significa a capacidade de processar o pensamento e se envolver em atividade
  intelectual consciente, por exemplo, nos tempos de reação, resolução de problemas, atenção
  vigilante, memória e transferência cognitiva. Vários estudos demonstraram os efeitos negativos
  da perda de sono no desempenho cognitivo.

  Dessincronização circadiana significa a perda da sincronização entre ritmos de um mesmo
  organismo, pela quebra temporal interna (perda de aclimatação).

  Impulso homeostático do sono significa a necessidade do corpo pelo sono de ondas lentas
  (sono profundo) que cresce à medida que se permanece mais tempo acordado, e que é descarregada
  durante o sono (“pressão do sono”).

  Inércia do sono significa um estado no qual o indivíduo, logo após acordar, experimenta
  desorientação temporária, letargia e prejuízo de desempenho. A duração e a intensidade da
  inércia do sono são maiores quando o indivíduo não obteve sono suficiente anterior, quando
  é acordado durante o sono profundo ou durante a Janela de Baixa do Alerta no Ritmo Circadiano.

  Jet lag (jet: jato; lag: defasagem) significa a dessincronização entre o relógio biológico
  e o ciclo dia/noite causado por voos transmeridionais (dessincronização circadiana, isto
  é, perda da aclimatação).

  Microssono significa um período curto (de segundos) em que o cérebro se “desliga” (desconecta)
  do ambiente (ele para de processar as informações do meio) e cai incontrolavelmente no sono
  leve. É um sinal de sonolência extrema.

  Monofolga significa a folga concedida por período inferior a 48 horas consecutivas.

  PVT (Psychomotor Vigilance Task ou teste de vigilância psicomotora) significa um teste visual
  de tempo de reação, que não depende de aptidão ou habilidade do indivíduo e não apresenta
  uma curva de aprendizagem. O teste é sensível mesmo a pequenas perdas de sono e informa
  sobre a capacidade da atenção sustentada e da vigilância.

  Sono de movimento não rápido dos olhos (sono não REM ou NREM) significa um tipo de sono
  associado à desaceleração gradual da atividade elétrica no cérebro (visto como ondas cerebrais
  medidas por eletrodos presos ao couro cabeludo, conhecido como eletroencefalograma - EEG).
  À medida que as ondas cerebrais diminuem no sono não REM, elas também aumentam em amplitude,
  com a atividade de grandes grupos de células cerebrais (neurônios) tornando-se sincronizadas.
  O sono não REM costuma ser dividido em 3 estágios, com base nas características das ondas
  cerebrais. Os estágios 1 e 2 representam um sono mais leve. O estágio 3 representa o sono
  mais profundo e é conhecido como sono de ondas lentas.

  Sono de movimento rápido dos olhos (sono REM) significa um tipo de sono durante o qual a
  atividade elétrica do cérebro se assemelha à da vigília. No entanto, de tempos em tempos,
  os olhos se movem sob as pálpebras fechadas - os “movimentos rápidos dos olhos” - e isso
  geralmente é acompanhado por espasmos musculares e frequência cardíaca e respiração irregulares.
  As pessoas acordadas do sono REM normalmente podem se lembrar de sonhos vívidos. Ao mesmo
  tempo, o corpo não pode se mover em resposta aos sinais do cérebro, então os sonhos não
  podem ser “representados”. O estado de paralisia durante o sono REM às vezes é conhecido
  como "bloqueio REM".

  Relógio biológico ou relógio circadiano ou relógio interno significa um marcapasso neuronal
  localizado no cérebro que monitora o ciclo noite/dia e determina nossa preferência enquanto
  espécie de dormir à noite.

  Sonolência significa um estado de tendência crescente para dormir, resultante de perda de
  sono ou vigília estendida, ritmicidade circadiana, medicações, ou diversos distúrbios do
  sono. A sonolência se manifesta objetivamente como uma propensão aumentada em pegar no sono
  rapidamente, e subjetivamente como uma necessidade crescente ou desejo de dormir. A sonolência
  contribui para a fadiga mental.

  Zeitgeber (do alemão, “doador de tempo”) significa qualquer marcador de tempo [sincronizador]
  exógeno (externo) capaz de sincronizar a função do meio interno. Existem zeitgebers naturais,
  sendo o mais forte a luz (fótico), mas temperatura, e padrões de alimentação/hidratação
  e exercícios físicos também podem alterar as funções internas. Há ainda os zeitgebers considerados
  sociais, os quais estão relacionados com a organização dos seres humanos em sociedade e
  as necessidades de trabalho relacionadas com ela.

  Introdução

  A Lei nº 13.475, de 28 de agosto de 2017, dispõe sobre o exercício da profissão de tripulante,
  denominado aeronauta, estabelecendo critérios e limites prescritivos de gerenciamento de
  fadiga, cumprindo o requisito exigido pela Organização de Aviação Civil Internacional (OACI).

  Esta IS tem como objetivo fornecer orientações sobre os principais conceitos científicos
  envolvidos no gerenciamento de fadiga humana na aviação civil, de forma a alinhar o entendimento
  dos operadores, tripulantes e estudiosos acerca do tema abordado na Lei nº 13.475/17, no
  RBAC nº 117 e no DOC 9966.

  Atualmente, a fadiga humana é reconhecida como um perigo que previsivelmente degrada o desempenho
  humano e pode contribuir para acidentes ou incidentes de aviação. A fadiga é uma condição
  fisiológica normal e inevitável, porque o desempenho humano ocorre de forma ideal quando
  se obtém sono irrestrito à noite, o que nem sempre é possível em uma indústria que funciona
  de forma ininterrupta. Portanto, como a fadiga não pode ser eliminada, ela deve ser gerenciada.

  A fadiga associada às operações de voo é um fator de risco para a segurança. As múltiplas
  etapas de voo, as longas horas de jornada, os períodos limitados de repouso, as monofolgas,
  a apresentação muito cedo pela manhã, as condições de sono subótimas, os turnos de trabalho
  rotativos e não padronizados e jet lag representam desafios significativos para as capacidades
  biológicas dos tripulantes. Os seres humanos simplesmente não são preparados biologicamente
  para operar efetivamente em quaisquer horários dentre as 24 horas que caracterizam as operações
  na aviação civil, sejam elas de curto ou longo alcance, transoceânicas, ou realizadas a
  qualquer hora do dia, da noite e em turnos com horários de trabalho não regulares.

  Uma representação da relação entre fadiga e segurança consta na figura 1. Neste esquema,
  a sonolência é compreendida como parte da fadiga, e o sono como parte do repouso. O estado
  da fadiga é aumentado dependendo da hora do dia (fator circadiano), de há quanto tempo se
  está acordado (pressão do sono) e das tarefas relativas ao trabalho (carga de trabalho).
  O desdobramento deste estado pode ser a recuperação, com o repouso, ou o prejuízo no desempenho,
  podendo levar a um acidente (tanto de lesão quanto fatal) (Williamson et al., 2011).


  Figura 1. Esquema que ilustra a relação entre fadiga e segurança (fonte: Williamson et al.,
  2011).

  Um guia elaborado pelas American Academy of Sleep Medicine e Sleep Research Society (Gurubhagavatula
  et al., 2021) elencou três princípios relacionados aos fatores de risco associados à duração
  do turno de trabalho:

  Princípio 1. A duração dos turnos de trabalho está ligada a resultados adversos no desempenho,
  segurança e saúde, especialmente quando os turnos não estão alinhados com o relógio biológico
  do trabalhador para promover o alerta durante o trabalho e o sono durante o repouso. A causa
  primária dos resultados adversos está associada ao desalinhamento entre o momento e a duração
  do período de trabalho e a regulação fisiológica e temporal do sono e do alerta. Quando
  o trabalho ocorre em momento em que o sono é promovido, o efeito recuperativo do sono fica
  comprometido e um aumento da sonolência durante a vigília é notado, contribuindo com a fadiga
  mental.

  Princípio 2. Fatores relativos ao trabalho, como carga de trabalho e tempo de deslocamento,
  contribuem para impactar a duração da jornada no desempenho, segurança e saúde. Além dos
  aspectos da regulação temporal do sono e do alerta, fatores ligados à configuração das escalas
  de trabalho têm importante papel quando se pensa nos impactos no desempenho da tripulação,
  segurança da operação e saúde do trabalhador. Por exemplo, configurações de escalas que
  contêm jornadas de início cedo, turnos com horários irregulares e, principalmente, que seguem
  no sentido anti-horário, bem como os acúmulos de horas semanal, mensal e anual podem afetar
  de forma isolada ou combinada. O tempo de deslocamento ao trabalho é um fator de importância
  a ser considerado quando diminui o tempo de repouso (e de sono) disponível e/ou quando aumenta
  a duração da vigília.

  Princípio 3. Fatores biológicos, comportamentais e sociais contribuem para o impacto da
  duração da jornada no desempenho, segurança e saúde. O impacto da duração da jornada, da
  configuração das escalas de trabalho e de outros fatores associados são moderados por fatores
  biológicos, comportamentais e sociais do trabalhador, influenciando a necessidade individual
  de sono, a melhor hora de dormir, a resposta à perda de sono, a tolerância para trabalhar
  períodos longos e a resiliência de maneira geral.


  O que é fadiga

  A definição de fadiga adotada pela ANAC no RBAC nº 117 derivou da constante no DOC 9966
  da OACI e tem como objetivo facilitar o alinhamento desta concepção dentro da área de fatores
  humanos, visto que é um segmento de estudo multidisciplinar.

  fadiga significa um estado fisiológico de redução de capacidade de desempenho físico e/ou
  mental resultante do débito de sono, vigília estendida, desajustes dos ritmos circadianos,
  alterações do ciclo vigília-sono e/ou carga de trabalho (mental e/ou física) que podem prejudicar
  o nível de alerta e a habilidade de uma pessoa executar atividades relacionadas à segurança
  operacional.[RBAC 117.3(f)]

  Os princípios científicos envolvidos nesta definição são quatro:

  A necessidade de sono. Obter sono suficiente de forma regular, tanto em termos de quantidade
  quanto de qualidade, é essencial para restaurar o cérebro e o corpo.

  A perda e a recuperação do sono. Reduzir a quantidade ou a qualidade de sono, mesmo que
  por apenas uma noite, diminui a habilidade de executar as tarefas adequadamente e aumenta
  a sonolência do dia seguinte.

  Os efeitos circadianos no sono e no desempenho. O relógio biológico afeta o horário e a
  qualidade do sono, propiciando períodos de picos e de quedas no desempenho.

  A influência da carga de trabalho. A carga de trabalho contribui para o nível de fadiga
  de uma pessoa, mesmo quando é baixa. Uma baixa carga de trabalho pode propiciar condições
  para um estado de sonolência, enquanto uma alta carga de trabalho pode exceder a capacidade
  de pensar e de agir.

  A fadiga resulta do desequilíbrio entre as demandas mentais e físicas ocorridas durante
  a vigília e a recuperação dessas demandas, a qual exige, principalmente, que se durma.

  A abordagem da fadiga, devido à amplitude e complexidade, pode ser concebida em estado agudo,
  cumulativo (ou acumulado) ou crônico. Assim:

  A fadiga aguda (ou transitória, transiente, passageira) significa o estado provocado pela
  restrição extrema do sono ou por horas prolongadas de vigília ao longo de um ou dois dias
  ou, ainda, pela alta carga de trabalho em um único período de trabalho. Os efeitos da fadiga
  transitória geralmente podem ser dissipados por meio de um período de repouso após a jornada
  de trabalho.

  A fadiga cumulativa (ou acumulada) significa o estado provocado por leves, porém repetidas,
  restrições de sono, ou, ainda por períodos de vigília prolongada durante uma série de dias,
  gerando um acúmulo de perda de sono (débito de sono). ).

  A fadiga crônica (ou síndrome de fadiga crônica) significa uma condição clinicamente definida
  caracterizada por fadiga incapacitante grave e uma combinação de sintomas que caracterizam
  proeminentemente deficiências autorrelatadas na concentração e memória de curto prazo, distúrbios
  do sono e dor musculoesquelética. Estudos recentes sugerem que algumas pessoas afetadas
  pela síndrome da fadiga crônica melhoram com o tempo, mas a maioria permanece funcionalmente
  prejudicada por vários anos (Fukuda et al., 2011).

  A fadiga não pode ser diretamente mensurada, por isso outras variáveis relacionadas a ela
  são utilizadas como referência. Assim, a fadiga pode ser inferida através de mudanças em
  diversos aspectos do desempenho físico e/ou cognitivo, como aumento do tempo de reação em
  uma determinada tarefa, redução do desempenho cognitivo, redução ou perda da consciência
  situacional e diminuição da motivação. Os níveis de fadiga percebidos de uma pessoa são
  frequentemente inferiores às quedas observadas no desempenho.

  Princípio científico 1. A necessidade de sono

  Geral

  Sono é o estado reversível em que o controle consciente do cérebro está ausente e o processamento
  das informações sensoriais do ambiente é mínimo. O cérebro fica “desconectado” para as funções
  de ordenar e armazenar as experiências do dia e reabastecer os sistemas gastos pelas atividades
  realizadas quando estamos despertos.

  O sono tem uma função vital na saúde e no bem-estar. Ele é essencial para a memória e para
  aprendizagem, para a manutenção do estado de alerta, do desempenho e do humor. Quanto mais
  o sono é estudado, mais ele é valorizado. Pesquisas já demonstraram que não se pode barganhar
  o sono, sacrificá-lo sempre gera consequências perigosas.

  O sono é uma necessidade fisiológica vital e fundamental para a existência humana. Um boa
  noite de sono é tão importante para a saúde e o bem-estar como a alimentação adequada e
  a atividade física regular.

  A duração do sono ao longo da vida muda conforme a idade. Normalmente, são necessárias entre
  7 e 9 horas de sono para a recuperação de adultos jovens (26 a 64 anos), e entre 7 e 8 horas
  de sono para adultos mais velhos (65 anos e acima), considerando pessoas saudáveis, sem
  distúrbios de sono (Hirshkowitz et al., 2015).

  A fadiga relacionada ao sono pode afetar o humor e a capacidade de comunicação e interação
  do indivíduo. Quando sonolentas, as pessoas geralmente apresentam perda de humor e redução
  na quantidade e qualidade de comunicação e interação com outros. Isso pode ter sérias consequências
  para tripulações e grupos de trabalho que dependem da troca de informações para fornecer
  apoio mútuo e evitar erros.

  Tradicionalmente, o sono é estudado por meio do monitoramento de padrões elétricos da atividade
  cerebral, dos movimentos dos olhos e do tônus muscular. Essas medidas indicaram que o sono
  não é um bloco único e linear, e que há dois tipos de sono: o sono NREM e o sono REM.

  Durante uma noite normal de sono, os sonos NREM e REM se alternam em ciclos que duram aproximadamente
  90 minutos (esta duração pode ser muito variável dependendo de diversos fatores individuais
  e ambientais).

  A figura 2 representa a proporção dos sonos NREM e REM ao longo de uma noite de sono.


  Figura 2. Percentual de tipos e estágios do sono de um adulto jovem (adaptado do DOC 9966).

  A figura 3 apresenta o ciclo NREM/REM ao longo de uma noite normal de sono:

  O sono é iniciado no estágio 1 e progride para o estágio 2, sendo ambos sonos considerados
  mais leves;

  O sono progride do estágio 2 até o sono profundo (ondas lentas) no estágio 3;

  Após 80 a 90 minutos de sono, há um retorno do estágio 3 ao estágio 2. Esta mudança normalmente
  é marcada por movimentos do corpo, enquanto a pessoa transita brevemente do estágio 2 até
  o primeiro período de sono REM da noite;

  Após um período curto de sono REM, há um retorno ao estágio 1 e ao sono de ondas lentas,
  e então o ciclo se repete. De manhã, a pessoa acorda do sono REM e possivelmente se lembra
  do seu sonho.


  Figura 3. Ciclo NREM/REM durante a noite de sono normal (Associação Brasileira de Sono,
  2021).

  Em um ciclo normal NREM/REM à noite:

  a. a quantidade de sono de ondas lentas (NREM) diminui com o passar dos ciclos (pode não
  haver nenhum nos últimos ciclos);

  b. a quantidade de sono REM aumenta com o passar dos ciclos.

  Sono NREM

  Durante o sono NREM, a atividade das ondas cerebrais gradualmente fica mais lenta quando
  comparada à atividade cerebral de um indivíduo acordado. Neste momento, o corpo se regenera.
  Muitas vezes, este tipo de sono é referido como o sono da “mente quieta e corpo quieto”.
  Durante uma noite de sono normal, a maioria dos adultos passa em média três quartos do período
  do sono em sono NREM.

  O sono NREM é dividido em três estágios, baseados nas características das ondas cerebrais.

  Os estágios 1 e 2 representam o sono mais leve, em que normalmente o sono é iniciado, em
  que ainda pode ser fácil acordar a pessoa.

  O estágio 3 também é conhecido como sono de ondas lentas ou sono profundo. Neste estágio,
  o cérebro para de processar a informação do exterior, e muitos neurônios são disparados
  em sincronia, gerando ondas elétricas grandes e lentas. É mais difícil acordar a pessoa
  neste estágio quando comparado aos estágios 1 e 2. Durante o sono de ondas lentas ocorre
  a consolidação de certos tipos de memória, por isso ele é importante para a aprendizagem.
  Neste mesmo estágio, os músculos são reparados por meio de regeneração celular.

  Quanto mais tempo acordado e mais ativo fisicamente, mais atividade de sono de ondas lentas
  o cérebro apresenta. Este estágio reflete a necessidade do cérebro em dormir que aumentou
  ao longo do tempo em que se esteve acordado, o que é muitas vezes descrito como “o processo
  homeostático do sono” ou “pressão do sono” (ver 9.1.2). Logo, este tipo de sono é o que
  é o que se encaixa com a ideia tradicional de que o sono restaura o indivíduo das atividades
  realizadas quando acordado.

  Sono REM

  No sono REM, a atividade cerebral se parece com a de um indivíduo acordado. Entretanto,
  neste tipo de sono, de tempos em tempos os olhos se movem sob as pálpebras - o chamado “movimento
  rápido dos olhos”, o que dá nome a este tipo de sono (REM = Rapid Eye Movement), também
  chamado de sono paradoxal. Ele é acompanhado de espasmos musculares e frequências cardíaca
  e respiratória irregulares. A maioria dos adultos passa um quarto do período de sono em
  sono REM.

  Durante o sono REM, o cérebro está se autorreparando. Informações do dia anterior são consolidadas,
  classificadas e relacionadas às memórias previamente armazenadas. Pessoas acordadas do sono
  REM normalmente podem se lembrar com clareza de detalhes dos sonhos. No sono REM, o corpo
  não consegue se mexer em resposta aos sinais do cérebro, por isso os sonhos não são atuados.
  As pessoas podem experimentar uma breve paralisia quando acordam do sono REM, quando a reversão
  da paralisia do sono REM não ocorre de forma simultânea. Devido a estas características,
  o sono REM é descrito como um "cérebro ativo em um corpo paralisado".

  Inércia do sono

  Despertar do sono não é apertar uma chave de “liga/desliga”, e sim passar por um processo
  em que várias partes do cérebro precisam se reativadas em sequência. Durante esse período,
  as pessoas podem sentir uma sensação de letargia e desorientação. Tal condição é conhecida
  como inércia do sono, sendo normalmente mais intensa após longos períodos de sono. A duração
  e a intensidade da inércia do sono também são maiores quando o indivíduo não obteve sono
  suficiente anterior, quando é acordado durante o sono profundo ou durante a Janela de Baixa
  do Alerta no Ritmo Circadiano.

  A importância de se considerar a inércia do sono nas operações aéreas é que ela caracteriza
  um período de hipovigilância (atenção rebaixada), confusão, desorientação e comprometimento
  do desempenho cognitivo e sensório-motor que, embora sejam transitórios, podem impactar
  uma tomada de decisão.

  A inércia do sono é o terceiro processo no modelo de regulação do sono (vide modelo de regulação
  do sono em dois processos na Seção 8.3.3 desta IS). Ela representa um declínio curto, porém
  saliente, do alerta e do desempenho imediatamente após o despertar (Hilditch e McHill, 2019).

  A inércia do sono pode ser bem mais intensa (até 3,6 vezes maior) se ocorrer durante o horário
  do sono biológico, ou seja, no horário em que a pessoa dormiria se estivesse livre do trabalho
  no local onde está fisiologicamente adaptada (Scheer, 2008).


  IMPLICAÇÕES OPERACIONAIS 1

  ESTRATÉGIAS DE MITIGAÇÃO DA INÉRCIA DO SONO


  · A possível ocorrência de inércia do sono às vezes é usada como argumento desfavorável
  a dormir ou cochilar quando há a expectativa de que um indivíduo possa ter de trabalhar
  imediatamente após acordar (por exemplo, em situações de reserva em aeroportos).

  · Embora não seja desejável que um indivíduo acordado para uma emergência esteja sob os
  efeitos da inércia do sono, os benefícios do sono também devem ser levados em consideração,
  especialmente se a necessidade não for urgente e houver tempo livre para recuperação da
  inércia.

  · O risco de inércia do sono pode ser reduzido:

  ü por um protocolo de retorno ao serviço ativo que oportunize tempo suficiente para dissipar
  a inércia do sono. Após qualquer período de sono superior a 20 minutos, pelo menos 10-15
  minutos devem ser permitidos antes de recomeçar as tarefas relacionadas à segurança ou dirigir;
  e

  ü pela limitação da duração de um cochilo a não mais de 20 minutos. No entanto, um período
  tão curto de sono não proporcionará benefícios para o estado de alerta no longo prazo.

  · Em tripulações compostas ou de revezamento, após o descanso a bordo, deve ser garantido
  ao tripulante um prazo de, pelo menos, 15 minutos antes de ele/ela recomeçar suas atividades
  a bordo. A IS nº 117-003 detalha os procedimentos após o descanso a bordo para minimizar
  os efeitos da inércia do sono.

  · Consulte Implicações Operacionais 5: Cochilar como Mitigação da Fadiga para obter mais
  informações sobre como o cochilo pode ser usado para mitigar a fadiga.

  Quadro 1. Implicações Operacionais 1: Estratégias de mitigação da inércia do sono


  Fatores que afetam a qualidade do sono

  A qualidade do sono (isto é, sua função restauradora) depende da passagem por ciclos ininterruptos
  de sono NREM e REM. Quanto mais o sono é fragmentado pelo despertar, menor será o seu valor
  restaurador. Isso mostra que ambos os tipos de sono são importantes. Entretanto, existem
  fatores que podem afetar tanto a quantidade quanto a qualidade do sono obtido, como idade,
  distúrbios do sono, uso de cafeína, álcool e nicotina, hábitos pessoais, fatores pessoais
  e condições ambientais.


  IMPLICAÇÕES OPERACIONAIS 2

  PROCEDIMENTOS PARA MINIMIZAR INTERRUPÇÕES DO SONO


  · Como os ciclos NREM/REM ininterruptos são a chave para um sono de boa qualidade, deve
  haver procedimentos para minimizar possíveis interrupções do sono, quer ele ocorra durante
  os períodos de trabalho ou de repouso/folga.

  · Os operadores aéreos devem desenvolver procedimentos para proteger o sono dos tripulantes
  em acomodações fornecidas pela empresa (como, por exemplo, fazendo uma avaliação dos hotéis
  de pernoite, e adequando as áreas de espera em aeroportos para os casos de reserva). O operador
  deve restringir o acesso aos locais onde as pessoas estão tentando dormir e garantir que
  os períodos de silêncio sejam respeitados (por exemplo, evitar trabalho de manutenção ou
  limpeza de rotina). Conforme aplicável, devem ser cumpridos os requisitos para acomodações
  para repouso ou acomodação para reserva.

  · Mais informações em como proteger o sono constam das IS nº 117-002 e IS 117-003.

  Quadro 2. Implicações Operacionais 2: Procedimentos para minimizar interrupções do sono


  Idade e qualidade do sono

  O sono não é igual ao longo da vida. Durante a idade adulta, o sono se altera significativamente.
  Um estudo demonstrou que a quantidade de sono de ondas lentas diminui com a idade, enquanto
  a quantidade de sono leve aumenta (Redline, 2004). Esta alteração foi inicialmente identificada
  nos homens, com poucas diferenças para as mulheres. A qualidade do sono, medida por meio
  do tempo acordado durante uma noite normal de sono, também diminui com a idade.

  Não é claro se tais alterações no sono com a idade reduzem a efetividade de restaurar as
  funções de vigília. Estudos em laboratórios que interrompem (fragmentam) o sono são normalmente
  conduzidos com adultos jovens. Na aviação, a experiência, tanto em termos de habilidade
  na tarefa quanto em saber como administrar o sono em diferentes turnos de trabalho, poderia
  auxiliar a reduzir o risco potencial de fadiga derivado das alterações dos padrões de sono
  com o avançar da idade.


  Distúrbios do sono

  A qualidade do sono pode ser prejudicada por uma variedade de distúrbios de sono, que podem
  impossibilitar a obtenção do sono restaurador, mesmo quando a pessoa permanece na cama por
  tempo suficiente tentando dormir. Algumas pessoas sofrem de distúrbios do sono quase todas
  as noites, tornando-se cronicamente cansadas e improdutivas. Outras são vítimas de sonolência
  excessiva durante o dia. Estas condições podem estar associadas aos tipos de sono REM ou
  NREM.

  Os distúrbios do sono representam um risco particular quando as características da operação
  restringem o tempo disponível para dormir. O treinamento de gerenciamento individual de
  fadiga deve incluir informações básicas sobre distúrbios do sono e seu tratamento, onde
  procurar ajuda, se necessário, e quaisquer requisitos relacionados à aptidão para o trabalho.

  Alguns exemplos de distúrbios do sono são:

  insônia, caracterizada pela dificuldade de iniciar o sono, mantê-lo continuamente durante
  a noite ou pelo despertar antes do horário desejado;

  apneia obstrutiva do sono, caracterizada pela obstrução da via aérea durante o sono, levando
  a uma parada da respiração que dura em média 20 segundos. Após essa parada, a pessoa acorda,
  emitindo um ronco muito alto. A apneia pode ocorrer várias vezes durante a noite, havendo
  pessoas que apresentam episódios a cada um ou dois minutos; e

  síndrome das pernas inquietas, caracterizada pela agitação involuntária dos membros inferiores,
  mas que pode ocorrer também com os braços, nos casos mais graves. Em geral, os sintomas
  são mais intensos à noite, fazendo com que a pessoa durma mal ou quase não durma.

  Sintomas

  A principal manifestação dos problemas crônicos de sono é a sonolência excessiva diurna.
  As primeiras manifestações dos distúrbios do sono são as alterações do humor, da memória
  e das capacidades mentais, como aprendizado, raciocínio e pensamento.

  Um sintoma muito característico de distúrbio de sono é o ronco. O ronco ainda hoje pode
  ser interpretado como sinal de que o indivíduo dorme bem, mas é justamente o contrário.
  Há evidências de que o ronco é mais presente entre trabalhadores em turnos e noturnos (como
  os tripulantes) do que entre trabalhadores exclusivamente diurnos (Menezes et al., 2004).

  Pessoas com dificuldade em dormir ou que se sentem cansadas ao longo do dia sem motivo aparente
  devem buscar orientação médica para avaliar a possível existência de um distúrbio de sono,
  pois é muito difícil que identifiquem o problema sozinhas.


  Uso de substâncias

  O uso de cafeína (presente em cafés, chás, energéticos, colas, chocolates e diversas medicações)
  estimula o cérebro, promovendo o alerta. Por outro lado, também dificulta o início do sono
  e afeta sua qualidade dependendo da hora em que é ingerida. A sensibilidade à cafeína varia
  entre as pessoas, mas mesmo tomadores assíduos de café apresentarão sonos mais leves e perturbados
  se ingerirem perto da hora de dormir (embora tal fato possa não ser percebido por eles).

  Os efeitos da cafeína normalmente podem ser percebidos após 15 minutos da ingesta, e durar
  de quatro a seis horas.

  A nicotina presente em cigarros também é um estimulante e afeta o sono de forma similar
  à cafeína.

  O álcool, apesar de gerar um estado de sonolência, prejudica o sono. Enquanto o corpo processa
  o álcool (na média de uma dose padrão por hora1), o cérebro não consegue obter o sono REM.
  A pressão pelo sono REM aumenta, e então as fases finais do período de sono contém mais
  períodos de sono REM, resultado em um sono mais perturbado como consequência.


  IMPLICAÇÕES OPERACIONAIS 3:

  USO DE CAFEÍNA


  · A cafeína pode ser útil para reduzir temporariamente a sonolência durante o trabalho porque
  bloqueia uma substância química no cérebro (adenosina), que aumenta a sonolência. Também
  pode ser consumida antes de um período do dia que provavelmente está associado à maior sonolência
  (por exemplo, as primeiras horas da manhã).

  · É importante lembrar que a cafeína não elimina a necessidade de sono e deve ser usada
  apenas como estratégia de curto prazo.

  · Para obter o máximo benefício, a cafeína deve ser usada estrategicamente: ser evitada
  quando o estado de alerta for alto e ser consumida quando o estado de alerta for baixo (por
  exemplo, ao final de um longo período de trabalho ou quando chamado para uma jornada noturna).

  Quadro 3. Implicações Operacionais 3: Uso de cafeína


  Fatores ambientais

  Condições ambientais também podem prejudicar o sono. A exposição à luz intensa aumenta o
  alerta (ela inclusive é usada como estratégia de combate a fadiga), por isso é muito mais
  fácil dormir em um quarto escuro, com cortinas escuras ou máscaras para os olhos para bloquear
  a luz.

  Sons repentinos também prejudicam o sono. Uma tentativa para mascará-los pode ser ligar
  o rádio (ruído entre estações) ou aparelhos que produzam ruídos contínuos (como ventilador
  ou o aparelho de ar-condicionado).

  O pegar no sono também depende de conseguir baixar a temperatura corporal central (pela
  perda de calor pelas extremidades), por isso é mais fácil dormir se o ambiente estiver mais
  para frio do que para quente. Para a maioria das pessoas, temperaturas entre 18-20°C são
  ideais para favorecer o sono.

  A superfície onde se dorme também é importante. O sono obtido na posição horizontal é mais
  restaurador do que o obtido em posição inclinada.


  Qualidade do sono a bordo, em reserva e em sobreaviso

  O sono obtido em aeronaves (descanso a bordo, durante o voo) normalmente é fragmentado,
  ou seja, de pior qualidade. Os fatores identificados pelos tripulantes como prejudiciais
  ao sono foram barulhos aleatórios, pensamentos, não estar com sono no momento do descanso,
  turbulência, ruídos da aeronave, acomodações inadequadas, baixa umidade e idas ao banheiro.

  Em situações de sobreaviso e reserva, o sono pode ser perturbado se existir uma expectativa
  de ser acordado e chamado para voar. Um estudo em laboratório comparou o sono de pessoas
  que foram advertidas que poderiam ser acordadas e chamadas para responder a um barulho com
  o sono de pessoas que não receberam tal instrução. Os resultados mostraram que as pessoas
  que receberam o aviso demoraram mais para pegar no sono e ficaram mais acordadas durante
  a noite do que as outras, mesmo que o barulho não tenha ocorrido e o sono não tenha sido
  efetivamente perturbado por fatores externos (Wuyts et al., 2012).


  IMPLICAÇÕES OPERACIONAIS 4

  PROTOCOLOS PARA SOBREAVISO E RESERVA


  Embora as situações de reserva e sobreaviso não tenham a certeza associada aos turnos programados,
  os mesmos princípios científicos se aplicam. É importante estabelecer protocolos para atribuição
  de tarefas não programadas que visem:

  · minimizar as interrupções durante os períodos circadianos em que o sono é mais provável
  de ocorrer.

  Durante os períodos de reserva ou sobreaviso, haverá momentos em que é mais provável que
  um indivíduo consiga dormir. Portanto, as interrupções (como chamadas telefônicas não urgentes
  do trabalho) durante esses horários devem ser minimizadas (consulte Implicações Operacionais
  2. Procedimentos para minimizar interrupções do sono).

  · limitar horas contínuas de vigília (tempo acordado) antes e durante os períodos de reserva
  e sobreaviso.

  ü Sempre que possível, um período de notificação deve ser fornecido antes que o indivíduo
  seja chamado para se apresentar. Isso permite que um indivíduo se prepare tirando um cochilo
  em casa e limite seu tempo acordado antes de iniciar o trabalho.

  ü Se períodos mínimos de notificação não forem operacionalmente viáveis, ou se for necessário
  estender o período de trabalho, a possibilidade de cochilar durante a reserva, por exemplo,
  pode mitigar o acúmulo de fadiga em horas estendidas de vigília.

  ü Deve-se considerar as instalações apropriadas de cochilo e o estabelecimento de protocolos
  de cochilo (ver Implicações Operacionais 5: Cochilar como mitigação da fadiga).

  · programar sobreaviso e reserva de maneira previsível.

  ü Períodos de reserva e de sobreaviso devem ser atribuídas com o máximo de antecedência
  possível e, idealmente, de maneira previsível. Isso fornece algum nível de consistência
  no tempo dos períodos de trabalho e permite que os indivíduos planejem e gerenciem suas
  oportunidades de sono.

  Quadro 4. Implicações Operacionais 4: Protocolos para sobreaviso e reserva


  O impacto do tempo acordado

  Quanto mais tempo um indivíduo permanece acordado, pior se torna seu alerta e seu desempenho.
  Isso acontece devido ao aumento da pressão homeostática do sono associado aos longos períodos
  de vigília. Dormir é a única forma de reverter isso.

  O US National Transportation Safety Board examinou a relação entre o tempo acordado e erros
  observados em 37 acidentes de aeronaves de asa fixa (1978-1990), nos quais as ações ou omissões
  da tripulação de voo foram fatores contribuintes2. Em termos de tipos de erro, as tripulações
  com “muito tempo acordado” (média de quase 14 horas) cometeram significativamente mais erros
  de procedimento e erros de decisão tática do que as tripulações com “pouco tempo acordado”
  (média de 5 horas).

  Não apenas a quantidade de horas desde o despertar importa, a quantidade de sono obtido
  anteriormente (ou seja, a condição de existir ou não débito de sono) e o período do dia
  em que se mantém acordado (se de dia ou de noite) também devem ser considerados. Em condições
  normais, oito horas diárias de sono garantem 16 horas de vigília; entretanto, se existir
  débito de sono anterior, a quantidade de sono obtida nas últimas 48 horas gera uma melhor
  avaliação das condições do alerta. Assim, a partir de 16 horas de vigília contínua a fadiga
  seria considerada um perigo em potencial para indivíduos que obtiveram oito horas de sono
  nas duas noites anteriores. Na prática, a fadiga passaria a ser um problema a partir de
  12 a 14 horas de vigília para turnos iniciados muito próximos ao horário em que o indivíduo
  acordou. Por outro lado, em turnos que finalizam em horários próximos à hora de dormir,
  a fadiga se tornaria um perigo em potencial após oito horas de jornada. Em casos de turnos
  noturnos e de madrugada, considerando que o indivíduo já estaria acordado há 14-16 horas,
  a fadiga seria um problema presente durante todo o turno de trabalho (Dawson e McCulloch,
  2005).

  Um importante aspecto a ser considerado no cálculo do tempo acordado é o tempo de deslocamento
  até o aeroporto (commuting). Na confecção das escalas de voos, o operador aéreo considera
  que o tripulante esteja a uma distância relativamente próxima (ex. 1 hora). Entretanto,
  tripulantes que preferem morar mais longe ou mesmo em outras cidades podem necessitar muito
  mais tempo de deslocamento, e isso deve ser considerado no gerenciamento individual do tempo
  acordado, especialmente há quanto tempo estará acordado ao final da jornada3.

  O cochilo é uma estratégia eficaz para diminuir o tempo acordado. Em especial, cochilos
  antes de turnos iniciados mais tarde/à noite diminuem o tempo acordado e são recomendados.

  IMPLICAÇÕES OPERACIONAIS 5

  COCHILAR COMO MITIGAÇÃO DA FADIGA

  · Quando uma pessoa está acordada por um longo período ou não dormiu o suficiente por um
  ou mais dias, cochilar é uma estratégia eficaz para reduzir a fadiga. O cochilo é uma mitigação
  de curto prazo que pode ser usada antes e durante o trabalho para ajudar a manter o desempenho
  e o estado de alerta. No entanto, o cochilo não pode ser usado como meio de estender o período
  de trabalho, pois para se recuperar completamente da fadiga são necessários um ou mais períodos
  completos de sono.

  · Cochilo antes do trabalho: quando um período de trabalho se inicia mais tarde (por exemplo,
  no final da tarde ou à noite), um cochilo antes do início do trabalho reduzirá o período
  de vigília e poderá melhorar o desempenho e o estado de alerta durante a jornada. A hora
  do dia em que é mais provável que possamos tirar um cochilo é durante a janela de baixa
  do alerta da tarde (15 às 17h) ou durante a janela normal da noite para dormir.

  · Cochilo durante a jornada de trabalho: um cochilo durante a jornada de trabalho pode ajudar
  a manter o desempenho durante períodos de trabalho prolongados ou noturnos.

  ü A forma como esses cochilos são gerenciados dependerá do contexto em que ocorrem e onde
  podem ocorrer (por exemplo, durante a reserva, em aeroportos, ou acomodações para descanso
  a bordo de aeronave).

  ü A duração do tempo dado ao cochilo dependerá em grande parte da hora do dia e do tempo
  disponível, o que pode ser difícil de controlar. Idealmente, o período do cochilo deve permitir
  tempo suficiente para os indivíduos adormecerem (pode levar mais tempo do que o normal para
  adormecer nessas circunstâncias) e tempo suficiente após o despertar antes de recomeçar
  as tarefas para garantir que qualquer inércia do sono tenha se dissipado (ver Implicações
  Operacionais 1: Estratégias de Mitigação da Inércia do Sono).

  ü Também é fundamental que os indivíduos saibam que não podem reduzir seu tempo de sono
  anterior à jornada, assumindo que realizarão um cochilo durante a jornada. Se intencionalmente
  dormem menos antes do trabalho porque supõem que vão tirar um cochilo no trabalho, o benefício
  geral de permitir o cochilo pode não ser atingido. Além disso, é responsabilidade do tripulante
  aproveitar da melhor maneira possível sua oportunidade de sono. Se, ao iniciar a jornada,
  o tripulante não se considera apto (ou seja, se tiver razões para acreditar que esteja,
  ou provavelmente venha a estar sob o efeito de fadiga que possa prejudicar o seu desempenho
  de modo a afetar a segurança da operação) e entende que somente estaria apto mediante a
  realização de cochilo, o tripulante não pode aceitar operar a aeronave.

  Quadro 5. Implicações Operacionais 5: Cochilar como mitigação da fadiga


  Princípio científico 2. A perda e a recuperação do sono

  A perda do sono.

  Mesmo para pessoas que consideram obter uma boa qualidade de sono, a quantidade de sono
  obtido também importa para restaurar as suas funções normais do corpo quando acordado.

  Numerosos estudos de laboratório observaram os efeitos da restrição de sono noturno de 1
  ou 2 horas. A perda de apenas 2 horas de sono em uma noite diminui o alerta do dia seguinte
  e degrada o desempenho em diversos tipos de tarefas.

  Os efeitos de restringir o sono noite após noite acumulam-se, levando a pessoa a se tornar
  menos alerta e menos funcional a cada dia que segue. Isto é chamado de débito de sono acumulado.
  Esta situação pode ocorrer na aviação quando os períodos mínimos de repouso e folgas são
  agendados em sequência ou quando o horário de início ou término de uma jornada sobrepõe-se
  ao período usual de oportunidade de sono noturno por vários dias consecutivos.

  Quanto menor o tempo disponível para dormir à noite, maior é a queda no nível de alerta
  e no desempenho. A figura 5 apresenta o efeito da restrição do sono em função da quantidade
  da restrição. Sonos com duração de 7 horas já demonstram piora na velocidade do tempo de
  reação, e exigem dias de recuperação. Tal impacto é ainda mais exacerbado em situações em
  que o sono se restringe a 5 ou 3 horas por noite.


  Figura 4. Desempenho (PVT) após sono de 9 horas e sono restrito (7, 5, 3 horas) e tempo
  de recuperação [fonte: (Belenky, et al., 2003)].

  8.1.5. Sono insuficiente impacta diversas facetas do funcionamento cognitivo, sendo que
  os mais atingidos parecem ser a velocidade de processamento e a atenção. Adicionalmente,
  estudos realizados com imagens cerebrais sugerem que as regiões do cérebro envolvidas em
  tarefas mentais mais complexas (por exemplo, antecipação de eventos, planejamento e determinação
  de cursos de ação importantes - particularmente quando em situações novas) são as mais afetadas
  com a perda de sono e apresentam maior necessidade de sono para recuperar voltar aos padrões
  normais.

  Estudos cujos métodos incluem tarefas cognitivas mais complexas mostram que o sono insuficiente
  causa mudanças na memória de curto prazo, na capacidade de realização de cálculos de aritmética
  de cabeça, na execução de funções executivas e na linguagem. Já nos estudos que utilizam
  tarefas de atenção e tempo de reação como método, os resultados são menos consistentes,
  bem como há uma menor variabilidade em termos desempenho.

  A regularidade da perda do sono pode atingir um patamar em que o indivíduo deixa de perceber
  os efeitos prejudiciais da restrição crônica do sono. Por exemplo, nos primeiros 3 dias
  de restrição de sono severa (3 horas na cama), as pessoas estão conscientes de que estão
  se tornando cada vez mais sonolentas. Entretanto, após vários dias na mesma condição, elas
  deixam de perceber diferenças nelas mesmas, mesmo com o desempenho e o alerta em contínuo
  declínio. Ou seja, com a manutenção da restrição de sono, as pessoas vão se tornando cada
  vez menos confiáveis na avaliação da própria condição. Por isso, embora ambas as ferramentas
  de avaliação subjetiva e objetiva sejam importantes na avaliação da fadiga, os testes objetivos
  são mais confiáveis na medição do prejuízo do desempenho devido à fadiga.

  Sucessivos dias de restrição de sono aumentam progressivamente a pressão para dormir. Ao
  final, a pressão se torna tão forte que a pessoa pega no sono por períodos curtos de forma
  incontrolável, condição conhecida como microssono. No microssono, o cérebro se desliga [desconecta]
  do ambiente, deixando de processar as informações visuais e sonoras. No laboratório, o microssono
  pode se expressar pela perda do estímulo num teste de desempenho. Quando dirigindo, pode
  significar perder a entrada de uma rua, por exemplo. Nos finais de turnos longos e/ou noturnos,
  esta situação poderá ser mais comum. Eventos semelhantes foram registrados na cabine de
  voo durante a descida em grandes aeroportos.

  Estudos em laboratório buscaram comparar os efeitos da restrição de sono no desempenho psicomotor
  com a concentração de álcool no sangue. A figura 6 ilustra os efeitos da restrição de sono
  no desempenho psicomotor comparado ao desempenho quando há concentração de álcool no sangue.
  Quarenta indivíduos participaram de dois experimentos. No primeiro, eles foram mantidos
  acordados por 28 horas (das 08:00 de um dia às 12:00 do dia seguinte), e no outro eles foram
  solicitados a consumir doses de 10 a 15 g de álcool a cada 30 minutos desde às 08:00 até
  que sua concentração de álcool no sangue chegasse a 0,10%. O desempenho psicomotor, mensurado
  por meio de em uma tarefa de rastreamento visual e reação das mãos em momentos imprevisíveis,
  de forma computadorizada, foi medido a cada 30 minutos. Os resultados foram expressos em
  percentagem do desempenho no início de cada sessão. Verificou-se que a concentração de álcool
  de 0,05% (aproximadamente uma garrafa de cerveja de 600ml) equivale em termos de prejuízo
  de desempenho a 17 horas em vigília, e a concentração de 0,10% (entre 2 e 3 taças de vinho)
  a 24 horas em vigília.


  Figura 5. Comparação da restrição de sono com a concentração de álcool no sangue em termos
  de efeitos no desempenho psicomotor [fonte: (Dawson, et al., 1997)].

  No entanto, existe variação individual na forma e na intensidade em que a fadiga se expressa.
  Ao menos em estudos de laboratórios, algumas pessoas se apresentam mais resilientes do que
  outras aos efeitos de restrição de sono (as chamadas diferenças interindividuais). Ainda
  não se sabe o porquê isto acontece, mas o reconhecimento de que isto existe pode auxiliar
  o gerenciamento individualizado, especialmente para pessoas que se sentem mais afetadas
  pela fadiga relacionada à perda de sono.

  A recuperação do sono

  O tempo necessário para a recuperação dos efeitos da restrição de sono ainda não é claro.
  É possível que os efeitos de uma restrição de sono prolongada impactem o nível de alerta
  e o desempenho por dias ou até mesmo semanas. Entretanto, as seguintes afirmações, obtidas
  por meio de estudos, são confiáveis e devem ser utilizadas como referência:

  a perda do sono não é recuperada hora a hora. O sono de recuperação pode ser mais longo
  que o sono usual;

  pelo menos duas noites consecutivas de sono irrestrito são necessárias para que o ciclo
  NREM/REM volte ao normal (normalmente, na primeira noite mais sono de ondas lentas ocorrerá,
  e menos sono REM; na segunda noite, mais sono REM);

  a recuperação do ciclo NREM/REM normal pode demorar mais se o sono de recuperação não for
  noturno, ou se o indivíduo não estiver adaptado ao fuso horário do local; e

  se a restrição de sono se mantiver por diversas noites, então a recuperação do alerta e
  do desempenho vai requerer mais de duas noites de sono irrestrito (por exemplo, três oportunidades
  de sono noturno de 8 horas não são suficientes para recuperar a restrição de sono de 7 horas
  durante 7 noites; e estender o sono a 10 horas em uma noite não recupera os efeitos acumulados
  sono restrito a 4 horas durante 5 noites).

  Durante restrições leves, porém prolongadas, de sono, é possível que o cérebro reconfigure
  a forma que ele administra as tarefas, de forma que a pessoa estabiliza num nível subótimo
  de alerta e desempenho. Entretanto, os tempos prolongados de recuperação observados em laboratório
  sugerem que o retorno ao nível ótimo seja um processo lento. Períodos mais longos de folga,
  como férias, podem ser importantes para a recuperação.


  IMPLICAÇÕES OPERACIONAIS 6

  PERMITINDO A RECUPERAÇÃO DO SONO

  · Como os efeitos da restrição do sono são cumulativos, as escalas dos tripulantes devem
  ser projetadas para permitir oportunidades periódicas de recuperação mais dilatadas. As
  oportunidades de recuperação precisam ocorrer com mais frequência quando a restrição diária
  de sono é maior, devido ao acúmulo mais rápido de fadiga.

  · A recomendação usual para uma oportunidade de recuperação é um mínimo de duas noites consecutivas
  de sono irrestrito. Isso não é necessariamente 48 horas de folga. Um intervalo de 48 horas
  a partir da meia-noite não permitirá à maioria das pessoas duas noites consecutivas de sono
  irrestrito (a maioria das pessoas vai dormir antes da meia-noite). Por outro lado, um intervalo
  de 40 horas a partir das 20:00 permitirá à maioria das pessoas duas noites consecutivas
  de sono irrestrito.

  Quadro 6. Implicações Operacionais 6: Permitindo a recuperação do sono


  A restrição de sono afeta a saúde a longo prazo

  Evidências de estudos de laboratório e de estudos epidemiológicos que rastreiam o sono e
  a saúde de muitas pessoas ao longo do tempo indicam que o sono crônico de curta duração
  pode ter efeitos negativos sobre a saúde a longo prazo.

  Pessoas que tenham regularmente restrições de sono apresentam maior risco de desenvolver
  doenças metabólicas, como obesidade e diabetes tipo 2, bem como doenças cardiovasculares
  e gastrointestinais.

  Aspectos da saúde mental também têm sido cada vez mais estudado em trabalhadores em turnos.
  Transtornos mentais comuns têm se mostrado associados à fadiga e a outros aspectos do trabalho,
  especialmente a ansiedade e a depressão. Uma pesquisa mostrou que sintomas de ansiedade
  e depressão foram relatados em dobro por pilotos que trabalharam por mais tempo durante
  uma semana de trabalho e por aqueles que relataram episódios de microssono na cabine de
  comando (O´Hagan et al., 2016). Em outra, os pilotos que reportaram terem cometido mais
  erros na cabine como uma consequência direta da fadiga também obtiveram maior pontuação
  nas escalas de avaliação de fadiga, ansiedade e depressão (Aljurf et al., 2018).

  princípio científico 3. os efeitos circadianos no sono e no desempenho

  Desajustes do relógio biológico

  Geral

  As alterações diárias e sazonais exibidas pelos animais, incluindo o homem, são denominados
  ritmos biológicos. Estes ritmos estão relacionados ao ciclo rítmico dos dias e das estações
  produzidos pela rotação da Terra em seu eixo e pelo seu movimento ao redor do sol. A Terra
  completa um giro em seu eixo a cada 24 horas, produzindo um ciclo de dia-noite de 24 horas.

  O comportamento dos seres humanos é governado mais pelos ciclos diários do que pelos sazonais.
  Assim, ele é dominado pelo ritmo de atividades durante o dia e pelo dormir durante a noite.
  O ciclo diário não é seguido apenas pelos comportamentos de vigília e sono, mas também por
  frequência do pulso, pressão sanguínea, temperatura corporal, ritmo de divisão celular,
  contagem de células sanguíneas, estado de alerta, composição da urina, taxa metabólica,
  impulso sexual e sensibilidade a medicamentos.

  Dois tipos de ritmos típicos da maioria dos animais são os ritmos circanuais (ao redor de
  um ano), como os ciclos migratórios de aves, e os ritmos circadianos (ao redor de um dia),
  que são os ritmos noite-dia. Também existem outros, como o ultradiano (inferior a um dia),
  como o piscar de olhos e a alimentação, e o infradiano (superior a um dia), como o ciclo
  menstrual e as estações.

  Para antecipar as mudanças diárias e sazonais, os seres humanos possuem diversos relógios
  biológicos que respondem a estímulos de nosso ambiente. Estes relógios são endógenos, ou
  seja, próprios do organismo, e determinam ritmos independentemente de estímulos exógenos
  (externos). A base neural do relógio biológico foi estabelecida como uma região do cérebro
  chamado de núcleo supraquiasmático, localizado no hipotálamo, acima (supra) do quiasma óptico.
  O núcleo supraquiasmático recebe informações sobre a luz por sua óptica especial (não relacionada
  à visão), a via retino-hipotalâmica. Os sinais luminosos são conduzidos por esta via para
  o núcleo supraquiasmático para excitar e determinar o ritmo nesse núcleo.

  Após diversas pesquisas, ficou demonstrado que indivíduos da espécie humana apresentam um
  ciclo de sono-vigília de aproximadamente 24 horas (na realidade, o ciclo é um pouco maior
  que 24 horas). A manutenção do ritmo, contudo, inicialmente não estava clara. O “acertar
  o relógio biológico” seria semelhante a acertar um relógio de pulso ou de parede adiantado
  ou atrasado. Em experimentos para determinar como acertar os relógios biológicos, pesquisadores
  descobriram que estímulos como nascer e pôr do sol, os momentos de alimentação e outras
  atividades podem ajustar o relógio biológico. Normalmente, a luz é o estímulo mais potente
  para o acerto do relógio. Estes estímulos foram denominados de zeitgebers (palavra alemã
  que significa “doadores de tempo”), também chamadas de alinhadores de ciclo (ou sincronizadores).

  Existem atividades rítmicas em muitas funções corporais, incluindo temperatura corporal,
  níveis de hormônio, atividades de comer e beber que não estão perfeitamente coordenadas
  com o ciclo sono-vigília. Sugeriu-se, por isso, que ritmos com períodos semelhantes, mas
  com fases diferentes, pudessem ser controlados por relógios distintos. Alguns órgãos, como
  fígado, rins e intestino contêm relógios periféricos que geram seus próprios ritmos circadianos
  locais. Outro exemplo é a temperatura corporal. Embora geralmente mais baixa durante o sono,
  ela não é perfeitamente correlacionada com o sono. A maior queda da temperatura corporal
  central ocorre normalmente na madrugada, exibindo outra queda menor no início da tarde.

  O tempo de sono e vigília da maioria dos seres humanos, em condições naturais, é consistente
  com o controle circadiano do ciclo do sono e de todos os outros ritmos circadianos controlados.
  No entanto, as pessoas que trabalham em uma sociedade moderna desrespeitam seu relógio biológico
  e tentam dormir em momentos que nem sempre são consistentes com o impulso biológico de dormir
  - os chamados zeitgebers sociais. Por exemplo, quando os indivíduos viajam rapidamente por
  fusos horários ou trabalham no turno noturno, o ciclo sono/vigília está fora de fase com
  os ritmos biológicos controlados pelo relógio biológico. Isso pode afetar negativamente
  o estado de alerta enquanto estiver acordado e no trabalho, ou ainda a capacidade de obter
  o sono restaurador caso seja necessário dormir. Esse tipo de interrupção da sincronia circadiana
  pode resultar em dificuldades, como deficiência da função cognitiva, sonolência, alteração
  da função hormonal e queixas gastrointestinais.

  A regulação do sono é tradicionalmente explicada pelo modelo de dois fatores (Borbély, 1982).
  Neste modelo, existe uma interação entre dois processos: o Processo S (do sono) e o Processo
  C (circadiano), que resulta na propensão total do sono. Veja a figura 6.


  Figura 6. Modelo de dois fatores da regulação do sono: Processo S (homeostático do sono)
  e Processo C (circadiano). Associação Brasileira de Sono, 2023.


  O processo homeostático do sono (processo S)

  O primeiro processo na regulação do horário e qualidade do sono é a pressão homeostática
  do sono. Ela se traduz como o aumento da necessidade de dormir (aumento da pressão) à medida
  que se passa mais tempo acordado. A única maneira de descarregar essa pressão é dormindo.

  Ao longo do tempo acordado, a pressão para o sono de ondas lentas aumenta. Quanto mais tempo
  acordado, mais sono de ondas lentas nos primeiros ciclos NREM/REM na próxima vez em que
  dormir.

  Durante o sono, a quantidade de ondas lentas diminui em cada ciclo subsequente NREM/REM.
  Em outras palavras, a pressão para o sono de ondas lentas é descarregada ao longo do período
  de sono.

  A interação entre o relógio biológico e a pressão homeostática do sono produz dois momentos
  de sonolência ao longo das 24 horas:

  entre 02:00 e 06:00, para a maioria das pessoas durante uma noite normal de sono,, isto
  é, a Janela de Baixa do Alerta no Ritmo Circadiano; e

  entre 15:00 e 17:00, para a maioria das pessoas, momento denominado de janela da sonolência
  diurna, quando a sonolência aumenta durante a tarde. Quando o sono é restrito ou perturbado
  à noite, torna-se mais difícil manter-se alerta durante esta janela.

  Entretanto, diferenças individuais existem e determinam períodos ou horário diferentes em
  que a sonolência ocorre. Pessoas que se sentem mais dispostas pela manhã são chamadas de
  matutinas, porque os horários de dormir são mais cedo do que para a maioria das pessoas.
  Por sua vez, pessoas que preferem ir dormir mais tarde do que a maioria são chamadas de
  vespertinas. Essas preferências variam ao longo da vida - durante a adolescência, as pessoas
  se tornam mais vespertinas, com a idade adulta, tornam-se mais matutinas. Existem testes
  que avaliam a preferência das pessoas, ao que se chama de avaliação de cronotipo4. A maioria
  da população se encaixa, contudo, no cronotipo intermediário (~51%), o qual se encontra
  entre o cronotipo matutino (~34%) e vespertino (~15%) (proporções com dados brasileiros:
  Benedito-Silva et al., 1990).

  O processo circadiano (processo C)

  O processo C depende do relógio biológico, cujas conexões cerebrais promovem o sono e o
  despertar, modulando-o de forma a controlar o ciclo sono/vigília. Ele também influencia
  a quantidade e horário do sono REM. Logo após a temperatura central estar mínima, o cérebro
  entra mais rapidamente no sono REM e nele permanece por mais tempo do que em outra parte
  do ciclo. Tal condição por vezes é chamada de propensão ao sono REM. Assim, durante uma
  noite normal de sono, os turnos mais longos de sono REM ocorrem nos últimos ciclos NREM
  próximos ao amanhecer.

  A respeito do Processo C, pode-se destacar que:

  o sono normalmente é iniciado aproximadamente 5 horas antes da temperatura corporal central
  mínima;

  o despertar ocorre normalmente 3 horas depois da temperatura corporal central mínima;

  a propensão ao sono REM atinge seu pico logo após a temperatura corporal central mínima;

  quando a temperatura corporal central começa a aumentar, o relógio biológico envia um sinal
  cada vez mais forte para as partes do cérebro que promovem o despertar, por vezes chamado
  de sinal de alerta circadiano;

  3 horas depois de acordar, a pressão homeostática do sono está baixa e o sinal de alerta
  circadiano está forte o suficiente para tornar difícil dormir ou ficar sonolento. Isso por
  vezes é chamado de despertador interno; e

  o sinal de alerta circadiano está no seu pico pouco antes do horário usual de ir para a
  cama. Isso dificulta muito conseguir dormir algumas horas antes do habitual. Este momento
  do relógio biológico é conhecido como zona da manutenção da vigília ou zona proibida do
  sono.

  Os horários mais próximos ao valor da temperatura corporal mínima representam o momento
  do relógio biológico em que a pessoa se sente mais sonolenta e está menos apta a desempenhar
  tarefas físicas ou mentais.

  Influência da luz.

  A luz é considerada o principal zeitgeber na organização do relógio biológico. Durante o
  dia, a taxa de disparos elétricos dos neurônios (células cerebrais) do relógio biológico
  é maior em comparação com a noite. A exposição à luz aumenta ainda mais esta taxa.

  Dependendo do momento do ciclo do relógio biológico em que a exposição ocorre, basicamente
  três resultados são possíveis (figura 8):

  Luz pela manhã diminui o ciclo (avanço ou adiantamento de fase);

  Luz no meio do dia não altera o ciclo; e

  Luz ao final do dia aumenta o ciclo (atraso de fase).


  Figura 7. Influência da luz no relógio biológico (fonte: DOC 9966).

  A luz intensa (equivalente à quantidade de luz que se recebe em um dia típico de verão)
  afeta a produção de melatonina (veja definição). Por isso, ao receber luz no final do dia,
  há redução da secreção de melatonina, retardando o sono.

  Em algumas pesquisas de laboratório, as pessoas que foram expostas por algumas horas à luz
  intensa pela manhã se sentiram mais dispostas mais cedo e sonolentas mais cedo, enquanto
  as pessoas expostas à luz pela tarde se sentiram mais alertas durante a noite. A exposição
  à luz artificial, com intuito de alteração do ciclo de trabalhadores em turnos, porém, não
  é inconsequente. Há estudos que demonstram malefícios à saúde de trabalhadores noturnos
  permanentemente expostos à luz intensa.

  A exposição das pessoas à luz natural, contudo, tem sido cada vez mais eventual, senão rara.
  A luz artificial dos estabelecimentos e das residências alterou o modo de vida das pessoas,
  pois a exposição à luz em horários noturnos tende a atrasar o ciclo. A luz intensa causa
  alterações mais significativas do que a luz difusa, sendo que o relógio biológico é particularmente
  sensível à luz azul.

  A capacidade do relógio biológico de se manter “travado” no ciclo noite-dia de 24 horas
  é uma característica fundamental para diversas espécies, como forma de manter a sobrevivência.
  A espécie humana é considerada uma espécie diurna, adaptada para exercer suas atividades
  na fase clara e repousar na fase escura. O desenvolvimento de nosso sistema visual e nossa
  dependência da informação luminosa nos caracterizam como espécie diurna, por isso torna-se
  um desafio manter-se acordado e apto para o trabalho durante horários noturnos, propícios
  ao sono.

  Após o trabalho noturno, é recomendável o uso de óculos escuros no caminho para o local
  de repouso, para diminuir a influência da luz e favorecer o sono. Alimentação leve e banho
  morno também são aconselháveis, de forma a favorecer o sono.

  Cruzamento de fusos.

  Voos transmeridionais, ou seja, que cruzam fusos horários, ocasionam alterações repentinas
  no relógio biológico em função da velocidade em que as aeronaves a jato se deslocam na superfície
  terrestre criando desafios para o corpo se adequar ao ciclo claro-escuro do novo local.
  Devido à sensibilidade à luz e aos estímulos sociais no novo ambiente, o organismo irá se
  adaptar ao novo local após um tempo. Isso irá depender de quantos fusos foram cruzados e
  quanto tempo o indivíduo irá permanecer no novo local.

  A rapidez dos voos a jato leva à dessincronização entre ritmos de diferentes funções fisiológicas
  e os horários locais, podendo afetar o horário de comer, dormir, praticar atividade física,
  fazer a toalete. Esta situação pode gerar desconforto conhecido como jet lag. Durante o
  período de adaptação alguns sintomas podem ocorrer e incluem diarreia, indigestão ou náusea,
  insônia ou sonolência excessiva diurna, fadiga ou mal-estar, dor de cabeça, falta de concentração
  ou irritabilidade. Este estado é amenizado e desaparece quando tempo suficiente é dispendido
  no novo local e a adaptação ocorre.

  Alguns fatores que influenciam o tempo necessário para a adaptação ao novo local são:

  quantidade de fusos. Quanto mais fusos cruzados, maior tempo é necessário para a adaptação.
  Normalmente, os sintomas de jet lag podem ser mais agudos após o cruzamento de 2 fusos ou
  mais;

  sentido da viagem. Para uma mesma quantidade de fusos cruzados, a adaptação é normalmente
  mais rápida em viagens de sentido oeste do que para leste. Isso se deve ao fato de que nas
  viagens para oeste ocorre um atraso de fase, e como o ciclo circadiano é um pouco maior
  do que 24 horas, é mais fácil estendê-lo do que encurtá-lo;

  ressincronização por partição. Por exemplo, após um voo que cruze 6 fusos no sentido leste,
  a adaptação pode ocorrer no sentido oposto, ou seja, em 18 fusos no sentido oeste. Quando
  isso acontece, alguns ritmos se alteram segundo o sentido oeste e outros segundo o sentido
  leste. Para o sentido leste a adaptação pode ser particularmente lenta;

  diferença entre ritmos. Ritmos de diferentes funções do organismo podem se adaptar em tempos
  diferentes, dependendo do quanto são influenciados pelo relógio biológico. Assim, durante
  o período de adaptação, os ritmos de diferentes funções podem estar fora de sintonia entre
  si, bem como fora do ciclo noite-dia;

  exposição ao ambiente local. A adaptação ocorre mais rápido quando o relógio biológico é
  exposto às pistas de tempo locais, o que inclui expor-se à luz ao ar livre, exercitar-se
  e alimentar-se seguindo o horário local;

  sono prévio. Iniciar uma programação com débito (falta) de sono aumenta a duração e a intensidade
  dos sintomas do jet lag;

  é importante notar que alguns indivíduos são mais sensíveis que outros com relação ao cruzamento
  de fusos horários, sendo possível também sentir os efeitos do jet lag com apenas 1 ou 2
  fusos, mesmo que não haja previsão normativa para adaptação nesses casos; e

  por mais que existam limites prescritivos com embasamento em princípios científicos, eles
  podem não ser suficientes para "blindar" as programações dos efeitos da fadiga. Assim, tripulantes
  podem apresentar sintomas de jet lag mesmo dentro do limite de menos de 3 fusos previstos
  no RBAC nº 117.

  A figura 9 auxilia na escolha de adaptar-se ao novo local ou manter-se adaptado ao local
  de origem. Se a quantidade de fusos cruzados em relação à origem onde o tripulante está
  aclimatado for baixa, e a quantidade de noites no novo local também for baixa, a adaptação
  não se faz necessária para a maioria das pessoas. Porém, se a quantidade de fusos cruzados
  for baixa, mas a quantidade de noites no novo local for alta, a adaptação ao novo local
  pode ser benéfica. Neste caso, devem-se favorecer os horários locais (de alimentação, atividades
  sociais, trabalho, lazer e sono). Caso a quantidade de fusos cruzados seja alta, mas a permanência
  no novo local seja rápida, a orientação é não buscar se adaptar ao novo local, tentando
  preservar os horários da origem. Entretanto, se a quantidade de fusos cruzados for alta
  e a permanência for longa, a adaptação ao novo local é recomendada. Neste caso, devem-se
  favorecer os horários locais (de alimentação, atividades sociais, trabalho, lazer e sono).


  Figura 8. Opções sobre adaptação à origem ou ao novo local, conforme a quantidade de noites
  locais no local de destino e quantidade de fusos cruzados (adaptado de JAA, 2010).

  Para favorecer a adaptação ao novo local, recomenda-se:

  ajustar rapidamente os horários de refeição, atividade e sono conforme os horários do novo
  fuso;

  maximizar a exposição à luz durante a primeira parte do dia;

  minimizar a exposição à luz durante a tarde;

  evitar refeições pesadas à noite para não prejudicar o sono com desconfortos;

  seguir as orientações da higiene do sono;

  tentar autoadministrar técnicas de relaxamento para promover o sono;

  se possível, antes de dormir, tomar um banho quente. O resfriamento posterior ao banho quente
  pode simular a redução circadiana da temperatura que normalmente ocorre durante o sono;
  e

  consumir bebidas e alimentos com cafeína durante o dia pode ajudar a manter o alerta durante
  o dia para que o sono seja favorecido durante a noite local.


  Alterações do ciclo vigília-sono.

  O período noturno é o momento de maior propensão ao sono e nele há uma maior dificuldade
  do ser humano em manter-se acordado. Isso se deve, principalmente, à secreção de melatonina,
  que tem como principal marcador a baixa da temperatura corporal central. A sonolência aumenta
  especialmente no período da madrugada (janela de baixa do alerta do ciclo circadiano), momento
  em que a temperatura corporal é a menor ao longo das 24 horas, trazendo desafios àqueles
  que trabalham em turnos. Para os aeronautas esse é um desafio duplo - algumas operações
  envolvem o trabalho em turno combinado com o cruzamento de vários fusos horários.

  O trabalho noturno, por consequência, exige um sono diurno, mas este não apresenta a mesma
  qualidade. Os maiores valores de cortisol pela manhã, associados a menores níveis de melatonina
  e ao aumento da temperatura central, acabam promovendo o estado de vigília ao invés do sono.
  O sono diurno também é impactado do ponto de vista da quantidade, podendo sofrer uma redução
  de 1 a 4 horas quando comparado ao sono habitual (Åkerstedt, et al., 2009).

  Em todas as indústrias que foram estudadas, há evidências de um aumento na taxa de erros
  e acidentes após quatro jornadas noturnas ou turnos noturnos em uma semana. Jornadas na
  madrugada não só exigem o tripulante acordado e trabalhando quando seu corpo está predisposto
  a dormir, mas também significa que eles não dormem durante o período em que seu corpo geralmente
  atingiria o sono mais restaurativo. Atribuições frequentes de jornadas na madrugada a um
  tripulante resultam no aumento da fadiga acumulada e requerem um período de recuperação
  mais longo quando comparado a uma jornada de trabalho atribuída durante o dia.

  A obtenção do sono antes da jornada noturna é a estratégia potencialmente mais segura. O
  tempo em que os trabalhadores noturnos passam dormindo antes da jornada noturna é a variável
  mais importante na redução do sono e sua intensidade, independentemente da idade.

  A diferença de desempenho humano, entretanto, não é restrita à dicotomia diurno/noturno.
  Ao longo do dia também são observadas flutuações do estado de vigília, que podem favorecer
  ou desfavorecer o desempenho físico e mental. A necessidade de acordar muito cedo para se
  apresentar ao trabalho (início cedo ou early start) tende a predispor o risco de fadiga,
  pois pode gerar uma redução de 2 a 4 horas no tempo de sono do indivíduo quando comparado
  ao seu sono habitual.

  Princípio científico 4. A influência da carga de trabalho

  Trabalhadores relatam frequentemente a carga de trabalho como um componente importante da
  fadiga.

  A mensuração da carga de trabalho, porém, não é algo estabelecido e muito menos óbvio. A
  complexidade do conceito é tamanha que não há consenso a seu respeito. O que normalmente
  se reconhece são três aspectos principais:

  natureza e quantidade de trabalho (tempo na tarefa, dificuldade e complexidade, e intensidade);

  restrições de tempo (derivadas da própria tarefa, de fatores externos ou do próprio indivíduo);
  e

  fatores relativos à capacidade de desempenho do indivíduo (experiência, nível de habilidade,
  histórico de sono e fase do relógio biológico no momento do trabalho).

  Desta forma, cada operação terá sua própria carga de trabalho, que irá interagir com as
  condições dos tripulantes que a realizarão.

  Em relação à quantidade de trabalho e o desempenho, parece haver consenso de que:

  níveis intermediários de carga de trabalho parecem contribuir menos para a degradação do
  desempenho;

  baixa carga de trabalho pode levar ao tédio e à monotonia, criando condições fisiológicas
  propícias ao sono; ou levar à busca de tarefas para manter-se ocupado, o que pode gerar
  sobrecarga; e

  alta carga de trabalho pode exceder a capacidade de um indivíduo cansado, prejudicando seu
  desempenho. A alta carga também pode afetar o sono subsequente devido ao tempo necessário
  para relaxar (desacelerar).

  A dificuldade certamente estará, contudo, em avaliar o que seria uma carga de trabalho baixa,
  intermediária ou alta. Normalmente, a avaliação da carga é baseada em erros, lapsos, esquecimentos,
  ou seja, resultados comportamentais não esperados ou mesmo inadequados na realização da
  tarefa. Isso inclui observação de aspectos físicos e cognitivos. A parte cognitiva, porém,
  é muito mais difícil de “medir”, a despeito das medidas objetivas existentes. O que se recomenda,
  portanto, é perguntar aos próprios tripulantes que tenham tido a experiência sobre as programações
  cuja carga de trabalho se deseja avaliar.

  A carga de trabalho passa a ser um problema quando ela excede a capacidade de realizar tarefas
  em tempo hábil do indivíduo. Essa capacidade é seriamente afetada por fadiga. Situações
  de acúmulo de tarefas em curto espaço de tempo como: panes durante um cenário de alto tráfego
  aéreo e com meteorologia adversa.

  O tempo na tarefa parece ser uma variável relevante e relativamente mais simples de se avaliar.
  Estudos mostram que após 8 horas de trabalho ininterrupto, as chances de erro e de acidentes
  aumentam. Fornecer breves interrupções durante a jornada pode atenuar este efeito.

  É possível que uma tripulação que realize muitas etapas de voo em uma única jornada de trabalho
  declare mais fadiga do que uma equipe que tenha realizado uma única etapa de voo com a mesma
  duração. No entanto, o tempo de solo (espera entre voos) também contribui para a fadiga,
  especialmente se houver troca de aeronaves.


  IMPLICAÇÕES OPERACIONAIS 7

  PAUSAS DURANTE UM PERÍODO DE JORNADA


  · Para trabalhos de escritório, as pausas durante um período de jornada são uma forma importante
  de reduzir o declínio no desempenho com o aumento do tempo na tarefa devido aos efeitos
  da alta carga de trabalho. Essas pausas diferem dos períodos de repouso/folga entre jornadas,
  que são projetados para permitir o sono e outras recuperações, bem como a preparação para
  o trabalho futuro.

  · O tempo de jornada antes de ocorrer uma pausa e a duração da pausa dependem do tipo de
  tarefa que está sendo executada. Por exemplo, o desempenho em tarefas que exigem atenção
  sustentada, como o monitoramento de um evento pouco frequente, melhora com intervalos curtos
  e frequentes. Como em qualquer operação contínua, onde uma tarefa executada por uma pessoa
  é transferida para outra, é fundamental considerar o risco da própria transferência. Em
  alguns casos, transferências menos frequentes (talvez com níveis mais altos de supervisão)
  podem estar associadas a uma menor exposição geral ao risco.

  Quadro 7. Implicações Operacionais 7: Pausas durante um período de jornada.


  Causas e consequências da fadiga.

  Como desenvolvido até aqui, as causas da fadiga estão associadas à perda ou restrição do
  sono, ao momento do dia, ao tempo acordado e à carga de trabalho, fatores que podem ser
  mais ou menos impactados pela organização do trabalho (principalmente pelas escalas de voo)
  e por fatores individuais (como o estado de saúde e características pessoais).

  Os fatores associados às escalas de trabalho normalmente refletem o horário em que a jornada
  ocorre (horário de início e de término), quantidade de horas de repouso antes e depois dos
  turnos de trabalho, quantidade e disposição das folgas ao longo da escala mensal, rotação
  da escala (sendo mais desafiadora se os horários de início dos turnos forem irregulares,
  e em sentido anti-horário), e se há ou não cruzamento de fusos horários.

