  Níveis de Gerenciamento de Fadiga do RBAC nº 117

  Geral

  O artigo 19 da Lei nº 13.475/17 permite que as limitações operacionais nela estabelecidas
  sejam alteradas pela ANAC, desde que respeitados os preceitos de um Sistema de Gerenciamento
  de Risco de Fadiga Humana. Tais preceitos constam do DOC 9966, da OACI, e estão constantemente
  evoluindo a partir de resultados de pesquisas científicas e da experiência da indústria.

  Adicionalmente, o artigo 78 dessa mesma Lei informa que cabe à ANAC expedir as normas necessárias
  para a implantação de um Sistema de Gerenciamento de Risco de Fadiga Humana.

  Com o intuito de atender aos referidos artigos, foi criado o RBAC nº 117, intitulado Requisitos
  para Gerenciamento de Risco de Fadiga Humana, de forma a complementar a Lei com o que existe
  de mais atual no que se refere ao gerenciamento prescritivo de fadiga humana nas operações
  aéreas, bem como possibilitar aos operadores desenvolverem novas propostas baseadas em desempenho.

  O RBAC nº 117 foi desenvolvido em três níveis, do puramente prescritivo (NB - Nível Básico)
  até o customizado às necessidades do operador (SGRF - Sistema de Gerenciamento de Risco
  de Fadiga), contando com um nível intermediário em que alguma flexibilidade é possível quando
  determinadas exigências são atendidas (GRF - Gerenciamento de Risco de Fadiga). O operador
  deve optar por qual nível seguir, seja para todas as operações ou para parte delas.

  Um resumo dos três níveis é abaixo mostrado:

  NB - Nível Básico: define limitações prescritivas de tempo de voo e tempo de serviço sem
  a necessidade de autorizações e/ou aprovações especificadas da ANAC. Operadores regidos
  pelo NB devem cumprir, no que for aplicável, as subpartes A (exceto 117.5) e B, bem como
  o Apêndice A do RBAC nº 117. É importante observar que as limitações do Apêndice A são aquelas
  constantes da Lei nº 13.475/17, acrescidas das definições e procedimentos solicitados pela
  referida Lei;

  GRF - Gerenciamento de Risco de Fadiga: permite maior flexibilidade com limitações de tempo
  de operação e de voo menos restritivas, mas exige que os operadores tenham implantado processos
  de gerenciamento de riscos, processos de monitoramento contínuo e um programa de treinamento
  para os tripulantes. A operação segundo um GRF conforme a seção 117.61 requer autorização
  especificada emitida pela ANAC; enquanto a operação segundo um GRF conforme a seção 117.65
  requer comunicação prévia à ANAC. Operadores regidos por um GRF devem cumprir as subpartes
  A e B, acrescidas das seções 117.61 ou 117.65 da subparte C e dos Apêndices B, C, D ou E
  do RBAC nº 117, e as IS nº 117-003, 117-006 ou 117-007, conforme aplicável;

  SGRF - Sistema de Gerenciamento de Risco de Fadiga: é um sistema orientado por dados e encarregado
  de monitorar e gerenciar continuamente os riscos de segurança relacionados à fadiga, com
  base em princípios científicos e conhecimentos, bem como experiência operacional, que visa
  garantir que o pessoal relevante esteja trabalhando em níveis adequados de alerta. A utilização
  de um SGRF para operações com limites específicos deve ser previamente aprovada pela ANAC.
  Operadores regidos por um SGRF devem cumprir as subpartes A e B, bem como a seção 117.63
  da Subparte C do RBAC nº 117, conforme orientado pelas IS nº 117-004 ou 117-005.

  Para os operadores que escolherem desenvolver e implementar um GRF, deve-se consultar as
  IS nº 117-003, 117-006 ou 117-007, a depender do tipo de operação que o operador executa.
  Para aqueles que optarem por um SGRF, deve-se consultar as orientações contidas na IS nº
  117-004 ou 117-005, conforme tenham (ou não tenham) um GRF, respectivamente.

  Qual apêndice do RBAC nº 117 é mais apropriado à minha operação?

  Os apêndices do RBAC nº 117 disponíveis para um operador dependerão do tipo de operações
  que ele realiza. Pode haver mais de um apêndice disponível para o operador, cabendo a este
  determinar qual é o mais adequado.

  Apêndice A do RBAC nº 117 - NB

  O Apêndice A está disponível para todos os operadores que realizem qualquer tipo de operação
  que não requeira a extrapolação dos limites contidos na Lei nº 13.475/17.

  Este Apêndice é o mais apropriado para operações que não excedam as limitações da Lei nº
  13.475/17, incluindo:

  I - operações privadas sob RBAC nº 91, quando realizando operações sem fins lucrativos com
  pilotos contratados, a serviço do operador, incluindo as operações da Subparte K;

  II - operações segundo os RBAC nº 121 ou 135, desde que tais operações não se enquadrem
  nos itens 17.2.3 ou 17.2.4 abaixo;

  III - Operações segundo o RBAC nº 133 (operações de helicópteros com carga externa);

  IV - Operações segundo o RBAC nº 137 (operações aeroagrícolas e de combate a incêndio);

  V - Operações segundo o RBAC nº 141 (escolas de aviação);

  VI - Operações segundo o RBAC nº 142 (centros de treinamento);

  VII - outras operações de serviço aéreo especializado (SAE);

  VII - treinamento em voo de tripulantes (mesmo aqueles que são realizados por operadores
  dos RBAC nº 121 ou 135);

  VIII - exame em voo de tripulantes visando a emissão de uma licença ou emissão ou revalidação
  de uma habilitação (mesmo aqueles que são realizados por operadores dos RBAC nº 121 ou 135);

  IX - operações de translado, voos de experiência, voos de manutenção etc.

  Apêndice B do RBAC nº 117 - GRF

  O Apêndice B está disponível para operadores de serviço de transporte aéreo (RBAC nº 121
  ou RBAC nº 135) que realizem operações comerciais complexas ou não complexas com aeronaves
  que requeiram dois ou mais pilotos, incluindo .

  Operação complexa significa uma operação que envolva uma ou mais das seguintes condições:

  I - uma tripulação composta ou de revezamento;

  II - uma jornada que envolva uma diferença de três fusos horários ou mais; ou

  III - uma jornada que seja iniciada quando o tripulante de uma tripulação simples, composta
  ou de revezamento estiver:

  A. em um estado desconhecido de aclimatação; ou

  B. não aclimatado ao local onde a jornada se inicia.

  Este Apêndice é o mais apropriado para as operações segundo os RBAC nº 121 ou 135 que desejem
  exceder as limitações do Apêndice A do RBAC nº 117 e operem no Brasil ou no exterior com
  tripulações simples, compostas ou de revezamento.

  É importante observar o seguinte:

  I - Operações de treinamento e de exame em voo, de translado ou com aeronaves que requeiram,
  por certificação, apenas um piloto, devem ser feitas segundo o Apêndice A.

  II - Operações com helicópteros que requerem dois ou mais pilotos podem ser feitas segundo
  o Apêndices B, mas isto não é aconselhável. Recomenda-se realizá-las de acordo com as regras
  do Apêndice A.

  III - As operações no item 17.2.3.a acima, caso assim deseje o operador, podem ser realizadas
  inteiramente segundo o Apêndice A. No entanto, caso o operador opte por realizá-las segundo
  o Apêndice B, tais operações devem ser inteiramente realizadas segundo este Apêndice.

  IV - Não será permitido que as operações comerciais de um mesmo operador possam, simultaneamente,
  ser feitas por dois apêndices diferentes.

  V - Caso o operador realize exclusivamente operações não-complexas, ele pode optar por cumprir
  o Apêndice C.

  Apêndice C do RBAC nº 117 - GRF

  O Apêndice C está disponível para operadores de serviço de transporte aéreo (RBAC nº 121
  ou RBAC nº 135) que realizem operações comerciais não complexas com aeronaves que requeiram
  dois pilotos.

  O Apêndice C é mais adequado que o Apêndice B para a operações domésticas ou internacionais
  com dois pilotos, mas que não cruzem três fusos ou mais.

  O Apêndice C não se aplica às operações com tripulação aumentada ou operações que cruzem
  3 fusos ou mais na mesma jornada ou operações cujos tripulantes estejam não-aclimatados
  ou em estado desconhecido de aclimatação.

  É importante observar o seguinte:

  I - Operações de treinamento e de exame em voo, de translado ou com aeronaves que requeiram,
  por certificação, apenas um piloto, devem ser feitas segundo o Apêndice A.

  II - Operações com helicópteros que requerem dois ou mais pilotos podem ser feitas segundo
  o Apêndices C, mas isto não é aconselhável. Recomenda-se realizá-las de acordo com as regras
  do Apêndice A.

  III - As operações no item 17.2.3.a acima, caso assim deseje o operador, podem ser realizadas
  inteiramente segundo o Apêndice A. No entanto, caso o operador opte por realizá-las segundo
  o Apêndice C, tais operações devem ser inteiramente realizadas segundo este Apêndice.

  IV - Não será permitido que as operações comerciais de um mesmo operador possam, simultaneamente,
  ser feitas por dois apêndices diferentes.

  V - Caso o operador realize operações complexas e não-complexas simultaneamente, ele pode
  optar por cumprir o Apêndice B.

  Apêndice D do RBAC nº 117 - GRF

  O Apêndice D está disponível para operações aeromédicas, bem como treinamentos e exames
  relacionados a este tipo de operação.

  Note que outros tipos de operações do operador (tais como operações de transporte de passageiros
  ou de carga, mesmo sendo feitas pelas mesmas aeronaves) devem ser realizadas segundo as
  regras dos Apêndices A, B ou C do RBAC nº 117.

  Empresas que realizem simultaneamente operações aeromédicas e não aeromédicas (passageiros
  e/ou carga), devem cumprir o Apêndice A para estas duas últimas.

  Exemplo: um táxi aéreo realiza operações de transporte de passageiro, de carga, aeromédicas
  com aviões e helicópteros.

  I - As operações de transporte de passageiro e de carga devem ser feitas de acordo com as
  regras do Apêndice A.

  II - As operações aeromédicas com aviões e helicópteros podem ser feitas de acordo com as
  regras dos Apêndices A ou D, a escolha do operador. No entanto, uma vez que o operador escolha
  o Apêndice D para suas operações aeromédicas, estas devem sempre ser feitas por aquele Apêndice.
  O inverso também é verdadeiro: se o operador escolher o Apêndice A para suas operações aeromédicas,
  estas devem sempre ser feitas por aquele Apêndice. Não é permitido que as operações aeromédicas
  de um mesmo operador possam, simultaneamente, ser feitas por dois apêndices diferentes.

  Apêndice E do RBAC nº 117 - GRF

  a) O Apêndice E está disponível para Operações de aviação geral operando exclusivamente
  segundo as regras do RBAC nº 91, quando realizando operações sem fins lucrativos com pilotos
  contratados, a serviço do operador em aviões a jato com dois ou mais pilotos.

  b) Operadores que realizem simultaneamente as operações descritas no item anterior e outros
  tipos de operação, devem cumprir o Apêndice A para estas últimas.

  c) Exemplo: um operador privado possui um Falcon 2000, um C510 e um S76. Nessa situação:

  I - O S76 deve ser operador segundo as regras do Apêndice A, uma vez que não é um avião;

  II - O C510 operado exclusivamente por um piloto com habilitação "single pilot" (sem um
  segundo em comando) deve ser operado segundo as regras do Apêndice A;

  III - O C510 operado por dois pilotos, independentemente de terem suas habilitações "single
  pilot" ou "dual pilot", pode ser operado segundo as regras dos Apêndices A ou E a escolha
  do operador. No entanto, uma vez que o operador escolha o Apêndice E para suas operações
  com o C510, estas devem ser feitas por aquele Apêndice. Não será permitido que as operações
  com o C510 do operador possam, simultaneamente, ser feitas por dois apêndices diferentes;
  e

  IV - O Falcon 2000 pode ser operado segundo os Apêndices A ou E, a escolha do operador.
  No entanto, uma vez que o operador escolha o Apêndice E para suas operações com o Falcon
  2000, estas devem ser feitas por aquele Apêndice. Não será permitido que as operações com
  o Falcon 2000 do operador possam, simultaneamente, ser feitas por dois apêndices diferentes.

  d) Operações segundo a Subparte K do RBAC nº 91 não podem ser realizadas segundo o Apêndice
  E.

  Exemplos

  Exemplos (não exaustivo; apenas ilustram as regras do RBAC nº 117; cada operador deve verificar
  quais são as regras a ele aplicáveis e, deste modo, verificar sob qual dos apêndices do
  RBAC nº 117 ele pode operar):

  a) Operações privadas

  I - uma pessoa física possui um R22 e o opera ela mesma para deslocar-se entre suas propriedades
  (isto é, ela não recorre a pilotos contratados para operar o R22). Este tipo de operação
  não é coberto pelo RBAC nº 117;

  II - um operador privado possui um R22, o qual é utilizado apenas em pequenos voos ao redor
  da sua base principal e não extrapola as limitações contidas na Lei nº 13.475/17. A aeronave
  é operada por um piloto contratado pelo operador. Nesta situação, suas operações devem ser
  realizadas de acordo com o Apêndice A do RBAC nº 117;

  III - um operador privado possui um Sêneca, que é utilizado em voos dentro do Brasil e não
  extrapola as limitações contidas na Lei nº 13.475/17. A aeronave é operada por um piloto
  contratado pelo operador. Nesta situação, suas operações devem ser realizadas de acordo
  com o Apêndice A do RBAC nº 117;

  IV - um operador privado possui um C550. que é utilizado em operações dentro do Brasil,
  podendo ainda realizar voos para a Argentina, Paraguai ou Uruguai, respeitando as limitações
  contidas na Lei nº 13.475/17. A aeronave é operada por dois pilotos contratados pelo operador,
  apesar de ser certificada para operação com apenas um piloto. Nesta situação, suas operações
  devem ser realizadas de acordo com o Apêndice A do RBAC nº 117;

  V - um operador privado possui um S76, que é utilizado para operações dentro do Estado de
  São Paulo, respeitando as limitações contidas na Lei nº 13.475/17. O helicóptero é operador
  por dois pilotos contratados pelo operador. Nesta situação, suas operações devem ser realizadas
  de acordo com o Apêndice A do RBAC nº 117;

  VI - um operador privado possui um Falcon 900, que é utilizado tanto em viagens nacionais
  quanto internacionais, entre o Brasil e a costa Leste dos Estados Unidos (isto é, sem cruzar
  três fusos ou mais), respeitando as limitações contidas na Lei nº 13.475/17. A aeronave
  é operada por pilotos contratados pelo operador. Nesta situação, é mais conveniente que
  as suas operações sejam integralmente realizadas de acordo com o Apêndice A do RBAC nº 117;

  VII - um operador privado possui um Falcon 2000, que é utilizado tanto em viagens nacionais
  quanto internacionais, entre o Brasil e a costa Leste dos Estados Unidos (isto é, sem cruzar
  três fusos ou mais). Nesta situação o operador pode tanto operar segundo o Apêndice A do
  RBAC nº 117 (caso não tenha necessidade de extrapolar as limitações contidas na Lei nº 13.475/17)
  ou pelo Apêndice E do RBAC nº 117 (caso tenha a necessidade de extrapolar alguma das limitações
  contidas na Lei 13.475/17). No entanto, o operador deve ter em mente que suas operações
  ocorrerão exclusivamente sob o Apêndice A ou sob o Apêndice E. Não será permitido que as
  operações com o Falcon 2000 possam, simultaneamente, ser feitas pelos dois Apêndices;

  VIII - um operador privado possui um C750, que é utilizado tanto em viagens nacionais quanto
  internacionais entre o Brasil e a Europa (isto é, cruzando três fusos ou mais), respeitando
  as limitações contidas na Lei nº 13.475/17. A aeronave é operada por pilotos contratados
  pelo operador. Nesta situação, é mais conveniente que as suas operações sejam integralmente
  realizadas de acordo com o Apêndice A do RBAC nº 117;

  IX - um operador privado possui um G650, que é utilizado tanto em viagens nacionais quanto
  internacionais entre o Brasil e a Europa (isto é, cruzando três fusos ou mais). A aeronave
  é operada por pilotos contratados pelo operador. Nesta situação o operador pode tanto operar
  segundo o Apêndice A do RBAC nº 117 (caso não tenha necessidade de extrapolar as limitações
  contidas na Lei nº 13.475/17) ou pelo Apêndice E do RBAC nº 117 (caso tenha a necessidade
  de extrapolar alguma das limitações contidas na Lei 13.475/17). No entanto, o operador deve
  ter em mente que suas operações ocorrerão exclusivamente sob o Apêndice A ou sob o Apêndice
  E. Não será permitido que as operações com o G650 possam, simultaneamente, ser feitas pelos
  dois Apêndices.

  b) Operações de táxi aéreo com aeronaves operadas por apenas um

  I - um operador de táxi aéreo possui cinco aeronaves C208, as quais são utilizadas em voos
  cargueiros dentro do Brasil e operadas por apenas um piloto, sem extrapolar as limitações
  contidas na Lei nº 13.475/17. Nesta situação, suas operações devem ser integralmente realizadas
  de acordo com o Apêndice A do RBAC nº 117.

  II - um operador de táxi aéreo possui aeronaves King Air e Phenom 300, as quais são utilizadas
  para voo pelo Brasil e pela América Latina e operadas por apenas um piloto. No entanto,
  todas as operações respeitam as limitações contidas na Lei nº 13.475/17. Nesta situação,
  suas operações devem ser integralmente realizadas de acordo com o Apêndice A do RBAC nº
  117;

  c) Operações segundo os RBAC nº 121 ou 135, operadas por dois ou mais pilotos

  I - um operador de táxi aéreo possui aeronaves King Air, Phenom 300 e Falcon 7x, as quais
  são utilizadas para voo pelo Brasil e pela América Latina, sempre sendo operadas por dois
  pilotos. As suas operações, no entanto, extrapolam as limitações contidas na Lei nº 13.475/17.
  Nesta situação, é mais conveniente que as suas operações sejam integralmente realizadas
  de acordo com o Apêndice C do RBAC nº 117, uma vez que ocorrem exclusivamente no Brasil
  e na América Latina, não sendo consideradas operações complexas;

  II - um operador de táxi aéreo possui um grande acervo de aeronaves, incluindo King Air,
  Phenom 300 e Falcon 7x, as quais são utilizadas para voo pelo Brasil, pela América Latina
  e Europa, sempre operadas por dois ou mais pilotos. As suas operações, no entanto, extrapolam
  as limitações contidas na Lei nº 13.475/17. Nesta situação, é mais conveniente que as suas
  operações sejam integralmente realizadas de acordo com o Apêndice B do RBAC nº 117, uma
  vez que as operações para a Europa são consideradas complexas;

  III - um operador regular nacional ou internacional possui aeronaves ATR-42, B737 e A320,
  as quais são utilizadas para voo pelo Brasil, pela América Latina ou costa leste dos EUA,
  respeitando todas as limitações contidas na Lei nº 13.475/17. Nesta situação, é mais conveniente
  que as suas operações sejam integralmente realizadas de acordo com o Apêndice A do RBAC
  nº 117;

  IV - um operador regular possui aeronaves ATR-42, B737 e A320, as quais são utilizadas para
  voo pelo Brasil, pela América Latina ou costa leste dos EUA (todas com tripulações simples).
  As suas operações, no entanto, extrapolam as limitações contidas na Lei nº 13.475/17. Nesta
  situação, é mais conveniente que as suas operações sejam integralmente realizadas de acordo
  com o Apêndice C do RBAC nº 117, uma vez que ocorrem exclusivamente no Brasil e na América
  Latina, não sendo consideradas operações complexas;

  V - um operador regular possui aeronaves ATR-42, B737, A320 e B777 que, conforme suas possibilidades
  operacionais, são utilizadas para voo pelo Brasil, pela América Latina, costa leste dos
  EUA e Europa. As suas operações, no entanto, extrapolam as limitações contidas na Lei nº
  13.475/17. Nesta situação, é mais conveniente que as suas operações sejam integralmente
  realizadas de acordo com o Apêndice B do RBAC nº 117, uma vez que as operações para a Europa
  são consideradas complexas;

  VI - um operador não-regular possui aeronaves B-767 de carga, as quais são utilizadas para
  voo pelo Brasil, pela América Latina ou costa leste dos EUA, respeitando todas as limitações
  contidas na Lei nº 13.475/17. Nesta situação, é mais conveniente que as suas operações sejam
  integralmente realizadas de acordo com o Apêndice A do RBAC nº 117;

  VII - um operador não-regular possui aeronaves B-767 de carga, as quais são utilizadas para
  voo pelo Brasil, pela América Latina ou costa leste dos EUA (todas com tripulações simples).
  As suas operações, no entanto, extrapolam algumas das limitações contidas na Lei nº 13.475/17.
  Nesta situação, é mais conveniente que as suas operações sejam integralmente realizadas
  de acordo com o Apêndice C do RBAC nº 117, uma vez que ocorrem exclusivamente no Brasil
  e na América Latina, não sendo consideradas operações complexas;

  VIII - um operador não-regular possui aeronaves B-767 de carga, as quais são utilizadas
  para voo pelo Brasil, pela América Latina, costa leste dos EUA e Europa. As suas operações,
  no entanto, extrapolam as limitações contidas na Lei nº 13.475/17. Nesta situação, é mais
  conveniente que as suas operações sejam integralmente realizadas de acordo com o Apêndice
  B do RBAC nº 117, uma vez que as operações para a Europa são consideradas complexas.


