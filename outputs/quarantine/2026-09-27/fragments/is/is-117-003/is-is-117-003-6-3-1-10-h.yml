  APÊNDICE D. FERRAMENTA DE AUXÍLIO PARA AUTOAVALIAÇÃO DA FADIGA

  (FAPA) 1

  D.1. Geral

  D.1.1. Este Apêndice contém um exemplo de formulário para avaliar o risco de fadiga

  envolvido na determinação da aptidão do tripulante para o trabalho. É chamado de

  Ferramenta de Auxílio para Autoavaliação (FAPA).

  D.1.2. A FAPA envolve responder a três perguntas relacionadas à percepção de alerta

  (Q1), sono prévio (Q2) e horário da jornada (Q3). Para a pergunta sobre o nível de

  risco genérico associado à jornada (Q4), o tripulante deve recorrer à seção do

  manual de SGSO que possui informações sobre o risco das operações da empresa.

  D.1.3. As respostas são codificadas e combinadas para permitir que o tripulante determine

  o que necessita considerar ao determinar se deve assumir a jornada como foi

  proposta. Se houver a suspeita de risco de fadiga, o tripulante precisa avalizar seu

  estado de alerta, discutir com um supervisor se o nível de alerta é adequado para a

  jornada e considerar como o risco pode ser efetivamente mitigado.

  D.2. Instruções para usar a FAPA antes de uma jornada.

  D.2.1. Questão 1: Quão alerta você acha que está?

  a. A Questão 1 envolve o tripulante avaliar seu estado de alerta atual (idealmente

  próximo ao horário de apresentação) usando uma das sete opções na escala de

  alerta. O resultado cai em uma das três faixas de risco baixo, moderado ou elevado.

  b. Se for de risco elevado, o tripulante deve considerar discutir isso com os demais

  membros da tripulação, seu operador, o despacho operacional (operadores do

  de controle de risco previamente definidas (ou seja, cochilos, períodos prolongados

  de descanso ou rotação de tarefas). Se uma decisão for tomada para continuar com

  a jornada, prossiga para a Questão 2.

  D.2.2. Questão 2: Você teve um sono adequado?

  a. A Questão 2 envolve o tripulante acumular pontos com base em seu sono nas 24 e

  48 horas anteriores à jornada, e na quantidade de horas em que estará acordado ao

  final da jornada, descontado de qualquer tempo alocado para repouso ou descanso

  a bordo. Os pontos são somados para produzir uma pontuação final, que é

  categorizada em termos de risco baixo, moderado ou elevado.

  b. Se o resultado for de risco elevado, o tripulante deve considerar discutir isso com

  os demais membros da tripulação, seu operador, o despacho operacional

  (operadores do RBAC nº 121) e pode precisar lidar com o risco por meio da

  aplicação de medidas de controle de risco previamente definidas (ou seja, cochilos,

  períodos de descanso prolongados ou rotação de tarefas). Se uma decisão for

