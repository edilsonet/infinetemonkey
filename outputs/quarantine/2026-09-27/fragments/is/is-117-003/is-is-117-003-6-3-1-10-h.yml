  Pontos: 12 8 4 0

  Entre com o

  número de pontos

  no campo ao lado.

  x = ___

  b) No início da jornada, por quanto tempo dormiu nas 48 horas anteriores? (este é o

  valor de ‘y’)

  y = ______ horas -------> y: ≤ 8h 9h 10h 11h 12h 13+h

  Pontos: 10 8 6 4 2 0

  Entre com o

  número de pontos

  no campo ao lado.

  y = ___

  c) Ao fim da jornada prevista, por quantas horas você terá permanecido acordado,

  descontado qualquer tempo alocado para repouso em acomodação adequada ou

  repouso a bordo quando compondo tripulação aumentada? (este é o valor de ‘z’)

  z = ________ horas

  d) Se y < z, subtraia a quantidade de horas obtidas nas últimas 48 horas (y) das horas em
  estado de vigília'
