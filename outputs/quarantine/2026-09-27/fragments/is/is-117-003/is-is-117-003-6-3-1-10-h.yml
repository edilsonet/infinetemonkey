  C.5.2. Análise das Jornadas do Exemplo 4.

  a. Determinação da aclimatação.

  i. O tripulante inicia uma jornada de 12 horas aclimatado à Guarulhos (local

  original), terminando-a em Lisboa (três fusos a leste de Guarulhos), onde um

  repouso de 26 horas começa. No início do repouso o tripulante permaneceData de emissão:
  31 de janeiro de 2020 IS nº 117-003

  Revisão B

  aclimatado à Guarulhos, pois, embora a diferença entre Guarulhos (local

  original) e Lisboa (novo local) seja de 3 fusos, o tripulante está a menos de

  36 horas do início da jornada em Guarulhos [vide Parágrafo 117.5(c)].

  ii. No início da próxima jornada em Lisboa, já se passaram 38 horas (12 + 26),

  ou seja, mais de 36 horas desde o início da jornada em Guarulhos. Deste

  modo, o tripulante passa a estar em um estado desconhecido de aclimatação

  [vide Parágrafo 117.5(d)]. A duração da jornada é de 7 horas e termina em

  Moscou (seis fusos a leste de Guarulhos), onde um repouso de 25 horas se

  inicia. Como o tripulante não usufruiu de um período de adaptação em Lisboa,

  ele permanece em um estado desconhecido de aclimatação no início do

  repouso [vide Parágrafo 117.5(e)].

  iii. No início da próxima jornada em Moscou, como o tripulante não passou por

  um período de adaptação nessa cidade, ele continua em um estado

  desconhecido de aclimatação no início da jornada [vide Parágrafo 117.5(e)].

  A duração da jornada é de 5 horas e termina em Milão (quatro fusos a leste

  de Guarulhos). Neste ponto, o operador é obrigado a adaptar o tripulante, uma

  vez que este já realizou duas jornadas em estado desconhecido de aclimatação

  [vide Parágrafo 117.B(e)(3)].

