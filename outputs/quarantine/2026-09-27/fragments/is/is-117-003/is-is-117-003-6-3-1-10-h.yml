  ii. A duração mínima do período de adaptação em Milão será dada de acordo

  com o previsto no parágrafo 117.5(f), como se segue:

  A. maior diferença de fusos na viagem: 6 (entre Guarulhos e Moscou);

  B. sentido da jornada: leste (de Guarulhos para Moscou);

  C. período de adaptação segundo a Tabela 1 do RBAC nº 117: 60 horas.

  iii. Desta forma, o tripulante deve usufruir de um período mínimo de 60 horas

  livre de qualquer serviço em Milão, ao final do qual ficará aclimatado a esta

  cidade.

  C.5.3. Notas sobre o Exemplo 4.

  a. Nas duas últimas jornadas, o tripulante está em um estado desconhecido de

  aclimatação. Deste modo, deve-se reduzir a jornada máxima das tabelas B.2 e B.3

  em uma hora, conforme prescrito no parágrafo 117.B(e)(1). Adicionalmente, não é

  possível continuar a viagem após Milão, uma vez que já foi atingido o limite de

  duas jornadas em estado desconhecido de aclimatação [vide 117.B(e)(3)].

  b. Na segunda jornada o tripulante está em um estado desconhecido de aclimatação

  no início do repouso no destino (Moscou). Deste modo, o seu repouso mínimo deve

  ser aumentado, como mostrado no exemplo.

  c. A adaptação é realizada na última etapa considerando a maior diferença de fusos na

  viagem [117.5(f)(2)] e o sentido em que ocorre [117.5(f)(4)].

  d. Todas as consultas às tabelas B.2 e B.3 são feitas utilizando-se a hora local de

  Guarulhos (coluna 1 das duas tabelas), uma vez que:

  i. na primeira jornada, o tripulante está aclimatado ao fuso horário de

  Guarulhos; e

  ii. nas duas últimas jornadas, Guarulhos é o último local onde o tripulante foi

  aclimatado.

  e. Após o período de adaptação em Milão, as demais jornadas terão suas durações

  máximas utilizando-se a hora local de Milão (coluna 1 das tabelas B.2 e B.3), uma

  vez que o tripulante foi por último aclimatado ao fuso horário desta cidade.Data de emissão:
