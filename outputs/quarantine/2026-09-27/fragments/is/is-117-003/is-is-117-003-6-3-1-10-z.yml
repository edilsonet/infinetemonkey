  APÊNDICE E. INFORMAÇÕES E DADOS OPERACIONAIS (DO)

  E.1. O operador aéreo pode tomar por base os dados listados abaixo para realizar coleta
  a

  intervalos periódicos, estabelecidos pelo seu GAGEF.

  E.2. Informações e dados que devem ser coletados (DO = Dado Operacional).

  E.2.1. Relatos da tripulação.

  a. (DO.1.1) Reclamações de fadiga de tripulações;

  b. (DO.1.2) Número de reportes de fadiga de tripulantes.

  E.2.2. O operador aéreo e seus números.

  a. (DO.2.1) Número de operações realizadas pelo operador utilizando tripulações

  simples, compostas e de revezamento.

  b. (DO.2.2) Tipos de acomodação a bordo e respectivas matrículas de aeronaves em

  operação (informação inicial fornecida no primeiro reporte do GAGEF e sempre

  que houver mudança).

  E.2.3. Escala de voos.

  a. (DO.3.1) Percentual de uso do tripulante em reserva na malha mensal, relativo a

  cada tipo de tripulante no total (CMTE, COPIL, CMS).

  b. (DO.3.2) Percentual de uso do tripulante em sobreaviso na malha mensal, relativo

  a cada tipo de tripulante no total (CMTE, COPIL, CMS).

  E.2.4. Dias de folga.

  a. (DO.4.1) Número médio de folgas de 24 horas (monofolga) na escala mensal por

  tipo de tripulação.

  b. (DO.4.2) Número de faltas (média de vezes e duração média) por tipo de tripulação.

  E.2.5. Jornadas.

  a. (DO.5.1) Número de ocorrências de escala durante a janela de baixa do alerta do

  ciclo circadiano em relação à tripulação total de uma dada operação (jornadas em

  início e em final de madrugada, jornadas noturnas programadas e realizadas).

  b. (DO.5.2) Número médio de dias de folga entre jornadas.

  c. (DO.5.3) Número médio de etapas por dia (programadas x realizadas).

  d. (DO.5.4) Número médio de dias de jornadas consecutivas.

  e. (DO.5.5) Cruzamento de 3(três) ou mais fusos horários: percentual desta operação

  na malha aérea por período definido e percentual da tripulação total.

  f. (DO.5.6) Duração média da conexão em outra base por período definido.Data de emissão:
  31 de janeiro de 2020 IS nº 117-003

  Revisão B

  g. (DO.5.7) Média de tempo dispendido entre o aeroporto/hotel/aeroporto.

  E.2.6. Planos de contingência.

  a. (DO.6.1) Número médio e percentual de acionamentos de reserva sobre operações

  diárias previstas.

  b. (DO.6.2) Número médio e percentual de acionamentos de sobreaviso sobre

  operações diárias previstas.

  c. (DO.6.3) Tempo médio entre um acionamento de sobreaviso e a respectiva

  apresentação para o voo.

  E.2.7. Escala planejada versus escala realizada.

  a. (DO.7.1) Percentual de discrepância entre escalas planejadas versus realizadas por

  dia.

  E.2.8. Base contratual.

  a. (DO.8.1) Quantitativo de tripulantes por tipo por base contratual.

  b. (DO.8.2) Média mensal de tripulantes que mudam de base por interesse do operador

  aéreo.

  E.2.9. Dados mensuráveis e reportáveis.

  a. (DO.9.1) Reportes de incidentes relacionados à fadiga.

  b. (DO.9.2) Número médio de registros oriundos de sistemas de reporte de eventos de

  segurança operacional (RELPREV e outros).

  c. (DO.9.3) Número de simulações de fadiga por meio de modelos biomatemáticos a

  intervalos definidos pelo GAGEF.

  d. (DO.9.4) Frequência de produção de modelagens de chaves de voo, de acionamento

  e respectivos tempos de voo e jornadas de trabalho.

  E.2.10. Ações internas.

  a. (DO.10.1) Tempo médio de reuniões e respectiva frequência mensal do pessoal do

  GAGEF.

  b. (DO.10.2) Número médio de pesquisas sobre fadiga em um dado período definido.

  c. (DO.10.3) Reportes de incidente/acidente do operador aéreo por período definido.

  d. (DO.10.4) Relatórios externos, estudos, análises e relatórios de acidente/incidente

  de outros operadores aéreos.

  E.2.11. Coleta planejada de dados.

  a. (DO.11.1) Frequência de coleta de dados de sono por tipo de tripulação.Data de emissão:
  31 de janeiro de 2020 IS nº 117-003

  Revisão B

  b. (DO.11.2) Frequência de coleta de dados oriundos de estudos de desempenho

  cognitivo de sono por tipo de tripulação.

  c. (DO.11.3) Frequência de coleta de dados oriundos de voos (FOQA).

  d. (DO.11.4) Frequência de coleta de dados da escala de voo por tipo de tripulante.Data
  de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  APÊNDICE F. INDICADORES DE DESEMPENHO OPERACIONAL (IO)

  F.1. Após a ocorrência da coleta de dados conforme indicado no Apêndice I desta IS, podem

  ser produzidos os seguintes indicadores de desempenho, os quais servirão para a análise

  dos riscos e ameaças e sua respectiva mitigação. Os dados coletados servem de base para

  a produção de, mas não limitados a, os indicadores abaixo.

  F.1.1. Relatos da tripulação.

  a. (IO.1.1) Correlação dos relatos de fadiga por chave de voo - A empresa deverá

  identificar mensalmente todas as combinações de jornadas em que foram colhidos

  relatos de fadiga pelos tripulantes e ranquear aquelas que são mais críticas. Análise

  qualitativa.

  b. (IO.1.2) Perfil de jornadas de trabalho nas 24 horas anteriores ao relato de fadiga -

  Deve ser indicada qual era a condição de trabalho ou repouso do tripulante que se

  declara fatigado e fez o relato neste intervalo de tempo. Análise qualitativa.

  c. (IO.1.3) Perfil de jornadas de trabalho nas 72 horas antes do relato de fadiga - Deve

  ser indicada qual era a condição de trabalho ou repouso do tripulante que se declara

  fatigado e fez o relato neste intervalo de tempo. Análise qualitativa.

  d. (IO.1.4) Correlação dos relatos de fadiga com perfil de folga ou repouso nas 72

  horas anteriores - Ao analisar este perfil, o GAGEF tem condições de avaliar o nível

  de comprometimento do tripulante com a administração do tempo fora da jornada

  de trabalho. Análise qualitativa.

  e. (IO.1.5) Índice de evolução dos relatos de fadiga na tripulação - Este índice permite

  análises de tendência em relação a uma dada rota tida ou não como fatigante.

  f. (IO.1.6) Índice comparativo de evolução dos relatos de fadiga entre tripulantes de

  voos com limites no apêndice A e voos com limites dentro dos apêndices B e C do

  operações sob os apêndices B e C estão sendo eficazes. Análise qualitativa.

  F.1.2. O operador aéreo e seus números.

  a. (IO.1.2) Correlação entre relatos de fadiga e operações aéreas por aeródromos com

  conexão - Esta análise permite inferir quais os aeroportos de conexão que possuem

  maior propensão à fadiga. Análise qualitativa.

  b. (IO.2.2) Índice de evolução do quantitativo da tripulação em função da oferta de

  voos por sazonalidade - Pretende-se correlacionar a relação tripulante X operações

  aéreas em função da flutuação da malha ao longo do ano com relatos de fadiga.

  c. (IO.2.3) Correlação do índice acima com relatos de fadiga - O GAGEF pode avaliar

  os índices de IO.2.2 com os relatos de fadiga e avaliar a necessidade de propor ações

  corretivas e preventivas. Análise qualitativa.

  d. (IO.2.4) Correlação dos relatos de fadiga por tipo de tripulação - Avaliar a evolução

  (ou redução) dos relatos de fadiga por tipo de tripulação ao longo do tempo.

  F.1.3. Escala de voos.Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  a. (IO.3.1) Índice de cumprimento da escala realizada x escala planejada - Esta

  correlação permite avaliar se as discrepâncias neste índice exercem impacto sobre

  os tripulantes e eventuais relatos de fadiga.

  b. (IO.3.2) Correlação entre relatos de fadiga ou absenteísmo e pernoites não

  programados nas últimas 72 horas - Este índice vai indicar para o GAGEF o quanto

  esses eventos operacionais afetam a fadiga, a saúde do tripulante.

  c. (IO.3.3) Índice de relatos de fadiga de pessoal em reserva acionado nas últimas 72

  horas - Permite correlacionar o percentual de acionamento de pessoal em reserva

  com eventuais relatos de fadiga.

  d. (IO.3.4) Índice de relatos de fadiga de pessoal em sobreaviso acionado nas últimas

  72 horas - Permite correlacionar o percentual de acionamento de pessoal em

  sobreaviso com eventuais relatos de fadiga.

  e. (IO.3.5) Índice de extrapolação de jornada por quinzena/28 dias/mês - O

  acompanhamento deste índice permite avaliar possível correlação com eventos

  ligados à fadiga.

  f. (IO.3.6) Correlação entre relatos de fadiga e jornadas estendidas - Permite ao

  GAGEF correlacionar os índices de jornadas estendidas com relatos de fadiga e, a

  partir daí, propor a respectiva mitigação.

  g. (IO.3.7) Correlação entre relatos de fadiga e tempos de voo estendidos - Permite ao

  GAGEF correlacionar os índices de voos estendidos com relatos de fadiga e, a partir

  daí, propor a respectiva mitigação.

  F.1.4. Dias de folga.

  a. (IO.4.1) Perfil de folga/repouso nas 168 horas anteriores ao relato de fadiga dos

  tripulantes - Permite a avaliação da qualidade do repouso do tripulante que relata

  fadiga. Análise qualitativa.

  b. (IO.4.2) Correlação entre folgas de 24 horas nos 30 dias anteriores a um relato de

  fadiga - Este índice apresenta correlação entre as chamadas monofolgas sobre a

  fadiga acumulada dos tripulantes. Análise qualitativa.

  c. (IO.4.3) Correlação entre faltas, seus respectivos tempos de duração e eventual

  relato de fadiga - Este índice permite avaliar o impacto da fadiga acumulada e a

  indisposição para cumprimento da escala. Análise qualitativa.

  F.1.5. Jornadas.

  a. (IO.5.1) Percentual de atendimento à escala de madrugada da tripulação, mês a mês

  - Este índice permite identificar quais tripulantes mais atendem a voos no horário

  da madrugada e eventual relato de fadiga.

  b. (IO.5.2) Correlação entre relatos de fadiga e operações que iniciem ou encerrem no

  horário da madrugada - Este índice permite abordar o perfil de atendimento à escala

  de tripulantes que margeiem atividades laborais na madrugada.

  c. (IO.5.3) Correlação entre absenteísmo e número de atendimentos a operações queData de
  emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  começaram ou se encerraram de madrugada - Este índice oferece a possibilidade de

  análise de faltas decorrentes de escalas na madrugada em quantidade acima do

  aceitável para um dado tripulante.

  d. (IO.5.4) Correlação entre número médio de etapas voadas e relatos de

  fadiga/ocorrência de absenteísmo nas 72 horas antes do evento - Este índice permite

  a análise da quantidade média de etapas de voo concluídas nas 72 horas antes do

  relato de fadiga ou absenteísmo. No caso de ausência, o GAGEF deve checar se há

  correlação com fadiga. Análise qualitativa.

  e. (IO.5.5) Correlação entre jornadas estendidas e relatos de fadiga/ocorrência de

  absenteísmo nas 72 horas antes do evento - Este índice permite a análise da

  quantidade média de horas de jornada estendida nas 72 horas antes do relato de

  fadiga ou absenteísmo. No caso de ausência, o GAGEF deve checar se há correlação

  com fadiga. Análise qualitativa.

  f. (IO.5.6) Correlação entre o número médio de horas de jornada de um tripulante e

  relatos de fadiga/ocorrência de absenteísmo nas 72 horas antes do evento - Este

  índice permite a análise da quantidade média de horas de jornada nas 72 horas antes

  do relato de fadiga ou absenteísmo. No caso de ausência, o GAGEF deve checar se

  há correlação com a fadiga. Análise qualitativa.

  g. (IO.5.7) Correlação entre número médio de cruzamentos de 3 (três) ou mais fusos

  horários nas 168 horas anteriores a um relato de fadiga/absenteísmo - O GAGEF

  deve considerar a base contratual do tripulante que faz os cruzamentos de 3 ou mais

  fusos na ida e na volta para poder avaliar o número médio e os relatos de

  fadiga/absenteísmo. Análise qualitativa.

  h. (IO.5.8) Correlação entre o número médio de conexões ocorridas com um tripulante

  e eventual relato de fadiga/absenteísmo nas 168 horas anteriores ao evento - Este

  índice permite a análise da quantidade média de conexões realizadas nas 168 horas

  antes do relato de fadiga ou absenteísmo. No caso de ausência, o GAGEF deve

  checar se há correlação com a fadiga. Análise qualitativa.

  i. (IO.5.9) Correlação entre o número de horas de conexão e eventuais relatos de

  fadiga / absenteísmo nas 168 horas anteriores ao evento - Este índice permite a

  análise da quantidade média de horas de conexão realizadas nas 168 horas antes do

  relato de fadiga ou absenteísmo. No caso de ausência, o GAGEF deve checar se há

  correlação com a fadiga. Análise qualitativa.

  F.1.6. Planos de contingência.

  a. (IO.6.1) Correlação entre eventuais voos com atraso superior a 30 minutos e relatos

  de fadiga/ocorrência de absenteísmo nas últimas 72 horas - Avaliar se e por quanto

  tempo um tripulante que relata fadiga ficou exposto a atrasos superiores a 30

  minutos em uma semana, mês ou outro período definido pelo GAGEF.

  F.1.7. Escala planejada versus escala realizada.

  a. (IO.7.1) Estudo regular sobre discrepâncias em escalas de tripulantes com eventuais

  relatos de fadiga - Este índice pretende avaliar se um relato de fadiga tem correlação

  com a quantidade e tipo de alteração de escala do tripulante a que foi sujeito em umData
  de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  dado intervalo de tempo. Análise qualitativa.

  F.1.8. Base contratual.

  a. (IO.8.1) Análise mensal dos tripulantes que assumem jornadas de trabalho em base

  diversa da sua base contratual e relatos de fadiga - Este índice avalia se a mudança

  de base contratual para cumprir uma jornada de trabalho tem influência sobre

  eventual relato de fadiga. É obtido a partir da listagem dos tripulantes que atendem

  à demanda do operador aéreo como denominador e os relatos de fadiga como

  numerador.

  b. (IO.8.2) Correlação entre relatos de fadiga e tripulantes que mudaram de base por

  determinação do operador aéreo nos 3 (três) meses anteriores à ocorrência do evento

  - Este índice avalia se a mudança de base contratual por determinação do operador

  aéreo tem influência sobre eventual relato de fadiga.

  F.1.9. Dados mensuráveis e reportáveis.

  a. (IO.9.1) Análise dos fatores contribuintes e causais para incidentes graves e

  acidentes relacionados à fadiga - Este índice deve ser obtido a partir dos relatórios

  de análise de incidentes graves e acidentes ocorridos na empresa em intervalos

  definidos pelo GAGEF. Análise qualitativa.

  b. (IO.9.2) Análise da evolução/involução nos reportes de eventos de segurança

  operacional com ações concretas do GAGEF relativamente a um GRF - Este índice

  demonstra a efetividade das ações do GAGEF relativamente aos eventos de

  segurança operacional como um todo. Análise qualitativa.

  c. (IO.9.3) Estudo de correlação entre relatos de fadiga e simulação em modelos

  biomatemáticos - A adoção deste índice está diretamente relacionada ao uso de

  modelos biomatemáticos para analisar chaves de voo que possam potencializar

  fadiga na tripulação e oferecer subsídios para a ação do GAGEF. Análise

  qualitativa.

  d. (IO.9.4) Estudo crítico de chaves de voo com eventuais relatos de fadiga - A partir

  dos índices obtidos em IO.9.3, o GAGEF pode propor alterações ou contramedidas

  para chaves de voo reconhecidamente potencializadoras de fadiga. Análise

  qualitativa.

  F.1.10. [Reservado].

  F.1.11. Coleta planejada de dados.

  a. (IO.11.1) Apresentação mensal do percentual de coleta de dados de sono na

  tripulação sujeita ao GRF - Este índice oferece uma série de dados que servem como

  variável para integrar análises mais robustas por parte do GAGEF na gestão da

  fadiga humana nas operações sob o GRF.

  b. (IO.11.2) Apresentação mensal do percentual de coleta de dados de desempenho

  cognitivo na tripulação sujeita ao GRF - Este índice oferece uma série de dados que

  servem como variável para integrar análises mais robustas por parte do GAGEF na

  gestão da fadiga humana nas operações sob o GRF.Data de emissão: 31 de janeiro de 2020 IS
  nº 117-003

  Revisão B

  c. (IO.11.3) [Reservado].

  d. (IO.11.4) [Reservado].

  e. (IO.11.5) Análise de discrepâncias no desempenho operacional em voo, oriundo da

  análise do FOQA, com perfil de folga/repouso dos tripulantes envolvidos nas 168

  horas anteriores à ocorrência da discrepância - Este índice oferece uma série de

  dados que servem como variável para integrar análises mais robustas por parte do

  GAGEF na gestão da fadiga humana. Análise qualitativa.

  F.1.12. Outras fontes de dados.

  a. (IO.12.1) Número médio de proposições do GAGEF com base em estudos e

  análises sobre fadiga por tempo definido - Índice que expressa a efetividade do

  GAGEF relativamente às ações voltadas para a gestão da fadiga.Data de emissão: 31 de janeiro
  de 2020 IS nº 117-003

  Revisão B

