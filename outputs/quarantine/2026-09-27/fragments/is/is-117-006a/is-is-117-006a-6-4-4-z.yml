  APÊNDICE E. EXEMPLOS DE REPORTE DE OCORRÊNCIA DE FADIGA

  REPORTE DE OCORRÊNCIA DE FADIGA

  A Ocorrência de fadiga Resposta:

  1 Nos 12 (doze) últimos meses, quantas vezes você experimentou fadiga e relatou a ocorrência?

  2 Quando houve a ocorrência de fadiga, por quantos dias consecutivos você esteve atendendo
  a uma

  jornada de trabalho?

  3 Nos dias anteriores à ocorrência de fadiga, por quantas etapas você voou durante cada
  dia de trabalho

  dentro do período prévio de 72 horas?

  4 Você foi reprogramado para uma jornada durante período prévio de 72 horas à ocorrência
  de fadiga?

  Sim/Não.

  5 Antes da notificação de reprogramação, por quanto tempo você compôs tripulação?

  6 Nos dias anteriores à ocorrência da fadiga, por quantas horas você voou durante cada dia
  de trabalho

  dentro do período prévio de 72 horas?

  7 Nos dias anteriores à ocorrência da fadiga, de quantas horas foi sua jornada de trabalho
  durante cada

  dia de trabalho dentro do período prévio de 72 horas?

  8 Você esteve desempenhando outras funções laborais para o operador em qualquer dia dentro
  do período

  prévio de 72 horas ao evento de fadiga? (sim/não). Se sim, responda à seguinte pergunta.

  9 Se você esteve desempenhando outras funções, de quanto foi o tempo total de trabalho a
  cada dia?

  B Deslocamento Resposta:

  1 Você realiza deslocamento para o trabalho? Se não, responda e vá para a próxima seção.

  2 Qual é a forma de transporte utilizada para seu deslocamento?

  3 Quanto tempo dura seu deslocamento?

  4 Quanto tempo se passou entre sua saída de casa no início do deslocamento até a apresentação
  para

  assumir o voo?

  5 Qual foi o tempo total entre o momento que você chegou em sua residência e se apresentou
  para a

  jornada seguinte?

  6 Você recebeu algum tempo adicional de repouso em sua residência antes de se apresentar
  para o voo

  seguinte? Se sim, de quanto tempo?

  C Reserva Resposta:

  1 Durante o período prévio de 72 horas à ocorrência de fadiga, você foi escalado como tripulante
  reserva?

  Se não, responda e vá para a próxima seção.

  2 Você regularmente é indicado para reserva? (sim/não).

  3 Por quantas horas você voou nas últimas 24 horas?

  4 De quantas horas foi sua jornada de trabalho nas últimas 24 horas?

  5 Por quantas horas você voou nas últimas 72 horas?

  6 De quantas horas foi sua jornada de trabalho nas últimas 72 horas?

  7 Por quantos dias você assumiu jornadas de trabalho nos últimos 30 dias?

  8 Por quantas horas você voou nos últimos 30 dias?

  9 Quando foi a última vez que você teve ao menos 24 horas livres de qualquer atividade laboral?

  D Questões operacionais Resposta:

  1

  Você passou por atrasos de voo em função de problemas oriundos de questões operacionais
  ou

  manutenção não programada dentro das 72 horas anteriores ao evento de fadiga? Se não, responda
  e vá

  para a próxima seção.Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  2 Quantos dias de repouso você teve nas 72 horas prévias à ocorrência de fadiga?

  3 Você teve oportunidade de obter repouso adicional entre dois voos? Se sim, qual foi a
  qualidade deste

  repouso?

  4 Durante o período prévio de 72 horas ao evento de fadiga, sua jornada de trabalho envolveu
  jornada

  noturna ou na madrugada ou jornadas noturnas contínuas? (sim/não)

  5 Se você respondeu sim à pergunta acima, quantas jornadas noturnas você consecutivamente
  cumpriu?

  6 Se você respondeu sim à pergunta D4, quantas jornadas na madrugada você consecutivamente
  cumpriu

  antes do evento de relato de fadiga?

  E Tripulação aumentada Resposta:

  1 Durante o período de 72 horas antes da ocorrência de fadiga, você atuou como membro de
  uma

  tripulação aumentada? (sim/não). Se você responder não, vá para a próxima seção.

  2 Dentro das últimas 24 horas, por quanto tempo você atuou como integrante da tripulação
  aumentada?

  3 Dentro das últimas 72 horas, por quanto tempo você atuou como integrante da tripulação
  aumentada?

  4 Qual a classificação da acomodação a bordo utilizada por você no repouso? 1, 2 ou 3?

  5 Como você avaliaria a qualidade do repouso recebido durante as últimas 24 horas? (boa,
  razoável ou

  ruim)

  6 Como você avaliaria a qualidade do repouso recebido durante as últimas 72 horas? (boa,
  razoável ou

  ruim)

  7 Qual foi o tempo total de sua jornada de trabalho nas últimas 24 horas?

  8 Quantas horas você utilizou em atividades de voo durante as últimas 72 horas?

  9 Você atuou como piloto na cabine de voo durante a fase de pouso? Se sim, como piloto em
  comando

  ou como segundo em comando?

  10

  Durante o período prévio de 72 horas, você atuou como piloto em cabine de duplo comando?
  (sim/não).

  Se sim, forneça detalhes relativos ao tempo de voo, número de etapas voadas e o intervalo
  de tempo de

  jornada no período das últimas 72 horas.

  F Acomodações adequadas / Hotel Resposta:

  1 Dentro das 72 horas prévias, qual tipo de acomodação você utilizou? (hotel ou residência)

  2 Se você repousou em casa, houve alguma situação que interrompeu seu sono? (sim/não). Se
  sim, quantas

  foram?

  3 Os hotéis em que você se hospedou são hotéis regularmente utilizados pela sua companhia
  aérea?

  (sim/não)

  4 Os quartos de hotel utilizados por você se localizavam próximos ao elevador, máquina de
  gelo ou área

  de grande movimento?

  5 Você experimentou incômodos ambientais que prejudicaram sua qualidade de sono tais como
  eventos

  sociais ocorrendo no hotel, tráfego de veículos, ruídos de aviões ou outros?

  6 Você experimentou barulhos de reforma no hotel ou de construções próximas que possam ter

  prejudicado sua qualidade de sono durante seu repouso? (sim/não)

  G Repouso (durante as 72 horas anteriores à ocorrência de fadiga) Resposta:

  1 Qual foi a diferença de tempo entre seu período de repouso programado e seu período de
  repouso

  efetivo?

  2 Quanto tempo durou sua oportunidade de sono durante seu período de repouso programado?

  H Oportunidade de sono Resposta:

  1 Dentro das 24 horas anteriores à ocorrência de fadiga, por quantas horas você dormiu?

  2 Dentro das 48 horas anteriores à ocorrência de fadiga, por quantas horas você dormiu?

  3 Dentro das 72 horas anteriores à ocorrência de fadiga, por quantas horas você dormiu?

  I Distúrbios circadianos Resposta:Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  1 Dentro das 72 horas prévias à ocorrência de fadiga, alguma parte da sua jornada de trabalho
  entrou na

  janela de baixa de ritmo circadiano? (sim/não). Se sim, por favor, detalhe.

  2 Por quantos fusos horários você voou dentro das 24 horas prévias à ocorrência de fadiga?

  3 Quantos fusos horários você atravessou dentro das 72 horas prévias à ocorrência de fadiga?

  4 Dentro das 72 horas prévias à ocorrência de fadiga, você atuou a bordo de aeronave durante
  a

  madrugada? (sim/não). Se sim, por favor, detalhe.

  J Alimentação e hidratação Resposta:

  1 Durante as 24 horas prévias à ocorrência de fadiga, qual foi a qualidade de sua alimentação?
  (boa,

  razoável ou ruim)

  2 Durante as 72 horas prévias à ocorrência de fadiga, você teve oportunidade de se alimentar

  adequadamente? (sim/não)

  3 Durante as 24 horas prévias à ocorrência de fadiga, você ficou desidratado? (sim/não)

  4 Durante as 72 horas prévias à ocorrência de fadiga, você teve oportunidade de hidratar-se

  adequadamente? (sim/não)

  K Fatores pessoais Resposta:

  1 No presente momento, você está vivendo alguma experiência pessoal que possa estar influenciando
  a

  ocorrência de fadiga? (sim/não)

  L Atividades pré-jornada de trabalho Resposta:

  1 Dentro das 24 horas prévias à ocorrência de fadiga, você esteve engajado em atividades
  pré-jornada?

  (sim/não). Se sim, por favor, detalhe.

  2 Dentro das 72 horas prévias à ocorrência de fadiga, você esteve engajado em atividades
  pré-jornada?

  (sim/não). Se sim, por favor, detalhe.

