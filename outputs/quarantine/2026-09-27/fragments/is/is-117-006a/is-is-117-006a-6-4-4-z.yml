text: '(z). Converta o resultado final em pontos (1hora = 1 ponto). Entre com o número de
  pontos no campo ao

  lado (este é o valor de ‘t’).

  t = ___

  Some o número de pontos acima (x + y + t) para determinar seu escore (Resultado do Risco
  (2)). R2 = __

  Escore Resultado do Risco (2) Escore Resultado do Risco (2)

  0 - 4 Baixo 9+ Elevado

  5 - 8 Moderado

  Se o Risco Elevado estiver presente, é recomendável considerar controles de risco tais como
  o cochilo, rotação de

  tarefa ou informar ao operador que você não se encontra apto para o serviço.

  Q3. A que horas ocorre a presente jornada? Resultado do Risco (3)

  Todas as horas que ocorram entre 08:00 e 22:00 Baixo

  As que ocorram entre as 06:00 e 08:00 e entre 22:00 e 02:00 Moderado

  Parte da jornada ocorre entre 02:00 e 06:00 Elevado

  Q4. Qual nível de risco operacional está associado à jornada?

  (Considere rota, aeroportos, espaço aéreo, nível de experiência da tripulação,

  características e operacionalidade da aeronave e condições atmosféricas) Resultado do Risco
  (4)

  Descrição

  Todos os fatores foram considerados de baixo risco Baixo

  Ao menos um fator foi considerado como de médio risco Moderado

  Ao menos um fator foi considerado como de alto risco ElevadoData de emissão: 11/10/2024

