  Resultado dos riscos Resultado do Risco Considerações sobre o nível de alerta

  (1) (2) (3) (4)

  Resposta de risco elevado

  em Q1 ou Q2. Risco elevado: meça o nível de alerta usando métodos objetivos e

  subjetivos e discuta com seu supervisor porque seu nível de alerta

  pode não ser suficiente para esta jornada e considere a possibilidade

  de ser escalado para outra jornada de forma a gerenciar o risco (por

  exemplo, em tripulação aumentada, período de repouso maior).

  Se uma das respostas for

  de risco elevado mesmo

  com as outras em risco

  moderado.

  Qualquer combinação de

  risco baixo, moderado ou

  elevado Risco moderado: meça o nível de alerta usando métodos objetivos

  e subjetivos, discuta com seu supervisor se seu nível de alerta é

  adequado para esta jornada e considere o uso de estratégias de

  mitigação adicionais (por exemplo, cochilo, rotação de tarefa).

  Dois resultados do risco

  baixo e dois elevados

  Todos em risco moderado

  Qualquer combinação de

  risco baixo ou moderado. Risco baixo: meça o nível de alerta usando métodos objetivos e

  subjetivos, discuta com seu supervisor se seu nível de alerta é

  adequado para esta jornada e considere controles de risco de fadiga

  benéficos para esta jornada (por exemplo, uso de cafeína, cuidado

  maior com a hidratação e alimentação).

  Três resultados de risco

  baixo e um de risco

  elevado.

  Todos os resultados de

  risco baixo.

  A partir dos escores obtidos no presente formulário ou em função de: (descrever sucintamente
  a razão) eu, (nome do

  tripulante), matrícula (nº da matrícula), informo que não me encontro em totais condições
  de assumir a jornada de

  serviço para o qual fui escalado(a) nesta data devido à redução do nível de alerta e à degradação
  de meu desempenho

  mental e físico. Por este motivo, solicito (marque uma ou mais das alternativas abaixo):

  ( ) Dispensa de cumprimento da jornada para a qual fui designado(a);

  ( ) Escalação em jornada diversa, porém com menor exposição aos riscos associados à fadiga;
  ou

  ( ) Alocação em atividade de rotação de tarefa, de maneira a estar menos exposto(a) aos
  riscos associados à fadiga.

