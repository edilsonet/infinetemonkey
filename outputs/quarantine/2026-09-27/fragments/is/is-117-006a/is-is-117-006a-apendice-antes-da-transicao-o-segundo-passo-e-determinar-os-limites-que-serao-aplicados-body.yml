  6.3.4.17. Sobre o assunto, recomenda-se a aplicação da IS nº 119-002 da ANAC.

  6.3.5. Reporte de ocorrência de fadiga [117.61(c)(3) e 117.61(c)(4)]

  6.3.5.1. A disposição dos tripulantes de reportar a ocorrência de fadiga refletirá seu nível
  de

  compreensão de seus papéis e responsabilidades em relação ao gerenciamento do risco de

  fadiga e sua confiança de que o objetivo da coleta de dados é melhorar a segurança. Um

  sistema eficaz de reporte de fadiga requer uma cultura de relato aberta e justa. O sistema

  de reporte deve:

  a. oferecer formulários fáceis de acessar, preencher e enviar;

  b. ter regras claras sobre a confidencialidade das informações comunicadas;

  c. ter regras claras sobre a proteção de reportes voluntários;

  d. incluir análises regulares dos reportes;

  e. fornecer feedback regular aos tripulantes sobre decisões ou ações tomadas com base nos

  reportes e lições aprendidas (recomenda-se que o MO contenha um prazo limite para

  que a solução do reporte seja informada ao tripulante).

  6.3.5.2. Um reporte de fadiga, em papel ou eletrônico (vide Anexo A), deve incluir informações

  sobre:

  a. sono recente;

  b. hora do dia em que o evento ocorreu;

  c. histórico de atividades desempenhadas no trabalho (o mínimo deveria ser dos últimos

  três dias);

  d. medição de diferentes aspectos do comprometimento relacionado à fadiga (por exemplo,

  escalas de alerta ou de sonolência validadas).Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  6.3.5.3. O reporte também deve fornecer espaço para comentários escritos, para que a pessoa
  que

  está relatando possa explicar o contexto do evento e dar sua opinião sobre o motivo pelo

  qual isso aconteceu.

  6.3.5.4. Todos os níveis da organização devem encorajar os membros da tripulação a preencher
  e

  enviar reportes de ocorrência de fadiga nos seguintes casos:

  a. por meio do sistema de notificação voluntária, quando uma jornada não tenha começado

  ou não esteja concluída, devido à fadiga (total ou parcial). Isso inclui quando a jornada

  é concluída, mas somente após alguma ação de mitigação. Por exemplo:

  i. a adição de um membro extra da tripulação;

  ii. a redução da carga de trabalho da jornada;

  iii. o atraso da hora de apresentação;

  iv. a criação de oportunidade para um cochilo em solo;

  v. o aumento da supervisão / monitoramento;

  b. por meio do sistema de notificação voluntária após uma jornada, se o tripulante acreditar

  (após refletir sobre o assunto) que o nível de fadiga a que ele ou outros membros da

  tripulação estiveram expostos significou que não haviam sido mantidas margens de

  segurança suficientes durante o(s) voo(s);

  c. por meio do sistema de notificação voluntária, quando a tripulação percebe algo em seu

  ambiente operacional que pode causar impacto em seus membros, ou em outros

  membros da tripulação, de tal forma que as margens de segurança poderiam ser

  reduzidas a níveis insatisfatórios;

  d. por meio do sistema de comunicação de ocorrências, quando ocorreu um incidente ou

  evento onde a fadiga pode, ou não, ter contribuído para o fator de segurança. Para

  permitir isso, é preferível que haja um reporte de fadiga ou um aviso sobre o mecanismo

  de reporte de ocorrências do operador. Nestes casos, é aconselhável obter um histórico

  de sono de pelo menos 72 horas.

  6.3.5.5. O operador deve tratar os reportes de fadiga de forma proporcional ao seu conteúdo.

  6.3.6. Definição de limitações considerando os perigos [117.61(c)(3)]

  6.3.6.1. O operador deve estar ciente de que os limites constantes do Apêndice D do RBAC
  nº 117

  são limites prescritivos que necessitam de monitoramento constante por serem mais amplos

  que os estabelecidos pelo Apêndice A daquele Regulamento. Entretanto, limitações

  prescritivas são os mínimos esperados, e podem não ser suficientes para gerenciar

  adequadamente os riscos. Como parte de seu gerenciamento de risco, o operador pode

  precisar estabelecer em seu MO limites máximos menores e limites mínimos maiores do

  que os do RBAC, e operar com base neles.

  6.3.6.2. Assim, ao determinar os limites de tempo de voo e serviço, o operador deve considerar
  as

  necessidades específicas de seu ambiente operacional e alterar os limites constantes de
  seu

  MO de forma adequada. Adicionalmente é importante que o operador considere que seu

  ambiente provavelmente mudará com o tempo. Consequentemente, quaisquer alteraçõesData de
  emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  devem ser adequadamente avaliadas quanto ao risco. O operador também deve reavaliar,

  atualizar e modificar continuamente os limites de jornada de trabalho e de tempo de voo

  para garantir a segurança das operações no momento corrente.

  6.3.6.3. O operador deve considerar as consequências de mudanças organizacionais ou operacionais

  na fadiga e no desempenho da tripulação. Caso surjam problemas relacionados à fadiga

  associados a mudanças de operações (por exemplo, rotas diferentes); ou a introdução de

  novas operações, o operador deve considerar mais mitigações para gerenciar a fadiga e o

  desempenho da tripulação. Para avaliar o risco de qualquer mudança, deve ser conduzida

  uma ampla avaliação de risco, o que inclui observar a probabilidade e as consequências dos

  riscos de fadiga associados a essa mudança.

  6.3.6.4. Os relatórios de avaliação de riscos serão requeridos pela ANAC durante as atividades
  de

  vigilância, para demonstrar que as mudanças foram devidamente consideradas.

  6.3.6.5. Os limites que são determinados sob esta obrigação tornam-se novos limites “prescritivos”

  para o operador. Isto significa que qualquer ultrapassagem destes limites deve estar de

  acordo com os requisitos de extensão e apenas em circunstâncias operacionais imprevistas.

  6.3.6.6. Todos os tipos de treinamento (em aeronave, sala de aula ou à distância) podem
  afetar o

  estado de alerta dos tripulantes e seu desempenho operacional subsequente. Do ponto de

  vista da carga de trabalho, também é possível que monitorar ou treinar outro tripulante

  possa ser mais fatigante do que trabalhar em operações regulares. É altamente

  recomendável que o operador faça uma redução apropriada dos limites máximos de jornada

  de trabalho quando esta incluir um período de treinamento.

  6.3.6.7. As sessões de treinamento em um simulador devem ser incluídas nas jornadas de trabalho.

  Ao planejar qualquer treinamento em simulador, o impacto do nível de fadiga da tripulação

  na qualidade do treinamento deve ser considerado e gerenciado.

  6.3.6.8. Trabalhos administrativos ou operacionais dentro e fora do escritório também devem
  ser

  sempre considerados na contagem total da jornada de trabalho. Mesmo um trabalho parcial

  em escritório, ou à distância (virtual), por gerar esforço cognitivo e depender de um estado

  de vigília atento, deve ser levado em consideração quando do planejamento das jornadas e

  tempos de voo, especialmente quando etapas de voo são combinadas com trabalhos em solo

  na mesma jornada.

  6.3.6.9. O operador não pode tirar proveito de um tripulante envolvido em atividades voluntárias

  antes de uma jornada que, de outra forma, seriam consideradas atividades requeridas. O

  operador não pode programar a jornada de trabalho de tal maneira que haja tão pouco tempo

  disponível antes do voo que o horário de início do voo só seja atingido se o tripulante

  realizar as atividades necessárias antes do início da jornada de trabalho. Neste caso, as

  atividades não podem mais ser consideradas voluntárias.Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  Exemplo 1:

  • Não garantir tempo suficiente na jornada de trabalho para realizar atividades como

  planejamento de voo, cálculo de peso e balanceamento etc. porque, em outras

  ocasiões, o tripulante já realizou essas tarefas voluntariamente antes da jornada de

  trabalho ser iniciado.

  Exemplo 2:

  • Retirar o tripulante do seu local de repouso de forma que ele chegue ao local da

  apresentação uma ou duas horas antes do início da jornada e considerar apenas 30

  minutos deste tempo para inclusão na jornada.

  6.3.6.10. Na definição das limitações, os reportes de fadiga preenchidos pelos tripulantes
  devem ser

  examinados com especial atenção. Mesmo taxas baixas sobre determinado aspecto não

  devem ser desconsideradas ou entendidas de antemão como “problema individual” sem

  devida análise da parte técnica (GAGEF).

  6.3.7. Melhoria contínua de políticas e procedimentos [117.61(c)(4)]

  6.3.7.1. O operador deve monitorar e avaliar a eficácia de seus controles de gerenciamento
  de fadiga

  (como políticas e procedimentos). Quando os controles são considerados inadequados ou

  ineficazes, o operador deve abordar isso como parte de seus requisitos de melhoria

  contínua.

  6.3.7.2. Políticas e procedimentos a serem considerados incluem:

  a. elaboração de escalas de voo;

  b. condições de acomodação fora de base;

  c. procedimentos referentes a tripulações compostas e de revezamento;

  d. programas de treinamento;

  e. uso de ferramentas de prontidão e vigilância.

  Exemplo:

  Um operador, que inicie suas operações principalmente durante o final da madrugada

  e início da manhã (digamos, entre 05:00 e 07:00), deve levar em conta essa

  necessidade operacional ao elaborar suas políticas e procedimentos. Neste caso,

  deveria existir um procedimento para, a cada dia, atrasar em uma hora o horário de

  apresentação do tripulante cujo despertar infringe o seu período da madrugada, de

  modo a possibilitar a recuperação da qualidade de sono à medida que a semana

  progrida (exemplo, programar o primeiro dia para às 05:00, o segundo para às 06:00,

  o terceiro para às 08:00 ou mais tarde, pois não seria possível antes devido às duas

  madrugadas anteriores).

  6.3.7.3. As políticas e procedimentos de um operador devem ser reavaliadas quanto à adequação

  quando houver ajustes das limitações de jornada de trabalho e/ou de tempo de voo.

  6.3.8. Indicadores de desempenho e sistema de coleta de informações e dados de um GRF

  [117.61(c)(2) e 117.61(c)(4)]

  6.3.8.1. Introdução.Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  a. Os indicadores de desempenho, bem como o sistema de coleta de informações e dados

  relativos à adoção do GRF, devem levar em conta os seguintes aspectos:

  i. Propósito - um operador deve reunir dados e informações suficientes para estar

  seguro de que é capaz de identificar e tratar as potenciais ameaças da fadiga e seus

  riscos associados nas suas operações. É preciso ficar claro para o operador que

  fatores operacionais podem produzir maior ou menor fadiga sobre suas

  tripulações;

  ii. Prioridade - uma vez que a incapacidade decorrente de fadiga afeta múltiplas

  habilidades e possui diversas causas, não existe uma única medição que dê conta

  de descrever completamente os níveis de fadiga ou fatores causadores de fadiga

  em uma dada tripulação. Para decidir que dados colher, o operador deve levar em

  consideração aquelas operações em que é esperado um elevado nível de risco de

  fadiga. Nelas, os recursos devem estar direcionados para a coleta de dados

  significativos para a operação; e

  iii. Eficiência - deve existir um equilíbrio entre a coleta de dados em quantidade

  suficiente para o operador estar seguro acerca de suas decisões, ações, e demandas

  adicionais e os respectivos custos envolvidos nesta coleta e análise. Os recursos,

  sempre limitados, devem ser otimizados para oferecer uma correta identificação

  das ameaças e riscos associados à fadiga e onde os controles e mitigações devem

  ser melhor aplicados.

  b. A ANAC pode, a qualquer momento, requisitar um relatório dos indicadores do GRF.

  6.3.8.2. Forma de apresentação.

  a. O operador deve desenvolver um modelo de relatório ou formulário para apresentação

  dos dados e indicadores periodicamente coletados/produzidos.

  b. Qualquer relatório ou formulário produzido pelo GAGEF deveria vir assinado pelos

  membros do GAGEF. Deve ainda ser apresentado como anexo a um FOP 207, de

  maneira que ele seja objeto de análise por parte da SPO/ANAC, quando for solicitado.

  6.3.8.3. Uso proposto para os indicadores.

  a. Os indicadores apresentados pelo operador devem, tão logo a sistematização da coleta

  permita, ser acompanhados de análises de tendência, de forma a oferecer subsídio ao

  GAGEF para o monitoramento das operações sob um GRF e, por extensão, para

  acompanhamento por parte da ANAC.

  b. Os indicadores de desempenho propostos e adotados visam avaliar se as estratégias de

  mitigação aprovadas estão correspondendo à redução do risco desejada. Esta avaliação

  dos indicadores deve ser feita a intervalos regulares ou sempre que o GAGEF observar

  que os riscos não estão sendo satisfatoriamente mitigados.

  c. Estas análises devem compor os relatórios periódicos que o GAGEF deve produzir e

  disponibilizar à ANAC, conforme periodicidade estabelecida entre o operador e a

  ANAC ou, excepcionalmente, quando as circunstâncias da operação sob GRF exigirem.

  6.4 Obrigações referentes ao Apêndice D do RBAC nº 117Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  6.4.1. Oportunidade de sono anterior à jornada, sobreaviso ou reserva [D117.5]

  6.4.1.1. Conforme a seção D117.5 do Apêndice D do RBAC nº 117, um tripulante não pode ser

  escalado para uma jornada, sobreaviso ou reserva, ou iniciá-la(o), exceto se tiver a

  oportunidade de sono de 8 (oito) horas consecutivas dentro das 12 (doze) horas que

  antecedem:

  a. o início da jornada, sobreaviso ou reserva, se esta(e) não sofreu atraso;

  b. o horário original de apresentação para a jornada, sobreaviso ou reserva, se esta(e)
  sofreu

  atraso de menos de 10 horas; ou

  c. o início da jornada, sobreaviso ou reserva após o atraso, se este foi de 10 horas ou
  mais.

  6.4.1.2. Para tanto, deve haver uma política e procedimentos descritos no MO, baseados no

  entendimento mútuo entre o tripulante e o operador, sobre em que momento a oportunidade

  do sono se situará no período anterior a jornada de trabalho (especialmente para casos em

  que a oportunidade de sono não coincidir com a noite local).

  6.4.1.3. Em circunstâncias normais, o tripulante não deve ser contatado pelo operador durante
  a

  oportunidade de sono anterior à jornada, exceto de uma maneira que não perturbe seu sono

  naquele período. Do contrário, caracterizar-se-ão circunstâncias anormais.

  a. Circunstâncias normais referem-se às situações em que o operador deseja preservar a

  oportunidade de sono anterior do tripulante, sem interromper o fluxo contínuo do sono.

  Em casos de períodos de repouso maiores do que 12 horas, eventuais contatos nas horas

  anteriores ao período de 12 horas que precede o início da jornada são considerados

  normais, desde que não interfiram na noite local.

  Exemplo 1:

  Uma jornada foi finalizada às 16:00 no dia 1 e o tripulante obteve 20 horas de repouso.

  Sua próxima jornada será às 12:00 do dia 2. O período que deve ser preservado para

  garantir a oportunidade de sono é das 00:00 às 12:00. Porém, como a noite local já

  iniciou às 22:00, o ideal é não haver contato desde este horário. Por outro lado, se a

  política do operador considerar que 2 horas antes do horário do início da jornada a

  pessoa já está acordada, o intervalo entre 10:00 e 12:00 do dia 2 seria considerado

  normal. Da mesma forma, o intervalo entre 16:00 e 22:00 do dia 1.

  Exemplo 2:

  Uma jornada é finalizada às 06:00 e, após repouso de 12 horas, outra jornada será

  iniciada no mesmo dia. O período de oportunidade de sono coincidirá com o período

  de repouso integralmente, de forma que quaisquer contatos devem ser evitados ao

  máximo. Por conveniência, o operador pode definir que 1 hora logo após o término da

  jornada e 1 hora antes do início da próxima sejam janelas em que o contato pode ser

  realizado sem atrapalhar o sono do tripulante. Entretanto, um contato realizado às

  08:00 ou às 13:00, por exemplo, seria considerado sob circunstâncias anormais, pois

  interferiria diretamente na oportunidade de sono do tripulante.

  b. Circunstâncias anormais referem-se ao caso em que o operador precisa entrar em contato

  com o tripulante e entende-se que isso significará que a oportunidade de sono anterior

  foi interrompida. O tripulante, então, não poderá iniciar a jornada de trabalho sem

  usufruir um período de oportunidade de sono anterior a partir do final da interrupção.Data
  de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  Exemplo:

  Pode ocorrer que o operador necessite de informações urgentes do tripulante, como

  dados de aeronavegabilidade de uma aeronave operada pelo tripulante na jornada de

  trabalho anterior e decide que não pode esperar até que a oportunidade de sono

  termine, entendendo que a oportunidade de sono deve ser rearranjada e iniciada

  novamente do zero a partir do final da interrupção.

  6.4.1.4. Quando houver a necessidade de oportunidades de sono prévio, o MO deve conter:

  a. a política do operador para gerenciar os requisitos da oportunidade de sono anterior,
  de

  modo que os tripulantes estejam cientes de quando o sono deve ser planejado com

  referência à hora de início de suas jornadas. Recomenda-se que esta política seja

  construída após consulta junto aos tripulantes;

  A consulta acima referenciada pode ser feita de diferentes formas, tais como envio de

  e-mails, solicitação de preenchimento de documento adicional durante a preparação

  do voo, pesquisa via internet etc.

  Outro método viável seria a formação de um grupo com representação das categorias

  (pilotos e comissários) para recolher informação dos tripulantes, como oficinas de

  trabalho.

  b. procedimentos para assegurar que a oportunidade mínima de sono antes de uma jornada

  ou de períodos de sobreaviso ou reserva possa ser cumprida;

  c. procedimentos para orientar os funcionários do operador a não interromper a

  oportunidade de sono de tripulantes ao entrar em contato com eles antes do horário de

  início de uma jornada, a não ser que este contato esteja de acordo com o protocolo da

  empresa que tenha sido construído junto aos próprios tripulantes;

  d. procedimentos que detalham métodos e protocolos de contato especificados que

  provaram ser eficazes em não interromper a oportunidade de sono anterior de tripulantes,

  bem como identificar e comunicar horários adequados de contato. Esses procedimentos

  devem ser claros e prontamente disponíveis para os funcionários do operador envolvidos

  nos contatos com os tripulantes, bem como para os tripulantes afetados;

  e. procedimentos para assegurar que, tanto quanto seja praticável, cada tripulante esteja

  ciente de que tem a responsabilidade de fazer uso apropriado da oportunidade de sono

  antes de iniciar uma jornada, a fim de alcançar um estado de alerta adequado no início

  da jornada de trabalho.

  Observação:

  Os procedimentos necessários podem ser tão simples quanto garantir que os

  tripulantes, o pessoal da escala e todos aqueles que possam ter motivos para entrar

  em contato com um tripulante antes de uma jornada, tenham sido informados sobre

  esse requisito na sua contratação. Todos devem estar cientes de que qualquer contato

  (que não esteja de acordo com os procedimentos do operador) durante o período de

  oportunidade do sono, tem o potencial de afetar a aptidão do tripulante ao trabalho

  para a jornada subsequente.

  6.4.1.5. O requisito de oportunidade de sono prévio pode resultar em um repouso mínimo

  aumentado em alguns locais, se não houver tempo suficiente disponível para a oportunidade

  anterior de sono. A tabela a seguir pode ser usada para ajudar a determinar o repousoData
