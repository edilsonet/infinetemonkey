title: apêndice antes da transição. O segundo passo é determinar os limites que serão aplicados
text: 'apêndice antes da transição. O segundo passo é determinar os limites que serão aplicados

  à jornada de trabalho proposta.

  b. Para operar sob múltiplos apêndices em jornadas de trabalho consecutivas, o caso mais

  trivial, basta concluir os limites aplicáveis de repouso e, se aplicável, folga

  correspondentes à primeira jornada e, antes de iniciar a segunda jornada, estar dentro

  dos limites aplicáveis a ela.

  c. No RBAC nº 117, as seguintes seções devem ser consideradas no desenvolvimento de

  procedimentos para operação em múltiplos apêndices; e, em particular, gerenciando o

  risco de fadiga por meio de transições de um apêndice para outro:

  i. seção 117.11;

  ii. seção 117.17; e

  iii. parágrafo 117.61(c)(5).

  d. A Seção 117.11 do RBAC nº 117 exige que:

  i. cada operador deve cumprir os limites e requisitos mencionados nos apêndices

  aplicáveis;

  ii. cada tripulante, empregado pelo operador, deve cumprir os limites dos apêndices

  que o operador optou por cumprir.

  e. em algumas circunstâncias, o atendimento de todos os requisitos de um apêndice antes

  de operar sob esse apêndice poderia ser potencialmente mais restritivo do que o

  necessário para gerenciar o risco potencial de fadiga associado à transição.

  f. os requisitos para combinar vários apêndices dentro de uma única jornada de trabalho

  são abordados na seção 117.17 do RBAC nº 117 e o operador deve ter procedimentos

  que atendam a esses requisitos.

  6.3.3.3. Operando sob dois ou mais apêndices em uma única jornada de trabalho.

  a. Se o operador pretende realizar operações em que dois ou mais apêndices se aplicam a

  uma única jornada de trabalho, o seu manual deve conter procedimentos que garantam

  que:

  i. a jornada de trabalho máxima é o máximo que se aplica ao tipo de operação que

  está sendo conduzida no momento (com base na suposição de que toda a jornada

  de trabalho foi conduzida sob esse apêndice). A jornada de trabalho máxima para

  a atividade que está sendo realizada a qualquer momento é sempre baseada no

  horário de início jornada completa, não no momento em que o tripulante mudou

  para essa atividade;Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  ii. o tempo máximo de voo é o tempo voo máximo contido no apêndice sob o qual a

  operação está sendo conduzida naquele momento específico (com base na

  suposição de que toda a jornada de trabalho foi conduzida sob esse apêndice).

  Deve basear-se no horário de início original da jornada de trabalho e não no

  horário de início das operações em cada apêndice;

  iii. o tempo de repouso que deve ser aplicado após a jornada de trabalho é o maior dos

  tempos mínimos de repouso calculados sob cada Apêndice.

  Nota: vide os dois exemplos abaixo que ilustram as regras acima.

  Exemplo 1:

  Suponha que o operador escale o tripulante para uma jornada com duas etapas, como

  abaixo mostrado:

  1) Etapa 1: transporte doméstico regular de passageiros (RBAC nº 135 + RBAC nº

  117 Apêndice C);

  2) Etapa 2: translado de aeronave (RBCA nº 91 + RBAC nº 117 Apêndice A (Lei nº

  13.475/17))

  Então:

  1) Antes do tripulante transitar para a etapa 2, ele deve ser capaz de conduzir a

  etapa 1 dentro do limite máximo de jornada constante do seu manual de

  operações para transporte doméstico regular de passageiros;

  2) O horário de referência de início da etapa 2 é o horário de início da etapa 1,

  como se o tripulante estivesse conduzido toda a etapa 2 desde o início (consulte

  a Figura 3).

  Note que, de acordo com a seção 117.17 do RBAC nº 117:

  1) A jornada máxima será a da etapa 2: 9h [Parágrafo 117.17(a)(1)]

  2) O tempo de voo máximo será o da etapa 2: 8h [Parágrafo 117.17(a)(2)]

  3) O repouso mínimo será o da etapa 2: 12h [Parágrafo 117.17(d)]Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  Figura 3: Operando sob dois apêndices em uma única jornada de trabalho - determinação

  da jornada e do tempo de voo máximos e do repouso mínimo

  Exemplo 2:

  Suponha que o operador escale o tripulante para uma jornada com duas etapas, como

  abaixo mostrado:

  4) Etapa 1: translado de aeronave [RBAC nº 91 + RBAC nº 117 Apêndice A (Lei nº

  13.475/17)];

  5) Etapa 2: transporte doméstico regular de passageiros (RBAC nº 135 + RBAC nº

  117 Apêndice C);

  Considerando as mesmas regras do exemplo anterior:

  1) A jornada máxima será a da etapa 2: 10h [Parágrafo 117.17(a)(1)]

  2) O tempo de voo máximo será o da etapa 2: 8h [Parágrafo 117.17(a)(2)]

  3) O repouso mínimo será o da etapa 2: 12h [Parágrafo 117.17(d)]

  Figura 4: Operando sob dois apêndices em uma única jornada de trabalho - determinação

  da jornada e do tempo de voo máximos e do repouso mínimo

  6.3.4. Identificação de perigos [117.61(c)(2)]

  6.3.4.1. Tal como ocorre com toda a gestão de riscos, os riscos relacionados à fadiga humana

  degradando o estado de alerta devem ser identificados, avaliados e gerenciados (por

  exemplo, colocando em prática controles e estratégias de mitigação).

  6.3.4.2. Os perigos podem combinar-se de maneira imprevisível, de modo que mesmo perigos

  aparentemente triviais podem resultar em estados indesejáveis, que podem se combinar

  com outros perigos para resultar em acidentes ou incidentes.

  6.3.4.3. Os métodos para identificação de perigos devem ser proporcionais aos limites operacionais

  constantes do MO. Se estes estiverem próximos aos limites operacionais do Apêndice D do

  e até mesmo preditivos para garantir que o risco de fadiga seja gerenciado adequadamente.Data
  de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  6.3.4.4. Os perigos podem ser identificados a partir de uma variedade de fontes, incluindo,
  mas não

  se limitando a:

  a. workshops de identificação de perigos (por exemplo, brainstorming usando pessoal

  operacional experiente);

  b. avaliações de risco (avaliações de risco formais podem revelar novos perigos);

  c. desenvolvimento de cenários de risco;

  d. registro de riscos (por exemplo, por meio de sistemas eletrônicos);

  e. análise de tendências;

  f. reporte de perigos;

  g. reportes de fadiga (Anexo A) e FAPA (Apêndice D);

  h. feedback do treinamento;

  i. pesquisas de segurança e auditorias de segurança de supervisão operacional;

  j. monitoramento de operações normais;

  k. utilização de modelos biomatemáticos devidamente validados;

  l. investigação do estado sobre acidentes e incidentes graves; e

  m. sistemas de troca de informações (operadores similares, reguladores etc.).

  6.3.4.5. Com o passar do tempo, o banco de dados de perigos relatados permitirá que o operador:

  a. identifique situações de risco de fadiga que precisam de atenção especial; e

  b. conduza análises de tendências que podem fornecer a base para melhorar a identificação

  de perigos.

  6.3.4.6. O operador deve inserir no seu MO políticas e procedimentos para lidar com as informações

  fornecidas pelos tripulantes que possam afetar o seu estado de alerta no trabalho. Exemplos

  de tais fatores constam na Seção 7.2 desta IS.

  6.3.4.7. Perigos que deveriam ser considerados:

  a. ao determinar as limitações de voo e tempo de serviço; e/ou

  b. à melhoria contínua das políticas e práticas estabelecidas pelo operador.

  6.3.4.8. Modelos biomatemáticos podem auxiliar o operador nas previsões de fadiga humana
  e/ou

  de oportunidade de sono que podem ser utilizados como um componente no gerenciamento

  da fadiga de uma operação.

  6.3.4.9. Embora os modelos biomatemáticos incorporem aspectos da ciência da fadiga nas práticas

  de escala de tripulantes, fornecendo previsões de níveis de risco de fadiga, níveis de

  desempenho e/ou tempos/oportunidades ideais de sono, eles têm limitações que devem ser

  consideradas. Algumas limitações incluem:

  a. prever probabilidades de risco para uma média populacional em vez de níveis de fadiga

  de um indivíduo específico;Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  b. não levar em conta o impacto da carga de trabalho ou fatores de estresse pessoais e

  relacionados ao trabalho que podem afetar os níveis de fadiga;

  c. descrição incompleta de todos os fatores fisiológicos da fadiga; e

  d. testes limitados (validação) com dados específicos da aviação.

  6.3.4.10. Cada modelo tem diferentes pontos fortes e limitações. Ao usar um modelo biomatemático,

  a ANAC sugere que o operador adote uma abordagem cautelosa, que leve em conta as

  limitações e a validade do modelo naquele contexto operacional específico (ou seja, se foi

  validado a partir de dados de fadiga de operações semelhantes àquelas em que o operador

  está interessado). Ao tomar decisões sobre a elaboração da escala, as previsões do modelo

  não devem ser usadas sem referência à experiência operacional ou dados de reportes de

  fadiga já conhecidos.

  6.3.4.11. É importante estar ciente de que um regime de gerenciamento de fadiga deve ser
  projetado

  como um sistema abrangente e multicamadas, no qual modelos biomatemáticos fornecem

  um papel de suporte opcional.

  6.3.4.12. O operador deve fazer uso de seu SGSO para o processo de identificação de perigos.
  A

  Tabela 1 desta IS fornece exemplos de tipos de perigos que podem precisar ser abordados.

  6.3.4.13. O Apêndice D do RBAC nº 117 contém requisitos para gerenciar o risco de fadiga
  devido

  à perda de sono, tempo acordado, tempo de trabalho e os efeitos do horário do dia. No

  entanto, os diferentes ambientes operacionais, bem como diferentes cargas de trabalho,

  podem aumentar ou diminuir o acúmulo de fadiga. Tal Apêndice fornece considerações

  mínimas sobre essas influências.

  6.3.4.14. O operador deve considerar suas próprias circunstâncias usando experiências anteriores
  da

  empresa ou discussões com outro operador e grupos, para que limitações referentes a essas

  medidas (diferentes ambientes operacionais e cargas de trabalho etc.) possam ser incluídas

  no seu manual.

  6.3.4.15. A tabela a seguir apresenta alguns exemplos de uma abordagem razoável para a

  identificação de perigos para um operador sem um processo de avaliação de risco

  estabelecido. Ressalta-se que os tempos jornada e de voo não são os únicos meios possíveis

  de reduzir riscos associados aos perigos identificados.

  6.3.4.16. Os exemplos de perigos de fadiga da tabela abaixo podem existir para alguns operadores.

  Esta lista não é específica para nenhum tipo de operação em particular, mas destina-se a

  prover uma orientação mínima sobre a identificação de riscos de fadiga e respectivos

  ajustes das limitações e considerações de políticas e procedimentos a serem adotados para

  um operador do GRF. Adicionalmente, o operador pode utilizar o seu SGSO aprovado para

  avaliar os perigos relativos à fadiga relacionados a fatores não considerados no Apêndice

  D do RBAC nº 117, estabelecendo limites adicionais apropriados.

