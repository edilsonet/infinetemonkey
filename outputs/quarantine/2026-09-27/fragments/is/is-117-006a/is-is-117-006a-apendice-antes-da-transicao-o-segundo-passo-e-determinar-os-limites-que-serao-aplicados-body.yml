  6.4.1.6. O que deve constar do MO.

  a. O MO deve ter procedimentos para garantir que um tripulante obtenha ao menos:

  i. 8 horas consecutivas de oportunidade de sono (na base ou fora da base) dentro das

  12 horas imediatamente anteriores ao início de uma jornada, sobreaviso ou

  reserva;

  ii. 8 horas consecutivas de oportunidade de sono dentro de 10 horas imediatamente

  anteriores ao início de uma jornada seguinte a um sobreaviso finalizado sem um

  chamado, após repouso reduzido, cancelamento ou atraso único de 10 horas ou

  mais.

  b. O MO deve refletir que, se uma jornada estiver atrasada:

  i. os requisitos para a oportunidade de sono relacionam-se com a hora de início da

  jornada de trabalho originalmente prevista, em vez do novo horário de início,

  quando o atraso é inferior a 10 horas;

  ii. quando há um único atraso de 10 ou mais horas, a oportunidade de sono prévio é

  necessária antes do horário de início atrasado.

  6.4.2. Jornada e limites de tempo de voo - tripulação simples [D117.7]

  6.4.2.1. Limitar a duração das jornadas e o tempo de voo dentro de uma jornada é um aspecto

  fundamental do gerenciamento da fadiga. O RBAC nº 117 define limites máximos de

  jornada e de tempo de voo para operações aeromédicas no Apêndice D daquele

  Regulamento.

  6.4.2.2. O MO deve documentar as limitações aplicáveis a todos os tripulantes. Estas limitações

  não podem exceder as contidas no Apêndice D do RBAC nº 117.

  6.4.2.3. A ANAC não aceitará um MO que simplesmente se refira às limitações contidas na
  Lei nºData de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  13.475/17 ou no RBAC nº 117. O MO deve especificar claramente as limitações aplicáveis

  aos seus tripulantes; estes tornam-se limites "prescritivos". Esse requisito permite que
  todos

  os tripulantes estejam cientes de suas limitações.

  6.4.2.4. O risco de fadiga pode não ser suficientemente gerenciado com base apenas em limitações

  das horas de jornada e na programação de repousos de duração mínima adequada. Após a

  aplicação desses limites, pode haver necessidade do operador controlar o risco de fadiga

  devido a fatores como:

  a. variações individuais;

  b. ambiente operacional;

  c. horários de trabalho (durante a noite e nas janelas de baixa do alerta, por exemplo);

  d. carga de trabalho (entre outros fatores).

  Variações individuais podem assumir diferentes formas, tais como:

  • o tripulante está matriculado em um curso superior de ciências aeronáuticas, por

  exemplo;

  • o tripulante possui cargos administrativos na empresa aérea, devendo coordenar

  tais tarefas com as atividades de voo.

  6.4.2.5. O RBAC nº 117 possui um requisito incorporado para identificação de perigos e

  gerenciamento de riscos para o Apêndice D do RBAC nº 117. O efeito disso é que as

  limitações especificadas naqueles apêndices podem precisar ser modificadas por um

  operador para reduzir os riscos de fadiga a um nível aceitável (vide o item 6.3.6 desta
  IS).

  6.4.2.6. O que deve constar do MO.

  a. Procedimentos (um sistema de escala) para garantir que o tripulante não seja escalado

  para uma jornada maior do que o número de horas especificado no MO, que, por sua

  vez, não deve exceder os limites estipulados no Apêndice D do RBAC nº 117. É

  importante que se tenha um cuidado especial com os horários de saída do local de

  descanso e previstos de chegada no aeroporto, a fim de evitar que o tripulante fique em

  vigília no aeroporto sem a respectiva contagem de tempo de jornada.

  b. Procedimentos do setor de escalas, para assegurar que as jornadas sejam designadas de

  tal maneira que forneçam provisão suficiente para o(s) voo(s) pretendido(s), bem como

  um período suficiente para deveres pré e pós-voo que levem em consideração requisitos

  inevitáveis tais como:

  i. horário previsto para embarque do paciente;

  ii. balancear e carregar a aeronave, bem como preparar o manifesto de carga

  correspondente;

  iii. alfândega e imigração (em voos internacionais);

  iv. deveres pré-voo (por exemplo, entrada de dados de voo);

  v. inspeções pré-voo;Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  vi. deveres pós-voo (por exemplo, preenchimento do diário de bordo e tempo de

  serviço, limpeza de aeronaves etc.).

  c. Procedimentos para mensurar e/ou mitigar a fadiga decorrente de treinamentos em

  simulador e/ou trabalhos administrativos e operacionais, principalmente quando estes

  forem associados a uma atividade de voo.

  d. Avaliação de como eventuais atividades voluntárias devem ser enquadradas como

  trabalho e inserção no cômputo da jornada (vide item 6.3.6.9 desta IS).

  e. Os limites no MO não podem exceder os limites na seção D117.7 do RBAC nº 117.

  6.4.3. Aumento dos limites da jornada de trabalho em função de jornada interrompida

  [D117.11]

  6.4.3.1. Fornecer aos tripulantes um período de descanso durante uma jornada é uma maneira
  útil

  de abordar o risco potencial de fadiga e, em contrapartida, permitir um aumento do limite

  desta jornada de trabalho, caracterizando a chamada jornada interrompida. A jornada

  interrompida envolve garantir ao tripulante um ambiente propício para dormir ou descansar

  durante a interrupção e liberá-lo de todas as tarefas durante esse período.

  6.4.3.2. Fazer provisão para jornada interrompida não é obrigatório; no entanto, se o MO
  não incluir

  procedimentos para jornada interrompida, essa prática não é permitida.

  6.4.3.3. O que deve constar do MO:

  a. se um operador optar por incorporar jornada interrompida em suas operações, seu

  manual deve conter procedimentos para assegurar que:

  i. a adequação da acomodação atende ao padrão mínimo. Para tanto, deverá

  considerar que:

  A. existe um padrão diferente para acomodações para dormir (repouso) e

  acomodações para descansar (reserva). O padrão para cada um pode ser

  encontrado na seção de definições do RBAC nº 117;

  B. a casa do tripulante é considerada adequada, sendo da responsabilidade do

  tripulante a manutenção como acomodação para repouso;

  C. locais diferentes da casa, informados pelo tripulante como adequados para

  acomodação para reserva ou repouso, podem justificar casos de dispensa

  de hotel, sendo da responsabilidade do tripulante a manutenção como

  acomodação para repouso;

  D. os locais de repouso e descanso indicados pelo operador devem ser

  avaliados para assegurar a conformidade com o RBAC nº 117 (por

  exemplo, hotéis). Isso significa reavaliar o padrão periodicamente ou

  quando o operador tiver motivos para acreditar que pode haver um

  problema com o padrão fornecido;

  ii. haja tempo real suficiente alocado na escala para o tripulante deslocar-se de e para

  o local adequado para dormir ou descansar durante a interrupção e ainda ter tempo

  suficiente nesse local para cumprir os requisitos mínimos (vide especialmente oData de emissão:
  11/10/2024

  IS nº 117-006

  Revisão A

  parágrafo D117.11(d) do RBAC nº 117);

  iii. os tripulantes não sejam perturbados durante o período de descanso relacionado à

  jornada interrompida. Isso significa ter políticas e procedimentos específicos que

  abordem possíveis fontes de distúrbio. Como exemplo, a existência de protocolos

  de comunicação para gerenciar como o tripulante é contatado e como ele configura

  seu celular para proteger-se contra distúrbios inadvertidos de chamadas recebidas;

  iv. as jornadas interrompidas sejam atribuídas a um tripulante como parte da escala

  de trabalho a fim de fornecer ao tripulante a quem ela se aplica uma oportunidade

  razoável de planejar seu descanso ou repouso e vida social antes da sua próxima

  jornada;

  v. o setor responsável informe aos tripulantes em reserva e sobreaviso que poderão

  ser acionados para uma jornada interrompida, se tal prática fizer parte da política

  do operador;

  vi. o tempo transcorrido durante o período de descanso ou repouso da jornada

  interrompida seja sempre considerado como um trabalho e seja incluído como

  parte da jornada;

  vii. todo o período mínimo de acesso a uma acomodação adequada deve ser alcançado

  antes do final do período de jornada de trabalho máxima (sem considerar o

  aumento devido à jornada interrompida) antes que seja permitido um aumento no

  limite da jornada de trabalho;

  Importante para o operador considerar:

  • A gestão da mudança na troca de acomodações (mudança de hotel, por exemplo);

  • Um procedimento para o tripulante fornecer feedback sobre o padrão das

  acomodações consideradas adequadas para dormir (repouso) ou descansar

  (reserva); e

  • Revisão do padrão das acomodações adequadas para dormir ou descansar em um

  processo periódico formal.

  b. os tipos de acomodações para a interrupção de jornada:

  i. acomodações para reserva (vide definição no RBAC nº 117) para interrupções de

  mais de 3 e menos de 6 horas consecutivas entre o período de 06:00 a 00:00;

  ii. acomodações para repouso (vide definição no RBAC nº 117) para interrupções de

  6 a 10 horas, a qualquer hora do dia, ou quando alguma parte da interrupção

  ocorrer entre 00:00 e 06:00 (madrugada);

  c. que, se forem atendidos os requisitos acima, a jornada total pode ser acrescida de até

  metade do tempo de interrupção;

  d. que, depois de aplicar o aumento de até metade do tempo da interrupção, a jornada de

  trabalho máximo (jornada interrompida total) não seja superior a 16, em que a

  interrupção é contada como jornada;

  e. que o tempo remanescente da jornada interrompida, após o período de descanso ouData de
  emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  repouso, não ultrapasse 6 horas;

  f. que, para efeito de contagem de tempo de interrupção, não são considerados os tempos

  necessários para atividades pós-voo, pré-voo e deslocamento até o local de descanso ou

  repouso, não podendo ser o tempo total previsto para essas atividades menor do que 30

  minutos;

  g. que, para efeito de cálculo de repouso após a jornada interrompida, devem ser

  considerados os requisitos estabelecidos na seção D117.23 do Apêndice D do RBAC nº

  117;

  h. jornadas interrompidas devem ser consignadas no diário de bordo da aeronave com a

  informação de quais foram os horários reais de interrupção e retomada da jornada, tipo

  de acomodação oferecida pelo operador (reserva ou repouso), e assinatura do piloto em

  comando.

  6.4.4. Aumento da jornada e tempo de voo em operações com tripulação composta ou de

  revezamento [D117.13]

  6.4.4.1. Aumentar a tripulação é uma estratégia que o operador pode utilizar para auxiliar
  no

  gerenciamento do estado de alerta da tripulação. Com os procedimentos apropriados no

  MO e instalações adequadas de descanso a bordo, a tripulação pode se revezar nos períodos

  de descanso durante o voo e utilizar as instalações para gerenciar seu estado de alerta
  e

  mitigar os efeitos da fadiga.

  6.4.4.2. Na definição dos procedimentos para descanso a bordo, o operador deve considerar
  os

  efeitos da inércia do sono. A inércia do sono afeta a atenção e o desempenho é reduzido,

  por isso, ela deve ser incluída como um período de inatividade operacional do tripulante

  após o sono. Normalmente, 15 minutos se mostram suficientes para que a pessoa se sinta

  funcional novamente; entretanto, este tempo pode ser maior dependendo de características

  pessoais e situacionais.

  6.4.4.3. Os tripulantes têm diferentes necessidades de sono e diferentes efeitos de desempenho
  de

  contramedidas (por exemplo, uso de cafeína), cada um dos quais deve ser levado em

  consideração. A tripulação adicional ainda ficará fatigada mesmo quando não estiver em

  uma função operacional. O operador deve garantir que os tripulantes recebam treinamento

  sobre o uso apropriado de tripulações aumentadas e instalações de descanso a bordo.

  6.4.4.4. Os limites aumentados da tripulação são em parte determinados pela classe de acomodação

  de descanso da tripulação disponível a bordo da aeronave. As acomodações de descanso da

  tripulação necessitam de um desenho e consideração cuidadosos, a fim de permitir o

  cumprimento dos requisitos adequados de descanso e sono em voo para a tripulação.

  a. As classes de acomodações de descanso da tripulação são definidas no parágrafo

  117.3(b)(1) do RBAC nº 117;

  b. Para o Apêndice D do RBAC nº 117 (vide D117.13(b) e A117.11):

  i. Deve ser assegurado aos tripulantes, quando estiverem em voo com tripulação

  composta, descanso a bordo da aeronave, em acomodação pelo menos Classe 2; e

  ii. Deve ser assegurado aos tripulantes, quando estiverem em voo com tripulação de

  revezamento, descanso a bordo da aeronave, em acomodação pelo menos Classe

  1.Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  6.4.4.5. Ao determinar as especificações apropriadas das instalações de descanso a bordo
  das

  aeronaves, os seguintes fatores deveriam ser levados em consideração (ver AC 117-001 da

  FAA para maiores detalhes):

  a. alívio das restrições posturais do trabalho (por exemplo, períodos prolongados sentados

  e afivelados a um assento);

  b. ruído (no sentido de evitá-lo ao máximo);

  c. configurações físicas das próprias instalações (no sentido de que as instalações sejam

  amplas o suficiente para acomodar os tripulantes com conforto, possibilitando que ele

  possa se sentar e se virar para poder “dormir de lado”, e que tenha comprimento o

  suficiente para que seus pés não fiquem acomodados de forma desconfortável, isto é,

  flexionados);

  d. localização dos locais de descanso;

  e. necessidades de privacidade;

  f. iluminação (no sentido de ser controlável pelo tripulante em descanso, possibilitando

  total escuridão);

  g. vibração (no sentido de evitá-lo ao máximo);

  h. microclima (fluxo de ar, ventilação, temperatura, gradiente de temperatura, umidade);

  i. higiene (evitar patógenos, proteção);

  j. procedimentos para garantia da comunicação entre os tripulantes (por exemplo:

  existência de um interfone no local de descanso);

  k. mecanismos de se afivelar aos assentos (por exemplo: os cintos devem ser aprovados

  pela gerência de certificação da aeronave da ANAC);

  l. condições de acesso (por exemplo: as condições de acesso devem ser aprovadas pela

  gerência de certificação da aeronave da ANAC);

  m. procedimentos de evacuação (por exemplo: os procedimentos de evacuação devem ser

  aprovados pela gerência de certificação da aeronave da ANAC); e

  n. requisitos de equipamentos de emergência disponíveis nas instalações (por exemplo: os

  requisitos de equipamentos de emergência disponíveis nas instalações devem ser

  aprovados pela gerência de certificação da aeronave da ANAC).

  6.4.4.6. Além do informado nos itens anteriores, o operador aeromédico estar atento aos
  tópicos

  abaixo.

  a. Para os pilotos que realizarão o pouso, sugere-se que o descanso a bordo ocorra na

  segunda metade da jornada, ou seja, mais próximo ao momento do pouso. Entretanto,

  dependendo das necessidades pessoais, horários de decolagem e pouso previstos e outras

  circunstâncias, os momentos apropriados poderão variar, de modo que o operador

  preveja que a própria tripulação tenha autonomia para rearranjá-los.

  b. Se possível, o número de etapas para tripulações compostas e de revezamento deve ser

  limitado a uma ou duas, de modo que uma operação desse tipo seja realizada apenas em

  jornadas com duração suficientemente longas para permitir descansar ou dormir.Data de emissão:
  11/10/2024

  IS nº 117-006

  Revisão A

  6.4.4.7. O que deve constar do MO.

  a. Se um operador optar por incorporar operações com tripulação composta ou de

  revezamento e a fim de obter um aumento na jornada de trabalho, os limites no MO não

  podem exceder os limites estabelecidos na Tabela D.3 da seção D117.13 do Apêndice

  D do RBAC nº 117.

  b. Procedimentos para a designação de tripulantes para uma tripulação composta ou de

  revezamento devem prever que a tripulação que inicie e termine a jornada seja a mesma.

  Importante

  Por razões de segurança, esta é uma condição crítica. Se, por exemplo, uma

  emergência médica exigisse o desembarque de um tripulante durante a jornada de

  trabalho, para que o voo continuasse, todos os tripulantes deveriam ser substituídos

  por uma nova tripulação, iniciando uma nova jornada de trabalho.

  Considera-se que o gerenciamento de diferentes limites da jornada de trabalho e

  duração do tempo de serviço e de voo, bem como a alocação de descanso durante o

  voo, para cada tripulante é potencialmente muito difícil para uma tripulação e, em

  particular, para o comandante gerenciar com segurança. Dada a provável pressão

  para realizar o voo, ter um ou mais membros da tripulação com um nível de fadiga

  significativamente diferente poderia criar disparidades entre os tripulantes (por

  exemplo, na decisão sobre extensões de jornada).

  As extensões devem ser uma decisão que considere o nível de fadiga de cada tripulante

  de forma independente; no entanto, quando apenas um tripulante suportaria a

  extensão, os outros membros da equipe podem não apoiar a decisão de estender a

  jornada.

  Além disso, um mitigador de fadiga para uma tripulação é a suposição de que, se um

  tripulante está fatigado em um determinado grau, os demais provavelmente também o

  estão. Quando um membro da equipe identifica que está cansado, ele deve discutir /

  gerenciar tal ponto com seus colegas e / ou começar a monitorar o restante da

  tripulação mais de perto.

  Se uma tripulação inclui pessoas com jornadas de trabalho significativamente

  diferentes, entender quando cada um está fatigado torna-se muito mais difícil e menos

  provável de ser gerido de forma eficaz. Considera-se que esse nível adicional de

  complexidade deveria ser gerenciado de acordo com um SGRF.

  c. Para empregar tripulações compostas e de revezamento, o MO deve detalhar os

  procedimentos para tais tipos de tripulação, os quais devem incluir:

  i. a designação de um piloto responsável por tomar decisões de comando em todos

  os momentos em que o piloto-em-comando (PIC) estiver utilizando descanso em

  voo;

  ii. um procedimento para um briefing abrangente antes dos tripulantes se revezarem

  durante o voo;

  iii. um método para tratar o descanso a bordo de forma que seja possível priorizar

  eventual necessidade de otimização dos níveis de experiência da tripulação na

  cabine de comando para o gerenciamento de ameaças operacionais planejadas e

  não planejadas;Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  iv. designação de um tripulante responsável por agendar o descanso da tripulação em

  voo e reavaliar os horários de descanso da tripulação (em caso de circunstâncias

  operacionais imprevistas, especialmente desvios em voo ou retorno de voo);

  v. gestão dos possíveis efeitos da inércia do sono no desempenho ao despertar do

  sono profundo; e

  vi. procedimentos que assegurem que outros membros da tripulação estejam cientes

  da necessidade de respeitar o requisito de repouso em voo, evitando interrompê-

  lo e reduzindo o ruído desnecessário que pode perturbar o sono dos tripulantes que

  estão no período de descanso a bordo.

  6.4.5. Atraso no horário de apresentação e cancelamento [D117.15]

  6.4.5.1. Atraso na apresentação [D117.15(a), (b) e (c)].

  a. A seção D117.15 contém requisitos sobre atrasos no horário de apresentação do

  tripulante. Atrasar o horário de apresentação pode resultar em períodos prolongados de

  vigília que, se não forem adequadamente gerenciados, possuem o potencial de causar

  impacto no risco de fadiga.

  b. Se o operador, no período anterior ao início de uma jornada, tomar conhecimento de

  circunstâncias que levem a um atraso no horário de apresentação do tripulante escalado

  para essa jornada, então é razoável que o horário de apresentação do tripulante seja

  atrasado.

  c. Se um operador aéreo informar ao tripulante antes que este deixe o seu local de repouso:

  i. sobre um atraso de até 3 horas, considera-se que a jornada do tripulante se inicia

  no novo horário de apresentação comunicado ao tripulante; e

  ii. sobre um atraso de mais de 3 horas, considera-se que a jornada do tripulante se

  inicia três horas após o horário de apresentação original.

  d. Se o operador aéreo não informar ao tripulante antes que este deixe o seu local de

  repouso, então considera-se que a jornada do tripulante se inicia como originalmente

  planejado.

  e. O tempo de atraso deve ser considerado como sobreaviso, aplicando-se, portanto, os

  limites de sobreaviso previstos na Seção D117.19 (vide ainda o item 6.4.7 adiante).

  6.4.5.2. Cancelamento da jornada [D117.15(d)].

  a. Um cancelamento ocorre quando a jornada do tripulante é atrasada e o operador informa

  ao tripulante que o voo não irá mais ocorrer.

  b. Nesta situação o tripulante deve ter um período de repouso de pelo menos 10 horas

  consecutivas, a partir do momento em que ele é informado do cancelamento, antes de

  novamente receber uma jornada.

  c. O tripulante tem a obrigação de usar o seu repouso e o período de oportunidade de sono

  para estar suficientemente descansado e alerta para desempenhar suas funções com

  segurança na jornada de trabalho.Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  6.4.5.3. O que deve constar do MO:

  a. Uma jornada é considerada atrasada se o seu início for postergado em relação ao horário

  originalmente previsto e isto for comunicado ao tripulante antes deste deixar o seu local

  de repouso. O tempo de atraso é contado a partir deste horário até o novo horário de

  apresentação.

  b. O operador deve prever procedimentos para atrasos no horário de apresentação de um

  tripulante e cancelamento da jornada, seguindo as orientações dos itens 6.4.5.1 e 6.4.5.2

  anteriores.

  c. O operador deve deixar claro em seu manual como é feita a contagem do tempo de

  atraso. Por exemplo, pode-se inicialmente exigir um atraso de 2 horas e, em seguida,

  atrasar o tempo de início em mais 1,5 horas. Para os fins de determinar a jornada de

  trabalho máxima, isto representa um atraso total de 3,5 horas e deve ser tratado como

  um atraso de mais de 3 horas, em vez de dois atrasos cada um com menos de 3 horas.

  d. O operador deve descrever a maneira pela qual os tripulantes serão notificados do atraso

  antes de deixar sua acomodação. Devem-se observar os procedimentos descritos no item'
