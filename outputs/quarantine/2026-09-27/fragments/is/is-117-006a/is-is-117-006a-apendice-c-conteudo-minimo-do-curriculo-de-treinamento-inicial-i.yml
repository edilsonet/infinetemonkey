text: 'i) Identificar a estrutura e o conteúdo de um registro apropriado para ajudar a registrar

  as informações do sono.

  ii) Desenvolver uma apreciação dos benefícios de um registro do sono na identificação

  de hábitos negativos ou pequenos déficits de sono repetidos e na formação de hábitos

  de sono benéficos.

  Aula 6

  Compreender o gerenciamento de fadiga do operador

  1) Compreender a estrutura das normas envolvidas com a Fadiga:'
