title: APÊNDICE E desta IS para exemplos de reporte de ocorrência de fadiga.
text: 'APÊNDICE E desta IS para exemplos de reporte de ocorrência de fadiga.

  7.1.4. Saúde e bem-estar

  7.1.4.1. Faz parte da responsabilidade individual de cada tripulante o monitoramento de
  sua saúde

  e a busca por tratamento adequado quando necessário. São exemplos:

  a. problemas de saúde a curto prazo (agudos) ou crônicos;

  b. predisposições genéticas;Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  c. nutrição;

  d. hidratação; ou

  e. distúrbios do sono.

  7.1.4.2. Há uma ampla gama de distúrbios do sono que podem gerar fadiga, afetando as funções

  circadianas, a quantidade e a qualidade do sono. É de responsabilidade do tripulante buscar

  diagnóstico médico quando se identificar com os sinais e sintomas, bem como seguir o

  tratamento, se for o caso.

  Os distúrbios do sono variam em gravidade, desde ocasionais e inconvenientes (por

  exemplo, jet lag) até crônicos e potencialmente com risco de vida (por exemplo,

  síndrome da apneia obstrutiva do sono). Os tripulantes têm o dever de monitorar e

  gerenciar quaisquer problemas de saúde que possam afetar sua aptidão para o

  trabalho, o que pode incluir o contato com um especialista médico. Os tripulantes

  devem estar cientes de que as dificuldades do sono podem existir ou podem se

  desenvolver no futuro e que elas devem ser tratadas de acordo, de modo que não afetem

  a segurança das operações.

  7.1.5. Carga de Trabalho

  7.1.5.1. Um dos tópicos principais ao considerar os fatores humanos e o desempenho humano
  nos

  sistemas de aviação é o gerenciamento da carga de trabalho. Embora existam várias

  conceituações de carga de trabalho, a carga de trabalho mental pode ser definida como uma

  função das demandas sob responsabilidade da tripulação e das capacidades da tripulação

  para atender a essas demandas.

  7.1.5.2. O gerenciamento de carga de trabalho para a tripulação requer consideração de:

  a. quanto a tarefa demanda de atenção;

  b. qual a capacidade de processamento das pessoas acerca da tarefa;

  c. se há tarefas duplas ou múltiplas a serem desempenhadas; e

  d. como as capacidades mentais estão sendo utilizadas.

  7.1.5.3. Embora o gerenciamento de carga de trabalho em si seja importante ao minimizar
  o risco

  de erro humano, também é provável que a carga de trabalho e a natureza das tarefas

  realizadas afetem a fadiga da tripulação. Até hoje, poucos estudos consideraram como a

  carga de trabalho influencia o estado de alerta (ou vice-versa); no entanto, é provável
  que

  sua interação exija consideração e gerenciamento.

  7.1.5.4. Atualmente, os fatores relacionados à carga de trabalho considerados mais evidente
  são a

  quantidade de etapas de voo cumpridas na mesma jornada (no sentido de, quanto mais

  etapas, maior a carga de trabalho) e a duração da jornada (neste caso, especialmente as

  maiores de 8 horas).

  7.1.5.5. Técnicas típicas para gerenciar a carga de trabalho enquanto em serviço incluem:

  a. diminuição de tarefas;

  b. priorização de tarefas;Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  c. delegação de tarefas;

  d. rotação de tarefas; e

  e. rotação de pessoal.

  7.1.5.6. Também é importante estar ciente do nível ideal de estresse ou excitação de uma
  pessoa,

  necessário para um desempenho ideal:

  a. reconhecer as vantagens do estresse e engajamento em uma tarefa;

  b. ter atitudes realistas em relação ao estresse entendendo que as pessoas reagem

  diferentemente a situações estressantes (por exemplo, emergências);

  c. usar comunicação eficaz com os colegas; e

  d. monitorar e observar comportamentos que possam indicar uma mudança no nível de

  carga de trabalho de uma pessoa (por exemplo, segurar os controles com firmeza,

  fixação no horizonte artificial, túnel com foco em uma tela).

  7.1.5.7. A carga de trabalho também é um fator cada vez mais importante para modelos

  biomatemáticos de previsão de desempenho. Vários modelos biomatemáticos de fadiga no

  mercado estão atualmente investigando e incorporando os efeitos da carga de trabalho no

  estado de alerta em seu conjunto de variáveis preditivas.

  7.1.5.8. No geral, os dados existentes sugerem que as relações entre carga de trabalho,
  desempenho

  e fadiga subjetiva são provavelmente complexas e que pesquisas adicionais são desejáveis.

  Para o pessoal da aviação, é importante considerar e gerenciar os efeitos da carga de

  trabalho e da fadiga individualmente ao gerenciar o risco, bem como a relação de interação

  que pode estar presente entre eles.

  7.1.6. Estratégias de mitigação da fadiga

  7.1.6.1. Um tripulante pode gerenciar a fadiga antes, durante e depois das jornadas de trabalho,

  empregando uma gama de estratégias de mitigação de fadiga que funcionem para suas

  necessidades pessoais. No gerenciamento de fadiga, a ferramenta mais potente é a proteção

  ao sono. Por isso, é importante estabelecer hábitos de sono eficazes, realizando a chamada

  higiene do sono, tais como:

  a. programando os horários para dormir;

  b. programando os horários para comer em função do horário para dormir (de modo que a

  digestão da refeição não interfira no sono e que não seja necessário levantar para comer);

  c. tentando realizar uma atividade tranquila antes de dormir;

  d. estabelecendo uma rotina para dormir, sempre que possível;

  e. não comendo ou bebendo mais que o habitual antes de dormir (especialmente 3 horas

  antes do sono pretendido);

  f. avaliando se exercícios físicos antes de dormir favorecem ou prejudicam o sono (vide

  7.1.6.3);

  g. saindo da cama se não conseguir dormir, em busca de atividades calmas, não excitantes;

  h. usando técnicas de relaxamento;Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  i. garantindo um ambiente de sono propício ao sono, especificamente que seja fresco,

  escuro e silencioso, com cama e travesseiro confortáveis.

  7.1.6.2. Uma das contramedidas de fadiga mais eficazes é cochilar; no entanto, é importante
  lembrar

  que o cochilo não deve ser considerado como uma alternativa para uma noite de sono

  regular. O cochilo pode ser útil ao suplementar um sono breve ou de baixa qualidade.

  Apenas 15 a 20 minutos podem aumentar o desempenho e o estado de alerta

  temporariamente. Deve-se ter cuidado ao planejar o cochilo, pois o cochilo por mais de 45

  minutos pode resultar em maior inércia do sono.

  7.1.6.3. O exercício físico também é um mitigador de risco de fadiga benéfico, pois melhora
  a

  energia e a resistência, melhora o humor, alivia o estresse e resulta em um sono mais longo

  e mais tranquilo. Entretanto, exercícios físicos aeróbicos aceleram o metabolismo, de modo

  que idealmente devem ser evitados antes de 3 horas do horário destinado ao sono. Este

  intervalo pode ser menor para pessoas acostumadas a treinar, principalmente à noite, de

  modo que a avaliação demanda autoconhecimento. De qualquer forma, não se deve

  acreditar que logo depois de uma atividade física, especialmente aeróbica, o sono será

  propiciado rapidamente.

  7.1.6.4. Nutrição e hidratação adequadas também são importantes para o gerenciamento e

  prevenção da fadiga. Idealmente, o tripulante deve:

  a. ter uma dieta equilibrada;

  b. comer regularmente;

  c. consumir lanches saudáveis;

  d. tomar café da manhã;

  e. fazer refeições planejadas;

  f. beber água regularmente; e

  g. evitar as refeições noturnas (que resultam em uma digestão mais lenta).

  7.1.6.5. Outra contramedida de fadiga popular é o uso da cafeína como estimulante. A cafeína
  pode

  melhorar o estado de alerta temporariamente, leva de 15 a 30 minutos para surtir efeito
  e

  pode durar até 5 horas; no entanto, é importante considerar que existem diferenças

  individuais em termos dos efeitos da cafeína, que a tolerância e a abstinência podem se

  desenvolver, e que o uso deve ser evitado antes de dormir. A cafeína deve ser usada quando

  seu efeito tiver o maior impacto (ou seja, antes da descida e do pouso).

  7.1.6.6. Para aumentar a qualidade do sono, o álcool deve ser evitado antes de dormir. Embora

  culturalmente se acredite que o álcool favoreça o sono, na realidade ele prejudica o sono

  restaurador. Medicamentos que auxiliam o sono devem ser utilizados com cuidado e apenas

  sob orientação médica, pois podem levar à sonolência, confusão e esquecimento. A nicotina

  também deve ser evitada, pois é um estimulante que pode interferir no início e na

  manutenção do sono.

  7.1.6.7. Uma maneira ideal dos tripulantes acompanharem a qualidade do sono ou a eficácia
  das

  contramedidas de fadiga usadas é manter um registro do sono ou um diário do sono.

  Pesquisas sugerem que as pessoas (incluindo os tripulantes) tendem a superestimar a

  quantidade de sono obtido; portanto, um registro diário pode ajudar a ter uma lembrançaData
  de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  precisa, e um histórico de sono entre períodos de folga, por exemplo. Um diário do sono

  pode incorporar:

  a. hora de dormir;

  b. hora do despertar;

  c. tempo na cama;

  d. humor ao despertar;

  e. nutrição / consumo de álcool do dia anterior;

  f. qualidade do sono (por exemplo, número de despertares percebidos durante a noite); e

  g. ambiente do sono (por exemplo, uma cama confortável, ventilação, iluminação, ruído).

  7.1.6.8. É de responsabilidade do tripulante levar em conta suas necessidades pessoais,
  ergonômicas

  e ambientais ao configurar as acomodações para repouso em sua casa.

  7.1.7. Fusos horários

  7.1.7.1. A responsabilidade de gerenciar os efeitos das mudanças de fuso horário é compartilhada

  entre o operador e o tripulante. O operador deve fornecer condições de repouso e períodos

  de adaptação necessários, bem como oferecer treinamento sobre o assunto, ensinando

  ferramentas de avaliação de estado de alerta e contramedidas de fadiga.

  7.1.7.2. Por sua vez, o tripulante tem a obrigação de aplicar essas informações à sua situação
  ao

  decidir sua aptidão para o trabalho. Os tripulantes devem estar cientes de seus requisitos
  de

  adaptação de fuso horário pessoal. Caso um tripulante sinta que não está apto para o

  trabalho após um período de folga ou após o cruzamento de fusos horários, deve relatar tal

  fato ao operador para que este possa avaliar se suas limitações e políticas de fadiga são

  adequadas.

  7.1.8. Tripulações compostas e de revezamento

  7.1.8.1. Com as instalações adequadas de descanso em voo, a tripulação pode revezar os períodos

  de descanso e compartilhar acomodações para gerenciar sua fadiga. É importante que as

  tripulações considerem que, com uma equipe aumentada (tripulação composta ou de

  revezamento), haverá variabilidade em termos de alerta e ajuste circadiano (ou seja, fuso

  horário / relógio biológico) entre os tripulantes. Além disso, todos eles terão diferentes

  necessidades de sono e diferentes efeitos quanto ao desempenho das contramedidas (por

  exemplo, uso de cafeína). Ao utilizar acomodações de descanso em voo, um tripulante deve

  fazê-lo de forma inteligente, em vez de fazer algo potencialmente estressante, o tripulante

  deve aproveitar o tempo para relaxar e tentar dormir.

  7.1.8.2. Existem vários estudos que analisam os efeitos da inércia do sono no desempenho,

  particularmente ao despertar do sono profundo. O operador e os tripulantes devem estar

  cientes e gerenciar o efeito da inércia do sono nas operações de voo (vide 6.4.4.2).

  7.2 Informações do tripulante que devem ser repassadas ao operador

  Os tripulantes devem considerar como seus arranjos de vida e tempo de deslocamento para

  o trabalho podem afetar seus níveis de fadiga. Quaisquer condições potencialmente

  problemáticas devem ser informadas ao operador se elas tiverem, ou provavelmente viremData
  de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  a ter, um impacto no desempenho operacional.

  7.2.1. Moradia

  7.2.1.1. A escolha da moradia pode ter um impacto nos níveis de fadiga dependendo:

  a. locais de moradia compartilhados ou alternados;

  b. tempos de deslocamento longos e variáveis (por exemplo, devido à distância e ao

  congestionamento de tráfego);

  c. ambientes barulhentos ou interrupções de descanso em casa (por exemplo, obras ou

  escolas nas proximidades, ruído do tráfego, paredes não isoladas para sons etc.); ou

  d. ambientes ou áreas de descanso excessivamente iluminados (por exemplo, iluminação

  urbana brilhante, coberturas de luz inadequadas durante os períodos de descanso diurno).

  Os tripulantes podem achar que certas situações de vida únicas podem melhorar o

  estado de alerta e minimizar o risco de fadiga. Em alguns casos, pode ser benéfico

  viver longe de uma base contratual, em vez de mais perto. Um exemplo é onde a base

  contratual é continuamente ruidosa ou excessivamente iluminada durante períodos de

  sono / repouso ou durante a noite. Os tripulantes devem considerar seus arranjos de

  vida e quaisquer mudanças relação a qualquer impacto que possa ter sobre seu estado

  de alerta. Se surgirem situações potencialmente problemáticas, isso deve ser

  informado ao operador.

  7.2.2. Emprego externo e outras atividades

  7.2.2.1. Os tripulantes têm a obrigação de gerenciar quaisquer atividades externas pessoais
  para

  garantir que não afetem seus níveis de fadiga durante as operações. Atividades externas

  como:

  a. obrigações domésticas;

  b. atividades de lazer;

  c. segundo emprego ou outras atividades;

  d. obrigações familiares;

  e. trabalho voluntário realizado fora do horário de trabalho;

  f. pilotagem noturna;

  g. voos privados não-recreativos;

  h. trabalho por turnos;

  i. administração de um negócio;

  j. realização de trabalhos que podem levar à desgaste físico ou mental;

  k. estudo ou cursos;

  l. dirigir.

  7.2.3. Voo privadoData de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  7.2.3.1. O tripulante, que realiza voos particulares e atua como tripulante para um operador,
  tem a

  obrigação de declarar seus voos privados realizados em operações não recreativas. As

  operações de voo particulares cobrem uma ampla gama de atividades. Para fins de

  gerenciamento de fadiga, essas atividades podem ser divididas em:

  a. operações privadas recreativas; ou

  b. operações privadas não recreativas.

  7.2.3.2. Uma operação privada recreativa pode ser conduzida por um tripulante e não há limites

  atuais (além dos limites pessoais) que possam ser aplicáveis. No curso normal dos eventos,

  em que faz algum voo privado de recreio em um dia de folga o tripulante deve estar atento

  às políticas do operador para a relação entre fadiga e voos recreativos.

  7.2.3.3. Há indivíduos que realizam voos particulares que não são considerados recreativos
  (isto é,

  trabalho remunerado, voos de translado, ensaios em voo, voos de instrução etc.). Essas

  operações são vistas como mais difíceis de cancelar ou reprogramar e geralmente envolvem

  mais planejamento e complexidade operacional do que um voo recreativo tradicional. Elas

  podem ter um efeito sobre a jornada de trabalho subsequente para o piloto que também é

  empregado por um operador. Nesta situação, deve-se verificar os limites que se aplicam;

  no entanto, uma vez que o tripulante é empregado por um operador, essas atividades devem

  ser declaradas, pois elas farão parte dos limites de tempo de voo cumulativos do tripulante.

  7.2.4. Cultura de segurança operacional positiva

  7.2.4.1. A fim de manter uma cultura de segurança operacional aberta e justa, os tripulantes
  devem

  divulgar quaisquer situações que os estejam afetando, ou possam afetá-los no futuro, seu

  estado de alerta e conformidade com o RBAC nº 117. A divulgação também é consistente

  com as melhores práticas dos princípios de segurança e gerenciamento de riscos.

  7.2.4.2. Os tripulantes têm a obrigação de contribuir para essa cultura de segurança saudável
  e

  manter uma forte cultura de elaboração de reportes, o que, por sua vez, permite que ao

  operador gerenciar o risco de forma preditiva e proativa.

  7.2.4.3. Os funcionários devem ser capazes de divulgar informações e discutir com o operador

  situações que possam gerar fadiga e afetar o estado de alerta em um ambiente aberto,

  comunicativo e confidencial, sem sentir medo de penalidade.Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A'
