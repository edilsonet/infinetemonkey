  APÊNDICE C. INDICADORES DE PERFORMANCE DE SEGURANÇA

  RELACIONADOS ÀS JORNADAS

  C.1. Os operadores devem manter registros de escalas e tempos de voo, períodos de jornada
  e

  períodos de descanso dos membros da tripulação. Dados que detalham os horários reais de

  trabalho dos membros da tripulação podem ser comparados com o cronograma original de

  trabalho para gerar SPIs relacionados a escala e jornadas, juntamente com seus valores

  aceitáveis, ajudando a identificar momentos em escalas e atribuições em que a fadiga pode

  ser maior do que o esperado.

  C.1.1. A Tabela a seguir contém alguns exemplos de SPIs relacionados a escalas e jornadas,

  juntamente com suas metas.

  SPI Valores aceitáveis (metas)

  Frequência com que a jornada máxima prevista

  (por exemplo, de 13 horas) é ultrapassada

  A jornada máxima não será excedida em mais

  de 5% dos dias em qualquer período de 28 dias.

  Número de jornadas de voo encerrando-se [x]

  minutos depois do programado.

  Se o horário de apresentação for anterior às

  05h00, extensões de jornada de [x] minutos ou

  mais não devem ocorrer em mais de [y]% dos

  dias em qualquer período de 28 dias.

  Frequência em que o intervalo mínimo entre

  jornadas é reduzido

  Aceitável em não mais do que [x]% dos voos em

  qualquer período de 28 dias.

  Não é aceitável operar na próxima jornada.

  Com que frequência as jornadas terminam na

  janela de baixa do alerta no ritmo circadiano

  (WOCL)

  Para tripulações simples, nenhuma jornada com

  duração superior a [x] horas será programada

  para terminar na WOCL. Atrasos são aceitáveis

  em não mais do que 5% dos voos em qualquer

  período de 28 dias.

  Número de combinações de jornadas

  identificadas como de alto risco de fadiga.

  Por exemplo: não mais do que três jornadas

  consecutivas com início cedo podem ser

  programadas, ou, não mais do que duas jornadas

  consecutivas na madrugada podem ser

  programadas.

  Sem exceções.

  Número de vezes que o tempo de notificação

  para sobreaviso ou para reserva é inferior a [x]

  minutos.

  Não deve exceder [x]% em nenhum período de

  28 dias.Data de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  APÊNDICE D. INDICADORES DE PERFORMANCE DE SEGURANÇA - ESCALAS

  SUBJETIVAS

  D.1.1. Usando-se procedimentos de gerenciamento de risco e de garantia da segurança

  operacional podem ser coletados dados sobre a fadiga dos membros da equipe de voo,

  seja por meio do sistema de relatórios de segurança do operador, por de relatórios de

  fadiga (por exemplo, relatórios de perigo e relatórios de incidentes/acidentes). A partir

  desses relatórios, tendências podem ser monitoradas na forma de Safety Performance

  Indicators (SPIs) relacionados à fadiga, como:

  D.1.1.1. Número e severidade dos relatórios de fadiga.

  D.1.1.2. Número de incidentes relacionados à fadiga.

  D.1.1.3. Números de voos ou jornadas não realizados devido a fadiga.

  D.1.2. SPIs baseados em dados de fadiga coletados

  D.1.2.1. Relatórios de fadiga podem fornecer dados sobre histórico de sono e níveis de fadiga
  por

  autorrelato, usando escalas subjetivas de fadiga e sonolência. Se o operador tiver

  preocupações específicas sobre o nível de risco de fadiga associado a um aspecto de um

  cronograma ou rota, essas medidas podem ser usadas para coletar dados em momentos

  específicos durante um período de trabalho.

  D.1.2.2. SPIs que podem ser gerados e monitorados usando essas medidas são apresentados
  na

  tabela a seguir:

  Medida / Indicador SPIs (um voo por jornada*)

  Histórico de sono e vigília monitorados

  através de diários de sono

  1) Sono nas últimas 24h antes do início de uma

  jornada

  2) Tempo acordado no início da jornada

  3) Sono nas últimas 24h antes do top of descent

  (TOD) (incluindo sono a bordo para

  tripulações aumentadas)

  4) Tempo acordado no TOD

  Fadiga subjetiva, conforme escala de Samn-

  Perelli

  1) Avaliação de fadiga pré-voo

  2) Avaliação de fadiga no TOD

  Sonolência subjetiva, conforme escala

  Karolinska

  1) Avaliação de sonolência pré-voo

  2) Avaliação de sonolência no TOD

  (*) Observação: para jornadas que envolvam vários segmentos de voo, pode ser apropriado
  medir

  SPIs no início e no final da jornada, uma vez que os membros da tripulação podem não ter
  tempo

  suficiente para avaliar sua fadiga e sonolência antes do TOD (top of descent) em voos curtos.
  Também

  pode ser apropriado ter SPIs relacionados à carga de trabalho (por exemplo: número de etapas
  de voo)

  em operações com várias etapas.Data de emissão: 29 de outubro de 2024 IS nº 117-007

