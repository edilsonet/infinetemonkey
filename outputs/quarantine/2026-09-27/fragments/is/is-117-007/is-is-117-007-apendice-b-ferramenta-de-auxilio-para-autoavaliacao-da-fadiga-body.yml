  Revisão A

  para continuar com a jornada, prossiga para a Questão 3.

  Nota:

  A contagem das últimas 48 horas é usada nesta tabela porque ela foca quase

  inteiramente na fadiga aguda ou transitória, e a suposição é que o tripulante estava

  bem descansado antes deste ponto. Se o tripulante tiver um período mais longo de sono

  interrompido ou restrito, deve-se considerar que essa fadiga cumulativa aumentará o

  risco de fadiga. Um aumento da fadiga cumulativa aumentará o risco associado a

  períodos de sono subsequentes mais curtos do que os identificados na tabela. Os

  tripulantes devem colocar mais peso em qualquer sintoma (resposta à Questão 1) e

  adotar uma abordagem mais conservadora em relação a qualquer risco elevado

  identificado pela utilização dessa tabela.

  B.2.3. Questão 3: A que horas ocorre a presente jornada?

  a. A Questão 3 envolve o tripulante classificar a sua jornada com base na hora do dia em

  que ela ocorre. O resultado cai em uma das três faixas de risco baixo, moderado ou

  elevado.

  b. Continua-se então para a Questão 4.

  B.2.4. Questão 4: Qual o nível de risco operacional associado à jornada?

  a. A Questão 4 envolve o tripulante classificar o nível de risco operacional associado à

  jornada.

  b. Entende-se que o acúmulo de fadiga acabará por diminuir o desempenho e aumentar a

  taxa de erro, a ponto do tripulante se tornar prejudicado pela fadiga. Os sistemas de

  aviação devem ser capazes de tolerar algum erro humano e uma capacidade de

  desempenho diminuída, mas muitas vezes as demandas de um voo podem aumentar

  devido a circunstâncias operacionais imprevistas. Consequentemente, o que

  anteriormente era aceitável em termos de um nível de desempenho / erro torna-se

  inaceitável.

  c. Embora esta IS trate sobre o gerenciamento do risco de fadiga, os operadores precisam

  gerenciar o nível de carga de trabalho dos tripulantes. O risco de fadiga interage com

  outras áreas do desempenho humano (tais como carga de trabalho e complexidade das

  tarefas) e todos esses riscos precisam ser abordados. O risco de carga de trabalho pode

  ser resolvido por meio de processos de gerenciamento de riscos.

  d. Em relação ao risco de fadiga, o tripulante deve considerar quais fatores estão associados

  às tarefas a eles alocadas antes de se apresentar como apto para o trabalho. Isso ocorre

  porque é bem documentado o fato de que a redução do estado de alerta (ou o acúmulo

  de fadiga) afeta as "habilidades no mundo real". Os tripulantes, equipes e operadores

  devem considerar os riscos de fadiga que podem estar presentes em conjunto com outros

  riscos, como:

  i. o tipo de tarefa que está sendo realizada;

  ii. a natureza do espaço aéreo;

  iii. considerações meteorológicas;Data de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  iv. demandas do aeroporto; e

  v. facilidade de manutenção das aeronaves.

  e. Operadores e tripulantes devem reconhecer que as tarefas que envolvem desempenho

  cognitivo (por exemplo, tomada de decisão, capacidade de memória) e gerenciamento

  de ameaças e erros podem ser mal medidas ou mal administradas por um tripulante que

  esteja fatigado.

  f. Continuando até a sua etapa final, a FAPA auxilia o tripulante na determinação do seu

  estado de alerta e se este é adequado para realizar a jornada programada.

  B.2.5. Determinar o nível de risco de fadiga e o que pode ser necessário para verificar
  se

  deve cumprir a jornada.

  a. Com base nos resultados das Questões 1 a 4, o tripulante pode usar a tabela fornecida
  a

  seguir para avaliar o grau em que o risco de fadiga pode estar presente durante a jornada.

  Juntamente com os níveis de alerta medidos, os tripulantes podem começar a discutir

  como gerenciar possíveis riscos com seu supervisor e, consequentemente, desenvolver

  um plano de gerenciamento de riscos eficaz.

  b. Se o tripulante decidir que não está apto ao trabalho, ele deve preencher a última seção

  do formulário, indicando a sua preferência por uma das opções mencionadas. Nesta

  situação, o formulário deve ser analisado pelo operador.

  Personalizando sua necessidade de sono

  Embora seja fácil entender que o sono adequado é um pré-requisito para um tripulante

  alerta, a noção de sono adequado está sujeita à variabilidade individual. Isso é ainda

  mais complicado pela tendência de superestimar a quantidade e a qualidade do sono

  que realmente obtemos.

  Normalmente, uma pessoa necessita de 8 horas diárias de sono para se sentir bem.

  Sendo este o caso, a soma da necessidade de sono de quaisquer 48 horas será de 16

  horas. No entanto, algumas pessoas podem precisar de apenas 6 horas e outras de 10

  horas de sono diário.

  Um tripulante pode utilizar a Questão 2 da FAPA para verificar sua aptidão para o

  trabalho. Os números destacados em azul na Questão 2 podem ser individualizados.

  Se o tripulante acreditar que os números são muito baixos, porque geralmente

  necessita de mais sono do que a média para se sentir bem, e aumentá-los em 1 hora

  refletiria melhor suas necessidades de sono, então cada um dos números à esquerda

  também deve ser aumentado em 1 hora.

  Para realizar esta alteração é preciso entender o quanto de sono é necessário para se

  sentir bem descansado. Isso pode ser verificado após um dia ou dois acordando

  normalmente (para dissipar qualquer dívida de sono acumulada). Um bom momento

  de fazer o teste é em folgas prolongadas ou férias. Após compensar eventuais perdas

  de sono, perceber em qual horário o sono naturalmente vem e quanto tempo

  normalmente dura, de modo que se sinta bem no dia seguinte.

  Uma vez que este valor seja obtido, é possível sugerir que a redução deste valor (os

  números pintados de azul na FAPA, bem como os demais números à esquerda) aoData de emissão:
  29 de outubro de 2024 IS nº 117-007

  Revisão A

  longo de um período de 24 e 48 horas possa levar ao aumento do risco até que o débito

  de sono acumulado se torne excessivo.

  Como um guia geral, se a partir de um estado bem descansado, menos de 13 horas de

  sono forem obtidas nas últimas 48 horas e apenas 6 nas últimas 24 horas, esta condição

  deve ser considerada significativa.

  Deve ser enfatizado que os números na Questão 2 da FAPA podem ser adaptados para

  atender às necessidades individuais.Data de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  Ferramenta de Auxílio Para Autoavaliação da Fadiga (FAPA)

  Q1. Quão alerta você acha que está? (Considere sua condição antes de assumir a

  jornada de trabalho) Resultado do Risco (1)

  1 Totalmente alerta, bem desperto e extremamente disposto

  Baixo2 Muito ativo, responsivo, mas não em nível máximo

  3 Bem, relativamente revigorado

  4 Um pouco cansado, não totalmente disposto Moderado

  5 Moderadamente cansado, enfraquecido

  6 Muito cansado, com dificuldade de concentração Elevado

  7 Completamente exausto, incapaz de trabalhar efetivamente

  Se o Risco Elevado estiver presente, é recomendável considerar controles de risco tais como
  o cochilo, rotação de

  tarefa ou informar ao operador que você não se encontra apto para o serviço.

