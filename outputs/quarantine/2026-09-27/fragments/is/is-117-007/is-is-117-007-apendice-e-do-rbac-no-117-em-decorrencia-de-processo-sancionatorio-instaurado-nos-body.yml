title: Apêndice E do RBAC nº 117 em decorrência de processo sancionatório instaurado nos
text: 'Apêndice E do RBAC nº 117 em decorrência de processo sancionatório instaurado nos

  termos da Resolução Anac nº 472/2018 ou norma que vier a substitui-la.

  9.3.4. Em qualquer caso, o operador será informado da suspensão por meio de um ofício.

  9.3.5. O operador que tiver a autorização para operar sob o Apêndice E suspensa pode continuar

  a realizar operações aéreas. No entanto, deve utilizar os limites aplicáveis ao nível básicoData
  de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  de gerenciamento de fadiga.

  9.4 Revogação da suspensão

  9.4.1. Para ter revogada a suspensão de sua autorização, o operador deverá solicitá-la em

  documento no SEI direcionado para a GOAG, além da demonstração da correção das não-

  conformidades, caso a autorização tenha sido suspensa pela Anac por ocorrência de não-

  conformidade.

  9.4.2. A critério da Anac, ouvidos os setores envolvidos, pode ser solicitada a realização
  de uma

  reunião para esclarecimento e ajustes do processo;

  9.4.3. A revogação da suspensão da autorização, caso aceita pela Anac, será comunicada

  formalmente ao operador.

  9.5 Revogação da autorização

  9.5.1. O operador poderá solicitar a revogação de sua autorização para operar sob o Apêndice
  E

  do RBAC nº 117 por carta assinada e encaminhada à Anac, por meio do sistema SEI.

  9.5.2. Uma autorização deste tipo que seja revogada não pode ser restaurada. Se o operador

  desejar operar novamente sob tais regras, deverá iniciar um novo processo de cadastro.

  9.6 Modelos de formulários

  9.6.1. Os formulários e documentos padronizados a serem utilizados serão sempre os

  disponibilizados pela Anac em seu site (https://www.gov.br/anac/pt-

  br/assuntos/regulados/empresas-aereas/modelos-e-formularios) e no Sistema Eletrônico

  de Informações (SEI) e deverão sempre ser preenchidos e assinados no próprio SEI.'
