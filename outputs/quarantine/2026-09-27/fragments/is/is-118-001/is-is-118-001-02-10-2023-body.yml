text: '02.10.2023


  OBJETIVO

  1.1 Estabelecer meios e procedimentos associados ao uso de equipamentos e acessórios de
  aeronaves considerados como “não essenciais” para a segurança de voo.

  1.2 Apresentar os procedimentos requeridos no processo de aprovação ou aceitação de Programas
  NEF.

  REVOGAÇÃO

  2.1 Esta IS revoga a IS nº 118-001, Revisão A.

  FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14 a Instrução Suplementar

  (IS), norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 As seções 91.213 e 91.1115 do RBAC nº 91, 121.628 do RBAC nº 121 e 135.179 do RBAC nº
  135 estabelecem que ninguém pode decolar uma aeronave com instrumentos e equipamentos inoperantes
  instalados, a menos que, entre outras condições, exista uma Lista de Equipamentos Mínimos
  (MEL) aprovada para a aeronave.

  3.6 Esta IS estabelece um meio aceitável de cumprimento aos operadores aéreos para desenvolverem
  um programa de equipamentos e acessórios não essenciais (Programa NEF), associado a uma
  MEL aprovada, que permita a liberação da aeronave para voo com equipamentos e acessórios
  não essenciais inoperantes.

  DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas no RBAC nº 01 e as seguintes
  definições:

  4.1.1 Aceitação: procedimento segundo o qual a ANAC autoriza a utilização de um documento,
  manual, programa, etc, ou suas revisões, sem que necessariamente seja realizada avaliação
  prévia do cumprimento dos requisitos regulamentares. Nesse caso, o operador atua sob sua
  própria responsabilidade, até que a ANAC avalie a conformidade desse documento, manual,
  programa, etc.

  4.1.2 Aprovação: procedimento segundo o qual a ANAC autoriza a utilização de um documento,
  manual, programa, etc, ou suas revisões, mediante avaliação prévia do cumprimento dos requisitos
  regulamentares. Nesse caso, a vigência da autorização terá início na data definida no documento
  de aprovação emitido pela Agência.

  4.1.3 Equipamentos e acessórios não essenciais (nonessential equipment and furnishings -
  NEF): os equipamentos e acessórios instalados na aeronave que fazem parte da sua certificação
  de tipo ou certificação suplementar de tipo, ou outra alteração da aeronave, que não têm
  efeito na segurança de voo e não são requeridos pela regulamentação. São os itens que, se
  inoperantes, danificados ou faltantes, não têm efeito na habilidade da aeronave ser operada
  com segurança em todas as condições de voo.

  4.2 Lista de abreviaturas:

  AMM Aircraft Maintenance Manual

  ANAC Agência Nacional de Aviação Civil

  CDL Configuration Deviation List

  CMM Component Maintenance Manual

  FAA Federal Aviation Administration

  FAI Formulário de Análise de Impacto

  IS Instrução Suplementar

  MCC Maintenance Control Center

  MEL Minimum Equipment List

  MMEL Master Minimum Equipment List

  NEF Nonessential Equipment and Furnishings

  OHM Overhaul Manual

  PCI Passenger Convenience Items

  RBAC Regulamento Brasileiro da Aviação Civil

  SRM Structural Repair Manual

  SPO Superintendência de Padrões Operacionais

  TFAC Taxa de Fiscalização da Aviação Civil

  TS Trobleshooting

  DESENVOLVIMENTO DO ASSUNTO

  5.1 Introdução

  5.1.1 Antes da publicação da Policy Letter 116 pela Federal Aviation Administration (FAA),
  a Master Minimum Equipment List (MMEL) proporcionava suporte aos itens de comodidade dos
  passageiros (passenger convenience items - PCI), limitados às áreas da cabine de passageiros,
  galleys e lavatórios. Muitos operadores dos Estados Unidos da América liberavam os equipamentos
  não inclusos nessas áreas sem recorrer nem à Minimum Equipment List (MEL) nem à Configuration
  Deviation List (CDL), utilizando programas de diferimento internos da empresa autorizados
  em seus programas de manutenção.

  5.1.2 No entanto, a não ser sob a aprovação de uma MEL ou CDL, os regulamentos não previam
  a liberação de equipamentos ou instrumentos inoperantes, danificados ou faltantes. Devido
  ao PCI estar limitado às áreas descritas acima, a FAA substituiu o título PCI, no capítulo
  25 de todas as MMEL por um novo termo denominado Nonessential Furnishings, o qual posteriormente
  veio a ser substituído por Nonessential Equipment and Furnishings (NEF).

  5.1.3 Os operadores passaram então a ter permissão para estabelecer diferimentos, conforme
  admitido na MMEL, desde que desenvolvam um programa específico que forneça orientação para
  liberação dos equipamentos não essenciais e de interiores que estejam inoperantes, danificados
  ou faltantes, localizados na aeronave. Não obstante o programa NEF ser listado no Capítulo
  25 da MEL, ele pode endereçar equipamentos e acessórios de outros capítulos ATA.

  5.1.4 A ANAC, por meio desta Instrução Suplementar, apresenta um método aceitável para que
  os operadores brasileiros proponham um programa NEF, associado a uma MEL aprovada, para
  liberação da aeronave com equipamentos e acessórios não essenciais inoperantes e obtenham
  aprovação ou aceitação deste programa, conforme aplicabilidade estabelecida na seção 5.5
  desta IS.

  5.2 Itens NEF

  5.2.1 Itens NEF são equipamentos e acessórios, doravante chamados de itens, instalados na
  aeronave como parte da certificação de tipo original, certificação de tipo suplementar ou
  outra forma de alteração, que não tenham efeito na segurança da operação de voo e que não
  sejam requeridos pelas regras de certificação aplicáveis ou regras operacionais. São itens
  que, se inoperantes, danificados ou faltantes, não têm efeito na habilidade da aeronave
  de ser conduzida com segurança em todas as condições operacionais.

  5.2.2 Esses itens “não essenciais” podem estar instalados em áreas que incluem, mas não
  se limitam ao, compartimento de passageiros, cabine de comando, áreas de serviço, compartimentos
  de carga, áreas de descanso de tripulantes, lavatórios e galleys. Itens de acabamento, relacionados
  com estética ou aparência, em condições de uso, porém desgastados, podem ser diferidos conforme
  estabelecido num programa NEF; no entanto, caso haja requisitos de bloqueio ou retenção
  contra fogo associados a tais itens, eles devem ser considerados como cumpridos antes da
  identificação do item como NEF.'
