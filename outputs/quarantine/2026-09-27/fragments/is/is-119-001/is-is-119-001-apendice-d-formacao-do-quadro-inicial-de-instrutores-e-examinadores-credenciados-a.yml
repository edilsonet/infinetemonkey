text: 'a) treinamento inicial e habilitação: treinamento e exame, com fins à obtenção dos
  certificados de habilitação técnica necessários às suas funções como tripulantes ou DOVs
  do requerente. Esse treinamento deve ser ministrado por outro detentor de certificado operando
  sob o RBAC nº 121, um Centro de Treinamento de Aviação Civil, o fabricante ou outra fonte.
  O operador deve especificar nominalmente a entidade que aplicará o treinamento;'
