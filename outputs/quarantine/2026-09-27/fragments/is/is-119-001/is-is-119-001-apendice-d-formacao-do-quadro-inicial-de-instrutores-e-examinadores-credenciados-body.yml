title: APÊNDICE D - formação do quadro inicial de instrutores e examinadores credenciados
text: 'APÊNDICE D - formação do quadro inicial de instrutores e examinadores credenciados

  D1. O RBAC nº 121 estabelece, em seu parágrafo 121.401(a)(4), que o detentor de certificado
  deve prover número suficiente de instrutores e examinadores credenciados. Em operadores
  que estejam em processo de certificação inicial para obtenção do COA ou incluindo um novo
  modelo de aeronave em suas Especificações Operativas, a formação do quadro inicial de pilotos,
  comissários e despachantes operacionais de voo, bem como de instrutores e examinadores,
  não é contemplada pelo RBAC. Para endereçar esse cenário, os requerentes podem utilizar
  o procedimento aqui descrito como maneira de formar seu quadro inicial de instrutores e
  examinadores credenciados, viabilizando dessa maneira a obtenção das qualificações necessárias
  dos demais tripulantes.

  Nota: para contextos específicos, como, por exemplo, a operação de novo modelo de avião
  ainda não operado sob o RBAC nº 121 (por nenhum outro operador), algumas das condições descritas
  neste apêndice podem não ser aplicáveis. Este caso requer um tratamento particularizado,
  conforme detalhado a partir do parágrafo D6 desta IS.

  D2. O requerente deve apresentar uma solicitação para adoção de um programa de formação
  do quadro inicial de instrutores e examinadores credenciados, composto por:'
