title: apendice-d-formacao-do-quadro-inicial-de-instrutores-e-examinadores-credenciados(c)
text: 'c) exames de observação: os candidatos devem passar por exames de observação para as
  funções de instrutor (enquanto conduzem instrução) e de examinador (enquanto conduzem um
  exame), sob observação de um servidor designado da Anac, que avaliará se o desempenho do
  candidato é satisfatório.

  I - Uma vez que o candidato tenha passado pelo exame de observação na função de instrutor,
  pode passar a ministrar instrução sem a necessidade de supervisão do provedor de treinamento
  original ou da Anac.

  II - Já para atuar na função de examinador credenciado sem a supervisão do provedor de treinamento
  original ou da Anac, é necessário que, além de ter passado pelo exame de observação na função
  de examinador credenciado, o candidato receba o credenciamento pela Anac.'
