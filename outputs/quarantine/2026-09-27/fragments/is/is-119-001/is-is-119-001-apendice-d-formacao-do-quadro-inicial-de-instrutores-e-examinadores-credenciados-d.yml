text: 'd) experiência operacional:

  I - Os integrantes do quadro inicial de instrutores/examinadores podem iniciar a aquisição
  das horas de experiência operacional requeridas por 121.434(c) nas etapas previstas e aprovadas
  dos voos de avaliação operacional do processo de certificação. As horas de voo podem ser
  acumuladas enquanto os candidatos estiverem, em avião:

  A) adquirindo experiência operacional sob a supervisão de outro integrante do quadro inicial
  de instrutores/examinadores;

  B) supervisionando a aquisição de experiência operacional de outros tripulantes;

  C) sendo examinados em rota; ou

  D) conduzindo exames em rota.

  II - Os integrantes do quadro inicial de instrutores/examinadores estão sujeitos ao acompanhamento
  da Anac durante a aquisição da experiência operacional e realização dos exames em rota.

  III - Conforme os resultados do acompanhamento, a Anac poderá cancelar ou limitar quaisquer
  autorizações que tenham sido concedidas em função do processo de formação descrito neste
  apêndice.

  D5. A validade das aprovações e credenciamentos emitidos de acordo com os procedimentos
  deste apêndice é limitada à formação do quadro inicial de instrutores e examinadores pilotos,
  comissários e despachantes operacionais de voo do operador em início de atividades ou em
  inclusão de novo modelo de aeronave.

  D6. Dependendo da proposta de certificação do requerente, como por exemplo a inclusão de
  novo modelo de avião ainda não operado sob o RBAC nº 121 (por nenhum outro operador), os
  procedimentos descritos neste apêndice podem não ser inteiramente aplicáveis ou factíveis.
  Neste caso, o requerente pode encaminhar solicitação para adoção de um programa de formação
  do quadro inicial de instrutores e examinadores credenciados, conforme parágrafo D2, e propor
  métodos alternativos que garantam que seus candidatos serão devidamente qualificados na
  operação do avião e na função de instrutor ou examinador credenciado.

