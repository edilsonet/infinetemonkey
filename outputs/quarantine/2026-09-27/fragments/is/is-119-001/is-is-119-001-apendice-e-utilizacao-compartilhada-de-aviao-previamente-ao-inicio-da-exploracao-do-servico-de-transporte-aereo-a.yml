title: apendice-e-utilizacao-compartilhada-de-aviao-previamente-ao-inicio-da-exploracao-do-servico-de-transporte-aereo(a)
text: a) o requerente se torna operador primário do avião para utilizá-lo durante a fase 4
  do processo de certificação e permite o uso do avião por outro operador (denominado operador
  secundário) para outros fins nos períodos em que não esteja utilizando efetivamente o avião.
  Esse cenário é detalhado no parágrafo E7 desta IS; e
