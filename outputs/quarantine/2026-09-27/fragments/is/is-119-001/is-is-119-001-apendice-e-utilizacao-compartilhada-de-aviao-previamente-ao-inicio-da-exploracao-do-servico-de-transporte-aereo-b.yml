title: apendice-e-utilizacao-compartilhada-de-aviao-previamente-ao-inicio-da-exploracao-do-servico-de-transporte-aereo(b)
text: 'b) o requerente utiliza, durante a fase 4 do processo de certificação, um avião do
  qual é operador secundário, em acordo com o operador primário, que utiliza o avião para
  outros fins. Esse cenário é detalhado no parágrafo E8 desta IS.

  Nota 1: conforme o parágrafo 5.2.12.4 desta IS, a exploração do serviço aéreo pelo requerente
  somente poderá ser iniciada a partir da publicação de portaria dando a publicidade do cumprimento
  dos requisitos da Resolução nº 659. Neste apêndice, é tratada da possibilidade de utilização
  do avião por outro operador, que somente poderá explorar serviço aéreo em conformidade com
  as regras aplicáveis.

  Nota 2: os dois cenários podem envolver operadores estrangeiros e o uso de avião que originalmente
  detenha matrícula estrangeira.

  E3. Em ambos os cenários, há algum grau de compartilhamento de um avião por mais de um operador
  aéreo - o que representa uma situação similar à do intercâmbio, previsto na IS nº 119-006.
  Assim, os operadores devem cumprir os critérios da IS nº 119-006 conforme modificados por
  este apêndice, podendo ser acordados entre o operador e a Anac os critérios que poderiam
  ser dispensados especificamente para o compartilhamento do avião previamente ao início da
  exploração do serviço de transporte aéreo.

  Nota: este apêndice trata somente do compartilhamento do avião previamente ao início da
  exploração do serviço de transporte aéreo. Caso haja intenção de prosseguir com a operação
  sob regime de intercâmbio após o requerente iniciar a exploração do serviço de transporte
  aéreo, a IS nº 119-006 deve ser cumprida de forma integral

  E4. De acordo com o cenário aplicável, o requerente deve apresentar, como parte de seu plano
  de certificação, a documentação que demonstre o cumprimento com os critérios deste apêndice.
  Após análise da solicitação, a Anac comunicará o requerente a respeito da autorização.

  E5. A Anac poderá requerer demonstrações dos procedimentos antes de autorizar a utilização
  do avião nos termos deste apêndice.

  E6. A Anac poderá indeferir, limitar ou revogar autorizações concedidas nos termos deste
  apêndice se entender que tais ações são necessárias para manutenção do nível de segurança
  das operações.

  E7. Cenário com o requerente como operador primário

  E7.1. Neste cenário, assume-se que o avião teria registro brasileiro. Caso o avião originalmente
  seja de matrícula estrangeira, deve ser nacionalizado para que o requerente passe a ser
  o operador primário.

  E7.2. O processo para o requerente se tornar operador primário do avião ocorreria normalmente,
  com registro do operador no Registro Aeronáutico Brasileiro (RAB).

  E7.3. Para que o avião seja utilizado por um operador secundário, seja de forma intercalada
  com as demonstrações, seja após as demonstrações e antes do início da exploração do serviço
  de transporte aéreo, devem ser cumpridos os seguintes critérios:'
