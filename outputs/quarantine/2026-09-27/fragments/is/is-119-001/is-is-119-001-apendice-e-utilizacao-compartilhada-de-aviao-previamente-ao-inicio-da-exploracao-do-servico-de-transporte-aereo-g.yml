title: apendice-e-utilizacao-compartilhada-de-aviao-previamente-ao-inicio-da-exploracao-do-servico-de-transporte-aereo(g)
text: g) uma vez que o requerente ainda não estaria autorizado para explorar o serviço de
  transporte aéreo, pode ser dispensado o cumprimento do prazo de 30 dias para que haja transferência
  do controle operacional entre os operadores, previsto na IS nº 119-006. No entanto, deve
  ser respeitado um prazo máximo de 90 dias para o controle operacional ininterrupto por parte
  do operador secundário;
