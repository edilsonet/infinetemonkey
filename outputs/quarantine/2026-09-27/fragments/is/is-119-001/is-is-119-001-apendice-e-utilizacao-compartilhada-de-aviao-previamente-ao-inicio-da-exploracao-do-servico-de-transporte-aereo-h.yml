title: apendice-e-utilizacao-compartilhada-de-aviao-previamente-ao-inicio-da-exploracao-do-servico-de-transporte-aereo(h)
text: 'h) a operação deve ser conduzida por tripulantes portadores das licenças e habilitações
  aplicáveis emitidas ou convalidadas pelo Estado de registro do avião sempre que o avião
  realizar voos fora do território brasileiro ou se for requerido pelo Estado de registro.

  I - Observa-se que, no caso de aviões de matrícula estrangeira, essa exigência pode se tornar
  limitante para os tripulantes que podem atuar nos voos de avaliação operacional, que devem
  ainda atender aos requisitos do programa de treinamento do requerente;

  Nota: a Convenção de Aviação Civil Internacional (Doc 7300), publicada pela OACI, estabelece,
  em seu art. 32, que para voos internacionais a tripulação deve ter suas licenças e habilitações
  emitidas ou convalidadas pelo Estado de registro. Embora a Convenção não estabeleça a restrição
  para voos domésticos, isto pode ser requerido pelo Estado de registro.'
