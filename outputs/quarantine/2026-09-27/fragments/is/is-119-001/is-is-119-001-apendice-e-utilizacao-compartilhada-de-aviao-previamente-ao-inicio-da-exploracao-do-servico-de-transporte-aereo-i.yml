title: apendice-e-utilizacao-compartilhada-de-aviao-previamente-ao-inicio-da-exploracao-do-servico-de-transporte-aereo(i)
text: i) durante as operações do requerente, sejam traslados ou voos de avaliação operacional,
  somente podem ser realizadas operações em conformidade com as autorizações obtidas pelo
  requerente, independentemente das autorizações emitidas em nome do operador primário. Adicionalmente,
  devem ser respeitadas as limitações associadas à certificação do avião (como limites do
  certificado de aeronavegabilidade ou do AFM), em conformidade com a regulamentação do Estado
  de registro; e
