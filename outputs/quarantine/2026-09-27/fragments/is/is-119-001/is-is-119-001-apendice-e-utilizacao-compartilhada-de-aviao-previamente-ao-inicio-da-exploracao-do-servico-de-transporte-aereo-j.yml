text: 'j) caso o operador secundário seja estrangeiro, ele será responsável por obter as devidas
  autorizações, quando aplicáveis, da autoridade do Estado do operador e conduzir as operações
  de acordo com as regras aplicáveis deste Estado. Devem ser respeitadas adicionalmente as
  limitações associadas à certificação do avião (como limites do certificado de aeronavegabilidade
  ou do AFM), em conformidade com a regulamentação da Anac.

  E8. Cenário com o requerente como operador secundário

  E8.1. Neste cenário, é considerado que o avião pode ter matrícula brasileira ou estrangeira.

  E8.2. O avião utilizado na demonstração pode não ser do mesmo número de série que será utilizado
  depois que a empresa for autorizada a explorar serviço aéreo. No entanto, nesse caso, o
  requerente deve garantir que o avião seja representativo de forma integral dos aspectos
  considerados na certificação. Exemplos de características que são consideradas incluem:
  configuração de assentos da cabine de passageiros, configuração do painel da cabine de pilotos,
  equipamentos instalados, alterações ou service bulletins incorporadas etc. Por vezes, a
  faixa do número de série implica em alterações nos manuais, como AOM/AFM e MEL.

  Nota: o uso de um avião específico para as demonstrações durante o processo de certificação
  não exime que o avião que será utilizado para as operações de serviço de transporte aéreo
  (após a certificação) também passe, conforme aplicável, pelas vistorias e procedimentos
  normais necessários à emissão dos Certificados de Aeronavegabilidade e de Matrícula pela
  Anac.

  E8.3. Para que o avião seja utilizado pelo requerente, como um operador secundário, durante
  as demonstrações do processo de certificação, devem ser cumpridos os seguintes critérios:'
