text: '(i). Treinamento e educação; e

  (ii). Comunicação acerca da segurança operacional.

  3.3 ESTRUTURA EXISTENTE NA ORGANIZAÇÃO E MUDANÇAS NECESSÁRIAS

  O Gestor Responsável deve apresentar aqui os resultados das análises realizadas em relação
  às

  estruturas existentes no Detentor de Certificado e que poderiam ser adaptadas ou mantidas
  para a

  implantação de seu SGSO, considerando a os componentes e elementos estabelecidos pela ANAC
  e

  apresentadas no item anterior.

  Um Detentor de Certificado, a menos que seja uma nova entrante no mercado, deve ter vários
  dos

  componentes/elementos propostos pela ANAC para o SGSO implantados e funcionando, uma vez

  que segurança operacional é princípio básico de um operador aéreo.

  A identificação dos componentes/elementos existentes deve ser feita de forma clara permitindo

  que os envolvidos e a ANAC entendam as estruturas existentes e sua contribuição para a operação

  do SGSO a ser implantado.

  A partir dessa análise, devem ser identificadas as mudanças necessárias na estrutura

  organizacional, nos processos e procedimentos, que servirão de base para a elaboração do

  planejamento de implantação do SGSO proposto pela ANAC nos RBACs 121 e 135.

  3.4 RESPONSÁVEIS PELA IMPLANTAÇÃO DAS MEDIDAS OU PROCESSOS

  O Gestor Responsável deve identificar os responsáveis (accountables) pela efetivação das

  mudanças consideradas necessárias na estrutura organizacional e demais elementos, bem como

  pela implantação das medidas ou processos adicionais identificados para implantação do SGSO

  requerido pela ANAC.

  3.5 FORMULÁRIO PARA AUXILIAR A ANÁLISE DO FALTANTE

  Utilizando como base a proposta apresentada no Doc 9859, 2ª Edição, de 2009, da OACI para
  a

  Análise do faltante foi desenvolvido o formulário modelo, Apêndice C, que contém perguntas,

  sempre associadas a requisito da regulação, e que devem ser respondidas.

  O objetivo do formulário modelo é auxiliar o Gestor Responsável na avaliação de sua estrutura

  organizacional, sua política, objetivos e nível de cumprimento da regulação frente aos requisitos

  estabelecidos para a implantação do SGSO. Apesar de aparentemente esgotar os requisitos

  relacionados à implantação, operação e manutenção do SGSO, é importante considerar que

  existem outros requisitos no RBAC 119, RBAC 121 e RBAC 135 voltados à garantia da segurança

  operacional das atividades do Detentor do Certificado e que devem ser considerados.Data
  da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  A adoção desse formulário não é obrigatória, mas pode ser utilizada como uma ferramenta
  para a

  realização da análise do faltante tanto para o trabalho realizado quanto para a implantação
  do

  SGSO proposto pela ANAC.

  O <Diretor ou Gerente> de Segurança Operacional deve apresentar as mudanças, se houver,
  nos

  processos existentes, bem como as medidas e processos adicionais necessários para adaptar
  a(s)

  operação(ões) certificada(s) ou proposta(s) em relação aos requisitos da ANAC, visando garantir
  a

  manutenção de suas atividades dentro de um nível aceitável de desempenho da segurança

  operacional (NADSO), a ser acordado com a Agência, após a aprovação pelo Gestor Responsável.Data
  da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  4. PLANO DE IMPLANTAÇÃO DO SGSO DO <NOME DO>

  DETENTOR DO CERTIFICADO

  4.1 INTRODUÇÃO

  O plano de implantação do SGSO tem por objetivo apresentar o enfoque definido pelo Gestor

  Responsável para o gerenciamento da segurança operacional em suas atividades. Como tal,
  deve

  ser uma proposta realista, de forma que satisfaça os objetivos de segurança operacional

  estabelecidos pelo Gestor Responsável de um Detentor do Certificado, apoiando ao mesmo tempo

  a prestação efetiva e eficiente dos serviços para os quais foi certificado.

  O Gestor Responsável deve desenvolver e manter um Plano de Implantação do SGSO, que

  apresente como o Detentor de Certificado pretende alcançar os objetivos de segurança

  operacional estabelecidos como parte do negócio, bem como o compromisso de incorporar

  qualquer requisito de segurança operacional novo ou revisto pela ANAC.

  Os aspectos significativos do Plano devem ser incluídos no planejamento estratégico do Detentor

  de Certificado. Ainda, o Plano de Implantação do SGSO pode se constituir em mais de um

  documento, desde que referenciado nesta parte do MGSO, detalhando as mudanças necessárias

  na estrutura organizacional, as ações a serem adotadas, quando e por quem, de acordo com
  uma

  implantação por fases, quando autorizado.

  4.2 ELABORAÇÃO DO PLANO DE IMPLANTAÇÃO DO SGSO

  O Gestor Responsável é responsável pelo desenvolvimento e manutenção de um plano de

  implantação do SGSO, no qual deve definir a abordagem para gerenciar a segurança operacional

  de modo a satisfazer as necessidades da organização.

  O Gestor Responsável deve designar um grupo de planejamento composto por diretores, gerentes

  e supervisores chave da organização, para o desenho, desenvolvimento e implantação do SGSO,

  que contará obrigatoriamente com o Diretor ou Gerente de Segurança Operacional.

  O grupo de planejamento deve ser responsável por elaborar uma estratégia e o plano de

  implantação do SGSO, que deve satisfazer as necessidades da organização em matéria de

  segurança operacional.

  Para que este grupo possa desenhar, desenvolver e implantar um SGSO compatível com os

  regulamentos e as necessidades do Detentor de Certificado é necessário que seus membros

  possuam conhecimento sobre os conceitos de funcionamento de um SGSO e que tenham

  experiência adequada sobre o tipo de atividade por ele desenvolvida.

  Para alcançar os resultados esperados, é necessário que a alta direção do Detentor de Certificado

  aloque tempo compatível com a tarefa a ser desenvolvida, de forma a permitir que o grupo
  se

  reúna entre si e com os responsáveis pelas áreas operacionais, bem como com a alta direção,
  para

  alinhamento dos rumos a serem adotados. Estas atividades demandam recursos financeiros e

  humanos que precisam ser alocados pelo Gestor Responsável pelo Detentor de Certificado.

  4.3 PLANEJAMENTO DA SEGURANÇA OPERACIONAL

  O <Diretor ou Gerente> de Segurança Operacional, como coordenador do grupo criado, deve,
  a

  partir da descrição do ambiente operacional e da análise do faltante realizada, desenvolver
  oData da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  planejamento para a adequação das estruturas organizacionais, as políticas e os procedimentos

  aos requisitos estabelecidos e acordados com a ANAC. Os principais pontos a serem avaliados

  estão associados aos componentes e elementos do SGSO apresentados no item 3.2, que está
  de

  acordo com os RBACs 121 e 135.

  O <Diretor ou Gerente> de Segurança Operacional deve identificar qual o planejamento a ser

  proposto para a adequação do Detentor do Certificado aos requisitos e prazos estabelecidos
  no

  Apêndice R ou I - Fases de implantação do sistema de gerenciamento da segurança operacional
  do

  RBAC 121 ou do RBAC 135. A representação desse planejamento em um cronograma, contendo os

  responsáveis pelas ações, facilita a visualização dos compromissos assumidos para a adequação
  da

  estrutura organizacional e seus processos e procedimentos aos requisitos, bem como os prazos

  estabelecidos para essa adequação.

  Assim, o planejamento da segurança operacional do gestor responsável, a partir da incorporação

  gradual dos componentes e elementos do SGSO estabelecidos nos RBACs 121 ou 135 vai permitir

  a definição de uma série de passos ou etapas administráveis para a efetiva implantação do
  SGSO,

  estabelecendo os responsáveis por cada ação proposta neste planejamento.

  4.4 COMPONENTES DO SGSO A SEREM IMPLANTADOS

  O <Diretor ou Gerente> de Segurança Operacional deve apresentar para cada

  componente/elemento definido para a estrutura do SGSO adotado pela ANAC, os principais pontos

  analisados e as principais conclusões sobre o que já está implantado e funcionando, o que
  precisa

  ser melhorado ou está ausente, a partir da análise do faltante.

  Estas informações e análises servirão, inicialmente, para o planejamento das fases de implantação,

  de acordo com os requisitos estabelecidos no Apêndice R do RBAC 121 ou Apêndice I do RBAC
  135.

  A seguir são apresentados comentários sobre cada um dos componentes que deve fazer parte
  do

  SGSO do Detentor de Certificado, de forma a auxiliar na elaboração do plano e na verificação
  da

  adequabilidade da proposta aos requisitos estabelecidos.'
