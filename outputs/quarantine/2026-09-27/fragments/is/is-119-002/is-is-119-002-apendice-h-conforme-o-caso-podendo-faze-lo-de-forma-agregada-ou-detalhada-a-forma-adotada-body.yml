text: 'Apêndice H, conforme o caso, podendo fazê-lo de forma agregada ou detalhada. A forma
  adotada

  não impede a continuidade do processo, desde que permita à ANAC entender como a informação

  foi utilizada para ser comparada com as estruturas existentes na Empresa.

  A estrutura do SGSO proposta pela ANAC para as empresas que operam segundo o RBAC 121 ou

  RBAC 135 descritas nos Parágrafos (c) dos referidos regulamentos, e é apresentada a seguir.

  a. Política e objetivos de segurança operacional:'
