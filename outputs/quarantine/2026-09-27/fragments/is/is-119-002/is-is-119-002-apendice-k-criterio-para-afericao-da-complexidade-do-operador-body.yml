text: 'APÊNDICE K - CRITÉRIO PARA AFERIÇÃO DA COMPLEXIDADE DO OPERADOR

  PARA OS PROPÓSITOS DA IMPLANTAÇÃO E MANUTENÇÃO DO SGSO

  K1 Este Apêndice estabelece parâmetros que permitem aferir a complexidade das empresas

  que operam segundo o RBAC 135 para os propósitos da implantação e manutenção do

  Sistema de Gerenciamento da Segurança Operacional (SGSO).

  K2 São apresentadas três categorias de complexidade: alta, média e baixa. A aferição da

  complexidade da empresa se dará da seguinte maneira, devendo a empresa iniciar pelo

  item K2.1, abaixo:'
