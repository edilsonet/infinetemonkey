title: Apêndice Q do RBAC 121 ou Apêndice I do RBAC 135 se constituem no marco para a
text: 'Apêndice Q do RBAC 121 ou Apêndice I do RBAC 135 se constituem no marco para a

  mudança, uma vez que apresenta a alocação dos responsáveis (accountables) pela

  condução da segurança operacional do detentor e/ou requerente de um certificado, peça

  essencial para a implantação do SGSO.Data da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D'
