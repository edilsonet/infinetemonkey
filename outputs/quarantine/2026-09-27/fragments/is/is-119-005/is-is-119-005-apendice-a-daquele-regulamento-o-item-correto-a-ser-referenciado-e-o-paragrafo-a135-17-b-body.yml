title: Apêndice A daquele regulamento, o item correto a ser referenciado é o parágrafo A135.17(b)
text: 'Apêndice A daquele regulamento, o item correto a ser referenciado é o parágrafo A135.17(b)

  do Apêndice A do RBAC nº 135.

  7.5 O parágrafo 135.227(d) do RBAC nº 135 informa que “nenhum piloto pode operar um

  helicóptero em voo IFR em condições conhecidas ou previstas de formação de gelo, ou em

  voo VFR em condições conhecidas de formação de gelo, a menos que o helicóptero tenha

  sido certificado e esteja adequadamente equipado para operação em condições de formação

  de gelo.”

  7.6 Com relação a treinamento, o parágrafo 135.227(b) do RBAC nº 135 informa que “nenhum

  detentor de certificado pode autorizar a decolagem de um avião, assim como nenhum piloto

  pode decolar com esse avião, sempre que as condições meteorológicas forem tais que haja

  razoável probabilidade de aderir gelo, geada ou neve ao avião, a menos que o piloto tenha

  completado todo o treinamento aplicável requerido pela seção 135.341...”'
