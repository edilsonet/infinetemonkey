  °C = Graus Celsius OAT = Outside Air Temperature (Temperatuta do Ar Ambiente Externo)

  °F = Graus Fahrenheit FP = Freezing Point (Ponto de Congelamento)

  A RESPONSABILIDADE PELA APLICAÇÃO DESSES DADOS PERMANECE COM O USUÁRIO.

  * Durante condições que se aplicam à proteção das aeronaves para ACTIVE FROST, que se trata
  de uma condição em que a geada está se formando e que pode ocorrer quando a temperatura
  da superfície da aeronave

  está em ou abaixo de 0°C (32°F) e em ou abaixo do ponto de orvalho.

  ** Use holdover times - HOT (tempos de atuação) para light freezing rain (chuva fina congelante)
  se a identificação positiva de freezing drizzle (chuvisco ou garoa congelantes) não for
  possível.

  ‡ Neve pesada (heavy snow), pelotas de neve (snow pellets), pelotas de gelo (ice pellets),
  chuva congelante moderada e pesada (moderate and heavy freezing rain), granizo (hail).

  ◊◊ PARA USAR ESTES TEMPOS, O FLUIDO DEVE SER AQUECIDO A UMA TEMPERATURA MÍNIMA DE 60°C (140°F)
  NO BOCAL E PELO MENOS 1 LITRO/M2 (≈ 2 GALÕES/100FT2) DEVE SER APLICADO PARA SUPERFÍCIES

  DEGELADAS.

  A mistura fluido SAE Tipo I/água é selecionada de forma que o FP da mistura seja de pelo
  menos 10 °C (18 °F) abaixo da OAT.

  ADVERTÊNCIAS:

  • O TEMPO DE PROTEÇÃO SERÁ ENCURTADO EM CONDIÇÕES METEOROLÓGICAS PESADAS. AS TAXAS DE PRECIPITAÇÃO
  PESADA OU ALTO NÍVEL DE UMIDADE, ALTA VELOCIDADE DE VENTO OU JATO DE MOTORES

  REDUZIRÃO O TEMPO DE ATUAÇÃO (HOLDOVER TIME - HOT) ABAIXO DO MENOR TEMPO INDICADO NA FAIXA.
  O TEMPO DE ATUAÇÃO (HOT) PODE SER REDUZIDO QUANDO A TEMPERATURA DA SUPERFÍCIE (SKIN)

  DA AERONAVE É MENOR DO QUE A OAT.

  • O FLUIDO SAE TIPO I UTILIZADO DURANTE O DEGELO/ANTIGELO NO SOLO NÃO É DESTINADO PARA E
  NÃO FORNECE PROTEÇÃO DURANTE O VOO.Data de publicação: 9 de fevereiro de 2018 IS nº 119-005

  Revisão A

