text: 'APÊNDICE C - EXEMPLOS DE TABELAS DE TEMPO DE ATUAÇÃO (HOLDOVER TIME - HOT)

  C.1 ORIENTAÇÕES PARA TEMPOS DE ATUAÇÃO (HOLDOVER TIME - HOT) DA ANAC PARA FLUIDOS TIPO I
  COM BASE EM

  TABELA DO FAA (AC 120-60B)

  TABELA 1 - ORIENTAÇÃO PARA HOT ESPERADO PARA MISTURA DE FLUIDO SAE TIPO I EM FUNÇÃO DAS
  CONDIÇÕES METEOROLÓGICAS E OAT (OUTSIDE AIR TEMPERATURE - TEMPERATURA

  DO AR AMIENTE EXTERNO).

  ATENÇÃO: ESTA TABELA É PARA USO SOMENTE NO PLANEJAMENTO PARA PARTIDA E DEVE SER USADA EM
  CONJUNTO COM PROCEDIMENTOS DE VERIFICAÇÃO PRÉ-DECOLAGEM.

