  Fluido SAE Tipo II pode ser usado abaixo de -25°C (-13°F) desde que o ponto de congelamento
  (freezing point) do fluido seja de pelo menos 7°C (13°F)

  abaixo da OAT e que o critério de aceitação aerodinâmico seja atendido. Considere o uso
  de Fluido SAE Tipo I quando o Fluido SAE Tipo II não puder

  ser usado.

  °C = Graus Celsius OAT = Outside Air Temperature (Temperatuta do Ar Ambiente Externo)

  °F = Graus Fahrenheit VOL = Volume

  A RESPONSABILIDADE PELA APLICAÇÃO DESSES DADOS PERMANECE COM O USUÁRIO.

  * Durante condições que se aplicam à proteção das aeronaves para ACTIVE FROST, que se trata
  de uma condição em que a geada está se formando e que pode ocorrer quando a temperatura
  da superfície da aeronave está em ou

  abaixo de 0°C (32°F) e em ou abaixo do ponto de orvalho.

  ** Não existem orientações para tempos de atuação (HOT) para esta condição abaixo de -10°C
  (14°F).

  *** Use holdover times - HOT (tempos de atuação) para light freezing rain (chuva fina congelante)
  se a identificação positiva de freezing drizzle (chuvisco ou garoa congelantes) não for
  possível.

  ‡ Neve pesada (heavy snow), pelotas de neve (snow pellets), pelotas de gelo (ice pellets),
  chuva congelante moderada e pesada (moderate and heavy freezing rain), granizo (hail).

  ◊Neve (Snow) inclui grãos de neve (snow grains).

  ADVERTÊNCIAS: O TEMPO DE PROTEÇÃO SERÁ ENCURTADO EM CONDIÇÕES METEOROLÓGICAS PESADAS. AS
  TAXAS DE PRECIPITAÇÃO PESADA OU ALTO NÍVEL DE UMIDADE, ALTA VELOCIDADE DE VENTO OU JATO
  DE MOTORES

  PODEM REDUZIR O TEMPO DE ATUAÇÃO (HOLDOVER TIME - HOT) ABAIXO DO MENOR TEMPO INDICADO NA
  FAIXA. O TEMPO DE ATUAÇÃO (HOT) PODE SER REDUZIDO QUANDO A TEMPERATURA DA SUPERFÍCIE (SKIN)
  DA

  AERONAVE É MENOR DO QUE A OAT; O FLUIDO SAE TIPO II UTILIZADO DURANTE O DEGELO/ANTIGELO
  NO SOLO NÃO É DESTINADO PARA E NÃO FORNECE PROTEÇÃO DURANTE O VOO.

  NOTA: A AC 120-60B informa a não utilização de fluido tipo III. Entretanto, esse fluido
  aparece em dados mais atualizados do FAA. Assim, recomenda-se na tomada de decisão da adoção
  de fluido tipo III, a verificação do dado

  técnico atualizado, para aplicação à situação prática em curso.Data de publicação: 9 de
  fevereiro de 2018 IS nº 119-005

