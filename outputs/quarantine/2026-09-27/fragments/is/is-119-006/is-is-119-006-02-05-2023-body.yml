text: '02.05.2023


  OBJETIVO

  1.1 Apresentar os critérios para a efetivação de contratos de intercâmbio de aeronaves,
  envolvendo operadores aéreos brasileiros e/ou aeronaves registradas no Brasil ou em outro
  Estado.

  REVOGAÇÃO

  2.1 Esta IS substitui a IS nº 119-006 Revisão B.

  FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou
  RBHA.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC ou RBHA, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 Esta IS é fundamentada e objetiva oferecer método de cumprimento às seções 119.53 e
  119.54 do RBAC nº 119, 121.153 e 121.569 do RBAC nº 121 e 135.25 do RBAC nº 135.

  3.6 Esta IS se relaciona com a IS nº 119-001 e com a IS nº 119-004, relativas aos processos
  de certificação de empresas de transporte aéreo, regidas pelo RBAC nº 121 e pelo RBAC nº
  135, respectivamente.

  DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas na Seção 119.3 do RBAC
  nº 119, as definições listadas no RBAC nº 01 e as seguintes definições:

  4.1.1 proprietário: pessoa (física ou jurídica) que detém o título de propriedade, oficializado
  junto ao Estado de registro da aeronave. No caso de aeronaves com matrícula brasileira,
  o proprietário é a pessoa (física ou jurídica) que inscreveu uma aeronave em seu nome no
  Registro Aeronáutico Brasileiro - RAB, nos termos do inciso V do Art. 116 da Lei nº 7.565,
  de 19/12/1986 (CBAer);

  4.1.2 operador: pessoa (física ou jurídica) que possui os direitos de uso de uma aeronave.
  Um operador poderá ou não assumir responsabilidade parcial ou total sobre o controle operacional
  de uma aeronave;

  4.1.3 operador aéreo: empresa de transporte aéreo devidamente certificada e autorizada a
  realizar operações comerciais de transporte de passageiros e/ou carga. Deve ser detentor
  de certificado de operador aéreo e de EO, emitidos pela AAC do Estado do operador;

  4.1.4 operador aéreo brasileiro: empresa de transporte aéreo certificada e autorizada a
  realizar operações comerciais de transporte de passageiros e/ou carga, segundo o RBAC nº
  121 ou RBAC nº 135. Deve ser detentor de COA e de EO emitidos pela ANAC, segundo o RBAC
  nº 119;

  4.1.5 Estado do Operador: é o Estado em que o operador aéreo é devidamente certificado e
  autorizado a realizar operações comerciais de transporte aéreo de passageiros e/ou carga.'
