text: '01.04.2022


  OBJETIVO

  1.1 Apresentar os procedimentos para a implementação de um Programa de Acompanhamento e
  Análise de Dados de Voo (PAADV).

  REVOGAÇÃO

  2.1 Não aplicável.

  FUNDAMENTOS

  3.1 A Resolução no 30, de 21 de maio de 2008, institui em seu Art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou
  RBHA.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC ou RBHA, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 Esta IS apresenta meios aceitáveis de cumprimento para os seguintes requisitos: 121.1221(a)
  e (b) do RBAC nº 121 e 135.29(d) do RBAC nº 135.

  DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas nos RBAC nº 01, RBAC nº
  91, RBAC nº 121 e RBAC nº 135 e as seguintes definições:'
