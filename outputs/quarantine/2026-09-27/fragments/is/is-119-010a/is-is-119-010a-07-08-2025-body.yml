text: '07.08.2025

  OBJETIVO

  1.1 Esclarecer, detalhar e orientar a aplicação dos requisitos do programa de treinamento
  de manutenção e de manutenção preventiva - PTM, previstos nos Regulamentos Brasileiros da
  Aviação Civil - RBAC nº 121 e RBAC nº 135, aplicável aos operadores de serviço de transporte
  aéreo, descrevendo um meio aceitável, mas não único, para elaborar o programa de treinamento
  para o pessoal de manutenção e manutenção preventiva, tal como requerido pelas seções 121.375
  do RBAC nº 121 e 135.433 do RBAC nº 135.


  REVOGAÇÃO

  2.1 Não Aplicável.


  FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da Anac.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.

  3.5 As seções 121.375 do RBAC nº 121 e 135.433 do RBAC nº 135 estabelecem os requisitos
  de treinamento relativos à manutenção (incluindo inspeção), manutenção preventiva e alteração
  para operadores aéreos.


  DEFINIÇÕES

  No texto desta IS, os termos abaixo definidos, quando grafados com inicial maiúscula, devem
  ser entendidos como segue.

  4.1 Centros de Instrução de Aviação Civil (CIAC): organização certificada conforme o RBAC
  nº 141 cuja finalidade é formar recursos humanos para a aviação civil, conduzindo seus alunos
  para a obtenção das licenças, habilitações e certificados requeridos pela Anac.

  4.2 Competência: conhecimentos, habilidades e atitudes requeridas para executar adequadamente
  uma tarefa.

  4.3 Doutrinação: tipo de treinamento inicial fornecido por operadores aéreos contendo conhecimentos
  básicos a serem ministrado a seus funcionários, sobre o operador, como ele é estabelecido,
  como funciona, seus procedimentos, suas prerrogativas, limitações, seus manuais, a regulamentação
  aplicável, etc.

  4.4 Função de Manutenção: uma etapa, ou uma série de etapas, no processo de execução de
  manutenção, manutenção preventiva ou alteração e funções de inspeção, que pode resultar
  na aprovação de um artigo para retorno ao serviço, e funções de registro.

  4.5 Funcionário Técnico: pessoa com Competência para executar Funções de Manutenção.

  4.6 Requisitos de Treinamento: quaisquer necessidades relativas a treinamento, seja para
  uma pessoa, um operador aéreo, um curso, ou uma Função de Manutenção. Exemplos: Competências
  necessárias para uma pessoa (ou para uma Função de Manutenção), tipo do treinamento necessário
  para executar uma tarefa, cursos necessários para uma pessoa, etc.


  DESENVOLVIMENTO DO ASSUNTO

  5.1 O PTM de operadores de serviço de transporte aéreo'
