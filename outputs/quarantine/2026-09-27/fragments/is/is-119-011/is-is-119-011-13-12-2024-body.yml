  OBJETIVO

  1.1

  Apresentar meio aceitável para a celebração e implementação, por parte de operadores aéreos
  brasileiros, de acordos entre operadores aéreos em que se identifique impacto na forma de
  cumprimento dos requisitos operacionais

  .

  REVOGAÇÃO

  2.1 Não se aplica.

  FUNDAMENTOS

  A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da Anac.

  O meio ou procedimento alternativo mencionado no parágrafo 3.2b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.

  Esta IS é fundamentada e objetiva oferecer método de cumprimento ao parágrafo 119.53(e)
  do RBAC nº 119 e ao RBAC nº 129.

  DEFINIÇÕES

  Para os efeitos desta IS, são válidas as definições listadas na seção 01.1 do RBAC nº 01
  e as seguintes definições:

  Código compartilhado (

  codeshare

  )

  significa, conforme a Resolução nº 692, de 21 de setembro de 2022, um acordo de cooperação
  comercial por meio do qual uma empresa aérea permite que outra empresa aérea utilize seu
  código designador em um voo da primeira, ou por meio do qual 2 (duas) empresas aéreas compartilham
  o mesmo código em um voo.

  Operador comercial

  significa o operador responsável pelos aspectos comerciais do voo, incluindo o disposto
  nas Resoluções nº 400/2016 (Condições Gerais de Transporte Aéreo), nº 280/2013 (acessibilidade
  de passageiros com necessidade de assistência especial ao transporte aéreo), nº 440/2017
  (processo de registro dos serviços de transporte aéreo) e nº 682/2022 (regras de alocação
  e monitoramento do uso da infraestrutura aeroportuária), bem como na IAC 200-1001 (plano
  de assistência às vítimas de acidentes aeronáuticos e apoio aos seus familiares) e demais
  regulamentações relacionadas à oferta e à prestação do serviço de transporte aéreo.

  Operador técnic

  o

  significa o operador responsável pelos aspectos técnico-operacionais do voo, incluindo o
  disposto dos RBAC aplicáveis, de acordo com os procedimentos estabelecidos em seu sistema
  de documentos de segurança operacional. É o detentor do Certificado de Operador Aéreo (COA)
  sob o qual ocorre o voo, o operador registrado da aeronave e quem exerce o controle operacional.

  Lista de abreviaturas:

  ACMI -

  Aircraft, Crew, Maintenance, and Insurance

  .

  Anac - Agência Nacional de Aviação Civil

  Avsec -

  Aviation security

  CCM - Centro de controle de manutenção

  CCO - Centro de controle de operações

  COA - Certificado de Operador Aéreo

  EO - Especificações operativas

  IATA -

  International Air Transport Association

  IOSA -

  IATA Operational Safety Audit

  IS - Instrução Suplementar

  RBAC - Regulamento Brasileiro da Aviação Civil

  SPO - Superintendência de Padrões Operacionais

  DESENVOLVIMENTO DO ASSUNTO

  Introdução

  Normalmente, na condução de uma operação de serviço de transporte aéreo, um único operador
  aéreo assume as responsabilidades sobre os aspectos técnicos e sobre os aspectos comerciais.
  Nos acordos abrangidos por esta IS, é possível que ocorra uma cisão da figura do operador
  aéreo, com um operador responsável perante a Anac pelos aspectos técnico-operacionais da
  condução do voo propriamente dito (operador técnico); e outro operador responsável pelos
  aspectos comerciais (operador comercial).

  Ainda, é possível que esses acordos entre operadores aéreos impliquem em alteração na forma
  de execução de atividades necessárias à condução da operação aérea (sob responsabilidade
  do operador técnico), que podem passar a ser realizada

  s pelo operador comercial (ou empresas subcontratadas).

  Os mesmos requisitos devem ser cumpridos, de acordo com os procedimentos estabelecidos no
  sistema de documentos de segurança operacional do operador técnico, porém, por se alterar
  quem executará os procedimentos e eventualmente alterar os próprios procedimentos utilizados
  para garantir esse cumprimento, fica caracterizado um impacto na forma de cumprimento dos
  requisitos operacionais.

  Ressalta-se que a responsabilidade primária pelas atividades se mantém com o operador técnico,
  podendo haver somente a alteração de quem executará as atividades. Eventual falha na execução
  da atividade pelo operador comercial (ou empresas subcontratadas) que implique em descumprimento
  de um requisito aplicável ao operador técnico ou um descumprimento dos procedimentos estabelecidos
  no sistema de documentos de segurança operacional do operador técnico é re

  sponsabilidade final do operador técnico.

  Nota

  : alguns exemplos de atividades que poderiam ser impactadas constam no parágrafo 5.2.3.1
  desta IS.

  Esses acordos podem ser denominados, entre outras formas:

  a) ACMI -

  Aircraft, Crew, Maintenance, and Insurance

  .

  b) fretamento estendido (

  extended charter

  );

  c) arrendamento com tripulação (

  wet leasing

  ). Embora o mercado utilize essa denominação, às vezes até com base no uso também por autoridades
  estrangeiras, registra-se que, na Anac, conforme o RBAC nº 01 e Lei nº 7.565, somente se
  cara

  cteriza o

  wet leasing

  se houver, efetivamente o arrendamento da aeronave. Vide parágrafos 5.1.6 e 5.1.75.1.6 desta
  IS.

  Nota

  : acordos de código compartilhado não implicam, necessariamente, na necessidade de atendimento
  a esta IS, uma vez que o mero compartilhamento de código em um único voo não implica, por
  si só, em impactos operacionais.

  Nos acordos abrangidos por esta IS, a operação deve ser conduzida pelo operador técnico,
  sob o seu Certificado de Operador Aéreo (COA) e suas Especificações Operativas, utilizando
  os procedimentos estabelecidos em seu sistema de documentos de segurança operacional e mediante
  os treinamentos requeridos no seu programa de treinamento. Portanto, somente podem ser conduzidas
  operações de acordo com a certificação deste operador. Como exemplo, temos:

  a) os aeródromos ou áreas de operação utilizados;

  b) os mínimos operacionais de aeródromos;

  c) as operações especiais autorizadas (CAT II/III, LVTO, PBN, RVSM, ETOPS etc);

  d) as limitações de transporte de artigos perigosos;

  e) entre outras.

  Esta IS foca somente nos aspectos técnicos do acordo. Não é escopo desta IS abordar as regras
  de acesso ao mercado.

  Operações que se enquadram na definição de

  wet leasing

  (arrendamento com tripulação), conforme o RBAC nº 01, caracterizadas por haver a transferência
  da posse da aeronave do operador primário (arrendador) para o secundário (arrendatário),
  não fazem parte do escopo desta IS, uma vez que, nesta IS, se assume que o operador técnico
  retém a posse da aeronave durante todo o período de vigência do contrato. Assim, não são
  aplicáveis às operações sob esta IS os requisitos específicos de

  wet leasing

  , como os previstos nos parágrafos 119.53(a) a (d) do RBAC nº 119 ou no Título IV, Capítulo
  IV, Seção II da Lei nº 7.565, o Código Brasileiro de Aeronáutica (CBA).

  Ressalva-se que, por vezes, o mercado utiliza a expressão

  wet leasing

  para denominar contratos em que não há, efetivamente, transferência da posse da aeronave
  e que, por conseguinte, não se caracterizam como arrendamento (nem com nem sem tripulação).
  Esta IS não pretende impedir esse uso pelo mercado; porém, na interação com a SPO e nos
  documentos submetidos à SPO (incluindo o sistema de documentos de segurança operacional
  do operador), deve se buscar utilizar a expressão somente no sentido estabelecido no RBAC
  nº 01, de forma a evitar interpretações incorretas.

  Há ainda o uso da expressão

  damp leasing

  para se referir a contratos que envolvem, além da aeronave, somente parte da tripulação
  (normalmente, a tripulação de voo, mas não a tripulação de cabine). Para a Anac, esta situação
  é tratada como

  wet

  leasing, uma vez que a definição de

  wet leasing

  não especifica a obrigação de abranger toda a tripulação. Assim, se houver transferência
  de posse da aeronave, aplica-se o parágrafo 5.1.6 desta IS. Por outro lado, se não houver
  transferência da posse da aeronave, ou seja, esta for mantida com o operador técnico, deve-se
  atentar às limitações estabelecidas nos parágrafos 5.2.5 e 5.2.6 desta IS.

  Itens a serem avaliados

  O operador técnico mantém a responsabilidade final sobre os aspectos técnicos da operação,
  ainda que parte das atividades associadas a estes aspectos técnicos possa ser realizada
  por terceiros, como o operador comercial. Para tanto, o operador técnico deve possuir a
  certificação requerida para a condução das operações de serviço de transporte aéreo, conforme
  as características de certificação do operador de serviço de transporte aéreo (vide RBAC
  nº 01) necessárias para a condução das operações sob o acordo. Assim, o operador técnico
  deve:

  a) no caso de operadores brasileiros, possuir COA emitido segundo o RBAC nº 119; e

  b) no caso de operadores estrangeiros, possuir COA emitido pela Autoridade de Aviação Civil
  do Estado do operador e reconhecido como válido, conforme processo de homologação previsto
  na IS nº 129-001.

  Entre as características de certificação de operador de serviço de transporte aéreo, consta,
  entre outras, se a operação é regular ou não regular; nacional ou internacional; a aeronave
  utilizada; e o RBAC sob o qual deve ser conduzida a operação (RBAC nº 121 ou 135). Assim,
  se, por exemplo, o operador técnico pretender realizar uma operação regular (ou agendada,
  isto é, na qual o horário de partida, o local de partida e o local de destino são definidos
  e ofertados previamente pelo detentor de certificado, seu representante ou operador comercial),
  então o operador técnico também deve ser certificado para realizar operações regulares e
  conduzir a operação de acordo com os requisitos aplicáveis a operações regulares (como os
  constantes dos RBAC nº 119, 121, 135 ou 129).

  No caso de voos domésticos, especialmente se o operador técnico for estrangeiro, deve-se
  atender ao art. 6º, § 2º da Lei nº 13.475, conforme aplicável. Combinado com o art. 1º,
  § 2º da mesma lei, tem-se que a tripulação deve atender às limitações operacionais da lei,
  conforme regulamentadas pela Anac no RBAC nº 117.

  Nota

  : a Lei nº 13.475, de 28 de agosto de 2017, ao mesmo tempo que em que traz matéria relacionada
  a segurança operacional - afeta às atribuições desta Agência -, também dispõe sobre matéria
  que não se dirige a esse fim - notadamente, a relacionada aos aspectos trabalhistas da relação
  que existe entre os aeronautas e seus empregadores. O cumprimento dos critérios estabelecidos
  nesta IS não afasta a necessidade do cumprimento dos demais dispositivos legais.

  O operador técnico deve identificar, conforme o acordo que pretende realizar, as atividades
  afetadas pelo acordo que impactam no cumprimento dos requisitos operacionais.

  Alguns exemplos de atividades que devem fazer parte desta avaliação pelo operador técnico
  incluem:

  a) as funções listadas na IS nº 121-013, incluindo as executivas e as associadas ao controle
  de treinamentos;

  b) o cumprimento das atividades de manutenção, reportes e comunicação com CCM;

  c) o recebimento da carga, incluindo o cumprimento do RBAC nº 175;

  d) o processo de

  check-in

  e embarque de passageiros, incluindo o recebimento de bagagem despachada e o cumprimento
  do programa de transporte de bagagem de mão e do RBAC nº 175;

  e) as informações de carregamento que são utilizadas para o planejamento do voo, incluindo
  preparação do manifesto de carga e do despacho/liberação de voo;

  f) o envio de informações do CCO para o pessoal de solo no aeroporto (incluindo a informação
  do CCO para os pilotos da aeronave, ao menos como

  backup

  );

  g) o carregamento da aeronave pela equipe de

  ground handling

  , seguindo o que foi determinado pelo CCO;

  h) serviços associados à apresentação de plano de voo e demais interações com os serviços
  de tráfego aéreo;

  i) execução de procedimentos antigelo e degelo, se for o caso;

  j) as regras de acesso à aeronave (Avsec) para o pessoal de solo; e

  k) abastecimento da aeronave, limpeza e

  catering

  .

  Nota 1

  : esta lista é exemplificativa e não exaustiva. As atividades, no caso concreto, poderão
  variar conforme o previsto no acordo que se pretenda realizar.

  Nota 2

  : se o operador técnico já terceiriza alguma dessas atividades, como o

  ground handling

  , e, portanto, já possui os procedimentos estabelecidos em seu sistema de documentos de
  segurança operacional para essa terceirização, e o acordo com outro operador aéreo envolve
  somente essa atividade, não há necessidade de considerar esse acordo como um acordo com
  impacto no cumprimento dos requisitos operacionais (ou seja, um acordo sob o escopo desta
  IS). O racional por trás dessa posição é que, essencialmente, não há diferença se o terceirizado
  é um operador aéreo ou um provedor de

  ground handling

  .

  Nota 3

  : algumas IS, como a IS nº 121-013, sobre estações de linha para operações segundo o RBAC
  nº 121, e a nº 120-016, sobre manutenção realizada por empresas de transporte aéreo, trazem
  critérios para a terceirização de alguns serviços.

  Se o operador comercial não opera o mesmo modelo e variante de aeronave, o operador técnico
  deve identificar possíveis impactos para a execução dessas atividades pelo operador comercial
  ou subcontratados. Neste caso, pode ocorrer que o operador comercial ou seus subcontratados
  não tenha

  know how

  ou experiência com o modelo e variante da aeronave - o que dificulte ou inviabilize a realização
  das atividades referentes àquela aeronave, obrigando que o operador técnico preveja outra
  forma de executá-las (diretamente ou com outro terceirizado, por exemplo).

  As atividades que caracterizam mais diretamente o exercício do controle operacional pelo
  operador, como as atividades de despacho operacional de voo e as atividades da tripulação
  de voo, devem ser realizadas diretamente pelo operador técnico. No entanto, isso não impede
  que parte das informações que serão utilizadas pelo despacho da aeronave (por exemplo, o
  peso da carga/bagagens despachadas) seja provido pelo operador comercial ou um subcontratado.

  As atividades da tripulação de cabine também possuem relação direta com o exercício do controle
  operacional pelo operador técnico. Eventual solicitação de terceirização da tripulação de
  cabine deve garantir que são cumpridos os requisitos operacionais aplicáveis à tripulação
  de cabine do operador técnico, incluindo os procedimentos estabelecidos no seu sistema de
  documentos de segurança e mediante os treinamentos requeridos no seu programa de treinamento,
  com especial atenção ao treinamento de CRM. Os impactos desta opção na interação entre a
  tripulação (entre os próprios comissários e entre comissários e tripulantes de voo) deve
  ser avaliado pelo operador técnico. A Anac considerará essa avaliação e decidirá, em cada
  caso concreto, pela viabilidade da operação proposta.

  Nota

  : a Lei nº 13.475, de 28 de agosto de 2017, ao mesmo tempo que em que traz matéria relacionada
  a segurança operacional - afeta às atribuições desta Agência -, também dispõe sobre matéria
  que não se dirige a esse fim - notadamente, a relacionada aos aspectos trabalhistas da relação
  que existe entre os aeronautas e seus empregadores. O cumprimento dos critérios estabelecidos
  nesta IS não afasta a necessidade do cumprimento dos demais dispositivos legais.

  O acordo deve prever as atividades identificadas no parágrafo 5.2.3 desta IS que serão realizadas
  pelo operador comercial ou seus subcontratados, bem como a interação entre essas partes
  e o operador técnico. Não é necessário que o contrato propriamente dito contenha todo esse
  detalhamento, mas deve haver algum documento acordado entre o operador técnico e o operador
  comercial que deixe clara essa informação.

  O operador técnico deve desenvolver, em seu sistema de documentos de segurança operacional,
  políticas e procedimentos para o operador comercial que realizar alguma das atividades identificadas
  no parágrafo 5.2.3 desta IS.

  O operador técnico deve revisar o seu sistema de documentos de segurança operacional na
  medida necessária para documentar as particularidades referentes às operações conduzidas
  sob o acordo.

  Por exemplo:

  a) caso o acordo preveja a realização de voos em aeródromos ou rotas que não eram previstos
  no guia de rotas do operador técnico, ele deverá atualizar seu guia de rotas, quanto à lista
  de aeródromos regulares e de alternativa (se aplicável), em atendimento aos parágrafos 5.1.4
  a) e b) desta IS; e

  b) caso, para a realização de voos sob o acordo dependa de atividades a serem realizadas
  pelo operador comercial (ou empresas subcontratadas), o operador técnico pode precisar revisar
  seu sistema de documentos de segurança operacional para detalhar a execução dessas atividades.
  Se o sistema de documentos de segurança operacional já previa a possibilidade de terceirização
  desta atividade, com procedimentos estabelecidos, e o operador somente irá aplicar tais
  procedimentos a um novo cenário, não seria necessária a revisão. Ressalta-se que não basta
  se prever a possibilidade de terceirização, uma vez que os procedimentos a serem executados
  devem estar estabelecidos pelo operador técnico.

  O operador técnico deve avaliar a necessidade de treinamento aos seus tripulantes e/ou pessoal
  de solo a respeito dos procedimentos referentes às operações conduzidas sob um acordo.

  O operador técnico, em conjunto com o operador comercial, deve avaliar a necessidade de
  treinamento ao pessoal de solo do operador comercial e/ou de seus subcontratados a respeito
  dos procedimentos referentes às operações conduzidas sob um acordo. Havendo a necessidade
  de tais treinamentos, deve haver previsão no sistema de documentos de segurança operacional
  do operador técnico.

  O operador técnico deve incluir as atividades identificadas no parágrafo 5.2.3 desta IS
  e que forem desempenhadas pelo operador comercial (ou empresas subcontratadas) no escopo
  do seu SGSO e, conforme aplicável, programas de

  compliance

  .

  O operador comercial deve, como parte de seu SGSO, realizar uma verificação inicial e um
  monitoramento contínuo sobre as operações conduzidas pelo operador técnico, com vistas a
  garantir o cumprimento dos requisitos aplicáveis e a segurança das operações contratadas.

  No caso de operadores técnicos nacionais, a verificação pode se dar pela confirmação de
  que o operador técnico possui COA e as autorizações necessárias para realizar as operações
  pretendidas.

  No caso de operadores técnicos estrangeiros, deve ser realizada auditoria inicial, prévia
  ao início das operações sob o acordo.

  5.2.13.2.1 A verificação deve incluir um registro das diferenças entre os requisitos cumpridos
  pelo operador estrangeiro e os requisitos que seriam aplicáveis às operações caso fossem
  conduzidas por operadores técnicos brasileiros. A Anac pode, por razões de segurança operacional,
  requerer o cumprimento de algum requisito específico que seria aplicável a um operador técnico
  brasileiro.

  5.2.13.2.2 Podem ser usadas auditorias providas por terceiros (por exemplo, uma auditoria
  IOSA) desde que o operador comercial tenha acesso à íntegra do resultado da auditoria e
  conclua, em documento próprio, pela aceitação dos resultados.

  O operador comercial deve manter um registro dos voos realizados por outros operadores como
  operadores técnicos, contendo informação de aeródromos de decolagem e pouso, horário de
  decolagem e o operador técnico que realizou o voo. O registro deve ser mantido por pelo
  menos 5 anos.

  Processo de aprovação

  As operações sob acordos abrangidos por esta IS devem ser autorizadas nas EO emitidas pela
  Anac dos operadores técnico e comercial. No caso de envolvimento de operadores estrangeiros,
  no entanto, não é prevista a emissão de EO pela Anac ou a necessidade de revisão da EO emitida
  pela autoridade do Estado do operador.

  O processo de alteração de EO é conduzido de acordo com a IS nº 119-001 ou 119-004, conforme
  aplicável.

  O operador técnico deve enviar:

  a) Solicitação de alteração de EO

  b) Comprovante de pagamento de TFAC aplicável

  c) Cópia do contrato, podendo incluir documentos complementares integrantes do acordo, com
  no mínimo as seguintes informações:

  a. tipo de acordo;

  b. operadores envolvidos, identificados pelo nome e COA. Ainda, deve constar no contrato
  quem exerce o papel de operador comercial e quem exerce o papel de operador técnico;

  c. as atividades afetadas pelo acordo, conforme parágrafo 5.2.3 desta IS, e as associadas
  responsabilidades pela execução (vide parágrafo 5.2.7 desta IS);

  d. início e duração do acordo;

  e. aeronaves envolvidas no acordo, incluindo marcas de nacionalidade ou matrícula. Se o
  acordo não especificar as marcas de nacionalidade e matrícula, deve incluir os modelos e
  variantes de aeronave; nesse caso o operador técnico deve enviar as marcas de nacionalidade
  e matrícula das aeronaves posteriormente, tão logo sejam definidas, mantendo essa informação
  atualizada;

  f. demais informações necessárias para verificação do cumprimento do previsto nesta IS;
  e

  d) alterações no sistema de documentos de segurança operacional, se aplicável (vide parágrafos
  5.2.8 a 5.2.12 desta IS).

  O operador comercial deve enviar:

  a) solicitação de alteração de EO;

  b) comprovante de pagamento de TFAC aplicável;

  c) resultado da verificação inicial requerida conforme parágrafo 5.2.13 desta IS; e

  d) alterações no sistema de documentos de segurança operacional, se aplicável (vide parágrafo
  5.2.13 e 5.2.14 desta IS).

  Ao final do processo, são emitidas as revisões das Especificações Operativas.

  A Anac pode, a qualquer momento, por razões de segurança operacional, limitar ou suspender
  autorizações emitidas em conformidade com esta IS. Particularmente, se configuram casos
  típicos em que essa situação pode ocorrer:

  a) quando operadores estrangeiros atuam como operadores técnicos, sem o atendimento aos
  requisitos que seriam aplicáveis às operações caso fossem conduzidas por operadores técnicos
  brasileiros, conforme deve ser identificado pela verificação requerida pelo parágrafo 5.2.13.2.1
  desta IS. Neste caso, conforme previsto no mesmo parágrafo, a Anac pode também determinar
  o cumprimento de algum requisito específico; e

  b) quando as operações conduzidas sob acordos conforme esta IS adquirirem proporção tal
  entre as operações próprias do operador comercial, a ponto de se configurar prejuízo ao
  processo de auditoria e monitoramento contínuo sobre o(s) operador(es) técnico(s), requerido
  do operador comercial, conforme 5.2.13 desta IS.

  APÊNDICES

  Apêndice A - Reservado

  DISPOSIÇÕES FINAIS

  Acordos que se enquadrem nesta IS e que estejam em execução quando da entrada em vigor desta
  IS devem se adequar às disposições desta IS em até 12 meses após a entrada em vigor desta
  IS. A Anac pode, por razões de segurança operacional, determinar o cumprimento de algum
  critério específico desta IS ou de toda a IS, antes deste prazo.

  Os casos omissos serão dirimidos pela Anac.

