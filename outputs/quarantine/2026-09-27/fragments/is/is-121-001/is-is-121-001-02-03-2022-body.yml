text: '02.03.2022


  OBJETIVOS

  Esta Instrução Suplementar tem por objetivos:

  1.1 apresentar procedimentos aceitável para a elaboração do guia de rota, de modo a dar
  cumprimento aos requisitos dos parágrafos 121.135(b)(6)(i) e 121.135(b)(7)(i) do RBAC nº
  121;

  1.2 apresentar procedimentos aceitáveis para o processo de revisão do guia de rota; e

  1.3 apresentar os procedimentos aceitáveis para utilização do guia de rota em serviço.


  REVOGAÇÃO

  2.1 Esta IS substitui a IS nº 121-001 Revisão B.


  FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou
  RBHA.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC ou RBHA, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 Esta IS é fundamentada e objetiva oferecer método de cumprimento aos parágrafos 121.135(b)(6)(i)
  e 121.135(b)(7)(i) do RBAC nº 121.

  DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas no RBAC nº 01 e as seguintes
  definições:

  4.1.1 Guia de rota: uma parte do sistema de manuais de operações do operador, que contém
  informações específicas sobre os aeródromos, rotas e áreas utilizados pelo operador em suas
  operações.

  4.2 Lista de abreviaturas:

  AIP - Aeronautical information publication

  AIRAC - Aeronautical Information Regulation And Control (Regulamentação e Controle de Informação
  Aeronáutica)

  ANAC - Agência Nacional de Aviação Civil

  ATS - Air traffic service (serviço de tráfego aéreo)

  EFB - Electronic flight bag

  EO - Especificações operativas

  ETOPS - Extended operations

  EVS - Enhanced vision system

  FMS - Flight management system

  FOSA - Flight operational safety assessment

  HUD - Head up display

  IATA - International Air Transport Association

  ICAO - International Civil Aviation Organization (Organização da Aviação Civil Internacional)

  IFR - Instrument flight rules (regras de voo por instrumentos)

  IS - Instrução Suplementar

  MEL - Minimum equipment list (Lista de equipamentos mínimos)

  MNPS - Minimum navigation performance specification

  NOTAM - Notice to airmen

  RBAC - Regulamento Brasileiro de Aviação Civil

  RVR - Runway visual range (alcance visual de pista)

  RVSM - Reduced vertical separation minimum

  SPO - Superintendência de Padrões Operacionais

  VFR - Visual flight rules (regras de voo visual)

  VHF - Very high frequency

  PROCEDIMENTOS PARA ELABORAÇÃO, ATUALIZAÇÃO E UTILIZAÇÃO DO GUIA DE ROTA

  5.1 Elaboração do guia de rota'
