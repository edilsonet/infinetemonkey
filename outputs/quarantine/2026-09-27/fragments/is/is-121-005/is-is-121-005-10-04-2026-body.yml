  OBJETIVO

  1.1 Apresentar procedimentos aceitáveis para a elaboração do Manual Geral de Operações de
  operadores aéreos regidos pelo RBAC nº 121;

  1.2 Apresentar procedimentos aceitáveis para o processo de revisão do Manual Geral de Operações
  por tais operadores; e

  1.3 Apresentar os procedimentos aceitáveis para utilização do Manual Geral de Operações
  em serviço por tais operadores.

  REVOGAÇÃO

  2.1 Esta IS revoga a IS nº 121-005 Revisão E.

  FUNDAMENTOS

  3.1 A Resolução no 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da Anac.

  3.3 O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 Esta IS apresenta meios aceitáveis de cumprimento da Subparte G do RBAC nº 121, exceto
  os parágrafos 121.135(b)(6), (7), (8), (9), (10), (11), (16), (17), (18), (20), (25), (27)
  e (28), e seção 121.141.

  DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas no RBAC nº 01 e as seguintes
  definições:

  4.1.1 Lista de matrículas autorizadas: documento previsto nos parágrafos 119.49(a)(4)(i)
  e 119.49(b)(4)(i) do RBAC nº 119, contendo o tipo da aeronave, marcas de matrícula e número
  de série de cada aeronave de utilização autorizada e incorporado por referência no parágrafo
  aplicável das especificações operativas.

  4.1.2 Serviços de solo: serviços necessários para partida ou chegada de uma aeronave em
  um aeródromo que não sejam serviços de tráfego aéreo. São também denominados "serviços auxiliares
  ao transporte aéreo" ou, na terminologia em inglês, ground handling.

  4.2 Lista de abreviaturas (em ordem alfabética):

