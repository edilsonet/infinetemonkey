title: B11.1(c)
text: '(c) procedimentos para determinar a adequação das instalações e serviços do aeroporto
  e do operador para suporte às operações. Deve incluir, pelo menos:

  I. serviços de manutenção, próprios ou terceirizados, que serão realizados no aeródromo,
  considerando o requerido no programa de manutenção aprovado para o modelo de aeronave;

  Nota: os procedimentos específicos para realização dessa análise da adequação dos serviços
  de manutenção devem estar nos manuais de manutenção do operador, e devem somente ser referenciados
  neste item do MGO, para que os resultados da análise façam parte do relatório de auditoria
  interna de que trata o item B3.6(f) desta IS. Esses procedimentos devem incluir, pelo menos:

  a. determinação dos serviços de manutenção requeridos;

  b. determinação dos serviços de manutenção que serão disponibilizados;

  c. treinamento requerido do pessoal que irá executar e supervisionar a manutenção;

  d. requisitos para contratação de manutenção terceirizada; e

  e. caso não seja disponibilizada manutenção no aeródromo, procedimentos para liberação de
  manutenção da aeronave em caso de necessidade de atendimento de manutenção.

  II. aplicação do treinamento requerido para pessoal próprio e terceirizado no aeródromo,
  considerando as funções e os serviços que serão prestados e as aeronaves que serão operadas;

  III. disponibilização de partes aplicáveis do sistema de manuais e demais documentos do
  operador (como MGO, MAP, programa de treinamento do pessoal de aeroportos, procedimentos
  de operações no solo, de carregamento da aeronave, de abastecimento);

  IV. disponibilização de PRE/PLEM para o aeródromo. Deve abranger ainda o PRAI, incluindo
  a necessidade de acordo operacional com o aeródromo, conforme a seção 153.325 do RBAC nº
  153;

  V. disponibilização de equipamentos de comunicação entre o aeródromo e o centro de despacho
  do operador, e entre o aeródromo e a aeronave, conforme aplicável pela seção 121.99 e os
  procedimentos de controle operacional do operador;

  VI. disponibilização de equipamentos para controle de peso e dimensões de carga e bagagem
  (despachada ou de mão); e

  VII. disponibilização de informações meteorológicas e aeronáuticas aos pilotos;'
