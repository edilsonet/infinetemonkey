text: '(i) procedimentos de distribuição de cargas e assentos.

  B8.1.9. Plano de voo ATS. Procedimentos e responsabilidades pela preparação e apresentação
  do plano de voo ATS. Os fatores a considerar incluem os meios de apresentação de planos
  de voo individuais e repetitivos.

  B8.1.10. Despacho ou liberação de voo. Procedimentos e responsabilidades pela preparação
  e aceitação do despacho ou liberação de voo, incluindo modelos dos formulários e documentos
  utilizados. As informações do despacho ou liberação de voo devem incluir pelo menos o previsto
  nas seções 121.687 ou 121.689 do RBAC nº 121, conforme aplicável.

  B8.1.11. Diário de bordo e relatório técnico da aeronave. Responsabilidades e procedimentos
  para utilização do diário de bordo e relatório técnico das aeronaves, incluindo os modelos
  utilizados. Deve atender à seção 121.715 do RBAC nº 121 e à Resolução nº 773, de 25 e junho
  de 2025, bem como à IS nº 91-016.

