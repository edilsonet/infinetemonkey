title: B11.1(l)
text: '(l) descrição do código de sinais terra/ar para utilização de sobreviventes de acidentes
  e utilização de ajudas de sinais; e

  Nota: os sinais aplicáveis podem ser consultados na ICA 64-7 (Busca e Salvamento), publicada
  pelo Comando da Aeronáutica ou no Anexo 12 à Convenção de Chicago (Search and Rescue).'
