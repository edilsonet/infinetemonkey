title: Resumo.
text: '5.1.2.8 Resumo.

  a) Todo o pessoal não empregado anteriormente pelo operador como tripulante ou DOV deve
  completar o treinamento Inicial de Nova Contratação.

  b) Todo o pessoal deve completar o treinamento Periódico para a função e o tipo de aeronave
  para o qual eles são atualmente habilitados dentro do período de elegibilidade apropriado.

  c) Todo o pessoal que se tornou não qualificado para uma função em um tipo de aeronave com
  o operador deve ser afastado da função até completar o treinamento de Requalificação para
  restabelecer a qualificação para essa função e tipo de aeronave.

  d) Todo o pessoal que está sendo redesignado pelo operador a uma função e/ou tipo de aeronave
  diferente deve completar o treinamento Inicial de equipamento, Transição, ou Elevação de
  Nível, dependendo do tipo de aeronave e função para o qual foram previamente qualificados.'
