text: '01.09.2023


  OBJETIVO

  1.1 Apresentar uma metodologia que proporcione a elaboração de programa de treinamento operacional
  (PTO) aceitável pela ANAC, de forma a assegurar treinamento adequado ao desempenho das atribuições
  de cada tripulante de voo (piloto e mecânico de voo) utilizado por detentores de certificado
  emitido segundo o RBAC nº 119 e que conduzam operações segundo o RBAC nº 121, de modo a
  dar cumprimento ao requerido nas subpartes N, O, W e X do RBAC nº 121.

  REVOGAÇÃO

  2.1 Esta IS substitui a IS nº 121-007 Revisão B.

  FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:


  a) Adotar os meios e procedimentos previamente especificados em IS; ou

  b) Apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 Esta IS é fundamentada e objetiva oferecer método de cumprimento às subpartes N, O,
  W e X do RBAC nº 121.

  3.6 Esta IS complementa e se relaciona com a IS nº 121-006.

  DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas na Seção 119.3 do RBAC
  nº 119, as definições listadas no RBAC nº 01, no RBAC nº 121, na IS nº 121-006 e as seguintes
