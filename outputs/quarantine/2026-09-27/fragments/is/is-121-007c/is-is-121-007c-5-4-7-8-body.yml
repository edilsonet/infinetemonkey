title: 'Amaragem:'
text: '5.4.7.8 Amaragem:


  a) preparação da cabine de comando e da cabine de passageiros;

  b) instruções aos passageiros;

  c) coordenação dos tripulantes;

  d) ondas primárias, secundárias e condições do mar;

  e) direção da amaragem; e

  f) amaragem à noite.'
