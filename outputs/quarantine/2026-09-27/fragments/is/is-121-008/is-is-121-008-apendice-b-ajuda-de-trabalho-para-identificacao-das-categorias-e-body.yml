text: 'APÊNDICE B - AJUDA DE TRABALHO PARA IDENTIFICAÇÃO DAS CATEGORIAS E

  CURRÍCULOS MÍNIMOS

  Este apêndice apresenta uma sugestão de método, ilustrativo, para identificar as categorias
  e os

  currículos necessários.

  Quais são as aeronaves do operador pertencentes ao grupo I?

  Quais são as aeronaves do operador pertencentes ao grupo II?

  O Treinamento Inicial de Contratação vai se iniciar em qual grupo? ( ) Grupo I ( ) Grupo
  II

  O Treinamento Inicial de Contratação vai englobar todas as aeronaves do mesmo

  grupo?

  ( ) Sim ( ) Não

  Se não, qual é a aeronave base do treinamento?

  O Treinamento inicial de equipamento para o outro grupo será baseado em qual

  aeronave?

  Considerando as informações acima, insira um “X” nos campos da tabela onde será necessário
  um Currículo.'
