title: apendice-b-procedimentos-para-realizacao-de-exame-de-competencia-para-comissarios-de-voo(a)
text: 'a) erro de halo: alguns examinadores não conseguem evitar que sua impressão geral sobre
  um indivíduo influa na apreciação sobre o desempenho desse indivíduo. Se a impressão geral
  do examinador sobre uma pessoa é boa, ele tende a apreciá-lo com benevolência. Se, ao contrário,
  a impressão geral do examinador sobre o indivíduo é ruim, ele tende a avaliá-lo com excesso
  de rigor. Pode ocorrer também que a avaliação de um fator específico contamine a avaliação
  dos outros, seja de forma positiva ou negativa, distorcendo a avaliação de cada fator isoladamente.
  Na hora de avaliar deve-se evitar generalizações;'
