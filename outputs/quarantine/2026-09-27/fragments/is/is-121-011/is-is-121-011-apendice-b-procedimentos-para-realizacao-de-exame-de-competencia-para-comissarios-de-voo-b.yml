text: 'b) objetividade: a falta de objetividade é o erro mais frequentemente encontrado na
  avaliação. Questões não objetivas normalmente são prejudicadas pela falta de clareza e dão
  margem a duplo sentido. Devem-se ressaltar os aspectos mais comumente encontrados ou aplicados
  na operação. O importante é saber qual ação a tomar. O conhecimento do porquê não deixa
  de ter seu valor na solução de determinados problemas, mas o examinador não deve conduzir
  a avaliação de modo que o conhecimento do acessório sobrepuje o do principal.'
