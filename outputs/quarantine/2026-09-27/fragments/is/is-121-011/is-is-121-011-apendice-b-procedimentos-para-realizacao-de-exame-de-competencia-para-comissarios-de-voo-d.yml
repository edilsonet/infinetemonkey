text: 'd) erro lógico: existe, quando o examinador tende a dar apreciações semelhantes a características
  nem sempre relacionadas. Por exemplo, um comissário que apresente qualidades no serviço
  de bordo, seja muito simpático ou atencioso demais com os passageiros, pode não ser um bom
  comissário, no sentido de conhecer a aeronave e os equipamentos de emergência.'
