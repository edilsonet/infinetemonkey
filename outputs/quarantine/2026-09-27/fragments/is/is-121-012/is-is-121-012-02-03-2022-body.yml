text: '02.03.2022

  OBJETIVO

  1.1 Esta Instrução Suplementar (IS) objetiva estabelecer os critérios para obtenção de aprovação
  e para condução de operações prolongadas (ETOPS) e operações em áreas polares para detentores
  de certificado que operam segundo o RBAC nº 121, abrangendo os aspectos operacionais e de
  manutenção, incluindo treinamentos.

  1.2 Objetiva ainda fornecer orientações para os detentores de certificado não autorizados
  a conduzir operações ETOPS, de forma a garantir que não entrem inadvertidamente em rotas
  ETOPS.

  REVOGAÇÃO

  N/A

  FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou
  RBHA.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC ou RBHA, poderá:


  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 Esta IS é fundamentada e objetiva oferecer método de cumprimento à seção 121.161 e ao
  Apêndice P do RBAC nº 121.

  3.6 Esta IS se relaciona ainda às seções 121.7, 121.97, 121.99, 121.103, 121.106, 121.117,
  121.121, 121.122, 121.135, 121.162, 121.163, 121.191, 121.193, 121.197, 121.333, 121.374,
  121.565, 121.569, 121.607, 121.609, 121.624, 121.625, 121.631, 121.633, 121.646, 121.687,
  121.689 e 121.703 do RBAC nº 121.

  DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas na seção 01.1 do RBAC nº
  01 e na seção 121.7 do RBAC nº 121 e as seguintes definições:

  4.1.1 Aeródromo adequado significa um aeródromo constante na Lista de Aeródromos Regulares
  e de Alternativa de um detentor de certificado que atende às limitações para pouso da seção
  121.197 do RBAC nº 121. Podem ser considerados aeródromos militares que estejam ativos e
  operacionais, desde que cumpram a disposição anterior.

  Nota 1: embora a definição do RBAC nº 121 estabeleça como exigência que o aeródromo, além
  de atender às limitações para pouso da seção 121.197 do RBAC nº 121, deve ser, também, um
  aeródromo militar ativo e operacional, na prática isso inviabilizaria praticamente qualquer
  operação não ETOPS sob o RBAC nº 121. Portanto, para os fins desta IS, a ANAC estabelece
  a definição acima como a interpretação correta da definição de aeródromo adequado presente
  na seção 121.7 do RBAC nº 121, até que o RBAC seja alterado.

  Nota 2: a definição do RBAC nº 121 foi adequada com relação à menção às Especificações Operativas,
  considerando que a ANAC adota a lista de aeródromos regulares e de alternativa como forma
  de registro dos aeródromos utilizados pelo detentor de certificado, conforme autorizado
  pelos parágrafos 119.49(a)(4)(i) e (b)(4)(i) do RBAC nº 119.

  4.1.2 Aeródromo de alternativa ETOPS (também denominado aeródromo de alternativa em rota
  ETOPS) significa aeródromo adequado designado no despacho de voo para uso no evento de desvio
  para alternativa durante uma operação ETOPS.

  Nota: essa definição se aplica ao planejamento de voo e de nenhuma forma limita a autoridade
  do piloto em comando durante o voo.'
