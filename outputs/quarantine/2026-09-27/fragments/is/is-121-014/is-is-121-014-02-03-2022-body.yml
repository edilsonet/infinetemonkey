text: '02.03.2022


  OBJETIVO

  São objetivos desta IS:

  a) apresentar procedimentos aceitáveis para a elaboração do Manual de Comissários de Voo
  (MCmsV) de operadores aéreos regidos pelo RBAC nº 121;

  b) apresentar procedimentos aceitáveis para o processo de revisão do MCmsV por tais operadores;
  e

  c) apresentar os procedimentos aceitáveis para utilização do MCmsV em serviço por tais operadores.

  REVOGAÇÃO

  2.1 Não aplicável.

  FUNDAMENTOS

  3.1 A Resolução no 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou
  RBHA.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC ou RBHA, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 Esta IS apresenta meios aceitáveis de cumprimento do RBAC nº 121 e Resoluções correlatas
  à elaboração do MCmsV para atuação dos comissários de voo em operações regidas pelo RBAC
  nº 121.

  DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas no RBAC nº 01, RBAC nº
  121, Resolução nº 280/2013 e Resolução nº 461/2018.

  4.2 Lista de abreviaturas (em ordem alfabética):


  APU - Auxiliary power unit (Unidade presenta de energia)

  CB - circuit breakers

  COA - Certificado de Operador Aéreo

  EO - Especificações Operativas

  GCI - Gerenciamento do Comportamento Inconveniente

  IS - Instrução Suplementar

  LEP - Lista de páginas efetivas

  MCmsV - Manual de Comissários de Voo

  MGO - Manual Geral de Operações

  PA - Sistema de comunicação com os passageiros

  PBE - Equipamento protetor de respiração

  PED - Portable Electronic Devices

  PLEM - Plano de Emergência Aeroportuário

  PNAE - Pessoa com necessidade de assistência especial

  PRE - Plano de Resposta a Emergências

  QRH - Quick Reference Handbook

  RBAC - Regulamento Brasileiro da Aviação Civil

  RTO - Rejected Takeoff

  SGRF - Sistema de Gerenciamento de Risco da Fadiga

  TUC - Tempo Útil de Consciência

  TUL -Tempo Útil de Lucidez

  WAP - Walk Around Procedure

  DESENVOLVIMENTO DO ASSUNTO

  5.1 Introdução

  5.1.1 O MCmsV deve conter todas as informações, políticas e procedimentos do operador não
  relacionadas a um tipo específico de aeronave, ou seja, que se aplicam de forma genérica
  às operações, assim como deve conter também informações pertinentes e procedimentos de emergência
  específicos à frota, dedicando capítulos a cada tipo de aeronave operada, já que é permitido
  ao comissário ser habilitado em todas elas. O manual também deve conter as regras administrativas
  relacionadas ao controle e às revisões do documento, sua distribuição, acessibilidade etc.

  5.1.2 A elaboração do manual deve ser realizada considerando as disposições dos RBAC, Resoluções,
  bem como de Instruções Suplementares e outros normativos específicos que tratam de operações.

  5.2 Conteúdo e estrutura do MCmsV'
