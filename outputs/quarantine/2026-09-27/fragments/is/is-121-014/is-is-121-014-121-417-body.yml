text: '121.417 (b)(2)(ii)

  Apêndice A do RBAC nº 121

  Os procedimentos devem abranger, no mínimo, dentre outros cuidados adicionais julgados necessários
  pelo operador:

  a) descrição, listagem dos conteúdos e verificação da quantidade e localização no avião
  dos conjuntos de primeiros socorros, de precaução universal e do conjunto médico de emergência,
  quando aplicáveis;

  b) aplicação de primeiros socorros, considerando os limites de espaço no interior da aeronave,
  e procedimentos para uso de medicação e instrumentos invasivos;

  c) identificação de situações que requerem primeiros socorros. Interrogar o passageiro:
  SAMPLE (Sinais e sintomas, alergias, uso de medicamentos, passado pertinente, alimentação/hidratação,
  eventos associados);

  d) sinais, sintomas e tratamento de hipóxia, hiperventilação, tontura, resfriados, dores
  de ouvido e problemas de sinusite, intoxicação alimentar, dores abdominais;

  e) procedimentos em parada cardio-respiratória; uso do desfibrilador;

  f) uso de oxigênio para primeiros socorros;

  g) emergências médicas, incluindo procedimento para parto a bordo; e

  h) protocolos de higiene / precaução universal e segurança do local de atendimento.

  88'
