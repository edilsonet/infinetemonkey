text: '01.04.2022


  OBJETIVO

  1.1 Apresentar os procedimentos a serem adotados para a realização de demonstração de evacuação
  de emergência e amerissagem, em atendimento à seção 121.291 do RBAC nº 121.

  REVOGAÇÃO

  N/A

  FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas nos RBAC nº 01, 91 e 121
  e as seguintes definições:

  a) coordenador do operador - representante do operador que será o ponto focal da demonstração
  de evacuação de emergência (DEE);

  b) coordenador GCTA - responsável pela coordenação das atividades da equipe da GCTA;

  c) noite escura ou escuridão da noite - nível de iluminação que se aproxima à iluminação
  natural que ocorre 90 minutos após o pôr-do-sol oficial, sob céu claro e sem lua. Este nível
  de iluminação possibilita avaliar se o sistema de iluminação de emergência das escorregadeiras
  e botes está operacional. Níveis excessivamente baixos de iluminação podem atrapalhar a
  DEE. A forma mais efetiva de controlar a luz é por meio da utilização de um hangar fechado,
  porém o operador pode sugerir outros locais onde tenha condições de controlar tais níveis;

  d) operador - detentor de certificado ou solicitante, conforme processo de certificação
  estabelecido pela IS nº 119-001; e

  e) PlanDemo - plano de demonstração de evacuação de emergência ou de amerissagem.


  4.2 Nesta IS são utilizadas as seguintes siglas:

  a) DEA - demonstração de amerissagem;

  b) DEE - demonstração de evacuação de emergência;

  c) DPEA - demonstração parcial de amerissagem;

  d) DPEE - demonstração parcial de evacuação de emergência;

  e) DREE - demonstração real de evacuação de emergência;

  f) DREA - demonstração real de amerissagem;

  g) GCTA - Gerência de Operações de Empresas de Transporte Aéreo 121;

  h) MCmsV - manual de comissários de voo; e

  i) MGO - manual geral de operações.

  DESENVOLVIMENTO DO ASSUNTO

  5.1 Disposições gerais'
