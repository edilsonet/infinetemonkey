text: '03.10.2022


  OBJETIVO

  1.1 Apresentar procedimentos para obtenção de aprovação operacional e condução de operações
  de decolagem em baixa visibilidade, para detentores de certificado segundo o RBAC nº 119,
  operando sob o RBAC nº 121.

  REVOGAÇÃO

  N/A

  FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou
  RBHA.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC ou RBHA, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 Esta IS é fundamentada e objetiva oferecer método de cumprimento ao parágrafo 121.648a(d)
  do RBAC nº 121.

  DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas na seção 01.1 do RBAC nº
  01.

  4.2 Lista de abreviaturas:

  AFM - Aircraft flight manual (manual de voo da aeronave)

  AIP - Aeronautical information publication (publicação de informações aeronáuticas)

  ANAC - Agência Nacional de Aviação Civil

  ATC - Air traffic control (controle de tráfego aéreo)

  DOV - Despachante operacional de voo

  EO - Especificações Operativas

  FMS - Flight management system (sistema de gerenciamento de voo)

  FSTD - Flight simulation training device (dispositivo de treinamento para simulação de voo)

  HGS - Head up guidance system (Sistema de orientação head up)

  IS - Instrução Suplementar

  LVTO - Low visibility takeoff operations (operações de decolagem em baixa visibilidade)

  MEL - Minimum equipment list (lista de equipamentos mínimos)

  MGO - Manual geral de operações

  PF - Pilot flying (piloto voando)

  PM - Pilot monitoring (piloto monitorando)

  RBAC - Regulamento Brasileiro da Aviação Civil

  RNP - Required navigation performance (desempenho de navegação requerido)

  RVR - Runway visual range (alcance visual de pista)

  SOCMS - Sistema de orientação e controle da movimentação no solo

  SOP - Standard operational procedures (procedimentos operacionais padronizados)

  SPO - Superintendência de Padrões Operacionais

  TFAC - Taxa de fiscalização da aviação civil

  DESENVOLVIMENTO DO ASSUNTO

  5.1 Introdução

  5.1.1 O parágrafo 121.1648a(d) do RBAC nº 121 requer que o detentor de certificado obtenha
  aprovação específica em suas Especificações Operativas (EO) antes de realizar operações
  de decolagem em baixa visibilidade, ou seja, operações de decolagem com RVR inferior a 400m.
  Ainda, requer que nessa autorização conste o RVR mínimo (ou outra medida de visibilidade
  mínima) que pode ser utilizado nessas operações.

  5.1.2 A IS nº 91-003 aborda as operações de decolagem em baixa visibilidade mediante o emprego
  de Head Up Guidance System (HGS), que permite a obtenção de créditos operacionais. Esta
  IS aborda as operações de decolagem em baixa visibilidade sem a obtenção de créditos operacionais
  em razão do uso de HGS.'
