text: '01.09.2023

  OBJETIVO

  1.1 Esta instrução suplementar (IS) estabelece os métodos aceitáveis ​​de conformidade para
  a aprovação do programa de treinamento para a prevenção e recuperação da perda de controle
  da aeronave (UPRT) para tripulações de voo de operadores que realizam operações de acordo
  com o RBAC nº 121, em aviões que possuem dispositivos de treinamento de simulação de voo
  (FSTD) específicos para o tipo de avião a ser operado e qualificado para UPRT. No entanto,
  também são fornecidas orientações para os casos em que os operadores usam aeronaves que
  não possuem um FSTD qualificado para o UPRT.

  1.2 A fim de alcançar um UPRT eficiente em um FSTD e que isso não resulte em instrução negativa,
  esta IS fornece orientação sobre os requisitos de fidelidade necessários para que o dispositivo
  de simulação represente satisfatoriamente o comportamento e desempenho do avião durante
  o regime pós-estol ou quando o envelope de voo normal da aeronave é excedido.

  REVOGAÇÃO

  N/A

  FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou
  RBHA.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC ou RBHA, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.

  3.5 Esta IS é fundamentada e objetiva oferecer método de cumprimento às seguintes seções
  e parágrafos do RBAC nº 121: 121.407(e); 121.415(b); 121.418(a)(4); 121.419(a)(2)(xi) e
  (d); 121.423; 121.424(a) e (b)(1); 121.427(d)(1); 121.433(f) e Apêndice E.

  DEFINIÇÕES, LISTA DE REDUÇÕES E DOCUMENTOS RELACIONADOS

