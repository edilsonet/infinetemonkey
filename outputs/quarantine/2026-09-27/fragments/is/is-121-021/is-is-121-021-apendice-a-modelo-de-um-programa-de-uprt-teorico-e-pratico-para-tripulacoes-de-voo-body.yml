text: 'APÊNDICE A - MODELO DE UM PROGRAMA DE UPRT TEÓRICO E PRÁTICO PARA TRIPULAÇÕES DE VOO

  (Aplicável em FSTD específico de tipo)

  A1. Para que o UPRT seja eficaz, é importante reconhecer que as áreas temáticas e seus elementos
  de treinamento relacionados descritos neste apêndice são apenas um meio de desenvolver competências
  apropriadas e auxiliar no desenvolvimento de programas de treinamento, e que não devem levar
  a uma abordagem do tipo “ticar os quadrados” para completar um programa de instrução.

  A2. Alguns dos itens de treinamento na tabela a seguir referem-se a equipamentos específicos
  e devem ser aplicados somente se o tipo de aeronave possuir tais equipamentos (por exemplo,
  stick pusher, Fly-by-wire, indicador de Mach, outros).

  A3. Para informações mais detalhadas sobre programas teóricos, pode-se fazer referência
  à AUPRTA, Revisão 3, que descreve cada tópico relacionado que pode ser útil durante o desenvolvimento
  de um programa UPRT. Embora o AUPRTA seja geralmente desenvolvido para resolver problemas
  de aeronaves da categoria transporte, ele contém orientações valiosas que geralmente se
  aplicam a aviões menores movidos a hélice ou turbojato. Também pode ser feita referência
  ao AURTA, Revisão 2, que é a versão anterior à Revisão 3 e que foi desenvolvida para lidar
  com problemas com aeronaves de grande porte, categoria de transporte, turbojato e aeronaves
  de asa enflechada.

  Temas e elementos de instrução

  Treinamento teórico

  Treinamento prático

  A. Aerodinâmica


  aerodinâmica geral: envelope de voo aerodinâmico, fator de carga, controle lateral e direcional,
  efeitos de peso e rolagem no manuseio da aeronave, trims, guinada, etc.


  aerodinâmica avançada: curva de sustentação vs. arrasto (L/D), L/D máximo, e sua significância
  no desempenho da aeronave em geral, relação entre a curva L/D e a velocidade, empuxo requerido
  vs. disponíveis, estabilidade aerodinâmica etc.


  certificação e limitações da aeronave


  altas e baixas altitudes


  desempenho da aeronave (altas e baixas altitudes)


  ângulo de ataque (AOA) e consciência de estol


  ativação do stick-pusher


  acionamento da manete de potência


  efeitos Mach


  estabilidade do avião


  efeitos de gelo e contaminação


  vórtex de hélice


  B. Causas e fatores que contribuem para a perda de controle


  ambientais


  induzidos pelo piloto


  mecânicos


  C. Análise da segurança operacional de acidentes e incidentes relacionados à perda de controle
  da aeronave


  Temas e elementos de instrução

  Treinamento teórico

  Treinamento prático

  O foco deve estar na compreensão dos eventos que levaram à perda de controle, na tomada
  de decisão certa ou errada que contribuiu para a perda de controle e, se aplicável, na recuperação.
  Informações da ASAP, Flight Operations Quality Assurance (FOQA), ASRS podem apoiar essa
  discussão.

  Fazer referência à:

  1) CAST - Relatórios de Acidentes e Incidentes Graves: LOC

  https://skybrary.aero/articles/accident-and-serious-incident-reports-loc

  2) CENIPA - Painel SIPAER

  http://painelsipaer.cenipa.aer.mil.br/QvAJAXZfc/opendoc.htm?document=SIGAER%2Fgia%2Fqvw%2Fpainel_sipaer.qvw&host=QVS%40cirros31-37&anonymous=true

  3) Bureau d''Enquêtes et d''Analyses pour la Sécurité de l''Aviation (BEA)

  https://www.bea.aero/


  D. Consciência G


  cargas g


  consciência g lateral (derrapagem)


  gerenciamento de carga g


  E. Gerenciamento da energia


  energia cinética vs. energia potencial vs. energia química (potência)


  relação entre arfagem, potência e desempenho


  desempenho e efeitos de diferentes motores


  Temas e elementos de instrução

  Treinamento teórico

  Treinamento prático

  F. Gerenciamento da Trajetória de Voo


  entradas de automação para orientação e controle


  características específicas do tipo de aeronave


  gerenciamento de automação


  habilidades de manuseio manual


  G. Reconhecimento


  exemplos de instrumentação específica do tipo de aeronave durante a evolução e estabelecimento
  de perdas de controle


  Pitch/Power/Roll/Yaw - Os pilotos devem ter uma compreensão fundamental da instrumentação
  e dinâmica de voo em pitch, empuxo, roll e guinada para reconhecer o estado atual da aeronave
  e fazer as entradas de controle corretas para interromper a divergência ou recuperar-se
  da perda de controle.


  sistemas de proteção eficazes de exploração (vigilância eficaz)


  referências para estol aerodinâmico


  critérios para identificação de estol e guinada da aeronave


  H. Técnicas de prevenção e recuperação da perda de controle da aeronave


  intervenção oportuna e apropriada


  recuperação com nariz para cima/asas horizontais


  recuperação com nariz para baixo/asas horizontais


  técnicas de recuperação com grande ângulo de inclinação lateral


  Temas e elementos de instrução

  Treinamento teórico

  Treinamento prático

  I. Gerenciamento da Trajetória de Voo


  anormalidades nos comandos de voo


  perda de potência (parcial ou total)


  falhas de instrumento


  falhas de automação


  deterioração da proteção dos sistemas elétricos de controle de voo (fly-by-wire)


  falhas do sistema de proteção contra perdas, incluindo de alerta de gelo


  J. Elementos Instrucionais Especializados


  mergulho em espiral (espiral da morte)


  voo lento


  curvas acentuadas


  recuperação de estol iminente


  recuperação de estol


  recuperação da ativação do stick pusher


  recuperação do nariz para cima/alta velocidade


  recuperação do nariz para cima/baixa velocidade


  recuperação do nariz para baixo/alta velocidade


  recuperação do nariz para baixo/pouca velocidade


  recuperação de grande ângulo de inclinação lateral


  treinamento orientado para operações em rota (LOFT) ou simulação operacional de linha aérea
  (LOS)


  Temas e elementos de instrução

  Treinamento teórico

  Treinamento prático

  K. Fatores Humanos


  Consciência Situacional


  i. processamento humano da informação


  ii. falta de atenção, visão de túnel, distração


  iii. ilusões perceptivas (visual ou fisiológica) e desorientação espacial


  iv. interpretação dos instrumentos


  Supervisão do pilot monitoring (PM)

  Evidências mostram que, em muitos incidentes e acidentes de perda de controle, o PM pode
  estar mais ciente da condição da aeronave do que o pilot flying (PF). O treinamento deve
  enfatizar a interação da tripulação para verbalizar/vocalizar uma divergência da trajetória
  de voo pretendida. Uma estratégia de intervenção progressiva é iniciada comunicando um desvio
  de trajetória de voo (alerta), sugerindo um curso de ação (defesa e assertiva) e intervindo
  diretamente, se necessário, assumindo o controle para evitar um incidente ou acidente. Um
  piloto assumindo o controle deve anunciar a transferência de controle.


  Sustos (startle) e resposta ao estresse

  i. efeitos fisiológicos e psicológicos (emocionais e cognitivos)


  ii. estratégias de enfrentamento


  Gerenciamento das ameaças e dos erros (TEM)

  i. modelo TEM


  ii. monitoramento ativo


  iii. gerenciamento da fadiga


  iv. gerenciamento da carga de trabalho


  v. gerenciamento dos recursos da tripulação (CRM)'
