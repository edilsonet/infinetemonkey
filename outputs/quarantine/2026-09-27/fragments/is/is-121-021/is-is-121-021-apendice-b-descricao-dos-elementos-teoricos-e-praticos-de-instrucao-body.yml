title: APÊNDICE B - DESCRIÇÃO DOS ELEMENTOS TEÓRICOS E PRÁTICOS DE INSTRUÇÃO
text: 'APÊNDICE B - DESCRIÇÃO DOS ELEMENTOS TEÓRICOS E PRÁTICOS DE INSTRUÇÃO

  (Aplicável em FSTD de tipo específico ou FSTD não específico de tipo)

  B1. Alguns dos itens de treinamento na tabela a seguir referem-se a equipamentos específicos
  e só devem ser aplicados se o tipo de aeronave possuir tais equipamentos (por exemplo, stick
  pusher, Fly-by-wire, indicador de Mach, outros).

  B2. Em relação aos itens abaixo, não necessariamente deve haver uma manobra ou cenário específico
  para cada um. Vários elementos podem ser incluídos na mesma manobra ou cenário, dependendo
  de como o explorador desenvolveu seu programa de treinamento. Alguns elementos, por outro
  lado, aparecem na tabela porque devem ser objeto de atenção de alunos e instrutores durante
  a instrução prática, ainda que não gerem diretamente manobras ou cenários.

  Elemento de instrução

  Descrição

  A. Aerodinâmica

  Os alunos devem ter uma compreensão dos efeitos aerodinâmicos em altitudes altas e baixas.
  O treinamento deve ser realizado em grandes altitudes (a uma altitude de 1.500 m (5.000
  pés) abaixo do teto de serviço do avião, ou acima dela) e em baixas altitudes (abaixo de
  3.000 m (10.000 pés) acima do nível médio do mar) para reforçar a instrução teórica. O treinamento
  em alta altitude deve ser realizado em altitudes operacionais normais de cruzeiro. Os pilotos
  também devem ser treinados sobre os efeitos da condução em baixa velocidade e operação de
  número Mach elevado, incluindo:


  demonstração de pitch down por Mach;

  compreensão das mudanças na estabilidade da aeronave em altitudes elevadas;

  reconhecimento de buffet em altas velocidades/Mach e buffet em baixa velocidade;

  a altitude necessária para se recuperar efetivamente de um estol em grandes altitudes; e

  conscientização da eficácia das superfícies de comando em baixas e altas velocidades.

  Os alunos devem aplicar seus conhecimentos de aerodinâmica incluindo os seguintes aspectos:


  prática na manobra da aeronave simulada em grandes altitudes e em várias velocidades e níveis
  de automação - o piloto aplicará os princípios aerodinâmicos aprendidos no treinamento teórico
  para evitar a perda de controle;

  os treinandos devem ter conhecimento de AOA a partir de dados disponíveis indicados no cockpit
  e demonstrar o uso de tais dados para prevenir ou se recuperar de uma perda de controle;

  prática de velocidade controlada pelo profundor ou velocidade controlada pelo empuxo e compreensão
  do estado de energia da aeronave no que se refere ao tipo de aeronave que está sendo operada
  - os alunos devem demonstrar o uso de tal conhecimento para prevenir ou se recuperar de
  uma perda de controle; e

  Os alunos devem demonstrar conhecimento dos sistemas específicos do tipo de aeronave que
  utilizam AOA, com ênfase nos sistemas de alerta e nas limitações desse sistema. Por exemplo,
  o reconhecimento de uma indicação no cockpit de que a “ignição contínua” foi ligada sem
  que o sistema tenha sido ativado manualmente.

  Eles também devem entender o desempenho da aeronave em todas as fases do voo, incluindo
  maneiras de responder, como PF e PM, e aplicar seus conhecimentos básicos de aerodinâmica
  e dinâmica de voo para integrar mentalmente uma compreensão do AOA da aeronave e do status
  de energia em toda a parte do envelope de voo usado para operações normais e deve ser capaz
  de comunicar esse conhecimento ao outro piloto.

  Elemento de instrução

  Descrição

  B. Causas e fatores que contribuem para a perda de controle

  A preparação e instrução sobre procedimentos, incluindo funções de PF e PM, para operações
  normais e recuperação de desvios devem se concentrar na prevenção das perdas de controle.
  O treinamento deve enfatizar o que observar durante as operações normais e durante a recuperação
  das perdas de controle, nas formas de identificar e comunicar os desvios entre os pilotos
  e como se recuperar do evento.

  Os pilotos devem ser treinados sobre o que observar e quando fazê-lo, incluindo verificações
  cruzadas, durante toda a fase de voo para evitar um evento de perda de controle. A ênfase
  deve ser colocada no comportamento de comunicação entre os pilotos para compartilhar a compreensão
  do estado da aeronave, para que ambos reconheçam quando um deles possa estar provocando
  uma perda de controle induzida pelo piloto.

  Os alunos devem aplicar suas instruções teóricas específicas do tipo de aeronave para prevenir
  e se recuperar de perdas de controle induzidas pelo ambiente, pelo piloto e pelos sistemas
  da aeronave.

  C. Análise da segurança operacional de acidentes e incidentes relacionados à perda de controle
  da aeronave

  Demonstração de alguns casos reais de acidentes aéreos da categoria transporte cobertos
  na instrução teórica, com treinamento em técnicas de prevenção e recuperação específicas
  do tipo.

  D. Consciência G

  Deve-se enfatizar que a carga g na aeronave parece consideravelmente mais pronunciada do
  que na simulação.

  Pilotos de transporte aéreo comercial normalmente experimentam algum desconforto (no interesse
  do conforto e segurança dos passageiros) ao aumentar ou reduzir agressivamente as cargas
  g. Os pilotos devem ser treinados para superar tal inibição quando confrontados com a necessidade
  de lidar prontamente com qualquer excesso de forças externas.

  A maioria dos FSTD não pode reproduzir forças g sustentadas; portanto, as limitações do
  dispositivo em representar adequadamente o ambiente g real durante condições de perda de
  controle devem ser bem compreendidas pelo instrutor e pelo aluno. Quando um exercício prático
  de consciência g é realizado em um FSTD, deve-se considerar cuidadosamente a prevenção do
  treinamento negativo. Como há um aspecto visual e sensorial na carga g, o programa de treinamento
  precisará validar se o treinamento de consciência g no FSTD será eficaz e poderá ocorrer
  sem a introdução de treinamento negativo.

  Elemento de instrução

  Descrição

  E. Gerenciamento da energia

  O treinamento deve incluir treinamento de CRM integrado para desenvolver o conhecimento
  e as habilidades da tripulação no gerenciamento de energia, bem como técnicas para reduzir
  o erro do piloto, incluindo o que observar durante um evento de perda de controle e a forma
  como o PM deveria ajudar o PF na recuperação, usando as chamadas apropriadas.

  Para entender completamente os conceitos discutidos na instrução teórica, os alunos devem
  ser treinados no seguinte:


  aceleração entre duas velocidades de que a aeronave é capaz em altitudes baixas, médias
  e altas (por exemplo, 200-250 KIAS em baixa, média e alta altitude com números de Mach correspondentes
  no caso de alta altitude);

  desempenho de aceleração do segundo regime (parte posterior da curva de potência) em baixa
  altitude e em alta altitude;

  relação entre o empuxo máximo de cruzeiro/subida/estável e o empuxo de decolagem ou arremetida
  (TOGA) em baixas e altas altitudes;

  capacidades de aceleração na descida em relação à aplicação de potência/empuxo;

  compreensão e gestão das diferenças, específicas do tipo de aeronave, entre a energia cinética,
  potencial e química, bem como a relação entre pitch, potência e desempenho;

  desempenho da variação do pitch do avião em diferentes velocidades, altitudes e configurações
  e com spoilers de voo retraídos/estendidos (conforme aplicável), se houver diferença; e

  desempenho da variação do pitch do avião em diferentes velocidades, altitudes e configurações
  e com flaps retraídos/estendidos; além disso, demonstração das capacidades de voo do centro
  de gravidade traseiro (CG) versus CG dianteiro, se estas forem significativamente diferentes,
  bem como o efeito do empuxo no controle de pitch em aviões com motores deslocados do centro
  de gravidade.

  F. Gerenciamento da trajetória de voo

  O treinamento em gerenciamento de trajetória de voo deve ser revisado em relação aos sistemas
  de automação de voo encontrados no tipo de avião, incluindo programas de automação específicos
  do tipo.


  Elemento de instrução

  Descrição


  Entradas manuais ou automáticas para orientação e controle

  O objetivo do treinamento relacionado a entradas manuais ou automáticas para orientação
  e controle é obter as entradas corretas para os controles pelo piloto para a prevenção e
  recuperação de desvios indesejados da trajetória de voo.

  Este objetivo de treinamento deve incluir as estratégias de controle que os pilotos devem
  aplicar tanto no caso de uma perda de controle em evolução quanto em uma perda de controle
  estabelecida. Os pilotos devem estar cientes das condições específicas do tipo de aeronave
  em que é melhor permitir que sistemas de voo automático controlem a aeronave e aquelas em
  que a intervenção manual do piloto é a melhor solução. Isso deve incluir estratégias de
  controle principais/alternativas.


  Características específicas do tipo de avião

  A instrução fornecida sobre as características específicas de tipo ajudará a evitar eventos
  de perda inadvertida de controle devido a surpresa diante da automação. O treinamento integrado
  de CRM deve incluir comunicação entre os pilotos sobre sua compreensão do estado atual da
  aeronave. Os pilotos devem criar uma imagem mental mútua do estado da aeronave e mantê-la
  atualizada. Além disso, os pilotos devem ser capazes de trabalhar em equipe para estar cientes
  das perdas de controle, reconhecê-las e evitá-las. Isso deve incluir a interpretação dos
  instrumentos aplicada ao reconhecimento de eventos de perda de controle da aeronave.


  Gerenciamento da automação

  O objetivo do treinamento de gerenciamento de automação é obter informações corretas do
  piloto para evitar desvios não intencionais da trajetória de voo.

  Os pilotos devem saber como usar os sistemas de automação durante a prevenção e recuperação
  de perda de controle. Esta instrução deve incluir os seguintes aspectos:


  erros comuns a serem evitados e os motivos deles;

  modos de automação específicos para uso em contextos

  específicos;


  verificação cruzada do uso do modo e compreensão da forma como o modo utilizado foi direcionado
  ao controle da aeronave;

  estratégias de controle que os pilotos devem usar tanto em caso de

  perda de controle em evolução como a já estabelecida;


  vantagens e desvantagens do uso de sistemas de voo automáticos

  para a prevenção e recuperação da perda de controle; e


  importância de garantir entradas corretas pelo piloto nos

  sistemas de automação e as consequências de não o fazer.

  É imperativo que o PF mantenha a aeronave em bom estado durante o voo com um motor inativo
  em uma aeronave multimotor. Em baixa velocidade e alto empuxo nos motores restantes, o PA
  em algumas aeronaves normalmente é incapaz de manter a atitude correta em relação a uma
  condição de guinada adversa, o que pode resultar em perda de controle da aeronave.


  Habilidades de controle manual

  Os objetivos das habilidades de controle manual são obter entradas corretas nos comandos
  pelo piloto para evitar desvios indesejados da trajetória de voo. A Seção G 2 (Pitch/Power/Roll/Yaw)
  contém uma discussão sobre como desenvolver as habilidades do piloto para fazer as entradas
  corretas dos comandos para deter um desvio ou se recuperar da perda de controle. Essas habilidades
  de controle manual devem ser desenvolvidas durante os elementos de instrução especializados
  na Seção J desta tabela.

  O UPRT deve incluir a prática de controle manual nas bordas do envelope de voo.

  Os pilotos devem estar cientes dos erros comuns a serem evitados, o motivo pelo qual eles
  ocorrem, a importância da verificação cruzada dos comandos, bem como desenvolver um conhecimento
  compartilhado, enquanto equipe, sobre a razão de o piloto estar operando o avião manualmente.
  Os pilotos devem desenvolver uma compreensão de como a aeronave responde aos comandos em
  todos os regimes de voo.

  A instrução de controle manual deve incluir treinamento no uso de entradas completas dos
  comandos, se necessário para combater forças externas adversas. Por exemplo, os controles
  de voo são menos eficazes quando a aeronave está em seu AOA crítico ou próximo a ele ou
  quando já entrou em estol. A tendência é que os pilotos não apliquem a autoridade total
  de comando porque raramente são obrigados a fazê-lo em operações normais. Os pilotos devem
  superar esse hábito ao recuperarem-se de perdas de controle sérias.

  Nota 1: o controle de direção permanece efetivo com AOA elevados, devendo-se ter cuidado
  especial em seu uso durante a prevenção e recuperação de perda de controle.

  Nota 2: o uso excessivo de comandos de pitch e direcionais durante a recuperação pode agravar
  a condição de perda de controle ou fazer com que as limitações estruturais do avião sejam
  excedidas.

  Também é importante se proteger contra reversões de comandos.

  Além disso, a instrução de controle manual deve incluir treinamento sobre fatores não intuitivos.
  Por exemplo, pode ser contraintuitivo usar forças de comando mais altas para a redução de
  carga g ao se recuperar de um AOA elevado, especialmente em baixa altitude. Se a aeronave
  estolou quando já estava com o nariz para baixo, o piloto ainda deve empurrar o nariz para
  baixo (descarregar) para reduzir o AOA. Além disso, para motores instalados sob as asas,
  pode ser necessário reduzir o empuxo para diminuir o AOA devido às intensas forças de elevação
  (tendência de pitch up) causadas pelo empuxo adicional. A altitude não pode ser mantida
  em um estol e deve ser considerada de importância secundária.

  O treinamento deve destacar os casos em que é apropriado voar manualmente com relação ao
  uso de automação. As especificidades da transição do voo automático para o voo manual e
  vice-versa também devem ser abordadas.

  G. Reconhecimento

  Os alunos devem entender que sempre que a aeronave começar a se desviar da trajetória ou
  velocidade de voo pretendida, eles devem identificar e determinar qual ação tomar, se necessário
  for, e então agir de acordo.


  Exemplos de instrumentação específico para o tipo de avião durante a evolução de uma perda
  de controle e com perda de controle estabelecida

  Um aspecto fundamental do UPRT é que os pilotos reconheçam as condições de perda de controle
  em evolução e estabelecidas. A ênfase é colocada no uso de exemplos de instrumentos específicos
  do tipo e dicas visuais para aumentar a consciência, prevenção e reconhecimento de uma perda
  de controle em evolução e recuperação de uma perda de controle estabelecida com a finalidade
  de instruir o processo de decisões aeronáuticas efetivas para evitar eventos de perda de
  controle da aeronave.

  Este treinamento deve incluir representações visuais do ambiente externo e indicações de
  instrumentos específicos do tipo para uma variedade de condições de perda de controle em
  evolução e estabelecidas, focando em pitch, potência e roll, e o que acontece com a velocidade.


  Pitch/Power/

  Roll/Yaw

  Um aspecto crítico do UPRT é que os alunos reconheçam as condições de perda de controle
  em evolução e estabelecidas, para que possam fazer entradas de comando com base na reação
  desejada da aeronave. Desvios de comando em um ponto do envelope de voo podem não ser apropriados
  em outra parte deste.

  Os pilotos devem ter uma compreensão fundamental dos instrumentos e da dinâmica de voo em
  pitch/power/roll/yaw para reconhecerem o estado atual da aeronave e fazer as entradas corretas
  de comando para parar o desvio ou se recuperar da perda de controle.

  O indicador de direção de atitude (ADI) é o principal instrumento de controle para a recuperação
  de uma perda de controle, uma vez que, devido às condições variáveis ​​de visibilidade nas
  operações, não se pode depender de haver referências visuais externas adequadas.


  Exploração eficaz (vigilância eficaz)

  As técnicas efetivas de varredura dos instrumentos devem ser ensinadas conforme apropriado
  para se reconhecer os estados normais e os desvios dos parâmetros normais de voo. Os pilotos
  devem ser treinados sobre os aspectos que devem ser vigiados e quando fazê-lo, incluindo
  verificações cruzadas, durante todas as fases do voo, para identificar os precursores e
  o curso inicial de uma perda de controle e, em seguida, usar esse reconhecimento para dar
  respostas oportunas e apropriadas para o retorno da aeronave para sua trajetória desejada.
  Especificamente, para reduzir atrasos na detecção de um desvio e mitigar casos de surpresa,
  os pilotos devem ser treinados em uma descrição específica do tipo dos instrumentos a serem
  monitorados durante as perdas de controle em evolução e as perdas já estabelecidas, e durante
  a fase de recuperação. Eles também devem estar cientes dos efeitos da fadiga em sua capacidade
  de conduzir uma vigilância efetiva.

  Também deve ser proporcionado treinamento na comunicação do estado atual da aeronave entre
  os pilotos, incluindo verbalizações para melhorar a consciência situacional. Os pilotos
  devem ser capazes de gerar uma imagem mental do estado da aeronave e mantê-la atualizada
  e verificada com o outro piloto durante todo o voo. O PM deve saber como auxiliar eficazmente
  o PF no retorno da aeronave a um estado estabilizado.

  Para melhorar a detecção e interpretação de desvios, os pilotos devem conhecer os estados
  normais do avião (particularmente nos níveis de pitch e power), detectar desvios, interpretar
  o significado deles, comunicar-se efetivamente como tripulação, decidir sobre as respostas
  e adotar medidas.


  Sistemas de proteção contra perdas de controle da aeronave

  Reconhecimento preciso e precoce de todos os alertas disponíveis, tanto auditivos, como
  visuais e táteis, relativos a um estol iminente e ao estol. Atenção especial deve ser dada
  às características de estol do avião na ausência de uma indicação de aviso de estol.

  H. Técnicas de prevenção e recuperação de perdas de controle da aeronave


  Intervenção oportuna e apropriada

  O treinamento deve enfatizar a necessidade de o PF ou o PM reconhecer um desvio o mais rápido
  possível e garantir imediatamente que ações corretivas sejam tomadas para retornar a aeronave
  a uma trajetória de voo estabilizada, incluindo interações apropriadas da tripulação. As
  ações corretivas devem incluir gerenciamento de energia, interrupção do desvio da trajetória
  de voo e recuperação para uma trajetória de voo estabilizada. Se o avião entrar em estol
  durante o desvio da trajetória de voo pretendida, o treinamento também deve enfatizar a
  importância de primeiro aplicar e depois manter o profundor com o nariz para baixo, ou seja,
  reduzir o AOA, até que a recuperação do estol seja concluída.

  O volume e a quantidade de entradas nos comandos para combater uma perda de controle em
  evolução devem ser proporcionais ao volume e quantidade de roll, pitch e yaw experimentados.
  O treinamento deve prever, com base nas orientações recomendadas no manual de voo do avião
  ou pelo OEM, as situações em que as entradas normais nos comandos dos pilotos não impedirão
  o desvio.

  O ADI é o principal instrumento para a recuperação da perda de controle, pois pistas visuais
  externas adequadas podem não estar disponíveis ou podem ser enganosas.


  Recuperação com nariz para cima/asas horizontais com ângulo de inclinação lateral elevado

  Consulte 7.5 para técnicas de recuperação recomendadas pelos OEM.


  Recuperação com nariz para baixo/asas horizontais com ângulo de inclinação lateral elevado

  Consulte 7.5 para técnicas de recuperação recomendadas pelos OEM.


  Eventos de estol

  Conhecimento da distinção entre a atitude da aeronave e seu AOA. Gestão de energia com a
  troca de altitude por velocidade. Consciência da correlação entre a velocidade de estol
  e a carga g. Aplicação do procedimento de recuperação de estol no Apêndice E. Os exercícios
  de treinamento sugeridos são detalhados em 7.4. Eles devem ser realizados em altitudes altas
  e baixas.

  Uma avaliação considerável do FSTD deve ser realizada antes que o treinamento completo de
  simulação seja realizado. Consulte a Seção 9 para todas as considerações de avaliação de
  FSTD.

  O treinamento para um estol completo (full stall) deve ser conduzido por um instrutor com
  uma discussão sobre os objetivos de aprendizagem. Particular ênfase deve ser dada aos potenciais
  efeitos do treinamento negativo através das condições de estol iminente para atingir o estol
  completo.

  Os objetivos do treinamento são:


  fornecer aos pilotos experiência em características de manejo e indicações dinâmicas (por
  exemplo, buffet, roll) durante estol iminente e em estol completo; e

  reforçar a aplicação adequada dos procedimentos de recuperação de estol.

  I. Mal funcionamento dos sistemas críticos

  Casos de falha ou mau funcionamento que possam levar à perda de controle relacionados a
  sistemas, instrumentos, energia e automação devem ser incorporados ao treinamento. Os alunos
  devem estar particularmente cientes da natureza insidiosa de informações imprecisas (por
  exemplo, velocidade não confiável, falha de dispositivos de aviso de estol e congelamento,
  deterioração dos sistemas de proteção do envelope), para que sejam capazes de reconhecer
  o erro, prevenir a perda de controle e manter o controle da aeronave.

  Eventos de mau funcionamento do sistema também podem ser aplicados em cenários com o objetivo
  de introduzir um elemento de surpresa ou susto, seja distraindo a tripulação de voo quando
  a aeronave simulada encontra condições que levam à perda de controle ou ativando uma condição
  de perda de controle imprevista.

  J. Elementos de instrução especializados

  Existem vários elementos específicos que precisam ser incorporados à instrução que ensinam
  um conjunto específico de habilidades para ajudar os alunos a prevenir e, se necessário,
  recuperar-se de uma perda de controle. A comunicação do estado atual da aeronave entre os
  pilotos, incluindo chamadas (call-outs) para melhorar a consciência situacional, é essencial.
  O PM deve saber como auxiliar efetivamente o PF no retorno da aeronave a um estado estabilizado.

  1) Mergulho em espiral

  Nesta manobra, às vezes chamada de espiral da morte, a aeronave está em um ângulo de inclinação
  lateral e descendo. Os alunos aprenderão nesta situação que aplicar o profundor para cima
  na tentativa de parar tanto a velocidade crescente quanto a razão de descida faz com que
  a espiral se intensifique. A habilidade aprendida é que é imperativo se colocarem as asas
  em posição o mais horizontal possível antes de iniciar qualquer manobra de pitch. Os alunos
  devem diminuir o ângulo de inclinação lateral e, em seguida, aplicar o profundor para cima
  para recuperar. Se a carga g for grande, o piloto deve descarregar parte do g para recuperar
  o controle de rolagem adequado.

  2) Voo lento

  O voo lento expõe o aluno a voar um pouco acima da velocidade de estol da aeronave e manobrar
  a aeronave nessa velocidade sem estolar. O objetivo é reforçar as características básicas
  de estol aprendidas na parte teórica do treinamento e permitir que o piloto obtenha experiências
  de manuseio e sensações de movimento operando o avião em baixa velocidade durante todo o
  regime de aproximação de estol em várias atitudes, configurações e ângulos de inclinação
  lateral do avião.


  Elemento de instrução

  Descrição

  3) Curvas acentuadas


  Curvas acentuadas proporcionam ao aluno experiência prática em manobrar o avião em ângulos
  de inclinação maiores do que o normal (as limitações dos FSTD estão listadas na Seção D
  desta tabela).

  4) Recuperação de estol iminente

  Deve ser dada especial ênfase ao reconhecimento precoce de sintomas relacionados com a aproximação
  de estol, bem como ao reconhecimento da ativação de um sistema de alerta de estol. Os alunos
  devem ser encorajados a entender que as medidas de recuperação envolvendo a aplicação deliberada
  e contínua de pressão com o nariz da aeronave para baixo devem ser realizadas imediatamente
  após o reconhecimento dos sintomas relacionados ao estol ou a ativação de um dispositivo
  de alerta de estol.

  5) Recuperação de estol

  Com o devido respeito às limitações de fidelidade do FSTD que está sendo utilizado, esta
  parte do treinamento normalmente deve ser conduzida apenas como um exercício de demonstração,
  com o aluno operando os controles de voo, enfatizando o seguinte:


  o treinamento de recuperação de estol deve focar na conscientização dos avisos de estol;
  e

  a parte do treinamento referente à recuperação deve enfatizar consistentemente a importância
  primordial de uma redução contínua e deliberada no ângulo de ataque suficiente para abortar
  a condição de estol e completar a recuperação de acordo com as técnicas recomendadas específicas
  do avião. No caso de aviões com motores deslocados do centro de gravidade, os efeitos da
  aplicação de empuxo/potência sobre a capacidade de controlar atitude de inclinação (pitch)
  devem ser cobertos. Manter as asas em posição horizontal durante a recuperação é de importância
  secundária frente à redução do ângulo de ataque.

  6) Recuperação após ativação do stick pusher (se houver na aeronave)

  A ativação do stick pusher é um evento súbito que muitas vezes surpreende a tripulação e
  geralmente é seguido por uma urgência quase total de puxar os controles para trás na tentativa
  de superar o pronunciado movimento de nariz para baixo do profundor. O treinamento deve
  se concentrar no desenvolvimento de uma resposta apropriada do piloto a esses eventos, reconhecendo
  que o stick pusher é uma ajuda valiosa na recuperação do estol.


  Elemento de instrução

  Descrição

  7) nariz para cima/

  alta velocidade

  8) nariz para cima/ baixa velocidade

  9) nariz para baixo/

  alta velocidade

  10) nariz para baixo/ baixa velocidade

  11) Recuperação de

  ângulo de inclinação lateral elevado

  O treinamento do FSTD deve incluir uma variedade de condições de perda de controle em evolução
  e estabelecidas, concentrando-se em arfagem, potência, rolagem e guinada.

  Também deve incluir demonstrações e técnicas práticas de recuperação para vários cenários
  de estol, incluindo cenários de nariz para cima e para baixo e vários ângulos e velocidades
  de inclinação, incluindo ângulos de inclinação lateral superiores a 90º. Os alunos devem
  praticar exercícios de recuperação do ângulo de inclinação lateral alto em situações de
  nariz para cima e para baixo. A instrução deve ser conduzida em condições visuais e por
  instrumento para permitir que os alunos pratiquem o reconhecimento e a recuperação em ambas
  as condições e para ensiná-los a reconhecer alguns dos fatores fisiológicos. O treinamento
  de perdas de controle da aeronave, em um FSTD, que exceda o envelope de treinamento válido
  (ETV) dos dados do envelope de voo do avião fornecido pelo OEM e usado para qualificação
  do FSTD pode aumentar o risco de treinamento negativo.


  12) LOFT ou LOS

  A instrução deve expor os treinandos, por meio de cenários LOFT ou LOS, a falhas críticas
  ou situações que podem levar à perda de controle se não forem gerenciadas adequadamente.
  No centro de cada cenário deve estar a conscientização e a prevenção da perda de controle.
  O operador deve integrar esses cenários no treinamento LOFT/LOS e alterná-los para garantir
  ampla exposição a uma ampla variedade de cenários potenciais de perda de controle.


  K. Fatores humanos

  Os fatores humanos são uma parte integrante muito importante do UPRT. Os fatores humanos
  no UPRT abrangem respostas fisiológicas e da tripulação ao desvio da rota de voo ou perda
  repentina de controle. A integração de fatores humanos no UPRT também é importante para
  ajudar a desenvolver a aptidão para voar (airmanship), que requer conhecimentos e habilidades
  perceptivas, cognitivas e psicomotoras. Os fatores humanos incluem, mas não estão limitados
  a, CRM, o processo cognitivo, o processo de aprendizagem e a capacidade dos alunos de recordar
  e aplicar conhecimentos e habilidades apropriados às operações.


  Elemento de instrução

  Descrição

  1) TEM

  Como se relaciona à prevenção e recuperação de perdas de controle da aeronave, o TEM deve
  ser integrado ao UPRT. A tripulação de voo deve identificar e gerenciar quaisquer ameaças
  que possam contribuir para a perda de controle. O treinamento TEM deve incluir: técnicas
  de comunicação/interação entre os pilotos e entre eles e a aeronave, seus estados normais,
  a identificação e gerenciamento de ameaças ambientais que podem levar à perda de controle,
  detecção de desvios, interpretação de significados de desvios, decisão sobre como responder
  e resposta adotada. TEM é um meio crucial de abordar os elementos de fatores humanos do
  treinamento.

  A capacidade da tripulação de voo de pensar efetivamente em condições de voo às quais não
  foi exposta anteriormente pode ser prejudicada durante um evento de perda de controle da
  aeronave, e deve ser desenvolvida por meio do UPRT. A instrução deve definir entradas de
  comando apropriadas e como priorizar tarefas para evitar sobrecarga de trabalho.

  2) Processamento humano da informação

  Para que os pilotos entendam como responder adequadamente e por que às vezes não tomam a
  ação correta, eles devem entender como processam as informações. Esses são os blocos de
  construção do conhecimento que permitem uma melhor compreensão de como manter ou melhorar
  áreas como comunicação, tomada de decisão, consciência situacional e dinâmica de equipe.

  As áreas cobertas no processamento humano de informação incluem:


  atenção - percepção sensorial e recuperação de informações relevantes do ambiente;

  percepção - compreensão daquela informação que foi recuperada;

  interpretação - relação de informações pertinentes e

  conhecimento necessário para a tarefa que está sendo executada;


  julgamento - correspondência entre a necessidade de adotar medidas e a resposta certa;

  tomada de decisão - avaliação da resposta correta necessária para atingir o resultado pretendido
  ou alternativo;

  ação - execução da resposta escolhida; e

  feedback - verificação de que a medida de resposta

  satisfaz os requisitos corretos da tarefa.

  Elemento de instrução

  Descrição

  3) Gerenciamento dos recursos de tripulação (CRM)

  Os pilotos devem se concentrar em estabilizar a aeronave como uma equipe, com papéis claramente
  definidos entre o PF e o PM, principalmente se um dos pilotos estiver fixado em alguma coisa.

  A instrução deve incluir:


  desenvolvimento e aplicação de padrões de comunicação apropriados entre pilotos para alcançar
  um entendimento compartilhado da situação atual da aeronave;

  formas de identificar e comunicar desvios e orientar a recuperação nas funções de PF e PM;
  e

  descrição de técnicas de avaliação, específicas para o tipo de aeronave, para a avaliação
  de sua condição durante perdas de controle em andamento e estabelecidas.

  A instrução deve definir como distribuir as tarefas entre o PF e o PM para evitar sobrecarregar
  o trabalho de qualquer um deles.

  Os pilotos devem ser capazes de criar uma imagem mental do avião e seu estado energético
  e mantê-la atualizada, verificando com o outro piloto durante todo o voo. O treinamento
  também deve incluir técnicas de comunicação adequadas entre o PF e o PM para prevenção e
  recuperação de desvios. Chamadas (call-outs) de acordo com os procedimentos operacionais
  padronizados (SOP) ajudarão na comunicação, levando a tripulação de voo a implementar uma
  estratégia de recuperação conforme necessário.

  4) Consciência Situacional

  Os pilotos devem manter a consciência da situação o tempo todo por meio de vigilância efetiva
  (consulte o elemento “Reconhecimento” nesta tabela). Os pilotos fazem isso mantendo um modelo
  mental enquanto criam imagens mentais de situações em desenvolvimento. A quebra do modelo
  ou imagem mental do piloto, que pode ser devida a diversos fatores, como desorientação espacial
  causada por ilusões de percepção em voo, sustos, desatenção e complacência podem levar à
  perda da consciência situacional.

  O treinamento também deve incluir como manter a consciência situacional e o que observar
  na prevenção e recuperação da perda de controle. Os treinandos devem aprender como o PM
  deve ajudar ou orientar o PF na recuperação usando chamadas apropriadas e outros feedbacks
  verbais.

  Após um desvio, é importante que as primeiras medidas sejam corretas para evitar que o esforço
  de recuperação se transforme em uma situação ainda mais grave. Para atingir esse objetivo,
  a determinação precisa e oportuna da condição real de voo e do estado energético do avião
  durante a perda de controle é de particular importância. A busca e solução das causas da
  perda de controle é secundária e pode esperar. Os pilotos devem usar os instrumentos de
  voo primários porque a escuridão, as condições climáticas e a visão limitada da cabine podem
  dificultar ou impossibilitar o uso eficaz do horizonte externo. A ADI é a principal referência.

  O processo de análise de situação inclui:


  comunicação com os demais membros da tripulação de voo;

  localização do indicador de bank no ADI e determinação do ângulo pertinente;

  determinação do pitch (a partir do ADI principalmente);

  confirmação da atitude com referência a outros indicadores; e

  avaliação do estado energético.

  5) Tomada de decisão

  O treinamento deve enfatizar a importância de os pilotos se comunicarem de forma eficaz
  verbal e não-verbalmente. Outra questão importante são os critérios que o PM deve aplicar
  para decidir se assume o controle da aeronave se o PF estiver sobrecarregado de tarefas
  e incapaz de responder. Isso deve incluir o caso do copiloto (piloto supervisor) assumindo
  o comando de um piloto impossibilitado de exercer o comando. Esses critérios devem ser descritos
  e documentados no SOP utilizado ​​pelo operador. Os pilotos devem empregar um processo de
  tomada de decisão compartilhado quando ambos estão comprometidos com os resultados.

  Os pilotos devem se concentrar na estabilização da aeronave. Eles devem entender o papel
  do PM em auxiliar o PF a alcançar o estado estabilizado. Eles também devem conhecer os objetivos
  apropriados de pitch e potência para a estabilização e tomar as medidas apropriadas. Para
  fazer isso, os alunos precisam estar cientes do tipo de informação de que precisam para
  tomar as decisões ideais para a ação, e de outros fatores, como tendências cognitivas (por
  exemplo, o viés de confirmação), que afetam a tomada de decisão.

  6) Solução de problemas

  O treinamento deve melhorar as habilidades de resolução de problemas e reconhecer fatores
  que podem afetar negativamente a capacidade do aluno de resolver um problema, como fadiga,
  temores e sobrecarga de trabalho. Em particular, o UPRT deve enfatizar a importância de
  avaliar se uma solução está funcionando e não se precipitar em adotar medidas que podem
  se tornar prejudiciais.

  Os pilotos devem ser capazes de se comunicar verbal ou não-verbalmente com o outro piloto
  se estiverem sob muito estresse. A instrução deve incluir como se autoavaliar se for prevista
  a incapacitação devido ao estresse. Isso inclui detectar e evitar a fixação em um problema
  específico.

  7) Susto (Startle) e resposta ao estresse

  O treinamento deve incluir estratégias para lidar com a gama de efeitos fisiológicos, psicológicos
  e cognitivos relacionados à resposta do estresse humano a eventos ameaçadores inesperados,
  com os pilotos aplicando suas competências para manter o voo seguro e a coordenação da tripulação.
  Os pilotos podem se assustar quando um evento imprevisto durante o voo contradiz as suas
  expectativas. Se um evento imprevisto for grave o suficiente ou surgir durante uma fase
  crítica do voo, a resposta correta a essa incerteza é vital para a sobrevivência.

  O treinamento de perda de controle da aeronave deve ter como objetivo incluir elementos
  “inesperados ou imprevisíveis” que os pilotos experimentarão no mundo real.

  8) Fatores fisiológicos

  O reconhecimento dos efeitos das ilusões ópticas e vestibulares (angulares e lineares) e
  a forma adequada de responder a elas constitui um aspecto fundamental do UPRT. As áreas
  a serem cobertas durante o treinamento incluem:


  condições que podem levar à uma desorientação espacial;

  uso da interpretação dos instrumentos para gerenciar tais desorientações;

  evitar erros no ajuste de atitude/potência;

  prevenção e recuperação de oscilações induzidas pelo piloto

  (OIP); e


  reconhecimento e gestão de ilusões sensoriais em voo.

  Todos esses aspectos devem ser abordados na instrução teórica, mas alguns deles podem ser
  abordados na instrução no FSTD. A desorientação espacial tem sido um fator importante em
  muitos acidentes de perda de controle de aeronaves. A definição de desorientação espacial
  é a incapacidade de se orientar corretamente em relação à superfície da Terra. Pilotos que
  não conseguem resolver um conflito percebido entre os sentidos corporais e os instrumentos
  de voo sofrem de desorientação espacial. Se se permite que continue, a desorientação espacial
  pode levar à perda de controle da aeronave. Atenção aos instrumentos de voo e uma boa verificação
  cruzada são as chaves para manter a orientação espacial.

  Um exame de casos de perda de controle da aeronave revela que a desatenção ou negligência
  no monitoramento do desempenho da aeronave pode levar a perda de controle A negligência
  na vigilância dos instrumentos apropriados ou a fixação em um instrumento específico pode
  levar a desvios da performance. As distrações podem ser muito sutis, como a iluminação de
  luzes de advertência ou de precaução durante as fases críticas do voo. Muitas perdas de
  controle da aeronave ocorrem quando o piloto está engajado em alguma tarefa que desvia sua
  atenção do monitoramento do status da aeronave.'
