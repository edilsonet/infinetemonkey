text: 'APÊNDICE D - RECOMENDAÇÕES DO OEM - TÉCNICAS DE RECUPERAÇÃO DE PERDA DE CONTROLE


  D1. Recomendação com nariz para cima


  Reconhecer e confirmar a evolução da situação.

  ANUNCIE: "NOSE UP"

  Pilot Flying (PF)

  Pilot Monitoring (PM)

  A/P .......................... DESCONECTAR (se requerido) 1 e 2


  Monitore a velocidade e a atitude durante a recuperação e anuncie qualquer desvio contínuo

  A/T ................................................... OFF (se requerido) 1

  Pitch ...................APLIQUE O NARIZ PARA BAIXO

  Aplique o máximo de entrada necessário no controle de nose down para obter uma razão de
  descida com nose down.

  Empuxo .................................. AJUSTAR (se requerido)


  Rolamento .............................. AJUSTAR (se requerido)

  Sem exceder os 60º

  Quando a velocidade tiver aumentado o suficiente: RECUPERAR o nível de voo 3 e 4

  Nota 1: Se o A/P ou A/T responder corretamente, pode não ser apropriado diminuir o nível
  de automação.

  Nota 2: Pode-se encontrar uma condição de trinagem inadequada quando o A/P é desconectado.

  Nota 3: A recuperação do voo nivelado pode exigir o uso de pitch trim.

  Nota 4: Evite o estol devido à recuperação prematura ou carga g excessiva em altas velocidades.

  Aviso: O uso excessivo de compensação de arfagem ou do leme de direção pode agravar a situação
  de perda de controle ou pode resultar em altas cargas estruturais.'
