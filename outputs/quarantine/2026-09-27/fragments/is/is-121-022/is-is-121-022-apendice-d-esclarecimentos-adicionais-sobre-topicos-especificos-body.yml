title: APÊNDICE D - ESCLARECIMENTOS ADICIONAIS SOBRE TÓPICOS ESPECÍFICOS
text: 'APÊNDICE D - ESCLARECIMENTOS ADICIONAIS SOBRE TÓPICOS ESPECÍFICOS

  D.1 A seguir há orientações não exaustivas sobre conhecimentos, habilidades e atitudes esperadas

  do despachante operacional de voo durante a execução de suas atividades que deverão ser

  evidenciadas durante o exame prático.

  D.1.1 PRÉ PLANEJAMENTO

  1- Cálculo do ‘payload’ - EZFW/MZFW

  Verificar se o avaliado sabe calcular o payload (carga paga) e entender a finalidade da
  comparação

  entre o EZFW (Peso estimado zero combustível) e o MZFW (Peso máximo zero combustível).

  Além do simples cálculo da soma do peso de passageiros, bagagens, carga e correio, o

  examinando deverá explicar o conceito de payload máximo estrutural, peso bruto e peso líquido,

  explicar as diferenças entre carregamentos de aeronaves narrow-body e wide-body, carregamento

  a granel, carregamento paletizado, oversized pack e overweight pack, dimensões da porta
  e

  dimensões máximas do volume, peso máximo pontual, linear e por área, descritas no W&B

  Manual que podem limitar o payload previsto.

  2- Previsão meteorológica: origem, destino, alternados e rota.

  Verificar se o avaliado sabe interpretar: TAF, Carta SIGWX, Carta de ventos, SIGMET.

  O examinando deverá demonstrar conhecimento dos elementos de aviação aeronáutica obtidos

  nas fontes apropriadas tais como: ATIS, METAR, TAF, PIREP, SIG WX, SIGMET, AIRMET,

  Imagem de Satélite, Vento e Temperatura em Altitude, Freezing Level Charts.

  Em um segundo momento o examinador deverá propor a discussão dos fenômenos

  meteorológicos que podem penalizar o despacho operacional tais como vento de través e rajadas,

  pista contaminada, Low Visibility Operations, Turbulência e Wind Shear, Formação de Gelo,

  Trovoadas, Tornados, Furacões e Cinzas Vulcânicas.

  3- AIP e ROTAER

  Verificar o conhecimento nos manuais AIP e ROTAER.

  O examinando deverá manusear com destreza os manuais de informação aeronáutica, explicando

  por exemplo a estrutura do AIP. O examinador deverá escolher um ou mais assuntos para o

  examinando encontrar os requisitos, por exemplo para uma aeronave voar no espaço aéreo

  RVSM, ou quais os requisitos de certificação específicos são requeridos para se voar em

  determinada aerovia na FIR Amazônica. Compulsoriamente o examinando deverá realizar a

  leitura completa das informações do ROTAER de pelo menos um aeródromo.

  4- NOTAM

  Verificar junto ao avaliado qual a importância do NOTAM para o despacho de um voo, e se
  a

  fonte de consulta é oficial.

  O examinando deverá saber decodificar os códigos com precisão, utilizando as publicações

  aeronáuticas pertinentes. Diante de um NOTAM, que poderá ter sido preparado para fins de

  cheque, ou então de um aeroporto escolhido aleatoriamente, o examinando deverá fazer a leitura

  demonstrando o entendimento daquela mensagem decodificada, e qual ação deverá tomar

  considerando um despacho operacional.

  5- MEL, DPG e CDL

  Verificar os conhecimentos do avaliado sobre os itens acima.

  A lista mínima de equipamentos aprovada pela autoridade de aviação civil é de papel fundamental

  no despacho operacional de voo. O examinador poderá apresentar um item previamente

  selecionado, para que o examinando demonstre habilidade em manusear a mel, ou então

  aproveitar a lista de itens ACR do dia do cheque, publicado pela manutenção do operador.
  O

  examinando deverá ter uma boa visão dos principais sistemas da aeronave e seus subsistemas
  e

  deverá saber aplicar as correções que afetam a performance.

  6- Estabelecimento do ATOW/MTOW, ELW/MLW

  Verificar se o avaliado sabe calcular os pesos ATOW e ELW, fazendo a comparação com os pesos

  máximos da aeronave.

  7- Determinação do nível de cruzeiroData de emissão: 2 de junho de 2025 IS nº 121-022

  Revisão A

  Verificar se o nível de cruzeiro escolhido está dentro das limitações operacionais da aeronave
  e

  das regras de voo.

  O examinando deverá apontar no manual da aeronave a tabela ou gráfico que informa os níveis

  ideais/máximos, em função do ATOW e eventualmente compará-los com os do plano de voo

  operacional.

  D.1.2 DETERMINAÇÃO DA ROTA

  1- Escolha da rota

  Verificar se a rota escolhida está adequada com as E.O (Especificações Operativas) da empresa
  e

  comparar a rota com as rotas preferenciais declaradas pelo CGNA.

  O examinando deverá realizar uma análise da rota escolhida, consultando as ENRC e AIP, saber

  explicar diferenças entre aerovias RNAV e ATS, requisitos RNAV, saber definir MSA, MEA,

  MORA e GRID MORA, checar detalhes das aerovias escolhidas nas ENRC como por exemplo

  cruzamento de Áreas Restritas, inversão de níveis, e demonstrar se há requisitos de rota
  no AIP.

  Se a empresa operar com outro provedor de informações aeronáuticas que não o Decea, deverá

  demonstrar conhecimento do mesmo.

  2- Escolha do alternado

  Verificar se o alternado está adequado as EO (Especificações Operativas) da empresa.

  Para um específico par de cidades determinado pelo examinador durante o cheque prático,
  o

  examinando deverá escolher um alternado e justificar a escolha. A tendência natural é escolha
  de

  um alternado onde o operador tenha uma estação de linha constante nas especificações operativas

  sob o argumento de facilidade de atendimento para uma aeronave que tenha alternado, mas
  o

  examinador deverá estar atento se esta escolha é a melhor em termos de aproveitamento de

  payload. O examinando deverá demonstrar atenção aos possíveis alternados em rota em caso
  de

  emergência, e sobre os requisitos para se decolar de um aeródromo operando abaixo dos mínimos

  para pouso e qual o possível alternado.

  3- SID, STAR, IAC, ENRC, ARC

  Verificar os conhecimentos do avaliado sobre: Carta de subida /rota /área, STAR, e Carta
  de

  aproximação por instrumento.

  Em função do vento previsto para a hora de decolagem e os designativos das cabeceiras de
  pista,

  o examinando deverá determinar o perfil de subida padrão (Carta de Subida Normalizada) que

  melhor se adequa a aerovia prevista. O mesmo raciocínio se aplica aos procedimentos

  aproximação e pouso por instrumentos (Carta de Aproximação por Instrumentos). Caso sejam

  escolhidos procedimentos RNAV o examinador deverá verificar o nível de conhecimento do

  examinando com relação à certificação mínima exigida nas cartas como por exemplo ‘GNSS

  required’ ou ‘RNAV/PRP 1 required’ e compará-los com as constantes nas especificações

  operativas do operador.

  O examinando deverá explicar as diferenças visuais e conceituais entre aerovias ATS e RNAV
  e

  os conceitos MEA, MORA, MOCA etc. Deverá descrever as características de Espaços Aéreos

  Condicionados (AIP), Limites de FIR e a Legenda e Simbologia em geral.

  D.1.3 PLANEJAMENTO DE VOO

  1- Regimes de potência e regimes de velocidade

  Verificar com o avaliado quais são esses regimes e os limitantes da aeronave, e as diferenças
  entre

  regime de potência e regime de velocidade.

  2- Teto máximo operacional/ Níveis de voo praticados

  Verificar se o avaliado sabe identificar no manual da aeronave o teto máximo operacional
  e qual

  o critério para os níveis de voo praticados. Verificar também o conhecimento do Plano Repetitivo

  (se houver) e qual a política para adequação do planejamento aos níveis informados no RPL,
  ou

  apresentação de mensagens ATC.

  3- Subida, cruzeiro e descida: consumo, tempo e distâncias

  Verificar o conhecimento do avaliado na navegação e no manual de performance da aeronave.

  4- Formação de gelo, turbulência, áreas restritas, cinzas vulcânicasData de emissão: 2 de
  junho de 2025 IS nº 121-022

  Revisão A

  Verificar se o avaliado conhece as fontes de consultas oficiais meteorológicas para a identificação

  dos fenômenos destacados no item, e sabe planejar um voo com estes fenômenos em atuação

  atmosférica, e como atuar com as áreas restritas indicadas no AIP-Brasil.

  5- ETOPS

  Verificar o conhecimento e a utilização na navegação (caso a empresa tenha a autorização
  ETOPS

  em sua E.O).

  O examinando deverá descrever os requisitos operacionais necessários para um despacho ETOPS,

  Redespacho, Tankering Fuel, Low Visibility Operations - LVO, decolagem com formação de

  gelo - Ice Formation, Driftdown/Inflight Diversion, voo em espaço aéreo RVSM, RNAV 10/5/1,

  RNP, RNP APP e RNP APP AR etc., relacionando-os sempre que possível, com as especificações

  operativas.

  6- Redespacho

  “Redespacho/Reclearence”. Verificar o conhecimento, as diferenças entre Redespacho em voo
  e

  Redespacho Planejado, e a utilização dos sistemas informatizados de navegação.

  7- Sistemas

  Verificar o conhecimento sobre os sistemas (elétrico, pneumático e hidráulico) e a capacidade
  de

  encontrar as informações no Manual da Aeronave.

  8- RVSM/RNAV/RNP/PBN

  Verificar o conhecimento sobre as siglas indicadas neste item e a aplicação no despacho
  de voo.

  RVSM - Separação mínima vertical reduzida

  RNAV - Navegação de área

  RNP - Performance de navegação requerida

  PBN - Navegação baseada na performance

  9- Operações especiais: SBRJ, SBSP, Driftdown, Gear Down

  Verificar o conhecimento do avaliado para as limitações operacionais no SBRJ e SBSP, e os

  limites para despacho com Driftdown e Gear Down.

  10- Navegação

  Verificar o conhecimento do avaliado junto ao sistema computadorizado de navegação utilizado

  na empresa.

  Uma vez analisadas todas as variáveis possíveis, o examinando deverá produzir um Plano de
  Voo

  Operacional, ajustado para as limitações encontradas como peso máximo de decolagem limitado

  pela performance, peso máximo de pouso limitado por PCN, maior consumo devido item MEL,

  limitações de níveis de voo devido cruzamento de áreas restritas etc.

  O examinando deverá ser capaz de explicar cada sigla ou abreviação de cada bloco do OFP
  tendo

  sempre em mente que em uma eventual dúvida da tripulação técnica, o despachante que elaborou

  tal plano será consultado para dirimir esta dúvida.

  11- MFR/Autonomia

  Verificar o conhecimento sobre o RBAC 121.645.

  D.1.4 PÓS PLANEJAMENTO

  1- Peso e balanceamento

  Verificar o conhecimento sobre o cálculo do peso e balanceamento da aeronave tanto

  manualmente e no sistema computadorizado usado pela empresa.

  O examinando deverá elaborar uma Loading Instruction em função das bagagens, correio, da

  tipologia da carga como artigos perigosos, perecíveis, volumes pesados, animais vivos,

  disponibilidade e tipologia das ULD’s. Deverá explicar a relação entre Human Remains e Artigos

  Perigosos.

  Após, deverá fazer um balanceamento automático ou manual, para determinação do CG do

  AZFW e ATOW e o valor do STAB TRIM. Para aeronaves wide-body, o examinando deverá

  tecer considerações entre o descarregamento e a condição de tipping e efetuar uma explanação

  completa.

  2- Plano de voo - IEPV 100-20

  Verificar o conhecimento no preenchimento do plano de voo ICAO e suas regras.

  O examinando deverá saber preencher um formulário IEPV 100-20 ou equivalente, bem comoData
  de emissão: 2 de junho de 2025 IS nº 121-022

  Revisão A

  descrever os equipamentos no item 10, em consonância com as características da aeronave
  e as

  especificações operativas, e os desdobramentos das certificações descritas no item 18. Se
  espera

  que o examinando saiba preencher um plano de voo utilizando somente a navegação do plano
  de

  voo operacional - OFP, o MCA 100-1, e as cartas de navegação em rota correspondentes.

  3- TAKEOFF COMPUTATION

  Será exigido a demonstração do conhecimento, caso na empresa o DOV preencha o Takeoff

  computation.

  Uma vez calculado o ATOW, o examinando deverá calcular as velocidades e o peso máximo de

  decolagem, por performance, consultando a análise de pista correspondente à cabeceira, que
  é

  função da componente de vento METAR ou TAF, o melhor Flape de Decolagem, e aplicar as

  correções devidas como ajuste QNH, componente de vento caso sejam consideradas, Redução
  de

  Potência, correção no peso de performance devido a pista contaminada, Bleeds / Packs ON/OFF,

  ATTCS/ATPCS ON/OFF, inoperância de sistemas ou subsistemas como por exemplo A/S 1 canal

  inoperante e ao final determinar as velocidades de decolagem. No caso de peso de decolagem

  baixo, tecer comentários a respeito das velocidades com ênfase na V1/V1MCG.

  D.1.5 BRIEFING

  1- Explanação da meteorologia

  Deverá ser avaliado o conhecimento sobre o tema: (TAF, METAR, SIGMET, SIGWX, ...), fonte

  de consulta - REDEMET

  2- Explanação dos NOTAM’s

  Deverá ser avaliado o conhecimento sobre o tema:

  (NOTAM e Suplementos AIP) fonte de consulta - AIS WEB

  3- Explanação completa da navegação

  Deverá ser verificado o conhecimento do avaliado sobre todos os itens constantes na navegação.

  (Consultando no MGO ou Boletins Operacionais da empresa).

  4- Limites Operacionais

  Questionar o avaliado sobre os limites de ventos na decolagem e no pouso (cauda, proa e

  cruzados), altitude de voo, velocidades (MMO e VMO) e pesos máximos limitantes.

  5- MEL

  Verificar o conhecimento de pesquisa de um ou mais itens no MEL e a aplicabilidade num voo.

  D.1.6 MANUAIS E PUBLICAÇÕES

  1- AFM/AOM/FCOM/FPPM

  Verificar o conhecimento sobre os manuais citados.

  Muito embora vários manuais já possam ter sido manuseados até este ponto, o examinador deverá

  finalizar o cheque solicitando ao examinando que demonstre conhecer o Manual da Aeronave
  ou

  equivalente, ênfase em Limitations, Performance, Flight Planning e Weight and Balance,

  Systems, RBAC/IS, MGO, MAP ou DGR.

  2- Regulamentos: RBAC, IAC, ICA 100-11

  Verificar o conhecimento nos itens citados e em destaque ao RBAC 121.

  3- MGO/E.O.

  Verificar se o avaliado sabe da importância do MGO e das E.O., e se preciso consultar não
  teria

  dificuldade.Data de emissão: 2 de junho de 2025 IS nº 121-022

  Revisão A'
