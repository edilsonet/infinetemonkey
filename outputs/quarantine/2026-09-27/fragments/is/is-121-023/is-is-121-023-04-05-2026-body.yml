text: '04.05.2026


  OBJETIVO

  Estabelecer procedimentos aplicáveis aos operadores aéreos que atuam segundo o RBAC nº 121
  para permitir a execução de atividades em voo por servidores da ANAC.


  REVOGAÇÃO

  N/A


  FUNDAMENTOS

  A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da Anac.

  O meio ou procedimento alternativo mencionado no parágrafo 3.2b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  A IS não pode criar requisitos adicionais ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.


  DEFINIÇÕES

  Para os efeitos desta IS, são válidas as definições listadas na seção 01.1 do RBAC nº 01
  e no RBAC nº 121.

  Abreviaturas

  Anac - Agência Nacional de Aviação Civil

  GenDec - General Declaration

  IS - Instrução Suplementar

  QR - Quick Response

  RBAC - Regulamento Brasileiro da Aviação Civil

  SIAPE - Sistema Integrado de Administração de Recursos Humanos


  DESENVOLVIMENTO DO ASSUNTO

  Atividade em voo

  As atividades em voo são atividades de vigilância e de certificação de segurança operacional
  realizadas em aeronaves operando segundo o RBAC nº 121, com o objetivo de avaliar o cumprimento
  dos requisitos regulamentares bem como dos procedimentos operacionais previstos no sistema
  de manuais do operador aéreo.

  Conforme previsto no parágrafo 121.581(a) do RBAC nº 121, o operador aéreo deve deixar disponível
  um assento, na cabine de comando de cada um de seus aviões, para uso de servidor da Anac
  na condução de inspeção em rota. As seções 121.547 e 12.548 versam sobre o acesso de servidor
  da Anac à cabine de comando.

  Visando um melhor acompanhamento das atividades em voo, quando houver disponibilidade, a
  critério da Anac, o servidor da Anac poderá ocupar assento de passageiro, assento de comissário
  ou assento na cabine de comando (jump seat) conforme o objetivo da atividade.

  A ocupação de assentos na cabine de passageiros (assento de passageiro ou de comissário)
  busca evitar a abertura da porta de acesso à cabine de comando durante a operação da aeronave
  e permitir uma melhor observação dos procedimentos executados na cabine de passageiros,
  quando essa for a finalidade da atividade.

  Sempre que possível, é desejável que o assento de passageiro disponibilizado seja próximo
  à saída de emergência, facilitando a observação de procedimentos nessa região da aeronave.

  Não há necessidade de bloqueio da comercialização de assentos no voo, pois o servidor da
  Anac, quando necessário e viável, poderá ajustar o escopo da atividade e utilizar o assento
  de comissário ou jump seat na cabine de comando ou ainda realizar a atividade em outro voo.

  O servidor da Anac, no exercício da atividade em voo, tem preferência na ocupação de assentos
  em relação a tripulantes/funcionários de empresas congêneres (passe livre) e tripulantes/funcionários
  do operador aéreo que não estejam em treinamento ou em deslocamento a serviço.

  O servidor da Anac, em atividade de fiscalização, exerce o poder próprio da autoridade de
  aviação civil, podendo restringir, em favor do interesse público, direito, bem ou atividade
  individual. [art. 2º e 5º da Lei nº 11.182/2005]

  Desobedecer a ordem legal de funcionário público ou desacatar funcionário público no exercício
  da função ou em razão dela constituem crime com pena de multa e/ou detenção. [art. 330 e
  331 do Código Penal]

  Durante a atividade externa de fiscalização, é garantido aos servidores da Anac, mediante
  apresentação do seu cartão físico de identidade funcional, o acesso a documentos, áreas
  restritas de aeródromos, aeronaves civis em território brasileiro, aeronaves civis brasileiras
  em qualquer parte, bem como a instalações das sociedades empresariais e entidades reguladas
  pela Anac. [art. 4º da Instrução Normativa Anac nº 101, de 14 de junho de 2016]

  É dever do operador aéreo garantir que seus funcionários conheçam o teor desta IS. Eventuais
  descumprimentos poderão caracterizar embaraço à fiscalização e sujeitar o operador aéreo
  às sanções e medidas administrativas previstas em lei e na regulamentação da Anac.

  Comunicação ao operador aéreo e providências para o embarque

  A critério da Anac, o operador aéreo poderá ser comunicado previamente à realização da atividade
  em voo. Nesse caso, a comunicação será enviada ao e-mail disponibilizado pelo operador aéreo
  ou informada por outro meio que venha a ser estabelecido pela Anac para essa finalidade.

  O operador aéreo deverá encaminhar todos os cartões de embarque ou documentos equivalentes
  à Anac (inclusive para os voos de conexão), conforme prazos e orientações contidas na comunicação
  da atividade em voo.

  Para atividades internacionais, o operador aéreo também deverá assegurar a inclusão do nome
  do servidor da Anac na General Declaration (GenDec).

  Caso haja impedimento para a realização da atividade, alteração na programação do voo ou
  indisponibilidade do assento solicitado, o operador aéreo deverá encaminhar as justificativas
  imediatamente para a Anac, conforme orientações contidas na comunicação da atividade em
  voo, e informar o próximo voo para a rota prevista em que o assento solicitado estará disponível.

  É facultado ao servidor da Anac, a seu critério, alterar o assento, o voo e/ou o operador
  aéreo da rota prevista. Nesses casos, o servidor entrará em contato com o operador aéreo
  para verificar a viabilidade da(s) alteração(ões) pretendida(s).

  Quando a Anac decidir por não comunicar previamente o operador aéreo, o servidor da Anac
  se apresentará diretamente a um funcionário do operador aéreo no backoffice ou no balcão
  de check-in do aeroporto de origem. Em casos excepcionais, a critério da Anac, o servidor
  poderá se apresentar diretamente no portão de embarque ou à tripulação do voo.

  O funcionário do operador aéreo deverá solicitar ao servidor da Anac que apresente o seu
  cartão físico de identidade funcional para realizar a devida identificação do servidor.
  A consulta quanto à autorização do servidor para a realização de atividade em voo pode ser
  realizada pelo QR Code contido no verso do cartão (verificar se o endereço acessado pertence
  ao domínio anac.gov.br) ou por meio de lista disponibilizada pela Anac, às pessoas indicadas
  pelos operadores aéreos, no endereço eletrônico https://identidadefuncional.anac.gov.br/menu/r/api/autorizacoes_id.

  Após essa verificação, o funcionário do operador aéreo deverá reservar os assentos solicitados
  pelo servidor da Anac nos respectivos voos conforme a disponibilidade, fornecer os cartões
  de embarque ou documentos equivalentes (inclusive para os voos de conexão) e avisar o funcionário
  que o recepcionará no portão de embarque para garantir a fluidez do processo.

  Para operações cargueiras, o servidor irá se apresentar diretamente à tripulação do voo.

  Quando estiver de posse dos cartões de embarque, ou documentos equivalentes, o servidor
  da Anac prosseguirá diretamente para o portão de embarque.

  O operador aéreo deverá priorizar o embarque do servidor da Anac em relação aos passageiros
  do voo (inclusive dos prioritários). Esse procedimento visa garantir tempo suficiente para
  que o servidor da Anac se apresente adequadamente à tripulação do voo, inicie as suas atividades
  e ocupe o assento em que realizará a atividade no momento mais oportuno.

  Caso o servidor não se apresente até o horário de fechamento do voo, o operador deve prosseguir
  com os seus procedimentos normalmente, evitando qualquer impacto na programação do voo.

  Antes do embarque, o operador aéreo deve realizar a identificação do servidor da Anac e,
  caso ainda não tenha sido feita, a verificação da respectiva autorização para a realização
  de atividade em voo, conforme procedimento descrito no item 5.13.1 desta IS.

  Caso haja impedimento para a realização da atividade, alteração na programação dos voos
  ou indisponibilidade dos assentos solicitados, o operador aéreo deverá apresentar as justificativas
  diretamente para o servidor da Anac e oferecer alternativas, quando possível, para atender
  à solicitação do servidor e permitir a realização da atividade em voo. Permanecendo o impedimento,
  o servidor da Anac registrará o fato para posterior apuração.

  O operador aéreo deverá despachar as bagagens do servidor da Anac, sem qualquer custo, sempre
  que solicitado pelo próprio servidor ou quando absolutamente necessário em virtude da alta
  ocupação da cabine de passageiros.

  A bagagem do servidor da Anac está sujeita aos mesmos procedimentos de controle de security
  previstos para os membros da tripulação.

  O transporte de artigos perigosos em bagagens de mão e/ou despachadas pelos servidores da
  Anac deve ser o mesmo permitido para os passageiros e membros da tripulação, conforme os
  limites e isenções autorizados na regulamentação e nos manuais do operador aéreo. [Apêndice
  H da IS nº 175-001]

  Apresentação à tripulação do voo e execução da atividade

  O servidor da Anac se apresentará à tripulação do voo, esclarecendo ao(à) comissário(a)
  chefe/líder e/ou ao(à) comandante a atividade que será realizada e solicitando que o seu
  nome conste no diário de bordo da aeronave. Na sequência, poderá solicitar e anotar os dados
  de identificação da tripulação do voo, conforme previsto no escopo da atividade.

  O(a) comandante deve registrar no diário de bordo da aeronave o nome e matrícula SIAPE do
  servidor da Anac.

  O operador aéreo deverá garantir as condições necessárias para que o servidor da Anac realize
  a sua atividade com plena autonomia, imparcialidade e impessoalidade.

  É dever do servidor da Anac respeitar os procedimentos de segurança do operador aéreo e
  a autoridade do(a) comandante da aeronave.

  A tripulação do voo deverá responder as perguntas, prestar informações e atender todas as
  solicitações do servidor da Anac que não prejudiquem a segurança operacional. Havendo impedimento,
  após a finalização da operação, devem ser efetuados os devidos esclarecimentos ao servidor
  da Anac.

  Ao final do voo, após o desembarque dos passageiros, o servidor da Anac realizará um debriefing
  com a tripulação.

  Apuração de achados

  Achados identificados pelo servidor da Anac poderão ser objeto de instauração de procedimento
  administrativo e/ou compor a base de coleta de dados da Anac para planejamento de novas
  atividades.

  Os servidores poderão adotar as providências acautelatórias necessárias para cessação de
  conduta ao ser constatada situação de risco iminente à segurança das operações.

  Comunicações à Anac

  Até o 15º (décimo quinto) dia do mês subsequente, deverá ser encaminhado para o e-mail atividadeemvoo@anac.gov.br
  o relatório mensal referente às atividades em voo realizadas no mês anterior. O e-mail deve
  conter, no campo assunto, a seguinte identificação: “Relatório de voos com servidores a
  bordo - MM/AAAA”, sendo “MM/AAAA” o mês e o ano de referência do relatório. O relatório
  deve conter as seguintes informações:

  a) todos os servidores da Anac que realizaram atividades em voo no operador aéreo, discriminando
  por nome, matrícula SIAPE, data e número do voo; e

  b) eventuais dificuldades de leitura de QR Code do cartão físico de identidade funcional
  de servidores.


  APÊNDICES

  N/A


  DISPOSIÇÕES FINAIS

  Os casos omissos serão dirimidos pela Superintendência de Padrões Operacionais (SPO).'
