text: '02.01.2023


  OBJETIVOS

  1.1. Oferecer a uma empresa estrangeira de transporte aéreo que opere ou pretenda operar
  serviço de transporte aéreo internacionais no Brasil, um método de cumprimento para os requisitos
  estabelecidos pelo RBAC nº 129.

  1.2. Apresentar procedimentos para a obtenção de autorização, segundo os requisitos do RBAC
  nº 129, para uma empresa estrangeira de transporte aéreo que pretenda realizar operações
  regulares no Brasil.

  1.3.Apresentar procedimentos para alteração de operações já autorizadas segundo o RBAC nº
  129.

  1.4. Apresentar procedimentos para obtenção de autorização, segundo os requisitos do RBAC
  nº 129, para realização de voos não regulares para uma empresa estrangeira de transporte
  aéreo.

  REVOGAÇÃO

  Esta IS revoga a IS nº 129-001, Revisão B.

  FUNDAMENTAÇÃO

  3.1. A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou
  RBHA.

  3.2. O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de
  requisito previsto em RBAC ou RBHA, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) a presentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3. O meio ou procedimento alternativo mencionado no parágrafo 3.2b desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4. A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5. Esta IS também se fundamenta no RBAC nº 129 e referencia-se nos seguintes documentos
  internacionais:

  a) Anexo 6 à Convenção sobre Aviação Civil Internacional: Operação de Aeronaves - Operations
  of Aircraft; e

  b) Doc 8335 da OACI: Manual de Procedimentos para Inspeção de Operações, Certificação e
  Vigilância Continuada - Manual of Procedures for Operations Inspection, Certification and
  Continued Surveillance.

  DEFINIÇÕES

  4.1. No escopo da presente IS, são válidas todas as definições contidas no RBAC nº 01 e
  no RBAC nº 129, e as seguintes definições:

  4.2. Certificado de Operador Aéreo (COA): é o documento emitido por uma Autoridade de Aviação
  Civil que certifica que determinada empresa passou por um processo de certificação técnica
  e cumpre os requisitos mínimos estabelecidos;

  4.3. Contrato de intercâmbio de aeronave (aircraft interchange agreement): acordo entre
  operadores aéreos que viabilize o serviço, com uma única aeronave, ligando a rota de uma
  empresa aérea à rota de outra empresa aérea em um ponto de intercâmbio, de forma que o controle
  operacional e as responsabilidades dele decorrentes, bem como a tripulação competem à empresa
  aérea operando em cada rota. Neste tipo de contrato, o último operador assume o controle
  operacional da aeronave, no momento da transferência;

  4.4. Plano operacional de voo: é o plano do operador para a condução segura do voo, considerando
  o desempenho da aeronave, outras limitações operacionais e as condições relevantes esperadas
  na rota e nos aeródromos envolvidos;

  4.5. Representante legal: é a pessoa nomeada pela empresa estrangeira de transporte aéreo
  nos termos da Portaria SAS/SIA/SPO nº 9715, de 7 de novembro de 2022 (ou norma que vier
  a substituí-la);

  4.6. Wide body: é avião comercial de fuselagem larga com mais de um corredor; e

  4.7. Narrow Body: é avião comercial de fuselagem estreita com único corredor.

  4.8. Lista de abreviaturas em ordem alfabética:

  AOC - Air Operator Certificate

  AR - Authorization Required

  ATC - Air Traffic Control

  AVSEC - Aviation Security

  CC - Compliance Checklist

  COA - Certificado de Operador Aéreo

  DECEA - Departamento e Controle do Espaço Aéreo

  EDTO - Extended Diversion Time Operations

  EFOD - Electronic Filling Of Differences

  EO - Especificações Operativas

  ETOPS - Extended Operations (Operação Prolongada)

  IATA - International Air Transport Association

  ICA - Instrução do Comando da Aeronáutica

  IDIRS - Intercambio de datos de inspecciones de seguridad en rampa

  OACI - Organização da Aviação Civil Internacional

  OFP - Operational Flight Plan

  PBN - Performance Based Navigation

  RVSM - Reduced Vertical Separation Minima (Separação Vertical Mínima Reduzida)

  SAFA - Safety Assessment of Foreign Aircraft

  SGHA - Standard Ground Handling Agreement

  SPO - Superintendência de Padrões Operacionais

  USOAP - Universal Safety Oversight Audit Programme

  PROCEDIMENTOS

  5.1. Aplicabilidade

  5.1.1. Esta IS aplica-se exclusivamente às empresas estrangeiras de transporte aéreo que
  operam no Brasil sob a égide do RBAC nº 129.

  5.1.2. Esta IS propõe procedimentos para, no âmbito dos requisitos operacionais:

  a) obtenção de autorizações, segundo os requisitos do RBAC nº 129, para uma empresa estrangeira
  de transporte aéreo que pretenda realizar operações regulares no Brasil;

  b) alteração de operações já autorizadas de acordo com o RBAC nº 129; e

  c) obtenção de autorização, segundo os requisitos do RBAC nº 129, para realização de voos
  não regulares para uma empresa estrangeira de transporte aéreo.'
