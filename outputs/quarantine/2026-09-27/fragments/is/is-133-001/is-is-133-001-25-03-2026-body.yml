text: '25.03.2026

  OBJETIVO

  1.1 Definir o processo para autorização para operações de helicópteros com carga externa,
  em consonância ao requerido no RBAC nº 133, seja em operações de aviação geral (privadas),
  seja em operações de serviços aéreos especializados.

  Nota: de acordo com os parágrafos 137.1(e) e (f) do RBAC nº 137, os operadores certificados
  para operar segundo o RBAC nº 133 estão dispensados de cumprir a Subparte B do RBAC nº 137
  quando conduzindo operação aeroagrícola de combate a incêndio, e os operadores de helicópteros
  conduzindo exclusivamente operações aeroagrícolas com dispensadores externos fixos instalados
  na aeronave não necessitam cumprir com os requisitos do RBAC nº 133.

  1.2 Esta IS apresenta orientações e informações para operadores de helicópteros com carga
  externa que já possuam autorização.


  Revogação

  2.1 Esta IS revoga a IS nº 133-001 Revisão B.


  Fundamentos

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, pode:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da Anac.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.

  3.5 Esta IS estabelece um meio aceitável para a obtenção da autorização requerida pela seção
  133.11 do RBAC nº 133.


  Definições e Abreviaturas

  4.1 Geral'
