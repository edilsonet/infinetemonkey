text: '16.07.2026

  OBJETIVO

  Esta IS tem o objetivo de estabelecer o procedimento para elaboração do Manual Geral de
  Operações (MGO) dos operadores aéreos regidos pelo RBAC nº 135.

  REVOGAÇÃO

  Esta IS revoga a IS nº 135-002 Revisão F.

  FUNDAMENTOS

  3.1. A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2. O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de
  requisito previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3. O meio ou procedimento alternativo mencionado no parágrafo 3.2b desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4. A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  DEFINIÇÕES

  Para os efeitos desta IS, são válidas as definições listadas nos RBAC nº 01 e RBAC nº 135
  e na IS nº 119-004.

  DISPOSIÇÕES INICIAIS

  5.1. O conteúdo do MGO estabelece políticas, processos e procedimentos operacionais diretamente
  relacionados à complexidade de cada operador, a depender do ambiente operacional e sua frota.

  5.2. Os assuntos descritos no MGO devem estar correlacionados às autorizações previstas
  nas especificações operativas. Não se faz necessária a inclusão de qualquer tema que não
  possua relação direta com a operação vivenciada pela empresa.

  5.3. O MGO é uma ferramenta administrativa utilizada para controlar e dirigir as atividades
  do pessoal envolvido nas operações da empresa. A elaboração do MGO deve ser conduzida, orientada
  e supervisionada pelo diretor de operações da empresa.

