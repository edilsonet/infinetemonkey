text: '01.04.2022


  OBJETIVO

  1.1 Apresentar instruções e procedimentos para a autorização para a realização de operação
  aeromédica por operador aéreo certificado conforme o RBAC n° 119 e que opere sob as regras
  do RBAC nº 135.

  REVOGAÇÃO

  2.1 Não aplicável.

  FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou
  RBHA.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC ou RBHA, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 O parágrafo 119.5(a)(1) do RBAC n° 119 estabelece que um operador aéreo deve obter um
  Certificado de Operador Aéreo (COA) e respectivas Especificações Operativas (EO) antes de
  iniciar as operações de transporte aéreo público. Além disso, o parágrafo 119.5(b)(1)(ii)
  estabelece que o COA autoriza seu detentor a realizar operações em conformidade com as apropriadas
  autorizações, limitações e procedimentos estabelecidos nas EO e procedimentos especificados
  para cada característica de operação.

  3.6 A operação aeromédica se enquadra dentre os tipos de operação que requerem autorização
  prévia em EO para que o detentor de certificado possa executar esse serviço.

  3.7 Esta IS apresenta instruções, orientações e procedimentos a serem seguidos por operadores
  aéreos que operem sob a égide do RBAC n° 135 e que sejam detentores ou pretendam obter autorização
  em EO para a prestação de serviço de operação aeromédica.

  DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas na seção 01.1 do RBAC nº
  01 e as definições a seguir:

  4.1.1 Ambulância aérea: aeronave de asa fixa ou rotativa, de suporte avançado de vida, configurada
  com equipamentos médicos, fixos ou removíveis, com insumos mínimos necessários para o nível
  de atendimento a ser prestado por profissional de saúde capacitado para exercer função a
  bordo.'
