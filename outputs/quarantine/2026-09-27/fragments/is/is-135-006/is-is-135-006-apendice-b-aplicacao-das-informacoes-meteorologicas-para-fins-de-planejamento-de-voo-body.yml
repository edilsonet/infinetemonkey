text: 'APÊNDICE B - APLICAÇÃO DAS INFORMAÇÕES METEOROLÓGICAS PARA FINS DE PLANEJAMENTO DE
  VOO

  B1 Para fins de planejamento de voo, as informações meteorológicas são utilizadas para verificação
  de cumprimento de requisitos como 135.205, 135.207, 135.211, 135.219, bem como para os requisitos
  de desempenho da Subparte I do RBAC nº 135.

