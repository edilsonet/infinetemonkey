text: 'APÊNDICE C - CRITÉRIOS PARA CÁLCULO DO SUPRIMENTO DE COMBUSTÍVEL E ÓLEO LUBRIFICANTE

  C1 As seções 135.209 e 135.223 estabelecem os requisitos de combustível e óleo lubrificante
  (autonomia), respectivamente para voos VFR e IFR, de forma a garantir que a aeronave possua
  combustível e óleo lubrificante suficientes para completar o voo com segurança e ainda permitir
  desvios da operação planejada, em caso de contingências.

  C2 Ao calcular o suprimento de combustível e óleo lubrificante, o detentor de certificado
