text: '03.10.2022


  OBJETIVO

  1.1 Apresentar meios alternativos para considerar os parâmetros necessários para cumprimento
  dos requisitos de desempenho da Subparte I do RBAC nº 135, quando o aeródromo não dispõe
  de informações meteorológicas publicadas que atendam à seção 135.213 do RBAC nº 135.

  REVOGAÇÃO

  N/A

  FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou
  RBHA.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC ou RBHA, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 Esta IS é fundamentada e objetiva oferecer método de cumprimento ao parágrafo 135.363(l)
  do RBAC nº 135.

  DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas na seção 01.1 do RBAC nº
  01 e as seguintes definições:

  4.2 Lista de abreviaturas:

  AFM - Aircraft flight manual (manual de voo da aeronave)

  ANAC - Agência Nacional de Aviação Civil

  ATS - Air Traffic Service (serviço de tráfego aéreo)

  FAA - Federal Aviation Administration

  ICA - Instrução do Comando da Aeronáutica

  IFR - Instrument flight rules (regras do voo por instrumentos)

  Inmet - Instituto Nacional de Meteorologia

  IS - Instrução Suplementar

  LDA - Landing distance available (distância disponível para pouso)

  METAR - Aerodrome routine meteorological report (informe meteorológico de aeródromo regular)

  NOTAM - Notice to airmen (aviso aos aeronavegantes)

  PAADV - Programa de acompanhamento e análise de dados de voo

  RBAC - Regulamento Brasileiro da Aviação Civil

  SGSO - Sistema de gerenciamento da segurança operacional

  SPO - Superintendência de Padrões Operacionais

  TAF - Terminal aerodrome forecast (previsão de aeródromo)

  TFAC - Taxa de fiscalização de aviação civil

  VFR - Visual flight rules (regras do voo visual)

  DESENVOLVIMENTO DO ASSUNTO

  5.1 Introdução

  5.1.1 O parágrafo 135.363(l) do RBAC nº 135 permite que, quando o aeródromo não dispuser
  de informações meteorológicas publicadas que atendam à seção 135.213 do RBAC nº 135, o detentor
  de certificado solicite à ANAC uma aprovação para uso de meios alternativos para considerar
  os parâmetros necessários para cumprimento dos requisitos de desempenho da Subparte I do
  RBAC nº 135.

  5.1.2 Os requisitos de desempenho da Subparte I do RBAC nº 135 que dependem de informações
  meteorológicas de aeródromo são listados na Tabela 1, com aplicabilidade de acordo com a
  classificação do avião.

  Tabela 1 - Aplicabilidade dos requisitos de desempenho do RBAC nº 135

  Classificação do avião (aplicabilidade)


  Grande avião categoria transporte com motores convencionais'
