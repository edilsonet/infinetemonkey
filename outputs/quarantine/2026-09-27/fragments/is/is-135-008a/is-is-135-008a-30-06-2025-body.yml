text: '30.06.2025


  OBJETIVO

  1.1 Oferecer a uma organização, que opere ou pretenda operar de acordo com o RBAC nº 135
  em operações regulares ou não regulares, um método de cumprimento para elaborar e obter
  aceitação dos procedimentos operacionais padronizados (SOP) de suas aeronaves, em conformidade
  com o parágrafo 135.23(a)(35) do RBAC nº 135.


  REVOGAÇÃO

  2.1 Esta Instrução Suplementar revoga a IS nº 119-003A.


  FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 Esta IS relaciona-se com os seguintes regulamentos:

  a) RBAC nº 91 - Regras gerais de operação para aeronaves civis; e

  b) RBAC nº 135 - Operações de transporte aéreo público com aviões com configuração máxima
  certificada de assentos para passageiros de até 19 assentos e capacidade máxima de carga
  paga de até 3.400 kg (7.500 lb), ou helicópteros.

  3.4 Esta IS apresenta meios aceitáveis de cumprimento para o parágrafo 135.23(a)(35) do
  RBAC nº 135.


  DEFINIÇÕES

  4.1 Para os fins desta IS, as seguintes definições e termos são fornecidos:

  4.1.1 Ambiente de alta carga de trabalho. Qualquer ambiente em que as múltiplas demandas
  para a tripulação de voo exigem a priorização das funções de trabalho. Por exemplo, a operação
  IFR abaixo de 10.000 pés durante chegada ou partida de uma área terminal (incluindo os procedimentos
  de táxi) é considerada como um ambiente de alta carga de trabalho.

  4.1.2 Cabeça Baixa (Heads down). Um piloto está com a “cabeça baixa” quando se encontra
  com a cabeça voltada para baixo, concentrado em alguma tarefa que o impede de olhar para
  frente e para fora da aeronave.

  4.1.3 Challenge response. Modelo de execução de checklist em que, primeiro, os pilotos configuram
  a aeronave de acordo com a memória. Após, os pilotos utilizam o checklist para certificar-se
  de que todos os itens foram cumpridos corretamente.'
