title: Calibração
text: '5.2.3.5 Calibração

  a) Estabelecer procedimentos e responsabilidades quanto à calibração de ferramentas de precisão,
  dispositivos de medidas ou equipamentos de testes (ex. paquímetros, multímetros, manômetros,
  tensiômetros, torquímetros, equipamentos de ensaios não destrutivos, balanças etc.)

  b) Estabelecer procedimentos que assegurem que as calibrações realizadas são rastreáveis
  aos padrões do INMETRO.

  c) Estabelecer que os equipamentos, testes e ferramentas, para os quais a calibração é requerida,
  deverão ser calibrados em intervalos previstos nos manuais dos fabricantes, ou, na ausência
  de orientação do fabricante, em intervalos previstos em normas técnicas estabelecidas ou
  consagradas. Adicionalmente, cada um destes equipamentos deve ser recalibrado sempre que
  o item sofrer danos ou mau manuseio, ou quando houver suspeita de que não esteja em condições
  adequadas de uso.'
