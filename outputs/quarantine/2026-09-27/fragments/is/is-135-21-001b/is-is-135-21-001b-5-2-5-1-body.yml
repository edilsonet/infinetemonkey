title: Organização
text: '5.2.5.1 Organização

  a) O MGM deverá assegurar que o diretor ou gerente de manutenção mantenha os dados abaixo
  para planejar e disponibilizar as aeronaves para as operações de voo, estabelecendo as coordenações
  necessárias com outros setores do operador ou empresas contratadas.

  I- Os tipos e configurações de cada aeronave (número de assentos, configurações de cabine
  aprovadas, etc.).

  II- Manutenções previstas para cada aeronave.

  III- Capacidade de manutenção de cada base ou provedor de manutenção, se aplicável.

  b) O MGM deverá prover procedimentos para a elaboração das fichas de serviço necessárias
  que descrevem as tarefas de manutenção, ou informar que serão utilizadas as fichas do fabricante,
  garantindo o atendimento ao programa de manutenção.

  5.2.5.2 Planejamento da produção. O MGM deverá assegurar que o CTM disponibilize os seguintes
  dados ao diretor ou gerente de manutenção, visando ao adequado planejamento da produção:

  a) Aeronaves com manutenção (inspeções periódicas, tempos de vida limitados, reparos, alterações,
  manutenção não programada, correção de itens postergados, diretrizes de aeronavegabilidade
  etc.) próxima do vencimento.

  b) Motores/rotores/hélices com manutenção (inspeções periódicas, tempos de vida limitados,
  revisão geral, HSI, reparos, alterações, diretrizes de aeronavegabilidade, conforme aplicáveis
  etc.) próxima do vencimento.

  c) Componentes com manutenção (inspeções periódicas, tempos de vida limitados, remoção programada,
  reparos, alterações, diretrizes de aeronavegabilidade, etc.) próxima do vencimento.'
