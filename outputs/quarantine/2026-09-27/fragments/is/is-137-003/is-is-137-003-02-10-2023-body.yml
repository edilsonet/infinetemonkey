text: '02.10.2023


  OBJETIVO

  Oferecer a uma organização que opere ou pretenda operar sob o RBAC nº 137 em operações aeroagrícolas
  remuneradas ou em proveito de terceiros, um método de cumprimento para que obtenha, altere,
  suspenda, solicite revogação de uma suspensão ou solicite a revogação de um Cadastro de
  Aeroagrícola (CDAG), de acordo com os requisitos estabelecidos pela Subparte B do RBAC nº
  137.

  REVOGAÇÃO

  Esta IS revoga a IS nº 137-003 Revisão A.

  FUNDAMENTOS

  3.1 A Resolução no 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2.b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento descrito em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  DEFINIÇÕES

  Para os efeitos desta IS, são válidas as definições listadas na seção 137.3 do RBAC nº 137,
  as definições listadas no RBAC nº 01, e as seguintes definição e abreviaturas:

  organização significa qualquer pessoa física ou jurídica que opere ou pretenda operar sob
  o RBAC nº 137 em operações aeroagrícolas remuneradas ou em proveito de terceiros.

  CBA - Código Brasileiro de Aeronáutica

  CDAG - Cadastro de Aeragrícola

  FCDAG - Formulário de Cadastro de Aeroagrícola

  IPTU - Imposto Predial e Territorial Urbano

  IS - Instrução Suplementar

  ITR - Imposto sobre a Propriedade Territorial Rural

  RBAC - Regulamento Brasileiro da Aviação Civil

  SEI - Sistema Eletrônico de Informações

  SPO - Superintendência de Padrões Operacionais

  DESENVOLVIMENTO DO ASSUNTO

