text: '01.02.2022


  1. OBJETIVO

  1.1 Esta Instrução Suplementar - IS estabelece condições aceitáveis sob as quais o etanol1
  pode ser usado em operação de avião agrícola na categoria restrita ou na categoria normal,
  equipado com motor convencional.

  1.2 Esta IS apresenta recomendações a serem consideradas na modificação de um avião, de
  um motor convencional e de sua respectiva instalação no avião, para utilização do etanol.


  1 A referência ao etanol nesta Instrução Suplementar corresponde ao Álcool Etílico Hidratado
  Combustível - AEHC.


  2. REVOGAÇÃO

  Esta IS substitui a Instrução Suplementar nº 137.201-001 revisão D.


  3. FUNDAMENTOS

  3.1 O art. 202 da Lei Federal nº 7.565, de 19 de dezembro de 1986, prescreve que as operações
  aeroagrícolas obedecerão a regulamento especial.

  3.2 O Regulamento Brasileiro da Aviação Civil nº 21 - RBAC 21, “Certificação de Produto
  e Artigo Aeronáutico”, trata da emissão de certificados de tipo para aeronaves categoria
  restrita e categoria normal, modificações desses certificados e emissão de certificados
  de aeronavegabilidade para essas aeronaves.

  3.3 O RBAC 137, “Certificação e Requisitos Operacionais: Operações Aeroagrícolas”, parágrafo
  137.201(e), estabelece que um operador agrícola pode utilizar combustível não previsto no
  projeto de tipo aprovado da aeronave agrícola desde que sejam seguidos critérios aceitáveis
  pela ANAC.

  3.4 Esta IS provê orientação e condições aceitáveis pela ANAC sob as quais um avião agrícola
  pode operar na categoria restrita ou na categoria normal, se seu motor, certificado para
  outro combustível, for alimentado com etanol.


  4. DEFINIÇÕES - N/A


  5.DESENVOLVIMENTO DO ASSUNTO

  5.1 Aplicabilidade

  5.1.1 As disposições desta IS aplicam-se somente aos aviões agrícolas certificados na categoria
  restrita ou na categoria normal, equipadoss com motores convencionais e que operam segundo
  o RBAC 137. Para os propósitos desta IS, a palavra aeronave refere-se apenas a avião.'
