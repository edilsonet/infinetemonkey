text: '02.10.2023


  OBJETIVO

  Oferecer a uma organização que opere ou pretenda operar sob o RBAC nº 137 em operações aeroagrícolas,
  um método para o gerenciamento do risco das operações, conforme exigido pela seção 135.215
  do RBAC nº 137.

  REVOGAÇÃO

  Não aplicável.

  FUNDAMENTOS

  3.1 A Resolução no 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2b desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento descrito em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  DEFINIÇÕES

  Para os efeitos desta IS, são válidas as definições listadas na seção 137.3 do RBAC nº 137
  e as definições listadas no RBAC nº 01.

  DESENVOLVIMENTO DO ASSUNTO

  5.1 Introdução

  5.1.1 O gerenciamento do risco das operações engloba a identificação dos perigos e a avaliação
  e a mitigação dos riscos decorrentes desses perigos. Ou seja, os riscos são analisados como
  consequências dos perigos identificados e que ameaçam a capacidade operacional do operador
  aéreo. O objetivo do gerenciamento dos riscos à segurança operacional é eliminar ou mitigar
  os riscos para um nível tão baixo quanto for praticável, e esta IS visa proporcionar ao
  gestor responsável uma ferramenta para a alocação equilibrada de seus recursos, destacando
  entre os riscos avaliados aqueles considerados prioritários para as ações de mitigação.

  5.1.2 Para que todos consigam participar do processo de gerenciamento do risco às operações,
  é necessário que os conceitos sejam bem difundidos a todos os envolvidos na organização.

  5.1.3 Assim, é importante que os conceitos sejam incluídos nos programas de treinamento
  de todos que trabalham na ou para a empresa, visando garantir que os envolvidos entendam
  e assimilem as responsabilidades implicadas no gerenciamento do risco.'
