text: '(e) Unidade 5 -- Emergências com artigos perigososData de emissão: 22 de dezembro de
  2017. IS nº 141-003

  Revisão A

  Y6. Plano das unidades e subunidades didáticas

  Componente Curricular: TRANSPORTE AÉREO DE ARTIGOS PERIGOSOS

  Módulo 2 Carga Horária: 9 h-a

  Unidades Didáticas

  1 Artigos perigosos - noções básicas

  Objetivos específicos Subunidades

  1.1

  • Identificar os requisitos básicos para a manipulação, rotulagem e

  transporte por via aérea de artigos perigosos definidos pela

  OACI/ICAO e enumerados no anexo 18, Instruções Técnicas

  associadas e Regulamentações da IATA sobre Artigos Perigosos.

  1.2

  • Identificar a regulamentação nacional relativa ao transporte de artigos

  perigosos.

  • Consultar os documentos oficiais que especificam se as mercadorias

  são aceitáveis ou não para o transporte pelas companhias aéreas

  comerciais e, se aceitáveis, em que condições (por exemplo,

  rotulagem, embalagem, as limitações de quantidade, de carga e de

  manipulação).

  1.3

  • Justificar a necessidade de controle sobre tipo, quantidade e

  localização de artigos perigosos nas aeronaves.

  • Identificar possíveis danos ou interferência nos equipamentos de

  aviões por substâncias ou materiais perigosos.

  • Identificar possíveis danos ou interferência nos equipamentos de

  aviões por substâncias ou materiais.

  • Identificar artigos que somente podem ser conduzidos em aviões

  cargueiros.

  1.1 Regulamentação Internacional'
