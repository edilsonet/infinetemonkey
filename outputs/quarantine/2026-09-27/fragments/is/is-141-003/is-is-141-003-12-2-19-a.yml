title: 12.2.19(a)
text: '(a) o treinamento deve se concentrar no papel desempenhado pelo DOV como parte de

  uma equipe maior, que pode incluir membros da tripulação de voo, pessoal de

  operações da empresa aérea e outros profissionais com os quais o DOV interage;'
