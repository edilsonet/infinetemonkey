text: '(f) Unidade 6 - Gerenciamento de ameaças e erros

  P6. Plano de unidades e subunidades didáticas

  Componente Curricular: FATORES HUMANOS NA AVIAÇÃO CIVIL

  Módulo 2 Carga Horária: 15 h-a

  Unidades Didáticas

  1 Conceitos básicos

  Objetivos específicos SubunidadesData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  1.1

  • Reconhecer que competência baseia-se nos conhecimentos,

  habilidades e atitudes individuais de um indivíduo.

  • Delinear os fatores de formação que irão garantir a futura competência

  do individual do DOV.

  1.2

  • Analisar dados estatísticos referentes a acidentes aéreos.

  • Comparar os índices de acidentes de aviação com os de outros meios

  de transporte.

  • Estabelecer, em termos gerais, o percentual de acidentes com

  aeronaves que são causadas por fatores humanos.

  • Justificar o papel das estatísticas de acidentes no desenvolvimento de

  estratégias para futuras melhorias para a segurança de voo.

  • Explicar a importância da compreensão das causas e das categorias de

  acidentes e incidentes para a segurança de voo.

  1.3

  • Descrever e comparar os elementos do modelo SCHELL.

  • Descrever a interação entre os diferentes componentes do modelo

  SCHELL.

  • Resumir a relevância do modelo SCHELL para trabalhar no cockpit.

  • Explicar como a interação entre os membros da tripulação podem

  afetar a segurança de voo.

  • Identificar e explicar a interação entre o DOV e os demais membros

  do ambiente operacional como um fator de segurança de voo.

  1.4

  • Caracterizar o treinamento em Gerenciamento de Recursos de Equipes

  (Corporate Resource Management - CRM) quanto ao objetivo, ao

  público-alvo e à importância para a segurança de voo

  • Reconhecer o modelo de Gerenciamento de Recursos de Despacho

  (Dispatch Resource Management - DRM) como um programa

  derivado do CRM aplicado ao treinamento em Fatores Humanos para

  o DOV.

  • Identificar o documento nacional básico que estabelece normas sobre

  o “Treinamento em Gerenciamento de Recursos de Equipes

  (Corporate Resource Management - CRM)”.

  1.1 Competência e limitações humanas'
