title: 15.3.4(h)
text: '(h) Unidade 8 - Atitudes anormais da aeronave

  M5. Orientações didáticas

  É aconselhável a demonstração, por meio de desenhos esquemáticos elaborados pelo

  instrutor e pelos alunos, dos princípios da fisiologia do voo. A projeção de filmes,

  disponíveis na internet, mostrando o desempenho de aeronaves nas diversas fases do voo

  e de acidentes relacionados a falhas nos sistemas auxiliam na compreensão dos aspectos

  fisiológicos do voo.

  M6. Plano das unidades e subunidades didáticas

  Componente Curricular: TEORIA DE VOO

  Módulo 1 Carga Horária: 39 h-a

  Unidades Didáticas

  1 Princípios da aerodinâmica

  Objetivos Específicos Subunidades

  1.1

  • Definir aerodinâmica.

  • Definir cada uma das forças atuantes em um avião: sustentação,

  arrasto, tração e peso.

  • Identificar os eixos do avião e os movimentos realizados em torno

  de cada eixo.

  • Definir temperatura do ar, densidade do ar e pressão absoluta do

  ar.

  • Citar as aplicações da velocidade aerodinâmica ou verdadeira

  (VA), da velocidade indicada (VI) e da velocidade calibrada

  (VC).

  • Descrever os processos utilizados para determinação da

  velocidade aerodinâmica ou verdadeira, da velocidade indicada

  e da velocidade calibrada.

  1.2

  • Definir aerofólio.

  • Definir bordo de ataque, bordo de fuga, cambra superior, cambra

  inferior, corda, extradorso (dorso), intradorso e espessura do

  perfil.

  • Identificar cada tipo de perfil de um aerofólio.

  • Definir alongamento, área, ângulo de ataque, ângulo de

  incidência e coeficiente de sustentação da asa.

  1.1 Conceitos básicos'
