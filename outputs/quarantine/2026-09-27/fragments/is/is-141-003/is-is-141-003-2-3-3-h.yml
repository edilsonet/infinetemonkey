text: '(h) Unidade 8 - Infrações, contravenções e crimes.

  I6. Plano das unidades e subunidades didáticas

  Componente Curricular: LEGISLAÇÃO E REGULAMENTAÇÃO

  Módulo 1 Carga Horária: 39 h-a

  Unidades Didáticas

  1 Introdução ao Direito Aeronáutico

  Objetivos específicos Subunidades

  1.1

  • Definir Direito Aeronáutico.

  • Citar o objeto do Direito Aeronáutico.

  1.2

  • Listar as disposições gerais da Convenção sobre Aviação

  Civil Internacional (Chicago, 1944) e identificar alguns

  dos problemas de transporte aéreo internacional abordados

  pela Convenção.

  • Justificar a necessidade de um acordo internacional (a

  Convenção) e uma organização internacional (OACI) para

  supervisionar o desenvolvimento e implementação de

  normas internacionais (Anexos à Convenção).

  • Listar as liberdades do ar.

  1.3

  • Descrever a aplicação dos seguintes termos em Aviação

  Civil: território, soberania, águas territoriais, alto mar.

  1.4

  • Descrever as condições estabelecidas pela Convenção de

  Chicago para o voo sobre o território dos Estados

  contratantes.

  1.5

  • Explicar as obrigações de cada Estado Contratante da

  OACI para a adoção de normas e procedimentos

  internacionais; autenticação de certificados e licenças,

  validade dos certificados e licenças averbados e

  notificação de diferenças, quando houver

  • Descrever a finalidade e o conteúdo de cada Anexo da

  OACI, com ênfase especial sobre as disposições

  1.1 Noções gerais'
