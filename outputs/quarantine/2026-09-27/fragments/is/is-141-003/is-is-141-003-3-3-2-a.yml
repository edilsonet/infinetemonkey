title: 3.3.2(a)
text: '(a) tomada de decisões quanto à operação planejada, operação atrasada, mudança de

  itinerário ou cancelamento de voos;

  Nota. Neste grupo de exercícios, será necessário dar instruções sobre a aplicação

  dos procedimentos do operador relevantes para as ações do DOV em casos de voos

  atrasados, cancelados ou desviados, manejo de passageiros e mercadorias e

  reposicionamento de aeronaves.'
