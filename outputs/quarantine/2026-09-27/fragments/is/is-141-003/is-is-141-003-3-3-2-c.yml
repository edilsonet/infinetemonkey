id: is-is-141-003-3-3-2-c
kind: is
document: is-141-003
family: '141'
section_id: 3.3.2
section_title: Procedimentos do DOV
subsection_id: c
cite: 3.3.2(c)
title: 3.3.2(c)
text: '(c) Objetivos - apresentam os elementos importantes que devem ser executados de

  forma satisfatória para demonstrar competência em uma tarefa.

  AB5.1.3. O instrutor deve verificar se o aluno cumpre os objetivos das tarefas através da

  demonstração de competência em todos os elementos de competência listados no Perfil

  de Conclusão do Curso de DOV (Apêndice B desta IS). Para atingir os objetivos, o

  candidato deve ser capaz de descrever, reconhecer, analisar, executar e corrigir os erros.

  AB5.2. Área 1 - Planejamento de Voo e liberação de despacho

  Tarefa 1-A: Requisitos Regulatórios

  Referências: RBAC 1, 25, 65, 91, 119, 121, 135 e 129; IS aplicáveis; Manual Geral de Operações;

  Especificações operativas.

  Objetivos: O aluno deverá ser capaz de:

  1) explicar os requisitos regulamentares para a obtenção de um certificado de DOV e argumentar
  por

  que as transportadoras aéreas empregam despachantes;

  2) demonstrar conhecimento adequado dos elementos de planejamento de voo e de liberação
  de

  despacho ao preparar planos de voo e manifestos de carga, bem como obter informações importantes

  para o despacho de um voo entre os aeroportos designados;

  3) planejar o voo, de acordo com os requisitos regulamentares, especificações de operativas
  e

  procedimentos da empresa e fornecer todas as informações necessárias para o piloto em comando;
  e

  4) reconhecer informações adicionais que possam afetar a segurança da aeronave em voo e
  fornecer

  essa informação para o piloto em comando, em tempo hábil.

  Tarefa 1-B: Meteorologia

  Referências: Cartas e previsões meteorológicas, ATIS, METAR, SPECI, TAF, AIP, NOTAM

  Objetivos: determinar, por meio de questionamento oral e exercícios de liberação do plano
  de voo e de

  despacho, se o aluno é capaz de:

  1) explicar os elementos meteorológicos básicos, como o movimento da Terra e seus efeitos
  no clima;

  2) demonstrar conhecimento adequado dos aspectos meteorológicos, estruturas e características
  da

  atmosfera, para aplicação no planejamento do voo, incluindo: pressão atmosférica, ventos,
  nuvens,

  neblina, gelo, massas de ar e frentes;

  3) Selecionar no NOTAM as informações relevantes para o voo proposto.Data de emissão: 22
  de dezembro de 2017. IS nº 141-003

  Revisão A

  Tarefa 1-C: Observações, análise e previsões de tempo

  Referências: Cartas e previsões meteorológicas, ATIS, METAR, SPECI, TAF, AIP, NOTAM

  NOTA: Caso os relatórios, previsões ou outras informações meteorológicas atuais e pertinentes
  não estejam

  disponíveis, esta informação deve ser simulada pelo instrutor de forma que permita avaliar
  adequadamente a

  competência do aluno. Exemplos de informações sobre meteorologia aeronáutica são indicados
  entre

  parênteses abaixo, conforme o caso.

  Objetivos: verificar, por meio de questionamento oral e exercício de elaboração do plano
  de voo, se o aluno

  é capaz de:

  1) demonstrar conhecimento adequado dos elementos de meteorologia aeronáutica através da
  obtenção,

  leitura e análise de informações aplicáveis, tais como:

  a. relatórios e previsões meteorológicas de aviação (ATIS, METAR, SPECI, TAF);

  b. relatórios de pilotos e de radares (PIREPS, imagens de satélites meteorológicos)

  c. gráficos de análise de superfície.

  d. cartas de informações meteorológicas significativas (SIGMET).

  e. cartas de ventos e de temperaturas

  f. cartas de nível de congelamento (FB, FA, carta de análise de superfície, gráficos de
  pressão

  constante).

  g. gráficos de análise de pressão constante.

  h. tabelas e gráficos de conversão.

  i. avisos e alertas, tais como: SIGMET, AIRMET, NOTAM, ASHTAM

  2) analisar corretamente as informações do meteorológicas relativas à rota de voo e ao aeródromo
  de

  destino proposto, e determinar se um aeródromo alternativo é necessário. Caso seja necessário,

  determinar se o aeródromo selecionado satisfaz os requisitos da regulamentação e das especificações

  operativas.

  Tarefa 1-D: Riscos climáticos

  Referências: Manual de Voo do Avião, Manual Geral de Operações.

  Objetivos: O aluno deverá ser capaz de:

  1) demonstrar conhecimento adequado dos elementos relativos a riscos climáticos através
  da aplicação

  de todas correções adequadas para a performance da aeronave no plano de voo e na liberação
  manual

  do despacho e, em seguida,

  2) discutir adequadamente com o instrutor a forma de realizar o briefing relativo a riscos
  climáticos,

  tais como:

  a. vento cruzado e rajadas;

  b. pistas contaminadas;

  c. restrições à visibilidade;

  d. turbulência e tesoura de vento;

  e. gelo;

  f. trovoadas e microbursts;

  g. tornados e furacões; e

  h.cinzas vulcânicas.

  Tarefa 1-E: Sistemas, desempenho e limitações da aeronaveData de emissão: 22 de dezembro
  de 2017. IS nº 141-003

  Revisão A

  Referências: RBHA 65 ou RBAC que venha a substituí-lo e RBAC nº 121; Manual de Voo; Manuais
  de

  Operação; MEL / CDL

  Objetivos: o aluno deverá ser capaz de:

  1) demonstar conhecimento adequado dos princípios de voo das aeronaves turboélice e a jato,
  e os

  elementos de limitações de desempenho, incluindo o conhecimento aprofundado dos efeitos
  adversos

  provocados por ser excedida qualquer limitação;

  2) demonstrar conhecimento e utilização apropriada das cartas, tabelas, gráficos ou outros
  dados

  relacionados ao desempenho da aeronave, tais como:

  a. distância de aceleração e frenagem,

  b. desempenho de decolagem com todos os motores, e com motor (es) inoperante(s);

  c. desempenho de subida, com todos os motores, e com motor (es) inoperante(s);

  d. teto de serviço, com todos os motores, e com motor (es) inoperante(s);

  e. desempenho de cruzeiro;

  f. consumo, alcance e resistência de combustível;

  g. performance de descida;

  h. circuito de espera; e

  i. drift down;

  3) descrever velocidades de desempenho de aeronaves adequadas utilizadas durante fases específicas

  do voo;

  4) descrever os efeitos das condições meteorológicas sobre as características de desempenho
  e aplicar

  corretamente esses fatores a uma carta, gráfico, ou outros dados de desempenho;

  5) calcular a localização do centro de gravidade para uma condição de carga específica (conforme

  especificado pelo instrutor), incluindo a adição, remoção e mudança de peso;

  6) determinar que o peso de decolagem, o peso de pouso e peso zero combustível estão dentro
  dos

  limites, considerando:

  a. quantidade de passageiros reservados;

  b. quantidade de carga reservada;

  c. tipo de aeronave escalada para o voo;

  d. origem e destino do voo

  7) descrever procedimentos para um voo econômico, incluindo o abastecimento e o desempenho
  do

  combustível;

  8) determinar as velocidades máximas operacionais, visando o tempo mínimo de voo;

  9) selecionar regimes de velocidade, rotas e altitudes para que um voo resulte em consumo
  mínimo de

  combustível;

  10) estabelecer a rota ótima e altitudes com base em uma análise cuidadosa das melhores
  informações

  disponíveis;

  11) determinar rumos e distâncias, velocidades, tempos de voo e consumo de combustível entre
  os

  pontos compulsórios;

  12) demonstrar um bom planejamento e conhecimento de procedimentos na aplicação de fatores

  operacionais que afetam o desempenho da aeronave;

  13) demonstrar e aplicar, usando a terminologia correta, conhecimentos relacionados aos
  sistemas de

  aeronaves, tais como:

  a. comandos de voo;

  b. piloto automático;

  c. hidráulicos;

  d. elétricos;

  e. ar condicionado e pressurização;

  f. proteção contra chuva e gelo;

  g. aviônicos, comunicação e navegação;Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  h. grupo motopropulsor e unidades de energia auxiliar;

  i. sistemas e fontes de combustível;

  j. sistemas de lubrificação;

  k. trem de pouso e freios;

  l. detecção e proteção contra incêndio

  m. procedimentos anormais e de emergência; e

  n. lista de equipamentos mínimos (MEL) / lista de desvios de configuração (CDL).

  Tarefa 1-F: Navegação e sistemas de navegação das aeronaves

  Referências: RBAC 121, 129, 135; Manual de Voo, Manual Geral de Operações; AIM.

  Objetivos: o aluno deverá ser capaz de:

  1) demonstrar conhecimento adequado da navegação aérea e dos equipamentos e procedimentos
  de

  navegação de aeronaves, tais como:

  a. cartas de navegação e símbolos relacionados ao espaço aéreo;

  b. instrumentos de navegação a bordo, banco de dados e sistemas automatizados:

  i. sistema eletrônico de voo por instrumentos (Electronic flight instrument system -

  EFIS);

  ii. sistema de gerenciamento do voo (Flight Management System - FMS);

  c. operações de navegação especiais e de desempenho (PBN):

  i. separação vertical mínima reduzida (Reduced Vertical Separation Minimums -

  RVSM);

  ii. operações estendidas (Extended Operations - ETOPS);

  iii. performance de navegação requerida (Required Navigation Performance - RNP);

  iv. rotas de navegação de área (Area Navigation - RNAV);

  v. Sistema Global de Navegação por Satélite (Global Navigation Satellite System -

  GNSS) -- WAAS (Wide Area Augmentation System) e Sistema de Posicionamento

  Global (Global Positioning System - GPS);

  d. sistemas de navegação inercial;

  e. sistema de gerenciamento de voo (Flight Management System - FMS); e

  2) Definir termos de navegação, referências de tempo e localização (0 ° de longitude, UTC)
  e sistemas

  de navegação, incluindo:

  a. sinais VHF de alcance multidirecional (VHF Omnidirectional Range - VOR);

  b. equipamento medidor de distância (Distance Measuring Equipment - DME);

  c. sistema de pouso por instrumentos (Instrument Landing System - ILS);

  d. receptores e indicações de rádio-farol (Marker Beacon);

  e. códigos de transponder e de altitude;

  f. indicador automático de direção (Automatic Direction Finding -ADF);

  g. sistema de navegação aérea de longo alcance (Long Range Navigation - LORAN);

  h. sistema de navegação inercial (Inertial Navigation System - INS);

  i. sistema inercial de referência (Inertial Reference System - IRS);

  j. navegação de área (Radio Area Navigation - RNAV);

  k. radar Doppler;

  l. sistema de posicionamento global (Global Positioning System - GPS).

  Tarefa 1-G: Aplicações práticas de despacho

  Referências: RBAC 121, 129, 135; Manual de Voo, Manual Geral de Operações; AIM.

  Objetivos: o aluno deverá ser capaz de:Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  1) apresentar conhecimentos, habilidades e atitudes adequadas para gerenciar riscos e evitar
  acidentes

  / incidentes com aeronaves através dos seguintes elementos:

  a. procedimentos de gerenciamento de recursos de despacho (dispatcher resource management

  - DRM);

  b. fatores humanos, trabalho em equipe, comunicação e troca de informações;

  c. tomada de decisão aeronáutica;

  d. consciência situacional, avaliação e resolução de problemas;

  e. concepção e avaliação de alternativas;

  f. planejamento de contingência;

  g. erro humano e erro induzido por tecnologia;

  h. ferramentas de suporte e tecnologias;

  i. priorização de tarefas;

  j. fatores individuais e organizacionais;

  k. prevenção, detecção e recuperação de erros;

  l. procedimentos de gerenciamento de risco do operador aéreo, conforme o caso;

  2) coordenar e integrar todas as atividades essenciais de preparação de um voo, de forma
  a:

  a. priorizar a segurança de voo;

  b. proporcionar um máximo de conforto e comodidade para os passageiros;

  c. evitar áreas com condições meteorológicas adversas;

  d. evitar e/ou minimizar atrasos;

  e. efetuar o aproveitamento máximo de carga paga com o menor consumo possível;

  3) planejar o carregamento e executar o balanceamento da aeronave;

  4) selecionar as cartas de voo a serem utilizadas de acordo com as regras para o voo proposto;

  5) planejar o voo gerenciando interesses conflitantes, de forma a evitar que tais interesses
  prejudiquem

  a segurança do voo;

  6) trabalhar com custos operacionais diretos, observando as variações de acordo com a duração
  do voo

  tais como: combustível, tipo do voo e seleção de aeródromos alternativos;

  7) analisar as previsões meteorológicas para decidir se um voo pode ser iniciado;

  8) estabelecer a disponibilidade de aeronaves, quando na função de coordenador;

  9) estabelecer disponibilidade de tripulantes técnicos e de cabine, quando na função de
  coordenador;

  10) determinar máximo payload para o voo pretendido;

  11) descrever princípios de abastecimento econômico (tankering fuel) e dar exemplos práticos;

  12) planejar voos visando o consumo mínimo e máximo ‘payload’.

  13) analisar custo do combustível em um abastecimento econômico utilizando gráficos constantes
  no

  manual da aeronave.

  Tarefa 1-H: Manuais e outras publicações

  Referências: RBHA 65 ou RBAC que venha a substituí-lo; RBAC nº 121 e 135; Manual Geral de
  Operações,

  especificações operativas, MEL / CDL, Manual de Voo do avião, ROTAER, AIP.

  Objetivos: o aluno deverá ser capaz de:

  1) demonstrar conhecimento adequado dos manuais utilizados para o despacho de aeronaves;

  2) localizar efetivamente manuais, guias e outros materiais de referência necessários para
  o despacho

  da aeronave, durante a execução das tarefas propostas;

  3) revisar a performance da aeronave estudada utilizando os gráficos e tabelas;

  4) extrair, dos gráficos e tabelas, dados a serem utilizados no planejamento do voo proposto,
  em

  condições normais e anormais.

  Tarefa 1-I:Preenchimento de formulários de Plano de VooData de emissão: 22 de dezembro de
  2017. IS nº 141-003

  Revisão A

  Referências: RBAC 121; Instrução do Comando da Aeronáutica - ICA 100-11; Manual do Comando
  da

  Aeronáutica - MCA 100-11

  Objetivos: O aluno deverá ser capaz de:

  1) preencher diferentes tipos de planos de voo, no formulário adequado, de acordo com as
  regras

  estabelecidas pela Instrução do Comando da Aeronáutica - ICA 100-11 e dos procedimentos

  descritos no Manual do Comando da Aeronáutica - MCA 100-11;

  2) indicar, para cada plano de voo preenchido, o tempo limite e os métodos de apresentação
  segundo a

  ICA 100-11.

  Tarefa 1-J - Despacho ETOPS

  Referências: RBAC 121

  Objetivos: o aluno deverá ser capaz de:

  1) identificar situações em que seja necessário o despacho ETOPS;

  2) praticar a técnica do despacho ETOPS de acordo com a regulamentação brasileira em vigor;

  3) planejar com base em previsão de contingências, tais como:

  a. teto e visibilidade abaixo dos mínimos operacionais;

  b. situações em que o ponto de não retorno ou ponto crítico devem ser avaliados; e

  c. driftdown após falha do motor;

  AB5.3. Área 2 - Pré-voo, decolagem e partida

  Tarefa 2- A: Procedimentos de Controle de Tráfego Aéreo

  Referências: RBAC 91, 135 e 121, Normas do DECEA

  Objetivos: o aluno deverá ser capaz de:

  1) demonstrar conhecimento adequado dos elementos de controle de tráfego aéreo, incluindo:

  a. termos, siglas e abreviaturas;

  b. responsabilidades ATC;

  c. instalações e equipamentos ATC;

  d. classificação do espaço aéreo e estrutura de rotas;

  e. mínimos de separação ATC;

  f. controle de fluxo ATC;

  g. gerenciamento do tráfego aéreo;

  h. protocolos e regulamentos das comunicações ATC;

  i. comunicações por fonia e por enlace de dados;

  j. procedimentos de partida, saída padrão por instrumentos e navegação de área;

  k. saídas de área;

  l. cartas de área terminal e de rotas baixas / altas.

  m. procedimentos de partida aprovados e mínimos de decolagem.

  n. procedimentos anormais.

  2) obter as devidas autorizações para operar voos especiais, tais como voos extras, charters,
  translados,

  translados com um motor inoperante ou voos teste, e voos de treinamento;

  Tarefa 2-B: Liberação do voo

  Referências: RBAC 91, 135 e 121, Normas do DECEA

  Objetivos: o aluno deverá ser capaz de:

  1) expor, de forma detalhada, todos os itens do planejamento de voo;

  2) aplicar habilidades comunicação, de tomada de decisão, e técnicas de briefing e debriefing;Data
  de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  3) analisar as previsões meteorológicas para decidir se um voo pode ser iniciado;

  4) tomar decisões operacionais quanto à hora de partida: dentro do horário previsto, antecipação
  do

  horário ou adiamento da partida;

  5) tomar decisões operacionais quanto ao tipo de aeronave, dependendo do tráfego de passageiros
  e

  mudanças na programação das aeronaves, podendo, de acordo com as circunstâncias:

  a. manter o tipo de aeronave previsto;

  b. trocar por aeronave menor que a programada; ou

  c. trocar por aeronave maior que a programada.

  6) determinar a liberação do voo quando convencido de que foram cumpridos todos os requisitos
  para

  uma operação segura, de acordo com as limitações operacionais e os regulamentos;

  7) distribuir detalhes relevantes do plano de voo para outros departamentos da empresa;

  8) realizar briefing com a tripulação técnica, quando aplicável;

  9) obter aprovação do piloto em comando quanto ao plano de voo operacional; e

  10) transmitir a liberação de voo (flight release).

  AB5.4. Área 3 - Procedimentos durante o voo

  Tarefa 3-A: Determinação de rotas e redespacho

  Referências: RBAC 91 e 121; AIM; Manual Geral de Operações; especificações operativas.Data
  de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  Objetivos: o aluno deverá ser capaz de:

  1) demonstrar conhecimentos, habilidades e atitudes para aplicar os seguintes elementos:

  a. rotas ATC;

  b. requisitos de mudança de rota e de comunicações ATC entre empresa e tripulações;

  c. reapresentação do Plano de Voo ATC;

  d. cancelamento de Plano de Voo ATC;

  e. procedimentos de redespacho;

  f. desvios em voo;

  g. escalas intermediárias;

  h. procedimentos referentes a aeródromos alternativos;

  i. aeródromos para reabastecimento;

  j. requisitos meteorológicos para os aeródromos;

  2) estabelecer a rota ideal e altitudes com base em uma análise cuidadosa das melhores informações

  disponíveis;

  3) determinar rumos e distâncias, velocidades, tempos de voo e consumo de combustível entre
  os pontos

  compulsórios;

  4) planejar com base em previsão de contingências, tais como:

  a. teto e visibilidade abaixo dos mínimos operacionais;

  b. situações em que o ponto de não retorno ou ponto crítico devem ser avaliados; e

  c. driftdown após falha do motor.

  5) verificar se há erros em um plano de voo operacional gerado por um provedor de serviços
  de

  navegação aérea;

  6) tomar decisões operacionais quanto a:

  a. cancelar um voo programado;

  b. criar um novo voo;

  c. cancelar pouso em uma escala programada;

  d. adicionar pouso em uma escala não programada, ou pouso técnico;

  e. selecionar aeródromos alternativos;

  f. preparar o plano de voo operacional;

  7) identificar situações em que seja necessário o redespacho;

  8) praticar a técnica de redespacho que permite aumento de payload quando o combustível
  mínimo para

  o destino restringe o payload, ou para se evitar um pouso técnico, ou simplesmente diminuir
  os custos

  de um voo.

  9) praticar a técnica do redespacho de acordo com a regulamentação brasileira em vigor.

  Tarefa 3-B: Requisitos e procedimentos de comunicação em rota

  Referências: RBAC 91, 121 e 135; Normas do DECEA, Manual Geral de Operações, especificações

  operativas.Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  Objetivo: o aluno deverá ser capaz de:

  1) demonstrar conhecimento adequado dos elementos e métodos de comunicações aeronáuticas,
  tais

  como:

  a. requisitos de comunicação de voz e de dados;

  b. regulamentos de comunicações ATC e protocolos da empresa;

  c. requisitos de posição ATC e relatórios da empresa;

  d. acompanhamento do voo;

  e. sistema de comunicações e relatório de aeronaves (Aircraft communications addressing
  and

  reporting system - ACARS);

  f. sistema de chamada seletiva (Selective Calling System - SELCAL);

  g. comunicações de alta frequência (High frequency communications - HF);

  h. comunicações de frequência muito alta (Very high frequency communications - VHF);

  i. comunicações por satélite;

  j. comunicação controlador-piloto através de enlace de dados (Controller Pilot Data Link

  Communications - CPDLC).

  AB5.5. Área 4 - Procedimentos de chegada, aproximação e pouso

  Tarefa 4-A: Procedimentos ATC e de Navegação Aérea

  Referências: RBAC 91, 121 e 135; Normas do DECEA, Manual Geral de Operações, especificações

  operativas, Cartas aeronáuticas.

  Objetivos: O aluno deverá ser capaz de:

  1) apresentar conhecimentos adequados em relação a:

  a. chegadas de área;

  b. procedimentos e rotas de transição.

  c. chegadas padrão por instrumentos (standard instrument arrival routes - STAR).

  d. cartas e procedimentos de aproximação por instrumentos (IAP).

  e. procedimentos de aproximação de precisão:

  i. ILS CAT I.

  ii. ILS CAT II.

  iii. ILS CAT III.

  iv. ILS PRM (Precision Runway Monitor).

  v. radar de aproximação de precisão (Precision Approach Radar - PAR).

  f. procedimentos de aproximação de não-precisão.

  g. mínimos de separação ATC.

  h. tratamento prioritário ATC.

  AB5.6. Área 5 - Procedimentos pós-voo

  Tarefa 5-A: Requisitos e procedimentos de comunicação

  Referências: RBAC 91, 135 e 121; Normas do DECEA; Manual Geral de Operações.

  Objetivo: o aluno deverá ser capaz de:Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  1) demonstrar conhecimento adequado dos elementos de procedimentos pós-voo regulamentares
  e de

  empresas, referentes a documentos de comunicação e da empresa necessários, tais como:

  a. componentes das mensagem de chegada, requisitos e protocolo de comunicações; e

  b. métodos normais e alternativos de efetuar as comunicações.

  Tarefa 5-B: Documentação de voo

  Referências: Referências: RBAC 91, 135 e 121; Manual Geral de Operações

  Objetivo: o aluno deverá ser capaz de:

  1) demonstrar conhecimento adequado dos requisitos regulamentares e procedimentos pós-voo

  relativos ao despacho, peso e balanceamento, manifesto de carga, documentos meteorológicos,

  registros de comunicações e outros documentos e relatórios do voo.

  AB5.7. Área 6 - Procedimentos anormais e de emergência

  Tarefa: Procedimentos anormais e de emergência

  Referências: RBAC 91, 135 e 121; Normas do DECEA e do CENIPA;

  Manual Geral de Operações, Manual de Voo

  Objetivo: o aluno deverá ser capaz de:

  1) demonstrar conhecimento e proficiência relativos aos procedimentos anormais e de emergência,
  tais

  como:

  a. medidas de segurança em terra;

  b. medidas de segurança no ar;

  c. regulamentação da ANAC;

  d. regulamentação do DECEA e do CENIPA

  e. coleta e divulgação de informações sobre a aeronave em atraso ou em emergência;

  f. meios de declarar uma emergência;

  g. responsabilidade para declarar uma emergência.

  AB6. Outras atividades sugeridas

  AB6.1. Observação de treinamento de voo de tripulantes em simulador

  AB6.1.1. Objetivo: proporcionar aos alunos um melhor entendimento e conscientização sobre
  o

  ambiente de trabalho no cockpit de um avião de transporte aéreo comercial e os deveres

  práticos da tripulação de voo em situações operacionais normais, anormais e de

  emergência.

  AB6.1.2. Para habilitar os futuros DOV a desenvolver compreensão e conhecimento prático
  do

  ambiente operacional no cockpit de uma aeronave de transporte aéreo comercial, é

  essencial que eles passem algum tempo observando uma sessão de treinamento de

  tripulantes de voo, realizado de forma adequada em treinador sintético. É recomendado

  que esta formação inclua a participação no briefing de CRM pré-simulador e a observação

  de pelo menos uma sessão de treinamento de voo completa, que contemple exercícios

  simulados, sob condições de voo normais, anormais e de emergência.Data de emissão: 22 de
  dezembro de 2017. IS nº 141-003

  Revisão A

  AB6.1.3. Se possível, um esforço também deve ser feito para dar ao aluno treinamento para

  capacitá-lo a compreender a operação de aeronaves e para lhe permitir comparar as

  dificuldades de voar padrões característicos de cada tipo de aeronave, usando auxílios

  específicos para navegação e execução de procedimentos do aeródromo. Esses exercícios,

  se realizados, devem ter o objetivo de ensinar a compreensão dos procedimentos, em vez

  de sua execução impecável.

  AB6.2. Familiarização com as rotas

  AB6.2.1. Objetivo: permitir que o aluno aprecie as características de rota em uma determinada

  área de operação e familiarize-se com os diferentes procedimentos e serviços disponíveis

  ao longo de diferentes setores da rota.

  AB6.2.2. A familiarização com as rotas é considerada uma parte essencial e integrante da
  formação

  do DOV, uma vez que permite uma apreciação realista pelo aluno de características de

  rota na área selecionada da operação, tais como as diferenças de procedimentos e serviços

  disponíveis ao longo de diferentes setores de rota e em diferentes aeródromos, dos efeitos

  das condições meteorológicas e características topográficas vigentes e do tratamento de

  dificuldades em voo ocasionadas por condições ambientais. Tal experiência prática vai

  auxiliar o futuro DOV na execução de suas atividades com os mais altos padrões de

  desempenho.

  AB6.2.3. Para realizar essa atividade, a organização de instrução pode programar uma visita
  a um

  centro de despacho de voo de uma empresa aérea.

