  Revisão A

  O critério “Desempenho muito bom” (5) somente deve ser atribuído em condições excepcionais
  de

  atendimento de um item de avaliação, para os alunos que realmente se destaquem no desenvolvimento

  daquele item.

  Para que os resultados se constituam efetivos registros do desempenho do aluno, torna-se
  fundamental que o

  instrutor/avaliador se disponha a agir com justiça, bom senso e imparcialidade, de forma
  a não comprometer

  a sua análise, e que esses registros sejam comentados com o aluno, a fim de que ele possa
  também avaliar

  seu desempenho. O êxito deste processo de avaliação depende da disponibilidade do avaliador
  e do avaliado

  em participarem do processo com maturidade e respeito mútuo.

  Assinale com “X” a opção que melhor descreva a atuação do aluno diante do padrão de desempenho
  (item

  de avaliação) e respectivas opções.

  Indique apenas uma opção (1, 2, 3, 4 ou 5) para cada padrão de desempenho avaliado.

  Não rasure esta ficha evitando, assim, dupla interpretação, o que poderá anular esta avaliação.

  Para efeito de obtenção do percentual mínimo de 80% de aprovação, somente os pontos obtidos
  pelo aluno

  nos desempenhos considerados aceitáveis -- “Desempenho satisfatório” (3), “Desempenho bom”
  (4) e

  “Desempenho muito bom” (5) -- devem ser adicionados e lançados nos subtotais indicados em
  cada tabela.

  O aluno que não obtiver os 80% de aprovação deverá repetir as tarefas nas quais apresentou
  padrão de

  desempenho inaceitável para, em seguida, ser reavaliado.

  Os totais de cada Unidade de Competência indicam a pontuação mínima, correspondente a 80%
  de

  aprovação.

  Após totalmente preenchida, esta ficha deverá ser entregue à Secretaria da Organização de
  Instrução, para

  compor a pasta do aluno.

  III - REGISTROS DE AVALIAÇÃO

  Unidade de Competência 1 - Comunicações aeronáuticas: comunicar-se de forma eficaz

  com todas as partes interessadas dentro de um ambiente operacional, assegurando-se de que

  as mensagens são claramente entendidas e respondidas de forma adequada.

