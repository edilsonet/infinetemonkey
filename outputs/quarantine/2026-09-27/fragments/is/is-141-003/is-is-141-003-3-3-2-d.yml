  II - INSTRUÇÕES DE PREENCHIMENTO

  Esta ficha foi idealizada com base na Tabela de Competências que consta no Apêndice B desta
  IS, mas não

  se restringe a ela. A critério da Organização de Instrução, esta ficha pode ser adaptada
  para a inclusão de

  outras competências a serem avaliadas.

  Para preenche-la, o instrutor /avaliador deve ter conhecimento de todas as orientações contidas
  nesta IS,

  em especial as referentes ao curso prático de DOV, no Apêndice AB.

  No processo avaliativo das competências dos alunos do curso prático de DOV, a pontuação
  atribuída varia

  de 1 a 5, como segue:

  A atribuição do critério “Desempenho muito inadequado” (1) deve ser obrigatoriamente acompanhado
  da

  devida justificativa, após ser avaliada cada unidade de competência. Caso o espaço destinado
  para a

  justificativa seja insuficiente, o instrutor/avaliador poderá escrever a justificativa numa
  folha à parte,

  anexando-a a esta ficha.

  O aluno que obtiver os critérios “Desempenho muito inadequado” (1) e “Desempenho inadequado”
  (2),

  deverá repetir a tarefa tantas vezes quantas forem necessárias até que atinja, pelo menos,
  o “Desempenho

  satisfatório” (3).

  Do mesmo modo, o instrutor/avaliador deve preencher tantas fichas de avaliação quantas forem
  necessárias

  ao longo da parte prática do curso, a fim de manter os registros do progresso do aluno nos
  itens de avaliação,

  até que todos sejam executados por ele de forma satisfatória.

