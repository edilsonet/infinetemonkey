  AB4.7. Gerenciamento de Recursos de Despacho (Dispatch Resource Management -DRM)

  AB4.7.1. É sabido que o controle operacional inadequado e a tomada de decisão colaborativa

  inadequada são fatores contribuintes em acidentes aéreos. Um gerenciamento eficaz dos

  recursos disponíveis por DOV contribui significativamente para a segurança de voo. Ao

  exercer o controle operacional, o DOV estabelece coordenação com tripulantes de voo,

  controladores de tráfego aéreo (ATC), e outros membros de uma vasta equipe de forma a

  satisfazer as exigências operacionais diárias.

  AB4.7.2. O instrutor deve incentivar o futuro DOV a conhecer as funções dos outros participantes

  em todo o ambiente de operação. Dois benefícios esperados para o DOV são: (1) melhor

  gerenciamento de informações que afetem a segurança das operações de voo; e (2) uma

  interface mais eficaz com cada piloto em comando, de acordo com a exigência de

  responsabilidade conjunta especificada no RBAC 121.

  AB4.7.3. Portanto, as competências em DRM devem também ser desenvolvidas durante as tarefas

  propostas pelo instrutor a seus alunos.

  AB4.8. Tomada de decisões (Aeronautical Decision Making - ADM) e gerenciamento do

  risco

  AB4.8.1. Durante as atividades práticas, o instrutor deve avaliar a capacidade do aluno
  em tomar

  decisões as mais acertadas possíveis, avaliando os riscos. Para tanto, o instrutor deve

  desenvolver cenários que incorporem quantas tarefas forem necessárias para avaliar

  habilidades de gerenciamento de risco decorrentes de tomada de decisões aeronáuticas

  seguras. Por exemplo, o instrutor pode desenvolver um cenário que incorpore as decisões

  relativas à interação entre as informações meteorológicas e o planejamento de um voo.

  AB4.8.2. A capacidade do aluno em utilizar todos os recursos disponíveis para fazer uma
  análise

  de risco, a fim de determinar o curso de ação mais seguro, é essencial para um

  desempenho satisfatório. Os cenários devem ser realistas e dentro das capacidades

  operacionais das aeronaves e das empresas reais ou fictícias utilizadas para a realização

  das atividades práticas.

