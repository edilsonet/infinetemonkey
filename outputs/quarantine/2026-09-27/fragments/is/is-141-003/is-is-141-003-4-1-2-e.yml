text: '(e) RBAC 135 - Requisitos operacionais: operações complementares e por demanda.Data
  de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  V2. Pré-requisitos

  Este componente curricular deve ser desenvolvido após concluído o Módulo 1 do curso

  de DOV.

  V3. Objetivo instrucional

  Condição Dispondo dos Regulamentos Brasileiros de Aviação Civil que tratam das

  exigências regulatórias a serem cumpridas por um operador envolvido no

  transporte aéreo comercial e outros documentos regulamentares significativos

  para o DOV, incluindo conceitos de controle operacional que ilustram a

  aplicação dos requisitos regulamentares para o trabalho do DOV,

  Desempenho

  esperado

  O aluno deve ser capaz de identificar o papel dos organismos internacionais e

  nacionais reguladores da aviação, identificar a importância da regulamentação

  aplicável à operação de aeronaves e aplicar regulamentos relativos à operação

  da aeronave nas áreas que se enquadram nos deveres e responsabilidades do

  DOV,

  Padrão de

  desempenho

  A legislação e os regulamentos aplicáveis ao caso descrito devem ser

  completamente identificados e as suas disposições e aplicações práticas

  compreendidas e implementadas, conforme necessário.

  V4. Orientações didáticas

  Cabe ao instrutor apresentar aos alunos os regulamentos de forma a familiarizá-los com

  a consulta constante às normas publicadas pela ANAC, que nortearão o trabalho como

  DOV no ambiente operacional. É desejável que os alunos dominem os conceitos

  fundamentais, podendo participar da construção de um glossário de termos operacionais

  que servirá para consulta e auxílio na aprendizagem.

  Não se pretende que os alunos memorizem os conteúdos de todos os RBAC, mas que

  saibam a aplicabilidade de cada subparte e se habituem a consultá-los e a localizar com

  facilidade os requisitos aplicáveis à atividade do DOV. O incentivo do instrutor ao

  acompanhamento das constantes atualizações (emendas) dos regulamentos por parte dos

  alunos contribuirá para o desenvolvimento da doutrina da segurança, baseada no

  conhecimento e no respeito a regras, normas e regulamentos. A consulta constante ao

  portal da ANAC na internet garantirá o acesso às emendas vigentes dos regulamentos.

  V5. Ementa

  Este componente curricular está dividido em seis Unidades Didáticas, conforme abaixo:Data
  de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A'
