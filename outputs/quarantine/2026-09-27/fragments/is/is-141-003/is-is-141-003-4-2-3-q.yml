text: '(q) Unidade 17 - Aspectos fundamentais relativos a informações meteorológicas

  K6. Plano das unidades e subunidades didáticas

  Componente Curricular: METEOROLOGIA

  Módulo 1 Carga Horária: 54 h-a

  Unidades Didáticas

  1 Introdução à meteorologia aeronáutica

  Objetivos Específicos Subunidades

  1.1

  • Definir Meteorologia.

  • Citar a finalidade da Meteorologia.

  • Definir Meteorologia Aeronáutica.

  • Explicar a importância da Meteorologia Aeronáutica para a

  aviação, com relação à segurança e à economia.

  1.2

  • Citar as finalidades da Organização Mundial de Meteorologia

  (OMM).

  • Identificar o papel da Organização Mundial de Meteorologia

  (OMM) no levantamento de dados sobre meteorologia.

  • Identificar o papel da OACI na elaboração dos padrões

  internacionais relativos à meteorologia aeronáutica.

  • Identificar a responsabilidade dos Estados contratantes quanto

  à divulgação das informações meteorológicas.

  • Identificar a responsabilidade dos operadores aéreos quanto à

  obtenção e divulgação das informações aeronáuticas.

  1.3

  • Citar a finalidade da Rede de Centros e Estações

  Meteorológicas.

  • Identificar a estrutura da Rede de Centros e Estações

  Meteorológicas.

  • Citar as finalidades dos centros meteorológicos de aeródromos

  (CMA) e dos centros meteorológicos de vigilância (CMV).

  • Citar as finalidades das estações meteorológicas de superfície

  (EMS) e das estações meteorológicas de altitude (EMA).

  • Identificar a atuação, em Meteorologia Aeronáutica, do

  Instituto Nacional de Meteorologia (INMET), da Diretoria de

  Hidrografia e Navegação (DHN) da Marinha do Brasil, do

  Departamento de Controle do Espaço Aéreo (DECEA) do

  Comando da Aeronáutica.

  1.1 Conceitos básicos'
