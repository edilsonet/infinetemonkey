text: '(b) Unidade 2 - O sistema de aviação civil brasileiroData de emissão: 22 de dezembro
  de 2017. IS nº 141-003

  Revisão A

  H6. Plano das unidades e subunidades didáticas

  Componente Curricular: SISTEMA DE AVIAÇÃO CIVIL

  Módulo 1 Carga Horária: 9 h-a

  Unidades Didáticas

  1 A aviação civil internacional

  Objetivos Específicos Subunidades

  1.1

  • Caracterizar a Aviação Civil Internacional.

  1.2

  • Explicar a situação política mundial no final da Segunda Guerra

  Mundial e sua influência sobre a criação da Organização da

  Aviação Civil Internacional.

  • Reconhecer a OACI como a organização encarregada de

  padronizar a Aviação Civil Internacional através de normas e

  recomendações.

  • Descrever e explicar a estrutura e os objetivos da OACI.

  • Explicar a necessidade de estruturas regionais.

  • Justificar a necessidade de acordos internacionais (Convenções)

  e a existência de uma organização internacional (OACI) para

  supervisionar o desenvolvimento e a implementação de padrões

  internacionais para a aviação civil (Anexos à Convenção).

  • Reconhecer os órgãos internacionais quanto às suas finalidades

  e atribuições.

  1.3

  • Caracterizar o transporte aéreo.

  • Identificar temas concernentes ao transporte aéreo internacional

  tratados pela Convenção de Chicago.

  • Identificar responsabilidades pela aeronavegabilidade e

  manutenção de aeronaves sob o ponto de vista do DOV.

  • Identificar os requisitos básicos para uma autorização para

  operar um serviço de transporte aéreo comercial.

  • Citar razões para a criação de 18 Anexos à Convenção.

  • Fazer um breve resumo do conteúdo e da área de aplicação dos

  seguintes documentos: Normas e práticas recomendadas; Docs,

  SARP, PANS.

  • Identificar documentos e publicações produzidos pela OACI

  relacionados às responsabilidades do DOV.

  • Definir termos comuns à operação do transporte aéreo.

  • Identificar os termos técnicos relevantes para a operação aérea,

  aplicando-os no contexto apropriado.

  • Aplicar corretamente o alfabeto fonético nas comunicações

  relacionadas à aviação.

  1.4

  • Identificar as obrigações e os direitos do Brasil como Estado

  membro da OACI.

  1.5

  • Caracterizar as empresas de transporte aéreo quanto à finalidade.

  • Identificar questões relativas ao transporte aéreo internacional

  tratados pela Convenção de Chicago.

  1.6

  1.1 Caracterização. Abrangência

  1.2 Organização de Aviação Civil Internacional - OACI'
