text: '(d) Unidade 4 - Falhas nas comunicações e comunicações de emergência

  Z6. Plano das unidades e subunidades didáticas

  Componente Curricular: COMUNICAÇÕES AERONÁUTICAS

  Módulo 2 Carga Horária: 12 h-a

  Unidades Didáticas

  1 Teoria elementar das ondas de rádio

  Objetivos Específicos Subunidades

  1.1

  • Explicar o significado dos termos relacionados a ondas,

  ondas sonoras e ondas eletromagnéticas.

  1.2

  • Descrever a propagação, a reflexão e a absorção de ondas na

  ionosfera terrestre.

  • Reconhecer os diferentes espectros de frequência das ondas

  de rádio.

  1.1 Conceitos básicos'
