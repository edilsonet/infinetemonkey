text: '(h) Unidade 8 -- Limites de velocidades por vibração (buffet)

  6. Plano das unidades e subunidades didáticas

  Componente Curricular: PESO E PERFORMANCEData de emissão: 22 de dezembro de 2017. IS nº
  141-003

  Revisão A

  Módulo 1 Carga Horária: 42 h-a

  Unidades Didáticas

  1 Considerações sobre peso, performance e segurança de voo

  Objetivos Específicos Subunidades

  1.1

  • Identificar os principais aspectos a serem considerados na

  certificação de aeronaves.

  1.2

  • Descrever os principais pontos da regulação internacional

  relativa à performance das aeronaves.

  • Citar os documentos que compõem a regulamentação

  brasileira aplicável à performance e sua finalidade.

  1.3

  • Descrever as situações extremas para as quais a aeronave

  pode ser certificada.

  • Descrever os fatores adicionais às limitações estruturais de

  performance: capacidade de pressurização, limitações dos

  sistemas da aeronave, uso da carta do envelope do ambiente

  operacional da aeronave, no manual de voo.

  1.4

  • Apontar os fatores que influenciam na performance.

  • Explicar a influência que cada um desses fatores exerce

  sobre o desempenho da aeronave.

  1.5

  • Citar as responsabilidades do DOV no que se refere à

  performance da aeronave e à segurança de voo.

  1.1 Considerações sobre certificação de aeronaves

  - resistência estrutural da aeronave

  - cargas às quais uma aeronave será submetida

  - limitações de velocidade

  - ambiente operacional

  - capacidade de desempenho

  - comprimento de pista

  - elevação da pista

  - terreno sobre o qual a aeronave irá operar

  1.2 Regulamentação relativa a performance'
