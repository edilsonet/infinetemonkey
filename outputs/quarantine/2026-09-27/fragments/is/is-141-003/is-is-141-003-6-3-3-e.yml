title: 6.3.3(e)
text: '(e) Unidade 5 - Sistemas de medidas

  E6. Plano de unidades e subunidades didáticas

  Componente Curricular: FUNDAMENTOS DE MATEMÁTICA

  Módulo 1 Carga Horária: 12 h-a

  Unidades Didáticas

  1 Conjuntos numéricos

  Objetivos específicos Subunidades

  1.1

  • Identificar o conjunto dos números naturais.

  • Efetuar operações fundamentais no conjunto N

  • Efetuar operações com potências e raiz quadrada.

  • Identificar e aplicar as propriedades da adição e da

  multiplicação no conjunto N.

  • Resolver situações-problema envolvendo números do

  conjunto N.

  1.2

  • Identificar o conjunto dos números racionais - conjunto Q.

  • Reconhecer os conjuntos Q+ e Q- como subconjuntos do

  conjunto Q.

  • Determinar o valor absoluto ou módulo e o oposto ou simétrico

  de um número racional.

  • Reconhecer frações como uma relação parte-todo.

  • Identificar os diferentes tipos de fração.

  • Estabelecer a equivalência entre frações.

  • Reduzir frações ao mesmo denominador pelo m.m.c. ou pela

  aplicação do conceito de equivalência.

  • Reconhecer frações escritas sob a forma decimal.

  • Efetuar operações envolvendo números racionais positivos e

  negativos.

  • Calcular média aritmética e média ponderada.

  • Resolver situações-problema envolvendo frações, números

  decimais, média aritmética e média ponderada.

  1.3

  • Identificar o conjunto dos números inteiros.

  • Estabelecer a relação de inclusão de N em Z.

  • Identificar números positivos e números negativos.

  • Efetuar operações com números inteiros positivos e negativos.

  • Resolver situações-problema envolvendo operações no

  conjunto Z.

  1.1 Números naturais: operações no conjunto N'
