title: 8.2.1(d)
text: '(d) Unidade 4 - Sistema de Gerenciamento de Segurança Operacional - SGSO

  J5. Orientações didáticas

  A apresentação dos assuntos deve ser feita não só através de aulas expositivas, mas

  também por meio de trabalhos de grupo, nos quais os alunos possam analisar, debater,

  relacionar causas e efeitos, comparar acidentes e, principalmente, consolidar atitudes

  compatíveis com os objetivos da prevenção.

  A projeção de filmes, a utilização de relatórios de investigação de acidentes e incidentes

  e de notícias veiculadas pela imprensa são recursos auxiliares que atendem, de forma

  eficaz, aos objetivos propostos.

  J6. Plano das unidades e subunidades didáticas

  Componente Curricular: SEGURANÇA DE VOO

  Módulo 1 Carga Horária: 36 h-a

  Unidades Didáticas

  1 Princípios básicos da segurança de voo

  Objetivos Específicos Subunidades

  1.1

  • Definir segurança de voo.

  • Conceituar acidente aeronáutico, incidente aeronáutico e

  ocorrência de solo.

  • Distinguir entre acidente aeronáutico, incidente aeronáutico e

  ocorrência de solo.

  • Citar exemplos de acidente aeronáutico, incidente aeronáutico e

  ocorrência de solo

  • Caracterizar os aspectos legais relativos a acidentes

  aeronáuticos, incidentes aeronáuticos e ocorrências de solo.

  • Descrever os fatores influentes nos acidentes, incidentes e

  ocorrências de solo: humanos, materiais e operacionais.

  • Reconhecer a finalidade do controle estatístico e da avaliação

  dos acidentes.

  1.2

  • Identificar as principais normas e recomendações do Anexo 13

  da OACI.

  • Citar as responsabilidades dos Estados contratantes quanto à

  segurança de voo.

  • Justificar a finalidade das recomendações dos relatórios de

  acidentes aeronáuticos.

  1.3

  • Identificar os princípios básicos da manutenção de aeronaves na

  prevenção de acidentes/incidentes aeronáuticos.

  • Conceituar manutenção preventiva e manutenção corretiva.

  1.1 Noções gerais'
