title: 8.2.1(f)
text: '(f) NSCA 3-13 - Protocolos de Investigação de Ocorrências Aeronáuticas da Aviação

  Civil conduzidas pelo Estado Brasileiro

  J2. Pré-requisitos - N/A

  J3. Objetivos instrucionais

  Condição O aluno deve ter acesso a cópias de documentos, diretrizes aeroportuárias e

  anexos da OACI e documentos nacionais relevantes para a segurança de voo. Ele

  também deve ser familiarizado com sistemas de segurança utilizados para os

  voos nacionais e internacionais.

  Desempenho

  esperado

  O aluno deverá ser capaz de identificar um problema de segurança e saber a quem

  contactar e onde obter informações e instruções sem demora.

  Padrão de

  desempenho

  O aluno deverá demonstrar compreensão adequada dos procedimentos de

  segurança em voos nacionais e internacionais, de modo que ele reaja de uma

  maneira eficiente e lógica a situações que envolvam questões de segurança de

  voo.

  J4. Ementa'
