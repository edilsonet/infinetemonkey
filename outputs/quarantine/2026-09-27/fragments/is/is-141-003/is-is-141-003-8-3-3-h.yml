text: '(h) Unidade 8 - Planejamento de voo por navegação estimada

  N6. Plano das unidades e subunidades didáticas

  Componente Curricular: NAVEGAÇÃO I: VISUAL E ESTIMADA

  Módulo 1 Carga Horária: 42 h-a

  Unidades Didáticas

  1 A Terra e a navegação aérea

  Objetivos Específicos Subunidades

  1.1

  • Definir navegação e navegação aérea.

  • Citar as principais características da navegação visual ou por

  contato, da navegação estimada, da radionavegação, da

  navegação eletrônica e da navegação por satélite.

  • Listar os principais elementos a serem determinados com

  vista ao deslocamento sobre a superfície da Terra.

  1.1 Navegação e navegação aérea'
