text: 'APÊNDICE G - MÓDULO 1 -- INGLÊS BÁSICOData de emissão: 22 de dezembro de 2017. IS nº
  141-003

  Revisão A

  G1. Introdução

  A profissão de Despachante Operacional de Voo (DOV) é uma das mais completas,

  complexas e importantes profissões da aviação civil. A formação do DOV engloba

  inúmeros componentes curriculares, muitos deles coincidentes com a formação de pilotos

  comerciais e de linha aérea. Portanto, ao se contemplar o componente curricular INGLÊS

  BÁSICO na formação do DOV garante-se a este profissional multifacetado a aquisição

  de conhecimentos linguísticos no idioma estrangeiro necessários ao melhor desempenho

  de suas atividades.

  Os textos em língua inglesa utilizados pelo DOV em suas atividades diárias englobam

  grande diversidade de tipos textuais, exigindo de tais profissionais conhecimentos -

  básicos ou aprofundados, dependendo da atividade desempenhada - sobre o inglês para

  aviação, o inglês utilizado em comunicações radiotelefônicas e a fraseologia padrão

  OACI (Organização de Aviação Civil Internacional).

  Este componente curricular não propõe a aquisição de conhecimentos avançados e

  sofisticados da língua inglesa, mas objetiva que os alunos desenvolvam a iniciativa e a

  segurança para aplicar e adaptar seus conhecimentos a diferentes contextos, usando-os

  adequadamente e no momento oportuno.

  Para garantir ao DOV a formação adequada no que tange à exposição inicial ao idioma

  inglês, foi elaborado o componente curricular INGLÊS BÁSICO, que será seguido pelo

  INGLÊS TÉCNICO na continuidade dos estudos deste curso.

  G2. Pré-requisitos - Não há

  G3. Objetivos instrucionais

  Condições Com base nos materiais de referência utilizados para o estudo de inglês

  aeronáutico,

  Desempenho

  esperado

  o aluno deverá:

  • reconhecer e utilizar as siglas em inglês mais comumente utilizadas na aviação

  e o vocabulário básico relativo a aeródromos, emergências da aviação,

  segurança operacional, procedimentos operacionais básicos e circuito de

  tráfego aéreo;

  • ler e reconhecer as principais informações veiculadas em textos gerais sobre

  a aviação civil e em textos básicos sobre aeronaves;

  • ler, reconhecer e extrair informações a partir de gráficos, tabelas e diagramas

  em língua inglesa, em especial aqueles constantes dos manuais tipicamente

  utilizados pelo DOV;Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • identificar e utilizar fraseologia básica padrão OACI, informações referentes

  a níveis de voo, horários, velocidades, rumo e proa, altímetro, pista em uso,

  transponder, direção do vento, NOTAM, SNOWTAM e ASHTAM e fixos de

  aproximação;

  • expressar-se oralmente, utilizando o alfabeto fonético da OACI, vocabulário

  contextualizado relativo a informações essenciais para o voo e relativo a

  comunicações essenciais no solo e em voo; e

  • produzir, com base nas regras de coesão e coerência, pequenos textos para

  comunicação simples, sobre manuais de aeronaves e relativos aos voos,

  aeronaves e aeródromos.

  Padrão de

  desempenho

  O vocabulário básico e os termos técnicos da aviação civil, em especial

  vocabulário característico das atividades diárias do DOV deverão ser

  compreendidos e empregados pelo aluno, em situações de produção oral e

  escrita.

  G4. Orientações didáticas

  Para alcançar os objetivos propostos, são pertinentes técnicas de instrução centradas no

  contexto. O estímulo à produção centrada nos alunos é sempre preferível à pura exposição

  oral do instrutor. Neste sentido, considera-se apropriada a abordagem comunicativa no

  ensino de idiomas, com destaque para as figuras do emissor e receptor, por focar em

  atividades que requerem o uso efetivo da língua, adequadas para o ensino do conteúdo

  deste componente curricular.

