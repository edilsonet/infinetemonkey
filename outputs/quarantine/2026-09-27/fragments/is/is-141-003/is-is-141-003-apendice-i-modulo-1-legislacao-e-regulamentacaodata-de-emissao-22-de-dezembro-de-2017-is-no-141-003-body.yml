text: 'APÊNDICE I - MÓDULO 1 -- LEGISLAÇÃO E REGULAMENTAÇÃOData de emissão: 22 de dezembro
  de 2017. IS nº 141-003

  Revisão A

  I1. Introdução

  A operação de aeronaves é regida pelo Direito Aeronáutico, ou seja, uma série de

  convenções, regulamentos, legislação, acordos etc., que foram promulgadas desde os

  primórdios da aviação comercial para garantir que os voos sejam operados de forma

  segura e ordenada. Segurança e regularidade nas operações de transporte aéreo requerem

  que todos os Estados aceitem e implementem um padrão comum de operação das

  aeronaves em relação ao treinamento, licenciamento, certificação etc., para as operações

  internacionais. A padronização de práticas operacionais para os serviços internacionais
  é

  de fundamental importância para evitar erros e prejuízos que podem ser causados por

  mal-entendido ou inexperiência.

  A regulamentação internacional e nacional é promulgada para garantir a segurança,

  regularidade e eficiência da operação das aeronaves. No cenário internacional, a OACI,

  nos termos do disposto no artigo 37 da Convenção sobre Aviação Civil Internacional,

  desenvolve e adota normas e práticas recomendadas (Anexos à Convenção) como o

  requisito mínimo para a operação das aeronaves. As regulamentações nacionais são

  desenvolvidas com base nessas normas e práticas recomendadas, com algumas variações

  que atendam às necessidades específicas de cada Estado. Estados Contratantes podem

  aprovar uma legislação que pode diferir significativamente daquela promulgada em

  outros Estados. No entanto, operações internacionais de aeronaves compartilham muitos

  regulamentos, leis e estatutos.

  Este componente curricular oferece aos alunos uma visão panorâmica dos órgãos com

  responsabilidades normativas no âmbito da Aviação Civil, apresenta uma visão geral

  sobre o Direito Aeronáutico, tal como adotado pela OACI e praticado em operações de

  aeronaves internacionais, como também enfatiza as disposições da Lei nº 7565, de

  19/12/1986 - Código Brasileiro de Aeronáutica - e dos Regulamentos Brasileiros de

  Aviação Civil pertinentes à atividade do DOV. Além desta visão panorâmica, pretende-

  se situar os direitos e deveres do DOV e informar quanto às implicações jurídicas que

  envolvem sua atividade.

  I2. Pré-requisitos

  Este componente curricular deverá ser desenvolvido imediatamente após “Sistema de

  Aviação Civil”, o qual, tratando do contexto da Aviação Civil sob o enfoque

  organizacional, constitui etapa fundamental para a abordagem dos aspectos jurídicos.

  I3. Objetivos instrucionaisData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  Condição Contando com uma descrição geral dos requisitos regulamentares a serem

  cumpridos por um operador envolvido no transporte aéreo comercial e

  delineando documentos regulamentares significativos para o DOV, incluindo

  conceitos de controle operacional que ilustram a aplicação de requisitos

  regulamentares para o trabalho do DOV,

  Desempenho

  esperado

  o aluno deverá ser capaz de identificar o papel dos organismos internacionais e

  nacionais reguladores da aviação, identificar a importância da regulamentação

  aplicável à operação de aeronaves e aplicar regulamentos relativos à operação da

  aeronave nas áreas que se enquadram os deveres e responsabilidades do DOV.

  Padrão de

  desempenho

  Os regulamentos e a legislação aplicável ao sistema de aviação civil devem ser

  completamente identificados e as suas disposições e aplicações práticas

  compreendidas e implementadas, conforme necessário.

  I4. Orientações didáticas

  É importante que o instrutor estimule os alunos a localizarem, na regulamentação da

  OACI e no Código Brasileiro de Aeronáutica (CBA), aspectos legais relacionados à

  atividade do DOV, bem como a interpretarem e discutirem esses aspectos, o que não

  somente contribuirão para a compreensão dos assuntos tratados e a fixação da

  aprendizagem, mas, também, facilitarão consultas posteriores aos documentos legais.

  Sobre essa lei, cabe observar ainda que o instrutor deverá capacitar os alunos a

  interpretarem seu conteúdo à luz das alterações introduzidas no Sistema de Aviação Civil

  desde a criação da ANAC.

  Também com vista à eficácia da aprendizagem neste componente curricular, será de

  extrema utilidade que a exposição oral dialogada seja intercalada com estudos de casos,

  baseados em situações que possam ocorrer com o DOV, bem como com o trabalho em

  grupo e o debate.

  Entre os recursos auxiliares da instrução, encontram-se o próprio CBA, cujo exemplar

  deverá ser disponibilizado para cada aluno, além de apresentações de slides e construção

  de organogramas.

  I5. Ementa

  O conteúdo programático deste componente curricular está subdividido em oito Unidades

