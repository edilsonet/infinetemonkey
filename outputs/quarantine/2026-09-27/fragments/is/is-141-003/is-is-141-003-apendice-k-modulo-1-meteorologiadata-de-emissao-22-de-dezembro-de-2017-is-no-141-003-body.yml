text: 'APÊNDICE K - MÓDULO 1 -- METEOROLOGIAData de emissão: 22 de dezembro de 2017. IS nº
  141-003

  Revisão A

  K1. Introdução

  A aviação é extremamente sensível às condições meteorológicas, que podem variar de

  favoráveis a severas. Um aeroporto, seja internacional ou um pequeno aeródromo, pode

  ser igualmente afetado por condições meteorológicas. Uma combinação de ventos de

  baixa velocidade com condições de pista molhada pode resultar no fechamento de um

  aeroporto, enquanto as condições de má visibilidade podem causar grandes perturbações

  para os horários dos voos.

  É muito importante, portanto, que o DOV tenha conhecimentos e habilidades suficientes

  para interpretar informações meteorológicas, relatórios, previsões e avisos de forma

  correta e eficiente. Ele deve ser capaz de usar essas informações ao preparar ou alterar
  o

  planejamento do voo, e, durante o voo quando importantes dados meteorológicos devem

  ser rapidamente interpretados e informados à tripulação.

  O seguinte programa descreve os conhecimentos e habilidades mínimos necessários para

  o DOV realizar seu trabalho de forma eficiente e produtiva. Ressalta-se que este curso é

  projetado para permitir que o aluno compreenda os fenômenos meteorológicos e faça

  deduções inteligentes a partir das informações disponíveis. O DOV não é responsável por

  fazer quaisquer observações ou previsões de tempo.

  K2. Pré-requisitos

  O conteúdo programático deste componente curricular será melhor compreendido pelos

  alunos se for desenvolvido após concluídos os programas de Fundamentos de Física.

  K3. Objetivos instrucionais

  Condições Cada aluno deve ter acesso a toda documentação relevante, exemplos de

  relatórios e previsões reais, e cópias de todas as cartas e publicações atualmente

  em uso e relevantes para as operações de voo.

  Desempenho

  esperado

  Além de demonstrar conhecimentos teóricos, o aluno também deve ser capaz de

  demonstrar a aplicação prática em todas as oportunidades, utilizando

  informações atualizadas para resolver situações e / ou problemas simulados ou

  reais da aviação.

  Padrão de

  desempenho

  O aluno deve efetivamente demonstrar conhecimentos e habilidades necessárias

  à compreensão dos princípios físicos básicos de meteorologia, das informações

  meteorológicas, bem como a sua interpretação, disseminação e utilização. O

  aluno deve ter um amplo entendimento da circulação geral e do clima mundial,

  e uma base de conhecimentos completa para entender as condições

  meteorológicas em locais específicos e ao longo das rotas específicas.Data de emissão: 22
  de dezembro de 2017. IS nº 141-003

  Revisão A

  K4. Orientações didáticas

  A fim de garantir que o aluno compreenda plenamente o papel que os serviços de

  meteorologia exercem na elaboração, codificação e divulgação de dados meteorológicos,

  é fortemente recomendado que ele seja levado em uma visita guiada um centro

  meteorológico de aeródromo mais próximo, onde perguntas e discussões devem ser

  incentivadas.

  K5. Ementa

  O conteúdo programático deste componente curricular está subdividido em dezessete

