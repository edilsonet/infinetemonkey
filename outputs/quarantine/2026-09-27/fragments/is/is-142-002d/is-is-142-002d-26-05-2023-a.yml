text: '(a) adopt means and procedures previously specified in IS; or

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.


  b) present duly justified alternative means or procedures, requiring, in this case, assessment
  and explicit agreement from ANAC´s competent body.

  3.3 O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.


  3.3 Alternative means or procedure mentioned in subitem 3.2(b) shall ensure the same or
  greater safety level when compared to the safety level established by the applicable requirement
  or shall accomplish the procedure’s goal normalized by Supplementary Instructions.

  3.4 A IS não pode criar requisitos ou contrariar requisitos estabelecidos em RBAC, RBHA
  ou outro ato normativo.


  3.4 Supplementary Instruction (IS) shall not create requirements or contravene those established
  in RBAC, RBHA or other normative acts.

  4. DEFINIÇÕES


  4. DEFINITIONS

  Para os efeitos desta IS, são válidas as definições listadas no RBAC nº 142 e as seguintes
  definições:


  For the purposes of this IS the definitions listed in RBAC 142 are valid as well as those
  listed below:'
