text: '26.05.2023


  PREÂMBULO


  PREAMBLE

  Esta IS é publicada em língua portuguesa e em língua inglesa, formatado em duas colunas,
  a da esquerda em português e a da direita em inglês, sendo o texto português o texto oficial.


  This Supplementary Instruction (IS) is published in Portuguese and in English, formatted
  in two columns, on the left is the Portuguese text and on the right is the English version.
  The Portuguese text is the official text.


  1. OBJETIVO


  1. OBJECTIVE

  Descrever o procedimento aceitável pela ANAC para a validação de centros de treinamento
  de aviação civil, localizados no exterior, certificados por autoridade de aviação civil
  estrangeira (CTAC estrangeiro), nos termos do RBAC nº 142.


  Describe the acceptable procedure by ANAC for validation of civil aviation training centers,
  located abroad, certified by foreign civil aviation authority (foreign CTAC) under the terms
  of RBAC No. 142.

  2. REVOGAÇÃO


  2. REVOCATION

  A presente Instrução Suplementar revoga a IS nº 142-002, Revisão C.


  This Supplementary Instruction (IS) revokes IS No 142-002, Revision C.

  3. FUNDAMENTOS


  3. LEGAL GROUNDS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou
  RBHA.


  3.1 The Resolution n. 30, issued on May 21st, 2008, establishes in its article 14, the Supplementary
  Instruction - IS, which is a general supplementary rule issued by the Superintendent of
  the competent department with the aim of clarify, detail or guide the application of the
  standards provided in RBAC or RBHA.

