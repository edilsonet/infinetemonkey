text: '01.11.2024

  OBJETIVO

  1.1 Fornecer procedimentos e orientações àqueles que desejam certificar, junto à ANAC, uma
  organização de manutenção de produto aeronáutico localizada em território nacional, para
  prestar serviços de manutenção, manutenção preventiva e alterações, de acordo com os requisitos
  do RBAC nº 145.

  REVOGAÇÃO

  2.1 Esta IS revoga a IS nº 145-001 revisão G.

  Fundamentos

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14 a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 O Regulamento Brasileiro da Aviação Civil (RBAC) nº 145 contém os requisitos para a
  obtenção de um certificado de organização de manutenção de produto aeronáutico.

  Definições

  4.1 Para os efeitos desta IS, são válidas as definições listadas no RBAC nº 01, RBAC n°
  43, RBAC n° 145 e as seguintes definições:

  4.1.1 Autoinclusão: é um processo em que a organização de manutenção - OM, previamente autorizada
  pela ANAC em suas Especificações Operativas, realiza uma autoavaliação de sua capacidade
  frente aos requisitos regulamentares presentes no RBAC nº 145 para executar serviços de
  manutenção em determinado artigo sem a necessidade de análise e aprovação prévia por parte
  da ANAC.

  4.1.2 Certificado de organização de manutenção - COM: documento emitido com base no art.
  70 da Lei nº 7.565, de 19 de dezembro de 1986 (Código Brasileiro de Aeronáutica - CBAer)
  e no parágrafo 145.53(a) do RBAC nº 145, que concede à OM a prerrogativa legal para prestar
  serviços de manutenção, manutenção preventiva e alterações em produtos aeronáuticos.

  4.1.3 Declaração de conformidade: lista que vincula todos os requisitos dos RBAC nº 43,
  RBAC nº 145 e RBAC nº 120 (este, quando aplicável) e disposições das IS aplicáveis, em cada
  uma de suas seções, itens e parágrafos, a uma breve descrição de como a OM irá cumpri-los
  ou a uma referência específica da Seção/Item do Manual aplicável (Manual da Organização
  de Manutenção - MOM, Manual de Controle da Qualidade - MCQ, do Programa de Treinamento em
  Manutenção - PTM, Manual de Gerenciamento da Segurança Operacional - MGSO), onde consta
  tal informação. A lista deve ser assinada pelo(a) gestor(a) responsável da OM. A preparação
  da declaração de conformidade beneficia o solicitante por assegurar que todos os requisitos
  aplicáveis foram apropriadamente tratados durante e após o processo de certificação (ver
  Formulário F-143-40). Este documento deve ser mantido atualizado pela OM.

  4.1.4 Especificações Operativas - EO: documento vinculado ao certificado de organização
  de manutenção de produto aeronáutico, contendo os tipos e as limitações dos serviços que
  a organização de manutenção está autorizada a executar. Uma EO especifica, portanto, os
  artigos (produtos aeronáuticos) nos quais o detentor do certificado está autorizado a realizar
  serviços de manutenção, manutenção preventiva e alterações, bem como apresenta as limitações
  desses serviços, conforme aplicável. Uma EO pode conter, ainda, autorizações adicionais
  emitidas em favor da OM.

  4.1.5 Lista de Capacidade - LC: documento da organização de manutenção que, em adição às
  Especificações Operativas, relaciona os artigos em que a OM pode executar manutenção, manutenção
  preventiva ou alterações.'
