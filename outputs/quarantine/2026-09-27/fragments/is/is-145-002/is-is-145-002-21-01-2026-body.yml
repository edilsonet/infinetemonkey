  A.1 ACRONYMS.

  SUBJECT

  This Supplementary Instruction (IS) provides guidance and detailed procedures for foreign
  approved maintenance organizations (AMO) to obtain and maintain an Anac certification under
  the Brazilian RBAC No. 145.

  REVOCATION

  This IS revokes IS No. 145-002, Revision B.

  LEGAL BASIS

  The Anac Resolution No. 30, of May 21st, 2008, establishes in its article 14 the supplementary
  instruction - IS, a guidance material issued by the head of the competent department, aiming
  to clarify and detail the application of a requirement provided in RBAC.

  ​​​​​​​​​​​​​​The applicant/certificate holder who intends, for any purpose, to demonstrate
  compliance with a requirement set out in RBAC may:

  a) adopt the procedures specified in the IS; or

  b) present a duly justified alternative means of compliance, requiring, in this case, the
  analysis and express authorization of the Anac’s competent department.

  ​​​​​​​The alternative means of compliance mentioned in paragraph 3.2(b) of this IS must
  ensure the same or greater level of safety than that established by the applicable requirement
  or achieve the objectives standardized in IS.

  The IS cannot create new requirements or contradict requirements established in RBAC or
  another normative act.

  ​​​​​​​ In accordance with article 70 of law No. 7.565, of December 19th, 1986 (“Código
  Brasileiro de Aeronáutica” - CBAer), and paragraph 145.5(a) of RBAC No. 145, no person may
  operate as a certified maintenance organization without, or in violation of, a maintenance
  organization certificate and operations specifications issued by Anac, unless expressly
  authorized.

  ​​​​​​​ In accordance with article 8th, XVII, of law No. 11.182, of September 27th, 2005,
  Anac is the competent authority to carry out homologation and issue certificates, approvals
  and authorizations, related to activities under the jurisdiction of the Brazilian civil
  aviation flight safety system.

  ​​​​​​​ DEFINITIONS

  This IS uses definitions and concepts further established in the following Brazilian regulations:
  RBAC No. 01, RBAC No. 43 e RBAC No. 145.

  ​​​​​​​SUBJECT DEVELOPMENT

  5.1 Applicability

  The procedures described in this IS apply ONLY to AMO that meet the following criteria:

  a) be located outside of Brazilian territory; and

  b) be previously certified by its local civil aviation authority (foreign primary authority),
  with valid certificate; and

  c) AMO’s country of origin or its primary aviation authority CANNOT have a bilateral civil
  aviation agreement with Brazil on maintenance, limiting the certification of maintenance
  organizations only to the method established in that agreement.

  Note 1: general information regarding the applicability, scope of work and associated fees
  for Anac approved AMO located outside Brazil and not covered by a maintenance agreement
  are available at Ref. 01 of the table IS No. 145-002C - LINKS AND REFERENCES, found at the
  topic “Useful links” at following Anac website: https://www.gov.br/anac/en/topics/approved-maintenance-organization/useful-links.

  Note 2: for authorities and/or countries that HAVE a bilateral agreement in place with Brazil,
  the AMO must consult the specific procedures established in each agreement. The current
  bilateral agreement (BASA), maintenance annex guidance (MAG), memorandum of understanding
  (MoU), and technical arrangement (TA) can be found at Ref. 02 of the table IS No. 145-002C
  - LINKS AND REFERENCES, found at the topic “Useful links” at following Anac website: https://www.gov.br/anac/en/topics/approved-maintenance-organization/useful-links.

  5.2 Foreign maintenance organization certification

  5.2.1 Whereas foreign and domestic Anac AMO certification processes are the same in nature,
  foreign Anac AMO certification processes have some special characteristics which should
  be considered:

  a) geographic distance from Brazil which results in logistical issues for audits performed
  by Anac; and

  b) the existence of a local civil aviation authority (CAA) that acts as the primary certification
  authority. This CAA has conditions to provide continuous surveillance over the foreign AMO
  more effectively than Anac''s surveillance by any means.


  5.2.2 Considering these characteristics, special treatment is given to these AMO to make
  advantage of the available information and ongoing surveillance structures already in place,
  provided by the relationship with the primary CAA.'
