text: 'B1.3 Organização

  a) O MOM inclui um organograma que mostra, por título, cada gerente com autoridade para
  agir em nome da OM?

  b) Os títulos das posições são os mesmos através de todo MOM?

  c) O organograma mostra separação dos departamentos de manutenção e de inspeção (se aplicável)?'
