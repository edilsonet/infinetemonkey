title: Pessoal
text: 'B1.4 Pessoal

  a) O MOM descreve os deveres e responsabilidades, incluindo a área de responsabilidade designada,
  de cada posição administrativa?

  b) O texto descreve o que cada pessoa faz?

  c) Os procedimentos asseguram que seus deveres e responsabilidades são executados na ausência
  dessas pessoas?

  d) O MOM inclui procedimentos para manter e revisar as listas requeridas pela seção 145.161
  do RBAC nº 145?

  e) O MOM inclui procedimentos para manter o sumário histórico de trabalho de cada pessoa
  cujo nome está na lista?

  f) O sumário histórico de trabalho atende aos requisitos da seção 145.161 do RBAC nº 145?'
