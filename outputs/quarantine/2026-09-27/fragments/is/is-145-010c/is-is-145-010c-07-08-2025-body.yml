text: '07.08.2025

  OBJETIVO

  Esclarecer, detalhar e orientar a aplicação dos requisitos previstos no Regulamento Brasileiro
  da Aviação Civil - RBAC nº 145, aos detentores de certificado de organização de manutenção
  de produto aeronáutico - OM, descrevendo um meio aceitável, mas não único, para elaborar
  o programa de treinamento (PTM) para o pessoal de uma OM, tal como requerido pela seção
  145.163 do RBAC nº 145.


  REVOGAÇÃO

  Esta IS revoga a IS nº 145-010 Revisão B.


  FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14 a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da Anac.

  3.3 O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.

  3.5 A seção 145.163 do RBAC nº 145 estabelece os requisitos de treinamento para assegurar
  que cada pessoa designada para executar manutenção, manutenção preventiva ou alteração e
  funções de inspeção e de registro seja capaz de executar as tarefas a ela designadas; e
  a seção 145.165, os requisitos de treinamento em artigos perigosos para uma OM certificada.

  3.6 Conforme a seção 145.163, cada organização de manutenção certificada deve ter um programa
  de treinamento de pessoal, que consiste de treinamento inicial e recorrente.


  DEFINIÇÕES

