text: 'h) -I legislação aeronáutica brasileira aplicável.

  3.8 A seção 145.201 do RBAC 145 estabelece que a OM somente pode executar manutenção ou

  alteração em artigo para o qual é certificada se tiver a sua disposição os dados técnicos
  apli-

  cáveis;

  3.9 O parágrafo 145.205(a) estabelece requisitos para que uma OM que execute manutenção,

  manutenção preventiva ou alteração para um detentor de certificado segundo os RBAC 121

  ou 135 que tenha um programa de manutenção de aeronavegabilidade continuada segundo

  esses regulamentos, deve seguir o programa desse operador e as seções aplicáveis dos seus

  manuais; e

  3.10 O parágrafo 145.211(c)(1)(v) do RBAC 145 estabelece que o Manual de Controle da Quali-

  dade - MCQ da OM inclua uma descrição do sistema e procedimentos usados para estabe-

  lecer e manter atualizados os dados técnicos para a manutenção dos artigos.'
