  e) Aplicações

  (1) Detecção de descontinuidades;

  (2) Amostragem por condutividade;

  (3) Amostragem por permeabilidade;

  (4) Avaliação de espessura; e

  (5) Medição de características magnéticas.

  f) Blocos de Referência e Procedimentos Operacionais

  (1) Explicação sobre normas e especificações usadas no ensaio com correntes parasitas; e

  (2) Explicação sobre procedimentos de operação usados nos ensaio com correntes parasitas.

