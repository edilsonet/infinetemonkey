text: '(f) Desvantagens da magnetização longitudinal.

  e) Seleção do Método Apropriado de Magnetização

  (1) Liga, forma e condições da peça;

  (2) Tipos de corrente de magnetização;

  (3) Direção dos campos magnéticos;

  (4) Seqüência de operações; e

  (5) Valor de densidade de fluxo.

  f) Materiais de Inspeção

  (1) Partículas via úmida; e

  (2) Partículas via seca.

  g) princípios da Desmagnetização

  (1) Magnetismo residual;

  (2) Razão de requerer a desmagnetização;

  (3) Campo residual longitudinal e circular;

  (4) Princípios básicos da desmagnetização;

  (5) Retentividade e força coercitiva; e

  (6) Métodos de desmagnetização.

  h) Equipamentos para Ensaios por PM

  (1) Considerações para a seleção do equipamento:'
