text: 'h) Regulamentos Estaduais e Federais

  (1) A CNEN como autoridade

  (2) Concessão da licença;

  (3) * Requisitos para posse de materiais radioativos para uso na radiografia industrial;

  (4) Requisitos de qualificação para pessoal envolvido na radiografia industrial;

  (5) Requisitos de controle de exposição pessoal;

  (6) * Requisitos de transporte de fontes seladas; e

  (7) Requisitos para equipamentos de raios X.


  A3. CURSO BÁSICO DE FÍSICA DA RADIOGRÁFIA'
