text: 'j) Indicações do Teste por PM e a Interpretação

  (1) Indicações de inclusões não metálicas;

  (2) Indicações de junções superficiais;

  (3) Indicações de trincas;

  (4) Indicações de delaminações;

  (5) Indicações de dobras;

  (6) Indicações de bursts e flóculos;

  (7) Indicações de porosidades; e

  (8) Indicações não relevantes.'
