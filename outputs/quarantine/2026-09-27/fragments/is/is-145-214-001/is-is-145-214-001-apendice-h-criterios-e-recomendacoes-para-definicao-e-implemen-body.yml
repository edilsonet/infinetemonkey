text: 'APÊNDICE H -- CRITÉRIOS E RECOMENDAÇÕES PARA DEFINIÇÃO E IMPLEMEN-

  TAÇÃO DO PROCESSO DE GERENCIAMENTO DE MUDANÇAS

  Este Apêndice está dividido em duas partes de maneira que possam ser utilizadas em conjunto
  ou

  separadamente. No caso de organizações de grande ou médio porte ou de mudanças muito complexas,

  poderiam ser adotadas as Partes I e II. Para organizações de menor porte ou mudanças consideradas

  simples, pode ser usada somente a Parte II, que consiste apenas em uma consulta formal (com
  assi-

  natura dos responsáveis de uma das áreas), e que aponta para alguns pontos importantes a
  serem

  considerados em situação de mudanças. Entretanto, o objetivo deste Apêndice é somente fornecer

  opções, de forma que cada organização possa estruturar seu processo de gerenciamento de
  mudanças

  e compor seu próprio formulário, adotando os elementos que considerar adequados.

  Nota 01 - Existe uma estreita relação entre gerenciamento de mudança e gerenciamento de
  risco.

  Os riscos identificados no processo de gerenciamento de mudanças devem ser submetidos e
  analisa-

  dos sob a sistemática do processo de gerenciamento de risco.

  Nota 02 - Devem ser mantidos registros das análises, conclusões e aprovações dos processos
  de

  gerenciamento de mudanças.

  Nota 03 - A seguir são listadas diversas ferramentas de gestão e análises, cujos fundamentos
  e apli-

  cações estão disponíveis em literatura especializada. Portanto, não está incluído no escopo
  deste'
