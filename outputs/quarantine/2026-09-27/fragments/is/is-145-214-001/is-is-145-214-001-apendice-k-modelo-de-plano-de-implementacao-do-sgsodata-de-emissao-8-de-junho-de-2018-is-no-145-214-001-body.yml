text: 'APÊNDICE K - MODELO DE PLANO DE IMPLEMENTAÇÃO DO SGSOData de emissão: 8 de junho de
  2018. IS nº 145.214-001

  Revisão B

  Notas 01 - A entrega do plano de implementação não engloba a entrega dos processos mapeados
  ou

  documentados, apenas uma previsão de quando tais documentos estarão concluídos.

  Nota 02 - A sequência em que estão listadas as atividades, não são mandatórias, logo as
  datas infor-

  madas na coluna “DATA LIMITE” não precisam ser sequenciais.

  Nota 03 - Poderão ser incluídas alterações ou ajustes, e entregues juntamente com o DIAGNÓSTICO

  conforme subseção 5.4 da IS 145.214-001A.

  Nota 04 - As atividades referentes à fase de operacionalização devem descrever no mínimo
  os prazos

  de implementação listados na etapa anterior, de implantação / aceitação documental.

  Nota 05 - Caso não seja possível concluir a descrição do ambiente operacional até a entrega
  do plano

  de implementação, é necessário apontar a previsão de entrega da mesma juntamente com o gap

  analysis de maneira consistente com os prazos apontados na subseção 5.4 e no Apêndice J
  da IS

  145.214-001A.Data de emissão: 8 de junho de 2018. IS nº 145.214-001

  Revisão B'
