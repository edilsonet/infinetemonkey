text: '17.07.2026

  OBJETIVO

  1.1 Esta Instrução Suplementar - IS tem o objetivo de esclarecer, detalhar e orientar a
  aplicação dos requisitos atinentes à movimentação no solo, dispostos nas Seções 153.109
  a 153.131 do Regulamento Brasileiro da Aviação Civil - RBAC nº 153.

  REVOGAÇÃO

  2.1 Esta Instrução Suplementar revoga a Instrução Suplementar - IS nº 153-001, Revisão A.

  FUNDAMENTOS

  3.1 Regulamento Brasileiro da Aviação Civil nº 153: Aeródromos - operação, manutenção e
  resposta à emergência.

  3.2 Regulamento Brasileiro da Aviação Civil nº 154: Projeto de aeródromos.

  3.3 Resolução nº 30, de 21 de maio de 2008, artigo 14 e seguintes.

  DEFINIÇÕES

  4.1 Para efeito desta Instrução Suplementar, são válidos os termos e as definições apresentados
  na Seção 153.1 do RBAC nº 153 e na Seção 154.15 do RBAC nº 154, bem como as seguintes:

  4.1.1 Acordo operacional: documento que visa ao estabelecimento de procedimentos operacionais
  padronizados a serem seguidos pelas partes signatárias durante a execução de suas atividades
  relacionadas à área operacional.'
