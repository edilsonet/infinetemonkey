text: '02.05.2023


  OBJETIVO

  1.1 Esta Instrução Suplementar - IS tem o objetivo de esclarecer, detalhar e orientar a
  aplicação dos requisitos dispostos na Seção 153.37 do Regulamento Brasileiro da Aviação
  Civil - RBAC nº 153.

  REVOGAÇÃO

  2.1 Esta Instrução Suplementar revoga a Instrução Suplementar nº 153.37-001 - Revisão A.

  FUNDAMENTOS

  3.1 Regulamento Brasileiro da Aviação Civil nº 153: Aeródromos - operação, manutenção e
  resposta à emergência.

  3.2 Resolução nº 30, de 21 de maio de 2008, artigo 14 e seguintes.

  TERMOS E DEFINIÇÕES

  4.1 Para efeito desta IS, são válidos os termos e as definições apresentados na Seção 153.1
  do RBAC nº 153, bem como aqueles trazidos por outras Instruções Suplementares correlatas
  a sobredito Regulamento.

  ESTRUTURA DO DOCUMENTO

  5.1 Esta IS está estruturada da seguinte forma:

  5.1.1 Os itens que detalham o cumprimento de requisito trazem, no início do parágrafo, a
  notação “FC” (Forma de Cumprimento), seguida do parágrafo do RBAC a que correspondem. Sua
  observância é obrigatória, mas pode o regulado submeter à aprovação da Superintendência
  de Infraestrutura Aeroportuária (SIA) - previamente à sua adoção - meio ou procedimento
  alternativo, na forma prevista na Resolução ANAC nº 30, artigo 14, § 1º e 2º;

  5.1.2 Sempre que um item for classificado como “FC” (Forma de Cumprimento), todos os seus
  subitens, exceto aqueles que tratarem expressamente de uma recomendação, fazem parte do
  conjunto de informações que compõem a forma de cumprimento;

  5.1.3 Os itens que se iniciam com a notação “Recomendação”, apesar de não trazerem comando
  obrigatório, representam as práticas que a ANAC entende como desejáveis para o aumento da
  segurança e da eficiência das operações, merecendo os melhores esforços dos operadores de
  aeródromo para sua consecução;'
