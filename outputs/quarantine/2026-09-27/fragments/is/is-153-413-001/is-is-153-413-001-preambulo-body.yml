title: Preambulo e sumario
text: '1. OBJETIVO

  1.1. Esta Instrução Suplementar - IS tem o objetivo de esclarecer, detalhar e orientar a

  aplicação dos requisitos dispostos na seção 153.413 do Regulamento Brasileiro de

  Aviação Civil - RBAC nº 153.

  2. REVOGAÇÃO - NA

  3. FUNDAMENTOS

  3.1. Regulamento Brasileiro da Aviação Civil nº 153: Aeródromos - operação, manutenção e

  resposta à emergência.

  3.2. Resolução nº 30, de 21 de maio de 2008, artigo 14 e seguintes.

  3.3. Organização da Aviação Civil Internacional (OACI), Annex 14 to the Convention on

  International Civil Aviaition, Volume I - Aerodrome Design and Operations - 7ª Edição

  - 2016.

  3.4. Organização da Aviação Civil Internacional (OACI), DOC 9137-NA/898: Airport

  Services Manual, Part 1 - Rescue and Firefighting, 4ª Edição - 2015.

  4. TERMOS E DEFINIÇÕES

  4.1. Para os efeitos desta IS, são válidos os termos e definições apresentados na seção
  153.1

  do RBAC nº 153.

  5. ESTRUTURA DO DOCUMENTO

  5.1. Esta IS está estruturada da seguinte forma:

  INSTRUÇÃO SUPLEMENTAR - IS

  IS Nº 153.413-001

  Revisão A

  Aprovação: Portaria nº 1.409/SIA, de 9 de maio de 2019.

  Assunto: Operações Compatíveis com a CAT Origem: SIAData de emissão: 15 de maio de 2019.
  IS nº 153.413-001

  Revisão A

  5.1.1. Os itens que detalham o cumprimento de requisito trazem, no início do parágrafo,
  a

  notação “FC” (Forma de Cumprimento), seguida do parágrafo do RBAC a que

  correspondem. Sua observância é obrigatória, mas pode o administrador submeter à

  aprovação da Superintendência de Infraestrutura Aeroportuária (SIA) - previamente à

  sua adoção - meio ou procedimento alternativo, na forma prevista na Resolução ANAC

  nº 30, artigo 14, §§ 1º e 2º;

  5.1.2. Os itens que se iniciam com a notação “Recomendação”, apesar de não trazerem

  comando obrigatório, representam as práticas que a ANAC entende como desejáveis para

  o aumento da segurança e da eficiência das operações, merecendo os melhores esforços

  dos administradores para a sua consecução;

  5.1.3. Os demais itens trazem orientações e esclarecimentos - algumas vezes com exemplos
  -

  para o melhor entendimento das normas do RBAC.

  6. OPERAÇÕES COMPATÍVEIS COM A CAT

  6.1. Generalidades

  6.1.1. A seção 153.413 do RBAC nº 153 descreve quais operações do transporte aéreo público

  de passageiros ou carga podem ser autorizadas pelo operador em relação à Categoria

  Contraincêndio do Aeródromo - CAT.

  6.1.2. Operações que não se enquadrem no transporte aéreo público de passageiros e/ou carga

  não requerem avaliação do operador do aeródromo quanto à CAT ou disponibilização do

  SESCINC.

  6.1.3. Considerando o descrito no parágrafo 153.413(c)(3), a obrigatoriedade de cancelamento

  de autorizações descrita no parágrafo 153.413(d) não tem impacto em aeródromos Classe

  I.

  6.2. Avaliação da compatibilidade da operação

  6.2.1. Ao avaliar a compatibilidade de uma operação solicitada, para fins da Subparte G
  do

  RBAC 153, é necessário que o operador verifique a CAT-AV da aeronave e a

  movimentação do aeródromo em cada período de três meses, além da Classe do

  aeródromo.

  6.2.2. Cada pouso ou decolagem é considerado um movimento. Assim, cada frequência (pouso

  mais decolagem) é composta por dois movimentos.

  6.2.3. A avaliação da movimentação será realizada considerando qualquer período de três

  meses consecutivos. Em nenhum conjunto de três meses, a movimentação de aeronaves

  pode ultrapassar o definido nos critérios de compatibilidade do RBAC 153.Data de emissão:
  15 de maio de 2019. IS nº 153.413-001

  Revisão A

  6.2.4. A seguir são apresentados alguns exemplos para auxiliar operadores de aeródromo na

  avaliação da compatibilidade.

  6.2.5. [Exemplo 1] - Aeródromo Classe II (ou Classe III), com CAT 5 (cinco).

  Operação pretendida no mês atual:

  Aeronave Comprimento

  total (m)

  Largura da

  fuselagem'
