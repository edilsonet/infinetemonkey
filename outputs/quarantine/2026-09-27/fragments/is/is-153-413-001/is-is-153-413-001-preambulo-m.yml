text: '(m)

  Tipo CAT-AV

  Considerada Movimentos

  B748 76,3 6,5 Passageiros 10 8

  B744 70,7 6,5 Passageiros 9 4Data de emissão: 15 de maio de 2019. IS nº 153.413-001

  Revisão A

  A332 58,8 5,6 Passageiros 8 4

  Soma dos movimentos de aeronaves com CAT-AV 7 ou superior (previstas e realizadas,

  considerando a operação pretendida em análise): 26

  Considerando o descrito nos parágrafos 153.413(c)(1)(ii) e 153.413(c)(2)(iii), são

  permitidos até 26 movimentos trimestrais de aeronave CAT-AV até:

  • um nível acima da CAT, para aeródromos Classe IV; e

  • dois níveis acima da CAT, para aeródromos Classe III e II.

  Assim, para o mês avaliado, a operação pretendida É COMPATÍVEL com a CAT 6 do

  aeródromo.

  6.2.10. [Exemplo 6] - Aeródromo Classe IV (ou Classe III ou Classe II), com CAT 6 (seis).

  Operação pretendida no mês atual:

  Aeronave Comprimento

  total (m)

