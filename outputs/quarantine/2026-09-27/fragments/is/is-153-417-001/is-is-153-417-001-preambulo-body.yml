title: Preambulo e sumario
text: '1. OBJETIVO

  1.1. Esta Instrução Suplementar - IS tem o objetivo de esclarecer, detalhar e orientar a

  aplicação dos requisitos dispostos na seção 153.417 do Regulamento Brasileiro de

  Aviação Civil - RBAC nº 153.

  2. REVOGAÇÃO - NA

  3. FUNDAMENTOS

  3.1. Regulamento Brasileiro da Aviação Civil nº 153: Aeródromos - operação, manutenção e

  resposta à emergência.

  3.2. Resolução nº 30, de 21 de maio de 2008, artigo 14 e seguintes.

  3.3. Resolução nº 279, de 10 de julho de 2013.

  4. TERMOS E DEFINIÇÕES

  4.1. Para os efeitos desta IS, são válidos os termos e definições apresentados na seção
  153.1

  do RBAC nº 153.

  5. ESTRUTURA DO DOCUMENTO

  5.1. Esta IS está estruturada da seguinte forma:

  5.1.1. Os itens que detalham o cumprimento de requisito trazem, no início do parágrafo,
  a

  notação “FC” (Forma de Cumprimento), seguida do parágrafo do RBAC a que

  correspondem. Sua observância é obrigatória, mas pode o administrador submeter à

  aprovação da Superintendência de Infraestrutura Aeroportuária (SIA) - previamente à

  sua adoção - meio ou procedimento alternativo, na forma prevista na Resolução ANAC

  nº 30, artigo 14, §§ 1º e 2º;

  INSTRUÇÃO SUPLEMENTAR - IS

  IS Nº 153.417-001

  Revisão A

  Aprovação: Portaria nº 1.409/SIA, de 9 de maio de 2019.

  Assunto: Formação dos profissionais Origem: SIAData de emissão: 15 de maio de 2019. IS nº
  153.417-001

  Revisão A

  5.1.2. Os itens que se iniciam com a notação “Recomendação”, apesar de não trazerem

  comando obrigatório, representam as práticas que a ANAC entende como desejáveis para

  o aumento da segurança e da eficiência das operações, merecendo os melhores esforços

  dos administradores para a sua consecução;

  5.1.3. Os demais itens trazem orientações e esclarecimentos - algumas vezes com exemplos
  -

  para o melhor entendimento das normas do RBAC.

  6. FORMAÇÃO DOS PROFISSIONAIS

  6.1. Generalidades

  6.1.1. O parágrafo 153.417(a) do RBAC nº 153 relaciona os cursos necessários para exercício

  das funções descritas em 153.415.

  6.1.2. O operador deve assegurar que o exercício das funções operacionais do SESCINC seja

  executado exclusivamente por profissionais aprovados nos cursos descritos no parágrafo

  153.417(a).

  6.1.3. Quando houver acúmulo de função nas situações descritas no parágrafo 153.415(b),
  o

  profissional deve comprovar aprovação nos cursos exigidos para todas as funções

  desempenhadas.

  6.1.4. [Recomendação] - Recomenda-se que a condução dos veículos do SESCINC seja

  realizada por profissionais com CNH válida compatível com os veículos operados e com

  a condução de veículos de emergência.

  6.2. Atualização dos profissionais

  6.2.1. Conforme parágrafo 153.417(b), os profissionais em exercício das funções operacionais

  descritas nos parágrafos 153.415(a)(1) a 153.415(a)(5) devem estar com suas

  competências atualizadas, tendo sido aprovados em curso de habilitação ou atualização

  nos prazos definidos para sua Classe.

  6.2.2. [FC 153.417(b)] - A forma de demonstrar a aprovação do BA em curso de atualização

  ou habilitação no prazo definido é a apresentação do Certificado de Aptidão Profissional

  para Bombeiro de Aeródromo (CAP-BA).

  6.2.3. Os profissionais que executem exclusivamente a função operacional de Gerente da Seção

  Contraincêndio (GS) estão dispensados da participação em cursos de atualização.

  7. APÊNDICESData de emissão: 15 de maio de 2019. IS nº 153.417-001

  Revisão A

