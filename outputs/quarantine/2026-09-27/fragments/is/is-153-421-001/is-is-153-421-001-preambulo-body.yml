title: Preambulo e sumario
text: '1. OBJETIVO

  1.1. Esta Instrução Suplementar - IS tem o objetivo de esclarecer, detalhar e orientar a

  aplicação dos requisitos dispostos na seção 153.421 do Regulamento Brasileiro de

  Aviação Civil - RBAC nº 153.

  2. REVOGAÇÃO - NA

  3. FUNDAMENTOS

  3.1. Regulamento Brasileiro da Aviação Civil nº 153: Aeródromos - operação, manutenção e

  resposta à emergência.

  3.2. Resolução nº 30, de 21 de maio de 2008, artigo 14 e seguintes.

  3.3. Organização da Aviação Civil Internacional (OACI), DOC 9137-NA/898: Airport

  Services Manual, Part 1 - Rescue and Firefighting, 4ª Edição - 2015.

  4. TERMOS E DEFINIÇÕES

  4.1. Para os efeitos desta IS, são válidos, além dos termos e definições apresentados na
  seção'
