title: Preambulo e sumario
text: '1. OBJETIVO

  1.1. Esta Instrução Suplementar - IS tem o objetivo de esclarecer, detalhar e orientar a

  aplicação dos requisitos dispostos na seção 153.425 do Regulamento Brasileiro de

  Aviação Civil - RBAC nº 153.

  2. REVOGAÇÃO - NA

  3. FUNDAMENTOS

  3.1. Regulamento Brasileiro da Aviação Civil nº 153: Aeródromos - operação, manutenção e

  resposta à emergência.

  3.2. Resolução nº 30, de 21 de maio de 2008, artigo 14 e seguintes.

  3.3. Federal Aviation Administration (FAA), Advisory Circular nº 150/5210-15A: Aircraft

  Rescue and Firefighting Station Building Design - 2008.

  3.4. Organização da Aviação Civil Internacional (OACI), DOC 9137-NA/898: Airport

  Services Manual, Part 1 - Rescue and Firefighting, 4ª Edição - 2015.

  4. TERMOS E DEFINIÇÕES

  4.1. Para os efeitos desta IS, são válidos os termos e definições apresentados na seção
  153.1

  do RBAC nº 153.

  5. ESTRUTURA DO DOCUMENTO

  5.1. Esta IS está estruturada da seguinte forma:

  INSTRUÇÃO SUPLEMENTAR - IS

  IS Nº 153.425-001

  Revisão A

  Aprovação: Portaria nº 1.409/SIA, de 9 de maio de 2019.

  Assunto: Seção Contraincêndio. Origem: SIAData de emissão: 15 de maio de 2019. IS nº 153.425-001

  Revisão A

  5.1.1. Os itens que detalham o cumprimento de requisito trazem, no início do parágrafo,
  a

  notação “FC” (Forma de Cumprimento), seguida do parágrafo do RBAC a que

  correspondem. Sua observância é obrigatória, mas pode o administrador submeter à

  aprovação da Superintendência de Infraestrutura Aeroportuária (SIA) - previamente à

  sua adoção - meio ou procedimento alternativo, na forma prevista na Resolução ANAC

  nº 30, artigo 14, §§ 1º e 2º;

  5.1.2. Os itens que se iniciam com a notação “Recomendação”, apesar de não trazerem

  comando obrigatório, representam as práticas que a ANAC entende como desejáveis para

  o aumento da segurança e da eficiência das operações, merecendo os melhores esforços

  dos administrados para a sua consecução;

  5.1.3. Os demais itens trazem orientações e esclarecimentos - algumas vezes com exemplos
  -

  para o melhor entendimento das normas do RBAC.

  6. SEÇÃO CONTRAINCÊNDIO

  6.1. Generalidades

  6.1.1. A seção 153.425 do RBAC nº 153 dispõe que os recursos dedicados às atividades do

  SESCINC se concentram em instalação específica, denominada Seção Contraincêndio

  (SCI).

  6.1.2. O objetivo da disponibilização da SCI é manter a capacidade de operar initerruptamente

  o SESCINC, abrigando os profissionais dedicados ao serviço, além de CCI e outros

  veículos, equipamentos, materiais, sistemas de comunicação e alarme, reserva técnica de

  água e eventuais estoques de agentes extintores.

  6.1.3. Conforme estabelecido no parágrafo 153.219(c)(1)(ii), o operador do aeródromo deve

  manter entrada de energia secundária para o sistema elétrico dos equipamentos

  mencionados no parágrafo 153.425(b) e na seção 153.427. A entrada secundária visa a

  manutenção ininterrupta dos sistemas críticos do SESCINC, mesmo que ocorra falha no

  sistema principal de energia elétrica.

  6.1.4. [Recomendação] - Para garantir o funcionamento da SCI sem impacto, recomenda-se

  que os demais sistemas da SCI também estejam conectados à fonte secundária de energia

  elétrica.

  6.2. Localização

  6.2.1. As SCI devidamente localizadas, construídas, equipadas e mantidas contribuem de forma

  importante para a eficiência do SESCINC.

  6.2.2. É esperada uma redução no tempo-resposta quando são realizados na fase de

  planejamento de construção de uma SCI estudos dos padrões de tráfego na áreaData de emissão:
  15 de maio de 2019. IS nº 153.425-001

  Revisão A

  operacional, dos procedimentos operacionais em casos de emergência, da experiência

  com acidentes/incidentes anteriores e das prováveis rotas que possam diminuir o tempo

  de resposta a emergências.

  6.2.3. [Recomendação] - Idealmente, a SCI deveria ser instalada em local que permita o menor

  Tempo-Resposta. Considerando isso, recomenda-se que a SCI:

  a) Esteja localizada próxima às pistas de pouso e decolagem; e

  b) Possua equidistância das cabeceiras.

  6.3. Infraestrutura

  6.3.1. O parágrafo 153.425(b) relaciona as estruturas e sistemas obrigatórios para o SESCINC

  que devem estar implantados na SCI.

  6.3.2. [Recomendação] - Além dos itens obrigatórios descritos nos itens 153.425(b),

  recomenda-se que a SCI disponha de:

  a) Refeitório para as equipes de serviço do SESCINC;

  b) Vestiário para o efetivo do SESCINC;

  c) Almoxarifado, para guarda dos equipamentos, materiais e estoques de LGE, PQ e

  cilindros de gases propelentes;

  d) Local para instrução e treinamento; e

  e) Área destinada à atividade física e lazer.

  6.4. Sala de Observação

  6.4.1. A Sala de Observação descrita no parágrafo 153.425(b)(1) é o local utilizado

  exclusivamente para realização das atividades desempenhadas pelo Operador de Sistema

  de Comunicação (OC), não devendo ser compartilhada com outras atividades.

  6.4.2. A observação da área de movimentos de aeronaves pode ser direta ou via sistema de

  câmeras. Em ambas as situações, deve ser possível a visualização de toda a área de

  movimentos.

  6.4.3. [Recomendação] - No caso de visualização remota (via sistema de câmeras), recomenda-

  se que o OC tenha controle das câmeras para acompanhamento de ocorrências e

  deslocamento de veículos na área de movimento de aeronaves.Data de emissão: 15 de maio de
  2019. IS nº 153.425-001

  Revisão A

  6.4.4. [Recomendação] - Nos locais em que seja utilizada visualização direta, recomenda-se
  a

  avaliação da necessidade de tratamento das janelas para reduzir os efeitos da incidência

  de luz solar.

  6.4.5. [Recomendação] - Quando a Sala de Observação for utilizada em períodos noturnos,

  recomenda-se a avaliação da necessidade de variação na intensidade de luz no interior

  para permitir visualização da área externa.

  6.4.6. A ambiência, descrita no parágrafo 153.425(b)(1)(i), diz respeito à capacidade de

  operação dos sistemas de comunicação, especialmente em relação ao nível de ruído, de

  forma a permitir a inteligibilidade da comunicação.

  6.4.7. [Recomendação] - Um nível ruído usualmente aceito para a Sala de Observação é de
  45

  dB(A). Para níveis de ruído acima desse valor, recomenda-se a instalação de sistema de

  atenuação acústica.

  6.4.8. [Recomendação] - Considerando a possibilidade de haver um sistema de atenuação

  acústica na Sala de Observação, recomenda-se avaliar a necessidade de instalar nesse

  ambiente equipamento repetidor do sistema de alarme da SCI.

  6.4.9. No parágrafo 153.425(c) consta que os operadores de aeródromos Classe I podem ser

  dispensados de dispor de Sala de Observação, desde que exista procedimento aprovado

  pela ANAC para a visualização da área de movimento de aeronaves. Alguns

  procedimentos já aceitos para operador de aeródromos dessa Classe envolvem o

  deslocamento do CCI, com equipagem completa e equipada, para local com visibilidade

  que permita o acompanhamento do pouso e/ou decolagem. Para este procedimento, é

  recomendado que o CCI esteja em tal posição, no mínimo, 15 minutos antes do pouso e

  permaneça no local por pelo menos 15 minutos após a decolagem.

  6.5. Sistema de Reabastecimento do CCI com Água

  6.5.1. O sistema de reabastecimento do CCI com água, requisitado pelo parágrafo 153.425(b)(4)

  é projetado para rápida utilização durante o atendimento a uma emergência aeronáutica,

  caso seja necessário recarregar o reservatório de água do veículo.

  6.5.2. [FC 153.425(b)(4)] - A forma de cumprimento do requisito disposto no parágrafo

  153.425(b)(4) é a utilização de reservatório elevado.

  6.5.3. O abastecimento por gravidadepor meio de reservatório elevado pode ser realizado

  mesmo que ocorra falha no fornecimento de energia elétrica, além de não depender de

  bombas, enquanto a utilização de outros sistemas requer a existência de redundâncias

  necessárias para garantir a confiabilidade.

  6.5.4. [Recomendação] - Para os reservatórios elevados, recomenda-se a utilização de válvulas

  de abertura rápida (1/4 de volta). Tais válvulas permitem redução no tempo deData de emissão:
  15 de maio de 2019. IS nº 153.425-001

  Revisão A

  abastecimento dos veículos. Além disso, tubulações maiores, 4” ou superiores, reduzem

  a perda de carga na saída do reservatório.

  6.5.5. [Recomendação] - Para permitir a continuidade da operacionalidade do sistema de

  abastecimento por gravidade, recomenda-se que o reservatório possa ser completamente

  reabastecido em até 10 minutos após a utilização.

  6.5.6. [Recomendação] - De forma a permitir um rápido retorno dos CCI ao local do acidente

  quando for necessário o reabastecimento com água, recomenda-se que o sistema seja

  construído de forma a permitir que os veículos parem e saiam de frente (sem necessidade

  de utilizar marcha ré).

  6.6. Sistemas de Recarregamento Contínuo das Baterias e de Reabastecimento dos

  Reservatórios de Ar Comprimido dos CCI

  6.6.1. O objetivo do sistema de recarregamento contínuo das baterias dos CCI descrito no

  parágrafo 153.425(b)(5) é garantir o acionamento imediato do motor do veículo.

  6.6.2. O objetivo do sistema de reabastecimento dos reservatórios de ar comprimido dos CCI

  descrito no parágrafo 153.425(b)(6) é garantir a imediata movimentação do veículo,

  evitando falhas, por exemplo, no sistema de freios, além de permitir o correto

  funcionamento das válvulas pneumáticas do sistema de combate a incêndio. Alguns

  modelos de CCI utilizados no Brasil possuem o sistema de reabastecimento de ar

  comprimido embarcado no próprio veículo.

  6.7. Posto Avançado Contraincêndio (PACI)

  6.7.1. O parágrafo 153.425(a)(1) trata dos Postos Avançados Contraincêndio (PACI).

  6.7.2. Em algumas situações, pode ser mais adequado alocar parte dos recursos dedicados
  às

  atividades do SESCINC em instalação não contígua ao SCI - o PACI.

  6.7.3. Em geral, a instalação de PACI ocorre nos casos em que a distribuição geográfica
  da área

  de operação do aeródromo e/ou posicionamento da SCI dificulta o atendimento ao

  Tempo-Resposta (parágrafo 153.409). No entanto, o operador do aeródromo pode definir

  a instalação de PACI com outros objetivos, desde que não impacte negativamente no

  atendimento a emergências aeronáuticas ou no cumprimento de outros requisitos

  normativos da ANAC.

  6.7.4. Nessas situações, é importante ter em mente que o PACI funciona como uma "SCI

  satélite", e que, assim, suas instalações devem seguir o determinado na seção 153.425.

  6.7.5. Assim, se o operador do aeródromo entender, por exemplo, que a disponibilização de
  um

  CCI em outro ponto do aeródromo traz benefícios para o sistema (como a redução doData de
  emissão: 15 de maio de 2019. IS nº 153.425-001

  Revisão A

  tempo-resposta), pode fazê-lo. Essa iniciativa do operador fica condicionada ao

  cumprimento dos requisitos do RBAC que estão relacionados ao recurso, tais como a

  disponibilização de abrigo para o CCI, pátio de manobras que permita sua livre

  movimentação, sistemas de recarregamento de baterias e ar comprimido, além de sistema

  de comunicação e alarme.

  7. APÊNDICES

  APÊNDICE A - Controle de RevisõesData de emissão: 15 de maio de 2019. IS nº 153.425-001

  Revisão A

  APÊNDICE A - CONTROLE DE REVISÕES

  [RESERVADO]'
