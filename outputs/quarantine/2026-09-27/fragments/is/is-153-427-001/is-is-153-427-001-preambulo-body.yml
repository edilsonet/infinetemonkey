title: Preambulo e sumario
text: '1. OBJETIVO

  1.1. Esta Instrução Suplementar - IS tem o objetivo de esclarecer, detalhar e orientar a

  aplicação dos requisitos dispostos na seção 153.427 do Regulamento Brasileiro de

  Aviação Civil - RBAC nº 153.

  2. REVOGAÇÃO - NA

  3. FUNDAMENTOS

  3.1. Regulamento Brasileiro da Aviação Civil nº 153: Aeródromos - operação, manutenção e

  resposta à emergência.

  3.2. Resolução nº 30, de 21 de maio de 2008, artigo 14 e seguintes.

  3.3. Federal Aviation Administration (FAA), Advisory Circular nº 150/5210-7D: Aircraft

  Rescue and Firefighting Communications.

  3.4. Organização da Aviação Civil Internacional (OACI), DOC 9137-NA/898: Airport

  Services Manual, Part 1 - Rescue and Firefighting, 4ª Edição - 2015.

  4. TERMOS E DEFINIÇÕES

  4.1. Para os efeitos desta IS, são válidos os termos e definições apresentados na seção
  153.1

  do RBAC nº 153.

  5. ESTRUTURA DO DOCUMENTO

  5.1. Esta IS está estruturada da seguinte forma:

  INSTRUÇÃO SUPLEMENTAR - IS

  IS Nº 153.427-001

  Revisão A

  Aprovação: Portaria nº 1.409/SIA, de 9 de maio de 2019.

  Assunto: Sistemas de Comunicação e Alarme. Origem: SIAData de emissão: 15 de maio de 2019.
  IS nº 153.427-001

  Revisão A

  5.1.1. Os itens que detalham o cumprimento de requisito trazem, no início do parágrafo,
  a

  notação “FC” (Forma de Cumprimento), seguida do parágrafo do RBAC a que

  correspondem. Sua observância é obrigatória, mas pode o administrador submeter à

  aprovação da Superintendência de Infraestrutura Aeroportuária (SIA) - previamente à

  sua adoção - meio ou procedimento alternativo, na forma prevista na Resolução ANAC

  nº 30, artigo 14, §§ 1º e 2º;

  5.1.2. Os itens que se iniciam com a notação “Recomendação”, apesar de não trazerem

  comando obrigatório, representam as práticas que a ANAC entende como desejáveis para

  o aumento da segurança e da eficiência das operações, merecendo os melhores esforços

  dos administradores para a sua consecução;

  5.1.3. Os demais itens trazem orientações e esclarecimentos - algumas vezes com exemplos
  -

  para o melhor entendimento das normas do RBAC.

  6. SISTEMAS DE COMUNICAÇÃO E ALARME

  6.1. Generalidades

  6.1.1. A seção 153.427 do RBAC nº 153 dispõe que operador do aeródromo deve disponibilizar

  sistema de comunicação que permita o fluxo contínuo de informações entre os

  envolvidos no atendimento às emergências e sistema de alarme que permita o

  acionamento imediato do SESCINC.

  6.2. Sistema de Comunicação

  O sistema de comunicação por estações rádio se constitui, normalmente, no meio que

  permite maior flexibilidade e rapidez de comunicação em situações de emergência. Isso

  se deve ao fato de que o equipamento rádio permite comunicação instantânea com todos

  os envolvidos na ocorrência, além de ser o principal meio de comunicação utilizado em

  operações e situações onde o deslocamento e a movimentação ágil se fazem necessários.

  6.2.1. As estações rádio apresentam-se em 3 (três) tipos:

  a) Estações Fixas - São aquelas instaladas nas dependências dos prédios, com o uso

  de antenas externas apropriadas. São utilizadas como a estação base de um sistema

  de comunicação por possuírem maior potência e cobrirem uma área maior do que

  as estações portáteis.

  b) Estações Móveis Veiculares - São aquelas instaladas nas viaturas terrestres e

  aquáticas, das quais retiram energia para seu funcionamento.Data de emissão: 15 de maio
  de 2019. IS nº 153.427-001

  Revisão A

  c) Estações Portáteis - São aquelas facilmente transportadas por um só homem,

  sendo compostas por equipamentos rádio portáteis.

  6.2.2. [FC 153.427(a)(1)] - A forma de cumprimento do requisito disposto no parágrafo

  153.427(a)(1) é a disponibilização de equipamentos de rádio para utilização por cada um

  dos profissionais descritos, com alcance mínimo na área operacional do aeródromo ou,

  caso exista SESCINC, em toda a área de atuação do serviço.

  6.2.3. [Recomendação] - Recomenda-se que o equipamento de rádio disponibilizado na Sala

  de Observação, para utilização do OC, seja do tipo estação fixa.

  6.2.4. [Recomendação] - Recomenda-se que o equipamento de rádio disponibilizado no CCI,

  para utilização do BA-MC, seja do tipo estação móvel veicular.

  6.2.5. [FC 153.427(a)(1)(iii)] - Considerando a necessidade de fluxo contínuo de informações,

  o equipamento de rádio disponibilizado ao BA-CE deve ser do tipo estação portátil.

  6.2.6. [FC 153.427(a)(1)(iv)] - Considerando a necessidade de fluxo contínuo de informações,

  o equipamento de rádio disponibilizado ao BA-LR deve ser do tipo estação portátil.

  6.2.7. [Recomendação] - Recomenda-se que o equipamento de rádio disponibilizado no COE,

  para utilização pelo responsável, seja do tipo estação fixa.

  6.2.8. [Recomendação] - Recomenda-se que o equipamento de rádio disponibilizado no PCM,

  para utilização pelo responsável pela condução do veículo, seja do tipo estação móvel

  veicular.

  6.2.9. [Recomendação] - Recomenda-se que quaisquer outras pessoas envolvidas no

  atendimento a emergências no aeródromo possuam equipamento para comunicação por

  rádio.

  6.2.10. Além da comunicação por rádio, o parágrafo 153.427(a)(2) requer que seja

  disponibilizada linha telefônica exclusiva e direta para comunicação entre o responsável

  pelo controle de tráfego aéreo (TWR ou outro órgão que atue como controle de tráfego

  aéreo local) e o Operador de Comunicações da SCI.

  6.3. Sistema de Alarme

  6.3.1. O parágrafo 153.427(b) requer que seja disponibilizado sistema de alarme dimensionado

  para que o sinal sonoro seja perfeitamente audível em quaisquer pontos da SCI.

  6.3.2. Para cumprimento do requisito descrito no parágrafo 153.427(b) pode ser necessária
  a

  disponibilização de repetidores do sinal sonoro, em especial nos locais onde exista

  atenuação acústica.Data de emissão: 15 de maio de 2019. IS nº 153.427-001

  Revisão A

  6.3.3. [Recomendação] - Para auxiliar na identificação imediata de um acionamento,

  recomenda-se que a disponibilização de sinais luminosos vinculados ao sinal sonoro.

  6.3.4. Conforme parágrafo 153.427(b)(1), o sistema de alarme sonoro da Seção Contraincêndio,

  além de ser acionado pelo Operador de Comunicações da SCI, deve ser acionável

  diretamente pelo controle de tráfego aéreo (TWR ou outro órgão que atue como controle

  de tráfego aéreo local). É de fundamental importância que o acionamento do SESCINC

  por alarme possa ser diretamente realizado pelos profissionais com maior capacidade de

  visualização da provável área de ocorrência de um acidente aeronáutico ou que venham

  a receber a declaração de emergência da aeronave, aumentando assim a rapidez na

  disponibilização dos recursos de atendimento às emergências.

  6.3.5. [Recomendação] - Recomenda-se a avaliação da necessidade de disponibilização de

  meios de acionamento do sistema de alarme da SCI a outros entes envolvidos na Resposta

  à Emergência Aeroportuária como, por exemplo, o COE.

  7. APÊNDICES

  APÊNDICE A - Controle de RevisõesData de emissão: 15 de maio de 2019. IS nº 153.427-001

  Revisão A

  APÊNDICE A - CONTROLE DE REVISÕES

