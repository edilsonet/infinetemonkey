  dos administradores para a sua consecução;

  5.1.3. Os demais itens trazem orientações e esclarecimentos - algumas vezes com exemplos
  -

  para o melhor entendimento das normas do RBAC.

  6. INFORMAÇÕES OPERACIONAIS

  6.1. Generalidades

  6.1.1. A seção 153.431 do RBAC nº 153 dispõe que os as informações relativas aos

  acionamentos do SESCINC devem ser encaminhadas à ANAC, em até 5 (cinco) dias,

  para o caso de acionamento envolvendo aeronaves, e semestralmente nos demais casos.

  6.1.2. O objetivo do envio destas informações é criar uma base de dados de ocorrências

  envolvendo o SESCINC, de modo a gerar informações estatísticas que embasem estudos

  voltados ao tema.

  6.2. Relatório Semestral dos Acionamentos do SESCINC

  6.2.1. [FC 153.431(a)] Deve ser encaminhado à ANAC, um resumo dos acionamentos do

  SESCINC havidos no semestre, sempre no mês seguinte ao seu término (janeiro e julho).

  6.2.2. O formulário pode ser desenvolvido pelo próprio operador de aeródromo, desde que

  contenha uma descrição sucinta da ocorrência, a descrição dos recursos utilizados para o

  atendimento e informações relativas à atuação da equipe de serviço do SESCINC.

  6.2.3. [FC 153.431(a)(1)] Caso não tenham ocorrido acionamentos no período, o operador do

  aeródromo deve encaminhar à ANAC relatório informando a inexistência de

  acionamentos, no mesmo prazo definido no parágrafo 153.431(a).

  6.3. Acionamentos do SESCINC para Atendimento a Emergências Aeronáuticas.

  6.3.1. [FC 153.431(b)] -Nos acionamentos do SESCINC para atendimento a emergências

  aeronáutica, os dados devem ser compilados pelo responsável pela gestão do SESCINC

  e apresentados à ANAC em modelo constante no Apêndice A desta IS, ou formulário

  eletrônico constante no sítio eletrônico Sistema Integrado de Informações da Aviação

  Civil (SACI) na rede mundial de computadores, em até 5 (cinco) dias úteis da data da

  ocorrência.Data de emissão: 15 de maio de 2019. IS nº 153-431-001

  Revisão A

