text: '(f) Outros (especificar)

  7.DESCRIÇÃO DA OCORRÊNCIA

  7.1 Descrição da Emergência (inclusive causa do incêndio):Data de emissão: 15 de maio de
  2019. IS nº 153-431-001

  Revisão A

  7.2 Relato da operação de controle, combate e extinção do incêndio, e das condições de resgate
  no momento da chegada dos CCI

  7.3 Descrição da evacuação dos ocupantes mencionando as seções da aeronave que foram protegidas,
  auxílios necessários, portas e áreas de

  arrombamento usadas:

  8. OUTROS DETALHES

  8.1 Descrição De outros detalhes importantes, tais como: comunicações utilizadas e condições
  do terreno, se houve alguma dificuldade de acesso ao

  local do acidente:Data de emissão: 15 de maio de 2019. IS nº 153-431-001

  Revisão A

  9. INFORMAÇÕES ADICIONAIS

  9.1 Estado da aeronave no término das

  operações de salvamento e extinção:

  Pelo Acidente Pelo Incêndio'
