title: 'ASA:'
text: '7.2.1.3 ASA:

  a) O operador de aeródromo deve identificar focos atrativos ou com potencial de atração
  de

  fauna na ASA por intermédio de:

  • observação de fauna deslocando-se através do aeródromo, entre fontes atrativas

  separadas;

  • observação de aves sobrevoando, com frequência, o espaço aéreo do aeródromo;

  • observação, quando do monitoramento do sítio aeroportuário, de usos do solo

  inapropriados na vizinhança adjacente ao aeródromo; e

  • relatos sobre perigo provocado pela fauna recebidos pelos operadores de aeronaves ou

  outras fontes.

  b) Uma vez identificados os focos atrativos e/ou com potencial de atração de fauna, o operador

  de aeródromo deve monitorá-los com regularidade, de modo a acompanhar a evolução de seu

  potencial atrativo ao longo do tempo, nos termos do parágrafo 6.12 da IS 153.501 e legislação

  em vigor;

  c) O monitoramento de focos que atraiam espécies cuja análise de risco considere mais perigosas

  deve ser feito com maior frequência; e

  d) O operador de aeródromo deve elaborar, quando das revisões periódicas do PGRF, um

  relatório que abranja a evolução do potencial atrativo das atividades atrativas ou com potencial

  de atração de fauna identificadas.

  7.3 Registro e acompanhamento de relatos e denúncias'
