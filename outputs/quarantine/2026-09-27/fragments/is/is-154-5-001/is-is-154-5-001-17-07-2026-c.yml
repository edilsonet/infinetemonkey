  Caso o cenário operacional em avaliação não possua uma largura de faixa de pista que atenda
  ao requisito do TCCA, diz-se que que a largura está na região de rejeição, ou seja, o cenário
  operacional foi rejeitado no Teste de Rejeição nº 2.

  Teste de Rejeição nº 3 - Requisito CASA - Austrália

  A Autoridade de Aviação Civil Australiana define em seu regulamento que, no caso de pistas
  com operação IFR, a faixa de pista é composta por duas áreas, conforme a Figura 3 abaixo,
  isto é, uma porção que deve ser nivelada/preparada, denominada de “graded area", e uma área
  denominada de “flyover area".


  Figura 3 - Composição da faixa de pista - definição australiana

  O requisito da largura de faixa de pista adotado pela CASA (em sua norma “Manual of Standards
  Part 139 - Aerodromes”) é menos restritivo que o preconizado pela OACI (exceto para o código
  1, operações VFR noturnas, situação em que a Austrália é mais rigorosa e para os códigos
  3A, 3B e 3C operação IFR precisão e códigos 3D e 4 operação IFR, cujos parâmetros foram
  atualizados recentemente na 7ª edição do Anexo 14, o qual serviu de base para a Emenda 03
  do RBAC 154). Considerando que o requisito australiano é mais flexível que o do RBAC 154,
  deve-se diferenciar os casos em que a infraestrutura atenda o requisito australiano e os
  casos em que nem este é atendido. A comparação entre requisitos é apresentada na Tabela
  3.

