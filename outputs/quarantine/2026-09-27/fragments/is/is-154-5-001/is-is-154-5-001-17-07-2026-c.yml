text: '(c) Todo operador de aeródromo pode solicitar à ANAC isenção de requisito deste Regulamento,
  nos moldes do RBAC n° 11, denominado “Regras gerais para petição de emissão, alteração,
  revogação ou isenção de cumprimento de regra” ou norma que o substitua ou atualize, por
  meio da apresentação de Estudo Aeronáutico que demonstre que as operações podem ser mantidas
  em um nível aceitável de segurança operacional.

  Resolução nº 30, de 21 de maio de 2008, que institui a Instrução Suplementar - IS, norma
  suplementar de caráter geral editada pelo Superintendente da área competente, objetivando
  esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou RBHA. Da Resolução,
  transcreve-se:

  Art. 14 Fica instituída a Instrução Suplementar - IS, norma suplementar de caráter geral
  editada pelo Superintendente da área competente, objetivando esclarecer, detalhar e orientar
  a aplicação de requisito previsto em RBAC.

  § 1º O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de
  requisito previsto em RBAC, poderá:

  I - adotar os meios e procedimentos previamente especificados em IS; ou

  II - apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  § 2° O meio ou procedimento alternativo mencionado no § 1° deste artigo deve garantir nível
  de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar o
  objetivo do procedimento normalizado em IS.

  §3° A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  DEFINIÇÕES

  Para efeito desta IS, aplicam-se os termos e as definições estabelecidos no RBAC n° 153,
  no RBAC n° 154 e demais normas relacionadas à matéria.

  desenvolvimento do assunto

  O RBAC 154 traz requisitos para o projeto de aeródromos, sendo este também utilizado como
  referência para o processo de certificação operacional de aeroportos, conforme estabelece
  a seção 154.601.

  Dos requisitos do RBAC 154, merecem destaque, para fins de aplicação da presente IS, os
  requisitos relacionados à “subparte C - Características Físicas”, tendo em vista que a adequação
  de uma infraestrutura a estes requisitos tende a ser mais onerosa ao operador de aeródromo
  (em termos de custo e de tempo necessário para a adequação ao requisito).

  Ainda, dentre os requisitos de características físicas, merecem destaque os requisitos de
  dimensões de faixa de pista (e, consequentemente, de separação entre pista de pouso e decolagem
  e pista de táxi) e de RESA, cuja adequação depende, em muitos casos, de desapropriação de
  áreas no entorno do aeródromo, e por isso, orientações mais específicas constam nos apêndices
  ao presente documento.

  A seguir, apresenta-se uma proposta de estrutura para a análise de risco, ressaltando-se
  que, dependendo da característica da não conformidade, um ou mais itens dessa estrutura,
  que sejam ou não pertinentes ao problema específico, poderão ser acrescentados ou suprimidos
  à petição pelo operador de aeródromo:

  INTRODUÇÃO

  Descrição da não conformidade, caracterizando os conflitos com a regulamentação em vigor,
  os problemas operacionais decorrentes (atuais e potenciais), relacionando-os com a aeronave
  crítica e as condições operacionais do aeroporto, e indicando eventuais situações onde os
  riscos sejam potencializados.

  Descrição sucinta da metodologia da análise de risco.

  Medidas já adotadas em relação à não conformidade, com a finalidade de reduzir riscos imediatos,
  como, por exemplo, acordos ou restrições operacionais já estabelecidos.

  Justificativa que demonstre o interesse público para a obtenção de isenção.

  REGULAMENTAÇÃO APLICÁVEL

  Descrever a regulamentação brasileira aplicável.

  Descrever, caso possível, a regulamentação adotada em outros países.

  ANÁLISE

  Dados operacionais específicos (que possuam pertinência com o pleito), tais como o histórico
  de movimentos (dados de tráfego aéreo na área de aproximação do aeroporto, se for relevante
  para compreensão dos impactos operacionais), descrição do mix de aeronaves, descrição do
  percentual de operações que ocorrem sob cada tipo de regra de voo (VFR/IFR), bem como sob
  condição meteorológica (VMC/IMC).

  Caracterização (tais como localização, altura, natureza, frangibilidade) dos obstáculos
  existentes que tenham relação com o pleito da isenção.

  Histórico de fechamentos, condições meteorológicas, predominância e intensidade e direção
  de ventos.

  Histórico de acidentes ou incidentes no aeroporto ou de acidentes ou incidentes que aconteceram
  em outros aeroportos similares, ou em circunstâncias operacionais semelhantes, quando relacionados
  à não conformidade.

  Descrição das metodologias utilizadas na análise do risco, do impacto na capacidade operacional.
  Indicar as restrições do estudo e caracterizar as condições que foram assumidas. Utilizar
  estudos similares conduzidos para casos semelhantes pode ser um boa alternativa para orientar
  a análise de risco.

  Definição sobre a abordagem quantitativa ou qualitativa da análise de risco, em função das
  fontes de dados disponíveis. Recomenda-se a abordagem quantitativa, mas, quando dados confiáveis
  não estão disponíveis ou são muito restritos, deve-se adotar a abordagem qualitativa. Comparações
  com a média nacional de acidentes ou incidentes pertinentes ao requisito em análise podem
  ser utilizadas.

  Análise do risco existente, conforme descrito no RBAC 153, parágrafo 153.55(c).

  Análise de sensibilidade, com base nos aspectos abordados anteriormente, caracterizando
  a probabilidade de ocorrência e as consequências associadas à não conformidade, para cada
  tipo de condição operacional no aeroporto (proposição de possíveis cenários, incluindo o
  cenário de atendimento ao requisito, e avaliação do risco seguindo a mesma metodologia,
  isto é, como varia o risco em função de uma ou mais melhorias, medidas mitigadoras ou restrições
  operacionais possíveis de serem implementadas).

  Avaliação das defesas existentes no aeroporto, tais como: existência de ranhuras na pista,
  auxílios visuais, auxílios à navegação aérea, procedimentos, etc.

  Proposição de medidas mitigadoras adicionais, tais como: restrições operacionais, instalação
  de novos auxílios visuais (PAPI, por exemplo), modernização de equipamentos no aeroporto
  (implantação de um SOCMS avançado), implantação de outros melhorias na infraestrutura do
  aeroporto, etc.

  Exposição de eventuais novos perigos que podem surgir em virtude de proposição de alguma
  restrição operacional (ex: restrição a operações somente em condições VMC) ou de alguma
  medida mitigadora adicional.

  Apresentação de participação dos impactados no processo de avaliação risco, caso a não conformidade,
  bem como a adoção de medidas mitigadoras adicionais, impactarem os agentes envolvidos nas
  operações no aeroporto. Dependendo das proposições de restrições operacionais ou medidas
  mitigadoras adicionais, os agentes impactados necessitarão apresentar suas próprias avaliações
  de riscos em separado. A participação de representantes do serviço de tráfego aéreo (ATS)
  é importante para compreensão dos impactos operacionais das medidas propostas.

  CONCLUSÃO

  Estimativa dos custos econômicos e avaliação dos impactos operacionais no aeroporto, considerando
  a(s) solução(ões) de adequação da infraestrutura ao requisito (incluindo detalhes de impacto
  na capacidade e eficiência operacional do aeroporto).

  Apresentação do Plano de Ações Corretivas - PAC, com meios e prazos, para adequação da não
  conformidade, caso o pedido seja de isenção temporária, ou de implantação de melhorias compensatórias
  em outros aspectos da infraestrutura ou das operações no aeroporto.

  Apresentação de plano de implementação das medidas mitigadoras adicionais propostas, incluindo
  informações de quando, quem e como.

  Descrição da forma como as operações serão monitoradas e os riscos reavaliados periodicamente,
  incluindo eventuais novos perigos que tenham sido introduzidos em virtude das medidas mitigadoras
  adicionais, bem como proposição dos gatilhos para a necessidade de reavaliação da análise
  de risco (tais como alterações significativas do mix de aeronaves, alteração da condição
  meteorológica, entrada em operação de novas empresas aéreas no aeroporto, etc.).

  Apresentação de quais e como as informações relevantes de procedimentos ou restrições operacionais
  serão divulgadas no AIS e coordenadas e comunicadas aos agentes impactados (ex: a proposição
  de redução de distâncias declaradas para provimento de RESA foi avaliada em conjunto com
  os operadores aéreos?).

  Critérios de risco recomendados:

  É de fundamental importância enfatizar que nenhum critério quantitativo fixo ou absoluto
  de risco é estabelecido nesta IS. Os níveis de risco descritos devem ser utilizados como
  referências, tendo em vista os aspectos práticos observados por ocasião da análise das situações
  de perigo em aeroportos específicos.

  Dessa forma, serão adotados dois princípios que nortearão o processo de decisão sobre a
  possibilidade de concessão de uma isenção em relação aos requisitos em vigor:

  os critérios serão guias genéricos para o estabelecimento e implementação do processo de
  gerenciamento de risco; e

  o nível de risco deve ser tão baixo quanto praticamente possível, independente de qualquer
  critério absoluto.

  Deve-se notar que há uma diferença entre o risco total de determinada operação e o risco
  relacionado com determinada situação de perigo. Assim, no caso de uma decolagem abortada,
  por exemplo, o risco total é integrado pelos riscos de saída lateral (veer-off), de parada
  após a cabeceira (overrun) e de colisão.

  Os critérios básicos, definidos a seguir, referem-se à possibilidade de ocorrência de acidentes
  fatais por movimento (operação de pouso ou decolagem) da aeronave:

  Referência para determinada situação de perigo: 1 × 10-7

  Referência para o risco total em determinado aeródromo: 2 × 10-7

  Quando praticável, para determinada situação de perigo: 1 × 10-8

  Situação ideal, para determinada situação de perigo: 1 × 10-9

  Tendo em vista outros riscos geralmente encontrados na aviação, a aplicação de recursos
  para reduzir riscos inferiores a 10-9 por movimento pode ser desconsiderada. Além disso,
  é possível questionar sobre a incerteza da base de dados para análise de riscos abaixo desse
  nível.

  apêndices

  Apêndice A - Avaliação de Faixa de Pista de Pouso e Decolagem

  Apêndice B - Avaliação da Separação de TWY/RWY

  Apêndice C - Avaliação de Áreas de Segurança de Fim de Pista (RESA)

  Apêndice D - Auxílios visuais de cabeceira deslocada

  Apêndice E - Bibliografia Recomendada

  disposições finais

  Os casos omisso serão dirimidos pela ANAC.

  Esta IS entra em vigor na data de sua publicação.


  APÊNDICE A - METODOLOGIA PARA AVALIAÇÃO DE FAIXA DE PISTA DE POUSO E DECOLAGEM

  APLICABILIDADE

  Este apêndice apresenta uma metodologia para a avaliação de faixa de pista de pouso e decolagem
  que pode ser utilizada como guia para análise de risco quando do não atendimento das especificações
  da seção 154.207 do RBAC 154.

  Este guia aplica-se à avaliação de não conformidades associadas aos seguintes requisitos
  da seção 154.207 do RBAC 154: (c) Largura de faixas de pista de pouso e decolagem; (d) Objetos
  em faixas de pista de pouso e decolagem; e (e) Faixa preparada.

  CONTEXTUALIZAÇÃO

  O propósito da faixa de pista pode ser divido em dois aspectos:

  • reduzir o risco de dano a uma aeronave em caso de saída de pista, por meio do provimento
  de uma área nivelada e preparada com capacidade de suporte e declividades longitudinais
  e transversais adequadas para suportar e suavizar o deslocamento da aeronave;

  • proteger uma aeronave no sobrevoo durante o pouso, decolagem ou pouso interrompido, por
  meio do provimento de uma área livre de obstáculos com exceção dos auxílios à navegação
  permitidos pelo regulamento.

  Portanto, a análise de risco de uma situação de não conformidade da faixa de pista deve
  contemplar uma avaliação desses dois aspectos.

  CRITÉRIOS PARA A AVALIAÇÃO DE UMA ANÁLISE DE RISCO

  Apresenta-se, a seguir, critérios para a análise e aceitação de uma análise de risco. Porém,
  a elaboração de uma análise de risco não se resume aos critérios aqui apresentados. Ou seja,
  o operador de aeródromo deve realmente entender a análise de risco como uma ferramenta de
  compreensão da sua operação e uma forma de avaliar melhorias, sejam operacionais ou de infraestrutura.

  Os seguintes critérios foram estabelecidos pela Agência para a avaliação de uma análise
  de risco proposta por um operador de aeródromo:

  TESTE DE REJEIÇÃO

  É um critério que dá indícios que a “exposição ao risco” é inaceitável. Ou seja, caso a
  infraestrutura seja rejeitada no critério, a proposta operacional não seria aceitável a
  não ser que uma avaliação mais robusta ateste que um nível aceitável de segurança operacional
  foi alcançado. No entanto, caso a infraestrutura passe nos testes de rejeição, não é possível
  afirmar apenas por essa avaliação que a operação é aceitável. Visualmente, o Teste de Rejeição
  pode ser entendido de acordo com a Figura 1.


  Figura 1 - Teste de Rejeição

  TESTE DE ACEITAÇÃO

  É um teste mais detalhado que considera características específicas da infraestrutura, meteorologia
  e operações do aeroporto. Caso o cenário operacional proposto passe no teste, a operação
  seria atestada como aceitável de acordo com parâmetros de segurança aceitos pela ANAC. Porém,
  caso o cenário não passe no teste, não se pode necessariamente afirmar que a operação é
  inaceitável (ou seja, pode ser aceito um ALARP - As Low As Reasonably Practicable). Visualmente,
  o Teste de Aceitação pode ser entendido de acordo com a Figura 2.


  Figura 2 - Teste de Aceitação

  TESTES DE REJEIÇÃO

  FAIXA DE PISTA - 154.207(C) E (D)

  Teste de Rejeição nº 1 - Requisito FAA

  O requisito faixa de pista da FAA é menos restritivo que o preconizado pela OACI para os
  códigos 3 e 4 e operações IFR. A norma da FAA (AC 150/5300-13A - “Airport Design”) apresenta
  duas áreas, a RSA (Runway Safety Area) e a ROFA (Runway Obstacle Free Area). Pelas definições
  e especificações da norma, pode-se considerar que estas áreas são compatíveis, respectivamente,
  à faixa preparada e à faixa de pista do RBAC 154.

  Considerando que esse requisito é mais flexível na norma norte-americana que no RBAC 154
  (para a combinação de códigos e operação apresentados na Tabela 1), deve-se diferenciar
  os casos em que a infraestrutura atenda o requisito norte americano e os casos em que nem
  este é atendido. A comparação entre requisitos é apresentada na Tabela 1.


  Tabela 1 - Requisitos de Largura de faixa de pista (medida a partir do eixo) Largura da
  Faixa de Pista OACI FAA OACI (Cód. 3 e 4, IFR) FAA C III 140 M 122 M D IV 140 M 122 M E
  V 140 M 122 M F VI 140 M 122 M

  Caso o aeródromo em avaliação não possua uma largura de faixa de pista que atenda ao requisito
  da FAA, diz-se que que a separação está na região de rejeição, ou seja, o cenário operacional
  foi rejeitado no Teste de Rejeição nº 1.

  Importante destacar que este teste de rejeição só é aplicável para operações de aeronaves
  código 3 ou 4, código C ou superior e operações IFR. Para demais situações, não apresentadas
  na Tabela 1, deve-se verificar na norma da FAA se é possível a aplicação do teste, isto
  é, se a norma da FAA é mais flexível que a norma da ANAC (não foi apresentado aqui toda
  a combinação de códigos, uma vez que não é possível fazer a correlação direta entre os códigos
  da OACI e da FAA).


  Teste de Rejeição nº 2 - Requisito TCCA - Canadá

  O requisito da largura de faixa de pista adotado pelo TCCA (em sua norma TP312 - “Aerodrome
  Standards and Recommended Practices - Land Aerodromes - 5th Edition”) é menos restritivo
  que o preconizado pela OACI. Considerando que esse requisito é mais flexível que o do RBAC
  154, deve-se diferenciar os casos em que a infraestrutura atenda o requisito canadense e
  os casos em que nem este é atendido.

  Como a correlação entre os códigos do TP312 e do RBAC 154 não é simples, isto é, não é válida
  para todas as aeronaves de cada código, a Tabela 2 apresenta apenas o requisito canadense
  (sem fazer a correlação com o requisito do RBAC 154), apresentando também aeronaves típicas
  de cada código.

