  APÊNDICE C - METODOLOGIA PARA AVALIAÇÃO DE ÁREAS DE SEGURANÇA DE FIM DE PISTA (RESA)

  APLICABILIDADE

  Este apêndice apresenta a metodologia para a avaliação de petições de isenção para as Áreas
  de Segurança de Fim de Pista (RESA).

  CONTEXTUALIZAÇÃO

  O RBAC 154 define a Área de Segurança de Fim de Pista (Runway End Safety Área - RESA) como:

  área simétrica ao longo do prolongamento do eixo da pista de pouso e decolagem e adjacente
  ao fim da faixa de pista, utilizada primordialmente para reduzir o risco de danos a aeronaves
  que realizem o toque antes de alcançar a cabeceira (undershoot) ou que ultrapassem acidentalmente
  o fim da pista de pouso e decolagem (overrun).

