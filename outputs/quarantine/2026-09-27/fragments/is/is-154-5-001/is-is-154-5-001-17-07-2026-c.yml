  TESTE DE ACEITAÇÃO

  O operador de aeródromo deve realizar análise de risco considerando o ambiente operacional
  específico de seu aeródromo, isto é, as particularidades da infraestrutura, operações e
  meteorologia.

  Caso o operador de aeródromo avalie com ferramental estatístico robusto a sua operação,
  considerando todos os aspectos supracitados, e comprove que o risco às operações está dentro
  dos parâmetros preconizados nesta IS, o nível de segurança operacional pode ser demonstrado
  como aceitável.

  Uma ferramenta open source para realizar essa análise estatística é o LRSARA - Lateral Runway
  Safety Area Risk Analysis, desenvolvido pelo ACRP - Airport Cooperative Research Program.
  Apesar de não se ter conhecimento se há certificação deste método por algum órgão internacional,
  sabe-se que o modelo é reconhecido por diversas autoridades de aviação civil, especialmente
  pela FAA, patrocinadora do estudo.

  Desta forma, caso o resultado do LRSARA indicar que as probabilidades de ocorrência de LDVO
  (landing veer-off) e TOVO (takeoff veer-off) são inferiores a 1 × 10-7, e que o risco total
  é inferior a 2 × 10-7, diz-se que o cenário operacional considerando as dimensões da faixa
  de pista, presença de objetos e faixa preparada, estão na região de aceitação, ou seja,
  comprovou-se que o cenário operacional foi aceito no Teste de Aceitação.

  Cabe ressaltar que, a rigor, os resultados do LRSARA se aplicam somente à análise de violações
  da faixa preparada, pois esse software foi desenvolvido para ajudar operadores de aeródromo
  norte-americanos a avaliarem o risco associado a violações laterais da RSA.

  Assim, para uma análise mais aprofundada da faixa de pista, faz-se necessário uma análise
  de risco considerando também a função de sobrevoo desta área (pela definição do RBAC 154,
  “Faixa de pista de pouso e decolagem significa a área definida que inclui a pista de pouso
  e decolagem e as zonas de parada, se disponíveis, destinada a reduzir o risco de danos à
  aeronave, caso esta saia dos limites da pista, e proteger aeronaves sobrevoando a pista
  durante pousos e decolagens”).

  Assim, o operador de aeródromo deve avaliar se o risco relativo ao sobrevoo na faixa de
  pista é de fato menor do que o risco relativo à saída de aeronave em solo na faixa de pista.
  Para isto, pode observar o seguinte: o ACRP 51 apresenta ábacos para a estimativa do risco
  de colisão durante o sobrevoo (aproximação perdida) em função da separação das pistas de
  pouso e decolagem e das pistas de táxi paralelas para todos os códigos (na forma como a
  FAA categoriza as aeronaves para fins de projeto de aeródromos).

  Um exemplo destes ábacos é apresentado na Figura 6. Esta referência (ACRP 51) pode ser utilizada
  para avaliar as situações em que o risco relativo ao sobrevoo seja menor que o risco relativo
  à uma saída em solo, de forma que possa ser desconsiderado. Apenas como exemplo, caso se
  conclua que o risco associado ao sobrevoo seja da ordem de 10-9, quando comparado a um risco
  da ordem de 10-7 para as demais situações de perigo, entende-se que o risco relativo ao
  sobrevoo pode ser desconsiderado. Importante destacar que os ábacos apresentados no ACRP
  51 são baseados no CRM (Collision Risk Model) e, desta forma, apresentam apenas resultados
  para operações de precisão CAT I e CAT II. No entanto, há que se considerar que o racional
  da OACI prevê faixas de pista menores para operações menos exigentes e, desta forma, pode-se
  considerar que os resultados apresentados para operações CAT I pelo CRM e ACRP 51 poderiam
  ser usados para operações não-precisão ou não-instrumento. Destaca-se também que a Figura
  6 é apresentada apenas para fins de exemplo, de forma que o operador do aeródromo deve avaliar,
  para a sua realidade operacional, se é possível utilizar algum dos ábacos presentes no ACRP
  51.


  Figura 6 - Exemplo de ábaco apresentado no ACRP 51: Risco de colisão, para uma aproximação
  perdida, operação CAT I e ADG-III e AAC-C (segundo os critérios de classificação da FAA)[2]


  REGIÃO DE RISCO TOLERÁVEL E TEMPO ESPERADO PARA UM ACIDENTE

  Caso o risco de LDVO ou TOVO seja superior ao critério de 1 × 10-7 ou o risco total seja
  superior a 2 × 10-7, não se pode necessariamente afirmar que a operação é insegura. Outro
  parâmetro que deve ser avaliado é o tempo esperado para um acidente. Ou seja, caso o risco
  às operações seja superior ao critério supracitado, deve-se diferenciar aeródromos com volumes
  de movimentação muito diferentes, o que levaria, portanto, a tempos esperados para um acidente
  também muito diferentes.

  Nesse sentido, pode-se aceitar um risco superior ao critério de 1 × 10-7 (LDVO e TOVO) e
  2 × 10-7 (risco total) desde que o tempo esperado para um acidente seja superior a 100 (cem)
  anos, que é um tempo de recorrência suficientemente alto. No LRSARA, quando o tempo esperado
  é maior que 100 anos, o resultado é apresentado apenas como “>100 anos”, não indicando o
  tempo exato em anos.

  Todavia, no caso da isenção pleiteada ser temporária e de curto prazo, é possível aceitar
  riscos superiores ao critério de 1 × 10-7 (LDVO e TOVO) e 2 × 10-7 (risco total) mesmo com
  o tempo esperado para um acidente inferior a 100 (cem) anos, desde que o prazo de vigência
  de isenção seja muito inferior ao tempo esperado para o acidente.

  ANÁLISE DE SENSIBILIDADE

  Ainda para o caso de se obter valor de risco superior ao critério estabelecido, outra avaliação
  que pode ser feita é comparar o risco da operação na infraestrutura existente com o risco
  da operação no caso do atendimento do requisito de dimensões de faixa de pista. Ou ainda
  comparar o risco da operação na infraestrutura existente com o risco da operação no caso
  da adoção de possíveis cenários operacionais após a adoção de medidas mitigadoras (ex.:
  restrição de operação sob determinadas condições meteorológicas). Nesse sentido, far-se-ia
  uma análise de sensibilidade do risco, dado um cenário operacional.

  AVALIAÇÃO DA ANÁLISE DE RISCO

  CONTEÚDO

  Além dos tópicos definidos no item 5.4 desta IS, deve-se responder às seguintes questões
  específicas para a análise do requisito de faixa de pista:

  1. A quais distâncias do eixo da pista de pouso e decolagem estão os obstáculos?

  2. Em quais pontos ao longo da pista de pouso e decolagem estão os obstáculos? Os obstáculos
  se estendem ao longo da pista em ambos os lados? De que natureza são os obstáculos? São
  naturais, edificações, pátio, etc.?

  3. Em que pontos ao longo da pista de pista de pouso e decolagem a faixa preparada é violada?

  4. A quais distâncias do eixo da pista de pouso e decolagem estão as violações da faixa
  preparada?

  5. Considerar o histórico de ocorrências de desvio lateral de aeronaves em procedimento
  de pouso (durante a aproximação perdida) ou decolagem nos aeroportos brasileiros e no aeroporto
  em estudo. Em que pontos as aeronaves pararam?

  6. Considerar o histórico de ocorrências de excursão de pista nos aeroportos brasileiros
  e no aeroporto em estudo. Em que pontos as aeronaves pararam?

  7. Existem ocorrências de wind shear no aeroporto?

  8. Quais os percentuais de operações em cada cabeceira?

  9. Quais os meses do ano (e horas do dia) em que as condições meteorológicas são mais adversas?

  10. Qual o volume de tráfego aéreo no aeroporto?

  DEFESAS E MEDIDAS MITIGADORAS ADICIONAIS

  As defesas existentes e as medidas mitigadoras indicadas ou propostas na análise de risco
  devem estar relacionadas aos procedimentos de aproximação e de decolagem. Eventualmente,
  pode não ser necessária a adoção de medidas mitigadoras tendo em vista a existência de defesas
  que enfrentam os riscos inerentes à operação com obstáculos na faixa de pista.

  Assim, quando há obstáculos na faixa de pista, as defesas existentes ou medidas mitigadoras
  adicionais apropriadas podem ser:

  1. Existência de TWR ou AFIS;

  2. Existência de Estação Meteorológica de Superfície, pelo menos de classe II ou III (EMS-1
  ou EMS-3)[3];

  3. Existência de procedimentos RNAV ou RNP;

  4. Restrições ao tipo de operação (de não precisão para não-instrumento, por exemplo);

  5. Restrição operacional a outros tipos de aeronaves;

  6. Requisitos adicionais para as Especificações Operativas das empresas aéreas que operam
  no aeródromo;

  7. Modificação dos mínimos meteorológicos constantes nos procedimentos (elevação do teto,
  por exemplo);

  8. Redução da componente de vento de través máxima permitida, dependendo das condições da
  pista;

  9. Restrição de pouso com vento de cauda quando a pista estiver contaminada;

  10. Modificação nos procedimentos de aproximação (elevação da MDA ou DH, por exemplo);

  11. Provimento de auxílios visuais adicionais, tais como: pintura da sinalização horizontal
  de zona de toque e instalação de PAPI;

  12. Substituição do VASIS ou T-VASIS por PAPI;

  13. Instalação ou substituição de auxílio à navegação área (NDB, VOR, etc.);

  14. Redução das distâncias declaradas.

  Quando a faixa preparada estiver sendo violada, as defesas existentes ou medidas mitigadoras
  adicionais apropriadas, além das previstas acima, podem ser:

  1. Existência de ranhuras transversais (grooving) no pavimento da pista de pouso e decolagem
  (camada porosa de atrito também é outra importante defesa);

  2. Declividades longitudinal e transversal da pista de pouso e decolagem de acordo com as
  especificações do RBAC 154;

  3. Programa de manutenção das condições de aderência da pista através da medição periódica
  do coeficiente de atrito e da macrotextura e de ações de manutenção corretiva e preventiva
  para garantir que os valores do coeficiente de atrito e macrotextura estejam acima dos mínimos
  definidos no RBAC 153;

  4. Procedimento de monitoramento e divulgação das condições de aderência da pista sob chuva
  condições da pista de pouso e decolagem (conforme Alerta nº 002/2015 e Modelo de Acordo
  disponível na página “Runway Safety” da ANAC);

  5. Programa de manutenção adequado e efetivo para garantir que os auxílios visuais sejam
  mantidos de acordo com o RBAC 154, a fim de promover a acurácia e efetividade da informação
  de localização, do início da cabeceira, do ponto de visada, da zona de toque e do eixo e
  da borda da pista para os pilotos;

  6. Procedimentos para proteção dos auxílios à navegação, quais sejam: ILS, PAPI, NDB, etc.).
  É importante que as áreas críticas do ILS estejam delimitadas e protegidas durante as operações
  de aproximação precisão realizadas dentro dos mínimos meteorológicos definidos para cada
  categoria.

  A partir dos relatórios de acidentes e incidentes de excursão de pista, observa-se que os
  fatores contribuintes não são os mesmos para operações de decolagem e pouso. Por isso, as
  operações de decolagem e pouso podem ser tratadas separadamente[4] . As medidas mitigadoras
  adotadas podem explorar essas diferenças de fatores contribuintes relacionados a cada tipo
  de operação, se pouso ou decolagem.

  É importante atentar para o fato de que as medidas mitigadoras para redução do risco de
  excursão de pista envolvem operadores aéreos, órgão ATS local, operador de aeródromo, pilotos
  e controladores. Por isso, a análise das medidas mitigadoras propostas deve considerar o
  envolvimento de todos os participantes. Para conhecer as principais medidas mitigadoras
  identificadas para redução do risco de excursão de pista, consultar o documento Reducing
  the Risk of Runway Excursions da instituição Flight Safety Foundation.

  Provimento de faixa de pista por redução das distâncias declaradas

  Em alguns casos, a faixa de pista é violada por obstáculos situados a poucos metros das
  extremidades da faixa de pista, principalmente nas proximidades das cabeceiras. A Figura
  7 exibe essa situação.


  Figura 7 - Situação de um obstáculo localizado nas extremidades da faixa de pista


  Nesses casos, uma medida mitigadora aceitável é a redução das distâncias declaradas para
  provimento de uma faixa de pista que atenda aos requisitos do RBAC 154. No entanto, é importante
  observar que deve ser seguido o processo de alteração cadastral, regido pela Resolução ANAC
  n° 158/2010, no qual é necessária a avaliação pelo Comando da Aeronáutica quanto aos assuntos
  de sua competência.

  Para redução das distâncias declaradas, deve-se observar que o propósito da faixa de pista
  que deve ser considerado é: a proteção de aeronaves sobrevoando essa faixa durante as operações
  de pouso, pouso interrompido e decolagem por meio da garantia de uma área livre de obstáculos,
  exceto aqueles auxílios à navegação área permitidos.

  De acordo com o 154.207(b), uma faixa de pista se estende antes da cabeceira e após o fim
  da pista ou da zona de parada (stopway). Assim, para provimento de uma faixa de pista livre
  de obstáculos, pode ser necessário deslocar permanentemente a cabeceira, reduzir ou cancelar
  a zona de parada e até mesmo reduzir a distância disponível para corrida de decolagem.

  Desse modo, deve-se avaliar a necessidade de redução das distâncias declaradas.

  Na situação aludida na Figura 7, a redução das distâncias declaradas deve ser realizada
  conforme a Figura 8 e Figura 9.


  Figura 8 - Redução das distâncias declaradas para as operações na pista 15


  Figura 9 - Redução das distâncias declaradas para as operações na pista 33


  Essa medida mitigadora também pode ser utilizada para situações semelhantes de violação
  da faixa preparada.

  As sinalizações horizontais e luminosas devem estar de acordo com a figura prevista no Anexo
  (Sinalização de cabeceira deslocada).


  RESULTADOS DOS TESTES DE REJEIÇÃO E ACEITAÇÃO

  Caso a operação proposta passe nos testes de rejeição e o operador de aeródromo assuma formalmente
  a responsabilidade quanto à operação pretendida, a aceitação do pedido de isenção condiciona-se
  a:

  1. manifestação formal dos operadores aéreos de concordância com o cenário proposto na análise
  de risco;

  2. existência de algumas das defesas enumeradas no item 8.2;

  3. adoção de algumas medidas mitigadoras adicionais enumeradas no item 8.2.

  Na hipótese em que a operação proposta não passe em pelo menos um dos testes de rejeição,
  porém passe no Teste de Aceitação, a operação pode ser aceita pois existe fundamentação
  estatística robusta atestando que o nível aceitável de segurança operacional está de acordo
  com os parâmetros brasileiros e internacionais (OACI), desde que haja:

  1. manifestação formal dos operadores aéreos de concordância com o cenário proposto na análise
  de risco;

  2. existência de algumas das defesas enumeradas no item 8.2;

  3. adoção de algumas medidas mitigadoras adicionais enumeradas no item 8.2.

  No cenário em que a operação proposta não passe em pelo menos um dos testes de rejeição
  e não passe no teste de aceitação, o operador deve avaliar o estabelecimento de medidas
  adicionais de segurança operacional, quais sejam:

  1. apresentação de avaliação de risco realizada pelos operadores aéreos em que se demonstre
  aceitável o risco das operações, do ponto de vista dos operadores aéreos;

  2. manifestação formal dos operadores aéreos de concordância com o cenário proposto na análise
  de risco;

  3. existência de algumas das defesas enumeradas no item 8.2;

  4. adoção de algumas medidas mitigadoras adicionais enumeradas no item 8.2.

  5. nova análise (teste de aceitação), considerando as medidas anteriores, demonstrando que
  o nível aceitável de segurança operacional está de acordo com os parâmetros brasileiros
  e internacionais (OACI).

  No cenário em que a operação proposta for rejeitada nos Testes de Rejeição e no Teste de
  Aceitação e o operador de aeródromo alegar a impossibilidade de aplicar restrições adicionais
  que elevem o nível de segurança operacional para o aceitável, mas conseguiu elevar o nível
  de segurança operacional através de alguma mitigação (ALARP de “curto prazo”), pode ser
  recomendada uma isenção temporária com um prazo mais curto, possibilitando uma reavaliação
  do cenário operacional com participação do operador de aeródromo e operadores aéreos, a
  fim de se avaliar conjuntamente a questão e propor melhoria da infraestrutura ou restrição
  operacional.

  Critérios mais conservadores são aplicados às operações CAT II e III, onde violações da
  faixa de pista podem ser aceitas somente nos casos em que a operação proposta não puder
  ser rejeitada nos Testes de Rejeição e passe no Teste de Aceitação (região de aceitação).

  CRITÉRIOS PARA ISENÇÃO PERMANENTE OU TEMPORÁRIA E GATILHOS DE REAVALIAÇÃO

  Esta seção visa apresentar critérios para a análise quanto à adequação do tempo da isenção
  peticionada. Ressalva-se que são orientações gerais, devendo-se avaliar as especificidades
  de cada petição de isenção.

  Quando o aeroporto possuir área disponível para adequação da infraestrutura deve ser considerada
  a seguinte lógica:

  a) Caso haja espaço físico para adequação da faixa de pista, sem realocação do pátio de
  aeronaves:

  ✘ Não será aceito pedido de isenção permanente.

  b) Caso haja espaço físico para a construção de um novo sistema de pistas de táxi e pátio
  de aeronaves (por exemplo, nos sítios onde exista espaço desocupado na outra lateral da
  pista de pouso e decolagem):

  ✔ Seria aceitável uma isenção permanente desde que a operação pretendida não tenha sido
  rejeitada nos Testes de Rejeição e passe no Teste de Aceitação.

  ✘ Caso contrário, não será aceito pedido de isenção permanente.

  c) Caso não haja espaço físico para uma adequação.

  ✔ Pode ser aceito pedido de isenção permanente.

  No caso das isenções temporárias, o operador de aeródromo deve assumir compromissos concretos
  para o desenvolvimento futuro do sítio aeroportuário, atualizando, conforme o caso, o Plano
  Diretor (PDIR).

  No caso de isenções permanentes, o operador de aeródromo deve assumir compromissos concretos
  de monitoramento e reavaliações do risco operacional da infraestrutura, considerando que
  o cenário operacional pode mudar ao longo dos anos. Neste caso, apesar da isenção ser permanente,
  pode-se requerer futuramente uma revisão do instrumento formal de acordo operacional, a
  fim de que se garanta o mesmo nível de segurança daquele documento estabelecido quando do
  deferimento da petição de isenção.

  Em qualquer caso, é desejável que o operador de aeródromo preveja critérios para reavaliar
  os cenários operacionais, a fim de verificar a validade das atuais premissas e a implementação
  das medidas propostas para mitigação do risco.

  São considerados critérios adequados, conforme o caso:

  a) a variação percentual da média móvel dos últimos cinco anos da ocorrência de condições
  meteorológicas por instrumento (IMC);

  b) a variação da participação de aeronaves sujeitas a restrições operacionais na partição
  (mix) de tráfego;

  c) decurso de cinco anos após a última reavaliação, entre outros.

  Em resumo, a Figura 10 apresenta o fluxo de referência para a avaliação das análises de
  risco. Conforme destacado no item 1.1, a presente IS “tem por objetivo estabelecer orientações
  e procedimentos para a realização de análises de risco acerca da incompatibilidade da operação
  de aeronaves em infraestruturas aeroportuárias existentes”, motivo pelo qual as considerações
  dos itens 8.3 e 9 são feitas predominantemente para os casos de infraestruturas existentes.
  Mas, é possível que sejam feitos pedidos de isenção para casos de infraestruturas novas
  e/ou operações mais exigentes. O fluxo de referência também contempla esses casos.


  Figura 10 - Fluxo de referência para a avaliação das análises de risco


  APÊNDICE B - METODOLOGIA PARA AVALIAÇÃO DA SEPARAÇÃO DE PISTA DE TÁXI E PISTA DE POUSO E
  DECOLAGEM

  APLICABILIDADE

  Este apêndice apresenta uma metodologia para a avaliação da separação entre pista de táxi
  (TWY) paralela à pista de pouso e decolagem (RWY), em aeródromos existentes que não atendam
  as separações especificadas na Tabela C-5 do RBAC 154, com vistas à garantia da segurança
  operacional.

  CONTEXTUALIZAÇÃO

  O requisito de separação entre o eixo da pista de táxi paralela e o eixo da pista de pouso
  e decolagem (constante da Tabela C-5 do RBAC 154) é definido de forma que a ponta de asa
  da aeronave na pista de táxi não penetre na faixa de pista de pouso e decolagem. Desta forma,
  o requisito prevê que a separação entre os eixos da pista de pouso e decolagem e da pista
  de táxi seja igual à metade da largura da faixa de pista somado à metade da envergadura
  da aeronave na pista de táxi.

  CRITÉRIOS PARA A AVALIAÇÃO DE UMA ANÁLISE DE RISCO

  Apresenta-se, a seguir, critérios para a análise e aceitação de uma análise de risco. Porém,
  a elaboração de uma análise de risco não se resume aos critérios aqui apresentados. Ou seja,
  o operador de aeródromo deve realmente entender a análise de risco como uma ferramenta de
  compreensão da sua operação e uma forma de avaliar melhorias, sejam operacionais ou de infraestrutura.

  Os seguintes critérios foram estabelecidos pela Agência para a avaliação de uma análise
  de risco proposta por um operador de aeródromo:

  TESTE DE REJEIÇÃO

  É um critério que dá indícios que a “exposição ao risco” é inaceitável. Ou seja, caso a
  infraestrutura seja rejeitada no critério, a proposta operacional não seria aceitável a
  não ser que uma avaliação mais robusta ateste que um nível aceitável de segurança operacional
  foi alcançado. No entanto, caso a infraestrutura passe nos testes de rejeição, não é possível
  afirmar apenas por essa avaliação que a operação é aceitável. Visualmente, o Teste de Rejeição
  pode ser entendido de acordo com a Figura 11.


  Figura 11 - Teste de Rejeição

  TESTE DE ACEITAÇÃO

  É um teste mais detalhado que considera características específicas da infraestrutura, meteorologia
  e operações do aeroporto. Caso o cenário operacional proposto passe no teste, a operação
  seria atestada como aceitável de acordo com parâmetros de segurança aceitos pela ANAC. Porém,
  caso o cenário não passe no teste, não se pode necessariamente afirmar que a operação é
  inaceitável (ou seja, pode ser aceito um ALARP - As Low As Reasonably Practicable). Visualmente,
  o Teste de Aceitação pode ser entendido de acordo com a Figura 12.


  Figura 12 - Teste de Aceitação

  TESTES DE REJEIÇÃO

  TESTE DE REJEUÇÃO Nº 1 - RACIONAL OFZ

  Este teste utiliza o conceito da OFZ (Obstacle-Free Zone) para avaliar o risco à colisão
  entre uma aeronave utilizando a pista de pouso e decolagem e uma outra utilizando a pista
  de táxi paralela. O critério consiste em verificar se uma aeronave na pista de táxi paralela
  fere a Superfície de Transição Interna definida no Anexo 14 (Inner Transitional Surface).

  O propósito da Superfície Transição Interna é servir de referência para limitar os obstáculos
  que podem surgir na proximidade da pista de pouso e decolagem, em especial as aeronaves,
  veículos e os auxílios à navegação, estes últimos podem penetrar a superfície desde que
  sejam frangíveis.

  Este racional é utilizado pelo RBAC 154 e Anexo 14 7ª edição (Cap. 4.1 Obstacle Limitation
  Surfaces) para a definição das separações das posições de espera, sendo portanto um limite
  inferior inviolável.

  Para fins de simplificação, o cálculo pode ser feito desconsiderando a diferença de cotas
  entre a pista de pouso e decolagem e a pista de táxi. Para a aeronave B737-800, por exemplo,
  a altura da altura da cauda é 12,6 metros. Desse modo, a pista de táxi deve estar a uma
  distância superior a 60m + 12,6m x 3 = 97,8 metros. A Figura 13 ilustra o critério OFZ.


  Figura 13 - Critério OFZ (Obstacle-Free Zone)

  Caso o cenário operacional em avaliação possua uma separação que não atenda ao critério
  supracitado, diz-se que que a separação está na região de rejeição, ou seja, o cenário operacional
  foi rejeitado no Teste de Rejeição nº 1.

  Apesar desse conjunto de superfícies ser definido para pistas de aproximação precisão, esse
  critério será aplicado também para pista de aproximação não precisão.

  TESTE DE REJEIÇÃO Nº 2 - REQUISITO FAA

  O requisito de separação entre pista de táxi e pista de pouso e decolagem da FAA é menos
  restritivo que o preconizado pela ANAC. Considerando que esse requisito é mais flexível
  que o do RBAC 154, esse critério visa diferenciar os casos em que a infraestrutura atende
  ou não o requisito norte americano. A comparação entre requisitos é apresentada na Tabela
