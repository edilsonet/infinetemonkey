  Figura 14 - Faixa preparada estendida


  Considerando a faixa preparada estendida, o Teste de Rejeição nº 3 consiste em calcular
  a distância máxima que a ponta da asa de uma aeronave chegaria em relação ao eixo da pista
  de pouso e decolagem numa eventual saída de pista onde a borda externa do trem de pouso
  principal se localizasse a 105 metros do eixo da pista de pouso e decolagem.

  Para efeitos de simplificação, o cálculo é feito com uma aeronave fictícia com envergadura
  e bitola iguais aos limites superiores das Tabelas A-1 e C-2 do RBAC 154 considerando o
  código da aeronave que estaria utilizando a pista de pouso e decolagem.

  Por exemplo, para o código E, essa distância seria 105m + 65m/2 (metade de envergadura)
  - 15m/2 (metade do trem de pouso principal) = 130 metros. Desta forma, a ponta da asa de
  uma aeronave na pista de táxi paralela não poderia exceder a distância de 130 metros do
  eixo da pista de pouso e decolagem. No caso de se avaliar a operação também de uma aeronave
  código 4E na pista de táxi, a separação mínima entre eixos TWY/RWY seria 130m + 65m/2 (metade
  de envergadura) = 162,5 metros.

  O resumo das separações mínimas entre eixos TWY/RWY considerando as combinações possíveis
