text: '(e) Fase 5 - Certificação.

  A ANAC realiza a certificação para o transporte de artigos perigosos para cada organização

  requerente, que passa a ser chamada de operador aéreo após a emissão de um COA.Data de emissão:
  17 de março de 2021

  IS nº 175-000

  Revisão B

  Todas as atividades de certificação para o transporte de artigos perigosos serão realizadas

  por organização requerente, independentemente de seu número de bases de operação.

  Cabe ao operador aéreo garantir que suas bases de operação estejam em conformidade com

  os requisitos de artigos perigosos para que possam proceder com a aceitação ou transporte

  de artigos perigosos. Caso uma base não esteja em conformidade com os requisitos exigidos,

  ela não poderá aceitar ou transportar artigos perigosos, mesmo que o operador esteja

  certificado para tais atividades.

  Cabe ao operador aéreo garantir que suas bases de operação estejam em conformidade com

  os requisitos de expedição de COMAT/AOG classificado como artigo perigoso para que

  possam proceder com a expedição deste tipo de material. Caso uma base não esteja em

  conformidade com os requisitos exigidos, ela não poderá expedir COMAT/AOG

  classificado como artigo perigoso, mesmo que o operador esteja certificado para tal

  atividade.

  5.3 Protocolo de documentos e modelos de formulários

  A ANAC somente aceitará documentos protocolados via Sistema Eletrônico de Informações

  (SEI). Portanto, é recomendavel que os funcionários da organização requerente que estejam

  envolvidos em uma ou mais etapas do processo de certificação para o transporte de artigos

  perigosos estejam cadastrados no SEI. Por meio do SEI, é possível enviar documentos,

  receber intimações eletrônicas e verificar o andamento dos processos administrativos.

  Informações sobre o acesso ao SEI estão disponíveis em: https://www.anac.gov.br/acesso-

  a-informacao/protocolo-eletronico/.

  Os modelos de formulários estão disponíveis para o usuário em formato editável no sítio
  da

  ANAC na rede mundial de computadores, no endereço eletrônico:

  https://www.anac.gov.br/assuntos/setor-regulado/empresas/acesso-rapido/modelos-e-

  formularios e também na página da ANAC sobre artigos perigosos

  https://www.anac.gov.br/assuntos/setor-regulado/empresas/artigo-perigoso/.

  Os documentos a serem entregues pela organização requerente seguirão os padrões e

  modelos adotados nas IS nº 119-001 e 119-004, de acordo com o escopo de certificação do

  operador.

  Os documentos específicos para artigos perigosos seguirão os padrões e modelos adotados

  nas IS específicas mencionadas no item 5.1.11.

  5.4 Regime de portais do processo

  O processo de certificação para o transporte de artigos perigosos adotado pela ANAC impõe

  um regime de portais, ou seja, uma fase só pode ser iniciada caso todos os requisitos da
  fase

  anterior tenham sido cumpridos.

  No caso de não-conformidades na documentação apresentada pela organização requerente,

  o processo será sobrestado até a regularização ou até seu encerramento compulsório,

  conforme item 5.11 desta IS.Data de emissão: 17 de março de 2021

  IS nº 175-000

  Revisão B

  Se a organização requerente deixar de cumprir um ou mais requisitos anteriormente

  atendidos que lhe permitiram o prosseguimento de fase, o processo poderá retornar à fase

  anterior até que os referidos requisitos sejam atendidos.

  Caso a organização requerente altere as características do processo de certificação em curso,

  este poderá retornar a fases anteriores e até mesmo ser encerrado para a abertura de um
  novo

  processo de autorização, dependendo da complexidade da alteração.

  5.5 Emolumentos

  As TFAC aplicáveis ao processo de certificação estão previstas no Anexo III da Lei nº

  11.182/2005.

  A geração das respectivas guias de recolhimento da união (GRU) pode ser realizada no sítio

  da ANAC, por meio do seguinte endereço eletrônico:

  https://sistemas.anac.gov.br/gruinternet/ControladorGru?cmd=BuscarAreaInteresse.

  5.6 Fase 1 - Orientação prévia

  Caso a certificação seja para o transporte de artigos perigosos como carga, embora não

  obrigatório, recomenda-se que a organização entre em contato com a ANAC e agende uma

  Reunião de Orientação Prévia - ROP.

  Em casos de certificação inicial, isto é, quando se pleiteia a constituição de um novo

  operador aéreo, a ROP pode tratar de diversos temas, incluindo artigos perigoso, conforme

  IS nº 119-001 ou 119-004. Entretanto, sempre que houver interesse, uma ROP pode ser

  realizada especificamente para tratar sobre artigos perigosos.

  5.7 Fase 2 - Solicitação formal

  A fase 2 consiste na entrega, por parte da organização requerente, dos manuais e programas

  relacionados ao transporte de artigos perigosos.

  Nessa fase, deverão ser encaminhados à ANAC documento contendo as políticas

  procedimentos referentes a artigos perigosos e/ou documento contendo as políticas de

  treinamento de artigos perigosos, conforme o tipo de operação pretendida. Os documentos

  específicos a serem entregues estão listados a seguir e apresentados na Tabela 1.

  Todo operador aéreo regido pelo RBAC n° 121, independentemente da intenção de

  transportar ou não artigos perigosos, deve apresentar:'
