title: preambulo(l)
text: '(l) a equipe de auditoria interna deverá verificar se a organização requerente adquiriu
  sistema

  e possui procedimentos para a emissão de Conhecimento de Transporte Eletrônico (CT-e) e

  Manifesto de Documentos Fiscais Eletrônico (MDF-e) em conformidade com a IS nº 175-

  003;'
