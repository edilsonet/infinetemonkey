cite: preambulo(m)
title: preambulo(m)
text: '(m) caso a organização requerente possua operações em áreas remotas ou em bases não

  regulares (exemplos: operações off-shore, operações em bases sem infraestrutura ou sem

  pessoal de aceitação de artigos perigosos, dentre outros), a equipe de auditoria interna
  deverá

  verificar se o MAP possui procedimentos específicos para tais tipos diferenciados de

  operação. Caso a organização requerente não possua esse tipo de procedimento estabelecido

  em seu MAP, a equipe de auditoria interna deverá relatar isso no documento encaminhado à

  ANAC;'
