title: preambulo(n)
text: '(n) caso a auditoria interna identifique não conformidades ou riscos inaceitáveis,
  a

  organização requerente deverá corrigi-los e uma nova auditoria deverá ser realizada antes
  do

  envio do material à ANAC. Os registros de todas as auditorias internas realizadas e suas

  ações corretivas deverão ser encaminhados à ANAC;'
