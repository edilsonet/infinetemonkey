text: '01.04.2024

  1. OBJETIVO

  1.1 Estabelecer orientações acerca de treinamento de artigos perigosos para pessoal envolvido
  com processos relacionados com o transporte aéreo, incluindo pessoal não diretamente envolvido
  com a operação.

  2. REVOGAÇÃO

  2.1 Esta IS revoga a IS nº 175-002 Revisão I.

  3. FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 Esta IS é fundamentada e objetiva oferecer método de cumprimento para a realização do
  treinamento de artigos perigosos conforme previsto na Subparte B do RBAC nº 175.

  4. REFERÊNCIAS

  4.1 Lei nº 7.565, de 19 de dezembro de 1986, que dispõe sobre o Código Brasileiro de Aeronáutica
  - CBA.

  4.2 Regulamento Brasileiro de Aviação Civil nº 121 - RBAC nº 121.

  4.3 Regulamento Brasileiro de Aviação Civil nº 135 - RBAC nº 135.

  4.4 Regulamento Brasileiro de Aviação Civil nº 175 - RBAC nº 175.

  4.5 Anexo 6 à Convenção sobre Aviação Civil Internacional: Operação de aeronaves - Operation
  of Aircraft.

  4.6 Anexo 18 à Convenção sobre Aviação Civil Internacional: Transporte Seguro de Artigos
  Perigosos por Via Aérea - The Safe Transport of Dangerous Goods by Air.

  4.7 Doc 9284 da Organização da Aviação Civil Internacional - OACI: Instruções Técnicas para
  o Transporte Seguro de Artigos Perigosos por Via Aérea - Technical Instructions for Safe
  Transport of Dangerous Goods by Air.

  4.8 Suplemento ao Doc 9284 da OACI: Instruções Técnicas para o Transporte Seguro de Artigos
  Perigosos por Via Aérea - Suplemento - Technical Instructions for Safe Transport of Dangerous
  Goods by Air - Supplement.

  4.9 Doc 10147 da Organização da Aviação Civil Internacional - OACI: Orientações sobre a
  Abordagem Baseada em Competências para o Treinamento e Avaliação sobre Artigos Perigosos
  - Guidance on a Competency-based Approach to Dangerous Goods Training and Assessment.

  5. DEFINIÇÕES

  5.1 Para os efeitos desta IS, são válidas as definições listadas no RBAC nº 01 e as seguintes
  definições:

  5.1.1 Avaliação de artigos perigosos: determinação, por um avaliador de artigos perigosos,
  se um aluno atende a um padrão de competência requerido a partir de condições definidas,
  coletando-se evidências a partir de comportamentos observáveis.

  5.1.2 Avaliador de artigos perigosos: pessoa física autorizada pelo empregador a conduzir
  as avaliações somativas formais finais do desempenho de um aluno, com objetivo de avaliar
  quais foram as competências adquiridas pelo aluno ao final do treinamento. Deve ser autorizada
  somente pessoa que possua experiência, conhecimento técnico e treinamento válido nas mesmas
  subtarefas que serão avaliadas.

  Nota: o empregador poderá optar por utilizar um instrutor de artigos perigosos para exercer
  a função de avaliador de artigos perigosos.

  5.1.3 Competência: dimensão do desempenho humano utilizada para prever de forma confiável
  o desempenho com sucesso na atividade. Uma competência é manifestada e observada a partir
  de comportamentos que mobilizam os conhecimentos, habilidades e atitudes relevantes para
  desempenhar atividades ou tarefas sob condições especificadas.'
