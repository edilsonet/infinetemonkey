  OBJETIVO

  Estabelecer critérios para o preenchimento completo e adequado do Conhecimento de Transporte
  eletrônico - CT-e, do Conhecimento de Transporte eletrônico Simplificado - CT-e Simplificado,
  do Manifesto de Documentos Fiscais eletrônico - MDF-e e do Documento Eletrônico de Transporte
  - DT-e.

  REVOGAÇÃO

  Esta IS revoga a IS nº 175-003, Revisão E.

  FUNDAMENTOS E REFERÊNCIAS

  A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da Anac.

  O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir nível
  de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar o
  objetivo do procedimento normalizado em IS.

  A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.

  Esta IS também fundamenta-se no RBAC nº 175 e referencia-se nos seguintes documentos:

  Anexo 18 à Convenção sobre Aviação Civil Internacional: Transporte Seguro de Artigos Perigosos
  por Via Aérea - The Safe Transport of Dangerous Goods by Air;

  Doc 9284 da OACI: Instruções Técnicas para o Transporte Seguro de Artigos Perigosos por
  Via Aérea - Technical Instructions for Safe Transport of Dangerous Goods by Air;

  Ajuste SINIEF 09, de 25 de outubro de 2007, que institui o Conhecimento de Transporte eletrônico
  e o Documento Auxiliar do Conhecimento de Transporte eletrônico;

  Ajuste SINIEF 21, de 10 de dezembro de 2010, que institui o Manifesto Eletrônico de Documentos
  Fiscais MDF-e;

  Manual de Orientações do Contribuinte - MOC - do Conhecimento de Transporte eletrônico -
  CT-e; e

  Manual de Orientações do Contribuinte - MOC - do Manifesto de Documentos Fiscais eletrônico
  - MDF-e.

  DEFINIÇÕES

  Para os efeitos desta IS, são válidas as definições listadas nos RBAC nº 01 e 175, na IS
  nº 175-001 e as seguintes definições:

  Conhecimento de Transporte eletrônico - CT-e: documento emitido e armazenado eletronicamente,
  de existência apenas digital, com o intuito de documentar operações e prestações do serviço
  de transporte aéreo doméstico, cuja validade jurídica é garantida por uma assinatura eletrônica
  qualificada do operador aéreo e pela autorização de uso por parte da administração tributária
  da unidade federada do contribuinte, antes da ocorrência do fato gerador.

  Conhecimento de Transporte eletrônico Simplificado - CT-e Simplificado: CT-e emitido de
  maneira simplificada que pode ser utilizado apenas para as prestações de serviços de transporte
  intermunicipal ou interestadual de mercadorias, que podem envolver diversos remetentes ou
  destinatários, mas um único tomador de serviço, quando o operador aéreo poderá emitir, antes
  do início da prestação de serviço de transporte, um único CT-e referente a todas as prestações
  a serem realizadas para este tomador.

  Contrato de transporte aéreo de carga: segundo o CBA, é o ato que obriga o empresário a
  transportar carga, encomenda ou mala postal, por meio de aeronave, mediante pagamento.

  Destinatário: qualquer pessoa, organização ou governo que seja intitulado a receber uma
  remessa, conforme informado na nota fiscal ou no CT-e.

  Documento Eletrônico de Transporte - DT-e: plataforma tecnológica digital que permitirá
  unificar os documentos e as informações de obrigações administrativas exigidas em operações
  de transporte de carga.

  Embarcador: pessoa física ou pessoa jurídica que, por conta própria ou de outrem, mediante
  a celebração do contrato de transporte aéreo, entrega ao operador aéreo a carga para seu
  transporte. No caso desta IS, o embarcador é o remetente e/ou o tomador. Quando houver redespacho,
  subcontratação ou transporte multimodal de cargas, entretanto, o embarcador é o expedidor
  somente se não houver indicação do remetente ou do tomador descrito no CT-e. O embarcador
  é responsável pela exatidão das informações e declarações constantes no CT-e.

  Emitente: o prestador de serviço de transporte que emite o documento fiscal relativo à prestação
  do serviço de transporte.

  Manifesto de carga: o documento operacional, emitido pelo operador aéreo, que resume de
  forma detalhada todos os conhecimentos aéreos para um voo específico em uma determinada
  aeronave. O manifesto de carga internacional é disposto pelo Anexo 9 da Convenção de Aviação
  Civil Internacional.

  Manifesto de Documentos Fiscais eletrônico - MDF-e: o documento emitido e armazenado eletronicamente,
  de existência apenas digital, para vincular os documentos fiscais utilizados na operação
  e/ou prestação, à unidade de carga utilizada no transporte.

  Recebedor: aquele que deve receber a carga do operador aéreo.

  Remetente: a pessoa física ou a pessoa jurídica que promove a saída inicial da carga conforme
  informado na nota fiscal ou no CT-e.

  Tomador: a pessoa que contratualmente é a responsável pelo pagamento do serviço de transporte,
  podendo ser o remetente, o destinatário ou um terceiro interveniente.

  DESENVOLVIMENTO DO ASSUNTO

  Introdução

  Esta IS estabelece o CT-e, o CT-e Simplificado, o MDF-e e o DT-e adotados pela Agência Nacional
  de Aviação Civil - Anac - a serem utilizados no transporte aéreo doméstico de cargas definindo
  as diretrizes para o seu preenchimento.

  A Anac padroniza e torna compulsória a utilização do CT-e e do MDF-e, instituídos nesta
  IS, com a finalidade de evitar contratempos decorrentes de deficiências de dados e de informações
  necessários ao acompanhamento dos bens transportados, bem como ao controle e à fiscalização
  pela Agência.

  O CT-e Simplificado pode, mediante decisão do operador aéreo, ser utilizado em substituição
  ao CT-e.

  Não é permitida a emissão do CT-e Simplificado para o transporte de cargas especiais (animais
  vivos, produtos perecíveis, transporte de valores, restos mortais, dentre outros) e para
  o transporte de artigos perigosos por via aérea.

  Deve ser dada especial atenção ao preenchimento completo e adequado dos documentos, uma
  vez que os dados ali constantes são partes essenciais no contexto do embarque, trânsito
  e desembarque da carga.

  As disposições constantes nesta IS estão limitadas às informações de competência da Anac.
  Informações solicitadas por outros Órgãos e/ou Entidades da Administração Pública devem
  constar no CT-e, no CT-e Simplificado, no MDF-e ou no DT-e, de acordo com regulamentação
  específica daqueles Órgãos e/ou Entidades.

  Do Conhecimento de Transporte eletrônico - CT-e e do Conhecimento de Transporte eletrônico
  Simplificado - CT-e Simplificado

  O CT-e foi desenvolvido, de forma integrada, pelas Secretarias da Fazenda dos Estados -
  SEFAZ -, pela Receita Federal do Brasil, pela Superintendência da Zona Franca de Manaus
  - SUFRAMA -, pelos representantes das transportadoras e pelas Agências Reguladoras do segmento
  de transporte, dentre elas a Anac.

  O CT-e do modo aéreo substituiu o modelo de conhecimento aéreo doméstico tradicionalmente
  emitido em papel, aumentando a confiança, controle e fiscalização do transporte aéreo de
  carga, especialmente no transporte aéreo de artigos perigosos.

  O CT-e Simplificado foi criado com objetivo de otimizar e agilizar a emissão de documentos
  fiscais que possuam diversos remetentes ou destinatários, quando passa a ser permitida a
  emissão de um único documento para acobertar o transporte de um único tomador de serviço.

  A Anac adota os modelos eletrônicos e padronizados do CT-e e do CT-e Simplificado do modo
  aéreo como documentos legais que evidenciam o contrato de transporte aéreo doméstico de
  acordo com o CBA.

  Conforme determina o CBA e para fins das atribuições da Anac, o CT-e deve ser emitido pelos
  operadores aéreos regidos pelos RBAC nº 121 e 135 ou por outros operadores aéreos que transportem
  carga, mala postal ou encomenda, mediante pagamento, por meio de aeronave.

  Conforme determina o parágrafo 175.263(a) do RBAC nº 175, o conhecimento aéreo, tratado
  nesta IS como CT-e, deve ser emitido em todo transporte de company material - COMAT - ou
  aircraft on ground - AOG - que seja classificado como artigo perigoso.

  De acordo com suas atribuições legais, outros Órgãos da Administração Pública podem determinar
  ou permitir que outras empresas, reguladas ou não pela Anac, emitam o CT-e ou o CT-e Simplificado
  para o modo aéreo. No entanto, esse documento não possui validade perante esta IS, devendo
  o CT-e ou o CT-e Simplificado serem emitidos pelo operador aéreo.

  O operador aéreo deve emitir o CT-e ou o CT-e Simplificado de acordo com o disposto nesta
  IS e no Manual de Orientações do Contribuinte - MOC - do CT-e, publicado pelo Encontro Nacional
  de Coordenadores e Administradores Tributários Estaduais - ENCAT - e disponível no endereço
  eletrônico www.cte.fazenda.gov.br.

  O operador aéreo deve emitir o CT-e ou CT-e Simplificado com base nas informações apresentadas
  pelo embarcador presentes em todos documentos que acompanham a carga, principalmente nas
  notas fiscais e nos documentos relacionados às cargas especiais.

  A emissão do CT-e ou do CT-e Simplificado para o modo aéreo baseada apenas no CT-e ou CT-e
  Simplificado anterior ao modo aéreo pode gerar ausência de informações obrigatórias, acarretando
  riscos à segurança do voo.

  Por decisão e responsabilidade do operador aéreo, o embarcador poderá informar eletronicamente
  os dados referentes à carga e ao transporte para que o operador aéreo emita o CT-e ou o
  CT-e Simplificado. O operador aéreo deverá, nesse caso, prover ao embarcador todas as ferramentas
  necessárias.

  É de responsabilidade do operador aéreo verificar se os dados informados eletronicamente
  pelo embarcador estão de acordo com os demais documentos que acompanham a carga antes da
  emissão do CT-e ou do CT-e Simplificado.

  É de responsabilidade do operador aéreo verificar se os dados informados eletronicamente
  pelo embarcador estão completos conforme determina esta IS, antes da emissão do CT-e ou
  do CT-e Simplificado.

  O embarcador deve obedecer aos demais regulamentos aplicáveis ao transporte e observar,
  em especial, as regras relativas ao transporte aéreo de artigos perigosos.

  Para acobertar a prestação de serviço de transporte aéreo doméstico pode ser impressa uma
  representação gráfica simplificada do CT-e ou do CT-e Simplificado, intitulada Documento
  Auxiliar do Conhecimento de Transporte Eletrônico - DACTE -, em papel comum conforme determina
  o MOC do CT-e (ou documento equivalente para o CT-e Simplificado).

  O DACTE poderá também ser apresentado em meio eletrônico, seguindo a disposição gráfica
  especificada no MOC do CT-e (ou documento equivalente para o CT-e Simplificado)o, desde
  que tenha sido emitido o MDF-e de acordo com os itens 5.4 e 5.5 desta IS.

  Caso o operador aéreo opte por não imprimir o DACTE nos termos do item 5.2.16, este deverá
  garantir que haja rastreabilidade entre cada volume ou sobreembalagem e os seus respectivos
  CT-e, CT-e Simplificados e DACTE do modal aéreo. Isso pode ser realizado por diversos meios,
  como, por exemplo:

  a) o uso de marcação legível em cada volume contendo a chave de acesso do CT-e ou do CT-e
  Simplificado;

  b) o uso de marcação legível em cada volume contendo o número operacional do conhecimento
  aéreo; ou

  c) o uso de marcação legível em cada volume contendo código de barras ou código QR que permita
  o acesso ao CT-e ou ao CT-e Simplificado.

  Nota: a lista acima não é exaustiva. Cabe ao operador aéreo apresentar os procedimentos
  de marcação em seu MAP ou MGO, conforme aplicável, de acordo com as instruções da IS nº
  175-006.

  No caso descrito em 5.2.16 e 5.2.17, o operador aéreo deverá ser capaz de prover a informação
  em tempo hábil, caso solicitado pela Anac.

  O DACTE não é o CT-e ou CT-e Simplificado, nem os substitui, servindo apenas como instrumento
  auxiliar para o transporte da carga e para a consulta ao CT-e ou ao CT-e Simplificado por
  meio da chave de acesso numérica ali impressa. Permite ao detentor do documento confirmar
  a efetiva existência do CT-e ou do CT-e Simplificado, por meio dos sítios das SEFAZ autorizadoras
  ou Receita Federal do Brasil, além de visualizar algumas informações importantes para o
  modo aéreo.

  A informação preenchida no DACTE deve ser um retrato fiel da informação que consta no CT-e
  ou no CT-e Simplificado, de modo que, ao se observar um mesmo campo no CT-e ou no CT-e Simplificado
  e em seu DACTE, o conteúdo deverá ser idêntico.

  Caso se verifique algum erro de preenchimento na emissão do CT-e ou do CT-e Simplificado,
  ele deverá ser corrigido de acordo com o disposto no MOC do CT-e ou documento equivalente
  para o CT-e Simplificado, conforme aplicável.

  O CT-e ou CT-e Simplificado e o DACTE devem estar à disposição da Anac sempre que solicitados.

  Do preenchimento do CT-e

  As informações para preenchimento presentes no MOC do CT-e são oriundas das necessidades
  de diversos Órgãos Públicos em conjunto com os operadores aéreos.

  Para fins de fiscalização e controle da Anac, seguem abaixo os grupos de informações que
  devem ser preenchidos corretamente e de forma completa, conforme orientação do MOC do CT-e
  e do disposto nesta IS:

  a) versão do leiaute;

  b) identificador da tag a ser assinada;

  c) identificação do CT-e, exceto: Código Fiscal de Operações e Prestações - CFOP; identificador
  do processo de emissão do CT-e; versão do processo de emissão; código do município de envio
  do CT-e (de onde o documento foi transmitido); nome do município de envio do CT-e (de onde
  o documento foi transmitido); e sigla da UF de envio do CT-e (de onde o documento foi transmitido);

  d) dados complementares do CT-e para fins operacionais ou comerciais;

  e) identificação do emitente do CT-e, o qual deverá ser o operador aéreo;

  f) informações do remetente das mercadorias transportadas pelo CT-e, exceto as seguintes
  informações das notas fiscais: valor da base de cálculo do ICMS; valor total do ICMS; valor
  da base de cálculo do ICMS ST, valor total do ICMS ST; CFOP predominante; e PIN SUFRAMA;

  g) informações do expedidor da carga;

  h) informações do recebedor da carga;

  i) informações do destinatário do CT-e, exceto: inscrição na SUFRAMA;

  j) valores da prestação de serviço;

  k) grupo de informações do CT-e normal e substituto, exceto: informações dos veículos transportados;

  l) detalhamento do CT-e complementado, exceto: informações relativas aos impostos complementados;

  m) autorizados para download do XML do DF-e, e

  n) informações do aéreo.

  As informações dispostas no item 5.3.2 referem-se apenas ao conteúdo de atribuição legal
  da Anac. As informações não contempladas nesse item devem ser preenchidas de acordo com
  o MOC do CT-e e o disposto nos regulamentos dos Órgãos Públicos competentes.

  Nos itens seguintes, encontram-se os critérios gerais para o preenchimento de forma completa
  e adequada do CT-e. Ressalta-se que não é objetivo desta IS explicar o preenchimento de
  cada campo do CT-e, visto que isso já é detalhado no MOC do CT-e. Os termos que se encontram
  entre aspas representam o nome exato do campo de acordo com o MOC do CT-e.

  Na “identificação do CT-e”, deve-se indicar no campo “modal” que o CT-e é do modo aéreo.

  Ainda na “identificação do CT-e”, deve-se informar se o recebedor retirará a carga no aeroporto
  no campo “indicador se o recebedor retira no aeroporto, filial, porto ou estação de destino?”,
  podendo indicar os dados de quem irá retirar ou o local onde será entregue no campo “detalhes
  do retira”.

  As informações do emitente, do remetente, do expedidor, do recebedor, do destinatário e
  do tomador, quando aplicáveis, devem estar o mais completas possível, incluindo, no mínimo:
  o CNPJ e a razão social ou o CPF e o nome; o endereço completo; o telefone e o e-mail para
  contato.

  As informações referentes à “previsão do fluxo da carga”, que se encontram no grupo “dados
  complementares do CT-e para fins operacionais ou comerciais”, são de preenchimento obrigatório.
  Para indicar o aeroporto de origem, de passagem e de destino, deve-se preencher da seguinte
  forma:

  a) completar com a sigla de três dígitos da International Air Transport Association - IATA;

  b) quando não existir a sigla IATA, deve-se completar com a sigla de quatro dígitos da Organização
  da Aviação Civil Internacional - OACI;

  c) não existindo as siglas IATA ou OACI, o operador aéreo deve preencher com ZZZZ e indicar
  o local exato no campo “observações gerais”; e

  d) é proibido escrever o nome do aeroporto por extenso.

  Os campos relacionados à “entrega sem data definida”, que também se encontram no grupo “Dados
  complementares do CT-e para fins operacionais ou comerciais”, são de preenchimento proibido
  para o modo aéreo.

  Os campos relacionados ao grupo “valores da prestação de serviço” devem conter a maior quantidade
  de informações possíveis.

  O “produto predominante” do CT-e, que consta no “grupo de informações do CT-e normal e substituto”,
  deve ser, sempre que possível, o mesmo descrito na nota fiscal, representando exatamente
  o que está sendo transportado.

  a) Deve-se sempre ter como objetivo descrever o conteúdo da carga transportada, por isso
  nomes genéricos não podem ser utilizados.

  b) Ressalta-se que não há necessidade de especificar marca dos produtos ou mesmo produtos
  similares, por exemplo: uma nota fiscal que tenha sapatos, sandálias e tênis, o produto
  predominante pode ser considerado como calçado; o transporte de panfletos, etiquetas e impressões,
  pode ser considerado como documentos.

  c) Sempre que houver algum produto transportado que possa gerar algum risco para a operação
  da aeronave ele deve ser considerado como produto predominante e deve ser devidamente especificado.
  Havendo carga que contenha artigo perigoso, carga perecível, animal vivo, carga de valor
  ou restos mortais, esses deverão sempre ser considerados como o produto predominante do
  CT-e.

  d) Quando houver consolidação de carga, não houver nota fiscal, não houver declaração de
  conteúdo ou não for possível determinar um produto predominante, deve-se colocar o seguinte
  texto no campo “produto predominante”: especificado no campo observação. Nesse caso, obrigatoriamente,
  deve constar, no campo “observações gerais”, a descrição sucinta, porém precisa, da carga.

  e) Quando se tratar de transporte de material do próprio operador aéreo, seja COMAT ou AOG,
  também conhecido como carga própria, deve-se descrever o produto transportado no campo “produto
  predominante”. Não são aceitos os termos COMAT, manutenção, AOG, material aeronáutico ou
  qualquer outro termo que não seja a descrição do conteúdo. Quando se tratar de material
  de manutenção de aeronave, além do termo correto no campo “produto predominante”, deve-se
  indicar o Part Number - PN -, no campo “observações gerais”, seguido do nome completo do
  produto.

  f) Independentemente do que esteja escrito no documento originário - minuta de transporte
  ou outro CT-e -, cabe ao operador aéreo verificar o conteúdo do produto na nota fiscal e
  nos outros documentos entregues pelo embarcador junto à carga.

  g) Se suspeitar de conter artigo perigoso em algum volume, com o objetivo de prevenir a
  falsa declaração de conteúdo, o funcionário responsável pela aceitação da carga deve solicitar
  ao embarcador a confirmação deste conteúdo, esclarecendo ser ele, o embarcador, o responsável
  pela exatidão das informações e declarações constantes no CT-e.

  O campo “outras características da carga”, presente no “grupo de informações do CT-e normal
  e substituto”, caso haja transporte de artigos perigosos na remessa, deve ser preenchido
  apenas com os dizeres “Artigo Perigoso”. Caso não haja artigos perigosos na remessa, podem-se
  informar nomes genéricos, como por exemplo: COMAT; carga consolidada; partes e peças; perecível;
  material de escritório; medicamentos; produto farmacêutico; AOG; carga refrigerada; material
  para exame; produto industrializado; material de consumo; peças de automóveis etc.

  Ainda no “grupo de informações do CT-e normal e substituto”, os campos referentes ao grupo
  “informações de quantidades da carga do CT-e” devem ser preenchidos conforme o disposto
  abaixo:

  a) o peso bruto é de preenchimento obrigatório e deve sempre estar em quilogramas;

  b) o peso cubado não é de preenchimento obrigatório, mas quando informado deve sempre estar
  em quilogramas. O peso cubado representa o equivalente em quilos de um determinado espaço
  ocupado por um volume. Para o cálculo, deve-se seguir a seguinte equação:


  c) a quantidade de volumes é de preenchimento obrigatório e deve sempre estar em unidades;
  e

  d) a cubagem pode ser preenchida quando não for possível indicar as dimensões do volume
  e deve sempre estar em metros cúbicos.

  Quando o transporte ocorrer por meio de contêineres ou dispositivos de carga unitizada (unit
  load device - ULD), deve-se indicar a sua referência nos campos “informações das unidades
  de carga (containeres/ULD/outros)” que se encontra no “grupo de informações do CT-e normal
  e substituto”. Quando não for possível definir se a carga será transportada por meio de
  contêineres ou ULD no momento de emissão do CT-e, esse campo não deverá ser preenchido.

  Deve-se preencher o grupo “informações do modal” no “grupo de informações do CT-e normal
  e substituto” de forma completa e atualizada para o modo aéreo.

  A Anac, por suas atribuições dispostas na Lei nº 11.182, de 27 de setembro de 2005, deve
  ter acesso a qualquer CT-e emitido para o modo aéreo. Portanto, no campo “CNPJ do autorizado”,
  do grupo “Autorizados para download do XML do DF-e” deverá ser inserido o CNPJ da Anac:
  07.947.821/0001-89, preenchido conforme orientado no MOC do CT-e.

  O não preenchimento do campo mencionado em 5.3.16 configura obstrução à fiscalização, passível
  de sanção nos termos do regulamento específico.

  Assim como para todos os outros modos de transporte, há um grupo de informações específico
  de preenchimento do CT-e para o modo aéreo. Nos itens abaixo, encontram-se as instruções
  para o seu preenchimento adequado e de forma completa.

  O “número da minuta” é para se preencher com o documento que precede o CT-e (espécie de
  pedido de serviço). Esse campo não é de preenchimento obrigatório.

  O “número operacional do conhecimento aéreo” representa o número de controle comumente utilizado
  pelo conhecimento aéreo composto por uma sequência numérica de onze dígitos. Os três primeiros
  dígitos representam um código que os operadores aéreos associados à IATA possuem. Em seguida
  um número de série de sete dígitos determinados pelo operador aéreo. Para finalizar, um
  dígito verificador, que é um sistema de módulo sete imponderado o qual divide o número de
  série do conhecimento aéreo por sete e usa o resto como dígito de verificação.

  a) O CT-e possui um número próprio de controle que não é o disposto neste item, portanto,
  operadores aéreos que somente utilizam esse número, não precisam preencher este campo.

  b) Operadores aéreos que utilizam o padrão de numeração do conhecimento aéreo composto de
  onze dígitos devem, obrigatoriamente, preencher esse campo. O preenchimento eletrônico deve
  ser apenas com números, sem espaços ou símbolos. Para a visualização no DACTE, entretanto,
  deve-se separar com hífen o código de três dígitos do operador aéreo e a numeração sequencial.
  Essa última, por sua vez, deve ser representada no DACTE com um espaço entre os quatro primeiros
  dígitos e os três últimos acrescidos do dígito verificador.

  c) Não são permitidos truncamentos do número operacional do conhecimento aéreo, ou seja,
  o número inserido no sistema deve conter apenas os 11 dígitos, de maneira que todos esses
  dígitos sejam incluídos no CT-e.

  A “data prevista da entrega” é um campo de preenchimento obrigatório, conforme disposto
  no CBA.

  O grupo de informações referentes à “natureza da carga” possui dois campos. A “dimensão”
  é o primeiro campo e deve ser preenchido quando for necessário. As dimensões permitem avaliar
  a acessibilidade dos volumes pelas portas dos compartimentos de carga das aeronaves, facilitar
  seu manuseio e sua acomodação em posição ideal às características do conteúdo transportado.
  A unidade é padronizada em centímetros e deve ser preenchido da seguinte forma: ComprimentoxLarguraxAltura,
  evitando colocar espaço entre as medidas e o x. Exemplos: 42x35x15; 1045x500x250.

  O segundo campo do grupo de informações referentes à “natureza da carga” refere-se às “informações
  de manuseio”. Deve ser preenchido sempre que houver a necessidade de constar no CT-e alguma
  informação operacional ou solicitada por regulamento ou procedimento específico. Esse campo
  deve conter quantas informações forem necessárias. Cada numeral significa o seguinte:

  a) 1 - certificado do expedidor para embarque de animal vivo;

  b) 2 - artigo perigoso conforme declaração do expedidor anexa;

  c) 3 - somente em aeronave de carga;

  d) 4 - artigo perigoso - declaração do expedidor não requerida;

  e) 5 - artigo perigoso em quantidade excetuada;

  f) 6 - gelo seco para refrigeração. Nesse caso, deve-se especificar no campo observações
  a quantidade transportada em quilos;

  g) 7 - não restrito. Nesse caso, deve-se especificar a Provisão Especial no campo observações;

  h) 8 - artigo perigoso em carga consolidada. Nesse caso, deve-se especificar a quantidade
  no campo observações;

  i) 9 - autorização da autoridade governamental anexa. Nesse caso, deve-se especificar no
  campo observações;

  j) 10 - baterias de íons de lítio em conformidade com a Seção II da PI965 - CAO;

  k) 11 - baterias de íons de lítio em conformidade com a Seção II da PI966;

  l) 12 - baterias de íons de lítio em conformidade com a Seção II da PI967;

  m) 13 - baterias de metal lítio em conformidade com a Seção II da PI968 - CAO;

  n) 14 - baterias de metal lítio em conformidade com a Seção II da PI969;

  o) 15 - baterias de metal lítio em conformidade com a Seção II da PI970; ou

  p) 99 - outro. Nesse caso, deve-se especificar no campo observações.

  O preenchimento do campo descrito em 5.3.23 ocorre de forma numérica no CT-e; entretanto,
  o DACTE deve ser impresso com o texto completo. O texto completo deve estar disposto no
  campo observações ou outro local adequado de acordo com a necessidade do operador aéreo.

  O grupo de “informações de tarifa” é composto por três campos. O primeiro é para referenciar
  qual é a “classe” da tarifa, a qual deve ser prenchida da seguinte forma:

  a) M para tarifa mínima. Corresponde ao valor mínimo a ser cobrado para a expedição de uma
  carga, independentemente do volume ou do peso;

  b) G para tarifa geral. Aplicada sempre com base no peso, em quilos, da mercadoria quando
  não houver uma tarifa específica e quando não se aplicar a tarifa mínima; e

  c) E para tarifa específica.

  O segundo campo do grupo de “informações de tarifa” refere-se ao código da tarifa. Quando
  se tratar de tarifa específica, deve-se indicar o respectivo código numérico.

  O terceiro e último campo do grupo de “informações de tarifa” refere-se ao “valor da tarifa”.
  Nesse caso, deve-se colocar o valor aplicado a ela. Ressalta-se que esse campo não é o valor
  total do frete, ele representa o valor da tarifa aplicada, que pode, por sua vez, coincidir
  com o valor total do frete cobrado. Deve ser preenchida da seguinte forma:

  a) informar o valor total quando se tratar de um valor fixo cobrado; e

  b) informar o valor por quilo quando se tratar de um valor cobrado por quilo.

  O grupo “preenchido quando for transporte de produtos classificados pela ONU como perigosos”
  deve obrigatoriamente ser preenchido quando houver o transporte de artigos perigosos pelo
  modo aéreo conforme o disposto abaixo. Deve ser de acordo com a Tabela C-1 da IS nº 175-001.
  Ressalta-se que esse preenchimento não desobriga a emissão dos demais documentos de transporte
  de artigos perigosos exigidos pelo RBAC nº 175 e pela IS nº 175-001.

  a) O campo “Número ONU/UN” é de preenchimento obrigatório com o número das Organizações
  das Nações Unidas - UN - ou o número de identificação provisório - ID - de quatro dígitos.

  b) O campo “Quantidade total de volumes contendo artigos perigosos” é de preenchimento obrigatório
  e deve indicar o número de volumes de artigos perigosos, ou seja, cada embalagem devidamente
  marcada e etiquetada (por ex.: número de caixas, de tambores, de bombonas, dentre outros).
  Esse campo não deve ser preenchido com o número de ULD, páletes ou contêineres.

  c) O campo “Quantidade total de artigos perigosos”, presente no grupo “Grupo de informações
  das quantidades totais de artigos perigosos”, deve indicar a quantidade total do artigo
  perigoso, tendo como base a unidade referenciada na Tabela C-1 da IS nº 175-001, por exemplo:
  litros; quilogramas; quilograma bruto etc. O preenchimento não pode, entretanto, incluir
  a unidade de medida. No caso de transporte de material radioativo, deve-se indicar o somatório
  dos Índices de Transporte (TI). Não é necessário indicar a quantidade do artigo perigoso
  por volume.

  d) O campo “Unidade de medida”, presente no grupo “Grupo de informações das quantidades
  totais de artigos perigosos”, deve indicar a unidade de medida utilizada no campo “Quantidade
  total de artigos perigosos”. O preenchimento do CT-e ocorre de forma numérica. Cada numeral
  significa o seguinte: 1 - KG; 2 - KG G (quilograma bruto); 3 - LITROS; 4 - TI (índice de
  transporte para radioativos); 5- Unidades (apenas para artigos perigosos medidos em unidades
  que não se enquadram nos itens acima. Exemplo: baterias, celulares, equipamentos, veículos,
  dentre outros).

  Do preenchimento do CT-e Simplificado

  As informações para preenchimento presentes no MOC (ou documento equivalente) do CT-e Simplificado
  são oriundas das necessidades de diversos Órgãos Públicos em conjunto com os operadores
  aéreos.

  Para fins de fiscalização e controle da Anac, seguem abaixo os grupos de informações que
  devem ser preenchidos corretamente e de forma completa, conforme orientação do MOC (ou documento
  equivalente) do CT-e Simplificado e do disposto nesta IS:

  a) versão do leiaute;

  b) identificador da tag a ser assinada;

  c) identificação do CT-e, exceto: Código Fiscal de Operações e Prestações - CFOP; identificador
  do processo de emissão do CT-e; versão do processo de emissão; código do município de envio
  do CT-e (de onde o documento foi transmitido); nome do município de envio do CT-e (de onde
  o documento foi transmitido); e sigla da UF de envio do CT-e (de onde o documento foi transmitido);

  d) dados complementares do CT-e para fins operacionais ou comerciais;

  e) identificação do emitente do CT-e, o qual deverá ser o operador aéreo;

  f) informações da carga do CT-e;

  g) detalhamento das entregas / prestações do

  h) CT-e Simplificado,

  i) informações do modal;

  j) informações do CT-e de substituição;

  k) valores totais do CT-e;

  l) autorizados para download do XML do CT-e; e

  m) informações do aéreo.

  As informações dispostas no item 5.4.2 referem-se apenas ao conteúdo de atribuição legal
  da Anac. As informações não contempladas nesse item devem ser preenchidas de acordo com
  o MOC (ou documento equivalente) do CT-e Simplificado e o disposto nos regulamentos dos
  Órgãos Públicos competentes.

  Nos itens seguintes, encontram-se os critérios gerais para o preenchimento de forma completa
  e adequada do CT-e Simplificado. Ressalta-se que não é objetivo desta IS explicar o preenchimento
  de cada campo do CT-e Simplificado, visto que isso já é detalhado no MOC do CT-e. Os termos
  que se encontram entre aspas representam o nome exato do campo de acordo com o MOC (ou documento
  equivalente) do CT-e Simplificado.

  Na “identificação do CT-e”, deve-se indicar no campo “modal” que o CT-e Simplificado é do
  modo aéreo.

  Ainda na “identificação do CT-e”, deve-se informar se o recebedor retirará a carga no aeroporto
  no campo “indicador se o recebedor retira no aeroporto, filial, porto ou estação de destino?”,
  podendo indicar os dados de quem irá retirar ou o local onde será entregue no campo “detalhes
  do retira”.

  As informações do emitente e do tomador, quando aplicáveis, devem estar, no mínimo: o CNPJ
  e a razão social ou o CPF e o nome; o endereço completo; o telefone e o e-mail para contato.

  As informações referentes à “previsão do fluxo da carga”, que se encontram no grupo “dados
  complementares do CT-e para fins operacionais ou comerciais”, são de preenchimento obrigatório.
  Para indicar o aeroporto de origem, de passagem e de destino, deve-se preencher da seguinte
  forma:

  a) completar com a sigla de três dígitos da International Air Transport Association - IATA;

  b) quando não existir a sigla IATA, deve-se completar com a sigla de quatro dígitos da Organização
  da Aviação Civil Internacional - OACI;

  c) não existindo as siglas IATA ou OACI, o operador aéreo deve preencher com ZZZZ e indicar
  o local exato no campo “observações gerais”; e

  d) é proibido escrever o nome do aeroporto por extenso.

  O campo “valor da prestação de serviço”, que se encontra no grupo “detalhamento das entregas
  / prestações do CT-e simplificado” deve ser preenchido.

  O “produto predominante” do CT-e Simplificado, que consta no “informações da carga do CT-e”,
  deve ser, sempre que possível, o mesmo descrito na nota fiscal, representando exatamente
  o que está sendo transportado.

  a) Deve-se sempre ter como objetivo descrever o conteúdo da carga transportada, por isso
  nomes genéricos não podem ser utilizados.

  b) Ressalta-se que não há necessidade de especificar marca dos produtos ou mesmo produtos
  similares, por exemplo: uma nota fiscal que tenha sapatos, sandálias e tênis, o produto
  predominante pode ser considerado como calçado; o transporte de panfletos, etiquetas e impressões,
  pode ser considerado como documentos.

  c) Quando houver consolidação de carga, não houver nota fiscal, não houver declaração de
  conteúdo ou não for possível determinar um produto predominante, deve-se colocar o seguinte
  texto no campo “produto predominante”: especificado no campo observação. Nesse caso, obrigatoriamente,
  deve constar, no campo “observações gerais”, a descrição sucinta, porém precisa, da carga.

  d) Quando se tratar de transporte de material do próprio operador aéreo, seja COMAT ou AOG,
  também conhecido como carga própria, deve-se descrever o produto transportado no campo “produto
  predominante”. Não são aceitos os termos COMAT, manutenção, AOG, material aeronáutico ou
  qualquer outro termo que não seja a descrição do conteúdo. Quando se tratar de material
  de manutenção de aeronave, além do termo correto no campo “produto predominante”, deve-se
  indicar o Part Number - PN -, no campo “observações gerais”, seguido do nome completo do
  produto.

  e) Independentemente do que esteja escrito no documento originário - minuta de transporte
  ou outro CT-e -, cabe ao operador aéreo verificar o conteúdo do produto na nota fiscal e
  nos outros documentos entregues pelo embarcador junto à carga.

  f) Se suspeitar de conter artigo perigoso em algum volume, com o objetivo de prevenir a
  falsa declaração de conteúdo, o funcionário responsável pela aceitação da carga deve solicitar
  ao embarcador a confirmação deste conteúdo, esclarecendo ser ele, o embarcador, o responsável
  pela exatidão das informações e declarações constantes no CT-e.

  O campo “outras características da carga”, presente no grupo “informações da carga do CT-e”
  pode informar nomes genéricos, como por exemplo: COMAT; carga consolidada; partes e peças;
  perecível; material de escritório; medicamentos; produto farmacêutico; AOG; carga refrigerada;
  material para exame; produto industrializado; material de consumo; peças de automóveis etc.

  Ainda no grupo “informações da carga do CT-e”, os campos referentes ao grupo “informações
  de quantidades da carga do CT-e” devem ser preenchidos conforme o disposto abaixo:

  a) o peso bruto é de preenchimento obrigatório e deve sempre estar em quilogramas;

  b) o peso cubado não é de preenchimento obrigatório, mas quando informado deve sempre estar
  em quilogramas. O peso cubado representa o equivalente em quilos de um determinado espaço
  ocupado por um volume. Para o cálculo, deve-se seguir a seguinte equação:


  c) a quantidade de volumes é de preenchimento obrigatório e deve sempre estar em unidades;
  e

  d) a cubagem pode ser preenchida quando não for possível indicar as dimensões do volume
  e deve sempre estar em metros cúbicos.

  Quando o transporte ocorrer por meio de contêineres ou dispositivos de carga unitizada (unit
  load device - ULD), deve-se indicar a sua referência nos campos “informações das unidades
  de carga (containeres/ULD/outros)” que se encontram no grupo “detalhamento das entregas
  / prestações do CT-e simplificado”. Quando não for possível definir se a carga será transportada
  por meio de contêineres ou ULD no momento de emissão do CT-e, esse campo não deverá ser
  preenchido.

  Deve-se preencher o grupo “informações do modal” no grupo “informações da carga do CT-e”
  de forma completa e atualizada para o modo aéreo.

  A Anac, por suas atribuições dispostas na Lei nº 11.182, de 27 de setembro de 2005, deve
  ter acesso a qualquer CT-e Simplificado emitido para o modo aéreo. Portanto, no campo “CNPJ
  do autorizado”, do grupo “Autorizados para download do XML do DF-e” deverá ser inserido
  o CNPJ da Anac: 07.947.821/0001-89, preenchido conforme orientado no MOC (ou documento equivalente)
  do CT-e Simplificado.

  O não preenchimento do campo mencionado em 5.4.15 configura obstrução à fiscalização, passível
  de sanção nos termos do regulamento específico.

  Assim como para todos os outros modos de transporte, há um grupo de informações específico
  de preenchimento do CT-e Simplificado para o modo aéreo. Nos itens abaixo, encontram-se
  as instruções para o seu preenchimento adequado e de forma completa.

  O “número da minuta” deve ser preenchido com o documento que precede o CT-e (espécie de
  pedido de serviço). Esse campo não é de preenchimento obrigatório.

  O “número operacional do conhecimento aéreo” representa o número de controle comumente utilizado
  pelo conhecimento aéreo composto por uma sequência numérica de onze dígitos. Os três primeiros
  dígitos representam um código que os operadores aéreos associados à IATA possuem. Em seguida
  um número de série de sete dígitos determinados pelo operador aéreo. Para finalizar, um
  dígito verificador, que é um sistema de módulo sete imponderado o qual divide o número de
  série do conhecimento aéreo por sete e usa o resto como dígito de verificação.

  a) O CT-e possui um número próprio de controle que não é o disposto neste item, portanto,
  operadores aéreos que somente utilizam esse número, não precisam preencher este campo.

  b) Operadores aéreos que utilizam o padrão de numeração do conhecimento aéreo composto de
  onze dígitos devem, obrigatoriamente, preencher esse campo. O preenchimento eletrônico deve
  ser apenas com números, sem espaços ou símbolos. Para a visualização no DACTE, entretanto,
  deve-se separar com hífen o código de três dígitos do operador aéreo e a numeração sequencial.
  Essa última, por sua vez, deve ser representada no DACTE com um espaço entre os quatro primeiros
  dígitos e os três últimos acrescidos do dígito verificador.

  c) Não são permitidos truncamentos do número operacional do conhecimento aéreo, ou seja,
  o número inserido no sistema deve conter apenas os 11 dígitos, de maneira que todos esses
  dígitos sejam incluídos no CT-e.

  A “data prevista da entrega” é um campo de preenchimento obrigatório, conforme disposto
  no CBA.

  O grupo de informações referentes à “natureza da carga” possui dois campos. A “dimensão”
  é o primeiro campo e deve ser preenchido quando for necessário. As dimensões permitem avaliar
  a acessibilidade dos volumes pelas portas dos compartimentos de carga das aeronaves, facilitar
  seu manuseio e sua acomodação em posição ideal às características do conteúdo transportado.
  A unidade é padronizada em centímetros e deve ser preenchido da seguinte forma: ComprimentoxLarguraxAltura,
  evitando colocar espaço entre as medidas e o x. Exemplos: 42x35x15; 1045x500x250.

  O segundo campo do grupo de informações referentes à “natureza da carga” refere-se às “informações
  de manuseio”. Como esse campo diz respeito ao transporte de cargas especiais ou de artigos
  perigosos, que não são permitidos na emissão de um CT-e simplificado, este campo não poderá
  estar preenchido.

  O grupo de “informações de tarifa” é composto por três campos. O primeiro é para referenciar
  qual é a “classe” da tarifa, a qual deve ser prenchida da seguinte forma:

  a) M para tarifa mínima. Corresponde ao valor mínimo a ser cobrado para a expedição de uma
  carga, independentemente do volume ou do peso;

  b) G para tarifa geral. Aplicada sempre com base no peso, em quilos, da mercadoria quando
  não houver uma tarifa específica e quando não se aplicar a tarifa mínima; e

  c) E para tarifa específica.

  O segundo campo do grupo de “informações de tarifa” refere-se ao código da tarifa. Quando
  se tratar de tarifa específica, deve-se indicar o respectivo código numérico.

  O terceiro e último campo do grupo de “informações de tarifa” refere-se ao “valor da tarifa”.
  Nesse caso, deve-se colocar o valor aplicado a ela. Ressalta-se que esse campo não é o valor
  total do frete, ele representa o valor da tarifa aplicada, que pode, por sua vez, coincidir
  com o valor total do frete cobrado. Deve ser preenchida da seguinte forma:

  a) informar o valor total quando se tratar de um valor fixo cobrado; e

  b) informar o valor por quilo quando se tratar de um valor cobrado por quilo.

  O grupo “preenchido quando for transporte de produtos classificados pela ONU como perigosos”
  não poderá estar preenchido dado que diz respeito ao transporte de artigos perigosos, que
  não são permitidos na emissão de um CT-e Simplificado.

  Do Manifesto de Documentos Fiscais eletrônico - MDF-e

  O MDF-e foi desenvolvido, de forma integrada, pelas SEFAZ dos Estados, pela Receita Federal
  do Brasil, pela SUFRAMA, pelos representantes das transportadoras e pelas Agências Reguladoras
  do segmento de transporte, dentre elas a Anac.

  O MDF-e é o documento emitido e armazenado eletronicamente, de existência apenas digital,
  para vincular os documentos fiscais utilizados na operação e/ou prestação, à unidade de
  carga utilizada no transporte, cuja validade jurídica é garantida pela assinatura digital
  do emitente e autorização de uso pela administração tributária da unidade federada do contribuinte.

  A Anac adota o modelo eletrônico e padronizado do MDF-e do modo aéreo como documento operacional
  que substitui o modelo de manifesto de carga doméstico tradicionalmente emitido em papel.

  O MDF-e deve ser emitido pelos operadores aéreos regidos pelos RBAC nº 121 e 135 quando
  necessário.

  O operador aéreo deve emitir o MDF-e de acordo com o disposto nesta IS e no Manual de Orientações
  do Contribuinte - MOC - do MDF-e, publicado pelo Encontro Nacional de Coordenadores e Administradores
  Tributários Estaduais - ENCAT - no site https://dfe-portal.svrs.rs.gov.br/Mdfe.

  Para acompanhar o transporte das mercadorias, pode ser impresso o Documento Auxiliar do
  Manifesto de Documentos Fiscais eletrônico - DAMDFE - de acordo com o definido nesta IS
  e no MOC do MDF-e.

  O DAMDFE é uma representação gráfica resumida do MDF-e, impressa em papel comum, para acompanhar
  o transporte da carga, permitindo o acesso ao arquivo do MDF-e pela fiscalização além de
  visualizar algumas informações importantes para a operação do modo aéreo.

  O MDF-e e o DAMDFE devem estar à disposição da Anac sempre que solicitados.

  Do preenchimento do MDF-e

  Para fins de fiscalização e controle da Anac, todas as informações do MDF-e devem ser preenchidas
  corretamente e de forma completa, conforme orientação do MOC do MDF-e e o disposto nesta
  IS.

  Nos itens seguintes, encontram-se os critérios gerais para o preenchimento de forma completa
  e adequada do MDF-e. Ressalta-se que não é objetivo desta IS explicar o preenchimento de
  cada campo do MDF-e, visto que isso já é detalhado no MOC do MDF-e. Os termos que se encontram
  entre aspas representam o nome exato do campo de acordo com o MOC do MDF-e.

  O preenchimento dos campos da estrutura genérica do MDF-e deve obedecer o disposto no MOC
  do MDF-e e o disposto no item 5.5.4.

  O campo “Informações complementares de interesse do contribuinte” deve apresentar o conteúdo
  necessário para a operação do voo com vistas a substituir o manifesto de carga para o transporte
  doméstico. Dessa forma, deve constar obrigatoriamente o seguinte:

  a) o número de cada CT-e e CT-e Simplificado ou o número operacional do conhecimento aéreo;

  b) a quantidade de volumes relacionada a cada CT-e e CT-e Simplificado referenciado;

  c) a natureza da carga relacionada a cada CT-e e CT-e Simplificado referenciado. Nesse caso,
  deve-se preencher com o produto predominante e a informação relacionada ao código da carga
  especial que constam no CT-e. Se houver necessidade operacional, deve-se acrescentar a informação
  do campo do CT-e e do CT-e Simplificado que dispõe sobre outras características da carga;
  e

  d) quaisquer informações que o operador aéreo considere necessárias para a operação do voo
  relacionadas a cada CT-e e CT-e Simplificado referenciado.

  A Anac, por suas atribuições dispostas na Lei nº 11.182, de 27 de setembro de 2005, deve
  ter acesso a qualquer MDF-e emitido para o modo aéreo. Portanto, no campo “CNPJ do autorizado”,
  do grupo “Autorizados para download do XML do DF-e” deverá ser inserido o CNPJ da Anac:
  07.947.821/0001-89, preenchido conforme orientado no MOC do MDF-e.

  O não preenchimento do campo mencionado em 5.6.5 configura obstrução à fiscalização, passível
  de sanção nos termos do regulamento específico.

  Assim como para todos os outros modos de transporte, há um grupo de informações específico
  de preenchimento do MDF-e para o modo aéreo. Nos itens 5.6.8 a 5.6.11, encontram-se as instruções
  para o seu preenchimento adequado e de forma completa.

  Deve-se incluir a marca de nacionalidade e matrícula da aeronave.

  Deve-se indicar o número do voo da seguinte forma:

  a) para voos que possuem numeração, utilizar o formato AB1234 sem espaço, sendo AB a designação
  da empresa e 1234 o número do voo; e

  b) quando o voo não for numerado, colocar as marcas de nacionalidade e matrícula, sem hífen.

  As informações referentes ao “Aeródromo de embarque” e ao “Aeródromo de destino” são de
  preenchimento obrigatório.

  a) Deve-se, prioritariamente, colocar o código de três dígitos da IATA.

  b) Quando não existir esse código, utilizar a sigla de quatro dígitos da OACI.

  c) É proibido escrever o nome do aeroporto por extenso.

  A “Data do voo” deve indicar o dia da decolagem da aeronave no aeródromo de origem.

  O MDF-e deve ser emitido em até três horas após a decolagem da aeronave, ficando a carga
  retida, sob responsabilidade do transportador aéreo, até sua emissão. Observando-se tal
  instrução, recomenda-se que o MDF-e seja emitido com a maior antecedência possível e em
  momento anterior ao primeiro pouso da aeronave.

  Do Documento Eletrônico de Transporte - DT-e

  O Decreto nº 11.313, de 28 de dezembro de 2022, regulamenta a Lei nº 14.206, de 27 de setembro
  de 2021, que institui o Documento Eletrônico de Transporte - DT-e, e estabelece a respectiva
  política nacional no âmbito da administração pública federal.

  O DT-e encontra-se em processo de discussão. Suas regras de preenchimento e exceções previstas
  estarão disponíveis nesta IS quando estabelecido o prazo de obrigatoriedade para o transporte
  de carga pelo modo aéreo.

