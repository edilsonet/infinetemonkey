title: 05.04.2024
text: '05.04.2024

  OBJETIVO

  1.1 A presente Instrução Suplementar detalha os requisitos relacionados ao transporte civil
  de artigos perigosos por via aérea constantes no RBAC nº 175, subparte G.

  1.2 Estabelecer meios aceitáveis de cumprimento com requisitos relativos à aprovação do
  projeto e de produção de embalagens para o transporte aéreo de artigos perigosos.

  REVOGAÇÃO

  2.1 Esta IS substitui a IS 175-012B, de 23 de março de 2022.

  FUNDAMENTOS

  3.1 O Art. 8°, inciso XI, da Lei n° 11.182/2005 (Lei de Criação da ANAC) prevê como competência
  da ANAC a expedição de regras sobre segurança em área aeroportuária e a bordo de aeronaves
  civis, porte e transporte de cargas perigosas.

  3.2 O RBAC 175.303(a) estabelece que as embalagens para o transporte aéreo de artigo perigoso
  devem, antes da sua fabricação, ser aprovadas junto à ANAC ou junto a um órgão reconhecido
  pela Agência. Para isso, o requerente deve submeter à ANAC o projeto da embalagem, demonstrando
  o cumprimento com todas as instruções aplicáveis previstas nesta IS e nas normas complementares
  associadas.

  3.3 O RBAC 175.315(b) estabelece que o requerente ou detentor de uma aprovação de produção
  de embalagens deve estabelecer um sistema de qualidade que garanta que cada embalagem esteja
  de acordo com seu projeto aprovado e esteja em uma condição de utilização segura.

  3.4 A Resolução nº 30, de 21 de maio de 2008, em seu Art. 14, estabelece que a ANAC pode
  emitir IS para esclarecer, detalhar e orientar a aplicação de requisito existente em RBHA/RBAC.

  3.5 De acordo com o mesmo art. 14, § 1°, o requerente que pretenda, para qualquer finalidade,
  demonstrar o cumprimento de requisito previsto em RBAC poderá adotar os meios e procedimentos
  previamente especificados em IS ou apresentar meio alternativo devidamente justificado,
  exigindo-se, nesse caso, a análise e concordância expressa da ANAC. E o § 2° do mesmo artigo
  estabelece que o meio alternativo de cumprimento deve garantir, ao menos, um nível equivalente
  de segurança ao estabelecido pelo requisito aplicável ou concretizar o objetivo desta instrução
  suplementar.

  DEFINIÇÕES

  4.1 Número da ONU: Número de quatro dígitos designado pelo Comitê de Peritos em Transporte
  de Artigos Perigosos da Organização das Nações Unidas - ONU que serve para identificar uma
  substância ou um determinado grupo de substâncias.

  4.2 Instruções Técnicas: Instruções Técnicas para o Transporte Seguro de Artigos Perigosos
  por Via Aérea - Doc. 9284-AN/905 - aprovadas e publicadas periodicamente de acordo com o
  procedimento estabelecido pelo Conselho da Organização de Aviação Civil Internacional (OACI/ICAO).
  Considera-se nesta IS a última versão publicada, incluindo qualquer adendo ou corrigenda
  aplicável.

  4.3 Laboratório de Primeira Parte: A avaliação em relação aos requisitos especificados é
  feita pelo fabricante ou fornecedor;

  4.4 Laboratório de Terceira Parte: a avaliação é realizada pelos organismos de avaliação
  de conformidade, que têm independência em relação ao fornecedor e ao cliente. É na avaliação
  por terceira parte que se insere o mecanismo de Acreditação de Laboratórios, que é de natureza
  voluntária.

  4.5 Manual de Testes e Critérios: A edição vigente da publicação da Organização das Nações
  Unidas intitulada Recomendações para o Transporte de Artigos Perigosos, Manual de Testes
  e Critérios.

  4.6 Projeto: Desenhos e especificações, incluindo uma listagem daqueles necessários para
  definir a configuração da Embalagem; informações sobre dimensões, materiais e processos
  necessárias à definição da resistência estrutural da Embalagem; as instruções de uso da
  embalagem incluindo suas limitações; e quaisquer outros dados necessários para permitir,
  por comparação, a determinação de que a embalagem está de acordo com o projeto e é segura
  para ser utilizada conforme pretendido.

  4.7 Suplemento: Suplemento às Instruções Técnicas para o Transporte Seguro de Artigos Perigosos
  por Via Aérea - Doc. 9284-AN/905 Supplement - aprovado e publicado periodicamente de acordo
  com o procedimento estabelecido pelo Conselho da OACI. Considera-se nesta IS a última versão
  publicada, incluindo qualquer adendo ou corrigenda aplicável.

  4.8 Órgão governamental reconhecido: Autoridade nacional apropriada ou organismo por estes
  autorizado, que seja reconhecido por um país a executar funções específicas relacionadas
  com as provisões contidas no RBAC 175 e nesta Instrução Suplementar, que estejam reconhecidos
  junto à OACI; ou laboratórios governamentais no Brasil com capacidade técnica para aprovação
  de embalagens para o transporte de artigos perigosos

  DESENVOLVIMENTO DO ASSUNTO

  5.1 Critérios gerais do processo de aprovação de projeto de embalagem para o transporte
  aéreo de artigos perigosos.

  5.1.1 A embalagem que não requerer uma marcação com o símbolo da ONU (marcação UN) pode,
  desde que cumpra com os requisitos de construção e ensaios previstos nas Instruções Técnicas
  (DOC. 9284-AN/905), ser utilizada para embalar:

  a) artigos perigosos em pequenas quantidades segundo os critérios de quantidade limitada
  e de quantidade excetuada; ou

  b) outros artigos perigosos para os quais o RBAC 175 ou as Instruções Técnicas não requerem
  o uso de uma embalagem com marcação UN.

  NOTA: As embalagens de fabricação nacional destinadas ao transporte aéreo de artigos perigosos
  em quantidades limitadas, excetuadas ou na Classe 6, Divisão 6.2, Categoria B (UN 3373)
  devem ser qualificadas sob as seções 5.2, 5.3 e 5.4 desta IS, não sendo exigida aprovação
  de projeto e produção junto à ANAC.

  5.1.2 As embalagens para o transporte de material radioativo, Classe 7, devem estar de acordo
  com a legislação específica da Comiss&atilatilde;o Nacional de Energia Nuclear (CNEN).

  5.2 Embalagem para artigos perigosos em quantidades limitadas.

  5.2.1 As embalagens de fabricação nacional destinadas ao transporte aéreo de artigos perigosos
  em quantidades limitadas devem ser ensaiadas e aprovadas segundo os critérios descritos
  na Parte 3, Capítulo 4 das Instruções Técnicas (Doc. 9284-AN/905) e com os procedimentos
  descritos nessa IS.

  5.2.2 Cada volume utilizado no transporte deve ser capaz de resistir a um teste de queda
  de 1,2 m em uma superfície rígida, não elástica, plana e horizontal, na posição mais provável
  de sofrer danos. Para ser aprovado no teste, a embalagem externa não pode mostrar nenhum
  dano suscetível a afetar a segurança durante o transporte e não pode haver vazamento na(s)
  embalagem(ns) interna(s).

  5.2.3 Cada volume utilizado no transporte deve ser capaz de suportar, sem ruptura ou vazamento
  de nenhuma embalagem interna e sem redução significativa de sua efetividade, uma força aplicada
  à superfície superior por 24 horas, equivalente ao peso total de volumes idênticos empilhados
  a uma altura de 3 m (incluindo a amostra de teste).

  5.2.4 Testes adicionais podem ser exigidos de acordo com cada Instrução de Embalagem, dependendo
  do produto a ser transportado. É dever do responsável pela execução dos testes verificar
  a necessidade, o cumprimento e aplicabilidade de quaisquer demonstrações adicionais que
  se façam necessárias, como por exemplo os testes requeridos na Parte 6, Capítulo 3, para
  embalagens internas do tipo aerossóis.

  5.2.5 Os testes acima descritos devem seguir os critérios estabelecidos na Parte 6, Capítulo
  4 das Instruções Técnicas, no que tange ao número de amostras, à forma de preparação e à
  execução para os testes de queda e empilhamento.

  5.2.6 Os testes devem ser executados em laboratórios de primeira ou terceira parte que sejam
  acreditados pelo Instituto Nacional de Metrologia, Qualidade e Tecnologia - INMETRO - ou
  outro órgão governamental reconhecido para ensaios em embalagens para produtos perigosos.

  5.2.7 Os documentos comprobatórios dos testes das embalagens (relatórios, certificados,
  etc.) devem compor a documentação de embarque e estar prontamente disponíveis para consulta.

  5.2.8 O documento comprobatório emitido deverá conter, dentre outras informações, a descrição
  completa da embalagem (com dados suficientes para permitir, por comparação, a determinação
  de que a embalagem está de acordo com o projeto), um número de identificação e rastreio,
  período de validade que não deverá ser superior a 3 anos e ainda dispor de uma forma para
  verificação de autenticidade. A embalagem deve ser identificada de forma a permitir sua
  rastreabilidade ao documento comprobatório dos ensaios.

  5.2.9 As embalagens deverão ser avaliadas sempre que ocorram modificações dimensionais,
  de especificação de material, de componentes ou de processos de fabricação. O laboratório
  emissor do documento comprobatório dos ensaios deverá verificar o impacto e extensão da
  modificação. Caso a alteração de algum dos componentes implique em retestagem completa ou
  parcial da embalagem ou em sua inexigibilidade, o laboratório avaliador deverá registrar
  a análise realizada e reemitir o documento comprobatório dos ensaios com as devidas alterações
  e registros.

  5.2.10 Os relatórios de testes devem cumprir com os requisitos mínimos de informações previsto
  na Parte 6, Capítulo 4, Seção 4.7 das Instruções Técnicas (Doc. 9284-AN/905).

  5.3 Embalagem para artigos perigosos em quantidades excetuadas.

  5.3.1 As embalagens de fabricação nacional destinadas ao transporte aéreo de artigos perigosos
  em quantidades excetuadas devem ser ensaiadas e aprovadas segundo os critérios descritos
  na Parte 3, Capítulo 5 das Instruções Técnicas (Doc. 9284-AN/905) e com os procedimentos
  descritos nessa IS.

  5.3.2 Cada volume completo preparado para o transporte, contendo embalagens internas envasadas
  com no mínimo 95 por cento de sua capacidade para sólidos ou 98 por cento para líquidos,
  deve ser capaz de suportar, conforme demonstrado em teste devidamente documentado, a não
  ruptura, quebra ou vazamento de nenhuma embalagem interna e sem redução significativa de
  efetividade:'
