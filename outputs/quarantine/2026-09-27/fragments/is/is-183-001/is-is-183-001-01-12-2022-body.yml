text: '01.12.2022


  OBJETIVO

  Esta IS tem por finalidade estabelecer o processo de credenciamento de pessoas jurídicas
  e profissional qualificado para aplicação do exame de proficiência linguística de pilotos,
  desenvolvido pela ANAC, de acordo com as definições e requisitos estabelecidos pelo RBAC
  nº 183 e RBAC nº 61.

  REVOGAÇÃO

  Esta IS substitui a IS nº 183-001 Revisão E.

  FUNDAMENTOS

  3.1 A Resolução no 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou
  RBHA.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC ou RBHA, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2b desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 Esta IS é fundamentada e objetiva oferecer método de cumprimento à seção 61.10 do RBAC
  nº 61 e à Subparte D do RBAC nº 183 no que se refere à proficiência linguística.

  DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas na seção 61.2 do RBAC nº
  61, no RBAC nº 01, e as seguintes definições:

  4.1.1 Avaliador: examinador credenciado de proficiência linguística que julga e concede
  o nível de proficiência linguística aferido durante o Santos Dumont English Assessment com
  base nos descritores da Escala de Níveis da OACI de acordo com a seção 61.10 do RBAC nº
  61.

  4.1.2 Avaliador com Experiência Linguística ou English Language Expert (ELE): avaliador
  com qualificações na área da língua inglesa capaz de interpretar corretamente os descritores
  da Escala de Níveis da OACI e identificar com precisão pontos fortes e fracos do desempenho
  do candidato.

  4.1.3 Avaliador com Experiência Operacional ou Subject Matter Expert (SME): avaliador com
  qualificações operacionais, que seja piloto ou controlador de voo, capaz de interpretar
  corretamente os descritores da Escala de Níveis da OACI e identificar, sob perspectiva operacional,
  aspectos do uso da língua, exatidão, brevidade na fala e inteligibilidade de sotaques e
  dialetos aceitáveis para a comunidade aeronáutica.

  4.1.4 Candidato: detentor de licença de piloto de avião, helicóptero, aeronave de decolagem
  vertical ou dirigível que se submeta ao Santos Dumont English Assessment para demonstrar
  cumprimento dos requisitos de proficiência linguística para operação de aeronave civil brasileira
  fora da jurisdição do espaço aéreo brasileiro constantes na seção 61.10 do RBAC nº 61.

  4.1.6 Entidade Credenciada de Proficiência Linguística: detentor de credenciamento de pessoa
  jurídica autorizada pela ANAC para aplicar o Santos Dumont English Assessment com vistas
  à averbação do nível de proficiência linguística nas licenças dos pilotos brasileiros, de
  acordo com os requisitos estabelecidos no RBAC nº 61 e no RBAC nº 183.'
