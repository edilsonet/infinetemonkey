text: 'APÊNDICE C - MODELO DE DECLARAÇÃO DO EXAMINADOR CREDENCIADO DE PROFICIÊNCIA LINGUÍSTICA


  À Agência Nacional de Aviação Civil

  Sr. Gerente de Certificação de Pessoal

  Av. Presidente Vargas, 850 - 10º andar

  Rio de Janeiro - RJ - CEP: 20071-001


  Prezado Sr. Gerente,


  Eu, ___________________________[nome, RG, CPF, qualificação, endereço], indicado (a) para
  atuar como entrevistador/avaliador(a) de proficiência linguística pela (o) _____________________________________
  (nome do requerente), solicitante do credenciamento de pessoa jurídica para aplicação do
  exame de proficiência linguística desenvolvido pela ANAC, venho declarar à Vossa Senhoria
  que estou ciente, concordo e cumprirei com os procedimentos estabelecidos por esta Agência
  Nacional de Aviação Civil, em especial quanto à preservação do sigilo das questões do Santos
  Dumont English Assessment e de todo material decorrente da capacitação e dos exames de proficiência
  linguística.


  Declaro ainda não possuir vínculo como instrutor de inglês para pilotos ou coordenador de
  cursos de inglês para pilotos em qualquer instituição pública ou privada, não ministrar
  instrução de inglês para pilotos, inclusive na modalidade de aulas particulares e não possuir
  vínculo como aeronauta, instrutor de voo nem ocupar cargo gerencial/administrativo no requerente.


  Estou ciente de que o não cumprimento das declarações acima dará ensejo à cassação do credenciamento,
  sem prejuízo da apuração de responsabilidade criminal na forma da lei.


  [Cidade], ____ de ________ de 20__.


  [Assinatura]'
