text: '01.04.2022


  OBJETIVO

  1.1 Fornecer meio de cumprimento aos requisitos constantes no Regulamento Brasileiro da
  Aviação Civil - RBAC nº 183 relativos ao credenciamento de pessoas físicas como profissionais
  credenciados em aeronavegabilidade para atuar em processos relacionados à aeronavegabilidade
  continuada de aeronaves com Certificado de Aeronavegabilidade Padrão, ou que fazem jus a
  este (PCA - Grupos A, B e C).

  REVOGAÇÃO

  2.1 Esta IS substitui a IS 183-005 Revisão A, aprovada pela Portaria nº 6.132/SPO, de 13
  de outubro de 2021.

  FUNDAMENTOS

  3.1 O art. 8º da Lei nº 11.182, de 27 de setembro de 2005, em seu parágrafo 1º, permite
  o uso do credenciamento de pessoas de notória especialização para a expedição de laudos,
  pareceres e relatórios que demonstrem o cumprimento dos requisitos necessários à emissão
  de certificados ou atestados relativos às atividades de competência da ANAC.

  3.2 A seção 183.1 do RBAC n° 183 define, como objetivo do regulamento, especificar os requisitos
  para o credenciamento de pessoas.

  3.3 O parágrafo 183.11(e) do RBAC n° 183 estabelece que a ANAC poderá credenciar profissional
  qualificado em aeronavegabilidade.

  3.4 A seção 183.33 do RBAC n° 183 apresenta o escopo das atuações dos profissionais credenciados
  em aeronavegabilidade.

  3.5 A Resolução ANAC nº 30/2008, em seu artigo 14, estabelece que a Instrução Suplementar
  (IS) é norma de caráter geral, que objetiva esclarecer, detalhar e orientar a aplicação
  de requisito previsto em RBAC.

  3.6 O parágrafo 1º do mesmo artigo determina que, para demonstrar o cumprimento de requisito
  previsto em RBAC, o administrado poderá adotar os meios e procedimentos previamente especificados
  em IS ou apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se,
  nesse caso, a análise e concordância expressa da ANAC. O meio ou procedimento alternativo
  deve garantir nível de segurança igual ou superior ao estabelecido pelo requisito aplicável
  ou concretizar o objetivo do procedimento normatizado em IS.

  NOTA - As informações detalhadas sobre as solicitações de credenciamento de pessoas físicas
  estarão disponíveis na Carta de Serviços ao Cidadão da ANAC, no sítio eletrônico da Agência
  na internet.

  DEFINIÇÕES

  4.1 Para os propósitos desta IS, são válidas as definições listadas no RBAC nº 01 e as seguintes
  definições:

  4.2 Área de Atuação: Significa uma área de conhecimento especializada para a qual o Credenciamento
  é aplicável. Por exemplo, área que corresponde a um tipo de produto aeronáutico, a um sistema
  específico da aeronave, motor, hélice ou a uma porção destes.

  4.3 Área Técnica Responsável: É a gerência da ANAC responsável pela orientação e supervisão
  do Profissional Credenciado.

  4.4 Candidato: É a condição da Pessoa Física que tem seu Credenciamento requerido, desde
  o requerimento até o Credenciamento. O requerente de uma renovação ou extensão também é
  Candidato a esta extensão ou renovação, mesmo já sendo um Profissional Credenciado.

  4.5 Competência: conjunto de conhecimentos, habilidades e atitudes necessários a certo indivíduo
  para o desempenho satisfatório de determinada função ou atividade.

  4.6 Credenciamento: é o ato administrativo pelo qual uma Pessoa Física passa a ser reconhecida
  pela ANAC por sua competência, credibilidade e notória especialização - após ser submetida
  a um processo de avaliação de suas qualificações - para a expedição de laudos, pareceres
  ou relatórios que demonstrem o cumprimento dos requisitos necessários à emissão de certificados
  ou atestados relativos às atividades de competência da ANAC, nos termos do §1º do art. 8º,
  da Lei nº 11.182, de 27 de setembro de 2005.

  4.7 Escopo Reconhecido: conjunto de Áreas de Atuação de um PCA, com possíveis limitações,
  reconhecido pela ANAC por meio de seu Credenciamento.

  4.8 Habilitação: autorização associada a uma licença, na qual são especificadas qualificações
  e respectivas validades (quando aplicável), condições especiais de operação e prerrogativas
  e restrições relativas ao exercício das prerrogativas da Licença. Corresponde ao Certificado
  de Habilitação Técnica (CHT), previsto na Lei 7.565, de 19 de dezembro de 1986 (Código Brasileiro
  de Aeronáutica).

  4.9 Licença: documento emitido pela ANAC que indica a especialidade aeronáutica do titular
  e formaliza sua certificação, de acordo com os requisitos do RBAC nº 65, para atuar de acordo
  com as prerrogativas e restrições pertinentes à referida licença e às habilitações associadas
  a ela.

  NOTA - A Licença e a Habilitação são emitidas pela ANAC em documento único.

  4.10 Monitoramento: É a porção das atividades de Supervisão que abrange a análise dos trabalhos
  executados pelos Profissionais Credenciados quanto à sua precisão, quanto ao atendimento
  aos procedimentos, regulamentos, orientações e requisitos adotados pela ANAC e quanto ao
  uso de técnicas e métodos aceitáveis.

  4.11 Notória Especialização: característica do profissional cujo conceito no campo de sua
  especialidade, decorrente de desempenho anterior, estudos, experiências, publicações, organização
  ou de outros requisitos relacionados com suas atividades, permita inferir que o profissional
  é qualificado e adequado para compor o sistema de Credenciamento.

  4.12 Padrões Estabelecidos pela ANAC: Conjunto de referências que devem ser seguidas pelos
  Profissionais Credenciados, tais como políticas, diretrizes, práticas, requisitos, especificações,
  processos, procedimentos e interpretações, aplicáveis às suas atividades.

  4.13 Profissional Credenciado em Aeronavegabilidade (PCA): É a Pessoa Física formalmente
  reconhecida pela ANAC por meio do Credenciamento.

  4.14 Supervisão: Acompanhamento das atividades dos PCA buscando atendimento aos Padrões
  Estabelecidos pela ANAC.

  DESENVOLVIMENTO DO ASSUNTO

  5.1 Credenciamento de Profissional em Aeronavegabilidade

  5.1.1 A ANAC poderá credenciar um profissional para atuar em processos relacionados à aeronavegabilidade,
  conforme previsto no parágrafo 183.11(e) do RBAC n° 183. No âmbito da aeronavegabilidade
  continuada, esse credenciamento poderá ser realizado pela Superintendência de Padrões Operacionais,
  conforme delegações previstas em Regimento Interno da ANAC e em sua Portaria de Organização
  Interna (POI), para a realização das seguintes atividades:

  5.1.1.1 Vistoria Técnica Inicial (VTI) de aeronaves novas ou usadas, em suporte à emissão
  do Certificado de Aeronavegabilidade Padrão pela ANAC, com exceção de:

  a) aeronave oriunda das Forças Armadas;

  5.1.1.2 Vistoria Técnica Especial (VTE) de aeronaves usadas, em suporte à emissão do Certificado
  de Aeronavegabilidade Padrão pela ANAC, com exceção dos seguintes casos:

  a) reidentificação de aeronave, motor ou hélice;

  b) vistorias oriundas de determinação judicial;

  c) solicitação da Polícia Federal, da Receita Federal ou da Autoridade Sanitária;

  d) apuração de denúncia;

  e) aeronaves com indícios de irregularidades identificadas por servidor da ANAC designado
  para atividades de fiscalização;

  f) necessidade de verificação das condições de aeronavegabilidade da aeronave de acordo
  com a prerrogativa contida no parágrafo 21.181(b) do RBAC n° 21;

  g) amostragem, de acordo com a IS nº 21.181-001.

  5.1.2 O credenciamento de um profissional será efetuado mediante solicitação do interessado
  ou pela empresa que solicita o credenciamento de seu empregado, que deverá apresentar declaração
  sobre sua qualificação e documentação que a comprove, conforme detalhamento desta IS. Uma
  autorização será emitida por meio de ato formal da unidade competente delegada pela SPO,
  conforme disposto em Portaria de Organização Interna (POI), para cada pessoa física selecionada,
  segundo o parágrafo 183.11(e) do RBAC nº 183. A autorização especificará os tipos de credenciamento
  que foram deferidos, possíveis limitações, bem como os respectivos prazos de validade.'
