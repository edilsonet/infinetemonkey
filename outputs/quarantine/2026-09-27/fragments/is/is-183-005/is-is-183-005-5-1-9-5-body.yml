cite: 5.1.9.5
title: Validade
text: '5.1.9.5 Validade

  a) Um Credenciamento é válido por 3 (três) anos a partir da data de emissão e pode ser renovado
  por períodos adicionais de 3 (três) anos, a critério da ANAC, de acordo com as disposições
  do parágrafo 183.15(a) do RBAC nº 183.

  b) A validade da extensão é aquela já definida para o Credenciamento anterior.

  c) A ANAC não informará aos PCA sobre o vencimento da validade do Credenciamento ou dos
  prazos estabelecidos nesta IS para manutenção do Credenciamento. Portanto, é fundamental
  que o PCA observe a validade de seu Credenciamento, conforme disponível na página da ANAC
  na internet.'
