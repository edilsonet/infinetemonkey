text: (e) Para ensaios realizados antes da emissão da AIT, a ANAC poderá se utilizar do Ofício
  de Autorização de Voo - OAV para autorizar a entrada da tripulação da ANAC no protótipo
  para um voo específico do requerente (p. e., ensaio de desenvolvimento, voos de familiarização,
  etc).
