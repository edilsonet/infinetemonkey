title: 5.4.11.7(f)
text: (f) Evidentemente, como a AIT visa autorizar a entrada do servidor da ANAC em protótipos
  para realizar ensaios em voo, não há óbice em o requerente realizar ensaios de demonstração
  de cumprimento com requisitos antes da emissão da AIT. Desta forma, o protótipo poderá obter
  um CAVE com propósitos de Demonstração de Cumprimento com Requisitos, conforme o parágrafo
  RBAC 21.191(b), além dos outros propósitos previstos neste mesmo parágrafo.
