title: apendice-c-criterio-de-nivel-de-envolvimento-na-demonstracao-de-cumprimento(c)
text: '(c) Competência do requerente: Este fator diz respeito à capacidade do requerente,
  reconhecida pela ANAC, em demonstrar cumprimento com os requisitos de certificação. Para
  esta finalidade, a ANAC considera os seguintes aspectos:

  I - A qualificação e experiência da equipe de engenharia em termos do requisito de certificação,
  considerando, inclusive, o histórico de interações com a Agência em projetos anteriores;

  II - A existência de metodologias de demonstração de cumprimento com os requisitos previamente
  discutidas e acordadas com a ANAC;

  III - Processos internos efetivos para avaliação ou revisão das informações de demonstração
  geradas pelo requerente;

  IV - A ocorrência de dificuldades em serviço/incidentes/acidentes ligados a deficiências
  no projeto de tipo certificados anteriormente;

  V - A existência de processos aprovados no âmbito de uma pessoa jurídica credenciada;

  VI - A existência de um sistema de garantia de projeto no âmbito de uma organização certificada
  de projeto; e

  VII - Qualquer outra informação, independente da fonte, que permita uma avaliação de competência
  do requerente.

  A participação de pessoa física credenciada na avaliação de cumprimento com os requisitos,
  incluindo a determinação de conformidade, reduz a probabilidade da falha na identificação
  de um não cumprimento com os requisitos, dado o reconhecimento da Agência à notória especialização,
  experiência e competência destas pessoas. Desta forma, a ANAC tende a reduzir o seu nível
  de envolvimento mediante a participação da pessoa credenciada.'
