text: '(v) Descrição do processo de fabricação; e

  (vi) Nome do fabricante e endereço das instalações onde o artigo é ou será fabricado.

  Desenhos, especificações e normas obedecidas;

  Lista mestra de documentos técnicos;

  Manual de Instalação (quando aplicável);

  Informações sobre os materiais e processos de fabricação;

  Instruções para Aeronavegabilidade Continuada;

  Apresentar como será feita a marcação do artigo, que deve estar em conformidade com o previsto
  no RBAC 45, seção 45.15 e com o RBAC 45.16 no caso de peças consideradas críticas;

  Informações sobre características de inflamabilidade, combustão e toxidez de materiais empregados;

  Relatórios de ensaios e cálculos necessários à comprovação de que o projeto do artigo satisfaz
  às condições de aeronavegabilidade definidas pelos RBAC. Se o artigo for fabricado sob licença,
  apresentar comprovação do licenciamento, CT original;

  Se aplicável, todos os dados pertinentes para aprovação de desvio que demonstram a adoção
  de um nível de segurança equivalente;

  Proposta detalhada de ensaios para comprovação da adequabilidade do artigo às exigências
  dos RBACs e/ou de normas e especificações aplicáveis; e

  Indicações de facilidades, de que disponha o fabricante, para a realização dos ensaios,
  cuja aceitação fica condicionada à aprovação da ANAC-GCPP.

  Demais elementos não listados acima e que constem de previsão no parágrafo 21.303 ou 21.603,
  conforme aplicável, do RBAC 21 ou qualquer outro documento solicitado pela ANAC para fins
  de certificação.

  Fases e etapas do Processo

  O processo de aprovação do CPAA é dividido em quatro fases, preliminar, inicial, demonstração
  e verificação de requisitos e final. A Figura 1 apresenta o fluxograma das fases e etapas
  do processo para obtenção do CPAA.

  Preliminar: é composta de etapas que antecedem o início da análise técnica dos requisitos
  de certificação. Compõem essa fase as etapas de reunião inicial (não obrigatória), apresentação
  de requerimento inicial para certificação, verificação de admissibilidade e pagamento de
  TFAC. Essa fase é importante para que o requerente se familiarize com as normas, procedimentos
  e regulamentos, dirima as maiores dúvidas e alinhe as expectativas.


  Figura 1 - Fluxograma das fases e etapas do processo para obtenção do CPAA.

  Inicial: é a etapa do processo posterior a emissão da notificação de aceitação da solicitação
  de certificação do artigo, com a confirmação da admissibilidade do artigo para a certificação.
  Nessa etapa é verificada e aprovada a base de certificação proposta e é definido o envolvimento
  da ANAC para as etapas posteriores do processo de certificação. A depender da análise de
  risco, disponibilidade de recursos técnicos e de pessoal, a ANAC poderá ter um maior envolvimento
  ou poderá reduzir sua atuação. Nos casos em que a ANAC entender que o artigo é um item de
  baixa complexidade técnica, baixo risco operacional e o requerente demonstrar que possui
  conhecimento amplo e experiência consolidada com a certificação a ANAC poderá ter um menor
  envolvimento. Poderá haver um maior envolvimento para os casos em que haja inovação técnica,
  estado da arte ou artigos com elevada complexidade técnica, alto grau de integração ou que
  o requerente não demonstra possuir experiencia e familiaridade com o processo de certificação.

  Demonstração e verificação de requisitos: consiste na etapa do processo em que serão demonstrados
  e verificados o cumprimento com os todos os requisitos técnicos e padrões mínimos de desempenho
  aplicáveis ao artigo em certificação, com a realização de ensaios, voos de demonstração,
  inspeções, elaboração e emissão de relatórios, entre outros.

  NOTA:​ A aprovação de artigos de substituição em produtos muito antigos ou isentos de certificação
  pode apresentar problemas potenciais devido a dados de projeto incompletos, produtos fora
  de produção, produtos sem validação nacional e detentores de certificados de tipo inativos.
  Independentemente disso, os requerentes devem fornecer informações suficientes para mostrar
  que o projeto do artigo pretendente ao CPAA atende aos padrões de aeronavegabilidade aplicáveis.

  Final: se caracteriza pelo fechamento de pendências documentais, aprovação do sistema de
  organização de produção e emissão dos certificados.

  Declaração de cumprimento com os requisitos

  Para os casos em que é requerido o certificado de produto aeronáutico aprovado segundo uma
  OTP, o solicitante deve, no momento do requerimento, declarar que cumpriu todas as exigências
  da subparte O do RBAC 21 aplicáveis e que o artigo em questão cumpre com os requisitos de
  desempenho estabelecidos na OTP aplicáveis, vigente na data de requerimento. Assim, os dados
  técnicos (desenhos, relatórios de ensaio e de cálculos, especificações de material, entre
  outros) exigidos pela OTP aplicável devem compor o protocolo da documentação inicial.

  Prazos processuais

  A ANAC tem até 45 dias data do protocolo da documentação inicial para analisar a admissibilidade
  da solicitação de certificação. Se o requerimento inicial for considerado incompleto, o
  requerente deverá, no prazo de até 30 dias a contar do recebimento da notificação, complementar
  o requerimento e fornecer todas as informações adicionais necessárias para demonstrar conformidade
  com os requisitos regulamentares que foram solicitados pela a ANAC. Se a informação solicitada
  não for apresentada de forma completa dentro do prazo de 30 (trinta) dias a contar da data
  em que foi requerida, o requerimento será indeferido e o processo cancelado, sendo o requerente
  notificado do cancelamento.

  Após admissibilidade do requerimento inicial, a ANAC irá emitir uma notificação informando
  o requerente sobre a aceitação do pedido de certificação do artigo. Nesta etapa será solicitado
  o pagamento e a apresentação do comprovante de recolhimento da TFAC associada ao serviço.
  Caso não seja efetuado pagamento da TFAC pelo requerente após a notificação da ANAC, o processo
  será mantido na condição de sobrestado por até 30 dias e depois arquivado. Sendo constatado
  o recolhimento pelo interessado há o prosseguimento do processo.

  A aprovação da base e plano de certificação pode levar em média por volta de 45 dias e a
  demonstração de cumprimento com os requisitos técnicos e padrões mínimos de desempenho do
  artigo em certificação por volta de 20 meses a depender do grau de complexidade do artigo,
  familiaridade e experiencia da empresa com a certificação.

  Para os demais casos, o prazo normal para atendimento da ANAC é de até 30 dias a contar
  da notificação ou do protocolo de cada solicitação. Nos casos em que solicitações realizadas
  pela ANAC não sejam atendidas no prazo estipulado na notificação, o processo será sobrestado
  por até 60 dias. Após completar 90 dias de inatividade, o processo será cancelado e arquivado.

  Caso haja necessidade, o requerente poderá solicitar a extensão de prazo, indicando a motivação
  e o tempo adicional estimado requerido para atendimento da solicitação. A extensão de prazo
  somente poderá ser solicitada uma única vez por notificação.

  Exceções ao CPAA

  A aprovação de um artigo por CPAA abrange as matérias-primas, procedimentos e processos
  utilizados na fabricação do respectivo artigo. Entretanto, materiais, processos e procedimentos
  de fabricação por si só não estão sujeitos à obtenção de um CPAA.

  Quaisquer procedimentos ou processos específicos (como endurecimento, chapeamento ou shot
  peening, entre outros) integrantes de um CPAA são válidos apenas para o artigo específico.
  Qualquer pessoa que execute apenas processos ou procedimentos especializados em artigos
  destinados a instalação em produtos com certificação de tipo deve fazê-lo dentro de uma
  aprovação de produção ou como fornecedor de um detentor de aprovação de produção (COP).

  Artigos produzidos sob um CST limitado ou através do formulário F-400-04 (SEGVOO 001) não
  são elegíveis para um CPAA. Os titulares dessas aprovações podem produzir artigos de modificação
  para instalação em seu produto sem a necessidade de obtenção de um CPAA.

  Um proprietário ou um operador de uma aeronave que produz artigos para instalação em seus
  próprios produtos (na aeronave, em seu motor ou em sua hélice). A instalação dos artigos
  devem cumprir com os requisitos do RBAC 43. Entretanto, se o proprietário ou o operador
  produzir artigos para venda e instalação em aeronaves, ele deve obter um CPAA e/ou um COP
  relacionados a esses artigos.

  Uma companhia aérea, operando de acordo com o RBAC 121 ou com o RBAC 135, que produz artigos
  para instalação em seus próprios produtos (aeronaves, motores ou hélices). A instalação
  desses artigos deve cumprir com os requisitos do RBAC 43 e com os procedimentos e instruções
  de manutenção da companhia aérea, aceitos pela ANAC.

  Artigos produzidos por uma oficina de manutenção, certificada pela ANAC, que serão utilizados
  em um produto (aeronave, motor ou hélice) que esteja em manutenção na oficina. A produção
  desses artigos é autorizada pelos RBAC 43 e RBAC 145. No entanto, os artigos produzidos
  pela oficina não podem ser vendidos, para a utilização em produtos certificados que não
  estejam em manutenção na oficina sem que um CPAA e/ou um COP tenham sido obtidos pela oficina.

  Não é emitido CPAA para peças padronizadas que cumprem com especificações estabelecidas
  pela indústria ou por governos, reconhecidas pela ANAC, conforme seção 21.9(a) do RBAC 21.

  Não é emitido CPAA para uma parte comercial, conforme definido na seção 21.1 do RBAC 21.

  Autorização para fabricação

  O requerente deverá demonstrar à ANAC que o artigo satisfaz às exigências de projeto do
  produto (aeronave, motor ou hélice), no qual será instalado, e/ou às normas e especificações
  aplicáveis.

  A demonstração a que se refere ao subparágrafo 5.15.1 será feita através da análise da documentação
  que instrui o requerimento e mediante ensaios que deverão ser realizados em instalações
  apropriadas, que estarão sujeitos à aprovação da ANAC, em termos de adequabilidade e operacionalidade
  dos equipamentos, instrumentação e instalações de ensaio.

  O requerente deverá apresentar propostas e relatórios conclusivos dos ensaios, os quais
  deverão ser testemunhados por representantes da ANAC-GCPP quando aplicável.

  Modificações ao artigo aprovado

  De acordo com as seções 21.319 e 21.619 do RBAC 21, o detentor de um CPAA e/ou COP deve
  submeter todas as pequenas modificações de projeto à ANAC, de acordo com procedimentos previamente
  acordados e estabelecidos pela ANAC na aprovação.

  Grandes modificações ou pequenas modificações de projeto em artigos classificados como críticos
  ou que tenham tempo de vida limite devem ser aprovados pela ANAC antes de serem implementados,
  mediante requerimento, que deve estar acompanhado dos documentos de substanciação, de análises
  de engenharia e de resultados de ensaios, quando aplicável.

  APÊNDICES

  Apêndice A - Controle de Alterações.

  Apêndice B - Siglas.

  DISPOSIÇÕES FINAIS

  Os casos omissos serão dirimidos pela ANAC.


  APÊNDICE A - CONTROLE DE ALTERAÇÕES

  ALTERAÇÕES REALIZADAS NA REVISÃO B

  ITEM ALTERADO

  ALTERAÇÃO REALIZADA

  1.1

  Alterado o objetivo.

  1.2

  Alterada a aplicabilidade para pessoa jurídica, visto que a aprovação é emitida necessariamente
  para uma empresa, não sendo aplicável, no caso de artigos aeronáuticos, a aprovação para
  pessoa física.

  1.2

  Alterada a Nota para exclusão do texto "ou concretizar o objetivo do procedimento normalizado
  nesta IS".

  2

  Alterado para incluir a revogação da versão A da IS nº 21-005, de 8 de outubro de 2020.

  3.1

  Incluído a previsão legal do CBA que dispõe sobre a necessidade de certificação de produtos
  aeronáuticos.

  3.3

  Incluída as referências aos requisitos 21.8 e 21.9

  3.4

  Alterada a ordem e mantida a referência à Subparte K do RBAC 21 - Aprovação de Artigos e
  sua Fabricação.

  3.5

  Alterada a ordem e mantida a referência à Subparte O do RBAC 21 - Aprovação de Artigos Conforme
  uma Ordem Técnica Padrão e sua Fabricação.

  4.2

  Inclusão de definições adicionais às previstas em 4.1.'
