title: apendice-g-acordo-entre-detentor-de-aprovacao-de-producao-e-fornecedor(a)
text: 'a) identificar procedimentos para definir os processos de teste e inspeção necessários
  para:

  I - assegurar e determinar a conformidade dos artigos fornecidos durante as atividades de
  fabricação do fornecedor e no momento do recebimento pelo detentor da aprovação de produção;
  e

  II - qualificar o fornecedor (incluindo inspeção do primeiro artigo, FAI) e assegurar a
  conformidade de sua documentação associada.'
