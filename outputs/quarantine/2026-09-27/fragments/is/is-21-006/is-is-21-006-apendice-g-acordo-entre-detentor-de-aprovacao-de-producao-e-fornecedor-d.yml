title: apendice-g-acordo-entre-detentor-de-aprovacao-de-producao-e-fornecedor(d)
text: 'd) a notificação imediata para o detentor do COP dos artigos não conformes que deixarem
  o sistema da qualidade do fornecedor.

  G.15 Documento de Conformidade: especifica o documento pelo qual o fornecedor certifica
  a conformidade com os dados de projeto aplicáveis para o detentor do COP.

  G.16 Disposições para embarque direto (“direct shipment”): identifica a autorização e os
  requisitos para o embarque direto para os usuários finais a partir das instalações do fornecedor,
  com base em requisitos regulamentares relevantes. (Para requisitos sobre embarque direto,
  consulte o subparágrafo 5.3.6.11 desta IS).

  G.17Assistência para Aeronavegabilidade Continuada: identifica os procedimentos para a assistência
  do fornecedor para o detentor do COP sobre aeronavegabilidade continuada, incluindo métodos
  para notificar e ação sobre artigos não conformes notificados e já entregues, garantindo
  investigação e aplicação de ações corretivas adequadas.

  G.18 Subfornecedores'
