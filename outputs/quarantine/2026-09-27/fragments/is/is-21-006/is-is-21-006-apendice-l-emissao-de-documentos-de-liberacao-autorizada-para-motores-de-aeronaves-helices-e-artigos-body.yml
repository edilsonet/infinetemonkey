text: 'APÊNDICE L - EMISSÃO DE DOCUMENTOS DE LIBERAÇÃO AUTORIZADA PARA MOTORES DE AERONAVES,
  HÉLICES E ARTIGOS

  L.1 Este apêndice fornece orientação para qualquer requerente ou detentor de um COP no desenvolvimento
  de procedimentos para cumprir com a seção 21.137, parágrafo (o) do RBAC 21. Esses procedimentos
  são requeridos para que o detentor de um COP possa emitir documentos de liberação autorizada,
  usando o formulário F-100-01 (SEGVOO 003) da ANAC, para motores de aeronaves, hélices e
  artigos novos fabricados pelo detentor de um COP, ou para motores de aeronaves, hélices
  e artigos usados, quando reconstruídos, reparados ou alterados de acordo com o parágrafo
  43.3 (j) do RBAC 43.

  L.1.1 O detentor de um COP pode optar por emitir seus próprios documentos de liberação autorizada
  ou depender da ANAC ou de representantes credenciados para a emissão de certificados de
  liberação autorizada. O detentor de um COP é obrigado a ter procedimentos de acordo com
  a seção 21.137, parágrafo (o) somente se pretender emitir seus próprios documentos de liberação
  autorizada. No entanto, após a aprovação desses procedimentos, a ANAC espera que o detentor
  de um COP utilize o seu próprio sistema aprovado, em vez de depender da ANAC para a emissão
  do Formulário F-100-01 (SEGVOO 003).

  L.1.2 A Seção 21.137, parágrafo (o) requer que qualquer detentor de um COP que emita documentos
  de liberação autorizada estabeleça procedimentos do sistema de qualidade que prevejam a
  seleção, nomeação, treinamento, gerenciamento e remoção de indivíduos autorizados para a
  emissão de documentos de liberação autorizada. Esses procedimentos devem garantir que os
  indivíduos selecionados atendam aos requisitos de qualificação para um profissional credenciado
  em fabricação (PCF) da ANAC segundo o Grupo B, conforme descrito na IS 183-002, Credenciamento
  de Pessoa Física na SAR.

  L.2 Formação, Conhecimento e Experiência

  L.2.1 Ao selecionar e nomear pessoas autorizadas a emitir documentos de liberação autorizada,
  o detentor de um COP deve garantir que os indivíduos selecionados possuam conhecimentos
  sobre as regulamentações, políticas, diretrizes e procedimentos da ANAC e tenham a experiência
  técnica e as habilidades apropriadas para a complexidade do produto ou artigo para o qual
  um documento de liberação autorizada deve ser emitido. Além disso, os registros de seleção
  e nomeação devem demonstrar que a formação, o conhecimento e a experiência de cada pessoa
  selecionada demonstram sua integridade e capacidade de aplicar um julgamento adequado. A
  ANAC recomenda que os detentores de um COP analisem os padrões de conhecimento, experiência,
  habilidade e treinamento utilizados pela ANAC para selecionar e nomear representantes de
  acordo com o RBAC 183.

  L.3 Pessoal Autorizado

  L.3.1 Os procedimentos do detentor de um COP aprovados pela ANAC devem incluir uma relação
  de todo o pessoal autorizado a emitir documentos de liberação autorizada. Essa lista deve
  incluir cada membro individual autorizado por nome, função, escopo ou limitações, e o local
  em que as funções de cada indivíduo autorizado devem ser desempenhadas. Os procedimentos
  autorizados do detentor de um COP devem estar em conformidade com a política atual da ANAC
  e, no mínimo, abordar o seguinte:

  L.3.1.1 Um processo para determinar o número de indivíduos necessários para suportar o volume
  de trabalho da empresa.

  L.3.1.2 As funções, produtos ou artigos específicos para os quais o indivíduo autorizado
  emitirá documentos de liberação autorizada, e quaisquer locais onde esses serviços serão
  necessários, incluindo as instalações do detentor e de fornecedores aprovados.

  L.3.1.3 Conhecimento geral, tipo e duração da experiência, e requisitos de qualificação
  técnica necessários para uma função, produto ou artigo específicos.

  L.3.1.4 Os requisitos de treinamento e de aplicação de provas do detentor de um COP, incluindo
  provas e treinamentos iniciais, contínuos e recorrentes, e as frequências necessárias. Os
  tópicos de treinamento devem incluir:'
