title: apendice-l-emissao-de-documentos-de-liberacao-autorizada-para-motores-de-aeronaves-helices-e-artigos(k)
text: 'k) número de identificação da autorização (conforme apropriado).

  L.3.1.7 Um método para retirar uma autorização de uma instalação de fornecedor.

  L.3.1.8 Evidência de autorização. O método utilizado deve deixar claro para o detentor de
  um COP, para o indivíduo autorizado e para a ANAC quem é autorizado, qual o escopo e quais
  as limitações gerais de sua autorização.

  L.3.1.9 Um método para auditar a eficácia de todo o programa de emissão de documentos de
  liberação autorizada.

  L.3.1.10 Um processo para remover ou revisar o escopo da autorização de um indivíduo.

  L.3.1.11 O período de retenção para registros relacionados à emissão de cada documento de
  liberação autorizada (isto é, do formulário F-100-01, SEGVOO 003, da ANAC).

  NOTA 1 - O SEGVOO 003 é considerado uma aprovação de aeronavegabilidade, conforme definido
  pela seção 21.1 do RBAC 21, apenas quando emitido pela ANAC ou por um profissional credenciado
  pela ANAC. Quando o SEGVOO 003 é emitido pelo detentor de certificado de organização de
  produção com um sistema de qualidade aprovado que inclui os procedimentos descritos na seção
  21.137, parágrafo (o), o formulário é considerado um DLA, o que não constitui em aprovação
  em nome da ANAC, mas sim um atestado de conformidade cujo processo de emissão é reconhecido
  e supervisionado pela ANAC.

  L.4 Preenchendo o formulário F-100-01 (SEGVOO 003)

  L.4.1 A Seção 21.137, parágrafo (o) requer que qualquer detentor de um COP que escolha emitir
  documentos de liberação autorizada, tenha estabelecido um procedimento em seu sistema de
  qualidade para preencher documentos de liberação autorizada.

  L.4.2 Esse procedimento deve incluir requisitos para preencher o Formulário F-100-01 (SEGVOO
  003) da ANAC que atendam à IS 43.9-002. Ao estabelecer um procedimento para preencher os
  documentos de liberação autorizada, o detentor deve incorporar, por referência, quaisquer
  procedimentos aplicáveis ​​da IS 43.9-002. A revisão mais recente da IS 43.9-002 sempre
  terá as instruções mais atualizadas aplicáveis ​​a qualquer pessoa com autoridade para preencher
  os documentos de liberação autorizada. Blocos 14, 15, 16, 19, 20 e 21 requerem informações
  específicas de cada detentor. As seguintes instruções devem ser incluídas no procedimento
  para preencher os documentos de liberação autorizada:

  L.4.2.1 Bloco 14. Assinatura do Representante da ANAC. Este espaço deve ser assinado por
  uma pessoa autorizada. Apenas uma pessoa autorizada, sob um sistema de qualidade aprovado
  do detentor de um COP, que inclua procedimentos em conformidade a seção 21.137, parágrafo
  (o), pode assinar este bloco.

  L.4.2.2 Bloco 15. Nº Autorização da ANAC. Insira o número de aprovação ou autorização do
  representante autorizado identificado no Bloco 14. Além disso, insira o número da aprovação
  de produção aplicável.

  L.4.2.3 Bloco 16. Nome. Insira o nome do representante autorizado ou organização cuja assinatura
  aparece no Bloco 14.

  L.4.2.4 Bloco 19. Pessoa autorizada. Este espaço deve ser assinado por uma pessoa autorizada.
  Apenas uma pessoa autorizada, sob um sistema de qualidade aprovado do detentor de um COP,
  que inclua procedimentos em conformidade a seção 21.137, parágrafo (o), pode assinar este
  bloco.

  L.4.2.5 Bloco 20. Num COM/COA. Insira o número de aprovação ou autorização do representante
  autorizado identificado no Bloco 19. Além disso, insira o número da aprovação de produção
  aplicável.

  L.4.2.6 Bloco 21. Nome. Insira o nome do representante autorizado ou organização cuja assinatura
  aparece no Bloco 19.

  L.4.3 Se o detentor de um COP fabrica um produto ou artigo para exportação, o detentor é
  responsável por assegurar que o produto ou artigo está em conformidade com os acordos bilaterais
  aplicáveis ​​e com as seções 21.331 e 21.335.

  L.4.3.1 Se um exportador não puder cumprir com os parágrafos 21.331(a) e (c), deverá notificar
  a ANAC antes da emissão do Formulário F-100-01 (SEGVOO 003). A ANAC solicitará uma declaração
  da autoridade do país importar, indicando a aceitação do motor de aeronave, hélice ou artigo.
  As autoridades transmitirão e receberão pedidos de aceitação antes da exportação. Para que
  a documentação de exportação possa ser emitida, a ANAC notificará o exportador da resposta
  por escrito da autoridade do país importador.

  L.4.3.2 Conforme disposto nos parágrafos 21.331(b) e (d), se a autoridade local de um país
  ou jurisdição importadora aceitar quaisquer desvios aos parágrafos 21.331(a) e (c), o detentor
  de um COP deve listar como exceções quaisquer diferenças entre o motor de aeronave, hélice
  ou artigo no documento de liberação autorizada. Todos os desvios devem ser anotados no bloco
  12, Observações, do formulário F-100-01 (SEGVOO 003), com referência à declaração de aceitação
  por escrito da autoridade do país importador. O formulário também deve ser acompanhado de
  uma cópia dessa declaração de aceitação.'
