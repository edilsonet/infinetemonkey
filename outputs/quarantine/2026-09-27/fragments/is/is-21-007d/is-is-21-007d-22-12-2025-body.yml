text: '22.12.2025


  PREÂMBULO

  PREAMBLE

  Esta Instrução Suplementar (IS) é publicada em língua portuguesa e em língua inglesa, formatada
  em duas colunas, a da esquerda em português e a da direita em inglês, sendo o texto português
  o texto oficial.

  This Supplemental Instruction (IS) is published in Portuguese and in English, formatted
  in two columns, on the left is the Portuguese text and on the right is the English text.
  The Portuguese text is the official text.

  1. OBJETIVO

  1. OBJECTIVE

  Esta IS estabelece orientações sobre os requisitos de emissão de certificado de aeronavegabilidade
  para aeronaves da categoria leve esportiva.

  This IS provides guidelines on the requirements to the issuance of airworthiness certificate
  in the light-sport category aircraft.

  2. REVOGAÇÃO

  2. REVOCATION

  Esta IS substitui a IS nº 21-007 Revisão C.

  This IS supersedes IS nº 21-007 Revision C.

  3. FUNDAMENTOS

  3. LEGAL BASIS

  3.1 O parágrafo 4o do art. 67 da Lei nº 7.565, de 19 de dezembro de 1986 (Código Brasileiro
  de Aeronáutica - CBAer) estabelece que compete à autoridade de aviação civil regulamentar
  a emissão do certificado de aeronavegabilidade especial.

  3.1 Art. 67, §4th, of Law nº 7.565, dated December 19th, 1986 (Brazilian Aeronautical Code
  - CBAer) establishes that the civil aviation authority is responsible for regulating the
  issuance of the special airworthiness certificate.

  3.2 O art.5° da Lei nº11.182, de 27 de setembro de 2005, estabelece que a ANAC atuará como
  autoridade de aviação civil.

  3.2 Art. 5 of Law nº11.182, dated September 27th, 2005, establishes the ANAC as the Brazilian
  civil aviation authority.

  3.3 O parágrafo 21.175(b) do RBAC 21 estabelece que os certificados de aeronavegabilidade
  para aeronave categoria leve esportiva e os certificados de autorização de voo experimental
  são classificados como certificados de aeronavegabilidade especiais.

  3.3 Paragraph 21.175(b)(2) of RBAC 21 establishes that airworthiness certificates for light-sport
  aircraft category and experimental flight authorization certificates are classified as special
  airworthiness certificates.

  3.4 A seção 21.181 do RBAC 21 estabelece, dentre as condições para a validade do certificado
  de aeronavegabilidade especial na categoria leve esportiva, que as alterações na aeronave
  sejam realizadas de acordo com as normas aceitas pela ANAC e demais critérios.

  3.4 Section 21.181 of RBAC 21 establishes, among the conditions for validity of a special
  airworthiness certificate in the light-sport category, that alterations are carried out
  in accordance with the standards accepted by the ANAC and other criteria.

  3.5 A seção 21.190 do RBAC 21 requer, dentre as condições para a emissão do certificado
  de aeronavegabilidade especial na categoria leve esportiva, o cumprimento com normas aceitas
  pela ANAC.

  3.5 Section 21.190 of RBAC 21 requires, among the conditions for issuance of a special airworthiness
  certificate in the light-sport category, compliance with the standards accepted by the ANAC.

  4. DEFINIÇÕES

  4. DEFINITIONS

  4.1 Aeronave leve esportiva: significa uma aeronave, excluindo helicóptero ou aeronave cuja
  sustentação dependa diretamente da potência do motor (powered-lift), que, desde a sua certificação
  original, tem continuamente cumprido com as características definidas no RBAC nº 1.

  4.1 Light-sport aircraft: means an aircraft, other than a helicopter or powered-lift that,
  since its original certification, has continued to meet the characteristics defined in RBAC
  nº 1.

  5. DESENVOLVIMENTO DO ASSUNTO

  5. SUBJECT DEVELOPMENT

  5.1 Aplicabilidade

  5.1 Applicability

  Esta IS é aplicável à emissão de certificado de aeronavegabilidade para aeronaves categoria
  leve esportiva.

  This IS is applicable to the issuance of airworthiness certificate in the light-sport category
  aircraft.

  5.2 Normas aceitas pela ANAC

  5.2 Standards accepted by the ANAC

  5.2.1 As normas aceitas pela ANAC para a categoria leve esportiva são emitidas pelo Comitê
  F37 da ASTM International com a participação de autoridades internacionais de aviação civil,
  entre elas, ANAC e FAA.

  5.2.1 The standards accepted by the ANAC for the light-sport category are issued by the
  F37 Committee of ASTM International with the participation of international civil aviation
  authorities, including the ANAC and the FAA.'
