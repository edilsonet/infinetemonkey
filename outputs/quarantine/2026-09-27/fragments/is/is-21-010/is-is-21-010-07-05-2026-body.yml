  07/MAY/2026


  PREÂMBULO

  PREAMBLE

  Esta Instrução Suplementar (IS) é publicada em língua portuguesa e em língua inglesa, formatada
  em duas colunas, a da esquerda em português e a da direita em inglês, sendo o texto português
  o texto oficial.

  This Supplemental Instruction (IS) is published in Portuguese and in English, formatted
  in two columns, on the left is the Portuguese text and on the right is the English text.
  The Portuguese text is the official text.

  1. OBJETIVO

  1. OBJECTIVE

  Esta IS estabelece orientações sobre os requisitos especiais e procedimentos para a aprovação
  de produtos aeronáuticos civis estrangeiros e importação de quaisquer produtos aeronáuticos
  civis.

  This IS provides guidelines on the special requirements and procedures for approval of foreign
  civil aeronautical products and import of any civil aeronautical product.

  2. REVOGAÇÃO

  2. REVOCATION

  Esta IS substitui a IS nº 21-010 Revisão G.

  This IS replaces IS nº 21-010 Revision G.

  3. FUNDAMENTOS

  3. LEGAL BASIS

  3.1 O parágrafo 3o do art. 68 da Lei nº 7.565, de 19 de dezembro de 1986 (Código Brasileiro
  de Aeronáutica - CBAer) dispõe sobre a necessidade de certificação de produtos aeronáuticos,
  inclusive aqueles importados para o Brasil.

  3.1 Art. 68, § 3rd, of Law nº 7.565, dated December 19th, 1986 (Brazilian Aeronautical Code
  - CBAer) establishes the need for aeronautical products certification, including those imported
  to Brazil.

  3.2 A seção 21.29 do RBAC 21 estabelece requisitos quanto à validação de certificados de
  tipo estrangeiros. Os parágrafos 21.183(c), 21.184(b) e 21.185(c) do RBAC 21 estabelecem
  requisitos para emissão de certificados de aeronavegabilidade padrão e especial nas categorias
  primária e restrita para aeronaves importadas. A seção 21.500 do RBAC 21 define requisitos
  para importação de motores e hélices. Já a seção 21.621 do RBAC 21 trata de produtos importados
  que estejam de acordo com uma Ordem Técnica Padrão - OTP. Finalmente, a seção 21.502 do
  RBAC 21 abrange os demais produtos importados.

  3.2 Section 21.29 of RBAC 21 establishes requirements regarding the validation of foreign
  type certificates. Paragraphs 21.183(c), 21.184(b) and 21.185(c) of RBAC 21 establishes
  requirements for issuance of standard certificates of airworthiness, and special certificates
  of airworthiness for primary and restricted categories, for imported aircraft. Section 21.500
  of RBAC 21 defines requirements for importing engines and propellers. Section 21.621 of
  RBAC 21 addresses imported products that comply with a Technical Standard Order - TSO. Finally,
  section 21.502 of RBAC 21 covers other imported products.

  3.3 A seção 21.61-I do RBAC 21 estabelece requisitos para a inclusão de Dados Relevantes
  à Operação (Operational Suitability Data - OSD) ao certificado de tipo e para sua disponibilização.
  A seção 21.107-I do RBAC 21 contém requisitos aplicáveis ​​para modificações aos OSD.

  3.3 Section 21.61-I of RBAC 21 establishes requirements for inclusion of Operational Suitability
  Data - OSD to the type certificate and for its availability. Section 21.107-I of RBAC 21
  contains requirements applicable for changes to OSD.

  3.4 O parágrafo 21.190(b)(2) do RBAC 21 estabelece, dentre as condições para emissão de
  certificado de aeronavegabilidade especial na categoria leve esportiva, que a aeronave seja
  nova ou que já tenha tido previamente um certificado de autorização de voo experimental
  com propósito de operação de aeronave leve esportiva, desde que emitido de acordo com o
  previsto no parágrafo 21.191(i)(3) do RBAC 21.

  3.4 Paragraph 21.190(b)(2) of RBAC 21 establishes, amongst the conditions for issuance of
  a special airworthiness certificate in the light-sport category, that the aircraft shall
  be new or shall have been issued previously an experimental flight authorization certificate
  with purpose of operations of light-sport aircraft, provided that such certificate has been
  issued in accoordance with provisions of paragraph 21.191(i)(3) of RBAC 21.

  3.5 O parágrafo 21.191(g)-I do RBAC 21 estabelece requisitos para a emissão de certificado
  de autorização de voo experimental com propósito de operação de aeronave de construção amadora
  incluindo, dentre eles, que tal certificado não será emitido para aeronave importada pronta.

  3.5 Paragraph 21.191(g)-I of RBAC 21 establishes requirements for issuance of an experimental
  flight authorization certificate for the purpose of operation of amateur-built aircraft,
  including amongst them, that such certificate will not be issued to finished imported aircraft.

  3.6 O parágrafo 21.191(i)(3) do RBAC 21 estabelece que um certificado de autorização de
  voo experimental com propósito de operação de aeronave leve esportiva importada e que cumpra
  com os requisitos da seção 21.190 somente pode ser emitido se a aeronave for nova.

  3.6 Paragraph 21.191(i)(3) of RBAC 21 establishes that an experimental flight authorization
  certificate with purpose of operations of an imported light-sport aircraft that meets the
  of section 21.190 of RBAC 21 may only be issued if the aircraft is new.

  3.7 Há que se destacar também que o RBAC 01 define o termo “aprovado” como sendo aprovado
  pela ANAC ou por qualquer pessoa cuja competência de aprovação a ANAC reconheça no assunto
  em questão, incluindo outras autoridades de aviação civil.

  3.7 It is emphasized that RBAC 01 defines the term “approved” as being approved by ANAC
  or by any person whose approval competence is recognized by ANAC in the subject matter,
  including other Civil Aviation Authorities.

  4. DEFINIÇÕES

  4. DEFINITIONS

  4.1 Aeronave de construção amadora: De acordo com o parágrafo 21.191(g)-I do RBAC 21, é
  uma aeronave cuja porção maior foi construída por pessoas que realizaram a construção unicamente
  para sua própria educação ou recreação.

  4.1 Amateur-built aircraft: According to paragraph 21.191(g)-I of RBAC 21, it is an aircraft
  whose major portion was built by persons who undertook the construction project solely for
  their own education or recreation.

  4.2 Aeronave leve esportiva: significa uma aeronave, excluindo helicóptero ou aeronave cuja
  sustentação dependa diretamente da potência do motor (powered-lift), que, desde a sua certificação
  original, tem continuamente cumprido com as características definidas no RBAC 01.

  4.2 Light-sport aircraft: means an aircraft, other than a helicopter or powered-lift that,
  since its original certification, has continued to meet the characteristics defined in RBAC
  01.

  4.3 Aparelho: significa qualquer instrumento, equipamento, mecanismo, componente, peça,
  dispositivo, pertence ou acessório, incluindo equipamentos de comunicações, que é usado,
  ou com intenção de uso, na operação ou no controle de uma aeronave em voo e está instalado
  ou acoplado na aeronave e não faz parte da célula, do motor ou da hélice.

  4.3 Appliance: means any instrument, mechanism, equipment, part, apparatus, appurtenance,
  or accessory, including communications equipment, that is used or intended to be used in
  operating or controlling an aircraft in flight, is installed in or attached to the aircraft,
  and is not part of an airframe, engine, or propeller.

  4.4 Artigo: significa um material, peça, componente, processo ou aparelho.

  4.4 Article: means a material, part, component, process, or appliance.

  4.5 Dados Relevantes à Operação (Operational Suitability Data - OSD): significam as informações
  produzidas durante a certificação de tipo que são relevantes para a operação segura da aeronave,
  cujos elementos incluem os FCD e a MMEL, conforme definido no RBAC 01.

  4.5 Operational Suitability Data - OSD: means data produced during type certification which
  are relevant to the aircraft safe operation, whose elements include the FCD and the MMEL,
  as defined in RBAC 01.

  4.6 Dados Relevantes à Operação para Pilotos (Flight Crew Data - FCD): significam aqueles
  OSD relacionados à determinação da habilitação de tipo para piloto e especificações recomendadas
  para treinamento mínimo, exame e experiência recente.

  4.6 Flight Crew Data - FCD: means those OSD related to the determination of the pilot type
  rating and recommended specifications for minimum training, checking and currency.

  4.7 Especificação de tipo (Type Certificate Data Sheet - TCDS): significa o documento que
  compõe o certificado de tipo e é publicado e disponibilizado pela ANAC. A especificação
  de tipo sumariza as características relevantes do produto sob o ponto de vista de aeronavegabilidade
  e proteção ambiental e traz, ainda, condições e limitações necessárias para o cumprimento
  com os requisitos presentes na base de certificação do produto.

  NOTA: As Especificações de Tipo emitidas em português também podem ser encontradas sob as
  designações Especificação de Aeronave, Especificação de Motor ou Especificação de Hélice.

  4.7 Type Certificate Data Sheet - TCDS: means the document included in the type certificate
  and is published and made available by ANAC. The type certificate data sheet summarizes
  the relevant characteristics of the product in terms of airworthiness and environmental
  protection and contains, additionally, conditions and limitations necessary for the compliance
  with the requirements listed in the certification basis of the product.

  NOTE: Type Certificate Data Sheets issued in Portuguese may be also found under designations
  Especificação de Aeronave, Especificação de Motor or Especificação de Hélice.

  4.8 Estado de Projeto (State of Design): significa o país ou união de países que tem autoridade
  regulatória sobre a organização responsável pelo projeto e aeronavegabilidade continuada
  de um produto ou artigo utilizado na aviação civil.

  4.8 State of Design: means the country or union of countries having regulatory authority
  over the organization responsible for the design and continued airworthiness of a product
  or an article used in civil aviation.

  4.9 Lista Mestra de Equipamentos Mínimos (Master Minimum Equipment List - MMEL): significa
  um documento aprovado para um tipo ou modelo específico de aeronave que lista itens que
  podem estar temporariamente inoperantes, observadas as limitações, procedimentos e condições
  especiais de operação ali descritas, conforme aplicável.

  4.9 Master Minimum Equipment List - MMEL: means an approved document for a specific aircraft
  type or model which lists items that may be temporarily inoperative, provided that limitations,
  procedures and special operating conditions therein described are met, as applicable.

  4.10 Peça comercial: significa um artigo que está na lista de peças comerciais aprovada
  pela ANAC ou pela Autoridade de Aviação Civil do Estado de Projeto, incluída nas instruções
  de aeronavegabilidade continuada de um detentor de aprovação de projeto, conforme requerido
  pela seção 21.50 do RBAC 21 ou requisito equivalente no Estado de Projeto.

  4.10 Commercial part: means an article that is listed in the Commercial Parts List approved
  by ANAC or by the Civil Aviation Authority from the State of Design, included in a design
  approval holder’s instructions for continued airworthiness in accordance with section 21.50
  of RBAC 21 or equivalent requirement in the State of Design.

  4.11 Peça normalizada ou padronizada: Peça fabricada de acordo com especificações governamentais
  ou de larga aceitação pela indústria que inclui projeto, fabricação e requisitos de identificação.
  A especificação deve incluir toda a informação necessária para produzir a peça em série.
  A especificação deve ser publicada de maneira que qualquer um possa fabricar a peça. Alguns
  exemplos incluem, mas não se limitam à: National Aerospace Standards - NAS, Air Force-Navy
  Aeronautical Standard - AN, SAE International, Aerospace Standard - AS, Military Standard
  - MS, etc.

  4.11 Standard part: A part manufactured in accordance with an established governmental or
  industry-accepted specification, which includes design, manufacturing, and identification
  requirements. The specification must include all information necessary to produce in series
  the part. The specification must be published so that any party may manufacture the part.
  Examples include, but are not limited to, National Aerospace Standard - NAS, Air Force/Navy
  - AN Aeronautical Standard, SAE International, Aerospace Standard - AS, Military Standard
  - MS, etc.

  4.12 Produto: significa aeronave, motor ou hélice, e seus componentes.

  4.12 Product: An aircraft, engine or propeller, and its components.

  4.13 Produto novo: a menos que definido de forma diferente em acordo internacional com a
  Autoridade de Aviação Civil do país exportador, um produto é novo nas seguintes situações:

  4.13 New product: unless defined otherwise in an international agreement with the Civil
  Aviation Authority of the exporting country, a product is considered new in the following
  cases:

  a) uma aeronave é nova no tempo em que estiver sob a propriedade do seu fabricante, distribuidor
  ou negociante, ou seu administrador; se não houver a intervenção de um proprietário particular,
  leasing ou acordo de compartilhamento; e se a aeronave não tiver sido utilizada em escola
  de pilotagem e / ou operação de táxi aéreo; ou

  a) an aircraft is new while it is still owned by the manufacturer, distributor, or dealer,
  or their trustee, if there is no intervening private owner, lease, or time sharing arrangement,
  and the aircraft has not been used in any pilot school and/or other commercial operation;
  or

  b) um produto que não seja aeronave é novo enquanto não possuir nenhum tempo em serviço
  em uma aeronave.

  b) a product other than an aircraft is new while it does not have any time in service in
  an aircraft.

  4.14 Produto usado: significa qualquer produto que não seja novo.

  4.14 Used product: means any product which is not new.

  4.15 Validação: significa o processo executado pela ANAC, no qual emite seu próprio certificado
  em equivalência ao certificado original, com o objetivo de verificar o cumprimento com os
  requisitos brasileiros de aeronavegabilidade e de proteção ambiental.

  4.15 Validation: the process performed by ANAC to issue its own certificate, equivalent
  to the original type certificate (or supplemental type certificate), in order to find compliance
  with Brazilian airworthiness and environmental protection requirements.

  5. DESENVOLVIMENTO DO ASSUNTO

  5. SUBJECT DEVELOPMENT

  5.1 Aplicabilidade

  5.1 Applicability

  Esta IS é aplicável a:

  This IS is applicable to:

  a) aprovação no Brasil do projeto de todas as aeronaves civis e todos os motores e hélices
  de aeronaves civis, incluindo suas modificações, a serem utilizados no Brasil, para os quais
  o Estado de Projeto não seja o próprio Brasil; e

  a) design approval in Brazil of all civil aircraft and all civil aircraft engines and propellers,
  including their design changes, to be employed in Brazil, when Brazil is not the State of
  Design; and

  b) importação de produtos civis.

  b) import of civil products.

  5.2 Informações gerais

  5.2 General Information

  5.2.1 De acordo com os parágrafos 21.183(c), 21.184(b) e 21.185(c) do RBAC 21, para ser
  elegível a um Certificado de Aeronavegabilidade Padrão - CA Padrão ou a um CA Especial nas
  categorias primária ou restrita, uma aeronave a ser exportada para o Brasil, independentemente
  de ser nova ou usada, deve:

  5.2.1 According to paragraphs 21.183(c), 21.184(b) and 21.185(c) of RBAC 21, to be eligible
  for a Brazilian Standard Certificate of Airworthiness or Special Certificate of Airworthiness
  for primary or restricted categories, an aircraft to be exported to Brazil, whether new
  or used, must:

  a) estar de acordo com um Certificado de Tipo - CT brasileiro, um CT validado no Brasil
  ou um CT do Estado de Projeto, no caso de aeronaves consideradas isentas (vide parágrafo
  5.2.3); e

  a) Be in accordance with a Brazilian Type Certificate - TC, a TC validated in Brazil or
  a TC issued by the State of Design, in case of aircraft considered exempt (refer to paragraph
  5.2.3); and

  b) possuir uma aprovação de aeronavegabilidade para exportação (geralmente, um certificado
  de aeronavegabilidade para exportação), emitido pelo país exportador.

  b) Have an export airworthiness approval (usually, an export certificate of airworthiness)
  issued by the exporting country.


  5.2.2 Para ser elegível para instalação em aeronave com CA Padrão ou CA Especial nas categorias
  primária ou restrita, emitidos pela ANAC de acordo com as seções 21.183, 21.184 ou 21.185
  do RBAC 21, um motor, uma hélice ou qualquer outro componente exportado para o Brasil deve:

  5.2.2 To be eligible for installation in an aircraft having a Standard Certificate of Airworthiness
  or a Special Certificate of Airworthiness for primary or restricted categories, issued by
  ANAC in accordance with sections 21.183, 21.184 or 21.185 of RBAC 21, an engine, propeller
  or any component exported to Brazil must:

  a) estar de acordo com um CT brasileiro, um CT validado no Brasil (vide orientações na subseção
  5.4 desta IS) ou um CT do Estado de Projeto, no caso de motores ou hélices considerados
  isentos (vide parágrafo 5.2.3); e

  a) Be in conformity to a Brazilian TC, a TC validated in Brazil (see guidelines in subsection
  5.4 of this IS) or a TC issued by the State of Design, in case of engines or propellers
  considered exempt (refer to paragraph 5.2.3); and

  b) possuir uma aprovação de aeronavegabilidade para exportação, emitida pelo país exportador.

  b) Have an export airworthiness approval issued by the exporting country.

  5.2.3 Certos modelos de aeronaves, motores ou hélices de aeronaves, exportados para o Brasil
  quando um certificado de tipo brasileiro ainda não era exigido, podem ser elegíveis a uma
  isenção de emissão de tal certificado, de acordo com a seção 21.29 do RBAC 21. Para beneficiar-se
  de tal isenção, o requerente deve obter uma declaração da ANAC, reconhecendo o CT do Estado
  de Projeto como equivalente ao certificado brasileiro. Estas disposições podem ser estendidas
  a outro modelo de aeronave, motor ou hélice, desde que tal modelo seja considerado pela
  ANAC como substancialmente similar, em termos de projeto e certificação, a um modelo de
  aeronave, motor ou hélice considerado isento. Para gozar deste tratamento, o requerente
  deverá apresentar todos os dados técnicos que venham a ser exigidos pela ANAC.

  5.2.3 Certain aircraft models, aircraft engines or propellers exported to Brazil, when a
  Brazilian type certification was not required yet, may be eligible to an exemption from
  such certificate, in accordance with section 21.29 of RBAC 21. In order to benefit from
  such exemption, the applicant should have an ANAC statement, recognizing the State of Design
  type certificate as equivalent to the Brazilian certificate. These provisions may be extended
  to another aircraft, engine or propeller model, as long as such model is considered by the
  ANAC as substantially similar, with respect to design and certification, to an aircraft,
  engine or propeller model considered as exempt. In order to make use of this treatment,
  the applicant must present all technical data that may be required by the ANAC.

  5.2.4 Uma lista de produtos que receberam o CT brasileiro, e uma lista de produtos para
  os quais o CT estrangeiro foi reconhecido no Brasil, está disponível em www.anac.gov.br/certificacao.

  5.2.4 A list of products that received the Brazilian type certificate and a list of products
  for which a foreign type certificate was recognized in Brazil are available at https://sistemas.anac.gov.br/certificacao/IndexE.asp.

  5.2.5 Exceto nas situações descritas no parágrafo 5.2.6, para ser elegível para instalação
  em uma aeronave com CA Padrão brasileiro, qualquer modificação aprovada de acordo com um
  Certificado Suplementar de Tipo - CST estrangeiro deve ser validado no Brasil através de
  um CST emitido de acordo com o RBAC 21, com base na aprovação do Estado de Projeto da modificação
  (vide mais orientações na subseção 5.5 desta IS).

  5.2.5 Except in the situations described in paragraph 5.2.6, to be eligible for installation
  in an aircraft with a Brazilian Standard Airworthiness Certificate, any change approved
  according to a foreign Supplemental Type Certificate must be validated in Brazil through
  the issuance of a Brazilian Supplemental Type Certificate (CST) as established in RBAC 21,
  based on the State of Design change approval (see guidelines in subsection 5.5 of this IS).

  5.2.6 Grandes modificações aprovadas de acordo com um CST estrangeiro, e já instaladas na
  aeronave, no momento da importação, podem ser aceitas pela ANAC (vide mais orientações na
  subseção 5.6 desta IS).

  5.2.6 Major changes approved in accordance with foreign Supplemental Type Certificate, and
  already installed in the aircraft at the moment of the import, may be acceptable to ANAC
  (see further guidelines in subsection 5.6 of this IS).

  5.2.7 Para ser elegível para uso em uma aeronave com CA Padrão brasileiro, ou em motor e
  hélice operando no Brasil, a instalação de qualquer artigo TSO/ETSO (ou equivalente) ou
  componente, deve estar aprovada pela ANAC através de (vide mais informações nas subseções
  5.7 e 5.8 desta IS):

  5.2.7 In order to be eligible for use in an aircraft with Brazilian standard certificate
  of airworthiness, or in an engine and a propeller operating in Brazil, the installation
  of any TSO / ETSO (or equivalent) article or component must be approved by ANAC through
  (see more information in subsections 5.7 and 5.8 of this IS):

  a) um CT brasileiro; ou

  a) A Brazilian type certificate; or

  b) um CT validado ou reconhecido no Brasil; ou

  b) A type certificate validated or recognized in Brazil; or

  c) um CST brasileiro (veja a IS 21-004); ou

  c) A Brazilian supplemental type certificate (see IS-21-004); or

  d) um CST estrangeiro validado (veja subseção 5.5 desta IS); ou

  d) A validated foreign supplemental type certificate (see subsection 5.5 of this IS); or

  e) um CST estrangeiro, conforme a subseção 5.6 desta IS.

  e) A foreign supplemental type certificate, according to subsection 5.6 of this IS.

  5.3 Validação de certificado de tipo para aeronaves importadas

  5.3 Validation of Type Certificate for Imported Aircraft

  5.3.1 O fabricante estrangeiro da aeronave em questão deve preencher o formulário de requerimento
  F-101-11 (disponível em www.anac.gov.br/certificacao), ou elaborar uma carta com as informações
  solicitadas em tal formulário, e encaminhar à ANAC através da autoridade do Estado de Projeto.
  Os documentos poderão ser enviados pelo e-mail progcert@anac.gov.br.

  5.3.1 An ANAC application form F-101-11 (available at https://sistemas.anac.gov.br/certificacao/indexE.asp)
  or an application letter with the same information required by the form shall be completed
  by the foreign manufacturer of the concerned aircraft and forwarded to ANAC through the
  State of Design Authority. Documents may be sent to the e-mail address progcert@anac.gov.br.

  5.3.2 Devem ser apresentadas informações suficientes para permitir que a ANAC tenha condições
  de definir o tipo de validação, a equipe e seu nível de envolvimento. Devem ser seguidas
  as orientações contidas no Apêndice C desta IS.

  5.3.2 Sufficient information shall be presented to allow ANAC to define the type of validation,
  the team and its level of involvement. The guidelines contained in Appendix C of this IS
  shall be followed.

  5.3.3 O texto da autoridade estrangeira de todas as condições especiais, níveis equivalentes
  de segurança e isenções de requisitos de aeronavegabilidade, ruído e emissões deve ser disponibilizado
  para análise da ANAC.

  5.3.3 The text of all special conditions issued by the State of Design Authority, as well
  as equivalent levels of safety and exemptions from airworthiness, noise or emissions requirements
  shall be made available for ANAC review.

  5.3.4 Uma lista de verificação de cumprimento (compliance checklist) com a base de certificação,
  indicando para cada item do requisito como ele foi cumprido (por ensaio, análise, cálculo,
  etc.) e o título e número do documento de substanciação correspondente (relatório, desenho,
  especificação, etc.) deve ser colocada à disposição da ANAC para sua análise. Adicionalmente,
  tais documentos de substanciação devem ser apresentados, se assim exigido.

  5.3.4 A compliance checklist with the certification basis indicating, for each item of each
  requirement, how it was complied with (by test, analysis, calculation, design provisions,
  etc.) and the title and number of the corresponding substantiation document (report, drawing,
  specification, etc.) shall be made available to ANAC for review. Additionally, these substantiation
  documents shall be presented, if required.

  5.3.5 De acordo com a seção 21.41-I do RBAC 21, as marcações e placares requeridos e instalados
  na cabine de passageiros ou nos compartimentos de carga, bagagem ou armazenamento e no exterior
  da aeronave, devem ser apresentados em português ou forma bilíngue (português e outra língua).

  5.3.5 According to section 21.41-I of RBAC 21, the required markings and placards installed
  in passenger cabin, cargo, baggage or stowage compartments and in the aircraft exterior
  shall be presented in Portuguese or in a bilingual way (Portuguese and another language).

  5.3.6 Um Manual de Voo da Aeronave (Aircraft Flight Manual) deve ser apresentado e ele deve
  ser aplicável às aeronaves registradas no Brasil. Alterações eventualmente requeridas para
  serem incorporadas no Manual de Voo da Aeronave serão inclusas diretamente nas páginas afetadas
  do Manual de Voo da Aeronave ou em seu Suplemento para operação no Brasil.

  5.3.6 An Aircraft Flight Manual shall be presented and shall be applicable to aircraft registered
  in Brazil. Alterations occasionally required to be incorporated in the Aircraft Flight Manual
  will be included directly on the affected pages of the Brazilian Aircraft Flight Manual
  or in its Supplement for operation in Brazil.

  5.3.7 De acordo com o parágrafo 21.29(a)(4)-I do RBAC 21, os Dados Relevantes à Operação
  - OSD a serem incluídos no CT devem ter sido previamente aprovados ou emitidos pelo Estado
  de Projeto. Eventuais diferenças nos OSD em razão de particularidades no projeto de tipo
  ou requisitos brasileiros poderão ser aceitas ou aprovadas pela ANAC. A ANAC poderá avaliar,
  mediante solicitação do requerente, a possibilidade de inclusão no CT de OSD emitido ou
  aprovado pela Federal Aviation Administration - FAA dos Estados Unidos da América, European
  Union Aviation Safety Agency - EASA ou Transport Canada Civil Aviation - TCCA, no caso de
  um determinado elemento de OSD não existir no país de projeto.

  5.3.7 According to paragraph 21.29(a)(4)-I of RBAC 21, the Operational Suitability Data
  - OSD to be included in the TC shall have been previously approved or issued by the State
  of Design. Eventual differences in the OSD due to particularities in Brazilian type design
  or requirements may be accepted or approved by ANAC. ANAC may evaluate, upon request of
  the applicant, the possibility of inclusion in the TC of OSD issued or approved by Federal
  Aviation Administration - FAA of United States of America, European Union Aviation Safety
  Agency - EASA or Transport Canada Civil Aviation - TCCA, in case a certain OSD element does
  not exist in the State of Design.

  5.3.8 De acordo com o parágrafo 21.61-I(e)(3) do RBAC 21, um certificado de tipo, quando
  o requerimento tenha sido realizado após 1º de janeiro de 2025, deve incluir uma MMEL aprovada
  antes da emissão do primeiro certificado de aeronavegabilidade padrão exceto para pequenas
  aeronaves de asas rotativas, pequenos aviões com motores convencionais, planadores e aeronaves
  mais leves que o ar. Nos casos excetuados acima, a aprovação de uma MMEL é facultativa.
  Vide a IS n° 21.61-005 (Lista Mestra de Equipamentos Mínimos - MMEL) para maiores detalhes.

  5.3.8. According to paragraph 21.61-I(e)(3) of RBAC 21, a type certificate, when the application
  has been made after January 1st, 2025, must include an MMEL approved prior to the issuance
  of the first standard airworthiness certificate except for small rotorcraft, small reciprocating-engine
  powered airplanes, gliders and lighter-than-air aircraft. In the cases exempted above, the
  approval of an MMEL is optional. Refer to IS No. 21.61-005 (Master Minimum Equipment List
  - MMEL) for further details.

  5.3.9 De acordo com o parágrafo 21.61-I(a) do RBAC 21, o detentor ou requerente de um certificado
  de tipo ou suplementar de tipo para uma aeronave para a qual seja requerida habilitação
  de tipo para pilotos, conforme o RBAC 61, deve realizar uma campanha de avaliação operacional
  de forma aceitável e com resultado satisfatório caso tenha intenção de que sejam incluídos
  FCD no respectivo certificado. Vide a IS n° 21.61-001 (Dados Relevantes à Operação para
  Pilotos - FCD) para maiores detalhes.

  5.3.9 According to paragraph 21.61-I(a) of RBAC 21, the holder of or applicant to a type
  certificate or supplemental type certificate for an aircraft model for which a pilot type
  rating is required, according to RBAC 61, shall perform an operational evaluation campaign
  in an acceptable manner and with satisfactory result if intending to include flight crew
  data in the respective certificate. Refer to IS No. 21.61-001 (Flight Crew Data - FCD) for
  further details.

  5.3.10 De acordo com a seção 21.107-I do RBAC 21, o detentor de um CT de aeronave que possua
  OSD deve avaliar o impacto aos OSD no caso de requerimento para aprovação de modificações
  ao CT realizados após 1° de janeiro de 2025, devendo demonstrar que os OSD existentes permanecem
  válidos à aeronave com a modificação incorporada, ou complementar o requerimento de aprovação
  da modificação com a atualização dos OSD afetados. Tal avaliação não impede a aprovação
  da modificação, todavia deve ser realizada antes da operação de uma aeronave com certificado
  de aeronavegabilidade padrão brasileiro com a modificação incorporada. Ainda assim, caso
  o requerente não cumpra com tais provisões, a ANAC poderá limitar o uso dos OSD afetados
  pela modificação, conforme critérios detalhados nas IS n°s 21.61-005 e 21.61-001.

  NOTA 1: Relatórios de avaliação operacional e MMEL emitidos ou aprovados pela ANAC até 1°
  de janeiro de 2025 devem também ser avaliados quanto ao impacto das modificações ao CT mencionadas
  acima.

  NOTA 2: Ainda que não obrigatório, é recomendado que o requerente proponha atualizações
  em tais MMEL ou Relatórios de Avaliação Operacional caso verifique que as versões válidas
  em 1° de janeiro de 2025 estejam desatualizadas em razão de modificações realizadas até
  aquela data.

  5.3.10 According to section 21.107-I of RBAC 21, the holder of a TC of an aircraft having
  OSD shall assess the impact on OSD in case of application for approval for a change to the
  TC submitted after January 1st, 2025, by demonstrating that the existing OSD remain valid
  to the aircraft with the embodied modification, or by complementing the the change approval
  application with an update to the affected OSD. Such assessment does not prevent the change
  approval, however it shall be done prior to the operation of an aircraft having a Brazilian
  standard certificate of airworthiness with the embodied modification. Even so, in case the
  applicant does not comply with such provisions, ANAC my limit the use of the OSD affected
  by the change, according to the criteria detailed in IS No. 21.61-005 and 21.61-001.

  NOTE 1: Operational Evaluation Reports and MMEL issued or approved by ANAC until January
  1st, 2025 shall also be assessed upon the impact of the abovementioned changes to the TC.

  NOTE 2: Even though not being mandatory, it is recommended to the applicant to propose updates
  to such MMEL or Operational Evaluation Report if it verifies the versions valid on January
  1st, 2025 are outdated due to changes performed until that date.

  5.3.11 As unidades de ajuste barométrico da indicação dos instrumentos de altitude, incluindo
  os altímetros de reserva e os indicadores de altitude da cabine devem ser apresentadas em
  “mbar” ou “hPa”. Todos os outros instrumentos devem mostrar unidades aceitas usual e tradicionalmente.
  Entretanto, as unidades usadas nos instrumentos devem ser consistentes com as apresentadas
  nos Manuais de Voo e Serviço. Para as marcações e placares requeridos em português, o Sistema
  Internacional de Unidades ou as unidades alternativas tradicionalmente aceitas (como "psi",
  etc.) devem ser usadas.

  5.3.11 The barometric setting units of the altitude indication instruments, including standby
  altimeters and cabin altitude indicators, shall be presented in "mbar" or "hPa". All other
  instruments must display usual and traditionally accepted units. However, the units used
  in the instruments shall be consistent with those presented in the Flight and Service Manuals.
  For the required markings and placards in Portuguese, the International System of Units
  or the traditionally accepted alternative units (such as "psi") shall be used.

  5.3.12 Uma análise de engenharia do programa de certificação de tipo, conduzido pelo Estado
  de Projeto, será realizada pela ANAC, para identificar o cumprimento com os requisitos brasileiros
  e as condições especiais para aceitação do modelo de aeronave. Esta análise será conduzida
  por meio de reuniões, ou por correspondência com os representantes do fabricante e da autoridade
  do Estado de Projeto. Ao final do processo, a ANAC irá apresentar o relatório final de validação,
  listando os requisitos para aceitação do modelo de aeronave.

  5.3.12 An engineering review of the type certification program conducted in the foreign
  country shall be performed by the ANAC to establish the Brazilian requirements and special
  conditions for acceptance of the aircraft model. This review shall be conducted through
  meetings or by correspondence with the manufacturer and with the State of Design Authority
  representatives. At the end of such process, the ANAC will present a final validation report
  listing the requirements for acceptance of that aircraft model.

  5.3.13 Os dados exigidos pela ANAC estarão listados no relatório de validação mencionado
  no parágrafo anterior e deverá incluir todos os documentos publicados (Manual de Voo da
  Aeronave, MMEL, FCD, Manuais de Manutenção e Reparo, Catálogo de Peças Ilustrado, Diagramas
  elétricos, Manual de Peso e Balanceamento, Boletins de Serviço, etc.) e os documentos não
  publicados (relatórios de engenharia, desenhos, especificações do fabricante, etc.) considerados
  necessários para substanciar a aprovação brasileira e para dar suporte à aeronavegabilidade
  continuada das aeronaves no Brasil.

  5.3.13 The data required by the ANAC are listed in the validation report mentioned in the
  previous paragraph and shall include all published documents (Aircraft Flight Manual, MMEL,
  FCD, Maintenance and Repair Manuals, Illustrated Parts Catalogs, Wiring Diagrams, Weight
  and Balance Manuals, Service Bulletins, etc.) and non-published documents (engineering reports,
  drawings, manufacturer specifications etc.) deemed necessary to substantiate the Brazilian
  approval and support the continued airworthiness of the aircraft in Brazil.

  5.3.14 Os documentos publicados devem ser fornecidos à ANAC preferencialmente em formato
  eletrônico com acesso online e disponibilização de login e senha. Caso alguma publicação
  não esteja disponível online, solicita-se o envio da mesma para o e-mail biblioteca.central@anac.gov.br.

  5.3.14 The published documents shall be supplied to ANAC preferably in electronic format
  through online access with login and password. In case any publication is not available
  online, it shall be sent by e-mail to biblioteca.central@anac.gov.br.'
