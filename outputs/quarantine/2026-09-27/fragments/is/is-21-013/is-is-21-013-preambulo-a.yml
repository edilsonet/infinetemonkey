  RNAV5); velocidade no solo ou tempo para o próximo waypoint (todas); distância

  e proa para o próximo waypoint (todas); e distância entre dois waypoints do plano

  de voo (RNP APCH).

  1.5 Seleção da fonte de navegação

   Descrever e avaliar como é a seleção da fonte de navegação apresentada no instrumento
  de navegação.

  Resultados esperados Aceit. Inac.

  Sistemas com possibilidade de apresentar informações de múltiplas fontes de

  navegação (RNAV ou convencionais) em um único indicador (CDI, HSI, EHSI,

  entre outros) deverão possuir um meio de seleção da fonte de navegação

  desejada pelo piloto.

  O anúncio de navegação deve estar no CVPO, dentro ou próximo ao instrumento

  de navegação primário. Quando externo, estar localizado no lado da centerline

  do “T” básico.

  1.6 Banco de dados de navegaçãoOrigem: SAR 46/65

   Anotar e avaliar como se faz para verificar a validade do banco de dados do equipamento
  GNSS.

  Resultados esperados Aceit. Inac.

  Existência de meio de exibição da data de validade do banco de dados de

  navegação.

  Capacidade de carregar nos sistemas PBN, a partir do banco de dados de

  navegação, pelo nome e por inteiro, os procedimentos de navegação (por

  exemplo, procedimentos SID - Standard Instrument Departure e STAR -

  Standard Terminal Arrive Route). (RNAV 2 RNAV 1 e RNP 1)

  1.7 Ajuste manual de pressão barométrica corrigida para o equipamento GNSS (se existir)

   Avaliar a carga de trabalho para introduzir o ajuste de pressão barométrica no equipamento
  GNSS e

  verificar se existe alerta para o piloto realizar tal operação.

  Resultados esperados Aceit. Inac.

  Deve ser fornecido um alerta para o piloto durante a aproximação, indicando a

  necessidade de introduzir o ajuste da pressão barométrica no equipamento

  GNSS.

  1.8 Função OBS

   Verificar e anotar como é acionada a função OBS do GNSS.

  1.9 Configuração do equipamento GNSS

   Anotar a configuração do equipamento GNSS.

  Ação Anotar

  (1) Selecionar medidas usuais

  (2) Selecionar alarme de WPT < 2MN e < 1 min

  (3) Selecionar SBAS OFF

  (4) Selecionar modo automático de operação do GNSS

  (5) Inserir plano de voo GNSS com mudança de perna de

  navegação com mais de 90º e procedimento de subidaOrigem: SAR 47/65

  1.10 Mapeamento remoto

   Verificar se há mapeamento de waypoints remoto e descrever.

  2 Interligação do diretor de voo/piloto automático com o sistema de navegação GNSS

  (1) Ativar um plano de voo GNSS com mudança de perna de navegação com mais de 90º com procedimento

  de subida;

  (2) Selecionar fonte de navegação GNSS no indicador de navegação;

  (3) Selecionar o modo de operação do GNSS desejado;

  (4) Posicionar a aeronave afastada lateralmente pelo menos 3 MN do curso GNSS e a mais de
  5 min do

  próximo waypoint;

  (5) Acoplar o modo de navegação “NAV” desejado do DV/PA;

  (6) Inserir uma proa de interceptação defasada 60º com o curso ativo;

  (7) Repetir os passos (4) a (6) para todos os modos de operação do GNSS (5 MN, 2 MN e 1
  MN);

  (8) Repetir os passos os ensaios com os modos de navegação “APR” e “GNSS”.

   Verificar e descrever:

  - Como é anunciado o acoplamento do modo de navegação do DV/PA;

  - Como é o comportamento do DV/PA durante a interceptação do curso, a manutenção da rota
  e a

  mudança de perna de navegação; e

  - Como é a mudança de proa do cursor no CDI, HSI ou EHSI (automática ou não).

  OBSERVAÇÃO: verificar as indicações coerentes do DV enquanto o PA comanda a aeronave.

  Evento Resultados obtidos

  Modo NAV Modo APR Modo GNSS

  Anunciação do modo de

  navegação do DV/PA

  Acoplamento dos modos de

  navegação do DV/PA

  Comportamento do DV/PA

  durante a interceptação

  Comportamento do DV/PA

  na manutenção da rota

  GNSS

  Comportamento do DV/PA

  durante a mudança de

  perna de navegação

  Mudança de proa do curso

  no CDI, HSI ou EHSI

  Resultados esperados Aceit. Inac.

  Os modos de operação do DV/PA, bem como os modos armados para

  engajamento, devem ter uma indicação contínua e inequívoca, o que inclui uma

  indicação clara de quando o modo foi selecionado manualmente pela tripulação, ou

  automaticamente pelo sistema.Origem: SAR 48/65

  É fortemente recomendado que os modos de navegação do DV/PA relacionados

  com a fonte de navegação sejam inibidos se a fonte apresentada no indicador de

  navegação não for a mesma fonte acoplada ao DV/PA.

  O equipamento GNSS deve ser compatível com os modos de operação do DV/PA.

  Por exemplo, as funções “armar” (arm), “engajar” (engage) e a sequência para

  desengajar (disengage sequence) do GNSS devem ser consistentes no tempo de

  resposta para anúncios e acoplamento/desacoplamento do DV/PA.

  Nos casos onde o TSE não puder ser comprovado sem o uso do DV/PA, ele deve

  ser capaz de executar a mudança automática de curso nos waypoints (fly-by ou fly-

  over) sem a interferência do piloto, com desempenho adequado. Do mesmo modo,

  a seleção de curso no HSI/EHSI ou no CDI deverá ser automática.

  Se o equipamento de navegação for conectado a um seletor de redução de ângulo

  de inclinação lateral da aeronave, tal seletor não poderá limitar o ângulo de

  inclinação lateral da aeronave durante um procedimento de aproximação.

  A integração do DV/PA com o equipamento GNSS deve ser de forma que não sejam

  alteradas a filosofia de cabine original nem a finalidade do GNSS.

  3 Indicação de desvio lateral

   Verificar a compatibilidade e a coerência da indicação de desvio lateral de curso no indicador
  de

  navegação principal com o desvio apresentado no equipamento GNSS em todos os modos de operação

  GNSS.

  Resultados esperados Aceit. Inac.

  Compatibilidade no modo de operação 5 MN.

  Compatibilidade no modo de operação 2 MN.

  Compatibilidade no modo de operação 1 MN.

  Compatibilidade no modo de operação 0,3 MN.

   Verificar como e feita a indicação de desvio lateral de curso no indicador de navegação
  principal.

  Resultados esperados Aceit. Inac.

  Os indicadores de desvio lateral devem possuir limites de indicação e escala

  compatíveis com qualquer fase do voo (deve ser possível, em qualquer situação de

  desvio lateral, fazer uma leitura deste, de forma a identificar, com facilidade, clareza

  e resolução suficientes, a posição lateral da aeronave em relação à rota a ser voada,

  e em relação aos limites que devem ser mantidos).

  A escala do indicador de desvio lateral deve corresponder a qualquer alerta e

  anúncio de limites, se instalados.

  As escalas e os limites de indicação de desvio lateral podem ser ajustados manual

  ou automaticamente, de acordo com a fase de voo. Os limites de indicação devem

  ser conhecidos, ou serem disponibilizados num display, para a tripulação mensurar

  os valores de acordo com a fase de voo.

  A indicação de desvio lateral do curso deve ser automaticamente escravizada ao

  GNSS. Caso haja um seletor de curso no indicador de desvio lateral (por exemplo,

  no caso de o indicador ser um HSI ou EHSI), é recomendado que a seleção de

  curso seja automática.

  4 Função DIRECT TOOrigem: SAR 49/65

   Verificar o funcionamento da função DIRECT TO.

  5 Mudança de fonte de navegação ILS automática

   Selecionar uma frequência de ILS, verificar a mudança automática ou não da fonte de navegação
  de

  GNSS para VOR/ILS e anotar o resultado.

  6 Visibilidade

   Verificar a interferência da luz solar no display do equipamento GNSS e nos anunciadores
  remotos.

  7 Chaveamento de fontes de navegação

  (1) Acoplar o modo de navegação NAV do DV/PA

  7.1 Mudança de GNSS para VOR (VOR com sinal)

  (1) Navegar com fonte GNSS e DV/PA acoplado;

  (2) Selecionar uma estação VOR com sinal;

  (3) Voar num curso GNSS diferente da proa para a estação VOR selecionada;

  (4) Mudar a fonte de navegação de GNSS para VOR.

   Verificar e anotar o comportamento do DV/PA, aeronave e anunciações.

  7.2 Mudança de VOR para GNSS (GNSS com plano ativo)

  (1) Navegar com fonte VOR e DV/PA acoplado;

  (2) Ativar um plano de voo no GNSS;

  (3) Mudar a fonte de navegação de VOR para GNSS.

   Verificar e anotar o comportamento do DV/PA, aeronave e anunciações.

  7.3 Mudança de GNSSS para VOR (VOR sem sinal)Origem: SAR 50/65

  (1) Navegar com fonte GNSS e DV/PA acoplado;

  (2) Selecionar uma estação VOR sem sinal;

  (3) Mudar a fonte de navegação de GNSS para VOR.

   Verificar e anotar o comportamento do DV/PA, aeronave e anunciações.

  7.4 Mudança de VOR para GNSS (GNSS sem plano ativo)

  (1) Navegar com fonte VOR e DV/PA acoplado;

  (2) Apagar qualquer plano de voo ativo no GNSS;

  (3) Mudar a fonte de navegação de VOR para GNSS.

   Verificar e anotar o comportamento do DV/PA, aeronave e anunciações.

  8 Verificação de falhas

  (1) Acoplar o modo de navegação NAV do DV/PA;

  (2) Selecionar a fonte de navegação GNSS;

  (3) Ativar um plano de voo GNSS.

  8.1 VOR sem sinal - desligamento na chave liga/desliga

  (1) Selecionar uma estação de VOR sem sinal;

  (2) Desligar o GNSS na chave.

   Verificar e anotar o comportamento do DV/PA, aeronave e anunciações.

  8.2 VOR com sinal - desligamento na chave liga/desliga

  (1) Selecione uma estação VOR com sinal;

  (2) Desligue o GNSS no botão.

   Verificar e anotar o comportamento do DV/PA, aeronave e anunciações.

  8.3 VOR sem sinal - desligamento pelo disjuntor

  (1) Selecionar uma estação VOR sem sinal;

  (2) Desarmar o disjuntor do GNSS.

   Verificar e anotar o comportamento do DV/PA, aeronave e anunciações.Origem: SAR 51/65

  9 Interferência eletromagnética

   Verificar se existe interferência eletromagnética do equipamento GNSS nos demais equipamentos
  e

  instrumentos da aeronave e vice-versa.

  Resultados esperados Aceit. Inac.

  O equipamento GNSS não deve ser a fonte de condução indesejável ou

  interferência irradiada, ou ser adversamente afetado por condução ou

  interferência irradiada a partir de outros equipamentos ou sistemas instalados na

  aeronave. Especial atenção com VHF, DME e ADF.

  10 Recepção do sinal GNSS em curva

   Verificar o recebimento do sinal GNSS durante curva.

  (1) Selecionar página que informe a qualidade do sinal das estações GNSS em uso;

  (2) Realizar uma curva de 360º para cada lado com inclinação de asa de 30º;

  (3) Verificar o comportamento dos sinais de GNSS e se há perda de sinal GNSS significativo
  a ponto de

  haver anúncio de falha.

  Resultados esperados Aceit. Inac.

  Sem perda de sinal significativo de GNSS e sem anúncio de falha

  11 Funcionamento do GNSS e DV/PA durante o procedimento de descida

  (1) Inserir um procedimento de descida RNAV no plano de voo;

  (2) Acoplar o modo de navegação NAV (ou GNSS) do DV/PA;

  (3) Verificar o comportamento do DV/PA.

  (4) Acompanhar e anotar as anunciações do modo de navegação do GNSS;

  (5) Acoplar o modo de navegação APR quando na perna de aproximação final.

   Realizar uma aproximação de não-precisão (somente para aprovação RNP APCH) e anotar o

  comportamento do DV/PA e sequência de anunciações

  Evento Resultados obtidos

  Procedimento inserido

  Comportamento do DV/PA

  Anunciações dos modos de

  navegação do GNSS (SUSP,

  APR, LNAV, MAPR etc.)

  Resultados esperados Aceit. Inac.

  Comportamento do DV/PA adequado.

  Anunciação do modo de navegação APR a 2 minutos do FAF.Origem: SAR 52/65

  Anunciação do modo de navegação MAPR após o ponto de decisão.

  12 Aproximação de descida ILS

  (1) Equipamento GNSS ligado com um plano de voo ativo;

  (2) Modo de navegação APR do DV/PA acoplado;

  (3) Selecionar fonte de navegação ILS;

  (4) Selecionar frequência ILS correspondente.

   Realizar uma aproximação de descida ILS e verificar o comportamento do DV/PA e do sinal
  ILS,

  observando se há qualquer tipo de interferência do equipamento GNSS.'
