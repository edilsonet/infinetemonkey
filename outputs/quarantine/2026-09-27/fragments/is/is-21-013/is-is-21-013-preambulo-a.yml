  7.9.4.7. Requisitos funcionais

  a) Informações de navegação e Anúncios

  I. Os seguintes anúncios e informações devem estar disponíveis para o(s) piloto(s)

  conforme localizações apresentadas a seguir para as operações IFR PBN.16-12-2016 IS nº 21-013

  Revisão B

