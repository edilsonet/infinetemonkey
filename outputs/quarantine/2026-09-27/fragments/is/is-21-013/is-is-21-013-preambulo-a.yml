  E - MODELO DE CARTÃO DE TESTE PARA ENSAIOS EM VOO

  O objetivo deste apêndice é fornecer um modelo para a elaboração de “cartões de testes”
  para Ensaios

  em Voo.

  A elaboração de cartões de teste não exclui a necessidade da elaboração de uma Proposta
  de Ensaios

  em Voo. A apresentação de cartões de testes preenchidos não exclui a necessidade da apresentação

  da Declaração de Conformidade bem como, se aplicável, de um Relatório com os Resultados
  de

  Ensaios em Voo.

  Para ensaios de integração, é necessário descrever como o teste de integração foi realizado
  e qual foi

  o comportamento observado nesta falha. Exemplo: “Com o GNSS selecionado como fonte de

  navegação, ao desconectar o disjuntor ‘GPS 1’ do GNSS, aparece um ‘X’ vermelho no EHSI”.

  Adicionar outras linhas/campos/folhas, se necessário. Verificar quais são os itens aplicáveis.

  Numerar as páginas do cartão. Exemplo: Folha 01 de 04

  Este é apenas um exemplo, que deve ser adaptado levando em consideração a instalação efetuada
  e

  os manuais de instalação aplicáveis.Origem: SAR 40/65

