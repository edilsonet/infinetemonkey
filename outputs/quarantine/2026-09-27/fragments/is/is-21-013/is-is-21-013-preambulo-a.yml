  APÊNDICE D - EXEMPLO DE SUPLEMENTO AO MANUAL DE VOO

  Este modelo tem o objetivo de servir como guia para a elaboração e avaliação do Suplemento
  ao

  Manual de Voo das instalações de equipamentos usando GNSS stand alone.

  A intenção deste apêndice é fornecer uma orientação geral para a criação de um SMV. A informação

  e estrutura abaixo não se destinam a cobrir todas as possíveis integrações nas aeronaves
  ou a

  capacidade total dos equipamentos e não devem ser interpretadas de forma a limitar o teor
  incluído

  em um SMV. A linguagem e estrutura deste modelo devem ser adaptadas conforme a instalação,
  a

  capacidade dos equipamentos e respectivas limitações.

  Recomenda-se utilizar o estilo de texto Normal (Arial 10 normal).

  Entre os sinais “<” e “>” há a definição do que deverá ser escrito conforme cada instalação

  (equipamento GNSS, displays, chaves, anunciadores, modo de operação, entre outros).

  O texto em itálico e entre parênteses fornece maiores explicações sobre o texto que deverá
  ser inserido

  no suplemento.16-12-2016 IS nº 21-013

