  contrário, a

  operação PBN deverá ser abandonada. (Aplicável no caso descrito no Item 7.9.4.7.(a).II.ii
  desta IS).

  2.4 O equipamento <Inserir o modelo do equipamento GNSS> não está aprovado para operações
  <Inserir

  as operações não aprovadas> nos casos que sejam requeridos dois pilotos. (Aplicável no caso
  descrito

  no Item 7.9.4.7.(a).II.i desta IS).

  2.5 O equipamento <Inserir o modelo do equipamento GNSS 2> está aprovado para operação <Inserir
  as

  operações aprovadas> somente para o segundo piloto e está aprovado apenas para voos que
  sejam

  operados por dois pilotos. (Aplicável no caso descrito no Item 7.9.4.7.(a).II.iv desta IS).

  2.6 Para operações RNP 1 e RNP APCH, o equipamento está aprovado apenas para voos que sejam

  operados por dois pilotos. (Aplicável no caso de o acesso aos controles ou aumento de carga
  de

  trabalho requerer dois pilotos).

  2.7 O <Inserir o modelo do equipamento GNSS> deve utilizar as seguintes, ou posteriores
  aprovadas,

  versões de software:

  Software Versão

  <Inserir o nome do software> <Inserir identificação da versão>

  2.8 Para utilização da fonte de navegação GPS, o banco de dados instalado no <Inserir o
  modelo do

  equipamento GNSS> deve estar atualizado (Aplicável para aprovações IFR).

  2.9 Os dois equipamentos GNSS devem ter o mesmo banco de dados para que seja possível inserir
  planos

  de voo de um equipamento para o outro. (Aplicável no caso descrito no Item 7.9.4.7.(a).II.iv
  desta IS).

  2.10 A atualização de dados e a operação do <Inserir o modelo do equipamento GNSS> no modo
  de

  manutenção são proibidas durante operação normal da aeronave em voo (Esta limitação deverá
  ser

  inserida sempre que for possível ao piloto acessar a página de manutenção do equipamento
  em voo).

  2.11 Outros meios de navegação disponíveis, apropriados e aprovados para a navegação pretendida,

  devem estar instalados e operativos e deve ser possível, a partir de qualquer ponto da navegação,

  prosseguir ao destino ou à alternativa utilizando tais meios de navegação. (Aplicável para
  aprovações

  IFR)

  2.12 A instalação do <Inserir o modelo do equipamento GNSS> está aprovada somente para operação
  VFR.

  É proibida a operação IFR utilizando o GPS como fonte de navegação (Esta limitação é válida
  somente

  para as instalações que não estão aprovadas para operação IFR).

