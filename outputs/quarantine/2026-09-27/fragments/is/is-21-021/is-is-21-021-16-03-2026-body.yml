  DISPOSIÇÕES FINAIS

  Os casos omissos serão dirimidos pela ANAC.

  As AC, IS e demais documentos de orientação mencionados nesta IS devem ser consultados sempre
  em suas versões mais recentes. Caso a última revisão de algum desses documentos esteja em
  desacordo com as práticas e orientações desta IS, recomenda-se a comparação entre a versão
  vigente à época da emissão desta IS e a revisão atual. Nesses casos, recomenda-se a adoção
  do documento mais conservador em relação à segurança de voo, salvo disposição contrária
  expressa pela autoridade emissora, como o cancelamento do documento, por exemplo.


