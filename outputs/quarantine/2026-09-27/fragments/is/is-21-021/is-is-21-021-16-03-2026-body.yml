  5. SUPLEMENTO AO MANUAL DE VOO DO AVIÃO (AFMS)

  A instalação da modificação requer a elaboração de um AFMS. A proposta de AFMS foi preparada
  pela ABX e submetida à aprovação da ANAC.

  6. INSTRUÇÕES PARA AERONAVEGABILIDADE CONTINUADA (ICA)

  A proposta de ICA foi submetida à ANAC para aceitação, conforme seção 25.1529 e Apêndice
  H do RBAC/14 CFR Part 25.

  7. REQUISITOS PARA A INSPEÇÃO DE CONFORMIDADE

  A instalação e integração do kit fabricado pela ABX para esta modificação requerem inspeções
  de conformidade detalhadas, as quais devem ser realizadas nas instalações da ABX, conforme
  seção 2 do Relatório ABX-XZ-006-EME-B.

  8. ENSAIOS NO SOLO E EM VOO

  Ensaios no solo serão limitados a testes funcionais bem como ensaios de inflamabilidade.
  Nenhum ensaio em voo será necessário para cumprimento de requisitos. Os ensaios são apresentados
  nos relatórios ABX-XZ-006-EME-B e ABX-XZ-006-ELE.

  9. RELATÓRIO DE AVALIAÇÃO DE SEGURANÇA (SAFETY ASSESSMENT)

  Foi realizado um safety assessment de forma a substanciar o cumprimento da seção 25.1309.
  O safety assessment está apresentado na seção 3 do Relatório ABX-XZ-006-EME-B.

  10. ANÁLISE ESTRUTURAL

  Foi elaborado um relatório específico para substanciação dos requisitos relativos aos aspectos
  mecânicos e estruturais da modificação proposta. As análises estão apresentadas no Relatório
  de Análise Estrutural ABX-XY-001-RES.

  11. ANÁLISE DE PESO E BALANCEAMENTO

  A Análise de Peso e Balanceamento está incluída no Relatório de Análise Estrutural: Relatório
  ABX-XY-001-RES.

  12. ANÁLISE ELÉTRICA

  Foi elaborado um relatório específico para substanciação dos requisitos relativos aos aspectos
  elétricos da modificação proposta. As análises estão apresentadas no Relatório de Análise
  Elétrica ABX-XY-001-REL.

  13. MANUAL DE INSTALAÇÃO

  Um Manual de Instalação foi elaborado e apresenta as informações necessárias relativas à
  modificação proposta. Estas informações estão apresentadas no Relatório ABX-XY-010.


