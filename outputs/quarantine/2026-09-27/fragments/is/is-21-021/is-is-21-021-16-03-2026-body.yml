  2.5 Mecanismo de Abertura

  A porta de carga é aberta para cima. O sistema de abertura é composto por dois conjuntos
  de atuadores hidráulicos, projetados para assegurar uma sequência de abertura uniforme da
  porta. Extensões dos atuadores aplicam a força necessária aos dispositivos de abertura da
  porta. Com a porta fechada, trancada e travada, uma válvula seletiva do sistema hidráulico,
  configura o sistema para primeiro destravar e depois destrancar a porta.

  2.6 Sistema Hidráulico

  O sistema hidráulico de abertura da porta é composto por uma bomba hidráulica, eletricamente
  operada com válvulas, restrições e outros acessórios que garantam uma operação confiável
  e segura.

  2.7 Sistema de Alarme

  O sistema de alarme é composto de um painel de controle localizado próximo à cabine da tripulação,
  com diversos micro-switches, localizados na porta de carga e fazem interface elétrica com
  o sistema hidráulico. No painel de controle, há uma luz vermelha de aviso, quatro luzes
  de status, uma chave mestra e uma chave de controle da porta. As luzes de status são verdes
  e indicam que a porta está fechada, trancada e travada. O painel de controle será alimentado
  pela barra elétrica nº 2 de 28 VDC da aeronave.


  3. PISO REFORÇADO

  O piso da aeronave será projetado com reforço capaz de suportar aproximadamente 3 toneladas
  de carga distribuída. O compartimento de carga será preparado para utilização com redes
  de carga ou contêineres. Esse reforço será dimensionado para permitir a fixação de diferentes
  tipos de unidades de carga, eliminando a necessidade de construção de uma barreira de carga
  de 9G, além de possibilitar a instalação de painéis com roletes para o manuseio de carga
  do tipo contêiner.


  4. INSTALAÇÃO DO LINER

  Será instalada uma proteção nas paredes laterais ao longo da fuselagem, composta por painéis
  tipo ‘sanduíche’ de alumínio. Esses painéis serão fixados utilizando as cavernas originais
  da estrutura da fuselagem. Os painéis devem atender aos requisitos de inflamabilidade e
  possuir sobreposição para isolar a estrutura e os sistemas originais da aeronave contra
  qualquer fogo no compartimento de carga.


  5. CARACTERÍSTICAS DO SISTEMA ELÉTRICO

  A porta de carga possui um sistema de segurança projetado para garantir que esteja devidamente
  fechada, trancada e travada, tornando extremamente improvável qualquer abertura em voo.
  Para isso, foi instalado um sistema de segurança com circuito elétrico que evita a abertura
  inadvertida da porta, a qual é acionada hidraulicamente. O sistema é composto por:


  Painel de controle;

  Sistema de alimentação elétrica.


