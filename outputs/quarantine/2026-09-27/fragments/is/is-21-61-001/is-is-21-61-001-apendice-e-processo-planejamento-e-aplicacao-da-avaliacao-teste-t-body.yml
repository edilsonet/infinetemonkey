title: APÊNDICE E - PROCESSO, PLANEJAMENTO E APLICAÇÃO DA AVALIAÇÃO (TESTE T)
text: 'APÊNDICE E - PROCESSO, PLANEJAMENTO E APLICAÇÃO DA AVALIAÇÃO (TESTE T)

  APPENDIX E -EVALUATION (T-TEST) PROCESS, PLANNING AND APPLICATION

  E.1 Preparação

  E.1 Preparation

  E.1.1 A habilitação de tipo, definição de nível de diferenças e processo de teste são iniciados
  quando um requerente apresenta uma aeronave para certificação de tipo. Se o requerente apresenta
  uma aeronave candidata à ANAC como uma nova certificação de tipo de aeronave sem nenhuma
  solicitação antecipada de crédito de habilitação de tipo para similaridades com aeronave
  previamente certificadas, então a ANAC analisa os requisitos de treinamento usando o teste
  T5. Os resultados do T5 determinarão uma nova habilitação de tipo e as especificações mínimas
  para requisitos de treinamento, exame e experiência recente conforme aplicáveis àquela aeronave.
  Se o requerente apresenta uma aeronave buscando créditos de treinamento, exame ou experiência
  recente com base em similaridades com uma aeronave previamente certificada, uma série de
  possíveis testes (T1/T2/T3) são desenvolvidos e usados para determinar seu nível de diferença
  com a aeronave base de comparação. Os resultados desses testes determinarão as especificações
  mínimas para requisitos de treinamento, exame e experiência recente conforme aplicáveis
  à aeronave candidata. Alternativamente, a determinação da habilitação de tipo por meio de
  análise pode ser considerada para casos específicos. Os testes T6 podem permitir CTLC entre
  diferentes aeronaves. No Apêndice D, os detalhes dessas situações fornecem maiores esclarecimentos.

  E.1.1 The type rating, difference level definition, and test process are initiated when
  an applicant presents an aircraft for type certification. If the applicant presents a candidate
  aircraft to the ANAC as a new aircraft type certification with no anticipated application
  for type rating credit for similarities with aircraft previously type certificated, then
  ANAC analyzes the training program requirements using test T5. The results of T5 will determine
  a new type rating and the minimum specifications for training, checking, and currency standards
  as applicable to that aircraft. If the applicant presents an aircraft seeking training,
  checking, or currency credit, based on similarities with an aircraft previously certified,
  a series of possible tests (T1/T2/T3) are developed and used to determine its level of difference
  with the base aircraft of comparison. The results of these tests will determine the minimum
  specifications for training, checking, and currency standards as applicable to the candidate
  aircraft. Alternatively, type rating determination through analysis may be considered for
  specific cases. T6 tests may permit CTLC between different aircraft. In Appendix D, the
  details of these situations provide further amplification.

  NOTA: Para estabelecer dados para uma direção que não foi avaliada anteriormente, uma avaliação
  adicional usando os testes T acima pode ser realizada com base em um requerimento. Em geral,
  as diferenças de nível A e B não exigem testes bidirecionais.

  NOTE: To establish data for a direction that was not previously assessed, an additional
  evaluation using the above T tests may be carried out based on an application. In general,
  level A and B differences do not require two-way testing.

  E.1.2 Para iniciar o processo de avaliação para aeronaves relacionadas, o requerente identifica
  a aeronave base e a aeronave candidata. O requerente identifica as principais diferenças
  pertinentes à aeronave e faz comparações com a aeronave candidata proposta. Um documento
  de diferenças (ou seja, uma tabela de DR) resume as diferenças identificadas. Como as combinações
  de aeronaves relacionadas podem ser numerosas e apenas diferenças típicas são necessárias
  neste estágio para a definição do teste, o requerente pode selecionar DR representativos
  para preparação.

  E.1.2 To begin the evaluation process for related aircraft, the applicant identifies the
  base aircraft and the candidate aircraft. The applicant identifies major differences pertinent
  to the aircraft and makes comparisons with the proposed candidate aircraft. A differences
  document (i.e., a DR table) summarizes the identified differences. Since combinations of
  related aircraft may be numerous and only typical differences are needed at this stage for
  test definition, the applicant may select representative DR for preparation.

  E.1.3 As aeronaves são então atribuídas a grupos lógicos de aeronaves a serem descritos
  nas tabelas de MDR no documento OSD FC.

  E.1.3 The aircraft are then assigned to logical aircraft groups to be described in MDR tables
  in the OSD FC document.

  E.1.4 Com base na análise acima (incluindo resultados preliminares de ensaios em voo ou
  estimativas de simulação de voo, se disponíveis), o requerente propõe níveis de diferença
  a serem especificados em cada célula da tabela de MDR para as várias combinações de aeronaves.

  E.1.4 Based on the above analysis (including preliminary flight test results or flight simulation
  estimates, if available), the applicant proposes difference levels to be specified in each
  cell of the MDR table for the various aircraft combinations.

  E.1.5 O requerente propõe elementos aplicáveis do processo de teste (T1 a T5 e T6 para CTLC),
  ou determinação de habilitação de tipo por meio de análise para casos específicos, e um
  plano para validação dos níveis de diferença pretendidos. Aeronaves, horários, dispositivos,
  etc. específicos são identificados para conduzir os testes necessários para a aeronave candidata.
  Incluídas na proposta estão quaisquer interpretações necessárias dos resultados esperados
  usando padrões estabelecidos. Quaisquer definições especiais, únicas ou adicionais de resultados
  bem-sucedidos também são identificadas.

  E.1.5 The applicant proposes applicable elements of the test process (T1 through T5 and
  T6 for CTLC), or type rating determination through analysis for specific cases, and a plan
  for validation of the intended difference levels. Specific aircraft, times, devices, etc.,
  are identified to conduct the required tests for the candidate aircraft. Included in the
  proposal are any necessary interpretations of expected results using established standards.
  Any special, unique, or additional definitions of successful outcomes are also identified.

  E.1.6 O escopo de T1 a T6 é direcionado às regras VFR básicas e às operações sob Regras
  de Voo por Instrumentos (Instrument Flight Rules - IFR), quando aplicável.

  E.1.6 The scope of T1 through T6 is keyed to basic VFR and Instrument Flight Rules - IFR
  operations, when applicable.

  E.1.7 Um acordo entre ANAC e requerente é alcançado sobre o agrupamento de aeronaves, testes
  propostos, planos de testes, cronogramas, corpos de prova e interpretação de possíveis resultados.

  E.1.7 An ANAC/applicant agreement is reached on the grouping of aircraft, proposed tests,
  test plans, schedules, subjects, and interpretation of possible outcomes.

  E.1.8 As qualificações dos corpos de prova são abordadas no momento da especificação do
  teste quando um acordo sobre o teste é alcançado com o requerente. Os corpos de prova para
  todos os testes T são selecionados pela ANAC e podem incluir pilotos da ANAC e/ou da indústria.
  A seleção dos corpos de prova considera fatores como os seguintes:

