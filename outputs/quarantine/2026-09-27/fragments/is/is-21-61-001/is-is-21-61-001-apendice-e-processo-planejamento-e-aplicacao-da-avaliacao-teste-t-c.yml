text: 'c) Repeated failures in T3 test at level D training differences. In the case of retesting,
  new subjects may be required at the discretion of the FCD evaluation team leader.

  NOTA: A reprovação repetida no teste em diferenças de nível D devido ao desempenho inadequado
  de um ou mais corpos de prova, que não seja uma reprovação individual do sujeito devido
  ao desempenho pessoal abaixo da média ou atípico, conforme determinado pela ANAC, pode levar
  à atribuição de diferenças de nível E.

  NOTE: Repeated failures of test at level D differences due to the inadequate performance
  of one or more test subject, that is not an individual subject’s failure due to subpar or
  atypical personal performance as determined by ANAC, may lead to assignment of level E differences.

  E.6 Teste 4 (T4) - Validação de experiência recente

  E.6 Test 4 (T4) - Currency Validation

  E.6.1 Objetivo do teste. O teste T4 é um teste de experiência recente que pode ser usado
  quando um requerente busca alívio das recomendações de experiência recente existentes da
  ANAC. No contexto desta IS, a experiência recente aborda diferenças de procedimentos de
  sistemas e manobras entre aeronaves relacionadas. O T4 não inclui a experiência recente
  de decolagem e pouso.

  E.6.1 Test Purpose. The T4 test is a currency test that can be used when an applicant seeks
  relief from existing ANAC currency recommendations. In the context of this IS, currency
  addresses system procedural and maneuvering differences between related aircraft. T4 does
  not include takeoff and landing recency of experience.

  E.6.2 Corpos de prova. Os corpos de prova são pilotos da ANAC ou são pilotos da indústria
  identificados pelo requerente e aceitos pela ANAC com treinamento, experiência e estão qualificados
  na aeronave base sem treinamento para a aeronave candidata. O treinamento para proficiência
  na aeronave base pode ser fornecido aos corpos de prova pelo requerente antes do início
  do teste.

  E.6.2 Test Subjects. Test subjects are ANAC pilots or are industry pilots identified by
  the applicant and accepted by the ANAC who are trained, experienced, and current on the
  base aircraft with no training for the candidate aircraft. Training to proficiency in the
  base aircraft may be provided to test subjects by the applicant before the start of testing.

  E.6.3 Processo de teste. Se um requerente desejar uma mudança nas recomendações de experiência
  recente, um teste T4 pode ser conduzido. Este teste pode ser feito antes ou depois da aeronave
  entrar em serviço. Caso o teste não possa ser feito antes da entrada em serviço, os limites
  estabelecidos pela ANAC se aplicam. Os critérios que podem ser usados pela ANAC para definir
  diferenças de experiência recente para determinações iniciais da ANAC incluem os seguintes
