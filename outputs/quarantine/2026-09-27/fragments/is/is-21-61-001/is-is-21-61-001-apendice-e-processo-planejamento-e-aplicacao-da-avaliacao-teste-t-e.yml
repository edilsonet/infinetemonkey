text: 'e) Make usual callouts.

  E.4.5 Teste bem-sucedido. A ANAC decide que o resultado do teste T2 é consistente com os
  critérios previamente acordados. O desempenho aceitável do piloto na conclusão de manobras
  designadas, sem treinamento, estabelece que a aeronave candidata e a aeronave base são suficientemente
  semelhantes em características de pilotagem para permitir a atribuição de nível B, C ou
  D. O processo de teste pode então avançar para o teste T3.

  E.4.5 Successful Test. The ANAC decides T2 test outcome consistent with previously agreed
  upon criteria. Acceptable pilot performance in completion of designated maneuvers, without
  training, establishes that the candidate and base aircraft are sufficiently alike in handling
  characteristics to permit assignment of level B, C, or D. The test process can then advance
  to the T3 test.

  E.4.6 Falha no teste. Falha no T2 significa que existem grandes diferenças de pilotagem
  durante fases críticas do voo ou que inúmeras diferenças menos críticas foram identificadas
  que justificam o treinamento em um FFS ou aeronave. Consequentemente, diferenças de nível
  E serão atribuídas e a ANAC determinará uma habilitação de tipo separada. Com uma falha
  no T2, a próxima etapa no processo de teste é o T5 para validar os requisitos de nível E
  e o treinamento proposto. A falha no T2 não significa necessariamente que a aeronave base
  e a candidata não compartilham um alto grau de comunalidade referente a sistemas e/ou pilotagem.
  O requerente pode optar por usar os dados coletados durante o processo T2 para justificar
  a aprovação de um treinamento de habilitação de tipo reduzido para pilotos que são treinados
  na aeronave base e estão em transição para a aeronave candidata.

  E.4.6 Failure of Test. Failure of T2 means that major handling differences exist during
  critical phases of flight or that numerous less critical differences were identified that
  warrant training in an FFS or aircraft. Accordingly, level E differences will be assigned
  and ANAC will determine a separate type rating. With a T2 failure, the next step in the
  testing process is T5 to validate level E requirements and the proposed training course.
  Failure of the T2 does not necessarily mean that the base and candidate aircraft do not
  share a high degree of system and/or handling commonality. The applicant may elect to use
  the data collected during the T2 process to justify approval of a shortened type rating
  course for pilots that are trained on the base aircraft and are transitioning to the candidate.

  E.5 Teste 3 (T3) - Teste de Diferenças de Sistemas e Validação de Treinamento e Exame

  E.5 Test 3 (T3) - System Differences Test and Validation of Training and Checking

  E.5.1 Objetivo do teste. O teste T3 é usado para avaliar uma proposta de diferenças para
  treinamento e exame no nível B, C ou D, e dispositivos de treinamento, de aeronaves relacionadas.

  E.5.1 Test Purpose. The T3 test is used to evaluate the proposed related aircraft differences
  training, checking, and training devices at level B, C, or D.

  E.5.2 Corpos de prova. Os corpos de prova são funcionários da ANAC selecionados pela ANAC
  ou são pilotos da indústria identificados pelo requerente e aceitos pela ANAC com treinamento,
  experiência e estão qualificados na aeronave base e concluíram o treinamento de diferenças
  proposto pelo requerente na aeronave candidata. O treinamento para proficiência na aeronave
  base pode ser fornecido aos corpos de prova pelo requerente antes do início do teste.

  E.5.2 Test Subjects. Test subjects are ANAC pilots or are industry pilots identified by
  the applicant and accepted by the ANAC who are trained, experienced, and current on the
  base aircraft and have completed the applicant’s proposed differences training in the candidate
  aircraft. Training to proficiency in the base aircraft may be provided to test subjects
  by the applicant before the start of testing.

  E.5.3 Processo de teste. O T3 é um teste de diferença de sistema e uma validação de treinamento
  e exame. É usado quando o teste de pilotagem equivalente (T2) é concluído com sucesso ou
  quando o T2 está sendo incorporado como parte do T3. O T3 é administrado em duas fases após
  o treinamento de diferenças de um piloto na aeronave candidata.

  E.5.3 Test Process. T3 is a system difference test and a validation of training and checking.
  It is used when the equivalent handling test (T2) is successfully completed or when T2 is
  being incorporated as part of T3. T3 is administered in two phases following differences
  training of a pilot in the candidate aircraft.

  E.5.3.1 Primeira Fase. A conclusão bem-sucedida de um voo de verificação de proficiência
  para avaliar o conhecimento, as habilidades e as capacidades do piloto pertinentes à operação
  da aeronave que está sendo testada. Se uma verificação completa for proposta, os testes
  serão semelhantes aos usados para T1, conforme descrito no item E.3 acima. Se uma verificação
  parcial for usada, o processo será semelhante, mas a ANAC determina os itens do teste com
  base nas propostas do requerente. A primeira fase incluirá uma verificação de proficiência
  conforme definido pelo regulamento aplicável, uma verificação de proficiência parcial ou
  verificação de operação de sistema de aeronave individual administrada a pilotos em treinadores
  de sistema ou um FSTD para treinamento de manobra, ou em uma aeronave. O exame é administrado
  assumindo a experiência recente na aeronave base e a conclusão do treinamento proposto na
  aeronave candidata.

  E.5.3.1 First Phase. The successful completion of a pilot qualification flight check to
  assess pilot knowledge, skills, and abilities pertinent to operation of the aircraft being
  tested. If a full check is proposed, the tests are similar to those used for T1 as described
  in item E.3 above. If a partial check is used, the process is similar, but the ANAC determines
  the test items based on the applicant’s proposals. The first phase will include either a
  proficiency check as defined by the applicable regulation, partial proficiency check, or
  individual aircraft system operation check administered to pilots in system trainers or
  an FSTD for maneuver training, or in an aircraft. The check is administered assuming currency
  in the base aircraft and completion of the proposed training in the candidate aircraft.

  E.5.3.2 Segunda Fase. O voo orientado para operações em rota (Line-oriented flying - LOF)
  segue a conclusão do exame. A fase LOF do teste é usada para validar o treinamento e exame
  propostos, avaliar integralmente áreas de diferença específicas, examinar implicações do
  voo de frota mista, avaliar circunstâncias especiais como efeitos da Lista de Equipamentos
  Mínimos (Minimum Equipment List - MEL) e identificar os efeitos de erros do piloto potencialmente
  relacionados às diferenças. O teste é feito em um ambiente de voo em linha real que inclui
  meteorologia, rotas, aeroportos, Controle de Tráfego Aéreo (ATC) e outros fatores típicos
  que são característicos daqueles em que a aeronave será operada. Os testes LOF podem ser
  conduzidos em aeronaves de teste, FFS ou com uma combinação destes em conjunto com testes
  de certificação de tipo de aeronave de Função e Confiabilidade (Function and Reliability
  - F&R). A parte LOF do teste pode ser usada para avaliar problemas complexos ou problemas
  que não podem ser totalmente detalhados em um breve voo de verificação de proficiência,
  uma vez que um voo de verificação de proficiência representa apenas uma amostra do conhecimento
  e das habilidades do piloto em um ambiente limitado e altamente estruturado. O LOF é parte
  integrante do T3 e deve ser concluído com sucesso antes da atribuição "inicial" de níveis
  de diferença. Ao desenvolver e selecionar cenários para avaliação, considere o seguinte:

  E.5.3.2 Second Phase. Line-oriented flying - LOF follows completion of the flight check.
  The LOF phase of the test is used to validate the training and checking proposed, fully
  assess particular difference areas, examine implications of mixed fleet flying, assess special
  circumstances such as Minimum Equipment List - MEL effects, and identify the effects of
  pilot errors potentially related to the differences. The test is done in a real line flight
  environment that includes typical weather, routes, airports, Air Traffic Control - ATC,
  and other factors that are characteristic of those in which that aircraft will be operated.
  LOF tests may be conducted in test aircraft, FFS, or with a combination of these in conjunction
  with Function and Reliability (F&R) aircraft type certification tests. The LOF portion of
  the test may be used to evaluate complex issues or issues that cannot be fully detailed
  in a brief flight check, since a check only samples pilot knowledge and skills in a limited
  and highly structured environment. LOF is an integral part of T3 and must be successfully
  completed before “initial” assignment of difference levels. In developing and selecting
  scenarios for evaluation, consider the following:'
