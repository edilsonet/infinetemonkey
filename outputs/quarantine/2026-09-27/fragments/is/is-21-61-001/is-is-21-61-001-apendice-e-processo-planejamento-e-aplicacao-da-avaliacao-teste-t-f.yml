  E.2.3 Quando o processo de análise é concluído, ele é registrado como uma revisão do treinamento
  e do documento OSD FC existente para a aeronave base e/ou candidata.

  E.2.3 When the analysis process is completed, it is recorded as a revision to the training
  courseware and to the existing OSD FC document for the base and/or candidate aircraft.

  E.3 Teste 1 (T1) - Equivalência Funcional

  E.3 Test 1 (T1) - Functional Equivalence

  E.3.1 Objetivo do teste. O teste T1 é conduzido para determinar se o nível de treinamento
  A ou B é apropriado entre a aeronave base e a candidata.

  E.3.1 Test Purpose. The T1 test is conducted to determine if training level A or B is appropriate
  between the base and candidate aircraft.

  NOTA: Se o requerente comunicar que os requisitos de treinamento e/ou exame para a aeronave
  candidata podem exceder o nível B, o teste T1 pode ser dispensado e o processo de avaliação
  então passa diretamente para o teste T2. Ao dispensar o T1, o requerente reconhece que existem
  diferenças entre a aeronave base e a candidata, e pode exigir que os requisitos de treinamento
  e/ou exame até, mas não excedendo, o nível D sejam aplicados.

  NOTE: If the applicant communicates that the training and/or checking requirements for the
  candidate aircraft may exceed level B, the T1 test can be waived and the evaluation process
  then moves directly to the T2 test. By waiving the T1, the applicant acknowledges that differences
  exist between the base and candidate aircraft, and may demand that training and/or checking
  requirements up to but not exceeding level D are applied.

  E.3.2 Corpos de prova. Os corpos de prova são pilotos da ANAC ou são pilotos da indústria
  identificados pelo requerente e aceitos pela ANAC com treinamento, experiência e estão qualificados
  na aeronave base, sem treinamento para a aeronave candidata. O requerente pode fornecer
  treinamento para proficiência na aeronave base para os corpos de prova antes do início do
  teste.

  E.3.2 Test Subjects. Test subjects are ANAC pilots or are industry pilots identified by
  the applicant and accepted by the ANAC who are trained, experienced, and current on the
  base aircraft with no training for the candidate aircraft. The applicant may provide proficiency
  training in the base aircraft to test subjects before testing begins.

  E.3.3 Processo de teste. Os requerentes iniciam o processo de teste quando propõem que os
  requisitos mínimos de treinamento e exame para a aeronave base e candidata não sejam maiores
  do que as diferenças de nível B. O T1 é normalmente conduzido usando um grupo de corpos
  de prova. Os corpos de prova passarão inicialmente um exame de voo "sem risco" para sua
  aeronave base para calibrar o desempenho antes de passarem pelo exame de voo na aeronave
  candidata que está sendo avaliada. O exame de voo realizado na aeronave candidata abordará
  as diferenças entre a aeronave base e a aeronave candidata. O teste pode ser administrado
  ou observado por mais de um membro da ANAC para garantir a consistência e uniformidade dos
  procedimentos de teste e o entendimento comum do desempenho e dos resultados dos corpos
  de prova.

  E.3.3 Test Process. Applicants initiate the test process when they propose that the minimum
  training and checking requirements for the base and candidate aircraft are no greater than
  level B differences. T1 is typically conducted using one group of test subjects. Subjects
  will initially be given a “no jeopardy” flight check for their base aircraft to calibrate
  performance before taking the pertinent flight check in the candidate aircraft being evaluated.
  The flight check undertaken in the candidate aircraft will address the differences between
  the base aircraft and candidate aircraft. The test may be administered or observed by more
  than one ANAC member to ensure consistency and uniformity of test procedures and common
  understanding of the test subject performance and outcomes.

  E.3.4 Piloto de Segurança. Um piloto de segurança, servindo como Piloto em Comando (Pilot
  In Command - PIC) na aeronave e atuando como Piloto de Monitoramento (PM) em qualquer assento,
  intervirá para evitar danos à aeronave ou para limitar manobras que coloquem em risco a
  segurança do voo.

  E.3.4 Safety Pilot. A safety pilot, serving as Pilot In Command - PIC in the aircraft and
  functioning as Pilot Monitoring (PM) in either seat, will intervene to prevent damage to
  the aircraft or to limit maneuvers that endanger safety of flight.

  E.3.5 Teste bem-sucedido. A ANAC decide que o resultado do teste T1 está consistente com
  os critérios previamente acordados. A ANAC determina as áreas de treinamento necessárias
  e especifica os dispositivos necessários ou limitações de treinamento. Se o teste T1 for
  aprovado, os pares de aeronaves pertinentes são designados para diferenças de treinamento
  de nível A ou nível B. A conclusão bem-sucedida do T1 resulta na determinação da mesma habilitação
  de tipo da aeronave base.

  E.3.5 Successful Test. ANAC decides the outcome of the T1 test consistent with previously
  agreed upon criteria. The ANAC determines the areas of training required and specifies necessary
  devices or training limitations. If the T1 test is passed, the pertinent aircraft pairs
  are assigned to level A or level B training differences. Successful completion of T1 results
  in the designation of the same type rating as the base aircraft.

  E.3.6 Falha no Teste. Se o teste T1 for reprovado e um novo teste não for considerado, o
  nível A ou B não pode ser atribuído. Isso geralmente requer a realização dos testes T2 e
  T3. Se estiver solicitando crédito de treinamento, o requerente pode pedir e receber crédito
  pelos itens aprovados no T1. O novo teste T1 pode ser considerado a critério da ANAC, especialmente
  quando novas informações são apresentadas pelo requerente ou há indicação de que outros
  fatores podem ter influenciado nos resultados do teste.

  E.3.6 Failure of Test. If the T1 test is failed and retesting is not considered, level A
  or B cannot be assigned. This generally requires completion of T2 and T3. If requesting
  training credit, the applicant may ask for and receive credit for those items passed in
  T1. T1 retesting may be considered at the discretion of the ANAC, especially when new information
  is presented by the applicant or there is indication that other factors may have influenced
  the test results.

  E.4 Teste 2 (T2) - Comparação de qualidades de pilotagem

  E.4 Test 2 (T2) - Handling Qualities Comparison

  E.4.1 Objetivo do teste. O teste T2 compara as qualidades de pilotagem entre a aeronave
  base e a candidata. A critério do líder da equipe de avaliação FCD, o teste T2 pode ser
  concluído por meio de análise, sem exigir um voo na aeronave. Determinar se o processo de
  análise pode ser usado requer a verificação de que a pilotagem da aeronave não mudou significativamente,
  conforme descrito no "processo de teste". Na maioria dos casos, deve ser óbvio que a mudança
  não afetará a pilotagem da aeronave, mas se a determinação exigir dados adicionais, as informações
  são obtidas junta à unidade de ensaios em voo da ANAC ou por meio dos dados de ensaios em
  voo do requerente. Com o acordo da ANAC, elementos do teste T2 podem ser incorporados ao
  teste T3 para verificar que um treinamento em FFS ou aeronave não é necessário para abordar
  as qualidades de pilotagem.

  E.4.1 Test Purpose. The T2 test compares handling qualities between the base and candidate
  aircraft. At the discretion of the FCD evaluation team leader, the T2 test may be completed
  through analysis, without requiring an aircraft flight. Determining if the analysis process
  can be used requires verification that the aircraft handling has not changed significantly
  as described in the “test process.” In most cases, it should be obvious that the change
  will not affect aircraft handling, but if the determination requires additional data, the
  information is obtained from ANAC flight test office or through the applicant’s flight test
  data. With ANAC agreement, elements of T2 may be incorporated within the T3 test to verify
  that an FFS or aircraft training is not needed to address handling qualities.

  NOTA: Se o T2 for realizado em uma aeronave que deverá exigir uma habilitação de tipo separada
  com o CTLC, o crédito será validado usando o processo T6.

  NOTE: If T2 is conducted on an aircraft that is expected to require a separate type rating
  with CTLC, credit will be validated by using the T6 process.

  E.4.2 Corpos de prova. Os corpos de prova são funcionários da ANAC selecionados pela ANAC
  ou são pilotos da indústria identificados pelo requerente e aceitos pela ANAC com treinamento,
  experiência e estão qualificados na aeronave base, sem treinamento para a aeronave candidata.
  Treinamento para proficiência pode ser fornecido na aeronave base para os corpos de prova
  pelo requerente antes do início do teste.

  E.4.2 Test Subjects. Test subjects are ANAC pilots or are industry pilots identified by
  the applicant and accepted by the ANAC who are trained, experienced, and current on the
  base aircraft with no training for the candidate aircraft. Training to proficiency may be
  provided in the base aircraft to test subjects by the applicant before the start of testing.

  E.4.3 Processo de teste. Os requerentes iniciam o processo de teste quando analisam dados
  de ensaios em voo ou simulação disponíveis, e diferenças de projeto ou sistema da aeronave,
  e determinam que existem similaridades de pilotagem entre a aeronave base e a candidata.
  A partir dessa determinação, os requerentes fazem sua proposta de teste T2. Antes do teste,
  representantes da ANAC revisam o perfil de teste T2 para garantir que aspectos críticos
  de qualidade de pilotagem da aeronave candidata sejam examinados. A avaliação de voo consiste
  em partes relevantes de uma verificação de proficiência conforme determinado pelo líder
  da equipe de avaliação FCD. O T2 consiste em uma comparação entre manobras selecionadas
  de um voo de verificação de proficiência de piloto (normais e anormais) administradas primeiro
  na aeronave base (usando a aeronave real ou um FFS nível C ou D), depois na aeronave candidata.
  Embora o teste T2 deva sempre ser realizado na aeronave candidata, algumas partes que afetam
  significativamente a segurança da aeronave, como falhas de controle de voo, podem ser conduzidas
  em um FFS adequado para o teste. Os corpos de prova são avaliados no desempenho das manobras
  necessárias consistentes com os padrões definidos pelo regulamento e em uma avaliação do
  grau de dificuldade na execução de manobras na aeronave candidata em comparação com a aeronave
  base. O teste pode ser administrado ou observado por mais de um membro da ANAC para garantir
  a consistência e uniformidade dos procedimentos de teste e o entendimento comum do desempenho
  e dos resultados dos corpos de prova.

  E.4.3 Test Process. Applicants initiate the test process when they analyze available flight
  or simulation test data, and aircraft design or system differences, and determine that handling
  similarities exist between the base and candidate aircraft. From this determination applicants
  make their T2 proposal. Before the test, representatives of the ANAC review the T2 test
  profile to ensure that critical handling quality aspects of the candidate aircraft are examined.
  The flight evaluation consists of relevant parts of a proficiency check as determined by
  the OSD FC operational evaluation team leader. T2 consists of a comparison between selected
  pilot qualification flight check maneuvers (normal and abnormal) administered first in the
  base aircraft (using either the actual aircraft or a level C or D FFS), then in the candidate
  aircraft. Although T2 testing should always be accomplished in the candidate aircraft, some
  portions that significantly affect aircraft safety, such as flight control failures, may
  be conducted in an FFS suitable for the test. Test subjects are evaluated on performance
  of required maneuvers consistent with standards set by the regulation and an assessment
  of the degree of difficulty in performing maneuvers in the candidate aircraft compared to
  the base aircraft. The test may be administered or observed by more than one ANAC member
  to ensure consistency and uniformity of test procedures and common understanding of subject
  performance and outcomes.

  E.4.4 Piloto de segurança. O piloto de segurança servindo como PIC na aeronave e atuando
  como PM em qualquer assento intervirá para evitar danos à aeronave ou para limitar manobras
  que coloquem em risco a segurança do voo. O piloto de segurança pode auxiliar o corpo de
  prova apenas em áreas não relacionadas à determinação das qualidades de pilotagem. Por exemplo,
  o piloto de segurança pode remover impedimentos à progressão do teste, mas não pode pilotar,
  orientar ou treinar o corpo de prova em nenhum aspecto do teste relacionado à pilotagem,
  elementos visuais ou de movimento. O piloto de segurança não pode atuar nos controles de
  voo primários durante a avaliação, ou instruir, liderar ou orientar os corpos de prova de
  nenhuma maneira. O piloto de segurança pode:

  E.4.4 Safety Pilot. The safety pilot serving as PIC in the aircraft and functioning as PM
  in either seat will intervene to prevent damage to the aircraft or to limit maneuvers which
  endanger safety of flight. The safety pilot can only assist the test subject in areas unrelated
  to the handling qualities determination. For example, the safety pilot can remove impediments
  to progression of the test but cannot fly, coach, or train the test subject on any aspect
  of the test related to handling, vision cues, or motion cues. The safety pilot may not actuate
