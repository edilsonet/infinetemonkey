text: '02.01.2025

  02/JAN/2025


  1. OBJETIVO

  1. OBJECTIVE

  1.1 Esta IS provê um meio aceitável pelo qual uma Lista Mestra de Equipamentos Mínimos (Master
  Minimum Equipment List - MMEL) ou um Suplemento à MMEL podem ser desenvolvidos, aprovados
  ou alterados, como parte dos Dados Relevantes à Operação (Operational Suitability Data -
  OSD).

  1.1 This IS provides acceptable means by which a Master Minimum Equipment List - MMEL or
  an MMEL Supplement may be developed, approved and amended, as part of the Operational Suitability
  Data - OSD.

  1.2 Ela também orienta os operadores a identificar a MMEL aplicável (e o Suplemento à MMEL,
  quando aplicável) a ser usada no desenvolvimento de sua Lista de Equipamentos Mínimos (Minimum
  Equipment List - MEL).

  1.2 It also guides operators on identifying the applicable MMEL (and Supplement, when applicable)
  to be used in the development of their own Minimum Equipment List - MEL.

  2. REVOGAÇÃO

  2. REVOCATION

  Este IS revoga e substitui a IS No. 21-003 Revisão A.

  This IS revokes and replaces IS No. 21-003 Revision A.

  3. FUNDAMENTOS

  3. LEGAL BASIS

  3.1 O Art. 66 da Lei nº 7.565, de 19 de dezembro de 1986 (Código Brasileiro de Aeronáutica
  - CBAer), estabelece que uma da competências da autoridade aeronáutica promover a segurança
  de voo, devendo estabelecer padrões mínimos de segurança relativos a projetos, materiais,
  construção, estrutura e desempenho de aeronaves, motores, hélices e demais componentes aeronáuticos.

  3.1 Art. 66 of Law No. 7,565, dated December 19th, 1986 (Brazilian Aeronautical Code - CBAer)
  states that one of the aeronautical authority''s competences is to promote flight safety,
  and it must establish minimum safety standards relating to designs, materials, construction,
  structure and performance of aircraft, engines, propellers, and other aeronautical components.

  3.2 O Regulamento Brasileiro de Aviação Civil - RBAC 01 define os OSD, que incluem a MMEL.

  3.2 Brazilian Civil Aviation Regulation - RBAC 01 defines OSD, which includes the MMEL.

  3.3 O parágrafo 21.29(a)(4)-I do RBAC 21 estabelece que aeronaves a serem importadas para
  o Brasil devem ter previamente seu OSD emitido ou aprovado pelo Estado do Projeto, a menos
  que estabelecido de outra forma pela ANAC.

  3.3 Paragraph 21.29(a)(4)-I of RBAC 21 establishes that OSD of aircraft to be imported to
  Brazil shall have been previously issued or approved by the State of Design, unless otherwise
  established by ANAC.

  3.4 A Seção 21.41 do RBAC 21 define o certificado de tipo, que inclui os OSD e, como consequência,
  a MMEL.

  3.4 Section 21.41 of RBAC 21 defines the type certificate, which includes OSD and, as consequence,
  the MMEL.

  3.5 O parágrafo 21.61-I(e) do RBAC 21 contém requisitos para propor e obter a aprovação
  de uma MMEL, bem como requisitos que exigem uma MMEL para novas solicitações a um certificado
  de tipo brasileiro de determinadas aeronaves.

  3.5 Paragraph 21.61-I(e) of RBAC 21 contains requirements for proposing and obtaining approval
  of an MMEL, as well as requirements mandating an MMEL for new applications for a Brazilian
  type certificate of certain aircraft.

  3.6 A Seção 21.107-I do RBAC 21 contém requisitos aplicáveis ​​para modificações aos OSD,
  incluindo a MMEL.

  3.6 Section 21.107-I of RBAC 21 contains requirements applicable for changes to OSD, including
  MMEL.

  3.7 A Resolução ANAC nº 30/2008 institui em seu art. 14 que a IS é uma norma geral que visa
  esclarecer, detalhar e orientar a aplicação dos requisitos previstos no RBAC.

  3.7 ANAC Resolution No. 30/2008 establishes in its art. 14 that IS is a general-purpose
  standard aiming to clarify, detail and guide the application of requirements set out in
  RBAC.

  3.8 Qualquer pessoa que pretenda demonstrar o cumprimento dos requisitos estabelecidos no
  RBAC poderá:

  3.8 Any person intending to demonstrate compliance with requirements set out in RBAC may:

  a) adotar os meios e procedimentos previamente especificados na IS; ou

  a) adopt the means and procedures previously specified in IS; or

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, neste
  caso, a análise e a concordância expressa do órgão competente da ANAC.

  b) present properly justified alternative means or procedure, being required, in this case,
  the analysis and express consent of the competent ANAC branch.

  3.9 Os meios ou procedimentos alternativos mencionados no item 3.8(b) devem garantir um
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou atingir
  o objetivo do procedimento padronizado em IS.

  3.9 The alternative means or procedure mentioned in item 3.8(b) shall ensure a level of
  safety equal to or greater than that established by the applicable requirement or achieve
  the objective of the procedure standardized in IS.

  4. DEFINIÇÕES

  4. DEFINITIONS

  4.1 Evento externo significa uma ocorrência que tem origem distinta da aeronave ou do sistema
  que está sendo examinado, tais como condições atmosféricas (por exemplo, rajadas ou cortante
  de vento, variações de temperatura, formação de gelo, queda de raios), ambiente operacional
  (por exemplo, condições da pista, condições de comunicação, navegação e serviços de vigilância),
  incêndios na cabine e na bagagem e colisão com pássaros.

  4.1 External event means an occurrence which has its origin distinct from the aircraft or
  the system being examined, such as atmospheric conditions (e.g. wind gusts/shear, temperature
  variations, icing, lightning strikes), operating environment (e.g. runway conditions, conditions
  of communication, navigation and surveillance services), cabin and baggage fires, and bird
  strike.

  4.2 As definições de “Aprovado”, MEL, MMEL, OSD e “pequena aeronave” estão no RBAC 01. Com
  o propósito de apresentar uma versão em inglês para tais definições, elas são reproduzidas
  abaixo.

  4.2 The definitions of “Approved”, MEL, MMEL, OSD and “small aircraft” are present in RBAC
  01. For the sake of providing an English version of such definitions, they are reproduced
  below.

  4.2.1 Aprovado significa, a menos que usado em referência a outra pessoa, aprovado pela
  ANAC ou por qualquer pessoa cuja competência de aprovação a ANAC reconheça, no assunto em
  questão, incluindo outras autoridades de aviação civil.

  4.2.1 Approved means, unless used in reference to another person, approved by ANAC or by
  any person whose approval competency is recognized by ANAC, in the affected matter, including
  other civil aviation authorities.

  4.2.2 Dados Relevantes à Operação (Operational Suitability Data - OSD) significam as informações
  produzidas na certificação de tipo que são relevantes à operação segura da aeronave, cujos
  elementos incluem a MMEL.

  4.2.2 Operational Suitability Data - OSD means data produced during type certification which
  are relevant to the aircraft safe operation, whose elements include the MMEL.

  4.2.3 Lista de Equipamentos Mínimos (Minimum Equipment List - MEL) significa um documento
  aprovado para uso de um operador de aeronave, em conformidade com ou mais restritivo que
  a MMEL estabelecida para o tipo ou modelo específico da aeronave, que lista itens que podem
  estar temporariamente inoperantes, observadas as limitações, procedimentos e condições especiais
  de operação ali descritas, conforme aplicável.

  4.2.3 Minimum Equipment List - MEL means an approved document to be used by an aircraft
  operator, in conformity to or more restrictive than the MMEL established for the aircraft
  type or specific model, which lists items that may be temporarily inoperative, provided
  that limitations, procedures and special operating conditions therein described are met,
  as applicable.

  4.2.4 Lista Mestra de Equipamentos Mínimos (Master Minimum Equipment List - MMEL) significa
  um documento aprovado para um tipo ou modelo específico de aeronave que lista itens que
  podem estar temporariamente inoperantes, observadas as limitações, procedimentos e condições
  especiais de operação ali descritas, conforme aplicável.

  4.2.4 Master Minimum Equipment List - MMEL means an approved document for a specific aircraft
  type or model which lists items that may be temporarily inoperative, provided that limitations,
  procedures and special operating conditions therein described are met, as applicable.

  4.2.5 Pequena aeronave significa uma aeronave com peso máximo de decolagem aprovado igual
  ou inferior a 5.670 kg (12.500 lb). Esta definição se aplica a aviões e helicópteros ou
  qualquer outro tipo de aeronave definida pelo parágrafo 21.17(b)-I do RBAC 21.

  4.2.5 Small aircraft means aircraft of 5,670 kg (12,500 pounds) or less, maximum certificated
  takeoff weight. This definition applies both to airplanes and rotorcraft or any other type
  of aircraft defined as per paragraph 21.17.(b)-I of RBAC 21.

  4.3 Outras definições específicas relacionadas à MMEL são encontradas no Apêndice C.

  4.3 Other specific definitions related to MMEL are found in Appendix C.

  5. DESENVOLVIMENTO DO ASSUNTO

  5. SUBJECT DEVELOPMENT

  5.1 Introdução e história

  5.1 Introduction and history

  5.1.1 Os requisitos de aeronavegabilidade aplicáveis ao projeto de tipo de aeronaves estabelecem
  que cada equipamento nelas instalado deve permanecer operante. Entretanto, em cada projeto
  particular, a função desempenhada por determinado equipamento instalado pode não ser essencial
  para garantir a segurança operacional da aeronave, devido às seguintes razões:

  5.1.1 The airworthiness requirements applicable to the aircraft type design establish that
  each equipment installed on them must remain operative. However, in each particular design,
  the function performed by certain installed equipment may not be essential to ensure the
  safe operation of the aircraft, due to one of the following reasons:

  a) Há elevado grau de redundância para a função;

  a) There is a high degree of redundancy for that function;

  b) A ausência de uma função específica pode ser compensada por uma função similar de outro
  equipamento;

  b) The lack of a specific function can be compensated by a similar function of other equipment;

  c) A função pode não ser necessária em determinadas condições operacionais; ou

  c) Such function may not be necessary under certain operational conditions; or

  d) Tais equipamentos e funções visam exclusivamente o conforto e a conveniência dos ocupantes,
  sem efeito algum sobre a segurança operacional da aeronave.

  d) Such equipment and functions are aimed exclusively at the comfort and convenience of
  the occupants, with no effect on the safe operation of the aircraft.

  5.1.2 Por outro lado, a regulamentação aplicável à operação de aeronaves permite que elas
  sejam operadas com equipamentos ou instrumentos inoperantes, por um período limitado de
  tempo, desde que o operador interessado em realizar tal operação elabore uma MEL e obtenha
  aprovação de sua autoridade de avião civil competente. Para operadores brasileiros, as operações
  com equipamentos inoperantes são regidas pelas seções 91.213 e 91.1115 do RBAC 91, 135.179
  do RBAC 135 e 121.628 do RBAC 121, conforme aplicável ao tipo de operação sendo conduzida.
  Esta tarefa, entretanto, não pode ser facilmente executada pelo operador, pois este não
  possui os dados de engenharia que fundamentaram o projeto de tipo da aeronave para avaliar
  adequadamente o efeito da falta de determinado equipamento ou instrumento na segurança operacional
  da aeronave.

  5.1.2 On the other hand, regulations applicable to the operation of aircraft allow them
  to be operated with inoperative equipment or instruments, for a limited time period, provided
  that the operator interested in carrying out such operation prepares a MEL and obtains its
  approval from its competent civil aviation authority. For Brazilian operators, operations
  with inoperative items are governed by sections 91.213 and 91.1115 of RBAC 91, 135.179 of
  RBAC 135 and 121.628 of RBAC 121, as applicable to the type of operation being conducted.
  This task, however, cannot be easily performed by the operator, as it does not have the
  engineering data that substantiated the aircraft type design to appropriately assess the
  effect of the lack of certain equipment or instrument on the safe operation of the aircraft.

  5.1.3 Por esse motivo, os esforços conjuntos dos operadores de aeronaves, do detentor ou
  requerente de um Certificado de Tipo - CT ou Certificado Suplementar de Tipo - CST e da
  autoridade de aviação civil resulta no desenvolvimento de uma MMEL que serve de base para
  a preparação das MEL individuais para cada operador.

  5.1.3 For this reason, the joint work of aircraft operators, the holder or applicant for
  a Type Certificate - TC or Supplemental Type Certificate - STC, and the civil aviation authority
  results in the development of an MMEL that serves as a base for the preparation of individual
  MEL for each operator.

  5.1.4 As MMEL e MEL foram inicialmente adotadas nos Estados Unidos em 1946 para aeronaves
  de categoria transporte usadas por companhias aéreas, reconhecendo que as operações poderiam
  ser realizadas com segurança com certos instrumentos ou equipamentos inoperantes, dependendo
  das condições específicas sob as quais tais operações ocorreriam. Mais tarde, o uso desses
  documentos também foi estendido a outros tipos de aeronaves e regras operacionais.

  5.1.4 MMEL and MEL were initially adopted in the United States in 1946 for transport category
  aircraft used by airlines, recognizing that operations could be carried out safely with
  certain instruments or equipment inoperative, depending on the specific conditions under
  which such operations would take place. Later, the use of these documents was also extended
  to other types of aircraft and operating rules.

  5.1.5 Desde então, a MMEL e a MEL têm sido amplamente utilizadas em todo o mundo, expandindo
  o uso das aeronaves ao garantir sua disponibilidade, ao mesmo tempo em que mantém elevado
  o histórico de segurança da indústria da aviação.

  5.1.5 Since then, MMEL and MEL have been extensively used worldwide, expanding the use of
  aircraft by ensuring their availability while maintaining the elevated safety records of
  the aviation industry.

