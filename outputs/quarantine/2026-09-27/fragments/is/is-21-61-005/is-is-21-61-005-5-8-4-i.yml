cite: 5.8.4(i)
title: 5.8.4(i)
text: '(i) Where a time period is specified in calendar days or flight days, the interval
  excludes the day of discovery.

  (ii) For all other intervals (e.g., flights, flight legs, cycles, hours) , it shall start
  at the point when the item is deferred by the operator.

  34. ‘Repair Category’ is a classification of the repair interval into defined categories,
  designed as A, B, C and D, as follows:

  Category A - No standard interval is specified. Items in this category shall be repaired
  in accordance with the conditions stated in the MMEL/MEL. It may be specified in calendar
  days that differs from other categories or other types of intervals, such as flights, flight
  legs, cycles, hours.

  Category B - Items in this category shall be repaired within 3 calendar days, excluding
  the day of discovery. For example, if it was recorded at 10 a.m. on January 1st, the 3-day
  interval would begin at 00:00 on January 2nd and end at 23:59 on January 4th.

  Category C - Items in this category shall be repaired within 10 calendar days, excluding
  the day of discovery. For example, if it was recorded at 10 p.m. on January 1st, the 10-day
  interval would begin at 00:00 on January 2nd and end at 23:59 on January 11th.

  Category D - Items in this category shall be repaired within 120 calendar days, excluding
  the day of discovery.

  35. ‘Required by regulations’ or other statements such as ‘Not required by regulations’,
  or ‘Any in excess of those required by regulation’, means that the listed item is subject
  to certain requirements expressed in operational rules. The number of items required by
  applicable operational rules must be operative. A dash may be used when the number required
  for dispatch is variable. When the listed item is not required by regulations, it may be
  inoperative for the time specified by repair category.

  36. ‘System Page’ is a MMEL page divided into columns that include sequence number, item,
  repair category, number installed, number required for dispatch, and remarks or exceptions.

  37. ‘Verified Operative’ or checked operative, means that it is required to check and confirm
  the item is operative at the interval(s) specified for that MMEL item (e.g., verified operative
  prior to each flight). If no interval is specified, verification is required only at the
  time of deferral of the original item.

  38. ‘Visible Moisture’ means an atmospheric environment containing water in any form that
  can be seen in natural or artificial light, for example, clouds, fog, mist, rain, sleet,
  hail, or snow.

  39. ‘Visual Meteorological Conditions (VMC)’ means the atmospheric environment is such that
  would allow a flight to proceed under VFR applicable to the flight. This does not preclude
  operation under IFR.

  40. ‘Dash (-)’ in the number installed or required columns, indicates a variable number
  (quantity) of the item installed or required for dispatch or ‘not applicable’.

  41. ‘Triple Asterisk (***)’ in the Item column indicates an item which is not required by
  the regulations, but which may have been installed on some but not all aircraft covered
  by this MMEL. The use of this symbol does not provide the authority to install or remove
  an item from an aircraft.

