  5.3 ANTECEDENTES

  5.3.1 A modificação de um avião que opera na configuração exclusiva de transporte de passageiros
  para uma configuração exclusiva de transporte de carga ou mista (combi) é uma modificação
  no projeto de tipo do avião, mesmo que esta modificação seja tão simples como apenas alterar
  ou impor limitações adicionais.

  5.3.2 Exceto como previsto no RBAC 21.101 (b) e (c), um requerente de uma modificação a
  um certificado de tipo deve mostrar que o produto modificado cumpre com os requisitos de
  aeronavegabilidade aplicáveis à categoria do produto, em vigor na data do requerimento para
  modificação.

  5.3.3 O RBAC 135 pode conter, em certos casos, requisitos adicionais aos requisitos de aeronavegabilidade.
  A pessoa que opera um avião modificado para o transporte de carga, de acordo com o RBAC
  135, deve cumprir com estes requisitos, em adição aos requisitos de aeronavegabilidade.

  5.3.4 Considerando que o RBAC/14 CFR Part 23 e seus precursores não prevêem que os aviões
  certificados segundo estes requisitos sejam utilizados para o transporte de carga, certos
  requisitos aplicáveis do RBAC/14 CFR Part 25 podem ser adotados em adição àqueles.

  5.4 REQUISITOS ESTRUTURAIS

  5.4.1 O piso da cabine ou a superfície inferior do compartimento de carga ou de bagagem,
  se não for o próprio piso e toda estrutura usada para suportar ou restringir o conteúdo
  desse compartimento deve cumprir com os requisitos aplicáveis de estruturas. Entre as modificações
  da estrutura primária que devem ser avaliadas estão os novos caminhos de carga em conseqüência
  de furos adicionais, furos existentes que serão submetidos a carregamentos diferentes, cortes
  necessários na estrutura, etc. Os aviões pressurizados devem merecer atenção especial dada
  à possibilidade de uma descompressão catastrófica.

  5.4.2 As limitações estabelecidas de carregamento do piso (carga distribuída por área e
  altura da carga) devem ser dispostas na forma de marcas e placas visíveis.

  5.4.3 O sistema de retenção de carga, isto é, redes, cintas, correntes, amarrações, etc.,
  deve ter resistência suficiente não só para restringir a carga, mas deve também assegurar
  que a carga não se movimente e bloqueie ou dificulte o acesso às saídas de emergência e
  a qualquer equipamento requerido. O sistema de retenção de carga deve ser projetado e instalado
  de modo que não haja possibilidade de interferir com os cabos ou outros componentes do sistema
  de comando do avião.

  5.5 CLASSIFICAÇÃO DOS COMPARTIMENTOS DE CARGA DE ACORDO COM O RBAC 25.857/14 CFR PART 25.857

  5.5.1 O compartimento de bagagem ou de carga é classificado de acordo com o RBAC 25.857/14
  CFR Part 25.857 e demonstra o cumprimento com os requisitos de cada classe. Com o objetivo
  de estabelecer requisitos apropriados para proteção contra fogo, foi desenvolvido um sistema
  para classificação dos compartimentos de bagagem ou de carga. Esta classificação está baseada
  nos meios pelos quais um fogo pode ser detectado e nos meios disponíveis para combatê-lo.

  5.5.2 Classe A - É um compartimento de carga ou de bagagem localizado próximo de um tripulante,
  e este pode perceber a presença de um fogo imediatamente. Cada parte deste compartimento
  deve ser facilmente acessível de modo que o tripulante possa rapidamente extinguir um fogo
  com o jato de um extintor portátil. Este compartimento não necessita ter um revestimento
  especial adicional (liner).

  Um compartimento Classe A é um compartimento aberto, localizado próximo da cabine de pilotagem,
  usado principalmente para armazenar a bagagem dos tripulantes. No entanto um compartimento
  Classe A não está limitado a este uso; ele pode estar posicionado em outro local e utilizado
  com outros propósitos, desde que esteja próximo do posto de um tripulante.

  Como um compartimento Classe A não necessita ser revestido com um liner, tal compartimento
  deve estar localizado suficientemente próximo do posto de um tripulante de modo que qualquer
  fogo que venha a ocorrer seja imediatamente identificado e extinto. Sem a instalação de
  um liner para contê-lo, um fogo não detectado ou incontrolado pode se tornar rapidamente
  catastrófico pela queima de todo o compartimento e pelo alastramento do fogo por todo o
  avião. Deve ser assegurado que todas as partes deste compartimento sejam possíveis de serem
  acessadas por um tripulante, de modo que todo fogo possa ser detectado imediatamente e extinto
  prontamente com o jato de um extintor portátil. Mesmo não havendo um limite de volume especificado,
  não se deve enquadrar na Classe A, um compartimento de carga com volume superior a 1500
  litros, em um avião com uma configuração mista de passageiros e carga (combi).

  5.5.3 Classe B - É um compartimento de carga ou de bagagem cuja localização é mais afastada
  do posto de um tripulante que um compartimento Classe A e, portanto, deve incorporar um
  sistema exclusivo e independente de detecção de fogo ou de fumaça para emitir um alerta
  aos tripulantes, na cabine de pilotagem. Neste caso, como há a possibilidade de existir
  um fogo não detectado e que não possa ser extinto rapidamente, um compartimento Classe B
  deve ser revestido com um liner de acordo com o RBAC/14 CFR Part 25.855. Deve haver acesso
  adequado, em vôo, para um tripulante alcançar efetivamente cada parte do compartimento de
  carga ou de bagagem com o jato de um extintor de incêndio portátil. Quando este acesso estiver
  sendo utilizado, nenhuma quantidade perigosa de fumaça, de chamas ou de agente extintor
  pode penetrar em um compartimento ocupado por passageiros e/ou tripulantes.

  5.5.4 Classe C - É um compartimento de carga ou de bagagem que não cumpre com os requisitos
  da Classe A ou da Classe B, ou seja, não necessita ser acessível em voo, portanto deve ter
  instalado um sistema exclusivo e independente de detecção de fogo ou de fumaça para emitir
  um alerta aos tripulantes na cabine de pilotagem e deve ser revestido com um liner de acordo
  com o RBAC 25.855 e RBAC 25.857; deve ter um sistema integral aprovado de extinção ou de
  supressão de fogo comandado da cabine de pilotagem; deve ter meios para eliminar quantidades
  perigosas de fumaça, de agente extintor, e/ou de gases tóxicos de todo compartimento ocupado
  por tripulantes e/ou passageiros e deve ter meios para controlar a ventilação e a tiragem
  do compartimento de carga ou de bagagem, de modo que o agente extintor usado possa controlar
  qualquer fogo que possa ter iniciado nesse compartimento.'
