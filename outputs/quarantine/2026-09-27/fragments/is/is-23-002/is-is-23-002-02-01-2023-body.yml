text: '02.01.2023


  OBJETIVO

  Esta Instrução Suplementar - IS fornece informações para obtenção de aprovação de grandes
  modificações a serem incorporadas em aviões com peso máximo de decolagem (MTOW - Maximum
  Takeoff Weight) igual ou inferior a 5 670 kg (12 500 lb), certificados nas categorias Normal,
  Utilidade e Acrobática e com peso máximo de decolagem (MTOW) igual ou inferior a 8 618 kg
  (19 000 lb), certificados na Categoria Transporte Regional, para adaptá-los para o transporte
  de carga.

  REVOGAÇÃO

  Esta IS substitui a IS nº 23-002 Revisão A, de 6 de agosto de 2010.

  FUNDAMENTOS

  3.1 O artigo 68 da Lei Federal nº 7.565, de 19 de dezembro de 1986, prevê que a Autoridade
  aeronáutica emitirá certificado de homologação de tipo de aeronave, motores, hélices e outros
  produtos aeronáuticos que satisfizerem as exigências e requisitos dos Regulamentos.

  3.2 O Regulamento Brasileiro da Aviação Civil - RBAC nº 21 estabelece as condições nas quais
  um requerente pode obter aprovação de uma grande modificação ao projeto de tipo.

  DEFINIÇÕES - N/A

  DESENVOLVIMENTO DO ASSUNTO

  5.1 APLICABILIDADE

  5.1.1 Estas instruções são aplicáveis a qualquer pessoa que pretenda operar aeronaves civis
  registradas no Brasil como operador aéreo regular ou não regular no transporte aéreo público
  de bens e de malas postais (RBAC 119).

  5.1.2 Esta Instrução Suplementar é válida somente para aprovação das grandes modificações
  de aviões cuja base de certificação é o RBAC 23, Civil Air Regulations - CAR 3, CAR 4a,
  CAR 04 ou equivalentes, mas serve como guia para aprovação das grandes modificações em helicópteros
  cuja base de certificação é o RBAC 27, CAR 06 ou equivalentes.

  5.2 REQUISITOS AFETADOS

  RBAC 21.21

  Emissão de Certificado de Tipo: Aeronaves Categoria Normal, Utilidade, Acrobática, Transporte
  Regional, Transporte; Balão Livre Tripulado; Classes Especiais de Aeronaves; Motores e Hélices.

  RBAC 21.101

