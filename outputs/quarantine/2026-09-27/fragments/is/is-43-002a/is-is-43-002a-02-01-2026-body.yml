text: '02.01.2026

  Objetivo

  Esta Instrução Suplementar - IS estabelece orientações referentes à atuação de Mecânico
  de Manutenção Aeronáutica - MMA (daqui em diante podendo ser referido apenas como mecânico
  ou MMA) com relação à aprovação de retorno ao serviço de:

  a) aeronaves de Centros de Instrução de Aviação Civil - CIAC ou de Entidades da Administração
  Pública - EAP, submetidas a inspeções de até 100 horas previstas no programa de manutenção
  do fabricante ou Apêndice D do RBAC nº 43 e ações corretivas com o mesmo nível de complexidade
  [§43.7(b)-I(1) do RBAC nº 43];

  b) aeronaves que não estejam vinculadas a empresas que operem segundo os RBAC nº 121 ou
  135, submetidas a inspeções de até 50 horas previstas no programa de manutenção do fabricante
  ou num programa aprovado de inspeções progressivas e ações corretivas com o mesmo nível
  de complexidade [§43.7(b)-I(2) do RBAC nº 43] ou a manutenção preventiva [§43.7(b)-II do
  RBAC nº 43];

  c) aeronaves de empresas que operam segundo o RBAC nº 91, submetidas a inspeções de até
  100 horas previstas no programa de manutenção do fabricante ou num programa aprovado de
  inspeções progressivas e ações corretivas com o mesmo nível de complexidade [§43.7(b)-I(3)
  do RBAC nº 43];

  d) aeronaves leves esportivas [§43.7(b)-I(4) do RBAC nº 43]; e

  e) planadores e motoplanadores [§43.7(b)-I(5) do RBAC nº 43].

  Adicionalmente, estabelece orientações referentes à atuação de MMA com relação a regras
  gerais de execução de manutenção associadas aos requisitos acima listados.

  Revogação

  Não Aplicável.

  Fundamentos

  A Resolução no 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da Anac.

  O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir nível
  de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar o
  objetivo do procedimento normalizado em IS.

  A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.

  Esta IS apresenta meios aceitáveis de cumprimento para os parágrafos 43.3(b), 43.7(b)-I
  e (b)-II e para a seção 43.13 do RBAC nº 43.

  O parágrafo 43.7(b)-I do RBAC nº 43 estabelece para quais aeronaves e em que condições um
  detentor de uma licença de MMA habilitado em célula e grupo motopropulsor pode aprovar o
  retorno ao serviço.

  O parágrafo 43.7(b)-I(1) do RBAC nº 43 estabelece que, desde que esteja devidamente cadastrado
  junto à Agência Nacional de Aviação Civil - Anac, um mecânico habilitado pela Anac em célula
  e grupo motopropulsor pode aprovar o retorno ao serviço de aeronaves empregadas por aeroclubes
  ou entidades assemelhadas em instrução para formação de pilotos que não disponham de organização
  de manutenção certificada conforme o RBAC nº 145; ou de aeronaves a serviço de EAP Federal,
  Estadual, Municipal ou do Distrito Federal; que tenham sido submetidas a inspeções de até
  100 horas previstas no programa de manutenção do fabricante ou em conformidade com o Apêndice
  D do RBAC nº 43 e ações corretivas com o mesmo nível de complexidade.

  Nota 1: O Regulamento Brasileiro de Homologação Aeronáutica - RBHA 140, o qual se referia
  a “Autorização, Organização e Funcionamento de Aeroclubes” e o RBHA 141, o qual se referia
  a "Escolas de Aviação Civil" foram substituídos pelo RBAC nº 141, intitulado “Certificação
  e requisitos operacionais: Centros de Instrução de Aviação Civil”, de acordo com o art.
  1° da Resolução nº 514, de 25.04.2019. Nesse sentido, os RBHA 140 e RBHA 141 possuem aplicação
  restrita às instituições enquadradas no prazo de transição estabelecido pelo art. 5º da
  Resolução citada. Para efeitos desta IS, está sendo utilizado o termo Centro de Instrução
  de Aviação Civil - CIAC em sentido amplo, para abordar os procedimentos de cadastramento,
  os quais são os mesmos tanto para CIAC quanto para os aeroclubes e escolas de aviação civil
  ainda em transição.

  Nota 2: esclarece-se que a aplicabilidade do parágrafo 43.7(b)-I(1) do RBAC nº 43 a aeronaves
  a serviço de EAP é em sentido amplo, seja esta uma Unidade Aérea Pública - UAP, conforme
  RBAC nº 90, ou outras EAP, conforme RBAC nº 91.

  O parágrafo 43.7(b)-I(2) do RBAC nº 43 estabelece que um mecânico habilitado em célula e
  grupo motopropulsor pode aprovar o retorno ao serviço de aeronaves submetidas a inspeções
  de até 50 horas previstas no programa de manutenção do fabricante ou num programa aprovado
  de inspeções progressivas e ações corretivas com o mesmo nível de complexidade, desde que
  essas aeronaves não estejam vinculadas a uma empresa que opere segundo o RBAC nº 121 ou
  135.

  O parágrafo 43.7(b)-I(3) do RBAC nº 43 estabelece que um mecânico habilitado em célula e
  grupo motopropulsor pode aprovar o retorno ao serviço de aeronaves submetidas a inspeções
  de até 100 horas previstas no programa de manutenção do fabricante ou num programa aprovado
  de inspeções progressivas e ações corretivas com o mesmo nível de complexidade, quando esse
  mecânico estiver vinculado a uma empresa que opere segundo o RBAC nº 91.

  O parágrafo 43.7(b)-I(4) do RBAC nº 43 estabelece que um mecânico habilitado em célula e
  grupo motopropulsor pode aprovar o retorno ao serviço de aeronaves leves esportivas.

  O parágrafo 43.7(b)-I(5) do RBAC nº 43 estabelece que um mecânico habilitado em célula e
  grupo motopropulsor pode aprovar o retorno ao serviço de planadores e motoplanadores, sendo
  dispensada a habilitação em grupo motopropulsor para aprovar o retorno ao serviço de planadores.

  O parágrafo 43.7(b)-II do RBAC nº 43 estabelece que um mecânico habilitado pela Anac pode
  aprovar o retorno ao serviço de uma aeronave após execução de manutenção preventiva, desde
  que essa aeronave não esteja vinculada a uma empresa que opere segundo o RBAC nº 121 ou
  135.

  O Apêndice C desta IS apresenta uma tabela comparativa entre os parágrafos do RBAC nº 43
  acima citados.

  Definições

  Para os efeitos desta IS, são válidas as definições listadas no RBAC nº 01 e as seguintes
  definições:

  Mecânico Vinculado: MMA com licença e habilitações conforme RBAC nº 65, que possui vínculo
  empregatício, contratual ou societário com a empresa.

  Mecânico Cadastrado: MMA com licença e habilitações conforme RBAC nº 65, que é cadastrado
  pela Anac, em conformidade com esta IS, para prestar serviços de manutenção aeronáutica
  para os CIAC ou as EAP, conforme o parágrafo 43.7(b)-I(1) do RBAC nº 43.

  Certificado de Verificação de Aeronavegabilidade - CVA: ver definição na IS nº 91.403-001.

  Empresas que operam segundo o RBAC nº 91: empresas aéreas autorizadas para prestar Serviços
  Aéreos Especializados - SAE, conforme definido pela Resolução nº 659, de 2 de fevereiro
  de 2022 da Anac.

  Nota: apesar de a atividade de ensino e adestramento (instrução) estar prevista no item
  1.2.15 do Anexo à Resolução nº 659, de 2 de fevereiro de 2022 da Anac como uma atividade
  SAE, para efeitos desta IS, os CIAC devem seguir o processo estabelecido no item 5.12 desta
  IS, para dar cumprimento à necessidade de cadastramento do MMA prevista no parágrafo 43.7(b)-I(1)
  do RBAC nº 43.

  Programa de manutenção do fabricante: um documento do fabricante que descreve as tarefas
  específicas de manutenção programada e suas frequências de realização e procedimentos relacionados
  para a operação segura das aeronaves às quais se aplica.

  NOTA: o parágrafo 43.7(b)-I(1) do RBAC nº 43 se refere a “plano de manutenção do fabricante”,
  o qual deve ser entendido como “programa de manutenção do fabricante”.

  Programa aprovado de inspeções progressivas: é um programa aprovado de acordo com o parágrafo
  91.409(d) do RBAC nº 91.

  Limitações de aeronavegabilidade: são tarefas de manutenção que afetam o nível mínimo de
  segurança do produto aeronáutico. Incluem tarefas que visam detectar falhas latentes que,
  em conjunto com uma ou mais falhas específicas adicionais, podem resultar em uma situação
  perigosa ou catastrófica. São definidas pelo fabricante durante a certificação de tipo ou
  suplementar de tipo, aprovadas pela autoridade de aviação civil e identificadas como tal
  no Manual de Manutenção ou nas Instruções para Aeronavegabilidade Continuada, tornando-se
  de cumprimento obrigatório. As limitações de aeronavegabilidade envolvem prazos ou intervalos
  máximos de utilização em termos de horas e/ou ciclos, ou outro valor mensurável.

  Desenvolvimento do Assunto

  Um MMA pode aprovar o retorno ao serviço de uma aeronave após a execução de manutenção preventiva
  (conforme o parágrafo A43.1(c) do Apêndice A do RBAC nº 43), em aeronaves que não operam
  segundo os RBAC nº 121 ou 135. Esse é o caso geral descrito no parágrafo 43.7(b)-II do RBAC
  nº 43. Para esse caso, não é requerido o cadastramento do MMA junto à Anac, nem que exista
  vínculo entre o MMA e o operador.

  Para manutenções de nível acima da manutenção preventiva (conforme o parágrafo A43.1(c)
  do Apêndice A do RBAC nº 43) e limitadas a inspeções de até 50 horas previstas no programa
  de manutenção do fabricante ou num programa aprovado de inspeções progressivas e ações corretivas
  com o mesmo nível de complexidade, um MMA, habilitado pela Anac em célula e grupo motopropulsor,
  pode aprovar o retorno ao serviço da aeronave, desde que essa aeronave não esteja vinculada
  a uma empresa que opere segundo o RBAC nº 121 ou 135. Esse caso é descrito no parágrafo
  43.7(b)-I(2) do RBAC nº 43. Para esse caso, também não é requerido o cadastramento do MMA
  junto à Anac e nem que exista vínculo entre o MMA e o operador.

  O parágrafo 43.7(b)-I(1) do RBAC nº 43 abre a possibilidade de que, após cadastro específico
  na Anac, mecânicos habilitados pela Anac em célula e grupo motopropulsor possam aprovar
  para retorno ao serviço aeronaves submetidas a inspeções de até 100 horas previstas no programa
  de manutenção do fabricante ou em conformidade com o Apêndice D do RBAC nº 43 e ações corretivas
  com o mesmo nível de complexidade, desde que essas aeronaves sejam empregadas por:

  a) CIAC que não disponham de organização de manutenção certificada conforme o RBAC nº 145;
  ou

  b) EAP Federal, Estadual, Municipal ou do Distrito Federal.

  De forma complementar, o parágrafo 43.7(b)-I(3) do RBAC nº 43 também abre a possibilidade
  de mecânicos habilitados pela Anac em célula e grupo motopropulsor aprovarem para retorno
  ao serviço aeronaves submetidas a inspeções de até 100 horas previstas no programa de manutenção
  do fabricante ou em conformidade com o Apêndice D do RBAC nº 43 e ações corretivas com o
  mesmo nível de complexidade, no caso das empresas que operam segundo o RBAC nº 91, desde
  que estejam vinculados a essas empresas e sem a necessidade de efetuar o cadastramento do
  MMA junto à Anac. Vide definição de Mecânico Vinculado, item 4.1.1 desta IS.

  Para os demais subparágrafos de 43.7(b)-I do RBAC nº 43, ou seja, 43.7(b)-I(4) (aeronaves
  leves esportivas) e (5) (planadores e motoplanadores), também não há necessidade de cadastramento
  do MMA junto à Anac nem de vínculo com o operador e está dispensada a necessidade de habilitação
  no grupo motopropulsor para o caso de planadores.

  Em todos os casos citados acima, o MMA deve corresponder às qualificações descritas nos
  RBAC nº 65 e 43. Assim, devem ter o seguinte:

  a) as habilitações necessárias. Normalmente são requeridas habilitações em célula e grupo
  motopropulsor, exceto nos seguintes casos:

  I - para planadores, não é requerida habilitação no grupo motopropulsor, conforme o parágrafo
  43.7(b)-I(5) do RBAC nº 43; e

  II - para aeronaves submetidas a manutenção preventiva, de acordo com o parágrafo A43.1(c)
  do Apêndice A do RBAC nº 43, não é necessária habilitação específica, conforme o parágrafo
  43.7(b)-II do RBAC nº 43;

  b) domínio acerca da regulamentação de aviação civil aplicável ao produto e serviço a ser
  realizado, e com os métodos de inspeção, técnicas, práticas, auxílios, equipamentos e ferramentas
  usadas para definir a aeronavegabilidade do artigo no qual a manutenção, manutenção preventiva
  ou alteração será executada;

  c) conhecimento, considerando cursos e treinamentos, no produto e serviço a ser realizado;

  d) satisfatoriamente realizado o mesmo serviço em uma ocasião anterior; e

  e) capacidade de ler e entender o(s) idioma(s) em que são apresentados os dados técnicos
  e as instruções para aeronavegabilidade continuada necessárias para a realização dos serviços
  a serem realizados.

  Quanto à demonstração de experiência, esta pode ocorrer por meio da apresentação de documentos
  que comprovem que o MMA já realizou satisfatoriamente o mesmo serviço em uma ocasião anterior,
  como por exemplo, registros de manutenção preventiva, de inspeções de 50h, 100h ou de tarefas
  equivalentes definidas no Apêndice D do RBAC nº 43. Outros exemplos são documentos que comprovem
  que o MMA trabalhou em uma organização na qual realizava serviço de manutenção aeronáutica
  nos modelos de aeronaves nos quais pretende trabalhar. Por exemplo, declaração de empresa
  ou órgão público, contendo cargo e funções exercidas pelo MMA e os modelos nos quais trabalhou.
  No caso de a declaração ser proveniente de empresa privada, deverá ser assinada pelo responsável
  técnico/diretor de manutenção da organização ou pelo setor de recursos humanos ou por administrador
  constituído. A critério da Anac poderá ser verificada a proficiência do MMA na realização
  dos serviços propostos.

  Outro ponto de atenção se refere à menção que a seção 43.7 do RBAC nº 43 faz a "ações corretivas
  com o mesmo nível de complexidade". Cabe ao operador da aeronave e ao mecânico garantirem
  a equivalência da complexidade das ações corretivas decorrentes dessas inspeções até o respectivo
  limite no manual da aeronave (50h, 100h, etc., conforme aplicável) ou Apêndice D ou parágrafo
  A43.1(c) do Apêndice A, ambos do RBAC nº 43, conforme aplicável, antes de executá-la e aprovar
  o retorno ao serviço da aeronave. Essa equivalência deverá ser comprovada sempre que solicitada
  pela Anac.

  Nota 1: ao executar uma inspeção ou manutenção, o MMA pode vir a se deparar com a necessidade
  de realização de verificações ou manutenções adicionais como, por exemplo, a realização
  de ensaios não destrutivos para a identificação adequada de problemas ou a realização de
  reparos de níveis mais complexos. Nesses casos, devem ser observados os limites autorizados
  e a necessidade de encaminhamento para entidades certificadas para a realização de serviços
  acima do escopo de atuação autorizado ao MMA e que realizar esse encaminhamento também pode
  vir a ser requerido previamente à aprovação de retorno ao serviço.

  Nota 2: para a verificação do nível de complexidade equivalente, devem ser considerados,
  no mínimo, os seguintes critérios:

  a) grau de acesso requerido ao componente ou sistema, incluindo a extensão de desmontagens
  necessárias;

  b) necessidade de utilização de ferramentas especiais ou dedicadas, além do ferramental
  de uso comum em manutenção aeronáutica;

  c) exigência de publicações específicas ou dados técnicos aprovados para a correta execução
  da tarefa;

  d) risco de aeronavegabilidade associado à atividade, considerando o potencial impacto sobre
  a segurança operacional da aeronave;

  e) necessidade de treinamento específico ou qualificação formal do profissional para a execução
  da tarefa; e

  f) necessidade de instalações especiais ou condições ambientais específicas para a execução
  da tarefa.

  Nota 3: caso algum dos critérios acima seja atendido de forma positiva, ou seja, indique
  aumento do risco, grau de acesso, exigência de treinamento especial ou necessidade de instalações
  especiais, a tarefa não poderá ser considerada de nível de complexidade equivalente.

  Ações de manutenção não definidas dentre as inspeções, ou dentre as ações corretivas com
  o mesmo nível de complexidade, não são permitidas e violariam as prerrogativas dispostas
  nos parágrafos citados nos itens 5.1 ao 5.5, assim como a equivalência descrita no item
  5.8 desta IS. Em caso de dúvida quanto a essa equivalência, a GCAC/SPO deve ser consultada
  antes da execução do serviço.

  O Apêndice C desta IS resume os aspectos de cada um dos casos dos parágrafos do RBAC nº
  43 citados neste item 5 desta IS.

  As orientações relacionadas às possibilidades de atuação de mecânicos quanto ao CVA e AEV
  estão descritas, respectivamente, na IS nº 91.403-001 (CVA) e IS nº 21.197-001 (AEV).

  Mecânicos atuando em CIAC ou em EAP, conforme o parágrafo 43.7(b)-I(1) do RBAC nº 43

  Para atuar em CIAC ou em EAP, aprovando retorno ao serviço de aeronaves submetidas a inspeções
  de até 100 horas previstas no programa de manutenção do fabricante ou em conformidade com
  o Apêndice D do RBAC nº 43 e ações corretivas com o mesmo nível de complexidade, o MMA deve
  estar devidamente cadastrado junto à Anac.

  Para realizar tal cadastramento, um MMA deve utilizar o sistema de peticionamento eletrônico
  adotado pela Anac, o Sistema Eletrônico de Informações - SEI, selecionar o tipo de processo
  "Aeronavegabilidade: Cadastramento de Mecânico de Manutenção Aeronáutica", incluir o formulário
  F-900-78 disponível em (link para Formulários) com as informações solicitadas. O formulário
  contém a lista dos documentos e declarações que devem ser anexados ao requerimento. Deve
  ainda ser assinado tanto pelo representante legal da entidade quanto pelo mecânico que está
  sendo cadastrado. Na sequência, o processo deverá ser enviado à Anac.

  De forma a assegurar que os serviços sejam executados mantendo um padrão mínimo de segurança
  e em conformidade o previsto na seção 43.13 do RBAC nº 43, nesse cadastramento são exigidas
  provas documentais de treinamento e experiência, e declarações de que a entidade provê acesso
  a dados técnicos e publicações técnicas atualizadas, bem como acesso a instalações e ferramentas
  necessárias. Conforme as prerrogativas e limitações dispostas na seção 65.81 do RBAC nº
  65, em adição às limitações dispostas na seção 43.7 do RBAC nº 43, o titular da licença
  de MMA somente pode aprovar o retorno ao serviço, sob essa autorização, desde que tenha
  satisfatoriamente realizado o mesmo serviço em uma ocasião anterior. O item 5.12.5 desta
  IS esclarece as formas de demonstração de experiência aplicada a este caso.

  O mecânico deve atender ao previsto no item 5.6 desta IS. Vide também o item 3.7 e apêndice
  C desta IS para maior entendimento dos requisitos associados.

  Os requisitos de experiência solicitados devem ser demonstrados mediante a apresentação
  de documentos comprovantes de que já tenha realizado satisfatoriamente o mesmo serviço em
  uma ocasião anterior como:

  a) conforme aplicável, registros de inspeções de 100h ou de tarefas equivalentes definidas
  no Apêndice D do RBAC nº 43 nos modelos para os quais está sendo requerido o cadastramento;
  ou

  b) comprovante de que trabalhou em uma organização em que realizava serviço de manutenção
  aeronáutica nos modelos para os quais está sendo requerido o cadastramento como, por exemplo,
  declaração de empresa ou órgão público, contendo cargo e funções exercidas pelo MMA e os
  modelos nos quais trabalhou. No caso de a declaração ser proveniente de empresa privada,
  deverá ser assinada pelo responsável técnico/diretor de manutenção da organização ou pelo
  setor de recursos humanos ou por administrador constituído.

  A Anac poderá, visando confirmar as informações apresentadas no processo, solicitar documentação
  relativa aos registros de manutenção das aeronaves mantidas pelo MMA, bem como realizar
  vistorias nas aeronaves ou auditorias nas instalações e processos da entidade para verificar
  as condições de aeronavegabilidade das aeronaves e aderência às boas práticas de manutenção
  conforme legislação vigente. Poderá ainda, verificar a proficiência do mecânico com relação
  às atividades de manutenção a serem efetuadas nas aeronaves da entidade.

  Uma vez que o mecânico e a entidade demonstrem documentalmente que possuem capacidade de
  executar os serviços de forma a atender ao previsto nos regulamentos, a Anac cadastrará
  o mecânico e o autorizará a aprovar o retorno ao serviço das aeronaves submetidas a inspeções
  previstas pelo parágrafo 43.7(b)-I(1) do RBAC nº 43.

  Essa autorização só é válida para as aeronaves operadas pela entidade para a qual foi realizado
  o cadastro, devendo ser especificadas apenas aquelas correspondentes à qualificação do MMA,
  conforme item 5.6 desta IS. No momento do cadastramento, uma lista com as aeronave para
  as quais o mecânico será cadastrado deve ser enviada à Anac, contendo matrícula, fabricante,
  modelo e número de série. Caso uma aeronave do mesmo fabricante e modelo entre na frota
  dessa entidade após o cadastramento, o MMA cadastrado estará autorizado a realizar o mesmo
  nível de manutenção autorizado pelo cadastramento, desde que continuem sendo asseguradas
  as previsões do item 5.6 desta IS.

  O cadastramento é realizado e controlado por modelo de aeronave, conforme as aeronaves e
  capacidade de manutenção apresentadas no processo de solicitação (F-900-78). Para a inclusão
  de novo modelo de aeronave no cadastramento, um novo processo deve ser aberto no SEI com
  o envio de toda a documentação prevista no formulário F-900-78.

  Caso o MMA pretenda atuar em mais do que uma entidade/empresa, esse deve avaliar a compatibilidade
  de tempo e área geográfica de atuação. Caso solicitado, o profissional deve enviar à Anac
  a proposta de como pretende conciliar as cargas horárias nas respectivas entidades/empresas
  em que atuará, incluindo os traslados quando elas não forem localizadas na mesma cidade.

  Nota: nessa limitação, serão considerados na contagem os cadastramentos conforme o parágrafo
  43.7(b)-I(1) do RBAC nº 43 e vínculos com empresas que operam segundo o RBAC nº 91 conforme
  o parágrafo 43.7(b)-I(3) do RBAC nº 43, Organizações de Manutenção Aeronáutica certificadas
  pelo RBAC nº 145 e Operadores Aéreos certificados pelo RBAC nº 119 (operação segundo o RBAC
  nº 135 ou 121) que o MMA porventura possua, considerando que haja compatibilidade de tempo
  e área de atuação. O MMA também deve considerar a carga de trabalho associada ao atendimento
  das aeronaves no escopo dos parágrafos 43.7(b)-I(2), (4) e (5) e 43.7(b)-II do RBAC nº 43.
  Destaca-se que, além do operador das aeronaves afetadas, os profissionais e entidades ou
  empresas também são responsáveis por garantir o cumprimento deste item e por fornecer informações
  atualizadas à Anac sempre que necessário. Essa informação deverá ser apresentada pelo mecânico
  quando do processo de cadastramento e atualizada sempre que necessário.

  Caso o mecânico deixe de prestar os serviços para a entidade, deverá ser solicitado à Anac
  o descadastramento no prazo máximo de 30 dias corridos. O documento solicitando o descadastramento
  deve ser enviado à Anac, via peticionamento eletrônico, pelo mecânico cadastrado ou pela
  entidade, devendo, neste último caso, ser assinado pelo representante legal desta.

  Mecânicos atuando em inspeções de até 50 horas (parágrafo 43.7(b)-I(2) do RBAC nº 43) e
  manutenção preventiva (parágrafo 43.7(b)-II do RBAC nº 43) em aeronave não vinculada a empresa
  que opere segundo o RBAC nº 121 ou 135.

  Nesses casos, o mecânico não precisa ser vinculado ao operador, mas deve observar todas
  as necessidades relacionadas à atuação. Além disso, as aeronaves não podem ser vinculadas
  a empresa que opere segundo o RBAC nº 121 ou 135. Vide itens 3.8 e 3.12 e apêndice C desta
  IS para maior entendimento dos requisitos associados.

  Com relação ao parágrafo 43.7(b)-I(2), o mecânico está limitado a atuar na aprovação de
  retorno ao serviço de aeronaves submetidas a inspeções de até 50 horas previstas no programa
  de manutenção do fabricante, ou em um programa aprovado de inspeções progressivas, e ações
  corretivas com o mesmo nível de complexidade, conforme parágrafo 43.7(b)-I(2) do RBAC nº
  43.

  Com relação ao parágrafo 43.7(b)-II, o o mecânico está limitado a atuar na aprovação de
  retorno ao serviço de aeronaves submetidas a manutenção preventiva, conforme o parágrafo
  A43.1(c) do Apêndice A do RBAC nº 43.

  O mecânico deve atender ao previsto no item 5.6 desta IS.

  O mecânico deve sempre manter uma carga horária compatível com outras atividades, como indicado
  nos itens 5.12.10 e 5.14.3 desta IS de maneira a não impossibilitar o exercício satisfatório
  da atividade.

  Mecânicos vinculados a empresas que operam segundo o RBAC nº 91, conforme o parágrafo 43.7(b)-I(3)
  do RBAC nº 43

  No caso de empresas que operam segundo o RBAC nº 91, o mecânico está limitado a atuar na
  aprovação de retorno ao serviço de aeronaves submetidas a inspeções de até 100 horas previstas
  no programa de manutenção do fabricante, ou num programa aprovado de inspeções progressivas,
  e ações corretivas com o mesmo nível de complexidade, conforme parágrafo 43.7(b)-I(3) do
  RBAC nº 43. Vide item 3.9 e apêndice C desta IS para maior entendimento dos requisitos associados.

  O mecânico vinculado deve atender ao previsto no item 5.6 desta IS.

  Caso o mecânico pretenda atuar em mais do que uma entidade/empresa, esse deve avaliar a
  compatibilidade de tempo por área geográfica de atuação. Caso solicitado, o profissional
  deve enviar à Anac a proposta de como pretende conciliar as cargas horárias nas respectivas
  entidades/empresas em que atuará, incluindo os traslados quando elas não forem localizadas
  na mesma cidade.

  Nota: observar a Nota do item 5.12.10 para realizar essa avaliação.

  Mecânicos atuando em aeronaves leves esportivas (parágrafo 43.7(b)-I(4) do RBAC nº 43).

  Neste caso do parágrafo 43.7(b)-I(4) do RBAC nº 43, de aprovação do retorno ao serviço de
  aeronaves leves esportivas, o mecânico não precisa ser vinculado ao operador, mas deve observar
  todas as necessidades relacionadas à atuação. Vide item 3.10 e Apêndice C desta IS para
  maior entendimento dos requisitos associados.

  O mecânico deve atender ao previsto no item 5.6 desta IS.

  O mecânico deve sempre observar a questão da carga horária compatível com outras atividades,
  como indicado nos itens 5.12.10 e 5.14.3 desta IS, de maneira a não impossibilitar o exercício
  satisfatório da atividade.

  Mecânicos atuando em planadores e motoplanadores (parágrafo 43.7(b)-I(5) do RBAC nº 43).

  Nesses casos parágrafo 43.7(b)-I(5) do RBAC nº 43, o mecânico não precisa ser vinculado
  ao operador, mas deve observar todas as necessidades relacionadas à atuação. O detalhe deste
  caso está relacionado à licença de mecânico de manutenção aeronáutica habilitado pela Anac
  conforme previsto no RBAC nº 65 em célula e grupo motopropulsor para motoplanadores, sendo
  dispensável a habilitação em grupo motopropulsor para planadores. Vide item 3.11 e Apêndice
  C desta IS para maior entendimento dos requisitos associados.

  O mecânico deve atender ao previsto no item 5.6 desta IS.

  O mecânico deve sempre observar a questão da carga horária compatível com outras atividades,
  como indicado nos itens 5.12.10 e 5.14.3 desta IS, de maneira a não impossibilitar o exercício
  satisfatório da atividade.

  Regras GERAIS de Execução DE Manutenção

  O titular de uma licença de MMA somente pode executar ou supervisionar a manutenção e manutenção
  preventiva em um produto aeronáutico para o qual possui habilitação (vide Apêndice C desta
  IS) e os cursos e treinamentos complementares, no produto e/ou serviço de manutenção a ser
  executado, além de ter realizado o serviço anteriormente de forma satisfatória. Observar
  os critérios estabelecidos no item 5.6 desta IS e as habilitações necessárias para cada
  caso.

  O titular de uma licença de MMA somente pode exercer as prerrogativas de sua licença se
  entender e compreender as instruções de aeronavegabilidade continuada, incluindo os manuais
  de manutenção e as diretrizes de aeronavegabilidade aplicáveis, e, no caso de aeronave leve
  esportiva (ALE) com certificado de aeronavegabilidade especial emitido com base na seção
  21.190 do RBAC nº 21, com as diretrizes de segurança aplicáveis, dedicadas ao serviço específico
  relacionado.

  Cada pessoa que estiver executando manutenção ou manutenção preventiva em um artigo deve
  usar métodos, técnicas e práticas estabelecidas na última revisão do manual de manutenção
  do fabricante, ou nas instruções para aeronavegabilidade continuada preparadas pelo fabricante
  ou outros métodos, técnicas e práticas aceitáveis pela Anac. A pessoa executando manutenção
  deve ter acesso aos documentos técnicos e estar autorizada a utilizá-los.

  A pessoa deve usar as ferramentas, equipamentos e aparelhos de testes necessários para assegurar
  a execução do trabalho de acordo com as práticas industriais de aceitação geral. As ferramentas
  de medição utilizadas devem ser mantidas devidamente calibradas e controladas, conforme
  ou de forma equivalente ao previsto no parágrafo 145.109(b)-I do RBAC nº 145.

  Se o fabricante da aeronave ou componente envolvido recomendar equipamentos e aparelhos
  de teste especiais, a pessoa deve usar tais equipamentos e aparelhos, ou equivalentes aceitos
  pela Anac, conforme previsto na IS nº 43.13-005.

  Cada pessoa que estiver executando manutenção ou manutenção preventiva em um artigo aeronáutico
  deve executar esse serviço de tal maneira e usar os materiais indicados pelos fabricantes
  ou autorizados por publicação técnica aplicável.

  Cada pessoa que estiver executando manutenção ou manutenção preventiva em um artigo aeronáutico,
  deve executar esse serviço de tal maneira e usar, desde que dentro do escopo do serviço
  realizado, peças e partes aeronáuticas cuja rastreabilidade esteja de acordo com os requisitos
  regulamentares e instruções aplicáveis a cada caso, como, por exemplo, a IS nº 43.9-002.

  Durante a execução do serviço de manutenção, o mecânico deverá ter à sua disposição, e apresentar
  sempre que requerido pela Anac, registros e/ou evidências que comprovem o cumprimento do
  parágrafo 43.13(a) do RBAC nº 43, ou seja, que o mecânico está usando métodos, técnicas,
  práticas, ferramentas, equipamentos e aparelhos de teste estabelecidos na última revisão
  do manual de manutenção.

  Os registros de manutenção e manutenção preventiva deverão ser realizados conforme o previsto
  na seção 43.9 do RBAC nº 43, e os registros de inspeções deverão ser realizados conforme
  o previsto na seção 43.11 do RBAC nº 43.

  De acordo com a seção 43.12 do RBAC nº 43, ninguém pode fazer ou induzir que seja feita
  qualquer anotação, alteração ou reprodução fraudulenta ou intencionalmente falsa em qualquer
  registro cuja produção, conservação ou uso seja requerido para demonstrar conformidade com
  esse RBAC. Uma pessoa que cometa esse tipo de infração poderá ter sua licença ou certificado
  suspenso ou cassado pela Anac, conforme disposto em Resolução específica, sem prejuízo de
  outras sanções administrativas.

  Cada MMA deve ter um controle dos serviços e registros realizados, sendo recomendado que
  conserve cópia dos registros de qualquer manutenção para a qual tenha emitido uma autorização
  para retorno ao serviço que demonstrem cumprimento dos requisitos do RBAC nº 43 por pelo
  menos 5 (cinco) anos, contados a partir da data em que a aeronave foi aprovada para retorno
  ao serviço. Não obstante, os operadores devem conservar todos os registros conforme os prazos
  regulamentares.

  A seção 91.417 do RBAC nº 91 estabelece os tipos de registros de manutenção que devem ser
  conservados com o operador e transferidos com a aeronave no ato da venda, e aqueles que
  devem ser conservados até que o trabalho seja repetido.

  Sem a intenção de substituir o previsto nos requisitos regulamentares e nos manuais de manutenção
  no que se refere a listas de verificação e necessidades de verificações relacionadas a tarefas
  e inspeções, a lista de verificação indicada no link a seguir resume os cuidados mínimos
  a serem observados pelo MMA antes e depois de executar uma tarefa de manutenção, sem os
  quais uma atividade de manutenção não poderá ser considerada como adequadamente executada.
  Além de cumprir o previsto nos regulamentos e manuais da aeronave, verifique se a reposta
  foi "Sim" para todos os itens da lista de verificação do link Checklist de Bolso para Manutenção
  de Aeronaves.

  ACOMPANHAMENTO E fiscalização

  A Anac poderá, a qualquer momento, solicitar documentação relativa aos registros de manutenção
  das aeronaves mantidas por mecânicos, bem como realizar vistorias nas aeronaves ou auditorias
  nas instalações e processos da entidade para verificar as condições de aeronavegabilidade
  das aeronaves e aderência às boas práticas de manutenção conforme legislação vigente. Poderá
  ainda, verificar a proficiência do mecânico com relação às atividades de manutenção efetuadas
  nas aeronaves da entidade.

  Cada CIAC, EAP Federal, Estadual, Municipal ou do Distrito Federal ou Empresa que opere
  segundo o RBAC nº 91, assim como qualquer outro operador de aeronave registrada no Brasil,
  deve permitir inspeções da Anac a qualquer tempo para que seja verificado o cumprimento
  com os RBAC e demais normativos correlatos.

  De acordo com o parágrafo 21.181(b) do RBAC nº 21, cada proprietário ou operador de uma
  aeronave com certificado de aeronavegabilidade deve colocá-la, sempre que requerido, à disposição
  da Anac, para a condução de inspeções e vistorias.

  As ocorrências definidas pela Resolução nº 714 da Anac devem ser relatadas à Anac na forma,
  prazos e pelo(s) responsável(is) por realizar a(s) notificação(ões) conforme definido por
  aquele documento. A(s) notificação(ões) deve(m) ser realizada(s) pelo Portal Único de Notificação
  da Anac. O não cumprimento de notificações obrigatórias pode resultar em ações administrativas
  aplicáveis.

  Durante as auditorias, vistorias, inspeções de rampa ou fiscalizações remotas, caso seja
  identificado pela Anac descumprimento de normas, falha de manutenção, imperícia ou falta
  de idoneidade por parte dos profissionais envolvidos, ações poderão ser adotadas, incluindo
  a revogação de autorizações e cadastros, sem prejuízo de outras ações administrativas que
  se mostrem necessárias.


