  Manutenção Preventiva**

  Aeronaves não vinculadas a uma empresa que opere segundo o RBAC nº 121 ou 135


  * Quanto ao nível de manutenção, consideradas as limitações, a prerrogativa de um MMA para
  a aprovação de retorno ao serviço não exime a necessidade de que se busquem os serviços
  autorizados e certificados que estejam além das possibilidades da qualificação do MMA, acima
  das instalações disponíveis e das certificações necessárias à realização dos serviços necessários
  a serem terceirizados para a devida execução das tarefas que retornem as aeronaves e/ou
  suas partes à condição aeronavegável. Por exemplo, um ensaio não destrutivo requerido para
  se poder identificar a situação de uma parte deve ser encaminhado a organizações que possuam
  a estrutura de certificação requerida, um reparo mais elaborado após uma ocorrência aeronáutica
  que requeira a terceirização a uma empresa especializada e certificada para tal, uma alteração
  que demande a terceirização a empresa certificada para a devida instalação dos componentes,
  etc.

  ** No caso do parágrafo 43.7(b)-II do RBAC nº 43, a aprovação de retorno ao serviço após
  manutenção preventiva, conforme A43.1(c) do Apêndice A do RBAC nº 43, pode ser realizada
  por um MMA detentor de qualquer uma das habilitações, observando-se o previsto no item 5.6
  desta IS.'
