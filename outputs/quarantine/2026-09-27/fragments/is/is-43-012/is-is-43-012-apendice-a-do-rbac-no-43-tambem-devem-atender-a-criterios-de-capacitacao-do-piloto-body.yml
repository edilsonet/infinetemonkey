title: Apêndice A do RBAC nº 43, também devem atender a critérios de capacitação do piloto,
text: 'Apêndice A do RBAC nº 43, também devem atender a critérios de capacitação do piloto,

  criticidade, ferramentas requeridas e eventual composição daquela inspeção em uma

  inspeção de 100 horas, anual ou inspeção especial não programada.

  Dessa forma, há tarefas que se enquadram como manutenção preventiva nos critérios do

  parágrafo A43.1(c) do Apêndice A do RBAC nº 43, porém que não podem ser realizadas

  pelo piloto no grupo “Pilotos proprietários e assemelhados”. Isso ocorre porque as tarefas
  de

  manutenção preventiva do Apêndice A também possuem outros propósitos, tais como definir

  prerrogativas comuns a todas as habilitações de mecânicos de manutenção aeronáutica, ou

  mesmo outras manutenções preventivas por pilotos em outros grupos, conforme listado nesta

  IS.'
