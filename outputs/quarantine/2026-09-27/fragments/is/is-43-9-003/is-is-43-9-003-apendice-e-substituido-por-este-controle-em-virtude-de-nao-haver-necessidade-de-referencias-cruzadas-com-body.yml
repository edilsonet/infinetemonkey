text: 'Apêndice E Substituído por este controle, em virtude de não haver necessidade de referências
  cruzadas com

  a IAC 3152.

  Ao longo do

  texto Substituído o termo “RBHA 43” por “RBAC 43” em virtude de atualização do Regulamento.

  Ao longo do

  texto Substiuído o termo “... conforme estabelecido na página...” pelo termo “ Apêndice...”.

  Ao longo do

  texto

  Substituídos oe termos “ CHE” e “Certificado ETA” pelos termod “COM” e “COA” ,

  respectivamente, devido às modificações nos Regulamentos atuais.'
