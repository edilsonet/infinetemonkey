cite: 12.5.2(e)
title: 12.5.2(e)
text: '(e) Tests involving time histories, data sheets (or transparencies thereof) and FSTD
  test results must be clearly marked with appropriate reference points to ensure an accurate
  comparison between the FSTD and the airplane with respect to time. Time histories recorded
  via a line printer are to be clearly identified for cross plotting on the airplane data.
  Over-plots must not obscure the reference data.

  12

  The sponsor may elect to complete the QTG objective and subjective tests at the manufacturer''s
  facility or at the sponsor''s training facility (or other sponsor designated location where
  training will take place). If the tests are conducted at the manufacturer''s facility, the
  sponsor must repeat at least one-third of the tests at the sponsor''s training facility
  in order to substantiate FSTD performance. The QTG must be clearly annotated to indicate
  when and where each test was accomplished. Tests conducted at the manufacturer''s facility
  and at the sponsor''s designated training facility must be conducted after the FSTD is assembled
  with systems and sub-systems functional and operating in an interactive manner. The test
  results must be submitted to ANAC.'
