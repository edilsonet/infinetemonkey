text: '03.04.2023


  OBJETIVOS

  1.1 Oferecer aos pilotos procedimentos para registro de horas de voo, para fins de atendimento
  ao estabelecido no RBAC 61 e no RBAC 91.

  1.2 Oferecer ao representante legal de uma entidade jurídica, regida pelo RBAC nº 121 ou
  RBAC nº 135, procedimentos para declarar horas de experiência de voo de seus tripulantes
  ou ex-tripulantes, por meio da CIV Digital.

  REVOGAÇÃO

  2.1 Esta IS revoga a IS nº 61-001, Revisão G.

  FUNDAMENTOS

  3.1 A Resolução no 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou
  RBHA.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC ou RBHA, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2b desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.

  DEFINIÇÕES

  Para os efeitos desta IS, são válidas as definições listadas na seção 61.2 do RBAC nº 61,
  e a seguinte definição:

  4.1 Declaração online de experiência de voo significa procedimento aceito pela ANAC para:

  a) um piloto declarar a experiência de voo requerida para fins de concessão e/ou revalidação
  de licenças ou habilitações previstas no RBAC nº 61; e

  b) o representante legal de uma entidade jurídica (regida pelo RBAC nº 121 ou RBAC nº 135)
  declarar horas de experiência de voo de seus tripulantes ou ex-tripulantes.

  4.2 Lista de abreviaturas (em ordem alfabética):

  ATZ - Aerodrome Traffic Zone

  CBA - Código Brasileiro de Aeronáutica (Lei nº 7.565/1986)

  CIV - Caderneta Individual de Voo

  CTR - Control Zone

  FSTD - Flight Simulation Training Device (dispositivo de treinamento para simulação de voo)

  GCEP - Gerência de Certificação de Pessoal

  IAC - Instrução de Aviação Civil

  IS - Instrução Suplementar

  INV - Instrutor de Voo

  RBAC - Regulamento Brasileiro da Aviação Civil

  SACI - Sistema Integrado de Informações da Aviação Civil

  SPL - Superintendência de Pessoal da Aviação Civil

  TMA - Terminal Control Area

  CADERNETA INDIVIDUAL DE VOO DIGITAL (CIV DIGITAL)

  5.1 Disposições gerais'
