  OBJETIVO

  Estabelecer o processo de exame de proficiência linguística de pilotos desenvolvido pela
  ANAC e procedimentos para a aplicação do exame com vistas à averbação do nível de proficiência
  linguística nas licenças de pilotos brasileiros, de acordo com as definições e requisitos
  estabelecidos pela Seção 61.10 do RBAC nº 61; e

  Estabelecer procedimentos para a averbação de proficiência linguística com base em licença
  estrangeira em processo de convalidação, de acordo com os requisitos estabelecidos pela
  Seção 61.45 do RBAC nº 61.


  REVOGAÇÃO

  Esta IS substitui a IS nº 61-003 Revisão C.


  FUNDAMENTos

  A Resolução no 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  O administrado que pretenda para qualquer finalidade demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  adotar os meios e procedimentos previamente especificados em IS; ou

  apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  O meio ou procedimento alternativo mencionado no item 3.2b desta IS deve garantir nível
  de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar o
  objetivo do procedimento normalizado em IS.

  A IS não pode criar requisitos adicionais ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  Esta IS é fundamentada e objetiva oferecer método de cumprimento às Seções 61.10 e 61.45
  do RBAC nº 61.


  DEFINIÇÕES

  Para os efeitos desta IS, serão válidas as definições listadas na Seção 61.2 do RBAC nº
  61, no RBAC nº 01, e as seguintes definições:

  Avaliador: pessoa devidamente qualificada e treinada que julga e concede o nível de proficiência
  linguística aferido durante o Santos Dumont English Assessment com base nos descritores
  da Escala de Níveis da OACI de acordo com a seção 61.10 do RBAC nº 61.

  Avaliador com Experiência Linguística ou English Language Expert (ELE): avaliador com qualificações
  na área da língua inglesa capaz de interpretar corretamente os descritores da Escala de
  Níveis da OACI e identificar com precisão pontos fortes e fracos do desempenho do candidato.

  Avaliador com Experiência Operacional ou Subject Matter Expert (SME): avaliador com qualificações
  operacionais de piloto ou controlador de tráfego aéreo capaz de interpretar corretamente
  os descritores da Escala de Níveis da OACI e identificar, sob a perspectiva operacional,
  aspectos do uso da língua, exatidão, brevidade na fala e inteligibilidade de sotaques e
  dialetos aceitáveis para a comunidade aeronáutica.

  Candidato: detentor de licença brasileira de piloto, de qualquer categoria, que se submeta
  ao Santos Dumont English Assessment para demonstrar cumprimento dos requisitos de proficiência
  linguística para operação de aeronave civil brasileira fora da jurisdição do espaço aéreo
  brasileiro constantes na seção 61.10 do RBAC nº 61.

  Entidade Credenciada de Proficiência Linguística: detentor do credenciamento de pessoa jurídica
  autorizada pela ANAC a aplicar o Santos Dumont English Assessment com vistas à averbação
  do nível de proficiência linguística nas licenças dos pilotos brasileiros de acordo com
  os requisitos estabelecidos no RBAC nº 61 e no RBAC nº 183.

  Santos Dumont English Assessment (SDEA): exame de proficiência linguística desenvolvido
  pela ANAC com objetivo de aferir o nível de proficiência linguística dos pilotos portadores
  de licença brasileira de acordo com os requisitos estabelecidos no Anexo 1 da Convenção
  de Aviação Civil Internacional e no RBAC nº 61. Exame para fins específicos que avalia habilidade
  de pilotos para usar com eficácia a língua inglesa apropriada ao contexto operacional, suficiente
  para comunicações radiotelefônicas eficientes e seguras.


  desenvolvimento do assunto

  Processo de Exame de Proficiência Linguística de Pilotos

  Estrutura do Santos Dumont English Assessment:

  O SDEA consiste em duas etapas, sendo a segunda etapa exclusiva para verificação do nível
  6.

  A primeira etapa, aplicável a todos os candidatos, estabelece o nível ICAO adequado ao candidato,
  exceto para os que venham a demonstrar potencial de obtenção de nível 6, que poderão, à
  sua escolha, se submeter à segunda etapa do SDEA.

  O exame é conduzido por avaliador com experiência linguística (ELE), na presença de um avaliador
  com experiência operacional (SME). A presença de servidores da ANAC será admitida durante
  fiscalizações nas entidades credenciadas ou em situações de treinamento.

  A primeira etapa do SDEA consiste em uma entrevista oral dividida em quatro partes:

  Aviation Topics: o candidato responde a questões gerais relativas à sua experiência profissional
  e atividades cotidianas no desempenho de suas funções. Objetiva aclimatar o candidato e
  familiarizá-lo com o formato do exame. Proporciona atmosfera favorável à demonstração do
  conhecimento do idioma. As respostas são avaliadas. Possui duração aproximada de cinco minutos.

  Interacting as a Pilot: o candidato escuta gravações de controle de tráfego aéreo relativas
  a situações rotineiras, inesperadas ou de emergência, e interage com as gravações, bem como
  com o avaliador. Anotações são permitidas. Cada áudio pode ser escutado uma segunda vez,
  se solicitado. Cinco cenários distintos são apresentados ao candidato. Visa a verificar
  a capacidade de compreender tópicos comuns, concretos e relacionados ao trabalho, complicações
  linguísticas ou situacionais e eventos inesperados, com sotaques e entonações regionais
  inteligíveis para uma comunidade internacional de usuários e variações de discurso ou registro.
  Avalia também a capacidade de interagir apropriadamente, confirmando informações e solucionando
  mal-entendidos. Apresenta duração aproximada de quinze minutos.

  Unexpected Situations: o candidato relata situações anormais, de urgência ou emergência
  diversas constantes de comunicações radiotelefônicas entre pilotos e controladores, e responde
  a perguntas relacionadas. As anotações são permitidas. Cada áudio é ouvido duas vezes, com
  pausa de 5 segundos antes da repetição. Ao final, o candidato compara as situações expostas
  quanto a severidade, soluções possíveis e formas de prevenção. Objetiva avaliar a capacidade
  do candidato de identificar e compreender situações reais de emergência e complicações situacionais
  através de gravações, bem como sua capacidade de interagir com o examinador ao relatar eventos,
  fazendo transição de fraseologia padronizada para discurso livre. Duração aproximada de
  quinze minutos.

  Picture Description and Discussion: o candidato descreve uma foto ou figura e responde a
  questões sobre a situação exposta, inferindo, avaliando, levantando hipóteses, sustentando
  argumentos e comparando com experiências próprias ou eventos verossímeis. Visa a avaliar
  o desempenho ao sustentar discussão, relatar opiniões e fornecer explicações acerca de tópicos
  relacionados à aviação. Afere também habilidade em desenvolver diálogos de complexidade
  elevada relacionados ao trabalho, com foco no inglês geral. Apresenta duração aproximada
  de dez minutos.

  Os candidatos que demonstraram o desempenho sugestivo de proficiência linguística acima
  do nível 5 em todas as habilidades da Escala de Níveis de proficiência linguística determinada
  pela OACI serão convidados pela Entidade Credenciada de Proficiência Linguística a realizar
  a segunda etapa do SDEA em até 60 (sessenta) dias contados a partir da aplicação da primeira
  etapa.

  A realização da segunda etapa do SDEA para obtenção do English Level 6 - Expert, é opcional.
  Caso não aprovado nesta etapa, o candidato manterá seu English Level 5 - Avançado já alcançado
  na primeira parte do SDEA.

  O formato desta segunda etapa também é o de uma entrevista oral conduzida pelo ELE. Entretanto,
  diferentemente da primeira etapa, o SME também interage com o candidato na última parte
  do exame, simulando uma comunicação radiotelefônica (role-play).

  O exame da segunda etapa é dividido em cinco partes e dura aproximadamente 45 minutos, incluindo
  comunicações face-a-face e situações de uso da voz apenas (telefone/radiotelefone) em diversos
  contextos relacionados às atividades de trabalho dos pilotos. Espera-se que o candidato,
  nas Partes 1 a 4, forneça respostas mais elaboradas, sendo informativo e desenvolvendo seus
  argumentos e opiniões sem, no entanto, se desviar do foco das perguntas. Já na Parte 5,
  espera-se que o candidato se comunique da mesma forma em que faria em uma situação real
  de radiotelefonia. Embora o objetivo de exame não seja a avaliação da fraseologia, o candidato
  deve procurar utilizar a fraseologia nas situações em que for necessário se comunicar com
  o controle de tráfego aéreo. Ao longo de toda esta etapa, o candidato poderá fazer anotações
  enquanto escuta as gravações. O material para escrita será fornecido pelo examinador e os
  papéis das anotações serão rasgados ao final do exame.

  Parte 1 - o candidato escuta duas gravações de comunicações radiotelefônicas, nas quais
  complicações linguísticas, situacionais, e/ou culturais impactam a eficácia e eficiência
  das interações. Depois de ouvir cada áudio uma vez, o candidato deverá: i) identificar a(s)
  quebra(s) na comunicação ou mal-entendido(s); ii) explicar as causas possíveis para a(s)
  falha(s) na comunicação com base na sua própria interpretação da situação; e iii) sugerir
  formas de melhorar o desfecho da primeira comunicação e responder uma pergunta relacionada
  à compreensão da segunda situação.

  Parte 2 - o candidato é apresentado a um conjunto de imagens que representam uma sequência
  de eventos que aconteceram durante uma situação anormal ou de emergência. O candidato deverá:
  i) com base na figura 1, contatar o controlador de tráfego aéreo (via rádio) para anunciar
  o problema e informar suas intenções; ii) com base nas três figuras, contatar o piloto chefe
  da sua empresa (via telefone) e reportar tudo o que aconteceu no dia do evento; e iii) responder
  perguntas sobre o tópico, expressando suas opiniões.

  Parte 3 - o candidato escuta duas gravações em que os participantes discutem um tópico da
  aviação com perspectivas/visões distintas, incluindo uma linguagem mais informal com sutilezas
  de significado. Depois de ouvir cada áudio uma vez, o candidato deverá: i) responder algumas
  perguntas sobre a gravação; ii) posicionar-se em relação a uma das perspectivas, fornecendo
  seus próprios argumentos e explicitando suas razões; e iii) explicar, em linguagem simples,
  o significado que os participantes quiseram expressar em partes específicas da conversa.

  Parte 4 - o candidato escuta uma gravação real de uma reportagem sobre um acidente aéreo.
  Depois de ouvir o áudio uma vez, o candidato deverá: i) reportar os aspectos principais
  relacionados ao evento; ii) participar de uma conversa informal sobre o tópico direcionada
  ao público geral (não familiarizado com aspectos técnicos da aviação). O examinador poderá
  solicitar ao candidato que reformule suas ideias e/ou adapte sua linguagem para assegurar
  uma comunicação bem-sucedida.

  Parte 5 - o candidato escuta uma gravação de um piloto interagindo com um profissional da
  aviação em uma situação não rotineira. Depois de ouvir o áudio uma vez, o candidato deverá
  interagir, como o piloto daquela situação, com o examinador SME, que atuará como seu interlocutor
  simulando uma comunicação radiotelefônica (role-play).

  As habilidades especificamente avaliadas no SDEA são pronúncia, estrutura gramatical, vocabulário,
  fluência, compreensão e interações. O resultado final corresponde ao menor nível atribuído
  entre as seis habilidades avaliadas, independentemente de somatório ou média de notas. A
  avaliação é realizada com base nos descritores holísticos e na Escala de Níveis de proficiência
  linguística determinada pela OACI, constante do Apêndice A do RBAC nº 61.

  As questões do SDEA são relacionadas ao universo da aviação civil. A fraseologia padrão
  de tráfego aéreo pode ser utilizada, contudo a avaliação considera apenas a proficiência
  na produção oral em língua inglesa no contexto da aviação, afastando-se juízo quanto a precisão
  técnica ou operacional.


  Procedimentos para inscrição e agendamento

  Todas as informações adicionais acerca do SDEA incluindo a lista de entidades credenciadas
  e formulários encontram-se no sítio eletrônico dedicado da ANAC:

  https://www.gov.br/anac/pt-br/assuntos/regulados/profissionais-da-aviacao-civil/processo-de-licencas-e-habilitacoes/proficiencia-linguistica

  O candidato é livre para escolher qualquer entidade credenciada a sua escolha para marcar
  o SDEA.

  O candidato deverá imprimir o Formulário de Solicitação de Serviço, verificar a atualização
  de seus dados cadastrais em tal formulário, portá-lo consigo ao apresentar-se para o exame,
  e assiná-lo apenas quando autorizado pelo examinador de proficiência linguística.

  O candidato detentor da licença de piloto de avião deverá realizar o exame elaborado para
  pilotos de avião. O candidato detentor da licença de piloto de helicóptero deverá realizar
  o exame elaborado para pilotos de helicóptero. Se o candidato for detentor das licenças
  de avião e helicóptero, o examinador deve verificar em qual delas o candidato possui habilitação
  válida. Caso tenha habilitações válidas nos dois equipamentos (avião e helicóptero), o candidato
  deverá fazer a prova desenvolvida para pilotos de helicópteros, criada para avaliar a proficiência
  linguística dos candidatos que possuem ambas as licenças.


  Da condução do exame

  A aplicação do SDEA consiste dos seguintes procedimentos:

  o candidato apresenta-se no local de exame com antecedência mínima de 15 (quinze) minutos
  do horário do exame, devendo portar o Formulário de Solicitação de Serviço referente ao
  SDEA preenchido, exceto a assinatura;

  o candidato apresenta documento oficial de identificação com foto e licença de piloto;

  o exame é conduzido somente na língua inglesa, vedado o uso de qualquer outro idioma;

  o candidato deposita quaisquer aparelhos eletrônicos e itens pessoais no espaço designado
  pelos examinadores, devendo portar consigo apenas os documentos de identificação e Ficha
  de Solicitação de Serviço;

  o candidato pode realizar anotações durante as Partes 2 - Interacting as a Pilot e 3 - Unexpected
  Situations da primeira etapa do SDEA, com material fornecido pelo examinador. As anotações,
  se houver, são inutilizadas ao final da Parte 3;

  o candidato pode realizar anotações durante todas as etapas da segunda etapa do SDEA, com
  material fornecido pelo examinador.

  A constatação de conduta fraudulenta, qualquer procedimento ou prática inidônea, ou posse
  de material relativo ao exame, salvo a documentação expressamente autorizada, ensejará desqualificação
  do candidato e anulação do exame aplicado, conforme decisão fundamentada em processo administrativo,
  sem prejuízo de quaisquer penalidades cabíveis em outras esferas administrativas ou judiciais.

  A aplicação do exame é gravada em áudio e vídeo para fins de fiscalização do processo avaliativo
  e posterior aferição da produção oral, especialmente para as avaliações que resultem em
  concessão de Nível 6.

  Quando houver discordância em relação às notas finais concedidas pelos examinadores, especificamente
  entre os níveis 3 e 4 da Escala de Níveis constante do Apêndice A do RBAC nº 61, uma terceira
  avaliação será requerida.


  Processamento dos resultados, interposição de recursos e averbação do nível de proficiência
  linguística no idioma inglês dos pilotos

  A ANAC disponibilizará o resultado obtido no SDEA por mensagem eletrônica ou por meio de
  consulta ao seu sítio eletrônico em até 20 (vinte) dias após a realização do exame.

  A realização de um segundo exame SDEA é permitida após 60 (sessenta) dias corridos da realização
  do exame anterior.

  O exame realizado sem observância das condições estabelecidas no item anterior será inválido
  e impassível de análise, independentemente da instituição ou localidade de realização.

  O resultado obtido no SDEA admite recurso junto à ANAC, no prazo de até 10 (dez) dias contados
  a partir da data de disponibilização do resultado. Tal recurso deve ser realizado exclusivamente
  via Protocolo Eletrônico da ANAC utilizando o processo tipo: Proficiência Linguística -
  Recurso de Certificação em Proficiência Linguística. O formulário para recurso é disponibilizado
  pelo próprio sistema de protocolo.

  O prazo para resposta ao recurso é de até 20 (vinte) dias após a data de protocolo do processo
  na ANAC. A realização de novo exame SDEA antes da análise do recurso proposto implica no
  não reconhecimento do pleito, anulando a análise do recurso.

  Constará nas licenças dos pilotos a averbação de proficiência linguística conforme tabela
  abaixo:

  Situação do Piloto

  Averbação na licença - campo XIII

  Piloto que atingiu nível 6 - Expert


  English Level 6

  Piloto que atingiu nível 5 - Avançado

  (validade 6 anos)

  English Level 5 until MM/AAAA

  Piloto que atingiu nível 4 - Operacional

  (validade 3 anos)

  English Level 4 until MM/AAAA

  Piloto que não tenha obtido no mínimo o nível 4 (Operacional), ou que não tenha realizado
  o exame de proficiência linguística na língua inglesa.

  English not compliant Annex 1

  O mês de validade da averbação de proficiência linguística será correspondente ao mês em
  que a prova foi realizada, independente do dia, encerrando-se a validade no último dia do
  mês averbado.


  Vigilância continuada do nível de proficiência linguística

  Os pilotos detentores de averbação de nível de proficiência linguística são objeto de vigilância
  continuada para a verificação da manutenção da proficiência linguística demonstrada quando
  da emissão de tal averbação. Portanto, qualquer piloto, ainda que esteja válida a averbação
  de seu nível de proficiência linguística, qualquer que seja esse nível, poderá ser submetido
  a uma ação de vigilância continuada que consistirá em uma entrevista técnica, com a finalidade
  de oferecer subsídios à CAPL para emissão de laudo sobre a condição técnica corrente do
  piloto assim avaliado, no que se refere ao seu nível de proficiência linguística.

  Caso, conforme resultado da ação de vigilância, seja identificado indício comprometedor
  do nível de proficiência linguística, a CAPL poderá submeter o piloto a uma nova aplicação
  do SDEA, ainda que esteja válida a averbação do nível de proficiência linguística em sua
  licença (incluindo o nível 6), podendo seu nível ser reajustado em função do resultado dessa
  nova análise.

  A nova aplicação do SDEA será gratuita e realizada por examinadores da ANAC.

  Se o piloto não atender à solicitação da CAPL no prazo de 60 (sessenta) dias, tanto para
  a entrevista técnica quanto para a realização de nova avaliação via aplicação do SDEA, a
  averbação de seu nível de proficiência linguística será revogada.


  Revalidação da averbação de proficiência linguística

  O detentor da licença deverá se submeter a um novo SDEA considerando o prazo de validade
  de sua averbação, bem como os prazos de processamento e eventual recurso administrativo
  proposto pelo interessado. Não há hipótese de prorrogação da validade do nível de proficiência,
  independentemente do agendamento ou realização de novo exame.

  O resultado de qualquer novo SDEA prevalecerá sobre todos resultados obtidos anteriormente,
  ainda que estejam válidos em suas licenças no momento da realização do novo exame. O nível
  de proficiência linguística poderá sofrer elevação ou rebaixamento, bem como manter-se inalterado.


  Processo de Averbação de Proficiência Linguística com Base em Licença Estrangeira em Processo
  de Convalidação

  A ANAC poderá averbar o nível de proficiência linguística com base em licenças estrangeiras
  em processo de convalidação, de acordo com os requisitos estabelecidos na Seção 61.45 do
  RBAC nº 61.

  A averbação da proficiência linguística não será concedida quando dissociada do processo
  de convalidação da licença estrangeira. Adicionalmente, também não será concedida averbação
  de proficiência linguística com base em certificados de exame de proficiência linguística,
  tampouco com base em licenças de controladores de tráfego aéreo.

  Para cumprir o parágrafo 61.45(k)(4) do RBAC nº 61, o solicitante deverá comprovar que obteve
  pelo menos o nível 4 - Operacional, apresentando a licença estrangeira com a averbação do
  nível de proficiência linguística e da respectiva validade.

  Quando da análise da documentação apresentada, caso não seja possível determinar efetivamente
  o nível de proficiência linguística obtido pelo piloto (4, 5 ou 6) e a respectiva data de
  validade, a licença convalidada será emitida com a seguinte averbação: “English not compliant
  Annex 1”, devendo o requerente realizar o SDEA.

  Alternativamente, a Agência aceitará como comprovação licenças estrangeiras emitidas por
  autoridades que garantam, para emissão de suas licenças, que o requerente atende, no mínimo,
  ao nível 4 - Operacional de proficiência linguística na língua inglesa.

  Informações sobre tais autoridades serão atualizadas à medida que pedidos forem protocolados
  e podem ser encontradas no portal da Agência indicado na seção 5.1.2.

  Será concedida averbação do nível de proficiência linguística conforme o seguinte:

  para os casos de apresentação da licença estrangeira com a averbação do nível de proficiência
  linguística e da respectiva validade: averbação, na licença brasileira, do nível de proficiência
  linguística originalmente averbado na licença apresentada, cuja validade corresponderá à
  constante da licença estrangeira ou ao estabelecido na seção 5.1.4.5, o que for menor. Caso
  não haja informação sobre a validade do nível ICAO na licença estrangeira, será concedida
  validade conforme estabelecido na seção 5.1.4.5 a partir da data da convalidação da licença;
  ou

  para os casos que não se enquadrem no item anterior e estão associados a licenças emitidas
  por autoridades estrangeiras definidas e listadas conforme item 5.2.4 dessa IS: emissão
  de nível 4 de proficiência linguística, com vigência de 3 (três) anos a contar a partir
  da data da convalidação da licença.

  A averbação de proficiência linguística constará nas licenças convalidadas de acordo com
  a seção 5.1.4.5.

  As solicitações de convalidação de licença estrangeira deverão ser encaminhadas para a Gerência
  Técnica de Qualidade da Certificação de Pessoal da Superintendência de Pessoal da Aviação
  Civil (GTQC/SPL), por meio dos serviços on-line de emissão de licenças e habilitações disponíveis
  no portal da ANAC, conforme instruções dispostas no seguinte link: https://www.gov.br/anac/pt-br/assuntos/regulados/profissionais-da-aviacao-civil/habilitacao/validacao-de-licencas-habilitacoes-estrangeiras.


