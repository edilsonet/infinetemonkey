title: APÊNDICE B - TABELA DE EQUIVALÊNCIAS PARA CONCESSÃO DE
text: 'APÊNDICE B - TABELA DE EQUIVALÊNCIAS PARA CONCESSÃO DE

  HABILITAÇÕES A OFICIAIS AVIADORES DAS FORÇAS ARMADAS BRASILEIRAS.


  B.1

  As concessões de habilitações a Oficiais Aviadores das Forças Armadas Brasileiras

  prevista na seção 61.47 do RBAC nº 61 será realizada de acordo com as equivalências

  previstas na tabela deste Apêndice.


  B.2

  A tabela de equivalências indica, para cada aeronave militar operada no país, qual a

  correspondente habilitação civil concedida pela ANAC.


