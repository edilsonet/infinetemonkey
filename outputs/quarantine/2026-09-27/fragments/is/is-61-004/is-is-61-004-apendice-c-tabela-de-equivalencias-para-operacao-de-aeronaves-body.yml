title: APÊNDICE C - TABELA DE EQUIVALÊNCIAS PARA OPERAÇÃO DE AERONAVES
text: 'APÊNDICE C - TABELA DE EQUIVALÊNCIAS PARA OPERAÇÃO DE AERONAVES

  AERODESPORTIVAS PORTADORAS DE CAVE POR PILOTOS DETENTORES DE

  LICENÇA DE AVIÃO OU HELICÓPTERO.


  C.1

  A tabela deste Apêndice indica, para fins do previsto na seção 61.5 (e) do RBAC nº 61, que

  prevê que “o tipo de licenças e habilitações de piloto requeridas para operar uma aeronave
  é

  determinado pela ANAC”. A seção 61.2 (a)(7) do RBAC nº 61 prevê que o certificado de piloto

  aerodesportivo (CPA) tem “status inferior ao de uma licença” e, portanto, o detentor de
  uma licença

  possui as prerrogativas de um CPA, respeitadas as demais condições previstas neste Apêndice.


  C.2

  Pilotos que possuírem a habilitação válida indicada na coluna 2 da tabela abaixo, bem como

  um CMA de 1ª, 2ª ou 4ª classe válidos, podem operar as aeronaves aerodesportivas correspondentes

  da coluna 1, sem necessidade de qualquer formalidade adicional.


  C.3

  Não obstante o previsto acima, em todo caso é de responsabilidade do piloto se familiarizar

  com as regras de operação aplicáveis às aeronaves experimentais e com a aeronave aerodesportiva

  que irá pilotar. Deve ainda, sempre que praticável, receber instrução de outro piloto que
  já possua

  experiência naquele equipamento, podendo ser responsabilizado administrativa, civil e penalmente

  caso atue imprudentemente sem o devido preparo.


  (1) HABILITAÇÃO

  AERODESPORTIVA

  (2) HABILITAÇÃO DE AVIÃO OU HELICÓPTERO

  EQUIVALENTE

  GIRO

  Sem equivalência

  PARA

  Sem equivalência

  AAFT

  MNTE, MLTE ou habilitação de tipo avião

  AAFA

  MNAF ou MLAF

  AART

  Sem equivalência

  AARA

  Sem equivalência

  AAPT

  ULTK

  AAPA

  UTKA

  AAXX

  Sem equivalência

  ICPA

  INVA ou INVH


  Data de emissão: 1º de novembro de 2019

  IS nº 61-004

  Revisão P'
