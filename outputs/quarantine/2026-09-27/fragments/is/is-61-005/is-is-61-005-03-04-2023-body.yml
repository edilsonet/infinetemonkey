text: '03.04.2023


  OBJETIVO

  Estabelecer os procedimentos aceitáveis para a realização de treinamentos de solo e de voo
  para concessão e revalidação de habilitações de tipo.

  REVOGAÇÃO

  Fica revogada a IS Nº 61-005 Revisão C.

  FUNDAMENTOS

  3.1 A Resolução no 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou
  RBHA.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC ou RBHA, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado na alínea 3.2 (b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  DEFINIÇÕES

  Para os efeitos desta IS valem as definições constantes do RBAC nº 61 e do RBAC nº 01.

  APLICABILIDADE

  5.1 Essa Instrução Suplementar tem por objetivo estabelecer os parâmetros técnicos para
  desenvolvimento de programa de treinamento de aeronaves Tipo, tanto treinamento inicial
  quanto treinamento recorrente, incluindo o treinamento para a habilitação de piloto segundo
  em comando, para as quais não há Centro de Treinamento de Aviação Civil - CTAC certificado
  ou validado pela ANAC.

  5.1.1 Lista de CTACs certificados ou validados pela ANAC, tanto para provimento de treinamentos
  iniciais como para provimento de treinamentos recorrentes, pode ser obtida no Portal da
  ANAC, via link https://www.gov.br/anac/pt-br/assuntos/regulados/profissionais-da-aviacao-civil/perfis/pilotos/treinamento-de-tipo.

  DESENVOLVIMENTO DO PROGRAMA DE TREINAMENTO

  6.1 Treinamento inicial.

  6.1.1 Um piloto com licença de Piloto Comercial ou de Piloto de Linha Aérea, devidamente
  habilitado na aeronave a ser treinada, na função piloto em comando, pode ministrar treinamento
  inicial para outro piloto, doravante denominado piloto aluno, nas situações assim previstas
