text: '01.03.2023

  OBJETIVO

  Apresentar os procedimentos para o lançamento de endossos nos registros de voo de pilotos,
  nos casos requeridos pelo RBAC nº 61.

  REVOGAÇÃO

  2.1 Esta IS revoga a IS nº 61-006 Revisão L.

  FUNDAMENTOS

  3.1 A Resolução no 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou
  RBHA.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC ou RBHA, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.

  DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições previstas nos RBAC nº 01 e 61 e
  as seguintes definições:


  Caderneta Individual de Voo Digital (CIV Digital): documento legal em meio eletrônico, disponibilizado
  pela ANAC por meio do SACI e disciplinado pela IS 61-001, para verificação da experiência,
  comprovação e certificação de horas de voo e endossos do piloto aerodesportivo, piloto privado,
  piloto comercial, piloto de linha aérea, piloto de planador ou piloto de balão livre operando
  aeronaves.

  Piloto endossante ou endossador: piloto que ministra a instrução requerida, preenche o endosso
  na CIV digital do piloto endossado e registra o endosso em sua própria CIV Digital.

  Piloto endossado: piloto que recebe a instrução requerida, tem preenchido o endosso em sua
  CIV digital pelo piloto endossante e tem registrado o endosso por meio da CIV Digital do
  piloto endossante.

  Sistema Integrado de Informações da Aviação Civil (SACI): plataforma online pertencente
  à ANAC, acessível por qualquer dispositivo conectado à Internet por meio do endereço https://sistemas.anac.gov.br/saci/,
  que contém os registros pessoais (nome, documentos pessoais, foto, assinatura, CIV Digital,
  licenças, habilitações e endossos) do detentor de um código ANAC (CANAC) e cujo acesso é
  disciplinado pela IS 00-008.

  DESENVOLVIMENTO DO ASSUNTO

  5.1 Disposições gerais

  5.1.1 Além dos requisitos de licença, habilitação e experiência recente, o RBAC nº 61 estabelece
  que para a realização de alguns exames de proficiência, bem como para determinadas operações,
  o piloto deve previamente obter um endosso em seus registros de voo.

  5.1.2 Por meio de registro na CIV Digital, um piloto capacitado (endossante) declara formalmente,
  para todos os fins legais, que outro piloto (endossado) foi instruído e avaliado por ele
  e possui todas as condições de atuar em determinada função a bordo.

  5.1.3 Essa atribuição deve ser entendida como um importante complemento ao processo de concessão
  de licenças, habilitações e certificados pela ANAC, e como tal deve ser exercida com responsabilidade,
  profissionalismo e foco integral na segurança operacional.

  5.2 Validade dos endossos

  5.2.1 Salvo expressamente declarado de maneira diversa nesta IS ou no RBAC nº 61, os endossos
  não possuem prazo de validade, e seu lançamento na CIV Digital é requerido apenas uma vez.

  5.3 Regras de transição

  5.3.1 Nos casos em que um novo endosso passou a ser requerido pela Emenda 06 ao RBAC nº
  61, mas não era exigido pelo texto da Emenda 05 daquele regulamento, esta Instrução Suplementar
  estabelecerá regras de transição a fim de preservar o direito adquirido dos pilotos que
  já operavam regularmente sob as regras anteriores.

  5.3.2 As regras de transição serão detalhadas caso a caso para cada endosso previsto no
  corpo da presente IS. Os endossos que não possuírem esse detalhamento não possuem regra
  de transição, e são considerados requeridos já na data da publicação desta IS.

  5.4 Endossos

  5.4.1 Este capítulo tem por objetivo detalhar cada um dos endossos previstos no RBAC nº
  61, indicando-se ainda quais os requisitos daquele regulamento que se consideram cumpridos
  por meio do referido endosso.'
