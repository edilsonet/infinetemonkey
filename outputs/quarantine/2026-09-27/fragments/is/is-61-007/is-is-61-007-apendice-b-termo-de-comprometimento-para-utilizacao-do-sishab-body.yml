text: 'APÊNDICE B - TERMO DE COMPROMETIMENTO PARA UTILIZAÇÃO DO SISHAB

  LOGOTIPO

  DA EMPRESA

  TERMO DE COMPROMETIMENTO - SISHAB

  NOME DA EMPRESA

  Número do COA Número do CNPJ da Empresa

  Nome do responsável pelo presente Termo Cargo do responsável pelo presente Termo

  Endereço Número

  Bairro Município UF

  Número do CPF CANAC (se aplicável)

  E-mail

  Venho pelo presente instrumento me comprometer a incluir no Sistema de Habilitações (SISHAB)

  todas as informações relativas a treinamentos realizados pela minha empresa, para garantir
  a

  adequada execução do PrTrnOp aprovado.

  Declaro que todas as informações transmitidas por meio do SISHAB serão verídicas e de minha

  inteira responsabilidade. As datas e locais de realização dos treinamentos seguirão estritamente
  o

  informado nas NRT, que atenderá a todas as condições aprovadas no PrTrnOp.

  Declaro que todos os originais dos documentos, digitalizados ou não, que compuserem o processo

  de certificação de pessoal serão guardados de acordo com o estabelecido no PrTrnOp aprovado
  e

  no RBAC nº 121 ou RBAC nº 135, conforme aplicável. Comprometo-me a disponibilizar o original

  caso seja requisitado pela ANAC ou outro órgão público competente.

  Estou ciente que qualquer irregularidade no treinamento verificada em inspeção, ou falta
  de guarda

  do documento original, tornará automaticamente sem efeito os atos administrativos decorrentes
  do

  treinamento, e demandará abertura de processo administrativo para apuração de responsabilidade,

  sem prejuízo a possíveis sanções cíveis e penais.

  Local e data: _____________________, _______ de _________________ de ______.

  _____________________________________________

  ASSINATURAData de emissão: 27 de julho de 2018 IS nº 61-007

  Revisão A'
