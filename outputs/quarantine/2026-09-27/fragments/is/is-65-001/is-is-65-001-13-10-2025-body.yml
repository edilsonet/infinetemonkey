text: '13.10.2025

  OBJETIVO

  Descrever os procedimentos e critérios para concessão de licença e de habilitação e para
  recadastramento de mecânicos de manutenção aeronáutica (MMA), esclarecendo, detalhando e
  orientando o cumprimento dos requisitos do RBAC nº 65 referentes a MMA, em particular a
  Subparte D.


  REVOGAÇÃO

  Esta IS substitui a IS nº 65-001 Revisão E.


  FUNDAMENTOS

  A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  adotar os meios e procedimentos previamente especificados em IS; ou

  apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da Anac.

  O meio ou procedimento alternativo mencionado no parágrafo 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.

  Esta IS é fundamentada e objetiva oferecer método de cumprimento aos requisitos da Subparte
  D do RBAC nº 65.


  DEFINIÇÕES

  Para os efeitos desta IS, são válidas as definições listadas nas:

  seção 01.1 do RBAC nº 01; e

  seção 65.2 do RBAC nº 65.


  DESENVOLVIMENTO DO ASSUNTO

  Procedimento para Obtenção da Licença de Mecânico de Manutenção Aeronáutica

  Introdução

  De acordo com a subparte D do RBAC nº 65, o processo para obtenção da licença de mecânico
  de manutenção aeronáutica (MMA) inclui várias fases:

  Fase 1 - Curso de Formação em Centro de Instrução de Aviação Civil (Ciac)

  Fase 2 - Aprovação no Exame Teórico Básico e da Habilitação Desejada

  Fase 3 - Acúmulo de Experiência Prática

  Fase 4 - Solicitação do Exame Prático

  Fase 5 - Execução do Exame Prático

  Fase 6 - Solicitação da Licença/Habilitação

  Tais fases não são necessariamente sequenciais no tempo e podem acontecer em diferentes
  momentos conforme Figura 1. Os intervalos destacados para os exames são todos os momentos
  nos quais eles podem ser realizados.


  Figura 1: Distribuição do cumprimento dos requisitos para licença de MMA ao longo do tempo.


  Além disso, no momento da solicitação da licença de MMA (abertura do processo no Sistema
  Integrado de Aviação Civil, Sintac) o candidato deve:

  ter completado 18 (dezoito) anos;

  ter concluído o ensino médio ou equivalente.


  Fase 1 - Curso de Formação em Centro de Instrução de Aviação Civil (Ciac)

  O candidato a uma licença de MMA deve cursar e ser aprovado em um curso oferecido por um
  Ciac referente a habilitação desejada dentre as três previstas na seção 65.73 do RBAC nº
  65 regulamento: célula (CEL), grupo motopropulsor (GMP) ou aviônicos (AVI).

  Conforme IS nº 141-007, o curso é dividido em um módulo básico e módulos especializados
  para cada habilitação.

  O parágrafo (c) da seção 65.71 do RBAC nº 65 permite que graduados em engenharia de diferentes
  especialidades tomem crédito de tal formação e sejam isentos de realizar o curso em Ciac.
  A subseção 5.2 da presente IS aborda este caso específico.

  Caso deseje obter outra habilitação após habilitado, o interessado deve fazer apenas o módulo
  especializado referente a tal habilitação.


  Fase 2 - Aprovação no Exame Teórico da Habilitação Desejada

  Assim como o curso teórico em Ciac, o exame teórico para uma licença de MMA é composto de
  uma prova relativa ao módulo básico e outras específicas para a habilitação desejada.

  Poderá ser realizado um exame relativo a apenas uma habilitação pretendida, por vez.

  O candidato pode fazer o exame teórico completo de uma só vez ou optar por fazer um exame
  apenas com a prova do módulo básico, separada das outras provas especializadas.

  O exame consistindo apenas da prova do módulo básico pode ser realizado, a qualquer tempo,
  a partir da matrícula no curso de MMA em Ciac.

  O exame completo ou apenas das provas das matérias especializadas só pode ser realizado
  após a conclusão, com aproveitamento, do curso em Ciac.

  Mais informações acerca do exame teórico encontram-se na IS nº 00-003.


  Fase 3 - Acúmulo de Experiência Prática

  Conforme seção 65.77 do RBAC nº 65, o candidato deve acumular experiência profissional em
  empresa aérea certificada segundo o RBAC nº 121 ou RBAC nº 135, ou organização de manutenção
  certificada segundo o RBAC nº 145.

  A experiência prática obtida deve ser condizente com as capacidades de manutenção do operador
  aéreo ou da organização de manutenção aeronáutica, conforme o caso. Entretanto, em todos
  os casos é necessário que o candidato demonstre experiência em uma parte significativa das
  atividades relativas à habilitação desejada.

  O responsável técnico (ou diretor/gerente de manutenção) da organização em que o candidato
  está acumulando experiência deverá declarar as habilitações relacionadas às atividades desenvolvidas
  durante o tempo de experiência. Para tanto, deve-se utilizar da declaração de experiência
  profissional prevista na seção 65.90 e o modelo apresentado no portal de MMA da Agência.
  Conforme a mesma seção, é necessária também a inclusão de documentação que comprove o vínculo
  entre a organização e o candidato a uma licença e/ou habilitação de MMA durante o período
  abrangido pela declaração.

  É permitida a contagem da experiência prática para a concessão da licença e primeira habilitação
  a partir da matrícula no curso de mecânico de manutenção aeronáutica.

  Para a concessão da licença e primeira habilitação, o candidato deve comprovar, no mínimo,
  a experiência de 18 (dezoito) meses na habilitação pretendida, conforme o parágrafo 6577(a)(1)
  do RBAC nº 65.

  No caso de outras habilitações, a experiência prática começa a ser contabilizada a partir
  da matrícula no curso da segunda habilitação desde que o profissional esteja atuando em
  organização de manutenção aprovada. A Figura 2 ilustra este caso típico.


  Figura 2: Acúmulo de experiência para duas habilitações.


  É permitido, ainda, acumular experiência para mais de uma habilitação ao mesmo tempo, conforme
  detalhado abaixo:

  para cada habilitação deve haver uma experiência prática de 18 (dezoito) meses no mínimo;
  e

  a experiência para a segunda habilitação começa a ser contada apenas do início do curso
  teórico dessa segunda habilitação.

  Para obter mais do que uma habilitação é necessário comprovar a experiência prática de,
  no mínimo, 30 (trinta) meses. A Figura 3 ilustra tal situação. Observe que há uma sobreposição
  em que a experiência acumulada conta para duas habilitações, mas tal período é restrito
  a seis meses antes do término da experiência mínima necessária para a concessão da primeira
  habilitação, devido ao cumprimento do requisito mínimo de 30 (trinta) meses. Reforça-se
  que esse acúmulo em mais de uma habilitação simultaneamente necessita de comprovação de
  que o interessado estava realmente atuando em tarefas relativas a mais de uma habilitação.


  Figura 3: Acúmulo de experiência para duas habilitações com experiência acumulada em mais
  de uma habilitação.


  A mesma lógica se aplica a terceira habilitação. Nesse caso um período de contagem de experiência
  para múltiplas habilitações pode ser estendido uma vez que o requisito de 30 (trinta) meses
  é independente de duas ou três habilitações. Ou seja, é possível obter a primeira habilitação
  com 18 (dezoito) meses do início do primeiro curso e as duas outras após 30 (trinta) meses
  do mesmo marco temporal, desde que para cada uma das outras duas habilitação tenham sido
  acumulados 18 (dezoito) meses de experiência para cada após início de seu respectivo curso.


  Fase 4 - Solicitação do Exame Prático

  O candidato poderá solicitar o exame prático (exame de proficiência) após:

  ser aprovado nos exames teóricos (básico e especializado); e

  concluir a experiência prática exigida.

  O exame prático pode ser realizado por um dos seguintes tipos de examinadores:

  Examinador credenciado da empresa onde o candidato trabalha;

  Examinador credenciado de outra empresa, autorizado a realizar exames de terceiros; ou

  Examinador da Anac.

  Caso opte por um examinador credenciado, o candidato deverá entrar em contato diretamente
  com o profissional de sua escolha para discutir o agendamento. A lista de examinadores autorizados
  a realizar exames de terceiros está disponível no portal MMA da Agência.

  Nota 1: Conforme a IS 183-003, a Anac não indica examinadores nem regula os valores cobrados
  pelos profissionais ou pelas organizações onde o exame será realizado.

  Nota 2: A organização em que o exame será realizado tem liberdade para estabelecer exigências
  adicionais ao candidato, conforme considerar apropriado.

  Nota 3: Recomenda-se que o exame seja realizado em uma organização que utilize equipamentos
  similares aos da empresa onde o candidato adquiriu sua experiência prática.

  Após o agendamento, o candidato deverá assinar o Termo de Ciência para Realização do Exame,
  conforme modelo disponibilizado pela Anac, e entregá-lo ao examinador, que será responsável
  por notificar a Agência sobre o exame, conforme previsto na IS 183-003.

  Caso o candidato opte por realizar o exame com um examinador da Anac, deverá abrir um novo
  processo no protocolo eletrônico da Agência (Sistema SEI), do tipo:

  "Pessoal da Aviação Civil: Exame Prático de MMA - Solicitação de Examinador ANAC".


  Fase 5 - Execução do Exame Prático

  O exame prático (exame de proficiência) deverá seguir, em princípio, todos os itens aplicáveis
  da Ficha de Avaliação de Mecânico de Manutenção Aeronáutica (Famma), conforme modelo disponível
  no portal MMA da Agência.

  Os itens da Famma estão divididos em:

  Gerais - aplicáveis a todos os exames;

  Motopropulsor, Célula e Aviônico - aplicáveis conforme a habilitação pretendida.

  Dependendo da atividade prática desempenhada pelo candidato na empresa (por exemplo, em
  organizações de manutenção aeronáutica que realizam apenas tarefas específicas), alguns
  itens da Famma podem não ser aplicáveis. Nesses casos, o candidato deverá ser avaliado nas
  tarefas compatíveis com sua experiência, desde que estejam dentro do escopo de sua futura
  atuação como MMA.

  O examinador deve buscar uma abordagem ampla na avaliação dos itens da Famma, com o objetivo
  de verificar a capacidade do candidato em seguir corretamente o fluxo de execução das tarefas
  de manutenção aeronáutica. Isso pode ser feito explorando, por exemplo, os tópicos do item
  GERAL, que orientam boas práticas de manutenção, como:

  uso adequado de ferramentas de precisão;

  manuseio correto e interpretação de manuais técnicos.

  Também devem ser realizados questionamentos sobre conhecimentos aeronáuticos e específicos
  da área de habilitação pretendida.

  Sempre que forem avaliadas tarefas que não estejam diretamente relacionadas aos itens da
  Famma, mas que sejam consideradas aceitáveis para o exame, ou quando poucos itens da Famma
  forem utilizados, o campo “Comentários” deve ser preenchido, explicando o contexto da avaliação.

  Após a realização do exame, o candidato deverá assinar a Famma juntamente com o examinador.
  O examinador fica com a original, mas o candidato pode solicitar uma cópia.

  O examinador deve protocolar a Famma como peticionamento intercorrente no mesmo processo
  SEI utilizado para a notificação ou solicitação do exame prático. Também deverá informar
  ao candidato o número do processo SEI correspondente.

  Caso o candidato não seja aprovado no exame, conforme o parágrafo 65.17(d)(1) do RBAC nº
  65, deverá realizar treinamento corretivo com um MMA habilitado na especialidade desejada,
  abordando as deficiências que causaram a reprovação. Após a conclusão do treinamento, o
  interessado deverá, no mínimo 15 (quinze) dias após a data do exame anterior, conforme a
  seção 61.19(a)(2), protocolar uma declaração de realização do treinamento e solicitar um
  novo exame, também como peticionamento intercorrente no mesmo processo SEI do exame anterior.


  Fase 6 - Solicitação da Licença/Habilitação

  Após a conclusão do exame prático - último requisito para obtenção da licença e habilitação
  - o interessado deverá protocolar seu pedido de concessão por meio do sistema Sintac.

  As instruções detalhadas para realizar esse protocolo estão disponíveis no portal MMA da
  Agência.

  O interessado deverá incluir os comprovantes de todos os requisitos exigidos para a licença
  e habilitações desejadas.

  A Anac revisará toda a documentação apresentada antes de autorizar a emissão da licença
  e/ou habilitação.

  Uma vez verificados e conferidos todos os requisitos, a licença e/ou habilitação será concedida
  ao interessado.


  Dispensa de Curso de Formação para Candidatos Formados em Engenharia

  Conforme o parágrafo (c) da seção 65.71 do RBAC nº 65, podem pedir isenção do curso de formação
  de mecânico de manutenção aeronáutica correspondente à habilitação pertinente os graduados
  em:

  engenharia aeronáutica;

  engenharia elétrica ou eletrônica;

  engenharia mecânica ou mecânica aeronáutica; e

  como outros engenheiros que tenham registrado nos seus assentamentos junto ao Conselho Regional
  de Engenharia e Agronomia (CREA) a atribuição para exercer a atividade relacionada com a
  manutenção de aeronaves.

  A solicitação de tal isenção é realizada por meio de abertura de processo no protocolo eletrônico
  da Agência, sistema SEI, do tipo: "Pessoal da Aviação Civil: Isenção de curso de MMA para
  graduados em engenharia - RBAC 65". De acordo com a seção 65.71, podem ser exigidos os seguintes
  documentos, conforme aplicável:

  currículo completos;

  declaração de experiência de forma aceitável pela Anac;

  comprovante de escolaridade; e

  certificados de cursos de familiarização em produto aeronáutico, conforme aplicável, para
  análise e parecer da Anac.

  Mais documentos são necessários quanto mais distante a formação original do interessado
  é dos conhecimentos técnicos da habilitação desejada. O portal de MMA da Agência apresenta
  os precedentes já avaliados e aceitos pela agência.

  A experiência prática para tais candidatos pode ser contabilizada a partir do início do
  curso superior.


  Manutenção da Habilitação, Recadastramento e Experiência Recente

  Conforme seção 65.72 do RBAC nº 65, a licença de MMA é permanente e a validade de suas habilitações
  é indefinida.

  Porém, o exercício das prerrogativas da licença é condicionado à duas exigências:

  recadastramento a cada 3 (três) anos; e

  manutenção da experiência recente.

  A verificação do cumprimento de ambos estes requisitos é responsabilidade primária do MMA
  - assim como é responsabilidade da instituição que designa o MMA para determinada atividade,
  independentemente da validade do recadastramento.

  O recadastramento é realizado através do sistema Sintac conforme instruções disponíveis
  no portal de MMA da Agência.

  No processo de recadastramento, não é necessário comprovar manutenção da experiência recente.
  O recadastramento possui caráter censitário, com o objetivo de informar à Anac sobre as
  pessoas já licenciadas que se encontram em atividade ou que, mesmo fora de atividade, se
  encontram à disposição para exercer suas atividades.

  De acordo com a seção 65.83 do RBAC nº 65, a experiência recente é mantida se no período
  dos últimos 24 (vinte e quatro) meses o MMA tiver, por pelo menos 6 (seis) meses:

  trabalhado na habilitação relacionada com a sua licença;

  supervisionado tecnicamente outros mecânicos de manutenção aeronáutica;

  supervisionado gerencialmente a manutenção ou alteração de uma aeronave;

  atuado no treinamento técnico de pessoal em serviços relacionados a sua habilitação; ou

  exercido qualquer combinação dos itens acima.

  Caso não atenda a tal requisito, o MMA poderá exercer as prerrogativas de sua Licença desde
  que tenha sido aprovado há menos de 24 (vinte e quatro) meses em exame prático pela Anac
  ou por Examinador de MMA, nos termos da mesma seção 65.83.

  Desta forma, o MMA poderá solicitar à Agência um exame prático para reestabelecimento de
  experiência recente. O MMA pode escolher realizar com um servidor da Agência ou examinador
  credenciado. O procedimento é o mesmo apresentado na seção 5.1.5.


  Concessão de Licença e de Habilitações para Mecânicos das Forças Armadas

  Conforme disposto na seção 65.84 do RBAC nº 65, para requerentes mecânicos das forças armadas,
  nos processos de concessão de licença de MMA e das habilitações de célula, grupo motopropulsor
  e aviônicos, a Anac pode reconhecer os cursos de formação técnica ministrados por instituições
  militares e a experiência prática em unidades aéreas militares como equivalentes ao cumprimento
  dos seguintes requisitos:

  aprovação em curso de formação de mecânico de manutenção aeronáutica requerido para a habilitação
  solicitada em escola de aviação civil certificada segundo o RBAC nº 141, conforme o parágrafo
  65.71(a)(4) do RBAC nº 65;

  aprovação em exame teórico para a habilitação solicitada, conforme a seção 65.75 do RBAC
  nº 65 (65.71(a)(5));

  cumprimento da experiência prática requerida para a habilitação solicitada, conforme o parágrafo
  65.77(a) do RBAC nº 65 (65.71(a)(6)); e

  aprovação em exame prático para a habilitação solicitada, conforme a seção 65.79 do RBAC
  nº 65 (65.71(a)(7)).

  Os curso de formação militares já considerados aceitos são listados no portal de MMA da
  Agência.

  No caso de requerentes que tenham realizado cursos equivalentes aos listados, ministrados
  pelas mesmas instituições, e que deixaram de ser oferecidos, a Anac pode analisar caso a
  caso a correspondência com base no conteúdo do curso.

  Não serão aceitos os cursos de adaptação, de complementação e os cursos especiais, oferecidos
  pelas forças militares, em substituição aos aqui declarados.

  A aceitação de formação nestes cursos como equivalente à realização no exame prático está
  condicionada a comprovação dos requisitos de experiência recente do parágrafo 65.83(a) do
  RBAC nº 65.

  Pode ser considerado, para avaliação do cumprimento do requisito de experiência recente,
  o trabalho na própria unidade militar.

  No caso de não atendimento do requisito de experiência recente, o candidato deverá ser submetido
  a um exame prático.

  A experiência prática conforme o parágrafo 65.77(a) do RBAC nº 65 (65.71(a)(6)) pode ser
  demonstrada através de declaração conforme modelo disponível no portal de MMA da Agência
  e assinada pelo chefe de manutenção de cada organização militar em que o requerente trabalha
  ou trabalhou.


