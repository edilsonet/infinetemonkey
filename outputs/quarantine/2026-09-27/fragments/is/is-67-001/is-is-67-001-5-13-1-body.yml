title: 'no anverso:'
text: '5.13.1 no anverso:

  a) nome de quem confere o certificado;

  b) nome completo e CPF do aluno;

  c) duração total do curso (carga horária);

  d) período da realização do curso (dia/mês/ano) e local (se aplicável); e

  e) assinatura de quem confere o certificado e do coordenador técnico do curso.'
