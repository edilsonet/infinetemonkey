text: '5.13.2 no verso:

  a) ementa do curso com carga horária de cada disciplina; e

  b) aproveitamento obtido pelo aluno: nota final e frequência.

  5.14 Os itens 5.2 a 5.13 devem ser aprovados pela ANAC antes da colocação em prática dos

  parâmetros neles estabelecidos.

  5.15 Os alunos, para serem considerados aprovados, devem obter aproveitamento

  satisfatório, incluindo frequência mínima de 90% das aulas presenciais previstas,

  comprovada através de listas de presença. Os cursos ou aulas previstos em modalidade

  de EaD prescindem desse controle, estando sujeitos às avaliações parciais previstas no

  parágrafo 5.11.

  5.16 Uma lista de alunos aprovados, contendo nome completo e CPF, deve ser enviada à

  ANAC após a conclusão do curso. Deve ser enviada também a lista de presença, caso

  solicitada, para verificação do resultado obtido.

  5.17 A documentação referente ao plano de curso deve ser recebida na ANAC com

  antecedência mínima de 45 dias em relação ao início do curso.

  5.18 O conteúdo a ser abordado no CBPM deve abranger os requisitos constantes no RBAC

  67 e IS a ele relacionadas.

  6. CONTEÚDO DO CURSO

  6.1 Este item objetiva expor as informações principais a serem abordadas em um CBPM.

  Os tópicos podem seguir ou não a sequência aqui apresentada. É desejável que os

  médicos criem seus estudos de caso para ilustrar os subitens 6.2.5 a 6.2.13 com base na

  própria experiência ou experiência compartilhada, e em situações hipotéticas que

  possam ocorrer.17/02/2012 IS nº 67-001

  Revisão A

