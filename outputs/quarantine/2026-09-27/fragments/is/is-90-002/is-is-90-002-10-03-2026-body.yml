text: '10.03.2026

  OBJETIVO

  1.1 Apresentar uma metodologia que propicie a elaboração de programa de treinamento operacional
  (PTO) aceitável pela Anac, que assegure treinamento adequado ao desempenho das atribuições
  de cada tripulante e instrutor de voo em atividade nas Unidades Aéreas Públicas (UAP) que
  conduzam operações segundo o RBAC nº 90, em consonância ao requerido nas subpartes C, L,
  M, P, Q e S do RBAC nº 90.

  1.2 Apresentar os procedimentos requeridos no processo de aprovação e revisão do PTO, desde
  sua submissão à análise da Anac até a emissão de aprovação inicial e final.


  REVOGAÇÃO

  2.1 Esta IS revoga a IS nº 90-002, Revisão A.


  FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da Anac.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.

  3.5 Esta IS é fundamentada e objetiva oferecer método de cumprimento às subpartes C, L,
  M, P, Q e S do RBAC nº 90.


  DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas na seção 90.3 do RBAC nº
  90, no RBAC nº 01 e as seguintes definições:

  4.1.1 carga horária: tempo necessário para se ministrar um segmento de currículo ou módulo
  de treinamento. Uma hora de treinamento pode incluir intervalos de até 10 minutos, mas não
  inclui intervalos para refeições, por exemplo;'
