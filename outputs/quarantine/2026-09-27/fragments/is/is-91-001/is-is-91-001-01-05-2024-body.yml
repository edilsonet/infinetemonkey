text: '01.05.2024

  1. OBJETIVO

  1.1 A presente Instrução Suplementar fornece material de orientação para a aprovação operacional
  de navegação baseada em desempenho.

  1.2 Esta IS se aplica a qualquer operador regido pelo RBAC nº 121, RBAC nº 135 ou RBAC nº
  91 (incluindo Subparte K), que tenha ou solicite autorização para condução de operações
  PBN.

  2. REVOGAÇÃO

  2.1 Esta IS revoga a IS nº 91-001 Revisão H.

  3. FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado no item 3.2b) desta IS deve garantir nível
  de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar o
  objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 Esta IS é fundamentada e objetiva oferecer método de cumprimento às seções 91.1703 e
  91.1705 do RBAC nº 91; 121.349 do RBAC nº 121; e 135.165 do RBAC nº 135.

  4. DEFINIÇÕES

  4.1 A presente IS utiliza termos e abreviaturas na língua inglesa por entender que os mesmos
  já são amplamente utilizados pela indústria e pelos operadores.

  4.2 No escopo da presente Instrução Suplementar, são válidas todas as definições contidas
  no RBAC nº 01, no RBAC nº 91, no RBAC nº 121 e no RBAC nº 135, e as seguintes definições:'
