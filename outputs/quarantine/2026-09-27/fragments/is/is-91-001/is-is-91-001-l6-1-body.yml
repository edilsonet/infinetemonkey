title: Geral
text: 'L6.1 Geral

  a) Antes de solicitar autorização para operações RNP AR DP, o operador deve garantir que
  a operação proposta é consistente com as recomendações e orientações do fabricante para
  operações RNP AR DP.

  b) O operador deve verificar a CDL e a MEL da aeronave para identificar equipamentos e partes
  requeridas para operações RNP AR DP, em razão das funcionalidades adicionais requeridas
  em relação a operações RNP AR APCH. O operador deve buscar orientação com o detentor de
  TC ou STC de forma a determinar se alguma alteração em CDL ou MEL é requerida para conduzir
  operações RNP AR DP.

  c) O operador deve incluir no AOM procedimentos para operações normais e não-normais (contingências)
  relacionadas à operação RNP AR DP. Esses procedimentos devem cumprir com recomendações do
  fabricante das aeronaves e dos aviônicos.'
