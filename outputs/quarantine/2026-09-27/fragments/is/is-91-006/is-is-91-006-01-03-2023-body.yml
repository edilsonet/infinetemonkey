text: '01.03.2023


  OBJETIVO

  Apresentar os procedimentos e critérios para a obtenção de aprovação NAT - HLA por detentores
  de certificado de operador aéreo (COA) emitido segundo o RBAC nº 119, bem como por operadores
  não detentores de COA que operam sob o RBAC nº 91.

  REVOGAÇÃO

  Esta Instrução Suplementar substitui a IS nº 91-006A.

  FUNDAMENTOS

  3.1 A Resolução no 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou
  RBHA.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC ou RBHA, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 Esta IS é fundamentada e objetiva oferecer método de cumprimento para a seção 91.1707
  do RBAC nº 91.

  DEFINIÇÕES

  4.1 A presente IS utiliza termos e abreviaturas na língua inglesa por entender que eles
  já são amplamente utilizados pela indústria e pelos operadores.

  4.2 No escopo da presente Instrução Suplementar, são válidas as definições previstas nos
  RBAC nº 01, 91, 121 e 135 e as seguintes definições:

  ADS-C: Automatic Dependent Surveillance-Contract

  ATA: Actual time of arrival

  ATC: Air Traffic Control

  COA: Certificado de Operador Aéreo

  CPDLC: Controller-Pilot Data Link Communications

  EO: Especificações Operativas

  ETA: Estimated time of arrival

  FANS 1/A: Future Air Navigation System

  GNSS: Global Navigation Satellite System

  GPS: Global Positioning System

  INS: Inertial Navigation System

  IRS: Inertial Reference System

  LOA: Letter of Authorization

  LRNS: Long Range Navigation Systems

  MGO: Manual Geral de Operações

  NANU: Notice Advisory to Navstar Users

  NAT-HLA: North Atlantic High Level Airspace

  NAT-MNPS: North Atlantic - Minimum Navigation Performance Specification

  NIST: National Institute of Standards and Technology

  NRC: National Research Council

  OTS: Organised Track System

  PTO: Programa de Treinamento Operacional

  Rota RLatSM: Rotas com separação lateral mínima reduzida (Reduced Lateral Separation Minima)

  RAIM/FDE: Receiver Autonomous Integrity Monitoring/Fault Detection and Exclusion

  DESENVOLVIMENTO DO ASSUNTO

  Introdução

  O parágrafo 91.705(a) do RBHA 91 determinava que os operadores interessados em voar no espaço
  aéreo sobre o Atlântico Norte (denominado NAT-MNPS naquele Regulamento) deveriam obter autorização
  prévia da ANAC para tal fim.

  No entanto, o conceito de MNPS - Minimum Navigation Performance Specification foi superado
  pelo conceito mais abrangente de PBN - Perfomance Based Navigation, que encontra-se detalhado
  no Doc 9613 - PBN Manual da ICAO e, no Brasil, pela IS nº 91-001.

  Em decorrência dessa nova realidade, o espaço aéreo até então designado NAT - MNPS passou
  a ser formalmente denominado NAT - HLA (North Atlantic High Level Airspace), a partir de
  4 de fevereiro de 2016.

  Autorizações concedidas pelos Estados a seus operadores em data anterior a 4 de fevereiro
  de 2016 e, portanto, ainda sob a designação NAT-MNPS, seriam aceitas até 31 de dezembro
  de 2019. Após esta data, todos os operadores que transitarem no espaço aéreo NAT HLA deveriam
  possuir uma autorização já adequada à nova designação.

  Com a publicação do RBAC nº 91, a partir da emenda 00 foi criada a seção 91.1707 que trata
  de Operações definidas por NAT-HLA cujo cumprimento das condições necessárias para a autorização
  estão descritos nesta IS.

  Atualmente, em nível internacional, as informações relevantes à operação no espaço aéreo
  NAT HLA encontram-se dispersas em Anexos da ICAO, no PANS/ATM (Doc. 4444), nos Regional
  Suplementary Procedures (Doc. 7030), além de AIPs e NOTAMs emitidos pelos estados responsáveis
  pelas áreas de controle do Atlântico Norte. Para consolidação didática dessas informações,
  foi publicado o ICAO NAT Doc 007 - North Atlantic Operations and Airspace Manual, utilizado
  como fonte primária na elaboração desta IS e cujo conhecimento é indispensável pelos operadores
  que pretenderem operar naquele espaço aéreo.

  Limites do espaço aéreo NAT HLA

  Lateralmente, o espaço aéreo NAT HLA consiste nas seguintes áreas de controle (CTA): REYKJAVIK,
  SHANWICK (exceto as áreas denominadas Shannon Oceanic Transition Area - SOTA e Brest Oceanic
  Transition Area - BOTA), GANDER, SANTA MARIA OCEANIC, BODO OCEANIC e a porção ao norte da
  latitude 27o N da CTA NEW YORK OCEANIC EAST, conforme indicado pela imagem ilustrativa abaixo:


  Verticalmente, o espaço aéreo NAT HLA situa-se entre os FL285 e 420, inclusive.

