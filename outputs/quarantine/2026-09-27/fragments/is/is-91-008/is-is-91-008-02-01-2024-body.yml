text: '02.01.2024


  OBJETIVO

  1.1. Esta IS tem por finalidade padronizar procedimentos para eventos aéreos envolvendo
  pilotos e aeronaves civis para um público específico, de forma que essas atividades sejam
  executadas com a máxima segurança, tanto para os pilotos quanto para o público, conforme
  previsto na seção 91.303 do RBAC nº 91.

  1.2. Esta IS aplica-se a eventos aéreos que envolvam aeronaves de asa fixa e/ou rotativa,
  excetuando-se os eventos aéreos que envolvam somente balões livres tripulados, dirigíveis,
  aeronaves ultraleves regidas pelo RBAC nº 103, salto de paraquedas regido pelo RBAC nº 105
  e campeonatos de planadores.

  1.3. Esta IS não se aplica a acrobacias e demonstrações aéreas conduzidas exclusivamente
  por uma ou mais Forças Armadas do Brasil, quando não houver a participação de pilotos ou
  aeronaves civis.

  REVOGAÇÃO

  2.1 Esta IS revoga a IS 91-008, Revisão B.

  FUNDAMENTOS

  3.1. A Resolução nº 30, de 21 de maio de 2008, institui, em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2. O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de
  requisito previsto em RBAC, pode:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3. O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4. A IS não pode criar requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.

  DEFINIÇÕES

  4.1. Para os efeitos desta IS, são válidas as definições listadas nos RBAC nº 01 e RBAC
  nº 91, e as seguintes definições:

  4.1.1 Acrobacia aérea: qualquer manobra aérea intencional envolvendo mudanças bruscas na
  atitude da aeronave e/ou acelerações ou atitudes não necessárias ao voo normal;

  4.1.2 Aeronave ultraleve: aeronaves não detentoras de certificado de aeronavegabilidade
  com propósito exclusivo de desporto e recreação, que possuam as características previstas
  na seção 103.1 do RBAC nº 103;

  4.1.3 Altura mínima ou Low line: limite vertical inferior do box de demonstração, definida
  pelo Diretor de Operações do evento, de modo a garantir uma altura mínima de segurança do
  solo ou água;'
