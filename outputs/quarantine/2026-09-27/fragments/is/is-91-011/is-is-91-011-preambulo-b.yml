text: '(b) To calculate the descent point beyond the FAF, first determine the desired altitude

  to lose: (FAF (2,000 ft) - (Airport Elevation (81 ft) + TCH (46 ft))) = 1,873 ft. Take the
  desired

  altitude to lose (1,873 ft) and divide by the descent gradient (316 ft/NM) that equates
  to the

  2.98º VDA. This produces a distance of 5.9 NM from the runway threshold or 2.0 DME from
  the

  SZW VORTAC. The descent rate remains at 632 fpm at 120 kts from the table (see Appendix
  1,

  Figure 3).

  (3) Conclusion. If a pilot descends at 120 kts from 2,000 ft, beginning 5.9 NM from the

  runway threshold at a 632 fpm descent rate, the aircraft should cross the stepdown fix at
  768 ft

  and the threshold at 46 ft.

  NOTE: During any approach, pilots should perform a continuous descent flight

  path that meets all altitude constraints.

  e. Timing-Dependent Approaches. Control of airspeed and rate of descent is particularly

  important on approaches solely dependent on timing to identify the MAP. Pilots should cross
  the

  FAF already configured for landing and on the correct speed for the final approach segment.

  f. Derived Decision Altitude (DDA). Pilots must not descend below the MDA when

  executing a missed approach from a CDFA. Operators should instruct their pilots to initiate
  the

  go-around at an altitude above the MDA (sometimes referred to as a DDA) to ensure the aircraft

  does not descend below the published MDA. Operators conducting approaches authorized by

  operations specification (OpSpec) C073, Vertical Navigation (VNAV) Instrument Approach

  Procedures (IAP) Using Minimum Descent Altitude (MDA) as a Decision Altitude

  (DA)/Decision Height (DH), may use MDA as a DA.

  g. Decision Approaching MDA. Flying the published VDA or GS will have the aircraft

  intersect the plane established by the MDA at a point before the MAP. Approaching the MDA,

  the pilot has two choices: continue the descent to land with required visual references,
  or execute

  a missed approach, not allowing the aircraft to descend below the MDA. (See Appendix 1,

  Figure 1B, Approach Example Using Continuous Descent Final Approach.)

  h. Executing a Missed Approach Prior to MAP. When executing a missed approach prior

  to the MAP and not cleared by an air traffic control (ATC) climb-out instruction, fly the

  Par 6 Page 5AC 120-108 1/20/11

  published missed approach procedure. Proceed on track to the MAP before accomplishing a
  turn,

  comply with published altitude restrictions between the FAF and the MAP, and continue on
  or

  climb to the altitude specified in the missed approach procedure.

  i. Approaches With a VDP. Flying the published VDA or GS on an approach constructed

  with a VDP should have the aircraft cross the MDA at or beyond the VDP.

  j. Visibility Minima Penalty. The appropriate OpSpec, management specification

  (MSpec), or letter of authorization (LOA) will specify what visibility penalty will apply
  to the

  published approach minima if operators do not use CDFA on NPAs.

  7. FLIGHTCREW TRAINING.

  a. Use of CDFA. The use of CDFA should become a standard procedure in the performance

  of suitable NPAs. Accordingly, operators should incorporate training on CDFA in those elements

  of their training programs where NPAs are performed and evaluated.

  b. Manuals and SOPs. Operators should revise their flight manuals and/or SOPs to identify

  CDFA as a standard method of performing NPAs.

  c. Training. Additional flight training to use the CDFA technique is not required for pilots

  qualified to conduct NPA in accordance with the operator’s certificate. However, operators

  should provide flightcrews with appropriate ground training before performing CDFA

  operations. The ground training may be computer-based, published in-flight operations bulletins,

  or provided via other similar means deemed acceptable by the principal operations inspector

  (POI). Crewmembers should receive training specific to the aircraft type, the installed
  flight

  guidance, and navigation system, and on how to utilize the system when using the CDFA

  technique for applicable approach profiles.

  d. Training Program Topics. Each operator’s CDFA training program should specifically

  address the following topics:

  (1) Emphasis on the stabilized approach concept and the safety benefits of using the

  CDFA.

  (2) Approach characteristics (e.g., circling-only minima) and environmental factors

  (e.g., icing) that could make the use of CDFA inadvisable.

  (3) Use of baro-VNAV, if applicable, to provide a vertical profile during an NPA.

  (4) Methods for translating the published GS angle or VDA into the required rate of

  descent for aircraft not equipped with baro-VNAV.

  (5) Means for tracking progress along the final approach vertical profile.

  (6) Means for ensuring compliance with any altitude restrictions during the final

  approach segment, to include start of descent past FAF to meet stepdown fix altitudes.

  Page 6 Par 61/20/11 AC 120-108

  (7) The altitude additive required for ensuring the aircraft does not descend below the

  MDA or DDA.

  (8) Understanding the impact on approach stabilization by flying to the MAP at the MDA

  to acquire runway visual references (see Appendix 1, Figure 1A).

  (9) Pilot Flying (PF) and pilot-not-flying (PNF) monitoring callouts and other crew

  coordination activities needed to ensure safe transition from the vertical profile to either
  landing

  or a go-around at MDA or DDA.

  (10) Procedures for executing a go-around prior to reaching the MAP.

  (11) The need to comply with the VGSI, if available, and discussion of the obstacle

  protection in the visual segment it provides.

  8. AC FEEDBACK FORM. For your convenience, the AC Feedback Form is the last page of

  this AC. Note any deficiencies found, clarifications needed, or suggested improvements

  regarding the contents of this AC on the Feedback Form.

