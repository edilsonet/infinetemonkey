text: '04.08.2025

  OBJETIVO

  1.1 Apresentar uma metodologia que proporcione a elaboração de Lista de Equipamentos Mínimos
  (MEL) aceitável pela Anac, capaz de permitir a operação de aeronaves com determinados equipamentos
  e instrumentos inoperantes, sob determinadas condições e limitações de operações, de modo
  a dar cumprimento ao requerido pelas seções 91.213 e 91.1115 do RBAC nº 91, 121.628 do RBAC
  nº 121 e 135.179 do RBAC nº 135, bem como outras seções que requeiram ou permitam a elaboração
  de MEL pelos operadores.

  1.2 Apresentar os procedimentos requeridos no processo de aprovação e revisão de MEL, desde
  sua submissão à análise da Anac até a emissão de autorização das operações de acordo com
  a MEL aprovada.

  1.3 Apresentar os procedimentos para utilização em serviço da MEL aprovada.

  1.4 Apresentar os procedimentos para operação com equipamentos e instrumentos inoperantes,
  sem MEL aprovada, conforme o parágrafo 91.213(d) do RBAC nº 91.


  REVOGAÇÃO

  2.1 Esta IS revoga a IS nº 91-012, Revisão B.


  FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da Anac.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 Esta IS é fundamentada e objetiva oferecer método de cumprimento às seções 91.213 e
  91.1115 do RBAC nº 91, 121.628 do RBAC nº 121 e 135.179 do RBAC nº 135.

  Nota: Para efeitos desta IS, operadores sob outros regulamentos específicos (como RBAC nº
  90, 133, 136, 137, 141 e 142, entre outros), que não possuem requisitos específicos sobre
  MEL, são considerados como operadores regidos exclusivamente sob o RBAC nº 91, pois suas
  operações com itens inoperantes são reguladas pela seção 91.213 do RBAC nº 91.


  DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas na seção 01.1 do RBAC nº
