text: '10.03.2026

  OBJETIVO

  1.1 Oferecer a uma organização que administre ou pretenda administrar um programa de propriedade
  compartilhada de aeronaves, conforme a Subparte K do RBAC nº 91, um método de cumprimento
  para obter, alterar, suspender, solicitar revogação de uma suspensão ou solicitar a revogação
  de especificações administrativas (EA), de acordo com os requisitos estabelecidos pelo RBAC
  nº 91.


  REVOGAÇÃO

  2.1 Esta IS revoga a IS nº 91-013, Revisão A.


  FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da Anac.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.

  3.5 Esta IS é fundamentada e objetiva oferecer método de cumprimento para os seguintes requisitos
  do RBAC nº 91: 91.1001, 91.1014, 91.1015, 91.1017, 91.1019, 91.1023, 91.1026, 91.1041, 91.1047,
  91.1051 e 91.1073.


  DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas no RBAC nº 01, e as seguintes
  definições:

  4.1.1 aceitação: procedimento segundo o qual a Anac autoriza a utilização de um documento,
  manual, programa etc., ou suas revisões, sem que necessariamente seja realizada avaliação
  prévia do cumprimento dos requisitos regulamentares. Nesse caso, o administrador atua sob
  sua própria responsabilidade, até que a Anac avalie a conformidade desse documento, manual,
  programa etc.;

  4.1.2 aprovação: procedimento segundo o qual a Anac autoriza a utilização de um documento,
  manual, programa etc. ou suas revisões, mediante avaliação prévia do cumprimento dos requisitos
  regulamentares. Nesse caso, a vigência da autorização terá início na data definida no documento
  de aprovação emitido pela Agência;

  4.1.3 avaliação preliminar de documentos: verificação sucinta feita por um membro integrante
  da equipe técnica, visando a avaliar se a qualidade geral dos manuais, programas e demais
  documentos que devem compor o PSF é aceitável, e se o material apresentado está apto para
  o prosseguimento do processo. O resultado favorável de uma avaliação preliminar não implica
  em aceitação ou aprovação da documentação requerida para cada fase do processo;

  4.1.4 coordenador de projeto: é o servidor designado pelo escritório emissor de EA (EsEA)
  para coordenar um processo de emissão das EA de um administrador de programa de propriedade
  compartilhada de aeronaves;

  4.1.5 equipe técnica: equipe formada por servidores de diversas superintendências da Anac
  e designados por suas respectivas gerências para conduzir o processo de emissão das EA junto
  ao coordenador de projeto do EsEA, bem como analisar os manuais, programas e documentos
  e coordenar as inspeções de responsabilidade de seus setores. A equipe técnica poderá ser
  modificada no decorrer do processo e será automaticamente desfeita ao término deste;

  4.1.6 escritório emissor de EA (EsEA): é o setor da Anac encarregado da condução do processo
  de emissão das EA de um administrador de programa de propriedade compartilhada de aeronaves.
  Na atual estrutura da Anac, o EsEA é a Gerência de Operações da Aviação Geral (GOAG) da
  Superintendência de Padrões operacionais (SPO), ou gerência técnica por ela delegada;

  4.1.7 especificações administrativas (EA): documento emitido pela Anac que define, lista
  e estabelece especificamente para um administrador de programa de propriedade compartilhada
  de aeronaves suas instalações, pessoal de administração, frota, área de operação, autorizações
  e/ou limitações de operações específicas, informações sobre manutenção de aeronaves e isenções
  ou desvios, se existirem. A revisão mais recente das EA revoga as revisões anteriores a
  partir da data de emissão. As características do administrador são vinculadas às informações
  contidas em suas EA;

  4.1.8 família de aeronaves: significa um grupo qualquer de aviões, independentemente de
  seu ICAO type designator, que a Anac considere ter meios similares de propulsão, de mesmo
  fabricante e sem significativas diferenças de manobrabilidade ou características de voo.
  Para um helicóptero, significa um modelo básico do mesmo fabricante, independentemente de
  seu ICAO type designator;

  4.1.9 iteração: ciclo de avaliação documental sobre uma proposta solicitada pela organização
  requerente, para a qual é requerida uma avaliação preliminar, uma aceitação ou aprovação
  de manuais ou programas. As iterações estão relacionadas ainda, a quaisquer documentos que
  instruam o processo de emissão das EA e que atestem o cumprimento de requisitos, inclusive
  em alterações às EA;

  4.1.10 material técnico: são documentos, manuais, programas, certificados, declarações,
  contratos etc., necessários à instrução do processo de emissão das EA, conforme requerido
  nas fases aplicáveis;

  4.1.11 pacote de solicitação formal (PSF): conjunto de documentos requeridos para emissão
  das EA ou para determinada solicitação de alteração ou inclusão de autorização proposta
  pelo administrador, tais como: carta de encaminhamento, material técnico, inclusive documentos
  comprobatórios etc., conforme aplicável;

  4.1.12 reunião de orientação prévia (ROP): audiência entre a organização requerente e a
  Anac que tem por finalidade a explanação e/ou esclarecimento de dúvidas, de ambas as partes,
  relativas ao processo de emissão das EA, opcional conforme definido nesta IS, acerca das
  particularidades do programa ao qual o requerente se propõe administrar, além de prover
  informações críticas sobre o processo; e'
