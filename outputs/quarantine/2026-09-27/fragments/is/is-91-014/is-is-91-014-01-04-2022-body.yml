text: '01.04.2022

  OBJETIVO

  1.1 Apresentar uma metodologia que propicie a elaboração de estudos e análises aceitáveis
  pela ANAC, para que operadores aéreos que conduzam operações segundo o RBAC nº 91 - Subparte
  K e RBAC nº 135 possam solicitar autorização para elevação do fator empregado para cálculo
  do comprimento efetivo de pista requerido para pousos com aviões, assegurando que tais operações
  atendam a todos requisitos normativos previstos, além de manutenção dos níveis de segurança
  operacional.

  1.2Apresentar os procedimentos requeridos no processo de aprovação das propostas peticionadas,
  desde sua submissão à análise da ANAC até a emissão das Especificações Operativas, no caso
  das operações segundo o RBAC nº 135, ou das Especificações Administrativas, no caso das
  operações segundo o RBAC nº 91 - Subparte K, contemplando a autorização para operação, segundo
  a proposta elaborada pelo operador aéreo.


  REVOGAÇÃO

  Não aplicável.


  FUNDAMENTOS


  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 Esta IS é fundamentada e objetiva oferecer método de cumprimento ao parágrafo 135.363(k)
  do RBAC nº 135 e ao parágrafo 91.1037(f) do RBAC nº 91.


  DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas no RBAC nº 01, na seção
  135.361 do RBAC nº 135, nas IS nº 119-004 e 91-013 e as seguintes definições:

  4.1.1 Relatório de avaliação operacional: relatório de avaliação de um tipo de aeronave
  que contém requisitos mínimos de treinamento para a aeronave. São chamados AVOP quando emitidos
  pela ANAC, FSB reports quando emitidos pelo FAA e OSD (anteriormente OEB reports) quando
  emitidos pela EASA; e

  4.1.2 Temperatura de referência: a temperatura de referência do aeródromo é a média mensal
  das temperaturas máximas diárias para o mês mais quente do ano (sendo que o mês mais quente
  será o mês com maior temperatura mensal média).

  4.2 Lista de abreviaturas:

  AFM - Aircraft flight manual (manual de voo aprovado - avião)

  ANAC - Agência Nacional de Aviação Civil

  EA - Especificações Administrativas

  EASA - European Union Aviation Safety Agency

  EO - Especificações Operativas

  FAA - Federal Aviation Administration

  FAI - Formulário de Análise de Impacto

  FSB - Flight Standardization Board

  ICAO - International Civil Aviation Organization

  IS - Instrução Suplementar

  LDA - Landing distance available (distância disponível para pouso)

  MGO - Manual Geral de Operações

  MGSO - Manual de Gerenciamento da Segurança Operacional

  MO - Manual de Operações

  OEB - Operational Evaluation Board

  OSD - Operational Suitability Data (dados de adequação operacional)

  RBAC - Regulamento Brasileiro de Aviação Civil

  RESA - Runway End Safety Area (área de segurança de fim de pista)

  RVR - Runway visual range (alcance visual na pista)

  SOP - Standard operating procedures (procedimentos operacionais padronizados)

  SPO - Superintendência de Padrões Operacionais

  TFAC - Taxa de Fiscalização da Aviação Civil


  DESENVOLVIMENTO DO ASSUNTO

  5.1 Aplicabilidade

  5.1.1 As orientações contidas nesta seção se aplicam aos operadores aéreos que visam a proposição
  de elevação do fator empregado para cálculo do comprimento efetivo de pista requerido em
  pousos de aviões que operam segundo o RBAC nº 135, considerando o previsto no parágrafo
  135.363(k) do RBAC nº 135, e aos que operam segundo o RBAC nº 91 - Subparte K, considerando
  o previsto no parágrafo 91.1037(f) do RBAC nº 91.

  5.1.2 Segundo o previsto no parágrafo 135.363(k) do RBAC nº 135 e no parágrafo 91.1037(f)
  do RBAC nº 91, o percentual do comprimento efetivo utilizado na fatoração de pista requerida
  pelas seções 135.375, 135.377, 135.385, 135.387, 135.393 e 135.395 do RBAC nº 135 e pela
  seção 91.1037 do RBAC nº 91 pode ser majorado a até 80%, mediante autorização da ANAC.'
