text: '01.06.2023

  Objetivo

  1.1 Esta Instrução Suplementar estabelece os procedimentos e orientações acerca do processo
  de reconstituição de Diários de Bordo e Cadernetas de célula, motor e hélice das aeronaves
  civis brasileiras em virtude de dados corrompidos, roubo, perda ou extravio, de modo a permitir
  a restauração da condição aeronavegável das aeronaves que se encontrem nessa condição.

  Revogação

  2.1 Esta Instrução Suplementar revoga a IS 91-015 Revisão A.

  Fundamentos

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar,
  norma suplementar de caráter geral editada pelo Superintendente da área competente, objetivando
  esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou RBHA.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC ou RBHA, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado no item anterior deve garantir nível de
  segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar o objetivo
  do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 As seções 91.417 do RBAC nº 91, 135.439 do RBAC nº 135 e 121.380 do RBAC nº 121 estabelecem
  requisitos para registros de manutenção e sua conservação.

  3.6 O artigo 8º, §2º da Resolução nº 457, de 20 de dezembro de 2017, estabelece que eventual
  perda ou corrupção dos registros do Diário de Bordo ensejará suspensão cautelar do Certificado
  de Aeronavegabilidade da aeronave, até a regularização dos registros correlatos.

  3.7 O artigo 47 da Portaria nº 2.050/SPO/SAR, de 29 de junho de 2018, e o artigo 52 da Portaria
  nº 3.220/SPO/SAR, de 15 de outubro de 2019, estabelecem que, no caso de roubo, perda ou
  extravio do Diário de Bordo, ou de volume(s), o operador da aeronave deve, imediatamente
  à ocorrência do fato, comunicar o ocorrido ao órgão policial estadual (Polícia Civil) ou
  federal (Polícia Federal), para fins de apuração de responsabilidades. Havendo impossibilidade
  de reconstituição do Diário de Bordo, o operador da aeronave deverá comunicar o fato à ANAC,
  que poderá estabelecer, por intermédio da área responsável, quais ações serão necessárias
  para fins de demonstrar a condição aeronavegável da aeronave.

  Definições

  4.1 Para os propósitos desta IS, são válidas as definições listadas no RBAC nº 01 e as seguintes
  definições:

  4.1.1 Aeronavegável: para aeronave que possui projeto de tipo aprovado, é a condição na
  qual ela se encontra de acordo com o projeto de tipo aplicável e em condições de operação
  segura. Para a aeronave que não possui projeto de tipo aprovado, considera-se que está em
  condição aeronavegável quando se encontrar em condição segura para operação aérea.

  4.1.2 Cadernetas de Célula, Motor, Hélice: é o documento destinado aos registros primários
  e secundários dos serviços de manutenção executados na aeronave, motor e hélice e seus componentes,
  tais como: correção de pane, troca de componente, serviços de inspeção, revisão, cumprimento
  de Boletins de Serviço, Diretrizes de Aeronavegabilidade, incorporação de alterações e de
  reparos, e quaisquer outras atividades de manutenção realizadas. Têm o objetivo de centralizar
  os registros de manutenção e quaisquer registros técnicos que evidenciem as reais condições
  de aeronavegabilidade da aeronave, motor e hélice e de seus componentes, de modo a cumprir
  os requisitos estabelecidos nos RBAC e demais normas pertinentes. As cadernetas de célula,
  motor e hélice devem ser confeccionadas de acordo com as instruções contidas na IS nº 43.9-003.

  4.1.3 Diário de Bordo: é o documento único, de porte obrigatório, destinado aos registros
  de horas de voo, jornada e ocorrências com a aeronave e seus tripulantes, em conformidade
  com o estabelecido na Lei nº 7.565, de 19 de dezembro de 1986, e deve ser confeccionado
  de acordo com a Resolução nº 457 e as instruções contidas nas Portarias nº 2.050/SPO/SAR
  e nº 3.220/SPO/SAR. O Diário de Bordo também é o documento oficial de referência para o
  controle de tempo em serviço, da manutenção e dos registros de horas de voo e ciclos a serem
  escriturados nas Cadernetas de Célula, Motor e Hélice.

  4.1.4 Hora de Voo, Tempo de Voo ou Tempo em serviço: para efeito desta IS e do controle
  de manutenção, hora ou tempo de voo ou tempo em serviço segue a definição de “Tempo em serviço”
  constante do RBAC nº 01, que significa o tempo transcorrido desde o momento em que a aeronave
  deixa a superfície da terra até o momento em que ela toca essa superfície, no pouso.

  4.1.5 Registro Primário de Manutenção: é o registro principal das atividades de manutenção,
  devendo ser completo e claro, e conter o método de cumprimento utilizado e o resultado da
  ação de manutenção executada. Será considerado registro primário de manutenção aquele que
  possua o conteúdo e forma das anotações, como as previstas nas seções 43.9 ou 43.11 do RBAC
  nº 43, podendo ser utilizado para tais registros: Cadernetas de Célula, de Motor e de Hélice,
  Ordens de Serviços, Fichas de Cumprimento de Diretrizes de Aeronavegabilidade (FCDA), Formulários
  F-400-04 (SEGVOO 001), F-100-01 (SEGVOO 003) e similares.

  4.1.6 Tempo desde Novo (TSN) ou Tempo Total de Voo para a Célula, Motor e Hélice: é a soma
  total do tempo em serviço, desde o primeiro voo da aeronave, do motor ou da hélice. Quando
  definido nos manuais dos fabricantes dos motores ou quaisquer outros componentes, as horas
  e os ciclos de operação no banco de ensaio e no solo, serão adicionadas ao tempo em serviço
  para efeito do cálculo de tempo desde novo (TSN).

  Desenvolvimento do Assunto

  5.1 Aplicabilidade

  5.1.1 Esta IS é aplicável a todos os processos de aeronaves que tiveram seus Diários de
  Bordo e/ou cadernetas corrompidas, perdidas, roubadas ou extraviadas e cujos ciclos e horas
  totais são inexistentes ou desconhecidos.

  5.1.2 Esta IS também se aplica a todos os operadores e demais profissionais da aviação civil
  envolvidos na tarefa de reconstituição de Diários de Bordo e/ou cadernetas em virtude de
  extravio, roubo, perda ou corrupção desses documentos.

  5.1.3 As seções 91.417 do RBAC nº 91, 135.439 do RBAC nº 135 e 121.380 do RBAC nº 121 estabelecem
  os tipos de registros de manutenção que devem ser conservados com o operador e transferidos
  com a aeronave no ato da venda. Essas seções dos RBACs também preveem os tipos de registros
  de manutenção que devem ser conservados até que o trabalho seja repetido ou por prazos definidos
  nos regulamentos.

  5.1.4 De acordo com os RBAC nº 91, RBAC nº 135 e RBAC nº 121, cada proprietário ou operador
  deve disponibilizar todos os registros requeridos pela ANAC sempre que solicitado.

  5.2 Reconstituição de Diários de Bordo e Cadernetas

  5.2.1 O operador ou profissional deverá identificar nos subparágrafos desta seção qual a
  situação específica para a sua aeronave, tomando as ações ali descritas para reconstituir
  os documentos necessários e regularizar a situação de aeronavegabilidade da aeronave.

  5.2.2 A aeronave não possui Diários de Bordo ou Cadernetas de Célula, Motor e Hélice e não
  há registros de TSN e CSN da aeronave na base de dados da ANAC (SEI, SACI, etc).

  5.2.2.1 Primeira ação: o operador ou profissional de aviação civil deverá consultar o detentor
  do projeto da aeronave a fim de obter informações que possam subsidiar a definição das ações
  necessárias para restabelecer a condição aeronavegável da aeronave. As orientações dadas
  pelo detentor do projeto da aeronave deverão ser seguidas, e sua execução demonstrada à
  ANAC no processo de reconstituição dos Diários de Bordo e/ou Cadernetas de Célula, Motor
  e Hélice. Deverá ser aberto no SEI um processo específico do tipo “Parecer Técnico” e nele
  incluídos os registros das ações realizadas e carta solicitando à ANAC orientações para
  continuidade do processo de reconstituição de Diários de Bordo e Cadernetas.'
