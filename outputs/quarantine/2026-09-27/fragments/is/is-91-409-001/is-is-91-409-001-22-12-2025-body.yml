  APÊNDICE B - EXTRATO DAS ICA PARA MOTORES (RBAC Nº 33)


  B.1 ENGINE MAINTENANCE MANUAL OR SECTION.

  a) Introduction information that includes an explanation of the engine''s features and data
  to the extent necessary for maintenance or preventive maintenance.

  b) A detailed description of the engine and its components, systems, and installations.

  c) Installation instructions, including proper procedures for uncrating, deinhibiting, acceptance
  checking, lifting, and attaching accessories, with any necessary checks.

  d) Basic control and operating information describing how the engine components, systems,
  and installations operate, and information describing the methods of starting, running,
  testing, and spining the engine and its parts including any special procedures and limitations
  that apply.

  e) Servicing information that covers details regarding servicing points, capacities of tanks,
  reservoirs, types of fluids to be used, pressures applicable to the various systems, locations
  of lubrication points, lubricants to be used, and equipment required for servicing.

  f) Scheduling information for each part of the engine that provides the recommended periods
  at which it should be cleaned, inspected, adjusted, tested, and lubricated, and the degree
  of inspection the applicable wear tolerances, and work recommended at these periods. However,
  the applicant may refer to an accessory, instrument, or equipment manufacturer as the source
  of this information if the applicant shows that the item has an exceptionally high degree
  of complexity requiring specialized maintenance techniques, test equipment, or expertise.
  The recommended overhaul periods and necessary cross references to the Airworthiness Limitations
  section of the manual must also be included. In addition, the applicant must include an
  inspection program that includes the frequency and extent of the inspections necessary to
  provide for the continued airworthiness of the engine.

  g) Troubleshooting information describing probable malfunctions, how to recognize those
  malfunctions, and the remedial action for those malfunctions.

  h) Information describing the order and method of removing the engine and its parts and
  replacing parts, with any necessary precautions to be taken. Instructions for proper ground
  handling, crating, and shipping must also be included.

  i) A list of the tools and equipment necessary for maintenance and directions as to their
  method of use.

  B.2 ENGINE OVERHAUL MANUAL OR SECTION.

  a) Disassembly information including the order and method of disassembly for overhaul.

  b) Cleaning and inspection instructions that cover the materials and apparatus to be used
  and methods and precautions to be taken during overhaul. Methods of overhaul inspection
  must also be included.

  c) Details of all fits and clearances relevant to overhaul.

  d) Details of repair methods for worn or otherwise substandard parts and components along
  with the information necessary to determine when replacement is necessary.

  e) The order and method of assembly at overhaul.

  f) Instructions for testing after overhaul.

  g) Instructions for storage preparation, including any storage limits.

  h) A list of tools needed for overhaul.

  B.3 AIRWORTHINESS LIMITATIONS SECTION

  The Instructions for Continued Airworthiness must contain a section titled Airworthiness
  Limitations that is segregated and clearly distinguishable from the rest of the manual.
  For all engines:

  a) The Airworthiness Limitations section must set forth each mandatory replacement time,
  inspection interval, and related procedure required for type certification. If the Instructions
  for Continued Airworthiness consist of multiple documents, the section required under this
  paragraph must be included in the principal manual.

  b) This section must contain a legible statement in a prominent location that reads: “The
  Airworthiness Limitations section is FAA approved and specifies maintenance required under
  §§43.16 and 91.403 of Title 14 of the Code of Federal Regulations unless an alternative
  program has been FAA approved.”


  APÊNDICE C - PERGUNTAS MAIS FREQUENTES SOBRE TBO


  C.1 É OBRIGATÓRIO O CUMPRIMENTO DOS TEMPOS ENTRE REVISÕES GERAIS - TBO (TIME BETWEEN OVERHAUL)
  PARA GARANTIR A OPERAÇÃO SEGURA DOS MOTORES AERONÁUTICOS QUE EQUIPAM AERONAVES QUE SE ENQUADRAM
  NO PARÁGRAFO 91.409(I) DO RBAC Nº 91?

  A obrigatoriedade no cumprimento do TBO dependerá do processo de certificação do motor.
  O TBO será obrigatório se constar das limitações de aeronavegabilidade, ou se for tornado
  mandatório por regulamento ou Diretriz de Aeronavegabilidade. Nos demais casos, o TBO é
  uma recomendação do fabricante e, portanto, de cumprimento facultativo. O TBO é específico
  por modelo de motor, e os tempos de revisão recomendados são normalmente identificados em
  Manuais de Manutenção, Boletins ou Cartas de Serviço do fabricante do motor.


  C.2 O QUE SÃO LIMITAÇÕES DE AERONAVEGABILIDADE?

  Limitações de aeronavegabilidade são tarefas de manutenção que afetam o nível mínimo de
  segurança do produto aeronáutico. Incluem tarefas que visam detectar falhas latentes que,
  em conjunto com uma ou mais falhas específicas adicionais, podem resultar em uma situação
  perigosa ou catastrófica. São definidas pelo fabricante durante a certificação de tipo ou
  suplementar de tipo, aprovadas pela autoridade de aviação civil e identificadas como tal
  no Manual de Manutenção ou das Instruções para Aeronavegabilidade Continuada, tornando-se
  de cumprimento obrigatório. As limitações de aeronavegabilidade envolvem prazos ou intervalos
  máximos de utilização em termos de horas e/ou ciclos, ou outro valor mensurável.


  C.3 O TBO É FACULTATIVO PARA QUALQUER AERONAVE QUE OPERA NO BRASIL SE NÃO CONSTAR DAS LIMITAÇÕES
  DE AERONAVEGABILIDADE?

  Não. O cumprimento do TBO recomendado pelos fabricantes é facultativo para aeronaves que
  se enquadram no parágrafo 91.409(i) do RBAC nº 91. Os RBAC nº 121 e 135, por envolverem
  empresas de serviço de transporte aéreo, exigem o cumprimento do programa de manutenção
  recomendado pelo fabricante ou aprovado pela Anac.


  C.4 SEGUNDO OS CRITÉRIOS DESTA IS, A REVISÃO GERAL DE UM MOTOR CONVENCIONAL JAMAIS SERÁ
  EXECUTADA?

  Não. O funcionamento de um motor provoca desgastes e em algum momento a revisão geral do
  motor terá de ser feita. Ela poderá ser realizada dentro do TBO estabelecido pelo fabricante
  ou dentro de outro intervalo, mas deverá ser realizada sempre que as condições do motor
  estiverem deterioradas a ponto de requerer a revisão, ou quando o TBO for alcançado nas
  situações em que ele for mandatório conforme citado na resposta da pergunta C.1.


  C.5 COMO É POSSÍVEL SABER SE AS CONDIÇÕES DO MOTOR ESTÃO DETERIORADAS?

  Quando o motor estiver fora dos parâmetros normais de operação previstos pelo fabricante
  ou quando for identificado por meio de monitoramento. O monitoramento pode ser feito por
  meio de métodos recomendados pelo fabricante. Também poderá ser usada a IS nº 91.409-002
  para motores convencionais e a AC 120-113 da FAA para motores a turbina.


  C.6 E SE O OPERADOR OPTAR POR NÃO REALIZAR O MONITORAMENTO DAS CONDIÇÕES DO MOTOR?

  Caso o monitoramento das condições do motor não seja realizado, a Anac recomenda fortemente
  a realização da revisão geral dentro do TBO recomendado pelo fabricante ou quando as suas
  condições estiverem deterioradas, o que ocorrer primeiro.


