text: '22.12.2025

  Objetivo

  Fornecer orientações para proprietários, operadores e pessoal de manutenção sobre quando
  a revisão geral deve ser realizada em aeronaves operando segundo as regras do RBAC nº 91.
  Incluem-se, neste contexto, aeronaves operando sob o RBAC nº 137.


  REVOGAÇÃO

  Esta IS revoga a IS nº 91.409-001 revisão B.


  FUNDAMENTOS

  O art. 87 da lei nº 7.565/86 (Código Brasileiro de Aeronáutica - CBAer) estabelece que a
  prevenção de acidentes aeronáuticos é de responsabilidade de todas as pessoas, naturais
  ou jurídicas, envolvidas com a fabricação, manutenção, e operação de aeronaves.

  O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto em RBAC, poderá:

  a) adotar os meios e procedimentos previamente especificados em IS; ou

  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da Anac.

  O meio ou procedimento alternativo mencionado no parágrafo 3.2b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.


  DEFINIÇÕES

  Esta IS utiliza os termos cujas definições podem ser encontradas na IS nº145.109-001 - Publicações
  Técnicas: obtenção e controle pelas organizações de manutenção de produto aeronáutico e
  RBAC nº145 - Organizações de manutenção de produto aeronáutico.

  TBO - Time Between Overhaul (Tempo entre revisões gerais). Os fabricantes estabelecem os
  tempos em operação entre as revisões gerais (ou os intervalos entre as revisões gerais).
  Esses intervalos são estimados em número de horas, ciclos ou eventos que um produto ou artigo
  aeronáutico pode operar de forma segura e confiável sem exceder os limites de desgaste do
  produto em serviço.


  DESENVOLVIMENTO DO ASSUNTO

  Aspectos regulatórios

  O nível mínimo requerido de manutenção e de segurança de um produto ou artigo aeronáutico
  é garantido pelo cumprimento dos procedimentos normais de manutenção dentro dos prazos estabelecidos
  pelos fabricantes (diário, pré-voo, checks de 25, 50, 100 horas, etc.).

  Nota: o proprietário/operador é responsável por garantir as condições mínimas de segurança
  da aeronave, isto é, ele é responsável por assegurar uma avaliação que verifique se não
  há indicações de decréscimo de desempenho da aeronave, motor, hélice ou equipamentos (partes,
  acessórios, instrumentos e demais componentes) e, se para corrigir esse decréscimo de desempenho,
  é necessária a revisão geral recomendada. A seção 5.3 desta IS esclarece mais essa questão.

  Para os fins de manutenção, manutenção preventiva ou alterações, o parágrafo 21.50(b) do
  RBAC nº21 estabelece requisitos para que o detentor do projeto de tipo ou fabricante de
  um produto aeronáutico disponibilize as Instruções de Aeronavegabilidade Continuada - ICA;

  Nota: o Apêndice B desta IS contém alguns exemplos de ICA.

  É importante esclarecer a diferença que os regulamentos de aeronavegabilidade fazem entre
  2 (dois) tipos de documentos:

  a) Programa de manutenção recomendado: são tarefas realizadas em diversos níveis de complexidade
  (podem envolver desde uma inspeção simples até uma revisão geral), em que são verificados
  itens que o fabricante considera como importantes para manter a confiabilidade e propiciar
  a operação segura e de forma mais econômica.

  b) Limitações de aeronavegabilidade: são tarefas de manutenção que afetam o nível mínimo
  de segurança do produto aeronáutico. Incluem tarefas que visam detectar falhas latentes
  que, em conjunto com uma ou mais falhas específicas adicionais, podem resultar em uma situação
  perigosa ou catastrófica. São definidas pelo fabricante durante a certificação de tipo ou
  suplementar de tipo, aprovadas pela autoridade de aviação civil e identificadas como tal
  no Manual de Manutenção ou das Instruções para Aeronavegabilidade Continuada, tornando-se
  de cumprimento obrigatório. As limitações de aeronavegabilidade envolvem prazos ou intervalos
  máximos de utilização em termos de horas e/ou ciclos, ou outro valor mensurável.

  Nota 1: o que caracteriza uma tarefa como uma limitação de aeronavegabilidade não tem, necessariamente,
  relação com a complexidade da tarefa.

  Nota 2: a alteração de uma limitação já publicada requer a prévia aprovação da autoridade,
  e pode ser acompanhada da emissão de uma Diretriz de Aeronavegabilidade se a nova limitação
  afetar a segurança.

  As ICA contêm, entre outras, instruções referentes a:

  a) programa de manutenção recomendado; e

  b) limitações de aeronavegabilidade.

  A título de ilustração, seguem exemplos de formas de apresentação das Limitações de Aeronavegabilidade
  em publicações técnicas que contêm instruções de aeronavegabilidade continuada - ICA de
  aeronaves:

  a) Maintenance Manual - Chapter 4 - Airworthiness Limitations. Description - General - The
  airworthiness Limitations section is EASA approved and variations must also be approved.

  b) SERVICE MANUAL - SECTION I - AIRWORTHINESS LIMITATIONS - NOTE: The Airworthiness Limitations
  section is FAA approved and specifies maintenance required under §§ 43.16 and 91.403 of
  the Federal Aviation Regulations unless an alternative program has been FAA approved.

  c) MODEL FXX MAINTENANCE MANUAL - CHAPTER 4 AIRWORTHINESS LIMITATIONS - NOTE - The Airworthiness
  Limitations Section is FAA Approved and specifies maintenance required under 14 CFR 43.16
  and 91.163 of Title 14 Code of Federal Regulations - CFR unless an alternative program has
  been FAA approved. The following Airworthiness Limitations related to life of the airplane
  and its components have been established with respect to this airplane. Refer to LIMITATIONS
  in the Pilot’s Operating Handbook and the FAA Approved Airplane Flight Manual for more information
  regarding the airplane’s flight limitations.

  d) MAINTENANCE PLANNING DATA (MPD) DOCUMENT - SECTION 9 - AIRWORTHINESS LIMITATIONS - AWLs
  AND CERTIFICATION MAINTENANCE REQUIREMENTS (CMRs) - A. SCOPE - The scheduled maintenance
  requirements described in this section result from Model XXX airplane certification activities
  with the U.S. Federal Aviation Administration - FAA. Accordingly, this FAA approved Airworthiness
  Limitations and Certification Maintenance Requirements document is crossreferenced in the
  Model XXX Type Certificate Data Sheet. These maintenance actions are mandatory. This Airworthiness
  Limitations Section is FAA approved and specifies maintenance required under Federal Aviation
  Regulation - FAR 43.16 and 91.403 unless an alternative program has been FAA approved.

  e) Maintenance Review Board Report - APPENDIX A - AIRWORTHINESS LIMITATIONS AND CERTIFICATION
  MAINTENANCE REQUIREMENTS - A. SECTION 9 - Section 9 has been removed from Appendix A of
  this MRBR. The single source of Section 9 can be located in the MPD, D6xxWxxx.

  f) Maintenance Review Board Report - APPENDIX A - AIRWORTHINESS LIMITATIONS - (AL) - 1.
  General - This appendix contains all the Airworthiness Limitation - AL applicable for the
  EMB-XXX and EMB-YYY aircraft (commercially known as EMBRAER XXX and YYY, respectively) and
  all their versions. The Airworthiness Limitations are divided in the 4 parts of this appendix,
  as follows:

  • PART 1 - CERTIFICATION MAINTENANCE REQUIREMENTS (MRBR APPENDIX A PART 1)

  • PART 2 - AIRWORTHINESS LIMITATION INSPECTIONS (MRBR APPENDIX A PART 2) - STRUCTURES

  • PART 3 - FUEL SYSTEM LIMITATION ITEMS (MRBR APPENDIX A PART 3)

  • PART 4 - LIFE-LIMITED ITEMS (MRBR APPENDIX A PART 4)

  This Airworthiness Limitations Appendix is ANAC, FAA, TCCA and EASA approved and Specifies
  maintenance required under §§ 43.16 and 91.403 of the Regulamento Brasileiro da Aviação
  Civil, and/or Federal Aviation Regulations, and/or EASA CS25, and/or, TCCA CAR525 as applicable,
  unless an alternative program has been ANAC and/or FAA and/or EASA and/or TCCA approved.

  Nota: estes exemplos não representam uma lista exaustiva.

  O RBAC nº 91 não apresenta regras específicas para o cumprimento dos tempos (intervalos)
  recomendados entre as revisões gerais para os proprietários/operadores de aeronaves operando
  segundo as regras do RBAC nº 91 que se enquadram no parágrafo 91.409(i). Esta IS apresenta
  as orientações que devem ser atendidas por esses operadores. O cumprimento dos intervalos
  de revisão geral é mandatório quando estiver especificado nas limitações de aeronavegabilidade
  conforme o parágrafo 91.403(c) do RBAC nº 91.

  Requisitos para tempo de vida limite e/ou tempo recomendado entre as revisões gerais:

  a) parágrafo 91.403(c) do RBAC nº 91 estabelece que “somente é permitido operar uma aeronave
  que possua um manual de manutenção do fabricante ou instruções para aeronavegabilidade continuada
  contendo uma seção de limitações de aeronavegabilidade se os tempos para substituição de
  componentes, os intervalos de inspeção e os procedimentos específicos contidos naquela seção
  forem cumpridos. Alternativamente, podem ser utilizados os intervalos de inspeção e os procedimentos
  estabelecidos nas especificações operativas emitidas segundo os regulamentos operacionais
  de operadores certificados segundo o RBAC nº 119, ou estabelecidos em um programa de inspeções
  aprovado segundo o parágrafo 91.409(e) deste Regulamento”;

  b) seção 91.409 do RBAC nº 91 estabelece em seu parágrafo 91.409(f) que: “o proprietário
  ou operador de cada aeronave descrita no parágrafo (e) desta seção deve selecionar, identificar
  nos registros de manutenção da aeronave e usar um dos seguintes programas para a inspeção
  dessa aeronave: (1) um programa de inspeção para aeronavegabilidade continuada fazendo parte
  de um CAMP em uso por um detentor de certificado emitido segundo o RBAC nº 119 e operando
  o mesmo tipo e modelo de aeronave, conforme especificações técnicas emitidas segundo o RBAC
  nº 121 ou operando o mesmo tipo e modelo de aeronave segundo o RBAC nº 135 e mantendo-o
  segundo o parágrafo 135.411(a)(2) do RBAC nº 135; (2) um programa de inspeções, aprovado
  segundo o parágrafo 135.419 do RBAC nº 135 e correntemente em uso por uma empresa certificada
  segundo o referido RBAC nº 135; (3) um programa atualizado de inspeções recomendado pelo
  fabricante; ou (4) qualquer outro programa de inspeção, estabelecido pelo proprietário ou
  operador da aeronave e aprovado pela Anac, conforme parágrafo (g) desta seção. No entanto,
  a Anac pode requerer revisões nesse programa de acordo com as provisões da seção 91.415
  deste Regulamento”;

  c) parágrafos 119.49(a)(8), (b)(8) e (c)(8) do RBAC nº119 requerem que cada detentor de
  certificado conduzindo operações regulares obtenha especificações operativas contendo limitações
  de tempo, ou padrões para determinar limitações de tempo, para revisões gerais (overhaul),
  inspeções e verificações em células, motores, hélices, rotores, componentes e equipamentos
  de emergência;

  Nota: no caso de aeronaves em operações não regulares sob o RBAC nº 135, o requisito se
  aplica para aeronaves sujeitas a um programa de manutenção de aeronavegabilidade requerido
  por 135.411(a)(2) do RBAC nº 135.

  d) parágrafo 121.135(b)(18) do RBAC nº 121 requer que o manual do detentor de certificado
  tenha os tempos limites, ou padrões para determinação de tempo limite para revisões gerais,
  inspeções e verificações de células, grupos moto propulsores e equipamentos normais e de
  emergência; e

  e) parágrafos 135.421(a) e 135.421(b) do RBAC nº 135 estabelecem que: “o detentor de certificado
  que opera uma aeronave com certificação de tipo para uma configuração para passageiros,
  excluído qualquer assento de pilotos, com 9 assentos ou menos deve cumprir com o programa
  de manutenção recomendado pelos fabricantes, ou com um programa aprovado pela Anac para
  cada motor, hélice, rotor, componentes e para cada item de equipamento de emergência requerido
  por este Regulamento”; e “para o propósito desta seção, um programa de manutenção do fabricante
  é aquele contido no manual de manutenção ou nas instruções de manutenção especificadas pelo
  fabricante, como requerido pelos RBAC, para a aeronave, motores, hélices, rotores, componentes
  e equipamentos de emergência”.

  Diretrizes da Aeronavegabilidade e regulamentos operacionais também podem impor instruções
  de aeronavegabilidade continuada mandatórias.

  Os períodos ou prazos de TBO geralmente estão transcritos em Boletins de Serviço (Service
  Bulletins - SB), Cartas de Serviço (Service Letters - SL), Cartas de Informação (Service
  Information Letters - SIL) e documentos semelhantes. Mesmo se os fabricantes indicarem os
  períodos ou prazos de TBO como mandatórios nesses documentos, estes são considerados mandatórios
  apenas quando aprovados pela autoridade aeronáutica. Os quadros abaixo representam, por
