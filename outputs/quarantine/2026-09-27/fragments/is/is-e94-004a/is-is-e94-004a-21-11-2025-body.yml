text: '21.11.2025

  Objetivo

  A subparte E do RBAC-E nº 94 estabelece requisitos para autorização de projeto de Sistema
  de Aeronave Remotamente Pilotada (RPAS) levando-se em consideração critérios como o peso
  máximo de decolagem (PMD) da aeronave não tripulada, se operada ou não além da visada visual
  (BVLOS) ou acima ou não dos 120 m (400 pés) AGL (acima do nível do solo).

  Atualmente, com base no uso da metodologia SORA (Specific Operations Risk Assessment) da
  JARUS, é possível mensurar o risco da operação de um RPAS de maneira holística, propor mitigações
  ou limitações e assim orientar o cumprimento de requisitos para autorização de projeto mais
  proporcionais ao risco avaliado.

  Caso o fabricante tenha o interesse de ter autorizado seu projeto de RPAS sob essa perspectiva,
  deverá cumprir os critérios abordados nesta Instrução Suplementar, desenvolvidos de acordo
  com a metodologia SORA na versão 2.5 e limitada às operações SAIL I ou II. Para os casos
  não detalhados nesta IS, aplicam-se diretamente os requisitos já estabelecidos na Subparte
  E do RBAC-E nº 94, e orientações contidas nas IS nº E94-001B e IS nº E94-002A.

  Revogação

  Não aplicável.

  Fundamentos

  A Lei nº 11.182/2005 (Lei de Criação da ANAC) estabelece no seu Art. 8, que "Cabe à ANAC
  adotar as medidas necessárias para o atendimento do interesse público e para o desenvolvimento
  e fomento da aviação civil, (...) atuando com independência, legalidade, impessoalidade
  e publicidade (...)".

  O mesmo artigo determina em seu inciso X, que compete à ANAC "regular e fiscalizar os serviços
  aéreos, os produtos e processos aeronáuticos, a formação e o treinamento de pessoal especializado,
  os serviços auxiliares, a segurança da aviação civil, a facilitação do transporte aéreo,
  (...) e as demais atividades de aviação civil".

  O requisito contido no parágrafo E94.401(b)(1)(i) do RBAC-E nº 94 estabelece que a ANAC
  pode determinar forma diferente da estabelecida pela Subparte E do RBAC-E nº 94 para autorização
  de projeto de RPAS.

  O art. 14 da Resolução nº 30, de 21 de maio de 2008, modificado pela Resolução n° 162, de
  20 de julho de 2010, também determina, em seu § 1°, que o administrado que pretenda, para
  qualquer finalidade, demonstrar o cumprimento de requisito poderá adotar os meios e procedimentos
  previamente especificados em IS ou apresentar meio ou procedimento alternativo devidamente
  justificado, exigindo-se, nesse caso, a análise e concordância expressa do órgão competente
  da ANAC. O § 2° do mesmo artigo estabelece que o meio ou procedimento alternativo deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  Definições

  Área Adjacente (Adjacente Area). Significa toda a área que está para além da Distância de
  Segurança no Solo (Ground Risk Buffer).

  Área Controlada (Controlled Ground Area). Significa uma área em que o operador do RPAS pode
  garantir que não haverá pessoas não anuentes em solo expostas ao risco.

  Área Escassamente Povoada (Lightly Populated). Região com densidade populacional menor que
  50 pessoas por km2.

  Área Rural ou Remota (Rural or Remote Area). Região com densidade populacional menor que
  5 pessoas por km2.

  Classe de Risco Aéreo (ARC - Air Risk Class). Significa uma classificação qualitativa da
  probabilidade de uma RPA encontrar uma aeronave tripulada no espaço aéreo genérico típico.

  Nota: Para efeitos desta IS, somente é aplicável a classe de risco aéreo ARC-a, também denominada
  de atípica e que ocorre mediante a segregação do espaço aéreo pelo DECEA via NOTAM.

  Classe de Risco ao Solo (GRC - Ground Risk Class). Significa o risco de uma pessoa ser atingida
  pela RPA (no caso de uma perda de controle da RPA com um pressuposto razoável de segurança
  operacional), ou então do atingimento de uma infraestrutura crítica.

  Detentor do Projeto. Pessoa física ou jurídica que detém, conforme a legislação brasileira,
  os direitos autorais patrimoniais sobre a totalidade do projeto da aeronave.

  Distância de Segurança no Solo (GRB - Ground Risk Buffer). Significa a distância no solo
  para além do volume operacional, a partir da qual devem ser acionados os procedimentos de
  emergência.

  Fabricante. Pessoa física ou jurídica responsável pela verificação da conformidade de todas
  as partes, peças e materiais adquiridos de terceiros, conforme seus respectivos projetos.
  Também é responsável pela conformidade de todos os processos de transformação e integração
  dessas partes, peças e materiais, além da verificação final da conformidade da aeronave,
  frente seu projeto aprovado na ANAC.

  Geografia de Voo (Flight Geografic). Significa o volume de espaço aéreo onde se planeja
  realizar a operação da RPA.

  Objetivos de segurança operacional (Operational Safety Object - OSO). Significa a expressão
  do SAIL em termos de requisitos específicos e com a robustez requerida para cada nível de
  SAIL.

  Requerente. Pessoa física ou jurídica que solicita à ANAC e aos outros órgãos governamentais
  as autorizações e solicitações necessárias para o projeto do RPAS, sendo o próprio fabricante
  ou representante por ele designado, em qualquer caso, detentor dos dados técnicos completos
  do projeto.

  Responsável Técnico - RT. Engenheiro com atribuição adequada e registro no Conselho Regional
  de Engenharia e Agronomia - Crea, responsável pelo projeto de RPAS.

  Risco no contexto SORA. Significa a análise de potenciais situações que podem resultar em
  danos a terceiros durante a operação do RPAS.

  Nível específico de integridade e confiança (Specific Assurance Integrity Level - SAIL).
  Significa a consolidação das análises de risco aéreo e no solo, que direciona as atividades
  necessárias e representa o nível de confiança de que a operação do RPAS permanecerá sob
  controle.

  Volume de Contingência (Contingency Volume). Significa um volume de espaço aéreo, para além
  da geografia de voo, que a UA poderá acessar em caso de evento anormal e, a partir do qual,
  devem ser acionados os procedimentos de contingência.


  Figura 1 - Apresentação dos volumes e áreas para análise.

  Desenvolvimento do Assunto

  Aplicabilidade

  Esta IS é aplicável a qualquer pessoa que pretenda obter autorização declaratória de projeto
  de RPAS, utilizando a metodologia SORA, limitada a SAIL I ou II.

  Limitações

  As aprovações de projeto consideradas por esta IS possuem as seguintes limitações:

  Exclusivamente em espaço aéreo segregado via NOTAM, ou de outra forma definida pelo DECEA;

  Operações sobre áreas controladas, rurais, remotas, ou escassamente povoadas, conforme definidas
  nesta IS;

  Classe de Risco ao Solo menor ou igual a 3; e

  Um piloto remoto somente pode operar um único RPAS por vez.

  Atribuições de Responsabilidades

  A autorização declaratória de projeto de RPAS é um processo que objetiva assegurar que a
  aeronave não tripulada atenda aos requisitos mínimos de aeronavegabilidade aplicáveis. Esta
  atividade envolve responsabilidades tanto daqueles que pretendem receber a autorização quanto
  da Anac.

  São responsabilidades dos requerentes:

  Solicitar a abertura do processo de autorização declaratória de projeto de RPAS, destinado
  às operações de baixo risco (SAIL I ou II), junto à Anac conforme estabelecido na IS;

  Submeter à Anac os documentos técnicos referentes ao cumprimento com requisitos da Subparte
  E do RBAC-E nº 94;

  Apresentar quaisquer esclarecimentos e dados técnicos complementares solicitados pela Anac;

  Realizar as análises e executar todos os ensaios em laboratório, solo e voo, conforme aplicável,
  julgados necessários pela Anac para a autorização, bem como elaborar e apresentar à Anac
  os relatórios dos resultados de ensaios (se aplicável);

  Nota: Para a realização dos ensaios, a aeronave protótipo deverá ser cadastrada no Sisant
  (Sistema de Aeronaves não Tripuladas) e estar em conformidade com os dados técnicos apresentados.
  Conforme necessário, a aeronave deverá possuir um Certificado de Autorização de Voo Experimental
  (Cave de RPAS), de acordo com a IS E94.503, para a realização dos ensaios em voo.

  Colaborar com as inspeções da Anac, quando necessárias, para determinação da conformidade
  do RPAS com os dados técnicos apresentados;

  Elaborar Manual de Voo com informações objetivas sobre a definição da Geografia de Voo,
  Volume de Contingência, Distância de Segurança no Solo, Área Adjacente, e quaisquer outras
  informações que a Anac julgar necessário para a segurança da operação;

  Apresentar declaração de cumprimento com requisitos conforme Subparte E do RBAC-E nº 94
  para aprovação de projeto ou no caso de modificação ao projeto aprovado;

  Permitir que a Anac testemunhe ou realize, se aplicáveis, os ensaios em laboratório, solo
  e voo relacionados ao cumprimento dos requisitos da Subparte E do RBAC-E nº 94; e

  Possuir sistema de qualidade que atenda, pelo menos, aspectos como: controle de dados técnicos
  de projeto; controle de documentação; controle de fornecedores; controle do processo de
  fabricação, inspeção e ensaios; controle de equipamentos de medição e testes; controle de
  artigos ou produtos não-conformes; ações de prevenção e correção; procedimentos de manuseio
  e armazenagem; controle dos registros de qualidade; procedimentos internos de auditoria
  e controle dos desvios de qualidade;

  Nota: A utilização da norma ASTM nº F3686 - 24, ou equivalente, é aceitável para a avaliação
  do sistema de qualidade.

  No âmbito de suas competências legais e regulatórias, compete a ANAC:

  Avaliar a documentação apresentada pelo requerente;

  Determinar, quando aplicável, a necessidade de ensaios adicionais; e

  Autorizar o projeto de RPAS quando estiver assegurado que este atende aos requisitos de
  aeronavegabilidade aplicáveis.

  Processo de Autorização de Projeto de RPAS, destinada às operações de baixo risco (SAIL
  I ou II)

  O processo de autorização declaratória de projeto de RPAS, destinado às operações de baixo
  risco (SAIL I ou II), é composto pelas seguintes etapas:

  Preliminar;

  Inicial e submissão de dados técnicos; e

  Final.

  Caso a Anac identifique, em qualquer etapa, algum aspecto que impeça o andamento do processo
  de autorização, o requerente será informado pela Agência.

  Etapa preliminar

  Antes de iniciar um processo de autorização de projeto de RPAS, é recomendável que o requerente
  obtenha o máximo de informações sobre as regulamentações aplicáveis. Nesta fase, a Anac
  pode auxiliar respondendo sobre procedimentos para obtenção da autorização, orientando quanto
  ao material regulatório apropriado, políticas comuns ou outros materiais de orientação pertinentes.
  Os questionamentos podem ser realizados por meio do Fale com ANAC ou via endereço eletrônico
  cdnt.gcpp@anac.gov.br.

  De acordo com o projeto, podem ser necessários ensaios mecânicos, estruturais, de inflamabilidade,
  de qualificação, de voo de desenvolvimento, ensaios para verificação de funcionamento de
  sistemas e equipamentos instalados, entre outros. Conforme aplicável, os ensaios em voo
  devem ser realizados de acordo com as regras da Anac para operações experimentais. O requerente
  deve consultar a Instrução Suplementar nº E94.503-001 revisão C ou posterior, intitulada
  “Emissão de Certificado de Autorização de Voo Experimental para Aeronaves Remotamente Pilotadas”
  para mais informações sobre esse assunto.

  É importante que o requerente tenha atingido um certo grau de maturidade com seu projeto
  antes de requerer a abertura de processo de autorização declaratória de projeto de RPAS,
  ou seja, sem alterações no projeto, softwares e com horas de voo suficientes para atestar
  a segurança do RPAS. Os relatórios de resultados produzidos ao longo do desenvolvimento,
  contendo laudos, conclusões, especificações técnicas etc., poderão ser aceitos pela Anac,
  dependendo do controle, registro dos ensaios e da representatividade do protótipo em relação
  aos dados submetidos.

  Etapa inicial e submissão de dados técnicos

  Um processo de autorização declaratória de projeto de RPAS, destinado às operações de baixo
  risco (SAIL I ou II), é iniciado na Anac quando da submissão do formulário F-105-70, assim
  como da apresentação de toda a documentação administrativa e técnica referenciada no Apêndice
  C.

  A não apresentação de toda a documentação, no ato da abertura, ensejará no indeferimento
  do pedido.

  O requerente deverá apresentar uma declaração, devidamente preenchida e assinada pelo RT,
  atestando o cumprimento de todos os requisitos aplicáveis, conforme o parágrafo RBAC-E 94.401(b)(3).
  A declaração será via formulário de peticionamento.

  Etapa final

  Emissão do ofício de autorização e da folha de especificações. Após a aceitação pela Anac
  de toda a documentação administrativa e técnica, será emitido o ofício de autorização declaratória
  de projeto de RPAS acompanhado da folha de especificações do RPAS (Design Authorization
  Data Sheet - DADS), a qual será publicada no sítio eletrônico da Agência.

  Após a emissão do ofício de autorização e DADS, o processo será considerado encerrado pela
  Anac.

  O detentor de uma autorização de projeto de RPAS poderá modificar o projeto por meio do
  processo de Modificação de Projeto Autorizado de RPAS, por meio do preenchimento do formulário
  F-105-50.

  Suspensão ou cancelamento da Autorização de Projeto de RPAS

  A Anac poderá suspender ou cancelar a autorização de projeto de RPAS, a qualquer tempo,
  nos seguintes casos:

  Constatação de prestação de informações falsas, inexatas ou adulteradas;

  Por dificuldades do detentor da autorização em manter a aeronavegabilidade continuada; ou

  Quando a segurança de voo ou interesse público o exigir.

  Confidencialidade

  Todos os dados técnicos apresentados à Anac para substanciar a autorização são considerados
  de propriedade do detentor do projeto e, portanto, de caráter reservado. Por essa razão,
  não podem ser divulgados ou utilizados por terceiros, a não ser com expressa autorização
  de seu detentor.

  Pontos adicionais

  O RPAS com projeto autorizado deverá ser cadastrado no SISANT pelo detentor da autorização.

  A transferência do cadastro do RPAS, quando necessária, deverá ser feita entre o detentor
  da autorização e o operador.

  Caso ocorra evento que resulte em acionamento da terminação de voo (exceto em ensaio com
  essa finalidade específica), queda descontrolada, saída da área de voo designada ou pouso
  fora de zona designada, o detentor da autorização deverá comunicar o fato à ANAC, via endereço
  eletrônico cdnt.gcpp@anac.gov.br, em até 24 horas após a ocorrência.

