  APÊNDICE B - ANÁLISE DE RISCO


  B.1 GERAL

  B.1.1 Para análise do risco operacional e pertinência quanto ao uso desta IS, o requerente
  deverá avaliar o RPAS e considerar os seguintes aspectos:

  a) Especificação da área onde o RPAS será operado.

  Nota: Para efeitos desta IS, considerar apenas áreas controladas, rurais, remotas ou escassamente
  povoadas.

  b) Definir características operacionais do RPAS como máxima altitude de operação, máxima
  velocidade, limitações ambientais (vento, chuva, temperatura etc.);

  c) O tipo de RPA, ou seja, se asa-fixa, rotor, multirotor, híbrido etc;

  d) Dimensões da RPA, peso máximo de decolagem, necessidade de infraestrutura de apoio à
  operação;

  e) Programa de treinamento específico para operação do RPAS; e

  f) Propósito ou missão do RPAS: imageamento, pulverização, vigilância etc.

  B.1.2 As informações analisadas no item 5.4.4 desta IS, assim como outras que a Anac julgar
  necessárias, farão parte do Manual de Operação do RPAS que será apresentado como parte do
  processo de autorização de projeto, de preferência, seguindo os padrões estabelecidos na
  norma ASTM F2908-23.


  B.2 CÁLCULO DA CLASSE DE RISCO AO SOLO (GRC)

  B.2.1 Para o cálculo do GRC, o requerente deverá utilizar as máximas dimensões da RPA, em
  metros, considerando:

  a) Envergadura, no caso de aeronaves de asa fixa;

  b) Diâmetro do rotor, para helicópteros;

  c) Distância entre as pontas de rotores diametralmente opostos, no caso de multirotores.
  Para outras configurações de RPA, poderá ser apresentada uma proposta específica;

  d) Máxima velocidade da RPA definida pelo fabricante.

  B.2.3 A definição da classe de risco ao solo (GRC) deverá ser feita com base na Tabela 1.

