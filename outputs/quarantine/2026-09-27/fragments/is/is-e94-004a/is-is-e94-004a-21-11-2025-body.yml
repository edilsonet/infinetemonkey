  B.2.4 A classe de risco ao solo (GRC) pode variar de 1 até 3, devendo o requerente adotar
  a abordagem mais conservadora possível ao determinar a classificação do RPAS na Tabela 1.


  B.3 DETERMINAÇÃO DA DISTÂNCIA DE SEGURANÇA AO SOLO (GROUND RISK BUFFER)

  B.3.1 A Distância de Segurança ao Solo (GRB - Ground Risk Buffer) visa o estabelecimento
  de uma área segura envolvendo todo o volume de contingência que, em caso de necessidade
  de acionamento de um procedimento de emergência, a operação seja cessada dentro dessa área.

  B.3.2 Para RPAS com teto operacional de até 120 m (400 pés) AGL, recomenda-se a utilização
  da regra 1:1, ou seja, para 120 m de altura AGL usar uma Distância de Segurança ao Solo
  de, pelo menos, 120 m.

  B.3.3 Para RPAS com teto operacional superior aos 120 m (400 pés) AGL, ou dependendo do
  tipo do RPAS (se de asa-fixa ou multirotor), ou mesmo se possui sistema de paraquedas, a
  utilização da regra 1:1 pode não ser a mais conveniente e, nestes casos, recomenda-se que
  o requerente calcule a Distância de Segurança ao Solo utilizando a abordagem de planeio
  ou balística para a RPA, conforme o Anexo A do SORA 2.5.

  B.3.4 Caso a regra 1:1 não venha a ser utilizada, o requerente deverá apresentar a memória
  de cálculo utilizada para estimar a Distância de Segurança ao Solo, como anexo ao Manual
  do Operador. Em quaisquer dos casos, o valor estabelecido ou forma de cálculo deverá constar
  no Manual do Operador.


  B.4 DETERMINAÇÃO DA ÁREA ADJACENTE (ADJACENT AREA)

  B.4.1 O cálculo da Área Adjacente visa manter o nível de segurança da operação do RPAS uma
  vez que se tenha perdido o controle em voo (LOC) do RPA.

  B.4.2 Com base na máxima velocidade da RPA, o requerente deverá calcular o distanciamento
  de 3 min de voo sob essa condição. Se a distância exceder 35 km, usar esse valor; se ficar
  entre 5 e 35km, usar o valor calculado; e, por fim, se for inferior a 5km, usar esse valor.

  B.4.3 Com base nessa distância calculada, o requerente deverá instruir o operador a como
  avaliar a média da densidade populacional exposta que não deverá ser superior ao estabelecido
  para áreas remota, rural ou escassamente povoadas, conforme estabelecido por esta IS.

  B.4.4 Nenhuma provável falha simples do RPAS ou de um serviço externo que suporta a operação
  poderá resultar na saída da RPA do Volume de Operação. O requerente deve avaliar o projeto
  do RPAS e declarar que atende essa condição.

  Nota: Para efeitos desta IS, uma falha é dita provável quando é esperado que aconteça uma
  ou mais vezes durante a vida operacional do produto.


  B.5 CÁLCULO DO SAIL

  A.5.1 Para efeitos desta IS, o cálculo do SAIL considera apenas a classe de risco aéreo
  ARC-a, ou seja, toda operação BVLOS deverá ocorrer com segregação do espaço aéreo via NOTAM
  emitido pelo Decea.

  A.5.2 A definição SAIL deverá ser feita com base na Tabela 2.

  Tabela 2 - Determinação do SAIL

  Determinação do SAIL

  Classe de risco ao solo (GRC)

  Classe de risco aéreo (ARC-a)

  1

  SAIL I

  2

  SAIL I

  3

  SAIL II


  B.5.3 O requerente, ao classificar o risco ao solo (GRC) do seu RPAS como 1 ou 2, definirá
  a operação como de SAIL I e não poderá fazer uso da aeronave em cenários operacionais equivalentes
  ao SAIL II ou superiores. Em contrapartida, um RPAS classificado como de SAIL II poderá
  também ser utilizado em cenários de menor risco como o de SAIL I.


  B.6 DETERMINAÇÃO DOS OSOS E SUAS EVIDÊNCIAS

  B.6.1 Com base no SAIL definido acima, o requerente deverá cumprir com os OSO obrigatórios
  de acordo com o nível de robustez definido na Tabela 3 (Baixo, Médio ou Alto).

