  B.6.4 OSO #01 - O requerente deve prover os meios necessários para garantir que o operador
  do RPAS seja competente (Obrigatório somente para SAIL II - robustez baixa):

  Critério: O operador deve conhecer o RPAS que está sendo utilizado e, no mínimo, possui
  os seguintes procedimentos operacionais: listas de verificação, manutenção, treinamento,
  responsabilidades e deveres associados.

  Evidência: O requerente deve fornecer ao operador documentação que contenham, pelo menos,
  o manual de operação do RPAS, lista de verificação pré e pós-voo, procedimentos de manutenção,
  treinamento mínimo necessário e definição de responsabilidades e deveres do operador. Para
  elaboração dos documentos exigidos, a utilização das normas ASTM F2908-23, F3330-23, F3366-19
  e F3364-19 é considerado como meio aceitável.

  B.6.3 OSO #03 - O requerente deve prover os meios necessários que possibilitem que o RPAS
  seja mantido por entidade competente (Aplicável para SAIL I e II - robustez baixa):

  Critério: As instruções de manutenção foram definidas pelo fabricante do RPAS; a equipe
  de manutenção é competente, recebeu autorização para realizar a manutenção e utiliza as
  instruções definidas pelo fabricante.

  Evidência: O requerente deve fornecer procedimentos de manutenção adequados para o responsável
  pela manutenção. Para a elaboração desses documentos recomenda-se a utilização das normas
  ASTM F2483-18, F3366-19 e F3600-22. O requerente deverá elaborar os documentos e submeter
  à Anac como evidência.

  B.6.4 OSO#06 - O requerente deve assegurar que o desempenho do enlace C2, C3 é apropriado
  para a operação (Obrigatório somente para SAIL II - robustez baixa):

  Critério: O requerente deve verificar que a performance e uso de espectro radioelétrico
  são adequadas para a condução segura da operação. O RPAS deve prover meios para que o piloto
  remoto consiga monitorar continuamente a performance do link garantindo, assim, que este
  atende aos requisitos operacionais.

  Demonstração: O requerente deve declarar que atende ao critério acima, assim como declarar
  aderência quanto aos aspectos regulados pela Anatel. Para análise do atendimento a este
  requisito recomenda-se a utilização da norma ASTM F3002-14.

  B.6.5 OSO#07 - O requerente deve prover os meios necessários que possibilitem que o RPAS
  seja inspecionado (inspeção de produto) para garantir a consistência com o ConOps (Aplicável
  para SAIL I e II - robustez baixa):

  Critério: O requerente deve definir a periodicidade dos procedimentos de verificação do
  RPAS de maneira a garantir a segurança da operação.

  Demonstração: O requerente deverá indicar em qual documento a periodicidade dos procedimentos
  de verificação foi estabelecida. Para a elaboração desse documento recomenda-se a utilização
  da norma ASTM F2909-19. O requerente deverá elaborar os documentos e submeter à Anac como
  evidência.

  B.6.6 OSO#08 - O requerente deve prover os meios necessários que possibilitem que os procedimentos
  operacionais sejam definidos, validados e seguidos (SAIL I - robustez baixa; SAIL II - robustez
  média):

  Critério #1 (Aplicável para SAIL I e II): O requerente deverá fornecer um manual de instruções
  de operação do RPAS que contenha, no mínimo, os seguintes elementos: (1) planejamento de
  voo; (2) inspeções pré e pós-voo; (3) procedimentos para avaliar as condições meteorológicas
  antes e durante a missão; (4) procedimentos para lidar com condições meteorológica adversas
  inesperadas (por exemplo, quando há chuva durante a operação e a RPAS não está aprovada
  para tal condição); (5) procedimentos normais; (6) procedimentos de contingência (para lidar
  com situações anormais); (7) procedimentos de emergência; e (8) procedimentos de comunicação
  de ocorrências.

  Critério #2 (SAIL I): O requerente deverá fornecer um manual de instruções de operação do
  RPAS que contenha, no mínimo, os seguintes elementos: (1) distribuição e atribuição de tarefas;
  (2) lista de verificação para garantir que a equipe está realizando adequadamente as tarefas
  atribuídas.

  Critério #2 (SAIL II): Em adição ao critério #2 (SAIL I), o requerente deverá ter procedimentos
  para lidar com erro humano na operação do RPAS.

  Critério #3 (Aplicável para SAIL I e II): O requerente deverá fornecer ao operador uma proposta
  de Plano de Resposta a Emergências (ERP) que contenha, no mínimo, os seguintes elementos:
  (1) seja conveniente para potenciais situações secundárias resultantes do impacto da RPA
  com o solo como, por exemplo, fogo, explosão ou vazamento de substâncias que ofereçam perigo;
  (2) mitigue efetivamente todos os efeitos secundários considerados perigosos resultantes
  de uma colisão da UA com o solo; (3) delineia claramente todas as responsabilidades e obrigações
  da tripulação remota; (4) seja de fácil utilização e treinamento de sorte que a tripulação
  remota possa efetivamente executar o procedimento mesmo sob pressão; (5) contenha uma lista
  de situações previstas de emergência com seus efeitos secundários; (6) procedimento para
  cada situação de emergência previamente identificada; (7) lista de contatos relevantes como,
  por exemplo, Decea, polícia, bombeiros, socorristas, etc.


  Demonstração: O requerente deverá fornecer ao operador uma proposta de um Plano de Resposta
  a Emergências que contenha as informações dos critérios supracitados. Para elaboração desse
  documento recomenda-se a utilização das normas ASTM F2908-18 e F2909-19. O requerente deverá
  submeter o documento à ANAC com evidências.


  B.6.7 OSO#09 - O requerente deve prover os meios necessários que possibilitem que a Tripulação
  remota seja treinada, atualizada e capaz de controlar uma situação anormal (Aplicável para
  SAIL I e II - robustez baixa):

  Critério: O requerente deverá definir um treinamento mínimo, teórico e prático, para operação
  do RPAS. O treinamento deverá cobrir aspectos como: regulamentação; princípios de uso do
  espaço aéreo; disciplina de voo e segurança da aviação; fatores humanos; meteorologia; navegação;
  descrição do RPAS; procedimentos operacionais e de ERP; e uso de serviços externos, quando
  aplicável.

  Demonstração: O requerente deverá fornecer documento contendo o treinamento mínimo especificado
  para a operação do RPAS. Para a elaboração desse documento recomenda-se a utilização da
  norma ASTM F3266-18. O requerente deverá elaborar o documento e submeter à Anac como evidência.

  B.6.8 OSO#13 - O requerente deve prover os meios necessários que possibilitem que os serviços
  externos de apoio às operações de RPAS sejam adequados para a operação (Aplicável para SAIL
  I e II - robustez baixa):

  Critério: O requerente deve estabelecer o nível mínimo de desempenho de qualquer serviço
  externo e necessário para a segurança do voo, adequado para a operação pretendida. São exemplos
  de serviços externos: GNSS (GPS ou outra constelação de satélites), uso de rede de telefonia
  móvel, informações de meteorologia, banco de dados, etc.

  Demonstração: Listar os serviços externos com a especificação do nível mínimo de desempenho
  necessário para o tipo de serviço. Para análise de atendimento, com relação ao uso de GNSS,
  recomenda-se a utilização da norma EUROCAE ED-301.

  B.6.9 OSO#16 - O requerente deve prover os meios necessários que possibilitem coordenação
  entre tripulações múltiplas (Aplicável para SAIL I e II - robustez baixa):

  Critério #1: Quando a aeronave exigir mais de uma pessoa para sua operação, o requerente
  deve instruir o operador a como estabelecer procedimentos de coordenação e comunicação entre
  os membros da equipe. Tais procedimentos devem avaliar a forma de comunicação, sua robustez
  e eficiência para a operação desejada.

  Critério #2: O requerente deverá definir o treinamento mínimo, teórico e prático, para operações
  em que se requeira a coordenação entre membros da equipe.

  Demonstração: O requerente deverá fornecer documento contendo o treinamento mínimo especificado
  para a coordenação de membros da equipe. Para a elaboração desse documento recomenda-se
  a utilização da norma ASTM F3266-18. O requerente deverá elaborar o documento e submeter
  à Anac como evidência.

  B.6.10 OSO#17 - O requerente deve prover os meios necessários que possibilitem que a tripulação
  remota esteja apta a operar (Aplicável para SAIL I e II - robustez baixa):

  Critério: A política para definir como a tripulação remota declara estar apta a operar (antes
  de uma operação) está documentada. A declaração de aptidão para operar da tripulação remota
  (antes de uma operação) é baseada na política definida pelo requerente.

  Demonstração: O requerente deve fornecer ao operador documentação que o auxilie na elaboração
  de procedimentos para identificar que a tripulação remota está apta a operar. O documento
  elaborado deverá ser apresentado à Anac como evidência.

  B.6.11 OSO#20 - Uma avaliação de fatores humanos foi realizada e a interface homem-máquina
  (IHM) foi considerada apropriada para a operação (Obrigatório somente para SAIL II - robustez
  baixa):

  Critério: Fatores humanos e a interface homem-máquina (IHM) foram avaliados pelo requerente.
  Deve-se assegurar que as informações apresentadas são claras, sucintas e não causam fadiga
  extrema ou confusão ao piloto remoto.

  Demonstração: O requerente deve declarar que o RPAS atende ao critério.

  B.6.12 OSO#23 - O requerente deve prover os meios necessários que possibilitem que as condições
  ambientais para operações seguras sejam definidas, mensuráveis e seguidas (Aplicável para
  SAIL I e II -robustez baixa):

  Critério #1: As condições ambientais para operações seguras são definidas e refletidas no
  manual de voo ou documento equivalente.

  Demonstração: O requerente deverá declarar que o RPAS atende as condições ambientais especificadas
  para as operações pretendidas.


  APÊNDICE C - DOCUMENTOS NECESSÁRIOS PARA ABERTURA DO PROCESSO


  C.1 Documentos Administrativos

  C.1.1 Formulário F-105-70.

  a) Da solicitação de abertura do processo de autorização declaratória de projeto de RPAS.

  b) Informações do requerente.

  c) Declaração de responsabilidade técnica pelo projeto de RPAS informando nome, endereço
  e CPF ou número de registro no CREA do RT. Incluir o número da Anotação de Responsabilidade
  Técnica (ART) relativa ao serviço de engenharia a ser executado que contenha descrição do
  projeto submetido à Anac.

  Nota 1 - Deve ser informada uma ART válida de obra ou serviço específica para o projeto
  que se pretenda autorizar, emitida em nome do RT. Caso o requerente informe uma ART em nome
  da empresa, deve ser informada também uma ART de cargo ou função que demonstre o vínculo
  da empresa com um engenheiro com atribuição adequada no CREA.

  Nota 2 - A ART deve estar quitada para ser considerada válida.

  d) Declaração isentando a Anac de quaisquer ônus e responsabilidades por eventuais danos
  ocorridos na aeronave, ou danos a terceiros, durante a realização dos ensaios em solo e
  em voo.

  e) Declaração de cumprimento;

  f) Informações do RPAS.


  C.2 Documentos Técnicos

  C.2.1 Manual de operação do RPAS, incluindo as seguintes seções: capa do manual; tabela
  com controle de revisões; introdução; informações gerais e descrição técnica do RPAS; performance
  (desempenho) e limitações do RPAS; procedimentos normais de operação; procedimentos de emergência;
  peso e balanceamento e lista de equipamentos; instruções de manuseio, serviço, manutenção
  de campo e aeronavegabilidade continuada; e suplementos ao manual de operação (se aplicável).
  Para a elaboração deste manual, recomenda-se a norma ASTM F2908-23.

  C.2.2 Lista de verificação (check-list) pré e pós-voo. O requerente deverá elaborar uma
  lista de verificação, baseada no manual de operação, manual manutenção ou outro documento,
  de maneira a orientar o operador.

  C.2.3 Manual de manutenção. Para a elaboração desse manual, recomenda-se o uso da norma
  ASTM F3366-19.

  C.2.4 Programa de treinamento mínimo necessário. O fabricante deverá elaborar um programa
  de treinamento mínimo para operação do RPAS. Para elaboração deste documento, recomenda-se
  a utilização da norma ASTM F3330-23.

  C.2.5 Distribuição de responsabilidades e deveres associados.

  C.2.6 Declaração desempenho do enlace de C2. O requerente deverá declarar que o enlace de
  C2 do RPAS possui desempenho adequado; que fora testado a uma distância pelo menos 20% maior
  que o máximo alcance especificado entre o RPS e a RPA, conforme item 5.4.4 da IS nº E94-002A.
  O requerente deverá ainda atestar que o RPAS possui certificado de homologação de seu enlace
  de C2 junto à Anatel.

  C.2.7 Declaração de que o RPAS fornece as seguintes informações para o piloto remoto:

  a) Imagem de vídeo frontal da RPA, caso se intente operações BVLOS com alcance superior
  a 5 km;

  b) Altitude barométrica da RPA, caso se intente autorização da referida RPA para voo acima
  de 400 pés em relação ao solo;

  c) Altura geométrica da RPA em relação ao nível do solo;

  d) Ângulos de arfagem, inclinação e proa da RPA;

  e) Direção de voo da RPA;

  f) Velocidades necessárias para operação segura da RPA;

  g) Parâmetros essenciais do motor da RPA;

  h) Indicação e alertas de autonomia da RPA (ex: nível de combustível e de carga da bateria);

  i) Indicação da qualidade do enlace de comando e controle (ex: intensidade do sinal, taxa
  de erro de bit - BER, etc.);

  j) Posição atual da RPA sobreposta a mapa que também indique a área onde o voo foi autorizado.

  Nota 1: As taxas de atualização de informação e atrasos na apresentação das informações
  de voo não deverão comprometer a capacidade do piloto em controlar a RPA.

  C.2.8 Declaração de que o RPAS fornece os seguintes alertas ao piloto remoto:

  a) Degradação das informações de posição e navegação do RPAS;

  b) Degradação do enlace de comando e controle;

  c) Quantidade de combustível que comprometa a operação segura da RPA, se aplicável;

  d) Carga baixa de baterias relacionadas a propulsão, comando ou controle;

  e) Alertas que indiquem risco de exceder os limites da área onde o voo foi autorizado;

  f) Alertas que indiquem risco de exceder os limites de altura ou altitude em que o voo foi
  autorizado;

  g) Outros alertas que tenham sido definidos como relevantes a partir da Análise de Risco
  de Projeto de RPAS.

  Nota 1: Os alertas deverão ser sempre apresentados com tempo suficiente para que o piloto
  possa tomar as providências necessárias em relação ao evento ocorrido.

  C.2.9 Declaração de que o RPAS possui sistema de navegação adequado para operação. O requerente
  deve declarar que os sistemas de posicionamento, navegação e tempo do RPAS são adequados.
  Para análise e fundamentação da declaração, recomenda-se o uso da norma ASTM F3609-25.

  C.2.10 Declaração de que o RPAS possui capacidade de recuperação de emergência.

  a) A capacidade de recuperação de emergências tem o objetivo de prevenir riscos a terceiros
  e deve ser constituído por:

  i) Um sistema, procedimento ou função de terminação do voo que objetive finalizar o voo
  imediatamente, ou;

  ii) Um procedimento de recuperação de emergência que seja implementado por meio de comandos
  fornecidos pelo piloto ou pelos sistemas embarcados, o qual pode incluir um curso automático
  pré-programado para alcançar uma área pré-definida de pouso, ou;

  iii) Qualquer combinação das opções anteriores.

  b) A capacidade de recuperação de emergências deve ser efetiva para lidar com os seguintes
  cenários de falha:

  i) Perda de enlace C2;

  ii) Perda de capacidade de navegação;

  iii) Perda de fonte elétrica primária; e

  iv) Outras falhas que possam ensejar na saída do RPA do volume de operação.

  Nota 1: A capacidade de recuperação de emergência deve ser executável em todo envelope de
  voo na mais adversa combinação de condições ambientais e operacionais.

  Nota 2: A capacidade de recuperação de emergência deve ser salvaguardada de interferência
  que possa resultar em operação inadvertida ou não autorizada.

  Nota 3: O uso de explosivos para realizar a destruição em voo da RPA não é um meio aceitável
  para cumprir com este requisito.

  Nota 4: Não confundir capacidade de recuperação de emergência com Plano de Resposta a Emergências
  (ERP).

  C.2.11 Declaração de que o RPA possui sistema de iluminação adequado para operação.

  a) O sistema de iluminação externa da RPA deve estar em funcionamento tanto para operações
  diurnas, quanto noturnas. A iluminação deverá incluir a instalação de luz anticolisão estroboscópica
  de cor branca ou vermelha.

  b) O sistema de iluminação da RPA deve permitir uma efetiva visualização da RPA, de modo
  que a aeronave seja avistada por pessoas que possam estar próximas do local de operação
  da RPA. Deve ser demonstrado que a aeronave é visível, mesmo à noite, à distância tal que
  permita que a aeronave seja vista, no mínimo, 30 segundos antes de chegar ao ponto do qual
  foi avistada, considerando para isto a máxima velocidade em que a aeronave pode se deslocar.

  c) Toda RPA que opere acima de 400 pés em relação ao solo deverá possuir sistema de iluminação
  que permita a visualização da RPA a uma distância mínima de 2 km, considerando uma inclinação
  de até 5 graus em relação ao plano horizontal de voo da RPA. De forma alternativa a este
  item, é facultado ao requerente cumprir os requisitos do RBAC 23, seção 23.1401 ou RBAC
  27, seção 27.1401, conforme aplicável.

  d) Para RPA que opere em voos noturnos, a instalação de luzes de navegação é obrigatória.'
