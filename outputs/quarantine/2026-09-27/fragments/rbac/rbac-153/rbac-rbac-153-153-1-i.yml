title: 153.1(i)
text: '(i) piloto reportar ter colidido com um ou mais de um animal;

  (ii) pessoal de manutenção do operador aéreo identificar restos de material orgânico, com

  ou sem danos à aeronave;

  (iii) pessoal de solo reportar que visualizou impacto de aeronave com animal(is);

  (iv) carcaça(s) de animal(is) for(em) localizada(s) em até 60 m (sessenta metros) do eixo

  da(s) pista(s) de pouso e decolagem (a não ser que outra razão para a morte do animal seja

  identificada); ou'
