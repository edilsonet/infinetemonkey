title: 153.15(e)
text: '(e) O operador de aeródromo que detiver o direito de oferecer serviço público em mais
  de um

  aeródromo pode acumular em um único profissional atividades comuns aos diversos sítios

  aeroportuários, observadas as recomendações do Apêndice A deste Regulamento.'
