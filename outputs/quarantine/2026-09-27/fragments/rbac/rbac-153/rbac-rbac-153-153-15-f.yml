title: 153.15(f)
text: '(f)

  A ANAC poderá não aceitar a designação ou determinar a substituição de responsáveis

  designados para as funções listadas no parágrafo 153.15(a) nos casos de comprovado histórico
  de

  condutas ou desempenho inadequados.

  (1)

  Para os efeitos do disposto no parágrafo 153.15(f), considera-se com comprovado

  histórico de condutas ou desempenho inadequados o profissional designado que, nos últimos
  5 (cinco)

  anos, tenha, enquanto ocupante de posição de gestão requerida pela ANAC, comprovada

  responsabilidade direta por irregularidade que tenha dado origem a medida administrativa
  de

  suspensão ou restrição das operações por mais de 90 (noventa) dias ou cassação de certificado
  ou

  autorização, aplicada a provedor de serviço de aviação civil certificado pela ANAC.

  (Redação dada pela Resolução nº 503, de 07.02.2019)'
