title: 153.301(a)
text: '(a) O operador de aeródromo deve estabelecer, implantar e manter operacional um Sistema
  de

  Resposta à Emergência Aeroportuária (SREA) em conformidade à regulamentação específica

  vigente, adequado ao tipo e ao porte das operações aéreas do aeródromo.'
