title: 153.5(e)
text: '(e) Os requisitos e parâmetros mínimos de segurança operacional são estabelecidos por
  classe

  de aeródromo, classificados segundo critérios constantes na seção 153.7, estando disposta
  no

  Apêndice A deste Regulamento a exigência de cumprimento e especificidades de cada requisito
  por

  classe existente de aeródromo.'
