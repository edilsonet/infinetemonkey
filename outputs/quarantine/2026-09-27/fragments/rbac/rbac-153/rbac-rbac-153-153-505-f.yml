title: 153.505(f)
text: '(f)

  Os procedimentos de identificação dos perigos no sítio aeroportuário devem contemplar as

  seguintes estruturas e observar os requisitos descritos em Instrução Suplementar específica:
  (Vide IS

  nº 153.503-001)

  (1)

  vegetação;

  (2)

  focos secundários;

  (3)

  valas de drenagem e galerias de água pluvial;

  (4)

  dispositivos de esgotamento sanitário e sistema de tratamento de efluentes;

  (5)

  lagos, áreas alagadiças e demais formas de acúmulo de água;

  (6)

  resíduos sólidos;

  (7)

  edificações, equipamentos e demais implantações;

  (8)

  sistema de proteção; e

  (9)

  demais estruturas que possam atrair aves e outros animais.'
