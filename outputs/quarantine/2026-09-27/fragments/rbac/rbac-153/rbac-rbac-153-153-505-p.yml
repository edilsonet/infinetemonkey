title: 153.505(p)
text: '(p) No intuito de identificar a eficácia do PGRF, o operador de aeródromo deve estabelecer

  avaliações periódicas do Programa, no período máximo de 12 (doze) meses ou sempre que ocorrer

  evento de segurança operacional relacionado à fauna.'
