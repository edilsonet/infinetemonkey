title: 153.505(q)
text: '(q) As avaliações periódicas de um PGRF devem ser capazes de identificar:

  (1)

  a efetividade do PGRF na mitigação do risco provocado pela fauna; e

  (2)

  aspectos dos perigos existentes descritos na IPF que devem ser reavaliados.'
