cite: 153.51(a)
title: 153.51(a)
text: '(a) O operador de aeródromo deve desenvolver, implantar, manter e garantir a melhoria

  contínua de um SGSO adequado à complexidade das operações realizadas sob sua responsabilidade

  e que:

  (1)

  estabeleça uma política de segurança operacional e seus objetivos estratégicos;

  (2)

  defina uma estrutura organizacional e designe os responsáveis pela segurança operacional

  em suas atividades;

  (3)

  estabeleça metas e indicadores de desempenho para melhorar o nível de segurança

  operacional no aeródromo;

  (4)

  identifique os perigos e gerencie os riscos à segurança operacional em suas atividades;

  (5)

  garanta a aplicação das ações corretivas necessárias a manter um nível aceitável de

  desempenho da segurança operacional;

  (6)

  preveja a supervisão permanente e a avaliação periódica do nível de segurança

  operacional alcançado, com vistas a melhorar continuamente o nível de segurança operacional
  no

  aeródromo;

  (7)

  garanta coordenação entre suas atividades e aquelas estabelecidas para o Sistema de

  Resposta à Emergência Aeroportuária;

  (8)

  promova o treinamento e a divulgação do SGSO no âmbito de suas responsabilidades,

  para assegurar que os recursos humanos necessários estejam aptos a realizar suas atividades;

  (9)

  contenha a documentação e registros dos processos voltados para a segurança

  operacional, incluindo mecanismos para o seu controle e atualização; e

  (10) contenha um conjunto de ferramentas gerenciais e métodos organizados de forma

  sistêmica para apoiar as decisões a serem tomadas pelo operador de aeródromo em relação
  ao risco

  provocado pela fauna à segurança operacional, conforme estabelecido na Subparte H deste

  regulamento. (Incluído pela Resolução nº 611, de 09.03.2021)'
