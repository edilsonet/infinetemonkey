title: 153.701(h)
text: '(h) O disposto na Emenda 03 deste Regulamento aplica-se aos processos iniciados em
  data

  anterior à sua emissão, sem necessidade de ratificação ou adequação dos atos já praticados,
  observado

  o disposto no parágrafo 153.701(a)(1).'
