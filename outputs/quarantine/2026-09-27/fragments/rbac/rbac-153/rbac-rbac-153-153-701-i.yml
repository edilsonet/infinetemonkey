cite: 153.701(i)
title: 153.701(i)
text: '(i)

  O operador de aeródromo tem até 6 (seis) meses, contados a partir da data de emissão da

  Emenda 03 deste Regulamento, para adequar o processo de designação dos responsáveis listados
  no

  parágrafo 153.15(a) ao estabelecido nas seções 153.15, 153.23 e 153.25.'
