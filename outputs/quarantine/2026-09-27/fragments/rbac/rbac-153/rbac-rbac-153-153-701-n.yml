text: '(n) O operador de aeródromo tem até 12 (doze) meses, a partir da entrada em vigor da
  Emenda

  nº 04 deste Regulamento, para se adequar às exigências da seção 153.423 que não eram aplicáveis
  à

  sua Classe na vigência da Resolução nº 279/2013.'
