title: 153.701(t)
text: '(t)

  O operador de aeródromo que se enquadre na aplicabilidade do parágrafo 153.501(e) terá o

  prazo máximo de 6 (seis) meses para obtenção do PGRF em conformidade a este regulamento,

  contado da data da ciência da aceitação da IPF dada pela ANAC, respeitado o prazo determinado
  no

  parágrafo 153.501(g).


  Data da emissão: 15 de março de 2021.


  (1)

  O prazo máximo mencionado no parágrafo 153.701(s) é suspenso pelo início da análise

  do processo pela ANAC, recomeçando o seu curso a partir da data de notificação feita ao
  operador

  de aeródromo interessado quanto à decisão.

  (2)

  Para fins de sanção, considera-se que o operador incorre em nova infração a cada ano

  subsequente ao vencimento do prazo estabelecido no parágrafo 153.701(s).'
