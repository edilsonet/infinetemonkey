title: apendice-a-do-rbac-154-cores-para-luzes-aeronauticas-de-superficie-sinalizacoes-horizontais(a)
text: '(a) As cromaticidades e os fatores de luminância de cores comuns, cores de materiais

  retrorrefletivos e cores de sinalizações verticais e painéis luminosos (internamente iluminados)

  devem ser determinados de acordo com as seguintes condições padrão:

  (1) ângulo de iluminação: 45o;

  (2) direção de visão: perpendicular à superfície; e

  (3) fonte luminosa: fonte luminosa padrão da CIE D65.'
