text: '(b) Diferenciação entre luzes com fontes luminosas do tipo filamento

  (1) Se houver uma exigência de se diferenciar o amarelo do branco, essas cores devem ser

  dispostas em proximidade física ou de tempo como, por exemplo, piscando sucessivamente a
  partir

  do mesmo farol.

  (2) Se houver uma exigência de se diferenciar o amarelo do verde e/ou do branco, como, por

  exemplo, em luzes de eixo da pista de táxi de saída, as coordenadas y da luz amarela não
  devem ser

  superiores a um valor de 0,40.

  NOTA - Os limites de branco foram baseados na suposição de que serão utilizados em situações
  em

  que as características (temperatura de cor) da fonte de luz serão substancialmente constantes.

  (3) A cor branca variável é destinada a ser usada apenas para luzes que precisam ser variadas

  em intensidade, por exemplo, para evitar ofuscamento. Se essa cor tiver de ser diferenciada
  do

  amarelo, as luzes devem ser projetadas e operadas de modo que:'
