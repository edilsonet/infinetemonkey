title: apendice-a-do-rbac-154-cores-para-luzes-aeronauticas-de-superficie-sinalizacoes-horizontais(c)
text: '(c) Medição de cores para lâmpadas tipo filamento e de tipo estado sólido

  (1) As cores das luzes aeronáuticas de superfície devem ser verificadas de forma a estarem

  dentro dos limites especificados na Figura AA-1 ou AA-1A , conforme apropriado, pela medição
  em

  cinco pontos dentro da área limitada pela curva de isocandela mais interna (gráficos de
  isocandela de

  referência no Apêndice B), com operação a corrente ou voltagem classificadas.'
