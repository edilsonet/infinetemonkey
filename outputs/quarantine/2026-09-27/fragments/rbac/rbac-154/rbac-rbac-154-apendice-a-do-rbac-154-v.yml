text: '(v) Verde

   Limite amarelo


  x = 0,313

   Limite branco


  y = 0,243 + 0,670x

   Limite azul


  y = 0,493 - 0,524x

  ▪ Fator de luminosidade


  β = 0,10 mínimo

  (condição diurna)

  ▪ Luminosidade relativa


  5% (mínimo)

  ao branco (condição noturna)

  30% (máximo)


