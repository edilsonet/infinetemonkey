  3. Essas coberturas de feixe permitem o deslocamento da cabine de comando do eixo de pista
  até

  distâncias da ordem de 12m, como pode ocorrer no final das curvas.

  4. Ver as NOTAS coletivas para as Figuras AB-12 a AB-21.


  Data da emissão: 16 de junho de 2021.


