  Figura AB-20. Diagrama de isocandela para as luzes de alta intensidade de proteção da pista
  de

  pouso e decolagem, configuração B.

  NOTAS:

  1. Embora as luzes pisquem em operação normal, a intensidade da luz é especificada como
  se as luzes

  fossem ininterruptas para lâmpadas incandescentes.

  2. Ver as NOTAS coletivas para as Figuras AB-12 a AB-21.


  Figura AB-21. Pontos de coordenadas a serem usados para cálculo da intensidade média das
  luzes

  do eixo da pista de táxi e de barras de parada.

  NOTAS coletivas para as Figuras AB-12 a AB-21

  1. As intensidades especificadas nas Figuras AB-12 a AB-20 são de luzes verde e amarela
  para as

  luzes de eixo de pista de táxi, luz amarela para proteção de pista de pouso e decolagem
  e luz vermelha

  para as luzes de barras de parada.

  2. As Figuras AB-12 a AB-20 mostram as intensidades mínimas de luz permitidas. A intensidade

  média do feixe principal é calculada por meio do estabelecimento de pontos de coordenadas,

  conforme demonstrado na Figura AB-21, e utilizando os valores de intensidade medidos em
  todos os

  pontos de coordenadas, localizados dentro e sobre o perímetro do retângulo, que representa
  o feixe

  principal. O valor médio é a média aritmética das intensidades de luz medida em todos os
  pontos de

  coordenadas considerados.

  3. Nenhum desvio no feixe principal ou no feixe mais interno é aceitável, conforme o caso,
  quando

  a fixação das luzes estiver adequadamente direcionada.

  4. Os ângulos horizontais são medidos em relação ao plano vertical através do eixo da pista,
  exceto

  em curvas onde estes são medidos em relação à tangente da curva.

  5. Os ângulos verticais são medidos a partir da inclinação longitudinal da superfície da
  pista de táxi.

  6. A importância de uma manutenção adequada não pode ser subestimada. Tanto a intensidade
  média,

  quando aplicável, quanto a intensidade especificada nas curvas correspondentes de isocandela,
  nunca

  devem cair para um valor inferior a 50% do valor mostrado nas figuras, devendo o operador
  de

  aeródromo manter um nível de emissão de luz superior à intensidade média mínima especificada.


  Data da emissão: 16 de junho de 2021.


  7. A unidade de luz deve ser instalada de modo que o feixe principal ou o feixe mais interno,
  conforme

  o caso, esteja alinhado dentro de meio grau do requisito especificado.


  Data da emissão: 16 de junho de 2021.


