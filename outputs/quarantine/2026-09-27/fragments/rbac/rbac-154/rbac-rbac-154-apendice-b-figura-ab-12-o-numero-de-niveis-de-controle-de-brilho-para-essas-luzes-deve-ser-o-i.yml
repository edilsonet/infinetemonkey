title: apendice-b-figura-ab-12-o-numero-de-niveis-de-controle-de-brilho-para-essas-luzes-deve-ser-o(i)
text: '(i) Localização

  (A) O indicador de posição de parada deve estar localizado suficientemente próximo ou

  em conjunto com a unidade de orientação de azimute, de modo que o piloto possa observar
  o azimute

  e os sinais de parada sem ter que mudar a posição da cabeça.

  (B) O indicador da posição de parada deve ser utilizável, ao menos, pelo piloto que ocupa

  o assento da esquerda.

  (ii) Características

  (A) A informação da posição de parada fornecida pelo indicador, para um determinado

  tipo de aeronave, deve levar em consideração a gama prevista de variações na altura dos
  olhos do

  piloto e/ou do ângulo de visão.

  (B) O indicador da posição de parada deve demonstrar a posição de parada à aeronave

  para a qual oferece orientação, devendo oferecer informações de aproximação para permitir
  que o

  piloto desacelere gradualmente a aeronave até a parada total na posição de estacionamento
  desejada.

  (C) O indicador de posição de parada deve fornecer informações de aproximação em

  distâncias de, no mínimo, 10 m.

  (D) Quando a orientação de parada for indicada pela mudança de cor, o verde deve ser

  utilizado para indicar que a aeronave pode prosseguir e o vermelho para indicar que o ponto
  de parada

  já foi alcançado, ressalvando-se que, durante uma distância curta anterior ao ponto de parada,
  uma

  terceira cor possa ser utilizada para advertir que o ponto de parada está próximo.

  (ee) Sistema avançado de orientação visual de estacionamento

  (1) Aplicação

  NOTA 1 - Os sistemas avançados de orientação visual para estacionamento (Advanced visual
  docking

  guidance systems - A-VDGS) compreendem aqueles que, além de informação básica e passiva
  de

  azimute e posição de parada, proporcionam aos pilotos informação ativa de orientação (usualmente

  baseada em sensores), tais como tipo de aeronave, distância a percorrer e velocidade de
  aproximação

  da posição de estacionamento. Geralmente, a informação de orientação para estacionamento
  é

  disponibilizada em um único dispositivo de apresentação visual.

  NOTA 2 - Um A-VDGS pode prover informação de orientação para estacionamento em três etapas:

  a aquisição da aeronave pelo sistema, o alinhamento da aeronave em azimute e informação
  sobre a

  posição de parada.


  Data da emissão: 16 de junho de 2021.'
