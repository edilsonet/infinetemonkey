title: apendice-b-figura-ab-12-o-numero-de-niveis-de-controle-de-brilho-para-essas-luzes-deve-ser-o(v)
text: '(v) A intensidade de luz vermelha e a amplitude dos feixes das luzes de barra de parada

  devem estar em conformidade com as especificações do Apêndice B, Figuras AB-12 a AB-16,

  conforme for o caso.

  (vi) Quando as barras de parada forem especificadas como componentes de um sistema

  avançado de controle e orientação de movimentação de superfície e quando, do ponto de vista

  operacional, intensidades mais altas forem necessárias para manter os movimentos em solo
  a certa

  velocidade, quando em visibilidades muito baixas ou em condições de muita luminosidade durante
  o


  Data da emissão: 16 de junho de 2021.


  dia, a intensidade da luz vermelha e a amplitude dos feixes das luzes da barra de parada
  devem estar

  em conformidade com as especificações do Apêndice B, Figura AB-17, AB-18 ou AB-19.

  NOTA - As barras de parada de alta intensidade somente devem ser utilizadas em caso de absoluta

  necessidade e de acordo com um estudo específico.

  (vii) Quando for necessário um equipamento com feixe amplo, a intensidade da luz vermelha

  e a amplitude dos feixes das luzes da barra de parada devem estar de acordo com as especificações

  do Apêndice B, Figura AB-17 ou AB-19.

  (viii) O circuito de luzes deve ser projetado de forma que:

  (A) as barras de parada localizadas transversalmente à pista de táxi de entrada sejam

  ligadas e desligadas seletivamente;

  (B) as barras de parada localizadas transversalmente às pistas de táxi exclusivamente

  utilizadas como pistas de saída sejam ligadas e desligadas seletivamente ou em grupos;

  (C) quando uma barra de parada estiver acesa, quaisquer luzes do eixo da pista de táxi

  instaladas além da barra de parada sejam apagadas por uma distância mínima de 90 m; e

  (D) as barras de parada sejam interligadas às luzes do eixo da pista de táxi, de modo que,

  quando as luzes do eixo além da barra de parada estiverem acesas, a barra de parada esteja
  apagada,

  e vice-versa.

  NOTA - Atenção deve ser dada ao projeto do sistema elétrico para garantir que todas as luzes
  de uma

  barra de parada não falhem ao mesmo tempo.

  (aa) Luzes de posições intermediárias de espera (sinalização luminosa)

  NOTA - Ver o parágrafo 154.303(k) sobre as especificações da sinalização horizontal de posições

  intermediárias de espera.

  (1) Aplicação'
