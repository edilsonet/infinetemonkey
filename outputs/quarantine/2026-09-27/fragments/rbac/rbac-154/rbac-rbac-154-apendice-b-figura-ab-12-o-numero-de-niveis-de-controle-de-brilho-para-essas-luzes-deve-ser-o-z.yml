text: '(z) Barras de parada (sinalização luminosa)

  (1) Aplicação

  NOTA 1 - Uma barra de parada destina-se a ser controlada, manual ou automaticamente, pelos

  serviços de tráfego aéreo.

  NOTA 2 - Incursões em pista podem acontecer em qualquer condição meteorológica ou de

  visibilidade. A instalação de barras de parada em posição de espera de pista de pouso e
  decolagem

  pode fazer parte de medidas eficazes de prevenção de incursão em pista.'
