  Tabela AD-1. Larguras de números e letras e espaçamento entre números ou letras


  INSTRUÇÕES

  1. Para determinar o ESPAÇO adequado entre letras ou números, obtenha o código

  a partir da tabela a ou b e relacione-o na tabela c à altura da letra ou número

  desejado.

  2. O espaço entre palavras ou grupos de caracteres que formam uma abreviação

  ou símbolo deveria ser de 0,5 a 0,75 da altura dos caracteres usados, ressalvando-

  se que, quando houver uma flecha com um único caractere, como “A→”, o espaço

  pode ser reduzido para não menos que um quarto do caractere da altura para

  proporcionar um bom equilíbrio visual.

  3. Caso o numeral venha após uma letra ou vice-versa, utilize o código 1.

  4. Caso um hífen, ponto ou barra venha após um caractere ou vice-versa, utilize o

  código 1.

  5. Para a sinalização vertical com indicativo de comprimento de pista de

  decolagem, a altura da letra “m” minúscula é 75% do tamanho da altura do número

  “0” precedente e deve ser espaçada em relação a este número de acordo com

  código 1.


  Data da emissão: 16 de junho de 2021.


