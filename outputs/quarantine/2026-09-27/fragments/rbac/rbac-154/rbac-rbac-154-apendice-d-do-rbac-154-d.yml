text: '(d) Caso um ponto de coordenadas fique no limite entre um caractere e o fundo, o ponto
  de

  coordenadas deve ser levemente deslocado de forma a ficar completamente fora do caractere.

  NOTA 2 - Outros pontos de coordenadas podem ser necessários para garantir que cada caractere

  inclua, no mínimo, cinco pontos de coordenadas igualmente espaçados.

  NOTA 3 - Caso uma unidade inclua dois tipos de sinalizações verticais, uma coordenada separada

  deve ser estabelecida para cada tipo.


  Data da emissão: 16 de junho de 2021.


