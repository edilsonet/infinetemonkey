text: '(a) Nos casos em que as operações sejam conduzidas em condições de alcance visual de
  pista

  inferior a um valor de 800 m, a luminância média da sinalização vertical deve ser de, no
  mínimo:


  Vermelha

  30 cd/m2


  Amarela

  150 cd/m2


  Branca

  300 cd/m2'
