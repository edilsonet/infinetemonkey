cite: apendice-d-quando-destinadas-ao-uso
title: 'Apêndice D, quando destinadas ao uso:'
text: 'Apêndice D, quando destinadas ao uso:

  (A) em condições de alcance visual de pista com valores inferiores a 800 m;

  (B) durante a noite, em associação a pistas de operação por instrumento; ou


  Data da emissão: 16 de junho de 2021.


  (C) durante a noite, em associação com pistas de não instrumento onde o número de

  código for 3 ou 4.


  Figura D-25. Sinalizações verticais de informação

  (vi) As sinalizações verticais devem ser retrorrefletivas e/ ou iluminadas de acordo com
  as

  disposições do Apêndice D, quando destinadas ao uso noturno, associadas a uma pista de não

  instrumento onde o número de código for 1 ou 2.

  (vii) Sinalizações verticais de mensagens variáveis devem exibir uma face branca quando

  não estiverem em uso.


  Data da emissão: 16 de junho de 2021.


  (viii) No caso de falha, uma sinalização vertical de mensagem variável não deve informar

  nenhuma mensagem que possa levar o piloto da aeronave ou motorista de um veículo a agir
  de forma

  perigosa.

  (ix) O intervalo de mudança de uma mensagem para outra em uma sinalização vertical de

  mensagem variável deve ser o mais curto possível e não deve exceder 5 segundos.'
