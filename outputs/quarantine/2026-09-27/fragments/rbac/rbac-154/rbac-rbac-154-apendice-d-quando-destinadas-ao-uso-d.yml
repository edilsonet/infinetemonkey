title: apendice-d-quando-destinadas-ao-uso(d)
text: '(d) Sinalização vertical de ponto de teste de VOR do aeródromo

  (1) Aplicação

  Quando um ponto de teste de VOR do aeródromo for estabelecido, ele deve ser indicado pelas

  sinalizações horizontais e verticais de pontos de teste de VOR do aeródromo.

  NOTA - Ver o parágrafo 154.303(l) sobre sinalização horizontal do ponto de teste de VOR
  do

  aeródromo.

  (2) Localização

  Uma sinalização vertical de ponto de teste de VOR de aeródromo deve estar situada o mais

  próxima possível do ponto de teste e deve ser tal que as inscrições sejam visíveis da cabine
  de

  comando de uma aeronave devidamente posicionada sobre a sinalização horizontal do ponto
  de teste

  de VOR de aeródromo.

  (3) Características'
