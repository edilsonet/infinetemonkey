title: apendice-d-quando-destinadas-ao-uso(e)
text: '(e) Sinalização de identificação de aeródromo

  (1) Aplicação

  Uma sinalização de identificação de aeródromo deve ser disposta em um aeródromo onde

  houver insuficientes meios alternativos de identificação visual.

  (2) Localização

  A sinalização de identificação do aeródromo deve ser posicionada no aeródromo de forma a
  ser

  legível, tão distante quanto possível, por todos os ângulos sobre a horizontal.

  (3) Características'
