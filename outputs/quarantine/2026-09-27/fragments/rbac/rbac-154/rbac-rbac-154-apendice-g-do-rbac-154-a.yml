title: apendice-g-do-rbac-154(a)
text: '(a) Tipos e características

  (1) As especificações encontradas nesta seção apresentam as características básicas para

  sistemas de luzes de aproximação simples e de precisão. Para certos aspectos desses sistemas,

  permite-se o uso de latitude, por exemplo, no espaçamento entre as luzes de eixo e as barras
  cruzadas.

  Os sistemas de luzes de aproximação que têm sido geralmente adotados são mostrados nas Figuras

  AG-5 e AG-6. Um diagrama dos 300 m internos do sistema de luzes de aproximação de precisão

  Categorias II e III é mostrado na Figura D-10.

  (2) A configuração das luzes de aproximação deve ser fornecida independente da localização

  da cabeceira, ou seja, tanto se a cabeceira estiver na extremidade da pista quanto deslocada
  da sua

  extremidade. Em ambos os casos, o sistema de luzes de aproximação deve se estender até a
  cabeceira.

  No entanto, no caso de uma cabeceira recuada, luzes embutidas são utilizadas desde a extremidade
  da

  pista até a cabeceira, para obter a configuração especificada. Essas luzes embutidas são
  projetadas para


  Data da emissão: 16 de junho de 2021.


  atender às exigências fotométricas especificadas no Apêndice B, Figura AB-1 ou AB-2. (Redação
  dada

  pela Resolução nº 513, de 16.04.2019)

  (3) Os diagramas de trajetórias de voo a serem utilizados para o projeto das luzes são mostrados

  na Figura AG-4.


  Data da emissão: 16 de junho de 2021.


