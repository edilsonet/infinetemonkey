title: apendice-g-do-rbac-154(d)
text: '(d) Consideração dos efeitos de comprimentos reduzidos

  (1) A necessidade de um sistema adequado de luzes de aproximação, para auxiliar as

  aproximações de precisão em que o piloto necessite obter referências visuais antes do pouso,
  não

  precisa ser motivo de intensa preocupação. A segurança e a regularidade dessas operações
  dependem

  da obtenção dessas referências. A altura acima da cabeceira da pista, na qual o piloto determina
  se há

  referências visuais suficientes para continuar a aproximação de precisão e o pouso, irá
  variar de

  acordo com o tipo de aproximação que está sendo realizada e de outros fatores como as condições

  meteorológicas, os equipamentos de solo e de voo, etc. O comprimento necessário para que
  o sistema

  de luzes de aproximação acomode todas as variações dessas aproximações é de 900 m e deverá
  ser

  provido.

  (2) No entanto, há alguns locais da pista onde é impossível prover o comprimento de 900
  m do

  sistema de luzes de aproximação para auxiliar as aproximações de precisão.

  (3) Nesses casos, deve-se envidar esforços para prover esse sistema de luzes. Há muitos
  fatores

  que determinam a que altura o piloto deve ter decidido continuar a aproximação para pouso
  ou iniciar

  uma aproximação perdida. Deve ficar claro que o piloto não tem meios de avaliar instantaneamente

  se uma altura especificada foi atingida. A real decisão de continuar a sequência de aproximação
  e

  pouso é um processo cumulativo que é concluído somente na altura especifica. A menos que
  as luzes

  estejam disponíveis antes de se atingir o ponto de decisão, o processo de avaliação visual
  é prejudicado,

  e a probabilidade de aproximações perdidas aumentará substancialmente. Há diversos aspectos

  operacionais que devem ser considerados pelas autoridades competentes ao se decidir se alguma

  restrição será necessária para qualquer aproximação de precisão.


  Data da emissão: 16 de junho de 2021.


