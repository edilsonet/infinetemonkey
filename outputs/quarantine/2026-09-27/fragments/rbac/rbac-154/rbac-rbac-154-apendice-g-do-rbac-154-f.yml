title: apendice-g-do-rbac-154(f)
text: '(f) Caso os aspectos econômicos impeçam a provisão de uma zona de parada (stopway)
  e, como

  resultado, somente uma pista de pouso e decolagem e uma de zona desimpedida (clearway) sejam

  fornecidas, o comprimento da pista de pouso e decolagem (desprezando as exigências para
  pouso)

  deve ser igual à distância de aceleração-parada necessária ou à distância de rolagem de
  decolagem

  necessária, dependendo de qual for a maior. A distância de decolagem disponível será o comprimento

  da pista de pouso e decolagem mais o comprimento da zona desimpedida.


  Data da emissão: 16 de junho de 2021.'
