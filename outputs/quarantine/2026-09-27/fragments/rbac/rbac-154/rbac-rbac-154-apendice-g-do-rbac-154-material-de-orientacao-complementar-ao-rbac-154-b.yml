text: '(b) Cabeceira recuada (Redação dada pela Resolução nº 628, de 11.06.2021)

  (1) Se um objeto ultrapassar a superfície de aproximação e se esse objeto não puder ser
  retirado,

  deve-se considerar o deslocamento permanente da cabeceira.

  (2) Para atender aos objetivos de limitação de obstáculos, a cabeceira deve ser devidamente

  deslocada na pista até a distância necessária para que a superfície de aproximação esteja
  livre.

  (3) No entanto, o deslocamento da cabeceira da extremidade da pista irá inevitavelmente

  reduzir a LDA e isto pode ter maior significância operacional do que a invasão da superfície
  de

  aproximação por obstáculos sinalizados ou iluminados. Portanto, a decisão de se deslocar
  a cabeceira,

  bem como sua extensão, deve considerar o equilíbrio ideal entre as considerações de superfícies
  de

  aproximação livres e a distância para pouso adequada. Ao decidir essa questão, é preciso
  levar em

  consideração os tipos de aeronaves que a pista deve receber, a visibilidade limitante e
  as condições

  das bases das nuvens sob as quais a pista será utilizada, a posição dos obstáculos em relação
  à


  Data da emissão: 16 de junho de 2021.


  cabeceira e ao prolongamento da linha de eixo, bem como, no caso de uma pista de aproximação
  de

  precisão, a relevância dos obstáculos para a determinação do limite livre de obstáculos.

  (4) Apesar da consideração da LDA, a posição escolhida para a cabeceira não deve ser tal
  que

  a superfície livre de obstáculos até a cabeceira apresente uma inclinação maior que 3,3
  por cento

  quando o número de código for 4 ou uma inclinação maior que 5 por cento quando o número
  de

  código for 3.

  (5) Caso uma cabeceira esteja localizada de acordo com os critérios de superfícies livres
  de

  obstáculos mencionadas no parágrafo anterior, as exigências de sinalização dos obstáculos
  da

  Subparte F devem ainda ser atendidas em relação à cabeceira recuada.

  (6) Dependendo da extensão do deslocamento, o RVR na cabeceira pode diferir daquele no

  começo da pista para decolagens. O uso de luzes vermelhas de borda de pista de pouso com

  intensidades fotométricas menores do que o valor nominal de 10.000 cd para luzes brancas
  aumenta

  esse fenômeno. O impacto de uma cabeceira deslocada nas condições mínimas de visibilidade
  para

  decolagem deve ser avaliada pelo operador de aeródromo.

  (7) Especificações neste RBAC, relacionadas à sinalização horizontal e luzes de cabeceiras

  deslocadas, além de algumas exigências operacionais são encontradas nos parágrafos

  154.303(d)(5)(i),

  154.305(o)(1),

  154.305(q)(1),

  154.305(q)(2)(ii),

  154.305(q)(3)(ii)

  e

  154.305(s)(2)(ii). (Redação dada pela Resolução nº 513, de 16.04.2019)


  G.8-I Geometria de pistas de táxi de saída rápida'
