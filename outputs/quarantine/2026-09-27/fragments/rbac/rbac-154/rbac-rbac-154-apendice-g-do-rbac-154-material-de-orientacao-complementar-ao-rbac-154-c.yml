cite: apendice-g-do-rbac-154-material-de-orientacao-complementar-ao-rbac-154(c)
title: apendice-g-do-rbac-154-material-de-orientacao-complementar-ao-rbac-154(c)
text: '(c) Afastamento de obstáculos

  (1) Uma área, aqui referida como o plano de luzes, foi definida com o objetivo de manter
  um

  afastamento de obstáculos. Todas as luzes do sistema estão nesse plano, que tem formato
  retangular

  e é simetricamente localizado em torno da linha de eixo do sistema de luzes de aproximação.
  Essa

  área tem início na cabeceira e se estende 60 m além do final do sistema de aproximação,
  tendo 120

  m de largura.

  (2) Dentro dos limites do plano de luzes, não é permitida a presença de nenhum objeto que
  seja

  maior que o plano de luzes, exceto conforme especificado neste Regulamento. Todas as vias
  internas

  de serviço e estradas são consideradas obstáculos que se estendem 4,8 m acima da parte mais
  alta da

  via, com exceção daquelas destinadas aos serviços do aeródromo em que todo o tráfego de
  veículos

  esteja sob o controle das autoridades do aeródromo e coordenado com a torre de controle
  de tráfego

  do aeródromo. As ferrovias, independente do volume de tráfego, são consideradas obstáculos
  que se

  estendem 5,4 m acima do topo dos trilhos.

  (3) Sabe-se que alguns componentes dos sistemas eletrônicos de auxílio ao pouso, tais como

  refletores, antenas, monitores, etc., devem ser instalados acima do plano de luzes. Deve-se
  posicionar

  esses componentes fora dos limites do plano de luzes.

  (4) Quando um localizador de ILS estiver instalado dentro dos limites do plano de luzes,
  sabe-

  se que o localizador, ou a sua proteção, se utilizada, deve se estender acima do plano de
  luzes. Nesses

  casos, a altura dessas estruturas deve ser a menor possível e estas devem ficar localizadas
  o mais

  distantes possível da cabeceira. A norma referente às alturas permissíveis é de 15 cm para
  cada 30 m

  de distância entre a estrutura e a cabeceira. Por exemplo, se o localizador estiver posicionado
  a 300

  m da cabeceira, a proteção poderá se estender acima do plano do sistema de luzes de aproximação

  em 10 x 15 = 150 cm no máximo, porém, deve ser preferencialmente mantido o mais baixo possível

  para permitir a operação adequada do ILS.

  (5) Ao localizar uma antena de azimute MLS, as instruções contidas no Anexo 10 à CACI,

  Volume I, Adendo G da Parte I, devem ser seguidas. Esse material, que também fornece instruções

  sobre a disposição de uma antena de azimute MLS com uma antena de localizador de ILS, estabelece

  que a antena de azimute MLS esteja localizada dentro dos limites do plano de luzes, no caso
  em que

  não é possível localizá-la além do lado externo das luzes de aproximação para a direção
  oposta da

  aproximação. Se estiver localizada no prolongamento do eixo da pista, a antena de azimute
  MLS deve

  estar o mais distante possível da posição de luzes mais próximas da antena na direção do
  final da


  Data da emissão: 16 de junho de 2021.


  pista. Ainda, o centro da fase da antena de azimute MLS deve estar, pelo menos, 0,3 m acima
  do

  centro de luzes da posição de luzes mais próxima da antena na direção do final da pista
  (esse valor

  pode ser modificado para 0,15 m se o local estiver, por outro lado, isento de problemas
  significativos

  de múltiplos caminhos). Ao atender essa exigência, que tem por objetivo garantir que a qualidade
  do

  sinal MLS não seja afetada pelo sistema de luzes de aproximação, poderia ocorrer obstrução
  parcial

  do sistema de luzes pela antena de azimute MLS. Para garantir que a obstrução resultante
  não

  prejudique a orientação visual além do nível aceitável, a antena de azimute MLS não deve
  estar

  localizada a mais de 300 m do final da pista, sendo que a localização preferida é 25 m além
  da barra

  cruzada de 300 m (com isso, a antena ficaria posicionada 5 m atrás da posição de luzes,
  a 330 m do

  final da pista). No caso em que uma antena de azimute MLS estiver assim localizada, somente
  uma

  parte central da barra cruzada de 300 m do sistema de luzes de aproximação seria parcialmente

  obstruída. No entanto, é importante garantir que as luzes não obstruídas da barra cruzada
  permaneçam

  sempre funcionando.

  (6) Objetos presentes dentro dos limites do plano de luzes, exigindo que o mesmo seja elevado

  a fim de atender aos critérios aqui descritos, devem ser removidos, rebaixados ou reposicionados,

  sendo essa uma forma mais economicamente viável do que a elevação do plano de luzes.

  (7) Em alguns casos, os objetos existentes não podem ser removidos, rebaixados ou

  reposicionados, principalmente quando os mesmos estiverem localizados próximos da cabeceira,
  de

  modo que não possam ser superados pela inclinação de dois por cento. Quando essas circunstâncias

  forem reais e não houver alternativa, a inclinação de dois por cento pode ser excedida ou
  um “degrau”

  pode ser provido a fim de manter as luzes de aproximação acima dos objetos. Esse “degrau”,
  ou

  gradientes maiores, deve ser provido somente quando for impossível atender aos critérios
  de

  inclinação padrão e deve ser mantido no mínimo absoluto. Segundo esse critério, nenhuma
  inclinação

  negativa é permitida na parte mais externa do sistema de luzes.'
