text: '(h) Além do que foi considerado anteriormente, o conceito de zonas desimpedidas (clearways)
  em

  certas circunstâncias deve ser aplicado a uma situação em que a distância de decolagem necessária

  com todos os motores em operação exceda a distância para o caso de falha de motor.'
