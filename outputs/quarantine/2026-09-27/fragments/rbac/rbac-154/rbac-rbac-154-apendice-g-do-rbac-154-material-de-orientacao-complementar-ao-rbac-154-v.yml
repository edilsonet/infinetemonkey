title: apendice-g-do-rbac-154-material-de-orientacao-complementar-ao-rbac-154(v)
text: '(v) Linha de eixo. Os gradientes da linha de eixo em qualquer seção (incluindo uma
  zona de

  parada ou uma zona desimpedida) devem ser os menores possíveis, e as alterações dos gradientes

  devem ser as menores e em menor número possível e não exceder 1 em 60. Conforme se sai da
  pista,

  deve-se ter gradientes positivos em qualquer seção de até 1 em 66 e gradientes negativos
  de até 1 em

  40.

  (vi) Barras cruzadas. As luzes das barras cruzadas devem ser dispostas de modo a ficarem

  em uma linha reta passando pelas luzes de linha de eixo associada e, onde quer que seja
  viável, essa

  linha deve ser horizontal. No entanto, é permitido instalar as luzes com um gradiente transversal

  menor ou igual a 1 em 80, caso isso possibilite que as luzes da barra cruzada dentro de
  uma zona de

  parada (stopway) ou zona desimpedida (clearway) sejam instaladas mais próximas da superfície
  do

  solo nos locais onde haja um cruzamento.'
