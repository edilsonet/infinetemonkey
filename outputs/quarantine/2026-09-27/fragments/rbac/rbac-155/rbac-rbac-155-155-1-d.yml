title: 155.1(d)
text: '(d)

  O operador de heliponto e demais pessoas, naturais ou jurídicas, que atuem em heliponto
  civil público localizado em área de fronteira internacional devem seguir, além do disposto
  neste Regulamento, as restrições e definições impostas em acordo(s) firmado(s) com o(s)
  país(es) limítrofe(s).'
