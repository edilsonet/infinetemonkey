title: apendice-a-do-rbac-no-161-sancoes-aplicaveis(b)
text: '(b) Cartas de navegação por instrumentos: sistema constituído por uma série de tipos
  de cartas que devem ser reeditadas periodicamente, segundo um rigoroso calendário, estabelecido
  por compromissos internacionais assumidos pelo Comando da Aeronáutica - COMAER, perante
  a Organização da Aviação Civil Internacional - OACI. Estas cartas contêm informações topográficas,
  que praticamente não sofrem modificações, e informações aeronáuticas, que estão sujeitas
  a um processo de atualização extremamente dinâmico.'
