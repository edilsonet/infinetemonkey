title: apendice-a-do-rbac-no-161-sancoes-aplicaveis(c)
text: '(c) Cartas de navegação visual: cartas destinadas a apoiar os voos, para cuja navegação
  são utilizadas referências visuais do solo. Em muito assemelham-se às Cartas Topográficas
  do Mapeamento Sistemático, produzidas pela Diretoria do Serviço Geográfico do Exército Brasileiro
  e pelo Instituto Brasileiro de Geografia e Estatística - IBGE, porém contam com características
  próprias para atender à finalidade aeronáutica.'
