cite: apendice-a-do-rbac-no-161-sancoes-aplicaveis(r)
title: apendice-a-do-rbac-no-161-sancoes-aplicaveis(r)
text: '(r)

  Ruído aeronáutico: ruído oriundo das operações de circulação, aproximação, pouso, decolagem,
  subida, rolamento e teste de motores de aeronaves, não considerando o ruído produzido por
  equipamentos utilizados nas operações de serviços auxiliares ao transporte aéreo, para fins
  do Plano de Zoneamento de Ruído.'
