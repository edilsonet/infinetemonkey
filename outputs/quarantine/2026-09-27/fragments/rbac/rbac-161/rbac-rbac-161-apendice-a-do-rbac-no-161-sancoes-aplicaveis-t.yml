title: apendice-a-do-rbac-no-161-sancoes-aplicaveis(t)
text: '(t) Uso do solo: resultado de toda atividade urbana ou rural, que implique em controle,
  apropriação ou desenvolvimento de atividades antrópicas em um espaço ou terreno.

  (Redação dada pela Resolução nº 609, de 23.02.2021)

  161. 3

  Siglas, abreviaturas e símbolos

  CGRA - Comissão de Gerenciamento de Ruído Aeronáutico.

  COMAER - Comando da Aeronáutica.

  (Incluído pela Resolução nº 609, de 23.02.2021)

  DNL - Day-Night Average Sound Level

  (nível de ruído médio dia-noite).

  FATO

  -

  Final Approach and Take-off area

  (área de aproximação final e de decolagem).

  (Incluído pela Resolução nº 609, de 23.02.2021)

  IBGE

  -

  Instituto Brasileiro de Geografia e Estatística.

  (Incluído pela Resolução nº 609, de 23.02.2021)

  PBZR - Plano Básico de Zoneamento de Ruído.

  PEZR - Plano Específico de Zoneamento de Ruído.

  PZR - Plano de Zoneamento de Ruído.

  PDIR - Plano Diretor.

  RR - Redução de Nível de Ruído.

  SIRGAS 2000 - Sistema de Referência Geocêntrico para as Américas 2000.

  WGS 84 - World Geodetic System

  1984

  .

  SUBPARTE B

  PLANO DE ZONEAMENTO DE RUÍDO - PZR

  161. 11

  Aplicabilidade'
