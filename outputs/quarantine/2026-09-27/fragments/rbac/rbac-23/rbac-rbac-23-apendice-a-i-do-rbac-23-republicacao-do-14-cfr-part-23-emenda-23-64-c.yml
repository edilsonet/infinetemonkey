title: apendice-a-i-do-rbac-23-republicacao-do-14-cfr-part-23-emenda-23-64(c)
text: '(c) Republicação


  Sempre que houver emenda no regulamento Title 14 Code of Federal Regulations Part 23, a

  ANAC republicará o texto do regulamento adotado na forma do Apêndice A-I, por meio de

  emendas a este RBAC.'
