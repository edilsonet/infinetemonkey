text: '(d) [Reservado]


  APÊNDICE A-I - DIFERENÇAS DO RBAC 25 EM RELAÇÃO AO 14CFR PART 25, EMENDA 25-150


  Geral

  Este apêndice apresenta diferenças deste RBAC 25 em relação ao 14CFR Part 25 da FAA. O conteúdo
  apresentado neste Apêndice A-I tem precedência em relação ao texto equivalente do regulamento
  da FAA adotado por este RBAC. Para fins de clareza editorial, o requisito cuja diferença
  é aplicável é republicado na sua totalidade e em língua inglesa neste Apêndice, com as necessárias
  adaptações de texto oriunda(s) da(s) diferença(s) sumarizadas na tabela abaixo.

  Requisito

  Diferença

  § 25.21 Proof of compliance Adição do requisito 25.21(g)(5)-I

  § 25.1155 Reverse thrust and propeller pitch settings below the flight regime Adotado integralmente
  o texto do CS-25.1155 emenda 18 (Incluído pela Resolução nº 777, de 21.08.2025)

  § 25.1193 Cowling and nacelle skin Adotado integralmente o texto do CS-25.1193(e) emenda
  18 (Incluído pela Resolução nº 777, de 21.08.2025)

  § 25.21 Proof of compliance'
