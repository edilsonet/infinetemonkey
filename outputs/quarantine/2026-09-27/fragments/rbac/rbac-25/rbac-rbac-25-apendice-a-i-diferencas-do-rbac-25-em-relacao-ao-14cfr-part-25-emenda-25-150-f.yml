title: apendice-a-i-diferencas-do-rbac-25-em-relacao-ao-14cfr-part-25-emenda-25-150(f)
text: (f) In meeting the requirements of §§ 25.105(d), 25.125, 25.233, and 25.237, the wind
  velocity must be measured at a height of 10 meters above the surface, or corrected for the
  difference between the height at which the wind velocity is measured and the 10-meter height.
