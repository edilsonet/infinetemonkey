cite: apendice-a-i-diferencas-do-rbac-25-em-relacao-ao-14cfr-part-25-emenda-25-150(i)
title: apendice-a-i-diferencas-do-rbac-25-em-relacao-ao-14cfr-part-25-emenda-25-150(i)
text: '(i) Maximum takeoff gross weight is less than 60,000 lbs; or

  (ii) The airplane is equipped with reversible flight controls.

  (2) Each requirement of this subpart, except §§ 25.121(a), 25.123(c), 25.143(b)(1) and (2),
  25.149, 25.201(c)(2), 25.239, and 25.251(b) through (e), must be met in the icing conditions
  specified in Appendix C of this part. Section 25.207(c) and (d) must be met in the landing
  configuration in the icing conditions specified in Appendix C, but need not be met for other
  configurations. Compliance must be shown using the ice accretions defined in part II of
  Appendix C of this part, assuming normal operation of the airplane and its ice protection
  system in accordance with the operating limitations and operating procedures established
  by the applicant and provided in the airplane flight manual.

  (3) If the applicant does not seek certification for flight in all icing conditions defined
  in Appendix O of this part, each requirement of this subpart, except §§ 25.105, 25.107,
  25.109, 25.111, 25.113, 25.115, 25.121, 25.123, 25.143(b)(1), (b)(2), and (c)(1), 25.149,
  25.201(c)(2), 25.207(c), (d), and (e)(1), 25.239, and 25.251(b) through (e), must be met
  in the Appendix O icing conditions for which certification is not sought in order to allow
  a safe exit from those conditions. Compliance must be shown using the ice accretions defined
  in part II, paragraphs (b) and (d) of Appendix O, assuming normal operation of the airplane
  and its ice protection system in accordance with the operating limitations and operating
  procedures established by the applicant and provided in the airplane flight manual.

  (4) If the applicant seeks certification for flight in any portion of the icing conditions
  of Appendix O of this part, each requirement of this subpart, except §§ 25.121(a), 25.123(c),
  25.143(b)(1) and (2), 25.149, 25.201(c)(2), 25.239, and 25.251(b) through (e), must be met
  in the Appendix O icing conditions for which certification is sought. Section 25.207(c)
  and (d) must be met in the landing configuration in the Appendix O icing conditions for
  which certification is sought, but need not be met for other configurations. Compliance
  must be shown using the ice accretions defined in part II, paragraphs (c) and (d) of Appendix
  O, assuming normal operation of the airplane and its ice protection system in accordance
  with the operating limitations and operating procedures established by the applicant and
  provided in the airplane flight manual.

  (5)-I No changes in the load distribution limits of section §25.23, the weight limits of
  section §25.25 (except where limited by performance requirements of this subpart), and the
  center of gravity limits of section §25.27, from those for non-icing conditions, are allowed
  for flight in icing conditions or with ice accretion.

  [Doc. No. 5066, 29 FR 18291, Dec. 24, 1964, as amended by Amdt. 25-23, 35 FR 5671, Apr.
  8, 1970; Amdt. 25-42, 43 FR 2320, Jan. 16, 1978; Amdt. 25-72, 55 FR 29774, July 20, 1990;
  Amdt. 25-121, 72 FR 44665, Aug. 8, 2007 Amdt. 25-135, 76 FR 74654, Dec. 1, 2011; Amdt. 25-140,
  79 FR 65524, Nov. 4, 2014].'
