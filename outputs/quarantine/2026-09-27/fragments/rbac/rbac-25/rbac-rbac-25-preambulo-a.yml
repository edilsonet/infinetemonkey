text: '(a) Geral

  Para concessão de certificados de tipo para aviões categoria transporte, será adotado integralmente,
  na língua inglesa, o regulamento Title 14 Code of Federal Regulations Part 25 original,
  alterado pelas Emendas 25-1 a 25-150, estando esta última em vigor desde 25 de agosto de
  2023, da autoridade de aviação civil, Federal Aviation Administration - FAA, do Department
  of Transportation dos Estados Unidos da América. Uma cópia deste regulamento &eeacute; apresentada
  no mesmo sítio eletrônico que contém este RBAC. (Redação dada pela Resolução nº 777, de
  21.08.2025)'
