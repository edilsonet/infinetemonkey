text: '(d) [Reservado]


  APÊNDICE A-I - DIFERENÇAS DO RBAC 33 EM RELAÇÃO AO 14CFR PART 33, EMENDA 33-36 (Redação
  dada pela Resolução nº 768, de 14.03.2025)


  Geral

  Este apêndice apresenta diferenças deste RBAC 33 em relação ao 14CFR Part 33 da FAA. O conteúdo
  apresentado neste Apêndice A-I tem precedência em relação ao texto equivalente do regulamento
  da FAA adotado por este RBAC. Para fins de clareza editorial, o requisito cuja diferença
  é aplicável é republicado na sua totalidade e em língua inglesa neste Apêndice, com as necessárias
  adaptações de texto oriunda(s) da(s) diferença(s) sumarizadas na tabela abaixo.

  Requisito

  Diferença

  Não há. Não há.'
