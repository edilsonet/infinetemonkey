title: 43.10(d)
text: '(d) Transferência de peças com limite de vida. Cada pessoa que remover uma peça com
  limite de

  vida de um produto com certificado de tipo e posteriormente a vender, ou de outro modo a
  transferir

  para outrem, deve transferir conjuntamente a marca, etiqueta ou outro registro usado para
  atender a

  esta seção, a menos que a peça seja mutilada antes de ser vendida ou transferida.


  Data da emissão: 15 de março de 2021'
