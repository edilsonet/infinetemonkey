cite: 60.13(f)
title: 60.13(f)
text: '(f) Quando o operador de um FSTD

  souber, ou for avisado pelo fabricante da

  aeronave, ou por outro provedor de dados,

  que existe uma adição, emenda, ou uma

  revisão dos dados de validação, que possam

  impactar as características de desempenho ou

  qualidade de voo do FSTD, o operador deverá

  notificar a ANAC.'
