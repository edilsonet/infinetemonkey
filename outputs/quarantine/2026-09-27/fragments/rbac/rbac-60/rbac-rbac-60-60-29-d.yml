title: 60.29(d)
text: '(d) In determining the criteria for the

  evaluation referred to in paragraph 60.27(b)(1)

  of this regulation for the revocation of the

  suspension, ANAC considers factors such as

  the reason to suspend the qualification, any

  repairs or replacements that may have been

  completed,

  the

  number

  of

  continuing

  qualification evaluations missed, the number

  of sponsor-conducted quarterly inspections

  missed, and the care that had been taken of the

  device since the loss of qualification, among

  others.'
