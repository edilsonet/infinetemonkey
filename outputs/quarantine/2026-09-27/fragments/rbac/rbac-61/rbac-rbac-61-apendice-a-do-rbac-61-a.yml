title: apendice-a-do-rbac-61(a)
text: '(a) No exame de proficiência linguística na língua inglesa, o piloto será avaliado
  com relação à

  pronúncia, estrutura, vocabulário, fluência, compreensão e interação, de forma aceitável
  pela ANAC,

  sendo atribuído os níveis 1 a 6 para cada item, de acordo com os critérios expostos nas
  tabelas do

  parágrafo (d) deste Apêndice, e o nível de proficiência linguística final que será considerado
  para a

  averbação em sua licença, de acordo com o parágrafo 61.10(b) deste Regulamento, será o menor
  nível

  obtido no exame.'
